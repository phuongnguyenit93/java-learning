# Module YAML composition contract.
# This skeleton is generated only when the file is missing or blank.
# After initialization this file is human-owned and will not be overwritten.
#
# combineYaml reads this file. Spring Boot does not use it as runtime config.

---
# Common module configuration exported for composition
# Add common exported configuration below this line.


---
# Module configuration for profile DEV
spring:
  config:
    activate:
      on-profile: dev
swagger:
  enabled: ${BUILD_SWAGGER:}
  languages: ${MODULE_LANGUAGE:vi,en}

springdoc:
  swagger-ui:
    enabled: ${BUILD_SWAGGER}
    path: /swagger-ui.html
    # Cho phép Swagger UI giữ nguyên các thẻ HTML nguy hiểm như iframe/script
    #    url: /swagger/api-json.yaml
    #    supportedSubmitMethod:
    docExpansion:
      - none
  #    tagsSorter: alpha
  api-docs:
    enabled: ${BUILD_SWAGGER}
#    path: /api-json

# Add profile-specific configuration below this line.



---
# Module configuration for profile LOC
spring:
  config:
    activate:
      on-profile: loc

# Add profile-specific configuration below this line.



---
# Module configuration for profile PRD
spring:
  config:
    activate:
      on-profile: prd

swagger:
  enabled: false

# Add profile-specific configuration below this line.
