<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Swagger UI</title>

    <link
            rel="stylesheet"
            href="swagger-ui/swagger-ui.css"
    />

    <link
            rel="stylesheet"
            href="swagger-youtube.css"
    />

    <link
            rel="stylesheet"
            href="swagger-execution-context.css"
    />

    <link
            rel="stylesheet"
            href="swagger-api-execution.css"
    />
    <link rel="stylesheet" href="swagger-api-cases.css" />


    <link
            rel="stylesheet"
            href="swagger-ai-chat.css"
    />
</head>

<body>

<div class="swagger-top-actions">
    <a
            id="execution-context-explorer-action"
            class="execution-context-explorer-action"
            target="_blank"
            rel="noopener"
            hidden
    >Execution Context</a>

    <!--
    AI chat prototype is intentionally disabled in the current architecture.
    swagger-ai-chat.js exits without installing the modal/chat UI when this
    trigger button is absent, so keeping the prototype source does not expose
    the feature in Swagger.

    <button
            id="swagger-ai-connect-action"
            class="swagger-ai-connect-action"
            type="button"
    >Connect AI</button>
    -->
</div>

<div id="swagger-ui"></div>

<script>
    // Resolve the app base from the directory containing this page.
    // /custom-swagger.html -> "", /oop/custom-swagger.html -> "/oop".
    const basePath = new URL(".", window.location.href)
        .pathname.replace(/\/$/, "");

    window.swaggerBasePath = basePath;

    document.getElementById("execution-context-explorer-action").href =
        `${basePath}/execution-context/explorer.html`;

    function loadScript(src) {
        const script = document.createElement("script");
        script.src = src;
        document.head.appendChild(script);
    }

    loadScript(`${basePath}/swagger-ui/swagger-ui-bundle.js`);
    loadScript(`${basePath}/swagger-ui/swagger-ui-standalone-preset.js`);
    loadScript(`${basePath}/swagger-youtube.js`);
    loadScript(`${basePath}/swagger-api-execution.js`);
    loadScript(`${basePath}/swagger-api-cases.js`);
    loadScript(`${basePath}/swagger-execution-context.js`);
    loadScript(`${basePath}/swagger-ai-chat.js`);

    window.onload = function () {
        window.ui = SwaggerUIBundle({
            configUrl: `${basePath}/v3/api-docs/swagger-config`,

            dom_id: "#swagger-ui",

            deepLinking: true,


            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],

            plugins: [
                SwaggerUIBundle.plugins.DownloadUrl,
                YoutubePlugin,
                ApiExecutionPlugin,
                ApiCasesPlugin,
                ExecutionContextPlugin
            ],

            onComplete: updateExecutionContextExplorerAction,

            layout: "StandaloneLayout"
        });
    };

</script>
</body>
</html>
