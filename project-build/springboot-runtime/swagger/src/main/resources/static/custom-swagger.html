<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Swagger UI</title>

    <link
            rel="stylesheet"
            href="swagger-ui/swagger-ui.css"
    />

    <link
            rel="stylesheet"
            href="swagger-youtube.css"
    />

    <link
            rel="stylesheet"
            href="swagger-execution-context.css"
    />

    <link
            rel="stylesheet"
            href="swagger-api-execution.css"
    />

    <link
            rel="stylesheet"
            href="swagger-readme-related.css"
    />
</head>

<body>

<a
        id="execution-context-explorer-action"
        class="execution-context-explorer-action"
        target="_blank"
        rel="noopener"
        hidden
>Execution Context</a>

<div id="swagger-ui"></div>

<script>
    const contextPath = window.location.pathname
        .split("/")
        .filter(Boolean)[0];

    const basePath = contextPath
        ? `/${contextPath}`
        : "";

    window.swaggerBasePath = basePath;

    document.getElementById("execution-context-explorer-action").href =
        `${basePath}/execution-context/explorer.html`;

    function loadScript(src) {
        const script = document.createElement("script");
        script.src = src;
        document.head.appendChild(script);
    }

    loadScript(`${basePath}/swagger-ui/swagger-ui-bundle.js`);
    loadScript(`${basePath}/swagger-ui/swagger-ui-standalone-preset.js`);
    loadScript(`${basePath}/swagger-readme-config.js`);
    loadScript(`${basePath}/swagger-youtube.js`);
    loadScript(`${basePath}/swagger-readme-related.js`);
    loadScript(`${basePath}/swagger-api-execution.js`);
    loadScript(`${basePath}/swagger-execution-context.js`);

    window.onload = function () {
        window.ui = SwaggerUIBundle({
            configUrl: `${basePath}/v3/api-docs/swagger-config`,

            dom_id: "#swagger-ui",

            deepLinking: true,

            operationsSorter: compareSwaggerReadmeOperations,

            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
            ],

            plugins: [
                SwaggerUIBundle.plugins.DownloadUrl,
                YoutubePlugin,
                SwaggerReadmeRelatedPlugin,
                ApiExecutionPlugin,
                ExecutionContextPlugin
            ],

            onComplete: updateExecutionContextExplorerAction,

            layout: "StandaloneLayout"
        });
        installReadmeNavigation();
    };

</script>
</body>
</html>
