# Nếu là file mẫu (file-based.yml) vui lòng không thêm cấu hình vào
# Nếu là các file application.yml tại module con , hãy thêm cấu hình phù hợp vào
---
# Cấu hình chung tại đây
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

swagger:
  enabled: ${BUILD_SWAGGER:}
  languages: ${MODULE_LANGUAGE:vi,en}

springdoc:
  swagger-ui:
    enabled: ${swagger.enabled}
    path: /swagger-ui.html
    # Cho phép Swagger UI giữ nguyên các thẻ HTML nguy hiểm như iframe/script
    #    url: /swagger/api-json.yaml
    #    supportedSubmitMethod:
    docExpansion:
      - none
  #    tagsSorter: alpha
  api-docs:
    enabled: ${swagger.enabled}
#    path: /api-json
---
# Cấu hình cho profile DEV
spring:
  config:
    activate:
      on-profile: dev



---
# Cấu hình cho profile LOC
spring:
  config:
    activate:
      on-profile: loc



---
# Cấu hình cho profile PRD
spring:
  config:
    activate:
      on-profile: prd

swagger:
  enabled: false