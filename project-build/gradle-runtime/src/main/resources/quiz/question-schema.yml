version: 3

title:
  vi: Cấu trúc câu hỏi Quiz
  en: Quiz Question Structure

labels:
  vi:
    type: kiểu
    required: bắt buộc
    size: số phần tử
    values: giá trị hợp lệ
    uniqueBy: duy nhất theo
    item: mỗi phần tử
    default: mặc định
  en:
    type: type
    required: required
    size: item count
    values: allowed values
    uniqueBy: unique by
    item: each item
    default: default

document:
  root:
    name: questions
    type: list
    required: true
    default: []
    uniqueBy: id
    description:
      vi: Danh sách câu hỏi Quiz của module trong language hiện tại.
      en: Quiz questions for the current module language.
    item:
      type: object
      fields:
        id:
          type: string
          required: true
          default: ""
          nonBlank: true
          description:
            vi: ID ổn định và duy nhất của câu hỏi.
            en: Stable and unique identity of the question.
        question:
          type: string
          required: true
          default: ""
          nonBlank: true
          description:
            vi: Nội dung câu hỏi hiển thị cho người học.
            en: Question text displayed to the learner.
        aiGenerated:
          type: boolean
          required: true
          default: true
          description:
            vi: Đánh dấu câu hỏi được sinh bởi AI. Mặc định true cho nội dung mới.
            en: Marks whether the question was generated by AI. Defaults to true for new content.
        reviewed:
          type: boolean
          required: true
          default: false
          description:
            vi: Đánh dấu câu hỏi đã được con người kiểm tra và chỉnh sửa. Mặc định false.
            en: Marks whether the question has been human-reviewed and corrected. Defaults to false.
        readmeRelated:
          type: object
          required: true
          default:
            file: ""
            anchor: ""
          description:
            vi: Liên kết tùy chọn tới một section Knowledge trong README. Có thể để trống cả file và anchor.
            en: Optional link to a Knowledge section in README. Both file and anchor may remain blank.
          fields:
            file:
              type: string
              required: true
              default: ""
              description:
                vi: Đường dẫn README tương đối bên dưới readme/{language}/menu, ví dụ 1.Basic/Basic.md.
                en: README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
            anchor:
              type: string
              required: true
              default: ""
              description:
                vi: ID section Knowledge chính xác trong README đã chỉ định.
                en: Exact Knowledge section id in the specified README file.
        apiRelated:
          type: object
          required: true
          default:
            controller: ""
            methodSignature: ""
          description:
            vi: Liên kết tùy chọn tới một API đang hoạt động trong Swagger metadata. Có thể để trống cả controller và methodSignature.
            en: Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
          fields:
            controller:
              type: string
              required: true
              default: ""
              description:
                vi: Tên controller chính xác, ví dụ BasicThreadController.
                en: Exact controller name, for example BasicThreadController.
            methodSignature:
              type: string
              required: true
              default: ""
              description:
                vi: Method signature chính xác trong api-descriptions.yml, ví dụ startVsRun().
                en: Exact method signature in api-descriptions.yml, for example startVsRun().
        answers:
          type: list
          required: true
          default: []
          size: 4
          uniqueBy: id
          description:
            vi: Chính xác bốn đáp án. ID A/B/C/D là identity nội bộ ổn định, không phải vị trí hiển thị sau khi frontend shuffle.
            en: Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
          item:
            type: object
            fields:
              id:
                type: enum
                required: true
                default: ""
                values: [A, B, C, D]
                description:
                  vi: Identity ổn định của đáp án.
                  en: Stable answer identity.
              answer:
                type: string
                required: true
                default: ""
                nonBlank: true
                description:
                  vi: Nội dung đáp án hiển thị cho người học.
                  en: Answer text displayed to the learner.
              explanation:
                type: string
                required: true
                default: ""
                nonBlank: true
                description:
                  vi: Giải thích hiển thị khi người học chọn đáp án này, bất kể đúng hay sai.
                  en: Explanation shown when this answer is selected, whether it is correct or incorrect.
        correctAnswerId:
          type: enum
          required: true
          default: ""
          values: [A, B, C, D]
          description:
            vi: ID nội bộ của đáp án đúng. Frontend kiểm tra bằng identity này sau khi shuffle.
            en: Internal id of the correct answer. The frontend checks this identity after shuffling.
