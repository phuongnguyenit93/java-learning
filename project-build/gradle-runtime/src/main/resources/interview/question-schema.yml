version: 2

title:
  vi: Cấu trúc câu hỏi Interview
  en: Interview Question Structure

labels:
  vi:
    type: kiểu
    required: bắt buộc
    item: mỗi phần tử
    default: mặc định
  en:
    type: type
    required: required
    item: each item
    default: default

document:
  root:
    name: questions
    type: list
    required: true
    default: []
    description:
      vi: Danh sách câu hỏi Interview của module trong language hiện tại.
      en: Interview questions for the current module language.
    item:
      type: object
      fields:
        question:
          type: string
          required: true
          default: ""
          nonBlank: true
          description:
            vi: Nội dung câu hỏi phỏng vấn hiển thị cho người học.
            en: Interview question displayed to the learner.
        answer:
          type: string
          required: true
          default: ""
          nonBlank: true
          description:
            vi: Câu trả lời tham khảo, chỉ hiển thị khi người học chủ động mở.
            en: Reference answer, revealed only when the learner explicitly opens it.
        aiGenerated:
          type: boolean
          required: true
          default: true
          description:
            vi: Đánh dấu nội dung được sinh bởi AI. Mặc định true cho nội dung mới.
            en: Marks whether the content was generated by AI. Defaults to true for new content.
        reviewed:
          type: boolean
          required: true
          default: false
          description:
            vi: Đánh dấu nội dung đã được con người kiểm tra và chỉnh sửa. Mặc định false.
            en: Marks whether the content has been human-reviewed and corrected. Defaults to false.
        readmeRelated:
          type: object
          required: true
          default:
            file: ""
            anchor: ""
          description:
            vi: Liên kết tùy chọn tới một section Knowledge trong README. Có thể để trống cả file và anchor.
            en: Optional link to a Knowledge section in README. Both file and anchor may remain blank.
          fields:
            file:
              type: string
              required: true
              default: ""
              description:
                vi: Đường dẫn README tương đối bên dưới readme/{language}/menu, ví dụ 1.Basic/Basic.md.
                en: README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
            anchor:
              type: string
              required: true
              default: ""
              description:
                vi: ID section Knowledge chính xác trong README đã chỉ định.
                en: Exact Knowledge section id in the specified README file.
        apiRelated:
          type: object
          required: true
          default:
            controller: ""
            methodSignature: ""
          description:
            vi: Liên kết tùy chọn tới một API đang hoạt động trong Swagger metadata. Có thể để trống cả controller và methodSignature.
            en: Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
          fields:
            controller:
              type: string
              required: true
              default: ""
              description:
                vi: Tên controller chính xác, ví dụ BasicThreadController.
                en: Exact controller name, for example BasicThreadController.
            methodSignature:
              type: string
              required: true
              default: ""
              description:
                vi: Method signature chính xác trong api-descriptions.yml, ví dụ startVsRun().
                en: Exact method signature in api-descriptions.yml, for example startVsRun().
