# <learning-contract-skeleton>
# GENERATED FROM learning-contract; do not edit this file.
# source: learning-contract/schemas/roadmap.schema.json
# language: vi
# Empty placeholders in the commented example are authoring hints,
# not valid final published questions/milestones.
#
# Lộ trình học cấp module theo từng ngôn ngữ nội dung, kiểm tra sau khi parse roadmap.yml.
#
# YAML FIELDS
# - roadmap [array, required, uniqueBy=id, default=[]]: Danh sách milestone cấp cao của roadmap cho language hiện tại. ID milestone phải duy nhất.
#   - roadmap.id [string, required, default='']: ID ổn định và duy nhất của milestone trong roadmap language hiện tại.
#   - roadmap.title [string, required, default='']: Tên milestone hiển thị cho learner.
#   - roadmap.purpose [string, required, default='']: Milestone này tồn tại để learner hiểu hoặc đạt được điều gì.
#   - roadmap.dependsOn [array, optional, default=[]]: Danh sách id milestone prerequisite khi dependency không thể hiện đủ chỉ bằng thứ tự item.
#   - roadmap.objectives [array, optional, default=[]]: Các learning objective cấp milestone; không dùng để liệt kê mọi fact/API/syntax nhỏ.
#   - roadmap.relatedKnowledge [array, optional, default=[]]: Danh sách Knowledge category id trong chính module hiện tại hỗ trợ milestone. Portal hiển thị danh sách này ở phía đối diện milestone và click item sẽ điều hướng sang Knowledge category tương ứng.
#   - roadmap.relatedModules [array, optional, default=[]]: Các module liên quan hiển thị ở Level 2 của Portal. Mỗi item dùng routeId bắt buộc và có thể có label/note localized; relation này chỉ để điều hướng, không tạo child milestone hoặc thay đổi learning order.
#     - roadmap.relatedModules.routeId [string, required, default='']: Route ID của module đích.
#     - roadmap.relatedModules.label [string, optional]: Nhãn hiển thị tùy chọn theo language hiện tại.
#     - roadmap.relatedModules.note [string, optional]: Ghi chú điều hướng tùy chọn theo language hiện tại.
#
# ROADMAP THINKING FRAMEWORK
# - ownership: Mỗi language tự chịu trách nhiệm cho roadmap của chính nó. Không suy luận hoặc đồng bộ cấu trúc từ roadmap của language khác.
# - order: Thứ tự item trong roadmap chính là thứ tự học mặc định. Chỉ dùng dependsOn khi cần biểu diễn dependency rõ hơn thứ tự tuyến tính.
# - flexibility: Skeleton không nên ép mọi module có đúng bấy nhiêu node. Nó là framework suy nghĩ chứ không phải template cứng.
# PURPOSE:
#   - Topic/module này là gì?
#   - Vì sao nó tồn tại?
#   - Không có nó thì learner gặp vấn đề gì?
# FOUNDATION:
#   - Learner cần prerequisite hoặc mental model nào trước?
# CORE MODEL:
#   - Những abstraction hoặc building block lớn nào tạo nên chủ đề này?
# MECHANICS:
#   - Nó hoạt động như thế nào ở mức language/runtime/API phù hợp với module?
# USAGE:
#   - Nó được dùng như thế nào trong code thực tế?
# DECISION / TRADE-OFF:
#   - Khi nào nên chọn cơ chế này thay vì cơ chế khác?
#   - Khi nào không nên dùng?
# FAILURE / PITFALL:
#   - Những sai lầm, compile-time failure hoặc runtime failure nào đáng biết?
# INTEGRATION:
#   - Chủ đề này kết nối với những concept/module lân cận nào?
# SYNTHESIS:
#   - Sau cùng learner phải giữ mental model end-to-end nào?
#
# VÍ DỤ MẪU (bỏ dấu # để điền nội dung):
# roadmap:
# - id: ''
#   title: ''
#   purpose: ''
#   dependsOn: []
#   objectives: []
#   relatedKnowledge: []
#   relatedModules: []
# </learning-contract-skeleton>

