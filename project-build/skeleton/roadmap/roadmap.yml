# <learning-contract-skeleton>
# GENERATED FROM learning-contract; do not edit this file.
# source: learning-contract/schemas/roadmap.schema.json
# language: en
# Empty placeholders in the commented example are authoring hints,
# not valid final published questions/milestones.
#
# Module-level learning roadmap for one content language, validated after parsing roadmap.yml.
#
# YAML FIELDS
# - roadmap [array, required, uniqueBy=id, default=[]]: High-level learning milestones for the current language roadmap. Milestone IDs must be unique.
#   - roadmap.id [string, required, default='']: Stable and unique milestone identity within this language roadmap.
#   - roadmap.title [string, required, default='']: Milestone title displayed to the learner.
#   - roadmap.purpose [string, required, default='']: What the learner should understand or achieve from this milestone.
#   - roadmap.dependsOn [array, optional, default=[]]: Prerequisite milestone IDs when item order alone is not enough to express the dependency.
#   - roadmap.objectives [array, optional, default=[]]: Milestone-level learning objectives; do not use this to list every small fact/API/syntax item.
#   - roadmap.relatedKnowledge [array, optional, default=[]]: Knowledge category IDs in the current module that support this milestone. The portal displays these on the opposite side and links each to its Knowledge category.
#   - roadmap.relatedModules [array, optional, default=[]]: Related modules displayed as Portal Level 2 cards. Each item requires routeId and may have a localized label/note; this is navigation only, not a child milestone or learning-order change.
#     - roadmap.relatedModules.routeId [string, required, default='']: Destination module's route ID.
#     - roadmap.relatedModules.label [string, optional]: Optional display label in the current language.
#     - roadmap.relatedModules.note [string, optional]: Optional localized navigation note.
#
# ROADMAP THINKING FRAMEWORK
# - ownership: Each language owns its own roadmap. Do not infer or synchronize its structure from another language.
# - order: Item order is the default learning order. Use dependsOn only when dependency requires more than linear item order.
# - flexibility: The skeleton must not impose a fixed number of milestones; it is a thinking framework, not a rigid template.
# PURPOSE:
#   - What is this topic/module?
#   - Why does it exist?
#   - What problem exists without it?
# FOUNDATION:
#   - What prerequisite or mental model must the learner have first?
# CORE MODEL:
#   - What major abstractions or building blocks make up this topic?
# MECHANICS:
#   - How does it work at the language/runtime/API level appropriate to this module?
# USAGE:
#   - How is it used in real code?
# DECISION / TRADE-OFF:
#   - When should this mechanism be chosen over another?
#   - When should it not be used?
# FAILURE / PITFALL:
#   - What mistakes, compile-time failures or runtime failures matter?
# INTEGRATION:
#   - How does this topic connect with adjacent concepts/modules?
# SYNTHESIS:
#   - What end-to-end mental model should the learner retain?
#
# EXAMPLE (remove # comments to author an item):
# roadmap:
# - id: ''
#   title: ''
#   purpose: ''
#   dependsOn: []
#   objectives: []
#   relatedKnowledge: []
#   relatedModules: []
# </learning-contract-skeleton>

roadmap: []
