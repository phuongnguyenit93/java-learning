name: Build Local Run Source ZIP
run-name: Local Run Source ${{ inputs.moduleId }} · source-fingerprint:${{ inputs.sourceFingerprint }}

on:
  workflow_dispatch:
    inputs:
      moduleId:
        description: Portal module SERVICE_NAME / route id
        required: true
        type: string
      sourceFingerprint:
        description: Expected Local Run V2 build-input SHA-256 fingerprint
        required: true
        type: string

concurrency:
  # Keep both JAR and source builds for the same module serialized while updating
  # different assets in the shared rolling release.
  group: local-run-${{ inputs.moduleId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Restrict release publishing to main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo "::error::Local Run Source builds must be dispatched on main (got $GITHUB_REF)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify pinned learning contracts checkout
        shell: bash
        run: |
          set -euo pipefail
          git submodule status --recursive
          test -f learning-contract/contract.json
          test -f learning-contract/schemas/common.schema.json

      - name: Validate Local Run fingerprint algorithm
        run: python3 -m unittest discover -s scripts/tests -p 'test_local_run_fingerprint_v2.py'

      - name: Resolve runnable module
        id: module
        env:
          MODULE_ID: ${{ inputs.moduleId }}
          EXPECTED_FINGERPRINT: ${{ inputs.sourceFingerprint }}
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          module_id = os.environ['MODULE_ID'].strip().upper()
          expected_fingerprint = os.environ['EXPECTED_FINGERPRINT'].strip().lower()
          if not re.fullmatch(r'[A-Z0-9][A-Z0-9_-]{0,63}', module_id):
              raise SystemExit(f'Invalid moduleId: {module_id!r}')
          if not re.fullmatch(r'[0-9a-f]{64}', expected_fingerprint):
              raise SystemExit('Local Run Source requires a V2 SHA-256 sourceFingerprint (64 lowercase hex characters).')

          matches = []
          for master_file in Path('module').rglob('master.json'):
              module_dir = master_file.parent
              if not (module_dir / 'gradle.properties').is_file():
                  continue

              data = json.loads(master_file.read_text(encoding='utf-8'))

              def value(key):
                  raw = data.get(key)
                  return raw.get('VALUE') if isinstance(raw, dict) else raw

              service_name = str(value('SERVICE_NAME') or module_dir.name).strip().upper()
              if service_name != module_id:
                  continue

              module_type = str(value('MODULE_TYPE') or '').strip().upper()
              if module_type not in {'SERVLET', 'REACTIVE'}:
                  raise SystemExit(
                      f'Module {module_id} is {module_type or "UNKNOWN"}; Local Run Source only supports SERVLET/REACTIVE modules.'
                  )

              matches.append(module_dir)

          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one runnable module for {module_id}; found {len(matches)}.')

          module_dir = matches[0]
          relative_path = module_dir.as_posix()
          gradle_path = ':' + relative_path.replace('/', ':')
          source_base = re.sub(r'[^a-z0-9._-]+', '-', module_id.lower()).strip('-') or 'module'
          source_name = f'{source_base}_source.zip'
          source_fingerprint = subprocess.check_output(
              ['python3', 'scripts/local-run-fingerprint-v2.py', '--module-dir', relative_path],
              text=True,
          ).strip().lower()

          if source_fingerprint != expected_fingerprint:
              raise SystemExit(
                  f'Portal fingerprint is stale for {module_id}: '
                  f'expected {expected_fingerprint}, current main is {source_fingerprint}.'
              )

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'module_id={module_id}\n')
              output.write(f'module_dir={relative_path}\n')
              output.write(f'gradle_path={gradle_path}\n')
              output.write(f'source_output_dir=build/source/{relative_path}\n')
              output.write(f'source_name={source_name}\n')
              output.write(f'source_fingerprint={source_fingerprint}\n')
          PY

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build module source ZIP
        env:
          GRADLE_PATH: ${{ steps.module.outputs.gradle_path }}
        run: ./gradlew "${GRADLE_PATH}:generateModuleSourceBundle" --no-daemon

      - name: Validate and prepare source ZIP
        env:
          SOURCE_OUTPUT_DIR: ${{ steps.module.outputs.source_output_dir }}
          SOURCE_NAME: ${{ steps.module.outputs.source_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-run-artifact

          mapfile -t zips < <(find "$SOURCE_OUTPUT_DIR" -maxdepth 1 -type f -name '*.zip' -print)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one source ZIP in $SOURCE_OUTPUT_DIR, found ${#zips[@]}." >&2
            printf '%s\n' "${zips[@]}" >&2
            exit 1
          fi
          if [ "$(basename "${zips[0]}")" != "$SOURCE_NAME" ]; then
            echo "Unexpected source ZIP name: ${zips[0]} (expected $SOURCE_NAME)." >&2
            exit 1
          fi

          python3 - "${zips[0]}" "$SOURCE_NAME" <<'PY'
          import sys
          import zipfile
          from pathlib import PurePosixPath

          path = sys.argv[1]
          folder = sys.argv[2].removesuffix('_source.zip') + '-source'
          required = {
              f'{folder}/build.gradle',
              f'{folder}/settings.gradle',
              f'{folder}/gradlew',
              f'{folder}/gradlew.bat',
              f'{folder}/gradle/wrapper/gradle-wrapper.jar',
          }
          with zipfile.ZipFile(path) as archive:
              entries = archive.infolist()
              files = {entry.filename for entry in entries if not entry.is_dir()}
              if not required.issubset(files):
                  raise SystemExit(f'Source ZIP is missing standalone Gradle files: {sorted(required - files)}')
              if not any(name.startswith(f'{folder}/src/main/java/') and name.endswith('.java') for name in files):
                  raise SystemExit('Source ZIP is missing the module Java source.')
              for entry in entries:
                  name = entry.filename
                  parts = PurePosixPath(name).parts
                  if not name or name.startswith('/') or '\\' in name or '..' in parts:
                      raise SystemExit(f'Unsafe source ZIP entry: {name!r}')
                  if name != f'{folder}/' and not name.startswith(f'{folder}/'):
                      raise SystemExit(f'Unexpected source ZIP root: {name!r}')
              corrupt_entry = archive.testzip()
              if corrupt_entry is not None:
                  raise SystemExit(f'Source ZIP failed integrity check: {corrupt_entry}')
          PY

          cp "${zips[0]}" "local-run-artifact/$SOURCE_NAME"

      - name: Verify standalone source builds independently
        env:
          SOURCE_NAME: ${{ steps.module.outputs.source_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p local-run-source-smoke
          unzip -q "local-run-artifact/$SOURCE_NAME" -d local-run-source-smoke
          source_dir="local-run-source-smoke/${SOURCE_NAME%_source.zip}-source"
          test -f "$source_dir/build.gradle"
          chmod +x "$source_dir/gradlew"
          (
            cd "$source_dir"
            ./gradlew bootJar --no-daemon
          )

      - name: Ensure Local Run release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: local-run
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi

          if ! gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Local Run" \
            --notes "Rolling executable JAR and source ZIP assets for the Local Run feature." \
            --latest=false; then
            # Another module may have created the shared rolling release concurrently.
            gh release view "$RELEASE_TAG" >/dev/null
          fi

      - name: Upload rolling module source asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: local-run
          MODULE_ID: ${{ steps.module.outputs.module_id }}
          MODULE_DIR: ${{ steps.module.outputs.module_dir }}
          SOURCE_NAME: ${{ steps.module.outputs.source_name }}
          SOURCE_FINGERPRINT: ${{ steps.module.outputs.source_fingerprint }}
        shell: bash
        run: |
          set -euo pipefail

          # The checkout can become outdated while Gradle builds the ZIP.
          # Never replace a release asset if current main has changed build inputs.
          git fetch --no-tags --depth=1 origin refs/heads/main
          latest_fingerprint="$(python3 scripts/local-run-fingerprint-v2.py --module-dir "$MODULE_DIR" --revision FETCH_HEAD)"
          if [ "$latest_fingerprint" != "$SOURCE_FINGERPRINT" ]; then
            echo "::error::Module $MODULE_ID changed on main during the build; refusing to publish an outdated source ZIP."
            exit 1
          fi

          gh release upload "$RELEASE_TAG" \
            "local-run-artifact/$SOURCE_NAME#$MODULE_ID · source-fingerprint:$SOURCE_FINGERPRINT" \
            --clobber
