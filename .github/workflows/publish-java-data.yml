name: Publish Java Learning Data

# Main publishes Java data automatically. Only a VERIFIED release may trigger
# the separate frontend's build-only workflow. No Cloudflare deployment here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One rolling release; never let two publisher runs replace assets together.
  group: java-data-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Generate, validate and publish Java data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      source_commit: ${{ steps.publish_release.outputs.source_commit }}
      data_sha256: ${{ steps.publish_release.outputs.data_sha256 }}
    steps:
      - name: Restrict publishing to main
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::Java data is published only from main (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Checkout exact source revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Test exporter validation and reproducible ZIP
        run: python -m unittest discover -s scripts/tests -p 'test_java_data_publisher.py' -v

      - name: Generate Java learning data
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew generatePortalData --no-daemon --console=plain

      - name: Validate Java data
        run: python scripts/publish-java-data.py validate

      - name: Package Java data
        shell: bash
        run: |
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "::error::Checked-out revision differs from workflow commit."
            exit 1
          fi
          python scripts/publish-java-data.py package \
            --source-commit "${GITHUB_SHA}" \
            --source-commit-time "$(git show -s --format=%cI HEAD)"
          (cd build/java-data-release && sha256sum --check java-learning-data.zip.sha256)

      - name: Publish rolling GitHub Release
        id: publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="java-data"
          zip="build/java-data-release/java-learning-data.zip"
          checksum="build/java-data-release/java-learning-data.zip.sha256"
          commit_sha="${GITHUB_SHA}"
          data_sha="$(awk '{print $1}' "${checksum}")"
          if [[ ! "${data_sha}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid ZIP SHA-256."
            exit 1
          fi

          # Do not let an outdated manual run overwrite a newer publication.
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${current_main}" != "${commit_sha}" ]]; then
            echo "::error::Source commit ${commit_sha} is no longer main HEAD (${current_main}). Re-run on current main."
            exit 1
          fi

          notes="$(printf 'Rolling Java Learning Data release.\n\nSource commit: `%s`\nZIP SHA-256: `%s`\n\nDownload both assets and verify the checksum before consuming this dataset. The release tag remains fixed; the tag commit is not the source-version authority. Read manifest.json from the ZIP for the authoritative sourceCommit.\n' "${commit_sha}" "${data_sha}")"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # Re-running the same commit is harmless. Do not delete/re-upload
            # matching assets, but replace them when the generated data changes.
            mkdir -p build/java-data-existing
            if gh release download "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern 'java-learning-data.zip' \
              --pattern 'java-learning-data.zip.sha256' \
              --dir build/java-data-existing \
              && cmp -s "${zip}" build/java-data-existing/java-learning-data.zip \
              && cmp -s "${checksum}" build/java-data-existing/java-learning-data.zip.sha256; then
              echo "Rolling release already contains identical assets."
            else
              # ZIP first, checksum last. Consumer must download both and retry
              # if checksum verification fails during a replacement window.
              gh release upload "${tag}" "${zip}" --repo "${GITHUB_REPOSITORY}" --clobber
              gh release upload "${tag}" "${checksum}" --repo "${GITHUB_REPOSITORY}" --clobber
            fi
            gh release edit "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Java Learning Data" \
              --notes "${notes}" \
              --latest=false
          else
            gh release create "${tag}" "${zip}" "${checksum}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${commit_sha}" \
              --title "Java Learning Data" \
              --notes "${notes}" \
              --latest=false
          fi

          # Verify the uploaded asset bytes, not just the command exit status.
          mkdir -p build/java-data-verified
          gh release download "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'java-learning-data.zip' \
            --pattern 'java-learning-data.zip.sha256' \
            --dir build/java-data-verified
          cmp "${zip}" build/java-data-verified/java-learning-data.zip
          cmp "${checksum}" build/java-data-verified/java-learning-data.zip.sha256
          (cd build/java-data-verified && sha256sum --check java-learning-data.zip.sha256)

          gh release view "${tag}" --repo "${GITHUB_REPOSITORY}"
          echo "source_commit=${commit_sha}" >> "${GITHUB_OUTPUT}"
          echo "data_sha256=${data_sha}" >> "${GITHUB_OUTPUT}"

  dispatch:
    name: Trigger learning-platform build after verified Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require cross-repository dispatch credential
        env:
          DISPATCH_TOKEN: ${{ secrets.LEARNING_PLATFORM_DISPATCH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${DISPATCH_TOKEN}" ]]; then
            echo "::error::Missing LEARNING_PLATFORM_DISPATCH_TOKEN secret in java-learning. Use a fine-grained token with learning-platform Contents: Read and write to send repository_dispatch."
            exit 1
          fi

      - name: Trigger verified Java data build (not deployment)
        env:
          GH_TOKEN: ${{ secrets.LEARNING_PLATFORM_DISPATCH_TOKEN }}
          SOURCE_COMMIT: ${{ needs.publish.outputs.source_commit }}
          DATA_SHA256: ${{ needs.publish.outputs.data_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid published source commit"; exit 1; }
          [[ "${DATA_SHA256}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Invalid published ZIP checksum"; exit 1; }

          # The consumer uses these exact expectations when downloading the
          # rolling Release. Any newer/mismatched Release fails its build.
          jq -n \
            --arg source_commit "${SOURCE_COMMIT}" \
            --arg data_sha256 "${DATA_SHA256}" \
            '{event_type: "java-data-published", client_payload: {source_commit: $source_commit, data_sha256: $data_sha256}}' \
            > "${RUNNER_TEMP}/java-data-dispatch.json"

          gh api --method POST \
            repos/phuongnguyenit93/learning-platform/dispatches \
            --input "${RUNNER_TEMP}/java-data-dispatch.json"
          echo "Triggered learning-platform build for Java commit ${SOURCE_COMMIT}, ZIP ${DATA_SHA256}."
