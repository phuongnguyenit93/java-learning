references:
  - title: "RFC 5280 — X.509 PKI Certificate and CRL Profile"
    url: "https://www.rfc-editor.org/rfc/rfc5280.html"
    description: "Nền tảng chứng chỉ X.509 v3, CA/intermediate/leaf certificate, certificate chain, trust anchor, Key Usage, Extended Key Usage, Basic Constraints, đường dẫn chứng thực và CRL."
  - title: "RFC 9525 — Service Identity in TLS"
    url: "https://www.rfc-editor.org/rfc/rfc9525.html"
    description: "Quy tắc kiểm tra danh tính dịch vụ từ subjectAltName, đối chiếu tên miền hoặc địa chỉ với chứng chỉ server và tránh chỉ dựa vào Common Name."
  - title: "RFC 8446 — TLS 1.3"
    url: "https://www.rfc-editor.org/rfc/rfc8446.html"
    description: "Cơ chế chứng thực server và client bằng certificate trong TLS 1.3; CertificateRequest, Certificate, CertificateVerify, chứng minh sở hữu private key và mTLS."
  - title: "RFC 6960 — Online Certificate Status Protocol (OCSP)"
    url: "https://www.rfc-editor.org/rfc/rfc6960.html"
    description: "Tra cứu tình trạng chứng chỉ qua OCSP, vai trò OCSP responder và kiểm tra good/revoked/unknown trong quy trình xác minh chứng chỉ."
  - title: "RFC 8555 — Automatic Certificate Management Environment (ACME)"
    url: "https://www.rfc-editor.org/rfc/rfc8555.html"
    description: "Tự động hóa xác thực quyền kiểm soát tên miền, yêu cầu phát hành, gia hạn và thu hồi chứng chỉ bằng giao thức ACME."
  - title: "RFC 7030 — Enrollment over Secure Transport (EST)"
    url: "https://www.rfc-editor.org/rfc/rfc7030.html"
    description: "Giao thức cấp phát và cấp lại chứng chỉ cho client hoặc thiết bị qua TLS; CSR, lấy CA certificates và quản lý credential khi onboarding."
  - title: "NIST SP 800-52 Rev. 2 — Guidelines for TLS Implementations"
    url: "https://csrc.nist.gov/pubs/sp/800/52/r2/final"
    description: "Khuyến nghị triển khai TLS, xác minh chứng chỉ và cấu hình tin cậy, lựa chọn giao thức hoặc thuật toán, bảo vệ xác thực kênh truyền."
  - title: "NIST FIPS 201-3 — Personal Identity Verification (PIV)"
    url: "https://csrc.nist.gov/pubs/fips/201-3/final"
    description: "Mô hình định danh người dùng bằng PIV credential và chứng chỉ khóa công khai; quy trình cấp danh tính, xác minh và dùng smart card trong truy cập hệ thống."
  - title: "RFC 9325 — Secure Use of TLS and DTLS"
    url: "https://www.rfc-editor.org/rfc/rfc9325.html"
    description: "Best Current Practice về cấu hình TLS/DTLS, xác thực một hoặc hai đầu kết nối, vô hiệu hóa giao thức yếu và giảm lỗi cấu hình chứng chỉ."
  - title: "OWASP — Transport Layer Security Cheat Sheet"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Transport_Layer_Security_Cheat_Sheet.html"
    description: "Thực hành thiết lập TLS an toàn cho web và dịch vụ: trust chain, certificate validity, hostname, strong protocols/ciphers và giám sát vòng đời chứng chỉ."
