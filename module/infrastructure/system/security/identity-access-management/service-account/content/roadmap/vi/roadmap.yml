# <roadmap-schema>
# Cấu trúc Roadmap Module
# schema-version: 1
#
# YAML CONTRACT
# roadmap: Danh sách milestone cấp cao của roadmap cho language hiện tại. ID milestone phải duy nhất.
#
# - id [string, required]: ID ổn định và duy nhất của milestone trong roadmap language hiện tại.
# - title [string, required]: Tên milestone hiển thị cho learner.
# - purpose [string, required]: Milestone này tồn tại để learner hiểu hoặc đạt được điều gì.
# - dependsOn [list, optional]: Danh sách id milestone prerequisite khi dependency không thể hiện đủ chỉ bằng thứ tự item.
# - objectives [list, optional]: Các learning objective cấp milestone; không dùng để liệt kê mọi fact/API/syntax nhỏ.
# - relatedKnowledge [list, optional]: Danh sách Knowledge category id trong chính module hiện tại hỗ trợ milestone. Portal hiển thị danh sách này ở phía đối diện milestone và click item sẽ điều hướng sang Knowledge category tương ứng.
# - relatedModules [list, optional]: Các module liên quan hiển thị ở Level 2 của Portal. Mỗi item dùng routeId bắt buộc và có thể có label/note localized; relation này chỉ để điều hướng, không tạo child milestone hoặc thay đổi learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - Topic/module này là gì?
#   - Vì sao nó tồn tại?
#   - Không có nó thì learner gặp vấn đề gì?
# FOUNDATION
#   - Learner cần prerequisite hoặc mental model nào trước?
# CORE MODEL
#   - Những abstraction hoặc building block lớn nào tạo nên chủ đề này?
# MECHANICS
#   - Nó hoạt động như thế nào ở mức language/runtime/API phù hợp với module?
# USAGE
#   - Nó được dùng như thế nào trong code thực tế?
# DECISION / TRADE-OFF
#   - Khi nào nên chọn cơ chế này thay vì cơ chế khác?
#   - Khi nào không nên dùng?
# FAILURE / PITFALL
#   - Những sai lầm, compile-time failure hoặc runtime failure nào đáng biết?
# INTEGRATION
#   - Chủ đề này kết nối với những concept/module lân cận nào?
# SYNTHESIS
#   - Sau cùng learner phải giữ mental model end-to-end nào?
#
# Mỗi language tự chịu trách nhiệm cho roadmap của chính nó. Không suy luận hoặc đồng bộ cấu trúc từ roadmap của language khác.
# Thứ tự item trong roadmap chính là thứ tự học mặc định. Chỉ dùng dependsOn khi cần biểu diễn dependency rõ hơn thứ tự tuyến tính.
# Skeleton không nên ép mọi module có đúng bấy nhiêu node. Nó là framework suy nghĩ chứ không phải template cứng.
# </roadmap-schema>

roadmap:
  - id: mo-hinh-tai-khoan-dich-vu
    title: Mô hình tài khoản dịch vụ
    purpose: Hiểu danh tính dành cho phần mềm và tác vụ tự động.
    objectives:
      - Phân biệt tài khoản dịch vụ với tài khoản người dùng.
      - Nhận diện quan hệ giữa tài khoản, thông tin xác thực và tiến trình chạy.
  - id: thiet-ke-danh-tinh
    title: Thiết kế danh tính
    purpose: Tổ chức tài khoản theo trách nhiệm và phạm vi sử dụng.
    objectives:
      - Tách danh tính theo dịch vụ, môi trường và mức tin cậy.
      - Ghi nhận chủ sở hữu, mục đích và nơi sử dụng tài khoản.
  - id: cap-quyen-toi-thieu
    title: Cấp quyền tối thiểu
    purpose: Giới hạn tài nguyên và hành động mà dịch vụ được phép sử dụng.
    objectives:
      - Xác định quyền cần thiết từ tác vụ thực tế.
      - Ràng buộc quyền theo tài nguyên và kiểm tra quyền thừa.
  - id: phuong-thuc-xac-thuc
    title: Phương thức xác thực
    purpose: Chọn cách chứng minh danh tính phù hợp với nền tảng.
    objectives:
      - So sánh mật khẩu, khóa, chứng chỉ và token.
      - Đánh giá danh tính được quản lý và thông tin xác thực ngắn hạn.
  - id: gan-danh-tinh-khi-chay
    title: Gắn danh tính khi chạy
    purpose: Bảo đảm dịch vụ dùng đúng tài khoản trong môi trường thực thi.
    objectives:
      - Gắn tài khoản với dịch vụ, tác vụ hoặc pipeline.
      - Kiểm tra danh tính thực tế và quyền truy cập khi chạy.
  - id: uy-quyen-va-mao-danh
    title: Ủy quyền và mạo danh
    purpose: Kiểm soát ai có thể sử dụng danh tính của tài khoản dịch vụ.
    objectives:
      - Phân biệt quyền của tài khoản với quyền sử dụng danh tính đó.
      - Giới hạn mạo danh (impersonation), ủy quyền và nguy cơ nâng quyền.
  - id: quan-ly-vong-doi
    title: Quản lý vòng đời
    purpose: Duy trì tài khoản và thông tin xác thực trong suốt thời gian sử dụng.
    objectives:
      - Xoay vòng thông tin xác thực và kiểm chứng tính liên tục.
      - Thu hồi, vô hiệu hóa và loại bỏ tài khoản không còn dùng.
  - id: kiem-chung-va-kiem-toan
    title: Kiểm chứng và kiểm toán
    purpose: Xác minh quyền hiệu lực và truy vết việc sử dụng tài khoản.
    objectives:
      - Thử truy cập được phép và bị từ chối.
      - Truy vết bên gọi, danh tính thực thi và thay đổi quyền.
      - Lập quy trình ứng phó khi tài khoản hoặc khóa bị lộ.
