# <roadmap-schema>
# Cấu trúc Roadmap Module
# schema-version: 1
#
# YAML CONTRACT
# roadmap: Danh sách milestone cấp cao của roadmap cho language hiện tại. ID milestone phải duy nhất.
#
# - id [string, required]: ID ổn định và duy nhất của milestone trong roadmap language hiện tại.
# - title [string, required]: Tên milestone hiển thị cho learner.
# - purpose [string, required]: Milestone này tồn tại để learner hiểu hoặc đạt được điều gì.
# - dependsOn [list, optional]: Danh sách id milestone prerequisite khi dependency không thể hiện đủ chỉ bằng thứ tự item.
# - objectives [list, optional]: Các learning objective cấp milestone; không dùng để liệt kê mọi fact/API/syntax nhỏ.
# - relatedKnowledge [list, optional]: Danh sách Knowledge category id trong chính module hiện tại hỗ trợ milestone. Portal hiển thị danh sách này ở phía đối diện milestone và click item sẽ điều hướng sang Knowledge category tương ứng.
# - relatedModules [list, optional]: Các module liên quan hiển thị ở Level 2 của Portal. Mỗi item dùng routeId bắt buộc và có thể có label/note localized; relation này chỉ để điều hướng, không tạo child milestone hoặc thay đổi learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - Topic/module này là gì?
#   - Vì sao nó tồn tại?
#   - Không có nó thì learner gặp vấn đề gì?
# FOUNDATION
#   - Learner cần prerequisite hoặc mental model nào trước?
# CORE MODEL
#   - Những abstraction hoặc building block lớn nào tạo nên chủ đề này?
# MECHANICS
#   - Nó hoạt động như thế nào ở mức language/runtime/API phù hợp với module?
# USAGE
#   - Nó được dùng như thế nào trong code thực tế?
# DECISION / TRADE-OFF
#   - Khi nào nên chọn cơ chế này thay vì cơ chế khác?
#   - Khi nào không nên dùng?
# FAILURE / PITFALL
#   - Những sai lầm, compile-time failure hoặc runtime failure nào đáng biết?
# INTEGRATION
#   - Chủ đề này kết nối với những concept/module lân cận nào?
# SYNTHESIS
#   - Sau cùng learner phải giữ mental model end-to-end nào?
#
# Mỗi language tự chịu trách nhiệm cho roadmap của chính nó. Không suy luận hoặc đồng bộ cấu trúc từ roadmap của language khác.
# Thứ tự item trong roadmap chính là thứ tự học mặc định. Chỉ dùng dependsOn khi cần biểu diễn dependency rõ hơn thứ tự tuyến tính.
# Skeleton không nên ép mọi module có đúng bấy nhiêu node. Nó là framework suy nghĩ chứ không phải template cứng.
# </roadmap-schema>

roadmap:
  - id: nen-tang-danh-tinh-workload
    title: Nền tảng danh tính workload
    purpose: Hiểu vì sao phần mềm đang chạy cần danh tính độc lập với địa chỉ mạng.
    objectives:
      - Phân biệt danh tính workload với người dùng, máy chủ và địa chỉ IP.
      - Phân biệt chuẩn SPIFFE với hệ thống SPIRE.
  - id: spiffe-id-va-mien-tin-cay
    title: SPIFFE ID và miền tin cậy
    purpose: Thiết kế cách định danh workload và xác định ranh giới tin cậy.
    objectives:
      - Phân tích cấu trúc SPIFFE ID và miền tin cậy (trust domain).
      - Xây dựng quy ước định danh phù hợp với các workload.
  - id: svid-va-du-lieu-tin-cay
    title: SVID và dữ liệu tin cậy
    purpose: Hiểu bằng chứng danh tính và dữ liệu dùng để xác minh bằng chứng đó.
    objectives:
      - Phân biệt X.509-SVID với JWT-SVID.
      - Giải thích vai trò tập dữ liệu tin cậy (trust bundle).
  - id: kien-truc-spire
    title: Kiến trúc SPIRE
    purpose: Nắm luồng phối hợp giữa các thành phần trước khi cấu hình danh tính.
    objectives:
      - Phân biệt trách nhiệm SPIRE Server với SPIRE Agent.
      - Mô tả vai trò bộ cắm (plugin) trong kiến trúc SPIRE.
  - id: chung-thuc-va-dang-ky-workload
    title: Chứng thực và đăng ký workload
    purpose: Gắn danh tính được cấp với bằng chứng về môi trường và tiến trình thực tế.
    objectives:
      - Phân biệt chứng thực nút với chứng thực workload.
      - Liên hệ thuộc tính lựa chọn (selector), mục đăng ký và SPIFFE ID.
  - id: cap-va-su-dung-danh-tinh
    title: Cấp và sử dụng danh tính
    purpose: Đưa danh tính tự động vào giao tiếp giữa các workload.
    objectives:
      - Mô tả nhận và cập nhật SVID qua Workload API.
      - Mô tả xác thực mTLS bằng X.509-SVID và xác thực bằng JWT-SVID.
  - id: lien-ket-cac-mien-tin-cay
    title: Liên kết các miền tin cậy
    purpose: Xác minh danh tính khi workload giao tiếp qua nhiều miền tin cậy.
    objectives:
      - Giải thích liên kết miền (federation) và trao đổi trust bundle.
      - Kiểm tra SPIFFE ID, miền tin cậy và audience theo loại SVID.
      - Tách xác thực danh tính khỏi quyết định phân quyền.
  - id: van-hanh-va-kiem-chung
    title: Vận hành và kiểm chứng
    purpose: Kiểm chứng khả năng cấp, thay mới và bảo vệ danh tính trong vận hành.
    objectives:
      - Kiểm thử selector sai, danh tính giả và SVID hết hạn.
      - Theo dõi cấp lại SVID, luân chuyển dữ liệu tin cậy và sự cố Agent/Server.
      - Bảo vệ điểm truy cập Workload API và khóa riêng.
