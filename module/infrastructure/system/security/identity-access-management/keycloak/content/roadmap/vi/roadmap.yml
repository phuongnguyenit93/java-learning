# <roadmap-schema>
# Cấu trúc Roadmap Module
# schema-version: 1
#
# YAML CONTRACT
# roadmap: Danh sách milestone cấp cao của roadmap cho language hiện tại. ID milestone phải duy nhất.
#
# - id [string, required]: ID ổn định và duy nhất của milestone trong roadmap language hiện tại.
# - title [string, required]: Tên milestone hiển thị cho learner.
# - purpose [string, required]: Milestone này tồn tại để learner hiểu hoặc đạt được điều gì.
# - dependsOn [list, optional]: Danh sách id milestone prerequisite khi dependency không thể hiện đủ chỉ bằng thứ tự item.
# - objectives [list, optional]: Các learning objective cấp milestone; không dùng để liệt kê mọi fact/API/syntax nhỏ.
# - relatedKnowledge [list, optional]: Danh sách Knowledge category id trong chính module hiện tại hỗ trợ milestone. Portal hiển thị danh sách này ở phía đối diện milestone và click item sẽ điều hướng sang Knowledge category tương ứng.
# - relatedModules [list, optional]: Các module liên quan hiển thị ở Level 2 của Portal. Mỗi item dùng routeId bắt buộc và có thể có label/note localized; relation này chỉ để điều hướng, không tạo child milestone hoặc thay đổi learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - Topic/module này là gì?
#   - Vì sao nó tồn tại?
#   - Không có nó thì learner gặp vấn đề gì?
# FOUNDATION
#   - Learner cần prerequisite hoặc mental model nào trước?
# CORE MODEL
#   - Những abstraction hoặc building block lớn nào tạo nên chủ đề này?
# MECHANICS
#   - Nó hoạt động như thế nào ở mức language/runtime/API phù hợp với module?
# USAGE
#   - Nó được dùng như thế nào trong code thực tế?
# DECISION / TRADE-OFF
#   - Khi nào nên chọn cơ chế này thay vì cơ chế khác?
#   - Khi nào không nên dùng?
# FAILURE / PITFALL
#   - Những sai lầm, compile-time failure hoặc runtime failure nào đáng biết?
# INTEGRATION
#   - Chủ đề này kết nối với những concept/module lân cận nào?
# SYNTHESIS
#   - Sau cùng learner phải giữ mental model end-to-end nào?
#
# Mỗi language tự chịu trách nhiệm cho roadmap của chính nó. Không suy luận hoặc đồng bộ cấu trúc từ roadmap của language khác.
# Thứ tự item trong roadmap chính là thứ tự học mặc định. Chỉ dùng dependsOn khi cần biểu diễn dependency rõ hơn thứ tự tuyến tính.
# Skeleton không nên ép mọi module có đúng bấy nhiêu node. Nó là framework suy nghĩ chứ không phải template cứng.
# </roadmap-schema>

roadmap:
  - id: mo-hinh-keycloak
    title: Mô hình Keycloak
    purpose: Định vị Keycloak trong hệ thống quản lý danh tính và đăng nhập tập trung.
    objectives:
      - Nhận diện realm, người dùng, client và nhà cung cấp danh tính.
      - Khởi chạy môi trường thử và tạo realm đầu tiên.
  - id: nguoi-dung-va-quyen
    title: Người dùng và quyền
    purpose: Tổ chức người dùng, nhóm và vai trò theo phạm vi truy cập.
    objectives:
      - Quản lý người dùng, nhóm, realm role và client role.
      - Phân biệt quyền quản trị Keycloak và quyền trong ứng dụng.
  - id: client-va-giao-thuc
    title: Client và giao thức
    purpose: Kết nối ứng dụng hoặc dịch vụ theo đúng mô hình tin cậy.
    objectives:
      - Chọn OIDC hoặc SAML theo ứng dụng tích hợp.
      - Cấu hình client, URI chuyển hướng và xác thực client.
      - Áp dụng Authorization Code với PKCE cho đăng nhập OIDC.
  - id: dang-nhap-va-mfa
    title: Đăng nhập và MFA
    purpose: Xây dựng luồng xác thực phù hợp với mức bảo vệ cần thiết.
    objectives:
      - Cấu hình luồng đăng nhập và các hành động bắt buộc.
      - Áp dụng MFA, chính sách mật khẩu và khôi phục tài khoản.
  - id: token-va-cap-quyen
    title: Token và cấp quyền
    purpose: Kiểm soát dữ liệu và quyền mà ứng dụng nhận được.
    objectives:
      - Cấu hình client scope và protocol mapper cho claims.
      - Kiểm chứng audience, vai trò và xác minh token tại tài nguyên.
      - Phân biệt luồng người dùng với Client Credentials.
  - id: lien-ket-nguon-danh-tinh
    title: Liên kết nguồn danh tính
    purpose: Tích hợp danh tính bên ngoài và thư mục người dùng.
    objectives:
      - Phân biệt identity brokering và user federation.
      - Kết nối nhà cung cấp danh tính hoặc LDAP/AD và kiểm soát liên kết tài khoản.
  - id: phien-va-dang-xuat
    title: Phiên và đăng xuất
    purpose: Quản lý trạng thái đăng nhập và giới hạn hiệu lực truy cập.
    objectives:
      - Phân biệt phiên SSO, phiên client và thời hạn token.
      - Kiểm thử làm mới token, hết phiên và đăng xuất.
  - id: kiem-thu-va-van-hanh
    title: Kiểm thử và vận hành
    purpose: Đưa cấu hình vào môi trường thật và duy trì khả năng phục hồi.
    objectives:
      - Kiểm thử đăng nhập, phân quyền, MFA và đăng xuất.
      - Cấu hình TLS, proxy và cơ sở dữ liệu cho môi trường thật.
      - Theo dõi sự kiện; kiểm chứng sao lưu và khôi phục.
      - Lập kế hoạch nâng cấp và xoay khóa.
