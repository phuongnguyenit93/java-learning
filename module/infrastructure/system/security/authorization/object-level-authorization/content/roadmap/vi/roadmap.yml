# <roadmap-schema>
# Cấu trúc Roadmap Module
# schema-version: 1
#
# YAML CONTRACT
# roadmap: Danh sách milestone cấp cao của roadmap cho language hiện tại. ID milestone phải duy nhất.
#
# - id [string, required]: ID ổn định và duy nhất của milestone trong roadmap language hiện tại.
# - title [string, required]: Tên milestone hiển thị cho learner.
# - purpose [string, required]: Milestone này tồn tại để learner hiểu hoặc đạt được điều gì.
# - dependsOn [list, optional]: Danh sách id milestone prerequisite khi dependency không thể hiện đủ chỉ bằng thứ tự item.
# - objectives [list, optional]: Các learning objective cấp milestone; không dùng để liệt kê mọi fact/API/syntax nhỏ.
# - relatedKnowledge [list, optional]: Danh sách Knowledge category id trong chính module hiện tại hỗ trợ milestone. Portal hiển thị danh sách này ở phía đối diện milestone và click item sẽ điều hướng sang Knowledge category tương ứng.
# - relatedModules [list, optional]: Các module liên quan hiển thị ở Level 2 của Portal. Mỗi item dùng routeId bắt buộc và có thể có label/note localized; relation này chỉ để điều hướng, không tạo child milestone hoặc thay đổi learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - Topic/module này là gì?
#   - Vì sao nó tồn tại?
#   - Không có nó thì learner gặp vấn đề gì?
# FOUNDATION
#   - Learner cần prerequisite hoặc mental model nào trước?
# CORE MODEL
#   - Những abstraction hoặc building block lớn nào tạo nên chủ đề này?
# MECHANICS
#   - Nó hoạt động như thế nào ở mức language/runtime/API phù hợp với module?
# USAGE
#   - Nó được dùng như thế nào trong code thực tế?
# DECISION / TRADE-OFF
#   - Khi nào nên chọn cơ chế này thay vì cơ chế khác?
#   - Khi nào không nên dùng?
# FAILURE / PITFALL
#   - Những sai lầm, compile-time failure hoặc runtime failure nào đáng biết?
# INTEGRATION
#   - Chủ đề này kết nối với những concept/module lân cận nào?
# SYNTHESIS
#   - Sau cùng learner phải giữ mental model end-to-end nào?
#
# Mỗi language tự chịu trách nhiệm cho roadmap của chính nó. Không suy luận hoặc đồng bộ cấu trúc từ roadmap của language khác.
# Thứ tự item trong roadmap chính là thứ tự học mặc định. Chỉ dùng dependsOn khi cần biểu diễn dependency rõ hơn thứ tự tuyến tính.
# Skeleton không nên ép mọi module có đúng bấy nhiêu node. Nó là framework suy nghĩ chứ không phải template cứng.
# </roadmap-schema>

roadmap:
  - id: ranh-gioi-phan-quyen-doi-tuong
    title: Ranh giới phân quyền đối tượng
    purpose: Hiểu vì sao đăng nhập thành công chưa cho phép truy cập mọi tài nguyên.
    objectives:
      - Phân biệt quyền trên chức năng, đối tượng và thuộc tính.
      - Nhận diện lỗi BOLA và tham chiếu trực tiếp không an toàn (IDOR).
  - id: mo-hinh-quyet-dinh-quyen
    title: Mô hình quyết định quyền
    purpose: Biến yêu cầu truy cập thành quyết định quyền rõ ràng.
    objectives:
      - Xác định chủ thể, tài nguyên, hành động và ngữ cảnh.
      - Mô tả điều kiện cho phép hoặc từ chối theo từng tài nguyên.
  - id: so-huu-chia-se-va-tenant
    title: Sở hữu, chia sẻ và tenant
    purpose: Xác định ai được làm gì với dữ liệu của cá nhân hoặc tổ chức.
    objectives:
      - Thiết kế quyền sở hữu và chia sẻ giữa người dùng.
      - Cách ly tài nguyên giữa các khách hàng (tenant).
  - id: thuc-thi-quyen-tai-may-chu
    title: Thực thi quyền tại máy chủ
    purpose: Bảo đảm mọi thao tác được kiểm tra bằng thông tin đáng tin cậy.
    objectives:
      - Áp dụng mặc định từ chối và kiểm tra quyền theo từng hành động.
      - Giải thích vì sao UUID và nút giao diện không thay thế kiểm tra quyền.
  - id: truy-van-va-cac-luong-truy-cap
    title: Truy vấn và các luồng truy cập
    purpose: Ngăn bỏ sót kiểm tra khi tài nguyên được truy cập qua nhiều đường.
    objectives:
      - Giới hạn truy vấn danh sách theo phạm vi được phép.
      - Kiểm tra từng đối tượng trong xử lý hàng loạt, tài nguyên lồng và xuất dữ liệu.
  - id: thay-doi-va-nhat-quan-quyen
    title: Thay đổi và nhất quán quyền
    purpose: Giữ quyết định truy cập đúng khi quan hệ và quyền thay đổi.
    objectives:
      - Xử lý thu hồi quyền, chuyển chủ sở hữu và thay đổi chia sẻ.
      - Nhận diện quyền cũ trong bộ nhớ đệm và rủi ro đổi quyền giữa kiểm tra với sử dụng.
  - id: kiem-thu-va-giam-sat
    title: Kiểm thử và giám sát
    purpose: Chứng minh không thể vượt quyền bằng cách đổi đối tượng hoặc đường truy cập.
    objectives:
      - Lập ma trận kiểm thử chéo người dùng, hành động và tenant.
      - Thử thay mã đối tượng với cả trường hợp được phép và bị từ chối.
      - Ghi nhận quyết định quyền để phát hiện truy cập bất thường.
