references:
  - title: "NIST SP 800-57 Part 1 Rev. 5 — Recommendation for Key Management"
    url: "https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final"
    description: "Khung quản lý vòng đời khóa mật mã: tạo, sử dụng, cryptoperiod, phân phối, rotation, backup, recovery, revoke và hủy khóa; phân biệt các loại khóa."
  - title: "NIST SP 800-130 — Framework for Cryptographic Key Management Systems"
    url: "https://csrc.nist.gov/pubs/sp/800/130/final"
    description: "Các yêu cầu thiết kế hệ thống KMS/CKMS, chính sách quản lý khóa, key metadata, kiểm soát truy cập, phân quyền và lưu vết."
  - title: "NIST FIPS 140-3 — Security Requirements for Cryptographic Modules"
    url: "https://csrc.nist.gov/pubs/fips/140-3/final"
    description: "Tiêu chuẩn an toàn mô-đun mật mã: roles, authentication, bảo vệ vật lý, self-tests, key material và các mức chứng nhận HSM."
  - title: "NIST CMVP — Validated Cryptographic Modules"
    url: "https://csrc.nist.gov/projects/cryptographic-module-validation-program/validated-modules"
    description: "Tra cứu chứng nhận FIPS 140-3 của cryptographic modules; phân biệt module được xác thực với tuyên bố hỗ trợ thuật toán hoặc tiêu chuẩn."
  - title: "AWS KMS — Cryptography Essentials"
    url: "https://docs.aws.amazon.com/kms/latest/developerguide/kms-cryptography.html"
    description: "Kiến trúc xử lý mật mã trong managed KMS: tạo khóa ở HSM, symmetric/asymmetric operations, encryption context và envelope encryption."
  - title: "AWS KMS — Key Hierarchy"
    url: "https://docs.aws.amazon.com/kms/latest/cryptographic-details/key-hierarchy.html"
    description: "Phân biệt logical KMS key, HSM backing key, data key; giải thích wrapping, rotation và quyền dùng khóa mà không xuất plaintext master key."
  - title: "Google Cloud — Cloud KMS Overview"
    url: "https://docs.cloud.google.com/kms/docs/key-management-service"
    description: "Khái niệm key ring/key version, software-backed và hardware-backed keys, IAM, rotation, import và quản lý keys trong cloud."
  - title: "Google Cloud — Cloud HSM"
    url: "https://docs.cloud.google.com/kms/docs/hsm"
    description: "Mô hình HSM được quản lý qua Cloud KMS, thao tác với HSM-protected keys và bảo vệ key material trong phần cứng."
  - title: "Microsoft Azure — Key Vault Managed HSM Overview"
    url: "https://learn.microsoft.com/en-us/azure/key-vault/managed-hsm/overview"
    description: "HSM được quản lý dạng single-tenant, cách bảo vệ khóa, phân quyền, tính sẵn sàng, security domain và bảo đảm theo FIPS 140-3."
  - title: "Microsoft Azure — Managed HSM Key Types and Operations"
    url: "https://learn.microsoft.com/en-us/azure/key-vault/managed-hsm/about-keys-details"
    description: "Các loại khóa RSA/EC/AES, encrypt/decrypt, wrap/unwrap, sign/verify và các thuộc tính chính sách khi sử dụng HSM."
