  - question: "Một repo payroll nhạy cảm sắp vào project Billing. Vì sao cần rà quyền kế thừa hơn là chỉ đánh dấu Private?"
    answer: "Để repo Private ngăn người ngoài đọc tự do nhưng không hủy grant ở cấp project. Nếu billing-developers đã có Write trên Billing, repository mới đặt vào đó có thể kế thừa quyền ghi rộng ngay. Cần kiểm kê nhóm và quyền trước khi tạo hoặc chuyển payroll-secrets. Cân nhắc project riêng hoặc grant hẹp hơn rồi kiểm thực tế ai clone, push và quản trị được. Không được nghĩ xóa grant ở repo sẽ tự loại hết quyền kế thừa."
