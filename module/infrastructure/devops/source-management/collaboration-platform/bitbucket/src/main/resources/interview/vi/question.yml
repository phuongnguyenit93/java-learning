  - question: "Điều gì thay đổi khi workspace Bitbucket được Atlassian Administration quản lý thay vì giao diện Bitbucket cũ?"
    answer: "Cấu trúc nguồn vẫn gồm workspace, project và repository. Tuy nhiên ở môi trường mới do tổ chức quản lý, quyền vào ứng dụng và người dùng workspace được xử lý trong Atlassian Administration thay vì nút mời của Bitbucket kiểu cũ. Quyền nội dung repository và grant project vẫn phải xem trong Bitbucket. Trước tiên xác định mô hình quản trị, tránh làm theo hướng dẫn nút mời lỗi thời rồi cấp quyền quá mức."
