  - question: "Khi PR được mở và gán reviewer, thực sự điều gì đã diễn ra và còn những quyết định nào?"
    answer: "Source và destination branch xác định một đề xuất so sánh mã. PR tạo nơi giải thích mục tiêu và xem diff; việc gán reviewer chỉ là lời yêu cầu đánh giá. Lời mời không phải Approve, PR Open cũng chưa cập nhật main. Reviewer có thể yêu cầu test hoặc sửa, còn quyền merge phụ thuộc riêng vào phân quyền và checks đã cấu hình. Chỉ tích hợp được phép mới thay đổi nguồn ở nhánh đích."
