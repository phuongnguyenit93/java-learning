questions:
  - question: "Giải thích ranh giới Git và Bitbucket Cloud cho kỹ sư mới. Vì sao đưa mã lên host không đồng nghĩa được duyệt hay phát hành?"
    answer: "Git lưu objects, commit, branch và lịch sử, kể cả thay đổi chưa lên máy chủ. Bitbucket Cloud lưu trữ repository và cung cấp phân quyền, thảo luận PR, quyết định review, điều kiện merge. Với sửa thuế của An, push chỉ công bố nhánh chứa thay đổi; mở PR là bước riêng để đề xuất review. Reviewer còn phải kiểm tác động, chính sách cho phép tích hợp và quy trình phân phối riêng phải triển khai revision đã nhận. Không được coi các bằng chứng đó là một."
    aiGenerated: true
    reviewed: false
