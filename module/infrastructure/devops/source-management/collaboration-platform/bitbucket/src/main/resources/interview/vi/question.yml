  - question: "Chọn sai repository hoặc nhánh đích của PR có thể gây hậu quả vận hành gì?"
    answer: "Đích không phải nhãn trang trí: nó quyết định diff được so, branch sẽ đổi khi merge và rule tích hợp áp dụng. Bản sửa thuế dành cho main nhưng nhắm release/old có thể vào nhánh bảo trì sai hoặc chịu reviewer/checks khác. Trước khi review cần xem repository nguồn/đích và branch tips. Phải sửa endpoint thật; đổi tiêu đề PR thành main không thay vị trí mã sẽ được tích hợp."
