    answer: "URL branch cho người khác xem mã nhưng PR ghi rõ nguồn và đích, gắn thảo luận với diff hiện tại. Reviewer có thể bình luận từng dòng, tạo task theo dõi và ghi quyết định review trước khi tích hợp. Với sửa thuế của An, Bình cần phân tích ca biên và nêu điều kiện chấp nhận. PR có đầy đủ thông tin vẫn chỉ là đề xuất đến khi merge có thẩm quyền cập nhật nhánh đích."
