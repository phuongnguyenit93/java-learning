  - question: "Tổ chức nên tách trách nhiệm reviewer, quản trị repository và chuyên môn tính thuế thế nào?"
    answer: "Quản trị là cấu hình quyền và policy, còn review là đánh giá một thay đổi mã. Một người có khả năng bấm Approve chưa chắc hiểu làm tròn tiền; Admin có thể quản lý quyền mà không đủ cơ sở nhận xét nghiệp vụ. Giao Bình review hành vi thuế và Mai duy trì cấu hình quyền hoặc merge. Khi một người kiêm nhiều vai, vẫn phải ghi rõ ai đã quyết định về nội dung và quy tắc nào cho phép tích hợp."
