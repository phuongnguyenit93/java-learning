  - question: "Vì sao đặt hai Git repository trong một Bitbucket project không khiến branch và lịch sử của chúng dùng chung được?"
    answer: "Bitbucket project nhóm repository để tổ chức và áp chính sách quyền ở cấp project. Mỗi repository vẫn có cơ sở object, đồ thị commit, refs và nội dung Git riêng. invoice-api/main khác lịch sử với billing-docs/main dù trùng tên nhánh. Quyền project chung có thể cho một nhóm đọc hoặc ghi cả hai nhưng không tự đồng bộ commit. Thay đổi xuyên repo vẫn cần phối hợp và bằng chứng tiếp nhận riêng cho từng kho."
    aiGenerated: true
