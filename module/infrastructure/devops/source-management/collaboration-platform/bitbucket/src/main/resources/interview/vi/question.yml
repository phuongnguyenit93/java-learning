  - question: "Vì sao nguy hiểm khi gọi PR đã push và có bình luận là được nhận trong khi main chưa có thay đổi?"
    answer: "Push nhánh làm bản đề xuất sẵn có; bình luận cho biết còn trao đổi. Cả hai vẫn có thể tồn tại khi PR bị từ chối hoặc đang chờ test. Nguồn chung được nhận cần đáp ứng điều kiện nhóm và tích hợp kết quả vào nhánh chuẩn. Báo hoàn thành sớm khiến lập kế hoạch release sai hoặc triển khai nhầm revision. Cần kiểm kết quả merge và lịch sử nhánh đích, rồi xác minh deployment riêng."
