  - question: "Vì sao xóa một người khỏi nhóm developer chưa chắc thu hồi quyền Write của họ và kiểm toán ra sao?"
    answer: "Quyền hiệu lực có thể đến từ nhiều nguồn: cấp trực tiếp, nhóm khác, kế thừa project và cấu hình repository. Xóa khỏi billing-developers chỉ gỡ quyền do chính nhóm đó cấp. Cần rà toàn bộ grant còn hiệu lực và branch restrictions theo thao tác cụ thể rồi thử quyền một cách an toàn. Ghi trạng thái trước/sau; việc từng clone thành công không phải bằng chứng vẫn được push."
