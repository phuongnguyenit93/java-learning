  - question: "Hãy mô tả bằng chứng để nói một thay đổi Bitbucket đã vào nguồn chung được nhận, thay vì mới đăng lên xin góp ý."
    answer: "Push thành công chứng minh nhánh đề xuất đã được công bố; hoạt động reviewer chứng minh PR đã có trao đổi. Không bằng chứng nào tự xác nhận nhánh chuẩn đã có bản sửa. Cần kiểm PR thực sự Merged, rồi xem ref hoặc lịch sử nhánh đích chứa commit hay nội dung merge tương ứng. Review, build và task giải thích lý do tiếp nhận. Việc chạy production là ranh giới khác, cần log phân phối riêng."
