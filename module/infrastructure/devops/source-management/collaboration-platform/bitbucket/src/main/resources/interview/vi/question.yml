  - question: "Vì sao chuyển từ gửi thư mục ZIP qua email sang review PR trên host giúp giảm rủi ro mất ngầm thay đổi song song?"
    answer: "Các bản invoice-final ZIP có thời gian sửa nhưng không xác định base chung hoặc giải thích hai thay đổi được hòa giải thế nào. Commit trong Git repository truy cập được giúp xem chính xác diff và quan hệ lịch sử. PR của Bitbucket liên kết nguồn, đích với bình luận, task và quyết định review. Điều đó không tự làm merge đúng: reviewer vẫn phải test tương tác giữa thuế và làm tròn và xác nhận commit trên nhánh đích."
