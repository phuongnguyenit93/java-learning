  - question: "Phân biệt public visibility, repository Write và project Create khi review quyền trong Bitbucket Cloud."
    answer: "Public visibility quyết định ai xem mã repository được mà không cần mời; nó không cho người lạ push. Write của repo cho phép đóng góp mã nhưng vẫn chịu branch restrictions, còn Admin quản cấu hình. Project Create cho phép tạo repository và kế thừa Write trên các repo thuộc project, tức phạm vi rộng hơn quyền cấp riêng một repo. Khi audit phải xét actor, tài nguyên và thao tác cụ thể, sau đó cấp mức quyền hẹp thay vì coi URL công khai là giấy phép sửa mã."
