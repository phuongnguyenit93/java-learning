  - question: "Một thành viên thấy workspace Orchid nhưng không sửa được repo private. Bạn suy luận các cấp quyền ra sao?"
    answer: "Membership workspace tạo ngữ cảnh tổ chức chứ không tự cấp Write cho mọi repository. Kiểm ai quản lý quyền vào ứng dụng, grant ở project có áp vào repo không và quyền trực tiếp của repo có đủ cho thao tác không. Nếu lỗi xảy ra trên main, kiểm thêm branch restriction sau khi xác minh Write cơ bản. Chỉ cấp đúng quyền thiếu, không nâng Admin hay chuyển repo thành Public."
    aiGenerated: true
    reviewed: false
