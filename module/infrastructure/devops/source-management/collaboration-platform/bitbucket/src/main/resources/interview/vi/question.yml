  - question: "Auditor hỏi mã đổi gì, ai cho phép và đã triển khai chưa. Bạn sẽ tập hợp những lớp bằng chứng nào?"
    answer: "Dùng commit và diff Git để dựng lại trạng thái mã; dùng hoạt động PR Bitbucket để xác định người tham gia, bình luận, phiếu duyệt, checks và kết quả merge. Liên kết Jira khi có để biết lý do nghiệp vụ. Log release/deployment mới chứng minh bản nào được build và phát hành; PR xanh hay commit đã merge chưa đủ. Ghép các hệ thống theo revision chính xác và nêu rõ phần thiếu, không suy approval từ tên tác giả commit."
    aiGenerated: true
