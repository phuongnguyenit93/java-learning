  - question: "Explain the difference between public source visibility, repository Write and project Create in a Bitbucket Cloud access review."
    answer: "Public visibility decides who can read repository content without an invitation; it does not grant anonymous users permission to push. Repository Write allows source contributions subject to branch restrictions, while Admin controls configuration. Project Create adds repository creation and inherits project Write across member repositories: that project-wide scope differs from a single repository grant. Audit the actor, resource and exact action, then grant the narrow permission rather than treating a public URL as authorization."
