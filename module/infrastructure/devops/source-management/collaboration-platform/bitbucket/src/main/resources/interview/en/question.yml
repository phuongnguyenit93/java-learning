    answer: "Use Git commits and diffs to reconstruct the source state, and Bitbucket PR activity to identify participants, comments, approvals, checks and the merge result. Link Jira work items for business rationale if integrated. Release and deployment logs prove what was built and rolled out; a green PR or merged commit alone does not. Correlate exact revision identifiers across systems, while explaining any gaps instead of inferring approval from commit authorship."
