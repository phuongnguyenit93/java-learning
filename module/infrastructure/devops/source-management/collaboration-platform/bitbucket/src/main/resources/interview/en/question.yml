  - question: "Why does migrating from emailed ZIP folders to hosted PR review reduce the risk of silently losing concurrent edits?"
    answer: "With invoice-final ZIPs, timestamps cannot identify a common base or explain how competing edits were reconciled. Recording commits in one accessible Git repository permits exact diffs and ancestry inspection. A Bitbucket PR then binds the intended source and destination to comments, tasks and review outcomes. That does not make every merge correct: reviewers must still test whether tax and rounding edits interact and confirm the accepted destination commit."
