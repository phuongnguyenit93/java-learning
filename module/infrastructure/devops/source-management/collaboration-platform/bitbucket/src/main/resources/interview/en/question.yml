questions:
  - question: "Explain the boundary between Git and Bitbucket Cloud to a new engineer. Why does hosting not imply approval or release?"
    answer: "Git preserves objects, commits, branches and ancestry, including local work that has never reached any server. Bitbucket Cloud hosts repositories and offers actor-scoped permissions, pull-request discussion, review decisions and merge controls. For An's tax fix, pushing only publishes a candidate branch; opening a PR separately requests review. A reviewer must examine impact, policy must permit integration, and a separate delivery process must deploy the accepted revision. Treat those records as different evidence, not interchangeable badges."
