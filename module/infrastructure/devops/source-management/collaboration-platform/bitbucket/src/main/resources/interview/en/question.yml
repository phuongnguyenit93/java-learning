  - question: "Why does putting two Git repositories in a single Bitbucket project not make their branches or histories interchangeable?"
    answer: "A Bitbucket project groups repositories for organization and project-scope governance. Each repository still has its own Git object database, commit graph, refs and independent content. invoice-api/main and billing-docs/main are different histories even if the branch names match. Shared project permissions can make both accessible to a group but cannot synchronize commits. Cross-repository changes therefore need explicit coordination and separate acceptance evidence."
