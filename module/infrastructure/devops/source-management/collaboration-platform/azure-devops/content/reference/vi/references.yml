references:
  - title: "Organization management overview"
    url: "https://learn.microsoft.com/en-us/azure/devops/organizations/accounts/organization-management?view=azure-devops"
    description: "Official orientation to Azure DevOps organizations and the projects and members they organize."
  - title: "Create a project"
    url: "https://learn.microsoft.com/en-us/azure/devops/organizations/projects/create-project?view=azure-devops"
    description: "Explains the project boundary and initial source control configuration in Azure DevOps."
  - title: "Public projects retirement in Azure DevOps"
    url: "https://learn.microsoft.com/en-us/azure/devops/organizations/projects/public-projects-retirement?view=azure-devops"
    description: "Microsoft's Azure DevOps Services 2026 retirement notice: no new public projects and automatic private conversion of remaining public projects in 2027."
  - title: "Create a new Git repo in your project"
    url: "https://learn.microsoft.com/en-us/azure/devops/repos/git/create-new-repo?view=azure-devops"
    description: "Shows how Azure Repos Git repositories are created and owned within a project."
  - title: "About permissions and security groups"
    url: "https://learn.microsoft.com/en-us/azure/devops/organizations/security/about-permissions?view=azure-devops"
    description: "Explains access levels, security groups, configured Allow/Deny/Not set states, inheritance, and effective permissions."
  - title: "Set Git repository permissions"
    url: "https://learn.microsoft.com/en-us/azure/devops/repos/git/set-git-repository-permissions?view=azure-devops"
    description: "Defines repository-specific permissions and the controls used to manage contributors."
  - title: "Fork your repository"
    url: "https://learn.microsoft.com/en-us/azure/devops/repos/git/forks?view=azure-devops"
    description: "Describes fork-based contribution and explains how fork permissions and policies differ from the source."
  - title: "Create pull requests"
    url: "https://learn.microsoft.com/en-us/azure/devops/repos/git/pull-requests?view=azure-devops"
    description: "Explains pull requests, source and target branches, reviewers, and links to work items."
  - title: "Review and comment on pull requests"
    url: "https://learn.microsoft.com/en-us/azure/devops/repos/git/review-pull-requests?view=azure-devops"
    description: "Covers review discussions and Azure Repos approval, suggestion, wait, and rejection votes."
  - title: "Set and manage branch policies"
    url: "https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-policies?view=azure-devops"
    description: "Explains minimum reviewers, required reviewers, checks, work-item links, and merge conditions."
  - title: "Set branch permissions"
    url: "https://learn.microsoft.com/en-us/azure/devops/repos/git/branch-permissions?view=azure-devops"
    description: "Distinguishes branch-level access controls from pull request branch policies."
  - title: "Complete, abandon, or revert pull requests"
    url: "https://learn.microsoft.com/en-us/azure/devops/repos/git/complete-pull-requests?view=azure-devops"
    description: "Describes pull request completion, auto-complete, merge options, and abandoning proposals."
