      anchor: "azure-devops-vs-azure-repos"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Azure Boards"
        explanation: "Boards quản lý work items, không lưu PR mã nguồn"
      - id: B
        answer: "Azure Repos (Git)"
        explanation: "PR và review thuộc Azure Repos; Boards lưu work items, Pipelines tạo kết quả kiểm tra và Artifacts quản lý package, dù chúng có thể liên kết nhau."
      - id: C
        answer: "Azure Pipelines"
        explanation: "Pipelines chạy jobs khi PR được cập nhật"
      - id: D
        answer: "Azure Artifacts"
        explanation: "Azure Artifacts lưu package/version để consumers cài đặt, không lưu phiếu review và kết quả Complete của PR mã."
    correctAnswerId: B
  - id: "azure-devops-002"
    question: "Một nhóm trao đổi bản ZIP qua chat rồi chép lên server. Azure Repos cải thiện điều gì?"
