        answer: "Có commit Git local, chưa rõ có PR"
        explanation: "Tạo commit trên máy chỉ chứng minh Git local đã ghi snapshot; muốn có PR phải chia sẻ nhánh và tạo đề xuất trên hosting riêng."
      - id: B
        answer: "Commit offline đã đồng bộ vào remote nhờ tài khoản đăng nhập Azure DevOps."
