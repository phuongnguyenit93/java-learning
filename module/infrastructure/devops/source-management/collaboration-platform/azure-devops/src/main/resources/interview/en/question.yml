  - question: Why cannot additional approvals resolve a merge conflict, and what must be checked afterward?
    answer: Approval is a review decision; a Git merge conflict means the destination cannot automatically combine incompatible content. Resolve the file using domain intent, publish the new source revision and rerun relevant validation. More votes cannot choose the correct business logic. After resolution, inspect the final diff and current policy state because the proposal differs from the version previously reviewed.
