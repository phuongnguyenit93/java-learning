  - question: Why does a local Git commit not prove that a change has been reviewed or accepted in Azure Repos?
    answer: Git can record an offline snapshot, yet no teammate necessarily has access to it. The branch must be shared in a suitable repository and a PR must target the intended branch before votes, discussion and policies apply. Distinguish local recording, remote sharing, hosted review and accepted target integration. Treating a push as a completed review is a common audit and release mistake.
