  - question: Why is a PR a proposal rather than an immediate target update, and what source/target evidence matters?
    answer: A pull request identifies an exact source repository/branch and destination repository/branch. It presents the diff and review context without directly changing the destination. Since multiple repositories can have branches named main, review both endpoints, the source revision and the target policies. Opening a PR or receiving one approval does not move the target branch or establish completion.
