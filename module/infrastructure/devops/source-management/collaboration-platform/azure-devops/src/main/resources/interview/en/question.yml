  - question: What do branch policies actually protect, and why do they not guarantee business correctness?
    answer: Branch policies gate integration into a shared branch using conditions such as eligible approvals, required reviewers, validation builds and traceability. They reduce unreviewed integration but cannot prove a refund calculation correct outside the checks and judgment actually applied. Pair them with focused business tests and meaningful review rather than accumulating policy checkboxes as a substitute for evidence.
