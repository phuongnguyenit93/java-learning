  - question: If an optional security scan fails while required validation passes, when can a PR complete and what risk remains?
    answer: An optional check can warn without creating a blocking gate, whereas required conditions must pass alongside other destination policies and actor rights. A PR may therefore be technically completable while still carrying a security warning that needs triage or an explicit risk decision. Do not erase the warning merely because the UI permits Complete; document the issue and the reviewer’s judgment.
