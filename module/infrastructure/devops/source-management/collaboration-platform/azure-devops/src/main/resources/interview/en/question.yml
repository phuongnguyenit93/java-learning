  - question: How do access levels differ from security permissions when a user can open Boards but cannot clone a repository?
    answer: An access level determines feature entitlement, whereas security permissions govern operations on specific projects, repositories and branches. Board access does not imply Read on checkout-api. Diagnose entitlement, project membership and the effective repository Read/Deny result separately before changing roles. This distinction avoids confusing a feature availability problem with a Git resource ACL failure.
