  - question: Why can an approved PR remain unable to complete, and what evidence should the team inspect?
    answer: Approval is only one review signal. The destination branch may additionally require a passing build, designated reviewers, linked work items or other policies, and the completing actor still needs appropriate rights. Inspect the PR policy panel, validation logs, source conflicts and effective target permissions. Adding votes blindly or bypassing checks can hide the actual blocker without fixing it.
