  - question: What does Set auto-complete help with, and which blockers can it not resolve?
    answer: Auto-complete records the intent to complete once target requirements pass and the actor is permitted to finish the PR. It cannot fix a failed build, create a missing work-item link, resolve a conflict, grant permissions or turn Wait for author into approval. When completion stalls, inspect policy status, actor rights and validation logs, repair each blocker and let the eligibility change drive the completion.
