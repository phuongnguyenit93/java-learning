questions:
  - question: How do Azure Repos, Boards and Pipelines divide responsibility when a team integrates a bug fix?
    answer: Azure DevOps is the encompassing platform. Repos governs Git repositories, pull requests and review decisions; Boards owns the work-item lifecycle; Pipelines produces build and test evidence. Linking a bug to a PR and validated revision makes the collaboration traceable, but a completed PR does not automatically prove the bug is closed or deployed. A green pipeline also cannot establish business correctness by itself.
