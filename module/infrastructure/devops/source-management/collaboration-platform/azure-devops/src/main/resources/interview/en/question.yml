    answer: "Verify the service and timeline rather than blindly following archived screenshots: since April 2026, new public projects are no longer generally supported on Azure DevOps Services, and remaining public projects are scheduled to become private during 2027. Microsoft Learn still describes a grandfathered exception for organizations with the Allow public project policy already enabled, not a policy arbitrary organizations can newly turn on; verify actual eligibility rather than promising creation. Plan how external readers will access the code, review public-facing links and choose supported sharing mechanisms instead of attempting a permission bypass."
