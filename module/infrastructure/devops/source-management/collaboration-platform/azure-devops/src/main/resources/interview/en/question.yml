  - question: Why must a missing work-item link and denied Complete permission be resolved separately on an otherwise approved PR?
    answer: A work-item link is destination policy traceability; permission to Complete is actor authorization on the destination. Adding a valid bug link does not grant the actor merge rights, and elevating the actor does not satisfy missing PR metadata. Inspect policy failures and effective target rights separately, assign the right owner to each correction and avoid bypassing unrelated controls just to make the button available.
