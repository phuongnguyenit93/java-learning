    answer: Wait for author requests correction or clarification before reconsideration; Reject expresses stronger disapproval of the current proposal and may affect policy differently. A required reviewer’s Wait for author can prevent the needed approval until the test and feedback are addressed. The author should add evidence and seek re-review rather than assuming the PR must be permanently abandoned.
