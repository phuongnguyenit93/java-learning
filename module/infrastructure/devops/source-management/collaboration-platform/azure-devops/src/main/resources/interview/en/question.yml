  - question: When should a contributor use a feature branch in the shared repository versus a fork?
    answer: A trusted contributor with branch creation and push rights can normally work on a short-lived branch in the shared repository and open a PR. Someone lacking upstream write rights can publish work to an accessible fork and propose it back to the upstream target, whose policies still apply. Choose based on access, review boundaries and synchronization cost; a fork does not bypass target governance.
