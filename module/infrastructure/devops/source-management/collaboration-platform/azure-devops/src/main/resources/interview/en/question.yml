  - question: How does a Squash-completed PR differ from a regular merge in traceability?
    answer: Squash records a consolidated new commit in the destination instead of reproducing the source commit sequence in the same historical shape. The Completed PR still preserves reviews, votes and discussions. This simplifies destination history but makes Git log alone insufficient for reconstructing how the patch evolved. Audit both the PR record and integrated commit; a single squash commit does not mean review or source history never existed.
