  - question: Why can pushes succeed on a fork while a PR into upstream main remains blocked by policy?
    answer: A fork has independent rights and history, but a PR into upstream/main is evaluated against that destination branch’s validation and review rules. More push permission on the fork cannot satisfy upstream approval counts. Inspect both endpoints and target policy failures, obtain required reviews or validation evidence, and reserve bypass for explicitly authorized exception procedures.
