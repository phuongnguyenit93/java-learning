  - question: Why does Private project visibility not by itself determine who can read a repository inside it?
    answer: Private limits the possible audience, but cloning checkout-api still requires appropriate identity, membership, access entitlement and effective repository Read. A Reader may inspect changes without gaining Contribute, while possession of a URL does not grant outsiders access. Review actual grants and group inheritance before changing visibility so that the least-privilege boundary remains intact.
