  - question: How do Draft and Ready differ, and what still requires proof before merging?
    answer: Draft communicates that work is incomplete and may benefit from early feedback; Ready invites the normal review process but does not manufacture missing tests or satisfy target policies. A Ready PR still needs a sound diff, review evidence, required validation and suitable completion rights. Treating a state toggle as a quality certificate confuses workflow signaling with technical proof.
