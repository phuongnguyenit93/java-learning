  - question: How does Not set differ from Deny when Read is inherited through multiple groups?
    answer: Not set contributes neither an explicit grant nor a denial at that entry, so an Allow from Readers or an inherited scope may still apply. Deny is a negative rule that can affect effective access under the relevant scope rules. A blank personal entry therefore cannot prove the user lacks clone access. Inspect effective permissions together with memberships and inheritance to explain the observed result.
