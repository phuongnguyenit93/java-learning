  - question: When should teams use separate Azure DevOps projects under one organization rather than a single repository?
    answer: "An organization is the broader administrative boundary; projects group services, people and policies; each project may contain multiple independent Git repositories. Separate Warehouse and Checkout when membership, governance or product context merits different scopes. Do not model every branch as a project or assume a repository is itself an organization: that fragments access administration without solving a collaboration need."
