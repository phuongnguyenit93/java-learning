  - question: So sánh dấu vết lịch sử khi Complete PR bằng Squash với merge thông thường.
    answer: Squash tạo một commit tổng hợp mới trên target thay vì đưa nguyên chuỗi commit nguồn theo cùng hình dạng lịch sử; PR Completed vẫn lưu discussions, votes và metadata liên quan. Điều này giúp lịch sử target gọn nhưng có thể che bớt cấu trúc commit phát triển khi chỉ xem log Git. Khi audit cần tra cả PR record và target commit, không suy rằng một commit squash đồng nghĩa không có review hoặc không tồn tại lịch sử ở source.
