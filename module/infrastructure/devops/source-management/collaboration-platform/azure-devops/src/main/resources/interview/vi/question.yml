questions:
  - question: Phân định vai trò Azure DevOps, Azure Repos, Boards và Pipelines khi một nhóm cần đưa bản sửa lỗi vào mã nguồn chung.
    answer: Azure DevOps là nền tảng chứa nhiều dịch vụ; Azure Repos quản lý repository Git, Pull Request và bằng chứng review; Boards sở hữu vòng đời work item; Pipelines chạy build và kiểm thử. Khi sửa lỗi, liên kết Bug với PR và kết quả validation giúp theo dấu nguyên nhân đến revision được nhận. Tuy nhiên PR Completed không có nghĩa work item đã đóng, và một pipeline xanh không chứng minh yêu cầu nghiệp vụ đã đúng hoặc bản sửa đã được triển khai.
