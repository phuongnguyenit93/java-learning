  - question: Vì sao đủ votes không sửa được merge conflict và nhóm cần xác minh điều gì sau khi resolve?
    answer: Reviewer approval đánh giá proposal còn Git conflict xảy ra khi các thay đổi không thể tự kết hợp ở target. Cần giải quyết nội dung file với hiểu biết nghiệp vụ, cập nhật source revision và chạy lại tests/validation tương ứng; thêm approvals không thể chọn hộ một nhánh logic. Sau khi resolve, reviewer phải xem diff cuối cùng và policy state vì mã đã thay đổi so với lúc ban đầu được duyệt.
