  - question: Nhóm có tài liệu cũ hướng dẫn tạo Azure DevOps public project. Bạn xử lý yêu cầu đó trong năm 2026–2027 thế nào?
    answer: "Cần xác minh thời điểm và sản phẩm thay vì làm theo hướng dẫn cũ: từ tháng 4/2026, Azure DevOps Services đã ngừng hỗ trợ tạo public project mới theo cách thông thường và các public project còn lại dự kiến chuyển sang private trong năm 2027. Microsoft Learn vẫn mô tả ngoại lệ legacy cho organization đã bật sẵn chính sách Allow public project, không phải quyền tự bật mới cho mọi organization; cần kiểm tra tình trạng thực tế thay vì hứa tạo được. Nhóm phải lập kế hoạch truy cập và chia sẻ mã phù hợp, rà liên kết công khai và đối tượng bên ngoài bị ảnh hưởng; không dùng bypass permission để tái tạo hành vi đã ngừng hỗ trợ."
