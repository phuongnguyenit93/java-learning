  - question: Chọn đường đóng góp cho developer có quyền ghi và contractor chỉ có fork, đồng thời giữ một chuẩn nghiệm thu.
    answer: Developer có quyền Create branches/Contribute ở checkout-api có thể dùng feature branch trong repo chung; contractor không có quyền upstream viết trên fork có thể truy cập rồi tạo PR vào target. Dù source khác nhau, cả hai phải cung cấp diff, mô tả/test và chịu branch policies của target; quyền fork không vượt được review bắt buộc. Hãy đối chiếu source endpoints và danh tính reviewer để bảo đảm đội không bỏ sót bằng chứng do có hai đường đóng góp.
