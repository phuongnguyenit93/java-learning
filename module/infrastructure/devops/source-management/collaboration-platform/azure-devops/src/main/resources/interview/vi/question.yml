  - question: Giải thích vì sao Allow trực tiếp chưa chắc thắng Deny đến từ group và cách xử lý không tạo lỗ hổng.
    answer: Effective rights được tổng hợp từ các quyền và membership phù hợp tại scope. Deny của một group ở cùng phạm vi có thể khiến thao tác vẫn thất bại dù cá nhân được Allow; riêng các ngoại lệ và mức inheritance phải đối chiếu theo effective permission thực tế. Đừng thêm Allow ngẫu nhiên hoặc trao admin toàn cục; tìm group cấp Deny, lý do kiểm soát và giới hạn scope cần sửa, sau đó thử lại đúng thao tác bị chặn.
