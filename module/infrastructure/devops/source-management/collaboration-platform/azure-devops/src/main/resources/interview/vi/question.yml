  - question: Vì sao chính sách minimum two reviewers có thể vẫn thiếu phiếu khi tác giả cũng chọn Approve?
    answer: "Một số policy loại vote của tác giả hoặc yêu cầu người duyệt đủ điều kiện độc lập. Hai phiếu hiển thị không đồng nghĩa có hai approvals được tính: nếu An vừa là author vừa vote, phiếu đó không đáp ứng ngưỡng đang loại self-approval. Để xác minh, mở policy và danh sách reviewer được tính tại revision hiện tại; cần thêm người đủ điều kiện thay vì chỉnh quyền tác giả hay tắt policy."
