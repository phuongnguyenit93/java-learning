  - question: Giải thích PR là một đề xuất chứ không phải lệnh cập nhật target và cách kiểm tra source/target chính xác.
    answer: Pull Request nối một branch hoặc repository nguồn với branch hoặc repository đích cụ thể. Nó cho reviewer xem diff, ngữ cảnh, comments và validation trước khi thay đổi được đưa vào target. Hai repository đều có thể có nhánh main nên tên branch đơn lẻ không đủ; cần kiểm tra cả cặp endpoint, commit mới nhất và target policies. Tạo PR hoặc nhận một phiếu Approve không tự cập nhật nhánh đích.
