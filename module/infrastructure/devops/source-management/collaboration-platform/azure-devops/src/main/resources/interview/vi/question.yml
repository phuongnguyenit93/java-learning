  - question: Tại sao resolve comment thread không phải bằng chứng rằng một bug null handling đã được sửa?
    answer: Thread là hồ sơ trao đổi; nút Resolve chỉ thay trạng thái thảo luận, không chạy code. Sau khi tác giả push commit mới, reviewer cần xem diff mới, tái hiện đường null có liên quan và đối chiếu kết quả test; khi concern được giải quyết mới resolve. Nếu reviewer resolve chỉ để bảng PR trông sạch, nhóm mất khả năng nhận diện rủi ro còn tồn tại và khó truy vết lý do chấp thuận.
