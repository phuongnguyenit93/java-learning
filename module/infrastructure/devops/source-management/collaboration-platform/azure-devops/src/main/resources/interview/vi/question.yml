  - question: Vì sao PR Completed, code đã vào main mà Bug 104 vẫn Active không nhất thiết là mâu thuẫn?
    answer: Completion trong Azure Repos chứng minh một proposal đã tích hợp vào target; trạng thái Bug 104 thuộc quy trình Azure Boards và có thể có bước kiểm thử, xác nhận hoặc transition riêng. Một số automation có thể liên kết/trạng thái theo cấu hình nhưng không phải mọi team đều tự động đóng bug khi merge. Hãy xác minh target revision, linked work item và acceptance evidence trước khi đổi trạng thái, tránh coi merge như bằng chứng deploy hoặc fix nghiệp vụ thành công.
