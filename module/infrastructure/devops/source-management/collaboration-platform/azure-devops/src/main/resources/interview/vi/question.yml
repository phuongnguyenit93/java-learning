  - question: Phân biệt Not set và Deny khi đánh giá quyền Read được kế thừa qua nhiều nhóm.
    answer: Not set nghĩa là entry đó chưa cấp hoặc chặn quyền; nó không phủ nhận một Allow từ Readers hay scope cha. Deny là ràng buộc phủ định có thể tác động lên quyền hiệu lực theo quy tắc scope. Vì vậy chỉ nhìn một dòng quyền cá nhân không đủ kết luận người đó không clone được. Hãy đọc effective permissions cùng đường membership và inheritance để giải thích vì sao thực tế đọc được hoặc bị chặn.
