  - question: Khi nào tạo feature branch trong repository chung và khi nào cần fork để đóng góp?
    answer: Người đã có quyền tạo branch và Contribute trên repository thường có thể làm việc với branch ngắn hạn rồi mở PR vào target. Contractor hoặc contributor không có quyền ghi upstream dùng fork riêng, chia sẻ source qua PR và vẫn chịu policies của target upstream. Quyết định dựa vào quyền, tổ chức review và chi phí đồng bộ, không dựa vào quan niệm fork tự bỏ qua kiểm soát hoặc nhánh feature luôn an toàn hơn.
