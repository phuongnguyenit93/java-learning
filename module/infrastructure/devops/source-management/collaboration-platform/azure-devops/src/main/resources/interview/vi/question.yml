  - question: Phân tích vì sao một người đọc và push được code nhưng vẫn không thể tạo repository mới.
    answer: Quyền Git được đánh giá theo thao tác và phạm vi. Read hoặc Contribute trên checkout-api không tương đương quyền Create repository ở cấp project, cũng không tự cấp Manage permissions hay Edit policies. Khi gặp lỗi, xác định thao tác chính xác, project đích, các group mà người đó thuộc về và effective permission; chỉ cấp quyền tối thiểu cần thiết. Nâng toàn bộ người dùng lên Project Administrators để giải quyết một lỗi Create repository là giải pháp dư quyền.
    aiGenerated: true
