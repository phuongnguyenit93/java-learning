  - question: PR đã Approved và không conflict, nhưng vừa thiếu work-item link vừa thiếu quyền Complete. Vì sao phải sửa hai nguyên nhân riêng?
    answer: Work-item linking là yêu cầu traceability của branch policy; quyền Complete là authorization của người thao tác trên target. Một link Bug hợp lệ không cấp quyền cho actor, và nâng quyền actor cũng không thay thế metadata PR bị thiếu. Để chẩn đoán đúng, xem lỗi Policies, đối chiếu effective target permission rồi giải quyết từng lớp với người sở hữu thích hợp. Không dùng bypass hay thêm approval để che hai blocker độc lập.
