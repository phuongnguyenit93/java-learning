  - question: "So sánh Draft và Ready: điều gì thay đổi, điều gì vẫn phải được chứng minh trước khi merge?"
    answer: Draft báo rằng tác giả đang cần phản hồi sớm nhưng chưa tuyên bố sẵn cho review chính thức; Ready kích hoạt luồng mời reviewer tương ứng, không biến test còn thiếu thành test đã chạy. Ngay cả PR Ready, reviewer vẫn cần xem diff, mô tả, test evidence, policy và quyền actor trước khi Complete. Đổi trạng thái để né gate sẽ gây hiểu nhầm rằng độ chín của code được xác nhận bởi một nút giao diện.
