  - question: Một optional security scan fail nhưng required build pass. Khi nào PR có thể Complete và rủi ro gì vẫn cần xử lý?
    answer: "Optional check có thể cảnh báo mà không tự khóa completion; required policy fail mới là một gate bắt buộc, nhưng nhóm vẫn phải kiểm các yêu cầu khác và quyền actor. Vì vậy PR có thể kỹ thuật đủ điều kiện hoàn tất mà vẫn chứa cảnh báo security cần đánh giá hoặc có ngoại lệ được phê duyệt. Đừng xoá optional warning khỏi báo cáo chỉ vì UI cho phép Complete: reviewer phải ghi nhận rủi ro và quyết định phù hợp."
