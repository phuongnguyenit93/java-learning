  - question: Phân biệt bypass policies when completing PR và bypass policies when pushing. Sai lầm vận hành thường gặp là gì?
    answer: Bypass ở lúc Complete cho phép actor đủ quyền vượt một số điều kiện khi hoàn tất PR theo quy trình ngoại lệ; bypass khi push liên quan đến việc cập nhật trực tiếp branch bị bảo vệ. Đây là các quyền riêng, không suy được quyền thứ hai từ quyền thứ nhất. Trong sự cố khẩn cấp phải xác minh ai được phép làm gì, ghi lý do ngoại lệ và kiểm tra lại target history; dùng bypass như giải pháp cho lỗi policy chưa được chẩn đoán là rất nguy hiểm.
