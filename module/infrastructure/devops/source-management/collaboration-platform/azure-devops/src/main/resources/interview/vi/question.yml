  - question: PR có đủ optional Approve nhưng required reviewer chọn Wait for author. Nhóm nên xử lý ra sao?
    answer: Optional votes không thay cho approval của reviewer bắt buộc đối với đường dẫn hoặc nhánh đang được bảo vệ. Wait for author báo cần bổ sung giải thích, sửa code hoặc test rồi đánh giá lại; thêm người duyệt không đúng vai trò không đáp ứng gate. Hãy ghi rõ feedback của required reviewer, cập nhật revision và chứng cứ, mời họ re-review rồi xem target policy thực tế đã xanh chưa, thay vì bỏ chọn rule để hợp thức hóa merge.
