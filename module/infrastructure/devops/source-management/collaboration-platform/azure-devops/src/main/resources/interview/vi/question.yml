  - question: Vì sao cặp repository/branch nguồn và đích quan trọng hơn tên branch khi review PR từ fork?
    answer: Một fork và upstream đều có thể có main nhưng hai tên đó không chỉ cùng commit hay cùng tập quyền. PR phải xác định chính xác repository nguồn, source revision, repository đích và target branch; nếu chọn nhầm target, reviewer có thể duyệt đúng diff nhưng tích hợp vào sai dòng phát hành. Trước khi Ready/Complete, đối chiếu endpoints, quyền đọc fork và các policies hiện hành trên destination.
