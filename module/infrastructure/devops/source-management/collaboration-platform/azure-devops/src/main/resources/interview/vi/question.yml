  - question: Vì sao PR đã được Approve vẫn có thể không Complete và nhóm nên dùng bằng chứng nào để chẩn đoán?
    answer: Reviewer vote là một loại bằng chứng, còn branch policy có thể yêu cầu build validation, reviewer cụ thể, liên kết work item hoặc kiểm tra khác. Một required build đang fail vẫn chặn complete thông thường dù đủ phiếu; ngược lại build xanh chưa chứng minh quyền hoàn tất của actor. Hãy mở trạng thái Policies và lỗi validation tại đúng target, kiểm tra quyền hiệu lực và xung đột thay vì thêm approval hoặc bypass một cách mù quáng.
