  - question: Vì sao không nên khẳng định Deny luôn thắng hoặc branch Allow luôn thắng nếu chưa đọc phạm vi áp quyền?
    answer: Repository và branch có phạm vi permission khác nhau; inherited entries, direct entries và các quy tắc specificity cần được kết hợp trước khi suy ra quyền hiệu lực. Một log push bị denied trên main không chứng minh quyền Contribute ở feature cũng bị chặn. Hãy so sánh branch và repository cụ thể trong Security UI, kiểm tra group memberships rồi thử một thao tác được phép ở nhánh thử nghiệm để khoanh vùng nguyên nhân mà không làm yếu bảo vệ main.
