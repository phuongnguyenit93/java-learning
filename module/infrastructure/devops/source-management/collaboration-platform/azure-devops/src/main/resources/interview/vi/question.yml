  - question: Vì sao commit Git trên máy chưa phải bằng chứng rằng nhóm đã review hoặc chấp nhận thay đổi trong Azure Repos?
    answer: "Git ghi snapshot và lịch sử cục bộ ngay cả khi offline, nhưng người khác chưa chắc đọc được commit đó. Sau khi chia sẻ branch lên repository có quyền truy cập phù hợp, tác giả mới mở PR nhắm đúng target để lấy phiếu, thảo luận và chạy checks. Cần phân biệt bốn mốc: recorded tại local, shared trên remote, reviewed trong PR và accepted khi commit đã tích hợp vào target; không được suy một mốc từ mốc trước."
