  - question: Set auto-complete giúp gì và không thể giải quyết những blocker nào?
    answer: Auto-complete chỉ ghi ý định thực hiện completion khi các điều kiện trên target đạt và actor có quyền tương ứng. Nó không sửa failing build, không tạo work-item link, không chọn cách resolve conflict, không cấp quyền và không biến reviewer Wait for author thành approval. Nếu PR đứng chờ lâu, đọc policy status, quyền và validation logs, xử lý từng blocker rồi quan sát điều kiện hoàn tất thay vì bật lại auto-complete liên tục.
