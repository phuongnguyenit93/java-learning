  - question: Khi nào nên tách nhiều Azure DevOps projects trong một organization thay vì gom mọi thứ vào một repository?
    answer: "Organization là ranh giới quản trị rộng; project gom dịch vụ, thành viên và quyền theo một sản phẩm hay nhóm; mỗi project có thể có nhiều Git repositories với lịch sử riêng. Tách Warehouse và Checkout thành projects phù hợp khi nhu cầu truy cập, governance và bối cảnh công việc thực sự khác nhau. Tránh tạo project chỉ để chứa từng branch hoặc coi repository như một organization: điều đó làm quyền khó theo dõi mà không tăng tính rõ ràng."
