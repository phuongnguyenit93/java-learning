  - question: Trình bày sơ đồ organization/project/repository khi điều tra một lỗi giữa nhiều nhóm trên Azure DevOps.
    answer: Bắt đầu ở organization chứa tài khoản và tập projects, xác định project có dịch vụ/nhóm chịu trách nhiệm rồi repository lưu source và branch cụ thể. Với RetailCo/Checkout/checkout-api, thông tin quyền cần tra tại scope tương ứng; Bug trong Boards và policy của main liên quan nhưng không phải cùng đối tượng. Sơ đồ đúng giúp phân biệt ai sở hữu bối cảnh nghiệp vụ, ai có quyền đọc source và nơi PR cần được review.
