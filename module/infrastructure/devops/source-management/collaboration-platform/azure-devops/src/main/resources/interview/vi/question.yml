  - question: Khác nhau giữa Wait for author và Reject khi reviewer muốn tác giả bổ sung security test?
    answer: Wait for author nêu rõ cần sửa hoặc giải thích trước khi xem xét lại; Reject biểu thị phản đối đề xuất hiện tại và có thể mang ý nghĩa mạnh hơn trong chính sách review. Với required reviewer, Wait for author có thể giữ PR không đủ điều kiện đến khi feedback được xử lý và có vote hợp lệ. Tác giả nên bổ sung test, cập nhật diff và mời re-review, không tự động hiểu đây là yêu cầu đóng PR vĩnh viễn.
