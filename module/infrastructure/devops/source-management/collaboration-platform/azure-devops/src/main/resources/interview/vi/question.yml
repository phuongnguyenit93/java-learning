  - question: So sánh access level với security permission khi người dùng mở Boards được nhưng clone repository bị từ chối.
    answer: Access level quyết định tập tính năng mà tài khoản được hưởng; security permission quyết định thao tác cụ thể trên project, repository và branch. Một người có giao diện Boards không đồng nghĩa có quyền Read trên checkout-api. Khi troubleshoot, xác nhận entitlement, membership và effective Read/Deny đúng resource trước khi thay role. Tách hai lớp này giúp không nhầm lỗi license/tính năng với lỗi Git ACL.
