  - question: Một fork cho phép push tự do nhưng PR vào upstream main bị policy chặn. Bạn giải thích và xử lý thế nào?
    answer: Fork có quyền và lịch sử của nó; PR lại hướng tới upstream/main nên merge-readiness dựa vào branch policies, reviewers và checks của target đó. Cho thêm quyền push trên fork không giải quyết thiếu hai approvals ở upstream. Cần kiểm tra source/target endpoints, đọc thông báo policy, bổ sung bằng chứng hoặc review hợp lệ, và chỉ xét bypass khi có quyền và quy trình phê duyệt ngoại lệ rõ ràng.
