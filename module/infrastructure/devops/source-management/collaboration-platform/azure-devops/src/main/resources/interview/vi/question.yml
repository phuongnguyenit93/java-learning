  - question: Tại sao project Private không tự trả lời được câu hỏi ai có thể đọc repository bên trong?
    answer: Private giới hạn đối tượng có thể tiếp cận project, nhưng khả năng clone checkout-api còn phụ thuộc danh tính, membership, access level và quyền Read hiệu lực tại repository. Người ở nhóm Readers có thể được đọc diff nhưng không vì vậy mà được Contribute; người ngoài không tự có quyền chỉ vì biết URL. Trước khi mở rộng visibility, hãy kiểm tra nhánh cấp quyền hiện tại và nhu cầu truy cập của từng vai trò để giữ nguyên nguyên tắc ít quyền nhất.
