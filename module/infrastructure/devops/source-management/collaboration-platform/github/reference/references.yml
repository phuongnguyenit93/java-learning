# ============================================================
# MODULE REFERENCE STRUCTURE
# ============================================================
#
# This is the shared module-level reference catalog.
# It is intentionally not split by MODULE_LANGUAGE.
#
# Example structure:
#
# references:
#   - title: "Java Language Specification"
#     url: "https://docs.oracle.com/javase/specs/"
#     description: "Official Java language specification."
#
# Add only curated references that are useful for the module.
# The build system must not overwrite this file after authored content exists.

references:
  - title: "About repositories"
    url: "https://docs.github.com/en/repositories/creating-and-managing-repositories/about-repositories"
    description: "Official introduction to GitHub repository hosting, ownership, visibility, and collaboration."
  - title: "Forks"
    url: "https://docs.github.com/en/pull-requests/reference/forks"
    description: "Explains fork and upstream relationships, permissions, visibility, and contribution boundaries."
  - title: "Pull requests"
    url: "https://docs.github.com/en/pull-requests/reference/pull-requests"
    description: "Explains pull request lifecycle, drafts, collaboration models, and review context."
  - title: "Pull request reviews"
    url: "https://docs.github.com/en/pull-requests/reference/pull-request-reviews"
    description: "Official guide to review feedback, approvals, requested changes, and reviewer assignment."
  - title: "Repository roles for an organization"
    url: "https://docs.github.com/en/organizations/managing-user-access-to-your-organizations-repositories/managing-repository-roles/repository-roles-for-an-organization"
    description: "Defines repository access levels and responsibilities for organization members and collaborators."
  - title: "About organization teams"
    url: "https://docs.github.com/en/organizations/organizing-members-into-teams/about-teams"
    description: "Explains organization teams, team repository permissions, and team-based review requests."
  - title: "About code owners"
    url: "https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners"
    description: "Documents CODEOWNERS routing, draft pull request exceptions, and when repository protection can make owner approval mandatory."
  - title: "About protected branches"
    url: "https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches"
    description: "Explains GitHub's protected-branch rules, applicable matching behavior, review requirements, and enforcement conditions."
  - title: "About rulesets"
    url: "https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets"
    description: "Introduces repository rulesets and their role in enforcing branch and tag protections."
  - title: "About issues"
    url: "https://docs.github.com/en/issues/tracking-your-work-with-issues/learning-about-issues/about-issues"
    description: "Covers repository issues as a place to discuss, assign, organize, and track work."
  - title: "About releases"
    url: "https://docs.github.com/en/repositories/releasing-projects-on-github/about-releases"
    description: "Explains GitHub Releases, tag relationships, release notes, and downloadable assets."
