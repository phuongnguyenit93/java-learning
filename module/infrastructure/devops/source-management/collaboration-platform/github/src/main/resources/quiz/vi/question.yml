questions:
  - id: "github-01-01"
    question: "Git đã quản lý được mã; GitHub bổ sung giá trị gì rõ nhất cho nhóm?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-github-foundations.md"
      anchor: "github-as-hosting-platform"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Trình xem lịch sử Git từ xa với refs nhánh nhưng không có hồ sơ review chính thức."
        explanation: "Ghi commit không đồng nghĩa đã có quyết định review hợp lệ."
      - id: B
        answer: "Trình quản lý Issue và thảo luận điều phối mã mà không lưu lịch sử Git."
        explanation: "Issues hỗ trợ trao đổi nhưng không thay lịch sử mã hay review PR."
      - id: C
        answer: "Repository Git được lưu trữ kèm pull request, phân quyền và dấu vết review."
        explanation: "GitHub bổ sung công cụ cộng tác trên lịch sử Git chứ không thay cơ chế quản lý phiên bản."
      - id: D
        answer: "Workflow Actions bắt buộc triển khai mỗi thay đổi mã được tiếp nhận."
        explanation: "Triển khai thuộc quy trình khác và không tự phát sinh từ việc lưu repository."
    correctAnswerId: C

