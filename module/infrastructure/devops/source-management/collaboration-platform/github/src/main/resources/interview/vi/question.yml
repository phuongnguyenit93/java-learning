  - question: "Khi chuyển repository cá nhân sang organization, bạn thiết kế việc rà soát quyền và chính sách thế nào mà không chạm lịch sử Git?"
    answer: "Đầu tiên xác nhận owner mới và danh sách collaborator/team, vì namespace mới có hệ thống quyền và chính sách organization khác. So sánh người nào giữ Read/Write/Admin, các rulesets áp dụng, CODEOWNERS/team review, webhook/integration và remotes. Việc chuyển chủ thể không mặc nhiên thay commit graph hay default branch, nên không cần rewrite SHA. Một reviewer bên ngoài có thể tiếp tục là outside collaborator được cấp trên repo thay vì biến thành thành viên organization. Tài liệu hóa những thay đổi thực tế và kiểm chứng một PR an toàn."
    aiGenerated: true
    reviewed: false
