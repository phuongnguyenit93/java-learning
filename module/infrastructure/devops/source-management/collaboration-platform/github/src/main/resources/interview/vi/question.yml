  - question: "Vì sao một PR đạt status checks vẫn cần reviewer hiểu nghiệp vụ, và làm sao review tránh lạc sang vấn đề không liên quan?"
    answer: "Các status checks xác nhận build, lint hay tests đã cấu hình; chúng có thể thiếu tình huống biên. Reviewer cần so expected behavior trong Issue với diff, test và ảnh hưởng bên cạnh: ví dụ thay công thức giảm giá có làm tròn âm sai hay không. Đọc logic tại path liên quan và thảo luận dựa trên input/output tái hiện được. Ghi nhận thay đổi ngoài scope rõ ràng, yêu cầu giải thích hoặc tách PR. Quyết định Approve dựa trên bằng chứng hiện tại, không dựa việc CI đã xanh."
