      methodSignature: ""
  - question: "GitHub Enterprise Cloud có Internal visibility. Vì sao không thể coi đây là Public hoặc chỉ thành viên organization chủ sở hữu được đọc?"
    answer: "Internal được thiết kế cho phạm vi thành viên enterprise; repository không mở cho mọi người trên Internet nhưng có thể được xem bởi thành viên của các organization khác trong cùng enterprise theo chính sách áp dụng. Outside collaborator nằm ngoài enterprise không tự nhận quyền chỉ vì được mời vào một organization. Public mở cho người dùng Internet, Private phụ thuộc cấp quyền hẹp hơn. Khi thiết kế kho chứa dữ liệu nhạy cảm, rà lại effective audience và chính sách của enterprise trước khi chọn Internal; đừng dùng Internal thay cơ chế chia nhóm bí mật."
    aiGenerated: true
    reviewed: false
