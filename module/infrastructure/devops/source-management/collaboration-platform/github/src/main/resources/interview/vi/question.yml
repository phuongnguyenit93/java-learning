questions:
  - question: "Giải thích GitHub bổ sung trách nhiệm nào trên Git và vì sao có commit không đủ chứng minh nhóm đã chấp nhận sửa lỗi."
    answer: "Git ghi cây đối tượng, commit, nhánh và quan hệ merge; các thao tác đó có thể chạy hoàn toàn local. GitHub lưu repository và thêm pull request, quyền truy cập, thảo luận, phiếu review cùng trạng thái check. Một commit chứng minh nội dung mã tại một revision, nhưng không trả lời ai đã đánh giá hay rule nào được thỏa. Khi kiểm toán, nối SHA nguồn với PR, review, quy tắc trên base và lịch sử target. Không suy diễn đã triển khai chỉ vì PR được merge."
    aiGenerated: true
