  - question: "Một người được gọi là contributor hoặc reviewer nhưng yêu cầu sửa Settings. Bạn sẽ giải thích nguyên tắc phân quyền nào?"
    answer: "Contributor hay requested reviewer mô tả sự tham gia, không tương đương role quản trị. Trong organization có Read, Triage, Write, Maintain, Admin và hạn chế bổ sung. Quyền push branch, request review, đổi branch protection hay quản lý repository là các thao tác khác nhau. Tôi lấy identity và operation cụ thể, xem effective role và rules của phạm vi tương ứng, rồi cấp quyền tối thiểu. Không nâng Admin chỉ vì một người từng review hoặc viết commit."
    aiGenerated: true
    reviewed: false
