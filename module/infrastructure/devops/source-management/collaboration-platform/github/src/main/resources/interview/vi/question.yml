  - question: "PR được Close without merge. Có thể suy ra gì về lịch sử Git, và bạn sẽ tiếp tục đề xuất sửa lỗi bằng cách nào?"
    answer: "Đóng PR không có merge chứng minh proposal không được chấp nhận vào base tại hành động đó; không có nghĩa branch/commit nguồn bị xóa. Kiểm source ref còn tồn tại không, lý do close và diff hiện hành. Có thể mở lại PR nếu được phép và đúng tình huống, hoặc tạo PR mới dùng commit phù hợp sau khi cập nhật code. Không nhầm Closed với Merged, không coi Release tag là bằng chứng code đã vào main."
