  - question: "Repository Public cho ai cũng đọc được: tại sao một người lạ vẫn không thể push main, và nên đóng góp bằng cách nào?"
    answer: "Visibility trả lời ai được xem hoặc clone mã, còn Write và branch protection trả lời ai được cập nhật ref. Người không có quyền push có thể fork public repository, tạo nhánh trong fork và mở PR đến upstream; owner đánh giá theo rules trên base. Ngay người có Write cũng có thể bị cấm push trực tiếp main bởi yêu cầu PR. Tôi tách kiểm tra visibility, membership, effective role và ruleset thay vì suy diễn từ khả năng đọc mã."
