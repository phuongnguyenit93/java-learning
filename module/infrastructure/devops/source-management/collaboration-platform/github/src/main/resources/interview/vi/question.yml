  - question: "Khi nào nên dùng Draft PR, và vì sao giữ Ready với prefix WIP không thay thế trạng thái đó?"
    answer: "Draft diễn đạt tác giả chưa sẵn sàng yêu cầu review chính thức hoặc merge: có thể thiếu tests, mô tả hoặc còn thiết kế. Chuyển Ready khi đã có diff, tiêu chí chấp nhận, kết quả kiểm thử có thể xem; GitHub có hành vi riêng như chưa tự yêu cầu code owners ở Draft. Prefix WIP chỉ là quy ước chữ trong branch/title, không phải trạng thái sản phẩm hay gate merge. Review sớm vẫn có thể diễn ra nhưng cần ghi rõ điểm còn thiếu để reviewer không hiểu nhầm."
