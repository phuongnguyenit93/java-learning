  - question: "Hai repository có tên giống nhau ở account cá nhân và organization. Ownership ảnh hưởng gì tới quyền và quy trình cộng tác?"
    answer: "Namespace của owner quyết định nơi repository được quản trị. Repo cá nhân thường gắn với chủ tài khoản và những collaborator được mời; repo organization có thể dùng team, role, quy tắc organization và ruleset cấp cao. Không suy ra quyền từ tên repo, người commit cuối hay người tạo PR. Khi chuyển repo sang organization, kiểm lại effective access, team grants, policy, tích hợp và URL/remote có liên quan; lịch sử SHA Git không tự bị viết lại vì đổi owner."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-github-foundations.md"
      anchor: "accounts-organizations-and-repository-context"
    apiRelated:
      controller: ""
