  - question: "Vì sao mở PR không đồng nghĩa merge, và bạn sẽ mô tả vòng đời proposal cho một người mới như thế nào?"
    answer: "Tạo PR chỉ đưa ra đề xuất head sang base và cho phép thảo luận diff. PR có thể ở Draft, Ready/Open, được yêu cầu sửa, có checks Pending/Failed, rồi Merged hoặc Closed without merge. Reviewer được mời chưa đồng nghĩa Approve; approvals cũng chưa đủ khi target có check hoặc hạn chế quyền riêng. Tôi kiểm PR timeline và lịch sử base để khẳng định đã tích hợp, không dùng việc mở PR hay push source làm bằng chứng nhận mã."
