  - question: "Reviewer yêu cầu xử lý đầu vào âm; tác giả push commit mới. Bạn quản lý re-review và stale approval thế nào?"
    answer: "Đầu tiên đối chiếu diff trước và sau commit, mô tả ca âm và chạy lại test liên quan. GitHub có thể dismiss stale reviews nếu policy bật; nếu không tự dismiss, reviewer vẫn cần đọc phần thay đổi trước khi tái xác nhận. Tôi kiểm required checks gắn với commit/test-merge phù hợp và reviewer hợp lệ trên base. Chỉ Resolve thread sau khi xác nhận concern đã được xử lý. Không coi phiếu trên SHA cũ hoặc test xanh cũ là chứng minh thay đổi mới đúng."
