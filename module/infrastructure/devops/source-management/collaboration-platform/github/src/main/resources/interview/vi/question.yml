  - question: "Giải thích head/base cho PR từ fork và hậu quả nếu người review chỉ nhìn tên branch."
    answer: "Khi PR từ fork, head là nhánh trong repository fork, base là nhánh trong upstream. Cùng tên main ở hai repo có thể trỏ đến SHA và code khác nhau. Tôi xem cặp owner/repo/branch của cả head lẫn base, diff hiện hành, chính sách repository đích và quyền reviewer. Nếu bỏ qua repo, nhóm có thể approve sai nguồn hoặc nhầm đích; quyền ghi tại fork không cấp quyền merge vào upstream. Mọi giới hạn bảo vệ vẫn áp dụng trên base thực tế."
