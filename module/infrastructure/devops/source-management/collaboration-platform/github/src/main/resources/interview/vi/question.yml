  - question: "Fork khác feature branch ở chỗ nào, và yếu tố nào quyết định chọn fork khi cộng tác với repository tổ chức?"
    answer: "Feature branch là ref trong cùng repository và dùng quyền ghi của repository đó; fork là repository riêng có quyền và namespace riêng, liên hệ với upstream. Người không có Write upstream có thể thay đổi fork, mở PR vào upstream; không vì sở hữu fork mà có quyền merge upstream. Chọn shared feature branch cho thành viên có quyền thuận tiện và fork cho contributor bị giới hạn access. Luôn kiểm source repo/branch, target repo/branch và policy bên nhận mã."
