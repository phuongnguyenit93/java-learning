  - question: "Một developer có Write trên repository nhưng main được bảo vệ. Hãy trình bày workflow tối thiểu giữ quyền và review."
    answer: "Developer tạo feature branch mình được ghi, commit thay đổi có phạm vi rõ, push branch và mở PR đến main. Reviewer xem diff và tests, required checks chạy, sau đó người có quyền merge hoàn tất PR theo base rules. Quyền Write để push feature không đồng nghĩa bypass main. Nếu PR chờ sửa, bổ sung commit vào head, thảo luận và re-review; không cấp Admin tạm chỉ để tránh các yêu cầu đã cấu hình. Xác nhận Merged và commit trên main trước khi thông báo code đã tích hợp."
