  - question: "Khi phỏng vấn, bạn phân biệt merge Git local với approve PR GitHub bằng ví dụ và cách kiểm chứng ra sao?"
    answer: "Tôi có thể tạo hai nhánh ở local, commit và chạy git merge khi offline; đối tượng kết quả là lịch sử Git, có thể không tồn tại PR. Approve là sự kiện đánh giá gắn với pull request trên GitHub, có reviewer, nội dung được xét và có thể bị dismiss khi mã đổi theo rule. Kiểm chứng Git bằng SHA và graph; kiểm chứng approve bằng review timeline của PR. Merge local không tự đáp ứng branch protection hay chứng minh một người khác đã chấp thuận."
    aiGenerated: true
