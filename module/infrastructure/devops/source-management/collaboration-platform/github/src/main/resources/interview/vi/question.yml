  - question: "Inline comment, submitted Approve review và resolved thread khác nhau ra sao trong bằng chứng acceptance?"
    answer: "Inline comment chỉ là ý kiến gắn vào đoạn diff và có thể được gửi mà chưa quyết định review. Một submitted Approve là phiếu rõ ràng của reviewer, có thể chịu tác động bởi nhánh/ruleset và commit mới. Resolved thread đánh dấu cuộc trao đổi đã xử lý, không tự gửi phiếu Approve hay chứng minh code đúng. Để biết sẵn sàng merge, xem trạng thái review được tính, required reviewers, threads theo rule và checks trên commit hiện tại; không lấy số lượng comment để suy ra đủ phiếu."
