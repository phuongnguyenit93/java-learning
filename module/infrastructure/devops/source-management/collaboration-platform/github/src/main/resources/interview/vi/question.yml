  - question: "Việc đổi default branch từ main sang stable tác động gì tới điều hướng và PR, còn điều gì không tự đổi?"
    answer: "Default branch ảnh hưởng branch hiển thị trên Code tab và base thường được gợi ý khi mở PR mới; một số automation và README links có thể giả định nhánh mặc định. Tôi kiểm tra PR đang mở, rules trên stable, code owner từ base và integration references. Đổi setting không tự chứng minh deployment, không biến review request thành Approve và không cấp Admin cho người sửa stable. Cần thông báo nhóm về target mới và kiểm tra automation theo revision thực."
