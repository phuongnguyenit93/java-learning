  - question: "Một sửa lỗi làm tròn có unit test xanh nhưng không có dấu vết review; bạn đánh giá rủi ro và thiết kế lại luồng chấp nhận như thế nào?"
    answer: "Test xanh chỉ chứng minh bộ ca kiểm thử đã cấu hình chạy đạt; có thể thiếu các số tiền biên hoặc quy tắc nghiệp vụ. Yêu cầu PR mô tả expected/observed, diff, kiểm chứng và người có chuyên môn thuế. Reviewer đối chiếu ca tiền lẻ, để lại câu hỏi theo dòng, xác nhận lại sau commit sửa. Nhánh đích có thể yêu cầu review và check. Lưu phiếu review và record Merged để giải thích quyết định, đồng thời theo dõi release/deployment riêng."
    aiGenerated: true
    reviewed: false
