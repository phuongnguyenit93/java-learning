  - question: "Bạn review PR từ fork có cả hai bên đều gọi main. Làm sao tránh nhầm source và target, và lỗi nào vẫn có thể xảy ra dù CI xanh?"
    answer: "Cần ghi rõ owner/repo/branch của head và base, SHA quan trọng và diff nguồn→đích. Một commit ở fork không tự nằm trong upstream. CI xanh chỉ phản ánh tests đã cấu hình, chưa chứng minh diff đúng scope hay target phù hợp. Reviewer kiểm thay đổi ngoài yêu cầu và rule/reviewer của upstream base. Nếu mục tiêu sai, sửa base hoặc tạo lại proposal hợp lệ, rồi chạy lại review/check cần thiết; không merge chỉ vì tên branch trùng."
