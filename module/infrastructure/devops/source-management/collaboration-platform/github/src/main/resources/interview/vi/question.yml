  - question: "PR thêm tệp mới nhưng bạn không thấy trên main. Trình bày cách dùng head/base để kiểm tra đề xuất và rủi ro chọn nhầm đích."
    answer: "Head là nhánh/repository mang thay đổi được đề xuất; base là nhánh/repository dự kiến nhận. Trước merge, tab Code ở main không nhất thiết chứa tệp chỉ có tại head. Tôi kiểm tra cả tên repository và branch của mỗi đầu, xem Files changed, revision mới nhất, rồi đối chiếu base hiện hành. PR từ fork càng cần nhận diện repo vì hai bên có thể cùng tên nhánh. Đổi base thay đổi phép so sánh và có thể thay người review/rules cần đạt."
    aiGenerated: true
    reviewed: false
