  - question: "Why does opening a PR not equal merging, and how would you explain the proposal lifecycle?"
    answer: "Opening a PR creates a head-to-base proposal and a review surface; it does not update the destination. A PR may be Draft or Ready, gather feedback, fail or pass checks, and eventually be Merged or Closed without merge. A requested reviewer has not necessarily approved; enough votes may still leave a required check or permission blocker. To prove acceptance, inspect the merged PR and destination history rather than relying on PR creation or source pushes."
