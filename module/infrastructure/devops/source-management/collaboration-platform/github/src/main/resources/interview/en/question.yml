    answer: "Public visibility grants source discovery and reading, not authorization to update refs. An outsider may fork the public repository, commit to a branch in the fork and propose an upstream PR; the receiving base enforces its own review policies. Even a user with repository Write may be unable to push directly to protected main. Diagnose visibility, membership, effective role and target protections as separate factors."
