  - question: "A rounding fix passes unit tests but has no review trail. How would you assess the risk and redesign acceptance?"
    answer: "Green tests establish only that configured cases passed, potentially missing monetary edge cases or business expectations. Request a PR with expected versus observed behavior, a scoped diff, reproducible evidence and an informed reviewer. Have the reviewer challenge fractional inputs and reread changes after fixes. Require appropriate base-branch review and checks, then retain the review votes and merged record. Keep deployment evidence separate from the decision to accept source."
