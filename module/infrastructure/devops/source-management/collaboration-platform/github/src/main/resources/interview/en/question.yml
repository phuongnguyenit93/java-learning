  - question: "Two repositories share a name under a personal account and an organization. What governance differences matter?"
    answer: "The owner namespace determines the administration context. Personal repositories are managed through the account and invited collaborators, whereas organization repositories can apply teams, repository roles, organization rules and enterprise controls. Similar names, last commit authors and reviewer lists do not establish ownership. After transferring ownership, check effective access, team grants, rulesets and affected integrations or remotes. Moving a repository into an organization does not itself rewrite Git commit SHAs."
