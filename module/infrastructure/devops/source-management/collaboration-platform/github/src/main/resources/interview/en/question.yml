    answer: "Create a writable feature branch, commit scoped changes, push it and open a PR targeting main. Reviewers assess the diff and tests, required checks run, and an authorized actor merges under the base rules. Write to a feature branch does not imply permission to bypass main. When feedback arrives, update head and request re-review. Avoid temporary Admin elevation simply to evade checks. Confirm the Merged record and target commit before reporting source integration."
