  - question: "A new file exists in a PR but not in main. Explain head/base diagnosis and the risk of a wrong target."
    answer: "The head repository and branch supply the proposed changes; the base identifies the destination. Before merging, main need not contain files visible only in head. I verify both repository and branch for each endpoint, inspect Files changed and relevant SHAs, and compare against the current base. Fork PRs especially require full endpoint identities because both repos may use the same branch name. A wrong base changes the diff, applicable policies and sometimes reviewer routing."
