  - question: "A PR was closed without merging. What happened to Git history, and how could the change be proposed again?"
    answer: "Closing without merge records that the proposal was not integrated into its base by that action. It does not inherently delete the source branch or erase its commits. Inspect the reason for closure, surviving refs and whether the diff is still relevant. Reopen when supported and appropriate, or create a corrected PR from existing commits. Do not mistake Closed for Merged, nor use a release tag as proof the target received the code."
