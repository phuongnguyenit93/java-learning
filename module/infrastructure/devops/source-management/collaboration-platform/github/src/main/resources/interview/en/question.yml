    answer: "GitHub uses the CODEOWNERS file at a supported location on the pull request’s base branch to resolve path owners. Head-only changes are part of the proposal and do not redefine existing base routing. Verify the matching path, eligible user or team, and required Write access. Draft PRs may delay automatic owner requests until Ready. To change ownership policy, integrate the CODEOWNERS update into the base under its own governance and verify future PR routing rather than assuming a feature commit changed the current gate."
