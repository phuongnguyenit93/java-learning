  - question: "How is a fork different from a feature branch, and when should a team use each?"
    answer: "A feature branch is a ref within an existing repository and follows that repository’s write permissions. A fork is a separate repository with its own access and an upstream relationship. Contributors lacking upstream Write can commit in their fork and propose PRs, but owning the fork does not confer upstream merge rights. Use shared branches for authorized team members and forks when isolation or limited access suits the contributor. Verify both endpoints and destination rules."
