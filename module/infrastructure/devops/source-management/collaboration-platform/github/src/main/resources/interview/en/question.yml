  - question: "How would you contrast a local Git merge with a GitHub PR approval, including verification evidence?"
    answer: "I can commit two local branches and merge them offline; that produces Git history even if no hosted pull request exists. An Approve vote is GitHub review metadata tied to a proposed diff, a reviewer and the PR lifecycle; policies may dismiss it after new commits. I inspect SHAs and the commit graph for the local merge, but inspect PR timeline and review state for approval. Neither local merging nor pushing itself satisfies protected-branch governance."
