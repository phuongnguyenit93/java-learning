  - question: "Explain head/base for a fork PR and what can go wrong when reviewers read only branch names."
    answer: "For a fork pull request, head belongs to the contributor’s fork and base belongs to the upstream repository. Two branches both named main can represent unrelated commits. I inspect owner/repository/branch on both sides, the current comparison, the destination policies and reviewer eligibility. Ignoring the repository identity can lead to reviewing the wrong source or target. Write access to a fork does not grant merge authority over protected upstream branches."
