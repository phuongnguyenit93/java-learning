  - question: "A person called a contributor or reviewer asks to modify Settings. How should their authorization be evaluated?"
    answer: "Contributor and requested reviewer describe participation, not an administrator grant. Organization repositories support roles such as Read, Triage, Write, Maintain and Admin, with further policy restrictions. Pushing a branch, reviewing a PR and editing branch protections are different operations. I identify the actor and exact operation, inspect effective repository permissions and matching rules, and grant only what that operation requires. Prior commits or review assignments do not justify Admin access."
