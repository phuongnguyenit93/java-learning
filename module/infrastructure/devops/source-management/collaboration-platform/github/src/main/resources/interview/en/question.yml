    answer: "Internal is scoped to members of the GitHub enterprise, potentially including people from other organizations within that enterprise under its governance rules. It is not public Internet access, and an outside collaborator is not automatically an enterprise member. Public repositories are broadly readable, while Private restricts access to granted identities. Before using Internal for sensitive source, evaluate the enterprise-wide audience and enterprise policies, not merely the membership list of the owning organization."
