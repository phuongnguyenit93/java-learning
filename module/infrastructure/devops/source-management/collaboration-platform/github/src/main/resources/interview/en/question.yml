  - question: "When should a PR be Draft, and why is a WIP prefix not equivalent to the Draft state?"
    answer: "Use Draft when the author has not completed implementation, tests or review context and should not signal merge readiness. Mark Ready once the diff, acceptance criteria and test evidence can be evaluated; GitHub treats Draft specially, including delaying automatic code-owner review requests. A WIP prefix is only text in a title or branch name, not the product state or its merge behavior. Early discussion is welcome as long as the unfinished work remains explicit."
