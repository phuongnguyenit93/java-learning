questions:
  - question: "Explain which responsibilities GitHub adds to Git and why a commit cannot prove team acceptance."
    answer: "Git stores commits, trees, refs and merge history, including in a purely local repository. GitHub hosts that history and adds pull requests, access grants, discussions, review decisions and required checks. A commit establishes what code exists at a revision, not who approved its behavior or which target rules passed. For an audit, connect the source SHA with a PR, its review evidence, applicable base rules and target history. Even a merged PR does not establish deployment."
