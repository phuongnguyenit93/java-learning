# ============================================================
# MODULE REFERENCE STRUCTURE
# ============================================================
#
# This is the shared module-level reference catalog.
# It is intentionally not split by MODULE_LANGUAGE.
#
# Example structure:
#
# references:
#   - title: "Java Language Specification"
#     url: "https://docs.oracle.com/javase/specs/"
#     description: "Official Java language specification."
#
# Add only curated references that are useful for the module.
# The build system must not overwrite this file after authored content exists.

references:
  - title: "Manage projects"
    url: "https://docs.gitlab.com/user/project/working_with_projects/"
    description: "Official overview of GitLab projects, repository-facing settings, ownership, and project management."
  - title: "Groups"
    url: "https://docs.gitlab.com/user/group/"
    description: "Explains group and subgroup organization, common project ownership, and shared collaboration."
  - title: "Project and group visibility"
    url: "https://docs.gitlab.com/user/public_access/"
    description: "Official guide to public, private, and internal access, including why internal visibility applies to Self-Managed/Dedicated rather than new GitLab.com projects."
  - title: "Roles and permissions"
    url: "https://docs.gitlab.com/user/permissions/"
    description: "Defines GitLab roles and their capabilities across projects and groups."
  - title: "Members of a project"
    url: "https://docs.gitlab.com/user/project/members/"
    description: "Explains direct, inherited, and shared project membership and where access is managed."
  - title: "Merge requests"
    url: "https://docs.gitlab.com/user/project/merge_requests/"
    description: "Introduces proposing, discussing, assigning, and merging source changes through merge requests."
  - title: "Merge request reviews"
    url: "https://docs.gitlab.com/user/project/merge_requests/reviews/"
    description: "Describes reviewer feedback, discussion, approval, and requests for changes."
  - title: "Merge request approval rules"
    url: "https://docs.gitlab.com/user/project/merge_requests/approvals/rules/"
    description: "Explains configurable approval requirements and tier-dependent reviewer eligibility."
  - title: "Protected branches"
    url: "https://docs.gitlab.com/user/project/repository/branches/protected/"
    description: "Explains branch push/merge permissions, branch protections, and associated approval controls."
  - title: "Protection rules and permissions"
    url: "https://docs.gitlab.com/user/project/repository/branches/protection_rules/"
    description: "Documents how overlapping GitLab branch rules combine push/merge permissions and Code Owner approval requirements."
  - title: "Issues"
    url: "https://docs.gitlab.com/user/project/issues/"
    description: "Introduces issue collaboration and linking work to merge requests."
  - title: "Releases"
    url: "https://docs.gitlab.com/user/project/releases/"
    description: "Explains GitLab Releases, tag associations, release notes, and downloadable release assets."
