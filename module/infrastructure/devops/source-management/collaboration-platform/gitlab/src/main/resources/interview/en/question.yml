    answer: "I would open the issue's reproduction and expected outcome, compare it to the changed lines, and ask for a test that distinguishes rejection from clamping. Pipeline green merely tells me configured jobs passed; the acceptance case could be missing. I would comment at the relevant diff, request a corrected implementation, then re-review the latest revision before deciding to approve."
