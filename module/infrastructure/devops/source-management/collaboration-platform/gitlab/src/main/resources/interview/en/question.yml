questions:
  - question: "A team stores patches in a shared drive. Explain why moving the patches into GitLab improves decision-making, and what it still cannot prove."
    answer: "Git tracks the actual commit ancestry and diffs. A GitLab project adds named participants, permissions, merge requests, discussion and the accepted target branch, so an incident can be traced to both code and review decisions. A merged MR does not automatically prove the business rule is correct or the application was deployed; those require behavioral tests and delivery evidence."
