  - question: "A developer says 'I committed it locally, so GitLab already has an approved change.' Explain the distinct records and how you would verify each one."
    answer: "A local Git commit records content and parentage in the local repository. Pushing publishes a branch on a remote, creating an MR records a proposal, approval records reviewer judgment, and merging updates the destination. I would verify commit SHA and branch, MR source/target and approvals, then the actual target history; no one event implies the later ones."
