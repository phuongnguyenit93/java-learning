  - question: "Why is a GitLab project usually the scope for a source change, and when would you use a group instead?"
    answer: "A project combines a Git repository with project issues, merge requests, settings and membership; it is the unit whose source and acceptance history we can inspect. A group organizes related projects and can provide inherited membership or higher-level governance. I would avoid assuming that a group or namespace has a single shared Git history across all child projects."
