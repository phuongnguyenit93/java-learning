questions:
  - question: "Nhóm đang lưu các bản vá trên ổ chung. Giải thích GitLab cải thiện quyết định kỹ thuật thế nào và vẫn chưa chứng minh được điều gì."
    answer: "Git ghi lịch sử commit và diff thực tế. Project GitLab bổ sung người phụ trách, quyền truy cập, merge request, thảo luận và nhánh đích đã nhận mã để điều tra được cả thay đổi lẫn quyết định review. MR đã merge vẫn chưa chứng minh nghiệp vụ đúng hay ứng dụng đã triển khai; cần kiểm thử hành vi và bằng chứng delivery."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-gitlab-foundations.md"
      anchor: "gitlab-hosting-purpose"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Issue quy định hóa đơn -1 phải bị từ chối nhưng MR có pipeline xanh lại ép -1 thành 0. Hãy mô tả cách review và tiêu chí chấp nhận."
    answer: "Tôi đối chiếu đầu vào -1, kết quả từ chối mong đợi trong Issue với hành vi thực của diff rồi yêu cầu một regression test mà phương án ép về 0 sẽ không vượt qua. Pipeline xanh chỉ chứng minh các job và assertion hiện có đạt; thiếu case -1 thì vẫn xanh khi sai nghiệp vụ. Tôi gắn bình luận đúng dòng thay đổi, xác minh revision và test được bổ sung, sau đó mới cân nhắc Approve theo rule hiện hành."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-gitlab-foundations.md"
      anchor: "unstructured-collaboration-risks"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Lập trình viên nói 'tôi đã commit local nên GitLab đã phê duyệt'. Phân biệt các hồ sơ và cách xác minh từng mốc."
    answer: "Commit local ghi nội dung và quan hệ cha trong repository trên máy. Push công bố nhánh trên remote; MR ghi đề xuất, Approve ghi quyết định đánh giá, Merge cập nhật nhánh đích. Tôi đối chiếu SHA, nhánh nguồn, nguồn/đích MR, phiếu duyệt rồi lịch sử nhánh đích; mỗi mốc không mặc nhiên suy ra mốc tiếp theo."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-gitlab-foundations.md"
      anchor: "git-versus-gitlab"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Vì sao thay đổi mã thường thuộc phạm vi GitLab project, còn khi nào nên dùng group?"
    answer: "Project có Git repository và hồ sơ Issue/MR/branch riêng, nên khi cần điều tra commit nào được nhận, tôi bắt đầu tại project và nhánh đích cụ thể. Group tập hợp các project và có thể cấp membership hoặc quy tắc quản trị kế thừa để tránh cấu hình lặp. Ví dụ payments chứa gateway và billing: dù chung group, hai project không chia sẻ một commit DAG. Quyền group không thay thế việc xem history và merge status của từng project."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-gitlab-foundations.md"
      anchor: "gitlab-project-repository"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Project company/payments/gateway được chuyển vào subgroup. Vì sao thiết kế namespace đổi rủi ro dù không đổi commit?"
    answer: "Vị trí namespace ảnh hưởng chủ sở hữu project, quyền kế thừa, URL và ranh giới tổ chức dù nội dung commit không đổi. Tôi lập sơ đồ quyền từ group cha đến subgroup/project, kiểm tra integration và URL clone sau chuyển, rồi xem vai trò kế thừa có vô tình mở mã nhạy cảm không. Cây namespace không phải cây nhánh Git."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-gitlab-foundations.md"
      anchor: "gitlab-namespace-basics"
    apiRelated:
