    answer: "Draft thích hợp khi tác giả muốn thảo luận hướng xử lý nhưng test từ chối hóa đơn -1 còn thiếu; trạng thái này không nên bị hiểu là sẵn sàng hợp nhất. Tôi yêu cầu mô tả ghi rõ source/target, hành vi trước/sau, test chưa chạy và câu hỏi cần review sớm. Khi bổ sung test có thể tái hiện, tác giả đưa MR về Ready và mời đánh giá trên revision mới. Ready không tự cộng phiếu Approve, giải quyết discussion hay vượt protected-branch rules."
