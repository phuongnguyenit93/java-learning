  - question: "Contractor được mời trực tiếp vào gateway nhưng không được vào billing. Bạn bảo đảm ranh giới này theo thời gian thế nào?"
    answer: "Lời mời trực tiếp vào project có thể chỉ cấp quyền gateway mà không cho vào cả group. Tôi kiểm tra nguồn quyền trực tiếp, kế thừa và share ở cả hai project; thử khả năng xem/đóng góp bằng quyền contractor và rà lại khi công việc thay đổi. Quyền bổ sung ở group cha về sau có thể mở rộng quyền, nên ranh giới cần kiểm tra định kỳ."
