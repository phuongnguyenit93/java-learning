  - question: "Một developer có quyền được mời trực tiếp và kế thừa group. Vì sao xóa một lời mời chưa chứng minh thu hồi quyền?"
    answer: "GitLab tổng hợp quyền hiệu lực từ nhiều đường membership: trực tiếp, kế thừa và có thể qua share. Gỡ lời mời trực tiếp vẫn có thể còn quyền từ group cha. Tôi xác định mọi nguồn cấp quyền của project đích, chỉ sửa đúng nguồn cần thu hồi, rồi thử khả năng xem/ghi bằng tài khoản liên quan; tránh tác động thành viên ở project khác."
