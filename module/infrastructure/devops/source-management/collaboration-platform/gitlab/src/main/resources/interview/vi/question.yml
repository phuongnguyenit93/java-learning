  - question: "Nhóm đổi default branch master thành main. Trước khi nói mọi MR cũ đã nhắm main, bạn kiểm tra gì?"
    answer: "Cấu hình default branch hướng dẫn công việc mới; nó không chứng minh mọi MR cũ đã tự đổi target hay lịch sử Git bị viết lại. Tôi kiểm tra nguồn/đích cụ thể của từng MR còn mở, sửa target cũ có chủ đích rồi xem lại protection rule và integration. Clone local cũng có thể giữ cấu hình checkout cũ đến khi người dùng cập nhật."
