  - question: "So sánh project thuộc namespace cá nhân và group kỹ thuật. Khi một Maintainer nghỉ, cần xử lý gì?"
    answer: "Namespace cá nhân dễ buộc tính liên tục quản trị vào một tài khoản; group cho ranh giới đội và quyền được phân cấp rõ hơn. Khi chuyển, tôi xác minh đường dẫn project, remote, quyền kế thừa, credential tích hợp và owner. Gỡ người nghỉ không được làm mất chủ thể chịu trách nhiệm hay để sót quyền trực tiếp."
    aiGenerated: true
