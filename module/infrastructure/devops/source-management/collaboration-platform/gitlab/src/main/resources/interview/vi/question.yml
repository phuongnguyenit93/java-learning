    answer: "Fork tạo project nguồn riêng cho contributor ghi commit, còn upstream giữ membership và điều kiện merge độc lập. MR phải ghi đúng hai project và hai nhánh; reviewer cần đọc được phần diff liên quan. Tôi xem dữ liệu nào có thể lộ qua fork rồi áp dụng rule approve/protected branch ở upstream trước khi nhận mã; làm chủ fork không có nghĩa quản trị upstream."
