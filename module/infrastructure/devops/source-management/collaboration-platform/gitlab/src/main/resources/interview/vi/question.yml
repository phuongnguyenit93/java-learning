  - question: "Guest đang phân loại Issue nhưng nay cần đề xuất sửa mã. Bạn quyết định quyền tối thiểu thế nào?"
    answer: "Tôi liệt kê thao tác thật: xem mã, push nhánh, mở MR và có cần merge hay không. Vai trò Developer có thể cho đóng góp, nhưng cập nhật nhánh đích vẫn bị protected branch giới hạn; dùng fork có thể tránh phải cấp quyền ghi upstream. Tôi chỉ cấp phần quyền đường đóng góp cần và thử thực tế, không mặc định nâng lên Maintainer."
