  - question: "Hai project cùng nằm trong company/payments. Làm sao cấp quyền cho nhóm review chung mà không giả định mọi quyền đều như nhau?"
    answer: "Tôi kiểm tra quyền ở group cha, subgroup và từng project, gồm thành viên được mời trực tiếp hay project được share. Vai trò ở group có thể kế thừa xuống, nhưng từng project còn có ngoại lệ hay rule bảo vệ nhánh riêng. Cần ghi quyền hiệu lực cho thao tác review cụ thể, thay vì chỉ nhìn nhãn membership."
