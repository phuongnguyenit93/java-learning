      methodSignature: ""
  - question: "Với thay đổi pricing rủi ro cao, bạn sẽ lập MR thế nào để reviewer có thể chấp nhận hoặc từ chối có căn cứ?"
    answer: "Tôi chọn chính xác source project/branch và target main, dẫn Issue yêu cầu từ chối hóa đơn -1, đưa before/after, dữ liệu làm tròn và một test có thể tái hiện lỗi. Reviewer có chuyên môn pricing phải xác nhận hành vi trên diff hiện tại, không chỉ một ảnh pipeline xanh; comment khác với Approve hợp lệ. Trước merge cần xét cả quyền nhánh đích, approval rules và check đang áp dụng. MR chỉ là đề xuất cho tới khi revision thực được tích hợp."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-gitlab-foundations.md"
      anchor: "gitlab-mr-introduction"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "MR đã có approve nhưng chưa merge. Cần chuỗi bằng chứng nào để kết luận mã đã nhận, sẵn sàng phát hành và đang chạy thật?"
    answer: "Được nhận vào nguồn chung cần dấu vết merge có quyền và revision thực có trên nhánh đích, không chỉ phiếu Approve. Sẵn sàng phát hành còn cần kiểm thử phù hợp, chọn phiên bản và chuẩn bị release. Đang chạy production phải có bằng chứng môi trường hoặc pipeline xác nhận revision được deploy; riêng trang GitLab Release chưa đủ."
    aiGenerated: true
