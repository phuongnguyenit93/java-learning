  - question: "Developer bị từ chối push vào main. Phân biệt thiếu quyền project với chính sách bảo vệ nhánh thế nào?"
    answer: "Trước hết xác minh tài khoản xem được repository và push được nhánh làm việc hợp lệ. Tiếp theo kiểm tra mẫu protected branch và quyền Allowed to push and merge hiệu lực của main, không chỉ huy hiệu Developer. Người có thể mở MR vẫn có thể bị cấm push trực tiếp main. Cách giải quyết có thể là theo luồng MR hiện tại, không cần nâng quyền."
