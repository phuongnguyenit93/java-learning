  - question: "Giải thích thế nào khi GitLab.com không cho tạo Internal project mới nhưng một Internal project cũ vẫn hoạt động?"
    answer: "Phải phân biệt loại triển khai và trạng thái di sản. GitLab.com không còn cho tạo mới project/group/snippet Internal, nhưng đối tượng Internal cũ có thể giữ thiết lập. GitLab Self-Managed hoặc Dedicated có khả năng khác theo tài liệu. Tôi xác minh offering trước khi hướng dẫn tạo project, không suy từ ví dụ cũ ra tính năng hiện tại."
