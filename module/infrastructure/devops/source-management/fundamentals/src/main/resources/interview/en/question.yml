    answer: "An older source state does not automatically replace the running deployment or reverse already issued invoices. First isolate the suspect diff and the released version, choose a controlled rollback or forward fix, and validate dependent interfaces. Assess data correction, caches, and downstream consumers separately. Preserve an audit trail of both the source action and its operational effects."
