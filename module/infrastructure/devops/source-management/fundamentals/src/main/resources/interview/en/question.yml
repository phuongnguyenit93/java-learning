  - question: "A teammate says Save, backup, and commit are equivalent. How would you demonstrate their different guarantees?"
    answer: "Save updates a working file; a backup copies some state at a time; a commit records a selected snapshot and parentage in repository history. Stage only one of two edits and commit it to show that the other saved edit remains outside the recorded revision. Then compare the backup timestamp separately. None of these operations proves team acceptance or a production rollout."
