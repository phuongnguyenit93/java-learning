  - question: "Why doesn't naming a branch main or feature imply that the team follows Trunk-Based Development?"
    answer: "Git branch labels are pointers, not agreements about integration cadence. Trunk-Based Development depends on frequent convergence, small validated changes, a reliable mainline, and controlled exposure of incomplete work when needed. A team that lets feature branches diverge for weeks still faces late-integration risk regardless of branch names. Measure age, merge frequency, check latency, and recovery ownership rather than labels."
