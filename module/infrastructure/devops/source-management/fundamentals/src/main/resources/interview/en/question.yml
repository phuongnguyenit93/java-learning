  - question: "In a centralized VCS outage, which tasks remain possible and which become blocked? Why?"
    answer: "A developer may still edit or inspect already downloaded working files and compare local copies. Recording a new authoritative revision normally needs access to the centralized history server, so committing and sharing history are constrained during the outage. Exact offline capabilities vary by product and workspace setup. Distinguish local editing from recording a version before claiming that all work stops."
