  - question: "During a network outage, Binh commits locally but An still sees an older revision. How do you explain the divergence and recover coordination?"
    answer: "Binh's commit exists only in the history he has updated. An's clone does not acquire it merely because both repositories came from the same project. Once connectivity returns, Binh publishes to an agreed remote or exchanges the revision; An fetches it and reviews integration against her current base. The team then decides whether and how to accept both lines, rather than choosing the largest commit count."
