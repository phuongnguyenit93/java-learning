  - question: "Why are folders named final-v2 or project-latest inadequate as a conflict-resolution strategy?"
    answer: "A filename announces a claim, not provenance. It does not identify a stable base, precise content differences, or who resolved two competing edits. Timestamps can be altered by copying and cannot prove intent. A meaningful recovery compares revisions, resolves incompatible changes deliberately, and records the selected result so later maintainers can reconstruct it."
