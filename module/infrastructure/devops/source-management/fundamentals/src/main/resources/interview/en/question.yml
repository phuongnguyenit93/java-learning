    answer: "Inspect its parent and diff to learn the actual before/after behavior, then connect an issue or decision explaining the intended tax rule. Check who reviewed edge cases and which tests support that expectation. Commit timestamps and author fields are useful leads but cannot substitute for a domain rationale. Separate observed code behavior from claims made in notes."
