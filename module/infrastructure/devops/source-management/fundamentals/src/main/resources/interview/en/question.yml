  - question: "If several Git clones contain full history, why are backups and source-of-truth policies still needed?"
    answer: "Replicas improve resilience, but not every clone contains every branch, remote-only update, tag, or hosted review record. A damaged or stale clone may be incomplete for recovery, and copies can disagree about what the team accepted. Protect shared repositories and metadata with backups, record authoritative branches and owners, and test restoration. Distributed storage improves options; it does not eliminate governance."
