  - question: "Why is it harmful to label a pushed and commented-on commit as accepted before the target branch changes?"
    answer: "Recorded means a revision exists; shared means others can fetch or view it; reviewed means someone evaluated it; accepted means the agreed integration line now includes the authorized result. Collapsing those states hides unresolved feedback and can mislead downstream teams about readiness. A pushed branch may even be rejected after review. Report the exact stage and evidence rather than saying done prematurely."
