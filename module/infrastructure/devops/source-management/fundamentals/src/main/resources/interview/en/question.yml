  - question: "Distinguish a saved working file, a recorded revision, a repository, and a product release using one example."
    answer: "Editing Invoice.java changes a working file. Committing a staged snapshot creates a recorded revision within the repository's history. That repository can contain several branches representing different integration states. A release is a separate decision to package or publish a verified revision; it is not created simply by saving or committing. Confusing these layers causes false claims about what users already received."
