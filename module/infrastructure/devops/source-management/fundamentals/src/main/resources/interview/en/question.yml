  - question: "If every engineer has a valid Git history, what makes one branch the team's accepted source of truth?"
    answer: "Technical possession of commits is distinct from an organizational acceptance decision. The team explicitly identifies its integration branch or repository, required reviews/checks, and who may update it. A proposed feature branch can be pushed and visible without satisfying those conditions. Acceptance evidence is the actual target ref/history after authorized integration, not whichever local branch has the most recent timestamp."
