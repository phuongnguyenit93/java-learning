questions:
  - question: "A team already uses Git. How would you explain why source management is broader than maintaining a commit history?"
    answer: "Git records snapshots and parent relationships. A source-management agreement also defines which source is shared, who can propose changes, which evidence is reviewed, and which revision the team accepts. A developer can commit a correct-looking change without satisfying an approval policy. In practice, show both the Git diff and the recorded decision that made it eligible for the shared branch."
