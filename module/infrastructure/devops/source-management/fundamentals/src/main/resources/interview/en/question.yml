  - question: "Why does a successful local commit not mean a teammate or central repository received the change?"
    answer: "Git records the commit in the local object's history. Publishing generally requires pushing refs/objects to a permitted remote, while another developer normally fetches the update before seeing it. Permissions, network status, and branch policy can prevent push or acceptance. Explain the distinct evidence: local SHA, remote ref, fetched clone state, and eventual merge into the team's agreed line."
