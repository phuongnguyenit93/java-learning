  - question: "Walk through a tax-plus-rounding conflict and explain how you would avoid silently dropping either developer's work."
    answer: "Start from the version both developers used. Compare each change against it, then combine the intended behavior in a reviewable patch. Test normal totals, rounding boundaries, and inputs affected by both changes. If the contract is ambiguous, obtain a domain decision rather than choosing the latest folder. Only then record the merged source and its acceptance evidence."
