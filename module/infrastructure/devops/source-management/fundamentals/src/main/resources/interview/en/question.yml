  - question: "A new engineer attributes pull-request approvals to Git itself. How would you separate Git mechanics from hosting decisions?"
    answer: "Git creates commits, branches, ancestry, and merge results that can be inspected locally. Hosting platforms add pull requests (GitHub) or merge requests (GitLab), actor permissions, review records, branch protections, and status-gate integration. One can merge locally without a hosted PR or MR, but doing so may violate a team's policy. Show the Git graph and hosted acceptance evidence separately so a recorded commit is not mistaken for a reviewed decision."
    aiGenerated: true
    reviewed: false
