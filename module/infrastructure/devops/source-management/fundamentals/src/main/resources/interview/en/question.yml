  - question: "When does a hosted pull request or merge request provide value beyond a readable code diff?"
    answer: "A GitHub PR or GitLab MR connects intent, implementation, tests, reviewer questions, and the decision to integrate. For a tax rule, review asks about edge cases, rounding interaction, and compatibility, not merely syntax. A reviewer may request changes despite passing checks because business semantics remain untested. The proposal has an auditable discussion but does not itself establish that the target branch accepted the code."
