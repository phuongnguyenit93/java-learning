    answer: "Source-write permission, reviewer eligibility, required checks, and merge authorization are separate controls. A contributor may push to a permitted branch while protected main requires a PR and certain approvals or statuses. Effective policy can also depend on actor-specific bypass rights; granting broad Admin is not the default remedy. Diagnose the exact unsatisfied condition before changing permissions."
