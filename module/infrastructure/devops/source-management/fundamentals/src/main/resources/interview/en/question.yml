    answer: "Preserve the base revision, relevant diff, rationale, test evidence, reviewers and their decisions, and the accepted target revision. Author identity alone describes who recorded a change, not who agreed to its semantics. If release behavior matters, also trace deployed artifact or release revision separately. This evidence supports audit and rollback without treating every pushed branch as authoritative."
