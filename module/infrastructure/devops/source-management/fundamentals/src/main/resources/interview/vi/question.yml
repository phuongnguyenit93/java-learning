  - question: "Kỹ sư mới cho rằng Git tự quản lý phiếu duyệt pull request. Bạn phân tách Git và hosting ra sao?"
    answer: "Git tạo commit, branch, quan hệ tổ tiên và kết quả merge có thể xem local. Nền tảng GitHub cung cấp Pull Request (PR), còn GitLab gọi là Merge Request (MR); cả hai có thảo luận, phân quyền, hồ sơ review, bảo vệ branch và tích hợp status gate. Vẫn có thể merge local không qua PR/MR nhưng như vậy có thể vi phạm chính sách nhóm. Hãy hiển thị đồ thị Git và bằng chứng tiếp nhận trên host riêng để không nhầm commit đã ghi với quyết định đã duyệt."
