  - question: "Nếu mỗi kỹ sư đều có lịch sử Git hợp lệ, điều gì khiến một branch trở thành nguồn chuẩn của nhóm?"
    answer: "Có commit hợp lệ khác với quyết định tiếp nhận của tổ chức. Nhóm quy định rõ branch hoặc repository tích hợp, các review/checks bắt buộc và ai được cập nhật. Nhánh đề xuất có thể đã push và nhìn thấy được nhưng chưa đạt điều kiện. Bằng chứng chấp nhận là ref/lịch sử đích sau tích hợp có thẩm quyền, không phải branch local có timestamp mới nhất."
