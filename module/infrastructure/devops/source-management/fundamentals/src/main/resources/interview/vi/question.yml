  - question: "Khi nào nên giữ Web và Billing chung repo, và khi nào đáng tách mã nguồn?"
    answer: "Nếu hai component thường đổi cùng nhau, được đọc chung nguồn và kiểm chứng được contract bị ảnh hưởng, một repo có thể giúp review diff liên quan thuận lợi. Repo riêng có thể cần khi quyền đọc source, vòng đời hoặc ranh giới owner thực sự khác nhau. Độc lập deploy không tự suy từ số repository; polyrepo vẫn có thể bị ràng buộc API. Cần so thời gian bàn giao, nghĩa vụ phân quyền và năng lực công cụ trước khi di chuyển lịch sử."
