  - question: "Vì sao clone Git đầy đủ có thể commit offline và khả năng đó không bảo đảm điều gì?"
    answer: "Clone chứa commit objects, quan hệ cha, refs và cơ sở dữ liệu đối tượng để ghi snapshot mới. Git tạo commit local mà không cần hỏi remote. Điều đó không tự công bố commit, chuyển nó sang clone người khác hoặc biến thành nguồn chung đã nhận. Push/fetch và chính sách review vẫn quyết định chuyện chia sẻ và chấp nhận."
