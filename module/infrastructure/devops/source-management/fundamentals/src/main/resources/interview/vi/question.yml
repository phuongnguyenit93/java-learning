  - question: "Đồng nghiệp nói Save, backup và commit tương đương. Bạn minh họa khác biệt bảo đảm của chúng thế nào?"
    answer: "Save cập nhật file đang làm; backup sao chép một trạng thái tại thời điểm nào đó; commit ghi snapshot được chọn kèm quan hệ lịch sử. Hãy stage một trong hai sửa đổi rồi commit để chứng minh thay đổi còn lại dù đã Save vẫn chưa thuộc revision. So riêng mốc thời gian backup. Không thao tác nào tự chứng minh nhóm đã nhận hoặc production đã cập nhật."
