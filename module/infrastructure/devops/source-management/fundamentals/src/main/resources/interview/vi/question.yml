  - question: "Chuỗi bằng chứng nào chứng minh một thay đổi đã được tiếp nhận có trách nhiệm chứ không chỉ được commit?"
    answer: "Truy từ yêu cầu hoặc sự cố tới revision gốc, diff đề xuất, lý do tác giả, tests, phản hồi review, vấn đề đã xử lý và revision merge đích. Lưu ai có thẩm quyền nhận mã và checks bắt buộc được đáp ứng thế nào. Nếu điều tra production, nối SHA source với hồ sơ release/deploy sau đó nhưng không mặc định hai bước đã xảy ra. Nhờ vậy biết mã đổi gì, vì sao, ai đồng ý và kết quả nằm ở đâu."
