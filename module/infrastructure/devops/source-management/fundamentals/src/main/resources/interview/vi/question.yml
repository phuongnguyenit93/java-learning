  - question: "Khi nào mô hình tập trung vẫn có thể phù hợp dù DVCS thuận lợi cho commit offline?"
    answer: "Mô hình tập trung có thể thuận lợi khi tổ chức cần một lịch sử có thẩm quyền được kiểm soát chặt và phân quyền tập trung, ví dụ quy trình đặc thù hoặc hệ thống cũ. Đổi lại phải chấp nhận chi phí kết nối và độ sẵn sàng server. DVCS giảm lệ thuộc server khi ghi local nhưng tạo nhiều bản sao tiến hóa độc lập, cần đồng bộ và quy định nguồn chung. Nên chọn theo nhu cầu kiểm soát và cộng tác, không theo khẩu hiệu."
