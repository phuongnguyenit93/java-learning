  - question: "Dùng một ví dụ phân biệt file đang sửa, revision được ghi, repository và bản phát hành sản phẩm."
    answer: "Sửa Invoice.java làm thay đổi working file. Commit snapshot đã stage tạo revision được ghi trong lịch sử repository. Repository có thể có nhiều nhánh biểu diễn những trạng thái tích hợp khác nhau. Phát hành là quyết định đóng gói hoặc công bố revision đã kiểm chứng riêng, không tự xuất hiện khi Save hay Commit. Nhầm các lớp này dễ dẫn đến báo sai rằng người dùng đã nhận tính năng."
