  - question: "Khi máy chủ CVCS bị lỗi, việc nào còn làm được, việc nào bị chặn và vì sao?"
    answer: "Developer vẫn có thể sửa hoặc xem file đã tải và so các bản cục bộ. Ghi revision mới vào lịch sử chính thường cần server trung tâm, nên việc commit vào kho và chia sẻ lịch sử bị giới hạn khi server mất kết nối. Khả năng offline cụ thể tùy sản phẩm và cách thiết lập. Cần phân biệt sửa file với ghi phiên bản trước khi nói mọi công việc đều dừng."
