  - question: "Hãy trình bày cách xử lý tình huống đổi thuế và làm tròn sao cho không âm thầm mất thay đổi của ai."
    answer: "Bắt đầu từ phiên bản gốc mà cả hai cùng dùng. So riêng thay đổi của mỗi người, sau đó hợp nhất hành vi mong muốn thành patch dễ review. Kiểm thử tổng tiền thông thường, ranh giới làm tròn và đầu vào chịu cả hai thay đổi. Nếu quy tắc nghiệp vụ còn mơ hồ, cần quyết định miền nghiệp vụ thay vì chọn thư mục gửi cuối. Cuối cùng mới ghi nguồn hợp nhất và bằng chứng chấp nhận."
