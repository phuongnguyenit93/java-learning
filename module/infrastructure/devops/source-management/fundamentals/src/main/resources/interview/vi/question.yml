  - question: "Vì sao các thư mục tên final-v2 hoặc project-latest không đủ để giải quyết xung đột?"
    answer: "Tên file chỉ là lời khẳng định, không phải bằng chứng nguồn gốc. Nó không chỉ ra base ổn định, phần mã khác nhau hoặc người đã giải quyết hai sửa đổi cạnh tranh. Thời gian file còn có thể đổi khi sao chép. Cách xử lý tốt là so revision, giải quyết phần bất tương thích có chủ đích và ghi lại kết quả để người bảo trì sau này truy được."
