  - question: "Vì sao gọi commit đã push và có bình luận là đã chấp nhận dù nhánh đích chưa đổi lại có hại?"
    answer: "Đã ghi nghĩa là revision tồn tại; đã chia sẻ nghĩa là người khác xem hoặc fetch được; đã review là có người đánh giá; đã chấp nhận là dòng tích hợp chuẩn chứa kết quả hợp lệ. Gộp các trạng thái che phản hồi chưa xử lý và khiến nhóm phía sau hiểu sai mức sẵn sàng. Nhánh đã push vẫn có thể bị từ chối sau review. Cần báo đúng giai đoạn và bằng chứng thay vì nói hoàn thành quá sớm."
