  - question: "Rủi ro nào xảy ra khi reviewer duyệt diff cũ hoặc developer tích hợp các revision local mâu thuẫn?"
    answer: "Reviewer có thể đã kiểm hành vi nay khác sau commit mới; rule host có thể yêu cầu duyệt lại hoặc chạy checks mới. Lịch sử phân kỳ còn có thể gây conflict chữ hoặc merge sạch nhưng sai nghiệp vụ kết hợp. So revision hiện tại với bản từng review, chạy lại test liên quan và mời duyệt lại khi cần. Không nên force viết lại lịch sử chung chỉ để đồ thị đẹp."
