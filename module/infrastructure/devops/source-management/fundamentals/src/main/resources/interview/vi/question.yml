  - question: "Thay đổi đã review và merge vào main nhưng production vẫn chạy hành vi cũ. Cần kiểm gì tiếp theo?"
    answer: "Tiếp nhận nguồn xác lập mốc tích hợp, không phải artifact đã deploy. Kiểm SHA đầu vào build, phiên bản gói, kết quả CI, duyệt release, môi trường đích và trạng thái rollout/feature flag. Check xanh trên commit không bảo đảm job deploy đã chạy hoặc môi trường đã cập nhật. Nhóm nguồn bàn giao revision đã xác minh cùng dấu vết; hệ thống phân phối cung cấp bằng chứng người dùng đã nhận gì."
