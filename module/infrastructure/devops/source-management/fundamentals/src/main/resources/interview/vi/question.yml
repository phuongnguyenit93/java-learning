  - question: "Mạng gián đoạn, Bình commit local còn An vẫn thấy revision cũ. Giải thích phân kỳ và phối hợp lại ra sao?"
    answer: "Commit của Bình chỉ tồn tại trong lịch sử anh ấy đã cập nhật. Clone của An không tự có commit ấy dù hai kho cùng xuất phát từ một dự án. Khi mạng trở lại, Bình push lên remote thống nhất hoặc trao đổi revision; An fetch rồi kiểm cách tích hợp với base hiện tại. Nhóm sau đó quyết định chấp nhận hai dòng thế nào, không chọn kho chỉ vì có nhiều commit hơn."
