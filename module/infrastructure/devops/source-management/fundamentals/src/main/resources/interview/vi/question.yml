  - question: "Commit chỉ có message fix. Cần xem gì trước khi giải thích ý định nghiệp vụ của thay đổi?"
    answer: "Kiểm commit cha và diff để xác định hành vi trước/sau, rồi liên kết Issue hoặc quyết định nêu quy tắc thuế mong muốn. Xem ai review ca biên và test nào chứng minh yêu cầu ấy. Thời gian và tác giả là manh mối hữu ích nhưng không thay được lý do nghiệp vụ. Cần tách hành vi quan sát từ mã khỏi nhận định trong ghi chú."
