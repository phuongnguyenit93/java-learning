  - question: "Vì sao người có thể tạo branch feature vẫn có thể không được merge vào mainline chung?"
    answer: "Quyền ghi mã, tư cách reviewer, checks bắt buộc và quyền merge là các kiểm soát khác nhau. Contributor có thể push nhánh được phép nhưng main bảo vệ yêu cầu PR, phiếu duyệt hoặc trạng thái kiểm thử. Chính sách hiệu lực còn có thể phụ thuộc quyền bypass riêng từng actor; cấp Admin rộng không nên là cách mặc định. Phải chẩn đoán đúng điều kiện chưa đạt trước khi đổi quyền."
