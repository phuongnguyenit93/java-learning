  - question: "An push nhánh đổi thuế rồi mở PR/MR, Bình yêu cầu test làm tròn và main chưa đổi. Owner nên báo tiến độ thế nào?"
    answer: "Hãy ghi thay đổi đã được ghi và chia sẻ, đang review với yêu cầu test làm tròn chưa giải quyết. Nêu ai chịu trách nhiệm test, kết quả cần đạt và khi nào diff hiện tại được duyệt lại. Không cần xóa công việc hay gọi là đã deploy; nhánh và PR/MR vẫn có thể giữ để xử lý phản hồi. Chấp nhận chỉ xảy ra khi đủ điều kiện nhóm và cập nhật nhánh đích."
