  - question: "Bằng chứng tối thiểu nào giúp maintainer mới điều tra ai đã chấp nhận thay đổi thuế gây tranh cãi?"
    answer: "Giữ revision gốc, diff liên quan, lý do đổi, bằng chứng test, reviewer cùng quyết định của họ và revision đích đã được nhận. Tên tác giả chỉ cho biết ai ghi thay đổi, không cho biết ai đồng ý về nghiệp vụ. Nếu cần điều tra production, phải truy riêng artifact hoặc revision đã triển khai. Chuỗi bằng chứng này giúp audit và rollback mà không coi mọi nhánh được push là nguồn chính thức."
