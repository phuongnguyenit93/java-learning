    answer: "Hai thay đổi cần bản gốc chung để reviewer nhận diện chính xác phần mỗi người sửa. Nhóm phải xem chỗ chồng lấn, thử hành vi kết hợp và quyết định kết quả nào trở thành nguồn chung. File gửi sau có thể mới hơn nhưng làm mất phần sửa của người kia. Bàn giao phù hợp gồm đề xuất truy vết được, bằng chứng review và revision chung đã xác nhận."
