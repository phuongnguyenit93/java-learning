questions:
  - question: "Một nhóm đã dùng Git. Vì sao quản lý mã nguồn vẫn rộng hơn việc lưu lịch sử commit?"
    answer: "Git ghi snapshot và quan hệ giữa commit. Quy trình quản lý mã nguồn còn xác định bản chung, người được đề xuất sửa, bằng chứng cần review và revision nào được nhóm tiếp nhận. Một developer có thể commit thay đổi hợp lý mà vẫn chưa đạt chính sách phê duyệt. Khi giải thích thực tế, hãy chỉ ra cả diff Git lẫn quyết định chấp nhận vào nhánh chung."
