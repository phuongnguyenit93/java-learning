  - question: "Hãy trình bày hành trình một sửa đổi thuế từ editor đến nguồn chung đã nhận. Quyết định xuất hiện ở đâu?"
    answer: "Developer sửa, kiểm diff, stage và ghi revision local, rồi công bố đề xuất lên nơi chia sẻ. Nhóm review quy tắc trước/sau, test tình huống bị ảnh hưởng và xác nhận quyền cùng checks bắt buộc. Chỉ tích hợp có thẩm quyền mới cập nhật nhánh nguồn chuẩn. Commit, PR/MR, review và merge là các bằng chứng riêng; phát hành/triển khai thuộc quy trình kế tiếp."
