  - question: "Sau đổi cách làm tròn, tổng tiền production sai. Vì sao checkout revision mã cũ chưa đủ để khôi phục?"
    answer: "Revision mã cũ không tự thay hệ thống đang chạy hoặc hoàn tác hóa đơn đã phát hành. Trước hết tìm diff nghi vấn và bản đã release, chọn rollback có kiểm soát hoặc fix tiến rồi kiểm chứng interface phụ thuộc. Việc sửa dữ liệu, cache và consumer phía sau phải xét riêng. Giữ hồ sơ cả thao tác source lẫn tác động vận hành."
