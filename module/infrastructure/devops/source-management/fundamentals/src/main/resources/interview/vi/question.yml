  - question: "Bạn sẽ kiểm chứng thế nào khi developer khẳng định file thuế vừa Save 10% đã thuộc revision chung của nhóm?"
    answer: "Tách ba trạng thái: file đang làm, snapshot đã stage và commit mới nhất. Kiểm trạng thái local và diff để biết mức 10% đang untracked, chưa stage, đã stage hay đã commit. Tiếp đó kiểm ref đích trên remote và quyết định chấp nhận; ngay cả commit local cũng có thể chưa được chia sẻ hoặc merge. Nhờ vậy nhóm không coi ảnh chụp editor là bằng chứng nguồn chung."
