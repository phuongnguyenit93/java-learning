  - question: "Nếu nhiều clone Git có đủ lịch sử, vì sao vẫn cần backup và chính sách nguồn chuẩn?"
    answer: "Các bản sao tăng khả năng phục hồi nhưng không phải clone nào cũng có mọi nhánh, bản cập nhật trên remote, tag hay hồ sơ review của host. Clone lỗi hoặc cũ có thể thiếu dữ liệu khi cần khôi phục; các bản còn có thể bất đồng về trạng thái nhóm đã chấp nhận. Cần backup kho và metadata chung, xác định nhánh/owner có thẩm quyền và thử phục hồi. Phân tán cải thiện lựa chọn nhưng không loại bỏ quản trị."
