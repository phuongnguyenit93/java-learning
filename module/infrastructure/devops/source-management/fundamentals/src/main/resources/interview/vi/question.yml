  - question: "Vì sao đặt tên branch là main hoặc feature không chứng minh nhóm thực hành Trunk-Based Development?"
    answer: "Tên branch trong Git là refs, không phải cam kết nhịp tích hợp. Trunk-Based Development dựa trên tích hợp thường xuyên, thay đổi nhỏ được kiểm chứng, mainline ổn định và kiểm soát việc bật chức năng chưa hoàn thiện khi cần. Nhóm để feature phân kỳ nhiều tuần vẫn gặp rủi ro tích hợp muộn dù tên nhánh thế nào. Nên đo tuổi branch, nhịp merge, độ trễ checks và trách nhiệm khôi phục thay vì nhìn nhãn."
