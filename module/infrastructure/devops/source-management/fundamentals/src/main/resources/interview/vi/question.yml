  - question: "An và Bình đều có commit sau cùng base. Bạn giải thích đồng bộ và nguy cơ conflict thế nào?"
    answer: "Hai lịch sử đã rẽ nhánh dù tên branch giống nhau. Fetch chỉ làm commit của phía kia xuất hiện local, không tự hòa hợp ý định hoặc giải quyết các sửa đổi xung đột. Xem merge-base và cả hai diff, tích hợp bằng cơ chế nhóm chọn rồi giải quyết conflict và kiểm hành vi. Merge không xung đột chữ vẫn có thể sai nghiệp vụ, vì vậy phải test và review."
