    apiRelated: {controller: "", methodSignature: ""}
    answers:
      - {id: A, answer: "Compare how Web and API are built and deployed by their pipelines.", explanation: "Deployment automation does not define source-history boundaries."}
      - {id: B, answer: "Check whether source shares one Git history or has separate Git roots.", explanation: "Git repository roots and histories are the relevant source boundary."}
      - {id: C, answer: "Whether both services use the same programming language.", explanation: "Language consistency is possible in either repository layout."}
