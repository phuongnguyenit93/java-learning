    answer: "I would trace the real Git roots and the histories that own Web and API source, not the number of deployed processes. One history containing both is a monorepo; independent histories indicate multiple repositories. Build targets, service names, and deployment units are separate dimensions. I would confirm this from remotes and source boundaries before drawing governance conclusions."
