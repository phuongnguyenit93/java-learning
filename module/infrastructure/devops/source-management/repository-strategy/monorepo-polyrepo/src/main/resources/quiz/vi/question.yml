#       file [kiểu: string; bắt buộc; mặc định: ""]
#         Đường dẫn README tương đối bên dưới readme/{language}/menu, ví dụ 1.Basic/Basic.md.
#       anchor [kiểu: string; bắt buộc; mặc định: ""]
