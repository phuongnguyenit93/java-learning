questions:
  - id: "MONO-Q001"
    question: "Nhóm triển khai Web và API thành hai service. Dấu hiệu nào xác định cách tổ chức repository?"
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "01-repository-topology-foundations.md", anchor: "what-is-repository-topology"}
    apiRelated: {controller: "", methodSignature: ""}
    answers:
      - {id: A, answer: "So cách Web và API được build và triển khai theo những pipeline riêng.", explanation: "Pipeline triển khai không quyết định ranh giới lịch sử mã nguồn."}
      - {id: B, answer: "Kiểm tra chúng dùng chung một lịch sử Git hay có các Git root độc lập.", explanation: "Git root và lịch sử commit mới xác định ranh giới kho mã."}
      - {id: C, answer: "Hai service có dùng cùng một ngôn ngữ lập trình hay không.", explanation: "Hai mô hình repository đều có thể sử dụng cùng ngôn ngữ."}
      - {id: D, answer: "Web và API có chia sẻ cùng một schema cơ sở dữ liệu hay không.", explanation: "Schema chung thể hiện phụ thuộc, không xác định nơi lưu lịch sử mã nguồn."}
    correctAnswerId: B
  - id: "MONO-Q002"
    question: "Một đổi tên trường contract ảnh hưởng Web, API và schema chung. Vì sao ranh giới repository đáng quan tâm?"
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "01-repository-topology-foundations.md", anchor: "why-repository-boundaries-matter"}
    apiRelated: {controller: "", methodSignature: ""}
    answers:
      - {id: A, answer: "Nó quyết định hệ thống có cần contract tương thích khi chạy hay không.", explanation: "Tương thích lúc chạy vẫn cần dù có bao nhiêu repository."}
      - {id: B, answer: "Một diff chung có thể thay luôn quyết định reviewer ở từng vùng mã.", explanation: "Một diff chung vẫn cần reviewer hiểu từng miền chức năng."}
      - {id: C, answer: "Nó thay đổi việc liên kết PR, phân quyền và phối hợp review.", explanation: "Ranh giới kho định hình dấu vết phối hợp và khả năng quan sát thay đổi."}
      - {id: D, answer: "Nó bảo đảm mọi component thay đổi được triển khai đồng thời.", explanation: "Lịch sử mã nguồn không tự bảo đảm triển khai nguyên tử."}
    correctAnswerId: C
  - id: "MONO-Q003"
    question: "Một repository chứa /web, /api và /contracts, mỗi phần có lệnh build riêng. Kết luận nào đúng?"
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "01-repository-topology-foundations.md", anchor: "monorepo-definition"}
    apiRelated: {controller: "", methodSignature: ""}
    answers:
      - {id: A, answer: "Đây có thể là monorepo dù mỗi thành phần build riêng.", explanation: "Một repository Git chung có thể chứa nhiều đơn vị build."}
      - {id: B, answer: "Các module build độc lập buộc Git tạo history riêng cho từng module.", explanation: "Ranh giới đơn vị build khác ranh giới repository Git."}
      - {id: C, answer: "Mọi component bắt buộc triển khai cùng một phiên bản phát hành.", explanation: "Lịch sử Git chung không bắt buộc chung nhịp phát hành."}
      - {id: D, answer: "Nó là ứng dụng nguyên khối nếu các component dùng chung branch.", explanation: "Kiến trúc ứng dụng không suy ra từ vị trí branch."}
    correctAnswerId: A
  - id: "MONO-Q004"
    question: "Contracts 2.1 đã phát hành nhưng Web ở repository khác vẫn khai báo 1.9. Hệ quả cần quan tâm nhất là gì?"
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "01-repository-topology-foundations.md", anchor: "polyrepo-definition"}
    apiRelated: {controller: "", methodSignature: ""}
    answers:
      - {id: A, answer: "Nền tảng Git tự động nâng Web lên Contracts 2.1.", explanation: "Lịch sử nguồn tách biệt không ép consumer nhận version mới."}
      - {id: B, answer: "Provider nên chờ consumer nâng xong rồi mới tạo release 2.1.", explanation: "Các nhóm có thể nâng dần nếu các phiên bản vẫn tương thích."}
      - {id: C, answer: "Web không còn phụ thuộc Contracts vì mã nằm ở repository khác.", explanation: "Tách kho không loại bỏ phụ thuộc qua interface."}
      - {id: D, answer: "Cần theo dõi phiên bản được hỗ trợ và lúc mỗi consumer nâng cấp.", explanation: "Polyrepo hỗ trợ nâng theo lịch riêng nhưng đòi hỏi kế hoạch tương thích."}
    correctAnswerId: D
  - id: "MONO-Q005"
    question: "Trong sản phẩm Payments, Java package com.shop.billing xác định điều gì?"
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "01-repository-topology-foundations.md", anchor: "repository-versus-project-module"}
    apiRelated: {controller: "", methodSignature: ""}
    answers:
      - {id: A, answer: "Một Git repository có lịch sử commit độc lập.", explanation: "Tên package không chỉ ra Git root chứa các file."}
      - {id: B, answer: "Một service triển khai được với lịch rollout riêng.", explanation: "Không phải package nào cũng tương ứng một đơn vị triển khai."}
      - {id: C, answer: "Một namespace chứa kiểu Java, không xác định Git root.", explanation: "Namespace ngôn ngữ và topology quản lý source là hai lớp khác nhau."}
      - {id: D, answer: "Một tên Gradle subproject liên kết trực tiếp với các Java package.", explanation: "Gradle module là đơn vị build khai báo riêng, package là namespace."}
    correctAnswerId: C
  - id: "MONO-Q006"
    question: "Web và API chung một Git repository nhưng có artifact và lịch phát hành riêng. Nên phân loại thế nào?"
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "01-repository-topology-foundations.md", anchor: "repository-versus-service-deployment"}
    apiRelated: {controller: "", methodSignature: ""}
    answers:
      - {id: A, answer: "Monorepo vẫn có thể phát hành từng thành phần độc lập.", explanation: "Chung repository không ép triển khai đồng thời."}
      - {id: B, answer: "Hai artifacts thường tương ứng với hai nhánh Git riêng biệt.", explanation: "Artifact riêng không tạo repository mã nguồn mới."}
      - {id: C, answer: "Ứng dụng nguyên khối vì mọi phần dùng chung Git root.", explanation: "Ranh giới runtime cần bằng chứng ngoài vị trí mã nguồn."}
      - {id: D, answer: "Repository lai vì tồn tại hai lịch phát hành.", explanation: "Lịch phát hành không định nghĩa topology kho nguồn."}
    correctAnswerId: A
  - id: "MONO-Q007"
    question: "Bằng chứng nào tách bạch trách nhiệm sở hữu, phối hợp sửa đổi và độc lập phát hành?"
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "01-repository-topology-foundations.md", anchor: "ownership-coordination-independence"}
    apiRelated: {controller: "", methodSignature: ""}
    answers:
      - {id: A, answer: "Sơ đồ team và người review cho mỗi component trong cùng dự án.", explanation: "Sơ đồ tổ chức không mô tả được phối hợp và hành vi phát hành."}
      - {id: B, answer: "Tổng số commit trong mọi thư mục mã của tháng vừa qua.", explanation: "Số commit không chứng minh quyền review hay khả năng phát hành độc lập."}
      - {id: C, answer: "Danh sách container của service, không kèm lịch sử Git.", explanation: "Danh sách runtime thiếu dữ liệu nguồn và phụ thuộc review."}
      - {id: D, answer: "Đối chiếu owner map, PR liên quan và lịch phát hành tương thích.", explanation: "Mỗi loại bằng chứng kiểm tra một ràng buộc chiến lược riêng."}
    correctAnswerId: D
  - id: "MONO-Q008"
    question: "Sơ đồ có bốn tổ hợp mono/polyrepo và monolith/microservices chứng minh điều gì?"
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "01-repository-topology-foundations.md", anchor: "monorepo-is-not-monolith"}
    apiRelated: {controller: "", methodSignature: ""}
    answers:
      - {id: A, answer: "Monorepo chỉ phù hợp ứng dụng nguyên khối.", explanation: "Một Git root có thể chứa nhiều service triển khai độc lập."}
      - {id: B, answer: "Ranh giới Git và kiến trúc runtime là hai trục độc lập.", explanation: "Lịch sử Git và cách đóng gói triển khai trả lời hai câu hỏi khác nhau."}
      - {id: C, answer: "Microservices dễ bảo trì hơn khi mỗi service có repository riêng.", explanation: "Số service không quy định số repository."}
      - {id: D, answer: "Polyrepo bảo đảm mọi release độc lập với contract service.", explanation: "Phụ thuộc contract vẫn có thể ràng buộc phát hành giữa các kho."}
    correctAnswerId: B
  - id: "MONO-Q009"
    question: "IDE hiển thị ba project cạnh nhau, một project dùng Git submodule. Cần kiểm tra gì để phân loại topology?"
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "01-repository-topology-foundations.md", anchor: "recognize-topology-in-examples"}
    apiRelated: {controller: "", methodSignature: ""}
    answers:
      - {id: A, answer: "Số thư mục cấp cao hiển thị trong IDE.", explanation: "Một workspace có thể chứa một hoặc nhiều lịch sử Git."}
      - {id: B, answer: "Đếm các build script gốc để suy ra số lịch sử source.", explanation: "Khai báo build không xác định số Git root."}
      - {id: C, answer: "Xác minh Git root và lịch sử commit thật của từng thành phần.", explanation: "Submodule có thể liên kết kho khác mà không gộp lịch sử."}
      - {id: D, answer: "Số artifact nhị phân do ba project tạo ra.", explanation: "Số artifact phản ánh đóng gói, không phải topology mã nguồn."}
    correctAnswerId: C
  - id: "MONO-Q010"
    question: "Platform sở hữu Contracts, Web là consumer. Code ownership xác lập điều gì?"
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "02-boundaries-and-ownership.md", anchor: "what-is-code-ownership"}
    apiRelated: {controller: "", methodSignature: ""}
    answers:
      - {id: A, answer: "Ownership thường khiến Platform nắm cả quyền Read của Contracts.", explanation: "Ownership xác định trách nhiệm, không đồng nghĩa độc quyền đọc mã."}
      - {id: B, answer: "Web chịu mọi trách nhiệm phát hành Contracts vì dùng thư viện.", explanation: "Consumer có nghĩa vụ tương thích nhưng không tự thành maintainer."}
      - {id: C, answer: "Platform chịu trách nhiệm chính; cần reviewer và phương án dự phòng.", explanation: "Owner rõ ràng cho biết ai xử lý thay đổi và sự cố."}
      - {id: D, answer: "Contracts phải tách repository để Platform có thể sở hữu.", explanation: "Một đường dẫn trong repo chung vẫn có owner riêng."}
    correctAnswerId: C
  - id: "MONO-Q011"
    question: "Một PR monorepo sửa apps/web và libs/auth. Cần tổ chức trách nhiệm review thế nào?"
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "02-boundaries-and-ownership.md", anchor: "ownership-by-path-or-component"}
    apiRelated: {controller: "", methodSignature: ""}
    answers:
      - {id: A, answer: "Chỉ đưa toàn bộ diff cho Web vì Web tạo PR.", explanation: "Người tạo PR không thay thế chuyên môn miền xác thực."}
      - {id: B, answer: "Mời Web và Auth owners; rule host mới quyết định approval bắt buộc.", explanation: "Mapping đường dẫn có thể gọi reviewer; bắt buộc duyệt cần cấu hình host."}
      - {id: C, answer: "Cấp Read cho cả hai nhóm rồi coi như họ đủ điều kiện merge.", explanation: "Quyền đọc source khác quyền duyệt merge."}
      - {id: D, answer: "Phải tách repository trước khi review được thay đổi liên thư mục.", explanation: "Một lịch sử Git có thể có nhiều luồng owner review."}
    correctAnswerId: B
  - id: "MONO-Q012"
    question: "Checkout và Identity có repository riêng nhưng dùng chung interface xác thực. Điều gì vẫn cần thiết?"
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "02-boundaries-and-ownership.md", anchor: "ownership-by-repository"}
    apiRelated: {controller: "", methodSignature: ""}
    answers:
      - {id: A, answer: "Checkout có thể tự đổi contract xác thực mà không báo Identity.", explanation: "Consumer phải phối hợp khi interface phía cung cấp đổi."}
      - {id: B, answer: "Hai repository phải có cùng công cụ build và tên branch.", explanation: "Kho tách biệt có thể có công cụ và cách đặt branch riêng."}
      - {id: C, answer: "Identity cần review mọi lần Checkout cập nhật, kể cả nội bộ.", explanation: "Phạm vi review theo contract/owner bị ảnh hưởng, không theo số kho."}
      - {id: D, answer: "Giữ owner rõ và phối hợp tương thích trên giao diện dùng chung.", explanation: "Lịch sử riêng vẫn liên hệ qua trách nhiệm provider và consumer."}
    correctAnswerId: D
  - id: "MONO-Q013"
    question: "Các team khó tìm nơi dùng AuthClient trong polyrepo. Giải pháp nào trực tiếp cải thiện khả năng tìm mã?"
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "02-boundaries-and-ownership.md", anchor: "discoverability-and-reuse"}
    apiRelated: {controller: "", methodSignature: ""}
    answers:
      - {id: A, answer: "Dùng code search/catalog liên kho cho API và nơi đang sử dụng.", explanation: "Chỉ mục có thể tăng khả năng quan sát mà không cần gộp lịch sử Git."}
      - {id: B, answer: "Ép mọi consumer phát hành chung mà không lập danh mục tìm kiếm.", explanation: "Đồng bộ release không giúp tìm API dễ hơn."}
      - {id: C, answer: "Cho mọi team quyền ghi nhưng không ghi nhận owner thư viện.", explanation: "Quyền ghi không thay thế tìm kiếm và trách nhiệm."}
      - {id: D, answer: "Đặt tên repository trùng package để người dùng tự lần ra nơi gọi.", explanation: "Tên package không tạo chỉ mục nơi dùng trên nhiều kho."}
    correctAnswerId: A
  - id: "MONO-Q014"
    question: "Vendor được đọc monorepo Web+Fraud; CODEOWNERS yêu cầu Security review vùng Fraud. Fraud có được ẩn không?"
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "02-boundaries-and-ownership.md", anchor: "ownership-versus-access-control"}
    apiRelated: {controller: "", methodSignature: ""}
    answers:
      - {id: A, answer: "Có, vì CODEOWNERS áp quy tắc Security cho các thay đổi Fraud.", explanation: "Quy tắc review không thay đổi nội dung người có quyền đọc được clone."}
      - {id: B, answer: "Không; cần quyền đọc thực sự giới hạn nguồn Fraud.", explanation: "Owner review kiểm soát sửa đổi; phân quyền repository kiểm soát đọc."}
      - {id: C, answer: "Có, nếu CODEOWNERS ghi Fraud thuộc Security và Web thuộc vendor.", explanation: "Mapping owner không tự sinh ACL đọc ở mức file."}
      - {id: D, answer: "Không, trừ khi Fraud và Web dùng cùng pipeline triển khai.", explanation: "Cách triển khai không quyết định quyền xem mã clone."}
    correctAnswerId: B
  - id: "MONO-Q015"
    question: "Công ty sắp xếp lại team Web và Payments nhưng API không đổi. Điều đó nói gì về ranh giới repository?"
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "02-boundaries-and-ownership.md", anchor: "team-boundary-versus-repository-boundary"}
    apiRelated: {controller: "", methodSignature: ""}
    answers:
      - {id: A, answer: "Di chuyển mã theo org chart để reviewer map khớp từng manager.", explanation: "Tuyến báo cáo tổ chức có thể đổi độc lập với phụ thuộc kỹ thuật."}
      - {id: B, answer: "Bắt buộc mỗi team chỉ sở hữu đúng một repository.", explanation: "Số team và số repository không buộc tương ứng."}
      - {id: C, answer: "Bỏ toàn bộ owner đã ghi vì sơ đồ tổ chức thay đổi.", explanation: "Cần cập nhật liên hệ owner thay vì bỏ trách nhiệm."}
      - {id: D, answer: "Chỉ cập nhật ownership; chỉ đổi repo nếu ràng buộc nguồn thay đổi.", explanation: "Topology nên dựa trên ràng buộc bền vững, không theo mọi đổi nhân sự."}
    correctAnswerId: D
