  - question: "Vì sao cùng một yêu cầu đổi tên contract lại có chi phí phối hợp khác nhau tùy ranh giới kho mã?"
    answer: "Một lịch sử có thể cho reviewer thấy provider và consumer cùng lúc nhưng vẫn phải xét tương thích và owner. Nhiều lịch sử đòi hỏi các MR liên kết, bản phát hành dependency, thời điểm nâng cấp consumer và thứ tự rollout. Không mô hình nào tự cập nhật nguyên tử client đã deploy. Cần đo thời gian chờ, phạm vi test và lỗi thật thay vì chỉ đếm repo."
    aiGenerated: true
