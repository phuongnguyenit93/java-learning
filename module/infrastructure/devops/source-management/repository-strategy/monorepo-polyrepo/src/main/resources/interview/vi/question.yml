questions:
  - question: "Với Web và API là hai service độc lập, xác định topology repository bằng cách nào và vì sao không thể dựa vào kiến trúc runtime?"
    answer: "Tôi kiểm tra Git root và lịch sử commit thật sự chứa mã Web/API, không đếm số tiến trình triển khai. Chung một lịch sử là monorepo; có những lịch sử độc lập là nhiều repository. Build target, tên service và đơn vị deploy là trục khác. Cần xác minh remote và ranh giới source trước khi kết luận về governance."
    aiGenerated: true
