  - question: "Giải thích vì sao monorepo chứa ba component build riêng vẫn không tự biến thành ứng dụng nguyên khối."
    answer: "Monorepo mô tả ranh giới lịch sử Git, không phải cách đóng gói runtime. Web, API và Contracts vẫn có thể có build graph, artifact, owner và lịch triển khai riêng dù chung repository. Coupling đến từ interface/chính sách phát hành chứ không chỉ vị trí mã. Cần kiểm tra artifact và rollout thực tế trước khi nói tất cả deploy cùng."
    aiGenerated: true
    reviewed: false
    readmeRelated:
