  - question: "Vì sao cần phân biệt Java package, Gradle module, project và Git repository khi thiết kế trách nhiệm mã nguồn?"
    answer: "Java package là namespace của ngôn ngữ, Gradle module là đơn vị build khai báo, Git repository là ranh giới lịch sử nguồn. Một project có thể gồm nhiều package/module, và module có thể dùng artifact từ repo khác. Tôi phân owner theo thư mục mã và interface phụ thuộc thật, không suy quyền hay lịch release từ tên package."
    aiGenerated: true
    reviewed: false
    readmeRelated:
