      methodSignature: ""
  - question: "Trong polyrepo, vì sao library có thể lên 2.1 còn consumer dùng 1.9 và cần theo dõi gì?"
    answer: "Các lịch sử repository riêng cho provider và consumer chuẩn bị/phát hành theo lịch khác nhau. Tự chủ không bảo đảm tương thích runtime: library phải ghi contract được hỗ trợ và thời hạn bỏ phiên bản cũ. Tôi theo dõi dependency version trong build, artifact đã xuất, revision đang chạy, contract test và đường rollback trước khi xóa interface cũ."
    aiGenerated: true
