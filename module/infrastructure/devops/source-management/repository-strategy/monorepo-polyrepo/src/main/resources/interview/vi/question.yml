    answer: "Tôi chỉ có thể nói có một lịch sử Git chung chứa năm đơn vị deploy. Không thể suy ra monolith, một version phát hành, năm team hay rollout đồng thời. Cần xem contract service, artifact, phạm vi pipeline và owner theo đường dẫn. Deploy độc lập chỉ đáng tin khi kiểm tra tương thích và quy trình release/rollback chứng minh được; chung source không bảo đảm điều đó."
