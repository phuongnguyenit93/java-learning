  - question: "Workspace IDE có nhiều project cùng cấp và một Git submodule. Kiểm tra gì trước khi kết luận mono/polyrepo?"
    answer: "Cây thư mục IDE không xác định được lịch sử mã. Tôi tìm .git root, remote và commit ancestry của từng project, xem thư mục nào là submodule trỏ đến repo độc lập. Repo cha có thể tham chiếu submodule mà không sở hữu toàn bộ commit của nó. Cần báo ranh giới lịch sử thực, kể cả cấu trúc lai, thay vì đếm folder."
