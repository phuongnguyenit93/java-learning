  - question: "Web và API cùng lịch sử Git nhưng triển khai riêng. Làm thế nào chứng minh tính độc lập thay vì giả định?"
    answer: "Tôi xác định artifact riêng, pipeline hay quy trình release cho từng component và bằng chứng lần triển khai một bên mà không ép bên còn lại đổi. Sau đó kiểm tra contract tương thích ngược và rollback từng môi trường. Một commit có thể chứa cả hai mà không bắt buộc deploy đồng thời; chỉ có artifact riêng cũng chưa đủ chứng minh an toàn."
    aiGenerated: true
