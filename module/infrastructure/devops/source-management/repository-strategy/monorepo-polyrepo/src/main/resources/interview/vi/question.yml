  - question: "PR monorepo sửa Web và Auth. Phân phối review thế nào mà không nhầm CODEOWNERS với quyền truy cập?"
    answer: "Tôi mời owner của Web và Auth, yêu cầu từng nhóm đánh giá contract thuộc trách nhiệm và dùng rule code-owner/branch trên host nếu phải chặn merge. CODEOWNERS giúp định tuyến người review chứ không tự giấu file Auth khỏi người clone được kho. Cách ly quyền đọc cần ranh giới repository hoặc ACL được hỗ trợ và phải xem riêng."
