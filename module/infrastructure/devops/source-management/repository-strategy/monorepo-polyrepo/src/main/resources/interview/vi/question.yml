  - question: "Tại sao monorepo không đồng nghĩa ứng dụng monolith? Giải thích bằng ví dụ ranh giới service."
    answer: "Checkout và Inventory có thể chạy thành hai process, database và API contract riêng trong khi source vẫn chung một Git repository; đó vẫn có thể là microservice. Ngược lại, mã một ứng dụng nguyên khối có thể nằm ở nhiều repo. Topology quản lý lịch sử/governance, còn kiến trúc runtime nói về process, dữ liệu và giao tiếp. Không được lấy bằng chứng của trục này để kết luận trục kia."
    aiGenerated: true
