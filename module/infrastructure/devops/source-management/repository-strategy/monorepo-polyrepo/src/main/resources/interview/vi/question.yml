  - question: "Khi sơ đồ tổ chức đổi nhưng phụ thuộc source giữ nguyên, nhóm nên xét ownership và topology ra sao?"
    answer: "Tôi cập nhật đầu mối chịu trách nhiệm, reviewer, backup và escalation trước. Di chuyển repo chỉ để khớp cấp quản lý mới có thể gây chuyển lịch sử, phụ thuộc và CI mà không giải quyết kỹ thuật. Ranh giới source nên theo nhu cầu phối hợp, quyền và governance bền vững. Nếu tái tổ chức làm đổi bảo mật hoặc chủ thể release thì mới đánh giá lại có bằng chứng."
