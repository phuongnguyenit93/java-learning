  - question: "Vendor clone được monorepo Web+Fraud nhưng không được merge phần Fraud. Mã Fraud có được bảo mật đọc không?"
    answer: "Không. Quyền merge và CODEOWNERS kiểm soát ai sửa/duyệt, không làm biến mất file Fraud khỏi clone đã cấp cho vendor. Nếu yêu cầu là vendor không được thấy source Fraud, cần ranh giới đọc thật, thường là repo riêng hoặc cơ chế ACL đã xác minh trên nền tảng. Tôi thử quyền xem bằng tài khoản vendor trước khi chấp nhận thiết kế."
