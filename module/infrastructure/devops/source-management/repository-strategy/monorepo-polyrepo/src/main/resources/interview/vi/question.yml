  - question: "Khó tìm nơi gọi AuthClient trải khắp polyrepo. Đầu tư nào giúp và khi nào chưa cần gộp repo?"
    answer: "Code search liên repo, API catalog, dependency manifest và ví dụ có chỉ mục giúp tìm nơi dùng mà không đổi quyền sở hữu lịch sử Git. Tôi bổ sung inventory version/consumer để đánh giá tác động khi bỏ API. Gộp repo là quyết định cấu trúc lớn chỉ nên làm khi lợi ích phối hợp vượt chi phí quyền, release và tooling. Chỉ khó search chưa đủ chứng minh topology sai."
