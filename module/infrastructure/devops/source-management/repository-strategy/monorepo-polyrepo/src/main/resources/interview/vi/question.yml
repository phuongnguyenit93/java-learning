  - question: "Quản lý đang nhầm ownership, thay đổi phối hợp và release độc lập. Bạn yêu cầu ba loại bằng chứng nào?"
    answer: "Ownership cần bản đồ reviewer, maintainer và người xử lý sự cố; thay đổi phối hợp cần chuỗi diff/MR thể hiện các component ảnh hưởng nhau; độc lập release cần version artifact và log triển khai. Chúng liên quan nhưng không đồng nhất: một owner có thể giữ nhiều service, source đổi cùng lúc vẫn có thể deploy nhiều đợt. Nên đánh giá từng trục trước khi chọn topology."
    aiGenerated: true
