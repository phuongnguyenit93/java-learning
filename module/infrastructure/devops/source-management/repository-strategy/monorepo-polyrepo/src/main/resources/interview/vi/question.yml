  - question: "Vì sao Identity và Checkout nằm ở repository riêng vẫn cần owner contract và quy trình tiếp nhận phiên bản?"
    answer: "Lịch sử source tách biệt nhưng Checkout vẫn gọi Identity qua interface xác thực chung. Thay đổi không tương thích có thể làm hỏng consumer đang chạy dù mỗi repo đều test xanh. Tôi định nghĩa owner provider, đầu mối consumer, version hỗ trợ, contract check và thứ tự rollout rồi liên kết hồ sơ thay đổi. Tách source không xóa phụ thuộc runtime."
