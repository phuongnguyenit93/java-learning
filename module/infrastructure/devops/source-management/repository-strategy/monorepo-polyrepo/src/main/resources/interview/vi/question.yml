  - question: "Owner của Contracts dùng chung cần chịu trách nhiệm gì ngoài việc được ghi tên trong file?"
    answer: "Owner hữu ích phải phản hồi đề xuất sửa, quyết định tương thích, phân reviewer, báo consumer và xử lý khi thư viện gây lỗi. Tôi ghi backup, danh sách consumer và kênh escalation cho migration khẩn. Ownership không tự đồng nghĩa độc quyền đọc mã hay mọi sửa consumer đều phải xin duyệt; phạm vi review dựa trên tác động."
