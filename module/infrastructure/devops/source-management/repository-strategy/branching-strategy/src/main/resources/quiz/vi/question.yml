questions:
  - id: "BS-001"
    question: "Hai kỹ sư đều dùng nhánh Git nhưng tùy ý lúc nào mới merge. Nhóm còn thiếu gì?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-strategy-foundations.md"
      anchor: "why-branching-strategy"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Thiết lập host yêu cầu mở PR trước khi nhập main."
        explanation: "Host có thể bảo vệ điểm merge, nhưng chưa đặt nhịp tích hợp hay người chịu trách nhiệm."
      - id: B
        answer: "Bật CI cho mọi nhánh và dùng kết quả xanh để quyết định lúc merge."
        explanation: "CI chứng minh check đã chạy, không tự quy định thời hạn hay trách nhiệm review."
      - id: C
        answer: "Quy ước lúc tích hợp, người review và trách nhiệm phát hành."
        explanation: "Chiến lược bổ sung các quy tắc nhóm mà lệnh Git không có."
      - id: D
        answer: "Quy ước tên và tuổi nhánh cho từng người phát triển."
        explanation: "Tên và giới hạn tuổi nhánh không đủ xác định ai review, chấp nhận và hỗ trợ release."
    correctAnswerId: C
  - id: "BS-002"
    question: "Nhóm biết dùng git merge nhưng bất đồng PR nào được vào main. Thiếu loại quy tắc nào?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-strategy-foundations.md"
      anchor: "git-mechanics-vs-team-policy"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Chính sách chấp nhận của nhóm về review, test và người merge."
        explanation: "Git thực hiện hợp nhất; nhóm quyết định khi nào cho phép."
      - id: B
        answer: "Branch protection đòi commit được ký trước mỗi PR merge."
        explanation: "Commit có chữ ký xác nhận nguồn gốc, không đặt tiêu chuẩn nghiệp vụ hay trách nhiệm review."
      - id: C
        answer: "CI check chạy integration tests trên từng nhánh PR."
        explanation: "Test là một phần bằng chứng, nhưng không định nghĩa ai được quyết định chấp nhận."
      - id: D
        answer: "Danh sách reviewer mặc định cho repository chứa PR."
        explanation: "Phân công người xem không đủ quy định tiêu chí và quyền quyết định merge."
    correctAnswerId: A
  - id: "BS-003"
    question: "Hai nhánh checkout cùng sửa cấu hình suốt ba tuần. Bằng chứng nào tốt nhất cho thấy rủi ro tích hợp?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-strategy-foundations.md"
      anchor: "parallel-work-integration-risk"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Số commit mới nhất và quy ước tên nhánh mà không kiểm tra các chỉnh sửa chồng lấn."
        explanation: "Tên không cho biết nội dung xung đột hay mức phân kỳ."
      - id: B
        answer: "Số thành viên cài Git client và tần suất commit của họ trong cùng khoảng thời gian các nhánh phân kỳ."
        explanation: "Cài công cụ không phản ánh thay đổi chồng lấn."
      - id: C
        answer: "Mốc tag phát hành gần nhất để suy ra những thay đổi có thể đã xuất hiện trên production."
        explanation: "Tên bản phát hành cũ không xác định xung đột hiện tại."
      - id: D
        answer: "Khoảng cách merge-base, diff tệp sửa chung và thời gian chưa tích hợp."
        explanation: "Chúng cho thấy cả lịch sử phân kỳ lẫn nội dung bị sửa chồng."
    correctAnswerId: D
  - id: "BS-004"
    question: "Cách diễn giải vai trò nhánh nào không ép mọi nhóm phải dùng cả ba loại?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-strategy-foundations.md"
      anchor: "mainline-work-release-vocabulary"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Main chỉ để phát hành và mọi feature phải qua develop."
        explanation: "Đó là quy ước Git Flow, không phải quy tắc chung."
      - id: B
        answer: "Mainline nhận tích hợp; nhánh việc chứa thay đổi chờ; nhánh release ổn định khi cần."
        explanation: "Vai trò diễn tả mục đích, những nhánh bổ sung là tùy nhu cầu."
      - id: C
        answer: "Mỗi người giữ nhánh vĩnh viễn và phát hành từ nhánh của mình."
        explanation: "Nhánh cá nhân dài hạn không xác định nguồn chung đã chấp nhận."
      - id: D
        answer: "Nhánh release là nơi phát triển các feature chưa xong cho đến cột mốc chung tiếp theo."
        explanation: "Giai đoạn ổn định release thường hạn chế thêm feature mới."
    correctAnswerId: B
  - id: "BS-005"
    question: "PR đã merge vào main nhưng chưa chạy kiểm tra phát hành. Điều gì được chứng minh?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-strategy-foundations.md"
      anchor: "integrated-vs-releasable"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Commit đã vào main nên môi trường production chắc đang chạy mã mới."
        explanation: "Nhánh mã nguồn đã merge không chứng minh revision được triển khai."
      - id: B
        answer: "Mã đã vào main; chưa chứng minh bản phát hành đạt kiểm thử."
        explanation: "Merge chỉ ghi nhận nguồn chung, không xác nhận kiểm tra phát hành."
      - id: C
        answer: "Reviewer đã approve nên bản release cũng đạt các yêu cầu vận hành."
        explanation: "Approve thay đổi không bao gồm kiểm chứng release và môi trường."
      - id: D
        answer: "Git sẽ tự tạo release tag ngay sau khi merge PR thành công."
        explanation: "Merge Git không mặc định sinh nhãn phiên bản hoặc artefact phát hành."
    correctAnswerId: B
  - id: "BS-006"
    question: "Nhóm muốn chiến lược nhánh viết cả lệnh pipeline CI chi tiết. Ranh giới phù hợp là gì?"
