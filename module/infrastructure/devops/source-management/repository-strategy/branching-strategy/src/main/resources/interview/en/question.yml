  - question: "What does a non-fast-forward merge commit preserve, and why can its richer history help or complicate investigation?"
    answer: "A non-fast-forward merge commit typically has two parents, retaining the relationship between the target's previous tip and the integrated branch history. Individual feature commits remain reachable, useful for locating incremental reasoning or bisecting. The graph is less linear and reverting a whole merge requires understanding mainline parent selection; blindly applying a revert can be unsafe. Verify the merged tree and tests because ancestry preservation alone does not prove semantic correctness."
