    answer: "Mainline is an agreed integration reference; a work branch isolates a pending change; a release branch, when needed, stabilizes or maintains a selected version. These are team roles, not special Git object types. Continuous delivery teams may ship directly from a verified trunk without a permanent develop or release branch. Versioned products with long support windows may need more explicit branches and backport owners. Choose roles from delivery requirements, not the branch names shown in an illustration."
