  - question: "Why is successful use of git merge insufficient to authorize a change into the team's mainline?"
    answer: "A Git merge establishes a mechanical history transformation, not a team decision. A change can be merged textually yet break a payment contract or lack the required business review. The acceptance policy must identify reviewer competence, tests, permissions and the accountable merger. Hosting branch protections may enforce some checks, but a written agreement is not automatically enforced by Git. Audit both what Git recorded and why the team accepted it."
