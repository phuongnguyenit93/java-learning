    answer: "Inspect the merge base, number and nature of changed files, overlapping hunks and contract assumptions. Branch age and time since last integration indicate delayed feedback; raw commit count alone is a poor proxy because commits vary in scope. Run conflict previews or a disposable integration test rather than assuming same-file edits always conflict. Assign owners for the disputed behavior and split independent changes where possible."
