  - question: "A team uses Git branches freely but integration surprises keep recurring. How would you define a branching strategy beyond Git commands?"
    answer: "Git offers refs, merges and history but has no intrinsic opinion about review turnaround, branch lifetime or release accountability. A branching strategy defines when work meets a shared mainline, who judges the change, which tests are expected and who restores health after a failure. First map observed delays and ownership gaps, then document a workflow and its evidence. Merely requiring PRs or adopting a naming convention will not cure late integration."
