  - question: "Explain the normal origins and destinations of Git Flow feature, release and hotfix branches, including the active-release exception."
    answer: "A feature branch branches from develop and integrates back into develop. A release branch starts from develop, limits changes to stabilization, then reaches production main and propagates its fixes back to develop. A hotfix normally starts from the production line and updates main plus the continuing development line. In the original model, when a release branch is already active, the hotfix may propagate into that release branch rather than immediately into develop; record the actual branch destinations to prevent losing the fix."
