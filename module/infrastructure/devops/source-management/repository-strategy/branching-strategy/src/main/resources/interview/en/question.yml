  - question: "What is the difference between a written policy requiring two approvals and a hosting rule that really prevents unapproved merges?"
    answer: "A written agreement expresses expected conduct but Git refs and commits do not inspect human approvals. The hosting platform must support and be configured to enforce a relevant rule on the destination branch, and authorized bypass rights must also be considered. Some plans may only warn for certain checks. Test actual PR behavior with authorized actors, inspect rule scope and report gaps; claiming automatic enforcement from a policy document creates false confidence."
