  - question: "Why may rebase-and-merge be appropriate for a linear target history, and what does it do to commit identity?"
    answer: "The host can replay each source patch onto the destination's current tip, producing a linear sequence instead of a two-parent merge node. Replay generally creates new target commit IDs because parents or metadata differ, even when file contents look similar. This retains per-patch steps better than squash but does not preserve original ancestry identity. Communicate the mapping between source and target revisions and choose this style only when the team values that tradeoff."
