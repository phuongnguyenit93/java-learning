    answer: "The original model fits products that prepare numbered releases while new development continues and sometimes need urgent patches on a production line. It names long-lived production and develop roles plus feature, release and hotfix handoffs. That clarity costs synchronization work and can lengthen lead time for frequently deployed web services. Driessen's later reflection recommends simpler workflows for continuous delivery. Select by release/support obligations and evidence, not fashion."
