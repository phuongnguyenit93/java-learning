  - question: "How should a trunk-based team patch a supported release after trunk has moved ahead, and why is the direction of propagation important?"
    answer: "Reproduce and fix the defect on trunk with a test first, validate it in trunk CI, then selectively cherry-pick the necessary commit into the maintained release line and validate that line independently. This reduces the risk of a production-only fix being forgotten and later reintroduced. If the bug cannot be reproduced on trunk there can be exceptional reverse handling, but document that risk. Avoid merging all recent trunk features into a stabilization branch."
