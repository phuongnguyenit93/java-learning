  - question: "A PR dashboard shows a green gate. Why must a branching policy define the exact checks and exceptions instead of trusting the badge?"
    answer: "A green status only means the named check passed for some revision; it may omit compatibility testing, reviewer approval, security checks or post-merge validation. Define the gates, relevant commit, required reviewers, allowed exceptions and who may override each one. Different hosts and plans can enforce different subsets of a written policy. Audit the configuration and sample PRs to ensure the actual acceptance path matches the team's promise, particularly for emergency changes."
