  - question: "Merge commit non-fast-forward giữ điều gì và vì sao lịch sử phong phú hơn có thể vừa giúp vừa gây khó điều tra?"
    answer: "Merge commit non-fast-forward thường có hai parent, giữ quan hệ giữa tip cũ của đích và lịch sử nhánh được nhập. Các commit feature vẫn truy được, hữu ích khi điều tra từng bước hoặc bisect. Đồ thị phức tạp hơn và revert nguyên merge phải hiểu parent chính; làm bừa dễ sai. Cần kiểm tree sau merge và chạy test vì giữ tổ tiên không tự bảo đảm đúng nghiệp vụ."
