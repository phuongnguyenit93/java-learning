  - question: "Khi nào commit trực tiếp và nhánh PR ngắn cùng có thể tuân thủ chính sách trunk-based?"
    answer: "Bất biến quan trọng là thay đổi được kiểm chứng và hội tụ nhanh về trunk chung, không phải bắt buộc một quy trình giao diện. Nhóm có thể dùng commit trực tiếp có kiểm soát và CI ngay; nhóm khác dùng nhánh PR chỉ tồn tại đến khi được review/merge sớm. Cả hai vẫn cần trunk đáng tin và owner khôi phục. Hàng PR đã Approve nhưng đợi cả tuần mới merge làm mất mục tiêu hội tụ dù cuối cùng đều được duyệt."
