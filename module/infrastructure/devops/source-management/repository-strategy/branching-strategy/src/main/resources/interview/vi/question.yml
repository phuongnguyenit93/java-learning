      anchor: "git-mechanics-vs-team-policy"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Hai nhánh phân kỳ ba tuần và sửa cùng config. Bạn định lượng rủi ro trước khi chọn cách tích hợp thế nào?"
    answer: "Xem merge-base, số và loại file đã sửa, hunk chồng lấn và giả định contract. Tuổi branch và thời gian từ lần tích hợp cuối phản ánh phản hồi bị chậm; đếm commit đơn thuần kém ý nghĩa vì mỗi commit có phạm vi khác nhau. Có thể thử merge/test trong môi trường an toàn thay vì nghĩ cứ sửa chung file là xung đột. Giao owner cho hành vi đang tranh luận và tách những thay đổi độc lập khi được."
    aiGenerated: true
