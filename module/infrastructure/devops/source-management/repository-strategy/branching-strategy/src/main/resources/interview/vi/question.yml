  - question: "Thiết kế thử chính sách nhánh cho nhóm checkout sáu người. Đo thế nào để biết có hiệu quả?"
    answer: "Thử mục tiêu branch ngắn, tích hợp các lát tương thích hằng ngày, review trong ngày, checks liên quan bắt buộc và owner phục hồi mainline. Ghi nền về lead time PR, tuổi lúc merge, lần tích hợp lỗi, thời gian từ đỏ sang xanh và vùng thường conflict. Thử trên lượng công việc có ý nghĩa thay vì đánh giá một tuần yên ắng. Chỉnh chính sách từ số liệu và khả năng xử lý sự cố thật, không chỉ vì số PR tăng."
