  - question: "Nhóm nên quyết định dạng lịch sử đích thế nào khi tích hợp PR nhiều commit?"
    answer: "Chính sách lịch sử cân bằng điều người điều tra cần thấy: ranh giới commit gốc, khả năng revert theo cả PR, đồ thị tuyến tính và mức hữu ích của bisect. Merge commit giữ tổ tiên nhánh, squash tạo một thay đổi logic, còn rebase-and-merge phát lại các patch theo tuyến với SHA mới. Mỗi kiểu thay dấu vết và phạm vi rollback. Hãy thử các đồ thị mẫu theo sự cố thường gặp; không kiểu nào thay thế test hoặc review."
