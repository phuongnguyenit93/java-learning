  - question: "Conflict lặp lại ở cùng file config và message commit mơ hồ báo vấn đề quy trình nào, và bạn sẽ điều tra thế nào?"
    answer: "Tìm dấu hiệu owner contract chung chưa rõ, branch phân kỳ lâu, thiếu phối hợp khi đổi schema và PR không nêu lý do. So diff chồng lấn cùng thời điểm tích hợp thay vì đổ lỗi theo message ngắn. Giao owner contract, bổ sung ngữ cảnh review và test lát cắt tương thích sớm. Đo tần suất conflict, công sửa lại và thời gian phục hồi; đổi tên nhánh không giải quyết các giả định cạnh tranh."
