  - question: "Nhóm muốn review mã trong một ngày. Phần nào là thỏa thuận nhóm và phần nào host có thể thực thi?"
    answer: "Thời hạn phản hồi, cách báo động quá hạn và owner review là thỏa thuận con người và vận hành. Host có thể chặn theo số Approve, CODEOWNERS hay checks được hỗ trợ, nhưng PR tồn tại không khiến reviewer tự phản hồi đúng trong ngày. Cần theo dõi PR chờ review và có người thay thế. Tách SLA viết ra khỏi merge block đã cấu hình và kiểm cả hai khi audit."
