  - question: "Giải thích vai trò mainline, work và release branch có thể cùng tồn tại mà không thành quy tắc bắt buộc cho mọi nhóm."
    answer: "Mainline là mốc tích hợp đã thống nhất, work branch cô lập thay đổi chờ nhận, còn release branch chỉ khi cần để ổn định hoặc bảo trì phiên bản. Đây là vai trò do nhóm đặt, không phải loại object đặc biệt của Git. Đội continuous delivery có thể phát hành thẳng từ trunk đã test mà không cần develop hay release branch cố định. Sản phẩm versioned hỗ trợ lâu có thể cần nhánh và owner backport riêng. Chọn theo yêu cầu phân phối, không chép sơ đồ tên nhánh."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-strategy-foundations.md"
