  - question: "Năm PR mở qua hai sprint còn main tiếp tục tiến. Chỉ số nào phân biệt review hợp lý với phân kỳ nguy hiểm?"
    answer: "Đo tuổi branch, lần cập nhật từ trunk, khoảng merge-base, phần file sửa chồng lấn, diff chưa review và thời gian chờ phản hồi. Số PR đang mở có thể tăng vì công việc minh bạch hơn nhưng không chứng minh tích hợp nhanh. Chỉ ra contract rủi ro cao rồi nhờ owner tách thay đổi an toàn hoặc đóng đề xuất hết giá trị. Theo dõi merge muộn và lỗi mainline sau đổi chính sách thay vì chỉ mừng khi tổng PR nhỏ."
