  - question: "Hai nhóm đều dùng branch–PR–merge nhưng chỉ một nhóm tích hợp hằng ngày. So sánh GitHub Flow và Trunk-Based Development thế nào?"
    answer: "GitHub Flow là mẫu cộng tác gọn quanh default branch, PR và merge. Trunk-Based Development thêm yêu cầu mạnh về độ trễ tích hợp và mức phân kỳ: phần lớn thay đổi phải nhanh hội tụ vào trunk chung. Quy trình PR có thể hỗ trợ TBD nếu nhánh rất ngắn và CI giữ trunk khỏe, nhưng hàng nhánh tồn tại ba tuần không đạt mục tiêu đó dù đều mở PR. Cần so tuổi branch, thời gian chờ review và nhịp merge thực tế."
