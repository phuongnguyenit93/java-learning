  - question: "Sau merge, trunk CI đỏ. Cam kết phục hồi nào giúp một lỗi không làm cả nhóm tắc nghẽn?"
    answer: "Giao owner mainline hoặc trực xử lý nhận lỗi sớm, tìm revision nghi vấn rồi chọn revert hay fix nhỏ được kiểm chứng. Giữ trunk là điểm tích hợp chung thay vì âm thầm lập develop thứ hai. Phải đưa checks về xanh và xác nhận hành vi trước khi báo phục hồi, sau đó bổ sung test ngăn tái phát. Mục tiêu là giảm thời gian từ đỏ sang xanh và rõ người chịu trách nhiệm, không dựa hoàn toàn vào PR check cũ."
