  - question: "Feature hoàn tiền còn dang dở nhiều tuần. Nhóm có thể đưa từng phần lên trunk mà không mở hành vi thiếu tương thích ra sao?"
    answer: "Bắt đầu bằng thay đổi dữ liệu/API tương thích, thêm consumer chấp nhận contract cũ và mới rồi test từng trạng thái trung gian. Che hành vi người dùng bằng flag mặc định tắt hoặc branch-by-abstraction khi phù hợp. Di chuyển người dùng từng phần, quan sát kết quả rồi mới xóa đường cũ. Trunk phải build và vận hành được sau mỗi lần merge; chia feature chỉ có giá trị nếu mỗi lát cắt an toàn."
