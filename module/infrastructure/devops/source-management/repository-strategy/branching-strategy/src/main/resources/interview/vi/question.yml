  - question: "Điều gì cải thiện khi sửa checkout lớn được chia thành ba phần review độc lập thay vì một PR quá cỡ?"
    answer: "Các phần nhỏ tương thích rút ngắn khoảng cách từ viết mã đến phản hồi, dễ tìm giả định sai và giới hạn phạm vi revert. Tuy nhiên từng bước phải giữ tương thích API/dữ liệu; chia tùy tiện ba commit nguy hiểm không tự tốt hơn. Mỗi bước vẫn cần test và owner review phù hợp. Cần đo độ trễ review và lỗi tích hợp chứ không chỉ tăng số PR rồi coi là tiến bộ."
    aiGenerated: true
