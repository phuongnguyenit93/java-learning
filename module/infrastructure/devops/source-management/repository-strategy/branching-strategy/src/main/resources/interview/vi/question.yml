  - question: "Nhóm trunk-based nên vá release đang hỗ trợ thế nào khi trunk đã tiến, và vì sao hướng lan truyền bản vá quan trọng?"
    answer: "Tái hiện và sửa lỗi trên trunk cùng test trước, xác nhận qua CI của trunk, rồi cherry-pick có chọn lọc commit cần thiết sang release đang bảo trì và test riêng dòng đó. Hướng này giảm nguy cơ chỉ sửa production rồi quên đem về trunk khiến lỗi quay lại. Nếu không thể tái hiện trên trunk có thể cần xử lý ngoại lệ theo chiều ngược nhưng phải ghi rủi ro. Không merge mọi feature trunk mới vào nhánh ổn định."
