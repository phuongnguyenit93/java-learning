  - question: "Dashboard PR báo gate xanh. Vì sao chính sách nhánh phải nêu chính xác checks và ngoại lệ thay vì tin màu xanh?"
    answer: "Màu xanh chỉ cho biết check được đặt tên đã đạt trên revision nào đó; nó có thể thiếu contract test, Approve, security check hoặc kiểm sau merge. Phải xác định gate, commit áp dụng, reviewer cần thiết, ngoại lệ được phép và ai có quyền override. Các host/gói có thể enforce khác nhau so với tài liệu nhóm. Audit cấu hình và PR mẫu để đường tiếp nhận thật khớp cam kết, đặc biệt khi có thay đổi khẩn."
