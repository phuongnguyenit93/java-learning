    answer: "Host có thể phát lại từng patch nguồn lên tip đích hiện tại để có chuỗi tuyến tính thay vì nút merge hai parent. Việc phát lại thường tạo SHA đích mới do parent hoặc metadata khác dù nội dung file tương tự. Cách này giữ các bước patch tốt hơn squash nhưng không giữ danh tính tổ tiên gốc. Cần truyền đạt ánh xạ revision nguồn/đích và chỉ chọn khi nhóm muốn đánh đổi này."
