  - question: "Khi nào Git Flow cổ điển có giá trị thực so với cách dùng một mainline gọn hơn?"
    answer: "Mô hình gốc hợp với sản phẩm chuẩn bị các bản phát hành có số phiên bản trong lúc phát triển tiếp và đôi khi cần vá gấp dòng production. Nó đặt vai trò production/develop lâu dài và lộ trình feature, release, hotfix. Đổi lại có nhiều công đồng bộ và có thể tăng lead time của dịch vụ web deploy liên tục. Chính tác giả về sau khuyên mô hình đơn giản cho continuous delivery. Chọn theo nghĩa vụ phát hành/hỗ trợ và bằng chứng chứ không theo trào lưu."
