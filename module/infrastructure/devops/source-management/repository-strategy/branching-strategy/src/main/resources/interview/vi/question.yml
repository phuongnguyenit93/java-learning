questions:
  - question: "Nhóm sử dụng branch Git thoải mái nhưng cứ tích hợp là bất ngờ. Bạn sẽ định nghĩa chiến lược nhánh vượt khỏi các lệnh Git ra sao?"
    answer: "Git cung cấp ref, merge và lịch sử nhưng không tự quyết thời hạn review, tuổi branch hay trách nhiệm phát hành. Chiến lược nhánh xác định khi nào công việc hội tụ vào mainline, ai đánh giá, kiểm tra nào phải đạt và ai khôi phục sau lỗi. Trước hết đo sự chậm trễ và khoảng trống owner rồi thống nhất workflow có bằng chứng. Chỉ bắt mở PR hoặc quy ước tên nhánh không tự giải quyết tích hợp muộn."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-strategy-foundations.md"
      anchor: "why-branching-strategy"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Vì sao chạy git merge thành công chưa đủ để được phép đưa mã vào mainline của nhóm?"
    answer: "Git merge chỉ tạo biến đổi lịch sử về mặt kỹ thuật, không phải quyết định nhóm. Mã merge sạch vẫn có thể phá contract thanh toán hoặc thiếu review nghiệp vụ. Chính sách tiếp nhận phải xác định chuyên môn reviewer, test, quyền và người chịu trách nhiệm merge. Branch protection trên host có thể thực thi một phần checks nhưng quy ước viết ra không tự được Git chặn. Cần truy cả Git ghi gì và nhóm dựa vào đâu để nhận mã."
    aiGenerated: true
    reviewed: false
    readmeRelated:
