  - question: "Trình bày một thay đổi theo GitHub Flow và phân biệt bước thuộc Git với cộng tác trên host."
    answer: "Bắt đầu từ default branch, tạo work branch tập trung, commit và push thay đổi rồi mở PR để trình bày diff và mời review. Xử lý bình luận cùng checks cần đạt trước khi merge có quyền rồi xác nhận trạng thái nhánh đích. Git ghi cơ chế branch/commit; GitHub lưu hội thoại PR và bằng chứng chính sách. Deploy từ revision đã nhận là workflow riêng nhóm phải quy định và kiểm chứng, không tự xảy ra khi mở PR."
