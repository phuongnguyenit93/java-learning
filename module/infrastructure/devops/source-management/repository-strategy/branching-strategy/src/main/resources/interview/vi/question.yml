  - question: "Main và release/2.0 đã có patch bảo mật nhưng maintenance/1.9 còn thiếu. Bạn báo trạng thái và việc tiếp theo thế nào?"
    answer: "Khắc phục chưa hoàn tất khi 1.9 vẫn nằm trong danh sách bản bị ảnh hưởng đang hỗ trợ. Xác định owner và cách backport tương thích, test với phụ thuộc của 1.9 rồi phát hành patch có dấu vết artifact. Cherry-pick có thể tạo SHA khác nên so nội dung và hành vi thay vì đòi hash giống nhau. Nếu ngừng hỗ trợ, phải có quyết định và thông báo khách hàng rõ trước khi loại khỏi ma trận nghĩa vụ."
