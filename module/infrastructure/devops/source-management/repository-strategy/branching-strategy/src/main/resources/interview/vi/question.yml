    answer: "Squash đưa toàn bộ thay đổi logic thành một commit đích mô tả rõ, dễ revert cả đơn vị và giảm nhiễu WIP. Đổi lại các commit trung gian không còn là từng commit riêng trong tổ tiên nhánh đích, giảm chi tiết bisect theo bước. PR nguồn có thể vẫn lưu thảo luận nhưng không nên coi đó luôn thay cho lịch sử đích dài hạn. Cần message rõ mục tiêu và test snapshot tổng hợp."
