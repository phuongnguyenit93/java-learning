  - question: "Giải thích nguồn và đích thông thường của feature, release, hotfix theo Git Flow, kể cả ngoại lệ khi release branch đang mở."
    answer: "Feature branch tách từ develop và nhập lại develop. Release branch bắt đầu từ develop, chủ yếu sửa ổn định rồi về production main và đưa các fix trở lại develop. Hotfix thường tách từ dòng production rồi cập nhật main cùng dòng phát triển tiếp. Trong mô hình gốc, nếu release branch đang mở, hotfix có thể được nhập vào nhánh release đó thay vì lập tức vào develop; phải ghi rõ đích thật để không làm thất lạc bản vá."
