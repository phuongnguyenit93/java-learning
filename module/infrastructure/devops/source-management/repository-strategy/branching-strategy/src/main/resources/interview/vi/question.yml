  - question: "Bạn sẽ thiết kế thỏa thuận phản hồi review cho PR hóa đơn quan trọng thế nào?"
    answer: "Xác định reviewer hiểu làm tròn tiền, kịch bản phải kiểm, người dự phòng, hạn phản hồi lần đầu và lúc nào commit mới cần review lại. Chỉ đặt số Approve mà không định phạm vi nghiệp vụ dễ dẫn đến duyệt hời hợt. Đo tuổi PR đang chờ và hiệu quả escalations, đồng thời cấu hình checks được host hỗ trợ cho approvals. Host không chắc chặn được sự chậm trễ của con người nên vận hành vẫn cần owner và giám sát."
