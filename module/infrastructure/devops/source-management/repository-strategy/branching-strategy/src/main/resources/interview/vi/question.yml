  - question: "Quan sát vận hành nào chứng minh nhóm theo Trunk-Based Development thay vì chỉ đặt tên nhánh main?"
    answer: "Tìm bằng chứng thay đổi nhỏ được kiểm chứng và hội tụ thường xuyên vào một trunk chung, work branch ngắn nếu dùng, review nhanh và xử lý ngay khi mainline đỏ. Nhóm đợi nhiều tuần rồi mới merge lô feature vào nhánh tên main không thực hiện nhịp phản hồi mong muốn. Commit trực tiếp hoặc PR ngắn đều có thể phù hợp nếu gate và owner thật. Đo tuổi nhánh, thời gian tích hợp và sức khỏe build."
    aiGenerated: true
    reviewed: false
    readmeRelated:
