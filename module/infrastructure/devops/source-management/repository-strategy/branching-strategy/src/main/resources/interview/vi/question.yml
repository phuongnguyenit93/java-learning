  - question: "Ứng dụng web deploy hằng ngày và sản phẩm desktop ra bản theo quý cần chính sách nhánh khác nhau. Bạn giải thích lựa chọn thế nào?"
    answer: "Với web, tích hợp mainline nhanh cùng CI tốt và kiểm soát mở tính năng thường giảm lead time và conflict muộn. Desktop có thể cần ổn định release và maintenance lines cho khách hàng còn chạy bản cũ, nên chính sách phát hành rõ hơn có lý do. Không lựa chọn nào tự suy từ host hay lệnh Git. Ghi nhịp phân phối, khả năng rollback, số bản còn hỗ trợ và bằng chứng test, rồi đánh giá lại khi ràng buộc đổi."
