  - question: "Vì sao sơ đồ Git Flow cơ bản không quy định đầy đủ việc bảo trì ba phiên bản sản phẩm cũ đang hỗ trợ?"
    answer: "Sơ đồ cơ bản điều phối production, develop và một tiến trình phát hành, không tự quyết ngày hết hỗ trợ hay vá tất cả bản cũ. Ba phiên bản khách hàng có thể cần maintenance line riêng với API/phụ thuộc khác nhau. Lập ma trận version, lỗi bị ảnh hưởng, branch/tag, trạng thái vá, test, owner và ngày ngừng hỗ trợ. Hotfix trên main hiện tại không chứng minh binary cũ đã an toàn. Backport chọn lọc và kiểm từng dòng còn hỗ trợ."
