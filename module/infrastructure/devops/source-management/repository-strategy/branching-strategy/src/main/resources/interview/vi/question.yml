  - question: "So sánh đường đi hotfix production theo Git Flow cổ điển với chính sách trunk-first có release branch. Ngoại lệ nào cần biết?"
    answer: "Git Flow cổ điển thường tách hotfix từ production, đưa vào main production rồi đồng bộ sang dòng phát triển tiếp. Mô hình gốc còn xem release branch đang mở là đích có thể nhận hotfix thay vì nhập ngay develop. Trong trunk-first, tái hiện/sửa trên trunk, kiểm CI rồi cherry-pick sang các release còn hỗ trợ và test từng dòng. Nếu lỗi chỉ có ở nhánh cũ, phải ghi quy trình ngoại lệ và bảo đảm trunk không bỏ sót bản vá."
