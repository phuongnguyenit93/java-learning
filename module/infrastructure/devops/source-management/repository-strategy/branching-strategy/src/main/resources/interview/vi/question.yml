  - question: "Bạn sẽ chia một user story lớn thành thay đổi có thể merge riêng an toàn thế nào mà không đưa hành vi hỏng vào nguồn chung?"
    answer: "Dùng chuỗi expand-and-contract: thêm interface/schema tương thích ngược trước, chuyển consumer qua đường an toàn rồi mới xóa hành vi cũ khi đã migration. Mỗi phần cần build được, qua contract tests và không phá hành vi production hiện tại. Feature flag tắt có thể tách tích hợp khỏi mở chức năng. Reviewer sẽ xét thay đổi tập trung thay vì một mega-PR cuối kỳ, nhưng story tổng vẫn phải được theo dõi như mục tiêu chung."
    aiGenerated: true
