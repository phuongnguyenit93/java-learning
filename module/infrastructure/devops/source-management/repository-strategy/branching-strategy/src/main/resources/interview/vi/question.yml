  - question: "Khi CI sau merge làm main đỏ dù PR trước xanh, governance cần phân trách nhiệm và bằng chứng gì?"
    answer: "Giao owner mainline chịu trách nhiệm triage sớm, tìm commit nghi vấn và chọn revert đã test hoặc fix tiến. PR xanh có thể chưa kiểm tương tác với merge khác hay tree thật sau tích hợp. Cần đưa CI trunk về xanh, chạy regression test liên quan và lưu revision lỗi cùng revision đã phục hồi. Đừng chuyển công việc sang nhánh tích hợp bóng không quản trị; phục hồi nhanh giữ vòng phản hồi của cả đội."
