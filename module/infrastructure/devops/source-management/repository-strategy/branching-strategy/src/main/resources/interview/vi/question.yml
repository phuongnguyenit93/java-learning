  - question: "Bằng chứng nào cho thấy nhóm tự nhận trunk-based nhưng thực chất tích hợp feature chậm?"
    answer: "Xem thời gian tạo/merge branch, tuổi nhánh điển hình, khoảng merge-base, kích cỡ PR và số ngày thay đổi ở ngoài trunk. Trunk-based khỏe hội tụ nhanh kể cả khi dùng branch để review. Nhiều feature branch tồn tại qua vài sprint cho thấy phân kỳ tăng và phản hồi bị trì hoãn; release branch ngắn phục vụ phiên bản đang hỗ trợ là vai trò khác. Nên xem cùng sức khỏe mainline và thời gian xử lý regression."
