  - question: "Một feature cần một tháng nhưng nhóm phải tích hợp mỗi ngày. Feature flag giúp thế nào và còn rủi ro gì?"
    answer: "Flag tắt cho phép đưa các phần triển khai nhỏ vào trunk trong khi người dùng thường chưa vào đường mới. Test cả off/on, giá trị mặc định và ranh giới migration; đừng nghĩ flag tự làm schema hoặc API không tương thích trở nên an toàn. Giao owner, tiêu chí bật dần, giám sát và ngày xóa flag để tránh giữ mã phân nhánh vĩnh viễn. Như vậy việc tích hợp và việc mở chức năng là hai quyết định có kiểm soát riêng."
