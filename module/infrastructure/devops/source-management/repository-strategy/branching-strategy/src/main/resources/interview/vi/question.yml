  - question: "Khác nhau thế nào giữa tài liệu yêu cầu hai Approve và rule của host thực sự chặn merge thiếu phiếu?"
    answer: "Quy ước viết ra thể hiện hành vi mong đợi nhưng refs và commit Git không tự xét phiếu duyệt của người. Host phải hỗ trợ và được cấu hình để enforce rule đúng trên nhánh đích, kể cả kiểm quyền bypass. Một số gói chỉ cảnh báo vài checks. Cần thử PR bằng actor có quyền, kiểm phạm vi rule và báo khoảng cách; suy rằng văn bản tự chặn kỹ thuật sẽ tạo cảm giác an toàn giả."
