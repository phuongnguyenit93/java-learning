  - question: "PR đã merge vào main nhưng job release chưa chạy. Nhóm có thể khẳng định gì và điều gì chưa biết?"
    answer: "Nhánh đích đã chứa nguồn tích hợp được chấp nhận nếu kiểm kết quả merge thật. Điều đó không chứng minh artifact đã build, test release đã qua, có tag phiên bản hay production đã cập nhật. Tách chuỗi bằng chứng thành SHA nguồn được nhận, đầu vào/đầu ra build, duyệt release và môi trường deploy. Chiến lược nhánh có thể đặt tên gate và owner, còn CI/CD cùng hệ phân phối mới cung cấp bằng chứng vận hành."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-strategy-foundations.md"
      anchor: "integrated-vs-releasable"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Chính sách nhánh nên phối hợp với Git, quyền trên host và CI thế nào mà không lặp trách nhiệm của từng lớp?"
    answer: "Strategy xác định ý định: nhịp tích hợp, owner nhánh, điều kiện tiếp nhận và cam kết phục hồi. Git ghi commit, quan hệ cha và kết quả merge; host quản PR, reviewer và quyền merge; CI trả kết quả checks. Hệ phân phối mới chứng minh release/deploy. Nếu nhóm ghi 'phải có hai Approve' mà chưa bật rule trên host thì chỉ tồn tại quy ước xã hội, chưa có chặn kỹ thuật. Phải kiểm cả quy tắc đã hứa lẫn gate thực tế."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-strategy-foundations.md"
      anchor: "strategy-decisions-and-handoffs"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Vì sao feature branch tồn tại hai tuần cần cách đánh giá khác một release branch được hỗ trợ cũng hai tuần?"
    answer: "Feature branch giữ thay đổi ngoài dòng chung khiến lịch sử phân kỳ và phản hồi chậm. Release branch có thể cố ý giữ phiên bản đã giao trong lúc main tiếp tục, tuổi của nó phụ thuộc cam kết hỗ trợ và backport được kiểm chứng. Cần xem mục đích, lần tích hợp gần nhất, owner và chính sách hết hạn trước khi kết luận nhánh xấu. Rủi ro không chỉ là số ngày mà còn là thay đổi không kiểm soát và thiếu dấu vết đồng bộ."
    aiGenerated: true
    reviewed: false
    readmeRelated:
