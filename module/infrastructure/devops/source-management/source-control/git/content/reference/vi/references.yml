# ============================================================
# MODULE REFERENCE STRUCTURE
# ============================================================
#
# This is the shared module-level reference catalog.
# It is intentionally not split by MODULE_LANGUAGE.
#
# Example structure:
#
# references:
#   - title: "Java Language Specification"
#     url: "https://docs.oracle.com/javase/specs/"
#     description: "Official Java language specification."
#
# Add only curated references that are useful for the module.
# The build system must not overwrite this file after authored content exists.

references:
  - title: "Pro Git — What Is Git?"
    url: "https://git-scm.com/book/en/v2/Getting-Started-What-is-Git%3F"
    description: "Official Git project book introduction to snapshots, the three file states, the index, and the local repository."
  - title: "Pro Git — Recording Changes to the Repository"
    url: "https://git-scm.com/book/en/v2/Git-Basics-Recording-Changes-to-the-Repository"
    description: "Practical guide to tracking, staging, ignoring, comparing, and committing source changes."
  - title: "Pro Git — Branches in a Nutshell"
    url: "https://git-scm.com/book/en/v2/Git-Branching-Branches-in-a-Nutshell"
    description: "Explains the commit graph, branch pointers, HEAD, and movement between lines of history."
  - title: "Pro Git — Basic Branching and Merging"
    url: "https://git-scm.com/book/en/v2/Git-Branching-Basic-Branching-and-Merging"
    description: "Walks through local integration, merge commits, common ancestors, and conflict resolution."
  - title: "git-cherry-pick Documentation"
    url: "https://git-scm.com/docs/git-cherry-pick"
    description: "Official Git command reference for selectively applying commits and resolving cherry-pick conflicts."
  - title: "Pro Git — Remote Branches"
    url: "https://git-scm.com/book/en/v2/Git-Branching-Remote-Branches"
    description: "Explains remote-tracking references, fetching, upstream relationships, and sharing branches."
  - title: "Pro Git — Rebasing"
    url: "https://git-scm.com/book/en/v2/Git-Branching-Rebasing"
    description: "Explains commit replay, merge-versus-rebase history, and risks of rewriting shared commits."
  - title: "Pro Git — Stashing and Cleaning"
    url: "https://git-scm.com/book/en/v2/Git-Tools-Stashing-and-Cleaning"
    description: "Details temporary storage of unfinished work and cautions around removing local changes."
  - title: "Pro Git — Reset Demystified"
    url: "https://git-scm.com/book/en/v2/Git-Tools-Reset-Demystified"
    description: "Clarifies how HEAD, index, and working tree interact during reset and other recovery operations."
  - title: "git-restore Documentation"
    url: "https://git-scm.com/docs/git-restore"
    description: "Explains restoring tracked paths in the working tree and index, including destructive effects."
  - title: "git-revert Documentation"
    url: "https://git-scm.com/docs/git-revert"
    description: "Explains recording new commits to reverse earlier changes while retaining shared history."
  - title: "git-reflog Documentation"
    url: "https://git-scm.com/docs/git-reflog"
    description: "Explains local reference-movement history, locating prior reference values, and reflog expiration limits for recovery."
