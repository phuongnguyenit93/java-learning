      - id: B
        answer: Use `git diff A B -- README.md` with verified IDs.
        explanation: That compares the tracked file snapshots at the two selected history points.
      - id: C
        answer: Run git diff --cached in the current working tree.
        explanation: Cached diff compares index and HEAD, not arbitrary historical commits.
      - id: D
        answer: Run git blame and infer the full A-to-B patch.
        explanation: Blame can help locate provenance but does not replace an explicit two-revision diff.
