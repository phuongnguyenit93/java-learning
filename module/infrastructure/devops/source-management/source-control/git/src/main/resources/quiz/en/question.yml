        explanation: Commit -a includes tracked modifications without selective hunk review.
      - id: C
        answer: Push main so the remote receives only the rounding fix.
        explanation: Push transfers commits; it does not select worktree hunks.
      - id: D
        answer: Use git add -p, then inspect git diff --cached.
        explanation: Patch staging can select relevant hunks, then the index diff verifies selection.
