      anchor: initialize-and-clone
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: Both repositories contain those three source commits at creation.
        explanation: git init creates an empty local history, not a copy of another source.
      - id: B
        answer: Clone has source history; fresh init has no commits yet.
        explanation: Clone fetches existing history; init initializes repository metadata.
      - id: C
        answer: Init creates a pull request while clone creates only files.
        explanation: Pull requests are hosted collaboration features, not git init results.
      - id: D
        answer: Cloning checks out every remote-tracking branch as a local branch.
        explanation: A clone usually checks out one local branch, also recording other remote-tracking refs.
