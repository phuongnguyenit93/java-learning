        explanation: These inspect commit history and refs, not the two current diff boundaries.
      - id: B
        answer: git show HEAD followed by git ls-remote.
        explanation: These show a recorded commit and remote refs, not both pending diff areas.
      - id: C
        answer: "`git diff` versus `git diff --cached`."
        explanation: The first compares worktree to index; the second compares index to HEAD.
      - id: D
        answer: git fetch followed by git pull --ff-only.
        explanation: These exchange and integrate history rather than inspect two staged states.
