    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: Check staged and unstaged files with `git status`.
        explanation: Status is the direct starting point for identifying pending change states.
      - id: B
        answer: Run `git log -p` to inspect changes that have not been staged.
        explanation: Log -p inspects recorded commit patches, not pending uncommitted edits.
      - id: C
        answer: Run git show HEAD to enumerate untracked files.
        explanation: HEAD is an existing commit snapshot, which does not include untracked files.
      - id: D
        answer: Run git branch to inspect the index contents.
        explanation: Branch names and tips cannot replace status for staging information.
