  - id: git-official-help
    question: Binh is unsure which git restore options are safe while holding uncommitted work. What should Binh do before experimenting?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 01-git-foundations.md
      anchor: git-command-reference-and-docs
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: Run git restore --source=HEAD -- . in the working repo.
        explanation: That can overwrite unstaged content and is not a safe help lookup.
      - id: B
        answer: Run git reset --hard to simplify the repository state.
        explanation: Hard reset can discard changes; it is not documentation access.
      - id: C
        answer: Read `git help restore` before changing repository files.
        explanation: These sources explain behavior and risks without changing repository data.
      - id: D
        answer: Run `git restore README.md` on the active worktree to learn its defaults.
        explanation: Restore can overwrite unstaged edits; destructive experimentation on real work is not a documentation lookup.
    correctAnswerId: C
  - id: status-before-add
    question: An is about to commit on a feature branch but cannot tell which edits are staged. Which inspection addresses that directly?
    aiGenerated: true
