# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: git-identity-vcs
    question: An records a commit on a laptop during a network outage while GitHub is unreachable. Which conclusion reflects Git's role?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 01-git-foundations.md
      anchor: what-is-git
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: Commits require GitHub to confirm the new revision.
        explanation: That confuses a distributed version-control tool with a hosting service.
      - id: B
        answer: Git can commit locally and share the revision later.
        explanation: Git owns local history; publication to a hosting service is a separate action.
      - id: C
        answer: Only working files can change until connectivity returns.
        explanation: Local Git can create commits and inspect history without a server.
      - id: D
        answer: The local commit appears on hosted main immediately.
        explanation: Remote refs do not update automatically after a local commit.
    correctAnswerId: B
  - id: git-snapshot-model
    question: Two consecutive commits modify just one tracked file while other files stay unchanged. How should their stored state be understood?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 01-git-foundations.md
      anchor: why-git-snapshots
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: Each commit is only a log of keystrokes typed by its author.
        explanation: Git records tracked snapshots, not a transcript of editing actions.
      - id: B
        answer: A commit omits unchanged files from its project tree.
        explanation: Each commit identifies the full recorded tree, reusing unchanged objects.
      - id: C
        answer: Commits refer to full tree snapshots and reuse unchanged objects.
        explanation: Git commits reference snapshots while content-addressed objects avoid needless duplicates.
      - id: D
        answer: A commit includes ignored files from the entire working directory.
        explanation: Commit contents come from the index, not arbitrary ignored disk files.
    correctAnswerId: C
  - id: git-staged-again
    question: An edits README into version B, stages it, then edits the file again into version C. What would an immediate commit record?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 01-git-foundations.md
      anchor: index-and-three-areas
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: Version A from HEAD before any edits were made.
        explanation: HEAD is the prior reference; the index was already updated to B.
      - id: B
        answer: Version C currently visible in the working tree.
        explanation: The second edit is not staged merely because the file was staged earlier.
      - id: C
        answer: Both B and C as two automatically created commits.
        explanation: A single commit records the index snapshot and does not split edits automatically.
      - id: D
        answer: Version B currently recorded in the staging index.
        explanation: A commit records the staged content; subsequent working-tree edits remain separate.
    correctAnswerId: D
  - id: git-tracked-state-after-add
