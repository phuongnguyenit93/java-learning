        answer: C appears in reflog and therefore has a stable branch-like reference.
        explanation: Reflog can aid recovery but does not provide a durable named branch ref.
      - id: B
        answer: C is automatically pushed to all remote branches.
        explanation: Detached state does not publish or manage remote refs.
      - id: C
        answer: C automatically makes the main branch point to C.
        explanation: The existing main ref is not moved just by detached commits.
      - id: D
        answer: C can lose its named reference when HEAD moves away.
        explanation: A new branch provides a durable named reference rather than relying on reflog.
