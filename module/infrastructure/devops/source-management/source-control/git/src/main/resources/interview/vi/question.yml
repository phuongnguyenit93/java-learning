  - question: "Nhánh hotfix có bốn commits nhưng bản release cũ chỉ cần một security patch. Vì sao cherry-pick hợp lý và còn rủi ro nào?"
    answer: "Cherry-pick một SHA mang patch chọn lọc vào nhánh release dưới một commit mới, thay vì merge toàn bộ lịch sử reachable của hotfix. Do base khác nhau, patch có thể conflict, phụ thuộc commit trước đó hoặc tạo behavior không tương thích. Tôi kiểm phạm vi và dependencies, áp dụng commit trên release riêng, giải conflict nếu có rồi test regression. Nếu cherry-pick fail, dùng --abort phù hợp; đừng force-push tags hoặc giả định SHA giữ nguyên khi patch được tái áp dụng."
