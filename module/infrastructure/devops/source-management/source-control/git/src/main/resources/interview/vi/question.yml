  - question: "Tại sao git diff A B -- README khác với git diff --cached và git blame khi điều tra một thay đổi cũ?"
    answer: "git diff A B -- README.md so hai snapshots đã ghi, thích hợp xác định chính xác patch giữa hai revision. git diff --cached nhìn index hiện tại so với HEAD, không mặc định liên quan A và B. git blame cung cấp provenance theo dòng trong một revision, hữu ích tìm commit tác giả nhưng không thay báo cáo delta giữa hai mốc. Tôi xác minh A/B là commit IDs đúng trước khi diễn giải kết quả."
