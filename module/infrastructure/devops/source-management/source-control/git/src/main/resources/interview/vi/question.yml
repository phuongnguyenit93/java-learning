  - question: "Bạn staged README rồi sửa tiếp; cần chứng minh phần nào đang staged và phần nào chưa bằng những so sánh nào?"
    answer: "git diff so working tree với index để thấy phần sửa sau git add. git diff --cached (hoặc --staged) so index với HEAD để thấy snapshot sẽ vào commit. Dùng thêm git status để phân loại và git diff --cached -- README.md để giới hạn đúng path. Nếu staged diff không đúng scope, sửa index trước khi commit; chỉ nhìn editor có thể đánh lừa về nội dung snapshot."
    aiGenerated: true
