  - question: "Khi nào Git fast-forward merge mà không tạo merge commit, và điều đó khác merge commit hai parent ở đâu?"
    answer: "Nếu tip đích B là ancestor của tip nguồn C và policy cho phép fast-forward, Git chỉ cần di chuyển ref đích tới C; C giữ nguyên SHA và không tạo merge commit. Khi hai nhánh đã phân kỳ, cần tích hợp thay đổi bằng three-way merge, thường tạo commit mới có hai parents nếu nội dung giải quyết được. Có thể dùng --no-ff để ghi merge commit dù fast-forward khả thi theo quy trình đội. Dùng git merge-base, log --graph và kiểm tree sau merge để xác nhận kết quả."
