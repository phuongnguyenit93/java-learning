  - question: "Một file chứa sửa bug lẫn formatting ngoài phạm vi. Vì sao git add -p tốt hơn commit -a, và giới hạn của hunk selection?"
    answer: "git add -p cho xem từng hunk để đưa riêng phần cần thiết vào index; sau đó dùng git diff --cached xác minh. git commit -a tự stage nhiều chỉnh sửa tracked và không phân biệt mục tiêu nghiệp vụ. Nếu bug và formatting nằm cùng hunk, có thể tách bằng sửa code, split hunk khi hỗ trợ hoặc dùng chế độ edit patch thật cẩn thận. Không coi commit message là cách loại phần ngoài scope đã stage."
    aiGenerated: true
