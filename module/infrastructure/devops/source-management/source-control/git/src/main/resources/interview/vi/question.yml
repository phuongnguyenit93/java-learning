  - question: "Trước khi commit trong repo nhiều file, vì sao git status vẫn là điểm đầu tốt dù có git log?"
    answer: "git status mô tả worktree, index, untracked files và nhánh hiện tại; log chỉ liệt kê commit đã ghi. Tôi dùng status chọn file cần stage, đọc diff thường và cached, rồi kiểm status lần cuối sau add. Nếu có file cấu hình bí mật untracked, ngăn đưa vào index trước khi commit. Như vậy commit được tạo từ đúng ý định, không dựa vào lịch sử cũ để đoán dữ liệu đang chờ."
