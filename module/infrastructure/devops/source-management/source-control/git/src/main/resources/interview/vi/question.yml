  - question: "So sánh git init và git clone khi chuẩn bị thực hành trên repo có lịch sử. Những bằng chứng nào khác nhau?"
    answer: "git init tạo metadata .git mới tại thư mục, thường chưa có commit hoặc remote trừ khi thiết lập thêm. git clone lấy object/history và refs từ nguồn, thường cấu hình origin, tạo local branch checkout và remote-tracking refs. Xác minh bằng git log, git branch -avv và git remote -v. Không kết luận clone đã checkout mọi remote branch thành local branch."
    aiGenerated: true
