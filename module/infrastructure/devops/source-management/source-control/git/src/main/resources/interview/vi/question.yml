  - question: "Sau merge bị conflict, hãy giải thích index stages và cách xác nhận còn đường dẫn chưa resolve."
    answer: "Khi chưa resolve, index có thể chứa stage 1 (base), stage 2 (ours) và stage 3 (theirs) cho path xung đột thay vì một entry stage 0 bình thường. git ls-files -u liệt kê các stage còn unmerged; git status cho biết trạng thái cần xử lý. Tôi đọc file markers hoặc công cụ mergetool, sửa theo nghiệp vụ, chạy test, rồi git add path để đánh dấu đã resolve. Chỉ commit sau khi không còn unmerged entries; không giữ markers xung đột làm mã nguồn."
