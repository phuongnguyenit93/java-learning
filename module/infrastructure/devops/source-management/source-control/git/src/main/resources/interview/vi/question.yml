  - question: "Hai nhánh cùng trỏ commit B; nếu commit C trên feature thì main có tiến theo không? Giải thích cấu trúc refs."
    answer: "Branch thông thường là ref có thể di chuyển, trỏ tới commit ID; HEAD symbolic ref thường chỉ nhánh hiện tại. Commit C được tạo với parent B rồi feature ref tiến tới C, còn main tiếp tục trỏ B trừ khi có cập nhật riêng. Git không nhân đôi toàn bộ thư mục hay chuyển các nhánh khác cùng lúc. Dùng git log --graph --decorate --all và git show-ref để quan sát commit graph, tránh đoán từ tên nhánh."
