  - question: "Khi có edit chưa commit và git switch sang branch khác, vì sao Git có lúc cho phép, có lúc từ chối?"
    answer: "Checkout/switch cần cập nhật file trong working tree theo target commit nhưng phải bảo vệ sửa đổi cục bộ không bị ghi đè. Nếu nội dung chưa commit không va chạm các file phải đổi, Git có thể giữ edit; nếu có nguy cơ mất dữ liệu, Git thường từ chối. Tôi kiểm git status và diff trước, sau đó commit/stash có chủ đích hoặc quay lại clean worktree. Không giả định Git tự stash, tự commit, hay luôn hủy sửa."
