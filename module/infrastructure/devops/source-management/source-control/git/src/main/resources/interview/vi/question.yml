  - question: "Repo từng commit .env chứa secret rồi thêm .gitignore. Vì sao chưa đủ và cần xử lý lịch sử như thế nào?"
    answer: ".gitignore chủ yếu ngăn file chưa track xuất hiện để add; file đã tracked không tự mất khỏi index hay commit cũ. Dừng ghi secret mới, thay credential bị lộ, bỏ tracking bằng thao tác phù hợp và phối hợp xóa khỏi history nếu thực sự cần theo chính sách repo. Rewrite shared history có ảnh hưởng clone khác nên phải lên kế hoạch với đội. Ignore không phải cơ chế mã hóa hay thu hồi credential."
    aiGenerated: true
