  - question: "Terminal báo commit thành công. Bạn chứng minh điều gì từ kết quả đó, và điều gì cần test hay review riêng?"
    answer: "Commit thành công chứng minh Git tạo snapshot từ index và cập nhật ref tương ứng. Nó không chứng minh tests xanh, công thức đúng, PR đã được duyệt, remote main đã nhận hay file unstaged được ghi. Tôi dùng git show --stat/--patch và git status để kiểm nội dung đã commit, rồi chạy tests và quy trình review/CI riêng. Tránh báo “đã release” chỉ từ một dòng log commit."
