  - question: "Sau merge, cặp lệnh nào chứng minh positions của branch/tag và quan hệ DAG thay vì chỉ liệt kê tên?"
    answer: "git show-ref --heads --tags liệt kê ref name tới object ID, còn git log --graph --decorate --all vẽ ancestry và nhãn tại commits. Cặp này giúp thấy main, feature và version tag cùng hay khác SHA; git branch -avv cũng có ích cho tracking nhưng không phải biểu đồ đầy đủ. Tôi đối chiếu graph với merge kết quả thực, sau đó dùng git diff hay git show để xác nhận nội dung. Đừng suy đoán lịch sử chỉ từ git tag -l."
