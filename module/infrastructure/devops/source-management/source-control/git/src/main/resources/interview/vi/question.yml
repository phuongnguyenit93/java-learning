  - question: "Vì sao annotated tag v1.0 vẫn ở commit B khi main đã tới C, và tag khác GitHub Release ở điểm nào?"
    answer: "Branch cập nhật khi commit trên nhánh đó; tag bình thường là tên cố định gắn một mốc lịch sử. Annotated tag có object metadata riêng cho tagger, message và target, nhưng không tự di chuyển khi main tiến. Tag không sửa commit graph hay tạo bản công bố host. GitHub Release là metadata có notes/assets riêng, và cả tag lẫn Release không chứng minh deployment. Kiểm git show v1.0 và git log --decorate trước khi báo phiên bản nào đã được phát hành."
