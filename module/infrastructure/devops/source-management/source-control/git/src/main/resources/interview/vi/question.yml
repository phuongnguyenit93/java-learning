  - question: "Shared commit C đã sai nhưng working tree còn edit D chưa commit. Hãy quyết định undo mà không xóa D hoặc rewrite lịch sử chung."
    answer: "Đầu tiên git status và diff để phân loại D là tracked/unstaged/staged/untracked, giữ D bằng commit riêng hoặc stash/patch phù hợp theo trạng thái. Với C đã publish, ưu tiên git revert C để ghi commit đảo có dấu vết; tránh reset --hard/force push lên shared main. Kiểm revert có conflict hay phụ thuộc commit sau, chạy tests rồi đối chiếu lịch sử. Chỉ khôi phục D khi worktree phù hợp; đọc status cuối cùng. Không gộp xử lý local uncommitted và shared commit vào một lệnh destructive."
