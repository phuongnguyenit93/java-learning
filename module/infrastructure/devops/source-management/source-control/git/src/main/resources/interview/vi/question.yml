  - question: "Hai nhánh cùng tách từ B rồi mỗi bên sửa mã. Vì sao merge cần common ancestor thay vì chỉ so hai bản cuối?"
    answer: "Three-way merge so snapshot B với hai tips C và D để nhận diện bên nào đổi phần nào. Nếu một phía giữ nguyên còn phía kia sửa, Git có thể chọn thay đổi; nếu cùng vùng có edits cạnh tranh không hòa hợp, phải giải conflict. Chỉ so C và D không cho biết thay đổi nào được đưa vào từ tổ tiên. Tôi kiểm git merge-base C D, đọc diff B..C và B..D, rồi review kết quả tree; không coi xung đột là bằng chứng người nào sai."
