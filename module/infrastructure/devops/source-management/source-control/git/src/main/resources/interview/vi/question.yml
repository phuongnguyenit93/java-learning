  - question: "Xóa feature branch sau merge cần phân biệt -d và -D như thế nào để tránh mất tên ref duy nhất?"
    answer: "git branch -d yêu cầu Git kiểm điều kiện merged trước khi xóa ref; từ nhánh main nên đọc graph và xác nhận commit đã được giữ ở ref cần thiết. -D bỏ qua kiểm tra này và có thể làm commit không còn tên branch truy cập ổn định. Dù object vẫn có thể tồn tại hoặc tìm bằng reflog, không nên dựa vào thu gom dữ liệu để phục hồi. Tôi không xóa branch đang checkout, kiểm bản local/remote riêng và giữ SHA quan trọng trước tác vụ."
