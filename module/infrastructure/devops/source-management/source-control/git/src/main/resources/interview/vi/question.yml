  - question: "Vì sao commit mới trong detached HEAD dễ mất dấu khi checkout nơi khác và làm thế nào giữ lại?"
    answer: "Khi git switch --detach B, HEAD trỏ trực tiếp tới commit B thay vì branch ref. Commit C vẫn là object hợp lệ nhưng HEAD đang detached; khi checkout nơi khác, không branch nào nhất thiết tiếp tục trỏ C. Reflog có thể còn ghi C nhưng có thời hạn và không thay thế ref ổn định. Nếu cần giữ, tạo branch tại C bằng git switch -c <tên> khi vẫn ở C hoặc git branch <tên> <SHA> sau khi tìm lại. Xác minh với git show-ref và log."
