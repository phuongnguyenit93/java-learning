  - question: "Git graph cho thấy commit C vào main; team muốn tuyên bố đã review và production deploy. Bạn yêu cầu bộ bằng chứng cuối nào?"
    answer: "Git graph chứng minh reachability của C từ main tại thời điểm quan sát; nó không lưu phiếu reviewer trên GitHub/GitLab và không biết production chạy artifact nào. Tôi đối chiếu SHA trên remote target, PR Merged và approvals/checks từ hosting, tiếp theo CI build artifact SHA/digest, deployment run, environment và runtime version thực. Issue Closed, release tag hay commit trailer không tự thay các bằng chứng đó. Báo riêng accepted source, hosted review và deployed runtime, nêu rõ mục nào chưa xác nhận."
