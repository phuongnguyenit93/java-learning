    answer: "Tạo common base B chứa dòng price=...; từ B làm hai nhánh với commit C và D cùng sửa dòng đó theo hai cách cạnh tranh. Fetch/merge từ một nhánh vào nhánh còn lại để Git so B,C,D và báo conflict nếu không tự hòa giải. Quan sát git status, git ls-files -u và markers trong file. Giải thích ours/theirs theo operation cụ thể, chọn behavior đúng, git add rồi commit và test; không tạo conflict bằng cách đổi tag hay xóa branch. Dùng repo demo riêng để tránh mất dữ liệu."
