  - question: "Khi chưa hiểu git restore và sợ mất file đang sửa, bạn điều tra an toàn bằng tài liệu và trạng thái ra sao?"
    answer: "Bắt đầu bằng git status, git diff và git diff --cached để biết dữ liệu nằm ở đâu. Đọc git help restore hoặc trang git-scm.com/docs/git-restore, chú ý khác biệt --staged, --worktree, --source và phạm vi path. Không thử restore, reset --hard hoặc clean trực tiếp trên working tree chứa dữ liệu quan trọng để học cú pháp. Dùng repo demo hoặc branch/snapshot dự phòng để thực nghiệm."
