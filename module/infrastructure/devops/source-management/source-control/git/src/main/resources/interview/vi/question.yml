  - question: "Phát hiện merge đang conflict do giả định sai. So sánh git merge --abort với reset --hard ORIG_HEAD về an toàn."
    answer: "Nếu merge còn đang diễn ra, đầu tiên đọc git status và diff để phân biệt thay đổi trước merge với thay đổi phát sinh. git merge --abort được thiết kế thử quay về trạng thái trước merge, nhưng có thể không bảo toàn một số chỉnh sửa đang chồng lấn; cần biết trạng thái trước khi chạy. git reset --hard ORIG_HEAD ghi lại index và worktree, có thể xóa sửa cục bộ. Tôi ưu tiên lệnh abort đúng trạng thái, lưu patch nếu cần và kiểm status sau hủy."
