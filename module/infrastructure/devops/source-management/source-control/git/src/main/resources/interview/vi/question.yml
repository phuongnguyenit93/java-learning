questions:
  - question: "Một nhóm có mạng bị ngắt nhưng vẫn cần ghi lịch sử mã. Bạn giải thích vì sao Git hoạt động offline và GitHub đóng vai trò gì?"
    answer: "Git là hệ quản lý phiên bản phân tán; clone local có object database, index, HEAD và refs để ghi commit mà không cần server. GitHub là dịch vụ lưu và cộng tác sau đó: push/fetch trao đổi refs, còn PR/review là metadata ở host. Commit local không đồng nghĩa remote main thay đổi. Khi có mạng, xác minh remote URL, quyền push và branch target trước khi chia sẻ."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-git-foundations.md"
      anchor: "what-is-git"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Tại sao nói Git lưu snapshot chứ không chỉ ghi dòng diff, và object không đổi có bị sao chép mỗi lần commit không?"
    answer: "Mỗi commit tham chiếu tới tree mô tả snapshot nội dung đã stage, với blob/tree objects theo content hash. Các object không đổi có thể dùng lại, nên hai commit sửa một file vẫn định nghĩa trạng thái toàn cây mà không cần tạo bản sao vật lý cho mọi file. Git vẫn có thể tính diff giữa hai snapshots để hiển thị. Snapshot không tự bao gồm file ignored hoặc unstaged."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-git-foundations.md"
      anchor: "why-git-snapshots"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Giải thích ba vùng HEAD/index/working tree bằng trường hợp sửa file A→B, git add, rồi sửa thành C trước commit."
    answer: "HEAD chỉ phiên bản A đã ghi trước đó. Sau git add, index giữ B; working tree sau lần sửa cuối là C. git commit bình thường chụp index B, còn sửa C vẫn nằm ngoài commit cho tới khi stage lại. Để quan sát, so git diff (working tree↔index), git diff --cached (index↔HEAD), và git status. Đây là lý do phải đọc staged diff trước commit."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "01-git-foundations.md"
      anchor: "index-and-three-areas"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Một file tracked hiển thị MM trong git status --short. Hai chữ M có ý nghĩa gì và làm sao chứng minh?"
    answer: "Cột thứ nhất so index với HEAD, cột thứ hai so working tree với index. MM nghĩa là có cả thay đổi đã stage lẫn thay đổi tiếp theo chưa stage trên cùng file; không phải hai lần merge hoặc hai tác giả. Chạy git diff --cached và git diff trên file để xem từng phần. Nếu muốn commit cả hai, phải stage bản working tree mới rồi đọc lại status."
    aiGenerated: true
