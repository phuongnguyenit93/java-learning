# <quiz-schema>
# Cấu trúc câu hỏi Quiz
# schema-version: 3
#
# questions [kiểu: list; bắt buộc; mặc định: []; duy nhất theo: id]
#   Danh sách câu hỏi Quiz của module trong language hiện tại.
#   mỗi phần tử:
#     id [kiểu: string; bắt buộc; mặc định: ""]
#       ID ổn định và duy nhất của câu hỏi.
#     question [kiểu: string; bắt buộc; mặc định: ""]
#       Nội dung câu hỏi hiển thị cho người học.
#     aiGenerated [kiểu: boolean; bắt buộc; mặc định: true]
#       Đánh dấu câu hỏi được sinh bởi AI. Mặc định true cho nội dung mới.
#     reviewed [kiểu: boolean; bắt buộc; mặc định: false]
#       Đánh dấu câu hỏi đã được con người kiểm tra và chỉnh sửa. Mặc định false.
#     readmeRelated [kiểu: object; bắt buộc; mặc định: {file: "", anchor: ""}]
#       Liên kết tùy chọn tới một section Knowledge trong README. Có thể để trống cả file và anchor.
#       file [kiểu: string; bắt buộc; mặc định: ""]
#         Đường dẫn README tương đối bên dưới readme/{language}/menu, ví dụ 1.Basic/Basic.md.
#       anchor [kiểu: string; bắt buộc; mặc định: ""]
#         ID section Knowledge chính xác trong README đã chỉ định.
#     apiRelated [kiểu: object; bắt buộc; mặc định: {controller: "", methodSignature: ""}]
#       Liên kết tùy chọn tới một API đang hoạt động trong Swagger metadata. Có thể để trống cả controller và methodSignature.
#       controller [kiểu: string; bắt buộc; mặc định: ""]
#         Tên controller chính xác, ví dụ BasicThreadController.
#       methodSignature [kiểu: string; bắt buộc; mặc định: ""]
#         Method signature chính xác trong api-descriptions.yml, ví dụ startVsRun().
#     answers [kiểu: list; bắt buộc; số phần tử: 4; mặc định: []; duy nhất theo: id]
#       Chính xác bốn đáp án. ID A/B/C/D là identity nội bộ ổn định, không phải vị trí hiển thị sau khi frontend shuffle.
#       mỗi phần tử:
#         id [kiểu: enum; bắt buộc; giá trị hợp lệ: A, B, C, D; mặc định: ""]
#           Identity ổn định của đáp án.
#         answer [kiểu: string; bắt buộc; mặc định: ""]
#           Nội dung đáp án hiển thị cho người học.
#         explanation [kiểu: string; bắt buộc; mặc định: ""]
#           Giải thích hiển thị khi người học chọn đáp án này, bất kể đúng hay sai.
#     correctAnswerId [kiểu: enum; bắt buộc; giá trị hợp lệ: A, B, C, D; mặc định: ""]
#       ID nội bộ của đáp án đúng. Frontend kiểm tra bằng identity này sau khi shuffle.
# </quiz-schema>

questions: []
