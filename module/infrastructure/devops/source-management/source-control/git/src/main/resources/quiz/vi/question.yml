questions:
  - id: git-identity-vcs
    question: An tạo commit trên laptop khi mất mạng, nhưng GitHub không truy cập được. Kết luận nào mô tả đúng vai trò Git?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 01-git-foundations.md
      anchor: what-is-git
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: Không thể commit vì repository cần GitHub xác nhận.
        explanation: Đây là nhầm lẫn Git với một dịch vụ hosting; ghi commit local không cần GitHub.
      - id: B
        answer: Git ghi commit local; có kết nối mới chia sẻ tới host.
        explanation: Git lưu lịch sử ở repository local; việc publish sang host là bước khác.
      - id: C
        answer: Chỉ được lưu working tree, chưa thể ghi commit nào.
        explanation: Working tree vẫn sửa được, nhưng Git local còn cho phép tạo commit offline.
      - id: D
        answer: Commit local tự xuất hiện tại nhánh main của GitHub.
        explanation: Không có đồng bộ tự động; remote chỉ thay đổi qua thao tác trao đổi thành công.
    correctAnswerId: B
  - id: git-snapshot-model
    question: Hai commit liên tiếp chỉ thay đổi một tệp; các tệp còn lại giữ nguyên. Mô hình lưu trạng thái nào phù hợp với Git?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 01-git-foundations.md
      anchor: why-git-snapshots
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: Mỗi commit chỉ là danh sách các phím người dùng đã gõ.
        explanation: Git ghi snapshot trạng thái được theo dõi, không phải nhật ký từng phím gõ.
      - id: B
        answer: Commit chỉ lưu tệp vừa đổi nên không thể xem toàn cây.
        explanation: Một commit tham chiếu cây nội dung đầy đủ, dù đối tượng không đổi có thể được dùng lại.
      - id: C
        answer: Commit trỏ tree snapshot và dùng lại object không đổi.
        explanation: "Đúng: tree biểu diễn trạng thái được ghi; Git tránh nhân bản vô ích object giống nhau."
      - id: D
        answer: Commit chụp toàn bộ working tree kể cả tệp ignored.
        explanation: Snapshot dựa trên index, không tự bao gồm mọi tệp trên ổ đĩa.
    correctAnswerId: C
  - id: git-staged-again
    question: An sửa README thành bản B, chạy git add, rồi sửa tiếp thành bản C. Nếu commit ngay mà không add lại, nội dung nào được ghi?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 01-git-foundations.md
      anchor: index-and-three-areas
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: Bản A đang ở HEAD trước khi An bắt đầu sửa.
        explanation: HEAD cũ chỉ là điểm so sánh, không phải snapshot sẽ ghi khi index đã đổi.
      - id: B
        answer: Bản C đang ở working tree lúc gõ commit.
        explanation: Sửa sau git add chưa tự cập nhật index; phần mới vẫn là unstaged.
      - id: C
        answer: Cả B và C thành hai commit liên tiếp tự động.
        explanation: Một lần commit tạo một snapshot từ index, không tách hai commit tự động.
      - id: D
        answer: Bản B đã nằm trong index từ lần git add.
        explanation: "Đúng: commit dùng staged snapshot, còn bản C vẫn có thể ở working tree."
    correctAnswerId: D
  - id: git-tracked-state-after-add
    question: git status --short hiển thị MM cho một tệp đã theo dõi. Cách đọc hai ký tự này phù hợp nhất là gì?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 01-git-foundations.md
      anchor: file-tracking-and-states
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: MM cho biết cả index lẫn working tree đã sửa.
        explanation: "Hai cột status chỉ hai phía khác nhau: staged so với HEAD và working tree so với index."
      - id: B
        answer: Tệp đã merge ở local và cũng đã merge trên remote.
        explanation: MM ở short status không phải hai trạng thái merge của repository.
      - id: C
        answer: Tệp mới tạo chưa được Git theo dõi ở cả hai cột.
        explanation: Untracked thường hiện ??, không phải MM của một tracked file.
      - id: D
        answer: Commit hiện tại đã có hai tác giả cùng chỉnh sửa tệp.
        explanation: Hai chữ M mô tả vùng thay đổi, không mã hóa số người hoặc tác giả.
    correctAnswerId: A
  - id: git-clone-versus-init
    question: Một repo thực hành vừa git init chưa có commit; một repo khác được git clone từ nguồn có ba commit. Điểm khác biệt chắc chắn nào có ích để quan sát?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 01-git-foundations.md
      anchor: initialize-and-clone
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: Cả hai đều có đủ ba commit từ lúc tạo thư mục.
        explanation: Init không sao chép lịch sử ở repository nguồn nào khác.
      - id: B
        answer: Clone lấy lịch sử nguồn; init mới chưa có commit.
        explanation: Clone sao chép lịch sử có sẵn, còn init tạo metadata repo ban đầu.
      - id: C
        answer: Init tự tạo PR còn clone chỉ tạo working tree.
        explanation: PR thuộc dịch vụ host, không phải hiệu ứng tự động của init.
      - id: D
        answer: Clone biến các remote-tracking refs thành nhánh local đã checkout.
        explanation: Clone thường checkout một nhánh local, còn các nhánh remote khác được theo dõi bằng refs riêng.
    correctAnswerId: B
  - id: git-official-help
    question: Bình chưa rõ các lựa chọn của git restore và đang giữ thay đổi chưa commit. Nên tra cứu bằng cách nào trước khi thử?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 01-git-foundations.md
      anchor: git-command-reference-and-docs
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: Chạy git restore --source=HEAD -- . trên repo công việc rồi xem kết quả.
        explanation: Lệnh đó có thể ghi đè nội dung chưa stage; không nên dùng làm cách khám phá tùy chọn.
      - id: B
        answer: Chạy git reset --hard để đưa repository về trạng thái dễ học.
        explanation: Hard reset có thể làm mất thay đổi; không phải lệnh đọc trợ giúp.
      - id: C
        answer: Dùng git help restore hoặc tài liệu git-scm.com/docs để đọc cú pháp.
        explanation: Các nguồn này giải thích cú pháp và cảnh báo mà không động đến tệp nguồn.
      - id: D
        answer: Chạy `git restore --worktree README.md` để quan sát mặc định trước khi đọc help.
        explanation: Restore có thể thay nội dung chưa stage của README; thử trực tiếp trên công việc thật không phải cách đọc help an toàn.
    correctAnswerId: C
  - id: status-before-add
    question: An chuẩn bị commit trên nhánh feature nhưng không rõ file nào đã stage. Bước kiểm tra nào trực tiếp phân biệt trạng thái trước commit?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 02-recording-commits.md
      anchor: inspect-status-before-staging
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: Dùng `git status` xem phần staged và unstaged.
        explanation: Status hiển thị các nhóm trạng thái cần xem trước khi chọn nội dung ghi nhận.
      - id: B
        answer: Đọc `git log -p` để xem phần sửa chưa stage.
        explanation: Log -p đọc patch của commit đã ghi, không thể liệt kê đầy đủ edit chưa commit.
      - id: C
        answer: Chạy git show HEAD để biết các file untracked.
        explanation: HEAD chỉ nội dung commit đã ghi; untracked nằm ngoài snapshot đó.
      - id: D
        answer: Chạy git branch để đọc chi tiết index hiện tại.
        explanation: Branch chỉ các nhánh/ref, không thay thế status của index.
    correctAnswerId: A
  - id: gitignore-tracked-secret
    question: Repo đã commit `.env` trước đây. Sau đó An thêm `.env` vào `.gitignore`. Điều gì đúng nhất?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 02-recording-commits.md
      anchor: ignore-and-track-files
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: Git tự xoá `.env` khỏi mọi commit cũ ngay lập tức.
        explanation: Ignore không sửa lịch sử đã công bố hay xoá object nhạy cảm.
      - id: B
        answer: "`.env` đã track không bị ignore rule mới gỡ theo dõi."
        explanation: Ignore chủ yếu áp dụng file chưa track; tệp đã track không tự biến mất.
      - id: C
        answer: Bất kỳ thành viên nào clone lại đều không đọc được nội dung cũ.
        explanation: Nội dung cũ đã từng ghi có thể vẫn tồn tại trong lịch sử clone.
      - id: D
        answer: Lần commit kế tiếp sẽ mã hoá `.env` tự động.
        explanation: "`.gitignore` không phải công cụ mã hóa hoặc quản lý secrets."
    correctAnswerId: B
  - id: git-diff-index
    question: Sau `git add README.md`, An sửa README lần nữa. Cặp lệnh nào cho thấy hai phần khác biệt đang ở working tree và index?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 02-recording-commits.md
      anchor: working-tree-vs-staged-diff
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: git log --oneline và git branch -vv trên repository.
        explanation: Hai lệnh này xem lịch sử/ref, không tách diff chưa staged và staged.
      - id: B
        answer: git show HEAD và git ls-remote origin main.
        explanation: Hai lệnh này xem snapshot và remote, không so cả hai vùng hiện tại.
      - id: C
        answer: "`git diff` và `git diff --cached` cho cùng tệp."
        explanation: Lệnh đầu so working tree với index; lệnh sau so index với HEAD.
      - id: D
        answer: git fetch origin và git pull --ff-only.
        explanation: Đó là thao tác đồng bộ, không phải cách trực tiếp đọc hai loại diff.
    correctAnswerId: C
  - id: git-add-p-selective
    question: Một tệp chứa cả sửa lỗi rounding và thay đổi định dạng chưa liên quan. An chỉ muốn commit sửa lỗi. Cách chọn nào phù hợp?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 02-recording-commits.md
      anchor: stage-intentional-changes
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: git add . để stage mọi chỉnh sửa rồi sửa message cho rõ.
        explanation: Message không loại được phần định dạng đã bị stage quá rộng.
      - id: B
        answer: git commit -a để bỏ qua mọi lựa chọn index.
        explanation: "`-a` tự stage sửa đổi tracked, dễ đưa cả thay đổi không liên quan."
      - id: C
        answer: git push origin main để chỉ chia sẻ phần rounding.
        explanation: Push truyền commit, không chọn riêng hunk trong tệp working tree.
      - id: D
        answer: git add -p để chọn hunk rồi đọc git diff --cached.
        explanation: Chọn một phần nội dung và kiểm tra index trước commit là đúng ý định.
    correctAnswerId: D
  - id: commit-does-not-mean-tests
    question: Terminal báo `[feature C12] Fix rounding` sau `git commit`. Kết luận nào có căn cứ?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 02-recording-commits.md
      anchor: commit-snapshot-and-message
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: Commit ghi snapshot từ index; chưa chứng minh test.
        explanation: Commit thành công chỉ xác nhận thao tác ghi lịch sử, không phải chất lượng nghiệp vụ.
      - id: B
        answer: PR đã được reviewer approve theo chính sách công ty.
        explanation: Approval là hồ sơ cộng tác trên host, không sinh tự động từ commit.
      - id: C
        answer: Remote main đã nhận bản sửa rounding.
        explanation: Commit local chưa tự đẩy lên nhánh remote hoặc được merge vào main.
      - id: D
        answer: Mọi thay đổi unstaged đều đã được ghi kèm commit.
        explanation: Commit sử dụng index nên phần chưa stage có thể vẫn còn.
    correctAnswerId: A
  - id: git-compare-revision-history
    question: Bình muốn biết README thay đổi ra sao giữa commit A và B, không muốn xem bản đang sửa. Nên so sánh gì?
