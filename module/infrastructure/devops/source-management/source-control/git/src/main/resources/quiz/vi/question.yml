        answer: So git status ở hai terminal hiện tại.
        explanation: Status phản ánh trạng thái các working trees, không trực tiếp diff hai commit.
      - id: B
        answer: Chạy git diff A B -- README.md với hai ID commit hợp lệ.
        explanation: Diff chỉ rõ thay đổi của tệp giữa hai snapshot lịch sử đã xác nhận.
      - id: C
        answer: Chạy git diff --cached chỉ trên bản working tree hiện hành.
        explanation: Cached diff so index với HEAD, không mặc định so hai commit A/B.
      - id: D
        answer: Chạy git blame rồi coi các dòng được ghi cùng thời điểm.
        explanation: Blame hữu ích về provenance, nhưng không thay diff của hai revision cụ thể.
    correctAnswerId: B
  - id: branch-points-to-commit
    question: Đồ thị Git có main và feature cùng trỏ commit B. An commit C trên feature. Điều gì thay đổi chắc chắn?
