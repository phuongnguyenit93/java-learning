    answer: "A normal branch is a movable reference to a commit; HEAD commonly points symbolically to the checked-out branch. Committing C with parent B advances feature to C but leaves main at B until separately updated. Branching does not duplicate the full repository or move unrelated branch refs. Inspect git log --graph --decorate --all and git show-ref to verify actual positions."
