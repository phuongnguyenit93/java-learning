    answer: "Branches move with new commits, while a tag normally names a fixed historical point. An annotated tag carries its own object metadata and target, but does not automatically follow main or rewrite commit ancestry. A hosted Release adds publication notes and assets; neither Git tags nor Releases alone prove that production runs a revision. Use git show v1.0 and a decorated log to inspect what the tag names."
