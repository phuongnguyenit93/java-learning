    answer: "Merge normally preserves existing branch commits and connects divergent histories through a merge commit, while a fast-forward may only move a ref. Rebase replays feature commits on a new main tip, usually producing replacement commits with new parents and IDs. The resulting files can match despite different ancestry. Rebase is safer on unpublished local work; merge is useful for preserving shared identities. Verify resulting graphs, patches and tests."
