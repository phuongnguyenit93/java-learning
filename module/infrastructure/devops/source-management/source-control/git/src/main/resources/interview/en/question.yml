  - question: "Why can commits made in detached HEAD become hard to find, and how do you preserve them?"
    answer: "git switch --detach B makes HEAD refer directly to commit B rather than to a named branch. A newly created C is a real Git object, but no branch necessarily retains it after moving HEAD away. Reflog may help recovery temporarily, but is not a durable branch name. Create a new branch at C before leaving, or recover its SHA and create a ref afterward. Verify the ref with git show-ref and a decorated log."
