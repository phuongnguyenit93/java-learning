  - question: "Why does a three-way merge use a common ancestor rather than comparing only two final snapshots?"
    answer: "Three-way merge compares each tip C and D against their common base B to distinguish changed from unchanged content. Non-overlapping or compatible edits can combine automatically; competing edits in the same region may conflict. Comparing only C with D loses the baseline needed to attribute each side’s changes. Inspect git merge-base C D, diff each tip from B and review the final merged tree rather than treating conflicts as evidence that either contributor was inherently wrong."
