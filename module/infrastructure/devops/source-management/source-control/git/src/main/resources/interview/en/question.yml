  - question: "How does Git model snapshots, and why need unchanged files not be duplicated on every commit?"
    answer: "Each commit points to a tree describing the staged snapshot; blobs and trees are content-addressed. Unchanged objects can be reused even though each commit still identifies an entire recorded project state. Git derives diffs between snapshots for display. Ignored or unstaged disk content is not automatically part of the commit tree."
