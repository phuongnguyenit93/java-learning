    answer: "Cherry-pick applies a selected change as a new commit on the release line instead of integrating the entire reachable hotfix history. The older base can create conflicts, missing prerequisites or behavioral incompatibility, and the resulting commit normally has a new ID. Inspect patch dependencies and scope, apply on a release work branch, resolve conflicts and run regression tests. Abort an unsuitable cherry-pick rather than force-rewriting published tags."
