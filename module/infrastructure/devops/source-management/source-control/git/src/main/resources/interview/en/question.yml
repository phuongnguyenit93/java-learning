questions:
  - question: "Why can a developer commit during an outage, and which responsibilities still require a hosting service?"
    answer: "Git is distributed: a local repository has object storage, an index, HEAD and refs sufficient for commits without network access. GitHub provides hosted refs and collaboration metadata such as pull requests and reviews. Local commits do not mutate remote main. Once online, inspect remotes, push authorization and branch targets before sharing history."
