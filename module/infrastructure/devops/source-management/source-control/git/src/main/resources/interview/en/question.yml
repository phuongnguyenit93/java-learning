    answer: "git fetch updates remote-tracking refs and objects so you can inspect history without integrating it into the checked-out branch. git pull adds reconciliation under the configured strategy, potentially merging, rebasing or fast-forwarding. With pending local work, such integration may complicate the worktree. Fetch first, compare main to origin/main with a graph or left/right log, inspect status, and choose integration intentionally rather than hard-resetting simply to observe the server."
