    answer: "A remote name maps to a URL and fetch/push configuration. remote add only records that configuration: it does not transmit commits, create server branch refs or grant write access. To initialize an empty bare remote, first create a local commit and push main with appropriate permissions. Verify server refs with git ls-remote and refresh local remote-tracking refs with fetch. Seeing origin in remote -v does not prove publication."
