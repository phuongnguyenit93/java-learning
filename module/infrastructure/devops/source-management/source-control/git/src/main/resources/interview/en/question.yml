    answer: "Switching must materialize the target tree while protecting local modifications. When pending edits do not conflict with files that need updating, Git may carry them across; when the switch would overwrite them, Git normally refuses. Inspect status and diff before switching and deliberately commit or stash relevant work if necessary. There is no guaranteed automatic stash, commit, or deletion of edits on every switch."
