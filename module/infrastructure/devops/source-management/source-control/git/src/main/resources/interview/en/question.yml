    answer: "Do not force-push reflexively. Record local SHAs, fetch and compare the local feature with origin/feature to identify divergent commits. Coordinate a merge or approved reconciliation strategy; merging preserves existing commit identities, whereas rebasing published commits rewrites them. Test the integrated result and retry a normal push if it is now a fast-forward. If exceptional rewriting is authorized, force-with-lease adds an expected-ref safety check but does not remove the collaboration risk."
