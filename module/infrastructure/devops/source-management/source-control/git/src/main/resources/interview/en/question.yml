  - question: "Explain HEAD, index and working tree when a file changes A→B, is staged, then changes to C."
    answer: "HEAD still identifies committed A; the index holds staged B; the working tree holds later C. A normal commit records index B, leaving the later edit unstaged. Use git diff for working tree versus index, git diff --cached for index versus HEAD, and git status for a concise state overview. Inspecting staged content avoids accidentally omitting or including changes."
