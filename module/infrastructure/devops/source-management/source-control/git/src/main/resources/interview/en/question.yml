  - question: "When can Git fast-forward without a merge commit, and how does that differ from a two-parent merge?"
    answer: "If destination tip B is an ancestor of source tip C and fast-forward is allowed, Git can simply move the destination ref to C without changing C’s SHA or creating a merge commit. Divergent branches require integration via a common base and can produce a new two-parent merge commit. A team may deliberately choose --no-ff to preserve a merge marker even when a fast-forward is possible. Verify with git merge-base, a decorated graph and the merged tree."
