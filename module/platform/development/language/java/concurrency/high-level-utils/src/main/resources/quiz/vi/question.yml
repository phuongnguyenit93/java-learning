  - id: locksupport-permit-semantics
    question: "Phát biểu nào đúng về `LockSupport.park()` / `unpark(thread)`?"
    answers:
      - id: A
        answer: "Permit là counter tích lũy vô hạn; gọi `unpark()` 10 lần cho phép 10 lần `park()` sau đó đi qua."
        explanation: "Sai. Mental model gần với trạng thái có permit/chưa có permit, không phải counter cộng dồn vô hạn."
      - id: B
        answer: "`park()` luôn ném `InterruptedException` khi thread bị interrupt."
        explanation: "Sai. `park()` có thể return do interrupt nhưng không ném `InterruptedException`; caller phải tự kiểm tra status/predicate."
      - id: C
        answer: "`unpark(thread)` có thể target một Thread cụ thể, và `park()` vẫn nên nằm trong loop kiểm tra condition/cancellation vì có thể return do permit, interrupt hoặc spurious return."
        explanation: "Đúng. Đây là semantics cốt lõi được README nhấn mạnh."
      - id: D
        answer: "Dùng `park()` bắt buộc phải đang giữ intrinsic monitor giống `Object.wait()`."
        explanation: "Sai. LockSupport không yêu cầu ownership của intrinsic monitor."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Coordination/Coordination.md"
      anchor: "lock-support"
    apiRelated:
      controller: "CoordinationController"
