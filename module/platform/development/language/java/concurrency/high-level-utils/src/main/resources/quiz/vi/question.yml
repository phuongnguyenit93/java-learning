  - id: priority-blocking-queue-fairness
    question: "Với `PriorityBlockingQueue`, giả sử nhiều item có cùng priority. Có thể mặc định điều gì?"
    answers:
      - id: A
        answer: "Các item cùng priority luôn FIFO theo contract mặc định."
        explanation: "Sai. README cảnh báo không nên dựa vào FIFO khi priority bằng nhau nếu ordering đó không được encode rõ."
      - id: B
        answer: "Queue có bounded capacity mặc định nên producer luôn nhận backpressure khi đầy."
        explanation: "Sai. PriorityBlockingQueue là effectively unbounded và không cung cấp bounded-capacity backpressure như ArrayBlockingQueue."
      - id: C
        answer: "Nếu cần stable FIFO trong cùng priority, comparator/data model nên có tie-breaker như sequence number."
        explanation: "Đúng. Priority và fairness/FIFO là các semantics khác nhau."
      - id: D
        answer: "Low-priority item không bao giờ có nguy cơ chờ lâu nếu high-priority item tới liên tục."
        explanation: "Sai. Low-priority work có thể phải chờ rất lâu; đây là business scheduling concern."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Coordination/Coordination.md"
