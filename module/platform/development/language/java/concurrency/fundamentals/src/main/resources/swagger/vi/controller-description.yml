BasicThreadController:
  description: |-
    <h2>Basic Thread Controller</h2>
    <p>Các experiment nền tảng về JVM process, HTTP request thread, sự khác nhau giữa start() và run(), cùng toàn bộ Thread.State.</p>
  readmeRelated:
    file: 1.Basic/Basic.md
CreateThreadController:
  description: |-
    <h2>Create Thread Controller</h2>
    <p>So sánh các cách nối task với execution mechanism: extends Thread, Runnable + Thread và Callable + FutureTask + Thread.</p>
  readmeRelated:
    file: 1.Basic/Basic.md
DaemonThreadController:
  description: |-
    <h2>Daemon Thread Controller</h2>
    <p>Quan sát daemon flag và quy tắc inheritance của Thread trong Spring Boot; endpoint này không dùng để suy luận trực tiếp về thời điểm JVM shutdown.</p>
  readmeRelated:
    file: 1.Basic/Basic.md
ConcurrencyProblemController:
  description: |-
    <h2>Concurrency Problem Controller</h2>
    <p>Nhóm experiment về race condition, Java Memory Model, happens-before, volatile và các vấn đề progress như deadlock, livelock.</p>
  readmeRelated:
    file: 3.Concurrency_Problems/ConcurrencyProblem.md
ThreadLocalController:
  description: |-
    <h2>Thread Local Controller</h2>
    <p>Minh họa ThreadLocal isolation, InheritableThreadLocal, stale context do worker reuse và pattern explicit context propagation.</p>
  readmeRelated:
    file: 5.Context/ThreadLocal.md
InterruptionController:
  description: |-
    <h2>Interruption Controller</h2>
    <p>Các experiment về cooperative cancellation, interrupt flag, InterruptedException, cleanup, giới hạn của interrupt và sự khác nhau với custom stop flag.</p>
  readmeRelated:
    file: 2.Interruption/Interruption.md
