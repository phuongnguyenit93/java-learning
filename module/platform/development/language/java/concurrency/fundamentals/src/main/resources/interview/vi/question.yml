      methodSignature: "startVsRun()"

  - question: >-
      Java có những Thread.State nào và BLOCKED khác WAITING ở điểm nào?
    answer: >-
      Java có sáu state: NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING và TERMINATED; không có enum RUNNING. BLOCKED có nghĩa cụ thể là Thread đang chờ intrinsic monitor để vào synchronized. WAITING là chờ vô thời hạn cho một event hoặc condition, ví dụ Object.wait(), Thread.join() hoặc LockSupport.park(). TIMED_WAITING là dạng chờ có timeout.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Basic/Basic.md"
      anchor: "thread-state"
    apiRelated:
      controller: "BasicThreadController"
      methodSignature: "threadLifeCycle()"

  - question: >-
      Daemon Thread ảnh hưởng tới JVM lifecycle như thế nào?
    answer: >-
      JVM tiếp tục tồn tại khi còn user Thread sống. Khi chỉ còn daemon Thread, JVM không bắt buộc phải chờ chúng hoàn thành. Daemon không có nghĩa là priority thấp; đó là thuộc tính về JVM liveness. Thread mới mặc định kế thừa daemon status của Thread tạo nó, và setDaemon(...) phải được gọi trước start().
    aiGenerated: true
    reviewed: false
    readmeRelated:
