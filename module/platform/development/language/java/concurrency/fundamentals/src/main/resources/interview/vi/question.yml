questions:
  - question: >-
      Process và Thread khác nhau như thế nào trong một JVM application?
    answer: >-
      Process là một chương trình đang chạy với phạm vi tài nguyên riêng do hệ điều hành quản lý. Thread là một luồng thực thi bên trong process. Các Thread trong cùng JVM process có thể cùng truy cập object trên heap, còn mỗi Thread có execution stack riêng. Chính việc nhiều Thread cùng truy cập shared mutable state là nguồn của nhiều bài toán concurrency.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Basic/Basic.md"
      anchor: "process-and-thread"
    apiRelated:
