  - question: >-
      Future.cancel(false), Future.cancel(true) và CompletableFuture.cancel(true) có semantics giống nhau không?
    answer: >-
      Không. Future từ ExecutorService với cancel(false) không request interrupt running task; task có thể tiếp tục. cancel(true) có thể request interrupt nhưng task vẫn phải cooperate. Với CompletableFuture, mayInterruptIfRunning không điều khiển underlying processing theo cùng semantics đó; cancel chủ yếu thay đổi completion state. Không được coi bất kỳ cancel(true) nào là primitive kill Thread.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Q&A/Q&A.md"
      anchor: "future-question"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      CompletableFuture khác Future ở đâu và allOf()/anyOf() có những điểm cần lưu ý nào?
    answer: >-
      Future chủ yếu là handle cho completion, cancellation và blocking get(). CompletableFuture thêm pipeline/composition như thenApply, thenCompose, thenCombine và error handling. allOf() đợi tất cả input complete và không phải fail-fast barrier; anyOf() chọn first completion, có thể là success hoặc failure. Cả hai không mặc định cancel sibling future. get() và join() đều có thể block; khác biệt nổi bật nằm ở exception API checked so với CompletionException/CancellationException.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Q&A/Q&A.md"
      anchor: "future-question"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      ThreadLocal và InheritableThreadLocal có những rủi ro gì khi dùng với Thread Pool?
    answer: >-
      ThreadLocal gắn value với current Thread và giúp tránh sharing context, nhưng không làm shared object khác thread-safe. Worker pool được reuse nên value không remove có thể trở thành stale context hoặc giữ reference quá lâu. InheritableThreadLocal chỉ inherit tại Thread creation; task submit sau trên cùng worker cũ không nhận context mới của caller. Vì vậy pool context thường cần explicit propagation và cleanup.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.Context/ThreadLocal.md"
      anchor: "thread-pool-problem"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Những caveat quan trọng của Virtual Thread trên Java 21 là gì?
    answer: >-
      Virtual Thread vẫn tuân theo JMM, race condition, lock và deadlock như platform Thread. Trong Java 21 chúng luôn là daemon và có priority cố định Thread.NORM_PRIORITY. ThreadLocal vẫn có per-thread semantics và payload lớn trên rất nhiều virtual Thread có thể tạo heap pressure. Java 21 còn có pinning trong một số trường hợp, đáng chú ý khi blocking lúc giữ synchronized monitor; pinning dài/thường xuyên có thể giảm scalability. Bật spring.threads.virtual.enabled=true cũng không biến mọi Thread trong application thành virtual Thread.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Q&A/Q&A.md"
      anchor: "virtual-thread-question"
    apiRelated:
      controller: ""
      methodSignature: ""
