  - question: >-
      Vì sao count++ không thread-safe khi nhiều Thread cùng cập nhật?
    answer: >-
      count++ là một chuỗi read-modify-write chứ không phải một atomic action duy nhất. Hai Thread có thể cùng đọc giá trị cũ, cùng tính giá trị mới rồi ghi đè lên nhau, tạo lost update. Muốn bảo vệ increment cần primitive có atomicity phù hợp như AtomicInteger hoặc một critical section được synchronized/lock bảo vệ.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "shared-state-race-condition"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "raceCondition()"

  - question: >-
      Race condition, data race, visibility và ordering khác nhau như thế nào?
    answer: >-
      Race condition là vấn đề correctness khi kết quả phụ thuộc vào interleaving không được kiểm soát. Data race có nghĩa cụ thể trong JMM: hai Thread truy cập cùng variable, ít nhất một là write và các truy cập xung đột không được ordered bởi happens-before. Visibility hỏi Thread khác có guarantee thấy write hay không; ordering hỏi các action được quan sát theo guarantee nào. Các vấn đề này có thể cùng xuất hiện nhưng không phải một khái niệm duy nhất.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Q&A/Q&A.md"
      anchor: "race-vs-visibility"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Happens-before trong Java Memory Model có nghĩa là gì?
    answer: >-
      Happens-before là relation mang visibility và ordering guarantee, không chỉ là thứ tự thời gian theo đồng hồ. Các edge quan trọng gồm program order, Thread.start(), successful join(), monitor unlock tới later lock, volatile write tới subsequent read, executor submission tới task execution, computation tới successful Future.get(), synchronizer release/acquire và tính transitive.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "happens-before"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "startJoinHappensBefore()"

  - question: >-
      Safe publication là gì, final field giúp gì và vì sao this escape trong constructor nguy hiểm?
    answer: >-
      Safe publication yêu cầu reference được đưa sang Thread khác qua memory-consistency boundary rõ ràng như volatile, monitor/Lock, concurrent collection, Thread.start() hoặc Executor submission. Final field có initialization-safety đặc biệt khi object được construct đúng và this không escape trước khi constructor hoàn tất. Nếu this escape sớm, Thread khác có thể quan sát object trước khi invariant được thiết lập đầy đủ.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "safe-publication-final"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      volatile đảm bảo gì và không đảm bảo gì?
    answer: >-
      volatile cung cấp visibility và ordering semantics. Một volatile write happens-before subsequent read của cùng volatile variable, nên có thể dùng flag như ready để publish các write trước đó. Nhưng volatile không biến compound operation như count++ thành atomic; với những update cần read-modify-write nguyên tử vẫn cần Atomic, synchronized, Lock hoặc design khác.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "volatile-publication"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "volatileIsNotAtomic()"

  - question: >-
      Deadlock, livelock và starvation khác nhau như thế nào?
    answer: >-
      Deadlock là các Thread bị kẹt trong dependency cycle và không thể tiến tiếp. Livelock là các Thread vẫn hoạt động, liên tục phản ứng với nhau nhưng không tạo progress. Starvation là một Thread về lý thuyết có thể chạy nhưng lâu dài không nhận được CPU, lock hoặc resource cần thiết trong khi các Thread khác vẫn tiến. Đây đều là progress/liveness problem nhưng biểu hiện khác nhau.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "progress-problems"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Bốn Coffman conditions của deadlock là gì và global lock ordering phòng deadlock ra sao?
    answer: >-
      Bốn điều kiện là mutual exclusion, hold and wait, no preemption và circular wait. Một chiến lược thực dụng là phá circular wait bằng global lock ordering: mọi code path cần nhiều lock phải acquire theo cùng một thứ tự, ví dụ luôn A rồi B, không có chỗ khác lấy B rồi A.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "deadlock-prevention"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "deadlockPrevention()"

  - question: >-
      Synchronization và coordination khác nhau như thế nào?
    answer: >-
      Synchronization tập trung bảo vệ shared state, tức là ai được phép truy cập hoặc mutation tại một thời điểm. Coordination tập trung vào dependency giữa các Thread: ai phải chờ, chờ event/phase nào và khi nào được tiếp tục. synchronized bảo vệ counter là synchronization; CountDownLatch chờ nhiều worker hoàn thành là coordination. Một chương trình thực tế thường cần cả hai.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Q&A/Q&A.md"
      anchor: "synchronization-vs-coordination"
    apiRelated:
