      methodSignature: "processAndThread()"

  - question: >-
      Thread, Runnable, Callable và Executor khác nhau về vai trò như thế nào?
    answer: >-
      Runnable và Callable mô tả công việc cần thực hiện; Callable còn có thể trả kết quả và ném checked exception. Thread đại diện cho execution flow. Executor là abstraction quyết định task được thực thi như thế nào. Runnable hoặc Callable không tự tạo Thread; chúng vẫn cần Thread, Executor hoặc một execution mechanism khác để chạy.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Basic/Basic.md"
      anchor: "thread-task"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Gọi thread.run() khác thread.start() như thế nào?
    answer: >-
      run() chỉ là một lời gọi method Java bình thường nên task chạy trên caller Thread hiện tại. start() mới bắt đầu lifecycle của Thread và JVM sẽ gọi run() trên execution của Thread đó. Một Thread object chỉ được start một lần; start lần thứ hai sẽ dẫn tới IllegalThreadStateException.
    aiGenerated: true
    reviewed: false
    readmeRelated:
