  - id: batch-vs-schedule
    question: "What is the concise distinction between Batch and Schedule in the README?"
    answers:
      - id: A
        answer: "Schedule answers WHEN to start; Batch focuses on WHAT/HOW a larger workload is divided and processed."
        explanation: "Correct. A batch may be triggered by a scheduler, but the two concepts are not the same."
      - id: B
