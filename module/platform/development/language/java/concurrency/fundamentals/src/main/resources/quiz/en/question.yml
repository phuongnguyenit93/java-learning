      - id: C
        answer: "They only use different method names; interrupt status is always set when a schedule becomes due."
        explanation: "Incorrect. Reaching a scheduling deadline does not inherently set interrupt status."
      - id: D
        answer: "Scheduling only works with daemon threads, while interruption only works with user threads."
