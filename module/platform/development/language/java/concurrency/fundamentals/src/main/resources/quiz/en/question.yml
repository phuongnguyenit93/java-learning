  - id: deadlock-prevention-lock-ordering
    question: "A system frequently needs both Lock A and Lock B. Which design helps eliminate the Coffman `circular wait` condition by construction?"
    answers:
      - id: A
        answer: "Let every code path choose lock order independently to reduce contention."
        explanation: "Incorrect. Inconsistent ordering is exactly what can create dependency cycles such as A → B and B → A."
      - id: B
        answer: "Define a global lock ordering, for example always acquire A before B everywhere."
        explanation: "Correct. Consistent lock ordering removes circular-wait dependency by design."
      - id: C
        answer: "Raise the priority of the thread holding Lock A."
        explanation: "Incorrect. Thread priority does not remove a circular lock dependency."
      - id: D
        answer: "Convert both locks into daemon locks."
        explanation: "Incorrect. Locks do not have daemon semantics."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "deadlock-prevention"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "deadlockPrevention()"

  - id: explicit-context-propagation
    question: "When propagating request context from a caller thread to a pooled worker, which flow matches the README?"
    answers:
      - id: A
        answer: "Rely entirely on `InheritableThreadLocal` because a thread pool creates a new child thread for every submitted task."
        explanation: "Incorrect. Pooled workers are commonly created earlier and reused, so creation-time inheritance does not represent each submission's context."
      - id: B
        answer: "Capture context at the submission boundary → restore it on the worker before the task → clean up or restore the previous worker state in `finally`."
        explanation: "Correct. This is the core mental model for explicit propagation and Spring TaskDecorator."
      - id: C
        answer: "Store context in a static mutable field so every thread reads the same value."
        explanation: "Incorrect. That turns context into shared mutable state and destroys the intended isolation."
      - id: D
        answer: "Skip cleanup because a pool worker is always destroyed after each task."
        explanation: "Incorrect. Pool workers are reused, which is exactly why cleanup is a lifecycle requirement."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.Context/ThreadLocal.md"
      anchor: "context-propagation"
    apiRelated:
      controller: "ThreadLocalController"
