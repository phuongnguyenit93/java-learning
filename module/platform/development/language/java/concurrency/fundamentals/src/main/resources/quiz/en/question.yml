        explanation: "Incorrect. The README warns that this pattern is harder to manage for lifecycle, drift, cancellation, and exception handling."
      - id: D
        answer: "A scheduler never uses any thread to execute the task."
        explanation: "Incorrect. Once triggered, the task still has to execute on an appropriate execution thread."
