  boundedLivelock():
    execution: "<p><b>Concept:</b> API tạo một livelock hữu hạn bằng hai worker liê\
      n tục nhường nhau.</p>\n<ol>\n  <li>Mỗi vòng, cả hai cùng đánh dấu đang thử\
      \ và gặp nhau qua CyclicBarrier.\n    <div><i>Nguồn: ConcurrencyProblemService.boundedLivelock()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; boundedLivelock()\n   \
      \             throws InterruptedException {\n    \n            int rounds =\
      \ 5;\n    \n            AtomicBoolean workerATrying = new AtomicBoolean(false);\n\
      \            AtomicBoolean workerBTrying = new AtomicBoolean(false);\n     \
      \       AtomicInteger workerABackoffs = new AtomicInteger();\n            AtomicInteger\
      \ workerBBackoffs = new AtomicInteger();\n        ...\n    }</code></pre>\n\
      \  </li>\n  <li>Khi thấy đối phương cũng đang thử, cả hai cùng back off rồi\
      \ lặp lại.</li>\n  <li>Sau 5 vòng service trả số lần backoff và cho thấy worker\
      \ hoạt động liên tục nhưng không tạo progress.</li>\n</ol>\n<p><b>Kết luận:</b>\
      \ Mô phỏng livelock theo cách bounded. Response và Execution Context là bằng\
      \ chứng runtime cho behavior này; đoạn source colocated ở trên cho thấy code\
      \ path tạo experiment.</p>"
    usage: true
ThreadLocalController:
  isolation():
    execution: "<p><b>Concept:</b> API tạo hai platform thread và dùng cùng một ThreadLocal\
      \ với hai giá trị khác nhau.</p>\n<ol>\n  <li>Thread A set REQ-A, Thread B set\
      \ REQ-B.\n    <div><i>Nguồn: ThreadLocalService.isolationDemo()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; isolationDemo() throws\
      \ InterruptedException {\n            AtomicReference&lt;String&gt; threadAValue\
      \ = new AtomicReference&lt;&gt;();\n            AtomicReference&lt;String&gt;\
      \ threadBValue = new AtomicReference&lt;&gt;();\n    \n            Thread threadA\
      \ = new Thread(() -&gt; useLocalContext(\"REQ-A\", threadAValue), \"context-a\"\
      );\n            Thread threadB = new Thread(() -&gt; useLocalContext(\"REQ-B\"\
      , threadBValue), \"context-b\");\n            try {\n                threadA.start();\n\
      \                threadB.start();\n        ...\n    }</code></pre>\n  </li>\n\
      \  <li>Mỗi thread đọc lại đúng context của chính mình rồi remove trong finally.</li>\n\
      \  <li>Caller không set giá trị nên ThreadLocal trên request thread vẫn null.</li>\n\
      </ol>\n<p><b>Kết luận:</b> Quan sát ThreadLocal isolation. Response và Execution\
      \ Context là bằng chứng runtime cho behavior này; đoạn source colocated ở trê\
      n cho thấy code path tạo experiment.</p>"
    usage: true
  inheritance():
    execution: "<p><b>Concept:</b> API kiểm tra thời điểm InheritableThreadLocal đ\
      ược sao chép sang child thread.</p>\n<ol>\n  <li>Parent set PARENT-A rồi tạ\
      o child Thread.\n    <div><i>Nguồn: ThreadLocalService.inheritanceDemo()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; inheritanceDemo() throws\
      \ InterruptedException {\n            AtomicReference&lt;String&gt; childValue\
      \ = new AtomicReference&lt;&gt;();\n            INHERITABLE_CONTEXT.set(\"PARENT-A\"\
      );\n    \n            Thread child = new Thread(() -&gt; childValue.set(INHERITABLE_CONTEXT.get()),\
      \ \"inheritable-child\");\n            INHERITABLE_CONTEXT.set(\"PARENT-B\"\
      );\n    \n            try {\n                child.start();\n        ...\n \
      \   }</code></pre>\n  </li>\n  <li>Trước khi start child, parent đổi thành PARENT-B.</li>\n\
      \  <li>Child vẫn quan sát PARENT-A vì giá trị được snapshot lúc Thread được\
      \ tạo; parent context được remove khi xong.</li>\n</ol>\n<p><b>Kết luận:</b>\
      \ Quan sát InheritableThreadLocal khi tạo Thread. Response và Execution Context\
      \ là bằng chứng runtime cho behavior này; đoạn source colocated ở trên cho thấ\
      y code path tạo experiment.</p>"
    usage: true
  poolReuseProblem():
    execution: "<p><b>Concept:</b> API dùng pool một worker để cho thấy InheritableThreadLocal\
      \ không phù hợp với thread reuse.</p>\n<ol>\n  <li>Parent set USER_A và submit\
      \ task đầu, khiến worker được tạo và kế thừa USER_A.\n    <div><i>Nguồn: ThreadLocalService.poolReuseProblemDemo()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; poolReuseProblemDemo()\
      \ throws Exception {\n            ExecutorService pool = Executors.newFixedThreadPool(1);\n\
      \            try {\n                INHERITABLE_CONTEXT.set(\"USER_A\");\n \
      \               Future&lt;String&gt; first = pool.submit(INHERITABLE_CONTEXT::get);\n\
      \                String firstValue = first.get(2, TimeUnit.SECONDS);\n    \n\
      \                INHERITABLE_CONTEXT.set(\"USER_B\");\n                Future&lt;String&gt;\
      \ second = pool.submit(INHERITABLE_CONTEXT::get);\n        ...\n    }</code></pre>\n\
      \  </li>\n  <li>Parent đổi thành USER_B rồi submit task thứ hai lên cùng worker.</li>\n\
      \  <li>Task thứ hai vẫn thấy USER_A, minh họa stale context khi pool tái sử\
      \ dụng thread.</li>\n</ol>\n<p><b>Kết luận:</b> Chứng minh stale context khi\
