      n: CreateThreadService.createByRunnable()</i></div>\n    <pre><code>    public\
      \ List&lt;String&gt; createByRunnable() throws InterruptedException {\n    \
      \        String callerThread = Thread.currentThread().getName();\n    \n   \
      \         Runnable task = () -&gt; System.out.println(\n                   \
      \ \"Runnable.run() đang chạy trên thread: \"\n                            +\
      \ Thread.currentThread().getName()\n            );\n    \n            Thread\
      \ worker = new Thread(\n        ...\n    }</code></pre>\n  </li>\n  <li>Gắn\
      \ Runnable vào Thread runnable-thread-worker và gọi start.</li>\n  <li>join\
      \ trước khi trả kết quả để xác nhận task chạy trên worker khác caller.</li>\n\
      </ol>\n<p><b>Kết luận:</b> Chạy Runnable trên một Thread riêng. Response và\
      \ Execution Context là bằng chứng runtime cho behavior này; đoạn source colocated\
      \ ở trên cho thấy code path tạo experiment.</p>"
    usage: true
  createByCallable():
    execution: "<p><b>Concept:</b> API bọc Callable trong FutureTask rồi dùng Thread\
      \ thường để thực thi.</p>\n<ol>\n  <li>Callable trả về chuỗi chứa tên thread\
      \ thực tế.\n    <div><i>Nguồn: CreateThreadService.createByCallable()</i></div>\n\
      \    <pre><code>    public List&lt;String&gt; createByCallable()\n         \
      \       throws ExecutionException, InterruptedException {\n            String\
      \ callerThread = Thread.currentThread().getName();\n    \n            Callable&lt;String&gt;\
      \ task = () -&gt;\n                    \"Callable.call() đang chạy trên thread:\
      \ \"\n                            + Thread.currentThread().getName();\n    \n\
      \            FutureTask&lt;String&gt; futureTask = new FutureTask&lt;&gt;(task);\n\
      \        ...\n    }</code></pre>\n  </li>\n  <li>FutureTask vừa là Runnable\
      \ cho Thread callable-thread-worker vừa là Future chứa kết quả.</li>\n  <li>get\
      \ với timeout lấy giá trị, sau đó join và cleanup worker.</li>\n</ol>\n<p><b>Kế\
      t luận:</b> Chạy Callable bằng FutureTask và Thread. Response và Execution Context\
      \ là bằng chứng runtime cho behavior này; đoạn source colocated ở trên cho thấ\
      y code path tạo experiment.</p>"
    usage: true
