BasicThreadController:
  processAndThread():
    execution: "<p><b>Concept:</b> API đọc trực tiếp execution context của request\
      \ hiện tại.</p>\n<ol>\n  <li>Lấy PID từ ProcessHandle.current().\n    <div><i>Nguồ\
      n: BasicThreadService.describeProcessAndCurrentThread()</i></div>\n    <pre><code>\
      \    public Map&lt;String, Object&gt; describeProcessAndCurrentThread() {\n\
      \            Thread currentThread = Thread.currentThread();\n    \n        \
      \    Map&lt;String, Object&gt; result = new LinkedHashMap&lt;&gt;();\n     \
      \       result.put(\"processId\", ProcessHandle.current().pid());\n        \
      \    result.put(\"threadName\", currentThread.getName());\n            result.put(\"\
      threadId\", currentThread.threadId());\n            result.put(\"threadState\"\
      , currentThread.getState().name());\n            result.put(\"daemon\", currentThread.isDaemon());\n\
      \        ...\n    }</code></pre>\n  </li>\n  <li>Lấy tên, id, state và daemon\
      \ flag của Thread đang xử lý HTTP request.</li>\n  <li>Trả các giá trị quan\
      \ sát được mà không tạo worker mới.</li>\n</ol>\n<p><b>Kết luận:</b> Quan sá\
      t Process và HTTP request Thread. Response và Execution Context là bằng chứ\
      ng runtime cho behavior này; đoạn source colocated ở trên cho thấy code path\
      \ tạo experiment.</p>"
    usage: true
  startVsRun():
    execution: "<p><b>Concept:</b> API chạy cùng kiểu Runnable theo hai cơ chế khá\
      c nhau để đối chiếu thread thực thi.</p>\n<ol>\n  <li>Gọi run trực tiếp nên\
      \ task chạy ngay trên request thread.\n    <div><i>Nguồn: BasicThreadService.compareRunAndStart()</i></div>\n\
      \    <pre><code>    public List&lt;String&gt; compareRunAndStart() throws InterruptedException\
      \ {\n            String callerThreadName = Thread.currentThread().getName();\n\
      \    \n            Runnable directTask = () -&gt; System.out.println(\n    \
      \                \"run() trực tiếp đang chạy trên: \"\n                    \
      \        + Thread.currentThread().getName()\n            );\n    \n        \
      \    directTask.run();\n        ...\n    }</code></pre>\n  </li>\n  <li>Tạo\
      \ Thread basic-start-worker rồi gọi start để JVM chạy task trên worker riêng.</li>\n\
      \  <li>join worker trước khi trả về và cleanup nếu cần.</li>\n</ol>\n<p><b>Kế\
      t luận:</b> So sánh Thread.run() và Thread.start(). Response và Execution Context\
      \ là bằng chứng runtime cho behavior này; đoạn source colocated ở trên cho thấ\
      y code path tạo experiment.</p>"
    usage: true
  threadLifeCycle():
    execution: "<p><b>Concept:</b> API chủ động dẫn một worker qua các trạng thái\
      \ Thread.State có thể quan sát.</p>\n<ol>\n  <li>Ghi NEW, start worker và giữ\
      \ spin để bắt RUNNABLE.\n    <div><i>Nguồn: BasicThreadService.observeThreadLifecycle()</i></div>\n\
      \    <pre><code>    public List&lt;String&gt; observeThreadLifecycle() throws\
      \ InterruptedException {\n            List&lt;String&gt; observations = new\
      \ ArrayList&lt;&gt;();\n    \n            AtomicBoolean stayRunnable = new AtomicBoolean(true);\n\
      \            CountDownLatch runnableEntered = new CountDownLatch(1);\n     \
      \       CountDownLatch timedWaitGate = new CountDownLatch(1);\n    \n      \
      \      Object blockedMonitor = new Object();\n            Object waitingMonitor\
      \ = new Object();\n        ...\n    }</code></pre>\n  </li>\n  <li>Dùng timed\
      \ latch tạo TIMED_WAITING, giữ monitor để ép BLOCKED, rồi wait trên monitor\
      \ khác để tạo WAITING.</li>\n  <li>notifyAll cho worker chạy tiếp, join và ghi\
      \ TERMINATED; finally giải phóng mọi gate để cleanup.</li>\n</ol>\n<p><b>Kế\
      t luận:</b> Quan sát các trạng thái Thread.State. Response và Execution Context\
      \ là bằng chứng runtime cho behavior này; đoạn source colocated ở trên cho thấ\
      y code path tạo experiment.</p>"
    usage: true
CreateThreadController:
  createByExtends():
    execution: "<p><b>Concept:</b> API tạo MyWorker là subclass của Thread và gắn\
      \ logic trực tiếp trong run.</p>\n<ol>\n  <li>Ghi nhận request thread.\n   \
      \ <div><i>Nguồn: CreateThreadService.createByExtends()</i></div>\n    <pre><code>\
      \    public List&lt;String&gt; createByExtends() throws InterruptedException\
      \ {\n            String callerThread = Thread.currentThread().getName();\n \
      \   \n            MyWorker worker = new MyWorker(\"extends-thread-worker\");\n\
      \            try {\n                worker.start();\n                joinOrFail(worker);\n\
      \            } finally {\n                cleanup(worker);\n        ...\n  \
      \  }</code></pre>\n  </li>\n  <li>Khởi động MyWorker tên extends-thread-worker\
      \ để run trên thread riêng.</li>\n  <li>join worker rồi trả tên caller và worker,\
      \ kèm cleanup nếu worker chưa dừng.</li>\n</ol>\n<p><b>Kết luận:</b> Tạo Thread\
      \ bằng cách extends Thread. Response và Execution Context là bằng chứng runtime\
      \ cho behavior này; đoạn source colocated ở trên cho thấy code path tạo experiment.</p>"
    usage: true
