ConcurrencyProblemController:
  raceCondition():
    execution: "<p><b>Concept:</b> API tạo lost update theo cách deterministic trê\
      n một counter thường.</p>\n<ol>\n  <li>Hai worker cùng đọc counter trước và\
      \ đồng bộ bằng CountDownLatch để chắc chắn đều thấy cùng snapshot.\n    <div><i>Nguồ\
      n: ConcurrencyProblemService.deterministicRaceCondition()</i></div>\n    <pre><code>\
      \    public Map&lt;String, Object&gt; deterministicRaceCondition()\n       \
      \         throws InterruptedException {\n    \n            PlainCounter counter\
      \ = new PlainCounter();\n    \n            AtomicInteger snapshotA = new AtomicInteger();\n\
      \            AtomicInteger snapshotB = new AtomicInteger();\n    \n        \
      \    CountDownLatch bothRead = new CountDownLatch(2);\n        ...\n    }</code></pre>\n\
      \  </li>\n  <li>Sau đó cả hai cùng ghi snapshot + 1.</li>\n  <li>Kết quả cuố\
      i chỉ tăng một lần thay vì hai, cho thấy read-modify-write không atomic.</li>\n\
      </ol>\n<p><b>Kết luận:</b> Tạo lost update để quan sát race condition. Response\
      \ và Execution Context là bằng chứng runtime cho behavior này; đoạn source colocated\
      \ ở trên cho thấy code path tạo experiment.</p>"
    usage: true
  startJoinHappensBefore():
    execution: "<p><b>Concept:</b> API dùng Thread.start và Thread.join để quan sá\
      t happens-before mà không dùng volatile.</p>\n<ol>\n  <li>Parent ghi beforeStart\
      \ = 7 trước khi start worker.\n    <div><i>Nguồn: ConcurrencyProblemService.startJoinHappensBefore()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; startJoinHappensBefore()\n\
      \                throws InterruptedException {\n    \n            StartJoinState\
      \ state = new StartJoinState();\n            state.beforeStart = 7;\n    \n\
      \            Thread worker = new Thread(() -&gt; {\n                state.observedByWorker\
      \ = state.beforeStart;\n                state.writtenByWorker = 42;\n      \
      \  ...\n    }</code></pre>\n  </li>\n  <li>Worker đọc giá trị đó rồi ghi writtenByWorker\
      \ = 42.</li>\n  <li>Sau join, parent đọc được giá trị worker đã ghi và trả lạ\
      i cả hai chiều visibility.</li>\n</ol>\n<p><b>Kết luận:</b> Quan sát happens-before\
      \ của start() và join(). Response và Execution Context là bằng chứng runtime\
      \ cho behavior này; đoạn source colocated ở trên cho thấy code path tạo experiment.</p>"
    usage: true
  volatilePublication():
    execution: "<p><b>Concept:</b> API publish dữ liệu thường thông qua một volatile\
      \ flag.</p>\n<ol>\n  <li>Reader spin chờ ready trở thành true.\n    <div><i>Nguồ\
      n: ConcurrencyProblemService.volatilePublication()</i></div>\n    <pre><code>\
      \    public Map&lt;String, Object&gt; volatilePublication()\n              \
      \  throws InterruptedException {\n    \n            PublicationState state =\
      \ new PublicationState();\n            Thread reader = new Thread(() -&gt; {\n\
      \                while (!state.ready) {\n                    if (Thread.currentThread().isInterrupted())\
      \ {\n                        return;\n                    }\n        ...\n \
      \   }</code></pre>\n  </li>\n  <li>Writer ghi data = 42 trước rồi mới ghi volatile\
      \ ready = true.</li>\n  <li>Khi reader thấy ready, nó đọc data và service join\
      \ cả hai thread để xác nhận publication thành công.</li>\n</ol>\n<p><b>Kết luậ\
      n:</b> Publish dữ liệu bằng volatile flag. Response và Execution Context là\
      \ bằng chứng runtime cho behavior này; đoạn source colocated ở trên cho thấ\
      y code path tạo experiment.</p>"
    usage: true
  volatileIsNotAtomic():
    execution: "<p><b>Concept:</b> API lặp lại lost update nhưng counter được khai\
      \ báo volatile.</p>\n<ol>\n  <li>Hai worker cùng đọc volatile value và đồng\
      \ bộ để giữ cùng snapshot.\n    <div><i>Nguồn: ConcurrencyProblemService.volatileIsNotAtomic()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; volatileIsNotAtomic()\n\
      \                throws InterruptedException {\n    \n            VolatileCounter\
      \ counter = new VolatileCounter();\n    \n            AtomicInteger snapshotA\
      \ = new AtomicInteger();\n            AtomicInteger snapshotB = new AtomicInteger();\n\
      \    \n            CountDownLatch bothRead = new CountDownLatch(2);\n      \
      \  ...\n    }</code></pre>\n  </li>\n  <li>Mỗi worker tự tính snapshot + 1 rồ\
      i ghi lại.</li>\n  <li>Visibility của volatile vẫn không ghép chuỗi read-modify-write\
      \ thành một thao tác atomic nên kết quả có lost update.</li>\n</ol>\n<p><b>Kế\
      t luận:</b> Chứng minh volatile không đảm bảo atomicity. Response và Execution\
      \ Context là bằng chứng runtime cho behavior này; đoạn source colocated ở trê\
      n cho thấy code path tạo experiment.</p>"
    usage: true
  deadlockRisk():
    execution: "<p><b>Concept:</b> API mô phỏng circular lock dependency mà không\
      \ để request deadlock vĩnh viễn.</p>\n<ol>\n  <li>Worker A giữ lock A, worker\
      \ B giữ lock B và barrier bằng latch để cả hai cùng sở hữu lock đầu tiên.\n\
      \    <div><i>Nguồn: ConcurrencyProblemService.deadlockRisk()</i></div>\n   \
      \ <pre><code>    public Map&lt;String, Object&gt; deadlockRisk()\n         \
      \       throws InterruptedException {\n    \n            ReentrantLock lockA\
      \ = new ReentrantLock();\n            ReentrantLock lockB = new ReentrantLock();\n\
      \    \n            CountDownLatch bothHoldingFirstLock = new CountDownLatch(2);\n\
      \            CountDownLatch bothTriedSecondLock = new CountDownLatch(2);\n \
      \   \n        ...\n    }</code></pre>\n  </li>\n  <li>Mỗi worker dùng tryLock\
      \ không chờ để thử lấy lock còn lại.</li>\n  <li>Cả hai thất bại ở lock thứ\
      \ hai, ghi nhận circular dependency rồi nhả lock ban đầu và kết thúc.</li>\n\
      </ol>\n<p><b>Kết luận:</b> Quan sát circular lock dependency an toàn. Response\
      \ và Execution Context là bằng chứng runtime cho behavior này; đoạn source colocated\
      \ ở trên cho thấy code path tạo experiment.</p>"
    usage: true
  deadlockPrevention():
