      \ ReentrantLock();\n            ReentrantLock lockB = new ReentrantLock();\n\
      \            CountDownLatch start = new CountDownLatch(1);\n            AtomicInteger\
      \ completed = new AtomicInteger();\n    \n            Runnable orderedTask =\
