  - id: progress-deadlock-livelock-starvation
    question: "Tình huống nào mô tả livelock chính xác nhất?"
    answers:
      - id: A
        answer: "Hai thread giữ lock theo vòng tròn và đều đứng yên chờ nhau."
        explanation: "Sai. Đó là hình thái deadlock điển hình với circular wait."
      - id: B
        answer: "Một thread hiếm khi được CPU/lock/resource trong khi các thread khác vẫn tiến triển."
        explanation: "Sai. Đó là starvation."
      - id: C
        answer: "Hai thread đã TERMINATED nên không còn công việc."
        explanation: "Sai. TERMINATED không phải liveness problem kiểu livelock."
      - id: D
        answer: "Các thread vẫn hoạt động và liên tục phản ứng/back off với nhau nhưng không tạo được progress hữu ích."
        explanation: "Đúng. Livelock là active but no progress; khác deadlock ở chỗ các thread vẫn đang thực hiện hành động."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "progress-problems"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "boundedLivelock()"

  - id: threadlocal-worker-cleanup
    question: "Tại sao `ThreadLocal.remove()` đặc biệt quan trọng khi task chạy trên thread pool?"
    answers:
      - id: A
        answer: "Vì remove làm worker thread bị hủy và pool tạo worker mới."
        explanation: "Sai. `remove()` xóa association của ThreadLocal trên current thread; nó không terminate worker."
      - id: B
        answer: "Vì ThreadLocal value luôn được chia sẻ cho mọi worker nếu không remove."
        explanation: "Sai. ThreadLocal là per-thread association; rủi ro nằm ở cùng worker được reuse cho task khác."
      - id: C
        answer: "Vì remove biến object thành immutable."
        explanation: "Sai. Cleanup context không thay đổi mutability của object."
      - id: D
        answer: "Vì worker sống lâu và được reuse; context cũ có thể rò sang task sau hoặc giữ reference lâu hơn dự kiến nếu không cleanup trong `finally`."
        explanation: "Đúng. Pattern an toàn là set/capture → try work → finally remove/restore."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.Context/ThreadLocal.md"
      anchor: "thread-local-cleanup"
    apiRelated:
