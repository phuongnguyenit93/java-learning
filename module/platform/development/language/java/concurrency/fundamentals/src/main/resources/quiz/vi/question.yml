  - id: inheritable-threadlocal-pool-reuse
    question: "Vì sao `InheritableThreadLocal` không phải giải pháp đáng tin cậy để propagate request context qua thread pool?"
    answers:
      - id: A
        answer: "Vì InheritableThreadLocal chỉ hoạt động với daemon thread."
        explanation: "Sai. Semantics chính liên quan creation-time inheritance, không phải daemon status."
      - id: B
        answer: "Giá trị được inherit khi child thread được tạo; pooled worker thường được tạo từ trước rồi reuse cho nhiều task nên không có lần tạo child mới cho mỗi submission."
        explanation: "Đúng. Vì vậy task sau có thể thấy stale inherited context; explicit capture/restore/cleanup phù hợp hơn."
      - id: C
        answer: "Vì thread pool cấm mọi ThreadLocal."
        explanation: "Sai. ThreadLocal vẫn dùng được, nhưng lifecycle và cleanup phải được quản lý đúng."
      - id: D
        answer: "Vì mỗi task trong pool luôn chạy trên một process riêng."
        explanation: "Sai. Worker threads vẫn nằm trong cùng JVM process."
    correctAnswerId: B
    aiGenerated: true
