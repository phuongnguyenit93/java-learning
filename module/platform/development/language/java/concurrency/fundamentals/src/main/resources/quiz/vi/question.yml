  - id: interrupted-exception-restore-status
    question: "Một worker đang `sleep()` nhận interrupt và đi vào `catch (InterruptedException e)`. Nếu method không propagate exception nhưng muốn tầng trên vẫn biết cancellation đã được yêu cầu, pattern phù hợp là gì?"
    answers:
      - id: A
        answer: "Bỏ qua exception vì interrupt status luôn tự giữ nguyên là `true`."
