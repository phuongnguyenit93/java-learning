  - id: interrupt-synchronized-monitor
    question: "Thread B đang BLOCKED để chờ intrinsic monitor của `synchronized`. Thread A gọi `threadB.interrupt()`. Điều gì đúng nhất?"
    answers:
      - id: A
        answer: "B lập tức nhận `InterruptedException` và rời hàng chờ monitor."
        explanation: "Sai. Intrinsic monitor acquisition của `synchronized` không phải interruptible wait theo cách `sleep()`/`wait()` hoạt động."
      - id: B
        answer: "B lập tức chuyển sang TERMINATED."
        explanation: "Sai. Interrupt không cưỡng bức kết thúc thread."
      - id: C
        answer: "Interrupt bị bỏ qua hoàn toàn và status luôn vẫn false."
        explanation: "Sai. Interrupt status có thể được set dù B vẫn đang BLOCKED."
      - id: D
        answer: "B vẫn có thể tiếp tục BLOCKED cho tới khi monitor được release; sau đó code có thể quan sát interrupt status."
        explanation: "Đúng. Nếu cần lock acquisition phản ứng trực tiếp với cancellation, `ReentrantLock.lockInterruptibly()` là lựa chọn phù hợp hơn."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Interruption/Interruption.md"
      anchor: "interrupt-limitations"
    apiRelated:
      controller: "InterruptionController"
      methodSignature: "interruptSynchronizedWaiter()"

  - id: volatile-not-compound-atomic
    question: "Có `volatile int count` và nhiều thread cùng chạy `count++`. Nhận định nào đúng?"
    answers:
      - id: A
        answer: "`volatile` biến toàn bộ `count++` thành một atomic instruction."
        explanation: "Sai. `count++` vẫn là read-modify-write và các thread có thể interleave gây lost update."
      - id: B
        answer: "`volatile` cung cấp visibility/ordering cho read/write liên quan, nhưng không làm compound increment trở nên atomic."
        explanation: "Đúng. Nếu cần atomic increment, cân nhắc `AtomicInteger`, lock hoặc cơ chế phù hợp với invariant."
      - id: C
        answer: "`volatile` chỉ có tác dụng khi biến là reference, không có tác dụng với `int`."
        explanation: "Sai. `volatile` áp dụng được cho primitive như `int`, nhưng semantics không bao gồm compound atomicity."
      - id: D
        answer: "`count++` an toàn vì mỗi thread có stack riêng."
        explanation: "Sai. Field `count` là shared mutable state; stack riêng không bảo vệ object/field dùng chung."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "volatile-publication"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "volatileIsNotAtomic()"

  - id: happens-before-start-join
    question: "Flow nào dưới đây tạo ra guarantee phù hợp với rule `Thread.start()` và `Thread.join()` của JMM?"
    answers:
      - id: A
        answer: "Parent ghi data sau `start()`, worker chắc chắn thấy data đó ngay."
        explanation: "Sai. Start rule bảo đảm actions trước `start()` happens-before actions của started thread, không phải mọi write sau đó."
      - id: B
        answer: "Worker ghi data sau khi kết thúc, parent đọc trước `join()` vẫn luôn thấy write mới."
        explanation: "Sai. Nếu chưa có synchronization edge phù hợp, không thể suy luận guarantee đó chỉ từ thời gian thực."
      - id: C
        answer: "Parent ghi data trước `start()` để worker thấy; worker ghi kết quả rồi kết thúc; parent `join()` thành công trước khi đọc kết quả."
        explanation: "Đúng. Actions trước `start()` được truyền sang worker; actions của worker happens-before code tiếp tục sau successful `join()`."
      - id: D
        answer: "`start()` và `join()` chỉ quản lý lifecycle, không có memory-consistency guarantee."
        explanation: "Sai. README nhấn mạnh chúng vừa coordination lifecycle vừa tạo các happens-before edge quan trọng."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "happens-before"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "startJoinHappensBefore()"

  - id: safe-publication-this-escape
    question: "Tại sao publish `this` từ constructor trước khi constructor hoàn tất là nguy hiểm trong concurrent code?"
    answers:
      - id: A
        answer: "Thread khác có thể quan sát object trước khi invariant/initialization hoàn tất, làm suy yếu reasoning về safe publication và final-field initialization safety."
        explanation: "Đúng. Nên hoàn tất construction trước rồi publish object qua một boundary có memory-consistency contract rõ ràng."
      - id: B
        answer: "Vì JVM luôn copy object sang stack của thread khác."
        explanation: "Sai. Object vẫn nằm trên heap; vấn đề là publication boundary và visibility/initialization guarantee."
      - id: C
        answer: "Vì mọi field `final` trở thành mutable sau khi `this` escape."
        explanation: "Sai. `final` không trở thành mutable; vấn đề là object có thể bị quan sát quá sớm."
      - id: D
        answer: "Vì constructor bắt buộc phải chạy trong `synchronized`."
        explanation: "Sai. Constructor không bắt buộc phải synchronized; điều quan trọng là invariant và cách publish reference."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
