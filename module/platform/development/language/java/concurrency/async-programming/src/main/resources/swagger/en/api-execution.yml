      \ on an already-completed future.</p>\n<ol>\n  <li><code>thenApply</code> is\
      \ attached to a completed stage and its thread name is captured, showing that\
      \ it runs inline on the caller in this experiment.\n    <div><i>Source: AsyncService.executionVariantDemo()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; executionVariantDemo()\
      \ throws Exception {\n            String callerThread = Thread.currentThread().getName();\n\
      \            ExecutorService executor = Executors.newSingleThreadExecutor(runnable\
      \ -&gt;\n                    new Thread(runnable, \"async-variant-worker\")\n\
      \            );\n    \n            try {\n                AtomicBoolean nonAsyncRanInline\
      \ = new AtomicBoolean(false);\n                AtomicBoolean asyncUsedConfiguredExecutor\
      \ = new AtomicBoolean(false);\n        ...\n    }</code></pre>\n  </li>\n  <li><code>thenApplyAsync</code>\
      \ is given a dedicated single-thread executor named <code>async-variant-worker</code>.</li>\n\
      \  <li>The response reports both thread names and the observed executor choice\
      \ before the executor is shut down.</li>\n</ol>\n<p><b>Conclusion:</b> Compare\
      \ thenApply and thenApplyAsync. The response and Execution Context are the runtime\
      \ evidence for this behavior; the colocated source snippet shows the code path\
      \ that creates the experiment.</p>"
    usage: true
  allOf():
    execution: "<p><b>Concept:</b> The service exercises both successful and exceptional\
      \ <code>CompletableFuture.allOf</code> aggregation.</p>\n<ol>\n  <li>Three tasks\
      \ run on a three-thread pool and the first aggregate waits for all of them.\n\
      \    <div><i>Source: AsyncService.allOfDemo()</i></div>\n    <pre><code>   \
      \ public Map&lt;String, Object&gt; allOfDemo() throws Exception {\n        \
      \    ExecutorService executor = Executors.newFixedThreadPool(3);\n         \
      \   try {\n                CompletableFuture&lt;String&gt; inventory = CompletableFuture.supplyAsync(()\
      \ -&gt; \"IN_STOCK\", executor);\n                CompletableFuture&lt;String&gt;\
      \ payment = CompletableFuture.supplyAsync(() -&gt; \"PAID\", executor);\n  \
      \              CompletableFuture&lt;String&gt; shipping = CompletableFuture.supplyAsync(()\
      \ -&gt; \"READY\", executor);\n    \n                CompletableFuture&lt;Void&gt;\
      \ all = CompletableFuture.allOf(inventory, payment, shipping);\n           \
      \     all.get(2, TimeUnit.SECONDS);\n        ...\n    }</code></pre>\n  </li>\n\
      \  <li>For the failure case, one input is completed exceptionally while another\
      \ sibling is still incomplete.</li>\n  <li>The service observes that the aggregate\
      \ does not finish until the remaining sibling completes, then <code>join()</code>\
      \ exposes the failure and the successful sibling remains uncancelled.</li>\n\
      </ol>\n<p><b>Conclusion:</b> Observe CompletableFuture.allOf semantics. The\
      \ response and Execution Context are the runtime evidence for this behavior;\
      \ the colocated source snippet shows the code path that creates the experiment.</p>"
    usage: true
  timeoutCancellation():
    execution: |-
      <p><b>Concept:</b> The service runs two latch-blocked <code>CompletableFuture</code> experiments to separate future state from underlying task interruption.</p>
      <ol>
        <li><code>orTimeout</code> completes the future with <code>TimeoutException</code>, but the worker is not interrupted and continues until the latch is released.
          <div><i>Source: AsyncService.timeoutCancellationDemo()</i></div>
          <pre><code>    public Map&lt;String, Object&gt; timeoutCancellationDemo() throws InterruptedException {
                  return map(
                          "orTimeout", completableFutureTimeoutSample(),
                          "completableFutureCancelTrue", completableFutureCancellationSample()
                  );
              }</code></pre>
        </li>
        <li><code>cancel(true)</code> marks the <code>CompletableFuture</code> cancelled and makes <code>join()</code> throw <code>CancellationException</code>, yet the submitted worker is still not interrupted in this setup.</li>
        <li>Both workers are explicitly released and executors are cleaned up.</li>
      </ol>
      <p><b>Conclusion:</b> Distinguish CompletableFuture timeout from cancellation. The response and Execution Context are the runtime evidence for this behavior; the colocated source snippet shows the code path that creates the experiment.</p>
    usage: true
