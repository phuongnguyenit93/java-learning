  allOf():
    summary: Observe CompletableFuture.allOf semantics
    description: Fail one input before another sibling completes to demonstrate that
      allOf is not a fail-fast barrier. The aggregate completes after the required
      inputs finish, may complete exceptionally, and does not automatically cancel
