questions:
  - question: >-
      How does a Virtual Thread in Java 2. change the execution model, and does it remove downstream resource limits?
    answer: >-
      A Virtual Thread is a lightweight Thread managed by the JVM and mounted on a carrier or platform Thread when it runs. During supported blocking operations the runtime can unmount it so the carrier can run other work, which helps thread-per-task scale for many blocking tasks. Database connections, API rate limits, file descriptors and other downstream resources remain finite, so Semaphores, rate limiters or resource pools are still necessary.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Virtual_Thread/VirtualThread.md"
      anchor: "resource-limits"
    apiRelated:
      controller: "VirtualThreadController"
      methodSignature: "limitedResource()"

