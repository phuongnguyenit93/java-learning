  queuePressure():
    execution: |-
      <p><b>Concept:</b> API tạo ThreadPoolExecutor một worker với bounded queue capacity 3 và AbortPolicy.</p>
      <ol>
        <li>Task đầu giữ worker bận bằng latch.
          <div><i>Nguồn: LeakService.queuePressureDemo()</i></div>
          <pre><code>    public Map&lt;String, Object&gt; queuePressureDemo() throws InterruptedException {
                  CountDownLatch releaseWorker = new CountDownLatch(1);
                  ThreadPoolExecutor executor = new ThreadPoolExecutor(
                          1,
                          1,
                          0,
                          TimeUnit.MILLISECONDS,
                          new LinkedBlockingQueue&lt;&gt;(3),
                          new ThreadPoolExecutor.AbortPolicy()
              ...
          }</code></pre>
        </li>
        <li>Bốn task tiếp theo được submit khi worker đang bận; ba task lấp queue và task dư bị reject.</li>
        <li>Finally mở latch rồi shutdown, minh họa bounded queue giới hạn backlog thay vì tăng vô hạn.</li>
      </ol>
      <p><b>Kết luận:</b> Quan sát queue backlog và rejection. Response và Execution Context là bằng chứng runtime cho behavior này; đoạn source colocated ở trên cho thấy code path tạo experiment.</p>
    usage: true
