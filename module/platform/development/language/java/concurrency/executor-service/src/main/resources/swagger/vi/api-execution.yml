  executorFlow():
    execution: |-
      <p><b>Concept:</b> API cấu hình ThreadPoolExecutor core=1, max=2 và queue capacity=1 để quan sát thuật toán nhận task.</p>
      <ol>
        <li>Task 1 tạo core worker; task 2 đi vào queue.
          <div><i>Nguồn: ThreadPoolService.executorFlowDemo()</i></div>
          <pre><code>    public Map&lt;String, Object&gt; executorFlowDemo() throws InterruptedException {
                  CountDownLatch releaseTasks = new CountDownLatch(1);
                  ThreadPoolExecutor executor = new ThreadPoolExecutor(
                          1,
                          2,
                          10,
                          TimeUnit.SECONDS,
                          new LinkedBlockingQueue&lt;&gt;(1),
                          namedFactory("flow-worker-"),
              ...
          }</code></pre>
        </li>
        <li>Task 3 làm queue đầy nên pool tăng lên worker thứ hai.</li>
        <li>Task 4 gặp cả pool max và queue full nên AbortPolicy reject; cuối cùng latch được mở và executor shutdown.</li>
      </ol>
      <p><b>Kết luận:</b> Quan sát core, queue, max và rejection. Response và Execution Context là bằng chứng runtime cho behavior này; đoạn source colocated ở trên cho thấy code path tạo experiment.</p>
