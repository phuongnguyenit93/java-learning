  executeVsSubmit():
    execution: |-
      <p><b>Concept:</b> API chạy hai task cố ý ném exception bằng execute và submit trên hai executor riêng.</p>
      <ol>
        <li>Exception từ execute đi ra uncaught exception channel của worker và được UncaughtExceptionHandler ghi nhận.
          <div><i>Nguồn: ThreadPoolService.executeVsSubmitDemo()</i></div>
          <pre><code>    public Map&lt;String, Object&gt; executeVsSubmitDemo() throws InterruptedException {
                  AtomicReference&lt;Throwable&gt; executeUncaught = new AtomicReference&lt;&gt;();
                  CountDownLatch executeExceptionObserved = new CountDownLatch(1);
                  ThreadFactory executeFactory = runnable -&gt; {
                      Thread thread = new Thread(runnable, "execute-exception-worker");
                      thread.setUncaughtExceptionHandler((ignored, error) -&gt; {
                          executeUncaught.set(error);
                          executeExceptionObserved.countDown();
                      });
              ...
          }</code></pre>
        </li>
        <li>submit trả Future; exception được giữ trong Future và xuất hiện dưới dạng ExecutionException khi get.</li>
        <li>Cả hai executor được shutdown sau khi quan sát xong.</li>
      </ol>
      <p><b>Kết luận:</b> So sánh execute() và submit(). Response và Execution Context là bằng chứng runtime cho behavior này; đoạn source colocated ở trên cho thấy code path tạo experiment.</p>
    usage: true
