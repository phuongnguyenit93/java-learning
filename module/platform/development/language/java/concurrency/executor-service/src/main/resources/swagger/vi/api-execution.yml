              }</code></pre>
        </li>
        <li>Service ghi start, end và gap giữa các lần chạy rồi cancel periodic future.</li>
        <li>Kết quả cho thấy fixed-rate cố bám lịch còn fixed-delay đợi thêm delay sau khi lần trước kết thúc, và task không overlap trên single-thread scheduler.</li>
      </ol>
