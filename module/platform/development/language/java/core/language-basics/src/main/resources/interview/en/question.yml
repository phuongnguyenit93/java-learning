questions:
  - question: "Explain the difference between primitive-value copying and reference-value copying in Java."
    answer: "Primitive assignment copies the primitive value. Reference assignment copies a reference value, so two variables can identify one object; it does not clone that object. This distinction underlies aliasing and pass-by-value."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.PrimitiveReference/PrimitiveReference.md", anchor: "primitive-vs-reference-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Why do fields have default values while local variables must be definitely assigned?"
    answer: "Object/class initialization gives fields language-defined defaults before explicit initialization. Local variables are controlled by compile-time definite-assignment analysis and cannot be read until every reachable path assigns them."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.VariablesScope/VariablesScope.md", anchor: "definite-assignment"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Describe how widening, boxing, varargs, and most-specific selection interact during overload resolution."
    answer: "The compiler searches applicability in ordered phases, favoring earlier fixed-arity conversions before later boxing/varargs phases. Within one applicable phase it selects the most-specific method. Runtime receiver type does not redo overload selection."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.Methods/Methods.md", anchor: "overload-resolution-phases"}
    apiRelated: {controller: "OverloadResolutionController", methodSignature: "selectionMatrix()"}

  - question: "Prove that Java is pass-by-value even when a callee can mutate a caller-visible object."
    answer: "The parameter receives a copy of the reference value. Mutating through that copied reference affects the shared object, but reassigning the parameter does not change the caller variable. That behavior is exactly pass-by-value of a reference."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.PassByValue/PassByValue.md", anchor: "java-pass-by-value"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Why are arrays covariant while generics are usually invariant, and what safety consequence appears for arrays?"
    answer: "Java permits a subtype array to be viewed as a supertype array for historical type-system reasons, so writes require a runtime component-type check and can throw ArrayStoreException. Generics prefer compile-time invariance instead."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.Arrays/Arrays.md", anchor: "array-covariance-risk"}
    apiRelated: {controller: "ArrayController", methodSignature: "covarianceFailure()"}

  - question: "What decisions use compile-time type and what decisions use runtime type in ordinary Java method calls?"
    answer: "Compile-time type controls member availability, overload selection, assignment, and casts. After an instance-method signature is selected, runtime receiver class chooses the override implementation. Fields and static methods are not dynamically dispatched."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "13.TypeSystemMentalModel/TypeSystemMentalModel.md", anchor: "compile-time-vs-runtime-type"}
    apiRelated: {controller: "TypeSystemController", methodSignature: "inspectRuntimeType(Object)"}

  - question: "Why can wrapper types introduce NullPointerException in expressions that look numeric?"
    answer: "Arithmetic/comparison may trigger implicit unboxing. If the wrapper reference is null, there is no primitive value to extract, so unboxing throws NullPointerException before the arithmetic can proceed."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.WrapperBoxing/WrapperBoxing.md", anchor: "unboxing-null"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "How should an API decide between null, an empty result, an exception, or Optional-like absence?"
    answer: "Choose from domain semantics: is absence expected, exceptional, or distinguishable from an empty value? Document the contract consistently. The goal is not to ban null mechanically but to make absence explicit and unsurprising."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "12.Null/Null.md", anchor: "null-api-design"}
    apiRelated: {controller: "", methodSignature: ""}
