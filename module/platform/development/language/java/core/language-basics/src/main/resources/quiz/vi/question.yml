      - {id: B, answer: "Local variable chịu compile-time definite-assignment analysis và không có automatic default value.", explanation: "Đúng. Field có default value khi initialize, còn local phải definitely assigned trước khi đọc."}
      - {id: C, answer: "Vì JVM initialize local thành null.", explanation: "Sai. Field có default value khi initialize, còn local phải definitely assigned trước khi đọc."}
