  copyReferenceElements():
    execution: <p><strong>Khái niệm:</strong> Copy reference array không deep-copy
      object được element tham chiếu.</p><ol><li>Tạo <code>User[] original</code>
      rồi gọi <code>Arrays.copyOf</code> để tạo array object mới.</li><li>Endpoint
      so sánh identity của hai array và identity của element index 0:<pre><code>User[]
      copied = Arrays.copyOf(original, original.length); boolean differentArrays =
      original != copied; boolean sameElementReference = original[0] == copied[0];</code></pre></li><li>Sau
      đó mutate object qua <code>copied[0]</code> và đọc lại qua <code>original[0]</code>.</li><li><strong>Quan
      sát:</strong> <code>differentArrayObjects=true</code>, <code>sameElementReference=true</code>,
      và tên đọc từ original đổi thành B.</li></ol><p><strong>Kết luận:</strong> array
      copy tạo container mới nhưng với reference element nó chỉ copy reference value;
      object bên trong vẫn có thể được chia sẻ.</p>
    usage: true
