ControlFlowController:
  patternSwitch():
    execution: <p><strong>Khái niệm:</strong> Java 21 switch expression có thể match
      reference value bằng type pattern và xử lý null rõ ràng.</p><ol><li>Endpoint
      gọi cùng helper với Integer, String, null và Double.</li><li>Helper dùng pattern
      switch:<pre><code>return switch (value) { case Integer integer -&gt; "integer:"
      + integer; case String text -&gt; "string:" + text; case null -&gt; "null";
      default -&gt; "other:" + value.getClass().getSimpleName(); };</code></pre></li><li><strong>Quan
      sát:</strong> mỗi input đi đúng một branch; pattern case vừa kiểm tra runtime
      type vừa bind variable có static type tương ứng, còn null được xử lý bởi <code>case
      null</code>.</li></ol><p><strong>Kết luận:</strong> pattern switch phù hợp khi
      nhiều nhánh cùng phân loại một selector và cần value result rõ ràng.</p>
    usage: true
