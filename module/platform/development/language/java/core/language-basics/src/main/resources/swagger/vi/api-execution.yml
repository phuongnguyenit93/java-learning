  conversionContexts():
    execution: <p><strong>Khái niệm:</strong> Java áp dụng conversion rule khác nhau
      tùy context.</p><ol><li>Một constant assignment vào <code>byte</code> giữ static
      type byte.</li><li>Hai operand byte tham gia arithmetic được numeric promotion
      thành int; endpoint chứng minh bằng overload <code>identify(byte)</code>/<code>identify(int)</code>:<pre><code>result.put("assignmentConstantType",
      identify(assignmentConstant)); result.put("bytePlusByteExpressionType", identify(left
      + right));</code></pre></li><li>Lời gọi <code>acceptLong(10)</code> cho thấy
      method-invocation widening từ int sang long; <code>Integer boxed = 10</code>
      cho thấy boxing.</li><li>Response còn ghi compile-time boundary rằng <code>useByte(1)</code>
      không tự dùng narrowing constant conversion như assignment.</li></ol><p><strong>Kết
      luận:</strong> đừng hỏi chỉ “value này convert được không”; phải hỏi đang ở
      assignment, operator, method invocation hay explicit-cast context.</p>
    usage: true
