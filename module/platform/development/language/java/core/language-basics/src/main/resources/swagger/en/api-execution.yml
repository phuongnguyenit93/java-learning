  copyReferenceElements():
    execution: <p><strong>Concept:</strong> Copying a reference array does not deep-copy
      the objects referenced by its elements.</p><ol><li>Create <code>User[] original</code>
      and use <code>Arrays.copyOf</code> to create a different array object.</li><li>The
      endpoint compares both array identity and element identity:<pre><code>User[]
      copied = Arrays.copyOf(original, original.length); boolean differentArrays =
      original != copied; boolean sameElementReference = original[0] == copied[0];</code></pre></li><li>It
      mutates the shared object through <code>copied[0]</code> and then reads it through
      <code>original[0]</code>.</li><li><strong>Observation:</strong> <code>differentArrayObjects=true</code>,
      <code>sameElementReference=true</code>, and the original view observes name
      B.</li></ol><p><strong>Conclusion:</strong> array copying creates a new container,
      but reference elements are copied as reference values and may still share the
      same object.</p>
    usage: true
