  conversionContexts():
    execution: <p><strong>Concept:</strong> Java permits different conversions in
      different contexts.</p><ol><li>A constant assignment to <code>byte</code> keeps
      a byte-typed variable.</li><li>Arithmetic on two byte operands applies numeric
      promotion to int; overloads <code>identify(byte)</code>/<code>identify(int)</code>
      make the expression type observable:<pre><code>result.put("assignmentConstantType",
      identify(assignmentConstant)); result.put("bytePlusByteExpressionType", identify(left
      + right));</code></pre></li><li><code>acceptLong(10)</code> demonstrates method-invocation
      widening from int to long, while <code>Integer boxed = 10</code> demonstrates
      boxing.</li><li>The response also records the compile-time boundary that <code>useByte(1)</code>
      does not automatically use the narrowing constant conversion available in assignment
      context.</li></ol><p><strong>Conclusion:</strong> ask which conversion context
      applies—assignment, operator, invocation, or explicit cast—before predicting
      whether code compiles.</p>
    usage: true
