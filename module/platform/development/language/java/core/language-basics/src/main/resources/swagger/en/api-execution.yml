ControlFlowController:
  patternSwitch():
    execution: <p><strong>Concept:</strong> Java 21 switch expressions can classify
      reference values with type patterns and can handle null explicitly.</p><ol><li>The
      endpoint invokes the same helper with an Integer, String, null, and Double.</li><li>The
      helper uses a pattern switch:<pre><code>return switch (value) { case Integer
      integer -&gt; "integer:" + integer; case String text -&gt; "string:" + text;
      case null -&gt; "null"; default -&gt; "other:" + value.getClass().getSimpleName();
      };</code></pre></li><li><strong>Observation:</strong> exactly one branch handles
      each input; a pattern case both checks runtime type and binds a statically typed
      variable, while <code>case null</code> handles null explicitly.</li></ol><p><strong>Conclusion:</strong>
      pattern switch is useful when several branches classify one selector and a value-producing
      decision table is clearer than a long conditional chain.</p>
    usage: true
