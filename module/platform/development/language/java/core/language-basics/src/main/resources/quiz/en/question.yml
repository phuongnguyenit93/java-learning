  - id: array-covariance-runtime
    question: "Why can `Object[] a = new String[1]; a[0] = 123;` compile but fail?"
    answers:
      - {id: A, answer: "Integer is not an Object.", explanation: "Incorrect. The assignment is allowed through the Object[] view, then a runtime store check throws ArrayStoreException."}
      - {id: B, answer: "Object[] variables cannot store any value.", explanation: "Incorrect. The assignment is allowed through the Object[] view, then a runtime store check throws ArrayStoreException."}
      - {id: C, answer: "Arrays are covariant, but the runtime array remembers its String component type and rejects the incompatible store.", explanation: "Correct. The assignment is allowed through the Object[] view, then a runtime store check throws ArrayStoreException."}
      - {id: D, answer: "The array changes its runtime type to Object[] after assignment.", explanation: "Incorrect. The assignment is allowed through the Object[] view, then a runtime store check throws ArrayStoreException."}
