  - id: java-pass-by-value
    question: "A method mutates an object received as a parameter and the caller sees the mutation. Does this prove Java is pass-by-reference?"
    answers:
      - {id: A, answer: "Yes, any visible mutation proves pass-by-reference.", explanation: "Incorrect. Parameter reassignment stays local, while mutation through the copied reference can be visible."}
      - {id: B, answer: "No. Java copied the reference value, and both copied references identify the same mutable object.", explanation: "Correct. Parameter reassignment stays local, while mutation through the copied reference can be visible."}
      - {id: C, answer: "Yes, but only for collections.", explanation: "Incorrect. Parameter reassignment stays local, while mutation through the copied reference can be visible."}
      - {id: D, answer: "No, because methods cannot mutate objects at all.", explanation: "Incorrect. Parameter reassignment stays local, while mutation through the copied reference can be visible."}
    correctAnswerId: B
