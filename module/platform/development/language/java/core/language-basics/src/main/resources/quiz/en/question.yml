  - id: overload-phase-widening
    question: "With overloads `f(long)`, `f(Integer)`, and `f(int...)`, which is selected by `f(1)`?"
    answers:
      - {id: A, answer: "`f(Integer)` because boxing always has highest priority.", explanation: "Incorrect. Overload resolution proceeds in phases; an earlier applicable phase prevents later varargs selection."}
      - {id: B, answer: "`f(int...)` because it is an exact int element type.", explanation: "Incorrect. Overload resolution proceeds in phases; an earlier applicable phase prevents later varargs selection."}
      - {id: C, answer: "The call is always ambiguous.", explanation: "Incorrect. Overload resolution proceeds in phases; an earlier applicable phase prevents later varargs selection."}
      - {id: D, answer: "`f(long)` because an applicable fixed-arity widening conversion is considered before boxing and varargs fallback.", explanation: "Correct. Overload resolution proceeds in phases; an earlier applicable phase prevents later varargs selection."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.Methods/Methods.md", anchor: "overload-resolution-phases"}
    apiRelated: {controller: "OverloadResolutionController", methodSignature: "selectionMatrix()"}

  - id: null-overload-ambiguity
    question: "Why can `f(null)` be ambiguous when overloads accept `String` and `StringBuilder`?"
    answers:
      - {id: A, answer: "null fits both unrelated reference types and neither overload is more specific than the other.", explanation: "Correct. Most-specific selection cannot choose between unrelated reference parameter types for a null literal."}
      - {id: B, answer: "null can be passed only to String.", explanation: "Incorrect. Most-specific selection cannot choose between unrelated reference parameter types for a null literal."}
      - {id: C, answer: "StringBuilder is always more specific than String.", explanation: "Incorrect. Most-specific selection cannot choose between unrelated reference parameter types for a null literal."}
      - {id: D, answer: "null is a primitive and must be boxed first.", explanation: "Incorrect. Most-specific selection cannot choose between unrelated reference parameter types for a null literal."}
