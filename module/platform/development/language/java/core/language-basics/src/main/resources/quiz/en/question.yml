  - id: short-circuit-null-guard
    question: "Why is `value != null && value.isBlank()` safe from dereferencing null?"
    answers:
      - {id: A, answer: "`isBlank()` automatically accepts null.", explanation: "Incorrect. Short-circuiting is control-flow semantics: a false left side prevents evaluation of the right side."}
      - {id: B, answer: "`&&` evaluates the right operand only when the left operand is true.", explanation: "Correct. Short-circuiting is control-flow semantics: a false left side prevents evaluation of the right side."}
      - {id: C, answer: "The compiler replaces null with an empty string.", explanation: "Incorrect. Short-circuiting is control-flow semantics: a false left side prevents evaluation of the right side."}
      - {id: D, answer: "Both operands run, but NullPointerException is ignored.", explanation: "Incorrect. Short-circuiting is control-flow semantics: a false left side prevents evaluation of the right side."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Operators/Operators.md", anchor: "short-circuit-operators"}
    apiRelated: {controller: "OperatorController", methodSignature: "shortCircuit()"}

  - id: reference-downcast-runtime
    question: "A downcast compiles. What still determines whether it succeeds?"
    answers:
      - {id: A, answer: "The variable name must match the target class.", explanation: "Incorrect. A cast changes the compile-time view but runtime performs a type check for downcasts."}
      - {id: B, answer: "The target type must be declared final.", explanation: "Incorrect. A cast changes the compile-time view but runtime performs a type check for downcasts."}
      - {id: C, answer: "The runtime object must actually be compatible with the requested target type.", explanation: "Correct. A cast changes the compile-time view but runtime performs a type check for downcasts."}
      - {id: D, answer: "The source reference must have been created in the same method.", explanation: "Incorrect. A cast changes the compile-time view but runtime performs a type check for downcasts."}
