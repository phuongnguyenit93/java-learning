# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: primitive-reference-copy
    question: "After `List<String> b = a`, what does Java copy?"
    answers:
      - {id: A, answer: "The reference value; both variables can identify the same List object.", explanation: "Correct. Reference assignment copies the reference value, not the object graph."}
      - {id: B, answer: "A new deep copy of the List.", explanation: "Incorrect. Reference assignment copies the reference value, not the object graph."}
      - {id: C, answer: "Only the current list size.", explanation: "Incorrect. Reference assignment copies the reference value, not the object graph."}
      - {id: D, answer: "The physical memory address as a primitive long.", explanation: "Incorrect. Reference assignment copies the reference value, not the object graph."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.PrimitiveReference/PrimitiveReference.md", anchor: "primitive-vs-reference-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: local-definite-assignment
    question: "Why can a local `int x;` not be read before the compiler sees an assignment on every path?"
    answers:
      - {id: A, answer: "Because every local variable is implicitly final.", explanation: "Incorrect. Fields get default values during initialization, but locals must be definitely assigned before reading."}
      - {id: B, answer: "Local variables are subject to compile-time definite-assignment analysis and receive no automatic default value.", explanation: "Correct. Fields get default values during initialization, but locals must be definitely assigned before reading."}
      - {id: C, answer: "Because the JVM initializes locals to null.", explanation: "Incorrect. Fields get default values during initialization, but locals must be definitely assigned before reading."}
      - {id: D, answer: "Because only static methods may initialize local variables.", explanation: "Incorrect. Fields get default values during initialization, but locals must be definitely assigned before reading."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.VariablesScope/VariablesScope.md", anchor: "definite-assignment"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: wrapper-identity-cache
    question: "What is the safe rule for comparing numeric wrapper values?"
    answers:
      - {id: A, answer: "Always use `==` because autoboxing removes object identity.", explanation: "Incorrect. `==` compares object identity while wrapper caching is not a value-equality contract."}
      - {id: B, answer: "Use `hashCode()` equality only.", explanation: "Incorrect. `==` compares object identity while wrapper caching is not a value-equality contract."}
      - {id: C, answer: "Use value equality such as `equals`, not `==`, because wrapper identity may be cached or distinct.", explanation: "Correct. `==` compares object identity while wrapper caching is not a value-equality contract."}
      - {id: D, answer: "Wrapper values cannot be compared after boxing.", explanation: "Incorrect. `==` compares object identity while wrapper caching is not a value-equality contract."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.WrapperBoxing/WrapperBoxing.md", anchor: "wrapper-caching"}
    apiRelated: {controller: "WrapperController", methodSignature: "wrapperIdentity()"}

  - id: wrapper-null-unboxing
    question: "What happens when `Integer count = null; int x = count;` executes?"
    answers:
      - {id: A, answer: "x becomes 0.", explanation: "Incorrect. A null wrapper cannot provide the primitive value required by unboxing."}
      - {id: B, answer: "The compiler silently skips the assignment.", explanation: "Incorrect. A null wrapper cannot provide the primitive value required by unboxing."}
      - {id: C, answer: "x becomes Integer.MIN_VALUE.", explanation: "Incorrect. A null wrapper cannot provide the primitive value required by unboxing."}
      - {id: D, answer: "Unboxing requires an object value, so a NullPointerException is thrown.", explanation: "Correct. A null wrapper cannot provide the primitive value required by unboxing."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.WrapperBoxing/WrapperBoxing.md", anchor: "unboxing-null"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: numeric-promotion-byte
    question: "Given `byte a=1,b=2`, what is the type of `a + b` before an explicit cast?"
    answers:
      - {id: A, answer: "int", explanation: "Correct. Binary numeric promotion promotes byte/short operands to int for arithmetic."}
      - {id: B, answer: "byte", explanation: "Incorrect. Binary numeric promotion promotes byte/short operands to int for arithmetic."}
      - {id: C, answer: "short", explanation: "Incorrect. Binary numeric promotion promotes byte/short operands to int for arithmetic."}
      - {id: D, answer: "long", explanation: "Incorrect. Binary numeric promotion promotes byte/short operands to int for arithmetic."}
    correctAnswerId: A
