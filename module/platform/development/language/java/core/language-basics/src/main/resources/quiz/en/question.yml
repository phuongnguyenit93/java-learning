  - id: compile-runtime-type-dispatch
    question: "For `Animal a = new Dog()`, which statement is correct?"
    answers:
      - {id: A, answer: "Overload/member availability uses the compile-time Animal view, while an overridden instance method dispatches to Dog at runtime.", explanation: "Correct. Java separates compile-time signature selection from runtime override dispatch."}
