AliasingController:
  mutateAlias():
    execution: '<p><strong>Concept:</strong> Multiple references to one mutable object.</p><ol><li>The
      endpoint runs a bounded deterministic example inside <code>AliasingController#mutateAlias()</code>.</li><li>Show
      two references observing same mutation.<pre><code>@GetMapping(&quot;/mutation&quot;)
      public Map&lt;String,Object&gt; mutateAlias(){ List&lt;String&gt; first=new
      ArrayList&lt;&gt;(); List&lt;String&gt; second=first; second.add(&quot;visible-through-both&quot;);
      return Map.of(&quot;sameIdentity&quot;,first==second,&quot;first&quot;,first,&quot;second&quot;,second);
      }</code></pre></li><li>Inspect the response fields together: they are the observable
      evidence for the rule rather than a benchmark or production policy.</li></ol><p><strong>Conclusion:</strong>
      connect the observed result back to the linked README section before generalizing
      the behavior.</p>'
