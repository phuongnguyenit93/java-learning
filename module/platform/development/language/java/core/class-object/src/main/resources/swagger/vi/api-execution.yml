AliasingController:
  mutateAlias():
    execution: <p><strong>Khái niệm:</strong> Nhiều reference c&#249;ng tới một mutable
      object.</p><ol><li>Endpoint chạy một ví dụ deterministic và bounded trong <code>AliasingController#mutateAlias()</code>.</li><li>Source
      line dưới đây là code evidence trực tiếp tạo behavior được quan sát:<pre><code>@GetMapping(&quot;/mutation&quot;)
      public Map&lt;String,Object&gt; mutateAlias(){ List&lt;String&gt; first=new
      ArrayList&lt;&gt;(); List&lt;String&gt; second=first; second.add(&quot;visible-through-both&quot;);
      return Map.of(&quot;sameIdentity&quot;,first==second,&quot;first&quot;,first,&quot;second&quot;,second);
      }</code></pre></li><li>Quan sát các field trong response cùng nhau; đây là evidence
