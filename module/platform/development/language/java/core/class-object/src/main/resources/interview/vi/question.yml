questions:
  - question: "Giải thích quan hệ giữa class, object, reference, identity và state."
    answer: "Class định nghĩa type và implementation. Object là runtime instance có identity và instance state. Variable giữ reference value nhận diện object. Nhiều reference có thể cùng tới một object, còn hai object distinct có thể có state equal."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.ClassObject/ClassObject.md", anchor: "class-object-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Constructor nên guarantee gì trước khi object được publish?"
    answer: "Nó nên establish invariant cần thiết và initialize owned state. Publish this hay register callback quá sớm có thể expose partially initialized object, nên construction thường phải hoàn tất trước khi external code quan sát."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Constructor/Constructor.md", anchor: "constructor-purpose"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Mô tả order instance initialization qua superclass và subclass."
    answer: "Field bắt đầu bằng default value. Superclass construction hoàn tất trước. Ở từng class level, instance field initializer và instance initializer block chạy theo textual order trước constructor body. Điều này giải thích constructor-dispatch hazard."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.InitializationOrder/InitializationOrder.md", anchor: "inheritance-initialization-order"}
    apiRelated: {controller: "InitializationController", methodSignature: "traceOrder()"}

  - question: "Vì sao protected access subtle hơn private/package-private/public khi xuyên package?"
    answer: "Subclass ngoài package chỉ có protected access theo subclass-context và qualifying-expression rule; nó không thể tùy ý access protected member qua mọi superclass instance. Same-package access là phần semantics khác."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.AccessModifier/AccessModifier.md", anchor: "protected-cross-package"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao enum không chỉ là nhóm integer constant?"
    answer: "Mỗi enum constant là instance của special class. Enum có field, constructor, method, interface và constant-specific behavior trong khi vẫn giữ finite named instance set và identity semantics."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "11.Enum/Enum.md", anchor: "enum-type-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Deep copy nên có nghĩa gì trong domain model thực tế?"
    answer: "Nó nên duplicate mutable reachable state mà object mới phải own độc lập. Immutable value có thể share, cycle cần xử lý và external resource có thể không copy được. Depth là ownership contract chứ không phải universal recursive rule."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "12.CopySemantics/CopySemantics.md", anchor: "deep-copy"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Aliasing và mutability kết hợp tạo hidden coupling thế nào?"
    answer: "Nếu nhiều reference cùng tới một mutable object, component này có thể thay state mà component khác nhìn thấy mà không có explicit data transfer. Ownership rule, encapsulation, immutability và defensive copy giảm coupling đó."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "13.ObjectAliasingMutability/ObjectAliasingMutability.md", anchor: "aliasing-model"}
    apiRelated: {controller: "AliasingController", methodSignature: "mutateAlias()"}

  - question: "Vì sao final field không đủ guarantee deep immutability?"
    answer: "final chỉ ngăn reassign field reference, còn referenced object vẫn có thể mutate qua reference này hoặc alias khác. Deep immutability cần reachable state liên quan immutable hoặc exclusive-owned và không mutate sau construction."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "14.ImmutabilityDefensiveCopy/ImmutabilityDefensiveCopy.md", anchor: "deep-immutability"}
    apiRelated: {controller: "", methodSignature: ""}
