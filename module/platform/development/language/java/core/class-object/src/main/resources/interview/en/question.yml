questions:
  - question: "Explain the relationship among class, object, reference, identity, and state."
    answer: "A class defines the type and implementation. An object is a runtime instance with identity and instance state. Variables hold reference values that can identify objects. Multiple references may identify one object, while distinct objects may contain equal state."
    aiGenerated: true
    reviewed: false
