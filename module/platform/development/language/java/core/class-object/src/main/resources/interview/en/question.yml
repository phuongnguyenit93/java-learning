#
# questions [type: list; required; default: []]
#   Interview questions for the current module language.
#   each item:
#     question [type: string; required; default: ""]
#       Interview question displayed to the learner.
#     answer [type: string; required; default: ""]
#       Reference answer, revealed only when the learner explicitly opens it.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the content was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the content has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
# </interview-schema>

questions:
  - question: "Explain the relationship among class, object, reference, identity, and state."
    answer: "A class defines the type and implementation. An object is a runtime instance with identity and instance state. Variables hold reference values that can identify objects. Multiple references may identify one object, while distinct objects may contain equal state."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.ClassObject/ClassObject.md", anchor: "class-object-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "What should a constructor guarantee before an object is published?"
    answer: "It should establish required invariants and initialize owned state. Publishing this or registering callbacks too early can expose a partially initialized object, so construction should normally complete before external code can observe it."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Constructor/Constructor.md", anchor: "constructor-purpose"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Walk through superclass and subclass instance initialization order."
    answer: "Fields begin with default values. Superclass construction completes first. For each class level, instance field initializers and instance initializer blocks run in textual order before that constructor body. This explains constructor-dispatch hazards."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.InitializationOrder/InitializationOrder.md", anchor: "inheritance-initialization-order"}
    apiRelated: {controller: "InitializationController", methodSignature: "traceOrder()"}

  - question: "Why is protected access more subtle than private, package-private, or public across packages?"
    answer: "A subclass outside the package gains protected access only through subclass-context and qualifying-expression rules; it cannot arbitrarily access a protected member through any superclass instance. Same-package access is a separate part of protected semantics."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.AccessModifier/AccessModifier.md", anchor: "protected-cross-package"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Why is an enum more than a group of integer constants?"
    answer: "Each enum constant is an instance of a special class. Enums can have fields, constructors, methods, interfaces, and constant-specific behavior while maintaining a finite named instance set and identity semantics."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "11.Enum/Enum.md", anchor: "enum-type-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "What should deep copy mean in a real domain model?"
    answer: "It should duplicate the mutable reachable state that the new object must own independently. Immutable values may safely be shared, cycles need handling, and external resources may not be copyable. Depth is an ownership contract, not a universal recursive rule."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "12.CopySemantics/CopySemantics.md", anchor: "deep-copy"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "How do aliasing and mutability combine to create hidden coupling?"
    answer: "If multiple references point to one mutable object, one component can change state another component observes without an explicit data transfer. Ownership rules, encapsulation, immutability, and defensive copies reduce that coupling."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "13.ObjectAliasingMutability/ObjectAliasingMutability.md", anchor: "aliasing-model"}
    apiRelated: {controller: "AliasingController", methodSignature: "mutateAlias()"}

  - question: "Why are final fields insufficient to guarantee deep immutability?"
    answer: "final prevents reassigning the field reference, but the referenced object may still mutate through this or another alias. Deep immutability requires relevant reachable state to be immutable or exclusively owned and never mutated after construction."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "14.ImmutabilityDefensiveCopy/ImmutabilityDefensiveCopy.md", anchor: "deep-immutability"}
    apiRelated: {controller: "", methodSignature: ""}
