  - id: instance-initializer-order
    question: "For one class, when do instance initializer blocks run relative to the constructor body?"
    answers:
      - {id: A, answer: "After the constructor body has returned.", explanation: "Incorrect. Instance field initializers and instance initializer blocks run before that class's constructor body, after the superclass constructor completes."}
      - {id: B, answer: "Only when the constructor explicitly calls them.", explanation: "Incorrect. Instance field initializers and instance initializer blocks run before that class's constructor body, after the superclass constructor completes."}
      - {id: C, answer: "Before the superclass constructor starts.", explanation: "Incorrect. Instance field initializers and instance initializer blocks run before that class's constructor body, after the superclass constructor completes."}
      - {id: D, answer: "Before that class's constructor body, after the superclass-construction step for the object.", explanation: "Correct. Instance field initializers and instance initializer blocks run before that class's constructor body, after the superclass constructor completes."}
