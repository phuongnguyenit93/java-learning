  - id: reference-reachability-lifetime
    question: "A local reference variable goes out of scope. When may the referenced object still remain alive?"
    answers:
      - {id: A, answer: "When another reachable reference still points to the object.", explanation: "Correct. GC eligibility is based on reachability, not on one variable leaving lexical scope."}
      - {id: B, answer: "Never; local scope end immediately destroys the object.", explanation: "Incorrect. The object may still be reachable through other references."}
      - {id: C, answer: "Only if every field is static.", explanation: "Incorrect. Static fields are not required for an object to remain reachable."}
      - {id: D, answer: "Only until the current statement completes.", explanation: "Incorrect. Lifetime depends on reachability, not statement boundaries."}
