      - {id: C, answer: "They cannot both have instance fields.", explanation: "Incorrect. Each object can have its own instance fields."}
      - {id: D, answer: "Java merges them automatically to save memory.", explanation: "Incorrect. Ordinary object instances are not merged merely because field values match."}
