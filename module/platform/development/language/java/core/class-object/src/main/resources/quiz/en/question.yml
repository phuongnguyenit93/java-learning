  - id: defensive-copy-input
    question: "Why might an immutable object defensively copy a mutable constructor argument?"
    answers:
      - {id: A, answer: "To make the constructor run twice.", explanation: "Incorrect. Immutability requires controlling reachable mutable state, not only making fields final."}
      - {id: B, answer: "Because final fields cannot store objects.", explanation: "Incorrect. Immutability requires controlling reachable mutable state, not only making fields final."}
      - {id: C, answer: "To change reference equality into primitive equality.", explanation: "Incorrect. Immutability requires controlling reachable mutable state, not only making fields final."}
      - {id: D, answer: "To prevent the caller from keeping an alias and mutating internal state after construction.", explanation: "Correct. Immutability requires controlling reachable mutable state, not only making fields final."}
    correctAnswerId: D
