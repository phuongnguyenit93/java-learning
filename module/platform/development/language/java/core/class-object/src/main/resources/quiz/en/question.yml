  - id: aliasing-visible-mutation
    question: "What does object aliasing mean?"
    answers:
      - {id: A, answer: "Two different objects happen to have equal fields.", explanation: "Incorrect. Aliasing is about shared object identity, not similar variable names."}
      - {id: B, answer: "A variable is declared final.", explanation: "Incorrect. Aliasing is about shared object identity, not similar variable names."}
      - {id: C, answer: "Multiple references identify the same object, so mutation through one alias can be observed through another.", explanation: "Correct. Aliasing is about shared object identity, not similar variable names."}
      - {id: D, answer: "A class has multiple constructors.", explanation: "Incorrect. Aliasing is about shared object identity, not similar variable names."}
