      - {id: B, answer: "The outer object is new, but both copies can still share the same nested List reference.", explanation: "Correct. Shallow copy duplicates field values as-is, including reference values."}
      - {id: C, answer: "The new outer object must have the same identity.", explanation: "Incorrect. Shallow copy duplicates field values as-is, including reference values."}
      - {id: D, answer: "Primitive fields cannot be copied shallowly.", explanation: "Incorrect. Shallow copy duplicates field values as-is, including reference values."}
