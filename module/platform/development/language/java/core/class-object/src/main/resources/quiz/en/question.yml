# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: class-vs-object
    question: "Which statement best distinguishes a class from an object?"
    answers:
      - {id: A, answer: "A class defines a type and implementation blueprint; an object is a runtime instance with its own identity and instance state.", explanation: "Correct. Many objects can share one class definition while holding different state."}
      - {id: B, answer: "A class is always a runtime instance and an object is source code.", explanation: "Incorrect. Many objects can share one class definition while holding different state."}
      - {id: C, answer: "An object can exist only if all fields are static.", explanation: "Incorrect. Many objects can share one class definition while holding different state."}
      - {id: D, answer: "A class and every object created from it share one identity.", explanation: "Incorrect. Many objects can share one class definition while holding different state."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.ClassObject/ClassObject.md", anchor: "class-object-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: constructor-default-rule
    question: "When does Java provide an implicit default no-argument constructor?"
    answers:
      - {id: A, answer: "Always, even after custom constructors are declared.", explanation: "Incorrect. Declaring any constructor stops the compiler from generating the implicit default constructor."}
      - {id: B, answer: "Only when the class declares no constructor, subject to an accessible superclass constructor.", explanation: "Correct. Declaring any constructor stops the compiler from generating the implicit default constructor."}
      - {id: C, answer: "Only for abstract classes.", explanation: "Incorrect. Declaring any constructor stops the compiler from generating the implicit default constructor."}
      - {id: D, answer: "Only when every field is final.", explanation: "Incorrect. Declaring any constructor stops the compiler from generating the implicit default constructor."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Constructor/Constructor.md", anchor: "default-constructor"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: constructor-chaining
    question: "What is the relationship between `this(...)` and `super(...)` in a constructor chain?"
    answers:
      - {id: A, answer: "Both must be called as the first two statements.", explanation: "Incorrect. Construction follows one ordered chain rather than two competing first constructor calls."}
      - {id: B, answer: "super creates a separate parent object.", explanation: "Incorrect. Construction follows one ordered chain rather than two competing first constructor calls."}
      - {id: C, answer: "A constructor delegates first either to another constructor in the same class or to a superclass constructor, and the chain ultimately reaches the superclass.", explanation: "Correct. Construction follows one ordered chain rather than two competing first constructor calls."}
      - {id: D, answer: "this can only be used in static methods.", explanation: "Incorrect. Construction follows one ordered chain rather than two competing first constructor calls."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ThisSuper/ThisSuper.md", anchor: "constructor-chaining-order"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: protected-cross-package
    question: "Which description of protected access across packages is accurate?"
    answers:
      - {id: A, answer: "Protected means exactly public outside the package.", explanation: "Incorrect. Protected is subtler than simply package plus all subclasses everywhere."}
      - {id: B, answer: "Protected members are visible only in the declaring class.", explanation: "Incorrect. Protected is subtler than simply package plus all subclasses everywhere."}
      - {id: C, answer: "Any unrelated class can access protected fields through an instance.", explanation: "Incorrect. Protected is subtler than simply package plus all subclasses everywhere."}
      - {id: D, answer: "A subclass gets protected access subject to subclass-context and qualifying-expression rules, not arbitrary access through every superclass instance.", explanation: "Correct. Protected is subtler than simply package plus all subclasses everywhere."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.AccessModifier/AccessModifier.md", anchor: "protected-cross-package"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: final-reference-mutability
    question: "What does `final List<String> names = new ArrayList<>();` guarantee?"
    answers:
      - {id: A, answer: "The variable cannot be reassigned to another list, but the referenced List can still be mutated.", explanation: "Correct. final constrains assignment to the variable, not deep mutability of the referenced object."}
      - {id: B, answer: "The list becomes deeply immutable.", explanation: "Incorrect. final constrains assignment to the variable, not deep mutability of the referenced object."}
      - {id: C, answer: "Every element inserted becomes final.", explanation: "Incorrect. final constrains assignment to the variable, not deep mutability of the referenced object."}
      - {id: D, answer: "The reference may be reassigned but elements cannot change.", explanation: "Incorrect. final constrains assignment to the variable, not deep mutability of the referenced object."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.StaticFinal/StaticFinal.md", anchor: "final-variable-reference"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: initialization-parent-child
    question: "During `new Child()`, which broad order is correct?"
    answers:
      - {id: A, answer: "The child constructor body runs before any parent constructor.", explanation: "Incorrect. The one object is initialized through the superclass chain before subclass construction completes."}
      - {id: B, answer: "Superclass construction runs before subclass instance initializers and the subclass constructor body.", explanation: "Correct. The one object is initialized through the superclass chain before subclass construction completes."}
      - {id: C, answer: "All subclass fields initialize before the superclass constructor.", explanation: "Incorrect. The one object is initialized through the superclass chain before subclass construction completes."}
      - {id: D, answer: "Constructor order is random and JVM-specific.", explanation: "Incorrect. The one object is initialized through the superclass chain before subclass construction completes."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.InitializationOrder/InitializationOrder.md", anchor: "inheritance-initialization-order"}
    apiRelated: {controller: "InitializationController", methodSignature: "traceOrder()"}

  - id: constructor-override-risk
    question: "Why is calling an overridable method from a superclass constructor risky?"
    answers:
      - {id: A, answer: "Overrides are disabled during construction.", explanation: "Incorrect. Virtual dispatch still applies during construction, so the override can observe default field values."}
      - {id: B, answer: "It always creates two separate objects.", explanation: "Incorrect. Virtual dispatch still applies during construction, so the override can observe default field values."}
      - {id: C, answer: "Runtime dispatch can reach the subclass override before subclass fields have completed explicit initialization.", explanation: "Correct. Virtual dispatch still applies during construction, so the override can observe default field values."}
      - {id: D, answer: "The JVM skips the superclass constructor.", explanation: "Incorrect. Virtual dispatch still applies during construction, so the override can observe default field values."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.ObjectCreationLifecycle/ObjectCreationLifecycle.md", anchor: "constructor-dynamic-dispatch-risk"}
    apiRelated: {controller: "ConstructionController", methodSignature: "constructorDispatchRisk()"}

  - id: inner-class-outer
    question: "What distinguishes a non-static member inner class from a static nested class?"
    answers:
      - {id: A, answer: "A static nested class always extends its outer class.", explanation: "Incorrect. A static nested class has no implicit outer-instance reference."}
      - {id: B, answer: "An inner class has no access to outer members.", explanation: "Incorrect. A static nested class has no implicit outer-instance reference."}
      - {id: C, answer: "Only static nested classes can define methods.", explanation: "Incorrect. A static nested class has no implicit outer-instance reference."}
      - {id: D, answer: "The inner class is associated with an enclosing instance and can implicitly access that outer instance state.", explanation: "Correct. A static nested class has no implicit outer-instance reference."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.NestedInnerClass/NestedInnerClass.md", anchor: "inner-class"}
