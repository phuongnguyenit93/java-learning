    question: "Which statement best distinguishes a class from an object?"
    answers:
      - {id: A, answer: "A class defines a type and implementation blueprint; an object is a runtime instance with its own identity and instance state.", explanation: "Correct. Many objects can share one class definition while holding different state."}
      - {id: B, answer: "A class is always a runtime instance and an object is source code.", explanation: "Incorrect. Many objects can share one class definition while holding different state."}
      - {id: C, answer: "An object can exist only if all fields are static.", explanation: "Incorrect. Many objects can share one class definition while holding different state."}
      - {id: D, answer: "A class and every object created from it share one identity.", explanation: "Incorrect. Many objects can share one class definition while holding different state."}
