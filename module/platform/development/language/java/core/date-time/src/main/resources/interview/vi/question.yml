  - question: >-
      Vì sao immutability và value semantics của java.time quan trọng trong code production?
    answer: >-
      Các operation như plus, minus, with trả value mới thay vì sửa object gốc, nên việc truyền date-time qua nhiều layer ít tạo side effect ẩn và dễ reasoning hơn. Các type chính nên được xem như value: so sánh theo contract giá trị, không dựa vào object identity. Một lỗi migration phổ biến từ API mutable là gọi plusDays(...) nhưng quên gán kết quả mới.
