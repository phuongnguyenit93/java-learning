  - question: >-
      Hãy giải thích boundary giữa ISO chronology, non-ISO chronology và Locale trong java.time.
    answer: >-
      LocalDate, LocalDateTime và các Local* concrete type tương ứng là ISO calendar types; đổi Locale không biến chúng thành calendar system khác. Locale chủ yếu ảnh hưởng cách trình bày/parse text. Khi domain thật sự dùng lịch khác ISO, java.time.chrono có các abstraction/type riêng như ChronoLocalDate; đó là nhánh nâng cao, không phải configuration của LocalDate.
