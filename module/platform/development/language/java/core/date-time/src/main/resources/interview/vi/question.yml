    answer: >-
      ZoneOffset chỉ là một độ lệch cụ thể so với UTC; ZoneId region-based định danh cả bộ quy tắc có lịch sử và có thể thay đổi theo ngày hoặc quyết định pháp lý. Nhiều region có thể cùng offset tại một thời điểm, nên không thể suy ngược chắc chắn region từ +01:00. Future scheduling cần ZoneId nếu region rules là một phần của intent.
