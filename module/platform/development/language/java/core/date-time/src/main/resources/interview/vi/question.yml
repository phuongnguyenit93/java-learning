  - question: >-
      Vì sao LocalDateTime không nên được gọi là một global timestamp?
    answer: >-
      LocalDateTime có date + time nhưng không có ZoneId hay ZoneOffset, nên cùng local fields có thể map tới các Instant khác nhau ở các region khác nhau. Trong DST gap một local time có thể không tồn tại; trong overlap nó có thể xảy ra hai lần. Vì vậy nó không đủ để globally order hoặc identify event nếu chưa có context.
