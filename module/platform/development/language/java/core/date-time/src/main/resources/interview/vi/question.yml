  - question: >-
      Khi nhận một yêu cầu nghiệp vụ mới, bạn chọn temporal type theo nguyên tắc nào?
    answer: >-
      Hãy hỏi dữ liệu thật sự biết gì và chỉ model đúng phần đó. LocalDate/LocalTime/LocalDateTime giữ local calendar hoặc wall-clock facts; Instant giữ một timeline point; ZonedDateTime giữ local fields cùng ZoneId/rules; OffsetDateTime giữ concrete offset nhưng không biết region. Các type như YearMonth hay MonthDay giúp tránh invent ngày hoặc năm giả chỉ để vừa một type lớn hơn.
