    answer: >-
      LocalTime chỉ biết time-of-day và arithmetic của nó wrap trong 24 giờ; nó không biết 06:00 là cùng ngày hay ngày hôm sau. Muốn tính elapsed time phải bổ sung date hoặc một rule rõ ràng. Nếu ca làm thuộc region có DST thì LocalDateTime vẫn chưa đủ; cần ZoneId/ZonedDateTime hoặc quy về Instant trước khi đo elapsed timeline time.
