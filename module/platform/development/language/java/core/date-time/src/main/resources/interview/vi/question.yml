  - question: >-
      Tại sao LocalDate.of(2026, 1, 31).plusMonths(1) không đơn giản là cộng một số ngày cố định, và nếu business muốn rule khác thì làm gì?
    answer: >-
      plusMonths là calendar arithmetic: trước hết chuyển sang tháng đích rồi điều chỉnh ngày về một ngày hợp lệ, nên 31/01/2026 + 1 tháng trở thành 28/02/2026. Nó không có nghĩa "cộng N giây". Nếu business muốn semantics khác, ví dụ reject hoặc roll sang tháng tiếp theo, rule đó phải được encode/validate riêng thay vì suy từ behavior mặc định của JDK.
