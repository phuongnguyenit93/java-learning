      - {id: C, answer: "Serialize Plugin's Class object to text and cast it back.", explanation: "Incorrect. Serialization does not erase loader identity."}
      - {id: D, answer: "Rename the interface after every plugin load.", explanation: "Incorrect. That does not create a shared runtime contract."}
