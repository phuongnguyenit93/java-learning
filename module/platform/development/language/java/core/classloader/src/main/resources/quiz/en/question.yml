  - id: classloader-q22
    question: "What is the safe pattern for temporarily changing a Thread Context ClassLoader?"
    answers:
      - {id: A, answer: "Set the plugin loader once and leave it on a pooled thread forever.", explanation: "Incorrect. That can create the wrong discovery context and retain the loader."}
      - {id: B, answer: "Always restore the system ClassLoader regardless of the previous value.", explanation: "Incorrect. The caller/container may already have installed a meaningful context loader."}
      - {id: C, answer: "Save the previous value, install the temporary loader for the smallest scope, then restore exactly the previous value in finally.", explanation: "Correct. finally guarantees restoration even if discovery throws."}
      - {id: D, answer: "Change the framework class's defining loader and then change it back.", explanation: "Incorrect. A class's defining loader cannot be changed that way after definition."}
    correctAnswerId: C
