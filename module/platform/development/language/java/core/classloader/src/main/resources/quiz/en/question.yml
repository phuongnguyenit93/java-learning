  - id: classloader-q15
    question: "Which error mapping is most accurate when diagnosing a class-loading/linking failure?"
    answers:
      - {id: A, answer: "ClassNotFoundException always means the bytecode verifier rejected the class.", explanation: "Incorrect. ClassNotFoundException commonly means an explicit dynamic-loading request could not find the requested binary name."}
      - {id: B, answer: "NoClassDefFoundError can only occur when the .class file never existed on disk.", explanation: "Incorrect. It can also occur when runtime use/linking cannot complete a definition, including after a previous initialization failure."}
      - {id: C, answer: "VerifyError belongs to verification; NoSuchMethodError/IncompatibleClassChangeError are LinkageError-family failures; ClassNotFoundException commonly means explicit lookup could not find a name.", explanation: "Correct. Mapping the error to the lifecycle/runtime question is more useful than treating every case as 'class loading failed'."}
      - {id: D, answer: "UnsupportedClassVersionError is an initialization error caused by a static block throwing.", explanation: "Incorrect. It is a class-file/linkage failure when the JVM does not support that class-file version."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Lifecycle/Lifecycle.md", anchor: "linking-phases"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: classloader-q16
    question: "Two threads request the same binary name from one custom loader at the same time. Which rule matters most?"
    answers:
      - {id: A, answer: "Each thread should define its own copy for better throughput.", explanation: "Incorrect. One loader cannot successfully define the same binary name twice."}
      - {id: B, answer: "Only static initialization needs synchronization; definition races do not matter.", explanation: "Incorrect. Class definition itself has a concurrency contract."}
      - {id: C, answer: "Always override loadClass and remove locking to avoid deadlock.", explanation: "Incorrect. That can create duplicate-definition races."}
      - {id: D, answer: "Preserve normal loadClass locking/protocol, or provide equivalent synchronization if customizing it, so duplicate definition cannot race.", explanation: "Correct. This is one reason to prefer overriding findClass when that is sufficient."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CustomClassLoader/CustomClassLoader.md", anchor: "custom-loader-safety"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: classloader-q17
    question: "Two independent custom loaders define the same binary name from the same valid byte[]. What runtime result is correct?"
    answers:
      - {id: A, answer: "The JVM merges them into the same Class object because the bytes are identical.", explanation: "Incorrect. Different defining-loader identities make them different runtime types."}
      - {id: B, answer: "They are different Class<?> objects and are not automatically assignable to each other merely because name and bytes match.", explanation: "Correct. Ordinary named class/interface identity includes binary name plus defining loader."}
      - {id: C, answer: "The second loader is always forbidden from defining the name because it already exists somewhere in the JVM.", explanation: "Incorrect. Unrelated loaders have separate namespaces."}
      - {id: D, answer: "They differ only when their static initializers differ.", explanation: "Incorrect. Identity does not depend on initializer content."}
    correctAnswerId: B
