# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: classloader-q01
    question: "What core problem does a ClassLoader solve inside the JVM?"
    answers:
      - {id: A, answer: "It recompiles Java source into bytecode every time a method is called.", explanation: "Incorrect. javac/the compile pipeline creates class files; ClassLoader works at runtime with class definitions and resources."}
      - {id: B, answer: "It automatically runs static initialization as soon as a .class file exists on disk.", explanation: "Incorrect. A class file existing does not mean the class has been loaded or initialized."}
      - {id: C, answer: "It locates and brings class definitions into a runtime namespace so the JVM can create runtime types through loading, linking, and initialization.", explanation: "Correct. That is the foundation of the class-loading subsystem."}
      - {id: D, answer: "It only manages object memory after new is executed.", explanation: "Incorrect. Object allocation and garbage collection are not the primary ClassLoader responsibility."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Lifecycle/Lifecycle.md", anchor: "loading-linking-initialization"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: classloader-q02
    question: "Which statement correctly separates class-file bytes, Class<?>, and initialization?"
    answers:
      - {id: A, answer: "Class-file bytes are input; Class<?> is runtime type metadata/identity; initialization runs static-initialization semantics when triggered.", explanation: "Correct. They are related stages and representations, not the same state."}
      - {id: B, answer: "Class<?> is only a wrapper around the Path of a .class file.", explanation: "Incorrect. Class<?> represents a runtime type, not a filesystem path."}
      - {id: C, answer: "Having Class<?> always proves the static initializer has run.", explanation: "Incorrect. A class can be loaded/linked without being initialized."}
      - {id: D, answer: "If the bytes are inside a JAR, the JVM considers the class initialized.", explanation: "Incorrect. Packaging does not determine initialization."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Lifecycle/Lifecycle.md", anchor: "loading-linking-initialization"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: classloader-q03
    question: "What is the correct conceptual order of linking?"
    answers:
      - {id: A, answer: "resolve → verify → prepare", explanation: "Incorrect. Verification precedes preparation and resolution in the linking model."}
      - {id: B, answer: "prepare → initialize → verify", explanation: "Incorrect. Initialization is a separate phase that happens after linking when an appropriate trigger occurs."}
      - {id: C, answer: "verify → initialize → resolve", explanation: "Incorrect. Initialization is not one of the linking subphases."}
      - {id: D, answer: "verify → prepare → resolve", explanation: "Correct. Resolution may be lazy depending on runtime needs and JVM rules."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Lifecycle/Lifecycle.md", anchor: "linking-phases"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: classloader-q04
    question: "When class A has a symbolic reference to class/interface B, which loader is the starting point for loading B under resolution rules?"
    answers:
      - {id: A, answer: "Always the bootstrap loader, then other loaders if needed.", explanation: "Incorrect. Bootstrap is not the universal starting point for every dependency."}
      - {id: B, answer: "A's defining ClassLoader; that loader may then delegate.", explanation: "Correct. The loader that ultimately defines B becomes B's defining loader."}
      - {id: C, answer: "Always the current thread's TCCL.", explanation: "Incorrect. TCCL is a discovery context code may choose to use; it does not replace this dependency-resolution rule."}
      - {id: D, answer: "The loader of the class containing main(), regardless of which loader owns A.", explanation: "Incorrect. There is no single global application loader for every symbolic reference."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Lifecycle/Lifecycle.md", anchor: "linking-phases"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: classloader-q05
    question: "What is true when Class.forName(name, false, loader) is called?"
    answers:
      - {id: A, answer: "It only checks whether a file exists and never creates a Class<?>.", explanation: "Incorrect. It can load/link a class and return Class<?>."}
      - {id: B, answer: "It must execute <clinit> before returning.", explanation: "Incorrect. initialize=false specifically requests that this call not actively initialize the class."}
      - {id: C, answer: "It may load/link the class without actively triggering initialization merely because of this call.", explanation: "Correct. This cleanly demonstrates the boundary between loading and initialization."}
      - {id: D, answer: "It always uses the bootstrap loader even when another loader is supplied.", explanation: "Incorrect. The provided loader participates in lookup under this overload's contract."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Lifecycle/Lifecycle.md", anchor: "load-vs-initialize"}
    apiRelated: {controller: "ClassLifecycleController", methodSignature: "loadWithoutInit()"}

  - id: classloader-q06
    question: "When inspecting the built-in loader chain of an application class on Java 21, which interpretation is most accurate?"
    answers:
      - {id: A, answer: "The bootstrap loader always appears as a ClassLoader object at the end of the chain.", explanation: "Incorrect. Java APIs commonly represent the bootstrap loader with null."}
      - {id: B, answer: "The Application/System loader commonly has the Platform loader as parent, with bootstrap represented above it as null by the API.", explanation: "Correct. This is the useful modern built-in-chain model."}
      - {id: C, answer: "The Platform loader is a child of the Application loader.", explanation: "Incorrect. The usual parent direction is application → platform → bootstrap."}
      - {id: D, answer: "Every class has exactly the same ClassLoader object.", explanation: "Incorrect. Ownership depends on runtime namespace and source."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.BuiltInClassLoaders/BuiltInClassLoaders.md", anchor: "loader-chain"}
    apiRelated: {controller: "ClassLoaderChainController", methodSignature: "inspectChain()"}

  - id: classloader-q07
    question: "String.class.getClassLoader() returns null. What is the correct conclusion?"
    answers:
      - {id: A, answer: "String has no runtime loader ownership.", explanation: "Incorrect. null is the API representation used for a bootstrap-defined class."}
      - {id: B, answer: "String is defined by the application loader, but the API hides that object.", explanation: "Incorrect. Core classes such as String are normally bootstrap-defined."}
      - {id: C, answer: "The JVM has not loaded String yet.", explanation: "Incorrect. The existence of the Class object contradicts that conclusion."}
      - {id: D, answer: "The API uses null to represent a class defined by the bootstrap loader.", explanation: "Correct. Bootstrap is not exposed as an ordinary java.lang.ClassLoader object."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.BuiltInClassLoaders/BuiltInClassLoaders.md", anchor: "bootstrap-loader"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: classloader-q08
    question: "What is the practical distinction between the Platform ClassLoader and the Application/System ClassLoader?"
    answers:
      - {id: A, answer: "The Platform loader serves appropriate platform modules/classes, while the Application/System loader commonly loads application code from the configured class/module path.", explanation: "Correct. Exact ownership depends on runtime layout, but that is the useful role distinction."}
      - {id: B, answer: "The Platform loader existed only before Java 9.", explanation: "Incorrect. Java 9+ introduced the Platform ClassLoader in place of the old extension-loader model."}
      - {id: C, answer: "The Application loader is always the bootstrap loader.", explanation: "Incorrect. These are different loader roles."}
      - {id: D, answer: "The Platform loader can only load resources, never classes.", explanation: "Incorrect. It is a real ClassLoader for appropriate platform classes."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.BuiltInClassLoaders/BuiltInClassLoaders.md", anchor: "platform-loader"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: classloader-q09
    question: "Which flow best matches the default parent-first loadClass algorithm?"
    answers:
      - {id: A, answer: "Call findClass first, then ask the parent only if that fails.", explanation: "Incorrect. That is closer to child-first, not the default parent-first flow."}
      - {id: B, answer: "Check whether already loaded, delegate to parent/bootstrap, then call findClass if the parent cannot find it.", explanation: "Correct. That is the conceptual skeleton of the default loadClass protocol."}
      - {id: C, answer: "Always call defineClass from bytes first and check duplicates afterward.", explanation: "Incorrect. The normal protocol avoids blind duplicate definition."}
      - {id: D, answer: "Only consult TCCL and ignore the parent chain.", explanation: "Incorrect. TCCL is not the implementation of default parent delegation."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ParentDelegation/ParentDelegation.md", anchor: "parent-delegation"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: classloader-q10
    question: "What is a major benefit of parent-first delegation for shared platform/API types?"
    answers:
      - {id: A, answer: "It guarantees there is only one physical copy of every JAR on the machine.", explanation: "Incorrect. Delegation does not remove duplicate artifacts from disk."}
      - {id: B, answer: "It means the JVM never needs verification.", explanation: "Incorrect. Verification is a separate lifecycle concern."}
      - {id: C, answer: "It increases the chance that participants resolve a shared type to one consistent parent-owned runtime identity.", explanation: "Correct. This is especially important across plugin and framework boundaries."}
      - {id: D, answer: "It forces every implementation into the bootstrap loader.", explanation: "Incorrect. Child loaders can still define implementation classes."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ParentDelegation/ParentDelegation.md", anchor: "delegation-purpose"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: classloader-q11
    question: "What is a major risk of applying child-first loading too broadly?"
    answers:
      - {id: A, answer: "Child-first automatically disables garbage collection.", explanation: "Incorrect. Lookup order does not disable GC."}
      - {id: B, answer: "A child can create private copies of shared API/library types, causing type incompatibility or unexpected behavior.", explanation: "Correct. Isolation needs an intentional boundary rather than child-first for every package."}
      - {id: C, answer: "The JVM can no longer perform resource lookup.", explanation: "Incorrect. Resource policy is separate and can also be customized."}
      - {id: D, answer: "Every static initializer runs twice even when there is only one runtime class identity.", explanation: "Incorrect. Initialization belongs to a runtime class identity."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ParentDelegation/ParentDelegation.md", anchor: "child-first-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: classloader-q12
    question: "A custom ClassLoader tries to define a class in package java.example. What should you expect?"
    answers:
      - {id: A, answer: "It is allowed as long as the bytes are valid.", explanation: "Incorrect. The java.* namespace has a protected boundary."}
      - {id: B, answer: "It is allowed when the loader uses child-first lookup.", explanation: "Incorrect. Lookup policy does not bypass the protected-package rule."}
      - {id: C, answer: "Changing the TCCL makes it legal.", explanation: "Incorrect. TCCL does not alter class-definition constraints."}
      - {id: D, answer: "An ordinary custom loader cannot take over java.*; definition may be rejected with SecurityException.", explanation: "Correct. This is a runtime safety boundary independent of delegation preference."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
