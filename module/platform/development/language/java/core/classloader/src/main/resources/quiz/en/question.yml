  - id: classloader-q18
    question: "Which statement about defining loaders and initiating loaders is correct?"
    answers:
      - {id: A, answer: "Each class has one initiating loader and may have multiple defining loaders.", explanation: "Incorrect. For an ordinary named class, the defining loader is unique while multiple loaders may be recorded as initiating loaders."}
      - {id: B, answer: "The initiating loader is always the TCCL.", explanation: "Incorrect. TCCL is a thread-associated discovery context, not the definition of initiating loader."}
      - {id: C, answer: "A class may have multiple initiating loaders through delegation but one defining loader; the defining loader is the important part of runtime identity.", explanation: "Correct. This distinction matters when debugging delegation."}
      - {id: D, answer: "The two terms are complete synonyms.", explanation: "Incorrect. They describe different relationships."}
    correctAnswerId: C
