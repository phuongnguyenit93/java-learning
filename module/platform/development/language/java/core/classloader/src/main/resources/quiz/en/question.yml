  - id: classloader-q21
    question: "What problem primarily motivates the Thread Context ClassLoader (TCCL)?"
    answers:
      - {id: A, answer: "Parent-loaded framework/library code may need a discovery context that can see providers or resources in an application/child loader.", explanation: "Correct. This is the reverse-visibility problem that parent delegation alone does not solve."}
      - {id: B, answer: "It changes the defining loader of an already loaded class.", explanation: "Incorrect. TCCL does not mutate class ownership."}
      - {id: C, answer: "It lets the JVM skip verification for plugins.", explanation: "Incorrect. TCCL does not bypass verification."}
      - {id: D, answer: "It forces every thread to use the bootstrap loader.", explanation: "Incorrect. TCCL may be an application or plugin loader depending on context."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.ContextClassLoader/ContextClassLoader.md", anchor: "tccl-purpose"}
