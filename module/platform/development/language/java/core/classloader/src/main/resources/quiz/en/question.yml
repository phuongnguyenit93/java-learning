  - id: classloader-q20
    question: "Which design reduces type mismatch risk when a host and plugin communicate through interface Plugin?"
    answers:
      - {id: A, answer: "Bundle a private Plugin API copy in each plugin and prefer child-first for that API.", explanation: "Incorrect. This easily creates incompatible copies of the shared contract."}
