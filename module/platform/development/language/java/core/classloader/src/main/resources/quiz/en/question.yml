  - id: classloader-q13
    question: "If you only need a custom byte source while preserving the default parent-first protocol, which method should you usually override first?"
    answers:
      - {id: A, answer: "findClass", explanation: "Correct. The default loadClass protocol handles delegation/locking and calls findClass when the parent cannot find the class."}
      - {id: B, answer: "getParent", explanation: "Incorrect. getParent is not the byte-lookup extension point."}
      - {id: C, answer: "finalize", explanation: "Incorrect. It is unrelated to the class-loading contract."}
      - {id: D, answer: "Thread.run", explanation: "Incorrect. Thread/TCCL lifecycle is a separate concern."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CustomClassLoader/CustomClassLoader.md", anchor: "classloader-contract"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: classloader-q14
    question: "What conceptual transformation does defineClass(name, bytes, ...) perform?"
    answers:
      - {id: A, answer: "Class<?> into Java source.", explanation: "Incorrect. defineClass goes from bytes toward a runtime class definition."}
      - {id: B, answer: "A valid class-file representation into Class<?> owned by that defining loader's namespace.", explanation: "Correct. Definition is still subject to verification and runtime constraints."}
      - {id: C, answer: "A resource URL into a filesystem File.", explanation: "Incorrect. That is not defineClass's responsibility."}
      - {id: D, answer: "An object instance into new class metadata.", explanation: "Incorrect. An instance is not the input to defineClass."}
    correctAnswerId: B
    aiGenerated: true
