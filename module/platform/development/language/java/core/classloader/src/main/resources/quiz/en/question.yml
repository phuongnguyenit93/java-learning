  - id: classloader-q23
    question: "Why can a TCCL on a long-lived thread cause a ClassLoader leak after redeploy?"
    answers:
      - {id: A, answer: "Because TCCL makes every class static.", explanation: "Incorrect. The leak is about reference reachability, not converting classes to static state."}
      - {id: B, answer: "Because the long-lived thread holds a strong reference to its context ClassLoader, which can keep the old plugin generation reachable.", explanation: "Correct. Newly created child threads also commonly inherit their initial TCCL from the creating thread."}
      - {id: C, answer: "Because the JVM disables GC whenever any Thread object exists.", explanation: "Incorrect. The issue is the specific reference path into the plugin loader graph."}
      - {id: D, answer: "Because TCCL is always the bootstrap loader, and bootstrap never unloads.", explanation: "Incorrect. The leak case here is a TCCL pointing to a disposable plugin/application loader."}
    correctAnswerId: B
