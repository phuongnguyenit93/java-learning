  - id: classloader-q19
    question: "Why can a plugin system produce a ClassCastException that looks like 'X cannot be cast to X'?"
    answers:
      - {id: A, answer: "The two X types have the same binary name but different defining loaders, so they are different runtime types.", explanation: "Correct. The source-level name looks the same while runtime identity differs."}
      - {id: B, answer: "The JVM never allows casts between classes in packages with the same name.", explanation: "Incorrect. The issue is runtime type identity, not package text alone."}
      - {id: C, answer: "A cast always triggers static initialization twice.", explanation: "Incorrect. That is not the cause of a loader-boundary ClassCastException."}
      - {id: D, answer: "TCCL automatically changes the type of an existing object.", explanation: "Incorrect. TCCL does not alter the defining loader or identity of an existing class/object."}
    correctAnswerId: A
    aiGenerated: true
