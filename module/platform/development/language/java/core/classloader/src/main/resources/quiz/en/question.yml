  - id: classloader-q26
    question: "SPI metadata may appear under the same META-INF/services/... name in multiple JARs. Which API is more appropriate?"
    answers:
      - {id: A, answer: "getResource because there is always exactly one provider.", explanation: "Incorrect. SPI/config fragments often require aggregating multiple resources with the same name."}
      - {id: B, answer: "Class.forName because provider metadata is a class.", explanation: "Incorrect. The descriptor is a resource, not a class definition."}
      - {id: C, answer: "getResources to enumerate matching resources under the loader's policy.", explanation: "Correct. This avoids assuming that only one matching resource exists."}
      - {id: D, answer: "System.getenv because classpath metadata is copied to the environment.", explanation: "Incorrect. Environment variables do not replace resource enumeration."}
