      - {id: B, answer: "It swallows the exception and returns null.", explanation: "Incorrect. Target failure is not silently ignored."}
      - {id: C, answer: "InvocationTargetException with the IllegalStateException as its cause.", explanation: "Correct. The wrapper marks the Reflection boundary."}
      - {id: D, answer: "A compile-time error.", explanation: "Incorrect. This is runtime invocation."}
