    answers:
      - {id: A, answer: "getDeclaredMethod only sees inherited public methods.", explanation: "Incorrect. It focuses on direct declarations."}
      - {id: B, answer: "getMethod sees private methods from every superclass.", explanation: "Incorrect. It searches the public surface."}
      - {id: C, answer: "The two APIs always expose the same methods.", explanation: "Incorrect. Their contracts differ."}
      - {id: D, answer: "getDeclaredMethod searches direct declarations of any visibility; getMethod searches the public surface and may include inherited methods.", explanation: "Correct. This is the core distinction."}
