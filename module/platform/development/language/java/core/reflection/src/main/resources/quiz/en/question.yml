      - {id: B, answer: "A compatible receiver and arguments that satisfy the parameter contract.", explanation: "Correct. These are runtime invocation requirements."}
      - {id: C, answer: "The receiver must always be null.", explanation: "Incorrect. Null is appropriate for static members, not an instance method."}
