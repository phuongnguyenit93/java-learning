      - {id: B, answer: "A varargs method has no array parameter at runtime.", explanation: "Incorrect. Varargs is represented by an array."}
      - {id: C, answer: "Reflection cannot invoke varargs methods.", explanation: "Incorrect. They can be invoked with correctly shaped arguments."}
      - {id: D, answer: "Varargs is still an array parameter, so the caller must understand packing rather than rely on compiler overload rules.", explanation: "Correct. This is the important boundary."}
