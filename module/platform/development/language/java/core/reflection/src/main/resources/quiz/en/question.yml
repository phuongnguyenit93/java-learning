      - {id: B, answer: "final never appears in Field metadata.", explanation: "Incorrect. Modifier/access metadata represents it."}
      - {id: C, answer: "A framework can inspect final metadata, but should not design around forcibly mutating final state.", explanation: "Correct. final remains an important design contract."}
      - {id: D, answer: "Reflection automatically removes the final flag before set.", explanation: "Incorrect. There is no such rule."}
