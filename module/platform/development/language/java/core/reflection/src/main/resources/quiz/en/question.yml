      - {id: B, answer: "getInt reads 1, setInt writes 5, and getInt then reads 5.", explanation: "Correct. This is direct read/write evidence."}
      - {id: C, answer: "getName renames the field to 5.", explanation: "Incorrect. getName only reads metadata."}
