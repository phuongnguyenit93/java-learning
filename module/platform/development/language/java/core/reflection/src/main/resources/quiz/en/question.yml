  - id: reflection-q09
    question: "PaymentService directly declares a private processedCount field. Which lookup is appropriate?"
    answers:
      - {id: A, answer: "getDeclaredField('processedCount')", explanation: "Correct. Declared lookup can see the class's private field."}
      - {id: B, answer: "getField('processedCount') always finds it.", explanation: "Incorrect. getField follows the public-field contract."}
      - {id: C, answer: "getMethod('processedCount')", explanation: "Incorrect. The target is a field, not a method."}
      - {id: D, answer: "getFields()[0] because field order is stable.", explanation: "Incorrect. Enumeration order is not a semantic contract."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Fields/Fields.md", anchor: "field-discovery"}
