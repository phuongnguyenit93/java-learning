      - {id: B, answer: "Class.isRecord()", explanation: "Correct. It is the direct type-classification API."}
      - {id: C, answer: "Record.isClass()", explanation: "Incorrect. No such API exists."}
      - {id: D, answer: "Class.getRecord()", explanation: "Incorrect. No such API exists."}
