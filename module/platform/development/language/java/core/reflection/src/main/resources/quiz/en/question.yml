      - {id: B, answer: "Every interface currently loaded by the JVM.", explanation: "Incorrect. It concerns the inspected type."}
      - {id: C, answer: "The interfaces directly implemented by the class.", explanation: "Correct. For an interface, it returns direct superinterfaces."}
      - {id: D, answer: "Only interfaces that contain public methods.", explanation: "Incorrect. It does not filter by method presence."}
