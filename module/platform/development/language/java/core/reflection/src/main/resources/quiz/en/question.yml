# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: reflection-q01
    question: "What core problem does Reflection solve?"
    answers:
      - {id: A, answer: "It lets code inspect metadata and select types or members at runtime when the structure is not hard-coded in advance.", explanation: "Correct. That runtime-discovery requirement is the core reason Reflection exists."}
      - {id: B, answer: "It turns Java into a dynamically typed language and removes compile-time checking.", explanation: "Incorrect. Java remains statically typed; Reflection moves selected decisions to runtime."}
      - {id: C, answer: "It automatically scans every loaded class without any discovery policy.", explanation: "Incorrect. The caller or framework still defines what and how to discover."}
      - {id: D, answer: "It completely replaces interfaces, factories, and registries.", explanation: "Incorrect. Static abstractions are often clearer when concrete structure is already known."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Basic/Basic.md", anchor: "reflection-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: reflection-q02
    question: "When only a binary class name comes from configuration, which entry point is most appropriate?"
    answers:
      - {id: A, answer: "object.getClass()", explanation: "Incorrect. That requires an object to exist first."}
      - {id: B, answer: "Class.forName(name)", explanation: "Correct. It resolves a Class object from a runtime binary name."}
      - {id: C, answer: "new Class(name)", explanation: "Incorrect. Class objects are not created this way."}
      - {id: D, answer: "Method.forName(name)", explanation: "Incorrect. Method has no such entry point."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Basic/Basic.md", anchor: "class-object-entrypoints"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: reflection-q03
    question: "What is the best meaning of Class<?>?"
    answers:
      - {id: A, answer: "The Class can only represent Object.", explanation: "Incorrect. It can represent any runtime type."}
      - {id: B, answer: "The Class has lost all runtime metadata.", explanation: "Incorrect. Runtime metadata remains available."}
      - {id: C, answer: "It is a valid Class object whose concrete represented type is unknown at this compile-time point.", explanation: "Correct. The wildcard expresses an unknown represented type."}
      - {id: D, answer: "The wildcard makes Reflection bypass all type safety.", explanation: "Incorrect. Runtime checks and generic constraints still exist."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Basic/Basic.md", anchor: "class-object-entrypoints"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: reflection-q04
    question: "Which case is the strongest justification for using Reflection?"
    answers:
      - {id: A, answer: "Calling one fixed method already known to the compiler.", explanation: "Incorrect. A direct call is simpler."}
      - {id: B, answer: "Reading a local constant in the same method.", explanation: "Incorrect. There is no runtime-discovery problem."}
      - {id: C, answer: "Replacing every direct call with Method.invoke for consistency.", explanation: "Incorrect. That adds unnecessary complexity."}
      - {id: D, answer: "A general-purpose framework must inspect or create user-defined types known only from runtime metadata.", explanation: "Correct. This is a classic Reflection use case."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Basic/Basic.md", anchor: "reflection-use-cases"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: reflection-q05
    question: "What major cost appears when moving from direct calls to Reflection?"
    answers:
      - {id: A, answer: "Many name, type, and access mistakes move from compile time to runtime, and dependencies may hide in strings or metadata.", explanation: "Correct. Flexibility trades away some safety and refactoring visibility."}
      - {id: B, answer: "The JVM stops garbage collection.", explanation: "Incorrect. Reflection does not disable GC."}
      - {id: C, answer: "Every reflective call automatically bypasses access control.", explanation: "Incorrect. Access control still exists."}
      - {id: D, answer: "Class objects can no longer be used for runtime type checks.", explanation: "Incorrect. Class provides several runtime type-checking APIs."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Basic/Basic.md", anchor: "reflection-cost-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

