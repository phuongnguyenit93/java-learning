  - id: reflection-q13
    question: "What does Method.getDeclaringClass() report?"
    answers:
      - {id: A, answer: "The class or interface that actually declares that method descriptor.", explanation: "Correct. Lookup type and declaring type can differ."}
      - {id: B, answer: "The receiver's runtime class from the most recent invocation.", explanation: "Incorrect. The descriptor does not change per receiver."}
      - {id: C, answer: "The class containing the Reflection caller.", explanation: "Incorrect. Caller location is unrelated."}
      - {id: D, answer: "The highest superclass of the object.", explanation: "Incorrect. It identifies the declaration owner."}
