  - id: delegation-boundary
    question: "What does delegation mean in object design?"
    answers:
      - {id: A, answer: "Copy every method implementation into the caller.", explanation: "Incorrect. Delegation supports composition and separation of responsibility without requiring subtype inheritance."}
      - {id: B, answer: "Use reflection for every call.", explanation: "Incorrect. Delegation supports composition and separation of responsibility without requiring subtype inheritance."}
      - {id: C, answer: "An object forwards a responsibility to another collaborator that owns the relevant behavior.", explanation: "Correct. Delegation supports composition and separation of responsibility without requiring subtype inheritance."}
      - {id: D, answer: "Make all collaborators global static variables.", explanation: "Incorrect. Delegation supports composition and separation of responsibility without requiring subtype inheritance."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.Composition/Composition.md", anchor: "delegation"}
