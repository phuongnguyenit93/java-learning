  - id: internal-virtual-dispatch
    question: "`Parent.execute()` calls `this.step()`, while the runtime object is `Child` and `Child` overrides `step()`. Which method runs?"
    answers:
      - {id: A, answer: "Always Parent.step() because the call appears in Parent source code.", explanation: "Incorrect. Caller source location does not disable virtual dispatch; the runtime receiver remains Child."}
      - {id: B, answer: "Child.step() if `step()` is an overridable instance method.", explanation: "Correct. An internal virtual call through `this` still dispatches from the runtime receiver."}
      - {id: C, answer: "Parent.step() and Child.step() automatically run one after the other.", explanation: "Incorrect. Only the dispatched implementation runs unless the override explicitly calls `super.step()`."}
      - {id: D, answer: "It is a compile error because a parent method cannot call another method.", explanation: "Incorrect. Parent instance methods can call other instance methods normally."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Polymorphism/Polymorphism.md", anchor: "dynamic-dispatch"}
