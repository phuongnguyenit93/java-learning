  - id: runtime-dispatch
    question: "For an overridden instance method on `Parent p = new Child()`, which implementation runs?"
    answers:
      - {id: A, answer: "Always the Parent body because the variable is Parent.", explanation: "Incorrect. The signature is known at compile time, but the override body is selected at runtime."}
      - {id: B, answer: "Both bodies run automatically.", explanation: "Incorrect. The signature is known at compile time, but the override body is selected at runtime."}
      - {id: C, answer: "The method call is always ambiguous.", explanation: "Incorrect. The signature is known at compile time, but the override body is selected at runtime."}
      - {id: D, answer: "The Child override, because instance-method override dispatch uses the runtime receiver class.", explanation: "Correct. The signature is known at compile time, but the override body is selected at runtime."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Polymorphism/Polymorphism.md", anchor: "dynamic-dispatch"}
    apiRelated: {controller: "PolymorphismController", methodSignature: "dispatch()"}

  - id: substitutability-behavior
    question: "What does good subtype substitutability require beyond compiling?"
    answers:
      - {id: A, answer: "The subtype should preserve meaningful behavioral expectations, invariants, accepted states, and postconditions of the supertype contract.", explanation: "Correct. Static type compatibility alone cannot guarantee that callers remain behaviorally correct."}
      - {id: B, answer: "Only the class name must be similar.", explanation: "Incorrect. Static type compatibility alone cannot guarantee that callers remain behaviorally correct."}
      - {id: C, answer: "The subtype must add more public fields.", explanation: "Incorrect. Static type compatibility alone cannot guarantee that callers remain behaviorally correct."}
      - {id: D, answer: "The subtype must always throw more exceptions.", explanation: "Incorrect. Static type compatibility alone cannot guarantee that callers remain behaviorally correct."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Polymorphism/Polymorphism.md", anchor: "substitutability"}
