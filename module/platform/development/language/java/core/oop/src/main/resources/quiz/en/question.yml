  - id: encapsulation-representation-leak
    question: "`Order` has `private final List<Item> items`, but `getItems()` returns `items` directly. What is the best assessment?"
    answers:
      - {id: A, answer: "Encapsulation is complete because the field is private final.", explanation: "Incorrect. `private final` restricts field access/reassignment, but a returned mutable object can still be changed by callers."}
      - {id: B, answer: "The caller can receive an alias to mutable representation and break invariants even though the field is private.", explanation: "Correct. This is representation exposure: a mutable reference escapes the object boundary."}
      - {id: C, answer: "Java automatically copies a List on return.", explanation: "Incorrect. Java returns the reference value; there is no automatic defensive copy."}
      - {id: D, answer: "final makes the whole object graph immutable.", explanation: "Incorrect. A final reference does not make the referenced object immutable."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Encapsulation/Encapsulation.md", anchor: "encapsulation-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: tell-dont-ask-rule-location
    question: "When does `account.withdraw(amount)` fit Tell, Don't Ask better than having the caller read balance and set it back?"
    answers:
      - {id: A, answer: "When validating and changing balance belongs to Account's responsibility.", explanation: "Correct. The caller expresses intent while the state owner protects its own rule and transition."}
      - {id: B, answer: "When every getter must be banned across the system.", explanation: "Incorrect. Tell, Don't Ask is a heuristic, not a ban on all getters or read models."}
      - {id: C, answer: "Only when the method is static.", explanation: "Incorrect. Static is unrelated to this heuristic."}
      - {id: D, answer: "When validation should be duplicated in many callers.", explanation: "Incorrect. Duplicated caller-side rules are exactly the kind of leakage the heuristic tries to reduce."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Encapsulation/Encapsulation.md", anchor: "tell-dont-ask-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: inheritance-constructor-chain
    question: "When `new Child()` runs with `Child extends Parent`, which constructor model is correct?"
    answers:
      - {id: A, answer: "The Child constructor finishes before the Parent constructor starts.", explanation: "Incorrect. Superclass construction occurs before subclass construction can complete."}
      - {id: B, answer: "Parent and Child create two independent objects.", explanation: "Incorrect. `new Child()` creates one object containing state from the hierarchy, not separate parent/child objects."}
      - {id: C, answer: "The Parent constructor executes before the Child constructor completes so superclass state/invariants are established first.", explanation: "Correct. Constructor chaining initializes the superclass part before completing the subclass part."}
      - {id: D, answer: "Constructors are inherited like instance methods.", explanation: "Incorrect. Constructors are not inherited; the subclass constructor invokes `super(...)`."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Inheritance/Inheritance.md", anchor: "inherited-state-behavior"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: fragile-base-constructor-dispatch
    question: "Why is a base constructor calling an overridable instance method risky?"
    answers:
      - {id: A, answer: "Because Java always converts that method to static.", explanation: "Incorrect. An overridable instance method still participates in dynamic dispatch."}
      - {id: B, answer: "The subclass override can run before subclass state/initializers are complete.", explanation: "Correct. The runtime receiver is already the subclass object while subclass initialization may still be incomplete."}
      - {id: C, answer: "Because constructors cannot call any methods.", explanation: "Incorrect. Constructors may call methods; the danger is specifically calling overridable behavior."}
      - {id: D, answer: "Because the JVM always ignores the subclass override.", explanation: "Incorrect. Early dispatch to the override is the risk."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Inheritance/Inheritance.md", anchor: "inheritance-coupling"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: interface-subtype-polymorphism
    question: "Can `CardPayment implements PaymentMethod` provide subtype polymorphism without `extends PaymentMethod`?"
    answers:
      - {id: A, answer: "Yes. Implementing an interface creates a subtype relationship and instance-method implementations still dispatch from the runtime receiver.", explanation: "Correct. Subtype polymorphism is broader than class inheritance; interface implementation also creates a subtype."}
      - {id: B, answer: "No. Polymorphism exists only between concrete classes using extends.", explanation: "Incorrect. Interfaces are a major Java mechanism for subtype polymorphism."}
      - {id: C, answer: "Yes, but only for static methods.", explanation: "Incorrect. Static methods are not the subtype dynamic-dispatch mechanism discussed here."}
      - {id: D, answer: "No, because an interface is not a type.", explanation: "Incorrect. An interface is a reference type and may be the static type of variables and parameters."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
