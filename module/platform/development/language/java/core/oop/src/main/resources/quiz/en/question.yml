  - id: encapsulation-invariant
    question: "Why is `account.withdraw(amount)` often stronger encapsulation than exposing `setBalance`?"
    answers:
      - {id: A, answer: "Methods automatically make all fields immutable.", explanation: "Incorrect. Encapsulation controls valid mutation, not only field visibility."}
      - {id: B, answer: "The behavior can validate the complete state transition and preserve domain invariants.", explanation: "Correct. Encapsulation controls valid mutation, not only field visibility."}
      - {id: C, answer: "Setters cannot be public in Java.", explanation: "Incorrect. Encapsulation controls valid mutation, not only field visibility."}
      - {id: D, answer: "withdraw removes the need for any constructor.", explanation: "Incorrect. Encapsulation controls valid mutation, not only field visibility."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Encapsulation/Encapsulation.md", anchor: "invariant-protection"}
    apiRelated: {controller: "EncapsulationController", methodSignature: "invariantProtection()"}

  - id: inheritance-subtype
    question: "When is class inheritance most justified?"
    answers:
      - {id: A, answer: "Whenever two classes have one field with the same name.", explanation: "Incorrect. Inheritance creates a subtype and strong base-class coupling, so behavior matters more than shared fields."}
      - {id: B, answer: "Whenever composition would require a constructor.", explanation: "Incorrect. Inheritance creates a subtype and strong base-class coupling, so behavior matters more than shared fields."}
      - {id: C, answer: "When the child is a true behavioral subtype that can honor the superclass contract, not merely reuse code.", explanation: "Correct. Inheritance creates a subtype and strong base-class coupling, so behavior matters more than shared fields."}
      - {id: D, answer: "Whenever the child needs unrelated utility methods.", explanation: "Incorrect. Inheritance creates a subtype and strong base-class coupling, so behavior matters more than shared fields."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Inheritance/Inheritance.md", anchor: "is-a-subtyping"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: runtime-dispatch
    question: "For an overridden instance method on `Parent p = new Child()`, which implementation runs?"
    answers:
      - {id: A, answer: "Always the Parent body because the variable is Parent.", explanation: "Incorrect. The signature is known at compile time, but the override body is selected at runtime."}
      - {id: B, answer: "Both bodies run automatically.", explanation: "Incorrect. The signature is known at compile time, but the override body is selected at runtime."}
      - {id: C, answer: "The method call is always ambiguous.", explanation: "Incorrect. The signature is known at compile time, but the override body is selected at runtime."}
      - {id: D, answer: "The Child override, because instance-method override dispatch uses the runtime receiver class.", explanation: "Correct. The signature is known at compile time, but the override body is selected at runtime."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Polymorphism/Polymorphism.md", anchor: "dynamic-dispatch"}
    apiRelated: {controller: "PolymorphismController", methodSignature: "dispatch()"}

  - id: substitutability-behavior
    question: "What does good subtype substitutability require beyond compiling?"
    answers:
      - {id: A, answer: "The subtype should preserve meaningful behavioral expectations, invariants, accepted states, and postconditions of the supertype contract.", explanation: "Correct. Static type compatibility alone cannot guarantee that callers remain behaviorally correct."}
      - {id: B, answer: "Only the class name must be similar.", explanation: "Incorrect. Static type compatibility alone cannot guarantee that callers remain behaviorally correct."}
      - {id: C, answer: "The subtype must add more public fields.", explanation: "Incorrect. Static type compatibility alone cannot guarantee that callers remain behaviorally correct."}
      - {id: D, answer: "The subtype must always throw more exceptions.", explanation: "Incorrect. Static type compatibility alone cannot guarantee that callers remain behaviorally correct."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Polymorphism/Polymorphism.md", anchor: "substitutability"}
    apiRelated: {controller: "SubstitutabilityController", methodSignature: "substituteImplementations()"}

  - id: overloading-compile-time
    question: "When is an overload selected?"
    answers:
      - {id: A, answer: "Only after the method body starts.", explanation: "Incorrect. Runtime object type does not make Java redo overload resolution after compilation."}
      - {id: B, answer: "At compile time from the declared argument types and applicable conversions.", explanation: "Correct. Runtime object type does not make Java redo overload resolution after compilation."}
      - {id: C, answer: "By the garbage collector.", explanation: "Incorrect. Runtime object type does not make Java redo overload resolution after compilation."}
      - {id: D, answer: "Always from the runtime class of every argument.", explanation: "Incorrect. Runtime object type does not make Java redo overload resolution after compilation."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.OverloadingOverriding/OverloadingOverriding.md", anchor: "overloading-compile-time"}
    apiRelated: {controller: "DispatchController", methodSignature: "overloadVsOverride()"}

  - id: static-method-hiding
    question: "With `Parent p = new Child()`, how is a hidden static method selected when called through `p`?"
    answers:
      - {id: A, answer: "The Child version always runs through virtual dispatch.", explanation: "Incorrect. Static member selection is tied to the qualifying type, not runtime receiver dispatch."}
      - {id: B, answer: "Both static methods run.", explanation: "Incorrect. Static member selection is tied to the qualifying type, not runtime receiver dispatch."}
      - {id: C, answer: "From the compile-time Parent type; static methods are hidden, not dynamically overridden.", explanation: "Correct. Static member selection is tied to the qualifying type, not runtime receiver dispatch."}
      - {id: D, answer: "Static methods cannot have the same signature in parent and child.", explanation: "Incorrect. Static member selection is tied to the qualifying type, not runtime receiver dispatch."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.OverloadingOverriding/OverloadingOverriding.md", anchor: "static-method-hiding"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: field-hiding
    question: "How is `p.field` selected for `Parent p = new Child()` when both classes declare `field`?"
    answers:
      - {id: A, answer: "The Child field always wins at runtime.", explanation: "Incorrect. Field hiding uses compile-time member selection, unlike overridden instance methods."}
      - {id: B, answer: "Both field values are merged.", explanation: "Incorrect. Field hiding uses compile-time member selection, unlike overridden instance methods."}
      - {id: C, answer: "The JVM throws ClassCastException.", explanation: "Incorrect. Field hiding uses compile-time member selection, unlike overridden instance methods."}
      - {id: D, answer: "The Parent field is selected from the compile-time type of `p`; fields are not virtual.", explanation: "Correct. Field hiding uses compile-time member selection, unlike overridden instance methods."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.OverloadingOverriding/OverloadingOverriding.md", anchor: "field-hiding"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: composition-vs-inheritance
    question: "Why is composition often preferred for behavior reuse?"
    answers:
      - {id: A, answer: "It keeps collaborators replaceable and avoids coupling a type to a base-class hierarchy when no true subtype relationship exists.", explanation: "Correct. Inheritance is valuable for real subtype polymorphism; composition is more flexible for delegated behavior."}
      - {id: B, answer: "Composition makes every call static.", explanation: "Incorrect. Inheritance is valuable for real subtype polymorphism; composition is more flexible for delegated behavior."}
      - {id: C, answer: "Inheritance is illegal in Java.", explanation: "Incorrect. Inheritance is valuable for real subtype polymorphism; composition is more flexible for delegated behavior."}
      - {id: D, answer: "Composition always removes all object references.", explanation: "Incorrect. Inheritance is valuable for real subtype polymorphism; composition is more flexible for delegated behavior."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.Composition/Composition.md", anchor: "composition-vs-inheritance"}
    apiRelated: {controller: "CompositionController", methodSignature: "strategySwap()"}

  - id: object-relationship-model
    question: "How should dependency, association, aggregation, and composition be understood in Java?"
    answers:
      - {id: A, answer: "Each relationship has its own JVM bytecode instruction.", explanation: "Incorrect. Java does not have separate keywords or GC semantics that directly enforce these UML-style distinctions."}
      - {id: B, answer: "As modeling relationships expressed with ordinary references and ownership/lifecycle conventions, not four special runtime constructs.", explanation: "Correct. Java does not have separate keywords or GC semantics that directly enforce these UML-style distinctions."}
      - {id: C, answer: "Aggregation automatically prevents garbage collection.", explanation: "Incorrect. Java does not have separate keywords or GC semantics that directly enforce these UML-style distinctions."}
      - {id: D, answer: "Composition can only be expressed with inheritance.", explanation: "Incorrect. Java does not have separate keywords or GC semantics that directly enforce these UML-style distinctions."}
