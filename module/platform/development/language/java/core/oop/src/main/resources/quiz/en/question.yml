  - id: ownership-lifecycle-model
    question: "What is the most important modeling distinction between aggregation and composition?"
    answers:
      - {id: A, answer: "Composition expresses stronger ownership/lifecycle coupling; aggregation commonly allows the part to exist independently or be shared.", explanation: "Correct. These are modeling semantics, not separate JVM runtime constructs."}
      - {id: B, answer: "Aggregation uses fields while composition uses local variables.", explanation: "Incorrect. Both may use ordinary references; syntax alone does not determine semantics."}
      - {id: C, answer: "Composition makes the GC delete the part immediately when the whole goes out of scope.", explanation: "Incorrect. GC follows reachability and does not understand UML ownership labels."}
      - {id: D, answer: "Aggregation uses only primitives while composition uses objects.", explanation: "Incorrect. That is not the distinction."}
    correctAnswerId: A
    aiGenerated: true
