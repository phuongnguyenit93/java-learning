  - id: abstraction-contract
    question: "What makes something a useful abstraction?"
    answers:
      - {id: A, answer: "It must always be an abstract class.", explanation: "Incorrect. An interface keyword alone does not guarantee a good abstraction; the contract and boundaries do."}
      - {id: B, answer: "It must hide every performance or lifecycle constraint.", explanation: "Incorrect. An interface keyword alone does not guarantee a good abstraction; the contract and boundaries do."}
