  - id: responsibility-boundary-localize-change
    question: "Which sign suggests a responsibility boundary is placed well?"
    answers:
      - {id: A, answer: "A local rule change usually requires changing the component that owns that responsibility rather than many callers.", explanation: "Correct. A good boundary localizes change and improves cohesion instead of scattering knowledge."}
      - {id: B, answer: "Every class has exactly one field.", explanation: "Incorrect. Field count does not define a boundary; ownership of state/rules and caller coupling matter."}
      - {id: C, answer: "Every behavior is converted to a static method.", explanation: "Incorrect. Static methods do not automatically create responsibility boundaries or localize change."}
      - {id: D, answer: "Callers read as many internal fields as possible.", explanation: "Incorrect. Callers that know too much internal representation usually indicate a weak boundary."}
    correctAnswerId: A
    aiGenerated: true
