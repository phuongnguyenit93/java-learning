  - id: override-compatibility-rules
    question: "Which override is legal if the parent declares `public Number value() throws IOException`?"
    answers:
      - {id: A, answer: "`protected Number value() throws IOException`", explanation: "Incorrect. An override cannot reduce accessibility from public to protected."}
      - {id: B, answer: "`public Integer value() throws FileNotFoundException`", explanation: "Correct. A reference return type may be covariant and a checked exception may be narrowed."}
      - {id: C, answer: "`public Object value() throws Exception`", explanation: "Incorrect. The return type is broader and the checked exception also broadens the parent contract."}
      - {id: D, answer: "`private Integer value()`", explanation: "Incorrect. Private reduces accessibility and cannot override the public contract."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.OverloadingOverriding/OverloadingOverriding.md", anchor: "override-rules"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: covariant-return-type
    question: "What does a covariant return allow in overriding?"
    answers:
      - {id: A, answer: "The child override may return a more specific reference type as long as it is a subtype of the parent's return type.", explanation: "Correct. For example, a parent returning `Animal` may be overridden with `Dog`."}
      - {id: B, answer: "The child may freely change `int` to `long` because long is wider.", explanation: "Incorrect. Primitive return types do not use covariant return in this sense."}
      - {id: C, answer: "The child must always return the same concrete runtime object.", explanation: "Incorrect. The rule concerns method type compatibility, not object identity."}
      - {id: D, answer: "Return type is irrelevant to override compatibility.", explanation: "Incorrect. Return types must be compatible, with covariance allowed for references."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.OverloadingOverriding/OverloadingOverriding.md", anchor: "covariant-return"}
