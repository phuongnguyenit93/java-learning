  - id: encapsulation-invariant
    question: "Why is `account.withdraw(amount)` often stronger encapsulation than exposing `setBalance`?"
    answers:
      - {id: A, answer: "Methods automatically make all fields immutable.", explanation: "Incorrect. Encapsulation controls valid mutation, not only field visibility."}
      - {id: B, answer: "The behavior can validate the complete state transition and preserve domain invariants.", explanation: "Correct. Encapsulation controls valid mutation, not only field visibility."}
      - {id: C, answer: "Setters cannot be public in Java.", explanation: "Incorrect. Encapsulation controls valid mutation, not only field visibility."}
      - {id: D, answer: "withdraw removes the need for any constructor.", explanation: "Incorrect. Encapsulation controls valid mutation, not only field visibility."}
    correctAnswerId: B
