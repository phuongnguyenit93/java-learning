CompositionController:
  strategySwap():
    execution: '<p><strong>Concept:</strong> Composition vs inheritance trade-offs.</p><ol><li>The
      endpoint runs a bounded deterministic example inside <code>CompositionController#strategySwap()</code>.</li><li>Swap
      composed behavior without changing consumer.<pre><code>@GetMapping(&quot;/strategy-swap&quot;)
      public Map&lt;String,Object&gt; strategySwap(){ return Map.of(&quot;regular&quot;,new
      Checkout(new Regular()).total(1000),&quot;discount&quot;,new Checkout(new Discount()).total(1000),&quot;consumerType&quot;,&quot;Checkout
      unchanged&quot;); }</code></pre></li><li>Inspect the response fields together:
      they are the observable evidence for the rule rather than a benchmark or production
      policy.</li></ol><p><strong>Conclusion:</strong> connect the observed result
      back to the linked README section before generalizing the behavior.</p>'
    usage: true
DispatchController:
  overloadVsOverride():
    execution: '<p><strong>Concept:</strong> Overloading is compile-time selection.</p><ol><li>The
      endpoint runs a bounded deterministic example inside <code>DispatchController#overloadVsOverride()</code>.</li><li>Contrast
      overload compile-time choice with override runtime dispatch.<pre><code>@GetMapping(&quot;/overload-vs-override&quot;)
      public Map&lt;String,Object&gt; overloadVsOverride(){ Parent x=new Child();
      return Map.of(&quot;overload&quot;,select(x),&quot;override&quot;,x.call(),&quot;runtime&quot;,x.getClass().getSimpleName());
      }</code></pre></li><li>Inspect the response fields together: they are the observable
