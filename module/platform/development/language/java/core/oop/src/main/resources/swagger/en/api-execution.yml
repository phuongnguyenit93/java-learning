      the behavior.</p>'
    usage: true
  dispatchVsHiding():
    execution: '<p><strong>Concept:</strong> Instance-method dispatch vs static-method
      and field hiding.</p><ol><li>The endpoint runs a bounded deterministic example
      inside <code>DispatchController#dispatchVsHiding()</code>.</li><li>With `Parent
      x = new Child()`, compare an overridden instance method with a hidden static
      method and hidden field to make runtime dispatch vs compile-time selection observable.<pre><code>@GetMapping(&quot;/dispatch-vs-hiding&quot;)
