    execution: <p><strong>Khái niệm:</strong> Abstract class như partial implementation
      + state.</p><ol><li>Endpoint chạy một ví dụ deterministic và bounded trong <code>AbstractClassController#templateBehavior()</code>.</li><li>Source
      line dưới đây là code evidence trực tiếp tạo behavior được quan sát:<pre><code>@GetMapping(&quot;/template&quot;)
      public Map&lt;String,Object&gt; templateBehavior(){ Processor p=new UpperProcessor();
