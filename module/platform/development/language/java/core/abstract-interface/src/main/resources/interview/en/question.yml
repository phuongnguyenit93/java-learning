questions:
  - question: "What problem does an abstract class solve that a pure interface may not solve as naturally?"
    answer: "It can combine a common subtype contract with shared instance state, constructors, concrete algorithms, and abstract extension points in one hierarchy. That is useful when the shared implementation itself is part of the model."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.AbstractClass/AbstractClass.md", anchor: "abstract-class-model"}
    apiRelated: {controller: "AbstractClassController", methodSignature: "templateBehavior()"}

  - question: "What does it mean to program to an interface in Java?"
    answer: "Consumers depend on the stable behavioral role rather than one concrete implementation class. That allows multiple implementations or proxies and reduces construction/internal knowledge, while still requiring a meaningful contract rather than an interface created mechanically."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Interface/Interface.md", anchor: "interface-contract"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Why can a class implement many interfaces but extend only one class, and what design consequence follows?"
    answer: "Java has single class inheritance to avoid multiple inherited instance-state/base-implementation ambiguity, while interfaces compose roles and default behavior without multiple superclass state. Interfaces therefore fit capabilities across unrelated hierarchies."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.AbstractVsInterface/AbstractVsInterface.md", anchor: "abstract-vs-interface-inheritance"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "What compatibility problem do default methods address, and what do they not guarantee?"
    answer: "They let an interface add an implementation so many existing implementers keep working without adding a body. They do not make every interface change safe: abstract additions, changed contracts, or new default conflicts can still break clients."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.DefaultStaticPrivate/DefaultStaticPrivate.md", anchor: "default-method-evolution"}
    apiRelated: {controller: "InterfaceEvolutionController", methodSignature: "defaultCompatibility()"}

  - question: "Explain how Java resolves multiple inherited default methods."
    answer: "A more specific inherited default can win, and a concrete class-hierarchy method wins over interface defaults. If unrelated interfaces still provide competing defaults, the implementing class must override and can explicitly call `InterfaceName.super.method()` where allowed."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.MultipleInheritance/MultipleInheritance.md", anchor: "default-method-conflict"}
    apiRelated: {controller: "DefaultMethodController", methodSignature: "resolveConflict()"}

  - question: "Why are interface fields a poor place for mutable global application state?"
    answer: "They are public static final references, so the reference is globally exposed and fixed but a mutable object behind it can still change. That creates global shared mutable state and weak ownership rather than instance encapsulation."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Interface/Interface.md", anchor: "interface-fields"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Give useful reasons for redeclaring an inherited interface method."
    answer: "A subinterface may narrow a covariant return, add more specific documentation/annotations, or require implementations to supply a body by redeclaring an inherited default as abstract. The redeclaration should refine, not arbitrarily contradict, the parent contract."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.InterfaceInheritance/InterfaceInheritance.md", anchor: "interface-redeclaration"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Can interfaces and abstract classes be used together, and when is that useful?"
    answer: "Yes. An interface can define the public role while an abstract class supplies optional shared implementation and state for a family of implementations. Other implementations can still implement the interface without inheriting that base class."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.AbstractVsInterface/AbstractVsInterface.md", anchor: "selection-guidance"}
    apiRelated: {controller: "", methodSignature: ""}
