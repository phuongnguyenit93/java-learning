AbstractClassController:
  templateBehavior():
    summary: Shared state + template behavior + abstract hook
    description: Processor owns prefix state and the concrete process(...) template,
      while UpperProcessor completes the abstract transform(...) hook. The response
      shows a Processor reference dispatching to runtime subtype UpperProcessor and
      producing result:JAVA.
