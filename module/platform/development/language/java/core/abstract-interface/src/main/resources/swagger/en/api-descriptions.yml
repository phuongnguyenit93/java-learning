  resolveConflict():
    summary: Resolving two unrelated default methods
    description: Left and Right both provide value(). Both must override the method
      and explicitly invoke Left.super.value() and Right.super.value(). The left+right
      result shows that Java does not arbitrarily choose between unrelated defaults.
    enableVideoYoutube: false
    videoYoutubeId: ID of youtube video add to API description
