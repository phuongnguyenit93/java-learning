InterfaceEvolutionController:
  defaultCompatibility():
    summary: Existing implementation inheriting newly added default behavior
    description: OldStyleImplementation defines only id(), while Versioned supplies
      display() as a default method. The response shows display() executing and calling
      the implementation's id() to produce id=legacy; this demonstrates the evolution
      mechanism without claiming that every interface change is compatible.
    enableVideoYoutube: false
    videoYoutubeId: ID of youtube video add to API description
    videoYoutubeTitle: Title of video
