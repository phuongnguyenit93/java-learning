DefaultMethodController:
  dispatch():
    summary: Inheriting a default method without overriding it
    description: DefaultGreeting declares no greet() implementation, yet the object
      can invoke Greeting.greet() and returns hello-default. The experiment makes
      inherited default instance behavior observable.
