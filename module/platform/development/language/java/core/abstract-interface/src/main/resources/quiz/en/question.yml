# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: abstract-class-state
    question: "What can an abstract class contain that an interface cannot provide as per-instance state?"
    answers:
      - {id: A, answer: "Instance fields and constructors that initialize shared superclass state.", explanation: "Correct. Abstract classes can own instance state and partial implementation; interface fields are static final constants."}
      - {id: B, answer: "Only static final constants.", explanation: "Incorrect. Abstract classes can own instance state and partial implementation; interface fields are static final constants."}
      - {id: C, answer: "No methods at all.", explanation: "Incorrect. Abstract classes can own instance state and partial implementation; interface fields are static final constants."}
      - {id: D, answer: "Multiple direct superclasses.", explanation: "Incorrect. Abstract classes can own instance state and partial implementation; interface fields are static final constants."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.AbstractClass/AbstractClass.md", anchor: "abstract-class-model"}
    apiRelated: {controller: "AbstractClassController", methodSignature: "templateBehavior()"}

  - id: abstract-constructor
    question: "If an abstract class cannot be instantiated directly, why does it have constructors?"
    answers:
      - {id: A, answer: "Constructors are never executed in abstract classes.", explanation: "Incorrect. Subclass construction still runs the superclass constructor chain."}
      - {id: B, answer: "Its constructor initializes the superclass portion whenever a concrete subclass is constructed.", explanation: "Correct. Subclass construction still runs the superclass constructor chain."}
      - {id: C, answer: "They exist only for reflection and cannot initialize state.", explanation: "Incorrect. Subclass construction still runs the superclass constructor chain."}
      - {id: D, answer: "They create a separate abstract object beside the child.", explanation: "Incorrect. Subclass construction still runs the superclass constructor chain."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.AbstractClass/AbstractClass.md", anchor: "abstract-constructor"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: interface-fields
    question: "What are fields declared in an interface?"
    answers:
      - {id: A, answer: "Private mutable fields on every implementation.", explanation: "Incorrect. Interfaces do not carry instance fields of implementing objects."}
      - {id: B, answer: "Protected instance fields.", explanation: "Incorrect. Interfaces do not carry instance fields of implementing objects."}
      - {id: C, answer: "Implicitly public static final constants, not per-instance state.", explanation: "Correct. Interfaces do not carry instance fields of implementing objects."}
      - {id: D, answer: "Constructor parameters stored automatically.", explanation: "Incorrect. Interfaces do not carry instance fields of implementing objects."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Interface/Interface.md", anchor: "interface-fields"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: interface-method-kinds
    question: "Which set of method kinds can a modern Java interface declare?"
    answers:
      - {id: A, answer: "Only abstract public methods.", explanation: "Incorrect. These method kinds have different inheritance and dispatch semantics."}
      - {id: B, answer: "Only static and final methods.", explanation: "Incorrect. These method kinds have different inheritance and dispatch semantics."}
      - {id: C, answer: "Constructors and protected methods only.", explanation: "Incorrect. These method kinds have different inheritance and dispatch semantics."}
      - {id: D, answer: "Abstract instance methods, default methods, static methods, and private helper methods.", explanation: "Correct. These method kinds have different inheritance and dispatch semantics."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Interface/Interface.md", anchor: "interface-method-kinds"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: multiple-contracts
    question: "What does implementing multiple interfaces primarily provide?"
    answers:
      - {id: A, answer: "One object can satisfy several behavioral roles without multiple class inheritance.", explanation: "Correct. Java supports multiple interface inheritance of type and behavior, but only one superclass."}
      - {id: B, answer: "Multiple independent copies of object state.", explanation: "Incorrect. Java supports multiple interface inheritance of type and behavior, but only one superclass."}
      - {id: C, answer: "Multiple superclass constructors running in parallel.", explanation: "Incorrect. Java supports multiple interface inheritance of type and behavior, but only one superclass."}
      - {id: D, answer: "Automatic deep cloning of every interface field.", explanation: "Incorrect. Java supports multiple interface inheritance of type and behavior, but only one superclass."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Interface/Interface.md", anchor: "interface-implementation"}
    apiRelated: {controller: "InterfaceController", methodSignature: "multipleContracts()"}

  - id: abstract-vs-interface
    question: "When is an abstract class often a better fit than an interface?"
    answers:
      - {id: A, answer: "Whenever a class needs more than one role.", explanation: "Incorrect. Interfaces are usually better for cross-hierarchy roles; abstract classes make a stronger base-class commitment."}
      - {id: B, answer: "When a related hierarchy genuinely shares base instance state, constructors, and partial implementation.", explanation: "Correct. Interfaces are usually better for cross-hierarchy roles; abstract classes make a stronger base-class commitment."}
      - {id: C, answer: "Whenever there must be no shared implementation.", explanation: "Incorrect. Interfaces are usually better for cross-hierarchy roles; abstract classes make a stronger base-class commitment."}
      - {id: D, answer: "Whenever multiple superclass inheritance is required.", explanation: "Incorrect. Interfaces are usually better for cross-hierarchy roles; abstract classes make a stronger base-class commitment."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.AbstractVsInterface/AbstractVsInterface.md", anchor: "selection-guidance"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: interface-redeclaration
    question: "What can a subinterface do when redeclaring an inherited method?"
    answers:
      - {id: A, answer: "Change it to an unrelated return type.", explanation: "Incorrect. Redeclaration can refine the inherited contract while remaining signature-compatible."}
      - {id: B, answer: "Make it a constructor.", explanation: "Incorrect. Redeclaration can refine the inherited contract while remaining signature-compatible."}
      - {id: C, answer: "Refine a compatible return type, add contract metadata, or make an inherited default abstract again.", explanation: "Correct. Redeclaration can refine the inherited contract while remaining signature-compatible."}
      - {id: D, answer: "Give it instance fields automatically.", explanation: "Incorrect. Redeclaration can refine the inherited contract while remaining signature-compatible."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.InterfaceInheritance/InterfaceInheritance.md", anchor: "interface-redeclaration"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: default-method-purpose
    question: "Why were default methods important for interface evolution?"
    answers:
      - {id: A, answer: "They let interfaces own mutable instance fields.", explanation: "Incorrect. Default methods improve compatibility for many interface evolution scenarios, though not every change is safe."}
      - {id: B, answer: "They remove virtual dispatch.", explanation: "Incorrect. Default methods improve compatibility for many interface evolution scenarios, though not every change is safe."}
      - {id: C, answer: "They guarantee every future interface change is binary compatible.", explanation: "Incorrect. Default methods improve compatibility for many interface evolution scenarios, though not every change is safe."}
      - {id: D, answer: "They can add behavior without immediately forcing every existing implementation to provide a new method body.", explanation: "Correct. Default methods improve compatibility for many interface evolution scenarios, though not every change is safe."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.DefaultStaticPrivate/DefaultStaticPrivate.md", anchor: "default-method-evolution"}
    apiRelated: {controller: "InterfaceEvolutionController", methodSignature: "defaultCompatibility()"}

  - id: class-wins-default
    question: "A class hierarchy provides a concrete method and an interface provides a compatible default. Which wins?"
    answers:
      - {id: A, answer: "The class method wins over the interface default.", explanation: "Correct. Interface defaults are fallback implementations and do not override an inherited concrete class method."}
      - {id: B, answer: "The interface default always wins.", explanation: "Incorrect. Interface defaults are fallback implementations and do not override an inherited concrete class method."}
      - {id: C, answer: "Both run automatically in sequence.", explanation: "Incorrect. Interface defaults are fallback implementations and do not override an inherited concrete class method."}
      - {id: D, answer: "The class cannot implement the interface.", explanation: "Incorrect. Interface defaults are fallback implementations and do not override an inherited concrete class method."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.MultipleInheritance/MultipleInheritance.md", anchor: "class-wins-rule"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: default-conflict
    question: "What must a class do when it inherits the same default signature from two unrelated interfaces?"
    answers:
      - {id: A, answer: "Nothing; Java randomly selects one.", explanation: "Incorrect. Java refuses to guess between unrelated competing defaults."}
      - {id: B, answer: "Override the method and explicitly resolve which behavior to use or combine.", explanation: "Correct. Java refuses to guess between unrelated competing defaults."}
      - {id: C, answer: "Convert both interfaces into abstract classes automatically.", explanation: "Incorrect. Java refuses to guess between unrelated competing defaults."}
      - {id: D, answer: "Declare two objects with the same identity.", explanation: "Incorrect. Java refuses to guess between unrelated competing defaults."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.MultipleInheritance/MultipleInheritance.md", anchor: "default-method-conflict"}
    apiRelated: {controller: "DefaultMethodController", methodSignature: "resolveConflict()"}
