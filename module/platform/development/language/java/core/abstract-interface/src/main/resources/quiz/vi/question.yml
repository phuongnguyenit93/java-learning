  - id: abstract-class-state
    question: "Abstract class có thể chứa gì mà interface không cung cấp như per-instance state?"
    answers:
      - {id: A, answer: "Instance field và constructor initialize shared superclass state.", explanation: "Đúng. Abstract class có thể own instance state và partial implementation; interface field là static final constant."}
      - {id: B, answer: "Chỉ static final constant.", explanation: "Sai. Abstract class có thể own instance state và partial implementation; interface field là static final constant."}
      - {id: C, answer: "Không có method nào.", explanation: "Sai. Abstract class có thể own instance state và partial implementation; interface field là static final constant."}
      - {id: D, answer: "Nhiều direct superclass.", explanation: "Sai. Abstract class có thể own instance state và partial implementation; interface field là static final constant."}
