# <interview-schema>
# Interview Question Structure
# schema-version: 2
#
# questions [type: list; required; default: []]
#   Interview questions for the current module language.
#   each item:
#     question [type: string; required; default: ""]
#       Interview question displayed to the learner.
#     answer [type: string; required; default: ""]
#       Reference answer, revealed only when the learner explicitly opens it.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the content was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the content has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
# </interview-schema>

questions:
  - question: "Why is String immutability important to Java APIs and runtime behavior?"
    answer: "Immutable text can be safely shared, cached, pooled, used as a stable hash key, and passed across APIs without callers mutating an existing value. Operations return new values, which simplifies reasoning and supports the String pool contract."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Immutability/Immutability.md", anchor: "string-immutability"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Explain the String pool mental model and why == is still the wrong default for text comparison."
    answer: "The pool can canonicalize literals and explicitly interned values so some equal Strings share identity. That sharing is an implementation/runtime contract for pooling, not value equality. == checks identity; equals checks characters."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.StringPool/StringPool.md", anchor: "string-pool-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "How do String, Unicode, and Charset relate when data crosses an I/O boundary?"
    answer: "A String represents text as Java characters/code points over UTF-16 code units. External storage/transmission uses bytes. Charset defines the reversible mapping between text and bytes, so both sides must agree on the encoding."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.Encoding/Encoding.md", anchor: "charset-encode-decode"}
    apiRelated: {controller: "EncodingController", methodSignature: "roundTrip()"}

  - question: "Why is char not a safe synonym for a user-visible character?"
    answer: "char is one UTF-16 code unit. A supplementary Unicode code point uses two chars, and one user-perceived grapheme may contain multiple code points such as a base letter plus combining marks or emoji sequences."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.UnicodeCodePoint/UnicodeCodePoint.md", anchor: "code-unit-code-point-grapheme"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "When does Unicode normalization matter in application logic?"
    answer: "Visually equivalent text can use different canonical code-point sequences. Normalize at a deliberate comparison/search/storage boundary when the domain requires canonical equivalence, while remembering normalization is not locale-aware collation or general case folding."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.UnicodeCodePoint/UnicodeCodePoint.md", anchor: "unicode-normalization"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "How would you choose between String concatenation, StringBuilder, and StringBuffer?"
    answer: "Use ordinary concatenation for simple readable expressions; compilers already optimize many cases. Use StringBuilder for explicit incremental construction, especially loops. StringBuffer adds synchronized methods for legacy/shared-buffer scenarios, but synchronization does not solve broader compound-operation concurrency design."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.StringBuffer/StringBuffer.md", anchor: "builder-vs-buffer"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "What problem does String.intern solve, and why should it not be applied indiscriminately?"
    answer: "Interning canonicalizes equal String values to one pooled identity, which can help specialized symbol-like workloads. It also creates pool-management and memory-retention trade-offs, so normal value equality should not depend on interning."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.Intern/Intern.md", anchor: "intern-tradeoffs"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "How do you review a regex for production safety rather than only correctness?"
    answer: "Check input bounds, ambiguous nested quantifiers/alternatives, catastrophic-backtracking risk, compilation reuse, and whether a parser or simpler string operation is clearer. Correct matching behavior alone does not guarantee predictable runtime cost."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.Regex/Regex.md", anchor: "regex-performance"}
    apiRelated: {controller: "RegexController", methodSignature: "backtracking()"}
