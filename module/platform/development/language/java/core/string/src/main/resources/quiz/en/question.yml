# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: string-immutability-result
    question: "What happens to the original String after calling a transformation such as toUpperCase() without assigning the returned value?"
    answers:
      - {id: A, answer: "The original String is unchanged because String is immutable; the operation returns another String value.", explanation: "Correct. String operations do not mutate the existing object; callers must use the returned value."}
      - {id: B, answer: "The original String is modified in place.", explanation: "Incorrect. String operations do not mutate the existing object; callers must use the returned value."}
      - {id: C, answer: "The original becomes null.", explanation: "Incorrect. String operations do not mutate the existing object; callers must use the returned value."}
      - {id: D, answer: "The JVM mutates the pooled value for every reference.", explanation: "Incorrect. String operations do not mutate the existing object; callers must use the returned value."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Immutability/Immutability.md", anchor: "string-immutability"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: string-pool-identity
    question: "Why can two identical String literals compare true with == while two new String(\"x\") objects usually do not?"
    answers:
      - {id: A, answer: "== always compares String contents.", explanation: "Incorrect. String pooling may share literal identity, but value comparison must use equals."}
      - {id: B, answer: "Literals can share the canonical pooled instance, while new explicitly creates a distinct object; == compares identity.", explanation: "Correct. String pooling may share literal identity, but value comparison must use equals."}
      - {id: C, answer: "new String automatically interns every object.", explanation: "Incorrect. String pooling may share literal identity, but value comparison must use equals."}
      - {id: D, answer: "equals compares physical addresses while == compares text.", explanation: "Incorrect. String pooling may share literal identity, but value comparison must use equals."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.StringPool/StringPool.md", anchor: "pool-identity"}
    apiRelated: {controller: "StringPoolController", methodSignature: "identity()"}

  - id: string-equality-rule
    question: "Which comparison should normally be used to test whether two String values contain the same text?"
    answers:
      - {id: A, answer: "==, because String overrides the == operator.", explanation: "Incorrect. String does not overload ==; == remains a reference-identity comparison."}
      - {id: B, answer: "System.identityHashCode only.", explanation: "Incorrect. String does not overload ==; == remains a reference-identity comparison."}
      - {id: C, answer: "equals, because it compares String contents rather than object identity.", explanation: "Correct. String does not overload ==; == remains a reference-identity comparison."}
      - {id: D, answer: "compareTo must always return exactly 1.", explanation: "Incorrect. String does not overload ==; == remains a reference-identity comparison."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Equality/Equality.md", anchor: "string-reference-equality"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: string-compile-time-concat
    question: "Why can \"ja\" + \"va\" share the same pooled identity as the literal \"java\" in a constant expression?"
    answers:
      - {id: A, answer: "Every runtime concatenation is automatically interned.", explanation: "Incorrect. Compile-time constant folding is different from ordinary runtime concatenation."}
      - {id: B, answer: "StringBuilder always returns pooled Strings.", explanation: "Incorrect. Compile-time constant folding is different from ordinary runtime concatenation."}
      - {id: C, answer: "The garbage collector merges all equal Strings immediately.", explanation: "Incorrect. Compile-time constant folding is different from ordinary runtime concatenation."}
      - {id: D, answer: "The compiler can fold constant-expression concatenation into one literal before runtime.", explanation: "Correct. Compile-time constant folding is different from ordinary runtime concatenation."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Concatenation/Concatenation.md", anchor: "compile-time-concat"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: string-builder-loop
    question: "When constructing a long String incrementally inside a loop, why is StringBuilder usually preferred over repeated immutable concatenation?"
    answers:
      - {id: A, answer: "It accumulates characters in a mutable buffer and avoids creating a chain of intermediate String values.", explanation: "Correct. The main benefit is efficient mutable accumulation, not changing String semantics."}
      - {id: B, answer: "It changes String itself into a mutable class.", explanation: "Incorrect. The main benefit is efficient mutable accumulation, not changing String semantics."}
      - {id: C, answer: "It guarantees thread safety for arbitrary shared state.", explanation: "Incorrect. The main benefit is efficient mutable accumulation, not changing String semantics."}
      - {id: D, answer: "It automatically compresses the text.", explanation: "Incorrect. The main benefit is efficient mutable accumulation, not changing String semantics."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.StringBuilder/StringBuilder.md", anchor: "builder-usage"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: string-buffer-vs-builder
    question: "What is the core API-level distinction between StringBuilder and StringBuffer?"
    answers:
      - {id: A, answer: "StringBuilder is immutable but StringBuffer is mutable.", explanation: "Incorrect. Synchronization is the key distinction, though it does not replace higher-level concurrency design."}
      - {id: B, answer: "StringBuffer synchronizes its mutating methods, while StringBuilder does not; both are mutable character buffers.", explanation: "Correct. Synchronization is the key distinction, though it does not replace higher-level concurrency design."}
      - {id: C, answer: "StringBuffer stores bytes while StringBuilder stores chars.", explanation: "Incorrect. Synchronization is the key distinction, though it does not replace higher-level concurrency design."}
      - {id: D, answer: "StringBuilder can only be used inside streams.", explanation: "Incorrect. Synchronization is the key distinction, though it does not replace higher-level concurrency design."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.StringBuffer/StringBuffer.md", anchor: "builder-vs-buffer"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: string-intern-canonical
    question: "What does String.intern() return?"
    answers:
      - {id: A, answer: "A deep copy that is guaranteed to live outside the heap.", explanation: "Incorrect. intern is about canonical identity in the String pool, not mutability or encoding."}
      - {id: B, answer: "A mutable version of the String.", explanation: "Incorrect. intern is about canonical identity in the String pool, not mutability or encoding."}
      - {id: C, answer: "A canonical pooled reference for an equal String value according to the String pool contract.", explanation: "Correct. intern is about canonical identity in the String pool, not mutability or encoding."}
      - {id: D, answer: "The UTF-8 byte array backing the String.", explanation: "Incorrect. intern is about canonical identity in the String pool, not mutability or encoding."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.Intern/Intern.md", anchor: "intern-identity"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: string-charset-roundtrip
    question: "For a reliable text-to-bytes round trip, what must the producer and consumer agree on?"
    answers:
      - {id: A, answer: "Only the String length must match.", explanation: "Incorrect. Bytes have no intrinsic text encoding; the charset is part of the interpretation contract."}
      - {id: B, answer: "The platform default charset is always UTF-8 on every Java runtime.", explanation: "Incorrect. Bytes have no intrinsic text encoding; the charset is part of the interpretation contract."}
      - {id: C, answer: "The byte order can replace the charset declaration.", explanation: "Incorrect. Bytes have no intrinsic text encoding; the charset is part of the interpretation contract."}
      - {id: D, answer: "The same character encoding/Charset must be used to encode and decode the bytes.", explanation: "Correct. Bytes have no intrinsic text encoding; the charset is part of the interpretation contract."}
    correctAnswerId: D
