  - id: string-grapheme-boundary
    question: "Which statement best distinguishes code unit, code point, and grapheme cluster?"
    answers:
      - {id: A, answer: "They are three names for exactly the same unit.", explanation: "Incorrect. Text processing layers differ; user-visible characters can span multiple code points and code units."}
      - {id: B, answer: "A grapheme cluster is always one Java char.", explanation: "Incorrect. Text processing layers differ; user-visible characters can span multiple code points and code units."}
      - {id: C, answer: "A code unit is an encoding unit, a code point identifies a Unicode scalar value, and a grapheme cluster approximates one user-perceived character.", explanation: "Correct. Text processing layers differ; user-visible characters can span multiple code points and code units."}
      - {id: D, answer: "A code point is always two UTF-16 code units.", explanation: "Incorrect. Text processing layers differ; user-visible characters can span multiple code points and code units."}
