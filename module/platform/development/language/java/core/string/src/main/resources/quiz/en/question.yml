  - id: string-normalization-equality
    question: "Two Strings render as the same accented character but equals returns false. What is a plausible Unicode reason?"
    answers:
      - {id: A, answer: "equals ignores all Unicode characters above ASCII.", explanation: "Incorrect. Canonical-equivalent text may have different code-point sequences until normalized."}
      - {id: B, answer: "One may use a precomposed code point while the other uses a base character plus combining mark; canonical normalization can align them.", explanation: "Correct. Canonical-equivalent text may have different code-point sequences until normalized."}
      - {id: C, answer: "Java automatically strips combining marks before equals.", explanation: "Incorrect. Canonical-equivalent text may have different code-point sequences until normalized."}
      - {id: D, answer: "A String can contain only one code point per visible character.", explanation: "Incorrect. Canonical-equivalent text may have different code-point sequences until normalized."}
