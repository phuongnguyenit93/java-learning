  - id: string-codepoint-length
    question: "Why can String.length() be greater than the number of Unicode code points visible in the text?"
    answers:
      - {id: A, answer: "length counts UTF-16 code units, and supplementary code points require a surrogate pair of two code units.", explanation: "Correct. Java String indexing is based on UTF-16 code units, not Unicode code points or grapheme clusters."}
      - {id: B, answer: "length counts UTF-8 bytes.", explanation: "Incorrect. Java String indexing is based on UTF-16 code units, not Unicode code points or grapheme clusters."}
      - {id: C, answer: "Every accented letter is always stored as four chars.", explanation: "Incorrect. Java String indexing is based on UTF-16 code units, not Unicode code points or grapheme clusters."}
      - {id: D, answer: "length counts grapheme clusters and codePointCount counts bytes.", explanation: "Incorrect. Java String indexing is based on UTF-16 code units, not Unicode code points or grapheme clusters."}
    correctAnswerId: A
    aiGenerated: true
