  backtracking():
    execution: '<p><strong>Concept:</strong> Backtracking and performance pitfalls.</p><ol><li>The
      endpoint runs a bounded deterministic example inside <code>RegexController#backtracking()</code>.</li><li>Bounded
      safe example showing problematic pattern cost characteristics.<pre><code>@GetMapping(&quot;/backtracking&quot;)
      public Map&lt;String,Object&gt; backtracking(){ String input=&quot;a&quot;.repeat(18)+&quot;!&quot;;
      Pattern risky=Pattern.compile(&quot;(a+)+$&quot;); long start=System.nanoTime();
      boolean matched=risky.matcher(input).matches(); long elapsed=System.nanoTime()-start;
      return Map.of(&quot;inputLength&quot;,input.length(),&quot;matched&quot;,matched,&quot;boundedSample&quot;,true,&quot;elapsedNanos&quot;,elapsed,&quot;warning&quot;,&quot;nested
      ambiguous quantifiers can backtrack heavily; timing is illustrative only&quot;);
      }</code></pre></li><li>Inspect the response fields together: they are the observable
