EncodingController:
  description: |-
    <h2>Encoding</h2>
    <p>Quan sát ranh giới giữa Java <code>String</code> và external bytes. Các endpoint cho thấy round-trip khi hai phía dùng cùng Charset và mojibake khi cùng byte sequence bị decode bằng Charset khác.</p>
    <p>Đây là evidence cho data-contract của encoding; không nên suy luận rằng String tự mang sẵn UTF-8 hay một encoding bên ngoài JVM.</p>
  readmeRelated:
    file: 9.Encoding/Encoding.md
RegexController:
  description: |-
    <h2>Regex</h2>
    <p>Quan sát <code>Pattern</code>/<code>Matcher</code>, named capture và chi phí của backtracking trên một input bounded.</p>
    <p>Endpoint performance chỉ minh họa shape rủi ro; timing cụ thể không phải benchmark hay SLA.</p>
  readmeRelated:
    file: 11.Regex/Regex.md
StringConcatController:
  description: |-
    <h2>String Concatenation</h2>
    <p>So sánh repeated immutable concatenation với một mutable <code>StringBuilder</code> trong cùng construction flow.</p>
    <p>Identity hash được trả về chỉ để quan sát object identity thay đổi trong sample, không phải phép đo allocation chính xác.</p>
  readmeRelated:
    file: 5.Concatenation/Concatenation.md
StringPoolController:
  description: |-
    <h2>String Pool</h2>
    <p>Quan sát literal pooling, compile-time constant folding, <code>new String(...)</code>, content equality và <code>intern()</code> trong cùng response.</p>
    <p>Endpoint cố ý dùng <code>==</code> để minh họa identity; business text comparison vẫn phải dựa trên content semantics.</p>
  readmeRelated:
    file: 2.StringPool/StringPool.md
UnicodeController:
  description: |-
    <h2>Unicode</h2>
    <p>Quan sát sự khác nhau giữa UTF-16 code unit, Unicode code point và canonical-equivalent text.</p>
    <p>Các endpoint trả cả count/code-point evidence và equality trước/sau normalization để tránh suy luận chỉ từ hình thức hiển thị.</p>
  readmeRelated:
    file: 10.UnicodeCodePoint/UnicodeCodePoint.md
