EqualityController:
  identityVsEquality():
    execution: '<p><strong>Concept:</strong> Object identity vs logical equality.</p><ol><li>The
      endpoint runs a bounded deterministic example inside <code>EqualityController#identityVsEquality()</code>.</li><li>Compare
      == and equals for distinct logically equal objects.<pre><code>@GetMapping(&quot;/identity-vs-equality&quot;)
      public Map&lt;String,Object&gt; identityVsEquality(){ Value a=new Value(7),
      b=new Value(7); return Map.of(&quot;sameReference&quot;,a==b,&quot;logicalEquals&quot;,a.equals(b),&quot;sameHash&quot;,a.hashCode()==b.hashCode());
      }</code></pre></li><li>Inspect the response fields together: they are the observable
      evidence for the rule rather than a benchmark or production policy.</li></ol><p><strong>Conclusion:</strong>
      connect the observed result back to the linked README section before generalizing
      the behavior.</p>'
    usage: true
