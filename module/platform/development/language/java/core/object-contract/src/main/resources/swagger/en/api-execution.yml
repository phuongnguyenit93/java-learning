  naturalVsCustom():
    execution: '<p><strong>Concept:</strong> External/custom ordering.</p><ol><li>The
      endpoint runs a bounded deterministic example inside <code>OrderingController#naturalVsCustom()</code>.</li><li>Compare
      Comparable natural order with Comparator alternatives.<pre><code>@GetMapping(&quot;/natural-vs-custom&quot;)
      public Map&lt;String,Object&gt; naturalVsCustom(){ List&lt;Person&gt; source=List.of(new
      Person(&quot;Bob&quot;,30),new Person(&quot;Ada&quot;,40)); List&lt;Person&gt;
      natural=new ArrayList&lt;&gt;(source); Collections.sort(natural); List&lt;Person&gt;
      byName=new ArrayList&lt;&gt;(source); byName.sort(Comparator.comparing(Person::name));
      return Map.of(&quot;naturalByAge&quot;,natural,&quot;customByName&quot;,byName);
      }</code></pre></li><li>Inspect the response fields together: they are the observable
