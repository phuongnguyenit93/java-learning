HashContractController:
  brokenHashSetLookup():
    summary: HashSet lookup khi equals/hashCode contract bị phá
    description: |-
      Tạo hai key có `equals == true` nhưng cố ý trả hai hash code khác nhau, insert một key vào `HashSet` rồi lookup bằng key logically equal còn lại.
      Response biến một lỗi contract trừu tượng thành failure quan sát được: collection có thể không tìm thấy logical value mà `equals` nói là bằng nhau.
