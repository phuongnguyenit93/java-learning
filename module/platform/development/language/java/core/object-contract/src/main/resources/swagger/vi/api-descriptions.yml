  mutableKey():
    summary: Rủi ro mutate hash/equality state sau insertion
    description: |-
      Insert một mutable key vào `HashMap`, kiểm tra lookup trước mutation, thay đổi field tham gia `equals/hashCode`, rồi kiểm tra lại.
      Experiment cho thấy vì sao key dùng trong hash-based collection nên có equality/hash state ổn định; kết quả sau mutation là evidence của implementation hiện tại, không phải một contract bảo đảm lookup luôn fail theo cùng cách.
