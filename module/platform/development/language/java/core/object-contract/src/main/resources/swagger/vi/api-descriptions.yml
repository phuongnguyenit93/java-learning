OrderingController:
  naturalVsCustom():
    summary: Natural ordering so với Comparator tùy chỉnh
    description: |-
      Dùng cùng một danh sách `Person`: `Collections.sort` áp dụng natural order từ `Comparable` theo age, còn `Comparator.comparing(Person::name)` áp dụng ordering policy bên ngoài theo name.
      Hai kết quả cho thấy ordering nằm ở type hay ở caller là một quyết định thiết kế, không phải hai cú pháp tương đương.
