  compareToEquals():
    summary: Khi compareTo và equals không nhất quán
    description: |-
      So sánh `BigDecimal("1.0")` với `BigDecimal("1.00")`: `equals` trả false nhưng `compareTo` trả 0, sau đó đưa cả hai vào `HashSet` và `TreeSet`.
      Response chứng minh hash-based collection và sorted collection có thể có size khác nhau vì chúng dùng hai notion "same key" khác nhau.
