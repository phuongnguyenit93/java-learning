EqualityController:
  identityVsEquality():
    execution: <p><strong>Khái niệm:</strong> Object identity v&#224; logical equality.</p><ol><li>Endpoint
      chạy một ví dụ deterministic và bounded trong <code>EqualityController#identityVsEquality()</code>.</li><li>Source
      line dưới đây là code evidence trực tiếp tạo behavior được quan sát:<pre><code>@GetMapping(&quot;/identity-vs-equality&quot;)
      public Map&lt;String,Object&gt; identityVsEquality(){ Value a=new Value(7),
      b=new Value(7); return Map.of(&quot;sameReference&quot;,a==b,&quot;logicalEquals&quot;,a.equals(b),&quot;sameHash&quot;,a.hashCode()==b.hashCode());
      }</code></pre></li><li>Quan sát các field trong response cùng nhau; đây là evidence
      cho quy tắc, không phải benchmark hay production policy.</li></ol><p><strong>Kết
      luận:</strong> đối chiếu kết quả với README section được liên kết trước khi
      khái quát behavior.</p>
    usage: true
