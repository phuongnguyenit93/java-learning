    question: "What does reference `==` answer for two object references?"
    answers:
      - {id: A, answer: "Whether they identify the same object, not whether their domain values are logically equal.", explanation: "Correct. Object identity and logical equality are separate contracts in Java."}
      - {id: B, answer: "Whether every field value is equal.", explanation: "Incorrect. Object identity and logical equality are separate contracts in Java."}
      - {id: C, answer: "Whether their hash codes are unique.", explanation: "Incorrect. Object identity and logical equality are separate contracts in Java."}
      - {id: D, answer: "Whether they were created by the same constructor overload.", explanation: "Incorrect. Object identity and logical equality are separate contracts in Java."}
