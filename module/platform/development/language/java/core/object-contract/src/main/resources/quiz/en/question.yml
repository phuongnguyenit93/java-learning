# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: identity-vs-logical-equality
    question: "What does reference `==` answer for two object references?"
    answers:
      - {id: A, answer: "Whether they identify the same object, not whether their domain values are logically equal.", explanation: "Correct. Object identity and logical equality are separate contracts in Java."}
      - {id: B, answer: "Whether every field value is equal.", explanation: "Incorrect. Object identity and logical equality are separate contracts in Java."}
      - {id: C, answer: "Whether their hash codes are unique.", explanation: "Incorrect. Object identity and logical equality are separate contracts in Java."}
      - {id: D, answer: "Whether they were created by the same constructor overload.", explanation: "Incorrect. Object identity and logical equality are separate contracts in Java."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.IdentityEquality/IdentityEquality.md", anchor: "identity-vs-equality"}
    apiRelated: {controller: "EqualityController", methodSignature: "identityVsEquality()"}

  - id: equals-contract-laws
    question: "Which property is required by a correct equals contract?"
    answers:
      - {id: A, answer: "It may return different answers on every call for the same stable objects.", explanation: "Incorrect. Collections and libraries rely on the full equality contract even though the compiler cannot enforce it."}
      - {id: B, answer: "It must be reflexive, symmetric, transitive, consistent while relevant state is stable, and false for null.", explanation: "Correct. Collections and libraries rely on the full equality contract even though the compiler cannot enforce it."}
      - {id: C, answer: "It must return true for null.", explanation: "Incorrect. Collections and libraries rely on the full equality contract even though the compiler cannot enforce it."}
      - {id: D, answer: "It may be asymmetric as long as hashCode matches.", explanation: "Incorrect. Collections and libraries rely on the full equality contract even though the compiler cannot enforce it."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Equals/Equals.md", anchor: "equals-contract"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: equals-inheritance-symmetry
    question: "Why can adding equality-relevant state in a subclass make equals difficult?"
    answers:
      - {id: A, answer: "Subclasses cannot override equals.", explanation: "Incorrect. Value equality and open inheritance can impose conflicting equivalence expectations."}
      - {id: B, answer: "Every subclass has the same identity as its parent class.", explanation: "Incorrect. Value equality and open inheritance can impose conflicting equivalence expectations."}
      - {id: C, answer: "The parent may consider the child equal using parent state while the child requires extra state, threatening symmetry or transitivity.", explanation: "Correct. Value equality and open inheritance can impose conflicting equivalence expectations."}
      - {id: D, answer: "equals is static and cannot see subtype state.", explanation: "Incorrect. Value equality and open inheritance can impose conflicting equivalence expectations."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Equals/Equals.md", anchor: "equals-inheritance-risk"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: hashcode-equals-rule
    question: "What must be true for two objects that are equal according to equals?"
    answers:
      - {id: A, answer: "They must be the same reference.", explanation: "Incorrect. Equal objects with different hashes break hash-based lookup assumptions."}
      - {id: B, answer: "They must have globally unique hash codes.", explanation: "Incorrect. Equal objects with different hashes break hash-based lookup assumptions."}
      - {id: C, answer: "They must be Comparable.", explanation: "Incorrect. Equal objects with different hashes break hash-based lookup assumptions."}
      - {id: D, answer: "They must return the same hash code.", explanation: "Correct. Equal objects with different hashes break hash-based lookup assumptions."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.HashCode/HashCode.md", anchor: "hashcode-contract"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: mutable-hash-key
    question: "Why is mutating equality/hash fields of a HashMap key after insertion dangerous?"
    answers:
      - {id: A, answer: "Its current hash may point to a different bucket than where it was stored, so lookup or removal can fail.", explanation: "Correct. Hash-based collections assume key equality/hash state remains stable while stored."}
      - {id: B, answer: "HashMap automatically deep-copies every key.", explanation: "Incorrect. Hash-based collections assume key equality/hash state remains stable while stored."}
      - {id: C, answer: "Changing the key always rehashes that single entry automatically.", explanation: "Incorrect. Hash-based collections assume key equality/hash state remains stable while stored."}
      - {id: D, answer: "Mutable keys are converted into Strings.", explanation: "Incorrect. Hash-based collections assume key equality/hash state remains stable while stored."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.HashCode/HashCode.md", anchor: "mutable-key-risk"}
    apiRelated: {controller: "HashContractController", methodSignature: "mutableKey()"}

  - id: broken-equals-hash
    question: "What can happen when two equal objects return different hash codes?"
    answers:
      - {id: A, answer: "The JVM automatically rewrites equals.", explanation: "Incorrect. Hash narrows the candidate location before equality confirms the match."}
      - {id: B, answer: "HashSet may appear to keep duplicates and HashMap lookup with an equal key can miss the entry.", explanation: "Correct. Hash narrows the candidate location before equality confirms the match."}
      - {id: C, answer: "Every collection switches to identity comparison.", explanation: "Incorrect. Hash narrows the candidate location before equality confirms the match."}
      - {id: D, answer: "The compiler rejects the class.", explanation: "Incorrect. Hash narrows the candidate location before equality confirms the match."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.EqualsHashCode/EqualsHashCode.md", anchor: "broken-contract-effects"}
    apiRelated: {controller: "HashContractController", methodSignature: "brokenHashSetLookup()"}

  - id: tostring-sensitive-data
    question: "Why should secrets not be included in toString?"
    answers:
      - {id: A, answer: "toString can never be called at runtime.", explanation: "Incorrect. Diagnostic convenience must not leak credentials or sensitive domain data."}
      - {id: B, answer: "Secrets become encrypted automatically inside toString.", explanation: "Incorrect. Diagnostic convenience must not leak credentials or sensitive domain data."}
      - {id: C, answer: "toString is often invoked implicitly by logs, debuggers, concatenation, and errors, widening the exposure surface.", explanation: "Correct. Diagnostic convenience must not leak credentials or sensitive domain data."}
      - {id: D, answer: "Only private fields may appear in logs.", explanation: "Incorrect. Diagnostic convenience must not leak credentials or sensitive domain data."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.ToString/ToString.md", anchor: "tostring-sensitive-data"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: comparable-subtraction-overflow
    question: "Why is `return this.id - other.id` a poor compareTo implementation for arbitrary ints?"
    answers:
      - {id: A, answer: "Subtraction is illegal inside compareTo.", explanation: "Incorrect. Use `Integer.compare` or equivalent helpers to preserve ordering semantics at boundaries."}
      - {id: B, answer: "compareTo must return only exactly -1, 0, or 1.", explanation: "Incorrect. Use `Integer.compare` or equivalent helpers to preserve ordering semantics at boundaries."}
      - {id: C, answer: "int cannot represent negative numbers.", explanation: "Incorrect. Use `Integer.compare` or equivalent helpers to preserve ordering semantics at boundaries."}
      - {id: D, answer: "The subtraction can overflow and return a sign inconsistent with the real ordering.", explanation: "Correct. Use `Integer.compare` or equivalent helpers to preserve ordering semantics at boundaries."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.Comparable/Comparable.md", anchor: "compareto-contract"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: compareto-equals-consistency
    question: "What can happen if `compareTo(a,b)==0` while `a.equals(b)` is false?"
    answers:
      - {id: A, answer: "Sorted sets or maps may treat them as the same ordering key even though hash/equality collections consider them distinct.", explanation: "Correct. Sorted structures use comparison ordering for key uniqueness; hash structures use equals/hashCode."}
      - {id: B, answer: "The compiler refuses every such Comparable implementation.", explanation: "Incorrect. Sorted structures use comparison ordering for key uniqueness; hash structures use equals/hashCode."}
      - {id: C, answer: "Both objects automatically become the same reference.", explanation: "Incorrect. Sorted structures use comparison ordering for key uniqueness; hash structures use equals/hashCode."}
      - {id: D, answer: "HashSet also must collapse them based on compareTo.", explanation: "Incorrect. Sorted structures use comparison ordering for key uniqueness; hash structures use equals/hashCode."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.Comparable/Comparable.md", anchor: "compareto-equals-consistency"}
    apiRelated: {controller: "OrderingController", methodSignature: "compareToEquals()"}

  - id: comparator-mutability
    question: "Why is a comparator that changes ordering based on mutable external state risky in a TreeSet?"
    answers:
      - {id: A, answer: "TreeSet copies comparator state before every comparison.", explanation: "Incorrect. Ordered structures assume a coherent stable comparator while values are stored."}
      - {id: B, answer: "The set ordering invariant can change after elements are stored, making searches and ordering behavior inconsistent.", explanation: "Correct. Ordered structures assume a coherent stable comparator while values are stored."}
      - {id: C, answer: "Comparators are required to be static methods.", explanation: "Incorrect. Ordered structures assume a coherent stable comparator while values are stored."}
      - {id: D, answer: "Mutable state makes every comparison return zero.", explanation: "Incorrect. Ordered structures assume a coherent stable comparator while values are stored."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.Comparator/Comparator.md", anchor: "comparator-contract"}
    apiRelated: {controller: "", methodSignature: ""}
