  - id: inherited-meta
    question: "Where does @Inherited primarily affect annotation lookup?"
    answers:
      - {id: A, answer: "Runtime lookup on class declarations may fall back through the superclass chain for a suitable annotation type.", explanation: "Correct. It does not make annotations automatically inherit across every member or interface."}
      - {id: B, answer: "Every overriding method automatically receives annotations from its superclass method.", explanation: "Incorrect. Method annotation lookup does not use @Inherited."}
      - {id: C, answer: "An implementing class automatically receives annotations from its interfaces.", explanation: "Incorrect. @Inherited does not traverse the interface graph."}
      - {id: D, answer: "It makes a SOURCE annotation appear at runtime.", explanation: "Incorrect. Runtime lookup still requires metadata that survives to runtime."}
