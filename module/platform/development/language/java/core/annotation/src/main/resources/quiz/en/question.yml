      - {id: A, answer: "PaymentService is automatically treated as directly annotated with @FrameworkStereotype.", explanation: "Incorrect. Java Core does not provide automatic transitive or composed meta-annotation lookup."}
      - {id: B, answer: "PaymentService directly has @AuditedComponent; a framework that wants composition must traverse and define that behavior itself.", explanation: "Correct. Meta-annotations describe annotation types, while composed-annotation semantics belong to a consumer if it chooses to implement them."}
      - {id: C, answer: "@AuditedComponent cannot itself have a custom meta-annotation.", explanation: "Incorrect. A custom annotation may target ANNOTATION_TYPE."}
      - {id: D, answer: "The compiler copies every meta-annotation onto every use site.", explanation: "Incorrect. Java Core has no general copy-down mechanism like that."}
    correctAnswerId: B
    aiGenerated: true
