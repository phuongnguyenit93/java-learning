  - id: target-design
    question: "Why should an annotation use the smallest @Target set that still matches its semantics?"
    answers:
      - {id: A, answer: "So the annotation automatically gains RUNTIME retention.", explanation: "Incorrect. Target does not determine retention."}
      - {id: B, answer: "So the compiler blocks meaningless uses and consumers only need to handle contexts with a defined contract.", explanation: "Correct. Expanding target also expands the annotation's API surface."}
      - {id: C, answer: "Because Java only compiles annotations with exactly one target.", explanation: "Incorrect. @Target may contain multiple ElementType values."}
      - {id: D, answer: "So a record-component annotation is always copied to every field, accessor, and constructor parameter.", explanation: "Incorrect. Record-component propagation depends on compatible targets and whether related members are implicitly or explicitly declared."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.Target/Target.md", anchor: "target-design"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: retention-meta
    question: "Which statement is correct when annotation A contains annotation B as an element value?"
    answers:
      - {id: A, answer: "A's retention automatically becomes B's retention policy.", explanation: "Incorrect. Retention belongs to the annotation type being meta-annotated; outer retention does not become an independent policy for the nested annotation type."}
      - {id: B, answer: "B must always declare exactly the same retention as A.", explanation: "Incorrect. Each annotation type has its own retention contract except where another specific rule imposes compatibility constraints."}
      - {id: C, answer: "A's retention controls the lifetime of A's metadata; B still has its own annotation-type retention contract.", explanation: "Correct. Nesting does not imply transitive retention."}
      - {id: D, answer: "A nested annotation always has SOURCE retention.", explanation: "Incorrect. There is no such default rule."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.MetaAnnotation/MetaAnnotation.md", anchor: "retention-meta"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: target-meta
    question: "If @FrameworkStereotype annotates the annotation type @AuditedComponent, what does Java Core assume when PaymentService only has @AuditedComponent?"
