  - id: repeatable-container
    question: "What role does the container play when the same repeatable annotation appears multiple times at one location?"
    answers:
      - {id: A, answer: "It is only IDE syntax and has no relation to class-file representation.", explanation: "Incorrect. The container is part of the representation and contract that reflection APIs must understand."}
      - {id: B, answer: "It represents the repeated annotation values, so raw single-annotation lookup and by-type lookup can have different semantics.", explanation: "Correct. The container is not a detail that consumers can always ignore."}
      - {id: C, answer: "It merges all repeated values into one annotation instance.", explanation: "Incorrect. The repeated instances remain separate values inside the container representation."}
      - {id: D, answer: "It makes the source order of repeated values undefined.", explanation: "Incorrect. Repeated values preserve source order according to the container representation contract."}
