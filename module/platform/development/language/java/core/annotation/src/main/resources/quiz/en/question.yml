# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: annotation-model
    question: "Which statement best describes the role of an annotation in Java?"
    answers:
      - {id: A, answer: "An annotation executes business logic as soon as the JVM loads the class.", explanation: "Incorrect. An annotation carries metadata; behavior appears only when a compiler, tool, framework, or other code reads and interprets that metadata."}
      - {id: B, answer: "An annotation is only a specially formatted comment that programs cannot read.", explanation: "Incorrect. Annotations are structured metadata that consumers can read under Java or framework-defined contracts."}
      - {id: C, answer: "An annotation describes code with structured metadata; a consumer performs validation, generation, or runtime behavior from that metadata.", explanation: "Correct. The core mental model is that annotations describe and consumers act."}
      - {id: D, answer: "An annotation is meaningful only when its retention is RUNTIME.", explanation: "Incorrect. Compilers and annotation processors can consume annotations at compile time even when metadata does not survive to runtime."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Basic/Basic.md", anchor: "annotation-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: annotation-syntax
    question: "When may @Role(\"ADMIN\") be written instead of @Role(value = \"ADMIN\")?"
    answers:
      - {id: A, answer: "When the supplied element is named value and it is the only element supplied in that annotation use.", explanation: "Correct. Java lets the value = part be omitted in this shorthand form."}
      - {id: B, answer: "Whenever the annotation type has exactly one element, regardless of its name.", explanation: "Incorrect. This shorthand is specifically tied to an element named value."}
      - {id: C, answer: "Only when the value element has type String.", explanation: "Incorrect. The shorthand is not limited to String-valued elements."}
      - {id: D, answer: "Only when the annotation is a marker annotation.", explanation: "Incorrect. A marker annotation has no elements to supply."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Basic/Basic.md", anchor: "annotation-syntax"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: annotation-restrictions
    question: "Which element declaration is valid in an annotation interface?"
    answers:
      - {id: A, answer: "List<String> names();", explanation: "Incorrect. Arbitrary collection types such as List are not valid annotation element types."}
      - {id: B, answer: "Class<? extends Runnable> handler();", explanation: "Correct. Class and parameterized uses of Class are valid annotation element types."}
      - {id: C, answer: "Object policy();", explanation: "Incorrect. Arbitrary domain or object types cannot be annotation element types."}
      - {id: D, answer: "String[][] matrix();", explanation: "Incorrect. Annotation elements may use a one-dimensional array of a valid element type, but nested arrays are not valid."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Basic/Basic.md", anchor: "annotation-restrictions"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: annotation-use-sites
    question: "What is the core difference between a declaration annotation and a TYPE_USE annotation?"
    answers:
      - {id: A, answer: "Declaration annotations always have SOURCE retention while TYPE_USE annotations always have RUNTIME retention.", explanation: "Incorrect. Retention and target are independent dimensions."}
      - {id: B, answer: "TYPE_USE may only appear on a generic type argument.", explanation: "Incorrect. TYPE_USE also covers many type contexts such as casts, return types, array components, and new expressions."}
      - {id: C, answer: "Declaration annotations are only for classes while TYPE_USE annotations are only for methods.", explanation: "Incorrect. Declaration annotations can target many kinds of declarations."}
      - {id: D, answer: "A declaration annotation describes a declared program element, while TYPE_USE describes a particular use of a type.", explanation: "Correct. Runtime APIs also expose these two kinds of metadata through different inspection models."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Basic/Basic.md", anchor: "annotation-use-sites"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: override-annotation
    question: "What is the main value of @Override?"
    answers:
      - {id: A, answer: "It makes a method virtual so polymorphism can work.", explanation: "Incorrect. Java overriding semantics exist independently of the annotation."}
      - {id: B, answer: "It asks the compiler to verify that the declaration really overrides or implements a method in a case Java permits.", explanation: "Correct. This turns typos and signature mistakes into compile-time errors."}
      - {id: C, answer: "It copies the superclass implementation into the subclass.", explanation: "Incorrect. @Override does not copy code."}
      - {id: D, answer: "It only works for methods inherited from abstract classes.", explanation: "Incorrect. It is also used for interface implementations and other cases allowed by Java."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.BuiltIn/BuiltIn.md", anchor: "override-annotation"}
    apiRelated: {controller: "BuiltInAnnotationController", methodSignature: "compilerContracts()"}

  - id: deprecated-annotation
    question: "What does @Deprecated(forRemoval = true) mean?"
    answers:
      - {id: A, answer: "The JVM immediately blocks calls to the API.", explanation: "Incorrect. Deprecated APIs can still be called; compilers and tools generally issue warnings."}
      - {id: B, answer: "The API is guaranteed to be removed in the next release.", explanation: "Incorrect. forRemoval expresses intent to remove in the future, not a guaranteed release date."}
      - {id: C, answer: "The API is a candidate for future removal, and since may record the version in which deprecation began.", explanation: "Correct. These elements help tools and users understand API lifecycle."}
      - {id: D, answer: "The Javadoc @deprecated tag becomes unnecessary because the annotation contains a migration guide.", explanation: "Incorrect. The annotation is machine-readable while the Javadoc tag can explain migration guidance for people."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.BuiltIn/BuiltIn.md", anchor: "deprecated-annotation"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: suppresswarnings
    question: "Which use of @SuppressWarnings is the most appropriate?"
    answers:
      - {id: A, answer: "Suppress every warning for the whole module so the build always looks clean.", explanation: "Incorrect. Broad suppression can hide new and unrelated warnings."}
      - {id: B, answer: "Suppress a warning before investigating it because warnings do not affect type safety.", explanation: "Incorrect. Suppression does not make an unsafe operation safe."}
      - {id: C, answer: "Use any warning key because every compiler understands the same complete key set.", explanation: "Incorrect. The JLS requires only a minimum standard set; compilers may define additional categories."}
      - {id: D, answer: "Understand the cause, fix the code when possible, and suppress only the smallest scope when the contract really justifies it.", explanation: "Correct. Suppression should be a deliberate acceptance of a known warning, not a substitute for fixing code."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.BuiltIn/BuiltIn.md", anchor: "suppresswarnings"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: safevarargs
    question: "Why is @SafeVarargs restricted to variable-arity constructors or variable-arity methods that are static, final, or private?"
    answers:
      - {id: A, answer: "So the safety assertion cannot be invalidated by an overriding implementation.", explanation: "Correct. The annotation is a programmer assertion about generic varargs handling and needs a stable implementation contract."}
      - {id: B, answer: "Because Java forbids generic varargs on every other instance method.", explanation: "Incorrect. Generic varargs may exist; @SafeVarargs has its own applicability rules."}
      - {id: C, answer: "Because the annotation converts varargs into an immutable List.", explanation: "Incorrect. @SafeVarargs does not change the runtime representation of varargs."}
      - {id: D, answer: "Because static, final, and private methods are always type-safe regardless of their implementation.", explanation: "Incorrect. The implementation can still cause heap pollution; the annotation should be used only when the code is actually safe."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.BuiltIn/BuiltIn.md", anchor: "safevarargs"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: functionalinterface
    question: "Which change can still leave an interface as a functional interface?"
    answers:
      - {id: A, answer: "Add a second independent abstract method.", explanation: "Incorrect. Two independent abstract methods generally mean there is no single function descriptor."}
      - {id: B, answer: "Add a default method with an implementation.", explanation: "Correct. A default method is not counted as the abstract method of the SAM contract."}
      - {id: C, answer: "Remove the only abstract method and keep only static methods.", explanation: "Incorrect. A functional interface needs a function descriptor derived from an abstract method under Java's rules."}
      - {id: D, answer: "Turn the abstract method into a private interface method.", explanation: "Incorrect. A private interface method does not define the function descriptor."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.BuiltIn/BuiltIn.md", anchor: "functionalinterface"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: declare-annotation
    question: "Which statement about a custom annotation type is correct?"
    answers:
      - {id: A, answer: "It is declared as a normal interface that extends java.lang.annotation.Annotation.", explanation: "Incorrect. Annotation types use @interface; developers do not turn a normal interface into an annotation by extending Annotation."}
      - {id: B, answer: "An element method may have parameters and throws clauses if the consumer supports them.", explanation: "Incorrect. Annotation elements have dedicated restrictions: no parameters, no type parameters, and no throws clause."}
      - {id: C, answer: "It is declared with @interface, and each element acts like a metadata accessor in a specialized schema.", explanation: "Correct. Annotation interfaces have dedicated semantics and the compiler checks uses against that schema."}
      - {id: D, answer: "An annotation interface may be generic so its schema can be reused.", explanation: "Incorrect. Annotation interfaces are not generic."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.CustomAnnotation/CustomAnnotation.md", anchor: "declare-annotation"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: annotation-elements-defaults
    question: "What can happen when an annotation use omits an element with a default and that default is later changed in the annotation type?"
    answers:
      - {id: A, answer: "The old default was copied into the use at compile time, so the observed value can never change.", explanation: "Incorrect. A missing element does not store a copied explicit value from the old default."}
      - {id: B, answer: "The class file becomes invalid and can no longer be loaded.", explanation: "Incorrect. A missing explicit value is resolved from the annotation type's default when the annotation is read."}
      - {id: C, answer: "The compiler stores null to mark that the element was omitted.", explanation: "Incorrect. null is not a valid annotation element value."}
      - {id: D, answer: "The observed value may follow the annotation type's current default, making defaults part of the compatibility contract.", explanation: "Correct. This differs from an explicit value that was stored directly in the annotation use."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.CustomAnnotation/CustomAnnotation.md", anchor: "annotation-elements-defaults"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: marker-annotation
    question: "What makes an annotation type a true marker annotation?"
    answers:
      - {id: A, answer: "Its annotation interface declares no elements.", explanation: "Correct. A marker commonly represents presence or absence as a boolean-style semantic."}
      - {id: B, answer: "It declares several elements and all of them have defaults.", explanation: "Incorrect. Such an annotation can be written with marker-style syntax, but its schema still has elements."}
      - {id: C, answer: "It uses SOURCE retention.", explanation: "Incorrect. Retention does not determine whether an annotation is a marker."}
      - {id: D, answer: "It targets only TYPE.", explanation: "Incorrect. Target does not define marker status either."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.CustomAnnotation/CustomAnnotation.md", anchor: "marker-annotation"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: custom-annotation-design
    question: "Which questions should come first when designing a public custom annotation?"
    answers:
      - {id: A, answer: "How can the annotation contain the largest possible number of elements?", explanation: "Incorrect. A large, interdependent annotation can become a difficult configuration language."}
      - {id: B, answer: "Who consumes it, what metadata does it describe, where is it valid, and how long must it survive?", explanation: "Correct. These questions lead directly to a meaningful schema, target, and retention."}
      - {id: C, answer: "Can it store secrets instead of using configuration?", explanation: "Incorrect. Secrets and environment-dependent data are generally poor fits for annotation metadata."}
      - {id: D, answer: "Can the compiler infer every business constraint among its elements?", explanation: "Incorrect. The compiler checks schema and types; domain-specific constraints usually require a consumer or processor."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.CustomAnnotation/CustomAnnotation.md", anchor: "custom-annotation-design"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: retention-source
    question: "When can an annotation with RetentionPolicy.SOURCE still be useful?"
    answers:
      - {id: A, answer: "When runtime reflection must read it after the application starts.", explanation: "Incorrect. SOURCE metadata is not retained in the class-file representation for runtime reflection."}
      - {id: B, answer: "When a bytecode transformer only receives .class files after compilation.", explanation: "Incorrect. SOURCE annotations do not survive into the class file."}
      - {id: C, answer: "When an annotation processor or static-analysis tool reads it during compilation.", explanation: "Correct. Processors run before SOURCE metadata is discarded from class output."}
      - {id: D, answer: "When a runtime framework needs getAnnotation(...) to return an instance.", explanation: "Incorrect. That use case requires runtime-visible metadata."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Retention/Retention.md", anchor: "retention-source"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: retention-class
    question: "Which statement about RetentionPolicy.CLASS is correct?"
    answers:
      - {id: A, answer: "The metadata remains in the class file, but standard runtime reflection is not required to expose it as it does a RUNTIME annotation.", explanation: "Correct. CLASS is useful for bytecode tooling and is also the default retention when @Retention is omitted."}
      - {id: B, answer: "The metadata is removed before the class file is written.", explanation: "Incorrect. That describes SOURCE retention."}
      - {id: C, answer: "It is stronger than RUNTIME because both bytecode tools and runtime reflection must see it.", explanation: "Incorrect. Standard runtime reflection visibility is the key distinction between CLASS and RUNTIME."}
      - {id: D, answer: "CLASS retention is legal only for annotations that target TYPE.", explanation: "Incorrect. Retention is not constrained that way by target."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Retention/Retention.md", anchor: "retention-class"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: retention-runtime
    question: "What does @Retention(RUNTIME) guarantee?"
    answers:
      - {id: A, answer: "An annotated method will automatically be wrapped by an interceptor.", explanation: "Incorrect. Retention does not create interception."}
      - {id: B, answer: "The metadata is retained so standard runtime reflection can read it, but a consumer must still actively interpret it.", explanation: "Correct. Runtime visibility and runtime behavior are separate concerns."}
      - {id: C, answer: "Every source location becomes runtime-queryable declaration metadata.", explanation: "Incorrect. Retention also interacts with target and context semantics; local declarations and type annotations have distinct rules."}
      - {id: D, answer: "The compiler ignores the annotation because it is only for runtime.", explanation: "Incorrect. The compiler still parses and validates annotation uses against their schema and target."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Retention/Retention.md", anchor: "retention-runtime"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: retention-use-case
    question: "What is the best design rule for choosing retention?"
    answers:
      - {id: A, answer: "Always choose RUNTIME because keeping metadata longer is always better.", explanation: "Incorrect. Longer retention can widen the contract and create unnecessary runtime expectations."}
      - {id: B, answer: "Always choose SOURCE to minimize artifact size.", explanation: "Incorrect. Metadata would disappear too early if a class-file or runtime consumer needs it."}
      - {id: C, answer: "Choose the target first and let retention be inferred automatically.", explanation: "Incorrect. Target and retention are independent dimensions."}
      - {id: D, answer: "Identify when the real consumer runs and choose the shortest retention that still satisfies that consumer.", explanation: "Correct. This keeps metadata lifetime aligned with the actual use case."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Retention/Retention.md", anchor: "retention-use-case"}
    apiRelated: {controller: "AnnotationInspectionController", methodSignature: "retention()"}

  - id: elementtype-targets
    question: "If an annotation type declares no @Target, what does Java 21 permit?"
    answers:
      - {id: A, answer: "Only TYPE and METHOD uses.", explanation: "Incorrect. The default applicability is not limited to those two declaration kinds."}
      - {id: B, answer: "All declaration contexts defined by Java's rule, but not type contexts by default.", explanation: "Correct. A type use requires a contract that permits TYPE_USE."}
      - {id: C, answer: "Every syntactic location, including TYPE_USE.", explanation: "Incorrect. Omitting @Target does not mean every syntax location."}
      - {id: D, answer: "No direct annotation context at all.", explanation: "Incorrect. An empty target, @Target({}), is what makes an annotation have no valid direct annotation context."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.Target/Target.md", anchor: "elementtype-targets"}
    apiRelated: {controller: "MetaAnnotationController", methodSignature: "inspectTargets()"}

  - id: type-use-annotation
    question: "Which example correctly illustrates the difference between TYPE_PARAMETER and TYPE_USE?"
    answers:
      - {id: A, answer: "class Box<@Rule T> describes the declaration of T; List<@Rule T> describes a use of type T.", explanation: "Correct. These are different semantic locations even though the @ syntax looks similar."}
      - {id: B, answer: "Both are always declaration annotations and therefore use identical runtime lookup APIs.", explanation: "Incorrect. Runtime-visible type-use metadata is exposed through the AnnotatedType family."}
      - {id: C, answer: "TYPE_USE applies only to type-parameter declarations.", explanation: "Incorrect. TYPE_USE also covers casts, generic arguments, return types, array contexts, and more."}
      - {id: D, answer: "TYPE_PARAMETER is only an older alias for TYPE_USE.", explanation: "Incorrect. They are distinct ElementType values."}
    correctAnswerId: A
    aiGenerated: true
