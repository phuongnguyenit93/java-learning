# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: exception-error-vs-exception
    question: "Which statement best describes Error compared with Exception?"
    answers:
      - {id: A, answer: "Error generally represents serious JVM/environment failures that ordinary application code is not expected to recover from routinely.", explanation: "Correct. Throwable has Error and Exception branches with different intended recovery semantics."}
      - {id: B, answer: "Error is a checked subclass of IOException.", explanation: "Incorrect. Throwable has Error and Exception branches with different intended recovery semantics."}
      - {id: C, answer: "Error must always be caught before Exception.", explanation: "Incorrect. Throwable has Error and Exception branches with different intended recovery semantics."}
      - {id: D, answer: "Exception can never represent programming bugs.", explanation: "Incorrect. Throwable has Error and Exception branches with different intended recovery semantics."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Throwable/Throwable.md", anchor: "error-vs-exception"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: exception-checked-contract
    question: "What makes a checked exception part of a method compile-time contract?"
    answers:
      - {id: A, answer: "The JVM automatically retries it.", explanation: "Incorrect. Checked exceptions participate in compile-time handling/declaration rules."}
      - {id: B, answer: "The method must catch it or declare it with throws unless control-flow analysis proves it cannot escape.", explanation: "Correct. Checked exceptions participate in compile-time handling/declaration rules."}
      - {id: C, answer: "It is always a subclass of RuntimeException.", explanation: "Incorrect. Checked exceptions participate in compile-time handling/declaration rules."}
      - {id: D, answer: "It can only occur in constructors.", explanation: "Incorrect. Checked exceptions participate in compile-time handling/declaration rules."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.CheckedUnchecked/CheckedUnchecked.md", anchor: "checked-exception"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: exception-throw-vs-throws
    question: "What is the difference between throw and throws?"
    answers:
      - {id: A, answer: "throw declares a method signature while throws creates the object.", explanation: "Incorrect. One is an executable statement, the other is a method/constructor declaration clause."}
      - {id: B, answer: "They are interchangeable keywords.", explanation: "Incorrect. One is an executable statement, the other is a method/constructor declaration clause."}
      - {id: C, answer: "throw transfers control by throwing one Throwable value; throws declares exception types that a method may let escape.", explanation: "Correct. One is an executable statement, the other is a method/constructor declaration clause."}
      - {id: D, answer: "throws catches exceptions automatically.", explanation: "Incorrect. One is an executable statement, the other is a method/constructor declaration clause."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ThrowThrows/ThrowThrows.md", anchor: "throws-clause"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: exception-override-checked-narrow
    question: "A parent method declares throws IOException. Which checked-exception declaration is valid for an overriding child method?"
    answers:
      - {id: A, answer: "It must declare exactly IOException and nothing else.", explanation: "Incorrect. An override cannot broaden the checked-exception obligation imposed on callers by the parent contract."}
      - {id: B, answer: "It may always broaden to Throwable.", explanation: "Incorrect. An override cannot broaden the checked-exception obligation imposed on callers by the parent contract."}
      - {id: C, answer: "It cannot declare any unchecked exception.", explanation: "Incorrect. An override cannot broaden the checked-exception obligation imposed on callers by the parent contract."}
      - {id: D, answer: "It may declare IOException, a subtype such as FileNotFoundException, or no checked exception, but not broaden to Exception.", explanation: "Correct. An override cannot broaden the checked-exception obligation imposed on callers by the parent contract."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ThrowThrows/ThrowThrows.md", anchor: "override-throws-rules"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: exception-propagation-unwind
    question: "What happens when a thrown exception is not caught in the current method?"
    answers:
      - {id: A, answer: "The current call unwinds and the exception propagates to callers until a compatible handler is found or the thread terminates.", explanation: "Correct. Exception propagation follows the call stack and compatible catch selection."}
      - {id: B, answer: "Execution resumes at the next statement automatically.", explanation: "Incorrect. Exception propagation follows the call stack and compatible catch selection."}
      - {id: C, answer: "The exception is converted to null.", explanation: "Incorrect. Exception propagation follows the call stack and compatible catch selection."}
      - {id: D, answer: "The JVM always restarts the method.", explanation: "Incorrect. Exception propagation follows the call stack and compatible catch selection."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Propagation/Propagation.md", anchor: "exception-propagation"}
    apiRelated: {controller: "PropagationController", methodSignature: "propagate()"}

  - id: exception-preserve-cause
    question: "When translating a low-level exception into a higher-level exception, why should the cause usually be preserved?"
    answers:
      - {id: A, answer: "It prevents the new exception from being thrown.", explanation: "Incorrect. Exception chaining preserves causality without leaking the low-level type as the public abstraction."}
      - {id: B, answer: "It keeps the original failure chain and diagnostic context while allowing the abstraction boundary to expose a more meaningful exception type.", explanation: "Correct. Exception chaining preserves causality without leaking the low-level type as the public abstraction."}
      - {id: C, answer: "It guarantees automatic recovery.", explanation: "Incorrect. Exception chaining preserves causality without leaking the low-level type as the public abstraction."}
      - {id: D, answer: "It hides every stack frame permanently.", explanation: "Incorrect. Exception chaining preserves causality without leaking the low-level type as the public abstraction."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Propagation/Propagation.md", anchor: "exception-chaining"}
    apiRelated: {controller: "PropagationController", methodSignature: "wrapCause()"}

  - id: exception-finally-return-risk
    question: "Why is returning from a finally block dangerous?"
    answers:
      - {id: A, answer: "finally is skipped whenever return appears in try.", explanation: "Incorrect. finally executes during normal and exceptional exit, so its own abrupt completion can replace the earlier one."}
      - {id: B, answer: "A return in finally is a compile-time error in every Java version.", explanation: "Incorrect. finally executes during normal and exceptional exit, so its own abrupt completion can replace the earlier one."}
      - {id: C, answer: "It can override a return value or suppress an exception already propagating from try/catch, hiding the real outcome.", explanation: "Correct. finally executes during normal and exceptional exit, so its own abrupt completion can replace the earlier one."}
      - {id: D, answer: "It only changes logging output.", explanation: "Incorrect. finally executes during normal and exceptional exit, so its own abrupt completion can replace the earlier one."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.TryCatchFinally/TryCatchFinally.md", anchor: "return-finally"}
    apiRelated: {controller: "FinallyController", methodSignature: "returnInteraction()"}

  - id: exception-resource-close-order
    question: "In try-with-resources with resources r1 then r2, in what order are they closed?"
    answers:
      - {id: A, answer: "Declaration order: r1 then r2.", explanation: "Incorrect. Try-with-resources closes initialized resources in reverse order."}
      - {id: B, answer: "The order is random.", explanation: "Incorrect. Try-with-resources closes initialized resources in reverse order."}
      - {id: C, answer: "Resources are never closed when the body throws.", explanation: "Incorrect. Try-with-resources closes initialized resources in reverse order."}
      - {id: D, answer: "Reverse declaration order: r2 closes before r1.", explanation: "Correct. Try-with-resources closes initialized resources in reverse order."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.TryWithResources/TryWithResources.md", anchor: "resource-close-order"}
    apiRelated: {controller: "ResourceController", methodSignature: "closeOrder()"}

  - id: exception-suppressed-primary
    question: "The try body throws A and close() then throws B. Under try-with-resources, which exception is normally primary?"
    answers:
      - {id: A, answer: "A remains primary and B is attached as a suppressed exception.", explanation: "Correct. Suppression preserves the body failure while retaining close failures for diagnostics."}
      - {id: B, answer: "B replaces A and A is discarded.", explanation: "Incorrect. Suppression preserves the body failure while retaining close failures for diagnostics."}
      - {id: C, answer: "Both are converted to Error.", explanation: "Incorrect. Suppression preserves the body failure while retaining close failures for diagnostics."}
      - {id: D, answer: "Neither is observable.", explanation: "Incorrect. Suppression preserves the body failure while retaining close failures for diagnostics."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.SuppressedException/SuppressedException.md", anchor: "primary-vs-suppressed"}
    apiRelated: {controller: "ResourceController", methodSignature: "suppressed()"}

  - id: exception-custom-context
    question: "What makes a custom exception useful instead of just creating another class name?"
    answers:
      - {id: A, answer: "It should always discard the original cause.", explanation: "Incorrect. Custom exceptions add value when they improve the caller-facing failure contract and diagnostics."}
      - {id: B, answer: "It should communicate a meaningful abstraction/domain failure and preserve relevant context and cause.", explanation: "Correct. Custom exceptions add value when they improve the caller-facing failure contract and diagnostics."}
      - {id: C, answer: "It should contain every local variable in the process.", explanation: "Incorrect. Custom exceptions add value when they improve the caller-facing failure contract and diagnostics."}
      - {id: D, answer: "It must always extend Error.", explanation: "Incorrect. Custom exceptions add value when they improve the caller-facing failure contract and diagnostics."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.CustomException/CustomException.md", anchor: "exception-context"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: exception-boundary-translation
    question: "Where is exception translation most useful?"
    answers:
      - {id: A, answer: "At every method call regardless of meaning.", explanation: "Incorrect. Translation should express a real abstraction change, not create wrapper noise."}
      - {id: B, answer: "Only inside static initializers.", explanation: "Incorrect. Translation should express a real abstraction change, not create wrapper noise."}
      - {id: C, answer: "At an abstraction boundary where low-level implementation failures should become a stable higher-level contract while preserving the cause.", explanation: "Correct. Translation should express a real abstraction change, not create wrapper noise."}
      - {id: D, answer: "Only after logging the same exception in every layer.", explanation: "Incorrect. Translation should express a real abstraction change, not create wrapper noise."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.ExceptionDesign/ExceptionDesign.md", anchor: "exception-boundaries"}
    apiRelated: {controller: "ExceptionDesignController", methodSignature: "translateBoundary()"}

  - id: exception-swallowing
    question: "Why is catching Exception and doing nothing usually a serious design bug?"
    answers:
      - {id: A, answer: "It makes checked exceptions become compile errors.", explanation: "Incorrect. A handler must recover, translate, add context, or deliberately terminate; silently swallowing loses the signal."}
      - {id: B, answer: "It forces the JVM to shut down immediately.", explanation: "Incorrect. A handler must recover, translate, add context, or deliberately terminate; silently swallowing loses the signal."}
      - {id: C, answer: "It automatically retries the operation forever.", explanation: "Incorrect. A handler must recover, translate, add context, or deliberately terminate; silently swallowing loses the signal."}
      - {id: D, answer: "It destroys failure visibility and may let execution continue with an invalid assumption or partial state.", explanation: "Correct. A handler must recover, translate, add context, or deliberately terminate; silently swallowing loses the signal."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.ExceptionDesign/ExceptionDesign.md", anchor: "do-not-swallow"}
    apiRelated: {controller: "", methodSignature: ""}
