questions:
  - question: "How do you decide between a checked and unchecked exception in an API?"
    answer: "Base the choice on the caller contract, not a blanket rule. Checked exceptions can force explicit handling of expected recoverable conditions; unchecked exceptions fit programming errors or failures callers cannot reasonably recover from locally. Keep the abstraction stable and document recovery expectations."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.CheckedUnchecked/CheckedUnchecked.md", anchor: "checked-vs-unchecked-design"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Explain the checked-exception rule for overriding methods and why Java imposes it."
    answer: "An overriding method may keep, narrow, or remove checked exceptions declared by the parent method, but cannot broaden them. Code compiled against the parent contract must not suddenly be forced to handle a wider checked exception when a subtype is substituted."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ThrowThrows/ThrowThrows.md", anchor: "override-throws-rules"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Describe exception propagation and stack unwinding from the throw site to a handler."
    answer: "Throwing abruptly completes the current expression/method path. The runtime searches outward through call frames for the first compatible catch. Frames in between unwind, running required cleanup/finally/TWR logic. If no handler is found, the exception terminates the thread."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Propagation/Propagation.md", anchor: "exception-propagation"}
    apiRelated: {controller: "PropagationController", methodSignature: "propagate()"}

  - question: "Why is exception chaining important when translating failures across layers?"
    answer: "The outer exception can speak the vocabulary of the higher abstraction while the cause retains the original technical failure, stack trace, and diagnostic chain. Without the cause, debugging often loses the event that actually initiated the failure."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Propagation/Propagation.md", anchor: "exception-chaining"}
    apiRelated: {controller: "PropagationController", methodSignature: "wrapCause()"}

  - question: "What are the control-flow hazards of return or throw inside finally?"
    answer: "finally runs while normal return or an exception may already be pending. If finally itself returns or throws, that abrupt completion can replace the earlier return/exception, causing lost results or lost failures. Cleanup should normally avoid changing the primary outcome."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.TryCatchFinally/TryCatchFinally.md", anchor: "return-finally"}
    apiRelated: {controller: "FinallyController", methodSignature: "returnInteraction()"}

  - question: "How does try-with-resources preserve both a body failure and a close failure?"
    answer: "The exception from the try body remains primary. Exceptions thrown while closing resources are attached through addSuppressed and can be inspected with getSuppressed. Resources are closed in reverse declaration order."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.SuppressedException/SuppressedException.md", anchor: "primary-vs-suppressed"}
    apiRelated: {controller: "ResourceController", methodSignature: "suppressed()"}

  - question: "What does it mean to translate exceptions at an abstraction boundary?"
    answer: "A layer catches an implementation-specific failure and throws an exception meaningful to its own callers, preserving the cause and useful context. Translation should happen where the vocabulary/contract changes, not mechanically in every method."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.ExceptionDesign/ExceptionDesign.md", anchor: "exception-boundaries"}
    apiRelated: {controller: "ExceptionDesignController", methodSignature: "translateBoundary()"}

  - question: "Why is logging the same exception in every layer a problem, and where should logging usually happen?"
    answer: "Repeated logging duplicates stack traces without adding meaning and obscures the event flow. Lower layers should add context or translate when needed; log at a boundary that owns the failure outcome, unless a lower layer has unique evidence it must record once."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.ExceptionDesign/ExceptionDesign.md", anchor: "logging-boundary"}
    apiRelated: {controller: "", methodSignature: ""}
