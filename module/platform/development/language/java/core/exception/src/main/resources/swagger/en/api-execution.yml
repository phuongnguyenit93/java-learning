      try(DemoResource r=new DemoResource(&quot;R&quot;,trace,true)){trace.add(&quot;body-fails&quot;);throw
      new IllegalArgumentException(&quot;primary&quot;);}catch(Exception e){return
      Map.of(&quot;primary&quot;,e.getClass().getSimpleName(),&quot;message&quot;,e.getMessage(),&quot;suppressed&quot;,Arrays.stream(e.getSuppressed()).map(x-&gt;x.getClass().getSimpleName()+&quot;:&quot;+x.getMessage()).toList(),&quot;trace&quot;,trace);}
