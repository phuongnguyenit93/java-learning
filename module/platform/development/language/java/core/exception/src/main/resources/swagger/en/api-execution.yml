  suppressed():
    execution: '<p><strong>Concept:</strong> Primary vs suppressed exception.</p><ol><li>The
      endpoint runs a bounded deterministic example inside <code>ResourceController#suppressed()</code>.</li><li>Primary
      body failure plus close failure and getSuppressed.<pre><code>@GetMapping(&quot;/suppressed&quot;)
