      - {id: B, answer: "Method phải catch hoặc declare bằng throws nếu exception có thể escape theo control-flow analysis.", explanation: "Đúng. Checked exception tham gia compile-time rule về handling/declaration."}
      - {id: C, answer: "Nó luôn là subclass của RuntimeException.", explanation: "Sai. Checked exception tham gia compile-time rule về handling/declaration."}
      - {id: D, answer: "Nó chỉ có thể xảy ra trong constructor.", explanation: "Sai. Checked exception tham gia compile-time rule về handling/declaration."}
