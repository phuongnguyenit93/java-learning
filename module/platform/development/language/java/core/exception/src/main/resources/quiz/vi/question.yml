  - id: exception-swallowing
    question: "Vì sao catch Exception rồi không làm gì thường là design bug nghiêm trọng?"
    answers:
      - {id: A, answer: "Nó biến checked exception thành compile error.", explanation: "Sai. Handler phải recover, translate, thêm context hoặc terminate có chủ đích; swallow im lặng làm mất signal."}
