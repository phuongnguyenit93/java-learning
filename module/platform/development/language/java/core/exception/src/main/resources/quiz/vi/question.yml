questions:
  - id: exception-error-vs-exception
    question: "Phát biểu nào mô tả đúng Error so với Exception?"
    answers:
      - {id: A, answer: "Error thường biểu diễn lỗi nghiêm trọng của JVM/environment mà application code thông thường không được kỳ vọng recover thường xuyên.", explanation: "Đúng. Throwable có hai nhánh Error và Exception với recovery semantics khác nhau."}
      - {id: B, answer: "Error là checked subclass của IOException.", explanation: "Sai. Throwable có hai nhánh Error và Exception với recovery semantics khác nhau."}
      - {id: C, answer: "Error luôn phải catch trước Exception.", explanation: "Sai. Throwable có hai nhánh Error và Exception với recovery semantics khác nhau."}
      - {id: D, answer: "Exception không bao giờ biểu diễn programming bug.", explanation: "Sai. Throwable có hai nhánh Error và Exception với recovery semantics khác nhau."}
    correctAnswerId: A
