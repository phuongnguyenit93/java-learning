  - id: exception-override-checked-narrow
    question: "Parent method declare throws IOException. Checked-exception declaration nào hợp lệ cho overriding child method?"
    answers:
      - {id: A, answer: "Bắt buộc declare đúng IOException và không được khác.", explanation: "Sai. Override không được broaden checked-exception obligation mà parent contract áp lên caller."}
      - {id: B, answer: "Luôn có thể broaden thành Throwable.", explanation: "Sai. Override không được broaden checked-exception obligation mà parent contract áp lên caller."}
      - {id: C, answer: "Không được declare bất kỳ unchecked exception nào.", explanation: "Sai. Override không được broaden checked-exception obligation mà parent contract áp lên caller."}
      - {id: D, answer: "Có thể declare IOException, subtype như FileNotFoundException, hoặc bỏ checked exception, nhưng không được broaden thành Exception.", explanation: "Đúng. Override không được broaden checked-exception obligation mà parent contract áp lên caller."}
