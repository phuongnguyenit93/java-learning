  - id: exception-throw-vs-throws
    question: "Khác biệt giữa throw và throws là gì?"
    answers:
      - {id: A, answer: "throw khai báo method signature còn throws tạo object.", explanation: "Sai. Một cái là executable statement, cái kia là declaration clause của method/constructor."}
      - {id: B, answer: "Hai keyword hoàn toàn thay thế nhau.", explanation: "Sai. Một cái là executable statement, cái kia là declaration clause của method/constructor."}
      - {id: C, answer: "throw chuyển control bằng cách ném một Throwable value; throws khai báo exception type mà method có thể để escape.", explanation: "Đúng. Một cái là executable statement, cái kia là declaration clause của method/constructor."}
      - {id: D, answer: "throws tự động catch exception.", explanation: "Sai. Một cái là executable statement, cái kia là declaration clause của method/constructor."}
