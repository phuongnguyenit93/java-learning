questions:
  - question: "Giải thích integer overflow trong Java và cách xử lý counter không được phép overflow."
    answer: "Primitive integer arithmetic wrap ở fixed-width boundary. Nếu overflow vi phạm contract, validate bound hoặc dùng Math exact helper hay type rộng/arbitrary-precision để failure explicit."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.IntegerOverflow/IntegerOverflow.md", anchor: "integer-overflow-wraparound"}
    apiRelated: {controller: "IntegerArithmeticController", methodSignature: "overflow()"}

  - question: "Vì sao chiến lược so sánh floating-point phải phụ thuộc domain?"
    answer: "Computed binary floating value thường có representation error. Exact equality đúng cho exact binary contract, còn measurement thường cần absolute hoặc relative tolerance theo scale và error requirement; không có universal epsilon."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.FloatingPoint/FloatingPoint.md", anchor: "floating-point-comparison"}
    apiRelated: {controller: "FloatingPointController", methodSignature: "comparison()"}

  - question: "So sánh `new BigDecimal(\"0.1\")`, `BigDecimal.valueOf(0.1)` và `new BigDecimal(0.1)`."
    answer: "String form biểu diễn exact decimal 0.1. valueOf dùng canonical String representation của double và thường giữ intent decimal. Double constructor capture exact binary double value nên lộ approximation."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.BigDecimal/BigDecimal.md", anchor: "big-decimal-construction"}
    apiRelated: {controller: "BigDecimalController", methodSignature: "construction()"}

  - question: "Giải thích khác biệt giữa BigDecimal precision, scale và MathContext."
    answer: "Precision đếm significant digit; scale xác định decimal positioning. MathContext cung cấp operation precision cộng rounding mode. Set scale không giống limit significant-digit precision."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.PrecisionScale/PrecisionScale.md", anchor: "precision-vs-scale"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao BigDecimal có thể behavior khác nhau giữa HashSet và TreeSet?"
    answer: "BigDecimal.equals tính scale, còn compareTo xét numerical magnitude. HashSet dùng equals và hashCode nên có thể giữ 1.0 và 1.00 riêng; TreeSet natural ordering có thể xem chúng cùng ordering key."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.BigDecimalComparison/BigDecimalComparison.md", anchor: "big-decimal-collections"}
    apiRelated: {controller: "BigDecimalController", methodSignature: "collectionSemantics()"}

  - question: "Vì sao round mọi intermediate monetary result có thể khác round một lần ở business boundary?"
    answer: "Mỗi lần round đều discard information. Round lặp làm input cho bước sau thay đổi nên final total có thể khác. Domain phải định nghĩa cả thời điểm rounding chứ không chỉ mode."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.Rounding/Rounding.md", anchor: "rounding-at-boundaries"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Khác biệt concept giữa pseudo-random reproducible và security randomness là gì?"
    answer: "PRNG thường deterministic từ seed và state, hữu ích cho test và simulation. Security randomness cần computational unpredictability trước attacker và nên dùng SecureRandom với entropy/provider phù hợp."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.Random/Random.md", anchor: "pseudo-random-model"}
    apiRelated: {controller: "RandomController", methodSignature: "seededSequence()"}

  - question: "Numbers module nên dừng ở đâu khi dạy SecureRandom?"
    answer: "Nó nên chốt khi nào unpredictability cần SecureRandom và mental model entropy/seeding cơ bản. Key generation, IV/nonce, signature, encryption và provider policy thuộc security-cryptography module."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "11.SecureRandom/SecureRandom.md", anchor: "security-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Bạn chọn giữa `int`, `long`, `double`, `BigInteger` và `BigDecimal` theo framework nào thay vì chọn theo thói quen?"
    answer: "Bắt đầu từ domain contract: có fractional value không, có cần exact decimal semantics không, range tối đa là gì, overflow/rounding có được phép không, rồi mới xét performance và memory. int/long hợp fixed-width integer; double hợp approximate scientific/measurement work; BigInteger giải quyết integer range; BigDecimal giải quyết explicit decimal semantics và rounding policy."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.NumericModel/NumericModel.md", anchor: "numeric-type-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao `long total = quantity * unitPrice` vẫn có thể sai nếu cả hai operand là `int`?"
    answer: "Java xác định type của expression trước assignment. int * int chạy bằng int, có thể overflow, rồi value đã sai mới widen sang long. Muốn phép nhân chạy bằng long phải widen một operand trước arithmetic, ví dụ cast quantity sang long trước phép nhân."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.NumericModel/NumericModel.md", anchor: "numeric-conversions"}
    apiRelated: {controller: "IntegerArithmeticController", methodSignature: "intermediateOverflow()"}

  - question: "Tại sao `Integer.MIN_VALUE` tạo ra các edge case như `Math.abs(MIN_VALUE)` và `MIN_VALUE / -1`?"
    answer: "Two's-complement int có một negative value nhiều hơn positive side, nên +2147483648 không represent được. Vì vậy ordinary Math.abs và phép chia MIN_VALUE / -1 đều overflow về MIN_VALUE thay vì tạo positive result ngoài int range."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.IntegerOverflow/IntegerOverflow.md", anchor: "boundary-values"}
    apiRelated: {controller: "IntegerArithmeticController", methodSignature: "boundaryCases()"}

  - question: "NaN, infinity và signed zero khác ordinary floating value ở điểm nào và code production nên xử lý ra sao?"
    answer: "NaN không bằng chính nó nên phải dùng isNaN; infinity có thể xuất hiện từ overflow hoặc floating division by zero; +0.0 và -0.0 bằng nhau với == nhưng sign vẫn ảnh hưởng arithmetic như reciprocal. Code nên kiểm tra isNaN/isFinite khi domain không cho phép special values thay vì giả định mọi double là finite number thông thường."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.FloatingPoint/FloatingPoint.md", anchor: "nan-infinity-negative-zero"}
    apiRelated: {controller: "FloatingPointController", methodSignature: "specialValues()"}

  - question: "Khi nào bạn dùng `BigInteger` thay `long`, và boundary nào vẫn phải cẩn thận sau khi đã dùng BigInteger?"
    answer: "Dùng BigInteger khi legitimate integer range có thể vượt long và arbitrary precision đáng với allocation/arithmetic cost. BigInteger không giải quyết decimal fraction, và conversion ngược về int/long vẫn là narrowing boundary: intValue/longValue có thể mất bits còn exact variants throw nếu không fit. Với number-theory code còn phải phân biệt remainder với mod."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.BigInteger/BigInteger.md", anchor: "big-integer-operations"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao chuyển sang BigDecimal sau khi đã tính bằng `double` không tự sửa được lỗi decimal semantics?"
    answer: "BigDecimal chỉ nhận value tại thời điểm construction. Nếu 0.1 + 0.2 đã chạy bằng binary floating point thì approximation đã trở thành input, ví dụ 0.30000000000000004. BigDecimal.valueOf có thể biểu diễn decimal string của value đó nhưng không biết intent ban đầu là 0.3; exact decimal workflow phải giữ pipeline decimal từ đầu."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.BigDecimal/BigDecimal.md", anchor: "big-decimal-construction"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "BigDecimal arithmetic ảnh hưởng scale như thế nào, và vì sao domain vẫn cần output-scale policy riêng?"
    answer: "Không dùng MathContext, add/subtract thường có preferred scale bằng max hai scale, multiply cộng hai scale, divide bắt đầu từ scale trái trừ scale phải nhưng exact quotient có thể cần scale lớn hơn. Các rule này là arithmetic representation semantics, không phải business rule; currency/tax/API boundary vẫn phải quyết định scale cuối và rounding một cách explicit."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.BigDecimal/BigDecimal.md", anchor: "big-decimal-arithmetic"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Khi nào nên dùng `setScale` và khi nào nên dùng `MathContext`?"
    answer: "setScale phù hợp khi contract nói về decimal places hoặc unit scale của result, ví dụ amount cần 2 decimals. MathContext giới hạn total significant-digit precision của arithmetic và đi kèm rounding mode. Hai API có thể cho hình dạng result rất khác; chọn chúng theo policy muốn kiểm soát, không dùng thay thế nhau."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.PrecisionScale/PrecisionScale.md", anchor: "math-context"}
    apiRelated: {controller: "BigDecimalController", methodSignature: "mathContextVsScale()"}

  - question: "Giải thích `HALF_UP`, `HALF_DOWN` và `HALF_EVEN` ở tie, đặc biệt với số âm."
    answer: "Các HALF mode đều chọn nearest candidate khi không tie. Ở tie, HALF_UP đi xa zero, HALF_DOWN đi về zero, còn HALF_EVEN chọn neighbor có digit chẵn. Vì vậy với -2.5, HALF_UP cho -3 còn HALF_DOWN và HALF_EVEN cho -2; từ UP/DOWN ở đây phải hiểu theo hướng so với zero, không phải theo trục số dương."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.Rounding/Rounding.md", anchor: "rounding-modes"}
    apiRelated: {controller: "BigDecimalController", methodSignature: "roundingModes()"}

  - question: "Nếu BigDecimal là domain key, bạn sẽ thiết kế equality/normalization policy thế nào để tránh surprise giữa HashSet, TreeSet và persistence?"
    answer: "Trước tiên quyết định identity dựa trên representation gồm scale hay numerical quantity. Nếu quantity là identity, có thể normalize tại boundary hoặc dùng comparison/canonical representation nhất quán; nếu scale mang nghĩa domain thì không được silently strip. Quan trọng là equals/hashCode, ordering, serialization/persistence và collection usage phải cùng một policy thay vì normalize ad hoc."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.BigDecimalComparison/BigDecimalComparison.md", anchor: "big-decimal-collections"}
    apiRelated: {controller: "BigDecimalController", methodSignature: "collectionSemantics()"}

  - question: "Phân biệt vai trò của `Random`, `ThreadLocalRandom`, `RandomGenerator` và `SecureRandom` trong Java 21."
    answer: "Random là ordinary deterministic PRNG và fixed seed hữu ích cho reproducibility. ThreadLocalRandom giảm contention cho ordinary randomness trong concurrent code. RandomGenerator là abstraction có sẵn trên Java 21 baseline cho nhiều generator algorithm, giúp tách API khỏi implementation choice. SecureRandom có security contract về computational unpredictability và entropy; nó không phải lựa chọn mặc định cho simulation/test chỉ vì mạnh hơn."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.Random/Random.md", anchor: "threadlocal-random-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Giải thích nuance của `SecureRandom.setSeed` và vì sao timestamp không nên là primary entropy source."
    answer: "setSeed supplements existing seed/state chứ không có simple reset semantics như Random. Với một PRNG SecureRandom mới, nếu caller chủ động setSeed trước automatic self-seeding đầu tiên thì caller phải bảo đảm input có đủ entropy. Timestamp có không gian dự đoán nhỏ và không đáp ứng property đó; default provider-managed seeding thường là lựa chọn application an toàn hơn, còn getInstanceStrong chỉ dùng khi requirement thực sự cần."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "11.SecureRandom/SecureRandom.md", anchor: "entropy-seeding"}
    apiRelated: {controller: "", methodSignature: ""}
