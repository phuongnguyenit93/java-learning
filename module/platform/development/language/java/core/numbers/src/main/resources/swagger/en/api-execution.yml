  divisionAndRounding():
    execution: '<p><strong>Concept:</strong> RoundingMode semantics.</p><ol><li>The
      endpoint runs a bounded deterministic example inside <code>BigDecimalController#divisionAndRounding()</code>.</li><li>Show
      non-terminating division failure and explicit rounding.<pre><code>@GetMapping(&quot;/division-rounding&quot;)
      public Map&lt;String,Object&gt; divisionAndRounding(){ Map&lt;String,Object&gt;
      r=new LinkedHashMap&lt;&gt;(); try{ BigDecimal.ONE.divide(new BigDecimal(&quot;3&quot;));
      }catch(ArithmeticException e){r.put(&quot;exactDivisionFailure&quot;,e.getClass().getSimpleName());}
      r.put(&quot;rounded&quot;,BigDecimal.ONE.divide(new BigDecimal(&quot;3&quot;),4,RoundingMode.HALF_UP).toString());
      return r; }</code></pre></li><li>Inspect the response fields together: they
