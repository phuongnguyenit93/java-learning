# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: integer-overflow-wrap
    question: "What does `Integer.MAX_VALUE + 1` do in ordinary Java int arithmetic?"
    answers:
      - {id: A, answer: "It wraps to Integer.MIN_VALUE without automatically throwing.", explanation: "Correct. Primitive integer overflow wraps according to fixed-width signed integer semantics unless an exact helper is used."}
      - {id: B, answer: "It becomes a long automatically.", explanation: "Incorrect. Primitive integer overflow wraps according to fixed-width signed integer semantics unless an exact helper is used."}
      - {id: C, answer: "It throws ArithmeticException automatically.", explanation: "Incorrect. Primitive integer overflow wraps according to fixed-width signed integer semantics unless an exact helper is used."}
      - {id: D, answer: "It saturates at Integer.MAX_VALUE.", explanation: "Incorrect. Primitive integer overflow wraps according to fixed-width signed integer semantics unless an exact helper is used."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.IntegerOverflow/IntegerOverflow.md", anchor: "integer-overflow-wraparound"}
    apiRelated: {controller: "IntegerArithmeticController", methodSignature: "overflow()"}

  - id: integer-add-exact
    question: "When is `Math.addExact` preferable to ordinary `+` for ints?"
    answers:
      - {id: A, answer: "When all operands are floating point.", explanation: "Incorrect. The exact helpers throw ArithmeticException when the result cannot be represented."}
      - {id: B, answer: "When overflow must be detected instead of silently wrapping.", explanation: "Correct. The exact helpers throw ArithmeticException when the result cannot be represented."}
      - {id: C, answer: "When overflow should clamp to MAX_VALUE.", explanation: "Incorrect. The exact helpers throw ArithmeticException when the result cannot be represented."}
      - {id: D, answer: "Only when using BigDecimal.", explanation: "Incorrect. The exact helpers throw ArithmeticException when the result cannot be represented."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.IntegerOverflow/IntegerOverflow.md", anchor: "checked-arithmetic"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: floating-decimal-approx
    question: "Why can `0.1 + 0.2` differ from exact decimal 0.3?"
    answers:
      - {id: A, answer: "The JVM randomly perturbs double values.", explanation: "Incorrect. IEEE 754 binary floating point represents many decimal fractions approximately."}
      - {id: B, answer: "Addition uses String conversion internally.", explanation: "Incorrect. IEEE 754 binary floating point represents many decimal fractions approximately."}
      - {id: C, answer: "Most decimal fractions do not have finite binary floating-point representations, so operations use nearby representable values.", explanation: "Correct. IEEE 754 binary floating point represents many decimal fractions approximately."}
      - {id: D, answer: "double stores decimal digits exactly but println changes them.", explanation: "Incorrect. IEEE 754 binary floating point represents many decimal fractions approximately."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.FloatingPoint/FloatingPoint.md", anchor: "precision-rounding-error"}
    apiRelated: {controller: "FloatingPointController", methodSignature: "precision()"}

  - id: nan-comparison
    question: "What is the correct way to test whether a double is NaN?"
    answers:
      - {id: A, answer: "Use `value == Double.NaN`.", explanation: "Incorrect. NaN is unordered and even `NaN == NaN` is false."}
      - {id: B, answer: "Use `value > Double.MAX_VALUE`.", explanation: "Incorrect. NaN is unordered and even `NaN == NaN` is false."}
      - {id: C, answer: "Use `value == null`.", explanation: "Incorrect. NaN is unordered and even `NaN == NaN` is false."}
      - {id: D, answer: "Use `Double.isNaN(value)`, not equality with `Double.NaN`.", explanation: "Correct. NaN is unordered and even `NaN == NaN` is false."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.FloatingPoint/FloatingPoint.md", anchor: "nan-infinity-negative-zero"}
    apiRelated: {controller: "FloatingPointController", methodSignature: "specialValues()"}

  - id: biginteger-immutable
    question: "What happens if `a.add(BigInteger.ONE)` is called and the return value is ignored?"
    answers:
