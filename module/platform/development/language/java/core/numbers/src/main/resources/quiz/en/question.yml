      - {id: B, answer: "It returns positive infinity.", explanation: "Incorrect. BigDecimal division is exact unless a precision or rounding policy is supplied."}
      - {id: C, answer: "It throws ArithmeticException because the decimal expansion is non-terminating.", explanation: "Correct. BigDecimal division is exact unless a precision or rounding policy is supplied."}
      - {id: D, answer: "It converts to double automatically.", explanation: "Incorrect. BigDecimal division is exact unless a precision or rounding policy is supplied."}
