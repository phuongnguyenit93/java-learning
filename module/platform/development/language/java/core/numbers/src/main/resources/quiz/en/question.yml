      - {id: B, answer: "a increments in place.", explanation: "Incorrect. BigInteger operations never mutate the receiver."}
      - {id: C, answer: "The JVM mutates a only when it is final.", explanation: "Incorrect. BigInteger operations never mutate the receiver."}
      - {id: D, answer: "The call is illegal because BigInteger has no add method.", explanation: "Incorrect. BigInteger operations never mutate the receiver."}
