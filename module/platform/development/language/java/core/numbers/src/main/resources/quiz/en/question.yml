  - id: precision-vs-scale
    question: "For `new BigDecimal(\"123.4500\")`, what do precision and scale describe?"
    answers:
      - {id: A, answer: "Both always equal the number of digits after the decimal point.", explanation: "Incorrect. Precision and scale are distinct representation properties and should not be conflated."}
      - {id: B, answer: "Precision is always 2 for money.", explanation: "Incorrect. Precision and scale are distinct representation properties and should not be conflated."}
      - {id: C, answer: "Scale is the number of bytes used in memory.", explanation: "Incorrect. Precision and scale are distinct representation properties and should not be conflated."}
      - {id: D, answer: "Precision counts significant digits; scale records decimal-place positioning, which is 4 here.", explanation: "Correct. Precision and scale are distinct representation properties and should not be conflated."}
