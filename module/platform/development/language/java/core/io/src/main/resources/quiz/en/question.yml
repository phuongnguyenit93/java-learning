  - id: io-q02
    question: "When copying a PNG image, which abstraction best preserves the data semantics?"
    answers:
      - {id: A, answer: "Reader/Writer, because they process data at a higher level.", explanation: "Incorrect. PNG is binary data; decoding it as characters can change the bytes."}
      - {id: B, answer: "String, because every kind of data can ultimately be converted to text.", explanation: "Incorrect. Forcing binary data into text introduces an encoding contract that the image format does not have."}
      - {id: C, answer: "PrintWriter, because it can print each byte.", explanation: "Incorrect. PrintWriter is a character/text-oriented API and also has its own error semantics."}
      - {id: D, answer: "InputStream/OutputStream or a Channel, so the payload stays as raw bytes.", explanation: "Correct. Binary payloads should stay in byte-oriented abstractions unless the format itself defines text."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.MentalModel/MentalModel.md", anchor: "bytes-vs-characters"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: io-q03
    question: "What is the core distinction of non-blocking I/O?"
    answers:
      - {id: A, answer: "A call may return without making progress, while the program organizes readiness and retry later.", explanation: "Correct. Non-blocking changes how waiting is organized; it does not remove latency from external resources."}
      - {id: B, answer: "Disk and network operations no longer have latency.", explanation: "Incorrect. Physical latency still exists."}
      - {id: C, answer: "Every operation always runs on a newly created thread.", explanation: "Incorrect. Non-blocking does not mean one new thread is automatically created per operation."}
      - {id: D, answer: "Every operation always completes the entire payload in one call.", explanation: "Incorrect. Partial progress or no progress can still occur depending on the API."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.MentalModel/MentalModel.md", anchor: "blocking-io-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: io-q04
    question: "Why is try-with-resources important for I/O even though Java has a garbage collector?"
    answers:
      - {id: A, answer: "Because the garbage collector never reclaims any I/O object.", explanation: "Incorrect. GC still manages Java objects, but external resources have their own lifetime."}
      - {id: B, answer: "Because close() makes an object immutable.", explanation: "Incorrect. close() is about releasing resources, not immutability."}
      - {id: C, answer: "Because file descriptors and native handles need to be released at a predictable time instead of waiting for GC.", explanation: "Correct. External resources can be exhausted or keep locks held too long when cleanup is not deterministic."}
      - {id: D, answer: "Because try-with-resources automatically decides ownership of every shared resource.", explanation: "Incorrect. TWR guarantees closing of declared resources, but the ownership architecture still has to be designed by the code."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.MentalModel/MentalModel.md", anchor: "resource-lifecycle"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: io-q05
