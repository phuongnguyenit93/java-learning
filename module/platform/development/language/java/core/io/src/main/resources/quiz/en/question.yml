      - {id: C, answer: "Because System.out has already consumed the Console.", explanation: "Incorrect. System.out and Console are not mutually exclusive in that way."}
      - {id: D, answer: "Because readPassword() is always disabled by the JVM.", explanation: "Incorrect. readPassword() is a Console capability when a console exists."}
