  - id: io-q08
    question: "If in.read(buffer) returns 37 for a buffer of length 1024, how should the code handle it?"
    answers:
      - {id: A, answer: "Process all 1024 bytes because the buffer was allocated at that size.", explanation: "Incorrect. Only the first 37 bytes are new data from this read."}
      - {id: B, answer: "Ignore the read because the buffer was not filled.", explanation: "Incorrect. A partial read is valid and those 37 bytes must be processed."}
      - {id: C, answer: "Process exactly 37 bytes, then continue reading until EOF or until the framing requirement is satisfied.", explanation: "Correct. The returned count is the contract for actual progress."}
      - {id: D, answer: "Treat 37 as the EOF marker.", explanation: "Incorrect. EOF is represented by -1 when no bytes can be read because the stream has ended."}
    correctAnswerId: C
