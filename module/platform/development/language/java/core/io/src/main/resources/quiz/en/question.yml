    answers:
      - {id: A, answer: "Reading and writing characters using the default charset.", explanation: "Incorrect. Reader/Writer are the character-oriented abstractions."}
      - {id: B, answer: "Reading and writing primitives according to a fixed field schema.", explanation: "Incorrect. DataInput/DataOutput add the typed-binary contract."}
      - {id: C, answer: "Reading bytes from a source and writing bytes to a sink, regardless of the specific resource behind them.", explanation: "Correct. Concrete subclasses define the source/sink while the base abstractions keep the byte-stream contract."}
      - {id: D, answer: "Working only with local files.", explanation: "Incorrect. Byte streams can wrap files, memory, sockets, and many other sources and destinations."}
