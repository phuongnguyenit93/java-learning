  - id: io-q09
    question: "A binary record contains an int length followed by length payload bytes. What should a safe reader do?"
    answers:
      - {id: A, answer: "Trust length and allocate immediately to keep the format simple.", explanation: "Incorrect. A length from input must be validated to prevent unreasonable allocation or malicious input."}
      - {id: B, answer: "Call read() once and assume all length bytes were returned.", explanation: "Incorrect. A single read may be partial."}
      - {id: C, answer: "Remove the length field and rely on available().", explanation: "Incorrect. available() is not a framing contract."}
      - {id: D, answer: "Validate length against the protocol, then use readFully or a loop to obtain exactly the payload; EOF in the middle of the record is truncation/error.", explanation: "Correct. Typed binary I/O needs explicit schema/framing and exact-read semantics."}
    correctAnswerId: D
