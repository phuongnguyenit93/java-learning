  - id: io-q07
    question: "What is wrong with using int n = in.available(); and then allocating byte[n] to read the whole stream?"
    answers:
      - {id: A, answer: "available() can only be used with OutputStream.", explanation: "Incorrect. available() is a method on InputStream."}
      - {id: B, answer: "available() only estimates bytes that can be read or skipped without blocking; it is not the total number of bytes remaining.", explanation: "Correct. It can return 0 even before EOF and should not be used to size the whole payload."}
      - {id: C, answer: "available() always returns Integer.MAX_VALUE.", explanation: "Incorrect. Its value depends on the stream and the moment it is called."}
      - {id: D, answer: "A byte array cannot be used with InputStream.", explanation: "Incorrect. Bulk reads into byte[] are a normal pattern."}
