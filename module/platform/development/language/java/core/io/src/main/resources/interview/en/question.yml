# <interview-schema>
# Interview Question Structure
# schema-version: 2
#
# questions [type: list; required; default: []]
#   Interview questions for the current module language.
#   each item:
#     question [type: string; required; default: ""]
#       Interview question displayed to the learner.
#     answer [type: string; required; default: ""]
#       Reference answer, revealed only when the learner explicitly opens it.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the content was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the content has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
# </interview-schema>

questions:
  - question: >-
      Explain I/O using the source → data flow → sink mental model, and why keeping data only in RAM is insufficient for most real applications.
    answer: >-
      I/O is data crossing the process boundary between a source and a sink. RAM only holds the process's working state; when the process ends, that state does not automatically become durable file data, nor does it let the program receive input, read files, or interact with external resources. The source/sink model separates payload meaning from where data comes from or goes to, allowing similar read/write contracts across files, memory, consoles, and sockets.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.MentalModel/MentalModel.md", anchor: "io-data-flow"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      When should data be treated as bytes and when as characters? Why can choosing the wrong abstraction corrupt data?
    answer: >-
      Bytes are raw binary representation and fit images, compressed files, binary protocols, or data not yet interpreted as text. Characters are appropriate only when the payload has text semantics and a charset defines bytes ↔ characters. Passing an image through a Reader can decode arbitrary bytes into characters and re-encode different bytes, while treating text as bytes without an explicit charset can produce mojibake or broken round trips.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.MentalModel/MentalModel.md", anchor: "bytes-vs-characters"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      How do blocking and non-blocking I/O differ? Why does non-blocking not mean external resources have no latency?
    answer: >-
      With blocking I/O, the calling thread waits until the operation can return progress, completion, or failure. With non-blocking I/O, a call may return immediately with no progress, while readiness/event-loop logic organizes when to try again. Disk/network latency still exists; what changes is how the program organizes waiting and threads, not the physical latency of the resource.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.MentalModel/MentalModel.md", anchor: "blocking-io-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Why can garbage collection not replace close() for files, sockets, or channels?
    answer: >-
      GC manages Java-object lifetime on the heap, while file descriptors and native handles are external OS resources with their own limits. Waiting for GC makes release timing unpredictable and can exhaust handles or keep locks/resources alive too long. Code therefore needs explicit ownership and deterministic cleanup, usually through try-with-resources.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.MentalModel/MentalModel.md", anchor: "resource-lifecycle"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Explain the InputStream.read contract, partial reads, EOF, available(), and mark/reset. What common assumptions are wrong?
    answer: >-
      `read()` returns a byte value 0..255 or `-1` at EOF; bulk reads return the number of bytes actually read and do not promise to fill the buffer. `available()` only estimates bytes that can currently be read or skipped without blocking, not total bytes remaining. `mark/reset` is usable only when `markSupported()` is true. Common bugs assume one read is enough, process the whole buffer instead of the returned count, or use available() to size the complete payload.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ByteStreams/ByteStreams.md", anchor: "read-contract"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      How do System.in, System.out/System.err, and Console differ? Why can System.console() be null in an IDE, CI, or redirected process?
    answer: >-
      `System.in` is standard input, while `System.out` and `System.err` are `PrintStream` instances for standard output/error; these streams can be redirected or piped and are not necessarily attached to an interactive terminal. `Console` represents an interactive console and provides APIs such as `readPassword`; when the process has no real console, `System.console()` may be null. Portable code needs a fallback or an explicit environment contract instead of assuming a terminal is always present.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ByteStreams/ByteStreams.md", anchor: "standard-console-io"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      What problem do DataInputStream/DataOutputStream solve that raw byte streams do not? Discuss field order, framing, readFully, EOF, and writeUTF/readUTF.
    answer: >-
      Raw streams only move bytes; typed binary I/O adds a contract for reading and writing primitive fields in an agreed order. The reader must know the schema/framing, validate lengths before allocation, and use `readFully` when exactly N bytes are required; EOF in the middle of a record usually means truncation rather than a valid end. `writeUTF/readUTF` use modified UTF-8 under the DataInput/DataOutput contract, not general-purpose UTF-8 text interchange.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ByteStreams/ByteStreams.md", anchor: "typed-binary-io"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      At what abstraction level do Reader/Writer differ from InputStream/OutputStream? Why must Reader.read(char[]) still handle partial reads, and what is notable about PrintWriter error handling?
    answer: >-
      Reader/Writer operate on characters, while byte streams operate on raw bytes. `Reader.read(char[])` still returns the actual character count, so callers must not assume the array was filled. `PrintWriter` is convenient for print/println/printf but its write/print methods do not propagate `IOException` like ordinary writers; callers use `checkError()` when observing I/O failure matters, so convenience should not override the required error contract.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.CharacterStreams/CharacterStreams.md", anchor: "reader-writer"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      What roles do InputStreamReader/OutputStreamWriter and Charset play? When should a CharsetDecoder use REPORT instead of accepting replacement?
    answer: >-
      Bridge classes decode bytes into characters and encode characters into bytes according to a `Charset`. If a file format or protocol requires strictly valid text, silent replacement can hide corruption; `CharsetDecoder`/`CharsetEncoder` with `CodingErrorAction.REPORT` lets the application reject malformed or unmappable data. The charset is part of the data contract and should be explicit when the format defines it rather than guessed from the runtime environment.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.CharacterStreams/CharacterStreams.md", anchor: "charset-bridge"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      How does buffering improve I/O, what does flush() really guarantee, and why does flush not mean the data is durable on disk?
    answer: >-
      Buffering batches many small operations in memory to reduce crossings into a more expensive underlying I/O layer. `flush()` asks the wrapper to pass buffered data to the next layer, but the data may still be in operating-system, filesystem, or device caches. Durability is a different requirement and may need `FileChannel.force` or storage-specific mechanisms; flush/force also have cost and should follow a real durability contract.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.BufferedIO/BufferedIO.md", anchor: "flush-semantics"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Why should java.io.File not be understood as “an open file,” and why does modern Java code usually prefer Path/Files?
    answer: >-
      `File` is mainly a legacy pathname/metadata abstraction; constructing one does not open a file and the target may not even exist. `Path` represents the path while `Files` performs filesystem operations, with richer support for attributes, links, copy/move options, tree walking, and specific exceptions. `File` remains relevant for legacy APIs, but it should not be the default merely because its name sounds direct.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.File/File.md", anchor: "file-api-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Explain the Path → FileSystem → FileSystemProvider → FileStore relationship and why it matters for portability.
    answer: >-
      Every `Path` belongs to a `FileSystem`; that filesystem is implemented by a `FileSystemProvider`, while `FileStore` describes backing storage and capabilities. Different providers/filesystems may support POSIX attributes, atomic moves, symbolic links, or WatchService differently, so code should not infer capabilities from the developer machine. `Path.toFile()` is also not universal for non-default providers, making it safer for modern code to stay in the Path model and check capabilities when requirements depend on them.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.PathFiles/PathFiles.md", anchor: "filesystem-provider-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      How do normalize(), toAbsolutePath(), toRealPath(), and Files.isSameFile() answer different questions, especially when symbolic links are involved?
    answer: >-
      `normalize()` only simplifies syntax such as `.` and reducible `name/..` pairs without touching the filesystem. `toAbsolutePath()` creates an absolute representation from the current context but does not prove identity; `toRealPath()` accesses the filesystem, requires the target to exist, and resolves links according to its options. When the real question is whether two paths identify the same file, `Files.isSameFile` is more appropriate than string comparison or purely syntactic normalization.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.PathFiles/PathFiles.md", anchor: "resolve-normalize"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      What boundaries matter with Files.copy/move/delete and ATOMIC_MOVE? Why does “copy a directory” not automatically mean recursive copy?
    answer: >-
      `Files.copy` on a directory creates the corresponding target directory but does not copy the entire tree; delete is likewise not recursive for a non-empty directory. Copying a source symlink follows the target by default unless configured otherwise, while move moves the link itself. `ATOMIC_MOVE` depends on filesystem support, may throw `AtomicMoveNotSupportedException`, ignores other move options, and existing-target behavior can be provider-specific, so publishing policy must be explicit.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.PathFiles/PathFiles.md", anchor: "files-operations"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      How should temporary files/directories be owned and cleaned up? Is DELETE_ON_CLOSE an absolute cleanup solution?
    answer: >-
      Code that creates a temporary resource should define who owns it and when cleanup occurs; a temporary directory containing files often requires tree cleanup rather than deleting only the parent. `DELETE_ON_CLOSE` is useful in some cases but still depends on the provider and handle lifecycle, so it does not replace an overall cleanup policy. Crashes or resources that are not closed correctly remain part of the design boundary.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.PathFiles/PathFiles.md", anchor: "temporary-files"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      What portability boundaries apply to file owner/permission attributes in NIO.2? Why should code not assume POSIX permissions exist everywhere?
    answer: >-
      NIO.2 exposes attribute views such as basic, POSIX, DOS, and owner views, but the provider/store decides which views exist. `FileStore.supportsFileAttributeView(...)` can check capability, while a specific operation may still fail because of access rights, races, or file state. Portable code should treat permissions as filesystem/provider capabilities instead of hard-coding Unix assumptions.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.PathFiles/PathFiles.md", anchor: "file-permissions-ownership"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Files.list/walk/find/lines return java.util.stream.Stream. Why must these streams still be closed, and what does that teach about ownership?
    answer: >-
      These values are Stream API pipelines at the element-processing level, but underneath they keep directory or file resources open while traversal/reading is active. They therefore have a close lifecycle and should normally be used with try-with-resources. The type `Stream<T>` alone does not tell you whether external resources exist; ownership must also be understood from the API that created the stream.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.PathFiles/PathFiles.md", anchor: "directory-stream-walk"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      What mental model should be used for WatchService, and why should it not be treated as a precise transactional filesystem log?
    answer: >-
      `WatchService` registers directories and delivers create/modify/delete events through `WatchKey`; consumers take or poll a key, read events, and then reset the key. Events may be coalesced, `OVERFLOW` means detail was lost, behavior depends on the provider, and watching is not recursively applied to an entire tree by default. It is therefore best for “something changed; re-check state” workflows rather than as an audit log or transactional source of truth.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.PathFiles/PathFiles.md", anchor: "watch-service-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Describe the Buffer state machine using position/limit/capacity and the roles of flip, clear, compact, mark/reset, and rewind.
    answer: >-
      During writes, `position` advances toward `limit`; `flip()` then sets the limit to the amount written and moves position to zero for reading. `clear()` reopens the full region for new writes without erasing bytes, while `compact()` preserves unread data and prepares for more writing. `rewind()` rereads the same region from the beginning, and mark/reset provides a temporary bookmark that some state transitions discard. Misunderstanding these states commonly causes underflow, overflow, or stale-data bugs.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.BuffersChannels/BuffersChannels.md", anchor: "flip-clear-compact"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      What is ByteOrder, and why is endianness a correctness contract rather than a tuning detail?
    answer: >-
      Multi-byte primitives such as int and long require a rule for which byte carries the high-order and low-order parts. `ByteBuffer` defaults to big-endian but can be switched to little-endian; the same four bytes can decode to different integers under different orders. A binary format or protocol must therefore define endianness, and code must configure it before `getInt/putInt` or typed views, otherwise the data can be syntactically readable but semantically wrong.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.BuffersChannels/BuffersChannels.md", anchor: "byte-order-structured-binary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      How does the Channel + Buffer model differ from the Stream model? What does scatter/gather solve, and why is it not parallel I/O?
    answer: >-
      A channel separates the conduit from the explicit data container, the `Buffer`, giving the application visible state/position and NIO-specific capabilities. Scattering reads distribute bytes into multiple buffers, while gathering writes consume multiple buffers in order, which fits layouts such as header + body. Operations can still make partial progress and do not create threads or parallelism; scatter/gather is multi-buffer transfer, not concurrent execution.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.BuffersChannels/BuffersChannels.md", anchor: "scatter-gather-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      How should heap ByteBuffer and direct ByteBuffer be chosen? Why is a direct buffer not an automatically faster default?
    answer: >-
      Heap buffers live in the Java heap and are convenient for ordinary allocation and application access. Direct buffers use off-heap/native-friendly memory and may reduce copying on some native I/O paths, but allocation/deallocation is more expensive and memory pressure is less visible in normal heap metrics. Use them when the workload, channel path, and measurement demonstrate a benefit rather than treating `allocateDirect` as a universal optimization.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.BuffersChannels/BuffersChannels.md", anchor: "bytebuffer-types"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      How does FileChannel random access differ from a sequential stream, and where does RandomAccessFile fit?
    answer: >-
      `FileChannel` supports a mutable position and also positional reads/writes that can target a specific offset without necessarily changing that channel position. `RandomAccessFile` is an older API that combines `DataInput/DataOutput` with `seek`; a channel obtained from it shares related position state with the file pointer. New code often prefers FileChannel for NIO capabilities, while RandomAccessFile remains important for understanding legacy code and API evolution.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.FileChannel/FileChannel.md", anchor: "filechannel-random-access"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      How does AsynchronousFileChannel differ from FileChannel in its completion model? What responsibilities remain with the caller even though the operation is asynchronous?
    answer: >-
      `AsynchronousFileChannel` performs positional I/O and reports completion through `Future` or `CompletionHandler`, so the initiating thread does not need to stay blocked until the operation finishes. The caller still owns channel lifetime, buffer lifetime, partial completion, failure handling, and the surrounding concurrency policy. Async is not automatically faster; it is a different orchestration model, while deeper executor/cancellation/memory-visibility concerns belong to concurrency.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.FileChannel/FileChannel.md", anchor: "asynchronous-filechannel-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      How do transferTo/transferFrom and force() solve different problems? Why must partial transfer and durability still be handled explicitly?
    answer: >-
      `transferTo/transferFrom` provide an efficient shape for copying between file/channels, but the actual transferred count can be smaller than requested, so callers must track progress when full transfer is required. `force(false/true)` addresses durability by requesting that file content, and with true necessary metadata, be pushed through the storage stack. Transfer completion and persistence across failures are separate contracts.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.FileChannel/FileChannel.md", anchor: "filechannel-transfer"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      What boundaries make file locks and memory-mapped files poor candidates for a “magic concurrency/performance solution”?
    answer: >-
      File locks are mainly filesystem/OS coordination mechanisms; shared requests may become exclusive and advisory/platform behavior varies, so they are not Java thread locks. Memory mapping participates in virtual-memory paging with page faults, size/window/lifetime, and mutation/truncation boundaries; closing the FileChannel does not automatically unmap an existing mapping. Both features should be chosen for explicit requirements rather than the intuition that they are always faster or safer.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.FileChannel/FileChannel.md", anchor: "file-lock-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      In a wrapper chain such as BufferedReader → InputStreamReader → InputStream, who should close the resource? What does try-with-resources solve and what does it not solve?
    answer: >-
      Ownership is an architectural decision: the component that opens a resource usually owns closing it, while a borrower should not close someone else's shared resource. In wrapper chains, closing the outer wrapper usually delegates to the inner resource, so ambiguous double ownership should be avoided. Try-with-resources guarantees deterministic close and close ordering, but it does not decide ownership design or make a shared resource safe for arbitrary callers to close.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.ResourceManagement/ResourceManagement.md", anchor: "resource-ownership"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      How does native Java serialization model an object graph, and how do serialVersionUID and transient relate to compatibility?
    answer: >-
      `ObjectOutputStream` writes the reachable graph of Serializable objects while preserving reference relationships rather than dumping each object independently. `serialVersionUID` participates in compatibility checks between the stored class descriptor and the class used during reading; `transient` excludes a field from default serialized state but does not turn the format into a stable schema. Because native serialization is tightly coupled to Java classes and versions, it is a poor default for long-lived persistence or network interchange.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.Serialization/Serialization.md", anchor: "serialversionuid"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Why is deserializing untrusted data a security risk? What does ObjectInputFilter help with, and why does it still not make native serialization a safe default format?
    answer: >-
      Deserialization can cause the JVM to load and instantiate an object graph and may reach dangerous gadget paths before the application performs ordinary validation. `ObjectInputFilter` can limit classes, depth, array size, and graph size, but it must be installed before the first object read and is defense in depth rather than a guarantee. The safest boundary remains avoiding native Java object streams from untrusted sources when safer interchange formats are available.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.Serialization/Serialization.md", anchor: "serialization-security-risk"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      When reviewing a new I/O requirement, in what order would you choose Stream/Reader/Files/Channel and the memory/error/performance strategy?
    answer: >-
      Start with payload semantics: bytes, text, or structured binary; then consider size bounds, sequential versus random access, charset/byte order/framing, resource ownership, and failure policy. Large data should usually be streamed/chunked instead of fully loaded, and partial reads/writes plus filesystem races are correctness concerns. Tune buffer size, direct buffers, transfer, mapping, or async only after measurement identifies a real bottleneck; a more powerful API is not automatically more correct or faster.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "11.ChoosingIO/ChoosingIO.md", anchor: "choose-stream-reader-channel"}
    apiRelated: {controller: "", methodSignature: ""}
