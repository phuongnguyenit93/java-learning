  - question: >-
      What problem does Collator solve that String.compareTo does not, and when should Collator not be used?
    answer: >-
      String.compareTo provides a deterministic order based on Unicode values, which is appropriate for many keys, protocols, and internal orderings but does not fully represent the alphabetical order readers expect. Collator applies locale-specific linguistic rules to user-visible text. A user Locale should not be used to sort technical identifiers that must have the same order in every environment.
