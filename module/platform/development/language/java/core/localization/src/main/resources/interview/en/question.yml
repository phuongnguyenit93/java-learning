  - question: >-
      When is a properties bundle a better fit than a class-based bundle, and what is the main trade-off between them?
    answer: >-
      Properties bundles are usually a good fit for message text because they separate content from Java source, are easier for translators and tooling to handle, and do not require resources to be modeled as code. Class-based bundles can return objects and use Java logic, but they tie resources more closely to the compile and runtime code lifecycle. The choice should follow the kind of resource and operational workflow rather than habit.
