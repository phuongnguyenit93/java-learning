  - question: >-
      Why should domain values such as BigDecimal, Instant, or a currency code not change merely because the user changes Locale?
    answer: >-
      Locale describes how people view and read data; it does not change the business meaning of that data. If an amount or instant is converted into localized text too early, the system can lose precision, make calculations harder, make locale changes difficult, and confuse presentation with canonical values. The domain should keep a stable representation, while localization should happen only when data crosses a human-facing boundary.
