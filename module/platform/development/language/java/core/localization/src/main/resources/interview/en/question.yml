  - question: >-
      In bidirectional text, how do logical order and visual order differ, and why is reversing a String to support Arabic or Hebrew incorrect?
    answer: >-
      Logical order is the order in which content is stored in the String; visual order is the placement of glyphs and runs after bidirectional rules are applied. Mixed RTL and LTR text can also contain numbers, punctuation, and code with different directional behavior, so reversing the whole String destroys semantics and ordering. Data should remain in logical order, while the bidi algorithm and renderer handle visual presentation.
