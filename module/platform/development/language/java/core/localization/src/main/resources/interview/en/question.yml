  - question: >-
      Explain the ResourceBundle candidate locale chain and why you should not reproduce it by manually concatenating file names.
    answer: >-
      ResourceBundle prefers more specific candidates and then moves toward more general ones; for example, en-US may try en_US, then en, then the base bundle, while scripts, variants, or extensions can make the chain more detailed. JDK Control already understands these rules and the fallback policy. Hand-built file-name logic is easy to get wrong and can diverge from the semantics of the standard API.
