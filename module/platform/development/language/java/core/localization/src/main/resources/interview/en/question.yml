  - question: >-
      Why is the default Locale a dangerous hidden dependency in a backend that serves many users?
    answer: >-
      The default Locale belongs to the JVM or environment, so identical code can produce different output on a laptop, in CI, in production, or across nodes. It also does not necessarily match the preference of the current request. A backend should pass Locale explicitly when user or request locale is part of the contract, and use the default only when the environment default is itself an intentional policy.
