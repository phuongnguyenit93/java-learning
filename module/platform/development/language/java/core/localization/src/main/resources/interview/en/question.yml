  - question: >-
      A list is sorted in the database while Java uses Collator for the same screen. What consistency risk does this create?
    answer: >-
      The database applies the collation configured for its schema or query, while Collator applies JVM and Locale rules; there is no guarantee that the two systems produce the same ordering. This matters especially for pagination because different orderings can cause duplicated or missing rows across pages. If sorting is done in the database, the database collation is the effective contract; Java-side Collator should be used when Java itself performs the comparison.
