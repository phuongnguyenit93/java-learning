  - question: >-
      Why is the apostrophe in MessageFormat a production pitfall worth testing?
    answer: >-
      An apostrophe is a quoting character in MessageFormat patterns, so natural text added by a translator can accidentally change how placeholders are parsed. A resource used by MessageFormat is therefore not just a plain string; it is a pattern with syntax. Patterns should be tested with real arguments, especially for locales where apostrophes commonly appear in natural text.
