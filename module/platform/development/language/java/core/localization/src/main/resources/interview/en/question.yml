  - question: >-
      Why is MessageFormat preferable to concatenating string fragments when a message contains dynamic data?
    answer: >-
      Fragment concatenation locks sentence structure to the developer's source language and prevents translators from naturally reordering parts of the sentence. MessageFormat keeps the whole sentence pattern in a resource and inserts arguments through placeholders, so different languages can arrange the same data differently. ResourceBundle chooses the pattern; MessageFormat parameterizes that pattern.
