  - question: >-
      What do directional runs and embedding levels help a developer understand about mixed-direction text?
    answer: >-
      A paragraph can be divided into contiguous runs that share an embedding level or direction, for example an RTL run containing an LTR run for a number or product code before returning to RTL. A single isRtl boolean for the entire string is therefore an oversimplified mental model. java.text.Bidi lets the application inspect base direction, run boundaries, and levels instead of reimplementing the Unicode Bidirectional Algorithm.
