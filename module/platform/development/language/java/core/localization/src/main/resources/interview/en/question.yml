      A newline is a break already present in the data, while a line BreakIterator finds positions where a renderer may consider wrapping text. BreakIterator provides boundary analysis only; font shaping, pixel layout, and drawing belong to the renderer, while semantic tokenization, stemming, and deeper language understanding belong to an NLP layer. A backend usually does not lay out text, but it should still know why cutting every N characters is unsafe.
