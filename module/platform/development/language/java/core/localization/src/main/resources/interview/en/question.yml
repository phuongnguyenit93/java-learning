  - question: >-
      Where does java.text.Bidi stop and a UI renderer begin?
    answer: >-
      Bidi is an analysis API: it can report the base direction, whether bidirectional processing is required, the run count, run start and limit positions, and embedding levels. It does not choose fonts, shape glyphs, measure width, perform pixel layout, or draw text; those tasks belong to the UI and text-rendering stack. Many frameworks handle the visual side automatically, but developers still need this boundary to avoid reversing strings or manually repositioning punctuation.
