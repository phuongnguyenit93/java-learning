  - question: >-
      Explain Collator strength and decomposition, and why compare(a, b) == 0 does not necessarily mean a.equals(b).
    answer: >-
      Strength controls which linguistic differences are significant, while decomposition affects how equivalent or related Unicode representations are handled. At a lower strength, two Strings with different code points can still be considered equivalent for collation and compare can return zero. That is equality under the current comparator, not a change to Object or String equality.
