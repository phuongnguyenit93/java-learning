  - question: >-
      Where would you place localization in a backend architecture, and where should the user's Locale usually be avoided?
    answer: >-
      Localization belongs at human-facing boundaries such as UI responses, email, reports, invoices, or sorting text for readers. Machine contracts, numeric database values, cache keys, protocol identifiers, and log fields intended for parsing should use stable, explicit, usually locale-neutral formats. This boundary lets the same domain value be presented differently without changing its identity or internal semantics.
