questions:
  - question: >-
      Distinguish internationalization (i18n) from localization (l10n), and explain why a system with Vietnamese translations is not necessarily localized correctly.
    answer: >-
      Internationalization is the design work that lets software adapt to multiple languages, regions, and conventions without rewriting business logic; localization supplies the content and conventions for a specific locale. Translating labels alone is not enough because numbers, date/time values, currencies, collation, text boundaries, and bidirectional text can still follow the wrong conventions. A sound design separates the capability to adapt from the locale-specific data used for each audience.
    aiGenerated: true
