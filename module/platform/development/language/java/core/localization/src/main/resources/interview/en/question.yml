      A UTF-16 char is not the same thing as a Unicode code point, and a code point is not always the same as a user-perceived grapheme; one displayed unit can contain multiple code units or code points. Character BreakIterator finds more appropriate boundaries for cursor movement, selection, or truncation. Unicode representation theory belongs to the string domain, while localization uses boundary analysis to handle text for users.
