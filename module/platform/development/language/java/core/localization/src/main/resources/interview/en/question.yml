  - question: >-
      What does Locale actually model, and why should it not be treated as a geographic location, ZoneId, or user profile?
    answer: >-
      Locale is context about language, script, region, variants, and extensions that locale-sensitive APIs use to choose conventions. It does not say where a device is physically located, it does not contain time-zone rules, and it does not prove a user's nationality, address, or transaction currency. Those business concepts should be modeled separately instead of inferred from Locale.
