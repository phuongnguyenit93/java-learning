      What problem does ResourceBundle solve, and why is it not a translation engine?
    answer: >-
      ResourceBundle looks up resources that have already been prepared, using a base name, requested Locale, candidate and fallback chain, and stable key. It does not generate new translations; a team still has to author and review localized resources. Its value is separating source code from translated content and centralizing resource lookup policy.
