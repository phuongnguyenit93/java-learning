  - question: >-
      Why do BCP 47 language tags exist when Java already has Locale objects?
    answer: >-
      Locale is an in-process Java object, while HTTP, URLs, configuration, and databases need a textual representation that different systems can exchange. BCP 47 provides a standard structure for language, script, region, variants, and extensions so systems can describe the same locale context consistently. Because the tag is structured data, applications should use standard APIs rather than manually splitting or concatenating strings.
