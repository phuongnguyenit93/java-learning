questions:
  - question: >-
      What flow should explicit context propagation through an Executor or Spring TaskDecorator follow?
    answer: >-
      The mental model is capture context at the submission boundary, restore it on the worker before running the task, then clean up or restore the previous worker state in finally. Spring TaskDecorator is a suitable place to package this pattern for ThreadPoolTaskExecutor, for example for correlation IDs, MDC or RequestAttributes. Propagation does not extend the HTTP request lifecycle, so capturing only the immutable values actually needed is often safer than retaining request objects.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Spring_Task_Executor/SpringExecutor.md"
      anchor: "task-decorator"
    apiRelated:
      controller: "TaskExecutorController"
      methodSignature: "asyncWithContext()"

  - question: >-
      How does @Async work, and why can self-invocation fail to be asynchronous?
    answer: >-
      @Async works through Spring's async infrastructure and proxy/interceptor mechanism; @EnableAsync is commonly used to enable that infrastructure. When an invocation passes through the proxy, it is dispatched to the resolved TaskExecutor. A direct call from one method to another @Async method on the same this reference can bypass the proxy and therefore bypass interception. For void @Async, the caller has no Future for failures, so AsyncUncaughtExceptionHandler, logging or metrics are needed, while submission rejection remains a separate concern.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Spring_Task_Executor/SpringExecutor.md"
      anchor: "async-annotation"
    apiRelated:
      controller: ""
      methodSignature: ""

