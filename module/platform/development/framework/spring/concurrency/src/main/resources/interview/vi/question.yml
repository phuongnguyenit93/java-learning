questions:
  - question: >-
      Context propagation đúng qua Executor hoặc Spring TaskDecorator nên theo flow nào?
    answer: >-
      Mental model là capture context tại submission boundary, restore nó trên worker trước khi task chạy, rồi cleanup hoặc restore previous state trong finally. Spring TaskDecorator là nơi phù hợp để đóng gói pattern này cho ThreadPoolTaskExecutor, ví dụ với correlation id, MDC hoặc RequestAttributes. Propagation không kéo dài lifecycle của HTTP request, nên khi có thể nên capture các immutable value thực sự cần thay vì giữ request object quá lâu.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Spring_Task_Executor/SpringExecutor.md"
      anchor: "task-decorator"
    apiRelated:
      controller: "TaskExecutorController"
      methodSignature: "asyncWithContext()"

  - question: >-
      @Async hoạt động như thế nào và vì sao self-invocation có thể không async?
    answer: >-
      @Async hoạt động qua Spring async infrastructure và proxy/interceptor; @EnableAsync thường được dùng để bật infrastructure. Khi invocation đi qua proxy, method được dispatch tới TaskExecutor được resolve. Nếu một method gọi trực tiếp một @Async method khác trên chính this, lời gọi có thể bypass proxy nên interception không xảy ra. Với void @Async, caller không có Future để nhận failure; cần AsyncUncaughtExceptionHandler/logging/metrics và vẫn phải xử lý submission rejection riêng.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Spring_Task_Executor/SpringExecutor.md"
      anchor: "async-annotation"
