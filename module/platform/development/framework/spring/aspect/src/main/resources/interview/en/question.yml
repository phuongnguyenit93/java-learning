  - question: >-
      How do final methods, private methods, and final classes affect class-based proxying?
    answer: >-
      A class-based proxy relies on subclassing. A final method cannot be overridden to insert an interceptor, a private method cannot be overridden by the subclass, and a final class cannot be subclassed at all. An annotation can still be present on a final method even though advice cannot intercept it. This is a different limitation from self-invocation: self-invocation misses the proxy boundary, while final/private limitations come from what the proxy subclass can override.
    aiGenerated: true
    reviewed: false
