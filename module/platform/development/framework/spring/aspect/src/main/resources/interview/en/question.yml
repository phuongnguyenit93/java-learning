  - question: >-
      How can you demonstrate that a logging concern has really been separated from business methods with Spring AOP?
    answer: >-
      Inspect the target service and verify that its business methods do not contain the before/after logging logic themselves, then invoke the Spring-managed bean through its proxy and observe that logging still appears around multiple methods. That proves the behavior lives in an Aspect and is applied outside the target implementation. If the same class is instantiated and invoked outside the proxy boundary, the cross-cutting behavior should not appear automatically.
    aiGenerated: true
