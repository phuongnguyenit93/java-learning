  - question: >-
      How are ClassFilter and MethodMatcher used inside lower-level Spring AOP pointcuts?
    answer: >-
      ClassFilter decides whether a target class is even a candidate, which lets the framework eliminate unrelated types early. MethodMatcher then decides which methods on that candidate type are selected. A NameMatchMethodPointcut, for example, can advise write() but not read() on the same proxy. This makes it clear that a pointcut is not merely an expression string; Spring AOP also provides programmatic abstractions for class and method selection.
