  - question: >-
      Why are static methods and constructors outside the normal boundary of proxy-based Spring AOP?
    answer: >-
      Standard Spring AOP intercepts instance method invocations when callers go through a proxy object. A static method belongs to the class and its invocation is not dispatched through an instance proxy in that way, while a constructor runs as the object is being created, before Spring can expose a proxy in place of the raw bean reference to consumers. Proxy-based Spring AOP is therefore not the mechanism for intercepting static method or constructor execution. If those join points are required, use a mechanism with a broader join point model, such as full AspectJ weaving or appropriate instrumentation.
