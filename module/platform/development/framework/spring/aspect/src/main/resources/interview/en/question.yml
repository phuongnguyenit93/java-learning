  - question: >-
      Does an annotation-based pointcut guarantee that advice will execute?
    answer: >-
      No. The annotation only helps define the selection rule. The invocation still has to cross an AOP proxy, and the method must be interceptable by the active proxy strategy. Self-invocation, plain objects created with new, final or private methods with class-based proxying, or beans that were never proxied can all result in an annotation being present while the advice never runs. Debug both the proxy boundary and the pointcut match.
