  - question: >-
      What AOP pitfalls commonly appear in production code?
    answer: >-
      Common pitfalls include overly broad pointcuts, hiding business logic inside Aspects, silently changing arguments or return values, swallowing exceptions, creating complex ordering dependencies, and keeping unsafe mutable state in singleton Aspect beans. These choices hide dependencies and make runtime behavior hard to predict. Good AOP reduces duplication in cross-cutting concerns while keeping the business flow visible in the service layer.
