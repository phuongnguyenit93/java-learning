      methodSignature: "timing()"

  - question: >-
      Can @Around advice change the return value or skip the target, and what are the risks?
    answer: >-
      Yes. Around advice can take the value returned from proceed(), transform it before returning to the caller, or choose not to call proceed() at all and return its own value. That means an Aspect can change the caller-visible contract or prevent the business method from executing. These are legitimate capabilities, but hidden transformations or short-circuiting make code much harder to debug and should only be used when they are an explicit part of the cross-cutting contract.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Around/Around.md"
      anchor: "around-mental-model"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      How is proceed(Object[]) used to replace method arguments in Spring AOP?
    answer: >-
      Around advice can inspect joinPoint.getArgs(), build a replacement argument array, and call proceed(newArgs). In proxy-based Spring AOP, that array represents the new argument list for the underlying method invocation and its size must match the method's arguments. The target receives those new values. Do not assume the semantics are identical for AspectJ-compiled advice, where proceed arguments correspond to parameters bound into the around advice signature.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Around/Around.md"
      anchor: "around-arguments-demo"
    apiRelated:
      controller: "AroundAdviceController"
      methodSignature: "arguments()"

  - question: >-
      How should @Around advice handle exceptions, and why is calling proceed() multiple times dangerous?
    answer: >-
      Around advice can catch an exception to log, measure, or clean up and then rethrow it to preserve the target's contract. Swallowing the exception or converting it into success should only happen when that recovery behavior is explicitly intended. Calling proceed() multiple times can cause the downstream chain or target method to execute multiple times, duplicating side effects. Treat proceed() as "continue this invocation chain," not as a callback that is safe to invoke arbitrarily.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Around/Around.md"
      anchor: "around-exception-demo"
    apiRelated:
      controller: "AroundAdviceController"
      methodSignature: "exceptionPropagation()"

  - question: >-
      Why are custom annotations often used as declarative contracts for AOP?
    answer: >-
      A custom annotation lets a business method declare intent such as audited, measured, or tracked without embedding the implementation of that concern. An Aspect can match it with @annotation and bind the annotation instance directly to read its metadata. If the Aspect needs that metadata at runtime, the annotation needs RetentionPolicy.RUNTIME. This approach is often clearer than pointcuts tied deeply to package structure or naming conventions, provided the annotation represents an understandable contract.
