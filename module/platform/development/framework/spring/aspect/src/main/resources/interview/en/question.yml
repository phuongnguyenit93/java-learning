  - question: >-
      What is the correct mental model for a Spring AOP proxy?
    answer: >-
      A consumer commonly receives a proxy rather than a direct reference to the target object. When a method call crosses the proxy boundary, Spring evaluates the relevant Advisors and pointcuts, runs the interceptor/advice chain, and eventually invokes the target. The most important debugging question is not merely whether an annotation exists; it is whether the invocation actually passed through the proxy. If it did not, the advice never had a chance to run.
    aiGenerated: true
    reviewed: false
