  - question: >-
      How does proxy selection in plain Spring Framework differ from Spring Boot's default behavior?
    answer: >-
      In Spring AOP itself, the proxy strategy depends on configuration: interface-based proxying can use a JDK dynamic proxy, while enabling proxyTargetClass requests a class-based proxy. Spring Boot adds an opinionated default: spring.aop.proxy-target-class defaults to true, so auto-configured AOP usually favors class-based/CGLIB proxies unless the application overrides that setting. Therefore, the statement "Spring always uses a JDK proxy whenever an interface exists" is not a safe rule for Spring Boot applications; distinguish Spring Framework's proxy capabilities from Boot auto-configuration and verify the actual runtime configuration.
