  - question: >-
      What are the practical differences between JDK Dynamic Proxy and CGLIB/class-based proxying?
    answer: >-
      JDK Dynamic Proxy is interface-based, so the proxy primarily exposes the interfaces it implements. A CGLIB/class-based proxy is a subclass of the target class, so its visible type surface can include concrete target methods as well. The strategy also affects interception limitations: a class-based proxy cannot override a final method or subclass a final class. Neither strategy is universally better; you need to understand type exposure, interception constraints, and how callers inject or cast the bean.
    aiGenerated: true
    reviewed: false
    readmeRelated:
