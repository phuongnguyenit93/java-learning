  - question: >-
      Why should @Order relationships between Aspects not become a hidden business workflow?
    answer: >-
      Ordering is useful for precedence between cross-cutting concerns, but a design where Aspect A must mutate data for B, B must run before C, and C must run before D hides business dependencies inside infrastructure. That makes the flow difficult to read, test, and evolve. Business protocol belongs in explicit services or domain abstractions; AOP should remain focused on cross-cutting behavior with understandable boundaries.
