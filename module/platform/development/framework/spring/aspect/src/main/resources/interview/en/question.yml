  - question: >-
      How do @Before, @AfterReturning, @AfterThrowing, @After, and @Around differ in lifecycle semantics?
    answer: >-
      @Before runs before the target invocation. @AfterReturning runs only after a normal return. @AfterThrowing runs only when the invocation exits through a matching exception. @After has finally-like semantics and runs whether the invocation succeeds or fails. @Around wraps the whole chain and has proceed(), so it has the strongest control over execution. Prefer the weakest advice type that still satisfies the requirement because less control usually means simpler, more predictable flow.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.Advice/Advice.md"
      anchor: "advice-semantics"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      On a successful invocation, how do @AfterReturning and @After differ?
    answer: >-
      @AfterReturning runs only when the target returns normally and can bind the returned value for observation. @After has finally-like semantics and also runs when the target throws. On a successful path you may observe @Before → target → @AfterReturning → @After, but you should not treat the source-code order of multiple advice methods of the same type as a precedence contract unless the framework provides one explicitly.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.Advice/Advice.md"
      anchor: "advice-success-demo"
