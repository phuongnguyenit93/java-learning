  - question: >-
      Why can mutable fields inside an Aspect cause race conditions?
    answer: >-
      A normal Aspect bean is typically a singleton in the ApplicationContext, so many requests or threads can execute through the same Aspect instance concurrently. Mutable fields such as currentRequestCount or currentUser can therefore be read and written by multiple threads, causing races or leaking state between invocations. Prefer stateless Aspects; if state is truly necessary, define its scope and concurrency semantics explicitly instead of assuming each invocation receives a fresh Aspect instance.
