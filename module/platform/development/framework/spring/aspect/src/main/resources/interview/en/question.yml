  - question: >-
      What happens to @AfterThrowing, @After, and @AfterReturning when the target throws an exception?
    answer: >-
      @AfterThrowing runs on the exception path when the thrown exception matches the advice binding or pointcut. @After still runs because it behaves like a finally block. @AfterReturning does not run because there was no normal return. If the concern is only logging, auditing, or metrics, the least surprising design is often to observe the exception and preserve the original contract; converting failures into success is a stronger control-flow decision.
    aiGenerated: true
    reviewed: false
    readmeRelated:
