      anchor: "proxy-strategies"
    apiRelated:
      controller: "ProgrammaticProxyController"
      methodSignature: "compareProxyFactoryStrategies()"

  - question: >-
      What do the execution, within, args, @annotation, this, target, and bean pointcut designators match?
    answer: >-
      execution mainly matches method execution and declared signatures; within matches a declaring type or package boundary; args evaluates runtime argument shape or types; @annotation selects methods carrying a particular annotation; this looks at the proxy object's type; target looks at the underlying target type; and bean is a Spring-specific designator that matches by bean name. Good pointcuts should be narrow and predictable rather than overly broad expressions that accidentally affect unrelated methods.
    aiGenerated: true
    reviewed: false
