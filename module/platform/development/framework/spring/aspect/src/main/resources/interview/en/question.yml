  - question: >-
      What is the difference between this(...) and target(...) in Spring AOP pointcuts?
    answer: >-
      this(...) matches against the type of the proxy object seen by the caller, while target(...) matches against the type of the real target behind the proxy. With a class-based proxy the two type views may look similar, but with a JDK proxy the proxy implements interfaces while the target is a concrete class. Therefore changing the proxy strategy can change which of these designators matches.
