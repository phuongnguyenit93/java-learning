  - question: >-
      Does using @Aspect, @Before, or @Around mean an application is using full AspectJ weaving?
    answer: >-
      No. Those annotations belong to the @AspectJ declaration style, but Spring can read that metadata and implement the behavior with proxy-based Spring AOP at runtime. Full AspectJ also supports compile-time and load-time weaving and has a broader join point model. The declaration syntax and the runtime mechanism are separate concerns, so seeing AspectJ annotations or org.aspectj packages is not enough to conclude that bytecode weaving is taking place.
    aiGenerated: true
    reviewed: false
