  - question: >-
      What is an Advisor, and why is Advisor often described as Pointcut + Advice?
    answer: >-
      The Pointcut answers which invocation should match, while the Advice or MethodInterceptor answers what should happen when it matches. An Advisor combines those two pieces into something the proxy infrastructure can use to build an interceptor chain. In @AspectJ style, the pointcut expression and advice method are often declared together, whereas at the lower Spring AOP API level they can be independent objects combined by an Advisor.
