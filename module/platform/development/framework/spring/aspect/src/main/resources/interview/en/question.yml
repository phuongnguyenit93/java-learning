  - question: >-
      What is the difference between a static MethodMatcher and a dynamic MethodMatcher?
    answer: >-
      Static matching only needs the Method and target class, so the framework can decide using metadata. A dynamic matcher first passes the static phase and, when isRuntime() is true, also evaluates the actual invocation arguments. Dynamic pointcuts are useful when selection genuinely depends on runtime data, such as mode="audit", but they add per-invocation evaluation and complexity. If type and method metadata are enough, static matching is simpler.
