  - question: >-
      Does Spring AOP support the full AspectJ join point model?
    answer: >-
      No. Spring AOP can use AspectJ pointcut expression syntax for many cases, but its runtime model is still proxy-based method interception on Spring-managed objects. Join points such as method calls, field get/set, object initialization, or control-flow pointcuts are outside the normal capabilities of proxy-based Spring AOP. If you need a broader join point model, full AspectJ weaving or another instrumentation mechanism may be more appropriate.
