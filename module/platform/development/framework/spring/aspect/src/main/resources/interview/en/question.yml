questions:
  - question: >-
      What problem does AOP solve, and how is a cross-cutting concern different from a business concern?
    answer: >-
      A business concern is the core behavior of a use case, such as creating an order or calculating a price. A cross-cutting concern is behavior that appears across many parts of the application without being the primary business goal, such as logging, auditing, tracing, metrics, or authorization checks. AOP lets you extract those shared concerns from business methods and apply them at a clearly defined boundary through pointcuts or annotations. It does not replace business logic; it keeps reusable cross-cutting behavior outside the target method.
    aiGenerated: true
    reviewed: false
