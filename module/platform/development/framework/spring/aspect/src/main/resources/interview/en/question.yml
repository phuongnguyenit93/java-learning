  - question: >-
      What is the preferred design approach for handling self-invocation in Spring?
    answer: >-
      The clearest approach is usually to move the intercepted boundary into another bean so Bean A calls Bean B through Bean B's proxy. Self-injection and AopContext.currentProxy() can solve specific cases, but they couple application code more tightly to AOP infrastructure, and AopContext also requires proxy exposure. They are better treated as escape hatches than as the default design.
