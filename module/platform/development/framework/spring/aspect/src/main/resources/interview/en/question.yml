  - question: >-
      What is the boundary between @AspectJ syntax and the Spring AOP runtime in this module?
    answer: >-
      The module uses @Aspect, @Pointcut, @Before, and @Around declarations, but the actual runtime is Spring AOP auto-proxy infrastructure inside the ApplicationContext. The Aspect exists as a Spring bean, target beans are wrapped with proxies, and the observed join points are method executions. There is no AspectJ compiler or load-time weaving agent in this runtime boundary. Debugging should therefore begin with whether the object is Spring-managed, whether the invocation crosses the proxy, whether an Advisor or pointcut matches, and how the interceptor chain executes.
