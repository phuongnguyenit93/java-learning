  - question: >-
      With the same target and interceptor, how do JDK and CGLIB proxies created by ProxyFactory differ in type surface?
    answer: >-
      A JDK proxy exposes the configured interface surface and is not a subclass of the concrete target. A CGLIB proxy is a subclass, so concrete target methods can remain visible on the proxy type when they are otherwise interceptable. This difference also helps explain this(...) versus target(...): this(...) observes the proxy type, while target(...) observes the object behind it, so their matching behavior can change with proxy strategy.
