  - question: >-
      What does ProceedingJoinPoint.proceed() mean inside @Around advice?
    answer: >-
      proceed() transfers control to the next interceptor or advice in the chain and eventually to the target. Code before proceed() executes before the downstream invocation; code after it runs only when control returns after downstream completion or exception propagation. If the advice never calls proceed(), the chain stops there and the target may never execute. This makes proceed() a control-flow primitive for the invocation, not a harmless callback.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Around/Around.md"
      anchor: "around-mental-model"
    apiRelated:
