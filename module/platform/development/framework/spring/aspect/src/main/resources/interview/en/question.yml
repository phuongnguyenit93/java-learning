  - question: >-
      At the abstraction level, how does MethodInterceptor differ from @Around advice?
    answer: >-
      Both represent around-style interception and both expose a proceed primitive for continuing the chain. @Around belongs to the @AspectJ-style authoring model and works with ProceedingJoinPoint, while MethodInterceptor is a lower-level Spring AOP API that works with MethodInvocation. The execution model is closely related, but the APIs sit at different layers. Understanding MethodInterceptor makes Advisor and ProxyFactory behavior easier to reason about beneath annotation-based AOP.
