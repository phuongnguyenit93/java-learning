  - question: >-
      How does Spring AOP differ from full AspectJ, and why may timing around proceed() not represent end-to-end latency for async or reactive work?
    answer: >-
      Spring AOP focuses on method execution on Spring-managed objects through a proxy, while full AspectJ weaving supports a broader join point model and can operate outside a Spring proxy boundary depending on the weaving mode. For async or reactive methods, @Around measures the duration of the method invocation around proceed(); the method may return a CompletableFuture, Mono, or Flux quickly while the actual work finishes later. End-to-end latency therefore requires instrumentation tied to the asynchronous or reactive completion signal, not only proxy invocation timing.
