  - question: >-
      How does args(...) differ from execution(...) when matching parameter types?
    answer: >-
      execution(...) mainly sees the declared method signature, while args(...) can evaluate the runtime types of the actual arguments. For example, a method declared with an Object parameter can still match args(java.lang.String) when the caller passes a String. That distinction matters when you need to separate static signature matching from runtime data-dependent matching.
