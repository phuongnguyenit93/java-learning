  - question: >-
      Does @Aspect itself make a class a Spring bean, and why do Aspects often also need @Component or @Bean?
    answer: >-
      @Aspect describes AOP semantics, but it is not a component-scanning annotation. Spring's auto-proxy infrastructure needs the Aspect instance to exist in the ApplicationContext so it can turn that metadata into Advisors and apply them to candidate beans. For that reason, an Aspect is commonly also a @Component or is registered through a @Bean method. The annotation alone is not enough if Spring never manages an instance of the Aspect.
    aiGenerated: true
    reviewed: false
