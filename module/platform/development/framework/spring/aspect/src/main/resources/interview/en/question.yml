  - question: >-
      What is ProxyFactory used for, and how does it expose lower-level Spring AOP mechanics?
    answer: >-
      ProxyFactory lets you build an AOP proxy programmatically from a target plus Advice or MethodInterceptor instead of relying only on @Aspect declarations. It makes the architecture explicit: target + interceptor chain + proxy. MethodInterceptor receives a MethodInvocation and calls invocation.proceed() to continue the chain, which closely mirrors the mental model of @Around and ProceedingJoinPoint. This shows that annotation-style AOP is an authoring layer built on lower-level proxy/interceptor abstractions.
