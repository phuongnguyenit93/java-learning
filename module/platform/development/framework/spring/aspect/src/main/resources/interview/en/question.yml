  - question: >-
      Why can a Spring-managed bean be intercepted by AOP while an object created with new usually is not?
    answer: >-
      A Spring-managed bean can be wrapped by BeanPostProcessor and auto-proxy infrastructure before the reference is injected into consumers. An object created directly with new lives outside the ApplicationContext, so Spring does not replace that reference with an AOP proxy or attach an interceptor chain to its calls. As a result, the same method and the same pointcut can trigger advice on the managed bean while the plain object executes the target method directly.
    aiGenerated: true
