  - question: >-
      How does Spring Boot enable AOP and choose the default proxy strategy?
    answer: >-
      With the AOP starter and matching auto-configuration conditions, Spring Boot can enable AOP without the application explicitly adding @EnableAspectJAutoProxy. Boot documents spring.aop.auto as true by default and spring.aop.proxy-target-class as true by default, which prefers class-based proxying. If proxy-target-class is false and the target exposes a suitable interface, JDK dynamic proxying can be used. Keep documented defaults separate from properties explicitly configured by the application and from the proxy type observed at runtime.
