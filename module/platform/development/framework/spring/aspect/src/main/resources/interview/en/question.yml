  - question: >-
      How do Aspect, Advice, Join Point, Pointcut, Target Object, and AOP Proxy differ in Spring AOP?
    answer: >-
      An Aspect groups a cross-cutting concern. Advice is the concrete behavior that runs at selected join points. In Spring AOP, the join point model is method execution. A Pointcut is the rule that selects which method executions should receive advice. The Target Object is the real object containing the business method, while the AOP Proxy stands in front of it and builds the interceptor/advice chain when an invocation crosses the proxy boundary. A useful mental model is caller → proxy → pointcut/advice chain → target.
    aiGenerated: true
    reviewed: false
    readmeRelated:
