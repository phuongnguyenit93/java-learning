  - question: >-
      Why does self-invocation such as this.inner() usually bypass Spring AOP advice?
    answer: >-
      An external call begins outside the target and reaches the method through the proxy. A self-invocation happens when a target method directly calls another method on the same current object; that internal call does not leave the target and re-enter the proxy. Therefore the inner method may have a matching annotation and pointcut while its advice still does not run. This is a consequence of the proxy boundary, not a failure of the annotation itself.
