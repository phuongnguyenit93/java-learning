  - question: >-
      What is an AOP Introduction, and what does @DeclareParents change on the proxy?
    answer: >-
      An Introduction allows an AOP proxy to expose an additional interface that the original target class does not implement. @DeclareParents can declare that interface and provide its default implementation. The target class bytecode is not modified; the added capability exists on the proxy's type surface, so callers can cast the proxy to the introduced interface and use the new behavior. It is an advanced feature that should be documented clearly because it expands the caller-visible contract implicitly.
