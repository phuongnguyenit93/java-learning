        explanation: "Sai. `@AfterThrowing` chỉ chạy khi exception thoát ra phù hợp."
      - id: C
        answer: "Target → `@Before` → `@AfterReturning`."
        explanation: "Sai. `@Before` phải chạy trước target invocation."
      - id: A
        answer: "`@After` chỉ chạy khi success."
