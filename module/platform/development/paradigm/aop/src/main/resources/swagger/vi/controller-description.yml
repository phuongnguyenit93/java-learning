    <p>Tạo proxy bằng Spring ProxyFactory và so sánh JDK dynamic proxy với CGLIB proxy khi cả hai cùng sử dụng một interceptor.</p>
  readmeRelated:
    file: 11.ProxyFactory/ProxyFactory.md
AdviceLifecycleController:
  description: |-
