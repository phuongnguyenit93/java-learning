AdvisorController:
  description: |-
    <h2>Advisor Controller</h2>
    <p>Minh họa abstraction Advisor, trong đó Pointcut chọn các join point phù hợp còn Advice định nghĩa behavior được áp dụng lên chúng.</p>
    <p>Ví dụ đồng thời so sánh static method matching với runtime argument matching.</p>
  readmeRelated:
    file: 12.Advisor/Advisor.md
RuntimeBoundaryController:
  description: |-
    <h2>Runtime Boundary Controller</h2>
    <p>Quan sát ranh giới runtime của module và phân biệt cú pháp khai báo theo AspectJ với mô hình thực thi Spring AOP dựa trên proxy.</p>
  readmeRelated:
    file: 15.RuntimeBoundary/RuntimeBoundary.md
InfrastructureController:
  description: |-
    <h2>Infrastructure Controller</h2>
    <p>Kiểm tra hạ tầng Spring AOP đứng sau một managed bean, gồm auto-proxy creator, chiến lược proxy, loại proxy được tạo và chuỗi Advisor.</p>
  readmeRelated:
    file: 13.Infrastructure/Infrastructure.md
IntroductionController:
  description: |-
    <h2>Introduction Controller</h2>
    <p>Minh họa AOP Introduction bằng cách để proxy expose thêm một interface dù target class ban đầu không implement interface đó.</p>
  readmeRelated:
    file: 14.Introduction/Introduction.md
ProgrammaticProxyController:
  description: |-
