    <p>Minh họa annotation-driven AOP, trong đó custom annotation đóng vai trò declarative contract để Aspect match và đọc metadata.</p>
  readmeRelated:
    file: 7.Annotation/Annotation.md
AroundAdviceController:
  description: |-
