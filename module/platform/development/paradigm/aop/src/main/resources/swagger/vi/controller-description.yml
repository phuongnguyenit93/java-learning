  readmeRelated:
    file: 8.Ordering/Ordering.md
PracticalPatternController:
  description: |-
    <h2>Practical Pattern Controller</h2>
    <p>Kết hợp auditing và timing thành các cross-cutting behavior có thể tái sử dụng quanh business operation checkout.</p>
  readmeRelated:
    file: 10.Patterns/Patterns.md
