  - question: >-
      Các pointcut designator execution, within, args, @annotation, this, target và bean dùng để match theo gì?
    answer: >-
      execution chủ yếu match method execution/signature; within match theo declaring type hoặc package boundary; args nhìn runtime argument shape/type; @annotation match method có annotation cụ thể; this nhìn type của proxy object; target nhìn type của target object phía sau proxy; bean là designator riêng của Spring để match theo bean name. Pointcut nên đủ hẹp và có thể dự đoán, thay vì dùng expression quá rộng rồi để Aspect vô tình áp dụng vào nhiều method không liên quan.
