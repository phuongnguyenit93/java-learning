  - question: >-
      @Order ảnh hưởng call chain của nhiều @Around Aspect như thế nào?
    answer: >-
      Khi nhiều Around Aspect cùng match, chain có dạng nested call stack. Với precedence hiện tại, Aspect có order nhỏ hơn đứng ngoài: A before → B before → target → B after → A after. Chiều đi ra đảo ngược chiều đi vào vì mỗi advice đang bao quanh advice tiếp theo. Nếu correctness phụ thuộc thứ tự thì phải khai báo precedence rõ, không suy ra contract từ vài dòng log quan sát được.
