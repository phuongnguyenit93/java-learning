  - question: >-
      JDK Dynamic Proxy và CGLIB/class-based proxy khác nhau ở điểm nào?
    answer: >-
      JDK Dynamic Proxy tạo proxy dựa trên interface, nên type surface của proxy chủ yếu là các interface được expose. CGLIB/class-based proxy tạo subclass của target class, nên caller có thể nhìn thấy concrete type surface rộng hơn. Strategy cũng ảnh hưởng limitation: class-based proxy không thể override final method hoặc subclass final class. Không có strategy nào luôn tốt hơn; điều cần hiểu là type surface, khả năng intercept và cách application inject/cast bean.
    aiGenerated: true
    reviewed: false
    readmeRelated:
