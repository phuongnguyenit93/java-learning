  - question: >-
      Mental model đúng của Spring AOP proxy là gì?
    answer: >-
      Consumer thường nhận một proxy thay vì reference trực tiếp tới target. Khi method call đi qua proxy, Spring xây hoặc đi qua interceptor chain, kiểm tra các Advisor/pointcut phù hợp rồi mới tới target. Câu hỏi quan trọng nhất khi debug không phải chỉ là annotation có tồn tại hay không, mà là invocation có đi qua proxy boundary hay không. Nếu call không đi qua proxy thì advice không có cơ hội tham gia.
    aiGenerated: true
    reviewed: false
    readmeRelated:
