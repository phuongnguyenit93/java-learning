  - question: >-
      Một @Around advice nên xử lý exception và việc gọi proceed() nhiều lần như thế nào?
    answer: >-
      Advice có thể catch exception để log, đo metric hoặc cleanup rồi rethrow nhằm giữ nguyên contract của target. Swallow exception hoặc đổi thành success chỉ nên làm khi đó là contract rõ ràng. Về kỹ thuật, proceed() có thể ảnh hưởng sâu tới control flow; gọi nhiều lần có thể khiến target hoặc downstream interceptor thực thi nhiều lần và tạo side effect lặp. Vì vậy không nên coi proceed() như callback có thể gọi tùy ý.
