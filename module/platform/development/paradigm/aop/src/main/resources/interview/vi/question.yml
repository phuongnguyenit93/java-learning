  - question: >-
      Vì sao mutable field trong Aspect có thể gây race condition?
    answer: >-
      Aspect bean thông thường là singleton trong ApplicationContext nên nhiều request/thread có thể cùng đi qua một Aspect instance. Mutable field như currentRequestCount hoặc currentUser có thể bị đọc/ghi đồng thời, tạo race condition hoặc làm state của request này rò sang request khác. Ưu tiên Aspect stateless; nếu cần state thì phải thiết kế scope và concurrency semantics rõ ràng thay vì giả định mỗi invocation có một Aspect instance riêng.
