  - question: >-
      Spring AOP có hỗ trợ toàn bộ AspectJ join point model không?
    answer: >-
      Không. Spring AOP dùng AspectJ pointcut expression language cho nhiều trường hợp nhưng runtime vẫn là proxy-based method interception trên Spring-managed object. Các join point như method call, field get/set, initialization hay control-flow pointcut không thuộc capability thông thường của Spring AOP proxy. Khi cần model rộng hơn ngoài proxy method execution thì phải cân nhắc full AspectJ weaving hoặc cơ chế instrumentation khác phù hợp.
