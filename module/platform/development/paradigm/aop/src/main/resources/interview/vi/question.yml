  - question: >-
      ProceedingJoinPoint.proceed() có ý nghĩa gì trong @Around advice?
    answer: >-
      proceed() chuyển quyền thực thi sang phần tiếp theo của interceptor/advice chain và cuối cùng có thể tới target. Code trước proceed() chạy trước downstream invocation; code sau proceed() chỉ chạy khi control quay lại advice sau khi downstream hoàn thành hoặc ném exception. Nếu không gọi proceed() thì chain dừng tại advice hiện tại và target có thể không chạy. Vì vậy proceed() là primitive điều khiển invocation chứ không phải callback vô hại.
