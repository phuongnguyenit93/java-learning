  - question: >-
      @Before, @AfterReturning, @AfterThrowing, @After và @Around khác nhau về lifecycle semantics như thế nào?
    answer: >-
      @Before chạy trước target invocation. @AfterReturning chỉ chạy khi invocation return bình thường. @AfterThrowing chỉ chạy khi invocation thoát ra bằng exception phù hợp. @After có finally-like semantics và chạy khi invocation kết thúc dù success hay failure. @Around bao quanh toàn bộ chain và có proceed(), nên có quyền điều khiển control flow mạnh nhất. Nên chọn advice yếu nhất nhưng đủ đáp ứng requirement để flow dễ hiểu hơn.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.Advice/Advice.md"
      anchor: "advice-semantics"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Trên success path, @AfterReturning và @After khác nhau ở đâu?
    answer: >-
      @AfterReturning chỉ chạy khi target hoàn thành bình thường và có thể bind return value để quan sát. @After chạy theo finally-like semantics nên vẫn chạy cả khi target ném exception. Trên một success path có thể thấy @Before → target → @AfterReturning → @After, nhưng không nên dùng thứ tự source code của nhiều advice cùng loại làm contract nếu framework không cung cấp precedence rõ ràng.
    aiGenerated: true
    reviewed: false
    readmeRelated:
