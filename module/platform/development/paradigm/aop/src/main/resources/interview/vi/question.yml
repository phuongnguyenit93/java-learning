  - question: >-
      Vì sao custom annotation thường được dùng làm declarative contract cho AOP?
    answer: >-
      Annotation cho phép business method tuyên bố intent như audited, measured hoặc tracked mà không chứa implementation của concern đó. Aspect dùng @annotation để match và có thể bind trực tiếp annotation instance để đọc metadata. Nếu Aspect cần đọc annotation ở runtime thì annotation phải có RetentionPolicy.RUNTIME. Cách này thường rõ hơn pointcut phụ thuộc sâu vào naming convention hoặc package, miễn là annotation biểu diễn một contract dễ hiểu.
