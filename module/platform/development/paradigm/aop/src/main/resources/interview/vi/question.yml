  - question: >-
      Vì sao static method và constructor không phải join point phù hợp cho proxy-based Spring AOP thông thường?
    answer: >-
      Spring AOP thông thường intercept instance method invocation khi caller đi qua một proxy object. Static method thuộc về class và lời gọi của nó không dispatch qua instance proxy theo cách đó, còn constructor chạy trong quá trình tạo object trước khi Spring có thể đưa proxy thay raw bean reference cho consumer. Vì vậy proxy-based Spring AOP không phải cơ chế để intercept static method hoặc constructor execution. Nếu thật sự cần các join point kiểu constructor hoặc static/class-level behavior ngoài proxy method invocation thì phải cân nhắc cơ chế khác, chẳng hạn full AspectJ weaving hoặc instrumentation phù hợp.
