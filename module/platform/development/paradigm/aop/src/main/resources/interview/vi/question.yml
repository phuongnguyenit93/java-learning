      args(...) khác execution(...) như thế nào khi match parameter type?
    answer: >-
      execution(...) dựa chủ yếu trên declared method signature. args(...) có thể xét runtime argument type của invocation. Vì vậy một method khai báo parameter là Object nhưng được gọi với String có thể match args(java.lang.String) dù declared type vẫn là Object. Đây là lý do cần phân biệt static method signature với dữ liệu runtime khi thiết kế pointcut.
