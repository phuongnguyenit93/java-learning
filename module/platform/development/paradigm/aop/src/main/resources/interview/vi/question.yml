  - question: >-
      @Around có thể thay đổi return value hoặc bỏ qua target không và rủi ro là gì?
    answer: >-
      Có. Advice có thể nhận result từ proceed(), transform result trước khi trả cho caller, hoặc thậm chí không gọi proceed() và tự trả result. Điều đó làm Aspect có khả năng thay đổi contract mà caller quan sát được và thậm chí ngăn business method chạy. Đây là capability hợp lệ nhưng cần dùng có chủ đích; nếu transformation hay short-circuit bị giấu trong Aspect thì code trở nên khó debug và business flow khó dự đoán.
