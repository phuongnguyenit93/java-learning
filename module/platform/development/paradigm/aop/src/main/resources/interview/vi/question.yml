  - question: >-
      Cùng một target và interceptor, ProxyFactory tạo JDK proxy và CGLIB proxy khác nhau ra sao về type surface?
    answer: >-
      Với JDK proxy, caller chủ yếu tương tác qua interface đã cấu hình và proxy không trở thành subclass của concrete target. Với CGLIB, proxy là subclass nên concrete target methods có thể nằm trên type surface của proxy nếu intercept được. Điều này cũng giải thích vì sao this(...) nhìn proxy type còn target(...) nhìn target type và có thể cho kết quả khác nhau khi thay đổi proxy strategy.
