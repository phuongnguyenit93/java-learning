  - question: >-
      @Aspect có tự làm class trở thành Spring bean không và vì sao Aspect thường cần @Component hoặc @Bean?
    answer: >-
      @Aspect mô tả semantics AOP của class nhưng không phải component-scanning annotation. Spring auto-proxy infrastructure cần Aspect instance tồn tại trong ApplicationContext để chuyển metadata của nó thành Advisor và áp dụng lên candidate bean. Vì vậy Aspect thường đồng thời là @Component hoặc được khai báo bằng @Bean. Nếu object Aspect không được quản lý như bean phù hợp thì chỉ có annotation chưa đủ để Spring dùng nó.
