  - question: >-
      Vì sao một Spring-managed bean có thể được AOP intercept còn object tạo bằng new thì không?
    answer: >-
      Spring-managed bean có thể được BeanPostProcessor/auto-proxy infrastructure bọc thành AOP proxy trước khi inject cho consumer. Object tạo trực tiếp bằng new nằm ngoài ApplicationContext nên Spring không thay reference đó bằng proxy và không gắn interceptor chain vào invocation. Vì vậy cùng một method và cùng pointcut expression, nhánh Spring-managed có thể chạy advice còn plain object thì chỉ chạy target trực tiếp.
