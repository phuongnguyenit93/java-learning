  - question: >-
      Annotation-based pointcut có đảm bảo advice chắc chắn chạy không?
    answer: >-
      Không. Annotation chỉ giúp pointcut mô tả selection rule. Invocation vẫn phải đi qua AOP proxy và method phải intercept được theo proxy strategy hiện tại. Self-invocation, plain object tạo bằng new, final/private method trong class-based proxy hoặc bean không được proxy đều có thể khiến annotation tồn tại nhưng advice không chạy. Khi debug phải kiểm tra cả proxy boundary lẫn pointcut matching.
