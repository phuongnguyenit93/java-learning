  - question: >-
      Final method, private method và final class ảnh hưởng class-based proxy như thế nào?
    answer: >-
      Class-based proxy hoạt động bằng subclassing nên final method không thể override để chèn interceptor, private method cũng không thể override, còn final class không thể được subclass để tạo proxy. Vì vậy annotation vẫn có thể tồn tại trên final method nhưng advice không chạy. Đây là limitation khác self-invocation: self-invocation bỏ qua proxy boundary, còn final/private limitation đến từ khả năng override của proxy subclass.
