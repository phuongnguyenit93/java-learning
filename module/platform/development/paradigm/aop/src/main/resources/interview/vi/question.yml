  - question: >-
      Vì sao không nên biến @Order giữa nhiều Aspect thành business workflow ngầm?
    answer: >-
      Ordering phù hợp để định nghĩa precedence giữa các cross-cutting concern, nhưng nếu business correctness phụ thuộc chuỗi Aspect A sửa dữ liệu cho B, B bắt buộc chạy trước C rồi C trước D thì dependency đã bị giấu trong infrastructure. Flow như vậy khó đọc, khó test và dễ vỡ khi thêm Aspect mới. Business protocol nên nằm trong service/abstraction rõ ràng, còn AOP giữ vai trò cross-cutting có boundary đơn giản.
