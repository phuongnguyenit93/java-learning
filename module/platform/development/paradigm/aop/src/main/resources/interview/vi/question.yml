  - question: >-
      Khi target ném exception, @AfterThrowing và @After hoạt động ra sao?
    answer: >-
      @AfterThrowing chỉ chạy trên exception path khi exception phù hợp với binding/pointcut của advice. @After vẫn chạy vì có semantics giống finally. @AfterReturning không chạy vì target không return bình thường. Nếu mục tiêu chỉ là logging hoặc metrics, thường nên quan sát rồi giữ nguyên exception contract; recovery hoặc biến exception thành result là thay đổi control flow mạnh hơn và thường phù hợp với @Around khi thật sự cần.
    aiGenerated: true
    reviewed: false
