questions:
  - question: >-
      AOP giải quyết bài toán gì và cross-cutting concern khác business concern như thế nào?
    answer: >-
      Business concern là logic cốt lõi của use case như tạo đơn hàng hay tính giá. Cross-cutting concern là behavior xuất hiện ở nhiều nơi nhưng không phải mục tiêu nghiệp vụ chính, ví dụ logging, auditing, tracing, metrics hoặc authorization boundary. AOP giúp tách những concern dùng chung này khỏi business code và áp dụng chúng tại một boundary có thể mô tả rõ bằng pointcut hoặc annotation. AOP không thay thế business logic; nó chỉ đưa behavior dùng chung ra khỏi target method.
