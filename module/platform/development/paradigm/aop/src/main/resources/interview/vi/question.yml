  - question: >-
      proceed(Object[]) được dùng thế nào để thay đổi argument trong Spring AOP?
    answer: >-
      Around advice có thể đọc joinPoint.getArgs(), tạo argument list mới rồi gọi proceed(newArgs). Trong proxy-based Spring AOP, array đó đại diện cho argument list mới của underlying method invocation và số phần tử phải phù hợp với method arguments. Target sẽ nhận argument mới. Semantics này không nên được mặc định là hoàn toàn giống AspectJ-compiled around advice, nơi proceed arguments liên quan tới các parameter được bind vào advice signature.
