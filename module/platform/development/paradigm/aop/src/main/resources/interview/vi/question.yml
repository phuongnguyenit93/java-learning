  - question: >-
      Làm sao chứng minh một logging concern thực sự được tách khỏi business method bằng Spring AOP?
    answer: >-
      Hãy kiểm tra target service không tự ghi các event logging trước và sau business logic, nhưng khi gọi Spring-managed bean qua proxy thì event vẫn xuất hiện quanh nhiều method. Điều đó chứng minh behavior nằm trong Aspect và được áp dụng từ bên ngoài target. Nếu cùng object được gọi ngoài proxy boundary thì behavior đó sẽ không tự xuất hiện chỉ vì code của method giống nhau.
    aiGenerated: true
