  - question: >-
      Aspect, Advice, Join Point, Pointcut, Target Object và AOP Proxy khác nhau như thế nào trong Spring AOP?
    answer: >-
      Aspect là nơi gom một cross-cutting concern. Advice là behavior cụ thể chạy tại join point được chọn. Join point của Spring AOP là method execution. Pointcut là rule chọn subset các method execution cần áp dụng advice. Target Object là object thật chứa business method, còn AOP Proxy là object đứng trước target và xây interceptor/advice chain khi invocation đi qua nó. Một call thường có mental model: caller → proxy → pointcut/advice chain → target.
    aiGenerated: true
    reviewed: false
