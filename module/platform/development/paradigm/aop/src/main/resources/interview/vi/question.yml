  - question: >-
      JoinPoint và ProceedingJoinPoint khác nhau như thế nào trong Spring AOP, và khi nào bạn cần ProceedingJoinPoint?
    answer: >-
      JoinPoint cung cấp context của invocation như method signature, target, proxy reference và arguments để advice quan sát invocation. ProceedingJoinPoint là dạng mở rộng dùng cho @Around advice và thêm proceed() / proceed(Object[]) để tiếp tục hoặc điều khiển invocation chain. Vì vậy @Before, @AfterReturning hoặc @AfterThrowing thường chỉ cần JoinPoint nếu cần đọc context, còn @Around cần ProceedingJoinPoint khi advice phải quyết định có tiếp tục target hay không, thay argument, quan sát hoặc thay return value, hoặc xử lý control flow quanh invocation.
