  - question: >-
      this(...) và target(...) khác nhau như thế nào trong Spring AOP?
    answer: >-
      this(...) match dựa trên type của proxy object mà caller đang tương tác, còn target(...) match dựa trên type của target object thật phía sau proxy. Với class-based proxy hai type có thể khá giống nhau, nhưng với JDK proxy thì proxy implements interface trong khi target là concrete class. Vì vậy cùng một invocation có thể cho kết quả matching khác nhau tùy proxy strategy.
