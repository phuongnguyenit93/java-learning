  - question: >-
      Dùng @Aspect, @Before hay @Around có đồng nghĩa application đang dùng full AspectJ weaving không?
    answer: >-
      Không. Các annotation đó thuộc @AspectJ declaration style, nhưng Spring có thể đọc metadata rồi triển khai bằng Spring AOP proxy tại runtime. Full AspectJ có compile-time hoặc load-time weaving và join point model rộng hơn. Vì vậy phải tách syntax khai báo khỏi runtime mechanism; nhìn thấy package org.aspectj hoặc annotation AspectJ không đủ để kết luận bytecode đang được weave bằng AspectJ.
    aiGenerated: true
