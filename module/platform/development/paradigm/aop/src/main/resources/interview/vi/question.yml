  - question: >-
      Vì sao self-invocation như this.inner() thường bypass Spring AOP advice?
    answer: >-
      External call bắt đầu từ ngoài target nên đi qua proxy trước khi tới method. Self-invocation xảy ra khi method trên target gọi trực tiếp method khác trên chính object hiện tại; call đó không quay ra proxy lần thứ hai. Vì vậy inner method có thể mang annotation và pointcut vẫn đúng nhưng advice không chạy. Đây là hệ quả của proxy boundary, không phải bug của annotation.
