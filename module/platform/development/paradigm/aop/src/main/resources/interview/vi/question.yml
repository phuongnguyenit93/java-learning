  - question: >-
      Static MethodMatcher và dynamic MethodMatcher khác nhau như thế nào?
    answer: >-
      Static matching chỉ cần Method và targetClass nên framework có thể quyết định dựa trên metadata. Dynamic matching có static phase trước, sau đó nếu isRuntime() là true thì framework còn đánh giá runtime arguments cho từng invocation. Dynamic pointcut hữu ích khi selection thật sự phụ thuộc dữ liệu như mode="audit", nhưng có thêm runtime evaluation cost và complexity; nếu chỉ cần type/method metadata thì static matcher đơn giản hơn.
