  - id: self-invocation-refactor
    question: "Which design is usually preferred to avoid the self-invocation limitation?"
    answers:
      - {id: A, answer: "Call `AopContext.currentProxy()` in every method.", explanation: "Incorrect. This is an escape hatch that couples application code directly to AOP infrastructure."}
      - {id: B, answer: "Refactor the boundary so Bean A calls Bean B through a Spring-managed proxy.", explanation: "Correct. The README prefers moving the boundary between beans."}
      - {id: C, answer: "Make every method static.", explanation: "Incorrect. That does not solve proxy interception in the desired way."}
      - {id: D, answer: "Construct a new object inside the method with `new`.", explanation: "Incorrect. That moves the invocation even further outside the Spring-managed proxy boundary."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
