  - id: self-invocation-bypass
    question: "Why can `this.inner()` inside a target bypass Spring AOP advice?"
    answers:
      - {id: D, answer: "Because the method call happens directly on the current target and does not cross the proxy boundary again.", explanation: "Correct. This is the core self-invocation limitation of proxy-based AOP."}
      - {id: B, answer: "Because `this` is always null inside a Spring bean.", explanation: "Incorrect. `this` still refers to the current object."}
      - {id: C, answer: "Because annotations only work on controllers.", explanation: "Incorrect. Annotations can be applied to service methods."}
      - {id: A, answer: "Because Spring disables AOP after the first invocation.", explanation: "Incorrect. The problem is the call path, not AOP being disabled."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.SelfInvocation/SelfInvocation.md", anchor: "self-invocation-demo"}
