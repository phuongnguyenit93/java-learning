  - id: final-method-cglib-limit
    question: "Why is a final method a limitation for a class-based/CGLIB proxy?"
    answers:
      - {id: C, answer: "Because a class-based proxy relies on subclassing/overriding methods for interception, and a final method cannot be overridden.", explanation: "Correct. The annotation may exist, but the proxy subclass still cannot insert an interceptor into that final method."}
      - {id: B, answer: "Because the JVM does not allow final methods to be called.", explanation: "Incorrect. Final methods can be called normally; they simply cannot be overridden."}
      - {id: A, answer: "Because every final method is private.", explanation: "Incorrect. `final` and `private` are different modifiers."}
      - {id: D, answer: "Because final methods must always use JDK proxies.", explanation: "Incorrect. The demo is specifically about a limitation of class-based proxies."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.SelfInvocation/SelfInvocation.md", anchor: "final-method-demo"}
    apiRelated: {controller: "SelfInvocationController", methodSignature: "finalMethodLimitation()"}

  - id: aop-business-logic-boundary
    question: "When pricing, order-state transitions, or workflow decisions are core business rules, which design is the best fit?"
    answers:
      - {id: D, answer: "Keep those rules in explicit service/domain abstractions, using Aspects only for cross-cutting concerns around the boundary when appropriate.", explanation: "Correct. Core business decisions should have explicit dependencies and control flow instead of being hidden inside an Aspect."}
