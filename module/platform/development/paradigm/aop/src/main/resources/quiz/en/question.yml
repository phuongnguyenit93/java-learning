  - id: around-exception-propagation
    question: "An `@Around` Aspect logs exceptions. If the requirement is only to observe failures, which behavior is less surprising?"
    answers:
      - {id: A, answer: "Catch every exception and always return a fake success value so callers never see the failure.", explanation: "Incorrect. This can break the target contract and hide failures."}
      - {id: B, answer: "Catch to record the failure, rethrow the exception, and use `finally` for required cleanup.", explanation: "Correct. The module demonstrates observing an exception while preserving the propagation contract."}
      - {id: C, answer: "Call `proceed()` repeatedly until the invocation succeeds.", explanation: "Incorrect. Multiple proceeds can repeat side effects and are not a safe default retry policy."}
      - {id: D, answer: "Never catch exceptions inside `@Around` advice.", explanation: "Incorrect. Advice may catch to observe or intentionally transform according to a clear contract."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.Around/Around.md", anchor: "around-exception-demo"}
    apiRelated: {controller: "AroundAdviceController", methodSignature: "exceptionPropagation()"}

  - id: annotation-runtime-retention
    question: "Why does a custom annotation used for runtime AOP matching commonly need `RetentionPolicy.RUNTIME`?"
    answers:
      - {id: A, answer: "So the JVM creates an extra thread when the annotation is read.", explanation: "Incorrect. Retention has nothing to do with thread creation."}
      - {id: B, answer: "So the annotation metadata remains available for the Aspect/framework to inspect at runtime.", explanation: "Correct. This module reads `@TrackExecution` metadata while the application is running."}
      - {id: C, answer: "So the annotation automatically turns the method into a Spring bean.", explanation: "Incorrect. A method-level annotation does not make that method a bean."}
      - {id: D, answer: "So the invocation can bypass the proxy boundary.", explanation: "Incorrect. An annotation still requires the invocation to cross the proxy for Spring AOP interception."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.Annotation/Annotation.md", anchor: "annotation-contract"}
    apiRelated: {controller: "AnnotationDrivenController", methodSignature: "trackByAnnotation()"}

  - id: annotation-contract-not-guarantee
    question: "A method has `@TrackExecution` but is invoked through self-invocation inside the same target. Which statement is correct?"
    answers:
      - {id: A, answer: "The annotation guarantees that advice runs whether or not the call goes through a proxy.", explanation: "Incorrect. The annotation is declarative matching metadata; it does not remove proxy limitations."}
      - {id: B, answer: "Advice may not run because the internal call does not return through the proxy.", explanation: "Correct. This directly connects the Annotation and SelfInvocation chapters."}
      - {id: C, answer: "Spring automatically weaves the method bytecode at compile time.", explanation: "Incorrect. This module uses proxy-based Spring AOP."}
      - {id: D, answer: "Adding the annotation makes the method final.", explanation: "Incorrect. The annotation does not change Java method modifiers."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.Annotation/Annotation.md", anchor: "annotation-vs-expression"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: aspect-order-nested-stack
    question: "Two `@Around` Aspects with `@Order(1)` and `@Order(2)` match the same target. With the precedence described in the README, which sequence is correct?"
    answers:
      - {id: C, answer: "order1-before → order2-before → target → order2-after → order1-after", explanation: "Correct. The advice chain is a nested call stack, so the unwind order reverses the entry order."}
      - {id: B, answer: "order1-before → order1-after → order2-before → order2-after → target", explanation: "Incorrect. Around advice wraps the chain instead of acting like a flat callback list."}
      - {id: A, answer: "target → order1-before → order2-before → order1-after → order2-after", explanation: "Incorrect. The before portions run before the target."}
      - {id: D, answer: "Multiple Aspects cannot match the same join point.", explanation: "Incorrect. That is precisely why ordering exists."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.Ordering/Ordering.md", anchor: "ordering-demo"}
    apiRelated: {controller: "OrderingController", methodSignature: "observeOrdering()"}

