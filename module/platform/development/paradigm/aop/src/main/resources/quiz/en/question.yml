  - id: advice-success-lifecycle
    question: "A target method returns normally. Which semantic sequence best matches the advice lifecycle in this module?"
    answers:
      - {id: D, answer: "`@Before` → target → `@AfterReturning` → `@After`.", explanation: "Correct. `@AfterReturning` appears only on the success path, while `@After` has finally-like semantics."}
      - {id: B, answer: "`@AfterThrowing` → target → `@Before`.", explanation: "Incorrect. `@AfterThrowing` runs only when a matching exception leaves the invocation."}
      - {id: C, answer: "target → `@Before` → `@AfterReturning`.", explanation: "Incorrect. `@Before` must run before the target invocation."}
      - {id: A, answer: "`@After` runs only on success.", explanation: "Incorrect. `@After` has finally-like semantics."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.Advice/Advice.md", anchor: "advice-success-demo"}
    apiRelated: {controller: "AdviceLifecycleController", methodSignature: "success()"}

  - id: advice-failure-lifecycle
    question: "Assume the pointcut matches the invocation and the escaping exception also matches the `@AfterThrowing` type/binding. Which advice should you not expect on this failure path?"
    answers:
      - {id: A, answer: "`@Before`", explanation: "Incorrect. It already ran before the target."}
      - {id: B, answer: "`@AfterThrowing`", explanation: "Incorrect. Under the stated assumption that the exception matches the binding, `@AfterThrowing` is expected on this failure path."}
      - {id: C, answer: "`@AfterReturning`", explanation: "Correct. The target did not return normally, so `@AfterReturning` does not run."}
      - {id: D, answer: "`@After`", explanation: "Incorrect. `@After` has finally-like semantics and still runs when the invocation ends with an exception."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.Advice/Advice.md", anchor: "advice-failure-demo"}
    apiRelated: {controller: "AdviceLifecycleController", methodSignature: "failure()"}

  - id: advice-weakest-sufficient
    question: "If you only need to observe a successful return value and do not need to alter control flow, which advice type is a better fit than `@Around`?"
    answers:
      - {id: C, answer: "`@AfterReturning`", explanation: "Correct. The README recommends choosing the weakest advice type that still satisfies the requirement."}
      - {id: B, answer: "`@AfterThrowing`", explanation: "Incorrect. That advice is intended for exception paths."}
      - {id: A, answer: "You must always use `@Around` because other advice types cannot access data.", explanation: "Incorrect. `@AfterReturning` can bind the return value."}
      - {id: D, answer: "No advice type can observe a return value.", explanation: "Incorrect. This is a standard capability of `@AfterReturning`."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.Advice/Advice.md", anchor: "advice-semantics"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: around-proceed-control
    question: "What is the best description of `ProceedingJoinPoint.proceed()` inside `@Around` advice?"
    answers:
      - {id: A, answer: "It creates a new thread to run the target.", explanation: "Incorrect. `proceed()` is not a concurrency primitive."}
      - {id: B, answer: "It continues the interceptor/advice chain and eventually reaches the target if the chain allows it.", explanation: "Correct. This is the control-flow handoff provided to around advice."}
      - {id: C, answer: "It commits the current transaction.", explanation: "Incorrect. Transaction semantics are not the general meaning of `proceed()`."}
      - {id: D, answer: "It only reads join-point metadata.", explanation: "Incorrect. `proceed()` actually continues the invocation."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.Around/Around.md", anchor: "around-mental-model"}
    apiRelated: {controller: "AroundAdviceController", methodSignature: "timing()"}

  - id: around-skip-target
    question: "What happens when `@Around` advice does not call `proceed()` and returns a value itself?"
    answers:
      - {id: A, answer: "The target always runs in the background after the advice returns.", explanation: "Incorrect. The chain stops at the current advice."}
      - {id: B, answer: "Spring throws because `proceed()` must be called exactly once.", explanation: "Incorrect. Around advice is allowed to omit `proceed()`."}
      - {id: C, answer: "The target is not executed, and the caller receives the value returned by the advice.", explanation: "Correct. The module has a dedicated experiment for this behavior."}
      - {id: D, answer: "Only `@Before` advice can skip the target.", explanation: "Incorrect. `@Before` has no `proceed()` control; around advice has this capability."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.Around/Around.md", anchor: "around-skip-demo"}
    apiRelated: {controller: "AroundAdviceController", methodSignature: "skip()"}

  - id: around-argument-rewrite
    question: "In this module's Spring AOP runtime, what is `proceed(new Object[]{...})` used for?"
    answers:
      - {id: D, answer: "Replace the underlying method invocation's argument list before continuing the chain.", explanation: "Correct. The module normalizes an argument and passes the new array to `proceed(Object[])`."}
      - {id: B, answer: "Switch the proxy strategy from CGLIB to JDK.", explanation: "Incorrect. Proxy strategy is unrelated to this API."}
      - {id: C, answer: "Replace the return value after the target has run.", explanation: "Incorrect. Return transformation is a different around-advice capability."}
      - {id: A, answer: "Bind an annotation instance to an advice parameter.", explanation: "Incorrect. `@annotation(...)` performs that kind of binding."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.Around/Around.md", anchor: "around-arguments-demo"}
