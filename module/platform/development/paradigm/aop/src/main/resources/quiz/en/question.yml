# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: aop-cross-cutting-purpose
    question: "Which situation is the best fit for AOP?"
    answers:
      - {id: D, answer: "Extract repeated logging, timing, or auditing from multiple business methods with clear boundaries.", explanation: "Correct. These are classic cross-cutting concerns: they appear across multiple targets but are not the core business logic."}
      - {id: B, answer: "Move all pricing rules and order workflow into an Aspect so services become shorter.", explanation: "Incorrect. Hiding core business rules inside an Aspect makes dependencies and control flow harder to understand."}
      - {id: C, answer: "Use Aspects to replace every interface between modules.", explanation: "Incorrect. AOP does not replace ordinary abstractions or module boundaries."}
      - {id: A, answer: "Use AOP whenever a method is longer than 20 lines.", explanation: "Incorrect. Method length is not what defines a cross-cutting concern."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.CrossCutting/CrossCutting.md", anchor: "cross-cutting-concern"}
    apiRelated: {controller: "CrossCuttingController", methodSignature: "observeCrossCutting()"}

  - id: aop-cross-cutting-boundary
    question: "Which condition makes a cross-cutting concern a stronger candidate for AOP?"
    answers:
      - {id: A, answer: "The behavior depends on as much mutable business state as possible.", explanation: "Incorrect. That usually makes an Aspect harder to predict and test."}
      - {id: B, answer: "The concern appears across multiple targets and can be described by a clear boundary such as a pointcut or annotation.", explanation: "Correct. The README emphasizes genuine cross-cutting behavior with a clear boundary."}
      - {id: C, answer: "The concern appears exactly once in the whole system.", explanation: "Incorrect. A one-off concern usually gives little reason to move the behavior into AOP."}
      - {id: D, answer: "The concern needs to change business flow through many hidden branches.", explanation: "Incorrect. Hidden workflow is an AOP pitfall."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.CrossCutting/CrossCutting.md", anchor: "cross-cutting-conclusion"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: aop-terminology-map
    question: "In Spring AOP, which pairing of concepts is the most accurate?"
    answers:
      - {id: A, answer: "Aspect = method execution; Join Point = the class containing advice.", explanation: "Incorrect. An Aspect groups cross-cutting behavior; a join point is an execution point observed or selected by the AOP model."}
      - {id: B, answer: "Pointcut = executable behavior; Advice = rule that selects methods.", explanation: "Incorrect. Those roles are reversed."}
      - {id: C, answer: "A Pointcut selects join points; Advice is the behavior that runs when a matching join point is intercepted.", explanation: "Correct. This is the foundation of the terminology chapter."}
      - {id: D, answer: "Proxy and target are always the same runtime object.", explanation: "Incorrect. A proxy may be a wrapper or subclass that stands in front of the target."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Terminology/Terminology.md", anchor: "terminology-map"}
    apiRelated: {controller: "TerminologyController", methodSignature: "inspectTerminology()"}

  - id: aspect-annotation-not-component
    question: "A class has only `@Aspect` and is not registered as a Spring bean. Which statement is most accurate for this module's runtime?"
    answers:
      - {id: A, answer: "`@Aspect` automatically makes the class a component discovered by component scanning.", explanation: "Incorrect. `@Aspect` declares Aspect semantics but is not itself a component-scanning annotation."}
      - {id: B, answer: "Spring AOP needs the Aspect instance to exist in the ApplicationContext, for example through `@Component` or `@Bean`.", explanation: "Correct. This module uses both `@Aspect` and `@Component` for Aspects consumed by the auto-proxy infrastructure."}
      - {id: C, answer: "The Aspect still runs because the AspectJ compiler always weaves that class automatically.", explanation: "Incorrect. This module does not configure the AspectJ compiler or load-time weaving."}
      - {id: D, answer: "A new instance of the class is created for every invocation.", explanation: "Incorrect. Without a bean, Spring AOP has no Aspect bean to apply in this module's model."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Terminology/Terminology.md", anchor: "spring-aop-vs-aspectj-style"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: proxy-invocation-boundary
    question: "When debugging why advice did not run, what should you check first?"
    answers:
      - {id: C, answer: "Did the invocation actually pass through the Spring AOP proxy?", explanation: "Correct. If the call never crosses the proxy, even a correct pointcut cannot intercept it."}
      - {id: B, answer: "Does the generated proxy class name end with a fixed suffix?", explanation: "Incorrect. Runtime generated class names should not be used as the semantic contract."}
      - {id: A, answer: "Does the target method have more than one parameter?", explanation: "Incorrect. Parameter count is not the foundational condition for AOP interception."}
      - {id: D, answer: "Does the Aspect bean contain mutable fields?", explanation: "Incorrect. That is a thread-safety/design concern, not the first interception-boundary question."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Proxy/Proxy.md", anchor: "proxy-mental-model"}
    apiRelated: {controller: "ProxyMentalModelController", methodSignature: "inspectProxy()"}

  - id: managed-vs-new-aop
    question: "Why does `new SomeService()` usually not receive the same Spring AOP advice as a bean injected from the ApplicationContext?"
    answers:
      - {id: A, answer: "Objects created with `new` are always final and therefore cannot be proxied.", explanation: "Incorrect. The main issue is that the object is outside the Spring-managed proxy boundary."}
      - {id: B, answer: "Spring proxies controllers only, never services.", explanation: "Incorrect. Service beans can absolutely be proxied by Spring AOP."}
      - {id: C, answer: "Pointcuts work only on objects the JVM creates through reflection.", explanation: "Incorrect. Pointcut behavior does not depend on that rule."}
      - {id: D, answer: "The directly constructed object is not a Spring-managed proxy, so the invocation goes straight to the target object.", explanation: "Correct. The README contains a managed-bean versus plain-object experiment that demonstrates this boundary."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Proxy/Proxy.md", anchor: "managed-vs-new-demo"}
    apiRelated: {controller: "ProxyMentalModelController", methodSignature: "compareManagedBeanAndPlainObject()"}

  - id: proxy-jdk-vs-cglib-type-surface
    question: "What is an important difference between a JDK dynamic proxy and a class-based/CGLIB proxy?"
    answers:
      - {id: D, answer: "A JDK proxy is based on an interface surface, while a CGLIB proxy is a subclass of the target class.", explanation: "Correct. The strategy affects the visible type surface and some interception limitations."}
      - {id: B, answer: "A JDK proxy is always faster than CGLIB for every workload.", explanation: "Incorrect. The README makes no universal performance ranking."}
      - {id: C, answer: "A CGLIB proxy cannot run advice.", explanation: "Incorrect. Class-based proxies are a normal Spring AOP mechanism."}
      - {id: A, answer: "Both strategies always expose exactly the same method surface.", explanation: "Incorrect. The ProxyFactory demo exists specifically to show a type-surface difference."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Proxy/Proxy.md", anchor: "proxy-strategies"}
    apiRelated: {controller: "ProgrammaticProxyController", methodSignature: "compareProxyFactoryStrategies()"}

  - id: pointcut-args-vs-execution
    question: "A method declares its parameter as `Object` but receives a `String` at runtime. Which designator can match the runtime argument type?"
    answers:
      - {id: A, answer: "`execution(...)`", explanation: "Incorrect. `execution(...)` mainly considers the declared method signature."}
      - {id: B, answer: "`within(...)`", explanation: "Incorrect. `within(...)` matches a declaring type/package boundary."}
      - {id: C, answer: "`args(java.lang.String)`", explanation: "Correct. `args(...)` evaluates the runtime argument shape/type."}
      - {id: D, answer: "`bean(...)`", explanation: "Incorrect. `bean(...)` is a Spring-specific designator that matches by bean name."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Pointcut/Pointcut.md", anchor: "pointcut-demo"}
    apiRelated: {controller: "PointcutController", methodSignature: "comparePointcuts()"}

  - id: pointcut-this-vs-target
    question: "How do `this(...)` and `target(...)` differ in a Spring AOP pointcut?"
    answers:
      - {id: C, answer: "`this(...)` observes the proxy object/type, while `target(...)` observes the target object/type behind the proxy.", explanation: "Correct. The difference becomes especially visible when the proxy strategy changes."}
      - {id: B, answer: "The two designators are always equivalent under every proxy strategy.", explanation: "Incorrect. They have different semantics even if both happen to match in one experiment."}
      - {id: A, answer: "`target(...)` matches by bean name, while `this(...)` matches by annotation.", explanation: "Incorrect. Those are semantics of different designators."}
      - {id: D, answer: "`this(...)` is available only with full AspectJ weaving.", explanation: "Incorrect. This module uses it in Spring AOP pointcuts."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Pointcut/Pointcut.md", anchor: "pointcut-mental-model"}
    apiRelated: {controller: "PointcutController", methodSignature: "comparePointcuts()"}

  - id: spring-aop-pointcut-boundary
    question: "Which statement about Spring AOP pointcut language is correct?"
    answers:
      - {id: A, answer: "Because Spring AOP uses AspectJ expression syntax, it supports every AspectJ join point such as field get/set and constructor initialization.", explanation: "Incorrect. Similar syntax does not imply the same runtime join point model as full AspectJ."}
      - {id: B, answer: "Spring AOP focuses on method execution through proxies and does not normally support designators such as `call`, `get`, `set`, or `cflow`.", explanation: "Correct. This is an important boundary of proxy-based Spring AOP."}
      - {id: C, answer: "Spring AOP does not support `execution(...)`.", explanation: "Incorrect. It is one of the most common designators."}
      - {id: D, answer: "Pointcuts can only be written in Java code; there is no expression syntax.", explanation: "Incorrect. This module uses @AspectJ expression style."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Pointcut/Pointcut.md", anchor: "spring-aop-pointcut-boundary"}
