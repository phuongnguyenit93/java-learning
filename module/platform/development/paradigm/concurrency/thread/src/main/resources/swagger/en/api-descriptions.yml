  executionVariant():
    summary: Compare thenApply and thenApplyAsync
    description: Use an already-completed stage to show that thenApply may run inline
      on the caller while thenApplyAsync with an explicit executor is dispatched through
      that executor. The goal is to understand execution policy rather than assume
      every async variant always uses a different Thread.
