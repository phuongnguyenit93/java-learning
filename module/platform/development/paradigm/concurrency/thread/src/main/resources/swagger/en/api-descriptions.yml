  startVsRun():
    summary: Compare Thread.run() and Thread.start()
    description: Run the same Runnable by calling run() directly and by calling start()
      on a new Thread. The result shows that run() is a normal method call on the
      caller Thread, while start() begins the lifecycle of a separate Thread.
