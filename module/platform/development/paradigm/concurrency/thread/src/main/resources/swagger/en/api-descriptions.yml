  futureCancellation():
    summary: Compare Future.cancel(false) and cancel(true)
    description: Run two blocking tasks and cancel them with cancel(false) and cancel(true)
      to observe cancellation state and interruption behavior. cancel(true) may interrupt
      a running worker, while cancel(false) does not request interruption and the
      underlying task may continue.
    enableVideoYoutube: false
    videoYoutubeId: ID of youtube video add to API description
