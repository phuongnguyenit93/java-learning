    summary: Observe Callable and Future
    description: Submit a Callable to an ExecutorService, keep the task incomplete
      to observe isDone=false, then release it and retrieve the result with Future.get().
      The experiment shows that Future separates submission from result retrieval
      while get() is still a blocking wait.
