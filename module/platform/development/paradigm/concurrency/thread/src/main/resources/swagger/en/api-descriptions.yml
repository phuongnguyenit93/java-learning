  inheritance():
    summary: Observe InheritableThreadLocal at Thread creation
    description: The parent sets context A, creates a child Thread, then changes the
      context to B before the child starts. The child still sees A, showing that inheritance
      occurs at the Thread creation boundary rather than on each task execution.
    enableVideoYoutube: false
    videoYoutubeId: ID of youtube video add to API description
    videoYoutubeTitle: Title of video
    methodName: inheritance
