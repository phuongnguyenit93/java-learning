  poolReuseProblem():
    summary: Demonstrate stale context with worker reuse
    description: Use a worker pool created once to show that InheritableThreadLocal
      does not refresh context for every task submission. A later task can still see
      the context inherited when the worker was originally created.
    enableVideoYoutube: false
    videoYoutubeId: ID of youtube video add to API description
