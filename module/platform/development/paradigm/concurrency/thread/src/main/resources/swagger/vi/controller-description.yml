AsyncController:
  description: |-
    <h2>Async Controller</h2>
    <p>Nhóm API minh họa Future, CompletableFuture, completion pipeline, exception handling, timeout, cancellation và execution policy của asynchronous task.</p>
BasicThreadController:
  description: |-
    <h2>Basic Thread Controller</h2>
    <p>Các experiment nền tảng về JVM process, HTTP request thread, sự khác nhau giữa start() và run(), cùng toàn bộ Thread.State.</p>
CreateThreadController:
  description: |-
    <h2>Create Thread Controller</h2>
    <p>So sánh các cách nối task với execution mechanism: extends Thread, Runnable + Thread và Callable + FutureTask + Thread.</p>
DaemonThreadController:
  description: |-
    <h2>Daemon Thread Controller</h2>
    <p>Quan sát daemon flag và quy tắc inheritance của Thread trong Spring Boot; endpoint này không dùng để suy luận trực tiếp về thời điểm JVM shutdown.</p>
ConcurrencyProblemController:
  description: |-
    <h2>Concurrency Problem Controller</h2>
    <p>Nhóm experiment về race condition, Java Memory Model, happens-before, volatile và các vấn đề progress như deadlock, livelock.</p>
ThreadLocalController:
  description: |-
    <h2>Thread Local Controller</h2>
    <p>Minh họa ThreadLocal isolation, InheritableThreadLocal, stale context do worker reuse và pattern explicit context propagation.</p>
CoordinationController:
  description: |-
    <h2>Coordination Controller</h2>
    <p>Tập hợp các primitive phối hợp Thread gồm join, wait/notify, Condition, LockSupport, BlockingQueue và các synchronizer cấp cao.</p>
TaskExecutorController:
  description: |-
    <h2>Task Executor Controller</h2>
    <p>Minh họa Spring TaskExecutor và @Async với custom executor, TaskDecorator context propagation và failure handling của void async method.</p>
InterruptionController:
  description: |-
    <h2>Interruption Controller</h2>
    <p>Các experiment về cooperative cancellation, interrupt flag, InterruptedException, cleanup, giới hạn của interrupt và sự khác nhau với custom stop flag.</p>
LeakController:
  description: |-
    <h2>Leak Controller</h2>
    <p>Các demo bounded về Thread leak, pool lifecycle leak và queue pressure; mọi resource được cleanup trong cùng experiment để không để lại leak thật.</p>
ThreadPoolController:
  description: |-
    <h2>Thread Pool Controller</h2>
    <p>Khảo sát ThreadPoolExecutor flow, Executors factory, scheduling, rejection policy và lifecycle từ graceful đến forced shutdown.</p>
SynchronizationController:
  description: |-
    <h2>Synchronization Controller</h2>
    <p>Nhóm experiment về synchronized, Lock, ReadWriteLock, StampedLock, atomic/CAS và concurrent collections để bảo vệ shared mutable state.</p>
VirtualThreadController:
  description: |-
    <h2>Virtual Thread Controller</h2>
    <p>Minh họa Virtual Thread trên Java 21: thuộc tính cơ bản, API tạo thread, blocking scalability, downstream limits và ThreadLocal semantics.</p>
