# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:

  - id: thread-start-vs-run
    question: "A `Thread worker` has already been created. Which statement best describes the difference between `worker.run()` and `worker.start()`?"
    answers:
      - id: A
        answer: "Both create a new thread, but `start()` runs with higher priority."
        explanation: "Incorrect. `run()` is just a normal method call on the current thread; priority is not the difference between these two calls."
      - id: B
        answer: "`run()` executes on the caller thread, while `start()` begins a new thread lifecycle and the JVM executes `run()` on that thread."
        explanation: "Correct. This is the core mental model from the README: `run()` is a method call, while `start()` starts a separate Thread execution."
      - id: C
        answer: "`run()` is only for daemon threads, while `start()` is only for user threads."
        explanation: "Incorrect. Daemon status does not determine whether `run()` or `start()` can be called."
      - id: D
        answer: "`start()` can be called multiple times on the same Thread object as long as the previous run has finished."
        explanation: "Incorrect. A `Thread` object can only be started once; starting it again causes `IllegalThreadStateException`."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Basic/Basic.md"
      anchor: "start-vs-run"
    apiRelated:
      controller: "BasicThreadController"
      methodSignature: "startVsRun()"

  - id: task-vs-execution-mechanism
    question: "In the module's mental model, which statement describes the roles correctly?"
    answers:
      - id: A
        answer: "`Callable` is a kind of Thread that can return a result."
        explanation: "Incorrect. `Callable` describes a task that can return a result or throw a checked exception; it does not create or represent an execution thread."
      - id: B
        answer: "`Runnable` decides which thread pool will execute the task."
        explanation: "Incorrect. `Runnable` describes the work; execution policy belongs to a `Thread` or an `Executor`."
      - id: C
        answer: "`Runnable`/`Callable` describe WHAT to run; `Thread`/`Executor` determine WHERE/HOW execution happens."
        explanation: "Correct. Separating a task from its execution mechanism is fundamental to understanding Executor and Thread Pool abstractions."
      - id: D
        answer: "`Executor` is only shorthand for `new Thread(task).start()`."
        explanation: "Incorrect. An Executor can also manage execution strategy, worker reuse, queues, lifecycle, and rejection policy."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Basic/Basic.md"
      anchor: "thread-task"
    apiRelated:
      controller: "CreateThreadController"
      methodSignature: "createByRunnable()"

  - id: thread-state-blocked
    question: "A thread is trying to enter `synchronized(monitor)`, but another thread currently owns that monitor. Which `Thread.State` is the best match?"
    answers:
      - id: A
        answer: "WAITING"
        explanation: "Incorrect. `WAITING` commonly appears with indefinite waits such as `wait()`, `join()`, or `park()`, not while waiting to enter an intrinsic monitor."
      - id: B
        answer: "TIMED_WAITING"
        explanation: "Incorrect. `TIMED_WAITING` is used for time-bounded waits such as `sleep()` or `join(timeout)`."
      - id: C
        answer: "RUNNABLE"
        explanation: "Incorrect. A thread may be RUNNABLE when ready or executing, but waiting to acquire an intrinsic monitor has a dedicated state."
      - id: D
        answer: "BLOCKED"
        explanation: "Correct. In `Thread.State`, BLOCKED specifically means waiting to acquire an intrinsic monitor to enter synchronized code."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Basic/Basic.md"
      anchor: "thread-state"
    apiRelated:
      controller: "BasicThreadController"
      methodSignature: "threadLifeCycle()"

  - id: daemon-jvm-lifecycle
    question: "Which statement about daemon threads and JVM lifecycle is correct?"
    answers:
      - id: A
        answer: "Daemon threads always run at a lower priority than user threads."
        explanation: "Incorrect. Daemon is a JVM liveness/lifecycle property, not a scheduling-priority rule."
      - id: B
        answer: "The JVM is not required to stay alive only to let daemon threads finish after no user thread remains alive."
        explanation: "Correct. That is why daemon threads should not be trusted for work that absolutely must finish before process exit without another guarantee."
      - id: C
        answer: "Finishing an HTTP request proves that any daemon thread created by that request has also finished."
        explanation: "Incorrect. A Spring Boot JVM usually has many other live threads; request completion does not prove JVM shutdown behavior."
      - id: D
        answer: "`setDaemon(true)` can be changed at any time after the thread has already started."
        explanation: "Incorrect. The daemon flag must be configured before the thread is started."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Basic/Basic.md"
      anchor: "daemon-thread"
    apiRelated:
      controller: "DaemonThreadController"
      methodSignature: "inspectDaemonRules()"

  - id: interrupt-cooperative-cancellation
    question: "A worker runs a long CPU-bound loop and does not call blocking APIs. What should the worker do for `interrupt()` to support cooperative cancellation?"
    answers:
      - id: A
        answer: "Nothing; the JVM forcibly stops the worker as soon as it receives an interrupt."
        explanation: "Incorrect. `interrupt()` is not a kill command. A CPU-bound loop must explicitly observe the cancellation signal."
      - id: B
        answer: "Call `Thread.stop()` after receiving the interrupt so the worker is guaranteed to exit."
        explanation: "Incorrect. `Thread.stop()` is deprecated because it can stop a thread at an unsafe point and break shared-state invariants."
      - id: C
        answer: "Add reasonable cancellation points that check `Thread.currentThread().isInterrupted()`."
        explanation: "Correct. Code that does not pass through interruptible blocking APIs must actively inspect interrupt status and exit in a controlled way."
      - id: D
        answer: "Convert the worker into a daemon thread."
        explanation: "Incorrect. Daemon status does not turn interruption into forced cancellation."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Interruption/Interruption.md"
      anchor: "interrupt-mental-model"
    apiRelated:
      controller: "InterruptionController"
      methodSignature: "interruptBusyWorker()"

  - id: interrupted-flag-clear
    question: "Which statement about `isInterrupted()` and `Thread.interrupted()` is correct?"
    answers:
      - id: A
        answer: "`isInterrupted()` only reads status; `Thread.interrupted()` reads the current thread's interrupt status and clears it."
        explanation: "Correct. This distinction matters: one API observes the flag, while the static API observes and consumes/clears the current thread's signal."
      - id: B
        answer: "Both methods always clear interrupt status."
        explanation: "Incorrect. `isInterrupted()` does not clear the status."
      - id: C
        answer: "`Thread.interrupted()` checks the interrupt status of any target thread passed as an argument."
        explanation: "Incorrect. It is a static method that checks the current thread and takes no target-thread parameter."
      - id: D
        answer: "`isInterrupted()` is only valid while a thread is BLOCKED."
        explanation: "Incorrect. Interrupt status can be inspected in many states; it is not limited to BLOCKED threads."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Interruption/Interruption.md"
      anchor: "interrupt-flag"
    apiRelated:
      controller: "InterruptionController"
      methodSignature: "inspectInterruptFlag()"

  - id: interrupt-synchronized-monitor
    question: "Thread B is BLOCKED waiting for an intrinsic `synchronized` monitor. Thread A calls `threadB.interrupt()`. What is most accurate?"
    answers:
      - id: A
        answer: "B immediately receives `InterruptedException` and leaves the monitor wait."
        explanation: "Incorrect. Intrinsic-monitor acquisition is not an interruptible wait in the same way as `sleep()` or `wait()`."
      - id: B
        answer: "B immediately becomes TERMINATED."
        explanation: "Incorrect. Interrupt does not forcibly terminate a thread."
      - id: C
        answer: "The interrupt is completely ignored and B's interrupt status must remain false."
        explanation: "Incorrect. Interrupt status may be set even while B remains BLOCKED."
      - id: D
        answer: "B may remain BLOCKED until the monitor is released; afterward the code can observe the interrupt status."
        explanation: "Correct. If lock acquisition itself must react to cancellation, `ReentrantLock.lockInterruptibly()` is a better fit."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Interruption/Interruption.md"
      anchor: "interrupt-limitations"
    apiRelated:
      controller: "InterruptionController"
      methodSignature: "interruptSynchronizedWaiter()"

  - id: volatile-not-compound-atomic
    question: "You have `volatile int count`, and multiple threads execute `count++`. Which statement is correct?"
    answers:
      - id: A
        answer: "`volatile` turns the entire `count++` expression into one atomic instruction."
        explanation: "Incorrect. `count++` is still a read-modify-write sequence, and interleavings can cause lost updates."
      - id: B
        answer: "`volatile` provides visibility/ordering guarantees for the relevant reads and writes, but it does not make the compound increment atomic."
        explanation: "Correct. For atomic increment, consider `AtomicInteger`, locking, or another mechanism that matches the invariant."
      - id: C
        answer: "`volatile` only works for references and has no effect on an `int`."
        explanation: "Incorrect. `volatile` can be used with primitives such as `int`, but its semantics do not include compound-operation atomicity."
      - id: D
        answer: "`count++` is safe because every thread has its own stack."
        explanation: "Incorrect. The `count` field is shared mutable state; separate stacks do not protect a shared field."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "volatile-publication"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "volatileIsNotAtomic()"

  - id: happens-before-start-join
    question: "Which flow correctly uses the JMM guarantees of `Thread.start()` and `Thread.join()`?"
    answers:
      - id: A
        answer: "The parent writes data after `start()`, and the worker is guaranteed to see it immediately."
        explanation: "Incorrect. The start rule covers actions before `start()`, not arbitrary writes that happen afterward."
      - id: B
        answer: "The worker writes data, and the parent reads it before `join()` while still being guaranteed to see the new value."
        explanation: "Incorrect. Without an appropriate synchronization edge, that guarantee cannot be inferred only from wall-clock ordering."
      - id: C
        answer: "The parent writes data before `start()`; the worker reads it, writes a result, terminates; then the parent successfully `join()`s before reading the result."
        explanation: "Correct. Actions before `start()` are published to the worker, and worker actions happen-before code that continues after a successful `join()`."
      - id: D
        answer: "`start()` and `join()` only coordinate lifecycle and provide no memory-consistency guarantees."
        explanation: "Incorrect. The README emphasizes that they coordinate lifecycle and also establish important happens-before edges."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "happens-before"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "startJoinHappensBefore()"

  - id: safe-publication-this-escape
    question: "Why is publishing `this` from a constructor before construction finishes dangerous in concurrent code?"
    answers:
      - id: A
        answer: "Another thread may observe the object before its invariant/initialization is complete, weakening safe-publication reasoning and final-field initialization guarantees."
        explanation: "Correct. Complete construction first, then publish the object through a boundary with a clear memory-consistency contract."
      - id: B
        answer: "Because the JVM always copies the object onto the other thread's stack."
        explanation: "Incorrect. The object remains on the heap; the issue is the publication boundary and visibility/initialization guarantees."
      - id: C
        answer: "Because every `final` field becomes mutable after `this` escapes."
        explanation: "Incorrect. `final` fields do not become mutable; the danger is that the object can be observed too early."
      - id: D
        answer: "Because every constructor must execute inside `synchronized`."
        explanation: "Incorrect. Constructors do not have to be synchronized; the important issues are invariant completion and publication."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "safe-publication-final"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: progress-deadlock-livelock-starvation
    question: "Which scenario best describes livelock?"
    answers:
      - id: A
        answer: "Two threads hold locks in a cycle and both remain stuck waiting for each other."
        explanation: "Incorrect. That is the classic shape of deadlock with circular wait."
      - id: B
        answer: "One thread rarely receives CPU/lock/resource access while other threads continue to make progress."
        explanation: "Incorrect. That describes starvation."
      - id: C
        answer: "Two threads have already TERMINATED and therefore no work remains."
        explanation: "Incorrect. TERMINATED is not a livelock liveness problem."
      - id: D
        answer: "Threads remain active and continuously react/back off in response to each other but make no useful progress."
        explanation: "Correct. Livelock means active but no progress, unlike deadlock where the threads are stuck waiting."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "progress-problems"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "boundedLivelock()"

  - id: synchronized-monitor-identity
    question: "Two different instances invoke the same `synchronized` instance method. When do they contend for the same monitor by default?"
    answers:
      - id: A
        answer: "Always, because the method has the `synchronized` keyword."
        explanation: "Incorrect. An instance synchronized method locks `this`; two different instances normally use different monitors."
      - id: B
        answer: "Only if they actually use the same monitor; an instance synchronized method normally locks each instance's own `this`."
        explanation: "Correct. Lock identity matters more than the method name. A `static synchronized` method instead uses the Class object's monitor."
      - id: C
        answer: "Never, because Java does not allow two objects to share a monitor."
        explanation: "Incorrect. Code can explicitly synchronize on the same shared lock object."
      - id: D
        answer: "Only if both threads are daemon threads."
        explanation: "Incorrect. Daemon status is unrelated to monitor identity."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Synchronization/Synchronization.md"
      anchor: "synchronized-monitor"
    apiRelated:
      controller: "SynchronizationController"
      methodSignature: "synchronizedCounter()"

  - id: reentrantlock-interruptible-wait
    question: "You need a thread waiting for a lock to be able to react to `interrupt()`. Which API best fits?"
    answers:
      - id: A
        answer: "A normal `synchronized` block"
        explanation: "Incorrect. Waiting to acquire an intrinsic synchronized monitor is not interruptible lock acquisition."
      - id: B
        answer: "`ReentrantLock.lock()`"
        explanation: "Incorrect. `lock()` does not provide the dedicated interruptible-wait semantics required here."
      - id: C
        answer: "`ReentrantLock.lockInterruptibly()`"
        explanation: "Correct. This is a key benefit of explicit Lock when cancellation while waiting for the lock is a requirement."
      - id: D
        answer: "Call `Thread.yield()` before trying to acquire the lock"
        explanation: "Incorrect. `yield()` does not make lock acquisition interruptible."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Synchronization/Synchronization.md"
      anchor: "reentrant-lock"
    apiRelated:
      controller: "SynchronizationController"
      methodSignature: "interruptibleLock()"

  - id: read-write-lock-downgrade
    question: "With `ReentrantReadWriteLock`, which flow is the valid lock-downgrading pattern described in the README?"
    answers:
      - id: A
        answer: "Hold the write lock → acquire the read lock → release the write lock → continue holding the read lock."
        explanation: "Correct. This is a write-to-read downgrade and preserves continuity of read access after mutation is complete."
      - id: B
        answer: "Hold the read lock → acquire the write lock without releasing the read lock and wait until the upgrade succeeds."
        explanation: "Incorrect. Read-to-write upgrade is not supported in that form; the flow must be redesigned/re-coordinated."
      - id: C
        answer: "Release every lock and call `Thread.sleep()` to become a reader."
        explanation: "Incorrect. Sleeping is not a lock-downgrading protocol."
      - id: D
        answer: "Convert the read lock into a write lock by calling `notifyAll()`."
        explanation: "Incorrect. `notifyAll()` is an intrinsic-monitor coordination API and does not switch ReadWriteLock modes."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Synchronization/Synchronization.md"
      anchor: "read-write-lock"
    apiRelated:
      controller: "SynchronizationController"
      methodSignature: "readWriteLockDowngrade()"

  - id: stamped-lock-optimistic-validation
    question: "After `StampedLock.tryOptimisticRead()`, what must happen before trusting the snapshot that was read?"
    answers:
      - id: A
        answer: "Call `Thread.yield()` so writers have a chance to run."
        explanation: "Incorrect. A scheduler hint does not validate an optimistic snapshot."
      - id: B
        answer: "Convert the stamp into a `ReentrantLock`."
        explanation: "Incorrect. StampedLock has its own semantics; a stamp is not a ReentrantLock."
      - id: C
        answer: "Only verify that the data is not null."
        explanation: "Incorrect. Non-null data does not prove that a writer did not intervene while the snapshot was being read."
      - id: D
        answer: "Call `validate(stamp)`; if validation fails, fall back to a real read lock and read again."
        explanation: "Correct. Optimistic read is a read-and-validate strategy, not safe reading without validation."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Synchronization/Synchronization.md"
      anchor: "stamped-lock"
    apiRelated:
      controller: "SynchronizationController"
      methodSignature: "stampedLock()"

  - id: cas-aba-problem
    question: "An `AtomicReference` changes A → B → A. An old observer still holds expected A and CASes to C. What problem does this illustrate?"
    answers:
      - id: A
        answer: "Spurious wakeup"
        explanation: "Incorrect. Spurious wakeup is related to condition waiting, not CAS state history."
      - id: B
        answer: "ABA; plain CAS may only see that the current reference is A again and cannot tell that the state passed through B."
        explanation: "Correct. When history/version is part of correctness, `AtomicStampedReference` or an equivalent versioned design may be needed."
      - id: C
        answer: "Deadlock because A returned to A"
        explanation: "Incorrect. ABA is not a circular lock dependency."
      - id: D
        answer: "A visibility bug that is always fixed by adding `volatile` to AtomicReference"
        explanation: "Incorrect. AtomicReference already has its own atomic/memory semantics; the issue is that plain CAS cannot detect intermediate history."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Synchronization/Synchronization.md"
      anchor: "atomic-cas"
    apiRelated:
      controller: "SynchronizationController"
      methodSignature: "atomicCas()"

  - id: wait-notify-predicate-loop
    question: "Why should `Object.wait()` normally be used inside `while (!condition)` instead of a one-time `if (!condition)`?"
    answers:
      - id: A
        answer: "Because `wait()` must always time out at least once before notification."
        explanation: "Incorrect. A no-timeout `wait()` does not time out; the real issue is that the condition may still be false when the thread wakes."
      - id: B
        answer: "Because `notifyAll()` keeps the monitor reserved for each waiter until its condition becomes true."
        explanation: "Incorrect. Woken waiters still have to compete to reacquire the monitor, and state may change before they do."
      - id: C
        answer: "To re-check the predicate after a spurious wakeup or after another thread changes the condition before this waiter reacquires the monitor."
        explanation: "Correct. Notification is only a signal to check again; the predicate determines whether execution can continue."
      - id: D
        answer: "So that `wait()` does not release the monitor."
        explanation: "Incorrect. `wait()` does release the monitor while waiting; `sleep()` is the operation that does not release a held monitor just because the thread sleeps."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.Coordination/Coordination.md"
      anchor: "wait-notify"
    apiRelated:
      controller: "CoordinationController"
      methodSignature: "waitNotify()"

  - id: blocking-queue-backpressure
    question: "In a producer-consumer design, the buffer must have finite capacity and producers should wait when it is full. Which choice is the best fit?"
    answers:
      - id: A
        answer: "A bounded `BlockingQueue` using operations such as `put()` or `offer(timeout)`."
        explanation: "Correct. BlockingQueue provides condition-waiting/backpressure semantics directly instead of requiring a manual busy loop."
      - id: B
        answer: "A `ConcurrentLinkedQueue` with an infinite `while(true) poll()` loop and no backoff."
        explanation: "Incorrect. `poll()` is non-blocking and returns null when empty; endless busy polling wastes CPU and does not provide bounded backpressure."
      - id: C
        answer: "`PriorityBlockingQueue` by default because it always has finite capacity."
        explanation: "Incorrect. PriorityBlockingQueue is effectively unbounded and does not provide capacity-based backpressure like ArrayBlockingQueue."
      - id: D
        answer: "`SynchronousQueue` to hold a backlog of thousands of elements."
        explanation: "Incorrect. SynchronousQueue stores no element; it is a direct handoff/rendezvous between producer and consumer."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.Coordination/Coordination.md"
      anchor: "producer-consumer"
    apiRelated:
      controller: "CoordinationController"
      methodSignature: "blockingQueue()"

  - id: semaphore-over-release
    question: "A Semaphore starts with 1 permit. Code calls `release()` even though a previous `acquire()` failed. What is the main risk?"
    answers:
      - id: A
        answer: "The JVM ignores the extra release because Semaphore enforces lock ownership."
        explanation: "Incorrect. Semaphore does not enforce ownership like a lock."
      - id: B
        answer: "The thread automatically becomes a daemon thread."
        explanation: "Incorrect. Permit accounting is unrelated to daemon status."
      - id: C
        answer: "Semaphore automatically reduces permits back to zero to compensate."
        explanation: "Incorrect. No automatic correction mechanism exists for this bug."
      - id: D
        answer: "The permit count can become incorrect and break the concurrency limit; only release after a successful acquire."
        explanation: "Correct. A `boolean acquired` plus `finally` pattern helps prevent over-release when acquisition fails or is interrupted."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.Coordination/Coordination.md"
      anchor: "semaphore-permit-accounting"
    apiRelated:
