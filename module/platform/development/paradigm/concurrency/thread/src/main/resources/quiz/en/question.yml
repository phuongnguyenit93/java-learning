  - id: thread-pool-execution-flow
    question: "For a running `ThreadPoolExecutor(core=1, max=2, queueCapacity=1)`, what is the normal admission order when a new task is submitted?"
    answers:
      - id: A
        answer: "Always create workers up to max first, then use the queue."
        explanation: "Incorrect. After core workers are reached, the queue is normally tried before expanding toward maximumPoolSize."
      - id: B
        answer: "If workers < core, create a worker; otherwise try to enqueue; if the queue is full, grow workers up to max; if capacity is exhausted, reject."
        explanation: "Correct. This is the core ThreadPoolExecutor flow from the README: core → queue → max → rejection."
      - id: C
        answer: "If the queue is full, `execute()` blocks the caller by default until space becomes available."
        explanation: "Incorrect. `execute()` has no default contract to block the caller as backpressure."
      - id: D
        answer: "`maximumPoolSize` always determines worker count even while the queue can still accept tasks."
        explanation: "Incorrect. If the queue still accepts tasks, the pool may not need to expand to max."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Thread_Pool_Executor/ThreadPoolExecutor.md"
      anchor: "thread-pool-flow"
    apiRelated:
      controller: "ThreadPoolController"
      methodSignature: "executorFlow()"

  - id: executor-execute-vs-submit
    question: "What is an important practical difference between `execute(Runnable)` and `submit(...)` when a task throws an exception?"
    answers:
      - id: A
        answer: "`execute()` always retries the task, while `submit()` never retries."
        explanation: "Incorrect. Retry is not the default semantic difference between these APIs."
      - id: B
        answer: "`submit()` always prints the stack trace to the console immediately."
        explanation: "Incorrect. A submit failure is commonly captured in the Future; if the Future is ignored, the failure may not be observed as the developer expects."
