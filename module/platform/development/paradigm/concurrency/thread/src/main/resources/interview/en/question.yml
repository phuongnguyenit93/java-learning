  - question: >-
      What flow should explicit context propagation through an Executor or Spring TaskDecorator follow?
    answer: >-
      The mental model is capture context at the submission boundary, restore it on the worker before running the task, then clean up or restore the previous worker state in finally. Spring TaskDecorator is a suitable place to package this pattern for ThreadPoolTaskExecutor, for example for correlation IDs, MDC or RequestAttributes. Propagation does not extend the HTTP request lifecycle, so capturing only the immutable values actually needed is often safer than retaining request objects.
