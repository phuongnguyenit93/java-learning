  - question: >-
      How is a volatile stop flag different from interrupt() for cancellation?
    answer: >-
      A volatile stop flag is application state with visibility guarantees and can work for cooperative loops. It does not participate in Java's interruption protocol and does not wake a Thread blocked in sleep(), wait() or join(). interrupt() carries a cancellation signal and can make supported interruptible blocking operations finish early, so it is often more appropriate when a task can block and needs responsive cancellation.
