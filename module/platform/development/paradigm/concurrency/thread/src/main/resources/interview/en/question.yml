  - question: >-
      How does @Async work, and why can self-invocation fail to be asynchronous?
    answer: >-
      @Async works through Spring's async infrastructure and proxy/interceptor mechanism; @EnableAsync is commonly used to enable that infrastructure. When an invocation passes through the proxy, it is dispatched to the resolved TaskExecutor. A direct call from one method to another @Async method on the same this reference can bypass the proxy and therefore bypass interception. For void @Async, the caller has no Future for failures, so AsyncUncaughtExceptionHandler, logging or metrics are needed, while submission rejection remains a separate concern.
