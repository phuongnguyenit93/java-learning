  - question: >-
      Why should Object.wait() be used in a while loop, and how is wait() different from Thread.sleep()?
    answer: >-
      A notification only tells a waiter to recheck the predicate; it does not prove the condition is true. A while loop handles spurious wakeups, competing waiters and state changes before monitor reacquisition. wait() requires the caller to own the monitor and releases that monitor while waiting; sleep() does not release a monitor merely because the Thread sleeps. notify()/notifyAll() also do not immediately transfer the monitor to a waiter.
    aiGenerated: true
    reviewed: false
    readmeRelated:
