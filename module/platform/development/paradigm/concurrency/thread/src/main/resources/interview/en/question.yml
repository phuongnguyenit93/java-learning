  - question: >-
      Does interrupt() kill a Thread?
    answer: >-
      No. interrupt() sends a cooperative cancellation signal. A CPU loop must explicitly inspect interrupt status. If a Thread is in an interruptible operation such as sleep(), wait() or join(), the operation may finish early with InterruptedException. The task still owns its cleanup and safe termination behavior.
