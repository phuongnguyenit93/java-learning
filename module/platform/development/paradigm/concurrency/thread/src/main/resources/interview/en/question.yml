questions:
  - question: >-
      How are a Process and a Thread different inside a JVM application?
    answer: >-
      A Process is a running program with its own resource scope managed by the operating system. A Thread is an execution flow inside that process. Threads in the same JVM process can access objects on the shared heap, while each Thread has its own execution stack. Multiple Threads accessing shared mutable state is the source of many concurrency problems.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Basic/Basic.md"
      anchor: "process-and-thread"
    apiRelated:
      controller: "BasicThreadController"
      methodSignature: "processAndThread()"

  - question: >-
      What are the different roles of Thread, Runnable, Callable and Executor?
    answer: >-
      Runnable and Callable describe work; Callable can also return a result and throw checked exceptions. Thread represents an execution flow. Executor is the abstraction that decides how tasks are executed. Runnable and Callable do not create Threads by themselves; they still need a Thread, Executor or another execution mechanism to run.
    aiGenerated: true
    reviewed: false
    readmeRelated:
