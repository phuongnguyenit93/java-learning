      methodSignature: ""

  - question: >-
      What risks do ThreadLocal and InheritableThreadLocal have with Thread Pools?
    answer: >-
      ThreadLocal associates a value with the current Thread and can avoid sharing a context value, but it does not make other shared objects thread-safe. Pool workers are reused, so a value that is not removed can become stale context or retain references too long. InheritableThreadLocal inherits at Thread creation time; later task submissions to an existing worker do not inherit the caller's new context. Pool context therefore usually needs explicit propagation and cleanup.
    aiGenerated: true
