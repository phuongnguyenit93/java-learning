  - question: >-
      What is the difference between isInterrupted() and Thread.interrupted()?
    answer: >-
      isInterrupted() is an instance method that observes the interrupt status of the target Thread without clearing it. Thread.interrupted() is a static method that checks the current Thread and clears its interrupt status. Therefore Thread.interrupted() should not be used casually when upper layers still need to observe the cancellation signal.
    aiGenerated: true
    reviewed: false
