  - question: >-
      How do scheduleAtFixedRate() and scheduleWithFixedDelay() differ, and what happens when a periodic task throws?
    answer: >-
      Fixed rate tries to maintain cadence based on scheduled start milestones; fixed delay waits for a configured delay after the previous execution completes before scheduling the next one. The same periodic task does not overlap with itself under ScheduledThreadPoolExecutor's contract. If an execution lets an exception escape, later executions of that same periodic task are suppressed, so production jobs need explicit failure observation and handling.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Thread_Pool_Executor/ThreadPoolExecutor.md"
      anchor: "scheduled-execution"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      What overload semantics do ThreadPoolExecutor rejection policies provide?
    answer: >-
      AbortPolicy throws RejectedExecutionException. CallerRunsPolicy executes the task on the caller when the executor has not shut down, creating feedback pressure because submission slows. DiscardPolicy silently drops the new task. DiscardOldestPolicy removes the head of the work queue and retries the new task. The discard policies change business semantics about which work may disappear, so they are appropriate only when that loss is understood and acceptable.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Thread_Pool_Executor/ThreadPoolExecutor.md"
      anchor: "rejection-policy"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      What is the difference between ExecutorService.shutdown() and shutdownNow()?
    answer: >-
      shutdown() stops accepting new tasks while allowing queued and running tasks to continue. shutdownNow() attempts to interrupt running tasks and returns tasks that have not started, but it cannot forcibly stop code that does not cooperate with interruption. An executor created by application code needs a lifecycle owner; awaitTermination is commonly used to bound graceful shutdown before considering a forced shutdown path.
