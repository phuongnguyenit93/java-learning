  - question: >-
      Do Future.cancel(false), Future.cancel(true) and CompletableFuture.cancel(true) have the same semantics?
    answer: >-
      No. For a Future returned by ExecutorService, cancel(false) does not request interruption of a running task, so that task may continue. cancel(true) may request interruption, but the task must still cooperate. CompletableFuture does not use mayInterruptIfRunning to control underlying processing in the same way; cancellation mainly changes completion state. No cancel(true) call should be treated as a universal Thread-kill primitive.
