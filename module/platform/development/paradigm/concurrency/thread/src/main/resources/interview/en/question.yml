  - question: >-
      Why is count++ not thread-safe when multiple Threads update it?
    answer: >-
      count++ is a read-modify-write sequence, not one atomic action. Two Threads can read the same old value, compute the same new value and overwrite each other's update, producing a lost update. Protecting the increment requires suitable atomicity, such as AtomicInteger or a critical section guarded by synchronized or a Lock.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "shared-state-race-condition"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "raceCondition()"

  - question: >-
      How are race condition, data race, visibility and ordering different?
    answer: >-
      A race condition is a correctness problem where the result depends on uncontrolled interleaving. A data race has a specific JMM meaning: two Threads access the same variable, at least one access is a write, and the conflicting accesses are not ordered by happens-before. Visibility asks whether another Thread is guaranteed to see a write; ordering asks which observation order is guaranteed. These problems can coexist but are not one concept.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "12.Q&A/Q&A.md"
      anchor: "race-vs-visibility"
