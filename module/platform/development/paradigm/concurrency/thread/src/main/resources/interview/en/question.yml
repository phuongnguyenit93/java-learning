  - question: >-
      What guarantees does synchronized provide, and how do instance and static synchronized methods differ?
    answer: >-
      synchronized provides mutual exclusion and a memory-consistency guarantee across release/acquire of the same monitor. An instance synchronized method locks this, while a static synchronized method locks the Class object. Two different instances do not automatically block each other when their synchronized methods use different monitors; what matters is whether code paths contend on the same monitor.
