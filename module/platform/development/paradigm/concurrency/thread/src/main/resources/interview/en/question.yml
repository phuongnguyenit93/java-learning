      methodSignature: "waitNotify()"

  - question: >-
      How do LockSupport.park()/unpark() differ from wait()/notify()?
    answer: >-
      LockSupport does not require an intrinsic monitor, and unpark(thread) targets a specific Thread. A permit may be issued after the Thread has started but before its corresponding park, but permits are not an indefinitely accumulating counter. park() may return because of a permit, interruption or a spurious return and does not throw InterruptedException, so callers still need a predicate or cancellation loop and should inspect interrupt status when appropriate.
    aiGenerated: true
    reviewed: false
    readmeRelated:
