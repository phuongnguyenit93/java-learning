  - question: >-
      Does asynchronous programming imply non-blocking execution?
    answer: >-
      No. Async describes the relationship between the caller and completion: the caller does not necessarily wait for work to finish at the submission point. The worker can still block, for example in CompletableFuture.supplyAsync(() -> blockingJdbcCall()). Non-blocking describes how an operation waits for an external event or resource; async does not automatically convert blocking I/O into non-blocking I/O.
