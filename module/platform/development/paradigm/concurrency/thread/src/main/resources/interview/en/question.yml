  - question: >-
      What does ReentrantLock add compared with synchronized, and why should unlock be in finally?
    answer: >-
      ReentrantLock provides explicit locking plus APIs such as tryLock(), timed tryLock(), lockInterruptibly(), fairness and multiple Conditions. It is reentrant, so the owning Thread can acquire the same lock again and increase its hold count. Every acquisition needs a matching release; placing unlock in finally prevents the lock from being retained indefinitely when the critical section throws or exits early.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Synchronization/Synchronization.md"
      anchor: "reentrant-lock"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Does a fair ReentrantLock guarantee that the Thread started first acquires the lock first?
    answer: >-
      No. Fairness is an acquisition policy for contending Threads, not a guarantee about Thread.start(), scheduler order or log order. A key footgun is that untimed tryLock() can still barge on a fair lock when the lock is available; timed tryLock(timeout, unit) participates in the fair ordering policy when it has to wait. Fairness can also trade throughput for reduced barging or starvation risk.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Synchronization/Synchronization.md"
      anchor: "reentrant-lock"
    apiRelated:
      controller: "SynchronizationController"
      methodSignature: "reentrantLockPolicy()"

  - question: >-
      When is ReentrantReadWriteLock useful, and what are its downgrade and upgrade semantics?
    answer: >-
      The read lock allows multiple concurrent readers while the write lock is exclusive. It is worth considering when the workload is genuinely read-heavy and read critical sections are large enough for concurrency to help. Write-to-read downgrade is supported by holding the write lock, acquiring the read lock and then releasing the write lock. Read-to-write upgrade is not supported as a safe in-place upgrade; the flow must release and re-coordinate appropriately.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Synchronization/Synchronization.md"
      anchor: "read-write-lock"
    apiRelated:
      controller: "SynchronizationController"
      methodSignature: "readWriteLockDowngrade()"

  - question: >-
      How does StampedLock optimistic read work, and what limitations should you remember?
    answer: >-
      A reader calls tryOptimisticRead(), reads a snapshot and then validates the stamp. If validation fails, it must fall back to a real read lock before trusting the data. StampedLock is not reentrant, its Lock views do not provide Condition, stamps must be managed and unlocked in the correct mode, and optimistic reads always require validation. It is not simply a faster ReadWriteLock.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Synchronization/Synchronization.md"
      anchor: "stamped-lock"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      What is CAS, and what is the ABA problem?
    answer: >-
      CAS updates state only if the current value or reference still matches the expected value used to calculate the transition; on failure the caller usually rereads and retries. ABA is the A → B → A sequence where plain CAS sees the final value as A and cannot tell that history changed. When intermediate transitions matter to correctness, AtomicStampedReference can attach a version or stamp to detect that change.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Synchronization/Synchronization.md"
      anchor: "atomic-cas"
    apiRelated:
      controller: "SynchronizationController"
      methodSignature: "atomicCas()"

  - question: >-
      When should LongAdder be preferred over AtomicLong, and what is the caveat with sum()?
    answer: >-
      LongAdder is useful for highly contended counters such as metrics because updates can be spread across multiple cells. However, sum() is not an atomic snapshot while other Threads are still updating. That makes LongAdder unsuitable for sequence IDs or admission rules such as sum() < limit followed by increment. LongAccumulator reduction functions should also be easy to reason about and side-effect-free because they may be applied again during concurrent update or retry.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Synchronization/Synchronization.md"
      anchor: "adder-accumulator"
    apiRelated:
      controller: "SynchronizationController"
      methodSignature: "atomicTools()"

  - question: >-
      Does ConcurrentHashMap make every get-then-put sequence atomic?
    answer: >-
      No. ConcurrentHashMap provides the concurrency semantics documented for its individual and compound APIs, but separate get() followed by put() can still race. For atomic compound updates, prefer APIs such as putIfAbsent(), compute(), computeIfAbsent(), merge() or replace(key, oldValue, newValue). More generally, choose a concurrent collection for the access pattern and semantics you need, not only because its name contains Concurrent.
    aiGenerated: true
    reviewed: false
