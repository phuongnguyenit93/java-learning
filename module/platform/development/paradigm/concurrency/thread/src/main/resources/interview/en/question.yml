  - question: >-
      What important Java 21 Virtual Thread caveats should you remember?
    answer: >-
      Virtual Threads still obey the JMM and do not remove race conditions, locks or deadlocks. In Java 21 they are always daemon Threads and use fixed Thread.NORM_PRIORITY. ThreadLocal remains per-Thread, so large payloads across very many Virtual Threads can create heap pressure. Java 21 also has pinning in some cases, notably blocking while holding a synchronized monitor; long or frequent pinning can reduce scalability. Enabling spring.threads.virtual.enabled=true also does not turn every Thread in the application into a Virtual Thread.
