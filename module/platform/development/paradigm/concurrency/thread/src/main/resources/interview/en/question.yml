  - question: >-
      How should CountDownLatch, CyclicBarrier, Semaphore, Phaser and Exchanger be distinguished?
    answer: >-
      CountDownLatch is a one-shot primitive for waiting until N actions complete. CyclicBarrier lets a group meet at a checkpoint and can be reused across generations when not broken. Semaphore manages permits to limit concurrent access. Phaser supports multi-phase workflows with dynamic registration and deregistration. Exchanger is a rendezvous where two Threads exchange objects. Choose the primitive from the dependency being modeled rather than by API name.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.Coordination/Coordination.md"
      anchor: "synchronizers"
    apiRelated:
      controller: "CoordinationController"
      methodSignature: "synchronizers()"

  - question: >-
      Does Semaphore enforce ownership like a Lock, and why is over-release dangerous?
    answer: >-
      Semaphore does not enforce ownership like a Lock. Code can call release() even when the current Thread did not acquire a permit, which can incorrectly increase the permit count and break the intended concurrency limit. A safe pattern records whether acquisition actually succeeded and releases in finally only when it did. Timeout or interruption during acquire must also be reflected in permit accounting.
    aiGenerated: true
    reviewed: false
    readmeRelated:
