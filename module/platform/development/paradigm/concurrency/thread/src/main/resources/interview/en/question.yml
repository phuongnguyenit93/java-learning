  - question: >-
      In what order does ThreadPoolExecutor handle a newly submitted task?
    answer: >-
      The core mental model is: if worker count is below corePoolSize, create a core worker; otherwise try to enqueue; if the queue is full and worker count is below maximumPoolSize, create an extra worker; otherwise invoke the rejection policy. execute() does not automatically block the caller when the queue is full. Consequently maximumPoolSize usually matters only after the queue stops accepting new tasks.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Thread_Pool_Executor/ThreadPoolExecutor.md"
      anchor: "thread-pool-flow"
    apiRelated:
