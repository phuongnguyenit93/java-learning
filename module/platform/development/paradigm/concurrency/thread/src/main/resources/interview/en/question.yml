  - question: >-
      What is the difference between synchronization and coordination?
    answer: >-
      Synchronization focuses on protecting shared state: who may access or mutate it at a given time. Coordination focuses on dependencies between Threads: who waits, which event or phase they wait for, and when they continue. A synchronized counter is synchronization; a CountDownLatch waiting for several workers is coordination. Real applications commonly need both.
