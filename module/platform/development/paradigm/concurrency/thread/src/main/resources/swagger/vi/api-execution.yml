    execution: |-
      <p>API chạy hai reader và một writer trên ReentrantReadWriteLock.</p>
      <ol>
        <li>Hai reader cùng giữ read lock và service đo max concurrent reader.</li>
        <li>Writer bắt đầu trong lúc read lock còn giữ nên phải chờ.</li>
        <li>Khi releaseReaders mở, hai reader unlock; writer mới acquire write lock rồi kết thúc.</li>
      </ol>
