      <ol>
        <li>Worker vào Thread.sleep dài trong vòng lặp kiểm tra stopRequested.</li>
        <li>Caller chỉ set stop flag nhưng worker vẫn sống và tiếp tục TIMED_WAITING vì chưa có cơ hội đọc flag.</li>
        <li>Caller interrupt để đánh thức sleep; worker bắt InterruptedException và kết thúc ngay.</li>
      </ol>
    usage: true
LeakController:
  threadLeakPattern():
    execution: |-
      <p>API tạo một thread chờ CountDownLatch để mô phỏng thread bị bỏ quên.</p>
      <ol>
        <li>Sau start, service xác nhận worker còn sống và sẽ tiếp tục tồn tại nếu latch không bao giờ được mở.</li>
        <li>Trong finally, latch được countDown và service join worker với deadline.</li>
        <li>Response đối chiếu trạng thái trước và sau cleanup.</li>
      </ol>
    usage: true
  poolLeakPattern():
    execution: |-
      <p>API tạo fixed thread pool 2 worker và chạy hai task ngắn.</p>
      <ol>
        <li>Sau khi task hoàn tất, pool vẫn chưa shutdown nên các worker thuộc quyền sở hữu của executor vẫn tồn tại.</li>
        <li>Response ghi nhận pattern sẽ leak nếu owner quên shutdown.</li>
        <li>Finally gọi shutdown và awaitTermination, fallback shutdownNow nếu cần.</li>
      </ol>
    usage: true
  queuePressure():
    execution: |-
      <p>API tạo ThreadPoolExecutor một worker với bounded queue capacity 3 và AbortPolicy.</p>
      <ol>
        <li>Task đầu giữ worker bận bằng latch.</li>
        <li>Bốn task tiếp theo được submit khi worker đang bận; ba task lấp queue và task dư bị reject.</li>
        <li>Finally mở latch rồi shutdown, minh họa bounded queue giới hạn backlog thay vì tăng vô hạn.</li>
      </ol>
    usage: true
ThreadPoolController:
  executorFlow():
    execution: |-
      <p>API cấu hình ThreadPoolExecutor core=1, max=2 và queue capacity=1 để quan sát thuật toán nhận task.</p>
      <ol>
        <li>Task 1 tạo core worker; task 2 đi vào queue.</li>
        <li>Task 3 làm queue đầy nên pool tăng lên worker thứ hai.</li>
        <li>Task 4 gặp cả pool max và queue full nên AbortPolicy reject; cuối cùng latch được mở và executor shutdown.</li>
      </ol>
    usage: true
  executeVsSubmit():
    execution: |-
      <p>API chạy hai task cố ý ném exception bằng execute và submit trên hai executor riêng.</p>
      <ol>
        <li>Exception từ execute đi ra uncaught exception channel của worker và được UncaughtExceptionHandler ghi nhận.</li>
        <li>submit trả Future; exception được giữ trong Future và xuất hiện dưới dạng ExecutionException khi get.</li>
        <li>Cả hai executor được shutdown sau khi quan sát xong.</li>
      </ol>
    usage: true
  fixedPoolReuse():
    execution: |-
      <p>API submit 6 task vào fixed pool chỉ có 2 worker.</p>
      <ol>
        <li>Mỗi task ghi tên thread chạy nó vào một concurrent set.</li>
        <li>CountDownLatch chờ đủ 6 task hoàn thành.</li>
        <li>Số tên worker duy nhất cho thấy nhiều task được tái sử dụng trên cùng hai thread thay vì tạo thread mới cho từng task.</li>
      </ol>
    usage: true
  executorFactories():
    execution: |-
      <p>API chạy bốn thí nghiệm bounded cho các factory trong Executors.</p>
      <ol>
        <li>Fixed pool giới hạn số worker và queue task dư; cached pool tăng worker khi không có thread rảnh.</li>
        <li>SingleThreadExecutor chạy ba task tuần tự theo submission order.</li>
        <li>ScheduledThreadPool chạy một task sau delay và ghi nhận thread cùng thời gian thực thi.</li>
      </ol>
    usage: true
  scheduledExecution():
    execution: |-
      <p>API đo timeline của cùng một task định kỳ theo fixed-rate và fixed-delay.</p>
      <ol>
        <li>Mỗi mode chạy 3 lần trên scheduler một thread; mỗi lần làm việc 60 ms trong khi interval cấu hình 30 ms.</li>
        <li>Service ghi start, end và gap giữa các lần chạy rồi cancel periodic future.</li>
        <li>Kết quả cho thấy fixed-rate cố bám lịch còn fixed-delay đợi thêm delay sau khi lần trước kết thúc, và task không overlap trên single-thread scheduler.</li>
      </ol>
    usage: true
  scheduledFailure():
    execution: |-
      <p>API scheduleAtFixedRate một task luôn ném IllegalStateException.</p>
      <ol>
        <li>Lần chạy đầu tăng counter rồi fail.</li>
        <li>ScheduledFuture complete exceptionally và get trả ExecutionException.</li>
        <li>Scheduler suppress các lần chạy định kỳ tiếp theo của chính task đó; finally cancel và shutdown executor.</li>
      </ol>
    usage: true
  callerRuns():
    execution: |-
      <p>API làm bão hòa executor một worker và queue một phần tử với CallerRunsPolicy.</p>
      <ol>
        <li>Task đầu giữ worker bận, task thứ hai lấp queue.</li>
        <li>Task thứ ba bị reject khỏi pool nhưng CallerRunsPolicy chạy ngay trên thread gọi execute.</li>
        <li>Service so sánh callerThread với fallbackThread để xác nhận backpressure đã đẩy việc về caller.</li>
      </ol>
    usage: true
  discardPolicies():
    execution: |-
      <p>API chạy hai executor bão hòa để so sánh DiscardPolicy và DiscardOldestPolicy.</p>
      <ol>
        <li>DiscardPolicy âm thầm bỏ task mới khi worker bận và queue đầy.</li>
        <li>DiscardOldestPolicy loại task cũ đang nằm trong queue rồi đưa task mới vào thay thế.</li>
        <li>Sau khi mở latch, các counter cho biết task nào thực sự đã chạy.</li>
      </ol>
    usage: true
  customRejectionHandler():
    execution: |-
      <p>API bão hòa executor rồi dùng RejectedExecutionHandler tự viết.</p>
      <ol>
        <li>Worker đầu bị giữ và queue được lấp đầy.</li>
        <li>Submission tiếp theo gọi handler trên chính caller thread; handler tăng rejection counter, ghi tên thread và ném RejectedExecutionException.</li>
        <li>Controller nhận kết quả cho thấy overload vừa được ghi nhận vừa được báo lỗi rõ ràng.</li>
      </ol>
    usage: true
  gracefulShutdown():
    execution: |-
      <p>API submit 4 task ngắn vào fixed pool 2 worker rồi gọi shutdown.</p>
      <ol>
        <li>shutdown ngừng nhận task mới nhưng cho running và queued task hoàn tất.</li>
        <li>awaitTermination chờ tối đa 2 giây và chỉ fallback shutdownNow nếu quá hạn.</li>
        <li>Response trả số task hoàn thành cùng trạng thái shutdown/terminated.</li>
      </ol>
    usage: true
  forcedShutdown():
    execution: |-
      <p>API tạo single-thread executor với một task đang block và một task còn nằm trong queue.</p>
      <ol>
        <li>Gọi shutdown trước và chờ ngắn để chứng minh executor chưa thể terminate.</li>
        <li>shutdownNow interrupt running task và trả danh sách task chưa từng bắt đầu.</li>
        <li>Service xác nhận queued task không chạy, worker nhận interrupt và executor terminate sau force.</li>
      </ol>
    usage: true
SynchronizationController:
  synchronizedCounter():
