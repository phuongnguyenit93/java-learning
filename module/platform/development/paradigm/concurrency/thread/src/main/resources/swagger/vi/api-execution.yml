        <li>AtomicReference đi A→B→A; một stale reference vẫn CAS sang C thành công vì chỉ nhìn giá trị hiện tại.</li>
        <li>AtomicStampedReference cũng đi A→B→A nhưng stamp tăng, nên CAS dùng version cũ bị từ chối và phát hiện thay đổi trung gian.</li>
