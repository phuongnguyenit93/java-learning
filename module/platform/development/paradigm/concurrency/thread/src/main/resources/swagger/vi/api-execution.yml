AsyncController:
  future():
    execution: |-
      <p>API tạo một single-thread executor và submit một Callable bị giữ bởi CountDownLatch để quan sát trạng thái Future trước khi task được phép hoàn thành.</p>
      <ol>
        <li>Kiểm tra isDone khi worker vẫn đang chờ latch.</li>
        <li>Mở latch rồi gọi get với timeout để lấy PAYMENT_OK và xác nhận Future đã hoàn thành.</li>
        <li>Cuối cùng shutdownNow và chờ executor terminate để không để lại worker.</li>
      </ol>
    usage: true
  futureCancellation():
    execution: |-
      <p>API chạy hai thí nghiệm Future.cancel trên task đang chờ CountDownLatch.</p>
      <ol>
        <li>Với cancel(false), Future chuyển sang cancelled nhưng worker không bị interrupt; service chủ động mở latch để task kết thúc.</li>
        <li>Với cancel(true), worker đang await nhận interrupt và ghi nhận cờ interrupted.</li>
        <li>Cả hai trường hợp đều kiểm tra get ném CancellationException và executor được cleanup.</li>
      </ol>
    usage: true
  pipeline():
    execution: |-
      <p>API dựng một pipeline CompletableFuture trên fixed pool 2 thread.</p>
      <ol>
        <li>Tỷ giá và chuỗi lấy order rồi price chạy bất đồng bộ.</li>
        <li>thenCombineAsync nhân giá USD với tỷ giá, sau đó thenApplyAsync cộng phí vận chuyển.</li>
        <li>Tên thread của từng stage được ghi lại và executor chỉ shutdown khi pipeline hoàn tất.</li>
      </ol>
    usage: true
  fastest():
    execution: |-
      <p>API điều khiển hai CompletableFuture bằng latch để minh họa anyOf theo completion đầu tiên.</p>
      <ol>
        <li>Server A được mở trước nên thắng race; Server B vẫn được mở và hoàn tất sau đó.</li>
        <li>Một race phụ cho future lỗi hoàn thành trước future thành công để chứng minh exceptional completion cũng có thể thắng anyOf.</li>
        <li>Kiểm tra future thua không bị tự động cancel.</li>
      </ol>
    usage: true
  exceptionHandling():
    execution: |-
      <p>API tạo một CompletableFuture cố ý ném IllegalStateException rồi dùng handle để biến cả nhánh thành công và lỗi thành một kết quả thống nhất.</p>
      <ol>
        <li>Stage nguồn complete exceptionally.</li>
        <li>handle nhận error, đánh dấu recovered và trả FALLBACK thay vì để exception lan ra response.</li>
      </ol>
    usage: true
  executionVariant():
    execution: |-
      <p>API dùng một completedFuture để quan sát chính xác execution policy của continuation.</p>
      <ol>
        <li>thenApply trên stage đã complete được chạy ngay trên caller thread.</li>
        <li>thenApplyAsync được gắn explicit executor một thread tên async-variant-worker.</li>
        <li>Kết quả so sánh thread thực tế rồi shutdown executor.</li>
      </ol>
    usage: true
  allOf():
    execution: |-
      <p>API chạy hai nhóm thí nghiệm với CompletableFuture.allOf.</p>
      <ol>
        <li>Ba task inventory, payment và shipping chạy trên fixed pool; allOf chỉ complete khi cả ba xong và từng kết quả được đọc từ future gốc.</li>
        <li>Nhóm thứ hai cho một future fail trước trong khi sibling chưa xong; aggregate chỉ hoàn tất sau sibling rồi complete exceptionally.</li>
        <li>Sự cố của một input không tự cancel sibling.</li>
      </ol>
    usage: true
  timeoutCancellation():
    execution: |-
      <p>API so sánh timeout và cancellation của CompletableFuture với công việc thật đang chạy bên dưới.</p>
      <ol>
        <li>orTimeout làm future complete với TimeoutException nhưng worker đang chờ latch không bị interrupt.</li>
        <li>cancel(true) làm CompletableFuture cancelled nhưng mayInterruptIfRunning không dừng worker supplyAsync trong thí nghiệm này.</li>
        <li>Service mở latch và shutdown executor để kết thúc underlying work một cách xác định.</li>
      </ol>
    usage: true
BasicThreadController:
  processAndThread():
    execution: |-
      <p>API đọc trực tiếp execution context của request hiện tại.</p>
      <ol>
        <li>Lấy PID từ ProcessHandle.current().</li>
        <li>Lấy tên, id, state và daemon flag của Thread đang xử lý HTTP request.</li>
        <li>Trả các giá trị quan sát được mà không tạo worker mới.</li>
      </ol>
    usage: true
  startVsRun():
    execution: |-
      <p>API chạy cùng kiểu Runnable theo hai cơ chế khác nhau để đối chiếu thread thực thi.</p>
      <ol>
        <li>Gọi run trực tiếp nên task chạy ngay trên request thread.</li>
        <li>Tạo Thread basic-start-worker rồi gọi start để JVM chạy task trên worker riêng.</li>
        <li>join worker trước khi trả về và cleanup nếu cần.</li>
      </ol>
    usage: true
  threadLifeCycle():
    execution: |-
      <p>API chủ động dẫn một worker qua các trạng thái Thread.State có thể quan sát.</p>
      <ol>
        <li>Ghi NEW, start worker và giữ spin để bắt RUNNABLE.</li>
        <li>Dùng timed latch tạo TIMED_WAITING, giữ monitor để ép BLOCKED, rồi wait trên monitor khác để tạo WAITING.</li>
        <li>notifyAll cho worker chạy tiếp, join và ghi TERMINATED; finally giải phóng mọi gate để cleanup.</li>
      </ol>
    usage: true
CreateThreadController:
  createByExtends():
    execution: |-
      <p>API tạo MyWorker là subclass của Thread và gắn logic trực tiếp trong run.</p>
      <ol>
        <li>Ghi nhận request thread.</li>
        <li>Khởi động MyWorker tên extends-thread-worker để run trên thread riêng.</li>
        <li>join worker rồi trả tên caller và worker, kèm cleanup nếu worker chưa dừng.</li>
      </ol>
    usage: true
  createByRunnable():
    execution: |-
      <p>API tách task Runnable khỏi đối tượng Thread thực thi.</p>
      <ol>
        <li>Tạo Runnable chỉ chứa phần công việc.</li>
        <li>Gắn Runnable vào Thread runnable-thread-worker và gọi start.</li>
        <li>join trước khi trả kết quả để xác nhận task chạy trên worker khác caller.</li>
      </ol>
    usage: true
  createByCallable():
    execution: |-
      <p>API bọc Callable trong FutureTask rồi dùng Thread thường để thực thi.</p>
      <ol>
        <li>Callable trả về chuỗi chứa tên thread thực tế.</li>
        <li>FutureTask vừa là Runnable cho Thread callable-thread-worker vừa là Future chứa kết quả.</li>
        <li>get với timeout lấy giá trị, sau đó join và cleanup worker.</li>
      </ol>
    usage: true
DaemonThreadController:
  inspectDaemonRules():
    execution: |-
      <p>API quan sát daemon flag mà không cần chạy child thread.</p>
      <ol>
        <li>Đọc daemon status của request thread.</li>
        <li>Tạo child Thread và đọc flag mặc định để thấy nó kế thừa trạng thái từ thread tạo ra.</li>
        <li>Gọi setDaemon(true) trước khi start và trả lại trạng thái mới; JVM lifecycle đầy đủ được tách sang DaemonJvmExitDemo.</li>
      </ol>
    usage: true
ConcurrencyProblemController:
  raceCondition():
    execution: |-
      <p>API tạo lost update theo cách deterministic trên một counter thường.</p>
      <ol>
        <li>Hai worker cùng đọc counter trước và đồng bộ bằng CountDownLatch để chắc chắn đều thấy cùng snapshot.</li>
        <li>Sau đó cả hai cùng ghi snapshot + 1.</li>
        <li>Kết quả cuối chỉ tăng một lần thay vì hai, cho thấy read-modify-write không atomic.</li>
      </ol>
    usage: true
  startJoinHappensBefore():
    execution: |-
      <p>API dùng Thread.start và Thread.join để quan sát happens-before mà không dùng volatile.</p>
      <ol>
        <li>Parent ghi beforeStart = 7 trước khi start worker.</li>
        <li>Worker đọc giá trị đó rồi ghi writtenByWorker = 42.</li>
        <li>Sau join, parent đọc được giá trị worker đã ghi và trả lại cả hai chiều visibility.</li>
      </ol>
    usage: true
  volatilePublication():
    execution: |-
      <p>API publish dữ liệu thường thông qua một volatile flag.</p>
      <ol>
        <li>Reader spin chờ ready trở thành true.</li>
        <li>Writer ghi data = 42 trước rồi mới ghi volatile ready = true.</li>
        <li>Khi reader thấy ready, nó đọc data và service join cả hai thread để xác nhận publication thành công.</li>
      </ol>
    usage: true
  volatileIsNotAtomic():
    execution: |-
      <p>API lặp lại lost update nhưng counter được khai báo volatile.</p>
      <ol>
        <li>Hai worker cùng đọc volatile value và đồng bộ để giữ cùng snapshot.</li>
        <li>Mỗi worker tự tính snapshot + 1 rồi ghi lại.</li>
        <li>Visibility của volatile vẫn không ghép chuỗi read-modify-write thành một thao tác atomic nên kết quả có lost update.</li>
      </ol>
    usage: true
  deadlockRisk():
    execution: |-
      <p>API mô phỏng circular lock dependency mà không để request deadlock vĩnh viễn.</p>
      <ol>
        <li>Worker A giữ lock A, worker B giữ lock B và barrier bằng latch để cả hai cùng sở hữu lock đầu tiên.</li>
        <li>Mỗi worker dùng tryLock không chờ để thử lấy lock còn lại.</li>
        <li>Cả hai thất bại ở lock thứ hai, ghi nhận circular dependency rồi nhả lock ban đầu và kết thúc.</li>
      </ol>
    usage: true
  deadlockPrevention():
    execution: |-
      <p>API loại bỏ circular wait bằng một global lock order cố định.</p>
      <ol>
        <li>Hai worker cùng chờ start latch.</li>
        <li>Cả hai luôn acquire lock A trước rồi lock B.</li>
        <li>Sau critical section chúng nhả theo thứ tự ngược; cả hai hoàn thành mà không tạo vòng chờ.</li>
      </ol>
    usage: true
  boundedLivelock():
    execution: |-
      <p>API tạo một livelock hữu hạn bằng hai worker liên tục nhường nhau.</p>
      <ol>
        <li>Mỗi vòng, cả hai cùng đánh dấu đang thử và gặp nhau qua CyclicBarrier.</li>
        <li>Khi thấy đối phương cũng đang thử, cả hai cùng back off rồi lặp lại.</li>
        <li>Sau 5 vòng service trả số lần backoff và cho thấy worker hoạt động liên tục nhưng không tạo progress.</li>
      </ol>
    usage: true
ThreadLocalController:
  isolation():
    execution: |-
      <p>API tạo hai platform thread và dùng cùng một ThreadLocal với hai giá trị khác nhau.</p>
      <ol>
        <li>Thread A set REQ-A, Thread B set REQ-B.</li>
        <li>Mỗi thread đọc lại đúng context của chính mình rồi remove trong finally.</li>
        <li>Caller không set giá trị nên ThreadLocal trên request thread vẫn null.</li>
      </ol>
    usage: true
  inheritance():
    execution: |-
      <p>API kiểm tra thời điểm InheritableThreadLocal được sao chép sang child thread.</p>
      <ol>
        <li>Parent set PARENT-A rồi tạo child Thread.</li>
        <li>Trước khi start child, parent đổi thành PARENT-B.</li>
        <li>Child vẫn quan sát PARENT-A vì giá trị được snapshot lúc Thread được tạo; parent context được remove khi xong.</li>
      </ol>
    usage: true
  poolReuseProblem():
    execution: |-
      <p>API dùng pool một worker để cho thấy InheritableThreadLocal không phù hợp với thread reuse.</p>
      <ol>
        <li>Parent set USER_A và submit task đầu, khiến worker được tạo và kế thừa USER_A.</li>
        <li>Parent đổi thành USER_B rồi submit task thứ hai lên cùng worker.</li>
        <li>Task thứ hai vẫn thấy USER_A, minh họa stale context khi pool tái sử dụng thread.</li>
      </ol>
    usage: true
  explicitPropagation():
    execution: |-
      <p>API truyền ThreadLocal sang pool bằng wrapper chủ động capture và restore context.</p>
      <ol>
        <li>Tạo worker trước để nó không thể kế thừa context về sau.</li>
        <li>Caller set USER_B, wrapper capture giá trị rồi set nó vào worker ngay trước task.call.</li>
        <li>Sau task, wrapper khôi phục context cũ của worker và caller remove giá trị.</li>
      </ol>
    usage: true
CoordinationController:
  join():
    execution: |-
      <p>API start một worker đơn giản rồi dùng join như điểm đồng bộ.</p>
      <ol>
        <li>Worker đặt cờ completed.</li>
        <li>Caller join và chỉ tiếp tục khi worker đã terminate.</li>
        <li>Response kiểm tra cờ hoàn thành và state TERMINATED sau join.</li>
      </ol>
    usage: true
  waitNotify():
    execution: |-
      <p>API tạo ba waiter trên cùng intrinsic monitor để minh họa predicate loop, notify và notifyAll.</p>
      <ol>
        <li>Cả ba vào wait trong vòng while khi ready=false.</li>
        <li>notify đánh thức một waiter nhưng predicate vẫn false nên waiter quay lại chờ.</li>
        <li>Sau đó service set ready=true và notifyAll để tất cả hoàn thành, rồi join và cleanup.</li>
      </ol>
    usage: true
  condition():
    execution: |-
      <p>API dùng một ReentrantLock với hai Condition tách biệt cho hai loại sự kiện.</p>
      <ol>
        <li>Một waiter chờ dataAvailable, waiter còn lại chờ shutdownRequested.</li>
        <li>Signal dataAvailable chỉ cho data waiter đi tiếp trong khi shutdown waiter vẫn chờ.</li>
        <li>Sau đó signal shutdownRequested và join cả hai, chứng minh mỗi Condition có wait queue logic riêng.</li>
      </ol>
    usage: true
  lockSupport():
    execution: |-
      <p>API tạo ba thread park bằng LockSupport với cùng blocker object.</p>
      <ol>
        <li>Đọc blocker metadata khi thread đầu đang park.</li>
        <li>unpark riêng thread thứ hai và xác nhận thread thứ nhất vẫn park.</li>
        <li>Interrupt thread thứ ba làm park return mà không ném InterruptedException; cuối cùng unpark thread còn lại và cleanup.</li>
      </ol>
    usage: true
  blockingQueue():
    execution: |-
      <p>API chạy producer-consumer trên ArrayBlockingQueue capacity 2.</p>
      <ol>
        <li>Producer put 5 item nên tự block khi queue đầy.</li>
        <li>Consumer take đúng 5 item, đồng thời giải phóng chỗ cho producer.</li>
        <li>Service join cả hai và xác nhận queue rỗng khi kết thúc.</li>
      </ol>
    usage: true
  blockingQueueVariants():
    execution: |-
      <p>API chạy ba thí nghiệm queue trong cùng request.</p>
      <ol>
        <li>ArrayBlockingQueue capacity 2 được fill rồi offer item thứ ba để quan sát thất bại khi full.</li>
        <li>LinkedBlockingQueue capacity 3 được drainTo tối đa 2 phần tử.</li>
        <li>PriorityBlockingQueue nhận ba task có priority khác nhau rồi poll để quan sát thứ tự ưu tiên.</li>
      </ol>
    usage: true
  priorityQueueSemantics():
    execution: |-
      <p>API đưa hai phần tử cùng priority và một phần tử ưu tiên cao hơn vào PriorityBlockingQueue.</p>
      <ol>
        <li>Poll toàn bộ queue để ghi thứ tự thực tế.</li>
        <li>Xác nhận phần tử priority cao hơn đứng đầu.</li>
        <li>Response nhấn mạnh equal-priority không có FIFO contract và queue này không cung cấp bounded-capacity backpressure.</li>
      </ol>
    usage: true
  synchronousQueue():
    execution: |-
      <p>API dùng SynchronousQueue không có vùng chứa để minh họa handoff trực tiếp.</p>
      <ol>
        <li>Producer start trước và block tại put vì chưa có consumer nhận.</li>
        <li>Sau khi quan sát producer đang waiting, service start consumer gọi take.</li>
        <li>Hai thread gặp nhau, payload được chuyển trực tiếp và queue size vẫn bằng 0.</li>
      </ol>
    usage: true
  synchronizers():
    execution: |-
      <p>API chạy một bộ thí nghiệm nhỏ cho các synchronizer chuẩn của JDK.</p>
      <ol>
        <li>CountDownLatch chờ hai worker; CyclicBarrier cho hai participant gặp nhau và chạy barrier action.</li>
        <li>Semaphore giới hạn tối đa hai worker trong vùng bảo vệ; Phaser đồng bộ nhiều phase và deregister.</li>
        <li>Exchanger cho hai thread trao đổi payload trực tiếp rồi service tổng hợp kết quả.</li>
      </ol>
    usage: true
  synchronizersTimeout():
    execution: |-
      <p>API tập trung vào timeout, failure và recovery semantics của nhiều synchronizer.</p>
      <ol>
        <li>CountDownLatch timeout ở caller nhưng worker vẫn có thể chạy tiếp sau khi được release.</li>
        <li>CyclicBarrier timeout làm barrier broken, sau reset một generation mới lại chạy được; Semaphore thử acquire thêm permit với timeout.</li>
        <li>Phaser cho worker deregister theo phase; Exchanger được thử cả timeout không có partner và interrupt khi đang chờ.</li>
      </ol>
    usage: true
  semaphorePermitAccounting():
    execution: |-
      <p>API cố ý release Semaphore mà chưa acquire để quan sát permit accounting.</p>
      <ol>
        <li>Semaphore bắt đầu với một permit.</li>
        <li>Một unmatched release làm số permit tăng thành hai vì Semaphore không theo dõi ownership.</li>
        <li>Service thử acquire cả hai permit và sau đó trả lại, minh họa vì sao code phải chỉ release permit thực sự đã acquire.</li>
      </ol>
    usage: true
TaskExecutorController:
  asyncWithContext():
    execution: |-
      <p>API đặt DemoContext và MDC requestId trên request thread rồi gọi method có @Async.</p>
      <ol>
        <li>ThreadPoolTaskExecutor dùng DemoTaskDecorator để capture DemoContext, MDC và RequestAttributes tại lúc submit.</li>
        <li>Decorator cài các context đó lên worker, runAsync ghi nhận worker thread và giá trị quan sát được.</li>
        <li>Sau task, decorator khôi phục context cũ của worker; controller cũng khôi phục context cũ của caller trong finally.</li>
      </ol>
    usage: true
  asyncVoidException():
    execution: |-
      <p>API theo dõi exception của method @Async trả void bằng correlationId.</p>
      <ol>
        <li>Controller đăng ký một CompletableFuture quan sát trong AsyncExceptionProbe rồi gọi failWithoutFuture.</li>
        <li>Method async cố ý ném IllegalStateException; AsyncUncaughtExceptionHandler lấy correlationId và complete future bằng metadata lỗi.</li>
        <li>Nếu executor reject ngay lúc submit, controller complete future exceptionally để registration vẫn được cleanup.</li>
      </ol>
    usage: true
InterruptionController:
  interruptBusyWorker():
    execution: |-
      <p>API start một CPU-bound worker quay vòng cho tới khi thấy interrupt flag.</p>
      <ol>
        <li>Worker báo started rồi tăng bộ đếm trong vòng while kiểm tra isInterrupted.</li>
        <li>Caller gọi interrupt và join.</li>
        <li>Worker tự quan sát signal, thoát vòng lặp và kết thúc; interrupt ở đây là cooperative cancellation chứ không ép thread dừng.</li>
      </ol>
    usage: true
  inspectInterruptFlag():
    execution: |-
      <p>API đặt interrupt flag trước khi cho worker đọc nó nhiều cách.</p>
      <ol>
        <li>Hai lần isInterrupted đều chỉ đọc nên vẫn trả true.</li>
        <li>Lần đầu Thread.interrupted trả true đồng thời clear flag.</li>
        <li>Lần Thread.interrupted tiếp theo và isInterrupted cuối cùng trả false, minh họa khác biệt giữa query và query-and-clear.</li>
      </ol>
    usage: true
  interruptSleepingWorker():
    execution: |-
      <p>API interrupt một worker đang Thread.sleep.</p>
      <ol>
        <li>Worker vào sleep dài và caller gọi interrupt.</li>
        <li>sleep ném InterruptedException đồng thời clear interrupt flag, nên service ghi nhận flag false ngay trong catch.</li>
        <li>Worker chủ động gọi interrupt lại để restore flag rồi kết thúc.</li>
      </ol>
    usage: true
  cancelWithCleanup():
    execution: |-
      <p>API mô phỏng worker giữ một resource rồi bị cancel.</p>
      <ol>
        <li>Worker đánh dấu resource đang mở và chạy vòng lặp có sleep.</li>
        <li>Caller interrupt; worker bắt InterruptedException, restore flag và thoát loop.</li>
        <li>Khối finally luôn đóng resource và đánh dấu cleanupCalled trước khi thread terminate.</li>
      </ol>
    usage: true
  interruptSynchronizedWaiter():
