  tryLock():
    execution: |-
      <p>API để một holder giữ ReentrantLock rồi cho contender thử acquire có timeout.</p>
      <ol>
        <li>Holder acquire lock và chờ release latch.</li>
        <li>Contender chỉ bắt đầu sau khi holder đã giữ lock, gọi tryLock trong 100 ms và không acquire được.</li>
        <li>Sau khi contender kết thúc, service mở latch cho holder nhả lock và join cả hai.</li>
      </ol>
    usage: true
  interruptibleLock():
    execution: |-
      <p>API giữ ReentrantLock trên caller rồi cho worker chờ bằng lockInterruptibly.</p>
      <ol>
        <li>Worker bắt đầu chờ explicit lock và chuyển sang waiting state.</li>
        <li>Caller interrupt worker trước khi nhả lock.</li>
        <li>lockInterruptibly ném InterruptedException, worker không acquire lock và terminate; finally caller mới unlock.</li>
      </ol>
    usage: true
  reentrantLockPolicy():
    execution: |-
      <p>API không tạo contention mà đọc trực tiếp policy của ba ReentrantLock.</p>
      <ol>
        <li>So sánh lock mặc định, explicit unfair và fair bằng isFair.</li>
        <li>Response ghi lại nuance rằng untimed tryLock có thể barge dù lock fair, còn timed tryLock tôn trọng fairness.</li>
        <li>Fairness không bảo đảm thứ tự start tuyệt đối và có trade-off throughput.</li>
      </ol>
    usage: true
