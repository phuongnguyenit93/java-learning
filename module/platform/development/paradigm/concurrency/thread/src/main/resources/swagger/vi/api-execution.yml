      <ol>
        <li>Cùng thread gọi tryWriteLock lần nữa nhưng không reenter được.</li>
        <li>Read-lock view được hỏi newCondition và ném UnsupportedOperationException.</li>
        <li>Cuối cùng write stamp ban đầu được unlock đúng cách.</li>
