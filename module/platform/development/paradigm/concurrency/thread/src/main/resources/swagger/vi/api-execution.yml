  reentrantLock():
    execution: |-
      <p>API acquire cùng một ReentrantLock hai lần trên chính request thread.</p>
      <ol>
        <li>Lần lock đầu làm hold count bằng 1.</li>
        <li>Thread hiện tại lock lại thành công và hold count tăng thành 2, chứng minh reentrancy.</li>
        <li>Hai lần unlock trong các finally cân bằng chính xác số lần acquire.</li>
      </ol>
