  readWriteLockDowngrade():
    execution: |-
      <p>API thực hiện lock downgrading theo thứ tự an toàn từ write sang read.</p>
      <ol>
        <li>Caller giữ write lock, acquire thêm read lock rồi start một writer cạnh tranh.</li>
        <li>Caller nhả write lock nhưng vẫn giữ read lock nên competing writer tiếp tục bị chặn; sau khi read lock được nhả nó mới chạy.</li>
        <li>Cuối cùng service thử nâng read lên write bằng tryLock timeout và cho thấy upgrade không được hỗ trợ theo cách đó.</li>
      </ol>
    usage: true
  readWriteLockPolicy():
    execution: |-
      <p>API đọc policy của ReentrantReadWriteLock mặc định và fair.</p>
      <ol>
        <li>isFair cho thấy constructor mặc định là unfair và instance explicit có thể fair.</li>
        <li>Response ghi rõ untimed tryLock của cả read và write lock có thể bỏ qua fairness queue.</li>
        <li>Fairness chỉ là chính sách chờ, không bảo đảm thứ tự thread start và có chi phí throughput.</li>
      </ol>
    usage: true
  stampedLock():
