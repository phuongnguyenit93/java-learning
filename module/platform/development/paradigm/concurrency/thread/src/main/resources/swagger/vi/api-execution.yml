      <p>API giữ intrinsic monitor trên request thread để ép worker vào trạng thái BLOCKED khi cố synchronized.</p>
      <ol>
        <li>Sau khi quan sát BLOCKED, caller gọi interrupt.</li>
        <li>Worker vẫn BLOCKED; interrupt chỉ đặt flag vì chờ intrinsic monitor không interruptible.</li>
        <li>Khi caller rời synchronized, worker mới acquire monitor và thấy interrupt flag vẫn đang được giữ.</li>
      </ol>
    usage: true
  stopFlagVsInterrupt():
