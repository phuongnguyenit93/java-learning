        <li>Parent set InheritableThreadLocal rồi tạo một virtual thread mặc định để quan sát giá trị kế thừa.</li>
        <li>Một builder khác tắt inheritInheritableThreadLocals nên child không nhận context; parent cleanup sau khi join.</li>
