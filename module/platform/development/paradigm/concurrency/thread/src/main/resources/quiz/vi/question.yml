  - id: reentrantlock-interruptible-wait
    question: "Bạn cần một thread đang chờ lock có thể phản ứng với `interrupt()`. API nào phù hợp nhất?"
    answers:
      - id: A
        answer: "`synchronized` block thông thường"
        explanation: "Sai. Chờ intrinsic monitor của synchronized không phải interruptible lock acquisition."
      - id: B
        answer: "`ReentrantLock.lock()`"
        explanation: "Sai. `lock()` không cung cấp semantics chờ lock có thể bị interrupt như API chuyên dụng."
      - id: C
        answer: "`ReentrantLock.lockInterruptibly()`"
        explanation: "Đúng. Đây là một lợi ích của explicit Lock khi cancellation trong thời gian chờ lock là requirement."
      - id: D
        answer: "`Thread.yield()` trước khi lấy lock"
        explanation: "Sai. `yield()` không biến lock acquisition thành interruptible."
    correctAnswerId: C
    aiGenerated: true
