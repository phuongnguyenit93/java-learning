questions:
  - id: thread-start-vs-run
    question: "Một `Thread worker` đã được tạo. Phát biểu nào mô tả đúng nhất khác biệt giữa `worker.run()` và `worker.start()`?"
    answers:
      - id: A
        answer: "Cả hai đều tạo một thread mới, nhưng `start()` có priority cao hơn."
        explanation: "Sai. `run()` gọi method bình thường trên thread hiện tại; priority không phải điểm khác biệt giữa hai lời gọi này."
      - id: B
        answer: "`run()` chạy trên caller thread, còn `start()` bắt đầu lifecycle của thread mới và JVM sẽ thực thi `run()` trên thread đó."
        explanation: "Đúng. Đây là mental model cốt lõi của README: `run()` là method call, còn `start()` khởi động execution của một Thread riêng."
      - id: C
        answer: "`run()` chỉ dùng cho daemon thread, còn `start()` chỉ dùng cho user thread."
        explanation: "Sai. Daemon hay user thread không quyết định việc dùng `run()` hay `start()`."
      - id: D
        answer: "`start()` có thể gọi nhiều lần trên cùng một Thread object miễn là lần trước đã kết thúc."
        explanation: "Sai. Một `Thread` object chỉ có thể được `start()` một lần; gọi lại sẽ gây `IllegalThreadStateException`."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Basic/Basic.md"
      anchor: "start-vs-run"
    apiRelated:
      controller: "BasicThreadController"
      methodSignature: "startVsRun()"

  - id: task-vs-execution-mechanism
    question: "Trong mental model của module, vai trò nào sau đây là đúng?"
    answers:
      - id: A
        answer: "`Callable` là một loại Thread có khả năng trả về kết quả."
        explanation: "Sai. `Callable` mô tả task có kết quả/checked exception; nó không tự tạo hay đại diện cho execution thread."
      - id: B
        answer: "`Runnable` quyết định thread pool nào sẽ chạy task."
        explanation: "Sai. `Runnable` mô tả công việc; execution policy thuộc `Thread`/`Executor`."
      - id: C
        answer: "`Runnable`/`Callable` mô tả WHAT to run; `Thread`/`Executor` quyết định WHERE/HOW execution diễn ra."
        explanation: "Đúng. Việc tách task khỏi execution mechanism là nền tảng để hiểu Executor và Thread Pool."
      - id: D
        answer: "`Executor` chỉ là cú pháp ngắn cho `new Thread(task).start()`."
        explanation: "Sai. Executor còn quản lý execution strategy, worker reuse, queue, lifecycle và có thể có rejection policy."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Basic/Basic.md"
      anchor: "thread-task"
    apiRelated:
      controller: "CreateThreadController"
      methodSignature: "createByRunnable()"

  - id: thread-state-blocked
    question: "Một thread đang cố đi vào `synchronized(monitor)` nhưng monitor đang bị thread khác giữ. `Thread.State` phù hợp nhất là gì?"
    answers:
      - id: A
        answer: "WAITING"
        explanation: "Sai. `WAITING` thường xuất hiện với chờ vô thời hạn như `wait()`, `join()` hoặc `park()`, không phải chờ intrinsic monitor."
      - id: B
        answer: "TIMED_WAITING"
        explanation: "Sai. `TIMED_WAITING` là trạng thái chờ có giới hạn thời gian như `sleep()` hoặc `join(timeout)`."
      - id: C
        answer: "RUNNABLE"
        explanation: "Sai. Thread có thể ở RUNNABLE khi sẵn sàng/chạy CPU, nhưng chờ intrinsic monitor có state riêng."
      - id: D
        answer: "BLOCKED"
        explanation: "Đúng. Trong `Thread.State`, BLOCKED có nghĩa cụ thể là đang chờ intrinsic monitor để vào vùng `synchronized`."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Basic/Basic.md"
      anchor: "thread-state"
    apiRelated:
      controller: "BasicThreadController"
      methodSignature: "threadLifeCycle()"

  - id: daemon-jvm-lifecycle
    question: "Phát biểu nào đúng về daemon thread và lifecycle của JVM?"
    answers:
      - id: A
        answer: "Daemon thread luôn có priority thấp hơn user thread."
        explanation: "Sai. Daemon là thuộc tính liên quan đến JVM liveness, không phải quy tắc về scheduling priority."
      - id: B
        answer: "JVM không bắt buộc phải tiếp tục sống chỉ để chờ daemon thread hoàn thành khi không còn user thread nào sống."
        explanation: "Đúng. Đây là lý do daemon thread không phù hợp cho công việc bắt buộc phải hoàn tất trước khi process kết thúc nếu không có cơ chế bảo đảm khác."
      - id: C
        answer: "Kết thúc một HTTP request chứng minh daemon thread do request tạo ra cũng đã kết thúc."
        explanation: "Sai. Spring Boot vẫn còn nhiều thread khác giữ JVM sống; request kết thúc không chứng minh rule JVM shutdown."
      - id: D
        answer: "Có thể đổi `setDaemon(true)` bất kỳ lúc nào sau khi thread đã `start()`."
        explanation: "Sai. Daemon flag phải được cấu hình trước khi thread được start."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Basic/Basic.md"
      anchor: "daemon-thread"
    apiRelated:
      controller: "DaemonThreadController"
      methodSignature: "inspectDaemonRules()"

  - id: interrupt-cooperative-cancellation
    question: "Một worker chạy vòng lặp CPU-bound dài và không gọi API blocking. Muốn `interrupt()` có hiệu lực theo cooperative cancellation, worker nên làm gì?"
    answers:
      - id: A
        answer: "Không cần làm gì; JVM sẽ cưỡng bức dừng worker ngay khi nhận interrupt."
        explanation: "Sai. `interrupt()` không phải kill command. CPU-bound loop phải tự quan sát cancellation signal."
      - id: B
        answer: "Gọi `Thread.stop()` sau khi nhận interrupt để chắc chắn thoát."
        explanation: "Sai. `Thread.stop()` đã deprecated vì có thể dừng thread ở thời điểm không an toàn và phá invariant."
      - id: C
        answer: "Đặt cancellation point hợp lý bằng cách kiểm tra `Thread.currentThread().isInterrupted()`."
        explanation: "Đúng. Với code không đi qua interruptible blocking API, worker phải chủ động kiểm tra interrupt status và kết thúc có kiểm soát."
      - id: D
        answer: "Chuyển worker thành daemon thread."
        explanation: "Sai. Daemon status không biến interrupt thành forced cancellation."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Interruption/Interruption.md"
      anchor: "interrupt-mental-model"
    apiRelated:
      controller: "InterruptionController"
      methodSignature: "interruptBusyWorker()"

  - id: interrupted-flag-clear
    question: "Phát biểu nào đúng về `isInterrupted()` và `Thread.interrupted()`?"
    answers:
      - id: A
        answer: "`isInterrupted()` chỉ đọc trạng thái; `Thread.interrupted()` đọc interrupt status của current thread và clear nó."
        explanation: "Đúng. Đây là khác biệt quan trọng: một API quan sát, API static kia vừa quan sát vừa consume/clear signal của current thread."
      - id: B
        answer: "Cả hai đều luôn clear interrupt status."
        explanation: "Sai. `isInterrupted()` không clear status."
      - id: C
        answer: "`Thread.interrupted()` có thể kiểm tra interrupt status của bất kỳ target thread nào được truyền vào."
        explanation: "Sai. Đây là static method kiểm tra current thread và không nhận target thread làm tham số."
      - id: D
        answer: "`isInterrupted()` chỉ dùng được khi thread đang BLOCKED."
        explanation: "Sai. Interrupt status có thể được kiểm tra ở nhiều trạng thái; nó không giới hạn cho BLOCKED."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Interruption/Interruption.md"
      anchor: "interrupt-flag"
    apiRelated:
      controller: "InterruptionController"
      methodSignature: "inspectInterruptFlag()"

  - id: interrupt-synchronized-monitor
    question: "Thread B đang BLOCKED để chờ intrinsic monitor của `synchronized`. Thread A gọi `threadB.interrupt()`. Điều gì đúng nhất?"
    answers:
      - id: A
        answer: "B lập tức nhận `InterruptedException` và rời hàng chờ monitor."
        explanation: "Sai. Intrinsic monitor acquisition của `synchronized` không phải interruptible wait theo cách `sleep()`/`wait()` hoạt động."
      - id: B
        answer: "B lập tức chuyển sang TERMINATED."
        explanation: "Sai. Interrupt không cưỡng bức kết thúc thread."
      - id: C
        answer: "Interrupt bị bỏ qua hoàn toàn và status luôn vẫn false."
        explanation: "Sai. Interrupt status có thể được set dù B vẫn đang BLOCKED."
      - id: D
        answer: "B vẫn có thể tiếp tục BLOCKED cho tới khi monitor được release; sau đó code có thể quan sát interrupt status."
        explanation: "Đúng. Nếu cần lock acquisition phản ứng trực tiếp với cancellation, `ReentrantLock.lockInterruptibly()` là lựa chọn phù hợp hơn."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Interruption/Interruption.md"
      anchor: "interrupt-limitations"
    apiRelated:
      controller: "InterruptionController"
      methodSignature: "interruptSynchronizedWaiter()"

  - id: volatile-not-compound-atomic
    question: "Có `volatile int count` và nhiều thread cùng chạy `count++`. Nhận định nào đúng?"
    answers:
      - id: A
        answer: "`volatile` biến toàn bộ `count++` thành một atomic instruction."
        explanation: "Sai. `count++` vẫn là read-modify-write và các thread có thể interleave gây lost update."
      - id: B
        answer: "`volatile` cung cấp visibility/ordering cho read/write liên quan, nhưng không làm compound increment trở nên atomic."
        explanation: "Đúng. Nếu cần atomic increment, cân nhắc `AtomicInteger`, lock hoặc cơ chế phù hợp với invariant."
      - id: C
        answer: "`volatile` chỉ có tác dụng khi biến là reference, không có tác dụng với `int`."
        explanation: "Sai. `volatile` áp dụng được cho primitive như `int`, nhưng semantics không bao gồm compound atomicity."
      - id: D
        answer: "`count++` an toàn vì mỗi thread có stack riêng."
        explanation: "Sai. Field `count` là shared mutable state; stack riêng không bảo vệ object/field dùng chung."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "volatile-publication"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "volatileIsNotAtomic()"

  - id: happens-before-start-join
    question: "Flow nào dưới đây tạo ra guarantee phù hợp với rule `Thread.start()` và `Thread.join()` của JMM?"
    answers:
      - id: A
        answer: "Parent ghi data sau `start()`, worker chắc chắn thấy data đó ngay."
        explanation: "Sai. Start rule bảo đảm actions trước `start()` happens-before actions của started thread, không phải mọi write sau đó."
      - id: B
        answer: "Worker ghi data sau khi kết thúc, parent đọc trước `join()` vẫn luôn thấy write mới."
        explanation: "Sai. Nếu chưa có synchronization edge phù hợp, không thể suy luận guarantee đó chỉ từ thời gian thực."
      - id: C
        answer: "Parent ghi data trước `start()` để worker thấy; worker ghi kết quả rồi kết thúc; parent `join()` thành công trước khi đọc kết quả."
        explanation: "Đúng. Actions trước `start()` được truyền sang worker; actions của worker happens-before code tiếp tục sau successful `join()`."
      - id: D
        answer: "`start()` và `join()` chỉ quản lý lifecycle, không có memory-consistency guarantee."
        explanation: "Sai. README nhấn mạnh chúng vừa coordination lifecycle vừa tạo các happens-before edge quan trọng."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "happens-before"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "startJoinHappensBefore()"

  - id: safe-publication-this-escape
    question: "Tại sao publish `this` từ constructor trước khi constructor hoàn tất là nguy hiểm trong concurrent code?"
    answers:
      - id: A
        answer: "Thread khác có thể quan sát object trước khi invariant/initialization hoàn tất, làm suy yếu reasoning về safe publication và final-field initialization safety."
        explanation: "Đúng. Nên hoàn tất construction trước rồi publish object qua một boundary có memory-consistency contract rõ ràng."
      - id: B
        answer: "Vì JVM luôn copy object sang stack của thread khác."
        explanation: "Sai. Object vẫn nằm trên heap; vấn đề là publication boundary và visibility/initialization guarantee."
      - id: C
        answer: "Vì mọi field `final` trở thành mutable sau khi `this` escape."
        explanation: "Sai. `final` không trở thành mutable; vấn đề là object có thể bị quan sát quá sớm."
      - id: D
        answer: "Vì constructor bắt buộc phải chạy trong `synchronized`."
        explanation: "Sai. Constructor không bắt buộc phải synchronized; điều quan trọng là invariant và cách publish reference."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
