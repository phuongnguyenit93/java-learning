  - id: progress-deadlock-livelock-starvation
    question: "Tình huống nào mô tả livelock chính xác nhất?"
    answers:
      - id: A
        answer: "Hai thread giữ lock theo vòng tròn và đều đứng yên chờ nhau."
        explanation: "Sai. Đó là hình thái deadlock điển hình với circular wait."
      - id: B
        answer: "Một thread hiếm khi được CPU/lock/resource trong khi các thread khác vẫn tiến triển."
        explanation: "Sai. Đó là starvation."
      - id: C
        answer: "Hai thread đã TERMINATED nên không còn công việc."
        explanation: "Sai. TERMINATED không phải liveness problem kiểu livelock."
      - id: D
        answer: "Các thread vẫn hoạt động và liên tục phản ứng/back off với nhau nhưng không tạo được progress hữu ích."
        explanation: "Đúng. Livelock là active but no progress; khác deadlock ở chỗ các thread vẫn đang thực hiện hành động."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "progress-problems"
    apiRelated:
