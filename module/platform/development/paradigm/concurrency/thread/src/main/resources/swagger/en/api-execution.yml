      \ casWithStaleExpectedValue = number.compareAndSet(10, 30);\n    \n        \
      \    String stateA = new String(\"A\");\n            String stateB = new String(\"\
      B\");\n            String stateC = new String(\"C\");\n    \n        ...\n \
      \   }</code></pre>\n  </li>\n  <li>A plain <code>AtomicReference</code> changes\
