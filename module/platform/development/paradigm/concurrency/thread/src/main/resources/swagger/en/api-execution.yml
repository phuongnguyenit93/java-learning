      \ the named worker.\n    <div><i>Source: CreateThreadService.createByExtends()</i></div>\n\
      \    <pre><code>    public List&lt;String&gt; createByExtends() throws InterruptedException\
      \ {\n            String callerThread = Thread.currentThread().getName();\n \
      \   \n            MyWorker worker = new MyWorker(\"extends-thread-worker\");\n\
      \            try {\n                worker.start();\n                joinOrFail(worker);\n\
      \            } finally {\n                cleanup(worker);\n        ...\n  \
      \  }</code></pre>\n  </li>\n  <li><code>start()</code> invokes the subclass\
      \ implementation of <code>run()</code> on <code>extends-thread-worker</code>.</li>\n\
      \  <li>The service joins the worker, performs bounded cleanup if necessary,\
      \ and returns caller and worker thread names.</li>\n</ol>\n<p><b>Conclusion:</b>\
      \ Create a Thread by extending Thread. The response and Execution Context are\
      \ the runtime evidence for this behavior; the colocated source snippet shows\
      \ the code path that creates the experiment.</p>"
    usage: true
