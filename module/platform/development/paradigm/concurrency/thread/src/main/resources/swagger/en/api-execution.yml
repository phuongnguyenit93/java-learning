      \    <pre><code>    public Map&lt;String, Object&gt; gracefulShutdownDemo()\
      \ throws InterruptedException {\n            ExecutorService executor = Executors.newFixedThreadPool(2,\
      \ namedFactory(\"shutdown-worker-\"));\n            AtomicInteger completed\
      \ = new AtomicInteger();\n    \n            try {\n                for (int\
      \ i = 0; i &lt; 4; i++) {\n                    executor.execute(() -&gt; {\n\
      \                        try {\n                            Thread.sleep(20);\n\
      \        ...\n    }</code></pre>\n  </li>\n  <li>The service calls <code>shutdown()</code>,\
      \ which rejects new work but allows submitted tasks to finish.</li>\n  <li>It\
      \ waits up to two seconds for termination and only falls back to <code>shutdownNow()</code>\
      \ if needed.</li>\n  <li>The response reports completed task count and the executor's\
      \ shutdown/termination state.</li>\n</ol>\n<p><b>Conclusion:</b> Gracefully\
      \ shut down an ExecutorService. The response and Execution Context are the runtime\
      \ evidence for this behavior; the colocated source snippet shows the code path\
      \ that creates the experiment.</p>"
