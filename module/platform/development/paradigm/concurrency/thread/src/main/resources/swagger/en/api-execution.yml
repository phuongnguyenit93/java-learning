ConcurrencyProblemController:
  raceCondition():
    execution: "<p><b>Concept:</b> The service creates a deterministic lost update\
      \ on an unsynchronized integer.</p>\n<ol>\n  <li>Two workers read the same counter\
      \ value into separate snapshots.\n    <div><i>Source: ConcurrencyProblemService.deterministicRaceCondition()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; deterministicRaceCondition()\n\
      \                throws InterruptedException {\n    \n            PlainCounter\
      \ counter = new PlainCounter();\n    \n            AtomicInteger snapshotA =\
      \ new AtomicInteger();\n            AtomicInteger snapshotB = new AtomicInteger();\n\
      \    \n            CountDownLatch bothRead = new CountDownLatch(2);\n      \
      \  ...\n    }</code></pre>\n  </li>\n  <li>A latch holds both workers until\
      \ both reads have happened.</li>\n  <li>Each worker writes its own <code>snapshot\
      \ + 1</code>, so one update overwrites the other.</li>\n  <li>After joining\
      \ both workers, the response compares the sequential expectation of two with\
      \ the actual value and reports the lost update.</li>\n</ol>\n<p><b>Conclusion:</b>\
      \ Create a lost update to observe a race condition. The response and Execution\
      \ Context are the runtime evidence for this behavior; the colocated source snippet\
      \ shows the code path that creates the experiment.</p>"
    usage: true
  startJoinHappensBefore():
    execution: "<p><b>Concept:</b> The experiment uses plain fields and relies on\
      \ the memory-consistency guarantees of <code>Thread.start()</code> and <code>join()</code>.</p>\n\
      <ol>\n  <li>The parent writes <code>beforeStart = 7</code> before starting the\
      \ worker.\n    <div><i>Source: ConcurrencyProblemService.startJoinHappensBefore()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; startJoinHappensBefore()\n\
      \                throws InterruptedException {\n    \n            StartJoinState\
      \ state = new StartJoinState();\n            state.beforeStart = 7;\n    \n\
      \            Thread worker = new Thread(() -&gt; {\n                state.observedByWorker\
      \ = state.beforeStart;\n                state.writtenByWorker = 42;\n      \
      \  ...\n    }</code></pre>\n  </li>\n  <li>The worker reads that value and writes\
      \ <code>writtenByWorker = 42</code>.</li>\n  <li>The parent joins the worker,\
      \ then reads the worker-written value and returns both observations.</li>\n\
      </ol>\n<p><b>Conclusion:</b> Observe happens-before from start() and join().\
      \ The response and Execution Context are the runtime evidence for this behavior;\
      \ the colocated source snippet shows the code path that creates the experiment.</p>"
    usage: true
  volatilePublication():
    execution: "<p><b>Concept:</b> A writer publishes ordinary data through a volatile\
      \ readiness flag.</p>\n<ol>\n  <li>The reader starts first and spins on volatile\
      \ <code>ready</code>.\n    <div><i>Source: ConcurrencyProblemService.volatilePublication()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; volatilePublication()\n\
      \                throws InterruptedException {\n    \n            PublicationState\
      \ state = new PublicationState();\n            Thread reader = new Thread(()\
      \ -&gt; {\n                while (!state.ready) {\n                    if (Thread.currentThread().isInterrupted())\
      \ {\n                        return;\n                    }\n        ...\n \
      \   }</code></pre>\n  </li>\n  <li>The writer stores <code>data = 42</code>\
      \ and then sets <code>ready = true</code>.</li>\n  <li>Once the reader observes\
      \ the volatile write, it reads the previously written data, and both threads\
      \ are joined before the values are returned.</li>\n</ol>\n<p><b>Conclusion:</b>\
      \ Publish data through a volatile flag. The response and Execution Context are\
      \ the runtime evidence for this behavior; the colocated source snippet shows\
      \ the code path that creates the experiment.</p>"
    usage: true
  volatileIsNotAtomic():
    execution: "<p><b>Concept:</b> The service repeats the deterministic lost-update\
      \ experiment with the counter field declared <code>volatile</code>.</p>\n<ol>\n\
      \  <li>Both workers read the same volatile value before either is allowed to\
      \ write.\n    <div><i>Source: ConcurrencyProblemService.volatileIsNotAtomic()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; volatileIsNotAtomic()\n\
      \                throws InterruptedException {\n    \n            VolatileCounter\
      \ counter = new VolatileCounter();\n    \n            AtomicInteger snapshotA\
      \ = new AtomicInteger();\n            AtomicInteger snapshotB = new AtomicInteger();\n\
      \    \n            CountDownLatch bothRead = new CountDownLatch(2);\n      \
      \  ...\n    }</code></pre>\n  </li>\n  <li>After the latch releases them, each\
      \ stores <code>snapshot + 1</code>.</li>\n  <li>The final value is still lower\
      \ than the sequential expectation, demonstrating that visibility does not make\
      \ the read-modify-write sequence atomic.</li>\n</ol>\n<p><b>Conclusion:</b>\
      \ Prove volatile does not provide atomicity. The response and Execution Context\
      \ are the runtime evidence for this behavior; the colocated source snippet shows\
      \ the code path that creates the experiment.</p>"
    usage: true
  deadlockRisk():
    execution: "<p><b>Concept:</b> The service constructs circular lock ownership\
      \ while using non-blocking second-lock attempts so the demo cannot hang.</p>\n\
      <ol>\n  <li>Worker A locks A and worker B locks B.\n    <div><i>Source: ConcurrencyProblemService.deadlockRisk()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; deadlockRisk()\n      \
