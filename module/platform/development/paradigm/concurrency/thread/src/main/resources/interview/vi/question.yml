      methodSignature: "deadlockPrevention()"

  - question: >-
      synchronized cung cấp những guarantee gì và instance synchronized khác static synchronized ra sao?
    answer: >-
      synchronized cung cấp mutual exclusion và memory-consistency guarantee khi release/acquire cùng monitor. Instance synchronized method khóa monitor của this, còn static synchronized khóa Class object. Hai instance khác nhau không tự chặn nhau nếu chúng dùng hai monitor khác nhau; điều quan trọng là các code path có thực sự cạnh tranh cùng monitor hay không.
