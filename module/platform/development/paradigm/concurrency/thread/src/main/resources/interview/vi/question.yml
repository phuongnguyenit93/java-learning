  - question: >-
      Vì sao thường phải restore interrupt status khi bắt InterruptedException?
    answer: >-
      Nhiều interruptible blocking API clear interrupt flag khi ném InterruptedException. Nếu method bắt exception nhưng không propagate nó lên trên, pattern phổ biến là gọi Thread.currentThread().interrupt() để bảo toàn tín hiệu cancellation cho code tầng trên. Cleanup resource nên nằm trong finally để chạy cả ở normal path lẫn cancellation path.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Interruption/Interruption.md"
      anchor: "interrupted-exception"
    apiRelated:
      controller: "InterruptionController"
      methodSignature: "interruptSleepingWorker()"

  - question: >-
      Một Thread đang BLOCKED để lấy synchronized monitor có thoát ra ngay khi bị interrupt không?
    answer: >-
      Không. Khi Thread đang BLOCKED chờ intrinsic monitor của synchronized, interrupt() có thể đặt interrupt status nhưng không làm Thread thoát khỏi monitor acquisition. Thread vẫn phải chờ monitor được release. Nếu cần lock acquisition có khả năng phản ứng với interruption, ReentrantLock cung cấp lockInterruptibly().
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Interruption/Interruption.md"
      anchor: "interrupt-limitations"
    apiRelated:
      controller: "InterruptionController"
      methodSignature: "interruptSynchronizedWaiter()"

  - question: >-
      volatile stop flag và interrupt() khác nhau như thế nào trong cancellation?
    answer: >-
      volatile stop flag là application state có visibility guarantee, phù hợp cho một số cooperative loop. Nhưng nó không tích hợp với interruption protocol và không tự đánh thức Thread đang sleep(), wait() hoặc join(). interrupt() ngoài việc mang cancellation signal còn có thể làm các interruptible blocking operation kết thúc sớm, nên thường phù hợp hơn khi task có thể block và cần cancellation responsive.
    aiGenerated: true
    reviewed: false
