  - question: >-
      Khi nào một Thread, pool hoặc queue được coi là leak/resource pressure và nên quan sát gì trong production?
    answer: >-
      Leak xảy ra khi resource sống lâu hơn ownership/intention và thiếu lifecycle phù hợp, ví dụ Thread không có cancellation path, pool tạo theo request nhưng quên shutdown, duplicated scheduler hoặc stale ThreadLocal. Thread count ổn định vẫn có thể nguy hiểm nếu queue backlog tăng. Production nên theo dõi thread/pool count, active count, queue depth, memory, CPU, rejection và shutdown duration, đồng thời so sánh nhiều thread dump theo thời gian để tìm owner và lifecycle bug.
