  - question: >-
      volatile đảm bảo gì và không đảm bảo gì?
    answer: >-
      volatile cung cấp visibility và ordering semantics. Một volatile write happens-before subsequent read của cùng volatile variable, nên có thể dùng flag như ready để publish các write trước đó. Nhưng volatile không biến compound operation như count++ thành atomic; với những update cần read-modify-write nguyên tử vẫn cần Atomic, synchronized, Lock hoặc design khác.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "volatile-publication"
    apiRelated:
