  - question: >-
      Vì sao count++ không thread-safe khi nhiều Thread cùng cập nhật?
    answer: >-
      count++ là một chuỗi read-modify-write chứ không phải một atomic action duy nhất. Hai Thread có thể cùng đọc giá trị cũ, cùng tính giá trị mới rồi ghi đè lên nhau, tạo lost update. Muốn bảo vệ increment cần primitive có atomicity phù hợp như AtomicInteger hoặc một critical section được synchronized/lock bảo vệ.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "shared-state-race-condition"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "raceCondition()"

  - question: >-
      Race condition, data race, visibility và ordering khác nhau như thế nào?
    answer: >-
      Race condition là vấn đề correctness khi kết quả phụ thuộc vào interleaving không được kiểm soát. Data race có nghĩa cụ thể trong JMM: hai Thread truy cập cùng variable, ít nhất một là write và các truy cập xung đột không được ordered bởi happens-before. Visibility hỏi Thread khác có guarantee thấy write hay không; ordering hỏi các action được quan sát theo guarantee nào. Các vấn đề này có thể cùng xuất hiện nhưng không phải một khái niệm duy nhất.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "12.Q&A/Q&A.md"
      anchor: "race-vs-visibility"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Happens-before trong Java Memory Model có nghĩa là gì?
    answer: >-
      Happens-before là relation mang visibility và ordering guarantee, không chỉ là thứ tự thời gian theo đồng hồ. Các edge quan trọng gồm program order, Thread.start(), successful join(), monitor unlock tới later lock, volatile write tới subsequent read, executor submission tới task execution, computation tới successful Future.get(), synchronizer release/acquire và tính transitive.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "happens-before"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "startJoinHappensBefore()"

  - question: >-
      Safe publication là gì, final field giúp gì và vì sao this escape trong constructor nguy hiểm?
    answer: >-
      Safe publication yêu cầu reference được đưa sang Thread khác qua memory-consistency boundary rõ ràng như volatile, monitor/Lock, concurrent collection, Thread.start() hoặc Executor submission. Final field có initialization-safety đặc biệt khi object được construct đúng và this không escape trước khi constructor hoàn tất. Nếu this escape sớm, Thread khác có thể quan sát object trước khi invariant được thiết lập đầy đủ.
    aiGenerated: true
    reviewed: false
    readmeRelated:
