  - question: >-
      scheduleAtFixedRate() và scheduleWithFixedDelay() khác nhau thế nào, và exception trong periodic task có hậu quả gì?
    answer: >-
      Fixed rate cố duy trì cadence theo các mốc start dự kiến; fixed delay chờ một khoảng delay sau khi lần chạy trước hoàn thành rồi mới lên lịch lượt tiếp theo. Cùng một periodic task không overlap với chính nó theo contract của ScheduledThreadPoolExecutor. Nếu một execution của periodic task để exception thoát ra ngoài, các execution tiếp theo của chính periodic task đó bị suppress, nên production job cần failure-observation/handling rõ ràng.
