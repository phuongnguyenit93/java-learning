  - question: >-
      Những caveat quan trọng của Virtual Thread trên Java 21 là gì?
    answer: >-
      Virtual Thread vẫn tuân theo JMM, race condition, lock và deadlock như platform Thread. Trong Java 21 chúng luôn là daemon và có priority cố định Thread.NORM_PRIORITY. ThreadLocal vẫn có per-thread semantics và payload lớn trên rất nhiều virtual Thread có thể tạo heap pressure. Java 21 còn có pinning trong một số trường hợp, đáng chú ý khi blocking lúc giữ synchronized monitor; pinning dài/thường xuyên có thể giảm scalability. Bật spring.threads.virtual.enabled=true cũng không biến mọi Thread trong application thành virtual Thread.
