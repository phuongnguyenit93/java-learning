  - question: >-
      execute() và submit() khác nhau như thế nào về result và failure observation?
    answer: >-
      execute(Runnable) trả void; exception thoát khỏi task đi theo uncaught-exception path của worker. submit(Runnable/Callable) trả Future và giữ result hoặc failure trong Future; get() expose failure qua ExecutionException. Vì vậy submit một task quan trọng rồi bỏ luôn Future có thể làm application mất một failure-observation channel quan trọng.
