  - question: >-
      shutdown() và shutdownNow() của ExecutorService khác nhau như thế nào?
    answer: >-
      shutdown() ngừng nhận task mới nhưng cho queued/running task tiếp tục. shutdownNow() cố interrupt running task và trả về các task chưa bắt đầu, nhưng không thể cưỡng bức một task không hợp tác với interruption phải dừng ngay. Executor do code tạo ra phải có owner chịu trách nhiệm shutdown; awaitTermination thường được dùng để giới hạn thời gian graceful shutdown trước khi cân nhắc forced shutdown.
