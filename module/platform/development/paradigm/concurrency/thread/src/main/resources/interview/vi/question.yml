  - question: >-
      interrupt() có kill một Thread không?
    answer: >-
      Không. interrupt() gửi một cooperative cancellation signal. Nếu Thread đang chạy CPU loop thì code phải chủ động kiểm tra interrupt status. Nếu Thread đang ở operation hỗ trợ interruption như sleep(), wait() hoặc join(), operation có thể kết thúc sớm bằng InterruptedException. Task vẫn phải tự cleanup và kết thúc an toàn.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Interruption/Interruption.md"
      anchor: "interrupt-mental-model"
    apiRelated:
      controller: "InterruptionController"
      methodSignature: "interruptBusyWorker()"

  - question: >-
      isInterrupted() và Thread.interrupted() khác nhau như thế nào?
    answer: >-
      isInterrupted() là instance method dùng để đọc interrupt status của Thread được gọi và không clear flag. Thread.interrupted() là static method kiểm tra current Thread và đồng thời clear interrupt status. Vì vậy không nên dùng Thread.interrupted() tùy tiện nếu tầng trên vẫn cần quan sát cancellation signal.
    aiGenerated: true
    reviewed: false
    readmeRelated:
