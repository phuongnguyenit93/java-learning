      methodSignature: "threadLifeCycle()"

  - question: >-
      Daemon Thread ảnh hưởng tới JVM lifecycle như thế nào?
    answer: >-
      JVM tiếp tục tồn tại khi còn user Thread sống. Khi chỉ còn daemon Thread, JVM không bắt buộc phải chờ chúng hoàn thành. Daemon không có nghĩa là priority thấp; đó là thuộc tính về JVM liveness. Thread mới mặc định kế thừa daemon status của Thread tạo nó, và setDaemon(...) phải được gọi trước start().
    aiGenerated: true
    reviewed: false
