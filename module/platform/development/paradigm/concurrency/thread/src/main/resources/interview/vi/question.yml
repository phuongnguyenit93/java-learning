  - question: >-
      Virtual Thread trong Java 21 thay đổi execution model như thế nào và có thay thế mọi resource limit không?
    answer: >-
      Virtual Thread là lightweight Thread do JVM quản lý và được mount lên carrier/platform Thread khi chạy. Với supported blocking operation, runtime có thể unmount virtual Thread để carrier làm việc khác, giúp mô hình thread-per-task scale tốt hơn cho nhiều blocking task. Nhưng DB connection, API rate limit, file descriptor và các downstream resource vẫn hữu hạn, nên Semaphore, rate limiter hoặc resource pool vẫn cần thiết.
