  - question: >-
      Java có những Thread.State nào và BLOCKED khác WAITING ở điểm nào?
    answer: >-
      Java có sáu state: NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING và TERMINATED; không có enum RUNNING. BLOCKED có nghĩa cụ thể là Thread đang chờ intrinsic monitor để vào synchronized. WAITING là chờ vô thời hạn cho một event hoặc condition, ví dụ Object.wait(), Thread.join() hoặc LockSupport.park(). TIMED_WAITING là dạng chờ có timeout.
    aiGenerated: true
    reviewed: false
    readmeRelated:
