  - question: >-
      Synchronization và coordination khác nhau như thế nào?
    answer: >-
      Synchronization tập trung bảo vệ shared state, tức là ai được phép truy cập hoặc mutation tại một thời điểm. Coordination tập trung vào dependency giữa các Thread: ai phải chờ, chờ event/phase nào và khi nào được tiếp tục. synchronized bảo vệ counter là synchronization; CountDownLatch chờ nhiều worker hoàn thành là coordination. Một chương trình thực tế thường cần cả hai.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "12.Q&A/Q&A.md"
      anchor: "synchronization-vs-coordination"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Vì sao Object.wait() phải nằm trong while và wait() khác Thread.sleep() ở điểm quan trọng nào?
    answer: >-
      Notification chỉ là tín hiệu để waiter kiểm tra lại predicate, không phải bằng chứng condition đã đúng. while xử lý spurious wakeup, nhiều waiter cạnh tranh và state thay đổi trước khi Thread reacquire monitor. wait() yêu cầu caller đang giữ monitor và sẽ release monitor trong lúc chờ; sleep() không release monitor chỉ vì Thread đang ngủ. notify()/notifyAll() cũng không trao monitor ngay cho waiter.
    aiGenerated: true
    reviewed: false
    readmeRelated:
