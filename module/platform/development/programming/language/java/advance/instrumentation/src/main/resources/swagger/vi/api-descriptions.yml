InstrumentationController:
  agentStatus():
    summary: Quan sát Instrumentation capability và class modifiability thật
    description: Endpoint đọc Instrumentation do Java Agent đã nhận từ JVM, trả trạng
      thái hỗ trợ redefine/retransform/native-prefix, số class đã load, ClassLoader
      của agent và probe target, đồng thời gọi isModifiableClass trên target. Nếu
      application không được khởi động cùng agent, response nói rõ experiment chưa
      sẵn sàng thay vì giả lập capability.
    enableVideoYoutube: false
    videoYoutubeId: ''
