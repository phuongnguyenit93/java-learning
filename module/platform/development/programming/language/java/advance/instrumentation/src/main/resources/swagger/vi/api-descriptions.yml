    httpMethods:
    - GET
    mappingPaths:
    - /instrumentation/agent-status
    produces: [
      ]
    consumes: [
      ]
    usage: true
  retransformGroups():
    summary: Quan sát hai nhóm transformer khi retransform class đã load
    description: Đăng ký hai ClassFileTransformer trên cùng một target đã load, một
      transformer với canRetransform=false và một với canRetransform=true, rồi gọi
      retransformClasses. Response trả callback count của từng nhóm, classBeingRedefined
      và kết quả removeTransformer. Transformer chỉ quan sát callback và return null
      nên business behavior của target không bị đổi.
