# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: instrumentation-q01-mechanism-choice
    question: "An application constructs an object directly with new and invokes a method without going through a proxy. You need to inject a timing probe into that method without changing application source. Which mechanism fits best?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "14.DecisionGuide/DecisionGuide.md"
      anchor: "instrumentation-vs-reflection-proxy"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Use Reflection so every call to the method is automatically routed through reflective invocation."
        explanation: "Incorrect. Reflection can discover or invoke members when code explicitly uses it, but it does not automatically intercept existing ordinary Java calls."
      - id: B
        answer: "Use a proxy so every call on the object, including directly constructed objects, is intercepted."
        explanation: "Incorrect. A proxy only observes calls that pass through the proxy boundary; directly constructed and invoked objects can bypass it."
      - id: C
        answer: "Use Instrumentation to transform the class bytecode and inject the probe into the target method."
        explanation: "Correct. Instrumentation operates at class definition/bytecode level and does not depend on calls flowing through a proxy."
      - id: D
        answer: "Use Runtime Diagnostics so a thread dump injects a timing probe into the running method."
        explanation: "Incorrect. Runtime Diagnostics interprets runtime evidence; it is not the general mechanism for injecting bytecode probes into classes."
    correctAnswerId: C

  - id: instrumentation-q02-agent-failure-semantics
    question: "Compare agent initialization failures: premain from a -javaagent startup agent throws an uncaught exception, and agentmain from an agent loaded into an already-running JVM also throws an uncaught exception. What is correct?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.AgentLoading/AgentLoading.md"
      anchor: "launch-failure-semantics"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Both failures force the JVM to terminate because an agent is always a mandatory process component."
        explanation: "Incorrect. Failure semantics depend on the launch mode; failure of a dynamically loaded agent does not require an already-running JVM to terminate."
      - id: B
        answer: "A premain failure can abort JVM startup before application main, while a dynamically loaded agentmain failure does not abort the running JVM."
        explanation: "Correct. Startup-agent failure is a startup failure; failure to initialize an agent loaded into a running JVM does not stop that JVM."
      - id: C
        answer: "A premain failure is ignored so the application continues, while an agentmain failure aborts the running JVM."
        explanation: "Incorrect. This reverses the failure semantics of the two launch paths."
      - id: D
        answer: "Both failures are ignored by the JVM; only the method name premain versus agentmain differs."
        explanation: "Incorrect. A premain failure can prevent application startup from completing."
    correctAnswerId: B

  - id: instrumentation-q03-capability-vs-modifiability
    question: "The agentStatus endpoint reports retransformSupported=true but probeTargetModifiable=false. What is the most accurate conclusion?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.InstrumentationApi/InstrumentationApi.md"
      anchor: "capability-model"
    apiRelated:
      controller: "InstrumentationController"
      methodSignature: "agentStatus()"
    answers:
      - id: A
        answer: "The target can still be retransformed because JVM-level support overrides isModifiableClass."
        explanation: "Incorrect. Retransformation support and per-class modifiability are independent conditions."
      - id: B
        answer: "The two results conflict; if retransformSupported=true then isModifiableClass must be true for every class."
        explanation: "Incorrect. JVM-level capability does not determine the per-class result of isModifiableClass."
      - id: C
        answer: "The false value only blocks redefinition; retransformation uses a separate per-class modifiability rule."
        explanation: "Incorrect. isModifiableClass is the per-class check used for both redefinition and retransformation."
      - id: D
        answer: "The JVM supports retransformation, but this particular target still does not satisfy the modifiability requirement."
        explanation: "Correct. isRetransformClassesSupported does not force isModifiableClass to become true; an unmodifiable target cannot be retransformed."
    correctAnswerId: D

  - id: instrumentation-q04-transformer-order
    question: "Two Java transformers match the same class load: T1 has canRetransform=true and is registered first; T2 has canRetransform=false and is registered second. Which invocation order is correct?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.TransformationPipeline/TransformationPipeline.md"
      anchor: "transformer-order"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "T2 then T1, because retransformation-incapable transformers are grouped before retransformation-capable transformers."
        explanation: "Correct. The JVM orders capability/native groups first; registration order only orders transformers within the same group."
      - id: B
        answer: "T1 then T2, because registration order is always global across all transformer groups."
        explanation: "Incorrect. Registration order does not override the ordering between transformer capability groups."
      - id: C
        answer: "Only T1 runs, because a transformer with canRetransform=false does not participate in initial class loading."
        explanation: "Incorrect. canRetransform=false transformers still receive class loads and redefinitions; they are skipped only during retransformation."
      - id: D
        answer: "The order is undefined; the JVM may invoke either T1 or T2 first on each load."
        explanation: "Incorrect. ClassFileTransformer specifies both the grouping order and registration order within each group."
    correctAnswerId: A

  - id: instrumentation-q05-retransform-capability-groups
    question: "In the retransform-groups experiment, the target is already loaded before two transformers are added. One is registered with canRetransform=false and the other with true. What evidence is expected after retransformClasses(target)?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.TransformationPipeline/TransformationPipeline.md"
      anchor: "retransform-capability-groups"
    apiRelated:
      controller: "InstrumentationController"
      methodSignature: "retransformGroups()"
    answers:
      - id: A
        answer: "Both transformers receive one callback because both are registered when retransformation begins."
        explanation: "Incorrect. A retransformation-incapable transformer is not called during class retransformation."
      - id: B
        answer: "The false transformer receives a callback and the true transformer does not, because true only affects future class loads."
        explanation: "Incorrect. canRetransform=true is precisely what allows the transformer to be called during retransformation."
      - id: C
        answer: "The false transformer has callback count 0, while the true transformer has at least one callback for the target."
        explanation: "Correct. This is the primary evidence observed directly from the JVM transformer pipeline by the experiment."
      - id: D
        answer: "Both callback counts remain 0 because a newly registered transformer cannot affect an already-loaded class in any way."
        explanation: "Incorrect. A retransformation-capable transformer can receive a callback when an already-loaded modifiable class is retransformed."
    correctAnswerId: C

  - id: instrumentation-q06-transformer-exception
    question: "A ClassFileTransformer throws an unchecked exception from transform and does not catch it. According to the contract, what happens to the pipeline?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.ClassFileTransformer/ClassFileTransformer.md"
      anchor: "transform-failure-contract"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The JVM immediately stops the pipeline, skips every later transformer, and always cancels the class operation."
        explanation: "Incorrect. An exception from one transformer does not automatically prevent later transformers from running."
      - id: B
        answer: "For that transformer the effect is like returning null; later transformers are still called and the class operation is still attempted."
        explanation: "Correct. The pipeline continues, so a transformer should manage its own failure reporting and defensive behavior where needed."
      - id: C
        answer: "The JVM automatically removes the failing transformer and retries the full pipeline once from the beginning."
        explanation: "Incorrect. The contract does not define automatic removal or retry behavior of this kind."
      - id: D
        answer: "The JVM defers the exception until the end of the pipeline and always wraps it in IllegalClassFormatException."
        explanation: "Incorrect. IllegalClassFormatException is a specific signal a transformer may throw; arbitrary unchecked exceptions are not normalized this way."
    correctAnswerId: B

  - id: instrumentation-q07-active-frame-behavior
    question: "A method already has an active stack frame when its class is successfully redefined or retransformed with a new method body. What correctly describes the behavior?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.RedefinitionRetransformation/RedefinitionRetransformation.md"
      anchor: "active-frame-behavior"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Both the active frame and new invocations keep old code until every old frame has completed."
        explanation: "Incorrect. The active frame may keep old code, but new invocations can use the new definition once it is installed."
      - id: B
        answer: "The JVM switches the active frame to the new method body at a safepoint and resumes at a matching location."
        explanation: "Incorrect. Redefinition or retransformation does not define migration of an executing frame into the new bytecode."
      - id: C
        answer: "The active frame uses new code immediately, while new invocations may keep old code until the next class resolution."
        explanation: "Incorrect. The useful distinction is the reverse: an active frame may retain old code while new invocations use the new definition."
      - id: D
        answer: "An active frame may continue old code, while new invocations use the newly installed method definition."
        explanation: "Correct. This distinction matters when reasoning about hot class modification while code is already executing."
    correctAnswerId: D

  - id: instrumentation-q08-unmodifiable-types
    question: "According to Instrumentation.isModifiableClass, which group is guaranteed to be unmodifiable?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.StructuralLimits/StructuralLimits.md"
      anchor: "unmodifiable-classes"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Primitive classes and array classes, regardless of whether the JVM supports retransformation."
        explanation: "Correct. Java Instrumentation specifies that primitive classes and array classes are never modifiable."
      - id: B
        answer: "Every class defined by the bootstrap class loader, regardless of class kind or runtime capability."
        explanation: "Incorrect. Bootstrap loading does not by itself mean a class is always unmodifiable; capability must be checked for the specific class."
      - id: C
        answer: "Every interface and enum already loaded by the JVM, regardless of defining loader or module."
        explanation: "Incorrect. There is no general rule that all interfaces or enums are always unmodifiable."
      - id: D
        answer: "Every class in a named module, regardless of whether its package is exported or opened."
        explanation: "Incorrect. Module membership does not by itself make a class unmodifiable; module/access concerns are a different dimension."
    correctAnswerId: A

  - id: instrumentation-q09-remove-vs-rollback
    question: "A transformer has already modified several classes and is then successfully removed with removeTransformer. Which operational conclusion is most accurate?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "13.OperationalSafety/OperationalSafety.md"
      anchor: "rollback-strategy"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Previously transformed classes automatically return to their original bytecode as soon as the transformer is removed."
        explanation: "Incorrect. removeTransformer unregisters the transformer; it does not automatically restore class definitions already installed."
      - id: B
        answer: "Removal guarantees the transformer can never receive another callback, so all of its state can be released immediately."
        explanation: "Incorrect. Because class loading is multi-threaded, callbacks may still arrive after removal; transformer lifecycle should be defensive."
      - id: C
        answer: "Already transformed classes keep their current definition; rollback requires a separate strategy such as retransform or redefine when supported and designed safely."
        explanation: "Correct. Unregistration and restoration are separate concerns."
      - id: D
        answer: "Removal only works for canRetransform=true transformers; false transformers must remain registered until JVM shutdown."
        explanation: "Incorrect. removeTransformer applies to registered transformers regardless of retransformation capability."
    correctAnswerId: C

  - id: instrumentation-q10-jdk21-dynamic-attach
