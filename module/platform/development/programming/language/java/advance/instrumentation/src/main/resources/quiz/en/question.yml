    answers:
      - id: A
        answer: "Dynamic loading is disabled by default on JDK 21; only startup -javaagent works without an opt-in flag."
        explanation: "Incorrect. In JDK 21 dynamic loading remains allowed by default, but the JVM emits a warning."
      - id: B
        answer: "Dynamic loading remains allowed by default but emits a warning; HotSpot provides an explicit opt-in flag that allows it and suppresses the warning."
        explanation: "Correct. This is part of the move toward explicit deployer approval for dynamic agent loading."
      - id: C
        answer: "Dynamic loading remains warning-free when the agent manifest declares Can-Retransform-Classes=true."
        explanation: "Incorrect. Retransformation capability does not control the dynamic-agent warning policy."
      - id: D
        answer: "The warning applies only to startup premain; agentmain loaded after startup is outside this integrity policy."
        explanation: "Incorrect. The JDK 21 warning specifically concerns agents loaded dynamically into a running JVM."
    correctAnswerId: B
