InstrumentationController:
  agentStatus():
    summary: Observe real Instrumentation capabilities and class modifiability
    description: Reads the Instrumentation instance received by the Java agent and
      returns redefine/retransform/native-prefix support, loaded-class count, the
      agent and probe target ClassLoaders, and isModifiableClass for the target. If
      the application was not started with the agent, the response explicitly reports
      that the experiment is unavailable rather than simulating capabilities.
    enableVideoYoutube: false
    videoYoutubeId: ''
    videoYoutubeTitle: ''
