    usage: true
  retransformGroups():
    summary: Observe transformer capability groups during retransformation
    description: Registers two ClassFileTransformer instances for one already-loaded
      target, one with canRetransform=false and one with canRetransform=true, then
      invokes retransformClasses. The response exposes callback counts, classBeingRedefined
      evidence, and removeTransformer results. Both transformers return null, so the
      target behavior remains unchanged while the pipeline semantics stay directly
      observable.
    enableVideoYoutube: false
    videoYoutubeId: ''
    videoYoutubeTitle: ''
    aiGenerated: true
