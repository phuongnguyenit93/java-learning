  - question: "How would you design safe shutdown and rollback for a production agent when removeTransformer does not restore classes and callbacks may still race after removal? How does JDK 21 dynamic-attach policy affect the runbook?"
    answer: "I separate unregistration from restoration. removeTransformer stops the registration from participating in future transformations, but classes already transformed keep their installed definition; rollback needs a separate retransform or redefine strategy if capabilities and transformation design make restoration safe. Because class loading is multi-threaded, a callback may still arrive after removal, so the transformer should have defensively managed enabled state, resource lifetime that covers in-flight callbacks, idempotent cleanup, and no dependency that is freed while a late callback may still use it. A production runbook should also define who may attach, artifact trust/version controls, target scope, observability, and recovery if transformation fails. On JDK 21 dynamic agent loading is still allowed by default but emits a warning, and HotSpot provides an explicit opt-in flag. That direction favors deployer-owned startup/configuration rather than assuming dynamic attach will always remain silent or enabled by default on future JDKs."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: ""
