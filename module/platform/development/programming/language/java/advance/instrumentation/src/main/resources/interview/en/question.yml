  - question: "Compare the three agent startup paths: -javaagent/Premain-Class, Launcher-Agent-Class in an executable JAR, and Agent-Class for dynamic loading. How do failure semantics and startup-versus-dynamic choice affect deployment?"
    answer: "With -javaagent, the manifest names Premain-Class and the JVM invokes premain before application main; an uncaught initialization failure can abort startup. With an executable JAR containing Launcher-Agent-Class, the JVM invokes agentmain before application main and startup failure can likewise abort the launch. For an agent JAR loaded into an already-running JVM, Agent-Class identifies agentmain; failure to initialize that agent does not abort the running JVM, though the JVM may log the failure. Operationally, a startup agent gives explicit deployer opt-in, sees classes from the beginning, and is easier to audit, but requires launch configuration and usually a restart. Dynamic attach is useful for on-demand tooling or when restart is impractical, but depends on attach support and policy and emits a warning by default on JDK 21. The choice is about intervention timing, operational authority, policy, and whether early-loaded classes matter, not merely which entry method name is used."
    aiGenerated: true
    reviewed: false
