questions:
  - question: "Explain the mental model of Java Instrumentation and distinguish it from Reflection or proxies. When is bytecode transformation appropriate, and when is it overkill?"
    answer: "Instrumentation participates in the class-file lifecycle for load, redefine, and retransform, so it can inject or change logic in the class definition without requiring calls to pass through a particular wrapper. Reflection mainly handles runtime metadata/member access and invocation when code explicitly uses Reflection; a proxy or interceptor only sees calls crossing its proxy boundary. Instrumentation fits cross-cutting behavior across many classes, code whose source you do not own, or probes that must still run for directly constructed and directly invoked objects. The trade-off is a larger blast radius plus verification, linkage, ClassLoader, compatibility, and operational risk. If a direct call, wrapper, proxy, or framework hook already expresses the requirement clearly, the simpler mechanism is usually preferable."
    aiGenerated: true
    reviewed: false
    readmeRelated:
