  - question: "A JVM reports isRetransformClassesSupported() = true while isModifiableClass(Target.class) = false. Why are those results not contradictory, and how does agentStatus help a learner verify the capability model?"
    answer: "isRetransformClassesSupported describes whether the current JVM/agent configuration supports the retransformation mechanism in general. isModifiableClass answers a different question: whether one particular class is eligible for redefinition or retransformation. A global mechanism may therefore be available while a target class remains unmodifiable, so correct code checks both dimensions. agentStatus reads the real Instrumentation instance and exposes redefine/retransform support, loaded-class information, and isModifiableClass for the probe target. The response therefore separates JVM/agent capability from per-class eligibility instead of merely restating manifest configuration. If the target is unmodifiable, retransformClasses on that target is still invalid even when retransformSupported is true."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.InstrumentationApi/InstrumentationApi.md"
      anchor: "capability-model"
    apiRelated:
      controller: "InstrumentationController"
      methodSignature: "agentStatus()"

  - question: "Explain transformer ordering and retransformation semantics. Why is a canRetransform=false transformer not invoked again, how is its previous output handled, and what part of that contract does the retransform-groups experiment actually prove?"
    answer: "Transformers are grouped in this order: Java retransformation-incapable, native incapable, Java capable, then native capable; registration order applies only inside each group. During load or redefine, matching transformers form a pipeline in which earlier output becomes later input. During retransformation, a transformer registered with canRetransform=false is not called again; the JVM automatically reuses the transformation result that group produced during the previous load or redefine, while canRetransform=true transformers are invoked again on the retransformation input. The retransform-groups experiment loads the target first, then registers two observing transformers and calls retransformClasses. A callback count of 0 for the false transformer and at least 1 for the true transformer directly proves the invocation-group difference. It does not by itself prove reuse of a previous transformed output because the false transformer was not present at the initial load and never produced transformed bytes; that reuse behavior comes from the API contract and Knowledge."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.TransformationPipeline/TransformationPipeline.md"
      anchor: "retransform-capability-groups"
    apiRelated:
      controller: "InstrumentationController"
      methodSignature: "retransformGroups()"

  - question: "When would you choose redefineClasses instead of retransformClasses, and vice versa? Explain how structural limits, active stack frames, and existing object/static state shape expectations for hot modification."
    answer: "redefineClasses fits a tool that already has explicit replacement class-file bytes and wants the JVM to install those definitions. retransformClasses fits a tool that wants to run the transformation pipeline again on an existing class, for example to enable, disable, or recompute instrumentation according to transformer logic. Both require the relevant capability and a modifiable target, and neither permits arbitrary schema changes such as freely adding or removing fields or methods, changing signatures/modifiers/hierarchy, or violating JVM-protected structural attributes. After the new definition is installed, new invocations may use the new method body while an already-active frame may keep running the previous bytecode. Existing instances and static state are not automatically reset. Hot modification therefore changes code definition under strict rules; it is not an instantaneous migration of all runtime state and in-flight execution."
    aiGenerated: true
    reviewed: false
