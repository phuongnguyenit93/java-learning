  - question: "If you were designing a simple APM agent end to end, how would you connect packaging, agent lifecycle, target selection, transformation, helper/telemetry, and cleanup? Which concerns belong to Runtime Diagnostics or JVMTI instead of Instrumentation?"
    answer: "I would start with a minimal agent JAR, correct manifest capabilities, and a launch choice such as startup -javaagent or dynamic attach based on deployment policy. The entry point receives Instrumentation, checks capabilities, and installs a transformer with narrow class/loader/module targeting. A suitable bytecode tool injects small, idempotent probes. Those probes call helper code that the target can resolve, and the helper collects bounded timing, counter, or span data into a telemetry pipeline. The agent should expose health/version/transform failures, support disable/remove, and have an explicit restoration strategy if it changes loaded classes. Instrumentation owns the mechanism for injecting probes and transforming classes. Interpreting JFR, thread-dump, heap, or other runtime evidence to identify root cause belongs to Runtime Diagnostics. Requirements for lower-level VM events, native hooks, or control beyond the Java Instrumentation API are the handoff point to JVMTI or a native agent rather than a reason to expand this module indefinitely."
    aiGenerated: true
    reviewed: false
