  - question: "A transformer injects a call to AgentHelper into a plugin class defined by a child ClassLoader in a named module. Why can valid bytecode still fail at runtime, how would you design helper visibility, and do ASM or Byte Buddy remove this problem?"
    answer: "The generated class file can be structurally valid yet fail linkage if the target class's defining loader or module cannot see or legally access AgentHelper. Type identity also includes the defining ClassLoader, so two helpers with the same binary name in different loaders are not the same type. The agent must place helper code deliberately with respect to the loader graph: perhaps in the system/application loader when targets can see it, in a minimal JAR appended to bootstrap or system search when justified, or with explicit module readability/exports/opens changes when appropriate. Dumping the entire agent JAR onto bootstrap search is a poor default because it increases collision and linkage risk. ASM and Byte Buddy differ in abstraction level for generating transformations, but neither bypasses ClassLoader or module visibility rules; the emitted references must still be resolvable from the transformed class."
    aiGenerated: true
    reviewed: false
