  - question: "Một transformer chèn lời gọi tới AgentHelper vào class của plugin được định nghĩa bởi child ClassLoader trong named module. Vì sao bytecode hợp lệ vẫn có thể fail lúc runtime, và bạn thiết kế helper visibility thế nào? ASM hay Byte Buddy có thay đổi vấn đề này không?"
    answer: "Bytecode có thể pass class-file generation nhưng vẫn fail linkage nếu defining loader/module của class mục tiêu không nhìn thấy hoặc không được phép access AgentHelper. Type identity còn phụ thuộc cả binary name và defining ClassLoader, nên cùng tên helper ở loader khác cũng không phải cùng type. Agent cần thiết kế vị trí helper theo class-loader graph: có thể dùng helper ở system/application loader khi target nhìn thấy, append một JAR tối thiểu vào bootstrap/system search khi thực sự cần, hoặc điều chỉnh module readability/exports/opens bằng cơ chế phù hợp. Không nên nhét toàn bộ agent JAR vào bootstrap chỉ để 'cho thấy được'. ASM và Byte Buddy chỉ khác mức abstraction khi sinh/biến đổi bytecode; chúng không xóa ClassLoader/module visibility rules. Tooling tốt vẫn phải tạo reference mà target class có thể resolve hợp lệ."
    aiGenerated: true
    reviewed: false
