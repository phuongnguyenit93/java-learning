questions:
  - question: "Hãy giải thích mental model của Java Instrumentation và phân biệt nó với Reflection hoặc proxy. Khi nào việc biến đổi bytecode là lựa chọn hợp lý, và khi nào là overkill?"
    answer: "Instrumentation can thiệp vào class-file bytes trong lifecycle load/redefine/retransform, nên nó có thể chèn hoặc thay đổi logic ngay trong class definition mà không yêu cầu lời gọi phải đi qua một wrapper cụ thể. Reflection chủ yếu giải quyết runtime metadata/member access và invocation khi code chủ động dùng Reflection; proxy/interceptor chỉ thấy lời gọi đi qua proxy boundary. Instrumentation phù hợp khi cần cross-cutting behavior ở quy mô class rộng, không sở hữu source, hoặc cần probe hoạt động kể cả với object được tạo/gọi trực tiếp. Đổi lại nó có blast radius lớn hơn, chịu verification/linkage/ClassLoader constraints và tăng operational risk, nên nếu direct call, wrapper, proxy hoặc framework hook đã diễn đạt requirement rõ ràng thì nên chọn cơ chế đơn giản hơn."
    aiGenerated: true
