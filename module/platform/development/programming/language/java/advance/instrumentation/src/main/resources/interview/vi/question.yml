  - question: "So sánh ba đường khởi động agent: -javaagent/Premain-Class, Launcher-Agent-Class trong executable JAR, và Agent-Class cho dynamic loading. Failure semantics và quyết định startup agent hay dynamic attach ảnh hưởng deployment thế nào?"
    answer: "Với -javaagent, manifest chỉ Premain-Class và JVM gọi premain trước application main; lỗi khởi tạo không được xử lý có thể làm JVM abort trước khi ứng dụng chạy. Với executable JAR có Launcher-Agent-Class, JVM gọi agentmain trước application main và startup failure cũng có thể làm launch thất bại. Với agent JAR được nạp vào JVM đang chạy, Agent-Class chỉ agentmain; nếu agent không khởi tạo được thì JVM đang chạy không bị abort, dù lỗi có thể được log. Về deployment, startup agent cho deployer opt-in rõ ràng, thấy class sớm và dễ audit hơn nhưng cần restart/cấu hình launch. Dynamic attach hữu ích cho on-demand tooling hoặc khi không thể restart ngay, nhưng phụ thuộc Attach implementation/policy và trên JDK 21 phát warning mặc định. Vì vậy lựa chọn là trade-off về thời điểm can thiệp, quyền vận hành, policy và khả năng bỏ lỡ class đã load, không chỉ là khác tên entry method."
    aiGenerated: true
    reviewed: false
