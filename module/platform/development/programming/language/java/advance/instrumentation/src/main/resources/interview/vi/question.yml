      methodSignature: ""

  - question: "Một JVM báo isRetransformClassesSupported() = true nhưng isModifiableClass(Target.class) = false. Hãy giải thích vì sao hai kết quả không mâu thuẫn, và endpoint agentStatus giúp learner kiểm chứng mô hình capability như thế nào."
    answer: "isRetransformClassesSupported là capability của cấu hình JVM/agent cho cơ chế retransformation nói chung; isModifiableClass trả lời một câu hỏi khác là class cụ thể có thể được redefine/retransform hay không. Một cơ chế có thể được hỗ trợ toàn cục trong khi target cụ thể vẫn không modifiable, nên code đúng phải kiểm cả capability lẫn target. agentStatus lấy Instrumentation thật từ agent rồi trả retransform/redefine support, loaded-class count và isModifiableClass cho probe target. Vì vậy response không chỉ lặp lại manifest: nó tách điều kiện cấp JVM/agent khỏi per-class condition. Nếu target false, retransformClasses trên target đó vẫn không hợp lệ dù retransformSupported là true."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.InstrumentationApi/InstrumentationApi.md"
      anchor: "capability-model"
    apiRelated:
      controller: "InstrumentationController"
      methodSignature: "agentStatus()"

  - question: "Giải thích transformer ordering và retransformation semantics. Vì sao transformer canRetransform=false không được gọi lại, previous output của nó được xử lý thế nào, và experiment retransform-groups thực sự chứng minh được phần nào của contract?"
    answer: "Transformer được chia theo nhóm: Java retransformation-incapable, native incapable, Java capable, rồi native capable; registration order chỉ áp dụng bên trong mỗi nhóm. Ở load/redefine, các transformer phù hợp được gọi theo pipeline và output trước trở thành input sau. Khi retransform, transformer đã đăng ký với canRetransform=false không được gọi lại; JVM tự động tái sử dụng kết quả transformation mà nhóm đó đã tạo ở lần load/redefine trước, còn transformer canRetransform=true được callback lại trên retransformation input. Experiment retransform-groups load target trước rồi mới đăng ký hai transformer quan sát và gọi retransformClasses: callback count 0 cho false và >=1 cho true trực tiếp chứng minh khác biệt invocation group. Nó không tự chứng minh việc reuse một previous transformed output, vì transformer false của experiment chưa tồn tại ở lần load ban đầu và cũng không tạo bytes biến đổi; phần reuse đến từ API contract/Knowledge, không nên suy diễn chỉ từ response."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.TransformationPipeline/TransformationPipeline.md"
      anchor: "retransform-capability-groups"
    apiRelated:
      controller: "InstrumentationController"
      methodSignature: "retransformGroups()"

  - question: "Khi nào bạn chọn redefineClasses thay vì retransformClasses, và ngược lại? Hãy giải thích structural limits, active stack frames và existing object/static state ảnh hưởng kỳ vọng hot modification ra sao."
    answer: "redefineClasses phù hợp khi tool đã có replacement class-file bytes cụ thể và muốn yêu cầu JVM cài definition đó. retransformClasses phù hợp khi muốn chạy lại transformation pipeline trên class hiện có, đặc biệt để bật/tắt hoặc tính lại instrumentation theo transformer logic. Cả hai đều cần capability tương ứng và class modifiable, đồng thời không cho phép tùy ý thay đổi schema như thêm/xóa field hoặc method, đổi signature/modifier/hierarchy hay các structural attributes bị JVM hạn chế. Sau khi definition mới được cài, invocation mới có thể dùng method body mới nhưng active frame có thể tiếp tục chạy version cũ; object đã tồn tại và static state không tự reset. Vì vậy hot modification không nên được mô tả như thay toàn bộ runtime state tức thời; tool phải tách code-definition transition khỏi state migration và in-flight execution."
    aiGenerated: true
