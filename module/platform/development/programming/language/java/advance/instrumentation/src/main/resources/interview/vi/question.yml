      methodSignature: ""

  - question: "Bạn sẽ thiết kế shutdown/rollback an toàn cho một production agent như thế nào khi removeTransformer không tự hoàn tác class và callback vẫn có thể race sau removal? JDK 21 dynamic-attach policy ảnh hưởng runbook ra sao?"
    answer: "Tôi tách unregister khỏi rollback. removeTransformer ngăn các future transformation theo registration nhưng class đã biến đổi giữ definition hiện tại; rollback cần retransform/redefine riêng nếu capability và transformer design cho phép tái tạo trạng thái mong muốn. Vì class loading đa luồng, callback có thể vẫn đến sau remove, nên transformer nên có enabled state an toàn, resource lifetime đủ dài cho in-flight callback, cleanup idempotent và tránh giải phóng dependency mà callback trễ còn dùng. Production runbook cũng phải quy định ai được attach, artifact trust/version, scope target, observability và recovery nếu transform fail. Trên JDK 21 dynamic agent loading vẫn được phép mặc định nhưng phát warning; HotSpot có explicit opt-in flag. Điều đó khuyến khích deployer-owned startup/configuration hơn là automation mặc định giả định attach động sẽ luôn im lặng hoặc luôn được phép ở các JDK tương lai."
    aiGenerated: true
    reviewed: false
