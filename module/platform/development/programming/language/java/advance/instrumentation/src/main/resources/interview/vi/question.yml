      methodSignature: ""

  - question: "Nếu thiết kế một APM agent đơn giản end-to-end, bạn sẽ nối packaging, agent lifecycle, target selection, transformation, helper/telemetry và cleanup theo flow nào? Ranh giới nào thuộc Runtime Diagnostics hoặc JVMTI thay vì Instrumentation?"
    answer: "Tôi bắt đầu bằng agent JAR tối thiểu với manifest capability đúng và chọn startup -javaagent hay dynamic attach theo deployment policy. Entry point nhận Instrumentation, kiểm tra capability, đăng ký transformer có target filter chặt theo class/loader/module và chọn bytecode tool phù hợp để chèn probe nhỏ, idempotent. Probe gọi helper mà target có thể resolve; helper thu thập timing/counter/span data với overhead bounded và đưa sang telemetry pipeline. Agent phải expose health/version/transform failures, hỗ trợ disable/remove và có rollback strategy nếu đã sửa class. Instrumentation sở hữu cơ chế chèn probe và class transformation; việc đọc JFR/thread dump/heap evidence để tìm root cause thuộc Runtime Diagnostics. Nếu yêu cầu cần VM events/native hooks hoặc quyền điều khiển thấp hơn Java Instrumentation API, đó là điểm handoff sang JVMTI/native agent thay vì cố kéo scope module này xuống tầng native."
    aiGenerated: true
    reviewed: false
