# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: runtime-extensibility-decoupling
    question: >-
      A host must allow a new `PdfExporter` or `CsvExporter` JAR to be added without changing host code. Which design best matches Runtime Extensibility?
    answers:
      - id: A
        answer: "The host uses a `switch` on format and directly constructs each concrete implementation."
        explanation: "Incorrect. The provider set remains encoded in host code, so adding a provider still requires changing and rebuilding the host."
      - id: B
        answer: "Each provider calls host-internal APIs to register itself when its class is loaded."
        explanation: "Incorrect. This strongly couples providers to host internals and does not establish a stable service contract."
      - id: C
        answer: "The host depends on a stable service contract, while providers are packaged independently and discovered at runtime."
        explanation: "Correct. The host knows the contract rather than hard-coding every provider implementation."
      - id: D
        answer: "The host reflectively scans every class in the JAR and selects classes whose names contain `Exporter`."
        explanation: "Incorrect. Naming-based reflection scanning is not a substitute for an explicit service-provider contract and discovery model."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.MentalModel/RuntimeExtensibility.md"
      anchor: "runtime-extensibility-purpose"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: serviceloader-lazy-cache
    question: >-
      After calling `ServiceLoader.load(ReportExporter.class)` but before iterating or consuming its stream, which statement is most accurate?
    answers:
      - id: A
        answer: "`load(...)` instantiates the first provider immediately to validate configuration, while later providers wait for traversal."
        explanation: "Incorrect. Constructing the ServiceLoader does not require instantiating the first provider; locating and instantiation occur lazily as traversal needs providers."
      - id: B
        answer: "Calling `load(...)` does not mean every provider is already instantiated; providers are processed lazily during traversal."
        explanation: "Correct. `ServiceLoader` locates and instantiates providers as its iterator or stream is consumed."
      - id: C
        answer: "`iterator()` builds a snapshot and instantiates all providers into the cache before its first `next()` returns."
        explanation: "Incorrect. The iterator continues locating and instantiating providers lazily, adding loaded providers to the cache during traversal."
      - id: D
        answer: "`load(...)` discovers every provider type up front, while construction is deferred until the caller invokes `Provider.get()`."
        explanation: "Incorrect. Iterator traversal itself can locate and instantiate providers; `Provider.get()` belongs to the stream/provider-object path rather than being universally required."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.ServiceLoaderIntegration/ServiceLoaderIntegration.md"
      anchor: "lazy-discovery-and-cache"
    apiRelated:
      controller: "RuntimeExtensibilityController"
      methodSignature: "serviceLoader()"

  - id: spi-contract-stability-boundary
    question: >-
      A host publishes a `ReportExporter` SPI for providers released independently by other teams. Which design best preserves independent host/provider evolution?
    answers:
      - id: A
        answer: "Put host-internal entities in the SPI so providers always receive the host's latest internal state."
        explanation: "Incorrect. Host-internal types couple providers to implementation details and make ordinary host refactors break the extension contract."
      - id: B
        answer: "Keep the SPI minimal and let the host cast providers to concrete classes whenever a capability is missing from the contract."
        explanation: "Incorrect. Concrete casts create a side channel that breaks the host-provider abstraction boundary."
      - id: C
        answer: "Expose a mutable host service locator so providers can fetch any internal dependency they need."
        explanation: "Incorrect. This creates uncontrolled coupling and makes dependency and lifecycle semantics difficult to stabilize."
      - id: D
        answer: "Keep the shared contract small and stable, define error/lifecycle ownership, and evolve capabilities through an explicit compatibility policy."
        explanation: "Correct. The SPI is a public compatibility surface; stable types, semantics, and ownership let hosts and providers evolve more independently."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.SPIContract/SPIContract.md"
      anchor: "contract-stability"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: serviceloader-reload-semantics
    question: >-
      A host calls `serviceLoader.reload()` after using a provider that owns threads and sockets. What does `reload()` directly guarantee?
    answers:
      - id: A
        answer: "The provider cache of that `ServiceLoader` instance is cleared so later traversal performs discovery again."
        explanation: "Correct. `reload()` invalidates that loader's discovery cache."
      - id: B
        answer: "The old provider receives `close()` and all of its resources are released."
        explanation: "Incorrect. `ServiceLoader` does not manage application lifecycle or provider resource cleanup."
      - id: C
        answer: "The ClassLoader containing the provider is unloaded immediately when no replacement provider exists."
        explanation: "Incorrect. `reload()` is not a class-unloading primitive."
      - id: D
        answer: "Existing iterators safely continue using the pre-reload cache until they finish."
        explanation: "Incorrect. Existing iterators and streams should not be reused after the provider cache is reloaded."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.ServiceLoaderIntegration/ServiceLoaderIntegration.md"
      anchor: "reload-and-concurrency"
    apiRelated:
      controller: "RuntimeExtensibilityController"
      methodSignature: "serviceLoader()"

  - id: provider-order-is-not-business-priority
    question: >-
      Two providers both support `pdf`. Why is raw `ServiceLoader.findFirst()` usually a weak business-priority policy?
    answers:
      - id: A
        answer: "Because `findFirst()` sorts providers by class name, making the result deterministic but unrelated to request capability."
        explanation: "Incorrect. ServiceLoader does not define `findFirst()` in terms of lexical provider-class ordering."
      - id: B
        answer: "Because `findFirst()` prefers providers that instantiate faster, so constructor cost can change which provider comes first."
        explanation: "Incorrect. Provider ordering is not determined by instantiation time or constructor cost."
      - id: C
        answer: "Because discovery order is not a general business-priority contract; the host needs a request-specific selection policy."
        explanation: "Correct. Business priority should come from application policy rather than incidental deployment order."
      - id: D
        answer: "Because `findFirst()` treats `META-INF/services` as a global total order even when providers also come from named modules."
        explanation: "Incorrect. Providers may come from multiple deployment sources; service files do not define one global business order."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.ProviderDiscoveryStrategy/ProviderDiscoveryStrategy.md"
      anchor: "provider-ordering-caveats"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: named-module-consumer-uses
    question: >-
      `ReportExporter` is in module `export.api`; the host is another named module that directly uses this type and discovers providers with `ServiceLoader`. What should its descriptor express?
    answers:
      - id: A
        answer: "Declare `requires export.api`; calling `ServiceLoader.load(...)` infers the service dependence so `uses` is unnecessary."
        explanation: "Incorrect. A named-module consumer must declare `uses` for a service it discovers through ServiceLoader."
      - id: B
        answer: "`requires export.api` to read the service type and `uses ReportExporter` to declare the service consumer."
        explanation: "Correct. The directives serve different purposes and are both relevant when the service type is in another module."
      - id: C
        answer: "Declare only `uses ReportExporter`; service binding automatically makes `export.api` readable to the host's source code."
        explanation: "Incorrect. `uses` does not replace the readability/accessibility needed for the host to directly reference the service type."
      - id: D
        answer: "Declare `requires export.api`, `uses ReportExporter`, and `requires` each provider module so discovery can see providers."
        explanation: "Incorrect. A consumer should not directly require every provider module merely to make ServiceLoader discover them."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.ClasspathModulePathIntegration/ClasspathModulePathIntegration.md"
      anchor: "module-consumer-requires-uses"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: host-plugin-responsibility-boundary
    question: >-
      Business code currently calls `ServiceLoader` directly, casts providers to concrete classes, and starts or stops plugin resources in several places. Which refactor creates the clearest plugin boundary?
    answers:
      - id: A
        answer: "Keep discovery in each business flow but standardize concrete provider names so casts remain consistent."
        explanation: "Incorrect. Naming conventions do not remove implementation coupling or establish lifecycle ownership."
      - id: B
        answer: "Centralize discovery, validation, selection, and lifecycle in a PluginManager behind stable contracts; business code consumes a host-managed registry or service view."
        explanation: "Correct. The host owns orchestration and policy while plugins keep implementation details, private dependencies, and owned resources behind the contract."
      - id: C
        answer: "Let each plugin mutate a global host registry during class loading so a PluginManager is unnecessary."
        explanation: "Incorrect. Self-registration into global mutable state makes ownership and failure boundaries difficult to control."
      - id: D
        answer: "Let business code retain provider instances indefinitely and clean them up only at JVM shutdown, even when plugin replacement is supported."
        explanation: "Incorrect. Lifecycle and resource ownership must follow the plugin architecture and replacement semantics rather than ad-hoc long-lived references."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.PluginArchitecture/PluginArchitecture.md"
      anchor: "host-plugin-boundary"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: plugin-reload-vs-serviceloader-reload
    question: >-
      A new plugin generation is ready to replace the old one. Which flow is safer than relying on `ServiceLoader.reload()` alone?
    answers:
      - id: A
        answer: "Initialize and validate the new plugin, switch the registry, drain old work, then stop and clean up the old plugin."
        explanation: "Correct. Replacement is a lifecycle transition; discovery-cache reload is only a small part when relevant."
      - id: B
        answer: "Call `reload()`, delete the old JAR immediately, and assume in-flight requests switch providers automatically."
        explanation: "Incorrect. `reload()` does not drain work, stop old instances, or guarantee that the old JAR/ClassLoader is released."
      - id: C
        answer: "Stop the old plugin first, then check whether the replacement is compatible and can start."
        explanation: "Incorrect. This creates avoidable downtime when the replacement fails before becoming ready."
      - id: D
        answer: "Keep both generations active indefinitely so lifecycle cleanup and compatibility checks are unnecessary."
        explanation: "Incorrect. That leaves resource ownership and provider-selection ambiguity unresolved."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.PluginLifecycle/PluginLifecycle.md"
      anchor: "replacement-and-upgrade"
    apiRelated:
      controller: "RuntimeExtensibilityController"
      methodSignature: "pluginReplacement()"

  - id: class-identity-across-plugin-loaders
    question: >-
      A host and plugin both contain a class named `com.example.api.ReportExporter`, but the copies are defined by different ClassLoaders without a shared contract identity. What is the main risk?
    answers:
      - id: A
        answer: "If the binary name and bytecode match, the JVM can treat the classes as one type even when different loaders define them."
        explanation: "Incorrect. Matching binary names are not sufficient; the defining ClassLoader is part of runtime type identity."
      - id: B
        answer: "A plugin object may fail to cast to the host's service type even though the class names are identical."
        explanation: "Correct. Contract types crossing loader boundaries generally need a compatible shared identity."
      - id: C
        answer: "Different defining loaders mainly affect resource lookup; assignability is still determined by the class binary name."
        explanation: "Incorrect. The defining loader directly affects class identity and therefore assignability and casts."
      - id: D
        answer: "Type identity separates only for child-first custom loaders; parent-first delegation keeps same-named class copies equivalent."
        explanation: "Incorrect. What matters is which loader actually defines the class; delegation policy only influences which loader wins definition."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.PluginIsolationDesign/PluginIsolationDesign.md"
      anchor: "class-identity-boundaries"
    apiRelated:
      controller: "RuntimeExtensibilityController"
      methodSignature: "classLoaderIdentity()"

  - id: dependency-conflict-boundary
    question: >-
      Plugin B needs library X 2.x while the host uses X 1.x. Which reasoning is most appropriate for a plugin architecture?
    answers:
      - id: A
        answer: "Put both versions in one loader namespace because the JVM automatically selects a version per caller."
        explanation: "Incorrect. One loader namespace does not provide automatic per-caller dependency-version selection."
      - id: B
        answer: "Make the plugin import host implementation packages so it is forced to use the host's X version."
        explanation: "Incorrect. This increases coupling and may not satisfy the plugin's dependency requirements."
      - id: C
        answer: "Consider version alignment, shading/relocation, or loader isolation; keep shared contract types outside plugin-private dependency namespaces."
        explanation: "Correct. These strategies address the dependency and isolation boundary explicitly."
      - id: D
        answer: "Rename plugin B because dependency conflicts are determined by plugin identifiers rather than class loading."
        explanation: "Incorrect. The conflict is about dependency/type namespaces, not the logical plugin name."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.VersionCompatibility/VersionCompatibility.md"
      anchor: "dependency-version-conflicts"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: resolveandbind-service-binding
    question: >-
      When building a `Configuration` for modular plugins, what is the main service-provider benefit of `resolveAndBind(...)` over only `resolve(...)`?
    answers:
      - id: A
        answer: "It keeps the same graph as `resolve()` but marks provider metadata so ServiceLoader can instantiate providers after layer creation."
        explanation: "Incorrect. Service binding can augment the graph with provider modules; it does more than attach metadata to the old graph."
      - id: B
        answer: "It adds every observable module with a `provides` directive, even when the graph has no corresponding service-use dependence."
        explanation: "Incorrect. Provider modules are induced by service-use dependences; not every observable provider module is added."
      - id: C
        answer: "It binds only provider modules already present in the root set; other providers still need direct `requires` from the host."
        explanation: "Incorrect. Service binding can bring matching provider modules into the graph without direct host requirements."
      - id: D
        answer: "It augments the resolved graph with provider modules induced by service-use dependences, resolving again until no new providers are added."
        explanation: "Correct. This allows provider modules to participate without the host directly requiring each one."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "10.ModuleLayerIntegration/ModuleLayerIntegration.md"
      anchor: "resolve-vs-resolveandbind"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: serviceloader-layer-scope
    question: >-
      A host calls `ServiceLoader.load(pluginLayer, ReportExporter.class)`. Which discovery scope best describes this overload?
    answers:
      - id: A
        answer: "Providers in the supplied layer and its ancestor layers; class-path providers in unnamed modules are outside this overload's scope."
        explanation: "Correct. Layer-based discovery uses an explicit layer graph and its ancestors."
      - id: B
        answer: "Providers visible to the system ClassLoader plus providers in the supplied layer; ancestor layers are not traversed."
        explanation: "Incorrect. The layer overload searches the supplied layer and its ancestors; it does not add a separate system-loader scope."
      - id: C
        answer: "Only providers in exactly the supplied layer; parent layers are excluded to preserve isolation between plugin generations."
        explanation: "Incorrect. The API contract explicitly includes providers in ancestor layers."
      - id: D
        answer: "Providers in the supplied layer plus providers found by the thread context ClassLoader, regardless of layer ancestry."
        explanation: "Incorrect. This overload uses module-layer scope; it does not add TCCL discovery like `load(service)` does."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "10.ModuleLayerIntegration/ModuleLayerIntegration.md"
      anchor: "serviceloader-layer-discovery"
