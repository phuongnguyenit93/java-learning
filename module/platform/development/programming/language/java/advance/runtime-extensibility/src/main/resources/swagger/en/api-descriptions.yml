  serviceLoader():
    summary: Observe ServiceLoader lazy loading, caching, and reload
    description: Each request creates a fresh ServiceLoader for ReportExporter. The
      response records provider-constructor counts before traversal, after the first
      provider is obtained, after cached traversal, and after reload so the learner
      can see that discovery/instantiation is lazy and reload only invalidates discovery
      cache state.
