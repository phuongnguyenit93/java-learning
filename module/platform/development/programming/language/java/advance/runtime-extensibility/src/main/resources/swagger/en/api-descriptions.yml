  pluginReplacement():
    summary: Observe prepare → switch → retire during plugin replacement
    description: The request keeps one v1 task in flight, validates replacement compatibility
      and health-checks v2 before the switch, atomically moves the active reference
      to v2, then marks v1 as draining, waits for the old work to finish, and shuts
      down the v1 worker. v2 is also shut down at request cleanup so the experiment
      does not leak a thread. The response exposes states, in-flight counts, work-acceptance
      state, worker termination, and event histories to distinguish lifecycle replacement
      from ServiceLoader.reload().
