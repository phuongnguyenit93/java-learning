  providerSelection():
    summary: Separate provider discovery from provider selection
    description: ServiceLoader discovers both PDF and CSV providers, then the host
      applies its own `format == csv` rule. The response exposes all candidates, the
      selection rule, the selected provider, and the export result to show that discovery
      supplies candidates while selection remains application policy.
