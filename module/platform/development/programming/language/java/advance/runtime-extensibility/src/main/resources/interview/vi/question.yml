  - question: >-
      Bạn sẽ chọn giữa static wiring, `ServiceLoader`, custom ClassLoader/ModuleLayer và process isolation theo tiêu chí nào?
    answer: >-
      Bắt đầu từ cơ chế đơn giản nhất đáp ứng requirement. Static wiring/DI phù hợp khi implementation biết trước. `ServiceLoader` phù hợp khi cần provider discovery nhưng không cần module graph động phức tạp. Dedicated ClassLoader hoặc ModuleLayer đáng dùng khi có dependency/type isolation, modular graph hoặc replacement-context requirement rõ. Nếu failure/security/resource containment phải mạnh hơn JVM boundary có thể cung cấp, process isolation có thể phù hợp hơn. Không nên trả complexity chỉ vì cơ chế “advanced”; mỗi lớp phải giải quyết một vấn đề cụ thể về deployment, discovery, lifecycle, compatibility hoặc isolation.
    aiGenerated: true
    reviewed: false
