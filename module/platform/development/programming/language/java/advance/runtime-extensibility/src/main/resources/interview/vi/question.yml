questions:
  - question: >-
      Runtime Extensibility khác gì với việc chỉ dùng interface + dependency injection, và khi nào bạn thực sự cần provider discovery ở runtime?
    answer: >-
      Interface + DI đã tách host khỏi implementation cụ thể, nhưng tập implementation thường vẫn được biết khi build/startup configuration được tạo. Runtime Extensibility đi thêm một bước: provider có thể được đóng gói và triển khai độc lập, còn host discovery provider từ runtime environment qua một service contract ổn định. Chỉ nên dùng discovery động khi có requirement như plugin JAR/module độc lập, provider set không biết trước, cần capability selection hoặc lifecycle/isolation riêng. Nếu implementation set cố định, static wiring/DI thường đơn giản và dễ vận hành hơn.
    aiGenerated: true
