  - question: >-
      Giải thích mental model của `ServiceLoader`: lazy discovery, cache, thread context ClassLoader và `reload()` liên hệ với nhau ra sao?
    answer: >-
      `ServiceLoader.load(service)` dùng thread context ClassLoader làm discovery context mặc định. Provider được locate và instantiate lazily khi iterator/stream được consume; các provider đã load được cache trong chính `ServiceLoader` instance. `reload()` chỉ clear cache đó để traversal sau discovery lại, không stop provider cũ, không đóng resource và không unload class/module. Một `ServiceLoader` instance cũng không thread-safe. Vì vậy trong container/plugin environment, discovery context và ownership của loader nên explicit; không nên cache một context-loader-based loader toàn JVM nếu có nhiều application/plugin contexts.
    aiGenerated: true
    reviewed: false
