  - question: >-
      Bạn thiết kế một SPI để host và provider có thể phát triển độc lập như thế nào, và đâu là các dấu hiệu cho thấy SPI đang coupling quá mạnh?
    answer: >-
      SPI nên mô tả capability mà host cần bằng contract nhỏ, ổn định và ít dependency. Type đi qua boundary nên thuộc contract module, error/lifecycle/thread-safety/resource ownership cần được định nghĩa rõ, còn implementation-specific type không nên rò ra ngoài. Dấu hiệu coupling mạnh gồm host cast provider về concrete class, SPI nhận internal entity của host, provider phải import implementation package của host, hoặc mỗi thay đổi nội bộ lại buộc provider compile lại. Khi capability mới là phần thật sự của contract, hãy model nó rõ thay vì dùng cast/reflection như side channel.
    aiGenerated: true
    reviewed: false
    readmeRelated:
