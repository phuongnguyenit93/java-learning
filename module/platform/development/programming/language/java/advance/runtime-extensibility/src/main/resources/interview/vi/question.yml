  - question: >-
      `ServiceLoader.reload()` có phải là plugin hot reload không? Hãy mô tả một flow replacement an toàn hơn cho plugin có state và resource.
    answer: >-
      Không. `reload()` chỉ xóa provider cache của một `ServiceLoader`. Plugin replacement thực sự phải quản lý lifecycle: discovery/validate candidate mới, initialize và health-check, sau đó atomically switch registry/reference, drain request đang dùng generation cũ, rồi stop/close và release resource/reference của plugin cũ. Nếu candidate mới fail trước switch thì old generation vẫn phục vụ. Nếu plugin set dùng class loader hoặc ModuleLayer riêng, replacement thường cần context/layer mới; class chỉ có thể được GC khi loader và mọi object/thread/reference liên quan không còn reachable.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.PluginLifecycle/PluginLifecycle.md"
      anchor: "replacement-and-upgrade"
    apiRelated:
