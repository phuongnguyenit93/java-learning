  - question: >-
      Vì sao class-loader isolation có thể vừa giải quyết dependency conflict vừa gây `ClassCastException`? Bạn sẽ đặt shared contract ở đâu?
    answer: >-
      ClassLoader tạo namespace/type identity boundary: cùng binary name nhưng khác defining loader có thể là hai runtime types khác nhau. Loader riêng cho mỗi plugin cho phép private dependency versions khác nhau, nhưng nếu mỗi plugin cũng load một copy riêng của contract thì object provider có thể không assignable sang service type mà host biết. Vì vậy service contract và những type thật sự phải đi qua boundary thường được load bởi shared/parent loader; implementation dependencies giữ private. Child-first policy cần exclude contract/API packages để tránh duplicate identity.
    aiGenerated: true
    reviewed: false
