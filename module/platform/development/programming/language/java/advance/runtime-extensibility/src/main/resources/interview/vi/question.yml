  - question: >-
      Một provider JAR chạy tốt trên class path nhờ `META-INF/services`, nhưng sau khi migrate host và provider sang explicit named modules trên module path thì host không còn discover được provider. Bạn sẽ chẩn đoán và migrate thế nào để vẫn giữ host-provider decoupling?
    answer: >-
      Trước hết kiểm tra service type nằm trong module contract được export và host có readability tới module đó. Host named module phải khai báo `uses` cho service; provider explicit module phải khai báo `provides S with P`. `META-INF/services` là registration model của class path và không thay thế module descriptor khi provider đã trở thành explicit named module. Sau đó kiểm tra provider construction: explicit module có thể dùng provider constructor hoặc public static no-arg `provider()` hợp lệ; nếu artifact vẫn chỉ là automatic module thì dùng constructor form. Không sửa bằng cách `requires` trực tiếp từng provider module trong host vì như vậy lại biến extension set thành compile-time dependency list. Cuối cùng chạy integration test với artifact/module path thật để xác nhận resolution + discovery thay vì chỉ `new Provider()` trong unit test.
    aiGenerated: true
    reviewed: false
