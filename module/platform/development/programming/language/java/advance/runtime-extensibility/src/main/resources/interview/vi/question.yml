  - question: >-
      Host-plugin compatibility nên được đánh giá bằng version number hay capability? Bạn sẽ thiết kế compatibility check ra sao để hỗ trợ provider cũ?
    answer: >-
      Version number hữu ích nhưng thường không đủ. Compatibility thực tế gồm binary/source/semantic contract, lifecycle assumptions, configuration và capability set. Một host có thể dùng major/minor policy kết hợp required capabilities: reject major không tương thích, còn provider cũ cùng major vẫn phục vụ request cơ bản nếu có capability cần thiết. SPI evolution nên giữ contract nhỏ, dùng default method chỉ khi default semantic thật sự hợp lý, hoặc tách capability interface riêng. Compatibility cần được validate trước activation và test dưới dạng host × plugin matrix với artifact thật.
