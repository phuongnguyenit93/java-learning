  - question: >-
      Khi nào `ModuleLayer` đáng dùng cho plugin system, và `resolveAndBind()` giúp gì so với chỉ `resolve()`?
    answer: >-
      `ModuleLayer` đáng dùng khi plugin là explicit named modules và host cần resolve/define một module graph mới trong JVM, có discovery context và loader mapping riêng. Nếu provider set cố định lúc process start thì startup module path thường đơn giản hơn. `resolve()` tạo dependency/readability graph từ roots; `resolveAndBind()` còn thực hiện service binding để modules cung cấp services được các modules trong graph `uses` có thể được kéo vào resolved configuration. Sau đó configuration được define thành layer và provider được tìm bằng `ServiceLoader.load(layer, service)`. Layer không phải mutable plugin registry; plugin set mới thường dẫn tới configuration/layer mới.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "10.ModuleLayerIntegration/ModuleLayerIntegration.md"
      anchor: "resolve-vs-resolveandbind"
    apiRelated:
      controller: ""
