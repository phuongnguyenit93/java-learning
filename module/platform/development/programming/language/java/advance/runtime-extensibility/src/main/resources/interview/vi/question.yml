  - question: >-
      Tại sao provider discovery và provider selection phải tách riêng? Nếu có nhiều provider cùng service, bạn sẽ thiết kế selection policy thế nào?
    answer: >-
      Discovery chỉ trả lời provider nào tồn tại trong runtime context; selection trả lời provider nào phù hợp với request và business policy. Dùng raw discovery order hoặc `findFirst()` làm priority thường yếu vì thứ tự có thể phụ thuộc deployment/module/resource topology chứ không phải business contract. Host nên filter theo capability/compatibility trước, sau đó áp dụng explicit priority hoặc tie-breaker. Nếu ambiguity là lỗi, nên reject sớm khi build registry. Có thể discovery một lần ở startup, validate/normalize metadata rồi expose immutable registry cho request path thay vì raw discovery lặp lại.
    aiGenerated: true
    reviewed: false
    readmeRelated:
