  pluginReplacement():
    summary: Quan sát prepare → switch → retire trong plugin replacement
    description: Request giữ một work đang chạy trên v1, validate compatibility và
      health-check v2 trước khi switch, atomically đổi active reference sang v2, sau
      đó mark v1 draining, chờ work cũ hoàn tất và shutdown worker của v1. Cuối request,
      v2 cũng được shutdown để experiment không rò thread. Response trả state, in-flight
      count, trạng thái nhận work, worker termination và event history để phân biệt
      lifecycle replacement với ServiceLoader.reload().
