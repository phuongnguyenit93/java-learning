  - question: >-
      How would you design an SPI so a host and providers can evolve independently, and what signs indicate that the SPI is too tightly coupled?
    answer: >-
      The SPI should express the capability the host needs through a small, stable, dependency-light contract. Types crossing the boundary should belong to the contract module, while error semantics, lifecycle, thread-safety, and resource ownership should be explicit. Warning signs include the host casting providers to concrete classes, SPI methods exposing host-internal entities, providers importing host implementation packages, or ordinary host refactors forcing provider recompilation. If a capability truly belongs to the public contract, model it explicitly instead of relying on casts or reflection as a side channel.
    aiGenerated: true
    reviewed: false
