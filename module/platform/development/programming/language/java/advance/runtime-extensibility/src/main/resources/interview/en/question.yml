  - question: >-
      Explain the `ServiceLoader` mental model: how do lazy discovery, caching, the thread context ClassLoader, and `reload()` relate to one another?
    answer: >-
      `ServiceLoader.load(service)` uses the current thread context ClassLoader as its default discovery context. Providers are located and instantiated lazily as an iterator or stream is consumed, and loaded providers are cached by that particular `ServiceLoader` instance. `reload()` clears only that cache so later traversal performs discovery again; it does not stop old providers, close resources, or unload classes/modules. A `ServiceLoader` instance is also not thread-safe. In containers or plugin environments, make discovery context and loader ownership explicit rather than caching one context-loader-based loader across unrelated application contexts.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: ""
      anchor: ""
