  - question: >-
      Why should provider discovery and provider selection be separate? How would you design selection when several providers implement the same service?
    answer: >-
      Discovery answers which providers exist in the current runtime context; selection answers which provider satisfies the request and host policy. Using raw discovery order or `findFirst()` as priority is weak because the order may reflect module, resource, or deployment topology rather than a business contract. A host should first filter by capability and compatibility, then apply explicit priority or tie-breaking rules. If ambiguity is invalid, reject it while building the provider registry. Discovery can happen once at startup, followed by validation and metadata normalization, so request handling uses an immutable validated registry instead of repeating raw discovery.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.ProviderDiscoveryStrategy/ProviderDiscoveryStrategy.md"
      anchor: "provider-selection-policy"
    apiRelated:
      controller: "RuntimeExtensibilityController"
      methodSignature: "providerSelection()"

  - question: >-
      A provider JAR works on the class path through `META-INF/services`, but after migrating the host and provider to explicit named modules on the module path the host no longer discovers it. How would you diagnose and migrate the setup while preserving host-provider decoupling?
    answer: >-
      First verify that the service type lives in an exported contract module and that the host reads that module. The named host must declare `uses`, while the explicit provider module must declare `provides S with P`. A `META-INF/services` entry is the class-path registration model and does not replace the module descriptor once the provider is an explicit named module. Then verify provider construction: an explicit module may use a provider constructor or a valid public static no-argument `provider()` method; an automatic module uses the constructor form. Do not fix discovery by directly requiring every provider module from the host, because that turns the extension set back into a compile-time dependency list. Finally, run an integration test with the packaged artifacts on the real module path so resolution and discovery are exercised instead of merely constructing the provider in a unit test.
