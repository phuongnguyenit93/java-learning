  - question: >-
      Is `ServiceLoader.reload()` a plugin hot-reload mechanism? Describe a safer replacement flow for a stateful, resource-owning plugin.
    answer: >-
      No. `reload()` only clears the provider cache of one `ServiceLoader`. Real replacement requires lifecycle management: discover and validate the candidate, initialize and health-check it, atomically switch the registry or active reference, drain requests using the old generation, then stop or close the old plugin and release its resources and references. If the candidate fails before the switch, the old generation can keep serving. When plugins use dedicated class loaders or module layers, replacement often means creating a new context or layer; classes become collectible only when the old loader and all retaining objects, threads, and references are unreachable.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.PluginLifecycle/PluginLifecycle.md"
      anchor: "replacement-and-upgrade"
    apiRelated:
      controller: "RuntimeExtensibilityController"
      methodSignature: "pluginReplacement()"

  - question: >-
      Why can class-loader isolation solve dependency conflicts while also causing `ClassCastException`? Where should the shared service contract live?
    answer: >-
      A ClassLoader creates a type-identity namespace: the same binary name defined by different loaders can represent different runtime types. A dedicated loader per plugin allows different private dependency versions, but if each plugin also loads its own copy of the service contract, the provider object may not be assignable to the service type known by the host. Contract types and other types that truly cross the boundary are therefore commonly defined by a shared or parent loader, while implementation dependencies remain private. Child-first strategies need explicit exclusions for contract/API packages to avoid duplicate identity.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.PluginIsolationDesign/PluginIsolationDesign.md"
      anchor: "class-identity-boundaries"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Should host-plugin compatibility be decided only by version numbers or by capabilities too? How would you design checks that still support older providers?
    answer: >-
      A version number is useful but usually insufficient. Compatibility includes binary, source, and semantic contract behavior, lifecycle assumptions, configuration, and required capabilities. A host can combine a major/minor policy with capability checks: reject incompatible major versions while allowing an older provider on the same supported contract generation to handle basic requests when it still exposes the required capability. SPI evolution should keep contracts small, use default methods only when their default semantics are genuinely valid, or introduce separate capability interfaces. Validate compatibility before activation and test it as a host-by-plugin matrix using real packaged artifacts.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.VersionCompatibility/VersionCompatibility.md"
      anchor: "capability-versioning"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      When is `ModuleLayer` worth using in a plugin system, and what does `resolveAndBind()` add compared with only `resolve()`?
    answer: >-
      `ModuleLayer` is useful when plugins are explicit named modules and the host needs to resolve and define an additional module graph in the running JVM with an explicit discovery context and loader mapping. If the provider set is fixed at process startup, a normal startup module path is usually simpler. `resolve()` builds the ordinary dependency/readability graph from roots; `resolveAndBind()` also performs service binding so provider modules for services that modules in the graph `uses` can be brought into the resolved configuration. That configuration can then be defined as a layer and queried with `ServiceLoader.load(layer, service)`. A layer is not a mutable plugin registry, so a changed plugin set commonly means a new configuration and layer.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "10.ModuleLayerIntegration/ModuleLayerIntegration.md"
      anchor: "resolve-vs-resolveandbind"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      How would you choose among static wiring, `ServiceLoader`, custom ClassLoaders/ModuleLayers, and process isolation?
    answer: >-
      Start with the simplest mechanism that satisfies the requirement. Static wiring or DI fits when implementations are known in advance. `ServiceLoader` fits provider discovery without requiring a complex dynamic module graph. Dedicated ClassLoaders or ModuleLayers are justified when dependency/type isolation, a separate modular graph, or replacement contexts are real requirements. If failure, security, or resource containment must be stronger than an in-JVM boundary can provide, process isolation may be more appropriate. Do not pay complexity merely because a mechanism is more advanced; each layer should solve a concrete deployment, discovery, lifecycle, compatibility, or isolation problem.
    aiGenerated: true
    reviewed: false
