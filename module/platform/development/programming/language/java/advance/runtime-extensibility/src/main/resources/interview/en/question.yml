questions:
  - question: >-
      How does Runtime Extensibility differ from using only interfaces plus dependency injection, and when do you actually need runtime provider discovery?
    answer: >-
      Interfaces and DI already decouple the host from concrete implementations, but the implementation set is commonly known when the build or startup configuration is assembled. Runtime Extensibility goes further: providers can be packaged and deployed independently while the host discovers them from the runtime environment through a stable service contract. Runtime discovery is justified when plugin JARs/modules are independently deployable, the provider set is not known in advance, or capability selection, lifecycle, or isolation boundaries are required. If the implementation set is fixed, static wiring or DI is usually simpler to reason about and operate.
    aiGenerated: true
    reviewed: false
