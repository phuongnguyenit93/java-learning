  - id: dependency-conflict-boundary
    question: >-
      Plugin B cần library X 2.x trong khi host dùng X 1.x. Điều nào là reasoning phù hợp nhất cho plugin architecture?
    answers:
      - id: A
        answer: "Đặt cả hai version lên cùng loader là đủ vì JVM tự chọn version phù hợp cho từng caller."
        explanation: "Sai. Một loader namespace không tự cung cấp per-caller dependency version selection."
      - id: B
        answer: "Cho plugin import implementation package của host để dùng đúng version X mà host đã chọn."
        explanation: "Sai. Cách này tăng coupling và có thể không đáp ứng requirement của plugin B."
      - id: C
        answer: "Cân nhắc align version, shade/relocate hoặc loader isolation; giữ shared contract type ngoài plugin-private dependency namespace."
        explanation: "Đúng. Đây là các hướng xử lý phù hợp với dependency/isolation boundary thay vì giả định conflict tự biến mất."
      - id: D
        answer: "Đổi tên plugin B là đủ vì dependency conflict phụ thuộc plugin identifier, không phụ thuộc class loading."
        explanation: "Sai. Conflict liên quan dependency/type namespace chứ không phải tên logic của plugin."
