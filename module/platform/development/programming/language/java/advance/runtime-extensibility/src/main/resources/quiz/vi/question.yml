questions:
  - id: runtime-extensibility-decoupling
    question: >-
      Host cần cho phép thêm `PdfExporter` hoặc `CsvExporter` bằng JAR mới mà không sửa code host. Thiết kế nào phù hợp nhất với mục tiêu Runtime Extensibility?
    answers:
      - id: A
        answer: "Host dùng `switch` theo format và `new` từng implementation cụ thể."
        explanation: "Sai. Cách này giữ provider set trong code host, nên thêm provider vẫn buộc sửa và build lại host."
      - id: B
        answer: "Mỗi provider gọi trực tiếp API nội bộ của host để tự đăng ký khi class được load."
        explanation: "Sai. Cách này tạo coupling mạnh vào implementation/lifecycle nội bộ của host và không tạo service contract ổn định."
      - id: C
        answer: "Host phụ thuộc service contract ổn định, còn provider được đóng gói độc lập và được discovery ở runtime."
        explanation: "Đúng. Đây là dependency direction cốt lõi của Runtime Extensibility: host biết contract, không hard-code từng provider."
      - id: D
        answer: "Host load mọi class trong JAR bằng Reflection rồi chọn class có tên chứa `Exporter`."
        explanation: "Sai. Reflection scan theo naming convention không thay thế một service-provider contract và discovery model rõ ràng."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
