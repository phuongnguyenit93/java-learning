  - id: host-plugin-responsibility-boundary
    question: >-
      Business code đang tự gọi `ServiceLoader`, cast provider sang concrete class và tự start/stop resource của plugin ở nhiều nơi. Refactor nào tạo plugin boundary rõ nhất?
    answers:
      - id: A
        answer: "Giữ discovery trong từng business flow nhưng chuẩn hóa tên concrete provider để các cast nhất quán hơn."
        explanation: "Sai. Naming convention không giải quyết coupling, lifecycle ownership hay việc business code biết implementation detail."
      - id: B
        answer: "Tập trung discovery/validation/selection/lifecycle vào PluginManager qua stable contract; business code chỉ dùng registry/service view đã được host quản lý."
        explanation: "Đúng. Host sở hữu orchestration và policy, còn plugin giữ implementation/private dependency/resource theo contract đã định nghĩa."
      - id: C
        answer: "Cho mỗi plugin tự sửa global registry của host khi class được load để không cần PluginManager."
        explanation: "Sai. Self-registration vào global mutable state làm ownership và failure boundary khó kiểm soát."
      - id: D
        answer: "Để business code giữ provider instance lâu dài và gọi cleanup khi JVM shutdown, bất kể plugin có replacement lifecycle hay không."
        explanation: "Sai. Resource/lifecycle ownership phải theo plugin architecture và replacement semantics, không dựa vào ad-hoc long-lived references."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
