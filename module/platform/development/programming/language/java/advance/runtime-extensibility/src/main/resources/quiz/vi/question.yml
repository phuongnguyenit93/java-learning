  - id: resolveandbind-service-binding
    question: >-
      Khi tạo `Configuration` cho modular plugins, lợi ích chính của `resolveAndBind(...)` so với chỉ `resolve(...)` trong service-provider scenario là gì?
    answers:
      - id: A
        answer: "Nó giữ graph giống `resolve()` nhưng đánh dấu provider metadata để `ServiceLoader` instantiate sau khi layer được tạo."
        explanation: "Sai. Service binding có thể làm graph được augment bằng provider modules; không chỉ gắn metadata lên graph cũ."
      - id: B
        answer: "Nó thêm mọi observable module có `provides`, kể cả khi graph không có service-use dependence tương ứng."
        explanation: "Sai. Provider modules được thêm do service-use dependence; không phải mọi module có `provides` đều được kéo vào."
      - id: C
        answer: "Nó chỉ bind provider modules đã có trong root set; provider chưa phải root vẫn phải được host `requires` trực tiếp."
        explanation: "Sai. Điểm của service binding là có thể kéo matching provider modules vào graph mà host không require trực tiếp từng provider."
      - id: D
        answer: "Nó augment resolved graph bằng provider modules được service-use dependence yêu cầu, rồi resolve tiếp cho đến khi ổn định."
        explanation: "Đúng. Đây là điểm quan trọng để host không phải `requires` trực tiếp từng provider module."
    correctAnswerId: D
