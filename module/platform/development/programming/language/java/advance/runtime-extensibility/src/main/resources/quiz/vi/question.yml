  - id: class-identity-across-plugin-loaders
    question: >-
      Host và plugin cùng có class tên `com.example.api.ReportExporter`, nhưng hai bản được define bởi hai ClassLoader không chia sẻ contract identity. Rủi ro chính là gì?
    answers:
      - id: A
        answer: "Nếu binary name và bytecode giống nhau, JVM có thể coi hai class là cùng type dù chúng được define bởi hai loader khác nhau."
        explanation: "Sai. Binary name giống nhau không đủ; defining ClassLoader là một phần của runtime type identity."
      - id: B
        answer: "Object từ plugin có thể không cast được sang service type của host dù tên class giống nhau."
        explanation: "Đúng. Đây là lý do contract type thường phải được share qua loader boundary có identity thống nhất."
      - id: C
        answer: "Khác defining loader chủ yếu ảnh hưởng resource lookup; assignability vẫn dựa trên binary name của class."
        explanation: "Sai. Defining loader ảnh hưởng trực tiếp tới class identity và vì thế tới assignability/cast."
      - id: D
        answer: "Type identity chỉ tách ra khi custom loader dùng child-first; với parent-first delegation thì hai bản cùng tên vẫn tương đương."
        explanation: "Sai. Điều quyết định là class thực sự được define bởi loader nào; delegation strategy chỉ ảnh hưởng loader nào cuối cùng define class."
    correctAnswerId: B
