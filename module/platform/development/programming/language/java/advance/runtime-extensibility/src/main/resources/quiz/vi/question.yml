  - id: plugin-reload-vs-serviceloader-reload
    question: >-
      Plugin generation mới đã sẵn sàng thay thế generation cũ. Flow nào mô tả plugin replacement an toàn hơn `ServiceLoader.reload()` đơn thuần?
    answers:
      - id: A
        answer: "Initialize/validate plugin mới, switch registry, drain work cũ, rồi stop và cleanup plugin cũ."
        explanation: "Đúng. Replacement là lifecycle transition; discovery-cache reload chỉ là một phần nhỏ nếu có."
      - id: B
        answer: "Gọi `reload()`, xóa JAR cũ ngay, rồi giả định mọi request đang chạy sẽ tự chuyển provider."
        explanation: "Sai. `reload()` không drain request, stop instance cũ hoặc bảo đảm JAR/class loader đã được release."
      - id: C
        answer: "Stop plugin cũ trước, sau đó mới kiểm tra plugin mới có tương thích và start được hay không."
        explanation: "Sai. Cách này tạo unnecessary outage nếu replacement fail trước khi sẵn sàng."
      - id: D
        answer: "Giữ cả hai plugin active vô thời hạn để tránh phải quản lý cleanup hoặc compatibility."
        explanation: "Sai. Cách này không giải quyết lifecycle, resource ownership hay selection ambiguity."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.PluginLifecycle/PluginLifecycle.md"
