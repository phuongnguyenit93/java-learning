  - id: serviceloader-layer-scope
    question: >-
      Host gọi `ServiceLoader.load(pluginLayer, ReportExporter.class)`. Phạm vi discovery nào phù hợp nhất với overload này?
    answers:
      - id: A
        answer: "Provider trong layer đã cho và các ancestor layers; class-path provider trong unnamed module không thuộc scope overload này."
        explanation: "Đúng. Layer-based discovery có context rõ ràng theo layer graph và ancestors của nó."
      - id: B
        answer: "Provider visible từ system ClassLoader cộng với provider trong layer đã cho; ancestor layers không được traversal."
        explanation: "Sai. Overload theo layer search layer đã cho và ancestors, không ghép thêm một system-class-loader scope độc lập."
      - id: C
        answer: "Chỉ provider trong đúng layer hiện tại; parent layer bị loại để giữ isolation giữa các plugin generation."
        explanation: "Sai. API contract bao gồm provider trong ancestor layers của layer đã cho."
      - id: D
        answer: "Provider trong layer đã cho cộng với provider mà thread context ClassLoader tìm thấy, bất kể quan hệ ancestor layer."
        explanation: "Sai. Layer overload dùng module-layer scope; nó không bổ sung discovery từ TCCL như `load(service)` convenience method."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
