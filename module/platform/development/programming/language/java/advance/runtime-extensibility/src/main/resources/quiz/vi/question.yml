  - id: serviceloader-lazy-cache
    question: >-
      Sau khi gọi `ServiceLoader.load(ReportExporter.class)` nhưng trước khi iterate hoặc consume stream, nhận định nào đúng nhất?
    answers:
      - id: A
        answer: "`load(...)` instantiate provider đầu tiên ngay để validate configuration, còn các provider sau mới chờ traversal."
        explanation: "Sai. Việc tạo ServiceLoader chưa buộc instantiate provider đầu tiên; locating/instantiation xảy ra lazily khi traversal thực sự cần provider."
      - id: B
        answer: "Việc gọi `load(...)` chưa đồng nghĩa mọi provider đã được instantiate; provider được xử lý lazily khi traversal xảy ra."
        explanation: "Đúng. `ServiceLoader` locate và instantiate provider theo nhu cầu khi iterator/stream được consume."
      - id: C
        answer: "`iterator()` tạo snapshot và instantiate toàn bộ provider vào cache trước khi lần `next()` đầu tiên trả kết quả."
        explanation: "Sai. Iterator tiếp tục locate/instantiate provider lazily và thêm provider đã load vào cache theo tiến trình traversal."
      - id: D
        answer: "`load(...)` discover toàn bộ provider type trước, còn constructor chỉ bị trì hoãn đến khi caller gọi `Provider.get()`."
        explanation: "Sai. Với iterator, chính traversal có thể locate và instantiate provider; `Provider.get()` là flow của stream/provider objects, không phải requirement chung."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.ServiceLoaderIntegration/ServiceLoaderIntegration.md"
      anchor: "lazy-discovery-and-cache"
    apiRelated:
      controller: "RuntimeExtensibilityController"
      methodSignature: "serviceLoader()"

  - id: spi-contract-stability-boundary
    question: >-
      Host công bố `ReportExporter` SPI cho provider do team khác phát hành độc lập. Thiết kế nào giữ boundary ổn định nhất khi host và provider cần tiến hóa riêng?
    answers:
      - id: A
        answer: "Đưa entity nội bộ của host vào SPI để provider luôn nhận được đầy đủ state mới nhất của host."
        explanation: "Sai. Internal host type làm provider phụ thuộc implementation detail và khiến thay đổi nội bộ dễ phá extension contract."
      - id: B
        answer: "Giữ SPI tối thiểu rồi để host cast provider sang concrete class khi cần capability chưa có trong contract."
        explanation: "Sai. Cast sang implementation tạo side channel và phá abstraction boundary giữa host với provider."
      - id: C
        answer: "Cho provider truy cập một mutable service locator của host để tự lấy bất kỳ dependency nội bộ nào nó cần."
        explanation: "Sai. Cách này mở rộng coupling không kiểm soát và khiến dependency/lifecycle semantics khó ổn định."
      - id: D
        answer: "Giữ shared contract nhỏ, dùng type/semantics ổn định, document error/lifecycle ownership và chỉ thêm capability theo cách có compatibility policy rõ."
        explanation: "Đúng. SPI là public compatibility surface; ổn định type, semantics và ownership giúp host/provider tiến hóa độc lập hơn."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.SPIContract/SPIContract.md"
      anchor: "contract-stability"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: serviceloader-reload-semantics
    question: >-
      Host gọi `serviceLoader.reload()` sau khi đã dùng một provider giữ thread và socket. Điều nào được `reload()` bảo đảm trực tiếp?
    answers:
      - id: A
        answer: "Cache provider của `ServiceLoader` instance bị xóa để lần traversal sau discovery lại."
        explanation: "Đúng. `reload()` là cache invalidation cho discovery của loader đó."
      - id: B
        answer: "Provider cũ được gọi `close()` và mọi resource của nó được giải phóng."
        explanation: "Sai. `ServiceLoader` không quản lý application lifecycle hoặc resource cleanup của provider."
      - id: C
        answer: "ClassLoader chứa provider bị unload ngay nếu không còn provider mới cùng service."
        explanation: "Sai. `reload()` không phải class unloading primitive."
      - id: D
        answer: "Mọi iterator cũ tiếp tục dùng cache trước reload một cách an toàn cho đến khi kết thúc."
        explanation: "Sai. Iterator/stream cũ không nên tiếp tục dùng sau khi cache bị reload."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.ServiceLoaderIntegration/ServiceLoaderIntegration.md"
      anchor: "reload-and-concurrency"
    apiRelated:
      controller: "RuntimeExtensibilityController"
      methodSignature: "serviceLoader()"

  - id: provider-order-is-not-business-priority
    question: >-
      Hệ thống có hai provider cùng hỗ trợ `pdf`. Vì sao dùng raw `ServiceLoader.findFirst()` làm business priority thường là thiết kế yếu?
    answers:
      - id: A
        answer: "Vì `findFirst()` sắp provider theo tên class, nên kết quả deterministic nhưng không phản ánh capability của request."
        explanation: "Sai. ServiceLoader không định nghĩa `findFirst()` theo lexical order của provider class name."
      - id: B
        answer: "Vì `findFirst()` ưu tiên provider instantiate nhanh hơn, nên thứ tự có thể đổi theo runtime cost của constructor."
        explanation: "Sai. Provider ordering không được xác định bằng thời gian instantiate hay constructor cost."
      - id: C
        answer: "Vì discovery order không phải business-priority contract tổng quát; host cần selection policy riêng cho request."
        explanation: "Đúng. Priority nghiệp vụ phải đến từ contract/configuration của application, không từ incidental deployment order."
      - id: D
        answer: "Vì `findFirst()` dùng `META-INF/services` như một global total order kể cả khi provider đến từ named modules."
        explanation: "Sai. Provider có thể đến từ nhiều deployment source và Java không biến service file thành global business order."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.ProviderDiscoveryStrategy/ProviderDiscoveryStrategy.md"
      anchor: "provider-ordering-caveats"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: named-module-consumer-uses
    question: >-
      `ReportExporter` nằm trong module `export.api`; host là named module khác, trực tiếp dùng type này và muốn discovery provider bằng `ServiceLoader`. Descriptor của host nên thể hiện điều gì?
    answers:
      - id: A
        answer: "Khai báo `requires export.api`; việc gọi `ServiceLoader.load(...)` tự suy ra service dependence nên không cần `uses`."
        explanation: "Sai. Named-module consumer phải khai báo `uses` cho service mà nó discovery qua ServiceLoader."
      - id: B
        answer: "`requires export.api` để đọc service type và `uses ReportExporter` để khai báo consumer của service."
        explanation: "Đúng. Hai directive có vai trò khác nhau và cùng cần khi service type nằm ở module khác."
      - id: C
        answer: "Chỉ khai báo `uses ReportExporter`; service binding sẽ tự tạo readability tới `export.api` cho source code của host."
        explanation: "Sai. `uses` không thay thế readability/accessibility cần thiết để host trực tiếp tham chiếu service type."
      - id: D
        answer: "Khai báo `requires export.api`, `uses ReportExporter` và `requires` từng provider module để provider được discovery."
        explanation: "Sai. Consumer không nên require từng provider module chỉ để ServiceLoader discovery chúng."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.ClasspathModulePathIntegration/ClasspathModulePathIntegration.md"
      anchor: "module-consumer-requires-uses"
