version: 1
type: LEARNING_ROADMAP
title: 'Nền tảng TLS: mật mã, xác thực, thương lượng và vận hành kết nối'
roadmapHeading: Lộ trình học Nền tảng TLS trong Java
roadmap:
- id: tls-foundation-001
  order: 1
  title: 15.1 TLS kết hợp thỏa thuận khóa, chứng thư, chữ ký và mã hóa phiên
  description: Liên kết (EC)DHE, chứng thư, chữ ký handshake, Finished, HKDF và AEAD để hiểu TLS xác thực kênh và bảo vệ dữ liệu phiên.
  transition:
    to: tls-foundation-002
    description: Từ các primitive sang chính thứ tự handshake, đặc biệt khi server yêu cầu certificate của client.
- id: tls-foundation-002
  order: 2
  title: 15.2 Luồng bắt tay, xác thực máy chủ và xác thực hai chiều mTLS
  description: Theo dõi handshake server-authenticated TLS và mTLS, lựa chọn CA/keys cho từng phía và phân biệt certificate identity với authorization.
  transition:
    to: tls-foundation-003
    description: Tiếp tục xác định TLS protocol nào được cấu hình và thực sự thương lượng trên hai đầu kết nối.
- id: tls-foundation-003
  order: 3
  title: 15.3 TLS 1.2, TLS 1.3 và cách đọc cấu hình giao thức khả dụng
  description: So sánh TLS 1.2 và TLS 1.3, đọc supported/enabled/disabled và chứng minh negotiated protocol bằng JSSE thực.
  transition:
    to: tls-foundation-004
    description: Khi đã biết protocol negotiated, cần hiểu cipher suites và extensions quyết định thuật toán thực.
- id: tls-foundation-004
  order: 4
  title: 15.4 Cipher suite và khác biệt về thành phần thương lượng giữa các phiên bản TLS
  description: Giải nghĩa cipher suites theo phiên bản, liên hệ key_share, signature schemes và certificate với kết quả thương lượng.
  transition:
    to: tls-foundation-005
    description: Sau khi tách key exchange khỏi chữ ký/suite, đi sâu vào hậu quả lộ khóa dài hạn đối với các phiên trước.
- id: tls-foundation-005
  order: 5
  title: 15.5 Khóa tạm thời, forward secrecy và quan hệ với khóa dài hạn của chứng thư
  description: Phân tích hậu quả lộ khóa định danh và giới hạn forward secrecy của ECDHE, PSK-only, 0-RTT cùng secret lifecycle.
  transition:
    to: tls-foundation-006
    description: Chuyển từ bí mật khóa sang xác minh đúng peer qua trust chain và tên máy chủ.
- id: tls-foundation-006
  order: 6
  title: 15.6 Phân biệt tin chuỗi chứng thư với xác minh tên máy chủ
  description: Tách PKIX path trust khỏi kiểm SAN/hostname; sửa mismatch bằng certificate/trust policy đúng thay vì tắt name check.
  transition:
    to: tls-foundation-007
    description: Từ kết nối có peer đáng tin sang quản lý nhiều request, session tickets và resumption qua thời gian.
- id: tls-foundation-007
  order: 7
  title: 15.7 Session, tái sử dụng phiên và vòng đời kết nối
  description: Phân biệt HTTP request, TLS connection và session/resumption; đánh giá NewSessionTicket, 0-RTT và cache/rotation.
  transition:
    to: tls-foundation-008
    description: Sau session lifecycle, khảo sát cách một TLS endpoint chọn virtual host và app protocol.
- id: tls-foundation-008
  order: 8
  title: 15.8 SNI để chọn máy chủ ảo và ALPN để chọn giao thức ứng dụng
  description: Phân biệt SNI chọn host/certificate và ALPN chọn protocol; quan sát Java 21 virtual-host/ALPN lab với hostname trust.
  transition:
    to: tls-foundation-009
    description: Cuối cùng mở rộng từ TLS trên byte stream tới bảo vệ datagram bằng DTLS và tương quan với QUIC.
- id: tls-foundation-009
  order: 9
  title: 15.9 Phân biệt TLS trên luồng với DTLS trên datagram
  description: So sánh TLS stream/TCP với DTLS datagram/UDP qua loss, replay, framing, MTU, JSSE engine và lựa chọn QUIC.
  transition: null
comparisonMarkdown: |-
  ## 2. So sánh các bài học trong chương

  | Tiêu chí | Bài 1 — 15.1 | 15.2 | 15.3 | 15.4 | 15.5 | 15.6 | 15.7 | 15.8 | 15.9 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Vai trò học tập | Phối hợp mật mã | Handshake và mTLS | Protocol policy | Cipher suite negotiation | Forward secrecy | Định danh peer | Session lifecycle | Virtual host và ALPN | Transport semantics |
  | Câu hỏi chính | Các crypto primitives nối nhau thế nào? | Client/server xác thực ai? | Supported khác negotiated ra sao? | Suite chứa những lựa chọn gì? | Lộ identity key có giải mã traffic cũ? | CA tin cậy có đúng hostname? | Request, socket và ticket khác nhau? | SNI và ALPN chọn điều gì? | DTLS có giữ reliable delivery? |
  | Cơ chế then chốt | ECDHE, Finished, AEAD, HKDF | CertificateRequest, clientAuth | TLS 1.2/1.3, SSLSession | AEAD/hash, key_share, signatures | Ephemeral secret, PSK, 0-RTT | PKIX, SAN, hostname verification | Tickets, cache, PSK, close_notify | SNIHostName, key manager, ALPN | DTLS SSLEngine, replay, MTU |
  | Thực hành Java | X25519 và JSSE loopback | CA lab one-way/mTLS | Inventory và TLS handshake | Cipher suite inspect/handshakes | X25519/Ed25519 threat model | DNS SAN vs IP SAN lab | SSLSession và HTTP client | Java 21 hai virtual hosts | Java17 TCP/UDP và DTLS inventory |
  | Điều không được nhầm | Raw secret không phải traffic key | mTLS không thay authorization | Supported không phải negotiated | Suite không định nghĩa toàn bộ handshake | FS không chống lộ session secret | Chain trust không thay name check | Session ticket không phải socket | ALPN không tự chạy HTTP handler | DTLS không là QUIC hay reliable transport |
