# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: crypto-goal-before-primitive
    question: A service must detect payload modification and both parties already share one secret. Which mechanism best matches that goal?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 1.MentalModel/MentalModel.md
      anchor: primitive-by-goal
    apiRelated:
      controller: MacExperimentController
      methodSignature: tamper()
    answers:
      - id: A
        answer: Use MessageDigest because the digest changes when the payload changes.
        explanation: A digest can detect modification against a trusted reference, but by itself it does not authenticate the producer because no secret is involved.
      - id: B
        answer: Use a MAC because the tag depends on both the message bytes and the shared secret.
        explanation: Correct. A MAC fits a shared-secret trust model that needs integrity plus shared-secret authenticity.
      - id: C
        answer: Use Base64 so the payload has a stable representation during transport.
        explanation: Base64 changes representation only; it does not provide integrity or authenticity.
      - id: D
        answer: Use unauthenticated symmetric encryption because ciphertext changes when plaintext changes.
        explanation: Unauthenticated encryption does not guarantee tamper detection; AEAD is the usual model when confidentiality and integrity are both required.
    correctAnswerId: B

  - id: delayed-provider-selection
    question: Why can a JCA engine such as Signature remain uncommitted to its final provider immediately after getInstance(...)?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 3.ProvidersAlgorithms/ProvidersAlgorithms.md
      anchor: provider-selection
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: The provider is selected only after sign() has already produced the signature bytes.
        explanation: A provider must be selected before the actual operation runs; delayed selection is commonly resolved during initialization with a key.
      - id: B
        answer: JCA always runs every provider in parallel and keeps whichever one finishes first.
        explanation: JCA does not benchmark all providers concurrently and select the fastest result.
      - id: C
        answer: The provider can only be derived from the package name of the key implementation.
        explanation: Key/provider compatibility can matter, but package naming is not the general provider-selection rule.
      - id: D
        answer: The JDK may wait until init(...) reveals which key the provider must be able to process.
        explanation: Correct. This is especially useful for non-exportable keys held by a token or HSM.
    correctAnswerId: D

  - id: securerandom-setseed-before-output
    question: With a PRNG-based SecureRandom, what matters if code calls setSeed(...) before the first nextBytes(...) call?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 4.SecureRandom/SecureRandom.md
      anchor: entropy-and-seeding
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: The caller must ensure the supplied seed has enough entropy because the normal self-seeding step may not occur.
        explanation: Correct. Application code therefore should not seed with timestamps, user identifiers, or constants.
      - id: B
        answer: SecureRandom ignores the supplied seed and always self-seeds first.
        explanation: That is not the documented behavior for the case where setSeed is called before the first output request.
      - id: C
        answer: setSeed makes SecureRandom deterministic for every provider.
        explanation: There is no general contract that setSeed makes every provider deterministic.
      - id: D
        answer: setSeed only affects performance and has no security relevance to seed material.
        explanation: Seed entropy can directly affect output predictability.
    correctAnswerId: A

  - id: digest-trusted-reference
    question: A client downloads a file and its SHA-256 digest from the same channel, and an attacker can modify both. Why is digest comparison insufficient to prove the file is original?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 6.MessageDigest/MessageDigest.md
      anchor: trusted-digest-reference
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: SHA-256 is only suitable for text and not for binary files.
        explanation: SHA-256 hashes bytes and works with binary files normally.
      - id: B
        answer: A digest is only meaningful when the file is shorter than the hash output.
        explanation: Hash functions are designed for inputs of arbitrary practical length; file size is not the issue here.
      - id: C
        answer: The attacker can replace the file and compute a new digest if the reference digest is also unprotected.
        explanation: Correct. A plain digest does not create authenticity when the attacker controls both data and reference.
      - id: D
        answer: MessageDigest always needs a secret key to validate a reference.
        explanation: MessageDigest has no secret key; a MAC is the relevant primitive when shared-secret authenticity is required.
    correctAnswerId: C

  - id: mac-vs-signature-authority
    question: Which mechanism fits when a verifier must validate data but must not gain the ability to create an equally valid authentication value on behalf of the signer?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 7.Mac/Mac.md
      anchor: mac-comparison
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: A MAC, because the verifier needs the shared secret to validate the tag.
        explanation: A MAC verifier holding the shared secret can normally create valid tags too.
      - id: B
        answer: A digital signature, because verification needs the public key while signing authority remains with the private key.
        explanation: Correct. A signature separates signing authority from verification authority.
      - id: C
        answer: MessageDigest, because a verifier can hash the data without holding a key.
        explanation: A digest does not provide signer authenticity without another trust mechanism.
      - id: D
        answer: Symmetric encryption, because successful decryption proves the signer identity.
        explanation: The ability to decrypt does not by itself prove which party created the ciphertext.
    correctAnswerId: B

  - id: gcm-nonce-reuse
    question: Two distinct AES-GCM records accidentally reuse the same nonce under the same key. Which assessment is most accurate?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 11.AuthenticatedEncryption/AuthenticatedEncryption.md
      anchor: nonce-uniqueness
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: Only performance is affected because the authentication tag still separates the records.
        explanation: Nonce reuse in GCM is a serious security error, not merely a performance issue.
      - id: B
        answer: Only confidentiality degrades while authentication assumptions remain intact.
        explanation: GCM nonce reuse can undermine both confidentiality and authentication security assumptions.
      - id: C
        answer: Reuse is harmless if the nonce is kept secret together with the key.
        explanation: A nonce normally need not be secret; uniqueness under the same key is the critical property.
      - id: D
        answer: This is a security failure because GCM requires the nonce not to be reused under the same key.
        explanation: Correct. The nonce lifecycle must be designed to prevent reuse with one key.
    correctAnswerId: D

  - id: aead-tamper-runtime
    question: In the AES-GCM experiment, original ciphertext decrypts successfully but flipping one bit makes doFinal(...) throw AEADBadTagException. What does that observation demonstrate?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 11.AuthenticatedEncryption/AuthenticatedEncryption.md
      anchor: aead-decryption-failure
    apiRelated:
      controller: AeadExperimentController
      methodSignature: tamperDetection()
    answers:
      - id: A
        answer: The authentication tag no longer verifies, so the modified record must be rejected.
        explanation: Correct. AEAD turns tampering into authentication failure instead of returning plaintext for business logic to continue using.
      - id: B
        answer: The nonce became secret, so the decryptor can no longer read the ciphertext.
        explanation: The nonce did not become secret; the failure comes from authentication-tag verification.
      - id: C
        answer: The AES key was automatically rotated as soon as ciphertext changed.
        explanation: Cipher does not automatically rotate a key after detecting tampering.
      - id: D
        answer: GCM can only decrypt data that was never copied to another byte array.
        explanation: Cloning an array is not the issue; changing authenticated bytes causes verification failure.
    correctAnswerId: A

  - id: agreement-vs-kem-flow
    question: Which distinction correctly describes KeyAgreement and KEM even though both experiments produce matching secret material at both ends?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 12.KeyEstablishment/KeyEstablishment.md
      anchor: agreement-vs-kem
    apiRelated:
      controller: KeyEstablishmentExperimentController
      methodSignature: compare()
    answers:
      - id: A
        answer: KeyAgreement always uses a password while KEM always uses a certificate.
        explanation: The two mechanisms are not distinguished by password versus certificate use.
      - id: B
        answer: KeyAgreement encrypts the payload while KEM only computes a digest.
        explanation: Both are key-establishment mechanisms, not payload-encryption versus hashing mechanisms.
      - id: C
        answer: KeyAgreement combines a local private key with peer public information; KEM uses encapsulation and decapsulation around a receiver key pair.
        explanation: Correct. They use different interaction models even though both can establish shared secret material.
      - id: D
        answer: KeyAgreement automatically authenticates the peer while KEM has no public key.
        explanation: Key agreement does not authenticate the peer by itself, and KEM also uses public/private key material.
    correctAnswerId: C

  - id: pbkdf2-salt-effect
    question: "The PBKDF2 experiment uses one password and the same parameters: repeating salt A reproduces the output, while salt B changes it. Which conclusion is correct?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 13.KeyDerivation/KeyDerivation.md
      anchor: salt-and-work-factor
    apiRelated:
      controller: KeyDerivationExperimentController
      methodSignature: saltEffect()
    answers:
      - id: A
        answer: Salt must remain secret like the password for the KDF to be secure.
        explanation: Salt need not be secret; it is stored with the parameter set and needs an appropriate uniqueness strategy.
      - id: B
        answer: Salt is part of the derivation contract; changing it can change the derived output for the same password.
        explanation: Correct. Fixed salts in the experiment exist only to keep the comparison repeatable, not as a production pattern.
      - id: C
        answer: The work factor stops mattering if the application stores the salt with the record.
        explanation: Work factor and salt address different problems; storing the salt with the record is normal.
      - id: D
        answer: One password must always produce one derived key even when the salt changes, otherwise authentication cannot work.
        explanation: KDF parameters, including salt, affect output; the system stores them so the correct record can be derived again.
    correctAnswerId: B

  - id: keystore-vs-truststore
    question: Which statement best describes the difference between a "keystore" and a "truststore" in Java?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 14.KeyStore/KeyStore.md
      anchor: keystore-vs-truststore
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: A keystore must use JKS while a truststore must use PKCS12.
        explanation: The names primarily describe roles; the stores are not required to use different formats.
      - id: B
        answer: A keystore contains only certificates while a truststore contains only private keys.
        explanation: A local identity store commonly contains a private key and certificate chain, while trust material is commonly trusted certificates.
      - id: C
        answer: The terms are completely interchangeable, so their roles do not matter when configuring JSSE.
        explanation: Both use the KeyStore abstraction, but their operational roles still matter to KeyManager and TrustManager.
      - id: D
        answer: They are usually role names; both can use the same KeyStore type such as PKCS12.
        explanation: Correct. Physically separating them is a deployment choice, not a requirement for two Java types.
    correctAnswerId: D

  - id: trust-vs-endpoint-identity
    question: A TLS client has successfully validated a certificate path to a trusted CA. Why is endpoint identity verification still necessary?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 15.CertificatesTrust/CertificatesTrust.md
      anchor: trust-vs-identity
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: Path trust and hostname identity answer different questions; a certificate trusted for one host can still be wrong for the current target.
        explanation: Correct. A client normally needs both trust validation and confirmation that the certificate represents the intended endpoint.
      - id: B
        answer: Endpoint verification checks whether the private key is stored inside the truststore.
        explanation: Endpoint verification checks identity such as hostname, not whether a private key exists in the truststore.
      - id: C
        answer: Path validation only checks expiration and never validates certificate signatures.
        explanation: PKIX validation checks signatures and other constraints; the distinction here is trust path versus endpoint identity.
      - id: D
        answer: Hostname verification completely replaces certificate-path validation.
        explanation: The two checks complement one another; endpoint verification does not replace trust validation.
    correctAnswerId: A

  - id: tls-algorithm-constraints
    question: Code explicitly enables a TLS cipher suite, yet a handshake starts failing after a JDK upgrade. Which explanation best fits?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 16.TlsJsse/TlsJsse.md
      anchor: tls-algorithm-constraints
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: Enabling a suite in SSLParameters overrides every security property, so the failure must be a network problem.
        explanation: SSLParameters does not override all JDK security constraints.
      - id: B
        answer: A cipher suite can only be rejected when the peer runs a different operating system.
        explanation: Local provider support and JDK security properties can also reject a choice.
      - id: C
        answer: JDK security properties or algorithm constraints can block an algorithm or key size even though the API still exists.
        explanation: Correct. API availability, provider support, and security policy are separate layers.
      - id: D
        answer: Upgrading the JDK automatically changes the server certificate, so the old cipher suite disappears.
        explanation: A local JDK upgrade does not automatically replace the remote server certificate; changed constraints or policy are a more realistic cause.
    correctAnswerId: C
