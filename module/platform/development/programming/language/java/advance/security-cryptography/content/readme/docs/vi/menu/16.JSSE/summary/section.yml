  | Thực hành hoặc bằng chứng | Sơ đồ identity/trust và SSLEngine cấu hình | Lab PKCS#12, CA ký leaf và TLS handshake | Cấu hình SSLParameters và ma trận E2E | Explicit/implicit loopback và listener | Lab bốn tổ hợp need/want và certificate | Decorator và mTLS có chọn alias | Loopback HTTPS với hai Java APIs | Hai SSLEngine giao tiếp qua RAM | Probe lỗi buffer và in-memory shutdown | Test pass/fail theo CA và SAN | Runbook và JSSE/certpath debug |
