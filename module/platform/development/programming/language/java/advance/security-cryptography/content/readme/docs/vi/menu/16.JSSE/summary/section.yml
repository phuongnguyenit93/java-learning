  | Lỗi cần tránh | Đồng nhất keystore, truststore và SSLContext | Có certificate nhưng không có private key | Coi SNI/ALPN là xác thực hostname | Nhầm TCP connect với TLS đã xác thực | Tưởng wantClientAuth chấp nhận cert sai | Wrapper bỏ qua trust check theo socket | Dùng trust-all hoặc đổi default toàn JVM | Bỏ NEED_TASK hoặc mất partial bytes | Clear mất bytes hoặc bỏ close_notify | Trust mọi certificate hoặc bỏ hostname | Sửa handshake bằng bypass trust |
