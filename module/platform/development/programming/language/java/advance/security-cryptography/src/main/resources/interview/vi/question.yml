      methodSignature: ""

  - question: Giải thích delayed provider selection trong JCA. Tại sao cơ chế này hữu ích với HSM/token key, và khi nào bạn nên pin provider rõ ràng?
    answer: >-
      Với một số engine như Signature, Cipher, Mac và KeyAgreement, getInstance(...) có thể chưa chốt provider cuối cùng; JDK có thể đợi đến init(...) khi nhìn thấy Key để chọn provider xử lý được key đó. Điều này quan trọng với key không exportable trong HSM/token vì provider giữ key có thể phải thực hiện phép toán. Nên pin provider khi có yêu cầu kỹ thuật/compliance rõ ràng; nếu không, để provider selection linh hoạt thường tăng portability. Sau khi một engine instance đã chọn provider, muốn lựa chọn lại theo key khác nên tạo engine instance mới.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 3.ProvidersAlgorithms/ProvidersAlgorithms.md
      anchor: provider-selection
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: SecureRandom khác Random ở security contract nào, và vì sao tự gọi setSeed(...) bằng timestamp có thể làm thiết kế tệ hơn thay vì tốt hơn?
    answer: >-
      SecureRandom được dùng khi đầu ra phải khó dự đoán đối với kẻ tấn công, còn Random chủ yếu phục vụ nhu cầu pseudo-random thông thường. Với PRNG-based SecureRandom, nếu setSeed(...) được gọi trước lần đầu ra/self-seed đầu tiên, bên gọi phải bảo đảm seed đủ entropy. Timestamp, user id hoặc constant là dữ liệu dễ đoán nên có thể làm mất giả định unpredictability. Trong mã ứng dụng thông thường, để JDK/provider quản lý seeding an toàn hơn việc "seed cho chắc" bằng dữ liệu tự nghĩ ra.
    aiGenerated: true
    reviewed: false
    readmeRelated:
