  - question: KeyAgreement và Java 21 KEM đều có thể tạo shared secret material. Hãy giải thích interaction model khác nhau và vì sao cả hai không tự xác thực peer.
    answer: >-
      Với KeyAgreement, mỗi bên thường kết hợp private key của mình với public information của peer để tính cùng shared secret. Với KEM, sender dùng receiver public key để encapsulate, nhận secret key cùng encapsulation message; receiver dùng private key để decapsulate message và thu cùng secret. Cả hai giải quyết secret establishment chứ không tự chứng minh public key thuộc đúng identity mong muốn. Protocol vẫn cần certificate, signature hoặc authenticated binding khác, và raw secret thường tiếp tục đi qua KDF/key schedule trước khi thành traffic/application key.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 12.KeyEstablishment/KeyEstablishment.md
      anchor: agreement-vs-kem
    apiRelated:
      controller: KeyEstablishmentExperimentController
      methodSignature: compare()

  - question: Salt và work factor giải quyết hai vấn đề gì khác nhau trong password-based key derivation? Tại sao salt có thể lưu cạnh record nhưng password thì không?
    answer: >-
      Salt làm cùng một password ở các record khác nhau dẫn tới derived output khác và giảm khả năng tái sử dụng precomputation chung; nó không cần bí mật nên được lưu cùng KDF id/version và parameters để derive lại. Work factor làm mỗi password guess tốn tài nguyên hơn, giúp tăng chi phí offline guessing. Password là secret input nên không được lưu plaintext cạnh record. Parameter value cần được version/calibrate theo hardware và policy; giá trị bounded trong demo không nên được copy làm production recommendation.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 13.KeyDerivation/KeyDerivation.md
      anchor: salt-and-work-factor
    apiRelated:
