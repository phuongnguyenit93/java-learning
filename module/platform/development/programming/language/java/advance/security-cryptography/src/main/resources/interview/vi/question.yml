  - question: So sánh digest, MAC và digital signature theo trust model. Khi nào verifier có thể tự tạo một giá trị xác thực hợp lệ và tại sao điều đó quan trọng?
    answer: >-
      Digest không dùng key nên bất kỳ ai có dữ liệu đều có thể tính lại; authenticity chỉ tồn tại nếu digest reference được bảo vệ bởi một trust mechanism khác. MAC dùng shared secret, vì vậy mọi holder của secret thường vừa verify vừa tạo được tag hợp lệ. Digital signature tách quyền: private key tạo chữ ký còn public key chỉ verify, nên verifier không cần có signing authority. Distinction này quyết định cơ chế phù hợp khi nhiều verifier phải kiểm tra dữ liệu nhưng không được quyền giả mạo signer.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 7.Mac/Mac.md
      anchor: mac-comparison
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: Một API AES-GCM trả AEADBadTagException sau khi ciphertext bị sửa. Bạn giải thích failure này thế nào, và vì sao nonce lifecycle vẫn quan trọng dù tag có tồn tại?
    answer: >-
      AEADBadTagException nghĩa là ciphertext/AAD/tag không còn xác minh thành công; plaintext không nên được đưa vào business logic và record phải bị reject. Authentication tag không cứu được thiết kế nếu nonce bị reuse dưới cùng key: GCM dựa vào nonce uniqueness và reuse có thể phá cả confidentiality lẫn authentication assumptions. Vì vậy thiết kế ở môi trường thực tế cần vừa fail closed khi tag verification lỗi vừa quản lý nonce để không reuse dưới cùng key.
    aiGenerated: true
