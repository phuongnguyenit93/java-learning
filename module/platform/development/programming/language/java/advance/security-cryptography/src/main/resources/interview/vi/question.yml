questions:
  - question: Tại sao một thiết kế mật mã nên bắt đầu từ threat model và security goal thay vì bắt đầu bằng câu hỏi "dùng AES hay RSA"?
    answer: >-
      Thuật toán chỉ là công cụ; trước tiên phải biết tài sản nào cần bảo vệ, kẻ tấn công có thể đọc/sửa/replay/giả mạo đến đâu và hệ thống cần confidentiality, integrity hay authenticity. Từ mục tiêu đó mới chọn trust model, primitive, key model và Java API phù hợp. Nếu bắt đầu từ tên thuật toán, mã có thể dùng đúng API nhưng giải sai bài toán, ví dụ dùng encryption khi chỉ cần fingerprint hoặc dùng digest khi thực sự cần authenticity.
    aiGenerated: true
    reviewed: false
