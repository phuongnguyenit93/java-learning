      methodSignature: saltEffect()

  - question: >-
      "Keystore" và "truststore" có phải hai Java type hoặc hai file format bắt buộc khác nhau không? Liên hệ câu trả lời với KeyManager và TrustManager.
    answer: >-
      Không. Hai tên chủ yếu mô tả role. Local identity store thường chứa PrivateKeyEntry cùng certificate chain để KeyManager chọn credentials trình bày với peer; trust store thường chứa TrustedCertificateEntry để TrustManager đánh giá peer. Cả hai có thể là cùng KeyStore type như PKCS12. Tách thành hai store vật lý thường giúp operations và least privilege rõ hơn, nhưng đó là deployment choice chứ không phải Java type rule.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 14.KeyStore/KeyStore.md
      anchor: keystore-vs-truststore
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: Phân biệt certification-path validation, trust anchor và endpoint identity verification trong TLS client. Vì sao "certificate được CA tin cậy" vẫn chưa đủ?
    answer: >-
      Certification-path validation kiểm leaf/intermediate chain có dẫn tới một trust anchor được cấu hình và thỏa PKIX policy hay không; trust anchor là local trusted input, không phải certificate nằm bên trong CertPath được validate. Endpoint identity verification trả lời câu hỏi khác: certificate có đại diện đúng hostname/endpoint mà client định kết nối không. Một certificate có chain hợp lệ cho attacker.example vẫn không đúng cho api.example. TLS client cần cả trust validation lẫn identity verification; revocation policy còn là concern riêng nếu hệ thống yêu cầu kiểm trạng thái certificate.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: ""
      anchor: ""
