  - question: Sau khi nâng JDK, TLS handshake cũ bắt đầu fail dù cipher suite vẫn được set trong SSLParameters. Bạn sẽ phân tích và điều tra theo thứ tự nào?
    answer: >-
      Không giả định "đã enable là chắc chắn dùng được". Kiểm tra lần lượt provider có hỗ trợ service/cipher không, protocol/cipher suite có được enable ở SSLParameters không, JDK security properties hoặc disabled-algorithm rules có chặn algorithm/key size không, certificate/key có vi phạm constraint mới không và peer có capability tương thích không. Nếu failure đến từ security policy mới, hướng xử lý ưu tiên là nâng certificate/key/protocol/config thay vì nới lỏng JVM-wide constraint chỉ để handshake chạy lại.
    aiGenerated: true
    reviewed: false
