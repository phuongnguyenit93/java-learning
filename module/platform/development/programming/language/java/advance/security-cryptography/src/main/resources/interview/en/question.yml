questions:
  - question: Why should a cryptographic design start from the threat model and security goal instead of starting with "AES or RSA"?
    answer: >-
      An algorithm is only a tool. First identify the asset, what an attacker can read, modify, replay, or impersonate, and whether the system needs confidentiality, integrity, or authenticity. From that goal, choose the trust model, primitive, key model, and Java API. Starting from an algorithm name can produce code that uses an API correctly but solves the wrong problem, such as encrypting when only a fingerprint is needed or using a digest when authenticity is actually required.
    aiGenerated: true
