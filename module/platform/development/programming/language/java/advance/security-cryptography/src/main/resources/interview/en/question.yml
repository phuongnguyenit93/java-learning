      methodSignature: ""

  - question: KeyAgreement and the Java 21 KEM API can both establish shared secret material. Explain their different interaction models and why neither one authenticates the peer by itself.
    answer: >-
      With KeyAgreement, each participant commonly combines its own private key with peer public information to compute the same shared secret. With a KEM, the sender uses the receiver public key to encapsulate and obtains a secret key plus an encapsulation message; the receiver uses the private key to decapsulate that message and recover the same secret. Both solve secret establishment, not public-key identity. A protocol still needs certificates, signatures, or another authenticated binding, and the raw secret commonly feeds a KDF or key schedule before becoming a traffic or application key.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 12.KeyEstablishment/KeyEstablishment.md
      anchor: agreement-vs-kem
    apiRelated:
      controller: KeyEstablishmentExperimentController
      methodSignature: compare()

  - question: What different problems do salt and work factor solve in password-based key derivation? Why can salt be stored with the record while the password must not be?
    answer: >-
      Salt makes the same password in different records derive to different outputs and reduces reuse of shared precomputation; it need not be secret, so it is stored with the KDF identifier, version, and parameters needed to derive again. The work factor makes every password guess more expensive and therefore raises the cost of offline guessing. The password is the secret input and must not be stored in plaintext with the record. Parameter values should be calibrated and versioned for current hardware and policy; a bounded demo value is not a production recommendation.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 13.KeyDerivation/KeyDerivation.md
      anchor: salt-and-work-factor
    apiRelated:
      controller: KeyDerivationExperimentController
      methodSignature: saltEffect()

  - question: Are "keystore" and "truststore" two mandatory Java types or file formats? Relate the answer to KeyManager and TrustManager.
    answer: >-
      No. The names primarily describe roles. A local identity store commonly contains a PrivateKeyEntry with its certificate chain so a KeyManager can choose credentials to present to the peer. A trust store commonly contains TrustedCertificateEntry values used by a TrustManager when evaluating the peer. Both can use the same KeyStore type such as PKCS12. Physically separating them often improves operations and least privilege, but that is a deployment choice rather than a Java type rule.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 14.KeyStore/KeyStore.md
