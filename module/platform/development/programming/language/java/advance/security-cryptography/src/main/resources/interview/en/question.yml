      methodSignature: ""

  - question: Distinguish certification-path validation, a trust anchor, and endpoint identity verification in a TLS client. Why is "the certificate chains to a trusted CA" still insufficient?
    answer: >-
      Certification-path validation checks whether the leaf and intermediate chain leads to a configured trust anchor and satisfies PKIX policy. The trust anchor is a separate local trusted input, not a certificate inside the CertPath being validated. Endpoint identity verification answers another question: whether the certificate represents the hostname or endpoint the client intended to reach. A valid chain for attacker.example is still wrong for api.example. A TLS client needs both trust validation and identity verification, while revocation policy is an additional concern when the system requires certificate-status checking.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: ""
      anchor: ""
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: After a JDK upgrade, an old TLS handshake starts failing even though the cipher suite is still configured in SSLParameters. How would you reason through and investigate the failure?
    answer: >-
      Do not assume that "enabled" means "permitted and usable." Check whether the provider implements the service or cipher, whether the protocol and suite are enabled in SSLParameters, whether JDK security properties or disabled-algorithm rules reject the algorithm or key size, whether the certificate or key violates a newer constraint, and whether the peer supports a compatible choice. If a newer security policy is the cause, prefer updating certificates, keys, protocols, or configuration rather than weakening JVM-wide constraints merely to restore the handshake.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 16.TlsJsse/TlsJsse.md
      anchor: tls-algorithm-constraints
    apiRelated:
      controller: ""
      methodSignature: ""
