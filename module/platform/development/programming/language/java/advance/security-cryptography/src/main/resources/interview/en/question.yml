  - question: Explain delayed provider selection in JCA. Why is it useful for HSM or token keys, and when should an application pin a provider explicitly?
    answer: >-
      For engines such as Signature, Cipher, Mac, and KeyAgreement, getInstance(...) may not commit to the final provider immediately. The JDK can wait until init(...) supplies the Key and then choose a provider that can actually process that key. This matters for non-exportable HSM or token keys because the provider holding the key may have to perform the operation. Pin a provider when there is a concrete technical or compliance requirement; otherwise flexible provider selection usually improves portability. Once one engine instance has selected a provider, obtain a new engine instance if provider selection must be reconsidered for another key.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 3.ProvidersAlgorithms/ProvidersAlgorithms.md
      anchor: provider-selection
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: What security contract distinguishes SecureRandom from Random, and why can manually calling setSeed(...) with a timestamp make the design worse rather than safer?
    answer: >-
      SecureRandom is used when output must be difficult for an attacker to predict, while Random serves ordinary pseudo-random application needs. For a PRNG-based SecureRandom, if setSeed(...) is called before the first output or self-seeding event, the caller is responsible for supplying enough entropy. Timestamps, user identifiers, and constants are predictable inputs and can weaken the unpredictability assumption. In ordinary application code, letting the JDK or provider manage seeding is safer than "seeding for safety" with invented predictable data.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 4.SecureRandom/SecureRandom.md
      anchor: entropy-and-seeding
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: Compare a digest, a MAC, and a digital signature by trust model. When can the verifier itself create an equally valid authentication value, and why does that matter?
    answer: >-
      A digest has no key, so anyone with the data can recompute it; authenticity exists only if the reference is protected by another trust mechanism. A MAC uses a shared secret, so every secret holder can normally both verify and create valid tags. A digital signature separates authority: the private key signs while a public key verifies, so a verifier does not need signing authority. That distinction determines the right mechanism when many parties must validate data without gaining the ability to impersonate the signer.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: 7.Mac/Mac.md
      anchor: mac-comparison
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: An AES-GCM API throws AEADBadTagException after ciphertext is modified. How do you explain that failure, and why does nonce lifecycle still matter even though an authentication tag exists?
    answer: >-
      AEADBadTagException means the ciphertext, AAD, and tag no longer authenticate successfully. Plaintext should not be released to business logic and the record must be rejected. The tag does not repair nonce misuse: GCM relies on nonce uniqueness under a key, and reuse can break confidentiality and authentication assumptions. A production design therefore needs both fail-closed behavior on tag verification failure and a nonce strategy that prevents reuse under the same key.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: ""
      anchor: ""
    apiRelated:
