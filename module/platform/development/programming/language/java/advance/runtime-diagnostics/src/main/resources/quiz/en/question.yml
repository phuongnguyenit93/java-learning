# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: runtime-diagnostics-q01-evidence-vs-root-cause
    question: "A dashboard shows high latency and 85% heap usage during an incident. What is the best next diagnostic step?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.MentalModel/RuntimeDiagnostics.md"
      anchor: "diagnostic-reasoning-loop"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Take a heap dump immediately and use the largest class population as the leading cause because the heap metric is already elevated."
        explanation: "Incorrect. A heap dump may be useful later, but one utilization snapshot does not yet justify an invasive artifact or identify the largest class as causal."
      - id: B
        answer: "Watch only the next GC cycle; if heap usage drops afterward, memory can be removed from the incident hypothesis without checking other signals."
        explanation: "Incorrect. A post-GC drop is useful evidence but does not by itself explain latency or rule out allocation/GC pressure during the incident window."
      - id: C
        answer: "The snapshot is symptom-level evidence; a testable hypothesis still needs time-correlated evidence before declaring a root cause."
        explanation: "Correct. Runtime diagnosis moves from symptom to hypothesis and then uses additional evidence to support or falsify that hypothesis."
      - id: D
        answer: "Start a profiling recording and postpone log/metric correlation until it finishes because a runtime timeline should be interpreted independently first."
        explanation: "Incorrect. JFR can be useful, but delaying correlation with existing time-aligned evidence weakens rather than strengthens the diagnostic loop."
    correctAnswerId: C

  - id: runtime-diagnostics-q02-low-impact-thread-evidence
    question: "You suspect request stalls from lock contention on a live JVM. Which first collection best follows the low-impact-first diagnostic approach?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.TroubleshootingWorkflow/TroubleshootingWorkflow.md"
      anchor: "collect-low-impact-first"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Capture a full heap dump first because the object graph is the most complete source for diagnosing thread lock relationships."
        explanation: "Incorrect. A heap dump is much more invasive and is not the most direct first evidence for suspected lock contention."
      - id: B
        answer: "Capture a short series of thread dumps for the correct PID and time window after checking the command's runtime impact."
        explanation: "Correct. Thread evidence directly addresses the liveness hypothesis and repeated snapshots add a time dimension without jumping immediately to a heavier artifact."
      - id: C
        answer: "Run GC.class_histogram repeatedly because class populations identify which thread owns a monitor and which threads are blocked."
        explanation: "Incorrect. A class histogram describes object populations, not thread owner/waiter relationships."
      - id: D
        answer: "Start a profile-style JFR recording first and defer thread dumps until it ends because a timeline should replace snapshot evidence for lock questions."
        explanation: "Incorrect. JFR may complement the investigation, but direct bounded thread evidence is a cheaper first test of the specific lock-contention hypothesis."
    correctAnswerId: B

  - id: runtime-diagnostics-q03-virtual-thread-management-boundary
    question: "On Java 21, an application uses many virtual threads but ThreadMXBean reports far fewer threads. What is the correct interpretation?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.ThreadDiagnostics/ThreadDiagnostics.md"
      anchor: "platform-vs-virtual-thread-diagnostics"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "ThreadMXBean samples virtual threads, so a lower count means most virtual threads happened to be inactive when the bean was queried."
        explanation: "Incorrect. Java 21 ThreadMXBean does not support monitoring or management of virtual threads."
      - id: B
        answer: "ThreadMXBean counts virtual threads only when they are mounted, so the count represents the carrier threads currently executing them."
        explanation: "Incorrect. The platform management interface is defined around platform threads rather than a mounted-only count of virtual threads."
      - id: C
        answer: "The difference means the virtual threads have already terminated because live Thread instances are expected to appear in ThreadMXBean."
        explanation: "Incorrect. That assumption ignores the explicit Java 21 management boundary for virtual threads."
      - id: D
        answer: "ThreadMXBean monitors platform threads, not virtual threads, so virtual-thread-aware dumps or JFR evidence are needed for that population."
        explanation: "Correct. Java 21 documents ThreadMXBean as a platform-thread management interface and excludes virtual-thread monitoring."
    correctAnswerId: D

  - id: runtime-diagnostics-q04-contention-not-deadlock
    question: "The thread-contention experiment returns started=true and waiterStateAtResponse=BLOCKED. What has that observation established?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.ThreadDiagnostics/ThreadDiagnostics.md"
      anchor: "locks-deadlocks-and-contention"
    apiRelated:
      controller: "RuntimeDiagnosticsExperimentController"
      methodSignature: "threadContention(int)"
    answers:
      - id: A
        answer: "A deadlock has been proven because any BLOCKED thread means no thread in the monitor relationship can make progress."
        explanation: "Incorrect. A blocked waiter can resume when the current owner releases the monitor; deadlock requires a non-progressing dependency cycle."
      - id: B
        answer: "Bounded monitor contention is present; proving deadlock would require evidence of a wait cycle in which the involved threads cannot progress."
        explanation: "Correct. The experiment deliberately creates contention with a holder that eventually releases the monitor, not a deadlock cycle."
      - id: C
        answer: "The monitor owner is CPU-bound because holding a Java monitor implies that the owner continuously consumes a platform thread."
        explanation: "Incorrect. Monitor ownership says nothing by itself about CPU utilization; the holder may sleep or block while still owning the monitor."
      - id: D
        answer: "The waiter is in Object.wait semantics because BLOCKED and WAITING describe the same monitor state using different dump formats."
        explanation: "Incorrect. BLOCKED means waiting to enter a monitor; WAITING is a different Thread.State with different causes."
    correctAnswerId: B

  - id: runtime-diagnostics-q05-histogram-retention
    question: "During heap-retention, DiagnosticRetainedPayload appears in GC.class_histogram. After the window expires, heap-used does not immediately fall. Which explanation is best?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.HeapGcDiagnostics/HeapGcDiagnostics.md"
      anchor: "class-histogram"
    apiRelated:
      controller: "RuntimeDiagnosticsExperimentController"
      methodSignature: "heapRetention(int,int)"
    answers:
      - id: A
        answer: "The payload objects may be unreachable, but their byte arrays stay strongly reachable through the payload fields until a separate cleanup clears each array."
        explanation: "Incorrect. Reachability is transitive; once the payload object itself is unreachable, its byte array is not kept alive merely because it is a field."
      - id: B
        answer: "The result is better classified as allocation pressure than retention because a real retention problem would keep heap-used increasing after references are cleared."
        explanation: "Incorrect. The observation does not establish either mechanism; cleanup timing and one heap-used value cannot classify the earlier retention behavior."
      - id: C
        answer: "The payloads may only have become eligible for collection; a leak conclusion still requires retention and trend evidence beyond one histogram."
        explanation: "Correct. The experiment controls strong reachability, while collection timing and leak diagnosis require additional evidence."
      - id: D
        answer: "The unchanged value is enough to conclude the payloads were promoted to a non-reclaimable region, so only a heap dump can make them collectible."
        explanation: "Incorrect. Generational placement does not make ordinary unreachable objects non-reclaimable, and taking a heap dump is not what makes them eligible for GC."
    correctAnswerId: C

  - id: runtime-diagnostics-q06-nmt-reserved-committed
    question: "NMT reports one subsystem as reserved=1 GB and committed=100 MB. How should those values be interpreted?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.NativeMemoryTracking/NativeMemoryTracking.md"
      anchor: "reserved-vs-committed"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The process is currently consuming the full 1 GB because reserved memory is the portion already backed for immediate JVM use."
        explanation: "Incorrect. Reserved address space can be much larger than the committed portion and should not be treated as current committed usage."
      - id: B
        answer: "The JVM reserved a larger address-space range while about 100 MB is committed; growth in committed memory is the more direct pressure signal."
        explanation: "Correct. NMT distinguishes address-space reservation from memory committed for use, so a large reservation alone is not equivalent to 1 GB of current committed memory."
      - id: C
        answer: "The 100 MB committed value is only a future limit, while reserved memory represents the amount already allocated by native malloc."
        explanation: "Incorrect. This reverses the roles of reserved and committed memory."
      - id: D
        answer: "Reserved and committed should normally be equal; a large difference means NMT is missing third-party native allocations in that subsystem."
        explanation: "Incorrect. A large reserved-versus-committed difference can be normal and does not by itself identify an NMT coverage gap."
    correctAnswerId: B

  - id: runtime-diagnostics-q07-jfr-cpu-sampling
    question: "A JFR recording from jfr-cpu-window contains many jdk.ExecutionSample events whose stack includes runCpuLoop. What is the strongest conclusion?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.JFR/JFR.md"
      anchor: "cpu-thread-lock-analysis"
    apiRelated:
      controller: "RuntimeDiagnosticsExperimentController"
      methodSignature: "jfrCpuWindow(int)"
    answers:
      - id: A
        answer: "The sample distribution can be converted directly into exact per-method CPU milliseconds once total JVM CPU time for the window is known."
        explanation: "Incorrect. Sampling supports statistical hot-path analysis, not exact reconstruction of per-method CPU accounting."
      - id: B
        answer: "Frequent samples establish that runCpuLoop used CPU, and an isolated experiment therefore also proves any concurrent latency was caused by that method."
        explanation: "Incorrect. The first part is useful evidence, but causal attribution to another symptom still requires time correlation and competing-hypothesis checks."
      - id: C
        answer: "The worker was frequently executing when samples were taken, providing statistical evidence that this code path was hot during that window."
        explanation: "Correct. JFR execution sampling identifies frequently observed execution paths over time without claiming exact nanosecond accounting."
      - id: D
        answer: "ExecutionSample density primarily measures runnable-queue delay, so repeated samples indicate scheduling pressure rather than code execution."
        explanation: "Incorrect. Execution sampling observes threads running code; scheduling delay is not what repeated method samples directly measure."
    correctAnswerId: C

  - id: runtime-diagnostics-q08-mxbean-standard-extension
    question: "Why does the MXBean snapshot API separate operatingSystem from jdkOperatingSystemExtension?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.ManagementJMX/ManagementJMX.md"
      anchor: "platform-management-surfaces"
    apiRelated:
      controller: "RuntimeDiagnosticsExperimentController"
      methodSignature: "mxBeanSnapshot()"
    answers:
      - id: A
        answer: "The first object comes from JMX while the extension comes from JFR, so they have unrelated collection and lifecycle semantics."
        explanation: "Incorrect. Both values are read through management interfaces; JFR is not the source of the extension metrics."
      - id: B
        answer: "The extension is the primary Java SE contract, while the standard interface mainly preserves compatibility with earlier management clients."
        explanation: "Incorrect. java.lang.management.OperatingSystemMXBean is the standard Java SE interface; com.sun.management is the JDK extension."
      - id: C
        answer: "The two objects represent different operating systems: one describes the host and the extension describes only a container guest OS."
        explanation: "Incorrect. The distinction is API portability and additional JDK-specific metrics, not host-versus-container identity."
      - id: D
        answer: "The standard interface is portable Java SE management data, while com.sun.management adds JDK-specific CPU and memory metrics when available."
        explanation: "Correct. Separating them prevents JDK extension methods from being presented as part of the standard Java SE contract."
    correctAnswerId: D

  - id: runtime-diagnostics-q09-jhsdb-live-attach
    question: "A JVM is still responsive and ordinary live diagnostic tools are available. Why is attaching jhsdb directly to that live PID not the normal first choice?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.CrashPostmortemDiagnostics/CrashPostmortemDiagnostics.md"
      anchor: "core-dump-and-jhsdb"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Serviceability Agent live attachment hangs the target and the process may crash on detach, so safer live tools should be preferred first."
        explanation: "Correct. Oracle documents jhsdb as experimental/unsupported and warns specifically about the effect of attaching it to a live process."
      - id: B
        answer: "Live attachment is appropriate when the same OS user can attach; the documented hang behavior applies only when jhsdb opens a core dump."
        explanation: "Incorrect. The live-process warning is specifically about attaching Serviceability Agent to a running process, not about core-file analysis."
      - id: C
        answer: "Read-only jhsdb modes such as jstack or jmap are safe on a live PID; the detach crash risk applies only to debugd mode."
        explanation: "Incorrect. Oracle's live-attach warning is not limited to debugd; Serviceability Agent attachment itself is invasive."
      - id: D
        answer: "The main limitation is reduced symbol/detail quality on a live JVM; the target continues normally, so jhsdb is reasonable when jcmd output is insufficient."
        explanation: "Incorrect. The primary concern is not merely output quality: live Serviceability Agent attachment stops normal target progress and can destabilize the process."
    correctAnswerId: A

  - id: runtime-diagnostics-q10-preserve-before-restart
    question: "A restart is likely to restore service, and the SLA allows a short diagnostic window first. Which sequence best preserves diagnostic value?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.TroubleshootingWorkflow/TroubleshootingWorkflow.md"
      anchor: "preserve-before-restart"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Save logs and JVM flags, restart to restore service, then use thread/JFR evidence from the new process to reconstruct the transient failure."
        explanation: "Incorrect. Logs and flags are valuable, but post-restart thread/JFR state cannot reconstruct many transient conditions from the failed process."
      - id: B
        answer: "Capture heap and core dumps before restart whenever any diagnostic window exists, because irreproducibility outweighs pause and disk risk."
        explanation: "Incorrect. Heavy artifacts are justified only by the hypothesis and impact budget; indiscriminate collection can worsen the incident."
      - id: C
        answer: "Take one low-impact snapshot, restart immediately, and rely on monitoring history afterward instead of spending the window on repeated/correlated evidence."
        explanation: "Incorrect. A single snapshot may miss the time dimension, while selected volatile evidence can be impossible to recover after restart."
      - id: D
        answer: "Identify the exact process/time window, preserve the most valuable volatile evidence at acceptable cost, then restart and correlate artifacts afterward."
        explanation: "Correct. This balances recovery with evidence preservation and keeps PID/time identity for later reasoning."
    correctAnswerId: D
