    answers:
      - id: A
        answer: "Lưu log và JVM flags, restart để phục hồi service, rồi dùng thread/JFR evidence của process mới để reconstruct failure tạm thời."
        explanation: "Sai. Log/flags vẫn có giá trị, nhưng thread/JFR state sau restart không thể tái dựng nhiều transient condition của process lỗi."
      - id: B
        answer: "Lấy heap và core dump trước restart mỗi khi còn diagnostic window vì tính khó tái hiện luôn quan trọng hơn pause và disk risk."
