    apiRelated:
      controller: "RuntimeDiagnosticsExperimentController"
      methodSignature: "jfrCpuWindow(int)"
    answers:
      - id: A
        answer: "Có thể đổi trực tiếp sample distribution thành exact per-method CPU milliseconds nếu đã biết tổng JVM CPU time của window."
        explanation: "Sai. Sampling hỗ trợ statistical hot-path analysis chứ không tái dựng exact per-method CPU accounting."
      - id: B
        answer: "Frequent samples chứng minh runCpuLoop dùng CPU, và vì experiment isolated nên cũng chứng minh mọi latency xảy ra cùng lúc đều do method này."
        explanation: "Sai. Phần đầu là evidence hữu ích, nhưng causal attribution tới symptom khác vẫn cần time correlation và kiểm tra competing hypothesis."
      - id: C
        answer: "Worker thường xuyên đang execute tại thời điểm sample được lấy, nên có bằng chứng thống kê rằng code path này nóng trong window đó."
        explanation: "Đúng. JFR execution sampling giúp nhận diện execution path thường xuyên được quan sát theo thời gian nhưng không khẳng định accounting tuyệt đối."
      - id: D
        answer: "ExecutionSample density chủ yếu đo runnable-queue delay, nên sample lặp lại chỉ scheduling pressure chứ không phải code đang execute."
        explanation: "Sai. Execution sampling quan sát thread đang chạy code; scheduling delay không phải thứ repeated method samples trực tiếp đo."
    correctAnswerId: C

