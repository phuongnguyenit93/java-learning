questions:
  - id: runtime-diagnostics-q01-evidence-vs-root-cause
    question: "Dashboard cho thấy latency cao và heap usage 85% trong lúc xảy ra sự cố. Bước chẩn đoán tiếp theo phù hợp nhất là gì?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.MentalModel/RuntimeDiagnostics.md"
      anchor: "diagnostic-reasoning-loop"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Lấy heap dump ngay và dùng class population lớn nhất làm nguyên nhân chính vì heap metric đã ở mức cao."
        explanation: "Sai. Heap dump có thể cần về sau, nhưng một utilization snapshot chưa đủ để biện minh cho artifact nặng hoặc xem class lớn nhất là causal."
      - id: B
        answer: "Chỉ theo dõi chu kỳ GC kế tiếp; nếu heap giảm thì có thể bỏ memory khỏi incident hypothesis mà không cần kiểm tra signal khác."
        explanation: "Sai. Heap giảm sau GC là evidence hữu ích nhưng chưa giải thích latency và cũng không loại trừ allocation/GC pressure trong symptom window."
      - id: C
        answer: "Snapshot mới chỉ là bằng chứng ở mức triệu chứng; cần giả thuyết kiểm chứng được và bằng chứng có tương quan theo thời gian trước khi kết luận root cause."
        explanation: "Đúng. Runtime diagnosis đi từ triệu chứng → giả thuyết → thu thập thêm bằng chứng để xác nhận hoặc bác bỏ giả thuyết."
      - id: D
        answer: "Bắt đầu profile recording và hoãn correlate log/metric cho tới khi recording xong vì runtime timeline nên được đọc độc lập trước."
        explanation: "Sai. JFR có thể hữu ích, nhưng trì hoãn correlate với evidence đã có trong cùng time window làm reasoning yếu hơn."
    correctAnswerId: C

  - id: runtime-diagnostics-q02-low-impact-thread-evidence
    question: "Bạn nghi request bị treo vì lock contention trên một JVM đang chạy. Thu thập nào phù hợp nhất với nguyên tắc low-impact-first?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.TroubleshootingWorkflow/TroubleshootingWorkflow.md"
      anchor: "collect-low-impact-first"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Lấy full heap dump trước vì object graph là nguồn đầy đủ nhất để xác định quan hệ lock giữa các thread."
        explanation: "Sai. Heap dump nặng hơn nhiều và không phải bằng chứng trực tiếp đầu tiên cho giả thuyết lock contention."
      - id: B
        answer: "Lấy một chuỗi ngắn thread dump của đúng PID và đúng time window sau khi kiểm tra impact của command."
        explanation: "Đúng. Thread evidence trả lời trực tiếp giả thuyết liveness; nhiều snapshot bổ sung yếu tố thời gian mà chưa cần nhảy ngay sang artifact nặng hơn."
      - id: C
        answer: "Chạy GC.class_histogram lặp lại vì class population cho biết thread nào giữ monitor và thread nào đang bị block."
        explanation: "Sai. Class histogram mô tả population của object, không mô tả quan hệ owner/waiter giữa các thread."
      - id: D
        answer: "Bắt đầu một profile-style JFR recording trước và hoãn thread dump tới khi recording kết thúc vì timeline nên thay snapshot cho bài toán lock."
        explanation: "Sai. JFR có thể bổ sung evidence, nhưng bounded thread dump là phép kiểm tra trực tiếp và rẻ hơn cho giả thuyết lock contention cụ thể này."
    correctAnswerId: B

  - id: runtime-diagnostics-q03-virtual-thread-management-boundary
    question: "Trên Java 21, ứng dụng dùng rất nhiều virtual thread nhưng ThreadMXBean báo số thread nhỏ hơn nhiều. Cách hiểu đúng là gì?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.ThreadDiagnostics/ThreadDiagnostics.md"
      anchor: "platform-vs-virtual-thread-diagnostics"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "ThreadMXBean chỉ sample virtual thread, nên count thấp nghĩa là phần lớn virtual thread đang inactive đúng lúc bean được đọc."
        explanation: "Sai. Trong Java 21, ThreadMXBean không hỗ trợ monitoring/management virtual thread."
      - id: B
        answer: "ThreadMXBean chỉ tính virtual thread khi đang mounted, nên count chính là số carrier thread hiện đang chạy chúng."
        explanation: "Sai. Management interface này được định nghĩa quanh platform thread, không phải mounted-only count của virtual thread."
      - id: C
        answer: "Chênh lệch đó nghĩa là các virtual thread đã kết thúc vì Thread còn sống được kỳ vọng sẽ xuất hiện trong ThreadMXBean."
        explanation: "Sai. Kết luận đó bỏ qua boundary quản lý virtual thread được Java 21 quy định rõ."
      - id: D
        answer: "ThreadMXBean quản lý platform thread chứ không quản lý virtual thread; cần dùng dump/JFR có nhận biết virtual thread để quan sát population đó."
        explanation: "Đúng. Java 21 quy định ThreadMXBean là management interface cho platform thread và không hỗ trợ quản lý virtual thread."
    correctAnswerId: D

  - id: runtime-diagnostics-q04-contention-not-deadlock
    question: "Experiment thread-contention trả started=true và waiterStateAtResponse=BLOCKED. Observation đó chứng minh điều gì?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.ThreadDiagnostics/ThreadDiagnostics.md"
      anchor: "locks-deadlocks-and-contention"
    apiRelated:
      controller: "RuntimeDiagnosticsExperimentController"
      methodSignature: "threadContention(int)"
    answers:
      - id: A
        answer: "Deadlock đã được chứng minh vì chỉ cần có một thread ở BLOCKED là toàn bộ quan hệ monitor không thể tiến triển."
        explanation: "Sai. Waiter bị block vẫn có thể tiếp tục khi owner nhả monitor; deadlock cần một dependency cycle không thể tiến triển."
      - id: B
        answer: "Đang có bounded monitor contention; muốn chứng minh deadlock cần bằng chứng về wait cycle khiến các thread liên quan không thể tiến triển."
        explanation: "Đúng. Experiment cố tình tạo contention với holder cuối cùng sẽ nhả monitor, không tạo deadlock cycle."
      - id: C
        answer: "Monitor owner đang CPU-bound vì cứ giữ Java monitor thì thread đó phải liên tục chiếm platform thread."
        explanation: "Sai. Monitor ownership không tự nói lên CPU utilization; owner có thể sleep hoặc block trong lúc vẫn giữ monitor."
      - id: D
        answer: "Waiter thực chất đang ở Object.wait semantics vì BLOCKED và WAITING chỉ là hai cách hiển thị cùng một monitor state."
        explanation: "Sai. BLOCKED là chờ vào monitor; WAITING là một Thread.State khác với nguyên nhân khác."
    correctAnswerId: B

  - id: runtime-diagnostics-q05-histogram-retention
    question: "Trong heap-retention, DiagnosticRetainedPayload xuất hiện trong GC.class_histogram. Sau khi window hết hạn, heap-used không giảm ngay. Giải thích nào đúng nhất?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.HeapGcDiagnostics/HeapGcDiagnostics.md"
      anchor: "class-histogram"
    apiRelated:
      controller: "RuntimeDiagnosticsExperimentController"
      methodSignature: "heapRetention(int,int)"
    answers:
      - id: A
        answer: "Payload có thể đã unreachable nhưng các byte array vẫn strong-reachable qua field của payload cho tới khi có cleanup riêng clear từng array."
        explanation: "Sai. Reachability mang tính bắc cầu; khi chính payload không còn reachable thì byte array của nó không được giữ sống chỉ vì là một field."
      - id: B
        answer: "Kết quả này phù hợp với allocation pressure hơn retention vì retention thật sẽ tiếp tục làm heap-used tăng sau khi reference được clear."
        explanation: "Sai. Observation này chưa phân loại được hai mechanism; cleanup timing và một giá trị heap-used không đủ để mô tả retention trước đó."
      - id: C
        answer: "Payload có thể mới chỉ trở thành eligible for GC; kết luận leak vẫn cần retention và trend evidence ngoài một histogram đơn lẻ."
        explanation: "Đúng. Experiment chỉ kiểm soát strong reachability; thời điểm collection và leak diagnosis cần thêm bằng chứng."
      - id: D
        answer: "Heap-used không đổi đủ để kết luận payload đã được promote vào vùng không reclaim được, nên phải lấy heap dump trước khi GC có thể thu hồi."
        explanation: "Sai. Object unreachable bình thường không trở thành non-reclaimable chỉ vì generational placement, và heap dump không làm object eligible for GC."
    correctAnswerId: C

  - id: runtime-diagnostics-q06-nmt-reserved-committed
    question: "NMT báo một subsystem có reserved=1 GB và committed=100 MB. Cách diễn giải nào đúng?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.NativeMemoryTracking/NativeMemoryTracking.md"
      anchor: "reserved-vs-committed"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Process đang dùng đủ 1 GB vì reserved memory là phần đã được backing sẵn để JVM dùng ngay."
        explanation: "Sai. Reserved address space có thể lớn hơn nhiều phần committed và không nên được hiểu như current committed usage."
      - id: B
        answer: "JVM đã reserve một vùng address space lớn hơn, còn khoảng 100 MB mới committed; xu hướng committed tăng là tín hiệu pressure trực tiếp hơn."
        explanation: "Đúng. NMT phân biệt address-space reservation với memory committed để sử dụng; reserved lớn không đồng nghĩa đang dùng đủ 1 GB committed."
      - id: C
        answer: "100 MB committed chỉ là giới hạn cho tương lai, còn reserved mới là lượng native malloc đã thực sự được cấp phát."
        explanation: "Sai. Cách nói này đảo ngược ý nghĩa của reserved và committed."
      - id: D
        answer: "Reserved và committed bình thường phải bằng nhau; chênh lệch lớn chứng minh NMT đang bỏ sót third-party native allocation."
        explanation: "Sai. Chênh lệch reserved/committed lớn có thể hoàn toàn bình thường và không tự chứng minh coverage gap của NMT."
    correctAnswerId: B

  - id: runtime-diagnostics-q07-jfr-cpu-sampling
    question: "Một JFR recording từ jfr-cpu-window có nhiều jdk.ExecutionSample với stack chứa runCpuLoop. Kết luận mạnh nhất là gì?"
