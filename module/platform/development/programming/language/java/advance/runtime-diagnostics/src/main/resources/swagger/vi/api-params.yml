durationMillis:
  summary: Thời lượng cửa sổ quan sát
  description: Thời lượng mong muốn tính bằng millisecond. Service luôn clamp giá
    trị thực tế vào 2000–15000 ms để thí nghiệm kết thúc tự động và không giữ CPU,
    monitor hoặc heap vô thời hạn.
  usage: true
megabytes:
  summary: Dung lượng heap muốn giữ tạm thời
  description: Số MiB mà heap-retention experiment yêu cầu giữ bằng DiagnosticRetainedPayload.
    Service clamp giá trị thực tế vào 1–16 MiB để tránh biến demo thành memory-pressure/OOME
    test không an toàn.
  usage: true
