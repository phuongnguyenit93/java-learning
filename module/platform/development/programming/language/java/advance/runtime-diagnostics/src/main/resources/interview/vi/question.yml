  - question: "Bạn sẽ điều tra một Java memory leak bị nghi ngờ thế nào để không nhầm allocation rate, heap occupancy và retention? Hãy giải thích vai trò của histogram, heap dump, bằng chứng GC/JFR và xu hướng theo thời gian."
    answer: "Tôi tách thành ba câu hỏi. Allocation rate hỏi object được tạo nhanh đến mức nào; heap occupancy hỏi hiện đang dùng bao nhiêu heap; retention hỏi object nào còn reachable lâu hơn kỳ vọng. Class histogram là một ảnh chụp population hữu ích, nhưng GC.class_histogram được JDK xếp là command có impact cao và chi phí phụ thuộc kích thước/nội dung heap, nên việc lấy histogram lặp lại phải có impact budget rõ ràng. Một class lớn vẫn chưa chứng minh leak. GC log và bằng chứng allocation/old-object từ JFR bổ sung chiều thời gian, giúp phân biệt high churn với live set đang tăng. Heap dump cung cấp object graph và retention path khi cần hiểu vì sao object vẫn reachable, nhưng cũng là artifact nặng hơn. Tôi luôn đối chiếu với workload và thay đổi deploy vì tăng trưởng dữ liệu hợp lệ cũng có thể trông giống leak. Tôi chỉ gọi đó là leak khi retention growth không được workload hợp lý giải thích và đường giữ tham chiếu thực sự hỗ trợ giả thuyết."
