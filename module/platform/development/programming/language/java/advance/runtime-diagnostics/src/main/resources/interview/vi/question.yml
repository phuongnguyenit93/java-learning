questions:
  - question: "Hãy mô tả một vòng suy luận chẩn đoán có kỷ luật từ triệu chứng bên ngoài tới một giả thuyết nguyên nhân gốc có thể bảo vệ được. Chi phí thu thập bằng chứng, tương quan thời gian và định danh tiến trình đích nằm ở đâu trong quy trình đó?"
    answer: "Tôi bắt đầu bằng cách gọi tên triệu chứng mà chưa biến nó thành nguyên nhân: ví dụ latency cao, CPU cao, RSS tăng hoặc request bị treo. Sau đó tôi tạo một giả thuyết có thể bị bác bỏ và chọn bằng chứng có chi phí thấp nhất nhưng vẫn đủ khả năng phân biệt giả thuyết đó với các nguyên nhân hợp lý khác. Mọi dữ liệu chẩn đoán phải gắn với đúng PID hoặc service instance và đúng khoảng thời gian của triệu chứng; nếu không thì dữ liệu có thể đúng về mặt kỹ thuật nhưng không liên quan. Tôi ưu tiên bằng chứng có tác động thấp trước, rồi chỉ nâng lên artifact nặng hơn khi giá trị chẩn đoán kỳ vọng xứng đáng với chi phí. Tôi đối chiếu nhiều nguồn độc lập thay vì coi một metric hay snapshot là bằng chứng đủ, đồng thời phải sửa hoặc bác bỏ giả thuyết khi dữ liệu không ủng hộ. Nguyên nhân gốc chỉ có ý nghĩa khi cơ chế được đề xuất giải thích được cả triệu chứng lẫn bằng chứng, không phải chỉ vì có một con số trông bất thường."
