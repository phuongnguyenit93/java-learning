  - question: "Hãy đi qua một quyết định troubleshooting trên production từ đầu đến cuối: phân loại triệu chứng, thu thập bằng chứng, đối chiếu, xác định lúc dừng và chuyển giao. Làm thế nào tránh biến Runtime Diagnostics thành nơi chịu trách nhiệm cho mọi vấn đề bên dưới?"
    answer: "Tôi phân loại triệu chứng đủ rộng để chọn nhóm bằng chứng chứ chưa coi bước phân loại là chẩn đoán. Tôi giữ đúng định danh tiến trình đích và khoảng thời gian, rồi thu bằng chứng có tác động thấp nhất nhưng vẫn trả lời được câu hỏi tiếp theo. Mỗi kết quả phải làm giả thuyết mạnh lên, yếu đi hoặc thay đổi; tôi đối chiếu nhiều tín hiệu độc lập từ cùng process và cùng khoảng thời gian thay vì gom artifact không liên quan. Chỉ nâng lên cách thu thập nặng hơn khi giá trị kỳ vọng lớn hơn rủi ro và chi phí, đồng thời bảo toàn trạng thái quan trọng trước restart nếu có thể. Tôi dừng khi bằng chứng đủ mạnh để xác định cơ chế hoặc khi câu hỏi tiếp theo thuộc lĩnh vực khác. GC/JIT mechanics chuyển sang JVM module, happens-before và locking correctness sang Concurrency, bytecode transformation sang Instrumentation, còn JNI/FFM/native-library semantics sang Native Interoperability. Một lần chuyển giao tốt phải mang theo bằng chứng, timeline, giả thuyết hiện tại và những gì đã loại trừ để nhóm phụ trách tiếp theo không phải bắt đầu từ số không."
