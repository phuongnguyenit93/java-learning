  - question: "MXBeans/JMX đóng vai trò gì trong chẩn đoán khi so với JFR, thread/heap dump và application metrics? Remote JMX làm mô hình rủi ro thay đổi ra sao?"
    answer: "Platform MXBeans cung cấp trạng thái runtime có cấu trúc như heap usage, số platform thread, class loading, GC counters, runtime identity và thông tin OS chuẩn. Chúng phù hợp cho polling nhẹ, snapshot và quản trị bằng code, nhưng một giá trị hiện tại không phải lời giải thích nhân quả. JFR bổ sung event timeline phong phú hơn; thread/heap dump cho bằng chứng sâu tại một thời điểm cho từng giả thuyết; application metrics cung cấp ngữ cảnh nghiệp vụ mà JVM management interface không biết. Tôi cũng phân biệt Java SE management interface chuẩn với JDK extension như com.sun.management.OperatingSystemMXBean. Remote JMX mở thêm một giao diện quản trị có thể đọc attribute và đôi khi invoke operation, nên authentication, bảo vệ đường truyền, network exposure và chi phí polling của client trở thành vấn đề cần quản lý trên production. Tôi không coi JMX đã bật là đồng nghĩa với observability đầy đủ."
