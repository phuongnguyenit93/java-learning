  - question: "Dùng experiment jfrCpuWindow, hãy giải thích cách chứng minh một code path đang CPU-hot bằng JFR. Vì sao cách này mạnh hơn một thread dump đơn lẻ, và nó vẫn chưa chứng minh điều gì?"
    answer: "Tôi start một JFR recording có execution sampling và có giới hạn, trigger jfrCpuWindow, rồi dùng worker name cùng expiration window mà API trả về để correlate recording với đúng workload. Trong recording tôi tìm các jdk.ExecutionSample lặp lại có stack chứa CPU loop. Như vậy tôi có observation phân bố theo thời gian thay vì chỉ một thời điểm như thread dump đơn lẻ. Nếu cùng code path xuất hiện thường xuyên trong symptom window, có bằng chứng tốt rằng nó hot tại các thời điểm được sample. Tuy nhiên tôi không biến nó thành exact nanosecond CPU accounting hoặc tự động kết luận incident causality: sample là thống kê, và hot path vẫn phải được correlate với triệu chứng bên ngoài. Tôi cũng chọn recording settings/duration có chủ đích vì một profile recording ngắn trong lab có impact budget khác với continuous default recording trên production."
