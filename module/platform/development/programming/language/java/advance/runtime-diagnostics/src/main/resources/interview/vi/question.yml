  - question: "Process RSS tiếp tục tăng trong khi Java heap sau GC tương đối ổn định. Bạn sẽ dùng Native Memory Tracking thế nào, và những kết luận nào phải tránh?"
    answer: "Triệu chứng đó đẩy điều tra ra ngoài Java heap. Nếu NMT đã được bật từ lúc JVM startup, tôi bắt đầu bằng summary rồi so reserved với committed theo từng subsystem. Reserved address space có thể lớn hơn committed rất nhiều, nên reserved lớn tự nó chưa phải memory-pressure signal. Với bài toán growth, tôi tạo baseline tại một điểm phù hợp — thường sau warm-up nếu muốn phân tích steady-state — rồi dùng summary.diff hoặc detail.diff để xem JVM category/call site nào tăng. Chỉ nâng từ summary sang detail khi câu hỏi cần vì detail nhiều dữ liệu và có chi phí cao hơn. Đồng thời phải giữ rõ boundary của NMT: nó theo dõi HotSpot/JVM native memory, không theo dõi arbitrary third-party native allocation hay Oracle JDK class-library allocation. Vì vậy NMT ổn định không loại trừ mọi nguồn native growth. Nếu RSS tăng mà NMT không giải thích được, tôi correlate với OS evidence và handoff sang native-memory tooling khi phù hợp."
