  - question: "JVM đã crash, hoặc bạn buộc phải restart để khôi phục service. Bạn sẽ bảo toàn bằng chứng nào trước, dùng hs_err/core/heap/JFR artifact ra sao sau đó, và jhsdb nằm ở đâu trong flow?"
    answer: "Trước restart, nếu service objective cho phép, tôi bảo toàn volatile evidence có thể biến mất: log gần thời điểm lỗi kèm timestamp, JFR dump hoặc continuous recording, thread evidence nếu process còn phản hồi, heap/native-memory evidence có liên quan, JVM flags/version và mọi fatal-error/core artifact đã tồn tại. hs_err cho biết nơi fatal failure được quan sát cùng process/thread/native context, nhưng problematic frame chưa tự động là root cause. Core dump hỗ trợ postmortem HotSpot/native sâu hơn khi có đúng executable/JDK build và symbol. OOME heap dump phục vụ object-graph analysis và khác bản chất với core dump của native crash. jhsdb/Serviceability Agent chủ yếu là công cụ postmortem hoặc chuyên biệt; attach vào live process là xâm lấn, có thể làm process hang và có khả năng crash khi detach. Nếu evidence chỉ sang JNI/FFM hoặc native-library lifetime/ABI, tôi handoff sang Native Interoperability cùng các artifact đã bảo toàn thay vì cố giải thích native semantics trong Runtime Diagnostics."
