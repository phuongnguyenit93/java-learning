  - question: "Request có vẻ bị stuck. Bạn sẽ phân biệt ordinary lock contention, deadlock, starvation hoặc external wait từ thread evidence như thế nào, và vì sao repeated dumps quan trọng? Hãy nêu cả boundary của virtual thread trên Java 21."
    answer: "Tôi đọc Thread.State và các top stack frame trong ngữ cảnh thay vì map một state trực tiếp thành lỗi. Thread ở BLOCKED có thể chỉ ra monitor contention, nhưng cần xem owner là ai và owner/waiter relationship có lặp lại hay không. Deadlock cần dependency cycle khiến các thread liên quan không thể tiến triển; contention kéo dài chưa tự động là deadlock. Repeated dumps thêm chiều thời gian: stack và lock relationship giữ nguyên trong khi workload đáng lẽ phải tiến triển sẽ làm liveness hypothesis mạnh hơn, còn stack thay đổi có thể cho thấy hệ thống vẫn đang chạy. Starvation, external I/O wait, executor saturation hoặc livelock có thể làm hệ thống không tiến triển hữu ích mà không tạo monitor deadlock. Trên Java 21, ThreadMXBean quản lý platform thread chứ không quản lý virtual thread, nên ứng dụng dùng nhiều virtual thread cần dump/JFR có nhận biết virtual thread thay vì xem MXBean count là toàn bộ population."
