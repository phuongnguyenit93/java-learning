  - question: "How would you investigate a suspected Java memory leak without confusing allocation rate, heap occupancy, and retention? Explain where histograms, heap dumps, GC/JFR evidence, and trends fit."
    answer: "I separate three questions. Allocation rate asks how quickly objects are created; heap occupancy asks how much heap is currently used; retention asks which objects remain reachable longer than expected. A class histogram is a useful population snapshot, but GC.class_histogram is documented as a high-impact command whose cost depends on heap size and content, so repeated collection must be budgeted deliberately. One large class still does not prove a leak. GC logs and JFR allocation or old-object evidence add a time dimension and help distinguish high churn from a growing live set. A heap dump provides the object graph and retention paths needed when I must understand why objects remain reachable, but it is also a heavier artifact. I correlate all of this with workload and deployment changes, because legitimate data growth can look like a leak. I call it a leak only when retention growth is unexplained by expected workload and the ownership/reference path supports that hypothesis."
    aiGenerated: true
    reviewed: false
    readmeRelated:
