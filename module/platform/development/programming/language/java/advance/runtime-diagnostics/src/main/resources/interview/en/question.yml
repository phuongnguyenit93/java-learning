  - question: "Requests appear stuck. How would you distinguish ordinary lock contention, deadlock, starvation or external waiting from thread evidence, and why are repeated dumps important? Include the Java 21 virtual-thread diagnostic boundary."
    answer: "I first read thread state and the top stack frames in context rather than mapping one state directly to a failure. BLOCKED threads can indicate monitor contention, but I look for the owner and whether the same owner/waiter relationship persists. Deadlock requires a dependency cycle in which the involved threads cannot progress; long contention is not automatically deadlock. Repeated dumps add the time dimension: unchanged stacks and lock relationships while work should be progressing strengthen a liveness hypothesis, whereas changing stacks may show that the system is still moving. Starvation, external I/O waits, executor saturation, or livelock may prevent useful progress without producing a monitor deadlock. On Java 21 I also remember that ThreadMXBean manages platform threads, not virtual threads, so a virtual-thread-heavy application needs virtual-thread-aware dumps or JFR evidence instead of treating MXBean counts as the complete thread population."
