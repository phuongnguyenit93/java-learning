  - question: "Process RSS keeps growing while post-GC Java heap remains stable. How would you use Native Memory Tracking, and what conclusions must you avoid?"
    answer: "That symptom moves the investigation beyond Java heap. If NMT was enabled at JVM startup, I start with summary data and compare reserved versus committed memory by subsystem. Reserved address space can be much larger than committed memory, so reservation alone is not the pressure signal I am looking for. For a growth investigation I create a baseline at a meaningful point, often after warm-up for steady-state analysis, then use summary.diff or detail.diff to see which JVM categories or call sites grow. I escalate from summary to detail only when the question needs it because detail has more data and cost. I also keep NMT's scope boundary explicit: it tracks HotSpot/JVM native memory, not arbitrary third-party native allocations or Oracle JDK class-library allocations, so stable NMT does not rule out all native growth. If RSS grows outside what NMT can explain, I correlate OS evidence and hand off to native-memory tooling when appropriate."
