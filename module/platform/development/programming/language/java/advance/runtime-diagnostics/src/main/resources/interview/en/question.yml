  - question: "Walk through an end-to-end production troubleshooting decision: symptom classification, evidence collection, correlation, stopping criteria, and handoff. How do you avoid turning Runtime Diagnostics into the owner of every underlying problem?"
    answer: "I first classify the symptom broadly enough to select an evidence family without pretending the classification is a diagnosis. I preserve target identity and the time window, then collect the lowest-impact evidence that can answer the next question. Each result either strengthens, weakens, or changes a hypothesis; I correlate independent signals from the same process and interval instead of accumulating unrelated artifacts. I escalate to heavier collection only when its expected value exceeds its risk and cost, and I preserve important state before a restart when possible. I stop when evidence is strong enough to identify the mechanism or when the next question belongs to another domain. GC/JIT mechanics go to the JVM module, happens-before and locking correctness to Concurrency, bytecode transformation to Instrumentation, and JNI/FFM/native-library semantics to Native Interoperability. A good handoff includes the evidence, timeline, current hypothesis, and what has already been ruled out so the next owner does not restart the investigation from zero."
