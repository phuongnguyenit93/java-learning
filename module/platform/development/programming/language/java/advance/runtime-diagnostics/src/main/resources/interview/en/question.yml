  - question: "A JVM has crashed, or you must restart it to recover service. What evidence would you preserve first, how would you use hs_err/core/heap/JFR artifacts afterward, and where does jhsdb fit?"
    answer: "Before restart, if the service objective allows it, I preserve volatile evidence that will disappear: recent logs with timestamps, a JFR dump or continuous recording, thread evidence when the process still responds, relevant heap/native-memory data, the exact JVM flags/version, and any existing fatal-error or core artifacts. An hs_err file tells me where the fatal failure was observed and includes process/thread/native context, but the problematic frame alone is not automatically the root cause. A core dump can support deeper HotSpot/native postmortem analysis when matched with the correct executable/JDK and symbols. An OOME heap dump supports object-graph analysis, but it is a different artifact from a native crash core. jhsdb/Serviceability Agent is primarily a postmortem or specialized tool; attaching it to a live process is invasive, can hang the process, and may crash it on detach. If the evidence points into JNI/FFM or native-library lifetime/ABI problems, I hand off to Native Interoperability with the preserved artifacts rather than trying to solve native semantics inside Runtime Diagnostics."
