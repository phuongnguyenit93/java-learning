  - question: "Using the jfrCpuWindow experiment, explain how you would prove that a code path is CPU-hot with JFR. Why is this stronger than one thread dump, and what does it still not prove?"
    answer: "I start a bounded JFR recording that includes execution sampling, trigger jfrCpuWindow, and use the returned worker name and expiration window to correlate the recording with the exact workload. In the recording I look for repeated jdk.ExecutionSample events whose stack contains the CPU loop. That gives a time-distributed statistical observation rather than the single instant captured by one thread dump. If the same path appears frequently during the symptom window, I have good evidence that it was hot at those sampled moments. I still do not claim exact nanosecond CPU accounting or automatic incident causality: samples are statistical, and a hot path must still be correlated with the external symptom. I also choose recording settings and duration deliberately because a short profile-style lab recording is not the same overhead budget as a continuous default recording in production."
    aiGenerated: true
