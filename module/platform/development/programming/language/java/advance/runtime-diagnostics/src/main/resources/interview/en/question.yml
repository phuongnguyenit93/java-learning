questions:
  - question: "Describe a disciplined runtime-diagnostics reasoning loop from an external symptom to a defensible root-cause hypothesis. Where do evidence cost, time correlation, and target-process identity enter the loop?"
    answer: "I start by naming the symptom without turning it into a cause: for example, high latency, high CPU, growing RSS, or stalled requests. Then I form a falsifiable hypothesis and choose the cheapest evidence that can distinguish that hypothesis from plausible alternatives. Every artifact is tied to the correct PID or service instance and to the symptom time window; otherwise technically valid data can still be irrelevant. I prefer lower-impact live evidence first, then escalate to heavier artifacts only when the expected diagnostic value justifies the cost. I correlate independent signals rather than treating one metric or snapshot as proof, and I revise or reject the hypothesis when the evidence disagrees. Root cause is reached when the proposed mechanism explains both the symptom and the observed evidence, not merely when one value looks abnormal."
