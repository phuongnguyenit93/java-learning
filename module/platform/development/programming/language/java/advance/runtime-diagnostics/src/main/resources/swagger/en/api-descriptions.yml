  jfrCpuWindow(int):
    summary: Create a short CPU window for JFR observation
    description: Start one clearly named platform thread that runs a CPU loop for
      a bounded interval. The learner should start a JFR recording first, trigger
      this API, then dump or stop the recording and inspect execution samples for
      that worker in the matching time window. Only one CPU window can be active at
      a time.
