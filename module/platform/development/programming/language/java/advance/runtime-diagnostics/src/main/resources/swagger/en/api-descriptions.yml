    summary: Read live runtime state from platform MXBeans
    description: Read RuntimeMXBean, MemoryMXBean, ThreadMXBean, ClassLoadingMXBean,
      GarbageCollectorMXBeans, and OperatingSystemMXBean from the running JVM. The
      response separates standard Java SE operating-system data from the com.sun.management.OperatingSystemMXBean
