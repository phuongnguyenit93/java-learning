  heapRetention(int,int):
    summary: Retain a bounded object population for class-histogram observation
    description: Allocate DiagnosticRetainedPayload objects up to a strict size limit,
      retain them strongly for a short window, and then clear the references automatically.
      During the window the learner can run jcmd GC.class_histogram and find the custom
      population. This is controlled retention rather than a real memory leak, and
      clearing the references does not promise an immediate drop in heap-used.
