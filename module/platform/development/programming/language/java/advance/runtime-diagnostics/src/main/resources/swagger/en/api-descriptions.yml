RuntimeDiagnosticsExperimentController:
  threadContention(int):
    summary: Create a bounded monitor-contention window
    description: Create two clearly named platform threads. The holder owns a monitor
      for a bounded interval while the waiter attempts to acquire the same monitor
      and becomes BLOCKED. The API returns immediately with the PID, thread names,
      and expiration time so the learner can run jcmd Thread.print -l while contention
      still exists. Only one contention window can be active at a time and no deadlock
      cycle is created.
