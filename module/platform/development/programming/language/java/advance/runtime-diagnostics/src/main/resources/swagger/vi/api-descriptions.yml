RuntimeDiagnosticsExperimentController:
  threadContention(int):
    summary: Tạo một cửa sổ monitor contention có giới hạn
    description: Tạo hai platform thread có tên rõ ràng. Thread holder giữ một monitor
      trong một khoảng thời gian có giới hạn, còn thread waiter cố lấy cùng monitor
      và chuyển sang BLOCKED. API trả về ngay PID, tên thread và thời điểm hết hạn
      để learner có thể chạy jcmd Thread.print -l trong lúc contention còn tồn tại.
      Mỗi lần chỉ có một cửa sổ contention active và không tạo vòng deadlock.
