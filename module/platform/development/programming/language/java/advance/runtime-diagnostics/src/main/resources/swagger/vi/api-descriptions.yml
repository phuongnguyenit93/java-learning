  heapRetention(int,int):
    summary: Giữ một tập object có giới hạn để quan sát class histogram
    description: Tạo các DiagnosticRetainedPayload với tổng dung lượng được giới hạn,
      giữ strong reference trong một cửa sổ ngắn rồi tự giải phóng reference. Trong
      cửa sổ đó learner có thể chạy jcmd GC.class_histogram và tìm population của
      class này. Đây là thí nghiệm retention có kiểm soát, không phải một memory leak
      thật và không cam kết heap-used giảm ngay sau khi reference được bỏ.
