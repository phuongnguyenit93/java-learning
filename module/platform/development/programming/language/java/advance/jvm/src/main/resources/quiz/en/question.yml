  - id: jvm-q15-end-to-end-flow
    question: "Which flow best describes the path from a class file to method execution?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.EndToEndModel/EndToEndModel.md"
      anchor: "classfile-to-runtime-state-flow"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Class file → GC → source parsing → method area → native-library loading."
        explanation: "Incorrect. This mixes unrelated phases and does not follow the execution lifecycle."
      - id: B
        answer: "Class file → constructors for every object → linking → source compilation → execution."
        explanation: "Incorrect. Object construction is not a prerequisite for creating runtime class state."
      - id: C
        answer: "Class file → loading → verification/preparation/resolution as needed → initialization when triggered → frame/execution."
        explanation: "Correct. This is the conceptual path from representation to runtime state and execution."
      - id: D
        answer: "Class file → JIT-compile the whole application → loading → initialization → interpreter."
        explanation: "Incorrect. A JVM is not required to eagerly JIT the entire application before loading."
    correctAnswerId: C

  - id: jvm-q16-module-boundary
    question: "You need to determine which ClassLoader loaded a class and why two classes with the same binary name have different type identity. Which module owns that deeper problem?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.EndToEndModel/EndToEndModel.md"
      anchor: "jvm-problem-boundary-map"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Managed Heap & GC, because every loaded class eventually consumes memory."
        explanation: "Incorrect. Memory consumption is not the owner of class-loader identity."
      - id: B
        answer: "JIT Optimization, because the compiler defines runtime type identity."
        explanation: "Incorrect. JIT compilation must respect runtime type identity; it does not define ClassLoader identity."
      - id: C
        answer: "Native Interoperability, because ClassLoader always creates types through native calls."
        explanation: "Incorrect. JNI/FFM is not the curriculum owner of class-loader identity."
      - id: D
        answer: "Java Core ClassLoader/Class Loading, because loader identity and delegation are owned by that module."
        explanation: "Correct. The JVM module establishes the lifecycle boundary; the ClassLoader module owns identity and delegation mechanics."
    correctAnswerId: D
