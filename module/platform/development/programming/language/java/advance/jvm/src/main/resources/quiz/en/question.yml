      anchor: "direct-and-offheap-memory-awareness"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The API contract simply defines a direct buffer as bytes that must live outside the heap in every JVM."
        explanation: "Incorrect. The Java API defines directness in terms of direct native-I/O behavior; physical backing is implementation-specific."
      - id: B
        answer: "A direct buffer is always faster than a heap buffer for every operation and should be the default."
        explanation: "Incorrect. Direct buffers have allocation/deallocation costs and are workload-dependent."
      - id: C
        answer: "A direct buffer is just an alias for `byte[]`, so native I/O must still copy through the heap."
        explanation: "Incorrect. Directness exists specifically so the JVM can attempt more direct native I/O."
      - id: D
        answer: "The JVM makes a best effort at direct native I/O; HotSpot commonly uses native memory, so heap metrics may miss part of the footprint."
        explanation: "Correct. This separates the API contract from a common HotSpot implementation detail."
    correctAnswerId: D

  - id: jvm-q13-xmx-process-limit
    question: "A container has a 1 GiB memory limit and the JVM runs with `-Xmx1g`. What key risk should you remember?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.HotSpotErgonomics/HotSpotErgonomics.md"
      anchor: "heap-sizing-concepts"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The process still needs memory outside the heap for stacks, metadata, code cache, and native resources, so it can exceed the container limit."
        explanation: "Correct. `-Xmx` limits the heap, not total process footprint."
      - id: B
        answer: "`-Xmx1g` automatically reserves exactly another 1 GiB for native memory, so the total must always be 2 GiB."
        explanation: "Incorrect. There is no fixed rule that native memory equals heap size."
      - id: C
        answer: "The container limit cannot affect the JVM while the heap is not full."
        explanation: "Incorrect. The OS/container can limit total process memory."
      - id: D
        answer: "Metadata and thread stacks are included inside `-Xmx`, so there are no additional memory categories."
        explanation: "Incorrect. That is exactly the misconception corrected by the whole-process model."
    correctAnswerId: A

