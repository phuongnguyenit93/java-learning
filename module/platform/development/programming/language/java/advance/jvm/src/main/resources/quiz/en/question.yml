# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: jvm-q01-spec-vs-implementation
    question: "Which statement correctly distinguishes the JVM Specification from HotSpot?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.JvmPurposeContract/JvmPurposeContract.md"
      anchor: "jvm-specification-vs-implementation"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The JVM Specification requires every JVM to use the same object layout and garbage collector."
        explanation: "Incorrect. The specification defines contracts and semantics, not one mandatory object layout or collector."
      - id: B
        answer: "HotSpot is one JVM implementation that can choose its GC, JIT strategy, and memory layout while preserving the JVM contract."
        explanation: "Correct. That is the core specification-versus-implementation distinction."
      - id: C
        answer: "HotSpot is the source of the JVM Specification, and other JVMs must reproduce HotSpot's runtime design."
        explanation: "Incorrect. HotSpot implements the specification; it does not define it."
      - id: D
        answer: "The JVM Specification defines only the class-file format, while all runtime semantics are left to implementations."
        explanation: "Incorrect. It also defines instruction semantics, runtime areas, linking, frames, exceptions, and other runtime rules."
    correctAnswerId: B

  - id: jvm-q02-portability-contract
    question: "What provides the core portability in the JVM model?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.JvmPurposeContract/JvmPurposeContract.md"
      anchor: "jvm-portability-model"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Every JVM on every operating system must execute the exact same native machine code."
        explanation: "Incorrect. Native machine code is platform-specific; each JVM implementation maps the common contract to its host platform."
      - id: B
        answer: "The operating system executes Java source directly, so CPU architecture does not matter."
        explanation: "Incorrect. Source must first be compiled into a representation understood by the runtime."
      - id: C
        answer: "The class-file representation provides a common execution contract, and each JVM implementation executes that contract on its platform."
        explanation: "Correct. Portability comes from the shared contract, not from identical native code on every machine."
      - id: D
        answer: "Portability means file systems, charsets, and scheduling behave identically on all operating systems."
        explanation: "Incorrect. Environmental behavior can still differ even when the class file is portable."
    correctAnswerId: C

  - id: jvm-q03-preparation-vs-initialization
    question: "For the field `static int port = 8080;`, which description correctly separates preparation from initialization?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.ClassFileBytecode/ClassFileBytecode.md"
      anchor: "verification-preparation-resolution"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Preparation creates storage and gives `port` the default value 0; initialization later runs the initializer that assigns 8080."
        explanation: "Correct. Preparation installs default JVM values; the Java-level initializer belongs to initialization."
      - id: B
        answer: "Preparation immediately assigns 8080; initialization only resolves the symbolic reference to the field."
        explanation: "Incorrect. Resolution is a separate linking concern; the 8080 initializer is not executed during preparation."
      - id: C
        answer: "Preparation creates no storage; storage is allocated only when a method first reads `port`."
        explanation: "Incorrect. Static field storage exists before initialization completes."
      - id: D
        answer: "Preparation and initialization are two names for the same phase, so no value transition occurs."
        explanation: "Incorrect. They have distinct responsibilities."
    correctAnswerId: A

  - id: jvm-q04-linkage-failure
    question: "An application compiles against dependency version A but runs with version B, which is missing a method the bytecode references. What can happen?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.ClassFileBytecode/ClassFileBytecode.md"
      anchor: "pre-execution-failures"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The JVM automatically rewrites the bytecode to call the nearest matching method in version B."
        explanation: "Incorrect. The JVM does not silently change the semantic target to repair a linkage mismatch."
      - id: B
        answer: "The mismatch can only be discovered after the target method body starts running."
        explanation: "Incorrect. Linkage or resolution can fail before the target method body executes."
      - id: C
        answer: "Successful compilation guarantees runtime dependency signatures can no longer fail."
        explanation: "Incorrect. Compile-time and runtime classpaths can differ."
      - id: D
        answer: "The runtime can fail during linkage or resolution before the target method body executes."
        explanation: "Correct. Successful compilation does not guarantee successful runtime linkage against a different dependency."
    correctAnswerId: D

  - id: jvm-q05-frame-and-heap
    question: "A local variable in a method holds a reference to an object. Which model is most accurate?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.RuntimeDataAreasFrames/RuntimeDataAreasFrames.md"
      anchor: "vm-wide-vs-thread-private-areas"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The local variable belongs to the thread's frame, while the referenced object normally lives on the shared heap."
        explanation: "Correct. Frames/JVM stacks are thread-private, while the heap is a VM-wide runtime area."
      - id: B
        answer: "Both the local variable and the object always live on the current thread's JVM stack."
        explanation: "Incorrect. The local reference and the referenced object belong to different parts of the runtime model."
      - id: C
        answer: "The local variable lives on the heap, while the object always lives in the method area."
        explanation: "Incorrect. This reverses the roles of frames, heap, and method area."
      - id: D
        answer: "Because the local variable is thread-private, the object it references can never become visible to another thread."
        explanation: "Incorrect. The object can be published through shared references."
    correctAnswerId: A

  - id: jvm-q06-frame-abrupt-completion
    question: "A method throws an exception that is not handled inside that method. What happens to the invocation frame?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.RuntimeDataAreasFrames/RuntimeDataAreasFrames.md"
      anchor: "frame-lifecycle-and-completion"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The frame is retained forever so a debugger can inspect it later."
        explanation: "Incorrect. Debugging does not change the invocation-frame lifecycle contract this way."
      - id: B
        answer: "The frame completes abruptly and may be discarded as the exception propagates to caller frames."
        explanation: "Correct. Abrupt completion is one way an invocation ends."
      - id: C
        answer: "The JVM moves the entire frame to the heap before propagating the exception."
        explanation: "Incorrect. No JVM rule requires such a frame migration."
      - id: D
        answer: "The frame is destroyed only if the exception is a checked exception."
        explanation: "Incorrect. Checked versus unchecked is a source-language typing distinction, not the frame-lifecycle rule."
    correctAnswerId: B

  - id: jvm-q07-new-vs-init
    question: "At bytecode level, which statement about `new Order()` is correct?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.ManagedHeapGC/ManagedHeapGC.md"
      anchor: "object-allocation-model"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The `new` instruction both allocates the object and executes the complete `<init>` constructor in the same instruction."
        explanation: "Incorrect. Allocation and constructor invocation are separate bytecode steps."
      - id: B
        answer: "`new` only resolves the class; storage is not allocated until the constructor returns."
        explanation: "Incorrect. `new` creates the uninitialized object before constructor invocation."
      - id: C
        answer: "`new` creates an uninitialized object, and compilers commonly use `invokespecial ... <init>` to invoke the constructor afterward."
        explanation: "Correct. This distinction matters when reading bytecode and verifier rules."
      - id: D
        answer: "The constructor runs first, and `new` creates the reference only after the object has already been initialized."
        explanation: "Incorrect. The constructor needs a receiver object that has already been created in an uninitialized state."
    correctAnswerId: C

  - id: jvm-q08-reachability-leak
    question: "Heap usage keeps rising because a cache retains strong references to objects no longer needed by business logic. Which explanation is most accurate?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.ManagedHeapGC/ManagedHeapGC.md"
      anchor: "reachability-and-liveness"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "This can be a managed-memory leak because the objects remain reachable, so the GC cannot reclaim them."
        explanation: "Correct. The collector reasons about reachability, not business intent."
      - id: B
        answer: "The GC must reclaim the objects once they are old enough, even while strong references remain."
        explanation: "Incorrect. Age does not override reachability semantics."
      - id: C
        answer: "Strong references affect performance only and do not affect object liveness."
        explanation: "Incorrect. Strong references directly affect reachability and liveness."
      - id: D
        answer: "An object can leak only when the JVM has no garbage collector enabled."
        explanation: "Incorrect. A normal collector will still retain strongly reachable objects."
    correctAnswerId: A

  - id: jvm-q09-adaptive-jit
    question: "Why does a long-running JVM service often exhibit warm-up behavior?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.AdaptiveExecutionJIT/AdaptiveExecutionJIT.md"
      anchor: "tiered-and-adaptive-compilation"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The JVM is required to sleep for several minutes before enabling the JIT compiler."
        explanation: "Incorrect. There is no JVM contract requiring such a delay."
      - id: B
        answer: "The heap must become full at least once before bytecode is allowed to execute."
        explanation: "Incorrect. Methods can execute before any full-heap event."
      - id: C
        answer: "Every method must be fully AOT-compiled before the first request is accepted."
        explanation: "Incorrect. HotSpot commonly begins with interpretation/light compilation and optimizes over time."
      - id: D
        answer: "The runtime collects profile data and can promote hot code through compilation and optimization levels over time."
        explanation: "Correct. Adaptive/tiered compilation produces different cold and steady-state behavior."
    correctAnswerId: D

  - id: jvm-q10-escape-analysis
    question: "Which statement most accurately describes escape analysis in HotSpot?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.AdaptiveExecutionJIT/AdaptiveExecutionJIT.md"
      anchor: "escape-analysis-and-scalar-replacement"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Every non-escaping object is required to become a physical object on the thread stack."
        explanation: "Incorrect. That is a common misconception; HotSpot can scalar-replace or eliminate allocations instead."
      - id: B
        answer: "HotSpot can use escape analysis to scalar-replace state and eliminate an allocation from generated code when the required conditions are proven."
        explanation: "Correct. A source-level `new` does not guarantee a physical heap allocation survives until GC."
      - id: C
        answer: "Escape analysis exists only to decide whether an object may be serialized."
        explanation: "Incorrect. It is a compiler optimization analysis, not a serialization policy."
      - id: D
        answer: "Escape analysis is mandated by the JVM Specification, so every JVM must optimize it exactly like HotSpot."
        explanation: "Incorrect. It is implementation/compiler behavior."
    correctAnswerId: B

  - id: jvm-q11-rss-vs-heap
    question: "A service has nearly stable live-heap usage while process RSS keeps increasing. What is the most reasonable conclusion?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.ProcessMemory/ProcessMemory.md"
      anchor: "process-memory-growth"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "This is impossible because the Java heap is always equal to total process memory."
        explanation: "Incorrect. A JVM process also uses stacks, metadata, compiled code, direct/native memory, and other resources."
      - id: B
        answer: "Garbage collection must be disabled because RSS can rise only when objects are not collected."
        explanation: "Incorrect. Non-heap categories can grow while the collector works normally."
      - id: C
        answer: "Inspect non-heap categories such as thread stacks, class metadata, code cache, and direct/native memory."
        explanation: "Correct. Stable heap usage does not rule out whole-process memory growth."
      - id: D
        answer: "Reducing `-Xmx` is sufficient to control every source of RSS growth in the JVM process."
        explanation: "Incorrect. `-Xmx` limits the heap, not every process/native resource."
    correctAnswerId: C

  - id: jvm-q12-direct-buffer
    question: "Which statement is most accurate about `ByteBuffer.allocateDirect`?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
