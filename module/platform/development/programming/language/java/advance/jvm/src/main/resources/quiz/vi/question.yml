        answer: "Mọi JVM trên mọi hệ điều hành phải dùng cùng native machine code."
        explanation: "Sai. Native machine code phụ thuộc platform; JVM implementation ánh xạ class-file contract xuống platform cụ thể."
      - id: B
        answer: "Java source được hệ điều hành thực thi trực tiếp nên không phụ thuộc CPU."
        explanation: "Sai. Java source phải được compile thành representation mà runtime hiểu."
      - id: C
        answer: "Class-file representation cung cấp một execution contract chung, còn JVM implementation thực thi contract đó trên từng platform."
