        answer: "Preparation tạo storage và đặt `port` về 0; initialization sau đó thực thi initializer để đặt 8080."
        explanation: "Đúng. Preparation dùng default JVM value; Java-level initializer thuộc initialization."
      - id: B
        answer: "Preparation đặt ngay 8080; initialization chỉ resolve symbolic reference tới field."
        explanation: "Sai. Resolution là linking concern khác; initializer 8080 không chạy trong preparation."
      - id: C
        answer: "Preparation không tạo storage; storage chỉ được tạo khi method đầu tiên đọc `port`."
