        answer: "JVM luôn tự sửa bytecode để gọi method gần giống nhất trong phiên bản B."
        explanation: "Sai. JVM không tự đổi semantic target để cứu một linkage mismatch."
      - id: B
        answer: "Chỉ khi method body bắt đầu chạy mới có thể phát hiện mismatch này."
        explanation: "Sai. Linkage/resolution có thể fail trước khi target method body được thực thi."
      - id: C
        answer: "Nếu compile đã thành công thì runtime không thể fail vì dependency signature."
        explanation: "Sai. Compile-time classpath và runtime classpath có thể khác nhau."
      - id: D
        answer: "Runtime có thể fail trong linkage/resolution trước khi target method body chạy."
        explanation: "Đúng. Successful compilation không bảo đảm runtime linkage với một dependency khác."
    correctAnswerId: D

  - id: jvm-q05-frame-and-heap
    question: "Một local variable trong method giữ reference tới một object. Mô hình nào đúng nhất?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.RuntimeDataAreasFrames/RuntimeDataAreasFrames.md"
      anchor: "vm-wide-vs-thread-private-areas"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Local variable nằm trong frame của thread; object được reference thường nằm trên shared heap."
        explanation: "Đúng. Frame/JVM stack là thread-private, còn heap là VM-wide/shared runtime area."
      - id: B
        answer: "Cả local variable và object đều luôn nằm trong JVM stack của thread hiện tại."
        explanation: "Sai. Source-level local reference và referenced object thuộc hai phần khác nhau của runtime model."
      - id: C
        answer: "Local variable nằm trên heap, còn object luôn nằm trong method area."
        explanation: "Sai. Đây là đảo ngược vai trò của frame, heap và method area."
      - id: D
        answer: "Vì local variable là thread-private nên object nó trỏ tới cũng không thể được thread khác thấy."
        explanation: "Sai. Object có thể được publish qua shared references; thread-private local variable không làm object tự động thread-private."
    correctAnswerId: A

