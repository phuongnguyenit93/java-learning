        explanation: "Sai. Allocation và constructor invocation là hai bước bytecode tách biệt."
      - id: B
        answer: "`new` chỉ resolve class; storage chỉ được cấp khi constructor return."
        explanation: "Sai. `new` tạo uninitialized object trước khi constructor được gọi."
      - id: C
        answer: "`new` tạo uninitialized object; compiler thường dùng `invokespecial ... <init>` để gọi constructor sau đó."
