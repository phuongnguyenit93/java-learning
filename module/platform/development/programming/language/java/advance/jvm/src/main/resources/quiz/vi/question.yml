      anchor: "jvm-specification-vs-implementation"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "JVM Specification bắt buộc mọi JVM dùng cùng object layout và cùng garbage collector."
        explanation: "Sai. Specification quy định contract/semantics, không bắt buộc một object layout hay collector cụ thể."
      - id: B
        answer: "HotSpot là một JVM implementation có thể chọn GC, JIT strategy và memory layout riêng miễn giữ đúng JVM contract."
        explanation: "Đúng. Đây chính là ranh giới giữa specification-level behavior và implementation detail."
      - id: C
        answer: "HotSpot là nguồn định nghĩa JVM Specification, còn các JVM khác phải mô phỏng cùng runtime design của HotSpot."
        explanation: "Sai. HotSpot là một implementation của specification, không phải nguồn định nghĩa specification."
      - id: D
        answer: "JVM Specification chỉ định class-file format, còn runtime semantics hoàn toàn do từng implementation quyết định."
        explanation: "Sai. Specification còn quy định instruction semantics, runtime areas, linking, frames, exceptions và nhiều runtime rules."
    correctAnswerId: B

  - id: jvm-q02-portability-contract
