questions:
  - question: "How does the JVM Specification differ from HotSpot, and why does that distinction matter when learning JVM internals?"
    answer: "The JVM Specification defines the execution contract: the class-file format, instruction semantics, runtime data areas, loading/linking/initialization, frames, exceptions, and other rules a compliant JVM must preserve. HotSpot is one concrete implementation of that contract and can choose its own object layout, garbage collector, JIT strategy, code-cache organization, heuristics, and VM flags. This distinction matters because production concepts such as G1, Metaspace, TLABs, or C1/C2 are not universal JVM rules. An implementation detail may change across JDK versions or vendors while specification-level semantics remain a more stable foundation."
