  - question: "Explain how loading, linking, and initialization differ from method execution. Give an example of a failure that can occur before the target method body runs."
    answer: "Loading creates the runtime representation of a class or interface from its binary representation. Linking integrates that representation into JVM state; it includes verification, preparation, and resolution according to JVM rules. Initialization applies static initialization semantics, including static values and `<clinit>` when required. Only after the relevant lifecycle conditions are satisfied does normal method execution proceed in a frame or compiled form. For example, an application may compile against dependency A but run with dependency B that lacks a referenced method. Resolution/linkage can fail before the target method body executes. Successful compilation therefore does not guarantee successful runtime linkage."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.ClassFileBytecode/ClassFileBytecode.md"
      anchor: "pre-execution-failures"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: "What does a stack frame contain, what is its lifecycle, and how does exception propagation interact with frames?"
    answer: "A frame is the execution context for one method invocation. In the JVMS model it contains a local-variable array, operand stack, and a reference to the runtime constant pool of the current class; it also participates in dynamic linking, returns, and exception dispatch. A new frame is created when a method is invoked on a thread's JVM stack. Normal completion returns control and an optional value to the caller, then destroys the frame. Abrupt completion occurs when an exception is not handled in that invocation; the current frame is discarded while the JVM searches caller frames for a handler. The frame is a logical JVM execution model, not a promise about HotSpot's exact native stack or register layout."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.RuntimeDataAreasFrames/RuntimeDataAreasFrames.md"
      anchor: "stack-frame-model"
