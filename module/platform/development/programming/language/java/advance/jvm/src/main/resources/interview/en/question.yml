  - question: "Does escape analysis mean 'if an object does not escape, HotSpot puts it on the stack'? What optimization can actually occur?"
    answer: "That statement should not be used as a rule. Escape analysis gives the optimizer information about whether object state can be observed outside a scope it can reason about. In the HotSpot server compiler, an important optimization is scalar replacement/allocation elimination: if the object can be represented as scalar state and the allocation does not need to remain observable, generated code may omit the heap allocation. Java 21 HotSpot documentation explicitly notes that the server compiler does not simply replace a non-globally-escaping heap allocation with a stack allocation. A source-level `new` therefore does not guarantee a physical heap allocation survives until GC, but neither should you conclude that every non-escaping object is a stack object."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.AdaptiveExecutionJIT/AdaptiveExecutionJIT.md"
      anchor: "escape-analysis-and-scalar-replacement"
