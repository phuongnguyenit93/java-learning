  - question: "Heap usage is stable but JVM process RSS keeps growing. Which memory categories would you consider before concluding there is a heap leak?"
    answer: "The Java heap is only one component of total process footprint. I would consider platform-thread/native stacks, class metadata/Metaspace, JIT compiled code and code cache, direct buffers, JNI/native libraries, runtime internal structures, allocator fragmentation, and committed-but-currently-unused memory. If thread count or loaded-class count rises, RSS can increase even while live heap remains stable. The right question becomes 'which category is growing?' rather than only 'is the heap leaking?'. I would then use evidence such as Native Memory Tracking, jcmd, JFR, and OS/container metrics. `-Xmx` is not a total process-memory limit."
    aiGenerated: true
    reviewed: false
    readmeRelated:
