  - question: "Why is there no simple answer to 'which garbage collector is best'? Discuss throughput, latency, and memory footprint."
    answer: "Collector designs optimize competing goals. Throughput tries to maximize CPU time spent on application work; latency focuses on keeping individual pauses short; footprint tries to minimize memory headroom and runtime overhead. A highly concurrent collector may reduce pauses while consuming more CPU/resources. A larger heap can reduce collection frequency while increasing footprint and sometimes changing pause characteristics. A batch workload may prioritize throughput, while an interactive service may prioritize tail latency. Collector choice should therefore start from SLOs, live-set/heap size, CPU budget, and memory constraints, then be validated by measurement rather than by collector popularity or an unrelated benchmark."
    aiGenerated: true
    reviewed: false
    readmeRelated:
