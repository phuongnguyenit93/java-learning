  - question: "A container has a 1 GiB memory limit. Why is setting `-Xmx1g` usually risky? What do `-Xms` and `-Xmx` actually control?"
    answer: "In the Java 21 launcher, `-Xms` sets the minimum and initial heap size, while `-Xmx` sets the maximum heap size. They control the managed heap, not the whole JVM process. The process also needs thread stacks, class metadata, code cache, direct/native memory, native libraries, and VM overhead. If `-Xmx` consumes nearly the whole container limit, those other categories have little headroom and the process may hit a cgroup/OS limit even without a Java-heap OOM. Heap sizing must fit within a whole-process memory budget and should be based on workload evidence rather than simply setting Xmx equal to the container limit."
    aiGenerated: true
    reviewed: false
    readmeRelated:
