  - question: "Why can Java still have memory leaks even with a garbage collector? What role does reachability play?"
    answer: "A garbage collector can reclaim an object only when that object is no longer live according to its reachability model. It does not know that business logic has stopped needing the object. If a cache, static collection, listener registry, or ClassLoader accidentally retains a strong reference, the object remains reachable from GC roots and must stay live. That is a managed-memory leak: automatic storage management is working correctly, but the application's reference graph retains data too long. The root cause is usually ownership/lifecycle of references rather than 'the GC forgot to free memory.' Heap dumps and dominator/reference-path analysis are diagnostic techniques used to find the retaining path."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.ManagedHeapGC/ManagedHeapGC.md"
      anchor: "reachability-and-liveness"
