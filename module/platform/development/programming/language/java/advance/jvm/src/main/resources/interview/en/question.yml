  - question: "A team sees latency increase and wants to add many `-XX` flags immediately. How would you respond?"
    answer: "I would ask for a hypothesis and evidence first. Latency can come from GC, lock contention, I/O, CPU saturation, allocation pressure, safepoints, JIT/deoptimization, or external dependencies. Changing many flags at once destroys causal attribution and can move behavior far away from the production baseline. A better loop is measure → explain → change → measure again: collect JFR/GC-log/thread/metric evidence to identify the subsystem, change one configuration backed by a clear reason, then compare again. HotSpot ergonomics already provides reasonable defaults for many workloads; non-default flags should be versioned, documented, and reevaluated when the JDK changes."
    aiGenerated: true
    reviewed: false
    readmeRelated:
