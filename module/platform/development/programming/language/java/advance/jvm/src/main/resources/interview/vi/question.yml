  - question: "Một team thấy latency tăng và muốn thêm hàng loạt `-XX` flags. Bạn sẽ phản biện thế nào?"
    answer: "Tôi sẽ yêu cầu hypothesis và evidence trước. Latency có thể do GC, lock contention, I/O, CPU saturation, allocation pressure, safepoint, JIT/deoptimization hoặc dependency bên ngoài. Đổi nhiều flags cùng lúc phá khả năng xác định nguyên nhân và có thể làm behavior lệch xa production baseline. Quy trình tốt là measure → explain → change → measure again: lấy JFR/GC logs/thread evidence/metrics để xác định subsystem, chỉ thay một configuration có reason rõ, rồi so sánh lại. HotSpot ergonomics đã cung cấp default hợp lý cho nhiều workload; non-default flags cần được versioned, documented và đánh giá lại khi nâng JDK."
    aiGenerated: true
    reviewed: false
    readmeRelated:
