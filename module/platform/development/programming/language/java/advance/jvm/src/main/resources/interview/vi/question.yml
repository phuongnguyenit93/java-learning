  - question: "Hãy giải thích loading, linking và initialization khác method execution như thế nào. Cho một ví dụ failure xảy ra trước khi target method body chạy."
    answer: "Loading tạo runtime representation của class/interface từ binary representation. Linking tích hợp representation đó vào JVM state; linking gồm verification, preparation và resolution theo rule của JVM. Initialization thực hiện static initialization semantics, bao gồm việc thiết lập static values và gọi `<clinit>` khi cần. Chỉ sau các lifecycle condition phù hợp, method execution mới chạy bytecode/native compiled form trong frame. Ví dụ, application compile với dependency A nhưng runtime load dependency B thiếu method referenced trong constant pool. Resolution/linkage có thể ném linkage error trước khi target method body chạy. Vì vậy 'compile thành công' không đồng nghĩa 'runtime linkage chắc chắn thành công'."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.ClassFileBytecode/ClassFileBytecode.md"
      anchor: "pre-execution-failures"
