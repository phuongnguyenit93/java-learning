  - question: "Escape analysis có đồng nghĩa 'object không escape thì được đặt lên stack' không? HotSpot thực sự có thể tối ưu gì?"
    answer: "Không nên dùng câu đó như một rule. Escape analysis cung cấp information cho optimizer về phạm vi object có thể được quan sát. Trong HotSpot server compiler, một optimization quan trọng là scalar replacement/allocation elimination: nếu object có thể được phân rã thành scalar state và allocation không cần observable, generated code có thể không tạo heap allocation đó. Java 21 HotSpot documentation còn nói rõ server compiler không đơn giản thay non-global-escaping heap allocation bằng stack allocation. Vì vậy source-level `new` không chứng minh có một physical heap object sống tới GC, nhưng cũng không nên suy diễn thành 'mọi non-escaping object nằm trên stack'."
    aiGenerated: true
    reviewed: false
    readmeRelated:
