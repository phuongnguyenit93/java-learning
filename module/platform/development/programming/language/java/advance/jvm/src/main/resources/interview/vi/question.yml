  - question: "Tại sao Java vẫn có memory leak dù có garbage collector? Reachability đóng vai trò gì?"
    answer: "GC chỉ có thể reclaim object khi object không còn live theo reachability model của collector. Nó không biết business logic đã 'không cần' object nữa. Nếu cache, static collection, listener registry hoặc ClassLoader vô tình giữ strong reference, object vẫn reachable từ GC roots và collector phải giữ nó. Đây là managed-memory leak: storage management hoạt động đúng nhưng application reference graph giữ dữ liệu quá lâu. Vì vậy root cause thường là ownership/lifecycle của reference chứ không phải 'GC quên free'. Heap dump và dominator/reference-path analysis là bước diagnostics để tìm ai đang giữ object."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.ManagedHeapGC/ManagedHeapGC.md"
      anchor: "reachability-and-liveness"
    apiRelated:
      controller: ""
