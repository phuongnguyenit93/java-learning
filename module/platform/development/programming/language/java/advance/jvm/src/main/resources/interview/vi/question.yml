  - question: "Stack frame chứa gì, lifecycle của frame ra sao, và exception propagation liên quan tới frame như thế nào?"
    answer: "Một frame là execution context của một method invocation. Theo JVMS model, frame chứa local-variable array, operand stack và reference tới runtime constant pool của current class; nó cũng hỗ trợ dynamic linking, return và exception dispatch. Khi method được invoke, frame mới được tạo trên JVM stack của thread. Normal completion trả control/return value về caller rồi frame bị hủy. Abrupt completion xảy ra khi exception không được handle trong invocation đó; current frame bị bỏ và JVM tiếp tục tìm handler ở caller frames. Điều cần nhớ là frame là logical JVM execution model, không phải cam kết về exact native stack/register layout của HotSpot."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.RuntimeDataAreasFrames/RuntimeDataAreasFrames.md"
      anchor: "stack-frame-model"
    apiRelated:
      controller: ""
