  - question: "Khi chọn garbage collector, vì sao không có câu trả lời đơn giản 'collector nào tốt nhất'? Hãy nói về throughput, latency và footprint."
    answer: "Collector design tối ưu các mục tiêu xung đột. Throughput ưu tiên nhiều CPU time cho application; latency ưu tiên pause ngắn; footprint ưu tiên dùng ít memory/headroom. Concurrent collector có thể giảm pause nhưng dùng thêm CPU/resources. Heap lớn có thể giảm collection frequency nhưng tăng footprint và có thể thay đổi pause characteristics. Một workload batch có thể ưu tiên throughput trong khi service interactive ưu tiên tail latency. Vì vậy chọn collector phải bắt đầu từ SLO, live-set/heap size, CPU budget và memory constraint, sau đó đo behavior thực tế. Không nên chọn chỉ vì tên collector 'mới hơn' hoặc một benchmark của workload khác."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.ManagedHeapGC/ManagedHeapGC.md"
      anchor: "gc-goals-and-tradeoffs"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: "Giải thích vì sao JVM service có warm-up. Profiling, JIT compilation, speculation và deoptimization liên hệ với nhau như thế nào?"
    answer: "HotSpot có thể bắt đầu code bằng interpreter hoặc compilation level nhẹ để startup nhanh và đồng thời thu thập profile. Khi method/call site đủ hot, runtime dành compiler effort để tạo optimized native code. Optimizer có thể dùng observed receiver types hoặc branch behavior để speculate và inline/specialize mạnh hơn. Nếu workload sau đó phá assumption, runtime deoptimize về state an toàn hơn và có thể recompile với profile mới. Vì vậy performance là dynamic lifecycle: cold-path behavior khác steady state, và một method không nhất thiết có một compiled version cố định suốt process lifetime. Đây cũng là lý do benchmark JVM cần warm-up và measurement discipline."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.AdaptiveExecutionJIT/AdaptiveExecutionJIT.md"
      anchor: "speculation-and-deoptimization"
    apiRelated:
      controller: ""
