  - question: "Nếu được yêu cầu mô tả end-to-end một Java program từ class file đến optimized execution và memory reclamation, bạn sẽ trình bày flow nào?"
    answer: "Tôi sẽ bắt đầu từ class file chứa constant pool, fields, methods, attributes và bytecode. Khi runtime cần class, nó load representation, link bằng verification/preparation/resolution theo nhu cầu và initialize static state khi trigger. Method invocation tạo frame với locals, operand stack và runtime-constant-pool reference. Execution có thể bắt đầu interpreted, được profiling, rồi hot code được JIT compile/optimize; assumption có thể dẫn tới deoptimization/recompile. `new` tạo uninitialized object, `<init>` hoàn tất constructor initialization, references làm object reachable; khi reference graph không còn giữ object live, GC có thể reclaim storage. Song song, whole process còn dùng stacks, metadata, code cache và native resources ngoài heap."
    aiGenerated: true
    reviewed: false
