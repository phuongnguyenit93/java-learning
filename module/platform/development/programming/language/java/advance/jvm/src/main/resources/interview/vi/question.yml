  - question: "Heap usage ổn định nhưng RSS của JVM process tăng. Bạn sẽ reasoning những memory category nào trước khi kết luận heap leak?"
    answer: "Java heap chỉ là một phần process footprint. Tôi sẽ nghĩ tới platform-thread/native stacks, class metadata/Metaspace, JIT compiled code/code cache, direct buffers, JNI/native libraries, runtime internal structures, allocator fragmentation và committed-but-not-currently-used memory. Nếu số thread hoặc loaded classes tăng, RSS có thể tăng dù live heap ổn định. Vì vậy bước đúng là chuyển từ câu hỏi 'heap leak không?' sang 'category nào tăng?'. Sau đó dùng evidence phù hợp như Native Memory Tracking, jcmd, JFR và OS/container metrics. `-Xmx` không phải total process-memory limit."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.ProcessMemory/ProcessMemory.md"
      anchor: "process-memory-growth"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: "Bạn có container memory limit 1 GiB. Vì sao đặt `-Xmx1g` thường là rủi ro? `-Xms` và `-Xmx` thực sự điều khiển gì?"
    answer: "Trong Java 21 launcher, `-Xms` đặt minimum và initial heap size, còn `-Xmx` đặt maximum heap size. Chúng điều khiển managed heap, không phải toàn JVM process. Process còn cần thread stacks, class metadata, code cache, direct/native memory, native libraries và VM overhead. Nếu `-Xmx` chiếm gần toàn bộ container limit, các category còn lại không có headroom và process có thể chạm cgroup/OS limit dù heap chưa gặp Java heap OOM. Heap sizing phải nằm trong whole-process budget và nên dựa trên workload/evidence, không chỉ bằng cách đặt Xmx bằng memory limit."
    aiGenerated: true
    reviewed: false
    readmeRelated:
