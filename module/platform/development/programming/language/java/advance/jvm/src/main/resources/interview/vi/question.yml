questions:
  - question: "JVM Specification và HotSpot khác nhau như thế nào? Vì sao phân biệt này quan trọng khi học JVM internals?"
    answer: "JVM Specification định nghĩa execution contract: class-file format, instruction semantics, runtime data areas, loading/linking/initialization, frames, exceptions và các rule mà một JVM compliant phải giữ. HotSpot là một implementation cụ thể của contract đó và được quyền chọn object layout, garbage collector, JIT strategy, code-cache organization, heuristics và VM flags riêng. Phân biệt này quan trọng vì nhiều kiến thức production như G1, Metaspace, TLAB hay C1/C2 không phải universal JVM rules. Khi đổi JDK version hoặc vendor, implementation detail có thể thay đổi nhưng specification-level semantics vẫn là nền tảng ổn định hơn."
    aiGenerated: true
