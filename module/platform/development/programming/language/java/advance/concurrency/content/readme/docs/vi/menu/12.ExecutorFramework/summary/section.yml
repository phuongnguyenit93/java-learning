  | Tiêu chí | Bài 1 | Bài 2 | Bài 3 | Bài 4 | Bài 5 | Bài 6 | Bài 7 | Bài 8 | Bài 9 | Bài 10 | Bài 11 | Bài 12 | Bài 13 | Bài 14 | Bài 15 | Bài 16 | Bài 17 | Bài 18 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Tên | Executor, ExecutorService và ThreadPoolExecutor | execute() so với submit() và xử lý lỗi | Fixed, cached và single-thread executors | Đánh giá rủi ro của queue không giới hạn | corePoolSize, maximumPoolSize và keepAliveTime | Work queue: ArrayBlockingQueue, LinkedBlockingQueue | RejectedExecutionHandler và bốn chính sách từ chối | ThreadFactory và UncaughtExceptionHandler trong executor | Lựa chọn pool size cho CPU-bound và I/O-bound | submit task độc lập và tránh thread starvation | Khả năng quan sát active count, queue size, completed tasks | Lifecycle: đóng executor và tránh thread leak | Kiểm soát số task đang chờ và backpressure | Phân biệt user task concurrency với thread pool concurrency | Thứ tự tiếp nhận việc của ThreadPoolExecutor: core threads, queue, maximum và rejection | AbortPolicy, CallerRunsPolicy, DiscardPolicy và DiscardOldestPolicy: hệ quả khi quá tải | prestartAllCoreThreads() và allowCoreThreadTimeOut(): quản lý luồng lõi | beforeExecute(), afterExecute() và cách nhận biết ngoại lệ của tác vụ submit() |
  | Vấn đề cần hiểu | Executor, ExecutorService và ThreadPoolExecutor giải quyết những trách nhiệm nào? | execute và submit khác nhau ra sao khi task ném lỗi hoặc bị từ chối? | Fixed, cached và single-thread executor khác nhau ở worker, queue và rủi ro tải cao? | Unbounded queue gây tích lũy tác vụ, memory pressure và deadline miss như thế nào? | corePoolSize, maximumPoolSize, keepAliveTime thực sự tác động lên số worker và vòng đời idle ra sao? | ArrayBlockingQueue và LinkedBlockingQueue ảnh hưởng admission, capacity và tài nguyên ra sao? | Một executor đầy hoặc shutdown xử lý task mới bằng bốn policy ra sao? | ThreadFactory và UncaughtExceptionHandler kiểm soát những gì trong vòng đời worker? | Vì sao CPU-bound và blocking I/O cần chiến lược pool size khác nhau? | Vì sao parent chờ child trong cùng pool có thể làm mọi worker bị kẹt? | Đọc các số liệu ThreadPoolExecutor thế nào mà không nhầm completed với successful? | Làm sao đóng executor mà không rò thread hoặc bỏ nhầm việc chưa xong? | Kiểm soát task outstanding và truyền quá tải về producer như thế nào? | Vì sao số user requests còn sống không bằng số thread pool đang chạy? | ThreadPoolExecutor thực hiện core → queue → max → reject theo điều kiện nào? | Abort/CallerRuns/Discard/DiscardOldest thay đổi tính đúng đắn và Future ra sao? | prestartAllCoreThreads và allowCoreThreadTimeOut tác động tới startup/idle thế nào? | Tại sao afterExecute có thể nhận Throwable null dù task submit ném exception? |
  | Giá trị đối với OOP/module | Chọn đúng API và phân định rõ việc gửi task, theo dõi Future và sở hữu vòng đời pool | Không đánh mất exception, cancellation và trạng thái tác vụ | Chọn factory theo nhu cầu thứ tự, độ song song và giới hạn backlog | Đánh giá rủi ro vận hành trước khi tăng queue hoặc số worker | Cấu hình pool tránh kỳ vọng sai về mở rộng worker và timeout | Chọn đúng queue và không lạm dụng thao tác trực tiếp vào queue nội bộ | Định nghĩa phản ứng quá tải rõ ràng theo loại tác vụ | Đặt tên worker và hiểu đúng ranh giới handler với exception của submit | Tuning theo bottleneck thật và workload đo được | Cấu trúc tác vụ độc lập hoặc pipeline không chặn worker chờ chính queue | Nhìn đúng bức tranh tải và lỗi thay vì tin snapshot đơn lẻ | Quản lý vòng đời executor rõ ràng và kiểm chứng termination | Giảm backlog mà không rò permit hoặc làm rơi task quan trọng | Đo đúng concurrency của business và executor khi có fan-out/async | Dự đoán chính xác hành vi tiếp nhận và lý giải edge cases admission | Đưa ra quyết định overload nhất quán với yêu cầu không mất dữ liệu | Điều chỉnh tradeoff latency khởi động và chi phí worker nhàn rỗi | Instrument worker đúng cách mà không bỏ sót failure hoặc chặn pool |
  | Tư duy hình thành | Phân rã abstraction trước khi chọn cấu hình thực thi | Theo dõi riêng đường nộp việc và đường quan sát kết quả | Nhìn cả worker lẫn queue trước khi chọn tên factory | Xem backlog là khoản nợ xử lý và bộ nhớ đang được giữ | Tách thông số cấu hình khỏi quan sát worker tại một thời điểm | Đọc capacity và semantics enqueue trước khi dự đoán executor | Xem rejection là một phần của hợp đồng giao việc | Tách lifecycle của worker khỏi kết quả của từng task | Phân tích thời gian tính/chờ trước khi tăng worker | Biểu diễn quan hệ phụ thuộc trước khi thêm thread | Tách metric executor khỏi outcome của nghiệp vụ | Tách ngừng nhận việc, yêu cầu hủy và xác nhận dừng | Đặt giới hạn tại ranh giới nhận việc, không chỉ tăng queue | Xác định đơn vị đếm trước khi nói hệ thống đang bão hòa | Suy luận theo thứ tự quyết định, queue.offer và bước recheck | Đánh giá policy theo mất tác vụ, thứ tự và phản hồi caller | Phân biệt số core cấu hình với số worker tồn tại thực tế | Phân biệt kết thúc Runnable wrapper với business outcome |
