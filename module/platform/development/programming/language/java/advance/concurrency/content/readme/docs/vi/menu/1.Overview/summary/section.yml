  | Tên | Concurrency, parallelism và asynchronous execution khác nhau thế nào? | Process, platform thread, virtual thread và task | CPU-bound và I/O-bound: chọn cách thực thi | Latency, throughput, responsiveness và utilization | Concurrency trong ứng dụng Java: use case và rủi ro | Shared mutable state, coordination và thread confinement | Safety, liveness, progress và starvation | Race condition, deadlock, livelock: nhận diện ở mức tổng quan | Concurrency overhead: context switch, contention, scheduling | Khi nào nên dùng tuần tự thay vì đa luồng |
  | Vấn đề cần hiểu | Concurrency, parallelism và async khác nhau ở hành vi nào? | Công việc là task, thread hay process, và virtual thread khác gì? | Tác vụ tính CPU hay chờ I/O, nên điều phối bằng cơ chế nào? | Đo hiệu năng concurrent bằng chỉ số gì và nhận diện quá tải thế nào? | Ở ứng dụng Java, concurrency có ích khi nào và phát sinh rủi ro gì? | Ai sở hữu dữ liệu, bảo vệ invariant và phối hợp tiến độ bằng gì? | Một thuật toán cho kết quả đúng có chắc mọi task sẽ hoàn thành không? | Khi thấy kết quả sai hoặc tác vụ treo, cần phân biệt ba lỗi nào? | Vì sao thêm concurrency có thể chậm hơn và phải đo overhead ở đâu? | Trong điều kiện nào đa luồng tạo thêm chi phí hơn giá trị? |
  | Giá trị đối với OOP/module | Đặt đúng thuật ngữ và chọn API Java theo mục tiêu | Hiểu đúng đơn vị thực thi và phạm vi chia sẻ heap | Chọn executor và mức đồng thời dựa trên đặc tính tải | Đánh giá kết quả Java concurrency bằng số liệu có ranh giới rõ | Đưa lựa chọn kỹ thuật vào các use case có yêu cầu nghiệp vụ | Tránh data race và chọn đúng synchronization/coordination primitives | Đánh giá cả safety lẫn liveness cho API concurrent | Chẩn đoán concurrency có chứng cứ trước khi chọn biện pháp sửa | Định vị bottleneck do tranh chấp và lập lịch | Ra quyết định tuần tự hay concurrent dựa trên tính đúng và phép đo |
  | Tư duy hình thành | Mô tả chính xác tiến độ, CPU và thời điểm chờ | Phân biệt công việc logic với tài nguyên chạy nó | Đo các pha rồi điều tiết ở đúng tài nguyên giới hạn | Đo cả hàng đợi, độ trễ đuôi và tài nguyên, tránh một metric đơn độc | Đánh giá lợi ích cùng tính đúng, độ bền vững và khả năng hủy | Giảm chia sẻ mutable state rồi mới chọn khóa, queue hay atomic | Chứng minh invariant riêng và tiến triển riêng | Quan sát bất biến, vòng chờ và tiến độ theo thời gian | Đo và đối chiếu tầng JVM–OS trước khi tối ưu | Bắt đầu bằng lời giải đơn giản rồi tăng concurrency có mục đích |
