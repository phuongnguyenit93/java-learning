- id: fork-join-013
  title: 'CountedCompleter: mục đích và khác biệt với RecursiveTask, RecursiveAction'
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **CountedCompleter: mục đích và khác biệt với RecursiveTask, RecursiveAction**

    **`CountedCompleter<T>`** là một loại `ForkJoinTask<T>` trong `java.util.concurrent`, được thiết kế cho công việc có **quan hệ hoàn tất phụ thuộc nhiều tác vụ con**. Thay vì mỗi parent task phải gọi `join()` để đợi từng child, nó sử dụng **pending count**, liên kết **completer** (thường trỏ về parent) và các phương thức **`tryComplete()` / `onCompletion()`** để kích hoạt xử lý khi các nhánh liên quan đã báo xong.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Constructor, completer và pending count

    1. CountedCompleter khác RecursiveTask và RecursiveAction ra sao?
    2. Completer và pending count giải quyết việc phối hợp nào?

    ### Tình huống áp dụng

    1. Compute trả về có luôn nghĩa là CountedCompleter done không?
    2. Khi nào nên dùng completion callback thay cho join từng child?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích countedCompleter khác RecursiveTask và RecursiveAction ra sao với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề compute trả về có luôn nghĩa là CountedCompleter done không. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp khi nào nên dùng completion callback thay cho join từng child bằng điều kiện và kết quả quan sát được. |
- id: fork-join-014
  title: Quan hệ completer, pending count và cây hoàn tất của CountedCompleter
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Quan hệ completer, pending count và cây hoàn tất của CountedCompleter**

    Trong Fork/Join, một phép tính có thể được chia thành nhiều phần việc nhỏ. Với `RecursiveTask` hoặc `RecursiveAction`, cách thường gặp là tạo subtask, `fork()` một phần, rồi `join()` để chờ kết quả. Với những bài toán có nhiều nhánh độc lập, độ dài xử lý mỗi nhánh không đồng đều hoặc cần tổng hợp kết quả khi toàn bộ nhánh hoàn tất, **CountedCompleter** cho phép xây dựng một **cây thông báo hoàn tất** mà các worker không nhất thiết phải block bằng `join()` ở từng nút cha.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Pending count thực sự đếm cái gì?

    1. Pending count của CountedCompleter thực sự biểu diễn gì?
    2. Vì sao count giảm về 0 chưa nhất thiết hoàn tất root?

    ### Câu hỏi tự kiểm tra

    1. Mẫu N child+self khác child-only ra sao?
    2. Làm sao chứng minh cây completer không báo thiếu tín hiệu?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

