- id: fork-join-018
  title: 'onExceptionalCompletion(): xử lý và lan truyền ngoại lệ của CountedCompleter'
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **onExceptionalCompletion(): xử lý và lan truyền ngoại lệ của CountedCompleter**

    `CountedCompleter<T>` là một dạng `ForkJoinTask<T>` thuộc `java.util.concurrent`, được thiết kế cho các thuật toán chia việc theo cây và báo hoàn tất bằng **completer chain**. Mỗi task có thể liên kết với một `CountedCompleter` cha, có bộ đếm **pending** để quản lý quá trình hoàn thành bình thường. Khác với cách `RecursiveTask` thường fork rồi join từng nhánh, `CountedCompleter` có thể cho các nhánh gọi `tryComplete()` để tiếp tục tiến trình hoàn tất của cây mà không buộc cha phải join trực tiếp từng con.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Chữ ký và hợp đồng chính xác

    1. onExceptionalCompletion nhận Throwable và caller nào?
    2. Callback trả true hoặc false làm thay đổi propagation ra sao?

    ### Lỗi thường gặp

    1. Root thất bại có khiến sibling tasks tự dừng không?
    2. Cần phối hợp exception, cancellation và cleanup thế nào?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích onExceptionalCompletion nhận Throwable và caller nào với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề root thất bại có khiến sibling tasks tự dừng không. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp cần phối hợp exception, cancellation và cleanup thế nào bằng điều kiện và kết quả quan sát được. |
- id: fork-join-019
  title: Ví dụ tìm kiếm không đều và dừng sớm bằng CountedCompleter
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Ví dụ tìm kiếm không đều và dừng sớm bằng CountedCompleter**

    Khi tìm một giá trị trong **cây có các nhánh dài/ngắn không đều**, một cách đơn giản là dùng đệ quy tuần tự: duyệt từng nhánh cho đến khi tìm thấy. Khi dữ liệu đủ lớn, có thể chia nhiều nhánh cho các worker trong `ForkJoinPool` xử lý song song. Tuy nhiên, nếu đã tìm được kết quả, việc bắt toàn bộ nhánh còn lại chạy xong rồi mới trả về thường lãng phí.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Hiểu chính xác giao thức pending count

    1. Work stealing phù hợp cây tìm kiếm nhánh không đều thế nào?
    2. AtomicReference bảo đảm công bố winner như thế nào?

    ### Tự kiểm tra kiến thức

    1. quietlyCompleteRoot có dừng mọi child đang chạy chưa?
    2. Nếu không tìm được match cần hoàn tất cây thế nào?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích work stealing phù hợp cây tìm kiếm nhánh không đều thế nào với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề quietlyCompleteRoot có dừng mọi child đang chạy chưa. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp nếu không tìm được match cần hoàn tất cây thế nào bằng điều kiện và kết quả quan sát được. |
- id: fork-join-020
  title: 'ForkJoinPool asyncMode: chế độ FIFO cho tác vụ kiểu sự kiện không join'
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **ForkJoinPool asyncMode: chế độ FIFO cho tác vụ kiểu sự kiện không join**

    - Giải thích **ForkJoinPool.asyncMode**, sự khác biệt giữa **LIFO mặc định** và **FIFO ở deque cục bộ** của ForkJoin worker.
    - Phân biệt tác vụ được **fork từ worker**, tác vụ được **submit từ thread bên ngoài**, cơ chế **work stealing**, và tác vụ dạng **event không join**.
    - Khởi tạo ForkJoinPool Java 17+ với asyncMode=true bằng constructor bốn tham số; biết kiểm tra bằng getAsyncMode().
    - Nhận ra **FIFO local không phải FIFO toàn cục**, không bảo đảm thứ tự bắt đầu hay hoàn thành trong một pool có nhiều worker.
    - Chọn giữa mô hình chia để trị có join và event-style task không join; tổ chức completion, báo lỗi và shutdown nếu parent không chờ từng child.
    - Đánh giá chi phí tạo ta

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Work stealing và sự khác biệt giữa start/completion

    1. asyncMode thay đổi xu hướng FIFO/LIFO của deque ra sao?
    2. Vì sao FIFO local không thành FIFO toàn pool?

    ### Tự kiểm tra

    1. Unjoined event task cần theo dõi lỗi và completion thế nào?
    2. Khi nào asyncMode có lợi và cần đo ra sao?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích asyncMode thay đổi xu hướng FIFO/LIFO của deque ra sao với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề unjoined event task cần theo dõi lỗi và completion thế nào. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp khi nào asyncMode có lợi và cần đo ra sao bằng điều kiện và kết quả quan sát được. |
- id: fork-join-021
  title: 'Vòng đời commonPool và pool riêng: shutdown, close và awaitTermination'
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Vòng đời commonPool và pool riêng: shutdown, close và awaitTermination**

    `java.util.concurrent.ForkJoinPool` là một `ExecutorService` sử dụng work-stealing: các worker xử lý `ForkJoinTask`, có thể lấy thêm công việc từ queue của nhau và hỗ trợ các thuật toán chia để trị. Ngoài `fork()/join()`, ứng dụng còn có thể `execute()`, `submit()`, `invoke()` các tác vụ.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Bản chất và cơ chế

    1. shutdown trên commonPool khác pool riêng ra sao?
    2. Quiescent và terminated khác nhau về trạng thái nào?

    ### Khi nào không nên dùng common pool?

    1. awaitTermination khác awaitQuiescence ở điều kiện gì?
    2. close trên Java 21 cần lưu ý ownership và interrupt thế nào?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích shutdown trên commonPool khác pool riêng ra sao với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề awaitTermination khác awaitQuiescence ở điều kiện gì. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp close trên Java 21 cần lưu ý ownership và interrupt thế nào bằng điều kiện và kết quả quan sát được. |
- id: fork-join-022
  title: ForkJoinTask.cancel() so với adaptInterruptible(Callable) trên Java 21
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **ForkJoinTask.cancel() so với adaptInterruptible(Callable) trên Java 21**

    Trong Fork/Join, một tác vụ có thể đã được đưa vào hàng đợi, đang chạy trên worker hoặc đã hoàn thành. Khi caller không còn cần kết quả, phương thức `ForkJoinTask.cancel(boolean mayInterruptIfRunning)` cho phép **chuyển trạng thái của task sang canceled** nếu việc hủy thành công. Nhưng **canceled không mặc nhiên có nghĩa thread đang chạy đã bị interrupt hoặc thân task đã dừng**.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Vấn đề: hủy trạng thái Future khác với dừng tác vụ đang chạy

    1. ForkJoinTask.cancel(true) có buộc ngắt worker không?
    2. adaptInterruptible(Callable) Java 21 khác adapt như thế nào?

    ### Câu hỏi tự kiểm tra

    1. Hủy root có tự dừng toàn bộ child không?
    2. Làm sao thiết kế cooperative interruption và cleanup?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích forkJoinTask.cancel(true) có buộc ngắt worker không với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề hủy root có tự dừng toàn bộ child không. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp làm sao thiết kế cooperative interruption và cleanup bằng điều kiện và kết quả quan sát được. |
- id: fork-join-023
  title: ManagedBlocker.isReleasable(), block() và giới hạn bù luồng khi chặn
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **ManagedBlocker.isReleasable(), block() và giới hạn bù luồng khi chặn**

    `ForkJoinPool` được tối ưu cho công việc có thể chia nhỏ rồi kết hợp kết quả. Các worker lấy task trong hàng đợi và có thể **work-steal** khi rảnh. Khi một task đang chạy CPU, worker đóng góp tiến độ; khi task đang chờ `BlockingQueue.take()`, `ReentrantLock.lock()`, một tín hiệu từ thread khác hoặc I/O, worker có thể không làm việc hữu ích trong thời gian đó.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Blocking và giới hạn compensation

    1. isReleasable() có hợp đồng idempotent và nonblocking gì?
    2. block() trả boolean biểu thị tiến triển như thế nào?

    ### Câu hỏi tự kiểm tra

    1. Giới hạn spare worker làm compensation thất bại ra sao?
    2. Lock ownership, timeout và interrupt cần kiểm tra thế nào?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích isReleasable() có hợp đồng idempotent và nonblocking gì với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề giới hạn spare worker làm compensation thất bại ra sao. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp lock ownership, timeout và interrupt cần kiểm tra thế nào bằng điều kiện và kết quả quan sát được. |
