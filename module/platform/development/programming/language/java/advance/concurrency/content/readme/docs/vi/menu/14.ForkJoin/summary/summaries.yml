    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Blocking I/O và `ForkJoinPool`

    1. compute(), fork() và join() lần lượt làm gì?
    2. Vì sao fork rồi join ngay thường thiếu parallelism hữu ích?

    ### Câu hỏi tự kiểm tra

