    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích pending count của CountedCompleter thực sự biểu diễn gì với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề mẫu N child+self khác child-only ra sao. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp làm sao chứng minh cây completer không báo thiếu tín hiệu bằng điều kiện và kết quả quan sát được. |
- id: fork-join-015
