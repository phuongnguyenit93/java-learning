    | Giải thích cơ chế và các giả định | Phân tích compute(), fork() và join() lần lượt làm gì với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề thứ tự fork-compute-join cần bảo vệ điều kiện gì. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp ngoại lệ và dependency cycle ảnh hưởng join ra sao bằng điều kiện và kết quả quan sát được. |
- id: fork-join-005
  title: Chiến lược chia nhỏ và ngưỡng threshold
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Chiến lược chia nhỏ và ngưỡng threshold**

    Khi tính tổng một mảng lớn, biến đổi ảnh, xử lý một cây hoặc tìm kiếm qua nhiều nhánh, ta có thể phân chia bài toán thành các phần độc lập rồi gộp kết quả. Mô hình **Fork/Join** giúp thực hiện kiểu divide-and-conquer này bằng các worker trong `ForkJoinPool`. Nhưng tạo ra nhiều task không tự động nhanh hơn: mỗi lần chia đều phải trả chi phí tạo object, scheduling, work stealing, fork/join và gộp kết quả.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Checklist khi review một thuật toán Fork/Join

    1. Threshold tác động kích cỡ task và cây phân rã thế nào?
    2. Cách chọn midpoint và base case không bỏ sót dữ liệu?

    ### Những giới hạn và lỗi thường gặp

    1. Khi nào threshold theo số phần tử là không phù hợp?
    2. Làm sao tuning cutoff bằng đo đạc có căn cứ?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích threshold tác động kích cỡ task và cây phân rã thế nào với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề khi nào threshold theo số phần tử là không phù hợp. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp làm sao tuning cutoff bằng đo đạc có căn cứ bằng điều kiện và kết quả quan sát được. |
- id: fork-join-006
  title: Tránh tạo quá nhiều tác vụ nhỏ
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Tránh tạo quá nhiều tác vụ nhỏ**

    - Giải thích **Fork/Join** và vì sao chiến lược chia để trị (*divide and conquer*) không có nghĩa “càng chia nhỏ càng nhanh”.
    - Phân biệt **đơn vị dữ liệu**, **đơn vị tính toán**, **ForkJoinTask** và **platform thread**: một task không đồng nghĩa một thread.
    - Hiểu chi phí của **fork(), join(), quản lý hàng đợi, work stealing, cấp phát đối tượng, hợp nhất kết quả**, và lý do tác vụ quá nhỏ khiến overhead lấn át công việc có ích.
    - Chọn **sequential cutoff/threshold**, giới hạn độ sâu chia, hoặc **batching/chunking** để số task có ý nghĩa đối với kích cỡ dữ liệu và số worker.
    - Dùng mẫu **fork một nhánh, compute trực tiếp nhánh còn lại, join nhánh đã fork**; nhận ra khi nào nên xử l

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Blocking I/O trong ForkJoinPool: vấn đề khác granularity

    1. Vì sao task cực nhỏ tạo overhead lớn hơn việc tính toán?
    2. Task count liên hệ thế nào với worker và parallelism?

    ### Câu hỏi tự kiểm tra

    1. Batching, max depth và fast path nên dùng lúc nào?
    2. Làm sao kiểm chứng tối ưu task vẫn giữ kết quả đúng?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích vì sao task cực nhỏ tạo overhead lớn hơn việc tính toán với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề batching, max depth và fast path nên dùng lúc nào. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp làm sao kiểm chứng tối ưu task vẫn giữ kết quả đúng bằng điều kiện và kết quả quan sát được. |
- id: fork-join-007
  title: Phân biệt invoke(), execute() và submit()
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Phân biệt invoke(), execute() và submit()**

    Khi dùng `ForkJoinPool`, ba phương thức **`invoke()`**, **`execute()`** và **`submit()`** đều có thể đưa một tác vụ vào pool, nhưng **khác nhau ở việc thread gọi có chờ hay không, kiểu trả về và cách lấy kết quả/lỗi**. Nếu nhầm chúng, ứng dụng có thể chờ ngoài ý muốn, bỏ qua exception hoặc không có cơ chế xác nhận task đã hoàn tất.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### So sánh theo hợp đồng API

    1. invoke(), execute() và submit() khác nhau về blocking ra sao?
    2. Method nào trả handle để đợi hoặc kiểm tra exception?

    ### Câu hỏi tự kiểm tra

    1. Khi nào chọn API tương ứng với nhu cầu kết quả?
    2. Vì sao submit trước không bảo đảm hoàn tất trước?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích invoke(), execute() và submit() khác nhau về blocking ra sao với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề khi nào chọn API tương ứng với nhu cầu kết quả. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp vì sao submit trước không bảo đảm hoàn tất trước bằng điều kiện và kết quả quan sát được. |
- id: fork-join-008
  title: ForkJoinPool.commonPool() và tác vụ dùng chung
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **ForkJoinPool.commonPool() và tác vụ dùng chung**

    > **Cốt lõi:** `ForkJoinPool.commonPool()` trả về một **Fork/Join executor dùng chung trong cùng JVM**, không tạo pool riêng cho mỗi lời gọi hoặc module. Nhiều tác vụ `ForkJoinTask`, các thao tác bất đồng bộ `CompletableFuture` không chỉ định executor (theo quy tắc mặc định) và nhiều parallel-stream computations có thể cùng chia sẻ hạ tầng thực thi này. Do đó tác vụ CPU nặng hoặc blocking không kiểm soát ở thành phần A có thể làm thành phần B bị chậm. Cần phân biệt **chia sẻ pool**, **chia sẻ worker**, **chia sẻ dữ liệu** và **cô lập tài nguyên**: đây là những khái niệm khác nhau.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Pool dùng chung + blocking I/O: nguyên nhân latency khó tìm

    1. commonPool() dùng chung worker giữa những thành phần nào?
    2. Work stealing trong common pool có ngăn can nhiễu tải không?

    ### Câu hỏi tự kiểm tra

    1. Khi nào cần pool riêng thay vì commonPool?
    2. Vì sao vòng đời commonPool khác dedicated pool?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích commonPool() dùng chung worker giữa những thành phần nào với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề khi nào cần pool riêng thay vì commonPool. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp vì sao vòng đời commonPool khác dedicated pool bằng điều kiện và kết quả quan sát được. |
- id: fork-join-009
  title: Blocking operation trong Fork/Join và ManagedBlocker
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Blocking operation trong Fork/Join và ManagedBlocker**

    `ForkJoinPool` được thiết kế chủ yếu cho công việc **chia để trị (divide-and-conquer)**: tách một bài toán lớn thành các `ForkJoinTask` nhỏ, worker thực thi task và có thể **work-stealing** lấy công việc từ hàng đợi của worker khác. Cơ chế này phát huy hiệu quả khi các task chủ yếu **tính toán và có khả năng tiến triển**, thay vì phải chờ một tài nguyên bên ngoài quá lâu.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Phân biệt work-stealing, fork/join waiting và blocking bên ngoài

    1. Blocking I/O trong ForkJoinPool khác chờ join như thế nào?
    2. ManagedBlocker giao tiếp với pool qua hai method nào?

    ### Kiểm tra và theo dõi khi vận hành

    1. Vì sao compensation không thể được bảo đảm tuyệt đối?
    2. Cần xử lý timeout, interrupt và liveness thế nào?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích blocking I/O trong ForkJoinPool khác chờ join như thế nào với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề vì sao compensation không thể được bảo đảm tuyệt đối. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp cần xử lý timeout, interrupt và liveness thế nào bằng điều kiện và kết quả quan sát được. |
- id: fork-join-010
  title: Task dependency và nguy cơ chờ vòng
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Task dependency và nguy cơ chờ vòng**

    `ForkJoinPool` là một executor chuyên xử lý nhiều tác vụ có thể phân rã thành các subtasks. Thuật toán điển hình chia vấn đề lớn thành những nhánh độc lập, chạy các nhánh đó khi có workers, rồi ghép kết quả bằng `join()`. Cơ chế **work-stealing** giúp workers tìm thêm việc từ những worker khác.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Bản chất và cơ chế

    1. Đồ thị task phụ thuộc có cycle khác DAG ra sao?
    2. Vì sao work stealing không thể sửa vòng A chờ B chờ A?

    ### Lỗi phổ biến khi code review

    1. Giữ lock hoặc permit khi join gây vòng gián tiếp như thế nào?
    2. Làm sao kiểm tra cycle và tránh deadlock?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích đồ thị task phụ thuộc có cycle khác DAG ra sao với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề giữ lock hoặc permit khi join gây vòng gián tiếp như thế nào. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp làm sao kiểm tra cycle và tránh deadlock bằng điều kiện và kết quả quan sát được. |
- id: fork-join-011
  title: Benchmark so với thực thi tuần tự
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Benchmark so với thực thi tuần tự**

    Fork/Join giúp chia một công việc thành những phần nhỏ để nhiều worker xử lý đồng thời, rồi ghép kết quả. Tuy nhiên, **có thể chia được** không có nghĩa **chạy nhanh hơn**. Khi công việc ngắn, số lượng phần nhỏ quá lớn, memory bandwidth bị nghẽn hoặc máy không có đủ lõi CPU, chi phí tạo task, scheduling, work stealing và ghép kết quả có thể vượt phần thời gian tiết kiệm.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Những sai lầm riêng của thuật toán Fork/Join

    1. Điều kiện nào tạo benchmark Fork/Join so với tuần tự công bằng?
    2. Chi phí chia và gộp task ảnh hưởng speedup thế nào?

    ### Câu hỏi tự kiểm tra

    1. JIT, warmup, GC, CPU và threshold tác động phép đo thế nào?
    2. Khi nào cần JMH thay phép đo nanoTime đơn lẻ?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích điều kiện nào tạo benchmark Fork/Join so với tuần tự công bằng với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề jIT, warmup, GC, CPU và threshold tác động phép đo thế nào. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp khi nào cần JMH thay phép đo nanoTime đơn lẻ bằng điều kiện và kết quả quan sát được. |
