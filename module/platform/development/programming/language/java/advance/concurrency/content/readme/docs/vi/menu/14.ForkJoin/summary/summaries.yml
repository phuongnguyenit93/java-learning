- id: fork-join-016
  title: 'tryComplete(), propagateCompletion() và onCompletion(): cơ chế lan truyền hoàn tất'
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **tryComplete(), propagateCompletion() và onCompletion(): cơ chế lan truyền hoàn tất**

    Khi dùng `ForkJoinPool` theo mô hình `RecursiveTask`, lập trình viên thường tạo hai task con, gọi `fork()` và chờ `join()`. Tuy nhiên, không phải thuật toán song song nào cũng phù hợp với kiểu **cha đợi từng con**. Một số bài toán là fan-out/fan-in: rất nhiều tác vụ con có độ dài khác nhau, và khi đủ tín hiệu hoàn tất thì một tác vụ cha cần thực hiện bước tiếp theo **mà không bắt một worker ngồi chờ từng child**.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Pending count: không đơn giản là “số child”

    1. tryComplete() làm gì khi pending khác 0 và khi bằng 0?
    2. propagateCompletion khác gì so với tryComplete?

    ### Câu hỏi tự kiểm tra

    1. onCompletion(caller) chạy theo đường tín hiệu nào?
    2. Cách tổng hợp kết quả trong callback bảo đảm visibility ra sao?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích tryComplete() làm gì khi pending khác 0 và khi bằng 0 với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề onCompletion(caller) chạy theo đường tín hiệu nào. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp cách tổng hợp kết quả trong callback bảo đảm visibility ra sao bằng điều kiện và kết quả quan sát được. |
