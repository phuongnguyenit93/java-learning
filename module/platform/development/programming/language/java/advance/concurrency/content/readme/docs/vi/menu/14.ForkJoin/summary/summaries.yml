summaries:
- id: fork-join-001
  title: Fork/Join và divide-and-conquer
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Fork/Join và divide-and-conquer**

    Khi cần xử lý một khối dữ liệu lớn, đôi khi ta có thể **chia bài toán lớn thành các bài toán con độc lập**, cho nhiều worker xử lý đồng thời rồi **gộp kết quả**. Đây là tư duy *divide-and-conquer* (chia để trị). Java cung cấp **Fork/Join Framework** trong `java.util.concurrent` để hiện thực hóa kiểu tác vụ này, đặc biệt khi khối lượng tính toán chủ yếu sử dụng CPU.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### CPU-bound tốt, blocking I/O cần thận trọng

    1. Bài toán chia để trị cần thỏa điều kiện độc lập nào?
    2. Base case và combine bảo đảm kết quả đúng thế nào?

    ### Tự kiểm tra kiến thức

    1. Khi nào nên fork một nhánh và tính trực tiếp nhánh còn lại?
    2. Những trường hợp nào Fork/Join thua thực thi tuần tự?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích bài toán chia để trị cần thỏa điều kiện độc lập nào với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề khi nào nên fork một nhánh và tính trực tiếp nhánh còn lại. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp những trường hợp nào Fork/Join thua thực thi tuần tự bằng điều kiện và kết quả quan sát được. |
- id: fork-join-002
  title: ForkJoinPool và cơ chế work stealing
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **ForkJoinPool và cơ chế work stealing**

    `ForkJoinPool` là một executor chuyên xử lý những bài toán có thể **chia thành các tác vụ con (fork)** rồi **kết hợp kết quả (join)**. Thay vì chỉ có một hàng đợi công việc tập trung và mỗi thread nhận một task hoàn chỉnh, các worker trong pool có thể tạo thêm tác vụ con khi đang xử lý một bài toán lớn. **Work stealing** giúp worker đã rảnh lấy một phần công việc còn chờ ở worker khác, nhờ vậy những nhánh đệ quy lớn/nhỏ không đều có cơ hội được cân bằng tải tốt hơn.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Blocking I/O: điểm yếu phải thiết kế riêng

    1. Deque của worker và cơ chế work stealing hoạt động thế nào?
    2. Vì sao worker rảnh thường steal ở đầu đối diện?

    ### Câu hỏi tự kiểm tra

    1. Parallelism khác số task và số thread như thế nào?
    2. Blocking ảnh hưởng việc cân bằng nhánh không đều ra sao?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích deque của worker và cơ chế work stealing hoạt động thế nào với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề parallelism khác số task và số thread như thế nào. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp blocking ảnh hưởng việc cân bằng nhánh không đều ra sao bằng điều kiện và kết quả quan sát được. |
- id: fork-join-003
  title: RecursiveTask<V> so với RecursiveAction
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **RecursiveTask<V> so với RecursiveAction**

    **Fork/Join Framework** trong `java.util.concurrent` là mô hình thực hiện tác vụ chia để trị: chia bài toán thành những phần đủ độc lập, phân phối công việc lên các worker, rồi chờ và tổng hợp khi cần. **ForkJoinPool** dùng **work stealing** để các worker đang nhàn rỗi có thể lấy việc từ những worker khác, qua đó cân bằng tải của tác vụ có thể chia nhỏ.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Tổng quan: cùng Fork/Join, khác hợp đồng kết quả

    1. RecursiveTask<V> khác RecursiveAction ở contract nào?
    2. Khi nào cần kết quả trả về thay vì side effect?

    ### Những lỗi phổ biến

    1. Làm sao chia vùng dữ liệu an toàn cho RecursiveAction?
    2. Cách xử lý lỗi và join có ảnh hưởng dữ liệu thế nào?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cơ chế và các giả định | Phân tích recursiveTask<V> khác RecursiveAction ở contract nào với ví dụ từ bài học. |
    | Thiết kế hướng áp dụng | Xây dựng lập luận hoặc chương trình minh họa cho vấn đề làm sao chia vùng dữ liệu an toàn cho RecursiveAction. |
    | Kiểm tra giới hạn và lỗi | Đánh giá trường hợp cách xử lý lỗi và join có ảnh hưởng dữ liệu thế nào bằng điều kiện và kết quả quan sát được. |
- id: fork-join-004
  title: compute(), fork() và join()
  summary: |
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **compute(), fork() và join()**

