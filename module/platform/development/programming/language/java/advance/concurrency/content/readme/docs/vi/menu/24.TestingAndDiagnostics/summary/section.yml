version: 1
type: LEARNING_ROADMAP
title: "KIỂM THỬ & CHẨN ĐOÁN — MẠCH LIÊN KẾT BÀI HỌC"
roadmapHeading: "Mạch liên kết bài học"
roadmap:
  - id: testing-and-diagnostics-001
    order: 1
    title: "Test tính đúng đắn khi nhiều tác vụ cùng truy cập state"
    description: "Bài mở đầu xây dựng oracle cho tính đúng đắn của concurrent state, phân biệt safety với liveness và đo atomicity, visibility, ordering. Những ví dụ lost update và bất biến nhiều trường cho thấy vì sao chạy nhiều thread mà không nêu expected outcome không phải một phép kiểm thử."
    transition:
      to: testing-and-diagnostics-002
      description: "Từ xác định safety, liveness và invariant khi nhiều task sửa shared mutable state, chuyển sang ép interleaving bằng latch và barrier để tái hiện race có xác định để hoàn thiện cách kiểm thử và chẩn đoán trong Java concurrency."
  - id: testing-and-diagnostics-002
    order: 2
    title: "Tái hiện race condition với latch/barrier"
    description: "Bài tập tập trung vào CountDownLatch và CyclicBarrier để cưỡng bức hai worker đọc cùng trạng thái trước khi ghi, rồi so sánh counter thường với giải pháp nguyên tử. Người học phân biệt race, data race, check-then-act và bảo đảm test không treo khi lỗi."
    transition:
      to: testing-and-diagnostics-003
      description: "Từ ép interleaving bằng latch và barrier để tái hiện race có xác định, chuyển sang chờ sự kiện đồng bộ thay vì ngủ đoán lịch chạy để hoàn thiện cách kiểm thử và chẩn đoán trong Java concurrency."
  - id: testing-and-diagnostics-003
    order: 3
    title: "Không dùng Thread.sleep() thay cho điều kiện đồng bộ trong test"
    description: "Bài này chuyển các test dựa trên Thread.sleep sang chờ sự kiện bằng latch, Future, barrier hoặc BlockingQueue. Người học xác nhận worker tới đúng checkpoint, phân biệt việc đã xảy ra với việc chưa được phép xảy ra, và loại bỏ phụ thuộc tốc độ máy."
    transition:
      to: testing-and-diagnostics-004
      description: "Từ chờ sự kiện đồng bộ thay vì ngủ đoán lịch chạy, chuyển sang kiểm thử timeout, interruption và trạng thái cancellation có điều kiện để hoàn thiện cách kiểm thử và chẩn đoán trong Java concurrency."
  - id: testing-and-diagnostics-004
    order: 4
    title: "Test timeout, interruption và cancellation"
    description: "Bài này tách ba tín hiệu dễ bị nhầm: timeout ở nơi chờ, interruption ở thread và cancellation ở Future. Các tình huống Java 17 kiểm tra task queued, running, interruptible và không hợp tác với interrupt mà không đồng nhất hủy với rollback."
    transition:
      to: testing-and-diagnostics-005
      description: "Từ kiểm thử timeout, interruption và trạng thái cancellation có điều kiện, chuyển sang kiểm thử shutdown khi task chạy, queued hoặc đang chờ để hoàn thiện cách kiểm thử và chẩn đoán trong Java concurrency."
  - id: testing-and-diagnostics-005
    order: 5
    title: "Test shutdown khi task đang chờ hoặc đang chạy"
    description: "Bài này tạo bài test shutdown với một worker đang block và task khác trong queue. Người học phân biệt isShutdown với isTerminated, kiểm tra graceful/forced shutdown và tránh kết luận sai rằng interrupt tức thì dừng task."
    transition:
      to: testing-and-diagnostics-006
      description: "Từ kiểm thử shutdown khi task chạy, queued hoặc đang chờ, chuyển sang kiểm chứng invariant dữ liệu end-to-end bằng ID thay vì chỉ đếm tổng để hoàn thiện cách kiểm thử và chẩn đoán trong Java concurrency."
  - id: testing-and-diagnostics-006
    order: 6
    title: "Kiểm tra invariant và lỗi mất dữ liệu"
    description: "Bài này phát triển kiểm thử invariant từ counter mất cập nhật sang pipeline producer–consumer có ID riêng, tập dữ liệu accepted/processed và trạng thái nhiều trường. Người học tính expected outcome rõ ràng kể cả khi task thất bại, retry hoặc cancel."
    transition:
      to: testing-and-diagnostics-007
      description: "Từ kiểm chứng invariant dữ liệu end-to-end bằng ID thay vì chỉ đếm tổng, chuyển sang dùng jcstress chạy actor test cho race và Java Memory Model để hoàn thiện cách kiểm thử và chẩn đoán trong Java concurrency."
  - id: testing-and-diagnostics-007
    order: 7
    title: "Kiểm tra contention/stress với jcstress (công cụ ngoài JDK)"
    description: "Bài chuyên sâu giới thiệu jcstress là công cụ ngoài JDK, cách tạo dự án harness và mô tả actor/arbiter cùng outcome ACCEPTABLE, ACCEPTABLE_INTERESTING, FORBIDDEN. Ví dụ lost update và publication giúp người học đọc báo cáo mà không suy diễn kết quả chưa xuất hiện là bất khả thi."
    transition:
      to: testing-and-diagnostics-008
      description: "Từ dùng jcstress chạy actor test cho race và Java Memory Model, chuyển sang đọc thread dump và phân biệt RUNNABLE, BLOCKED, WAITING để hoàn thiện cách kiểm thử và chẩn đoán trong Java concurrency."
  - id: testing-and-diagnostics-008
    order: 8
    title: "Thread dump và nhận diện RUNNABLE/BLOCKED/WAITING"
    description: "Bài này dạy cách đọc ảnh chụp thread dump: các Thread.State, call stack, monitor và wait owner. Người học tránh nhầm RUNNABLE với CPU busy hay WAITING với deadlock, và đối chiếu nhiều snapshot cùng số liệu CPU/JFR."
    transition:
      to: testing-and-diagnostics-009
      description: "Từ đọc thread dump và phân biệt RUNNABLE, BLOCKED, WAITING, chuyển sang thu thập và phân tích thread diagnostics bằng jcmd, jstack, ThreadMXBean để hoàn thiện cách kiểm thử và chẩn đoán trong Java concurrency."
  - id: testing-and-diagnostics-009
    order: 9
    title: "jcmd Thread.print, jstack và ThreadMXBean"
    description: "Bài thực hành hướng dẫn xác định PID, lấy dump với jcmd Thread.print và jstack rồi đọc ThreadInfo qua ThreadMXBean. Người học so sánh tác vụ CLI và API trong tiến trình, chẩn đoán deadlock/contention và lưu ý về quyền, phiên bản JDK."
    transition:
      to: testing-and-diagnostics-010
      description: "Từ thu thập và phân tích thread diagnostics bằng jcmd, jstack, ThreadMXBean, chuyển sang phát hiện deadlock qua ThreadMXBean và đồ thị lock ownership để hoàn thiện cách kiểm thử và chẩn đoán trong Java concurrency."
  - id: testing-and-diagnostics-010
    order: 10
    title: "Phân tích deadlock với ThreadMXBean"
    description: "Bài này chuyên sâu vào findMonitorDeadlockedThreads/findDeadlockedThreads và ThreadInfo để phát hiện chu trình lock. Ví dụ hai monitor với CountDownLatch dẫn đến deadlock có kiểm soát, rồi phân tích khác biệt synchronized và ownable synchronizer."
    transition:
      to: testing-and-diagnostics-011
      description: "Từ phát hiện deadlock qua ThreadMXBean và đồ thị lock ownership, chuyển sang dùng JFR phân tích ThreadPark, JavaMonitorEnter và allocation theo thời gian để hoàn thiện cách kiểm thử và chẩn đoán trong Java concurrency."
  - id: testing-and-diagnostics-011
    order: 11
    title: "Java Flight Recorder cho thread park, lock và allocation"
    description: "Bài chuyên sâu sử dụng Java Flight Recorder để xem thread park, monitor enter, monitor wait và allocation events. Người học tạo recording Java 17, thu file .jfr cho JVM đang chạy và phân tích threshold, sampling, stack trace cùng overhead."
    transition:
      to: testing-and-diagnostics-012
      description: "Từ dùng JFR phân tích ThreadPark, JavaMonitorEnter và allocation theo thời gian, chuyển sang truy nguyên exception trong Future và CompletableFuture async stage để hoàn thiện cách kiểm thử và chẩn đoán trong Java concurrency."
  - id: testing-and-diagnostics-012
    order: 12
    title: "Đọc stack trace khi future và async stage lỗi"
    description: "Bài này phân tích đường đi của exception qua Future.get, CompletableFuture.join/get, CompletionException và ExecutionException. Người học dùng stack trace Caused by, stage breadcrumbs và tập hợp kết quả nhiều Future để tránh nuốt lỗi hoặc nhầm timeout/cancel với task failure."
    transition:
      to: testing-and-diagnostics-013
      description: "Từ truy nguyên exception trong Future và CompletableFuture async stage, chuyển sang ghi log có thread name, task ID và correlation ID xuyên qua executor để hoàn thiện cách kiểm thử và chẩn đoán trong Java concurrency."
  - id: testing-and-diagnostics-013
    order: 13
    title: "Log có thread name, task ID và correlation ID"
    description: "Bài này phân biệt thread name, task ID và correlation ID, đưa context qua ranh giới ExecutorService bằng ThreadLocal snapshot/restore và cảnh báo về async appender. Người học tổ chức structured log, kiểm tra worker reuse và tránh log injection/cross-tenant leak."
    transition:
      to: testing-and-diagnostics-014
      description: "Từ ghi log có thread name, task ID và correlation ID xuyên qua executor, chuyển sang chẩn đoán root cause trước khi thay đổi kích thước pool hoặc lock để hoàn thiện cách kiểm thử và chẩn đoán trong Java concurrency."
  - id: testing-and-diagnostics-014
    order: 14
    title: "Xác định nguyên nhân trước khi tinh chỉnh pool/lock"
    description: "Bài tổng kết hướng dẫn khoanh vùng bottleneck bằng queue wait, execution time, CPU, lock contention, thread dump, JFR và downstream telemetry. Người học thực hiện baseline → giả thuyết → thay đổi tối thiểu → đo lại và tránh tuning mù khiến hệ thống chậm hơn."
    transition: null
