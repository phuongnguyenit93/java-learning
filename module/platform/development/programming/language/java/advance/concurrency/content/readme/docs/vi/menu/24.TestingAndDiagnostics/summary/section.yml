  ## 2. Bảng đối chiếu các bài học

  | Tiêu chí | Bài 1 | Bài 2 | Bài 3 | Bài 4 | Bài 5 | Bài 6 | Bài 7 | Bài 8 | Bài 9 | Bài 10 | Bài 11 | Bài 12 | Bài 13 | Bài 14 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Tên | Test tính đúng đắn khi nhiều tác vụ cùng truy cập state | Tái hiện race condition với latch/barrier | Không dùng Thread.sleep() thay cho điều kiện đồng bộ trong test | Test timeout, interruption và cancellation | Test shutdown khi task đang chờ hoặc đang chạy | Kiểm tra invariant và lỗi mất dữ liệu | Kiểm tra contention/stress với jcstress (công cụ ngoài JDK) | Thread dump và nhận diện RUNNABLE/BLOCKED/WAITING | jcmd Thread.print, jstack và ThreadMXBean | Phân tích deadlock với ThreadMXBean | Java Flight Recorder cho thread park, lock và allocation | Đọc stack trace khi future và async stage lỗi | Log có thread name, task ID và correlation ID | Xác định nguyên nhân trước khi tinh chỉnh pool/lock |
  | Vấn đề cần hiểu | Kết quả đúng của nhiều thao tác truy cập state có thể kiểm chứng thế nào? | Làm sao khiến hai thread cùng chạm điểm nguy hiểm thay vì trông chờ scheduler? | Vì sao Thread.sleep gây flaky concurrency test dù đã chờ rất lâu? | Một timeout hoặc Future.cancel có thực sự khiến worker dừng? | Shutdown và shutdownNow xử lý task accepted nhưng chưa hoàn tất thế nào? | Làm thế nào phát hiện mất, trùng hoặc đảo thứ tự dữ liệu trong pipeline đồng thời? | Khi nào jcstress phát hiện outcome mà JUnit/stress loop thông thường khó tái hiện? | Một thread đang RUNNABLE hoặc WAITING có thể được kết luận đang lỗi hay không? | Dùng công cụ JDK nào để lấy bằng chứng thread của đúng JVM đang gặp sự cố? | Làm sao chứng minh chu trình chờ lock thực sự thay vì chỉ thấy nhiều BLOCKED? | Sự kiện JFR nào giúp phân biệt park, lock contention và chi phí allocation? | Tại sao stack trace tại get/join khác vị trí code đã throw và phải đọc Caused by ra sao? | Log liên thread được ghép đúng task/request như thế nào khi pool tái sử dụng worker? | Queue tăng và latency cao có thực sự do thiếu worker hay do lock/downstream? |
  | Giá trị đối với OOP/module | Phát hiện kết quả sai do đan xen và quan sát sau happens-before | Tạo reproduction test ổn định để chứng minh và sửa race condition | Thiết kế test có mốc kiểm chứng được và timeout hữu hạn | Xác nhận đúng trạng thái task và hợp đồng tín hiệu hủy | Chứng minh lifecycle và tác động tới queued Future trước khi đóng tài nguyên | Kiểm tra conservation, uniqueness và atomic invariant kể cả khi lỗi hoặc retry | Thiết kế actor, arbiter và phân loại observed outcome đúng hợp đồng | Xác định thread đang làm gì và ai đang giữ điều kiện tiến triển | Lấy được dump và thông tin thread/lock với hiểu biết về giới hạn từng công cụ | Xác định thread IDs trong deadlock và thiết kế thứ tự lấy lock an toàn | Đọc recording với threshold/sampling phù hợp và đối chiếu latency | Giữ chuỗi nguyên nhân lỗi và ngữ cảnh stage khi dùng async API | Chẩn đoán task theo ngữ cảnh và tránh rò ThreadLocal giữa người dùng | Dẫn dắt tuning bằng số đo, thí nghiệm có thể bác bỏ và rollback |
  | Tư duy hình thành | Bắt đầu bằng contract và oracle rồi mới tạo lịch chạy | Điều phối từng pha đọc và ghi theo nguyên nhân lỗi | Chờ điều kiện thực chứ không chờ thời gian trôi | Tách caller hết thời gian, future bị hủy và worker đã ngừng | Kiểm tra điểm nhận việc, tiến độ worker và trạng thái termination | Theo dõi từng đơn vị dữ liệu và trạng thái nhất quán | Đo outcome theo JMM thay vì lấy số lần chạy làm chứng minh | Xem thread state kết hợp stack và lock owner, không phán đoán từ nhãn | Dẫn đường từ PID tới bằng chứng có thể tái kiểm tra | Chứng minh vòng chờ từ lock owner tới waiter | Tìm mối quan hệ theo thời gian trước khi kết luận nút thắt | Tách throw site, wrapper Future và observer site | Truyền context theo task, dọn đúng scope và tách thread identity | Phân tách triệu chứng khỏi nguyên nhân bằng baseline và giả thuyết |
