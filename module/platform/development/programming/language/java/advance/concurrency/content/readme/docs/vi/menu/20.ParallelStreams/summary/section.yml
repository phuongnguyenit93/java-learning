  | Tên | Stream.parallel() và parallelStream() | Spliterator và khả năng chia nguồn dữ liệu | ForkJoin common pool phía sau parallel streams | Associativity của phép reduce và tính đúng đắn | Stateless lambda và tránh shared mutable state | Ordering: forEachOrdered(), findFirst(), unordered() | Collector concurrent so với collector tuần tự | Combiner, identity và lỗi reduction khi chạy song song | Vì sao blocking I/O có thể làm nghẽn parallel stream? | Dùng benchmark để xác định ngưỡng có lợi | Tránh nested parallel streams thiếu kiểm soát |
  | Vấn đề cần hiểu | Đổi từ stream tuần tự sang song song mà vẫn bảo toàn nghĩa của pipeline | Không phải nguồn dữ liệu nào cũng phân vùng cân bằng và rẻ | Parallel stream không tự có pool dành riêng và có thể tranh chấp tài nguyên | Phân nhóm reduction song song có thể làm đổi kết quả | Lambda song song truy cập trạng thái chia sẻ khiến kết quả phụ thuộc lịch chạy | Thứ tự gặp phần tử khác thứ tự chạy và thứ tự quan sát kết quả | Collector concurrent và parallel mode độc lập, khai báo sai có thể làm hỏng reduction | Cách tách nhánh làm lộ identity và combiner không đúng contract | Dùng parallel stream để chờ I/O có thể làm nghẽn worker chung | Overhead của song song có thể lớn hơn công việc thực | Tăng tầng song song không tự tăng capacity và có thể gây tranh chấp |
