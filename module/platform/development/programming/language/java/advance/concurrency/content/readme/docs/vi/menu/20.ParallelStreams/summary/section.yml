  | Tư duy hình thành | Tách chế độ execution khỏi cam kết về tốc độ | Xem hiệu quả chia nguồn trước khi tăng số worker | Xem pool và scheduler là tài nguyên hữu hạn | Chứng minh luật gộp trước khi tối ưu | Làm sạch side effect trước khi nghĩ tới parallel speedup | Tách nghĩa kết quả khỏi scheduling | Dựa vào đặc tính accumulator thay vì suy theo tên collector | Kiểm chứng từng luật bằng phản ví dụ | Đo thời gian block và quy mô tài nguyên trước khi chọn API | Chỉ tuyên bố nhanh hơn sau benchmark tương đương | Chọn một ranh giới scheduling chính |
