questions:
  - question: "Khi nào bạn chọn direct call, Reflection hoặc MethodHandle? Hãy giải thích theo nhu cầu runtime thay vì theo performance folklore."
    answer: "Tôi bắt đầu từ requirement. Nếu target đã biết và Java call bình thường đủ dùng, direct call đơn giản và dễ maintain nhất. Reflection phù hợp khi bài toán chính là runtime metadata/member discovery hoặc invocation dựa trên metadata. MethodHandle phù hợp khi infrastructure cần executable reference có type, cần bind/adapt/compose hoặc cần tham gia runtime linkage. Tôi không chọn MethodHandle chỉ vì giả định nó luôn nhanh hơn Reflection/direct call; nếu performance là lý do thì cần benchmark đúng workload. Điểm quyết định là capability cần thiết và complexity budget, không phải độ 'low-level' của API."
    aiGenerated: true
    reviewed: false
    readmeRelated:
