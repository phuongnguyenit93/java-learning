  - question: "Why can invokeExact throw WrongMethodTypeException even when the target method appears to accept the value being passed? How would you debug it?"
    answer: "MethodHandle invocation is signature-polymorphic: the actual call-site descriptor comes from the static argument and return types present in source. invokeExact requires that descriptor to exactly equal handle.type(); it does not perform Java-source overload resolution or flexible conversions. I would print handle.type(), inspect the static type of every argument, and especially inspect the return type implied by assignment or cast. If adapters are involved, I would inspect the type before and after each adapter. I would also separate type failure from lookup/access failure: WrongMethodTypeException is an invocation-contract problem, not a member-visibility problem."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.TypedInvocation/TypedInvocation.md"
      anchor: "invocation-type-failures"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: "Explain MethodHandles.Lookup as a capability object. How do publicLookup and privateLookupIn differ, and why is privateLookupIn not an access-control bypass?"
    answer: "A Lookup carries a lookup class and lookup modes, so it represents the access capability held by code that creates MethodHandles or VarHandles. publicLookup offers public access under its contract; it cannot manufacture private access. privateLookupIn requires a suitably capable incoming Lookup and still obeys module readability and package openness rules across module boundaries. It therefore changes access context according to JVM rules rather than disabling Java access control. In this module's experiment the target class is public while the method is private: publicLookup is rejected on member access, while privateLookupIn with the appropriate caller lookup creates the handle successfully."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.LookupAccess/LookupAccess.md"
      anchor: "lookup-context"
    apiRelated:
      controller: "DynamicRuntimeController"
      methodSignature: "lookup()"

  - question: "A framework has targets with different signatures but wants one internal invocation contract. How does MethodHandle adaptation help, and when is a plain Java wrapper better?"
    answer: "The framework can resolve a target once and create new handles with bindTo, asType, insert/permute/filter, or composition so multiple targets conform to one MethodType. Callers then use one internal contract instead of repeated reflective dispatch or a wrapper class per shape. However, very deep adapter chains increase reasoning, stack-trace, and maintenance costs, and conversions or boxing can add runtime cost. If there are only a few stable shapes and a normal Java method expresses the flow more clearly, a wrapper is usually better. MethodHandle composition is most valuable when dynamic dispatch or adaptation is genuinely part of the infrastructure's core design."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.MethodHandleAdaptation/MethodHandleAdaptation.md"
      anchor: "method-handle-type-adaptation"
    apiRelated:
      controller: "DynamicRuntimeController"
      methodSignature: "methodHandle()"

  - question: "Distinguish an invokedynamic instruction being linked to a CallSite from a MutableCallSite changing target. How does target visibility affect the design?"
    answer: "Linkage and target mutation are different layers. An invokedynamic instruction is resolved and linked to a CallSite; after linkage it does not need a different CallSite every time behavior changes. A MutableCallSite keeps a fixed MethodType but can replace its MethodHandle target, so the same dynamic invoker can dispatch to a new target. MutableCallSite does not provide volatile-style visibility for updates; syncAll is used when a runtime needs to publish a group of changes, while VolatileCallSite provides stronger semantics. Formal happens-before proofs belong to Concurrency, but Dynamic Runtime still needs the key point that mutability does not automatically imply cross-thread visibility."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: ""
      anchor: ""
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: "Describe the lifecycle of an invokedynamic call site from unlinked state to target invocation. How should bootstrap failure and concurrent bootstrap be understood?"
    answer: "When the JVM needs to resolve an unlinked invokedynamic instruction, it resolves the bootstrap method and static bootstrap arguments, supplies Lookup/name/MethodType plus those arguments, and expects a CallSite whose type matches the instruction descriptor. The JVM selects and installs one linkage result, and later invocations dispatch through the CallSite's current target. If several threads reach the same unresolved site, bootstrap can run concurrently more than once, but only one result is installed, so bootstrap side effects must still be thread-safe. A non-Error Throwable becomes the cause of BootstrapMethodError, while an Error can propagate directly; an invalid or wrong-type CallSite also fails resolution. A failed site does not treat bootstrap like retryable business logic."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: ""
      anchor: ""
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: "How does the VarHandle mental model differ from MethodHandle? Use compare-and-set to explain variable type, coordinates, access mode, and the boundary with the Java Memory Model."
    answer: "MethodHandle represents an executable operation; VarHandle represents a variable or family of variables plus access semantics. For instance field int value on Counter, the variable type is int and the coordinate types include Counter. COMPARE_AND_SET therefore has shape (Counter,int,int)boolean: coordinate, expected value, new value, result. CAS updates only when the current value matches expected under the mode's comparison semantics; the module experiment succeeds for 10→20 and then rejects stale 10→30. Dynamic Runtime owns the handle shape and access-mode mechanics. Questions such as which acquire/release operations establish happens-before, whether publication is safe, or whether an algorithm is linearizable belong to Concurrency."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: ""
      anchor: ""
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: "If you had to explain Dynamic Runtime end to end to a framework engineer, how would you connect Lookup, MethodHandle, adaptation, CallSite, and invokedynamic? Where does VarHandle fit?"
    answer: "I would start with access context: Lookup determines which members the runtime is allowed to resolve. From there it creates a MethodHandle with a concrete MethodType, then binds/adapts/composes the handle to match the framework's internal call contract. If dynamic linkage is required, bootstrap receives Lookup/name/MethodType/static arguments, resolves or creates a target, adapts it to the exact call-site type, and returns a CallSite; the JVM links the invokedynamic instruction to that CallSite and future invocations use its current target. VarHandle is a parallel branch, not the next invokedynamic step: it models variable locations/families and access modes. This model keeps access capability, type contract, linkage object, and variable semantics separate instead of treating everything as 'dynamic reflection.'"
    aiGenerated: true
    reviewed: false
