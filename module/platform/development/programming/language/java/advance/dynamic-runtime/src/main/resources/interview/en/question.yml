questions:
  - question: "When would you choose a direct call, Reflection, or MethodHandle? Explain the choice from runtime requirements rather than performance folklore."
    answer: "I start from the requirement. If the target is known and an ordinary Java call is sufficient, a direct call is the simplest and easiest option to maintain. Reflection fits runtime metadata/member discovery or metadata-driven invocation. MethodHandle fits infrastructure that needs a typed executable reference, binding/adaptation/composition, or participation in runtime linkage. I would not choose MethodHandle merely because someone assumes it is always faster than Reflection or a direct call; a performance claim needs a representative benchmark. The decision is about required capability and complexity budget, not how low-level the API looks."
