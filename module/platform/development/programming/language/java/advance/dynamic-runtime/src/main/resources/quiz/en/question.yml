# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: dynamic-runtime-q01-invocation-choice
    question: "A framework knows the exact method it needs to call and requires no runtime adaptation. Which choice is most appropriate?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.Synthesis/Synthesis.md"
      anchor: "choose-invocation-mechanism"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Use Reflection to keep one uniform runtime invocation path even though the target is already known."
        explanation: "Incorrect. That may unify infrastructure, but it adds metadata/invocation complexity the scenario does not require."
      - id: B
        answer: "Use a direct Java call when the target is known and no extra dynamic capability is needed."
        explanation: "Correct. A direct call is simpler when dynamic invocation adds no runtime/design value."
      - id: C
        answer: "Use MethodHandle to normalize the call path even though no binding, adaptation, or dynamic linkage is required."
        explanation: "Incorrect. Typed handles are valuable when those capabilities are needed; otherwise they add complexity over a direct call."
      - id: D
        answer: "Use invokedynamic to defer linkage to runtime even though the target and call contract are already fixed."
        explanation: "Incorrect. invokedynamic is useful when runtime linkage adds value; here it would be unnecessary indirection."
    correctAnswerId: B

  - id: dynamic-runtime-q02-invoke-exact
    question: "A MethodHandle has type (String)String. Which statement about invokeExact is correct?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.TypedInvocation/TypedInvocation.md"
      anchor: "invoke-exact-vs-invoke"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "It searches for the nearest overload when an argument or return type at the call site differs."
        explanation: "Incorrect. MethodHandle invocation does not perform Java-source overload resolution."
      - id: B
        answer: "It automatically allows the same reference and primitive conversions that MethodHandle.asType can perform."
        explanation: "Incorrect. That is closer to invoke; invokeExact requires an exact symbolic call-site type."
      - id: C
        answer: "The call-site descriptor must exactly match the handle type or WrongMethodTypeException may be thrown."
        explanation: "Correct. invokeExact uses the exact symbolic type contract at the call site."
      - id: D
        answer: "It always returns Object, and the caller casts that Object to the desired return type afterward."
        explanation: "Incorrect. Signature-polymorphic invocation uses the static return type present at the call site."
    correctAnswerId: C

  - id: dynamic-runtime-q03-lookup-capability
    question: "In the Lookup experiment, why can publicLookup() fail while privateLookupIn(...) creates a handle for the same private method?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.LookupAccess/LookupAccess.md"
      anchor: "lookup-context"
    apiRelated:
      controller: "DynamicRuntimeController"
      methodSignature: "lookup()"
    answers:
      - id: A
        answer: "The two Lookup objects carry different lookup classes/modes, and capability is checked when the handle is created."
        explanation: "Correct. publicLookup() lacks private access, while an appropriate lookup from privateLookupIn can create the handle when access/module rules permit it."
      - id: B
        answer: "lookup.in(SecretGreeter.class) is equivalent to privateLookupIn because changing the lookup class is sufficient."
        explanation: "Incorrect. Changing the lookup class does not grant private capability; lookup modes and access rules still apply."
      - id: C
        answer: "Because SecretGreeter is public, publicLookup can create the private handle and access differs only at invocation."
        explanation: "Incorrect. Private member access is checked when the handle is created, not deferred to invocation."
      - id: D
        answer: "privateLookupIn derives private access from the public target class, so incoming Lookup capability does not affect the result."
        explanation: "Incorrect. privateLookupIn requires an appropriate incoming Lookup and still obeys module/package access rules."
    correctAnswerId: A

  - id: dynamic-runtime-q04-method-handle-adaptation
    question: "After binding the receiver of a (Greeter,String)String handle, the new handle has type (String)String. What does this demonstrate?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.MethodHandleAdaptation/MethodHandleAdaptation.md"
      anchor: "method-handle-binding"
    apiRelated:
      controller: "DynamicRuntimeController"
      methodSignature: "methodHandle()"
    answers:
      - id: A
        answer: "The original handle is mutated and permanently loses its receiver parameter."
        explanation: "Incorrect. MethodHandle is immutable; binding creates a new handle."
      - id: B
        answer: "Binding changes only display metadata while the invocation contract stays unchanged."
        explanation: "Incorrect. The new handle's actual type changes from (Greeter,String)String to (String)String."
      - id: C
        answer: "bindTo only changes the type; the receiver still has to be supplied separately during invocation."
        explanation: "Incorrect. bindTo actually captures the receiver in the new handle, so the caller no longer supplies it."
      - id: D
        answer: "Adaptation can create a new call contract while still reaching the same target operation."
        explanation: "Correct. Binding/asType/combinators create new handles whose invocation shape is better suited to the caller."
    correctAnswerId: D

  - id: dynamic-runtime-q05-guard-with-test
    question: "Which condition must hold when building MethodHandles.guardWithTest(test, target, fallback)?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.MethodHandleAdaptation/MethodHandleAdaptation.md"
      anchor: "method-handle-guards"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "test and target must have the same return type while fallback may have another type."
        explanation: "Incorrect. target and fallback must have the same type, while test must return boolean."
      - id: B
        answer: "test must return boolean, and target/fallback must share a type with a compatible parameter prefix."
        explanation: "Correct. These are central type invariants of guardWithTest."
      - id: C
        answer: "test may accept unrelated arguments because the runtime automatically reorders them to match the target."
        explanation: "Incorrect. Test parameters must be compatible with a prefix of target/fallback parameters."
      - id: D
        answer: "guardWithTest postpones all type validation until the resulting handle is invoked for the first time."
        explanation: "Incorrect. Type incompatibility can cause IllegalArgumentException while the adapter is being built."
    correctAnswerId: B

  - id: dynamic-runtime-q06-callsite-target-update
    question: "A MutableCallSite has type ()String and a dynamic invoker was created earlier. After the target changes from VERSION_1 to VERSION_2, what is correct?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.CallSite/CallSite.md"
      anchor: "call-site-target-updates"
    apiRelated:
      controller: "DynamicRuntimeController"
      methodSignature: "callSite()"
    answers:
      - id: A
        answer: "The dynamic invoker keeps calling VERSION_1 because it snapshots the target when the invoker is created."
        explanation: "Incorrect. dynamicInvoker dispatches through the CallSite's current target rather than holding an old target snapshot."
      - id: B
        answer: "The caller must create a new dynamic invoker after every setTarget before VERSION_2 can be observed."
        explanation: "Incorrect. The same previously created invoker still dispatches through the CallSite and can observe the new target."
      - id: C
        answer: "The same dynamic invoker can return VERSION_2 because it dispatches through the CallSite's current target."
        explanation: "Correct. Target mutation does not require a new invoker; the existing invoker still goes through the CallSite."
      - id: D
        answer: "setTarget unlinks the CallSite, so the next call must bootstrap or relink before invocation can continue."
        explanation: "Incorrect. Updating the target does not remove the CallSite's linkage or identity."
    correctAnswerId: C

  - id: dynamic-runtime-q07-bootstrap-failure
    question: "If an invokedynamic bootstrap method throws a RuntimeException, what does the caller normally observe?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.InvokeDynamic/InvokeDynamic.md"
      anchor: "invokedynamic-linkage-failures"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The RuntimeException always propagates unchanged because bootstrap runs outside JVM linkage."
        explanation: "Incorrect. A non-Error Throwable from bootstrap becomes the cause of BootstrapMethodError."
      - id: B
        answer: "The JVM ignores the exception, keeps the site unlinked, and retries bootstrap on every invocation."
        explanation: "Incorrect. The resolution failure is recorded for that instruction rather than treated like retryable business logic."
      - id: C
        answer: "The JVM converts it to WrongMethodTypeException because no CallSite was returned."
        explanation: "Incorrect. WrongMethodTypeException is not the generic wrapper for bootstrap failures."
      - id: D
        answer: "A BootstrapMethodError is observed, with the original RuntimeException available as its cause."
        explanation: "Correct. Non-Error bootstrap failures are wrapped in BootstrapMethodError by linkage semantics."
    correctAnswerId: D

  - id: dynamic-runtime-q08-varhandle-access-type
    question: "For a VarHandle to instance field int value on Counter, which type correctly describes COMPARE_AND_SET?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.VarHandle/VarHandle.md"
      anchor: "var-handle-access-mode-type"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "(Counter,int,int)boolean: receiver coordinate, expected value, new value, then a boolean result."
        explanation: "Correct. The access-mode type is derived from coordinate types, variable type, and the mode."
      - id: B
        answer: "(int,int)boolean: the receiver is omitted because the VarHandle has already bound the field."
        explanation: "Incorrect. An instance-field VarHandle still needs the Counter coordinate to identify the variable."
      - id: C
        answer: "(Counter,int)int: CAS returns the previous value and accepts only the new value."
        explanation: "Incorrect. That is not the shape of COMPARE_AND_SET; CAS needs expected + new and returns boolean."
      - id: D
        answer: "(Counter,Object,Object)Object: every signature-polymorphic access uses Object at runtime."
        explanation: "Incorrect. A signature-polymorphic call site still carries the concrete type of the selected access mode."
    correctAnswerId: A

  - id: dynamic-runtime-q09-varhandle-cas
    question: "A Counter starts at 10. CAS 10→20 succeeds, then CAS 10→30 immediately runs on the same Counter. What should happen?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.VarHandle/VarHandle.md"
      anchor: "var-handle-atomic-updates"
    apiRelated:
      controller: "DynamicRuntimeController"
      methodSignature: "varHandle()"
    answers:
      - id: A
        answer: "The second CAS succeeds because expected is compared with the value captured when the VarHandle was created."
        explanation: "Incorrect. Expected is compared with the current value at the time of the operation."
      - id: B
        answer: "The second CAS fails but returns the current value 20 instead of boolean false."
        explanation: "Incorrect. compareAndSet returns boolean; compareAndExchange is the operation that returns a witness/current value."
      - id: C
        answer: "The second CAS fails and the value stays 20 because the current value no longer matches expected 10."
        explanation: "Correct. A conditional atomic update writes only when the current value matches the expected value under the mode's comparison semantics."
      - id: D
        answer: "The second CAS still writes 30 but returns false to report that expected 10 was stale."
        explanation: "Incorrect. A failed CAS does not write the proposed new value."
    correctAnswerId: C

