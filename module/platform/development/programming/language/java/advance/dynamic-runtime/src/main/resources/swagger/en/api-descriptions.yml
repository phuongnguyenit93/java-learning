DynamicRuntimeController:
  methodHandle():
    summary: Observe MethodHandle binding and type adaptation
    description: Create a MethodHandle for Greeter.greet, bind the receiver so its
      type changes from (Greeter,String)String to (String)String, invoke it exactly,
      adapt it again with asType to (Object)Object, and deliberately request an incompatible
      return type to observe WrongMethodTypeException. The response exposes the type
      contract at each step.
