  varHandle():
    summary: Observe VarHandle compare-and-set
    description: Create a local Counter with value=10, successfully CAS 10→20, then
      repeat CAS with the stale expected value 10→30 and observe failure while the
      final state remains 20. The response also exposes the variable type, coordinate
      types, and MethodType for COMPARE_AND_SET.
