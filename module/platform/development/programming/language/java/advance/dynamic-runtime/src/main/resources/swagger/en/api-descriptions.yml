  lookup():
    summary: Observe MethodHandles.Lookup access capabilities
    description: Use publicLookup to resolve a private method on a public target class
      and record the resulting IllegalAccessException, then use privateLookupIn with
      the caller Lookup to create a valid handle and invoke that same member. The
      experiment isolates member access and demonstrates that lookup access is checked
      when the handle is created.
