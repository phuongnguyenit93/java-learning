  callSite():
    summary: Observe MutableCallSite target updates
    description: Create a MutableCallSite with VERSION_1 as its target, keep the same
      dynamic invoker, replace the target with VERSION_2, call syncAll, and invoke
      again. The response also records WrongMethodTypeException when setTarget receives
      a handle whose type differs from site.type().
