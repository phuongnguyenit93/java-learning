questions:
  - id: dynamic-runtime-q01-invocation-choice
    question: "Một framework biết chính xác method cần gọi và không cần runtime adaptation. Lựa chọn nào phù hợp nhất?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.Synthesis/Synthesis.md"
      anchor: "choose-invocation-mechanism"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Dùng Reflection để giữ một runtime invocation path thống nhất dù target đã biết trước."
        explanation: "Sai. Cách này có thể thống nhất infrastructure path nhưng thêm metadata/invocation complexity mà scenario hiện tại không cần."
      - id: B
        answer: "Dùng lời gọi Java trực tiếp nếu target đã biết và không cần capability động bổ sung."
        explanation: "Đúng. Cơ chế trực tiếp đơn giản hơn khi dynamic invocation không tạo thêm learning/design value."
      - id: C
        answer: "Dùng MethodHandle để chuẩn hóa call path, dù scenario không cần binding, adaptation hay dynamic linkage."
        explanation: "Sai. Typed handle có giá trị khi capability đó cần thiết; nếu không, nó chỉ tăng complexity so với direct call."
      - id: D
        answer: "Dùng invokedynamic để defer linkage tới runtime dù target và call contract đã cố định."
        explanation: "Sai. invokedynamic chỉ hợp lý khi runtime linkage thực sự tạo giá trị; ở đây nó là over-engineering."
    correctAnswerId: B

  - id: dynamic-runtime-q02-invoke-exact
    question: "Một MethodHandle có type (String)String. Điều gì đúng về invokeExact?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.TypedInvocation/TypedInvocation.md"
      anchor: "invoke-exact-vs-invoke"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Nó tự tìm overload gần nhất nếu argument hoặc return type ở call site không khớp."
        explanation: "Sai. MethodHandle invocation không thực hiện overload resolution kiểu Java source."
      - id: B
        answer: "Nó cho phép mọi reference conversion mà MethodHandle.asType có thể thực hiện."
        explanation: "Sai. Đó gần với behavior của invoke; invokeExact yêu cầu symbolic call-site type khớp chính xác."
      - id: C
        answer: "Call-site descriptor phải khớp chính xác handle type; lệch type có thể gây WrongMethodTypeException."
        explanation: "Đúng. invokeExact dùng exact symbolic type contract tại call site."
      - id: D
        answer: "Nó luôn trả Object bất kể static return type ở call site, rồi caller mới cast về kiểu mong muốn."
        explanation: "Sai. Signature-polymorphic invocation dùng static type tại call site; return type không bị cố định thành Object."
    correctAnswerId: C

  - id: dynamic-runtime-q03-lookup-capability
    question: "Trong experiment Lookup, vì sao publicLookup() thất bại còn privateLookupIn(...) có thể tạo handle cho cùng private method?"
