      methodSignature: ""
    answers:
      - id: A
        answer: "RuntimeException luôn propagate nguyên trạng vì bootstrap nằm ngoài JVM linkage."
        explanation: "Sai. Non-Error Throwable từ bootstrap được dùng làm cause của BootstrapMethodError."
      - id: B
        answer: "JVM bỏ exception, giữ call site unlinked và tự retry bootstrap ở mỗi invocation."
