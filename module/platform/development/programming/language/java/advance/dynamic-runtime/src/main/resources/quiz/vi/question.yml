      methodSignature: "lookup()"
    answers:
      - id: A
        answer: "Hai Lookup mang lookup class/modes khác nhau; capability được kiểm tra ngay khi handle được tạo."
        explanation: "Đúng. publicLookup() không có private access, còn lookup phù hợp từ privateLookupIn có thể tạo handle khi access/module rules cho phép."
      - id: B
        answer: "lookup.in(SecretGreeter.class) sẽ tương đương privateLookupIn vì chỉ cần đổi lookup class sang target."
        explanation: "Sai. Đổi lookup class không tự cấp private capability; lookup modes/access rules vẫn quyết định quyền."
      - id: C
        answer: "Vì SecretGreeter là public nên publicLookup vẫn tạo được private handle; khác biệt chỉ xuất hiện lúc invoke."
        explanation: "Sai. Private member access được kiểm tra khi handle được tạo, không bị trì hoãn tới invocation."
      - id: D
        answer: "privateLookupIn suy ra private access từ target class public nên incoming Lookup capability không ảnh hưởng kết quả."
        explanation: "Sai. privateLookupIn yêu cầu incoming Lookup phù hợp và vẫn tuân thủ module/package access rules."
    correctAnswerId: A

  - id: dynamic-runtime-q04-method-handle-adaptation
    question: "Sau khi bind receiver của handle (Greeter,String)String, handle mới có type (String)String. Điều này minh họa điều gì?"
