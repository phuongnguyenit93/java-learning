      methodSignature: "methodHandle()"
    answers:
      - id: A
        answer: "Handle gốc bị mutate tại chỗ và mất receiver parameter, nên type cũ không còn tồn tại."
        explanation: "Sai. MethodHandle là immutable; binding tạo một handle mới."
      - id: B
        answer: "Binding chỉ đổi metadata hiển thị, còn invocation contract của handle không đổi."
        explanation: "Sai. Type của handle mới thực sự thay đổi từ (Greeter,String)String thành (String)String."
      - id: C
        answer: "bindTo chỉ bỏ parameter đầu khỏi type; receiver vẫn phải được cung cấp gián tiếp khi invoke."
        explanation: "Sai. bindTo thực sự capture receiver vào handle mới; caller không truyền receiver đó nữa."
      - id: D
        answer: "Adaptation có thể tạo handle mới với call contract khác nhưng vẫn dẫn tới operation đích."
        explanation: "Đúng. Binding/asType/combinators tạo handle mới với type/shape phù hợp hơn cho caller."
    correctAnswerId: D

