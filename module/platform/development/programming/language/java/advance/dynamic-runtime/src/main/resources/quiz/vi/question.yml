  - id: dynamic-runtime-q06-callsite-target-update
    question: "Một MutableCallSite giữ type ()String và một dynamic invoker đã được tạo trước. Sau khi target đổi từ VERSION_1 sang VERSION_2, điều gì đúng?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.CallSite/CallSite.md"
      anchor: "call-site-target-updates"
    apiRelated:
      controller: "DynamicRuntimeController"
      methodSignature: "callSite()"
    answers:
      - id: A
        answer: "Dynamic invoker tiếp tục gọi VERSION_1 vì target được snapshot vào invoker khi nó được tạo."
        explanation: "Sai. dynamicInvoker dispatch qua target hiện tại của CallSite thay vì giữ snapshot target cũ."
      - id: B
        answer: "Caller phải tạo dynamic invoker mới sau mỗi setTarget thì mới có thể thấy VERSION_2."
        explanation: "Sai. Cùng invoker đã tạo trước vẫn dispatch qua CallSite và có thể quan sát target mới."
      - id: C
        answer: "Cùng dynamic invoker có thể trả VERSION_2 vì nó đi qua target hiện tại của chính CallSite."
        explanation: "Đúng. Target mutation không tạo một invoker mới; invoker hiện có vẫn dispatch qua CallSite."
      - id: D
        answer: "setTarget làm CallSite bị unlink, nên lần gọi tiếp theo phải bootstrap hoặc relink trước khi invoke."
        explanation: "Sai. Target update không làm mất linkage/identity của CallSite."
    correctAnswerId: C

  - id: dynamic-runtime-q07-bootstrap-failure
    question: "Nếu bootstrap method của một invokedynamic instruction ném một RuntimeException, caller thường quan sát gì?"
