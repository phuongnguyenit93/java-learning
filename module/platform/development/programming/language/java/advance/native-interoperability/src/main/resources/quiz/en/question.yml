# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: native-interop-q01-boundary
    question: "Why does crossing from managed Java code into native code require an explicit interoperability boundary?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.MentalModel/NativeInteroperability.md"
      anchor: "managed-native-boundary"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Because crossing the boundary always moves execution to a native-created thread that must attach to the JVM."
        explanation: "Incorrect. Native-created threads have JNI attachment rules, but an ordinary Java-to-native call does not inherently switch to a new native-created thread."
      - id: B
        answer: "Because the JVM always copies every argument into unmanaged memory and loses all lifetime information at the call site."
        explanation: "Incorrect. Argument passing depends on the bridge and signature; the broader boundary problem is ownership and safety contracts that are not fully managed by the JVM."
      - id: C
        answer: "Because JVM guarantees do not automatically extend across native memory, ABI, lifetime, and failure boundaries."
        explanation: "Correct. Crossing the boundary adds contracts that the JVM cannot fully enforce for foreign code and memory."
      - id: D
        answer: "Because entering native code suspends garbage collection for all Java objects until the foreign call returns."
        explanation: "Incorrect. Native interoperability does not imply a process-wide suspension of garbage collection for the duration of every call."
    correctAnswerId: C

  - id: native-interop-q02-abi-contract
    question: "A Java binding declares the expected parameter and return types, but the native library was built for an incompatible ABI. Which statement is most accurate?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.NativeLibraryAbi/NativeLibraryAbi.md"
      anchor: "abi-calling-convention"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The Java type declaration is sufficient because the JVM rewrites every native ABI into one universal calling convention."
        explanation: "Incorrect. The native binary still follows platform-specific calling conventions and data-layout rules."
      - id: B
        answer: "The call can still fail or corrupt state because Java-level types do not replace the native caller-callee ABI contract."
        explanation: "Correct. Architecture, calling convention, layout, and binary compatibility remain part of the native contract."
      - id: C
        answer: "Only symbol names matter; once a symbol resolves, ABI mismatches no longer affect the invocation."
        explanation: "Incorrect. Symbol resolution is necessary but does not prove that the call signature or ABI is compatible."
      - id: D
        answer: "The mismatch is automatically converted into a checked Java exception before native code is entered."
        explanation: "Incorrect. Some mismatches may surface as Java errors, while others can produce native crashes or corruption."
    correctAnswerId: B

  - id: native-interop-q03-jni-reference-lifetime
    question: "Native code needs to keep a Java object reference after the current JNI call returns. What is the correct ownership model?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.JNI/JNI.md"
      anchor: "jni-references"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Keep the local reference unchanged; local references are process-wide until the JVM exits."
        explanation: "Incorrect. Local references have a bounded JNI lifetime and are not a general cross-call ownership mechanism."
      - id: B
        answer: "Store the raw jobject value in native memory; the garbage collector treats any native copy as a root."
        explanation: "Incorrect. A raw copied handle is not automatically promoted to a durable JNI reference."
      - id: C
        answer: "Convert the object to a weak Java reference because JNI global references cannot cross native calls."
        explanation: "Incorrect. JNI global references are specifically designed to survive beyond a single native call until released."
      - id: D
        answer: "Create a global reference and later delete that global reference when the native owner is finished."
        explanation: "Correct. Global references provide explicit cross-call lifetime and must be released to avoid leaks."
    correctAnswerId: D

  - id: native-interop-q04-ffm-preview-native-access
    question: "On Java 21, which statement correctly distinguishes FFM preview enablement from native-access control?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.FFM/FFM.md"
      anchor: "ffm-restricted-operations"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Use preview enablement for Java 21 preview APIs/class files; native-access configuration separately controls restricted native operations."
        explanation: "Correct. These are separate concerns even though a program may need to account for both."
      - id: B
        answer: "Use preview enablement to authorize restricted native calls; native-access configuration is only a compile-time source check."
        explanation: "Incorrect. Preview enablement and restricted native-access control are separate runtime concerns."
      - id: C
        answer: "Use native-access configuration to enable preview class files; preview enablement only changes which native symbols Linker can resolve."
        explanation: "Incorrect. Native-access configuration does not enable preview class files, and preview enablement does not define Linker symbol visibility."
      - id: D
        answer: "Treat preview and native-access configuration as interchangeable switches because both enable the same FFM capability."
        explanation: "Incorrect. They govern different concerns and cannot be substituted for one another."
    correctAnswerId: A

  - id: native-interop-q05-spatial-bounds
    question: "The API experiment allocates an 8-byte MemorySegment and tries to read a 4-byte JAVA_INT_UNALIGNED at offset 6. What does the observation prove?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.MemorySegment/MemorySegment.md"
      anchor: "segment-spatial-bounds"
    apiRelated:
      controller: "MemorySegmentExperimentController"
      methodSignature: "spatialBounds()"
    answers:
      - id: A
        answer: "The read succeeds because an unaligned layout disables both alignment checks and segment bounds checks."
        explanation: "Incorrect. The unaligned layout removes the alignment requirement, not the segment's spatial bounds."
      - id: B
        answer: "The read fails only because offset 6 is not divisible by four; the segment size is irrelevant."
        explanation: "Incorrect. The experiment deliberately uses an unaligned layout so alignment does not explain the failure."
      - id: C
        answer: "The read is rejected because bytes 6 through 9 would exceed the segment's 8-byte spatial range."
        explanation: "Correct. A four-byte access starting at offset 6 does not fit inside the segment."
      - id: D
        answer: "The read is converted into a zero value because FFM clips accesses that cross the segment boundary."
        explanation: "Incorrect. FFM rejects the invalid access rather than silently clipping or zero-filling it."
    correctAnswerId: C

  - id: native-interop-q06-temporal-safety
    question: "After a confined Arena is closed, the experiment calls get(...) on a segment allocated by that Arena. What should the learner conclude?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.ArenaLifetime/ArenaLifetime.md"
      anchor: "temporal-safety"
    apiRelated:
      controller: "ArenaExperimentController"
      methodSignature: "temporalSafety()"
    answers:
      - id: A
        answer: "The segment remains readable until the garbage collector proves that no Java references point to it."
        explanation: "Incorrect. Closing the Arena ends the associated scope regardless of ordinary Java references to the segment object."
      - id: B
        answer: "Java-side access is rejected because the Arena-defined lifetime has ended."
        explanation: "Correct. The experiment observes the scope becoming non-live and access failing with IllegalStateException."
      - id: C
        answer: "Only writes are rejected after close; reads are allowed because they cannot corrupt native memory."
        explanation: "Incorrect. The segment is no longer valid for access after its scope is closed."
      - id: D
        answer: "Closing the Arena copies the native memory into the Java heap so later reads remain safe."
        explanation: "Incorrect. Arena close ends the lifetime; it does not transparently migrate the native contents into heap memory."
    correctAnswerId: B

  - id: native-interop-q07-arena-thread-access
    question: "A worker thread reads one segment from Arena.ofConfined() and another from Arena.ofShared(). Which behavior matches the Java 21 contract and the experiment?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.ArenaLifetime/ArenaLifetime.md"
      anchor: "arena-thread-access"
    apiRelated:
      controller: "ArenaExperimentController"
      methodSignature: "threadAccess()"
    answers:
      - id: A
        answer: "Both accesses fail because all native MemorySegments are permanently tied to the allocating thread."
        explanation: "Incorrect. Shared arenas permit access from multiple threads."
      - id: B
        answer: "Both accesses succeed because MemorySegment thread access is determined only by synchronization around get(...)."
        explanation: "Incorrect. Arena scope accessibility is checked independently of application-level synchronization."
      - id: C
        answer: "The confined access succeeds but the shared access fails because shared arenas require a virtual thread."
        explanation: "Incorrect. Shared arenas are specifically usable from multiple threads and do not require virtual threads."
      - id: D
        answer: "The confined access is rejected for the worker, while the shared segment can be accessed by that worker."
        explanation: "Correct. The experiment observes WrongThreadException for the confined segment and a successful read from the shared segment."
    correctAnswerId: D

  - id: native-interop-q08-layout-path-offset
    question: "A struct layout contains one JAVA_BYTE named kind, three bytes of explicit padding, then one JAVA_INT named value. Which derived layout result is correct?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.MemoryLayout/MemoryLayout.md"
      anchor: "layout-path-access"
    apiRelated:
      controller: "MemoryLayoutExperimentController"
      methodSignature: "structOffset()"
    answers:
      - id: A
        answer: "kind is at offset 0, value is at offset 4, and the layout size is 8 bytes."
        explanation: "Correct. The explicit three-byte padding places the int at offset 4 and the total layout occupies eight bytes."
      - id: B
        answer: "kind is at offset 0, value is at offset 1, and alignment is ignored because the layout has field names."
        explanation: "Incorrect. Naming fields does not remove padding/alignment from the layout contract."
      - id: C
        answer: "value is at offset 3 because padding bytes replace the kind byte in the layout."
        explanation: "Incorrect. Padding follows the one-byte kind field; it does not overlap that field."
      - id: D
        answer: "The offset cannot be queried from MemoryLayout and must always be hard-coded by the binding author."
        explanation: "Incorrect. Layout paths and byteOffset(...) exist specifically to derive offsets from the layout."
    correctAnswerId: A

  - id: native-interop-q09-downcall-platform-contract
    question: "The strlen experiment cannot find strlen in Linker.defaultLookup() on a particular platform. Which conclusion is safest?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "10.DowncallUpcall/DowncallUpcall.md"
      anchor: "downcall-handle"
    apiRelated:
      controller: "LinkerExperimentController"
      methodSignature: "nativeStrlen()"
    answers:
      - id: A
        answer: "The C runtime library must be unloaded, so retrying System.loadLibrary for the platform C library is always the correct fix."
        explanation: "Incorrect. defaultLookup has platform-specific lookup semantics; an empty result does not by itself diagnose an unloaded C runtime."
      - id: B
        answer: "defaultLookup is required to expose standard C runtime symbols, so an empty result proves the FunctionDescriptor is invalid."
        explanation: "Incorrect. Symbol lookup happens before the descriptor is used for a downcall, and the default lookup symbol set is platform-dependent."
      - id: C
        answer: "The default lookup does not expose that symbol in this runtime/platform context, so the binding should treat availability as a platform fact."
        explanation: "Correct. The experiment reports linker/symbol availability rather than pretending the downcall is universally available."
      - id: D
        answer: "Linker will automatically search every loaded native library after defaultLookup returns empty, so no explicit lookup strategy is needed."
        explanation: "Incorrect. Applications must use the lookup mechanisms appropriate to the library/platform; an empty default lookup does not trigger a universal automatic search."
    correctAnswerId: C

  - id: native-interop-q10-upcall-lifetime
    question: "Foreign code stores an FFM upcall stub address and may invoke it later. What lifetime rule is most important?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "10.DowncallUpcall/DowncallUpcall.md"
      anchor: "callback-lifetime"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The stub remains valid forever because executable addresses are independent of Java resource lifetime."
        explanation: "Incorrect. The upcall stub is associated with an Arena and therefore has an explicit lifetime."
      - id: B
        answer: "Keep the owning Arena alive until native code can no longer invoke the stub, then close it."
        explanation: "Correct. Native code must not keep invoking a stub after the Arena that owns it has been closed."
      - id: C
        answer: "Closing the Arena only prevents Java from reading the stub; native callers may continue using the old address safely."
        explanation: "Incorrect. Closing the owning Arena ends the stub's valid lifetime."
      - id: D
        answer: "Callback lifetime is determined only by whether the target MethodHandle is stored in a static field."
        explanation: "Incorrect. Keeping the Java target reachable does not replace the lifetime contract of the native upcall stub."
    correctAnswerId: B
