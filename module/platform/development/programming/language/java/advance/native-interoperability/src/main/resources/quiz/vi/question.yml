      - id: D
        answer: "Callback lifetime chỉ phụ thuộc target MethodHandle có được giữ trong static field hay không."
        explanation: "Sai. Giữ Java target reachable không thay thế lifetime contract của native upcall stub."
    correctAnswerId: B
