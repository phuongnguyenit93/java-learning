    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Stub tồn tại vĩnh viễn vì executable address độc lập với Java resource lifetime."
        explanation: "Sai. Upcall stub được gắn với Arena nên có lifetime rõ ràng."
      - id: B
        answer: "Giữ owning Arena alive cho tới khi native code không còn khả năng invoke stub, rồi mới close Arena."
        explanation: "Đúng. Native code không được tiếp tục gọi stub sau khi Arena sở hữu nó đã đóng."
      - id: C
        answer: "Close Arena chỉ ngăn Java đọc stub; native caller vẫn dùng old address an toàn."
