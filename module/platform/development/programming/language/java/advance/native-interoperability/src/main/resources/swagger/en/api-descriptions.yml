  threadAccess():
    summary: Compare confined and shared Arena access from a worker thread
    description: Create one confined segment and one shared segment, then let the
      same bounded worker thread read both. Confined access fails with WrongThreadException
      while shared access succeeds, exposing the Arena thread-access contract directly.
