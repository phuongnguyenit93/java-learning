MemorySegmentExperimentController:
  spatialBounds():
    summary: Observe MemorySegment spatial bounds
    description: Create an 8-byte segment, perform a valid int read at offset 0, then
      use the unaligned layout to attempt an int read at offset 6. Removing alignment
      from the experiment isolates the remaining bounds violation and records the
      resulting IndexOutOfBoundsException.
