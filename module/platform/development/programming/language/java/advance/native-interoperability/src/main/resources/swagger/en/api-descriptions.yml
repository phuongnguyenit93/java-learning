MemoryLayoutExperimentController:
  structOffset():
    summary: Observe struct offsets derived from MemoryLayout
    description: Describe a struct containing one byte, three bytes of padding, and
      an int; use PathElement, byteOffset, and select to derive the layout contract;
      then allocate a segment and read/write through those offsets. The response exposes
