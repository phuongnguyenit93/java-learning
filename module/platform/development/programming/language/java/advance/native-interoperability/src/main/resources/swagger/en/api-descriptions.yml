LinkerExperimentController:
  nativeStrlen():
    summary: Invoke native strlen through a Linker downcall
    description: Obtain the native Linker, resolve strlen through the default lookup,
      choose a size_t carrier from the platform pointer width, create a FunctionDescriptor
      and downcall MethodHandle, then pass a UTF-8 string in native memory. If the
      JVM/platform has no native linker or the default lookup does not expose strlen,
      the response records that platform boundary instead of failing or guessing an
      address.
