LinkerExperimentController:
  nativeStrlen():
    summary: Gọi strlen native qua Linker downcall
    description: Lấy native Linker, tìm symbol strlen bằng default lookup, chọn carrier
      cho size_t theo pointer width, tạo FunctionDescriptor và downcall MethodHandle,
      rồi truyền UTF-8 string trong native memory. Nếu JVM/platform không có native
      linker hoặc default lookup không expose strlen, response ghi nhận platform boundary
      đó thay vì fail hoặc đoán một address.
