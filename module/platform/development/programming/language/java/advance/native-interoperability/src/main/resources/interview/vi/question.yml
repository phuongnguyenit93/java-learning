  - question: "Bạn sẽ làm FFM upcall callback an toàn thế nào nếu native code có thể callback bất đồng bộ hoặc từ native-created thread?"
    answer: >-
      Tôi coi upcall stub là native resource có lifetime do Arena quản lý. Arena phải sống lâu hơn mọi native use có thể xảy ra, và shutdown phải dừng hoặc unregister callback ở native side trước rồi mới close Arena. Tôi cũng xác định native thread nào gọi callback, Java synchronization hay thread-confinement assumption nào tồn tại, và callback có thể reenter shared native state hay không. Trên Java 21, upcall target không được để exception escape; nếu điều đó xảy ra JVM sẽ terminate abruptly, vì vậy target cần catch/translation policy rõ ràng. Cuối cùng tôi định nghĩa ownership cho native memory và Java object mà callback capture để lifetime của callback và resource liên quan không bị lệch nhau.
