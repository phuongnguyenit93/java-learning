  - question: "Hãy giải thích spatial safety, temporal safety và thread accessibility của MemorySegment/Arena như ba câu hỏi khác nhau. Vì sao thỏa mãn chỉ một trong ba là chưa đủ?"
    answer: >-
      Spatial safety hỏi access range có nằm trọn trong segment và phù hợp layout constraint hay không. Temporal safety hỏi scope của segment còn alive hay không; close một closeable Arena chấm dứt access dù Java vẫn giữ segment object. Thread accessibility hỏi current thread có quyền access segment đó hay không, khác nhau giữa confined và shared arena. Một chương trình có thể đúng ở một chiều nhưng sai ở chiều khác: read in-bounds vẫn có thể xảy ra sau close, hoặc một confined segment còn live và in-bounds vẫn có thể bị thread sai truy cập. Vì vậy native-memory reasoning đúng phải theo dõi đồng thời range, lifetime và permitted access, cộng thêm synchronization bình thường khi shared mutable data tồn tại.
    aiGenerated: true
    reviewed: false
