  - question: "Hãy mô tả checklist end-to-end để ship một Java-to-native integration cho nhiều operating system và architecture."
    answer: >-
      Tôi bắt đầu từ lý do business phải rời managed Java, rồi xác định bridge và supported JDK versions. Tôi inventory từng native artifact theo OS/architecture, loading rule, symbol/version requirement, calling convention và data-layout assumption. Tôi định nghĩa ownership/shutdown cho library, memory, JNI reference, Arena, callback và thread; quy định native error map sang Java thế nào; và bound failure để test không dựa trên undefined behavior. CI phải chạy representative target platform thay vì coi một developer machine là bằng chứng portability. Packaging phải phân phối đúng binary mà không tạo unsafe search-path behavior. Tôi cũng document preview/native-access flags khi cần, observability/crash diagnostics, fallback khi capability unavailable và điều kiện mà feature nên tiếp tục ở managed Java.
    aiGenerated: true
