  - question: "So sánh JNI và FFM như hai lựa chọn native interoperability. Java version, native surface hiện có, maintainability và deployment ảnh hưởng quyết định ra sao?"
    answer: >-
      JNI là bridge truyền thống lâu đời và vẫn phù hợp với các JNI library sẵn có, JVM embedding qua Invocation API và ecosystem đã dựa vào generated header cùng JNIEnv. FFM cho Java một model trực tiếp hơn cho foreign memory, layout, symbol lookup, downcall và upcall, nên có thể giảm nhiều handwritten JNI glue với C-style API. Trên Java 21 FFM vẫn là preview, vì vậy preview flags và version compatibility là một phần deployment contract; Java 22 final hóa API nhưng không xóa ABI hay native-binary constraint. Tôi chọn dựa trên interface native đang có, target JDK policy, tooling/team maturity, callback và data-layout needs, portability target và chi phí maintain native artifacts thay vì coi FFM là replacement tự động cho mọi JNI integration.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "12.DecisionsSynthesis/DecisionsSynthesis.md"
      anchor: "jni-vs-ffm"
    apiRelated:
      controller: ""
