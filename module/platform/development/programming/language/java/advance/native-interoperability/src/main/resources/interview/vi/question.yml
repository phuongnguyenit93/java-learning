  - question: "Vì sao MemoryLayout và FunctionDescriptor là một phần của ABI correctness chứ không chỉ là tiện ích API? Hãy nêu failure khi một trong hai contract sai."
    answer: >-
      MemoryLayout mô tả native data shape: size, alignment, field placement, sequence, union và address. FunctionDescriptor mô tả native call signature mà Linker dùng. Đây là representation của binary contract chứ không phải metadata trang trí. Struct offset hoặc alignment sai có thể đọc nhầm byte hoặc overwrite native state lân cận. Function descriptor sai có thể truyền argument hay diễn giải return value bằng carrier/ABI classification sai. Dù symbol lookup thành công, các mismatch này vẫn có thể gây kết quả sai, Java-side validation failure, native crash hoặc silent corruption. Tôi derive offset từ layout, verify platform-dependent type và dùng generated binding/native header như evidence cho contract thay vì giả định Java object/type layout giống C.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "11.SafetyPitfalls/SafetyPitfalls.md"
