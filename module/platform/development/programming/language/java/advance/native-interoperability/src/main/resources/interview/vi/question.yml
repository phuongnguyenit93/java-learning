  - question: "Hãy đi qua experiment nativeStrlen từ symbol lookup đến kết quả length. Observation nào phụ thuộc platform, và việc không tìm thấy symbol thực sự chứng minh điều gì?"
    answer: >-
      Experiment lấy native Linker cho ABI của OS/processor hiện tại, hỏi defaultLookup về strlen, chọn Java carrier cho C size_t theo pointer width, tạo FunctionDescriptor cho size_t strlen(char*) rồi tạo downcall MethodHandle. Sau đó nó allocate UTF-8 string trong Arena và invoke handle, so native result với byte length do Java tính. Linker và symbol set của default lookup là platform fact, nên không lấy được linker hoặc không thấy strlen không chứng minh function đó không tồn tại ở mọi C environment; nó chỉ chứng minh lookup surface của runtime/platform hiện tại không cung cấp binding này. FunctionDescriptor vẫn phải khớp ABI thật trước khi call có thể được tin cậy.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "10.DowncallUpcall/DowncallUpcall.md"
      anchor: "downcall-handle"
    apiRelated:
      controller: "LinkerExperimentController"
