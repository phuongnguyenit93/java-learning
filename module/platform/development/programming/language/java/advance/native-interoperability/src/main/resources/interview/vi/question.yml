questions:
  - question: "Điều gì thay đổi khi Java đi từ managed runtime sang native code, và bạn sẽ quyết định boundary đó có thực sự đáng dùng hay không như thế nào?"
    answer: >-
      Trong managed Java, JVM quản lý object reachability, garbage collection, type safety, exception semantics và phần lớn portability của runtime. Native interoperability đưa thêm những contract nằm ngoài các guarantee đó: native allocation/ownership, ABI và architecture compatibility, library deployment, pointer lifetime, callback, native error convention và các failure có thể crash hoặc corrupt process. Tôi chỉ chấp nhận boundary này khi có nhu cầu cụ thể như tích hợp native library sẵn có, OS/hardware API, specialized memory access hoặc native ecosystem. Nếu một Java API được maintain tốt giải quyết đủ bài toán, giữ implementation ở managed Java thường giảm đáng kể rủi ro portability, deployment, observability và safety.
    aiGenerated: true
    reviewed: false
