  - question: "Một JNI component giữ Java object, callback vào Java và tạo native worker thread. Bạn sẽ audit những rule nào về lifetime, exception và thread trước khi coi nó production-safe?"
    answer: >-
      Tôi phân loại từng JNI reference theo ownership trước: local reference chỉ tồn tại trong local frame/call hợp lệ, còn object cần giữ qua nhiều call phải dùng global hoặc weak-global reference và release rõ ràng. Native code phải kiểm tra và xử lý pending Java exception trước khi tiếp tục những JNI operation không hợp lệ trong trạng thái exception. Native-created thread phải attach vào JVM trước khi dùng JNIEnv và detach theo Invocation API contract; bản thân JNIEnv là thread-specific nên không thể chia sẻ tùy ý giữa thread. Tôi cũng audit local-reference growth trong native loop dài, callback reentrancy, synchronization quanh shared native state, shutdown ordering và đảm bảo cleanup vẫn xảy ra ở cả Java lẫn native error path.
    aiGenerated: true
