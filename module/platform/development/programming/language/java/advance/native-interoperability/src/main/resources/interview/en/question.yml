  - question: "Explain spatial safety, temporal safety, and thread accessibility for MemorySegment/Arena as three different questions. Why is satisfying only one of them insufficient?"
    answer: >-
      Spatial safety asks whether an access range fits inside the segment and satisfies the chosen layout constraints. Temporal safety asks whether the segment's scope is still alive; closing a closeable Arena ends access even if Java still holds the segment object. Thread accessibility asks whether the current thread is allowed to access that segment, which differs between confined and shared arenas. A program can satisfy one dimension and still violate another: an in-bounds read can happen after close, or a live in-bounds confined segment can be touched by the wrong thread. Correct native-memory reasoning therefore tracks range, lifetime, and permitted access together, plus ordinary synchronization when shared mutable data is involved.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: ""
