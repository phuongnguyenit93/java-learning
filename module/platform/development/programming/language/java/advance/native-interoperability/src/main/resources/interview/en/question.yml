questions:
  - question: "What changes when Java crosses from the managed runtime into native code, and how would you decide whether that boundary is justified at all?"
    answer: >-
      Inside managed Java, the JVM owns object reachability, garbage collection, type safety, exception semantics, and much of the runtime portability story. Native interoperability introduces contracts that live outside those guarantees: native allocation and ownership, ABI and architecture compatibility, library deployment, pointer lifetime, callbacks, native error conventions, and failures that can crash or corrupt the process. I justify the boundary only when there is a concrete need such as an existing native library, OS or hardware API, specialized memory access, or integration with a native ecosystem. If a maintained Java API solves the same problem adequately, staying managed usually reduces portability, deployment, observability, and safety risk.
    aiGenerated: true
