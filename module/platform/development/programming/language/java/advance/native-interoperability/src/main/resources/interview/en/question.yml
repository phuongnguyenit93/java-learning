  - question: "Describe an end-to-end review checklist for shipping a Java-to-native integration to multiple operating systems and architectures."
    answer: >-
      I start from the business reason for leaving managed Java, then identify the bridge and supported JDK versions. I inventory every native artifact by OS/architecture, loading rule, symbol/version requirement, calling convention, and data-layout assumption. I define ownership and shutdown for libraries, memory, JNI references, arenas, callbacks, and threads; specify how native errors map into Java; and bound failure so tests do not rely on undefined behavior. CI must exercise representative target platforms rather than assuming one developer machine proves portability. Packaging must deliver the right binaries without unsafe search-path surprises. I also document preview/native-access flags where relevant, observability and crash diagnostics, fallback behavior when capability is unavailable, and the conditions under which the feature should remain in managed Java instead.
    aiGenerated: true
    reviewed: false
