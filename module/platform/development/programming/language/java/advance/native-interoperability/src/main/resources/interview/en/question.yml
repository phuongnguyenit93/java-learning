  - question: "Why are MemoryLayout and FunctionDescriptor part of ABI correctness rather than mere convenience? Give examples of what can go wrong when either contract is wrong."
    answer: >-
      MemoryLayout describes native data shape: size, alignment, field placement, sequences, unions, and addresses. FunctionDescriptor describes the native call signature consumed by Linker. These are representations of binary contracts, not decorative metadata. A wrong struct offset or alignment can read the wrong bytes or overwrite neighboring native state. A wrong function descriptor can pass arguments or interpret a return value with the wrong carrier/ABI classification. Even when symbol lookup succeeds, those mismatches can produce incorrect results, Java-side validation failures, native crashes, or silent corruption. I derive offsets from layouts, verify platform-dependent types, and treat generated bindings or native headers as evidence for the contract rather than assuming Java object/type layout maps directly to C.
    aiGenerated: true
    reviewed: false
