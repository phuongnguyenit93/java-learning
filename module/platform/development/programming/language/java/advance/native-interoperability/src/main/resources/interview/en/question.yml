  - question: "Walk through the nativeStrlen experiment from symbol lookup to the returned length. Which observations are platform-dependent, and what does a missing symbol prove?"
    answer: >-
      The experiment obtains the native Linker for the current OS/processor ABI, asks defaultLookup for strlen, chooses the Java carrier for C size_t from the platform pointer width, builds a FunctionDescriptor for size_t strlen(char*), and creates a downcall MethodHandle. It then allocates a UTF-8 native string inside an Arena and invokes the handle, comparing the native result with the Java-computed byte length. The linker and default-lookup symbol set are platform facts, so failure to obtain a linker or find strlen does not prove that the C function is universally absent; it only proves that this runtime/platform lookup surface does not provide that binding. The descriptor still has to match the actual ABI before a call is trustworthy.
    aiGenerated: true
    reviewed: false
    readmeRelated:
