  - question: "Compare JNI and FFM as native-interoperability choices. How do Java version, existing native surface, maintainability, and deployment influence the decision?"
    answer: >-
      JNI is the long-standing bridge and remains relevant for existing JNI libraries, JVM embedding through the Invocation API, and ecosystems already built around generated headers and JNIEnv. FFM gives Java code a more direct model for foreign memory, layouts, symbol lookup, downcalls, and upcalls, and reduces much handwritten JNI glue for many C-style APIs. On Java 21 FFM is still preview, so compile/runtime preview flags and version compatibility matter; Java 22 finalizes the API but that does not erase native ABI or deployment constraints. I choose based on the native interface already available, target JDK policy, team/tooling maturity, callback and data-layout needs, portability targets, and the cost of maintaining native artifacts rather than treating FFM as an automatic replacement for every JNI integration.
    aiGenerated: true
    reviewed: false
    readmeRelated:
