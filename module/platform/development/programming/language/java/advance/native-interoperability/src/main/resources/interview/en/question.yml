  - question: "How would you make an FFM upcall callback safe when native code may invoke it asynchronously or from native-created threads?"
    answer: >-
      I treat the upcall stub as a native resource whose lifetime is controlled by its Arena. The Arena must outlive every possible native use of the function pointer, and shutdown must first stop or unregister callbacks on the native side before closing the Arena. I also reason about which native thread invokes the callback, what Java synchronization or thread-confinement assumptions the target code makes, and whether callback code may reenter other native state. On Java 21 the upcall target must not let an exception escape; if it does, the JVM terminates abruptly, so the target needs an explicit catch/translation policy. Finally, I define ownership for any native memory or Java objects captured by the callback so callback lifetime and referenced-resource lifetime cannot diverge.
    aiGenerated: true
    reviewed: false
