  - question: "A JNI component keeps Java objects, calls back into Java, and creates native worker threads. What lifetime, exception, and thread rules would you audit before calling it production-safe?"
    answer: >-
      I first classify every JNI reference by ownership: local references stay within their valid local frame/call, while objects retained across calls need global or weak-global references with explicit release. I check that native code tests and handles pending Java exceptions before continuing with JNI operations that are unsafe in the exceptional state. Native-created threads must attach to the JVM before using JNIEnv and detach according to the Invocation API contract; JNIEnv itself is thread-specific and must not simply be shared across threads. I also audit local-reference growth in long native loops, callback reentrancy, synchronization around shared native state, shutdown ordering, and the rule that resource cleanup must still run on Java or native error paths.
    aiGenerated: true
    reviewed: false
