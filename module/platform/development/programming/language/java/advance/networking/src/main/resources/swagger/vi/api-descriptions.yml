UdpExperimentController:
  datagramTruncation():
    summary: Quan sát UDP datagram truncation
    description: Gửi một datagram 8 byte tới DatagramSocket có receive buffer 4 byte.
      Response cho thấy chỉ 4 byte được nhận, sau đó một receive bounded thứ hai timeout
      thay vì nhận thêm phần dư. Java 21 DatagramSocket contract xác định message
      dài hơn packet length sẽ bị truncate; thí nghiệm cung cấp runtime evidence phù
