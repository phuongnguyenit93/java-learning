NioExperimentController:
  selectorReadiness():
    summary: Quan sát Selector readiness cho accept và read
    description: Đăng ký ServerSocketChannel với OP_ACCEPT, tạo kết nối loopback,
      sau đó đăng ký channel đã accept với OP_READ và gửi dữ liệu. Response cho thấy
      Selector chỉ báo readiness như một hint; code dùng deadline bounded, chấp nhận
      accept() có thể trả null rồi retry, và vẫn không giả định một read sẽ xử lý
