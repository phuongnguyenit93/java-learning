UdpExperimentController:
  datagramTruncation():
    summary: Observe UDP datagram truncation
    description: Send an 8-byte datagram to a DatagramSocket using a 4-byte receive
      buffer. The response shows that only 4 bytes are delivered and then a second
      bounded receive times out instead of receiving a remainder. The Java 21 DatagramSocket
      contract specifies truncation when a message is longer than the packet length;
      the experiment provides runtime evidence consistent with that contract.
