FailureExperimentController:
  readTimeout():
    summary: Observe SO_TIMEOUT on a blocking socket read
    description: Connect two Sockets over loopback, keep the peer temporarily silent,
      configure a short SO_TIMEOUT, and observe SocketTimeoutException. After the
      timeout, that same peer sends one byte and the client reads it successfully
      on the same Socket, directly showing that a read timeout bounds the read operation
      without automatically closing the Socket.
