TcpExperimentController:
  streamFraming():
    summary: Observe that TCP reads are not message boundaries
    description: The client performs one 11-byte application write while the receiver
      intentionally reads through a 4-byte buffer. The response returns every read
      size and the reconstructed payload, showing in this setup that the sender's
      write boundary does not become a receiver-side message/read boundary.
