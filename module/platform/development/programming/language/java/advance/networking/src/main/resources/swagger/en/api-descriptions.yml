NioExperimentController:
  selectorReadiness():
    summary: Observe Selector readiness for accept and read
    description: Register a ServerSocketChannel for OP_ACCEPT, create a loopback connection,
      then register the accepted channel for OP_READ and send data. The response shows
      that Selector readiness is only a hint; the code uses bounded deadlines, permits
      accept() to return null and retries, and still does not assume one read consumes
      the full payload.
