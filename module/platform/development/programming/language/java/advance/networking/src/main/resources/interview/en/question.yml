  - question: "Describe the end-to-end boundary of Java Networking: when a failure occurs in DNS, transport, TLS, HTTP/WebSocket APIs, or business retry logic, what should this module explain and what policy should not be pushed into transport code?"
    answer: "Networking owns JDK mechanics from addressing/resolution, socket/channel I/O, timeout/cancellation, through HttpClient and WebSocket client lifecycle. TLS sits above transport, but trust stores, certificate chains, cipher/protocol security, and custom TrustManager/KeyManager behavior belong to Security & Cryptography. HTTP resource contracts, serialization/domain schema, service communication, and WebSocket subscription/message protocols belong to Integration. Retry, circuit breaker, backoff, and idempotency are resilience/application policy because a transport failure alone cannot tell whether repeating the business operation is safe. I first locate the failure stage and preserve the original cause, then hand the problem to the correct owner instead of letting networking code guess business policy."
    aiGenerated: true
