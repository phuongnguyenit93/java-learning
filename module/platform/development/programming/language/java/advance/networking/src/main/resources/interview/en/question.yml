  - question: "Why is one TCP write() not one message? If you design a custom TCP protocol, how would you handle framing, EOF, and half-close?"
    answer: "TCP provides an ordered byte stream. One sender write can be collected through multiple receiver reads, and a read is not an application-message boundary. The protocol therefore defines framing, such as fixed length, an escaped delimiter, or a length prefix, and loops until a complete frame has been collected. read=-1 means the input side reached end-of-stream; it does not describe a business message. shutdownOutput can signal end-of-stream in one direction while keeping the receive direction available, whereas full close releases the connection resource. I attach framing and lifecycle rules to the protocol instead of relying on individual read/write sizes."
    aiGenerated: true
    reviewed: false
    readmeRelated:
