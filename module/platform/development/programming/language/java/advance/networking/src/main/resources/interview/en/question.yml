  - question: "In the JDK WebSocket client, connect request(n), message fragmentation, listener CompletionStage, and send completion. Where do incorrect implementations usually confuse them?"
    answer: "request(n) controls demand in units of receive-callback invocations, not complete application messages. One text or binary message may arrive through multiple fragments, so the listener uses last to know when the message ends and should bound any accumulation buffer. The CompletionStage returned by a receive callback is a separate contract related to callback/data-object lifetime; completing that stage does not increase demand and is not the mechanism that serializes business work. Send methods return CompletableFuture<WebSocket> for completion of the local send operation; that completion is not proof that the remote business application processed the message, so an application-level acknowledgement is a separate protocol concern. Common bugs are assuming one requested callback equals one full message, treating listener-stage completion as demand, or treating send-future completion as a business acknowledgement."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: ""
