  - question: "SO_TIMEOUT fires on a blocking Socket read, yet the Socket may remain usable. How should that affect your error-handling, cancellation, and retry design?"
    answer: "SO_TIMEOUT ends the currently blocked read with SocketTimeoutException; it does not automatically close the Socket and does not prove the peer never received or processed anything. I therefore separate operation timeout from resource state: whether to close, read again, or transition connection state depends on the protocol and failure context. The module experiment demonstrates a timeout followed by a successful read on the same Socket. Cancellation is a different path: on Java 21, interrupting a virtual thread blocked in I/O on a system-default Socket, ServerSocket, or DatagramSocket wakes the thread and closes that socket, so code must not assume the same resource remains usable afterward. Retry also must not follow automatically from IOException or timeout: a side-effecting operation may have reached the peer before the response was lost. Retry, idempotency, and backoff belong to the resilience/integration policy layer, not to Socket timeout semantics."
    aiGenerated: true
    reviewed: false
