  - question: "UDP preserves datagram boundaries but does not provide TCP-style reliability. Explain how buffer truncation, DatagramSocket.connect, and delivery semantics affect protocol design."
    answer: "A datagram boundary means one receive obtains one datagram or its leading portion when the DatagramPacket is too small; the excess is truncated rather than becoming a later receive. DatagramSocket.connect only associates one peer, giving default addressing and unicast receive filtering; it does not handshake or create a reliable session. UDP can still be lost, reordered, or duplicated from the application-protocol perspective, so sequencing, acknowledgments, retries, duplicate detection, or reassembly must be defined above the JDK UDP API when required. Because this question spans truncation, peer association, and delivery semantics, it should not be reduced to the misleading idea that UDP connect is simply a lighter TCP connection."
    aiGenerated: true
    reviewed: false
