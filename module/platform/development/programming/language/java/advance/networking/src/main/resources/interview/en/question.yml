questions:
  - question: "How would you choose among Socket/TCP, Datagram/UDP, HttpClient, and the WebSocket client for a new problem? Explain from communication semantics rather than API familiarity."
    answer: "I start with the data model and peer relationship. A custom ordered byte stream with application-owned protocol/framing fits TCP Socket. Independent datagrams fit UDP when the application accepts or adds its own reliability/order semantics. HTTP request/response should normally use HttpClient so the JDK owns HTTP framing, body handling, and connection reuse. A long-lived bidirectional WebSocket conversation fits the WebSocket client. Only then do I choose the completion/concurrency model and timeout/lifecycle policy. The principle is to choose the lowest abstraction level that is actually necessary, but no lower than the problem requires."
