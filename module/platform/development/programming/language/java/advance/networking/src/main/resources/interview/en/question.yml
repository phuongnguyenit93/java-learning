  - question: "Compare blocking I/O on virtual threads, Selector readiness, and the AsynchronousSocketChannel completion model. When would you choose each?"
    answer: "Blocking plus virtual threads fits naturally sequential workflows where thread-per-task makes the code easier to reason about; on Java 21, supported blocking network I/O can suspend a virtual thread, so a high connection count does not automatically require a Selector. Selector fits an event-loop architecture that values explicit readiness multiplexing and accepts ownership of per-connection state machines; the ready set is only a hint, and the application still performs I/O and handles partial operations. AsynchronousSocketChannel fits Future/CompletionHandler-style completion when that model matches the surrounding architecture; completion still reports the bytes actually processed and pending-operation rules still matter. I choose based on control flow, state ownership, architecture, and representative workload rather than a synthetic throughput number alone."
    aiGenerated: true
    reviewed: false
