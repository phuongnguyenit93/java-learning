  - question: "A service uses HttpClient for many requests. How would you reason about client reuse, send/sendAsync, and response-body lifetime without confusing resource ownership?"
    answer: "I normally reuse HttpClient instead of constructing one per request so configuration and implementation-managed connection/resources can be shared. send blocks the caller according to BodyHandler semantics, while sendAsync returns a CompletableFuture; asynchronous completion does not guarantee downstream code never blocks. BodyHandler chooses a BodySubscriber from response metadata. With a materializing handler such as ofString, body consumption is part of completion according to that handler; with streaming handlers such as ofInputStream or ofPublisher, the caller still owns further body consumption/close/cancellation. On Java 21 the built-in HttpClient provides lifecycle methods, but I distinguish that built-in behavior from what an arbitrary custom subclass must implement."
    aiGenerated: true
    reviewed: false
