# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: networking-q01-tcp-framing
    question: "A client calls write() exactly once with 11 bytes, while the server reads through a 4-byte buffer. Which conclusion is most accurate?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.TcpSockets/TcpSockets.md"
      anchor: "tcp-message-framing"
    apiRelated:
      controller: "TcpExperimentController"
      methodSignature: "streamFraming()"
    answers:
      - id: A
        answer: "The server must receive exactly one 11-byte read because each TCP write creates a matching message boundary."
        explanation: "Incorrect. TCP exposes a byte stream; sender-side write boundaries do not become receiver-side message boundaries."
      - id: B
        answer: "The server can receive only the first 4 bytes; the rest are discarded because one read buffer was too small."
        explanation: "Incorrect. That would confuse stream I/O with UDP-style datagram truncation; unread TCP bytes remain available for later reads."
      - id: C
        answer: "The server may need multiple reads to collect all bytes, so the application protocol must define framing."
        explanation: "Correct. A stream read returns the bytes currently obtained; call boundaries do not define application messages."
      - id: D
        answer: "The server will always read 4,4,3 bytes in exactly three calls on every OS and every run."
        explanation: "Incorrect. A 4-byte buffer guarantees multiple reads for 11 bytes, but individual read sizes are not a universal transport guarantee."
    correctAnswerId: C

  - id: networking-q02-udp-truncation
    question: "A DatagramSocket receives an 8-byte datagram into a DatagramPacket whose length is 4. What matches the Java UDP API contract?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.UdpDatagrams/UdpDatagrams.md"
      anchor: "datagram-packet-addressing"
    apiRelated:
      controller: "UdpExperimentController"
      methodSignature: "datagramTruncation()"
    answers:
      - id: A
        answer: "The receive delivers at most the leading 4 bytes; the remainder is truncated rather than becoming another datagram."
        explanation: "Correct. Datagram boundaries remain, while the packet length limits how much of that datagram is delivered."
      - id: B
        answer: "The receive automatically grows the backing buffer to 8 bytes so the full datagram is always preserved."
        explanation: "Incorrect. DatagramPacket does not resize its buffer to prevent truncation."
      - id: C
        answer: "The receive returns the first 4 bytes, and the next receive is guaranteed to return the remaining 4 bytes from the same sender."
        explanation: "Incorrect. The excess is not converted into a second datagram."
      - id: D
        answer: "The receive throws BufferOverflowException before modifying the DatagramPacket because the message is too large."
        explanation: "Incorrect. The API contract is truncation to the packet length, not BufferOverflowException."
    correctAnswerId: A

  - id: networking-q03-udp-connect
    question: "A DatagramSocket calls connect(peer) for a unicast address. Which interpretation is most accurate?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.UdpDatagrams/UdpDatagrams.md"
      anchor: "datagram-connect-semantics"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "It performs a TCP-like handshake, waits for the remote peer to acknowledge the association, and then starts a reliable session."
        explanation: "Incorrect. UDP connect does not establish a TCP-style handshake or reliable session."
      - id: B
        answer: "It keeps DatagramSocket syntax but upgrades delivery into an ordered reliable stream with connection-style failure semantics."
        explanation: "Incorrect. UDP delivery, ordering, and reliability semantics do not become TCP semantics."
      - id: C
        answer: "It stores a default send destination, while receive continues accepting datagrams from unrelated peers exactly as an unconnected socket does."
        explanation: "Incorrect. For an ordinary unicast peer, a connected DatagramSocket also filters received datagrams to the associated peer."
      - id: D
        answer: "It associates one remote peer for default addressing/filtering, without creating a handshake-based reliable session or delivery guarantees."
        explanation: "Correct. This is peer association/filtering, not TCP-style connection establishment."
    correctAnswerId: D

  - id: networking-q04-socket-timeout
    question: "A blocking Socket read exceeds SO_TIMEOUT and throws SocketTimeoutException. What should be inferred?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.FailureControl/FailureControl.md"
      anchor: "socket-timeouts"
    apiRelated:
      controller: "FailureExperimentController"
      methodSignature: "readTimeout()"
    answers:
      - id: A
        answer: "The read ends with a timeout; although the object may still report open, later input is no longer valid, so a new connection is needed."
        explanation: "Incorrect. A Socket remains valid after a read SocketTimeoutException; timeout alone does not invalidate later input."
      - id: B
        answer: "The read ends with a timeout; the same Socket remains valid, so later I/O can still be attempted if protocol and connection state permit."
        explanation: "Correct. The module experiment times out and then successfully reads a new byte on the same Socket."
      - id: C
        answer: "The read ends with a timeout; that SO_TIMEOUT then acts as a shared deadline for later reads and writes until the option is changed."
        explanation: "Incorrect. SO_TIMEOUT controls blocking reads; it does not become a write deadline."
      - id: D
        answer: "The read ends with a timeout; because no byte arrived before the deadline, the application can infer the peer did not process the operation and retry safely."
        explanation: "Incorrect. A local read timeout does not establish whether the remote peer received or processed earlier work."
    correctAnswerId: B

  - id: networking-q05-selector-readiness
    question: "A Selector reports SelectionKey.isAcceptable()/isReadable() as true. How should the application interpret that signal?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.NioNetworking/NioNetworking.md"
      anchor: "selector-readiness-model"
    apiRelated:
      controller: "NioExperimentController"
      methodSignature: "selectorReadiness()"
    answers:
      - id: A
        answer: "A ready bit is a snapshot saying the Selector has already completed the operation; the application call mainly retrieves its result."
        explanation: "Incorrect. Selector readiness does not perform accept/read/write on behalf of the application."
      - id: B
        answer: "A ready bit is a snapshot guaranteeing the next non-blocking call makes some progress, although the remaining work may need later calls."
        explanation: "Incorrect. Readiness can become stale; a non-blocking call can still produce null or zero progress."
      - id: C
        answer: "A ready bit is a snapshot/hint that an operation may progress; the application performs it and still handles stale, zero, or partial outcomes."
        explanation: "Correct. This is the central Selector/SelectionKey mental model."
      - id: D
        answer: "A ready bit is a snapshot for read/write data transfer only; accept/connect transitions must instead be polled directly on their channels."
        explanation: "Incorrect. Selectors can report OP_ACCEPT and OP_CONNECT readiness when those operations are valid for the channel."
    correctAnswerId: C

  - id: networking-q06-http-send-async
    question: "What is the core difference between HttpClient.send(...) and sendAsync(...)?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.HttpClient/HttpClient.md"
      anchor: "http-sync-async"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "send waits on the caller, while sendAsync returns a CompletableFuture that represents completion of the HTTP exchange later."
        explanation: "Correct. Both use the same request/body-handler model but expose completion differently."
      - id: B
        answer: "send uses HTTP/1.1, while sendAsync is required when the client negotiates HTTP/2 multiplexing."
        explanation: "Incorrect. HTTP version support is not divided by synchronous versus asynchronous send methods."
      - id: C
        answer: "sendAsync guarantees request processing and dependent CompletableFuture stages never block application threads."
        explanation: "Incorrect. The future is a completion API; downstream code can still perform blocking work."
      - id: D
        answer: "sendAsync exposes a Selector to callers for readiness registration and event-loop control, while send keeps that mechanism internal."
        explanation: "Incorrect. Applications do not manage a Selector merely because they call sendAsync."
    correctAnswerId: A

  - id: networking-q07-addressing-endpoint
    question: "Code must preserve the original host text and port for a proxy without performing DNS resolution yet. Which JDK representation fits that requirement?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.AddressingEndpoints/AddressingEndpoints.md"
      anchor: "socket-address-model"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "new InetSocketAddress(InetAddress.getByName(host), port), because resolving to InetAddress first still defers DNS until connect."
        explanation: "Incorrect. InetAddress.getByName performs name resolution before the InetSocketAddress is created."
      - id: B
        answer: "URI.create(\"https://\" + host + \":\" + port), because a URI with authority is the JDK's unresolved socket-endpoint representation."
        explanation: "Incorrect. URI represents resource identity; it is not the socket-address abstraction used for bind/connect."
      - id: C
        answer: "new InetSocketAddress(host, port), because every constructor preserves an unresolved host and never attempts name resolution."
        explanation: "Incorrect. The host/port constructor normally attempts resolution; use createUnresolved when lookup must be deferred explicitly."
      - id: D
        answer: "InetSocketAddress.createUnresolved(host, port), because it keeps host text plus port without resolving the host."
        explanation: "Correct. createUnresolved explicitly creates an unresolved Internet socket address while preserving host text and port."
    correctAnswerId: D

  - id: networking-q08-websocket-demand
    question: "In JDK WebSocket.Listener, what exactly does request(1) mean?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.WebSocketClient/WebSocketClient.md"
      anchor: "websocket-demand-control"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "It requests one complete application message, so all of that message's fragments share one demand unit."
        explanation: "Incorrect. Demand counts receive-listener invocations, not complete application messages."
      - id: B
        answer: "It adds demand for one more receive callback; fragmentation and message assembly remain separate listener concerns."
        explanation: "Correct. One text/binary message can require multiple callbacks, each consuming demand."
      - id: C
        answer: "It governs text/binary callbacks only; ping, pong, and close notifications are control/lifecycle events that do not consume receive demand."
        explanation: "Incorrect. Demand also applies to ping/pong and onClose; onOpen/onError are not gated as receive callbacks."
      - id: D
        answer: "It queues demand, but that demand is unavailable until the previous callback's CompletionStage completes."
        explanation: "Incorrect. The receive-demand counter is separate from the callback CompletionStage."
    correctAnswerId: B

  - id: networking-q09-websocket-close-lifecycle
    question: "Which statement correctly distinguishes graceful close from abort in the JDK WebSocket client?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.WebSocketClient/WebSocketClient.md"
      anchor: "websocket-close-error"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "sendClose closes both input and output immediately, while abort waits for the peer's Close frame before terminating."
        explanation: "Incorrect. sendClose starts graceful output-side close; abort is the immediate termination path."
      - id: B
        answer: "sendClose only records a local status code; the connection stays fully open until the application later calls abort."
        explanation: "Incorrect. sendClose sends a Close message and closes the WebSocket output side under the API contract."
      - id: C
        answer: "sendClose begins a graceful output-side close while input can remain open for the peer Close; abort terminates immediately."
        explanation: "Correct. Graceful close and abort have different lifecycle semantics; sendClose does not instantly close both sides."
      - id: D
        answer: "abort is graceful because it sends the Close frame first, while sendClose is the forceful path used after protocol errors."
        explanation: "Incorrect. The roles are reversed: sendClose is the protocol close path, while abort closes immediately."
    correctAnswerId: C

  - id: networking-q10-abstraction-choice
    question: "An application only needs to call a normal JSON HTTP endpoint and does not need to own HTTP framing. Which JDK abstraction fits best?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.NetworkingChoices/NetworkingChoices.md"
      anchor: "transport-choice"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "HttpClient, because the communication contract is HTTP request/response and the application does not need to implement HTTP framing."
        explanation: "Correct. Choose the smallest suitable abstraction, but not a lower level than the problem requires."
      - id: B
        answer: "A raw TCP Socket, because direct framing control makes ordinary HTTP request/response simpler."
        explanation: "Incorrect. Reimplementing HTTP framing/lifecycle when HttpClient fits only adds unnecessary complexity."
      - id: C
        answer: "DatagramSocket, because JSON is self-contained and datagram boundaries remove the need for HTTP framing."
        explanation: "Incorrect. Data format does not replace the server's HTTP protocol requirement."
      - id: D
        answer: "WebSocket, because repeated calls to the same server can reuse one persistent bidirectional channel and avoid per-request setup."
        explanation: "Incorrect. WebSocket fits when the communication model actually requires long-lived bidirectional messaging."
    correctAnswerId: A
