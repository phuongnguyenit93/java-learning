  - question: "UDP giữ datagram boundary nhưng không cung cấp TCP-style reliability. Hãy giải thích tác động của buffer truncation, DatagramSocket.connect và delivery semantics lên protocol design."
    answer: "Datagram boundary nghĩa là mỗi receive xử lý một datagram hoặc phần đầu của datagram nếu DatagramPacket quá nhỏ; phần dư bị truncate chứ không trở thành lần receive kế tiếp. DatagramSocket.connect chỉ associate một peer, cung cấp default addressing và unicast receive filtering; nó không handshake hay tạo reliable session. UDP vẫn có thể mất, reorder hoặc duplicate traffic theo góc nhìn protocol ứng dụng, nên nếu workflow cần sequencing, acknowledgment, retry, duplicate detection hoặc reassembly thì các rule đó phải nằm trong application protocol. Vì câu hỏi này trải qua truncation, peer association và delivery semantics nên không nên giản lược thành 'UDP connect giống TCP nhẹ hơn'."
