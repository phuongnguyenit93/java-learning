  - question: "So sánh blocking I/O trên virtual thread, Selector readiness và AsynchronousSocketChannel completion model. Khi nào bạn chọn từng mô hình?"
    answer: "Blocking + virtual threads phù hợp khi workflow tự nhiên tuần tự và thread-per-task làm code dễ reasoning; Java 21 có thể suspend virtual thread trên supported blocking network I/O nên high connection count không tự động buộc dùng Selector. Selector phù hợp khi architecture chủ động dùng event loop, cần multiplex readiness và chấp nhận tự quản per-connection state machine; ready set chỉ là hint, application vẫn accept/read/write và xử lý partial I/O. AsynchronousSocketChannel phù hợp khi completion-style Future/CompletionHandler ăn khớp architecture; completion vẫn trả số byte thực sự xử lý và có pending-operation rules. Tôi chọn theo control-flow, concurrency architecture, state ownership và real workload chứ không chỉ microbenchmark throughput."
    aiGenerated: true
    reviewed: false
    readmeRelated:
