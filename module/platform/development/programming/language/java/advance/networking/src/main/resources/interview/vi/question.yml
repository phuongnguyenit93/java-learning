      methodSignature: ""

  - question: "Vì sao một write() TCP không phải một message? Nếu thiết kế custom TCP protocol, bạn sẽ xử lý framing, EOF và half-close như thế nào?"
    answer: "TCP chỉ cung cấp ordered byte stream. Một write phía gửi có thể được phía nhận thu qua nhiều read, và một read cũng không phải application message boundary. Vì vậy protocol phải tự định nghĩa framing, ví dụ fixed length, delimiter có escaping, hoặc length prefix, rồi lặp read cho đến khi đủ frame. EOF từ read=-1 có nghĩa input side đã kết thúc chứ không tự mô tả một business message. shutdownOutput có thể phát tín hiệu end-of-stream theo một chiều trong khi vẫn giữ chiều nhận; full close giải phóng cả connection resource. Tôi luôn gắn framing và lifecycle rule vào protocol thay vì dựa vào kích thước từng read/write."
    aiGenerated: true
    reviewed: false
