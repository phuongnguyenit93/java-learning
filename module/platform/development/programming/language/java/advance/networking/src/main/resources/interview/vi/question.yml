questions:
  - question: "Bạn sẽ chọn Socket/TCP, Datagram/UDP, HttpClient hay WebSocket client như thế nào cho một bài toán mới? Hãy giải thích từ communication semantics thay vì từ API quen thuộc."
    answer: "Tôi bắt đầu từ dữ liệu và quan hệ giữa peers. Custom ordered byte stream với protocol/framing do ứng dụng sở hữu phù hợp với TCP Socket. Independent datagrams phù hợp với UDP khi application chấp nhận hoặc tự bổ sung reliability/order semantics. HTTP request/response nên ưu tiên HttpClient để JDK sở hữu HTTP framing, body handling và connection reuse. Long-lived bidirectional WebSocket messaging phù hợp với WebSocket client. Sau đó mới chọn completion/concurrency model và timeout/lifecycle policy. Nguyên tắc là chọn abstraction thấp nhất thực sự cần thiết nhưng không thấp hơn mức mà problem yêu cầu."
    aiGenerated: true
    reviewed: false
