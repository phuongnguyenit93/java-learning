  - question: "SO_TIMEOUT xảy ra trên blocking Socket read nhưng Socket có thể vẫn dùng tiếp. Điều đó thay đổi cách bạn thiết kế error handling, cancellation và retry như thế nào?"
    answer: "SO_TIMEOUT kết thúc thao tác read đang chờ bằng SocketTimeoutException; nó không tự đóng Socket và không chứng minh peer chưa nhận hay xử lý dữ liệu. Vì vậy tôi tách operation timeout khỏi resource state: quyết định đóng, thử đọc lại hay chuyển trạng thái connection phải dựa trên protocol và failure context. Module experiment chứng minh cùng Socket có thể timeout rồi đọc byte mới thành công. Cancellation là một path khác: trên Java 21, khi interrupt virtual thread đang block I/O trên system-default Socket, ServerSocket hoặc DatagramSocket, thread được đánh thức và socket đó bị đóng, nên code không được giả định cùng resource vẫn usable sau đó. Retry cũng không được suy ra chỉ từ IOException/timeout: nếu operation có side effect, request có thể đã tới peer trước khi response bị mất. Retry/idempotency/backoff là policy tầng resilience/integration, không phải mặc định của Socket timeout."
    aiGenerated: true
