  - question: "Trong JDK WebSocket client, hãy nối request(n), message fragmentation, listener CompletionStage và send completion. Implementation sai thường nhầm chúng ở đâu?"
    answer: "request(n) điều khiển demand theo receive callback invocation, không theo complete application message. Một text/binary message có thể tới qua nhiều fragments nên listener phải dùng last để biết lúc nào message hoàn tất và phải giới hạn buffer tích lũy. CompletionStage trả từ receive callback là contract riêng về lifetime của data object/callback processing; completion của stage không tăng demand và không phải cơ chế serialize business work. Các send method trả CompletableFuture<WebSocket> cho completion của local send operation; completion đó không chứng minh remote business application đã xử lý message, nên application-level acknowledgement là concern riêng của protocol. Các lỗi phổ biến là coi một requested callback như một full message, coi listener-stage completion như demand, hoặc coi send-future completion như business acknowledgement."
