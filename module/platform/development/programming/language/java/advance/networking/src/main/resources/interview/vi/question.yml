  - question: "Hãy mô tả boundary end-to-end của Java Networking: khi lỗi xảy ra ở DNS, transport, TLS, HTTP/WebSocket API hoặc business retry, module nào nên chịu trách nhiệm giải thích và policy nào không nên nhét vào transport code?"
    answer: "Networking sở hữu JDK mechanics từ addressing/resolution, socket/channel I/O, timeout/cancellation tới HttpClient/WebSocket client lifecycle. TLS nằm trên transport nhưng trust store, certificate chain, cipher/protocol security và custom TrustManager/KeyManager thuộc Security & Cryptography. HTTP resource contract, serialization/domain schema, service communication và WebSocket subscription/message protocol thuộc Integration. Retry/circuit breaker/backoff/idempotency là resilience/application policy vì transport error không đủ để biết operation có an toàn để lặp lại hay không. Vì vậy khi debug tôi xác định failure stage trước, giữ original cause, rồi hand off sang đúng owner thay vì để networking component tự đoán business policy."
