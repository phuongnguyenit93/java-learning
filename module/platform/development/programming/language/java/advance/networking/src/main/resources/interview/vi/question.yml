  - question: "Một service dùng HttpClient cho nhiều request. Bạn sẽ quản lý client reuse, send/sendAsync và response-body lifetime như thế nào để tránh hiểu sai resource lifecycle?"
    answer: "Tôi thường reuse HttpClient thay vì tạo client cho từng request để tận dụng configuration và connection/resource sharing của implementation. send block caller theo BodyHandler semantics, còn sendAsync trả CompletableFuture; async không bảo đảm code downstream không block. BodyHandler quyết định BodySubscriber dựa trên response metadata. Với materializing handler như ofString, body được consume trước khi response value hoàn tất theo semantics của handler; với streaming handler như ofInputStream/ofPublisher, caller còn sở hữu phần body lifecycle và phải consume/close/cancel đúng cách. Trên Java 21, built-in HttpClient có lifecycle methods, nhưng tôi phân biệt API contract với behavior của arbitrary custom subclass."
    aiGenerated: true
