# <roadmap-schema>
# Cấu trúc Roadmap Module
# schema-version: 1
#
# YAML CONTRACT
# roadmap: Danh sách milestone cấp cao của roadmap cho language hiện tại.
#
# - id [string, required]: ID ổn định và duy nhất của milestone trong roadmap language hiện tại.
# - title [string, required]: Tên milestone hiển thị cho learner.
# - purpose [string, required]: Milestone này tồn tại để learner hiểu hoặc đạt được điều gì.
# - dependsOn [list, optional]: Danh sách id milestone prerequisite khi dependency không thể hiện đủ chỉ bằng thứ tự item.
# - objectives [list, optional]: Các learning objective cấp milestone; không dùng để liệt kê mọi fact/API/syntax nhỏ.
# - relatedKnowledge [list, optional]: Danh sách Knowledge category id trong chính module hiện tại hỗ trợ milestone. Portal hiển thị danh sách này ở phía đối diện milestone và click item sẽ điều hướng sang Knowledge category tương ứng.
# - relatedModules [list, optional]: Các module liên quan hiển thị ở Level 2 của Portal. Mỗi item dùng routeId bắt buộc và có thể có label/note localized; relation này chỉ để điều hướng, không tạo child milestone hoặc thay đổi learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - Topic/module này là gì?
#   - Vì sao nó tồn tại?
#   - Không có nó thì learner gặp vấn đề gì?
# FOUNDATION
#   - Learner cần prerequisite hoặc mental model nào trước?
# CORE MODEL
#   - Những abstraction hoặc building block lớn nào tạo nên chủ đề này?
# MECHANICS
#   - Nó hoạt động như thế nào ở mức language/runtime/API phù hợp với module?
# USAGE
#   - Nó được dùng như thế nào trong code thực tế?
# DECISION / TRADE-OFF
#   - Khi nào nên chọn cơ chế này thay vì cơ chế khác?
#   - Khi nào không nên dùng?
# FAILURE / PITFALL
#   - Những sai lầm, compile-time failure hoặc runtime failure nào đáng biết?
# INTEGRATION
#   - Chủ đề này kết nối với những concept/module lân cận nào?
# SYNTHESIS
#   - Sau cùng learner phải giữ mental model end-to-end nào?
#
# Mỗi language tự chịu trách nhiệm cho roadmap của chính nó. Không suy luận hoặc đồng bộ cấu trúc từ roadmap của language khác.
# Thứ tự item trong roadmap chính là thứ tự học mặc định. Chỉ dùng dependsOn khi cần biểu diễn dependency rõ hơn thứ tự tuyến tính.
# Skeleton không nên ép mọi module có đúng bấy nhiêu node. Nó là framework suy nghĩ chứ không phải template cứng.
# </roadmap-schema>

roadmap:
  - id: runtime-type-lifecycle
    title: ClassLoader là gì? Từ bytecode đến class có thể sử dụng
    purpose: Hiểu vì sao có tệp .class vẫn chưa đủ; JVM còn phải tìm bytecode, định nghĩa class khi chương trình chạy, liên kết rồi khởi tạo class trước khi chương trình có thể sử dụng nó.
    relatedKnowledge:
      - Lifecycle
    relatedModules:
      - routeId: JAVA_CLASS_OBJECT
        label: Class & Object
        note: Class & Object giới thiệu việc khởi tạo class và tạo đối tượng từ góc nhìn ngôn ngữ Java.
    objectives:
      - Hiểu ClassLoader tham gia quá trình nạp bằng cách tự tìm và định nghĩa class hoặc ủy quyền cho ClassLoader khác; JVM tạo class khi chạy từ kết quả nạp, rồi thực hiện các giai đoạn liên kết (linking) và khởi tạo (initialization).
      - Phân biệt các giai đoạn nạp (loading), kiểm tra (verification), chuẩn bị (preparation), phân giải (resolution) và khởi tạo (initialization).
      - Giải thích vì sao “tệp .class tồn tại” khác với “class đã được nạp và khởi tạo”.
      - Nhận biết lỗi thuộc giai đoạn tìm/nạp, liên kết hay khởi tạo để định hướng chẩn đoán.
  - id: built-in-loaders
    title: Các ClassLoader có sẵn trong JVM
    purpose: Hiểu vai trò của Bootstrap ClassLoader, Platform ClassLoader và Application/System ClassLoader trong một JVM thông thường.
    relatedKnowledge:
      - BuiltInClassLoaders
    objectives:
      - Xác định ClassLoader nào định nghĩa các class lõi của JDK, các class nền tảng và các class của ứng dụng.
      - Theo dõi chuỗi ClassLoader cha từ Application/System tới Platform và Bootstrap, đồng thời hiểu vì sao API biểu diễn Bootstrap ClassLoader bằng null.
  - id: parent-delegation
    title: Cơ chế ủy quyền cho ClassLoader cha
    purpose: Hiểu vì sao một ClassLoader thường hỏi ClassLoader cha trước khi tự nạp class, từ đó bảo vệ tính nhất quán và định danh của các kiểu nền tảng.
    relatedKnowledge:
      - ParentDelegation
    objectives:
      - Theo dõi thứ tự tìm kiếm theo cơ chế ưu tiên cha (parent-first) trước khi ClassLoader hiện tại tự định nghĩa class.
      - Phân biệt vai trò initiating ClassLoader và defining ClassLoader: một class có một defining ClassLoader, còn nhiều ClassLoader có thể được ghi nhận là initiating ClassLoader qua quá trình ủy quyền.
      - Nhận biết ưu tiên con (child-first) là một chiến lược ngoại lệ có chủ đích và có thể gây xung đột về định danh kiểu.
  - id: custom-loaders-and-isolation
    title: ClassLoader tùy chỉnh và cô lập
    purpose: Hiểu cách ứng dụng nạp class từ nguồn ngoài classpath thông thường hoặc tạo không gian class tách biệt bằng ClassLoader tùy chỉnh.
    relatedKnowledge:
      - CustomClassLoader
    objectives:
      - Phân biệt trách nhiệm của loadClass, findClass và defineClass.
      - Biết khi nào ClassLoader tùy chỉnh có giá trị và khi nào ClassLoader mặc định đã đủ.
      - Nhận biết các vấn đề về đồng bộ, gói (package) và bảo mật khi tự xây dựng ClassLoader.
  - id: class-identity
    title: Định danh class qua nhiều ClassLoader
    purpose: Hiểu vì sao hai class có cùng tên nhị phân (binary name) vẫn có thể là hai kiểu khác nhau nếu chúng được định nghĩa bởi hai ClassLoader khác nhau.
    relatedKnowledge:
      - ClassIdentity
    relatedModules:
      - routeId: JAVA_REFLECTION
        label: Reflection
        note: Reflection quan sát đối tượng Class; định danh kiểu của đối tượng này được quyết định bởi tên nhị phân và ClassLoader đã định nghĩa class đó.
    objectives:
      - Giải thích vì sao class cùng tên từ các ClassLoader khác nhau không tương thích.
      - Thiết kế ranh giới API dùng chung để kiểu của phần mở rộng (plugin) hoặc môi trường chứa (container) vẫn tương thích khi đi qua ranh giới ClassLoader.
  - id: thread-context-classloader
    title: ClassLoader ngữ cảnh của luồng (Thread Context ClassLoader - TCCL)
    purpose: Hiểu vì sao mã của khung phần mềm (framework) ở tầng ClassLoader cha đôi khi phải dùng ClassLoader gắn với luồng (thread) để tìm thành phần cung cấp (provider) ở tầng ứng dụng hoặc tầng con.
    relatedKnowledge:
      - ContextClassLoader
    objectives:
      - Nhận biết khi nào ClassLoader của khung phần mềm không thể tìm thấy thành phần cung cấp của ứng dụng và TCCL cần được dùng làm cầu nối.
      - Dùng TCCL đúng phạm vi theo quy trình lưu, gán rồi khôi phục.
      - Nhận biết luồng sống lâu có thể giữ tham chiếu tới ClassLoader và gây rò rỉ.
  - id: classpath-resource-loading
    title: Nạp tài nguyên từ classpath
    purpose: Hiểu cách tìm tài nguyên (resource) theo class hoặc theo gốc của ClassLoader mà không nhầm tài nguyên trên classpath với tệp trên hệ thống tệp.
    relatedKnowledge:
      - ResourceLoading
    relatedModules:
      - routeId: JAVA_IO
        label: I/O
        note: Module I/O tập trung vào việc đọc/ghi luồng dữ liệu và tệp; ClassLoader tập trung vào quy tắc tìm tài nguyên trên classpath.
    objectives:
      - Phân biệt quy tắc đường dẫn của Class.getResource và ClassLoader.getResource.
      - Hiểu việc tìm tài nguyên qua ClassLoader khác với việc nạp và định nghĩa class.
      - Quản lý vòng đời luồng dữ liệu (stream) của tài nguyên và xử lý có chủ đích trường hợp một tên tài nguyên có nhiều kết quả.
  - id: class-initialization
    title: Điều kiện kích hoạt và lỗi khi khởi tạo class
    purpose: Hiểu thao tác nào kích hoạt việc khởi tạo class, JVM đồng bộ quá trình này như thế nào và lỗi khởi tạo ảnh hưởng đến những lần sử dụng sau ra sao.
    relatedKnowledge:
      - Initialization
    objectives:
      - Phân biệt việc nạp class với khởi tạo class và nhận biết các thao tác JVM xem là sử dụng chủ động (active use), qua đó kích hoạt khởi tạo.
      - Hiểu mỗi class đã được một ClassLoader định nghĩa chỉ được JVM khởi tạo một lần, và JVM đồng bộ quá trình này khi nhiều luồng cùng sử dụng class.
      - Hiểu ExceptionInInitializerError và trạng thái lỗi của class sau khi khởi tạo thất bại.
  - id: unloading-leaks-and-synthesis
    title: Gỡ nạp class và rò rỉ ClassLoader
    purpose: Hiểu class chỉ có thể được gỡ nạp khi ClassLoader đã định nghĩa nó không còn bị giữ tham chiếu, và vì sao một ClassLoader bị giữ lại có thể kéo theo toàn bộ class, tài nguyên và trạng thái của ứng dụng hoặc phần mở rộng (plugin).
    relatedKnowledge:
      - UnloadingLeaks
    objectives:
      - Nhận biết các kiểu giữ tham chiếu qua static, ThreadLocal, bộ lắng nghe (listener), bộ nhớ đệm (cache) và TCCL.
      - Hiểu việc gỡ nạp phụ thuộc vào bộ thu gom rác (Garbage Collector - GC) và không xảy ra ở một thời điểm xác định trước.
      - Kết nối toàn bộ hành trình từ nạp class, ủy quyền, ClassLoader tùy chỉnh, định danh, TCCL, tài nguyên và khởi tạo tới điều kiện để class có thể được gỡ nạp.
