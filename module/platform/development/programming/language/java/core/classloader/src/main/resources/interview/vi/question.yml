  - question: >-
      Vì sao shared API, DTO hoặc exception đi qua loader boundary nên được định nghĩa ở một parent chung?
    answer: >-
      Những type này là ngôn ngữ giao tiếp giữa host và plugin. Nếu mỗi side có bản sao cùng binary name do loader khác định nghĩa, method signature nhìn giống nhau nhưng assignability, catch type, annotation lookup hoặc DTO cast có thể không tương thích. Đặt contract ở parent mà cả hai phía delegate tới tạo một identity chung, còn implementation/dependency riêng có thể tiếp tục ở child namespace.
    aiGenerated: true
