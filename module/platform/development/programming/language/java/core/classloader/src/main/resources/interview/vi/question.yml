  - question: >-
      ServiceLoader minh họa TCCL như thế nào, và điều gì vẫn phải đúng về SPI identity để provider discovery hữu ích?
    answer: >-
      ServiceLoader.load(serviceType) dùng context ClassLoader của thread để tìm provider metadata/implementation mà framework defining loader có thể không nhìn thấy. Nhưng discovery chỉ hữu ích khi provider implement đúng cùng SPI Class identity mà consumer đang dùng; nếu child tự định nghĩa bản sao SPI, provider dù cùng tên cũng không assignable về serviceType của parent. TCCL giải quyết lookup visibility, không chữa sai class identity boundary.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.ContextClassLoader/ContextClassLoader.md", anchor: "tccl-discovery"}
