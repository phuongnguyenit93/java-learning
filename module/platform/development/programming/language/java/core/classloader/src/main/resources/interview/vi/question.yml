  - question: >-
      Một static initializer ném exception ở lần active use đầu. Vì sao lần gọi sau của cùng runtime Class không đơn giản retry initializer, và caller thường quan sát hai failure khác nhau thế nào?
    answer: >-
      Nếu initialization thất bại, runtime Class identity đó bị đánh dấu erroneous. Khi nguyên nhân ban đầu là exception không phải Error, caller đầu thường thấy ExceptionInInitializerError; active use sau của cùng Class không chạy lại initializer và thường thấy NoClassDefFoundError báo class không thể initialize. Muốn một thử nghiệm lặp lại từ đầu phải dùng một runtime identity mới, ví dụ class do một fresh loader định nghĩa, chứ không thể reset state của Class cũ.
