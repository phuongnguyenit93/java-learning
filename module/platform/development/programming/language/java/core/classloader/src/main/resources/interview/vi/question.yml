  - question: >-
      Vì sao “đã remove plugin khỏi registry” chưa đủ để class được unload, và bạn sẽ thiết kế/chẩn đoán lifecycle redeploy theo reachability như thế nào?
    answer: >-
      Class do disposable loader định nghĩa chỉ có cơ hội unload khi defining loader không còn reachable; GC/unloading cũng không xảy ra theo lịch deterministic. Parent-owned cache, listener, pooled-thread TCCL, ThreadLocal, plugin thread/executor hoặc callback đều có thể tạo đường từ GC root tới plugin object/Class/loader. Shutdown cần dừng work/thread, unregister callback, clear ThreadLocal/TCCL/cache, close resource handle rồi bỏ strong references. WeakReference/logging/profiler chỉ giúp quan sát; System.gc() không phải lệnh unload hay bằng chứng leak tức thời.
