questions:
  - question: >-
      Vì sao Java cần cơ chế ClassLoader thay vì chỉ thực thi ngay mọi tệp .class tìm thấy, và các giai đoạn nạp (loading), liên kết (linking), khởi tạo (initialization) giải quyết những vấn đề khác nhau thế nào?
    answer: >-
      Tệp .class chỉ chứa bytecode. JVM vẫn phải tìm biểu diễn phù hợp với một tên nhị phân, tạo Class khi chạy, kiểm tra/chuẩn bị/phân giải kiểu rồi chỉ thực hiện khởi tạo static khi ngữ nghĩa yêu cầu. Nạp đưa định nghĩa class vào JVM, liên kết làm kiểu hợp lệ và sẵn sàng về cấu trúc, còn khởi tạo chạy logic static có thể tạo tác dụng phụ. Tách các giai đoạn giúp JVM nạp theo nhu cầu, kiểm tra bytecode trước khi dùng và trì hoãn tác dụng phụ cho tới lúc có sử dụng chủ động.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Lifecycle/Lifecycle.md", anchor: "loading-linking-initialization"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Hãy giải thích mối quan hệ giữa tên nhị phân của class, đường dẫn tệp .class và gốc classpath. Vì sao import không chứng minh class đã được nạp khi chạy?
    answer: >-
      Tên nhị phân là tên JVM dùng như com.example.Plugin; đường dẫn class-file thường là com/example/Plugin.class tính từ một gốc classpath; classpath là tập vị trí mà ClassLoader có thể tìm class và tài nguyên. import chỉ giúp trình biên dịch phân giải tên trong mã nguồn, không tạo lệnh khi chạy bắt JVM phải nạp hoặc khởi tạo kiểu đó. JVM chỉ cần kiểu khi thực thi, phân giải phụ thuộc hoặc nạp động thật sự yêu cầu nó.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Lifecycle/Lifecycle.md", anchor: "loading-linking-initialization"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Khi gặp ClassNotFoundException, NoClassDefFoundError hoặc LinkageError, bạn sẽ chẩn đoán theo vòng đời class như thế nào thay vì học thuộc tên lỗi?
    answer: >-
      Trước tiên hỏi ClassLoader có tìm được bytecode được yêu cầu không; tìm kiếm động không tìm thấy thường dẫn tới ClassNotFoundException. Nếu JVM đang cần một phụ thuộc nhưng định nghĩa class không khả dụng, hoặc class từng khởi tạo thất bại, có thể thấy NoClassDefFoundError. Nếu bytecode đã tới vùng định nghĩa/liên kết nhưng JVM không tạo được hệ kiểu hợp lệ, lỗi thuộc họ LinkageError như ClassFormatError, VerifyError, NoSuchMethodError hoặc IncompatibleClassChangeError. Cách suy luận hữu ích là tìm bytecode → định nghĩa/liên kết → khởi tạo.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Lifecycle/Lifecycle.md", anchor: "linking-phases"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Vì sao một khung phần mềm (framework) có thể muốn nạp một plugin class mà chưa khởi tạo nó, và Class.forName(name, false, loader) chứng minh ranh giới đó thế nào?
    answer: >-
      Khung phần mềm có thể cần kiểm tra siêu dữ liệu (metadata), định danh hoặc khả năng gán kiểu trước khi quyết định chạy mã plugin. Nếu việc nạp class tự động chạy bộ khởi tạo static, chỉ thao tác quan sát kiểu cũng có thể mở kết nối, đăng ký trạng thái toàn cục hoặc thất bại vì cấu hình chưa sẵn sàng. Class.forName với initialize=false cho phép lấy Class khi chạy mà không yêu cầu khởi tạo; gọi với true hoặc thực hiện sử dụng chủ động mới làm tác dụng phụ static xuất hiện.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Lifecycle/Lifecycle.md", anchor: "load-vs-initialize"}
    apiRelated: {controller: "ClassLifecycleController", methodSignature: "loadWithoutInit()"}

  - question: >-
      Nếu quan sát ClassLoader của class ứng dụng, một class nền tảng và String.class trên Java 21, bạn mong đợi chuỗi nào và vì sao nó quan trọng?
    answer: >-
      Class ứng dụng thường do Application/System ClassLoader định nghĩa, class nền tảng thường do Platform ClassLoader định nghĩa, còn nhiều class lõi như String do Bootstrap ClassLoader định nghĩa và Class.getClassLoader biểu diễn bằng null. Chuỗi cha thường đi Application/System → Platform → ranh giới Bootstrap. Điều này cho thấy ClassLoader nhận yêu cầu ban đầu không nhất thiết là ClassLoader cuối cùng định nghĩa Class.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.BuiltInClassLoaders/BuiltInClassLoaders.md", anchor: "loader-chain"}
    apiRelated: {controller: "ClassLoaderChainController", methodSignature: "inspectChain()"}

  - question: >-
      String.class.getClassLoader() trả null có nghĩa gì, và kết luận sai phổ biến nào cần tránh?
    answer: >-
      null là cách API biểu diễn class do cơ chế Bootstrap ClassLoader định nghĩa. Nó không có nghĩa String chưa được nạp, không có ClassLoader nào xử lý nó, hoặc class không có định danh khi chạy. Khi duyệt chuỗi getParent(), null nên được hiểu là ranh giới Bootstrap thay vì gọi phương thức tiếp trên nó.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.BuiltInClassLoaders/BuiltInClassLoaders.md", anchor: "bootstrap-loader"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Vì sao Java tách Platform ClassLoader và Application/System ClassLoader thay vì để một ClassLoader duy nhất sở hữu mọi class ngoài Bootstrap?
    answer: >-
      Hai tầng tạo ranh giới rõ giữa class/module nền tảng của JDK và mã/phụ thuộc của ứng dụng. Nhờ đó các kiểu nền tảng có vùng sở hữu ổn định, ứng dụng có classpath/vòng đời riêng, còn ClassLoader tùy chỉnh có thể chọn ClassLoader cha phù hợp để quyết định phần nào được chia sẻ và phần nào được cô lập. Giá trị cần nhớ là ranh giới trách nhiệm chứ không phải tên class triển khai cụ thể của từng ClassLoader.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.BuiltInClassLoaders/BuiltInClassLoaders.md", anchor: "platform-loader"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Mô tả cơ chế ưu tiên cha (parent-first) của loadClass và giải thích vì sao resolve=true vẫn không đồng nghĩa với khởi tạo.
    answer: >-
      loadClass trước hết kiểm tra class đã được ClassLoader hiện tại nạp chưa, sau đó cho ClassLoader cha/Bootstrap cơ hội xử lý, và chỉ khi phía trên không tìm thấy mới dùng nguồn của ClassLoader hiện tại. Với overload có cờ resolve, resolve=true yêu cầu resolveClass cho class vừa nạp, tức thuộc bước linking/resolution; nó không chạy bộ khởi tạo static. Khởi tạo là giai đoạn riêng và chỉ xảy ra khi có điều kiện sử dụng chủ động phù hợp.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ParentDelegation/ParentDelegation.md", anchor: "parent-delegation"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Cơ chế ưu tiên cha bảo vệ tính nhất quán kiểu trong hệ thống plugin như thế nào, đặc biệt với Plugin API dùng chung?
    answer: >-
      Ứng dụng chủ nên định nghĩa Plugin API dùng chung ở ClassLoader cha. Khi ClassLoader của plugin cần Plugin, ưu tiên cha trả lại cùng Plugin.class thay vì để mỗi plugin định nghĩa một bản sao cùng tên. Vì định danh kiểu phụ thuộc ClassLoader định nghĩa, cách này giữ interface, DTO, exception và facade dùng chung tương thích giữa ứng dụng chủ với plugin. Cơ chế ủy quyền vì vậy bảo vệ ranh giới kiểu chứ không chỉ tối ưu việc tìm kiếm.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ParentDelegation/ParentDelegation.md", anchor: "delegation-purpose"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Khi nào ưu tiên con (child-first) có lý do tồn tại, và vì sao áp dụng child-first cho mọi package là nguy hiểm?
    answer: >-
      Ưu tiên con (child-first) hữu ích khi plugin/container cần cô lập phiên bản phụ thuộc riêng khỏi ứng dụng chủ. Nhưng nếu áp dụng quá rộng, ClassLoader con có thể tự định nghĩa lại API dùng chung, trạng thái static hoặc kiểu thư viện, dẫn tới ClassCastException, lỗi khám phá thành phần hoặc hành vi phụ thuộc thứ tự tìm kiếm. Thiết kế tốt thường dùng ưu tiên cha (parent-first) cho java.* và hợp đồng dùng chung, còn child-first chỉ áp dụng có chọn lọc cho phần triển khai/phụ thuộc cần cô lập.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ParentDelegation/ParentDelegation.md", anchor: "child-first-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Vì sao việc ClassLoader tùy chỉnh không thể tự định nghĩa java.lang.String là một ranh giới khác với parent delegation?
    answer: >-
      Cơ chế ủy quyền cho cha là chính sách tìm kiếm mặc định: ClassLoader con hỏi cha trước. Quy tắc cấm ClassLoader thông thường định nghĩa tên bắt đầu bằng java. là ràng buộc độc lập của ClassLoader/JVM nhằm bảo vệ không gian tên lõi. Ngay cả khi thay đổi chiến lược ủy quyền, mã ứng dụng vẫn không được gọi defineClass để chiếm java.lang.String. Vì vậy không nên giải thích an toàn của java.* chỉ bằng parent-first.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ParentDelegation/ParentDelegation.md", anchor: "protected-packages-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Khi tự viết ClassLoader, loadClass và findClass khác vai trò thế nào, và vì sao thường nên ghi đè findClass trước khi nghĩ tới ghi đè loadClass?
    answer: >-
      loadClass điều phối findLoadedClass, cơ chế ủy quyền cho cha, đồng bộ và tùy chọn resolve. findClass là điểm mở rộng để ClassLoader hiện tại tìm bytecode rồi định nghĩa class khi ClassLoader cha không đáp ứng. Nếu bài toán chỉ là nguồn bytecode khác, ghi đè findClass giữ lại các bất biến mặc định của ClassLoader. Chỉ nên ghi đè loadClass khi thật sự cần chính sách khác như child-first có kiểm soát và chấp nhận tự bảo toàn nhiều quy tắc hơn.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CustomClassLoader/CustomClassLoader.md", anchor: "classloader-contract"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      defineClass biến byte[] thành gì, và vì sao gọi defineClass thành công vẫn chưa có nghĩa class đã được khởi tạo?
    answer: >-
      defineClass yêu cầu JVM định nghĩa một Class khi chạy gắn với ClassLoader định nghĩa và thực hiện các kiểm tra phù hợp ở thời điểm định nghĩa như tên, định dạng và bảo mật. Verification về mặt khái niệm thuộc linking và có thể được JVM thực hiện khi cần. Khởi tạo static là giai đoạn riêng, chỉ chạy khi có trigger phù hợp. Vì vậy ClassLoader tùy chỉnh quyết định nguồn bytecode/namespace, còn JVM vẫn sở hữu các quy tắc linking và initialization.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CustomClassLoader/CustomClassLoader.md", anchor: "define-class"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Khi bytecode plugin đến từ nguồn tùy chỉnh, vì sao việc chọn ClassLoader cha là quyết định kiến trúc chứ không chỉ là tham số constructor?
    answer: >-
      ClassLoader cha quyết định những kiểu nào ClassLoader con có thể chia sẻ qua cơ chế ủy quyền. Nếu Plugin API của ứng dụng chủ phải là hợp đồng chung, chọn ClassLoader đã định nghĩa Plugin làm cha giúp phần triển khai trong con phân giải interface đó về cùng định danh Class. Chọn cha sai có thể cô lập cả hợp đồng đáng lẽ dùng chung và làm đối tượng không gán được về API của ứng dụng chủ. Nguồn bytecode và ranh giới chia sẻ là hai quyết định khác nhau.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CustomClassLoader/CustomClassLoader.md", anchor: "custom-source"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Một ClassLoader tùy chỉnh dùng trong hệ thống thực tế cần bảo vệ những bất biến nào ngoài việc đọc đúng byte[]?
    answer: >-
      Nó phải tránh định nghĩa cùng tên nhị phân hai lần trong một không gian tên khi có cạnh tranh luồng, giữ ranh giới ủy quyền/hợp đồng dùng chung rõ ràng, tuân theo ràng buộc gói/JVM và quản lý tài nguyên mở theo vòng đời. Nếu ClassLoader hỗ trợ close như URLClassLoader, close chỉ giải phóng tài nguyên tệp/JAR chứ không ép JVM gỡ nạp class. Chỉ đọc byte rồi gọi defineClass chưa đủ để tạo một ClassLoader an toàn.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CustomClassLoader/CustomClassLoader.md", anchor: "custom-loader-safety"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      ClassLoader định nghĩa (defining) khác ClassLoader khởi xướng (initiating) thế nào, và vì sao cơ chế ủy quyền có thể khiến một class có nhiều initiating loader?
    answer: >-
      Với class/interface có tên thông thường, ClassLoader định nghĩa là ClassLoader chịu trách nhiệm định nghĩa kiểu khi chạy. ClassLoader khởi xướng là ClassLoader được ghi nhận đã bắt đầu việc nạp trực tiếp hoặc qua ủy quyền. Một kiểu có thể có nhiều initiating loader nhưng chỉ một defining loader. Ví dụ ClassLoader plugin yêu cầu java.lang.String rồi cơ chế ủy quyền trả String do Bootstrap định nghĩa; ClassLoader plugin có thể là initiating loader còn Bootstrap vẫn giữ vai trò defining. Vai trò defining mới tham gia vào quy tắc định danh kiểu khi chạy.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ParentDelegation/ParentDelegation.md", anchor: "initiating-vs-defining-loader"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Hai ClassLoader khác nhau nhận cùng tên nhị phân và cùng bytecode. Vì sao JVM vẫn có thể tạo hai kiểu khác nhau, và điều đó hữu ích ở đâu?
    answer: >-
      ClassLoader định nghĩa là một phần của định danh kiểu khi chạy, nên (PaymentPlugin, loaderA) và (PaymentPlugin, loaderB) là hai Class khác nhau dù tên và bytecode giống nhau. Điều này tạo các không gian tên cô lập, cho phép plugin/container giữ phiên bản phụ thuộc và trạng thái static riêng. Cái giá là đối tượng từ một không gian tên không tự động gán được sang kiểu cùng tên ở không gian tên khác.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.ClassIdentity/ClassIdentity.md", anchor: "same-name-different-type"}
    apiRelated: {controller: "CustomClassLoaderController", methodSignature: "sameNameIdentity()"}

  - question: >-
      Làm thế nào ClassCastException có thể trông như “PaymentPlugin cannot be cast to PaymentPlugin”, và bạn sẽ chẩn đoán lỗi đó ra sao?
    answer: >-
      Hai tên hiển thị có thể giống nhau nhưng đối tượng thuộc PaymentPlugin do loaderA định nghĩa còn kiểu đích thuộc PaymentPlugin do loaderB định nghĩa. JVM so định danh kiểu khi chạy chứ không chỉ so getName(), nên phép cast thất bại là hợp lệ. Khi chẩn đoán, hãy in class name, Class object và getClassLoader của nguồn/đích, đồng thời kiểm tra API dùng chung có bị ClassLoader con tự định nghĩa lại hay không.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.ClassIdentity/ClassIdentity.md", anchor: "class-cast-loader-failure"}
    apiRelated: {controller: "ClassIdentityController", methodSignature: "crossLoaderCast()"}

  - question: >-
      Vì sao API, DTO hoặc exception dùng chung đi qua ranh giới ClassLoader thường nên được định nghĩa bởi một ClassLoader cha chung?
    answer: >-
