  - question: >-
      Vì sao pattern đổi TCCL phải là save → set → work → restore trong finally, đặc biệt khi thread đến từ pool?
    answer: >-
      TCCL là mutable state của Thread và pooled thread được tái sử dụng cho nhiều task. Nếu code set plugin loader rồi exception trước khi restore, task kế tiếp có thể vô tình chạy với lookup context cũ, gây discovery sai và giữ plugin loader sống lâu hơn lifecycle của nó. Lưu giá trị trước, set trong phạm vi nhỏ và restore trong finally làm thay đổi TCCL có lexical lifecycle rõ ràng ngay cả khi công việc thất bại.
