  - question: >-
      TCCL giải quyết vấn đề visibility nào mà parent delegation thông thường không giải quyết được?
    answer: >-
      Parent delegation tạo hướng tự nhiên child nhìn lên parent, nhưng framework class do parent định nghĩa không tự nhiên nhìn xuống implementation chỉ child/application loader thấy. TCCL gắn một lookup context với Thread để framework có thể dùng loader phù hợp với caller/application cho discovery. Nó không đổi defining loader của framework hay của class đã tồn tại; nó chỉ cung cấp một reference loader khác cho thao tác lookup.
    aiGenerated: true
