questions:
  - question: >-
      Vì sao Java cần một cơ chế ClassLoader thay vì chỉ chạy ngay mọi file .class tìm thấy trên disk, và loading, linking, initialization giải quyết ba vấn đề khác nhau thế nào?
    answer: >-
      File .class chỉ là class bytes; JVM vẫn phải tìm đúng representation cho một binary name, tạo runtime Class identity, kiểm tra/chuẩn bị/liên kết type, rồi mới chạy static initialization khi semantics yêu cầu. Loading đưa type vào runtime namespace, linking làm type hợp lệ và sẵn sàng về cấu trúc, còn initialization chạy code khởi tạo static có thể có side effect. Tách các phase cho phép Java nạp theo nhu cầu, kiểm tra bytecode trước khi dùng và trì hoãn side effect cho tới active use.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Lifecycle/Lifecycle.md", anchor: "loading-linking-initialization"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Hãy giải thích mối quan hệ giữa binary class name, class-file path và classpath root. Vì sao một dòng import không chứng minh class đó đã được load ở runtime?
    answer: >-
      Binary name là tên runtime như com.example.Plugin; class-file path thường là dạng com/example/Plugin.class tương đối từ một classpath root; classpath là tập location mà loader có thể tìm class/resource. Compiler dùng import để resolve tên trong source, nhưng import không tạo bytecode instruction bắt JVM phải load hay initialize type đó. Runtime chỉ cần type khi execution, resolution hoặc dynamic loading thực sự yêu cầu nó.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Lifecycle/Lifecycle.md", anchor: "loading-linking-initialization"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Khi gặp ClassNotFoundException, NoClassDefFoundError và LinkageError, bạn sẽ suy luận theo phase nào thay vì học thuộc tên exception?
    answer: >-
      Trước hết hỏi loader có tìm được requested bytes không: dynamic lookup không tìm thấy thường dẫn tới ClassNotFoundException. Nếu runtime đang resolve/use một dependency mà definition không khả dụng, hoặc class đã từng initialization fail, có thể thấy NoClassDefFoundError. Nếu bytes đã đi tới vùng define/link nhưng runtime không thể tạo một type system hợp lệ, đó là họ LinkageError như ClassFormatError, VerifyError, NoSuchMethodError hay IncompatibleClassChangeError. Chẩn đoán nên theo flow find bytes → define/link → initialize.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Lifecycle/Lifecycle.md", anchor: "linking-phases"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Vì sao framework có thể muốn load một plugin class mà chưa initialize nó, và Class.forName(name, false, loader) giúp chứng minh ranh giới đó thế nào?
    answer: >-
      Framework có thể cần kiểm tra metadata, identity hoặc khả năng assign trước khi chấp nhận chạy code của plugin. Nếu loading tự động chạy static initializer, chỉ việc inspect type đã có thể mở connection, register global state hoặc fail vì config chưa sẵn sàng. Class.forName với initialize=false cho phép lấy runtime Class mà không yêu cầu initialization; gọi lại với true hoặc thực hiện active use mới làm side effect static xuất hiện. Đây là bằng chứng trực tiếp rằng loaded và initialized là hai trạng thái khác nhau.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Lifecycle/Lifecycle.md", anchor: "load-vs-initialize"}
    apiRelated: {controller: "ClassLifecycleController", methodSignature: "loadWithoutInit()"}

  - question: >-
      Nếu inspect loader của class ứng dụng, một platform class và String.class trên Java 21, bạn mong đợi thấy chuỗi ownership nào và vì sao kết quả đó quan trọng?
    answer: >-
      Class ứng dụng thường do Application/System ClassLoader định nghĩa, platform class do Platform ClassLoader, còn nhiều core class như String do bootstrap loader định nghĩa và Class.getClassLoader biểu diễn bằng null. Chuỗi parent thường đi application → platform → bootstrap boundary. Quan sát này cho biết type thực sự thuộc namespace nào và chuẩn bị cho việc hiểu parent delegation: requester ở tầng dưới không nhất thiết là defining loader cuối cùng.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.BuiltInClassLoaders/BuiltInClassLoaders.md", anchor: "loader-chain"}
    apiRelated: {controller: "ClassLoaderChainController", methodSignature: "inspectChain()"}

  - question: >-
      String.class.getClassLoader() trả null có nghĩa gì, và kết luận sai phổ biến nào cần tránh?
    answer: >-
      Null là cách Java API biểu diễn bootstrap-defined class vì bootstrap loader không được expose như một ClassLoader object thông thường. Nó không có nghĩa String không được load, không có owner hay JVM bỏ qua class-loading rules. Khi debug, null nên được đọc là bootstrap boundary, đồng thời tránh suy luận dựa vào tên concrete implementation của built-in loaders.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.BuiltInClassLoaders/BuiltInClassLoaders.md", anchor: "bootstrap-loader"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Vì sao Java tách Platform ClassLoader và Application/System ClassLoader thay vì để một loader duy nhất sở hữu mọi class ngoài bootstrap?
    answer: >-
      Hai tầng tạo ranh giới ownership rõ giữa platform modules của JDK và code/dependency của ứng dụng. Nhờ đó platform types có namespace ổn định, application code nằm ở tầng có lifecycle và classpath riêng, còn custom loader có thể chọn parent phù hợp để quyết định cái gì được chia sẻ. Giá trị thiết kế nằm ở boundary và delegation chain, không phải ở việc ghi nhớ concrete class name của loader implementation.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.BuiltInClassLoaders/BuiltInClassLoaders.md", anchor: "platform-loader"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Mô tả parent-first delegation của loadClass và giải thích vì sao resolve=true vẫn không đồng nghĩa với initialization.
    answer: >-
      loadClass trước tiên kiểm tra class đã được loader này load chưa, sau đó cho parent/bootstrap cơ hội xử lý, và chỉ khi phía trên không tìm thấy mới tới lookup của loader hiện tại. Với overload có resolve flag, resolve=true yêu cầu resolveClass cho class vừa load, tức bước linking/resolution; nó không chạy static initializer. Initialization là phase riêng và chỉ xảy ra theo active-use/runtime rules phù hợp.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ParentDelegation/ParentDelegation.md", anchor: "parent-delegation"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Parent-first delegation bảo vệ tính nhất quán type trong một plugin system như thế nào, đặc biệt với shared Plugin API?
    answer: >-
      Host nên định nghĩa shared Plugin API ở parent. Khi plugin loader cần Plugin, parent-first trả lại cùng Plugin.class thay vì để mỗi plugin tự định nghĩa một bản sao cùng tên. Vì runtime type identity phụ thuộc defining loader, cách này giữ interface, DTO, exception và facade dùng chung có identity tương thích giữa host với plugin. Delegation vì thế là boundary consistency mechanism chứ không chỉ là tối ưu lookup.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ParentDelegation/ParentDelegation.md", anchor: "delegation-purpose"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Khi nào child-first loading có lý do tồn tại, và vì sao dùng child-first cho mọi package là một thiết kế nguy hiểm?
    answer: >-
      Child-first hữu ích khi plugin/container cần cô lập dependency version riêng khỏi host. Nhưng nếu áp dụng mù quáng, loader có thể nhân đôi shared API, singleton/static state và library types, tạo ClassCastException, discovery mismatch hoặc hành vi phụ thuộc lookup order. Thiết kế tốt thường phân vùng: parent-first cho java.* và contract dùng chung, child-first có chọn lọc cho implementation dependency cần isolation.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ParentDelegation/ParentDelegation.md", anchor: "child-first-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Vì sao việc custom loader không thể tùy ý định nghĩa java.lang.String là một ranh giới khác với parent delegation?
    answer: >-
      Parent delegation là policy lookup mặc định: child hỏi parent trước. Protected core-package rule là constraint runtime/ClassLoader độc lập nhằm ngăn custom ClassLoader chiếm namespace java.* bằng defineClass. Ngay cả khi một loader thay đổi delegation policy, nó vẫn không có quyền biến bytes tùy ý thành java.lang.String. Phân biệt hai cơ chế giúp tránh hiểu sai rằng core namespace chỉ được bảo vệ nhờ parent-first.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ParentDelegation/ParentDelegation.md", anchor: "protected-packages-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Khi tự viết ClassLoader, loadClass và findClass có vai trò khác nhau thế nào, và vì sao override findClass thường an toàn hơn override loadClass?
    answer: >-
      loadClass là orchestration contract quản lý findLoadedClass, parent delegation, locking và optional resolution. findClass là extension point để loader hiện tại tìm bytes và define class khi parent không đáp ứng. Nếu bài toán chỉ là nguồn bytes khác, override findClass giữ lại các invariant mặc định của ClassLoader. Override loadClass chỉ hợp lý khi thật sự cần policy khác như child-first có kiểm soát và lúc đó developer phải tự bảo toàn nhiều invariant hơn.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CustomClassLoader/CustomClassLoader.md", anchor: "classloader-contract"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      defineClass biến byte[] thành gì, và tại sao gọi defineClass thành công vẫn chưa nói class đã được initialize?
    answer: >-
      defineClass yêu cầu JVM định nghĩa runtime Class từ class-file bytes dưới identity của loader hiện tại; JVM vẫn kiểm tra format, name và loading constraints. Kết quả là một Class<?> có defining loader rõ ràng, nhưng static initialization là phase riêng và chỉ chạy khi có initialization trigger. Vì vậy custom loader quyết định nguồn bytes/namespace, còn JVM vẫn sở hữu verification, linking và initialization semantics.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CustomClassLoader/CustomClassLoader.md", anchor: "define-class"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Khi plugin bytes đến từ một nguồn tùy chỉnh, vì sao chọn parent cho custom loader là quyết định kiến trúc chứ không chỉ là tham số constructor?
    answer: >-
      Parent quyết định những type nào child có thể chia sẻ qua delegation. Nếu Plugin API của host phải là contract chung, dùng loader định nghĩa Plugin làm parent giúp implementation trong child resolve interface đó về cùng Class identity. Chọn parent sai có thể cô lập cả contract đáng lẽ phải dùng chung, khiến instance không assignable về API của host. Nguồn bytes và parent boundary vì thế là hai quyết định khác nhau: một cái quyết định lấy implementation ở đâu, cái kia quyết định namespace nào được chia sẻ.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CustomClassLoader/CustomClassLoader.md", anchor: "custom-source"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Một custom ClassLoader production cần bảo vệ những invariant nào ngoài việc đọc đúng byte[]?
    answer: >-
      Loader phải tránh define cùng binary name hai lần trong cùng namespace khi concurrent, giữ delegation/shared-contract boundary rõ ràng, tuân theo package/runtime constraints và quản lý resource handle theo lifecycle. Nếu dùng loader có close như URLClassLoader thì close giải phóng file/JAR handle nhưng không ép class unload. Những yêu cầu này cho thấy custom loading có state và lifecycle; code chỉ đọc bytes rồi gọi defineClass chưa đủ để thành một loader an toàn.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CustomClassLoader/CustomClassLoader.md", anchor: "custom-loader-safety"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Phát biểu chính xác runtime class identity là gì, và defining loader khác initiating loader ở điểm nào?
    answer: >-
      Với class/reference type thông thường trong phạm vi module này, identity cốt lõi là binary name cộng defining ClassLoader identity. Defining loader là loader thực sự định nghĩa Class; initiating loader là một loader đã khiến Class đó được tạo ra thông qua loading, trực tiếp hoặc qua delegation. Vì vậy một Class có thể có nhiều initiating loaders nhưng chỉ một defining loader. Ví dụ plugin loader yêu cầu java.lang.String và delegation trả String do bootstrap loader định nghĩa; plugin loader có thể được ghi nhận là initiating loader, còn identity của String vẫn thuộc bootstrap defining boundary. Khi suy luận cast/assignability, defining loader là phần quyết định.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.ClassIdentity/ClassIdentity.md", anchor: "class-identity-rule"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Hai ClassLoader khác nhau nhận cùng binary name và cùng class bytes. Vì sao JVM vẫn có thể tạo hai type khác nhau, và điều đó hữu ích ở đâu?
    answer: >-
      Defining loader là một phần của runtime identity, nên (PaymentPlugin, loaderA) và (PaymentPlugin, loaderB) là hai Class khác nhau dù text name và bytes giống nhau. Cơ chế này tạo isolated namespace, cho phép plugin hoặc container giữ dependency/static state tách biệt. Cái giá là object từ một namespace không tự động assignable sang type cùng tên ở namespace kia.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.ClassIdentity/ClassIdentity.md", anchor: "same-name-different-type"}
    apiRelated: {controller: "CustomClassLoaderController", methodSignature: "sameNameIdentity()"}

  - question: >-
      Làm thế nào một ClassCastException có thể trông như “PaymentPlugin cannot be cast to PaymentPlugin”, và bạn sẽ debug lỗi đó ra sao?
    answer: >-
      Hai tên hiển thị có thể giống nhau nhưng object thuộc PaymentPlugin do loaderA định nghĩa còn target cast là PaymentPlugin do loaderB định nghĩa. JVM so runtime identity chứ không chỉ so getName(), nên cast thất bại hợp lệ. Khi debug cần in cả class name, Class object và getClassLoader của source/target, đồng thời kiểm tra shared API có bị child loader định nghĩa lại hay không.
    aiGenerated: true
