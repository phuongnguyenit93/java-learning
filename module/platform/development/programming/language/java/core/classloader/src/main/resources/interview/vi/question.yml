  - question: >-
      So sánh Class.getResource và ClassLoader.getResource về cách hiểu path, rồi giải thích vì sao classpath resource không nên bị đồng nhất với filesystem File.
    answer: >-
      Class.getResource("x") là package-relative, còn Class.getResource("/x") bắt đầu từ resource root của class/module. ClassLoader.getResource("x") dùng root-relative resource name và convention không có leading slash. Kết quả lookup có thể là resource trong directory, JAR hay runtime image với protocol file:, jar: hoặc jrt:, nên code chỉ cần đọc nên ưu tiên URL/stream thay vì ép mọi resource thành Path/File. Lookup còn phụ thuộc loader được dùng, không chỉ string path.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.ResourceLoading/ResourceLoading.md", anchor: "class-resource"}
    apiRelated: {controller: "ResourceLoadingController", methodSignature: "resolve()"}

  - question: >-
      Hãy phân tích một trường hợp đọc static member mà class không initialize, và nêu cách tránh suy luận “thấy tên class trong source thì class đó chắc chắn đã initialize”.
    answer: >-
      Class literal T.class không tự kích hoạt initialization, và đọc compile-time constant như static final int A = 30 có thể dùng giá trị đã inline nên không chạy initializer của declaring class. Ngoài ra khi truy cập static field qua tên subtype nhưng field thực sự được khai báo ở superclass, initialization trigger áp dụng cho type khai báo field chứ không đơn giản là token đứng bên trái dấu chấm. Vì vậy phải suy luận từ active-use rule và declaration thực tế, không từ hình thức source.
