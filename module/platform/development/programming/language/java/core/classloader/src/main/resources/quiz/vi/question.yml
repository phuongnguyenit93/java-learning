    answers:
      - {id: A, answer: "Platform ClassLoader phục vụ một phần các module nền tảng; Application/System ClassLoader thường nạp mã từ classpath/module path của ứng dụng.", explanation: "Đúng. Phạm vi sở hữu chính xác phụ thuộc cách bố trí khi chạy, nhưng vai trò khái quát là như vậy."}
