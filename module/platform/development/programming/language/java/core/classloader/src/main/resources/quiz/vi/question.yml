  - id: classloader-q06
    question: "Khi quan sát chuỗi ClassLoader của một class ứng dụng trên Java 21, cách hiểu nào đúng nhất?"
    answers:
      - {id: A, answer: "Bootstrap ClassLoader luôn xuất hiện như một đối tượng ClassLoader ở cuối chuỗi.", explanation: "Sai. Java API thường biểu diễn bootstrap bằng null."}
      - {id: B, answer: "Application/System ClassLoader thường có Platform ClassLoader làm ClassLoader cha; phía trên nữa Bootstrap ClassLoader được API biểu diễn bằng null.", explanation: "Đúng. Đây là mô hình tư duy điển hình của chuỗi ClassLoader có sẵn trên Java hiện đại."}
      - {id: C, answer: "Platform ClassLoader là ClassLoader con của Application/System ClassLoader.", explanation: "Sai. Hướng ClassLoader cha thông thường là application → platform → bootstrap."}
      - {id: D, answer: "Mọi class đều có cùng một đối tượng ClassLoader.", explanation: "Sai. ClassLoader định nghĩa phụ thuộc vào không gian tên và nguồn nạp class."}
    correctAnswerId: B
