  - id: classloader-q02
    question: "Phát biểu nào phân biệt đúng bytecode trong class-file, Class<?> và khởi tạo?"
    answers:
      - {id: A, answer: "Bytecode trong class-file là đầu vào; Class<?> là metadata/định danh kiểu khi chạy; khởi tạo là giai đoạn JVM chạy logic static khi có điều kiện kích hoạt phù hợp.", explanation: "Đúng. Ba khái niệm liên quan nhưng không phải cùng một trạng thái."}
      - {id: B, answer: "Class<?> chỉ là lớp bao quanh Path trỏ tới tệp .class.", explanation: "Sai. Class<?> đại diện kiểu khi chạy, không phải đường dẫn hệ thống tệp."}
      - {id: C, answer: "Có Class<?> luôn chứng minh bộ khởi tạo static đã chạy.", explanation: "Sai. Một class có thể được nạp/liên kết mà chưa khởi tạo."}
      - {id: D, answer: "Nếu bytecode nằm trong JAR thì JVM coi class đã được khởi tạo.", explanation: "Sai. Cách đóng gói không quyết định khởi tạo."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Lifecycle/Lifecycle.md", anchor: "loading-linking-initialization"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: classloader-q03
    question: "Thứ tự đúng về mặt khái niệm của liên kết là gì?"
    answers:
      - {id: A, answer: "resolve → verify → prepare", explanation: "Sai. Bước kiểm tra (verification) đứng trước chuẩn bị (preparation) và phân giải (resolution) trong mô hình liên kết."}
      - {id: B, answer: "prepare → khởi tạo → verify", explanation: "Sai. Khởi tạo là giai đoạn riêng sau liên kết khi có điều kiện kích hoạt phù hợp."}
      - {id: C, answer: "verify → khởi tạo → resolve", explanation: "Sai. Khởi tạo không nằm giữa các bước liên kết."}
      - {id: D, answer: "verify → prepare → resolve", explanation: "Đúng. Resolution có thể được thực hiện lazy theo nhu cầu/quy tắc khi chạy."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Lifecycle/Lifecycle.md", anchor: "linking-phases"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: classloader-q04
    question: "Khi class A có tham chiếu ký hiệu (symbolic reference) tới class/interface B, ClassLoader nào là điểm bắt đầu để JVM nạp B theo quy tắc phân giải?"
    answers:
      - {id: A, answer: "Luôn Bootstrap ClassLoader, rồi mới thử ClassLoader khác.", explanation: "Sai. Bootstrap ClassLoader không phải điểm bắt đầu toàn cục cho mọi phụ thuộc."}
      - {id: B, answer: "ClassLoader định nghĩa của A; ClassLoader đó có thể tiếp tục ủy quyền.", explanation: "Đúng. ClassLoader cuối cùng thật sự định nghĩa B mới là ClassLoader định nghĩa của B."}
      - {id: C, answer: "Luôn TCCL của luồng hiện tại.", explanation: "Sai. TCCL là ngữ cảnh tìm kiếm do mã chủ động chọn dùng, không thay thế quy tắc phân giải phụ thuộc này."}
      - {id: D, answer: "ClassLoader của class chứa main(), bất kể A thuộc ClassLoader nào.", explanation: "Sai. Không có một Application ClassLoader toàn cục cho mọi tham chiếu ký hiệu (symbolic reference)."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Lifecycle/Lifecycle.md", anchor: "linking-phases"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: classloader-q05
    question: "Điều gì đúng khi gọi Class.forName(name, false, loader)?"
    answers:
      - {id: A, answer: "Nó chỉ kiểm tra file tồn tại và không tạo Class<?>.", explanation: "Sai. Nó có thể nạp/liên kết class và trả Class<?>."}
      - {id: B, answer: "Nó bắt buộc chạy <clinit> trước khi trả về.", explanation: "Sai. Tham số khởi tạo=false chính là yêu cầu không chủ động khởi tạo."}
      - {id: C, answer: "Nó có thể nạp/liên kết class nhưng không chủ động kích hoạt khởi tạo chỉ vì lời gọi này.", explanation: "Đúng. Đây là cách quan sát rõ ranh giới nạp và khởi tạo."}
      - {id: D, answer: "Nó luôn dùng bootstrap loader dù truyền loader khác.", explanation: "Sai. Loader argument tham gia tìm kiếm theo hợp đồng của overnạp này."}
    correctAnswerId: C
