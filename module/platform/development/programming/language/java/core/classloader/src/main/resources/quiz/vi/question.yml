questions:
  - id: classloader-q01
    question: "ClassLoader giải quyết bài toán cốt lõi nào trong JVM?"
    answers:
      - {id: A, answer: "Biên dịch mã nguồn Java thành bytecode mỗi khi phương thức được gọi.", explanation: "Sai. Chuỗi biên dịch bằng javac tạo class-file; ClassLoader làm việc khi chạy với định nghĩa class và việc tìm tài nguyên."}
      - {id: B, answer: "Tự động chạy bộ khởi tạo static ngay khi tệp .class xuất hiện trên đĩa.", explanation: "Sai. Tệp tồn tại chưa đồng nghĩa class đã được nạp hay khởi tạo."}
      - {id: C, answer: "Tìm và đưa định nghĩa class vào không gian tên khi chạy để JVM có thể tạo kiểu khi chạy theo vòng đời nạp/liên kết/khởi tạo.", explanation: "Đúng. Đây là vai trò nền tảng của cơ chế nạp class."}
      - {id: D, answer: "Chỉ quản lý bộ nhớ của đối tượng sau khi new.", explanation: "Sai. Việc cấp phát đối tượng/GC không phải vai trò chính của ClassLoader."}
    correctAnswerId: C
