      - {id: C, answer: "JVM chưa nạp String.", explanation: "Sai. Có đối tượng Class rồi thì kết luận đó không hợp lý."}
      - {id: D, answer: "API dùng null để biểu diễn class do Bootstrap ClassLoader định nghĩa.", explanation: "Đúng. Bootstrap không được expose như đối tượng ClassLoader thông thường."}
