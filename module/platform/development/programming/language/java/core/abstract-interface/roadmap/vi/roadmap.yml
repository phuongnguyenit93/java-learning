# <roadmap-schema>
# Cấu trúc Roadmap Module
# schema-version: 1
#
# YAML CONTRACT
# roadmap: Danh sách milestone cấp cao của roadmap cho language hiện tại.
#
# - id [string, required]: ID ổn định và duy nhất của milestone trong roadmap language hiện tại.
# - title [string, required]: Tên milestone hiển thị cho learner.
# - purpose [string, required]: Milestone này tồn tại để learner hiểu hoặc đạt được điều gì.
# - dependsOn [list, optional]: Danh sách id milestone prerequisite khi dependency không thể hiện đủ chỉ bằng thứ tự item.
# - objectives [list, optional]: Các learning objective cấp milestone; không dùng để liệt kê mọi fact/API/syntax nhỏ.
# - relatedKnowledge [list, optional]: Danh sách Knowledge category id trong chính module hiện tại hỗ trợ milestone. Portal hiển thị danh sách này ở phía đối diện milestone và click item sẽ điều hướng sang Knowledge category tương ứng.
# - relatedModules [list, optional]: Các module liên quan hiển thị ở Level 2 của Portal. Mỗi item dùng routeId bắt buộc và có thể có label/note localized; relation này chỉ để điều hướng, không tạo child milestone hoặc thay đổi learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - Topic/module này là gì?
#   - Vì sao nó tồn tại?
#   - Không có nó thì learner gặp vấn đề gì?
# FOUNDATION
#   - Learner cần prerequisite hoặc mental model nào trước?
# CORE MODEL
#   - Những abstraction hoặc building block lớn nào tạo nên chủ đề này?
# MECHANICS
#   - Nó hoạt động như thế nào ở mức language/runtime/API phù hợp với module?
# USAGE
#   - Nó được dùng như thế nào trong code thực tế?
# DECISION / TRADE-OFF
#   - Khi nào nên chọn cơ chế này thay vì cơ chế khác?
#   - Khi nào không nên dùng?
# FAILURE / PITFALL
#   - Những sai lầm, compile-time failure hoặc runtime failure nào đáng biết?
# INTEGRATION
#   - Chủ đề này kết nối với những concept/module lân cận nào?
# SYNTHESIS
#   - Sau cùng learner phải giữ mental model end-to-end nào?
#
# Mỗi language tự chịu trách nhiệm cho roadmap của chính nó. Không suy luận hoặc đồng bộ cấu trúc từ roadmap của language khác.
# Thứ tự item trong roadmap chính là thứ tự học mặc định. Chỉ dùng dependsOn khi cần biểu diễn dependency rõ hơn thứ tự tuyến tính.
# Skeleton không nên ép mọi module có đúng bấy nhiêu node. Nó là framework suy nghĩ chứ không phải template cứng.
# </roadmap-schema>

roadmap:
  - id: abstraction-mechanism-purpose
    title: Vì sao Java cần lớp trừu tượng và interface?
    purpose: Hiểu bài toán thiết kế mà lớp trừu tượng (abstract class) và interface giải quyết trước khi đi vào cú pháp và quy tắc chi tiết.
    relatedKnowledge:
      - AbstractionPurpose
    relatedModules:
      - routeId: JAVA_CLASS_OBJECT
        label: Lớp và đối tượng
        note: Cung cấp nền tảng về lớp (class), đối tượng (object), thành viên và hàm khởi tạo (constructor) trước khi học các kiểu không thể khởi tạo trực tiếp.
      - routeId: JAVA_OOP
        label: Lập trình hướng đối tượng (OOP)
        note: Cung cấp nền tảng về trừu tượng hóa, kế thừa, đa hình và khả năng thay thế giữa các kiểu.
    objectives:
      - Phân biệt nhu cầu tạo đối tượng cụ thể với nhu cầu lập trình dựa trên một kiểu hoặc hợp đồng chung.
      - Hiểu vì sao Java cung cấp cả lớp trừu tượng và interface thay vì chỉ một cơ chế duy nhất.
  - id: abstract-classes
    title: Lớp trừu tượng (abstract class)
    purpose: Hiểu lớp trừu tượng như một lớp cha được triển khai một phần, có thể giữ trạng thái và hành vi dùng chung, có hàm khởi tạo để thiết lập phần trạng thái thuộc lớp trừu tượng trong đối tượng lớp con, đồng thời yêu cầu lớp con hoàn thiện những hành vi còn thiếu.
    relatedKnowledge:
      - AbstractClass
    objectives:
      - Phân biệt phương thức abstract với phương thức đã có phần triển khai.
      - Hiểu vai trò của hàm khởi tạo và giới hạn đơn kế thừa của lớp.
  - id: interfaces-as-contracts
    title: Interface như hợp đồng hành vi
    purpose: Hiểu interface như một hợp đồng về khả năng hoặc vai trò, cho phép nhiều lớp khác nhau cùng tuân theo mà không phải thuộc chung một cây kế thừa lớp.
    relatedKnowledge:
      - Interface
    relatedModules:
      - routeId: JAVA_FUNCTIONAL_PROGRAMMING
        label: Lập trình hàm
        note: Interface hàm (functional interface) là kiểu đích giúp lambda trong Java hoạt động.
    objectives:
      - Mô hình hóa khả năng và vai trò bằng interface.
      - Hiểu một lớp có thể triển khai nhiều interface mà không nhận trạng thái đối tượng dùng chung từ các interface đó.
  - id: choosing-abstract-class-or-interface
    title: Chọn lớp trừu tượng hay interface?
    purpose: Xây dựng tiêu chí lựa chọn giữa việc chia sẻ trạng thái/phần triển khai bằng lớp trừu tượng và mô tả hợp đồng hành vi linh hoạt bằng interface.
    relatedKnowledge:
      - AbstractVsInterface
    objectives:
      - Lựa chọn dựa trên nhu cầu chia sẻ trạng thái/phần triển khai, quan hệ kế thừa và nhu cầu triển khai nhiều hợp đồng.
      - Tránh chọn cơ chế chỉ vì quen thuộc hoặc vì cú pháp ngắn hơn.
  - id: interface-hierarchies
    title: Kế thừa và kết hợp interface
    purpose: Hiểu cách một interface kế thừa một hoặc nhiều interface khác để kết hợp các hợp đồng hành vi mà không tạo ra kế thừa trạng thái đối tượng.
    relatedKnowledge:
      - InterfaceInheritance
    objectives:
      - Xây dựng cây hợp đồng rõ ràng mà không chia nhỏ API quá mức.
      - Hiểu cách các phương thức của interface được kế thừa, khai báo lại hoặc làm rõ trong interface con.
  - id: interface-evolution
    title: Phương thức default, static và private trong interface
    purpose: Hiểu vai trò riêng của từng loại phương thức trong interface; default cung cấp hành vi mặc định và hỗ trợ mở rộng hợp đồng tương thích, static thuộc chính interface thay vì đối tượng triển khai, còn private đóng vai trò trợ giúp nội bộ để tái sử dụng phần triển khai.
    relatedKnowledge:
      - DefaultStaticPrivate
    objectives:
      - Hiểu phương thức default hỗ trợ mở rộng interface tương thích mà không thay thế vai trò của thiết kế lớp.
      - Phân biệt vai trò, phạm vi sử dụng và quy tắc gọi của phương thức static và private trong interface.
  - id: multiple-inheritance-conflicts
    title: Đa kế thừa qua interface và giải quyết xung đột
    purpose: Hiểu điều gì xảy ra khi một lớp đồng thời triển khai nhiều interface cung cấp hành vi mặc định chồng lấn và khi nào Java tự xác định được hành vi ưu tiên hoặc yêu cầu lớp triển khai giải quyết rõ ràng.
    relatedKnowledge:
      - MultipleInheritance
    objectives:
      - Dự đoán quy tắc ưu tiên giữa phương thức đến từ hệ phân cấp class và phương thức default của interface.
      - Xử lý xung đột dạng kim cương mà không nhầm với đa kế thừa lớp.
  - id: abstraction-mechanism-synthesis
    title: Tổng hợp thiết kế bằng lớp trừu tượng và interface
    purpose: Kết nối cách chọn cơ chế với kế thừa interface, khả năng mở rộng interface và xử lý xung đột để hình thành một mô hình thiết kế tổng thể.
    relatedKnowledge:
      - AbstractionSynthesis
    objectives:
      - Liên hệ quyết định lựa chọn cơ chế với kế thừa hợp đồng, phương thức default và xử lý xung đột.
      - Giải thích cách lớp trừu tượng và interface hỗ trợ đa hình mà không đồng nhất chúng với toàn bộ thiết kế OOP.
