  - question: "Why should interface inheritance be viewed as contract composition rather than just extends syntax?"
    answer: "The design goal is to build larger contracts from focused roles without forcing every implementation to depend on methods it does not need. Payable, Refundable, and Auditable can stand alone; a subinterface composes only the relevant roles. A giant interface often forces implementations to provide meaningless behavior or take unnecessary dependencies."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.InterfaceInheritance/InterfaceInheritance.md", anchor: "interface-extends-interface"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Is extending multiple parent interfaces always safe?"
    answer: "No. Compatible abstract contracts usually compose cleanly, but the same signature with incompatible return types can make the combined contract impossible to satisfy. Default methods can also compete and require resolution rules. Multiple interface inheritance is inheritance of types/contracts and sometimes behavior; it does not mean conflicts are impossible."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.InterfaceInheritance/InterfaceInheritance.md", anchor: "multiple-interface-hierarchy"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Why would a subinterface redeclare an inherited method instead of leaving it unchanged?"
    answer: "Redeclaration can refine the contract: narrow a covariant return type, add more specific annotations/documentation, or turn an inherited default back into an abstract requirement so downstream implementations must provide behavior. It must remain compatible with the parent contract; simply repeating the signature without adding meaning is usually noise."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.InterfaceInheritance/InterfaceInheritance.md", anchor: "interface-redeclaration"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "What interface-evolution problem do default methods address, and what are their limits?"
    answer: "They let an interface add a method with a default body so many existing implementations do not immediately need a new source implementation. They do not make every change safe: adding an abstract method may still break source compatibility, a new default can conflict with another interface, and changed semantics can still break clients. defaultCompatibility() demonstrates the mechanism rather than proving every form of binary compatibility."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.DefaultStaticPrivate/DefaultStaticPrivate.md", anchor: "default-method-evolution"}
    apiRelated: {controller: "InterfaceEvolutionController", methodSignature: "defaultCompatibility()"}

  - question: "What does dispatch() demonstrate about default methods?"
    answer: "Greeting provides default greet(), while DefaultGreeting does not override it. Calling greet() on a DefaultGreeting still returns hello-default, showing that default methods are inheritable instance behavior. The runtime type remains DefaultGreeting; the interface does not create a separate object and the default does not become static."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.DefaultStaticPrivate/DefaultStaticPrivate.md", anchor: "default-method"}
    apiRelated: {controller: "DefaultMethodController", methodSignature: "dispatch()"}

  - question: "When would you use a static interface method instead of a default method?"
    answer: "Use static when the operation belongs to the interface's namespace/contract but does not need receiver state, such as a validator or factory closely related to PaymentMethod. Use default when behavior needs an instance receiver and may be inherited or overridden. A static interface method is not inherited as an implementation instance method, so the two serve different design roles."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.DefaultStaticPrivate/DefaultStaticPrivate.md", anchor: "static-interface-method"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "What value do private interface methods provide if implementations cannot call them?"
    answer: "That is precisely their value: they can deduplicate internal logic among default/static methods without exposing the helper to callers or implementers. A private instance helper works in instance/default context, while a private static helper works in static context. Implementing classes cannot call or override either one."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.DefaultStaticPrivate/DefaultStaticPrivate.md", anchor: "private-interface-method"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Explain the reasoning order Java uses when multiple inherited default methods are involved."
    answer: "First check whether the class hierarchy already provides a compatible concrete method; if so, the class method wins. Otherwise ask whether one interface default is more specific than the others; a more-specific child default can win. If unrelated defaults still compete, the implementing class must override. That override may explicitly call a valid direct superinterface default with InterfaceName.super.method()."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.MultipleInheritance/MultipleInheritance.md", anchor: "default-method-conflict"}
    apiRelated: {controller: "DefaultMethodController", methodSignature: "resolveConflict()"}

  - question: "Is diamond-shaped interface inheritance always ambiguous?"
    answer: "No. A diamond describes the inheritance graph, not automatically a conflict. If all paths ultimately lead to one most-specific default, there are not two independent behaviors to choose between. Ambiguity appears when independent defaults with the same signature still compete and none is more specific. Reason about the inherited declarations, not the shape alone."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.MultipleInheritance/MultipleInheritance.md", anchor: "diamond-interface"}
    apiRelated: {controller: "", methodSignature: ""}
