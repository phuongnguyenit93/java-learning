  - question: "How would you divide responsibilities among PaymentMethod, BasePayment, and Refundable?"
    answer: "PaymentMethod should be the public behavioral contract consumers depend on. BasePayment is an optional abstract base for one family of implementations that truly shares state, initialization, and common behavior. Refundable is an independent capability implemented only by types that support refunds. This keeps the public contract flexible without preventing some implementations from reusing a shared base."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.AbstractVsInterface/AbstractVsInterface.md", anchor: "selection-guidance"}
