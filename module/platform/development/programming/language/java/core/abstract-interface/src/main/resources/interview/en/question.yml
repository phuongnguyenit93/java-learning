questions:
  - question: "What problem does an abstract class solve that a pure interface may not solve as naturally?"
    answer: "An abstract class fits when related subtypes genuinely share instance state, initialization invariants, and part of an algorithm. It can combine a common contract with partial implementation inside one hierarchy. An interface fits better when only a role/capability must cross unrelated hierarchies, so an abstract class should not be introduced merely to reuse a few lines of code."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.AbstractClass/AbstractClass.md", anchor: "abstract-class-model"}
    apiRelated: {controller: "AbstractClassController", methodSignature: "templateBehavior()"}

  - question: "How do abstract methods relate to dynamic dispatch and a template-method style design?"
    answer: "An abstract method is a body-less extension point. A concrete method in the base class can call it as a hook; when the runtime object is a subtype, that hook dispatches to the subtype override. templateBehavior() demonstrates Processor.process(...) owning the common algorithm while UpperProcessor.transform(...) supplies the varying step."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.AbstractClass/AbstractClass.md", anchor: "abstract-method"}
    apiRelated: {controller: "AbstractClassController", methodSignature: "templateBehavior()"}

  - question: "Why is calling an overridable method from a constructor usually dangerous?"
    answer: "The superclass constructor runs before subclass-specific state is fully initialized. If it calls an overridable method, dynamic dispatch can execute subclass code too early and read incomplete state. Constructors should generally establish their own invariants rather than invoke extension points unless the contract is deliberately designed around that risk."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.AbstractClass/AbstractClass.md", anchor: "abstract-constructor"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "When does single class inheritance make an abstract class a poor fit?"
    answer: "When a role must be shared by types that already belong to unrelated class hierarchies. Forcing them under one base class solely for that capability creates coupling and consumes the single superclass slot. An interface lets each type keep the class hierarchy that matches its state/model while implementing additional independent roles."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.AbstractClass/AbstractClass.md", anchor: "abstract-class-limits"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "What does programming to an interface mean in Java, and what does it not mean?"
    answer: "It means consumers depend on a stable behavioral contract such as PaymentMethod instead of one concrete implementation such as CardPayment. That makes alternate implementations, proxies, and test doubles easier when the contract is meaningful. It does not mean every class needs its own interface, nor does an interface automatically create loose coupling if the contract still leaks implementation details."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Interface/Interface.md", anchor: "interface-contract"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Why can an interface field still create a global mutable-state pitfall even though it is final?"
    answer: "An interface field is public static final, so the reference is globally exposed and fixed at the type level. But final prevents reassignment of the reference; it does not freeze a mutable object behind that reference. This can create globally shared mutable state with unclear ownership, difficult testing, and uncontrolled side effects. Interface fields are best reserved for true constants, preferably immutable values."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Interface/Interface.md", anchor: "interface-fields"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "How do abstract, default, static, and private interface methods differ in role and dispatch?"
    answer: "An abstract instance method is the public contract implementations must satisfy. A default method is instance behavior with a body that may be inherited or overridden. A static method belongs to the interface type and is not inherited as an implementation instance method. Private/private static methods are internal helpers and do not become part of the public implementation contract. This is why 'all interface methods are abstract' is no longer a correct mental model."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Interface/Interface.md", anchor: "interface-method-kinds"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Does implementing multiple interfaces create multiple objects or copies of state?"
    answer: "No. One object may be viewed through several interface reference types while identity and runtime object remain the same. In multipleContracts(), Named n and Enabled e both refer to the same Feature, so sameObject=true. Each reference only exposes a different compile-time contract; it does not clone the object or duplicate its state."
    aiGenerated: true
    reviewed: false
