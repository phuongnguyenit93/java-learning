questions:
  - question: "Lớp trừu tượng giải quyết vấn đề gì mà interface thuần có thể không tự nhiên bằng?"
    answer: "Lớp trừu tượng phù hợp khi các kiểu con thật sự chia sẻ trạng thái của đối tượng, quy tắc khởi tạo/bất biến và một phần thuật toán chung. Nó có thể vừa tham gia hợp đồng chung vừa giữ phần triển khai dùng chung trong cùng một hệ phân cấp. Interface phù hợp hơn khi chỉ cần vai trò hoặc khả năng xuyên qua nhiều hệ phân cấp; vì vậy không nên dùng lớp trừu tượng chỉ để tái sử dụng vài dòng mã."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.AbstractClass/AbstractClass.md", anchor: "abstract-class-model"}
    apiRelated: {controller: "AbstractClassController", methodSignature: "templateBehavior()"}

  - question: "Phương thức abstract liên quan thế nào tới phân phối động và kiểu thiết kế template-method?"
    answer: "Phương thức abstract là điểm mở không có phần thân. Phương thức cụ thể ở lớp cha có thể gọi nó như một điểm mở; khi đối tượng thực tế là kiểu con, lời gọi được phân phối động tới phần override của kiểu con. API templateBehavior() minh họa Processor.process(...) giữ thuật toán chung còn UpperProcessor.transform(...) cung cấp bước biến đổi cụ thể."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.AbstractClass/AbstractClass.md", anchor: "abstract-method"}
    apiRelated: {controller: "AbstractClassController", methodSignature: "templateBehavior()"}

  - question: "Vì sao gọi phương thức có thể bị override từ hàm khởi tạo thường nguy hiểm?"
    answer: "Hàm khởi tạo của lớp cha chạy trước khi phần trạng thái riêng của lớp con được khởi tạo hoàn chỉnh. Nếu hàm khởi tạo gọi phương thức có thể bị override, phân phối động có thể chạy mã của lớp con quá sớm và đọc trạng thái chưa sẵn sàng. Vì vậy hàm khởi tạo nên thiết lập bất biến của chính lớp thay vì gọi điểm mở có thể bị override, trừ khi hợp đồng được thiết kế cực kỳ rõ."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.AbstractClass/AbstractClass.md", anchor: "abstract-constructor"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Khi nào giới hạn đơn kế thừa lớp khiến lớp trừu tượng trở thành lựa chọn kém?"
    answer: "Khi một vai trò cần xuất hiện ở nhiều kiểu vốn đã thuộc các hệ phân cấp khác nhau. Buộc tất cả vào một lớp cha chỉ để có khả năng đó tạo ràng buộc không cần thiết và chiếm mất vị trí lớp cha duy nhất. Interface phù hợp hơn vì một lớp vẫn có thể kế thừa lớp cha phù hợp với trạng thái/mô hình của nó và triển khai thêm nhiều vai trò độc lập."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.AbstractClass/AbstractClass.md", anchor: "abstract-class-limits"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Lập trình dựa trên interface trong Java nghĩa là gì, và nó không có nghĩa là gì?"
    answer: "Nó nghĩa là mã phía sử dụng phụ thuộc vào hợp đồng hành vi ổn định như PaymentMethod thay vì một phần triển khai cụ thể như CardPayment. Điều này giúp thay cách triển khai, lớp đại diện (proxy) hoặc đối tượng giả trong kiểm thử dễ hơn khi hợp đồng thật sự có ý nghĩa. Nó không có nghĩa mọi lớp đều phải có interface riêng, cũng không có nghĩa interface tự động làm mã ít phụ thuộc nếu hợp đồng vẫn làm lộ chi tiết triển khai."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Interface/Interface.md", anchor: "interface-contract"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao trường trong interface có thể tạo rủi ro trạng thái toàn cục có thể thay đổi dù trường là final?"
    answer: "Trường trong interface là public static final nên biến trường thuộc cấp kiểu và không thể được gán một giá trị khác sau khi khởi tạo. Nhưng nếu giá trị đó là tham chiếu tới một đối tượng có thể thay đổi thì đối tượng vẫn có thể đổi trạng thái. Kết quả có thể là trạng thái toàn cục dùng chung với quyền sở hữu không rõ ràng, khó kiểm thử và khó kiểm soát tác dụng phụ. Trường của interface nên dành cho các giá trị hằng thực sự, ưu tiên giá trị bất biến."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Interface/Interface.md", anchor: "interface-fields"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Các phương thức abstract/default/static/private trong interface khác nhau về vai trò và cách gọi thế nào?"
    answer: "Phương thức abstract của đối tượng là hợp đồng public mà lớp triển khai phải thỏa. Phương thức default là hành vi của đối tượng có phần thân và có thể được kế thừa/override. Phương thức static thuộc chính interface khai báo, không được lớp triển khai hoặc interface con kế thừa. Phương thức private/private static chỉ là phần hỗ trợ nội bộ của interface và không trở thành hợp đồng public. Phân biệt bốn nhóm này giúp tránh suy nghĩ sai rằng 'mọi phương thức trong interface đều abstract'."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Interface/Interface.md", anchor: "interface-method-kinds"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Một đối tượng triển khai nhiều interface có tạo nhiều đối tượng hay nhiều bản sao trạng thái không?"
    answer: "Không. Một đối tượng có thể được nhìn qua nhiều tham chiếu interface khác nhau nhưng định danh và đối tượng thực tế vẫn là một. Trong API multipleContracts(), Named n và Enabled e cùng trỏ tới Feature nên sameObject=true. Mỗi tham chiếu chỉ giới hạn góc nhìn theo hợp đồng tại thời điểm biên dịch; nó không sao chép đối tượng hoặc nhân đôi trạng thái."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Interface/Interface.md", anchor: "interface-implementation"}
    apiRelated: {controller: "InterfaceController", methodSignature: "multipleContracts()"}

  - question: "Nếu thiết kế PaymentMethod, BasePayment và Refundable cùng lúc, bạn phân vai ba cơ chế trừu tượng này như thế nào?"
    answer: "PaymentMethod nên là hợp đồng hành vi public mà bên sử dụng phụ thuộc. BasePayment là lớp cha trừu tượng tùy chọn cho một họ lớp triển khai thật sự chia sẻ trạng thái, quy tắc khởi tạo và hành vi chung. Refundable là khả năng độc lập chỉ các kiểu hỗ trợ hoàn tiền mới triển khai. Cách tách này tránh ép mọi cách triển khai vào một lớp cha nhưng vẫn cho một số nhánh tái sử dụng phần chung."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.AbstractVsInterface/AbstractVsInterface.md", anchor: "selection-guidance"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao kế thừa interface nên được nhìn như cách kết hợp hợp đồng chứ không chỉ là cú pháp extends?"
    answer: "Mục tiêu là ghép các vai trò nhỏ thành hợp đồng lớn hơn mà không ép mọi lớp triển khai phụ thuộc vào phương thức không cần thiết. Payable, Refundable và Auditable có thể tồn tại độc lập; một interface con chỉ kết hợp các vai trò phù hợp. Nếu gom tất cả vào một interface quá lớn, lớp triển khai có thể phải cung cấp hành vi vô nghĩa hoặc nhận phụ thuộc dư thừa."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.InterfaceInheritance/InterfaceInheritance.md", anchor: "interface-extends-interface"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Interface kế thừa nhiều interface cha có phải luôn an toàn không?"
    answer: "Không. Các hợp đồng abstract tương thích thường kết hợp được, nhưng cùng chữ ký với kiểu trả về không tương thích có thể làm hợp đồng bất khả thi. Các phương thức default cũng có thể cạnh tranh; nếu interface con nhận các default tương đương từ các interface cha không có quan hệ cụ thể-hơn với nhau thì interface con phải override để giải quyết, nếu không sẽ lỗi biên dịch. Vì vậy đa kế thừa qua interface vẫn có các quy tắc xung đột cần hiểu."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.InterfaceInheritance/InterfaceInheritance.md", anchor: "multiple-interface-hierarchy"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Tại sao interface con lại khai báo lại một phương thức được kế thừa thay vì để nguyên?"
    answer: "Khai báo lại hữu ích khi muốn tinh chỉnh hợp đồng, chẳng hạn thu hẹp kiểu trả về theo quy tắc đồng biến hoặc bổ sung annotation/tài liệu cụ thể hơn. Khai báo mới vẫn phải tương thích với hợp đồng cha; nếu chỉ lặp lại cùng chữ ký mà không thêm ý nghĩa thì thường chỉ tạo nhiễu."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.InterfaceInheritance/InterfaceInheritance.md", anchor: "interface-redeclaration"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Khi nào interface con nên biến một phương thức default được kế thừa trở lại thành yêu cầu abstract?"
    answer: "Khi hành vi mặc định của interface cha không còn là mặc định hợp lệ cho mọi kiểu thuộc interface con, interface con có thể khai báo lại cùng phương thức mà không có phần thân. Khi đó các lớp triển khai cụ thể phía sau phải cung cấp hành vi của riêng mình. Đây là cách tinh chỉnh yêu cầu của hợp đồng chứ không phải xóa phương thức khỏi hệ phân cấp."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.DefaultStaticPrivate/DefaultStaticPrivate.md", anchor: "default-method-evolution"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Phương thức default giải quyết vấn đề mở rộng interface nào, và giới hạn của nó là gì?"
    answer: "Nó cho interface thêm một phương thức có phần thân mặc định để nhiều lớp triển khai hiện có không phải lập tức thêm phần triển khai mới trong mã nguồn. Nhưng nó không làm mọi thay đổi trở nên an toàn: thêm phương thức abstract vẫn có thể phá tính tương thích mã nguồn, default mới có thể xung đột với interface khác, và thay đổi ý nghĩa hợp đồng vẫn có thể phá hành vi phía sử dụng. API defaultCompatibility() minh họa cơ chế chứ không chứng minh mọi dạng tương thích nhị phân."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.DefaultStaticPrivate/DefaultStaticPrivate.md", anchor: "default-method-evolution"}
    apiRelated: {controller: "InterfaceEvolutionController", methodSignature: "defaultCompatibility()"}

  - question: "API dispatch() chứng minh điều gì về phương thức default?"
    answer: "Greeting có default greet(), còn DefaultGreeting không override. Gọi greet() trên đối tượng DefaultGreeting vẫn trả hello-default, chứng minh phương thức default là hành vi của đối tượng có thể được kế thừa. Kiểu thực tế vẫn là DefaultGreeting; phương thức default không tạo đối tượng interface riêng và cũng không trở thành phương thức static."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.DefaultStaticPrivate/DefaultStaticPrivate.md", anchor: "default-method"}
