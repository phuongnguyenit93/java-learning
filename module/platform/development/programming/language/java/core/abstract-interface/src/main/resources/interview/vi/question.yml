  - question: "Khi nào nên dùng phương thức static trong interface thay vì phương thức default?"
    answer: "Dùng static khi thao tác thuộc chính interface nhưng không cần trạng thái của đối tượng nhận, ví dụ thao tác kiểm tra hợp lệ hoặc tạo đối tượng liên quan chặt tới PaymentMethod. Dùng default khi hành vi cần một đối tượng nhận và có thể được lớp triển khai kế thừa/override. Phương thức static của interface không được lớp triển khai hoặc interface con kế thừa; hai loại vì vậy phục vụ hai mục đích khác nhau."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.DefaultStaticPrivate/DefaultStaticPrivate.md", anchor: "static-interface-method"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Phương thức private trong interface có giá trị gì nếu lớp triển khai không gọi được?"
    answer: "Chính vì không phải hợp đồng public nên nó hữu ích để tái sử dụng logic nội bộ giữa các phương thức default/static mà không công khai phương thức hỗ trợ cho bên gọi hoặc lớp triển khai. Phương thức private của đối tượng dùng trong ngữ cảnh của phương thức đối tượng/default; private static dùng được trong ngữ cảnh static. Lớp triển khai không thể gọi hay override chúng."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.DefaultStaticPrivate/DefaultStaticPrivate.md", anchor: "private-interface-method"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Hãy giải thích thứ tự suy luận khi Java gặp nhiều phương thức default được kế thừa."
    answer: "Trước hết kiểm tra phía lớp: phương thức static cùng chữ ký không thể triển khai phương thức của đối tượng trong interface; phương thức abstract phía lớp cũng không được default tự động thỏa; còn phương thức cụ thể tương thích phía lớp được ưu tiên. Nếu phía lớp không giải quyết, xét xem có default nào từ interface cụ thể hơn hay không. Nếu vẫn còn các default độc lập cạnh tranh, lớp triển khai phải override. Override có thể gọi default của interface cha trực tiếp hợp lệ bằng InterfaceName.super.method()."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.MultipleInheritance/MultipleInheritance.md", anchor: "default-method-conflict"}
    apiRelated: {controller: "DefaultMethodController", methodSignature: "resolveConflict()"}

  - question: "Kế thừa interface dạng kim cương có phải lúc nào cũng mơ hồ không?"
    answer: "Không. Hình kim cương chỉ mô tả đồ thị kế thừa. Nếu các đường cuối cùng hội tụ về cùng một default cụ thể nhất thì không có hai hành vi độc lập để chọn. Mơ hồ xuất hiện khi nhiều default độc lập cùng chữ ký vẫn cạnh tranh và không có ứng viên nào cụ thể hơn. Vì vậy phải suy luận theo các khai báo được kế thừa, không chỉ nhìn hình dạng kim cương."
