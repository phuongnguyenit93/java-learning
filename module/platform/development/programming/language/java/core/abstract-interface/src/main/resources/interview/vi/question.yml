  - question: "Vì sao Java cần cả lớp trừu tượng và interface? Nếu chỉ giữ một trong hai thì mô hình thiết kế sẽ mất gì?"
    answer: "Lớp trừu tượng tự nhiên khi một họ lớp thật sự chia sẻ trạng thái, quy tắc khởi tạo và phần triển khai; interface tự nhiên khi cần một hợp đồng hoặc khả năng linh hoạt có thể đi qua nhiều hệ phân cấp. Chỉ dùng lớp trừu tượng sẽ ép nhiều vai trò vào một cây kế thừa duy nhất; chỉ dùng interface sẽ không thay thế được nhu cầu sở hữu trạng thái và khởi tạo dùng chung của một lớp cha. Hai cơ chế bổ sung cho nhau thay vì một cơ chế là phiên bản 'tốt hơn' của cơ chế kia."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.AbstractionPurpose/AbstractionPurpose.md", anchor: "abstraction-mechanism-roles"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Xung đột default có thể xảy ra ngay trong interface con trước khi có lớp triển khai không? Giải thích."
    answer: "Có. Nếu một interface con extends hai interface cha không liên quan và cả hai cung cấp các phương thức default có chữ ký tương đương, trong khi không có khai báo nào cụ thể hơn, bản thân interface con đã có hợp đồng mơ hồ. Nó phải khai báo một override để chọn, thay thế hoặc kết hợp hành vi; nếu không, khai báo interface con bị lỗi biên dịch. Vì vậy giải quyết xung đột default không chỉ là vấn đề của lớp triển khai."
