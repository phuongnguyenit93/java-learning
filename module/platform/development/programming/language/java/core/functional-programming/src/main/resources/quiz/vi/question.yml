  - id: fp-q08
    question: "Left khai báo CharSequence value(), Right khai báo String value(), còn Combined extends cả hai. Vì sao Combined vẫn có thể là giao diện hàm?"
    answers:
      - {id: A, answer: "Vì phương thức trừu tượng kế thừa luôn bị bỏ qua khi phân tích SAM.", explanation: "Sai. Phương thức trừu tượng kế thừa vẫn được tính, trừ khi chúng cùng tạo thành một hợp đồng tương thích."}
      - {id: B, answer: "Vì String và CharSequence trở thành cùng một kiểu nguyên thủy sau xóa kiểu (type erasure).", explanation: "Sai. Lý do là khả năng ghi đè tương thích, không phải xóa kiểu thành kiểu nguyên thủy."}
      - {id: C, answer: "Vì Java tùy ý giữ lại phương thức từ giao diện cha ở bên phải.", explanation: "Sai. Thứ tự giao diện cha không phải quy tắc quyết định."}
      - {id: D, answer: "Vì các phương thức kế thừa tương thích khi ghi đè và String là kiểu trả về đồng biến (covariant return) của CharSequence.", explanation: "Đúng. Chúng có thể đại diện cho một hợp đồng trừu tượng thống nhất."}
    correctAnswerId: D
