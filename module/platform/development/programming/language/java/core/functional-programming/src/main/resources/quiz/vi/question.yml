    question: "Phong cách hàm nên kết hợp với Java hướng đối tượng và Java mệnh lệnh như thế nào?"
    answers:
      - {id: A, answer: "Một lớp đã dùng một lambda thì nên ngừng dùng thiết kế hướng đối tượng.", explanation: "Sai. Nhiều phong cách Java có thể cùng tồn tại trong một thiết kế."}
