  - id: fp-q07
    question: "Một giao diện khai báo boolean matches(String value) và cũng khai báo lại boolean equals(Object other). Vì sao giao diện này vẫn có thể là giao diện hàm?"
    answers:
      - {id: A, answer: "equals tự động trở thành phương thức default trong mọi giao diện.", explanation: "Sai. Lý do không phải vì equals trở thành phương thức default."}
      - {id: B, answer: "Mọi phương thức tên equals đều bị bỏ qua bất kể chữ ký.", explanation: "Sai. Quy tắc áp dụng cho chữ ký tương ứng với phương thức thực thể public của Object."}
      - {id: C, answer: "Một khai báo khớp với phương thức public liên quan của Object không tạo thêm hợp đồng trừu tượng chức năng thứ hai.", explanation: "Đúng. matches vẫn là hợp đồng chức năng của giao diện."}
      - {id: D, answer: "@FunctionalInterface âm thầm xóa equals khỏi bytecode.", explanation: "Sai. Chú thích này chỉ kiểm tra hợp đồng; nó không viết lại phương thức."}
