      - {id: C, answer: "Phong cách hàm chỉ nên dùng trong thư viện, không nên dùng trong mã ứng dụng.", explanation: "Sai. Nó hữu ích ở bất kỳ nơi nào việc biểu diễn phần hành vi thay đổi dưới dạng hợp đồng giúp ý định rõ hơn."}
      - {id: D, answer: "Phong cách hàm là một công cụ khác của Java và có thể dùng cùng đối tượng lẫn quy trình mệnh lệnh.", explanation: "Đúng. Java hỗ trợ nhiều mô hình lập trình; hãy chọn cách biểu diễn làm rõ ý định và ràng buộc nhất."}
