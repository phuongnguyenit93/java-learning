    answers:
      - {id: A, answer: "Consumer<String> c = s -> System.out.println(s);", explanation: "Sai. Thân là một biểu thức dạng câu lệnh (statement expression) tương thích với Consumer không trả về giá trị."}
      - {id: B, answer: "Function<String, Integer> f = s -> s.length();", explanation: "Sai. Thân lambda tạo ra kết quả tương thích với Integer như yêu cầu."}
      - {id: C, answer: "Predicate<String> p = s -> !s.isEmpty();", explanation: "Sai. Thân lambda tạo ra kết quả boolean như yêu cầu."}
      - {id: D, answer: "Function<String, Integer> f = s -> { s.length(); };", explanation: "Đúng. Khối lệnh này có thể kết thúc bình thường mà không trả về giá trị, nên không thể thỏa Function yêu cầu trả về kết quả."}
