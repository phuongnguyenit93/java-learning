  - id: fp-q06
    question: "Giao diện nào sau đây vẫn có thể là một giao diện hàm?"
    answers:
      - {id: A, answer: "Một giao diện có hai phương thức trừu tượng không liên quan với nhau và không có phương thức default.", explanation: "Sai. Hai hợp đồng trừu tượng không liên quan khiến giao diện không còn một SAM duy nhất."}
      - {id: B, answer: "Một giao diện có một phương thức trừu tượng cùng với bất kỳ số lượng phương thức default và static tương thích nào.", explanation: "Đúng. Phương thức default và static đã có phần triển khai nên không thêm hành vi trừu tượng vào SAM."}
      - {id: C, answer: "Chỉ giao diện được gắn @FunctionalInterface một cách tường minh.", explanation: "Sai. Chú thích @FunctionalInterface là tùy chọn; điều quyết định là cấu trúc của giao diện có thỏa quy tắc hay không."}
      - {id: D, answer: "Chỉ giao diện được khai báo trong java.util.function.", explanation: "Sai. Giao diện hàm có thể nằm trong bất kỳ gói nào."}
