  - id: fp-q02
    question: "Vì sao tham số hóa hành vi hữu ích khi thuật toán ổn định nhưng có một quy tắc thay đổi?"
    answers:
      - {id: A, answer: "Nó đảm bảo quy tắc thay đổi luôn thuần khiết (pure).", explanation: "Sai. Giao diện hàm của Java không ép buộc tính thuần khiết."}
      - {id: B, answer: "Thuật toán ổn định có thể giữ nguyên, còn bên gọi cung cấp hành vi thay đổi.", explanation: "Đúng. Thuật toán quyết định hành vi chạy ở đâu và khi nào; bên gọi quyết định sẽ truyền hành vi nào."}
      - {id: C, answer: "Nó loại bỏ việc kiểm tra kiểu ở thời điểm biên dịch đối với quy tắc thay đổi.", explanation: "Sai. Kiểu giao diện hàm cung cấp kiểm tra kiểu ở thời điểm biên dịch."}
      - {id: D, answer: "Nó yêu cầu tạo một lớp con cho mỗi quy tắc.", explanation: "Sai. Truyền hành vi thường được dùng để tránh tạo lớp con chỉ vì một phần hành vi thay đổi."}
