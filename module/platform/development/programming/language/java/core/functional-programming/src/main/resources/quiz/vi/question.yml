  - id: fp-q01
    question: "Ý tưởng cốt lõi, đặc thù của Java về lập trình hàm trong mô-đun này là gì?"
    answers:
      - {id: A, answer: "Biểu diễn hành vi bằng các giá trị có kiểu là giao diện hàm (functional interface), để có thể truyền đi và gọi thực thi.", explanation: "Đúng. Java mô hình hóa hành vi thông qua hợp đồng của giao diện hàm; lambda hoặc tham chiếu phương thức cung cấp phần triển khai cho hợp đồng đó."}
      - {id: B, answer: "Thay mọi đối tượng bằng một giá trị hàm độc lập không có kiểu Java.", explanation: "Sai. Java vẫn là ngôn ngữ định kiểu chặt; hành vi theo phong cách hàm được biểu diễn thông qua các kiểu giao diện."}
      - {id: C, answer: "Biến mọi phương thức thành static để trạng thái biến mất.", explanation: "Sai. Phong cách hàm không bắt buộc phương thức phải là static và cũng không tự loại bỏ trạng thái."}
      - {id: D, answer: "Biến mọi vòng lặp thành một chuỗi xử lý Stream.", explanation: "Sai. Cơ chế của Stream là một chủ đề riêng, còn lập trình hàm trong Java rộng hơn Stream."}
