  - question: >-
      What is target typing for lambdas, and from which contexts can a lambda obtain its target type? Why can the same lambda syntax mean different things in different contexts?
    answer: >-
      A lambda is target typed: surrounding Java syntax supplies the functional interface against which the lambda is checked. Common sources are assignment context, a method argument position, a return context, or an explicit cast. The target type determines the parameter types, result contract, and allowed checked exceptions, so identical lambda text can be valid for different interfaces with different meanings. Without a usable target functional interface, a lambda normally cannot stand alone as an independently typed value.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.LambdaAndTargetTyping/LambdaAndTargetTyping.md", anchor: "target-typing"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      How do inferred parameter types, explicit parameter types, and var work in lambda parameter lists, and what consistency rule applies within one parameter list?
    answer: >-
      The target functional interface can usually supply lambda parameter types, so explicit types are often unnecessary. Parameters can instead be written with explicit declared types, and since Java 11 var can be used when useful, for example to attach annotations consistently. Within a single lambda parameter list, the declaration style must be consistent: do not mix implicitly typed parameters with explicitly typed parameters or with var. Type inference removes repeated syntax; it does not mean the parameters lack compile-time types.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.LambdaAndTargetTyping/LambdaAndTargetTyping.md", anchor: "lambda-parameter-typing"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Explain value-compatible and void-compatible lambda bodies. Why can a Consumer sometimes call a method that returns a value, and why does that not make every value-producing expression valid for a void target?
    answer: >-
      A value-targeted block lambda must satisfy the structural rules for producing a value: it cannot complete normally and every return statement in the block must return an expression, whose result must then be compatible with the target result type. A void target accepts a compatible block with no value-returning return statements, and an expression body can also be a statement expression. That is why a Consumer can invoke a method call whose return value is discarded. Arbitrary value expressions are not automatically valid for void; the expression must be one of the forms Java permits as a statement expression.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.LambdaAndTargetTyping/LambdaAndTargetTyping.md", anchor: "lambda-body-result-compatibility"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Why can overloaded methods become ambiguous when passed a lambda, and what are practical ways to resolve or avoid that ambiguity? Also distinguish creating a lambda value from executing its body.
    answer: >-
      If two overloads accept unrelated functional interfaces with compatible lambda shapes, the lambda may not give the compiler enough information to select one overload. An explicit cast or assigning the lambda to a variable of the intended interface type can disambiguate the call; API designers should avoid overload sets that differ only by unrelated same-shape functional interfaces. Separately, evaluating a lambda expression yields a functional-interface value, but its body does not run until the interface's functional method is invoked by the receiving code; Java does not promise a fresh allocation for every lambda evaluation.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.LambdaAndTargetTyping/LambdaAndTargetTyping.md", anchor: "lambda-overload-ambiguity"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Why must captured local variables be final or effectively final, and what exactly does a lambda retain when it captures a local value?
    answer: >-
      A lambda may capture a local variable only when that variable is final or effectively final, meaning the local binding is not reassigned after initialization. Conceptually, the lambda retains the captured value needed by the behavior, not a special mutable local-variable cell that can later be reassigned from the enclosing method. This restriction avoids confusing semantics for locals whose lifetime would otherwise outlive the stack frame. The rule applies to the local binding itself, not to the mutability of an object referenced by that binding.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CaptureScopeAndState/CaptureScopeAndState.md", anchor: "effectively-final"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      How do this, super, and lexical scope behave inside a lambda, and how does that differ from an anonymous class?
    answer: >-
      A lambda uses the lexical scope of its enclosing context. this inside the lambda means the same this as in the surrounding code, and unqualified member access and valid super usage follow the surrounding scope. An anonymous class is different because it creates a new object scope: inside an instance method of the anonymous class, this refers to the anonymous object. This distinction matters when refactoring anonymous classes to lambdas because member lookup and identity-sensitive behavior can change.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CaptureScopeAndState/CaptureScopeAndState.md", anchor: "lambda-vs-anonymous-class-scope"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      If a captured reference is effectively final, can the referenced object still change? How does this relate to instance/static fields and thread safety?
    answer: >-
      Yes. Effectively final prevents reassigning the captured local reference; it does not make the referenced object immutable. A lambda may therefore mutate an ArrayList or another mutable object reached through that reference. Instance and static fields are not captured locals and are governed by normal field-access rules, so they may also be read or changed when accessible. None of this makes the code thread-safe: if lambdas run concurrently, visibility, synchronization, atomicity, and other Java Memory Model concerns still apply.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CaptureScopeAndState/CaptureScopeAndState.md", anchor: "captured-reference-mutation"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Compare Function, Predicate, Consumer, and Supplier by input/output shape and by the kind of intent each communicates. Why is choosing by semantic role better than choosing only by arity?
    answer: >-
      Function<T,R> transforms T into R, Predicate<T> asks a boolean question about T, Consumer<T> accepts T for an action with no result in the functional contract, and Supplier<T> produces T without an input parameter. Their shapes matter, but their names also communicate intent to callers and readers. Picking an interface only because it has the right number of parameters can obscure meaning; use the contract whose role matches what the behavior actually represents.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.StandardFunctionalInterfaces/StandardFunctionalInterfaces.md", anchor: "java-util-function-overview"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      What are UnaryOperator/BinaryOperator and the Bi* functional interfaces for, and when should primitive specializations such as IntPredicate or ToIntFunction be preferred?
    answer: >-
      UnaryOperator<T> is a Function<T,T>, while BinaryOperator<T> is a BiFunction<T,T,T>; they express same-type transformation more precisely. BiFunction, BiPredicate, and BiConsumer model two-input variants of the usual contracts. Primitive specializations such as IntPredicate, IntUnaryOperator, or ToIntFunction avoid unnecessary boxing and unboxing when APIs or hot data paths operate heavily on primitives. They are not a different programming model, so they should be chosen when the API already expects them or when the boxing cost and clarity justify the specialized type.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.StandardFunctionalInterfaces/StandardFunctionalInterfaces.md", anchor: "primitive-specializations"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      How should you read the generic type flow of Function<T,R>, BiFunction<T,U,R>, Predicate<T>, Consumer<T>, and Supplier<T> when debugging composition or API calls?
    answer: >-
      Treat the type parameters as a data-flow contract. Function<T,R> consumes T and produces R; BiFunction<T,U,R> consumes T and U and produces R; Predicate<T> consumes T and produces boolean; Consumer<T> consumes T and has no result in its contract; Supplier<T> has no input and produces T. When composing or passing behavior, trace the output type of one stage into the input type required by the next. This catches many mismatches before looking at implementation details.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.StandardFunctionalInterfaces/StandardFunctionalInterfaces.md", anchor: "generic-input-output-flow"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Are all functional interfaces in java.util.function? How would you decide between a standard interface and a domain-specific interface in production code?
    answer: >-
      No. Runnable, Callable<V>, Comparator<T>, and many other JDK interfaces can be functional while living outside java.util.function. The deciding question is the contract, not the package. Prefer a standard interface when its shape and vocabulary clearly express the behavior and its standard composition is useful. Prefer a domain-specific interface when a business role deserves an explicit name, when a checked-exception contract differs, or when using Function or Predicate would erase an important semantic guarantee.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.StandardFunctionalInterfaces/StandardFunctionalInterfaces.md", anchor: "standard-vs-custom-functional-interface"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Compare static, bound instance, unbound instance, and constructor method references. How are receiver and arguments mapped, and what happens if the receiver of a bound reference is null?
    answer: >-
      Type::staticMethod maps functional arguments directly to a static call. expression::instanceMethod is bound: the receiver expression is evaluated when the method-reference expression is evaluated, and the functional arguments supply only the method's remaining arguments. Type::instanceMethod is unbound: the first functional argument becomes the receiver. Type::new targets a compatible constructor. For a bound reference, if evaluating the receiver produces null, creating the method reference throws NullPointerException immediately; the null check is not deferred until invocation.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.MethodReferences/MethodReferences.md", anchor: "bound-instance-method-reference"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      How does a method reference adapt to its target functional interface with respect to parameter types, boxing/unboxing, and a return value that the target does not use?
    answer: >-
      The target function type supplies the expected parameter and result shape, and Java checks whether a referenced method can be invoked consistently with that shape. Normal invocation conversions, including boxing and unboxing where permitted, can participate. A method that returns a value can also back a void-returning functional contract in cases where Java allows the result to be discarded. That compatibility is a language rule, but it should still be used deliberately because silently discarding a meaningful result can confuse readers.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.MethodReferences/MethodReferences.md", anchor: "method-reference-result-adaptation"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Why can an overloaded method reference be ambiguous, and when is a lambda clearer than a method reference even if both compile?
    answer: >-
      An overloaded method name does not identify one declaration by itself. The compiler uses the target functional interface and overload-resolution rules to determine which declaration fits; if the target still leaves multiple candidates, the reference is ambiguous. A lambda can make receiver placement, argument reordering, conversion, filtering, or additional logic explicit. Prefer a method reference when it names the intended operation directly; prefer a lambda when the mapping from functional parameters to the actual call would otherwise be hidden or surprising.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.MethodReferences/MethodReferences.md", anchor: "method-reference-vs-lambda"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      What makes a Java method “higher-order” in practice, and what lifetime or state questions arise when a method returns a lambda that captures values?
    answer: >-
      A method is higher-order in the practical Java sense when it receives behavior through a functional interface or returns behavior as a functional-interface value. Returning a lambda is useful for building configured behavior, such as prefixWith(prefix). Captured values can outlive the original method call because the returned behavior retains what it needs. If the captured value is a reference to mutable state, later mutations can change future results, so ownership and mutability still need to be designed explicitly.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.BehaviorCompositionAndHigherOrderUse/BehaviorCompositionAndHigherOrderUse.md", anchor: "returned-behavior-capture"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      For Function composition, what is the execution order of f.andThen(g) and g.compose(f), and how should type flow be used to reason about long chains?
    answer: >-
      f.andThen(g) runs f first and then g. g.compose(f) describes the same execution order: f then g. The names are read from different perspectives, so writing the value flow explicitly is often safest. Track the output type of each function and verify that it is acceptable as the next function's input type. The compiler can reject type-incompatible orderings, but it cannot tell whether a type-correct order is the correct business order.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.BehaviorCompositionAndHigherOrderUse/BehaviorCompositionAndHigherOrderUse.md", anchor: "composition-order"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      How do Predicate.and/or and Consumer.andThen behave when short-circuiting or exceptions occur, and why do side effects make composition harder to reason about?
    answer: >-
      Predicate.and and Predicate.or short-circuit, so the second predicate is evaluated only when the first result does not already determine the final answer. Consumer.andThen runs the first consumer before the second; if the first throws, the second is not executed. Side effects make these ordering rules observable: database calls, logging, mutation, or external I/O may happen zero, one, or multiple times depending on control flow and reuse. Composition is safest when the sequence and side effects are explicit.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.BehaviorCompositionAndHigherOrderUse/BehaviorCompositionAndHigherOrderUse.md", anchor: "composition-side-effects"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Explain Optional.of, ofNullable, empty, map, flatMap, and filter. What null-related mistakes do these methods help prevent, and what new mistakes are still possible?
    answer: >-
      Optional.of requires a non-null value, ofNullable turns null into Optional.empty(), and empty represents absence explicitly. map transforms a present value and converts a null mapping result to empty; flatMap is for a mapping function that already returns Optional so that nesting is avoided; filter keeps a present value only when the predicate passes. These methods make absence part of the API contract, but Optional itself should not be null, and careless use such as returning null instead of Optional.empty or immediately calling get() simply recreates the original ambiguity.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.OptionalAndAbsence/OptionalAndAbsence.md", anchor: "optional-transform-filter"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      What is the practical difference between orElse and orElseGet, and how do orElseThrow, ifPresentOrElse, and Optional.or fit into fallback or failure handling across Java versions?
    answer: >-
      The argument to orElse is evaluated before the method call, even when the Optional is present, so an expensive or side-effecting fallback still runs. orElseGet invokes its Supplier only when the value is absent. orElseThrow makes absence an explicit failure path. ifPresentOrElse and Optional.or were added in Java 9; Optional.or lazily supplies another Optional rather than a raw value. Code that must remain source-compatible with Java 8 should not assume those Java 9 methods are available.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.OptionalAndAbsence/OptionalAndAbsence.md", anchor: "optional-fallback-and-failure"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Where is Optional useful at API boundaries, and what are common Optional misuses involving fields, parameters, collections, or get()?
    answer: >-
      Optional is most useful when a method result legitimately may be absent and making that possibility explicit improves the caller contract. It is often less useful as a field or parameter by default because that can spread wrapper handling through the object model or API without clarifying semantics. Empty collections usually already represent “no elements,” so Optional<List<T>> is often redundant. Repeated isPresent/get patterns also defeat much of the benefit by returning to manual branching and unsafe extraction.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.OptionalAndAbsence/OptionalAndAbsence.md", anchor: "optional-api-design"}
