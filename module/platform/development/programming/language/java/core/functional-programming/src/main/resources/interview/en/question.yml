  - question: >-
      Before lambdas, Java could already pass behavior with anonymous classes. What changed with lambdas, and why is a lambda not simply an untyped “method without a name”?
    answer: >-
      Anonymous classes already let Java package behavior inside an object implementing an interface, but the syntax repeats the object creation, interface method, parameter types, and boilerplate around the actual behavior. Lambdas make the implementation of a compatible functional-interface contract concise. A lambda is not a standalone untyped function: it needs a target functional interface supplied by context, and that target determines parameter types, result requirements, and checked-exception constraints.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.FunctionalProgrammingPurpose/FunctionalProgrammingPurpose.md", anchor: "behavior-before-lambdas"}
