  - question: >-
      Which Stream topics belong outside this Functional Programming module, and what question tells you that it is time to hand off to the Stream API module?
    answer: >-
      Stream creation and sources, intermediate versus terminal operations, lazy evaluation, reduction, collectors, encounter order, and parallel-stream behavior are Stream mechanics. This module only needs the bridge: Stream methods receive typed functional-interface values implemented by lambdas or method references. If the remaining question is “How does Java type this behavior passed to Stream?”, stay here. If the question is “When and how does the Stream pipeline execute, collect, order, or parallelize data?”, move to the Stream API module.
    aiGenerated: true
    reviewed: false
