  - question: >-
      What does @FunctionalInterface guarantee, what does it not guarantee, and do default, static, or private interface methods break the SAM contract?
    answer: >-
      @FunctionalInterface asks the compiler to verify that the interface satisfies the functional-interface rules and documents that preserving one function contract is intentional. The annotation is not required for an interface to be functional. default, static, and private methods have implementations, so they do not add abstract behavior that a lambda must supply. default and static interface methods exist from Java 8, while private interface methods were added in Java 9, so a private helper is not source-compatible with Java 8.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.FunctionalInterfaceContracts/FunctionalInterfaceContracts.md", anchor: "non-abstract-interface-methods"}
