  - question: >-
      When is a custom functional interface better than Function, Predicate, or another standard interface, and what mistake should be avoided when the interface evolves?
    answer: >-
      Prefer a custom functional interface when the domain meaning deserves a name, when the contract needs a specific checked exception, or when a generic standard type would hide an important semantic promise. Standard interfaces are better when their shape already communicates the intent clearly and interoperability or standard composition is useful. If an interface intentionally serves as a lambda target, adding a second incompatible abstract operation should trigger a design review; simply deleting @FunctionalInterface to silence the compiler removes a useful guard instead of fixing the abstraction.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.FunctionalInterfaceContracts/FunctionalInterfaceContracts.md", anchor: "custom-functional-interface"}
