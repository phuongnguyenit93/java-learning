questions:
  - question: >-
      What does “functional programming in Java” mean in a language that is still object-oriented and imperative, and what problem does treating behavior as a typed value solve?
    answer: >-
      Java's functional style means representing behavior through typed contracts so that behavior can be passed, selected, returned, combined, or executed later. Java remains multi-paradigm: objects still model state and responsibilities, and imperative control flow is often appropriate. Functional interfaces provide the bridge because lambdas and method references need a target Java type. The practical benefit is separating stable control flow from behavior that varies, which reduces hard-coded branching and makes APIs able to accept policy or strategy without inventing a class hierarchy for every small behavior.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.FunctionalProgrammingPurpose/FunctionalProgrammingPurpose.md", anchor: "functional-programming-purpose"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      A method contains a growing mode flag and many if/else branches for different selection rules. How would behavior parameterization change the design, and when would converting the branches to lambdas be a bad idea?
    answer: >-
      Move the stable traversal or orchestration into one method and accept the changing rule through a functional interface such as Predicate<T>. Callers then provide the rule instead of forcing the method to know every variant. This is useful when behavior is genuinely variable or reusable. It is not a rule that every if statement should become a lambda: if the control flow itself is the important story, or splitting it into many tiny behaviors makes state transitions harder to follow, ordinary imperative code can be clearer.
    aiGenerated: true
