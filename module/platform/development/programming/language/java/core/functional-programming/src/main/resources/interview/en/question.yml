  - question: >-
      Why are checked exceptions awkward with standard functional interfaces, and what explicit adaptation choices are preferable to hiding the problem?
    answer: >-
      A lambda or method reference must obey the throws contract of its target function type. Standard interfaces such as Function<T,R> do not declare arbitrary checked exceptions, so a body that can throw IOException cannot simply propagate it through Function.apply. Choices include handling the exception locally, translating it to an appropriate unchecked exception such as UncheckedIOException, defining a domain-specific functional interface that declares the checked exception, or keeping the operation in an ordinary method when that makes failure handling clearer. Generic sneaky-throw helpers usually hide the real error contract.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.TradeoffsFailuresAndSynthesis/TradeoffsFailuresAndSynthesis.md", anchor: "checked-exception-adaptation"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      When should functional composition give way to imperative code or an object-oriented abstraction, and why do purity, immutability, and lambda identity remain separate concerns?
    answer: >-
      Functional composition is strong when the variation is a small behavior, transformation, condition, callback, or policy. Imperative code can be clearer when the main story is state transition, retries, resource lifecycle, or many early exits. An object-oriented abstraction is often better when the concept has identity, several related operations, lifecycle, and meaningful state. Lambda syntax does not guarantee purity or immutability, and Java does not guarantee a new lambda object on each evaluation or a stable implementation class or identity. These concerns must be designed independently.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.TradeoffsFailuresAndSynthesis/TradeoffsFailuresAndSynthesis.md", anchor: "functional-vs-oop-choice"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Give an end-to-end mental model for functional programming in Java, from defining a behavior contract to using it safely in production code.
    answer: >-
      Start with a functional-interface contract that defines one effective abstract behavior. A lambda or method reference is checked against that target function type, which determines parameters, results, and checked exceptions. The behavior may capture effectively-final locals while still observing mutable referenced state. Standard or domain-specific functional interfaces let code pass, return, and compose behavior; composition order, short-circuiting, side effects, and failure handling remain observable. Optional can express absence at suitable API boundaries, while Stream reuses these behavior contracts but owns its own execution mechanics. Good production code chooses functional, imperative, or object-oriented structure according to clarity, state, lifecycle, and debugging needs rather than maximizing lambda usage.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.TradeoffsFailuresAndSynthesis/TradeoffsFailuresAndSynthesis.md", anchor: "functional-programming-synthesis"}
