  - question: >-
      What actually makes a Java interface a functional interface? Explain why counting every abstract-looking declaration is not enough, including Object-method signatures and inherited override-equivalent methods.
    answer: >-
      After applying Java's functional-interface rules, the interface must have one unified abstract contract that a lambda can implement. An abstract declaration corresponding to a public instance method of Object, such as equals(Object), does not create another SAM obligation. Inherited abstract methods can also collapse into one contract when they are override-equivalent and have compatible return types, including covariant returns. Therefore the correct model is not “exactly one abstract keyword in the source,” but one effective function contract after inheritance and the relevant language rules are considered.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.FunctionalInterfaceContracts/FunctionalInterfaceContracts.md", anchor: "sam-inherited-method-rule"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      What is the function type of a functional interface, and which parts of that contract constrain a lambda or method reference?
    answer: >-
      The function type is the callable shape Java derives from the functional-interface contract. It includes the parameter types, the result type or void, and the checked exceptions that the contract permits. A lambda or method reference targeting that interface must therefore be compatible with all of those dimensions. This is why two functional interfaces that appear to have the same number of parameters can still impose different typing, result, or exception requirements.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.FunctionalInterfaceContracts/FunctionalInterfaceContracts.md", anchor: "functional-interface-function-type"}
