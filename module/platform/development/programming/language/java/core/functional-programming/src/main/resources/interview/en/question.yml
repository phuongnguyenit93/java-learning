  - question: >-
      Why do Stream APIs accept Predicate, Function, Consumer, and other functional interfaces, and how should you distinguish a Collection from a Stream at this module boundary?
    answer: >-
      Stream operations need callers to supply typed behavior such as filtering, transformation, or per-element actions, and functional interfaces provide those contracts. A Collection primarily owns or exposes elements as a data structure; a Stream is an API abstraction for describing processing over a source. The functional-programming module owns how the behavior values are typed and supplied. It does not follow that a lambda is a Stream, nor that knowing lambda syntax explains Stream execution semantics.
    aiGenerated: true
