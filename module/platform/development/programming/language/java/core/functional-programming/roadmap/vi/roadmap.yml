# <roadmap-schema>
# Cấu trúc Roadmap Module
# schema-version: 1
#
# YAML CONTRACT
# roadmap: Danh sách milestone cấp cao của roadmap cho language hiện tại.
#
# - id [string, required]: ID ổn định và duy nhất của milestone trong roadmap language hiện tại.
# - title [string, required]: Tên milestone hiển thị cho learner.
# - purpose [string, required]: Milestone này tồn tại để learner hiểu hoặc đạt được điều gì.
# - dependsOn [list, optional]: Danh sách id milestone prerequisite khi dependency không thể hiện đủ chỉ bằng thứ tự item.
# - objectives [list, optional]: Các learning objective cấp milestone; không dùng để liệt kê mọi fact/API/syntax nhỏ.
# - relatedKnowledge [list, optional]: Danh sách Knowledge category id trong chính module hiện tại hỗ trợ milestone. Portal hiển thị danh sách này ở phía đối diện milestone và click item sẽ điều hướng sang Knowledge category tương ứng.
# - relatedModules [list, optional]: Các module liên quan hiển thị ở Level 2 của Portal. Mỗi item dùng routeId bắt buộc và có thể có label/note localized; relation này chỉ để điều hướng, không tạo child milestone hoặc thay đổi learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - Topic/module này là gì?
#   - Vì sao nó tồn tại?
#   - Không có nó thì learner gặp vấn đề gì?
# FOUNDATION
#   - Learner cần prerequisite hoặc mental model nào trước?
# CORE MODEL
#   - Những abstraction hoặc building block lớn nào tạo nên chủ đề này?
# MECHANICS
#   - Nó hoạt động như thế nào ở mức language/runtime/API phù hợp với module?
# USAGE
#   - Nó được dùng như thế nào trong code thực tế?
# DECISION / TRADE-OFF
#   - Khi nào nên chọn cơ chế này thay vì cơ chế khác?
#   - Khi nào không nên dùng?
# FAILURE / PITFALL
#   - Những sai lầm, compile-time failure hoặc runtime failure nào đáng biết?
# INTEGRATION
#   - Chủ đề này kết nối với những concept/module lân cận nào?
# SYNTHESIS
#   - Sau cùng learner phải giữ mental model end-to-end nào?
#
# Mỗi language tự chịu trách nhiệm cho roadmap của chính nó. Không suy luận hoặc đồng bộ cấu trúc từ roadmap của language khác.
# Thứ tự item trong roadmap chính là thứ tự học mặc định. Chỉ dùng dependsOn khi cần biểu diễn dependency rõ hơn thứ tự tuyến tính.
# Skeleton không nên ép mọi module có đúng bấy nhiêu node. Nó là framework suy nghĩ chứ không phải template cứng.
# </roadmap-schema>

roadmap:
  - id: functional-programming-purpose
    title: Lập trình hàm trong Java là gì và vì sao cần?
    purpose: Hiểu Java hỗ trợ lập trình hàm bằng cách cho phép tham số hóa hành vi thông qua giao diện hàm, nhờ đó mã có thể nhận, trả về và tái sử dụng hành vi thay vì gắn cứng mọi biến thể xử lý hoặc phải dùng lớp vô danh dài dòng.
    relatedModules:
      - routeId: FUNCTIONAL_PROGRAMMING
        label: Mô hình lập trình hàm
        note: Các khái niệm không phụ thuộc ngôn ngữ như hàm thuần túy, tính bất biến, tính trong suốt tham chiếu và các đánh đổi ở cấp mô hình lập trình thuộc module Mô hình lập trình hàm.
    objectives:
      - Giải thích vấn đề được giải quyết khi truyền hành vi như một tham số thay vì nhúng mọi quyết định trực tiếp vào luồng điều khiển.
      - Nhận biết phong cách hàm là một cách lập trình bổ sung trong Java, không thay thế lập trình hướng đối tượng hoặc lập trình mệnh lệnh.
  - id: functional-interface-contracts
    title: Giao diện hàm và hợp đồng SAM
    purpose: Hiểu giao diện hàm (functional interface) là interface có đúng một phương thức trừu tượng, tạo ra kiểu Java cụ thể để lambda và tham chiếu phương thức có thể được gán, truyền và trả về.
    relatedModules:
      - routeId: JAVA_ABSTRACT_INTERFACE
        label: Lớp trừu tượng & Interface
        note: Giao diện hàm dựa trực tiếp trên quy ước của interface trong Java, bao gồm phương thức trừu tượng, default và static.
    objectives:
      - Giải thích quy tắc SAM (Single Abstract Method) và mục đích của @FunctionalInterface.
      - Phân biệt phương thức trừu tượng duy nhất của hợp đồng hàm với các phương thức default/static không làm phát sinh thêm hành vi trừu tượng.
  - id: lambdas-and-target-typing
    title: Biểu thức lambda và kiểu đích
    purpose: Hiểu lambda là một biểu thức có kiểu tham số và kiểu trả về được xác định từ giao diện hàm làm kiểu đích, dùng để mô tả hành vi sẽ được thực thi sau thay vì thực thi ngay khi khai báo.
    objectives:
      - Đọc được lambda dạng biểu thức và dạng khối, đồng thời đối chiếu chúng với chữ ký tương thích của giao diện hàm.
      - Giải thích cơ chế xác định kiểu từ ngữ cảnh (target typing), tính tương thích của tham số/giá trị trả về và vì sao cùng một lambda có thể mang kiểu khác nhau trong ngữ cảnh khác nhau.
  - id: capture-scope-and-state
    title: Bắt giữ biến, phạm vi và trạng thái
    purpose: Hiểu lambda có thể truy cập những trạng thái nào xung quanh nó, vì sao biến cục bộ được bắt giữ phải là final hoặc effectively final, và vì sao việc bắt giữ một tham chiếu khác với việc thay đổi chính đối tượng mà tham chiếu đó trỏ tới.
    objectives:
      - Phân biệt bắt giữ biến cục bộ với truy cập trạng thái của đối tượng hoặc thành viên static và hiểu ý nghĩa của this bên trong lambda.
      - Nhận biết ràng buộc effectively final chỉ áp dụng cho biến tham chiếu, không khiến đối tượng được tham chiếu trở thành bất biến.
  - id: standard-functional-interfaces
    title: Các giao diện hàm chuẩn
    purpose: Hiểu các nhóm interface chính trong java.util.function như những hợp đồng tái sử dụng cho điều kiện, biến đổi dữ liệu, nhận dữ liệu, cung cấp dữ liệu, toán tử và các biến thể nhiều tham số hoặc chuyên biệt cho kiểu nguyên thủy.
    relatedModules:
      - routeId: JAVA_GENERICS
        label: Generics
        note: Quan hệ kiểu generic giữa đầu vào và đầu ra giúp các giao diện trong java.util.function tái sử dụng được mà vẫn giữ thông tin kiểu.
    objectives:
      - Chọn Predicate, Function, Consumer, Supplier, UnaryOperator, BinaryOperator và các biến thể Bi dựa trên hợp đồng hành vi cần biểu diễn.
      - Nhận biết các biến thể chuyên biệt cho kiểu nguyên thủy chủ yếu giúp tránh chi phí đóng hộp/mở hộp (boxing/unboxing), không tạo ra một mô hình hàm khác.
  - id: method-references
    title: Tham chiếu phương thức và hàm tạo
    purpose: Hiểu tham chiếu phương thức hoặc hàm tạo là cách viết ngắn gọn để tái sử dụng hành vi đã có khi chữ ký của giao diện hàm đích có thể cung cấp đúng đối tượng nhận, tham số và giá trị trả về cần thiết.
    objectives:
      - Phân biệt tham chiếu tới phương thức static, phương thức của một đối tượng cụ thể, phương thức của một đối tượng chưa xác định và hàm tạo.
      - Chỉ dùng tham chiếu phương thức khi nó giúp mã dễ đọc hơn lambda tương đương.
  - id: behavior-composition-and-higher-order-use
    title: Truyền, trả về và kết hợp hành vi
    purpose: Hiểu API Java có thể nhận hoặc trả về giá trị mang kiểu giao diện hàm, sau đó kết hợp các hành vi nhỏ bằng những cơ chế như compose, andThen hoặc kết hợp Predicate.
    objectives:
      - Truyền và trả về hành vi thông qua giao diện hàm mà vẫn giữ rõ hợp đồng kiểu của đầu vào và đầu ra.
      - Kết hợp các hành vi có thể tái sử dụng mà vẫn giữ rõ thứ tự thực thi và các tác dụng phụ.
  - id: optional-and-absence
    title: Optional và biểu diễn sự vắng mặt
    purpose: Hiểu Optional là kiểu dùng để biểu diễn rõ khả năng không có giá trị tại một số ranh giới API và hỗ trợ chuỗi biến đổi có xét tới sự vắng mặt, không phải cách thay thế null ở mọi nơi.
    objectives:
      - Dùng map, flatMap, filter, ifPresent, orElse và các dạng giá trị thay thế chỉ được tính khi cần, phù hợp với trường hợp có hoặc không có giá trị.
      - Nhận biết các cách dùng không phù hợp như thay mọi trường/tham số bằng Optional hoặc liên tục bọc rồi tháo Optional không cần thiết.
  - id: stream-api-boundary
    title: Ranh giới với Stream API
    purpose: Hiểu Stream API sử dụng lambda và giao diện hàm để nhận hành vi xử lý dữ liệu, nhưng các quy tắc riêng của chuỗi xử lý Stream như tính lười, phép rút gọn (reduction), Collector, thứ tự và xử lý song song thuộc module Stream API chuyên biệt.
    relatedModules:
      - routeId: JAVA_STREAM_API
        label: Stream API (Java 8)
        note: Cách tạo Stream, thao tác trung gian/kết thúc, phép rút gọn, Collector, tính lười, thứ tự và cơ chế Stream song song thuộc module Stream API.
    objectives:
      - Nhận biết một thao tác Stream nhận hành vi thông qua các hợp đồng giao diện hàm đã học trong module này.
      - Biết khi nào cần chuyển sang module Stream API thay vì xem Stream là một phần của cú pháp lambda.
  - id: tradeoffs-failures-and-synthesis
    title: Tác dụng phụ, ngoại lệ, đánh đổi và cách lựa chọn
    purpose: Tổng hợp các cơ chế lập trình hàm của Java thành cách lựa chọn thực tế, đặc biệt khi thay đổi trạng thái, checked exception, gỡ lỗi, công việc bị che giấu hoặc chuỗi xử lý quá dài khiến mã theo phong cách hàm khó hiểu hơn cách viết mệnh lệnh hay hướng đối tượng.
    relatedModules:
      - routeId: JAVA_EXCEPTION
        label: Ngoại lệ (Exception)
        note: Ngữ nghĩa checked/unchecked exception và nền tảng thiết kế ngoại lệ vẫn thuộc module Exception.
    objectives:
      - Giữ tác dụng phụ và phần chuyển đổi checked exception rõ ràng thay vì che chúng trong chuỗi lambda ngắn gọn nhưng khó theo dõi.
      - Chọn phong cách hàm khi việc tham số hóa và kết hợp hành vi làm mã rõ hơn, đồng thời chọn cách viết mệnh lệnh hoặc hướng đối tượng khi luồng có trạng thái hay nhu cầu gỡ lỗi sẽ dễ hiểu hơn.
