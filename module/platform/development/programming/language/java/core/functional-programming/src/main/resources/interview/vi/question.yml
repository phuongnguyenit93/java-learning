  - question: >-
      Khi nào nên dừng việc kết hợp theo phong cách hàm để dùng mã mệnh lệnh hoặc mô hình trừu tượng hướng đối tượng, và vì sao tính thuần khiết (purity), tính bất biến (immutability) cùng danh tính của lambda vẫn là các mối quan tâm tách biệt?
    answer: >-
      Kết hợp theo phong cách hàm phù hợp khi phần thay đổi là một hành vi nhỏ, phép biến đổi, điều kiện, hàm gọi lại hoặc chính sách. Mã mệnh lệnh có thể rõ hơn khi trọng tâm là chuyển trạng thái, thử lại, vòng đời tài nguyên hoặc nhiều nhánh thoát sớm. Mô hình trừu tượng hướng đối tượng thường phù hợp hơn khi khái niệm có danh tính, nhiều thao tác liên quan, vòng đời và trạng thái có ý nghĩa. Cú pháp lambda không đảm bảo purity hay immutability, và Java cũng không đảm bảo mỗi lần đánh giá lambda đều tạo đối tượng mới hoặc có lớp triển khai hay danh tính ổn định. Các mối quan tâm này phải được thiết kế độc lập.
