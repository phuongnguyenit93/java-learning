  - question: >-
      Vì sao các phương thức nạp chồng có thể trở nên mơ hồ khi truyền lambda, và có những cách thực tế nào để giải quyết hoặc tránh sự mơ hồ đó? Đồng thời hãy phân biệt việc tạo ra một giá trị lambda với việc thực thi thân của nó.
    answer: >-
      Nếu hai biến thể nạp chồng nhận các giao diện hàm không liên quan nhưng có hình dạng lambda tương thích, lambda có thể không cung cấp đủ thông tin để trình biên dịch chọn một biến thể. Có thể ép kiểu tường minh hoặc gán lambda vào biến thuộc giao diện mong muốn để phân giải lời gọi; người thiết kế API cũng nên tránh các tập nạp chồng chỉ khác nhau ở những giao diện hàm không liên quan nhưng cùng hình dạng. Riêng việc đánh giá một biểu thức lambda cho ra một giá trị giao diện hàm, còn thân lambda chỉ chạy khi phương thức hàm của giao diện được phía nhận gọi; Java không đảm bảo mỗi lần đánh giá lambda đều cấp phát một đối tượng mới.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.LambdaAndTargetTyping/LambdaAndTargetTyping.md", anchor: "lambda-overload-ambiguity"}
