questions:
  - question: >-
      “Lập trình hàm trong Java” có nghĩa gì khi Java vẫn là ngôn ngữ hướng đối tượng và mệnh lệnh, và việc xem hành vi như một giá trị có kiểu giải quyết vấn đề gì?
    answer: >-
      Phong cách lập trình hàm trong Java biểu diễn hành vi bằng các hợp đồng có kiểu để hành vi có thể được truyền vào, lựa chọn, trả về, kết hợp hoặc thực thi sau. Java vẫn là ngôn ngữ đa mô hình: đối tượng vẫn mô hình hóa trạng thái và trách nhiệm, còn luồng điều khiển mệnh lệnh vẫn phù hợp trong nhiều trường hợp. Giao diện hàm (functional interface) là cầu nối vì lambda và tham chiếu phương thức (method reference) cần một kiểu Java đích. Lợi ích thực tế là tách phần điều phối ổn định khỏi hành vi thay đổi, nhờ đó giảm các nhánh bị viết cứng và cho phép API nhận chính sách hoặc chiến lược mà không phải tạo cả một hệ phân cấp lớp cho từng hành vi nhỏ.
