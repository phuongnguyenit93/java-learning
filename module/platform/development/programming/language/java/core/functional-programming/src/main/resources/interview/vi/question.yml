  - question: >-
      Vì sao biến cục bộ được lambda bắt giữ phải là final hoặc effectively final, và chính xác lambda giữ lại gì khi bắt giữ một giá trị cục bộ?
    answer: >-
      Lambda chỉ có thể bắt giữ một biến cục bộ khi biến đó là final hoặc effectively final, nghĩa là liên kết của biến không bị gán lại sau khi khởi tạo. Về mặt khái niệm, lambda giữ lại giá trị đã bắt giữ mà hành vi cần, chứ không giữ một “ô biến cục bộ có thể thay đổi” đặc biệt để phương thức bao ngoài có thể gán lại sau đó. Ràng buộc này tránh ngữ nghĩa khó hiểu khi vòng đời của biến cục bộ vượt ra ngoài khung ngăn xếp (stack frame) ban đầu. Quy tắc áp dụng cho chính liên kết của biến, không áp dụng cho khả năng thay đổi của đối tượng mà liên kết đó tham chiếu tới.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CaptureScopeAndState/CaptureScopeAndState.md", anchor: "effectively-final"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      this, super và phạm vi từ vựng (lexical scope) hoạt động thế nào bên trong lambda, và khác lớp vô danh ra sao?
    answer: >-
      Lambda dùng phạm vi từ vựng của ngữ cảnh bao quanh. this bên trong lambda có cùng nghĩa với this ở mã bao ngoài; việc truy cập thành viên không định danh và cách dùng super hợp lệ cũng tuân theo phạm vi bao ngoài. Lớp vô danh thì khác vì nó tạo ra một phạm vi đối tượng mới: bên trong phương thức thực thể của lớp vô danh, this trỏ tới chính đối tượng vô danh. Khác biệt này quan trọng khi đổi lớp vô danh thành lambda vì cách tra cứu thành viên và hành vi phụ thuộc vào danh tính đối tượng có thể thay đổi.
    aiGenerated: true
