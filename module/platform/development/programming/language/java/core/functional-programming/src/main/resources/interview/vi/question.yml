  - question: >-
      Một phương thức có cờ chế độ ngày càng phình to và nhiều nhánh if/else cho các quy tắc lựa chọn khác nhau. Tham số hóa hành vi sẽ thay đổi thiết kế này như thế nào, và khi nào việc chuyển các nhánh đó thành lambda lại là ý tưởng không tốt?
    answer: >-
      Hãy giữ phần duyệt dữ liệu hoặc điều phối ổn định trong một phương thức và nhận quy tắc thay đổi qua một giao diện hàm như Predicate<T>. Khi đó phía gọi cung cấp quy tắc thay vì buộc phương thức phải biết mọi biến thể. Cách này phù hợp khi hành vi thực sự biến đổi hoặc có thể tái sử dụng. Không nên biến mọi câu lệnh if thành lambda: nếu chính luồng điều khiển mới là nội dung cần đọc, hoặc việc tách thành nhiều hành vi rất nhỏ làm quá trình chuyển trạng thái khó theo dõi hơn, mã mệnh lệnh thông thường có thể rõ ràng hơn.
