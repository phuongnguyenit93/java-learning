  - question: >-
      Điều gì thực sự khiến một giao diện Java trở thành giao diện hàm? Hãy giải thích vì sao chỉ đếm các khai báo trông giống trừu tượng là chưa đủ, kể cả chữ ký phương thức của Object và các phương thức kế thừa tương đương khi ghi đè (override-equivalent).
    answer: >-
      Sau khi áp dụng các quy tắc về giao diện hàm của Java, giao diện phải còn một hợp đồng trừu tượng thống nhất mà lambda có thể triển khai. Một khai báo trừu tượng tương ứng với phương thức thực thể (instance method) public của Object, chẳng hạn equals(Object), không tạo thêm nghĩa vụ SAM. Các phương thức trừu tượng được kế thừa cũng có thể hợp nhất thành một hợp đồng nếu chúng override-equivalent và có kiểu trả về tương thích, kể cả kiểu trả về hiệp biến. Vì vậy mô hình đúng không phải là “trong mã nguồn có đúng một từ khóa abstract”, mà là có đúng một hợp đồng hàm hiệu lực sau khi xét kế thừa và các quy tắc liên quan của ngôn ngữ.
