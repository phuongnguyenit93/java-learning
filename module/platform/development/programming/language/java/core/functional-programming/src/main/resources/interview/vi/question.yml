      Lambda hoặc tham chiếu phương thức phải tuân theo hợp đồng throws của kiểu hàm đích. Giao diện chuẩn như Function<T,R> không khai báo tùy ý ngoại lệ được kiểm tra, nên phần thân có thể ném IOException không thể đơn giản truyền ngoại lệ đó ra ngoài qua Function.apply. Các lựa chọn gồm xử lý ngoại lệ ngay tại chỗ, chuyển nó thành ngoại lệ không được kiểm tra phù hợp như UncheckedIOException, định nghĩa giao diện hàm đặc thù miền nghiệp vụ có khai báo ngoại lệ được kiểm tra, hoặc giữ thao tác trong phương thức thông thường nếu cách đó làm xử lý lỗi rõ hơn. Các hàm hỗ trợ sneaky-throw kiểu tổng quát thường che mất hợp đồng lỗi thực sự.
