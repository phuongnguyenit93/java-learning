  - question: >-
      Hãy đưa ra một mô hình tư duy xuyên suốt cho lập trình hàm trong Java, từ lúc định nghĩa hợp đồng hành vi tới khi dùng nó an toàn trong mã thực tế.
    answer: >-
      Bắt đầu với một hợp đồng giao diện hàm định nghĩa đúng một hành vi trừu tượng hiệu lực. Lambda hoặc tham chiếu phương thức được kiểm tra theo kiểu hàm đích, nơi quyết định tham số, kết quả và ngoại lệ được kiểm tra. Hành vi có thể bắt giữ các biến cục bộ effectively final nhưng vẫn quan sát trạng thái có thể thay đổi thông qua các tham chiếu đã bắt giữ. Giao diện hàm chuẩn hoặc giao diện đặc thù miền nghiệp vụ cho phép mã truyền, trả về và kết hợp hành vi; thứ tự kết hợp, đánh giá ngắn mạch, tác dụng phụ và xử lý lỗi vẫn có thể quan sát được. Optional có thể biểu diễn trạng thái vắng mặt tại các ranh giới API phù hợp, còn Stream tái sử dụng các hợp đồng hành vi này nhưng sở hữu cơ chế thực thi riêng. Mã dùng thực tế nên chọn cấu trúc hàm, mệnh lệnh hoặc hướng đối tượng dựa trên độ rõ ràng, trạng thái, vòng đời và nhu cầu gỡ lỗi thay vì cố tăng số lượng lambda.
