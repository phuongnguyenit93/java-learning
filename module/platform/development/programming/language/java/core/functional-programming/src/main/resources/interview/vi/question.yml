  - question: >-
      Nếu một tham chiếu cục bộ được bắt giữ là effectively final thì đối tượng mà nó trỏ tới vẫn có thể thay đổi không? Điều này liên quan thế nào tới trường thực thể/static và an toàn luồng?
    answer: >-
      Có. Effectively final chỉ ngăn việc gán lại tham chiếu cục bộ đã bắt giữ; nó không làm đối tượng được tham chiếu trở thành bất biến. Vì vậy lambda vẫn có thể thay đổi một ArrayList hoặc đối tượng có thể thay đổi (mutable) khác đi qua tham chiếu đó. Trường thực thể (instance) và static không phải biến cục bộ được bắt giữ và tuân theo các quy tắc truy cập trường thông thường, nên chúng cũng có thể được đọc hoặc thay đổi khi có quyền truy cập. Không điều nào ở đây tự tạo ra an toàn luồng: nếu các lambda chạy đồng thời, các vấn đề về tính nhìn thấy (visibility), đồng bộ hóa, tính nguyên tử và Java Memory Model vẫn phải được xử lý.
