  - question: >-
      Trước khi có lambda, Java đã có thể truyền hành vi bằng lớp vô danh (anonymous class). Lambda đã thay đổi điều gì, và vì sao lambda không đơn giản là một “phương thức không tên” không có kiểu?
    answer: >-
      Lớp vô danh vốn đã cho phép Java đóng gói hành vi trong một đối tượng triển khai giao diện, nhưng cú pháp phải lặp lại phần tạo đối tượng, phương thức của giao diện, kiểu tham số và nhiều mã khuôn mẫu quanh hành vi thực sự. Lambda giúp viết ngắn gọn phần triển khai một hợp đồng giao diện hàm tương thích. Lambda không phải một hàm độc lập không có kiểu: nó cần giao diện hàm đích do ngữ cảnh cung cấp, và kiểu đích đó quyết định kiểu tham số, yêu cầu về kết quả và ràng buộc ngoại lệ được kiểm tra (checked exception).
