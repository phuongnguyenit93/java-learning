  - question: >-
      Kiểu hàm (function type) của một giao diện hàm là gì, và những phần nào của hợp đồng đó ràng buộc lambda hoặc tham chiếu phương thức?
    answer: >-
      Kiểu hàm là hình dạng lời gọi mà Java suy ra từ hợp đồng của giao diện hàm. Nó gồm kiểu các tham số, kiểu kết quả hoặc void, cùng các ngoại lệ được kiểm tra mà hợp đồng cho phép. Vì vậy lambda hoặc tham chiếu phương thức nhắm tới giao diện đó phải tương thích với tất cả các thành phần này. Đây là lý do hai giao diện hàm có vẻ cùng số lượng tham số vẫn có thể đặt ra yêu cầu khác nhau về kiểu, kết quả hoặc ngoại lệ.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.FunctionalInterfaceContracts/FunctionalInterfaceContracts.md", anchor: "functional-interface-function-type"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      @FunctionalInterface đảm bảo điều gì, không đảm bảo điều gì, và các phương thức default, static hoặc private trong giao diện có phá vỡ hợp đồng SAM không?
    answer: >-
      @FunctionalInterface yêu cầu trình biên dịch xác minh giao diện có thỏa các quy tắc của giao diện hàm hay không, đồng thời ghi rõ chủ đích duy trì một hợp đồng hàm. Chú thích này không bắt buộc để một giao diện trở thành giao diện hàm. Các phương thức default, static và private đều có phần triển khai nên không thêm hành vi trừu tượng mà lambda phải cung cấp. Phương thức default và static trong giao diện có từ Java 8, còn phương thức private trong giao diện được thêm ở Java 9, vì vậy phương thức hỗ trợ private trong giao diện không tương thích mã nguồn với Java 8.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.FunctionalInterfaceContracts/FunctionalInterfaceContracts.md", anchor: "non-abstract-interface-methods"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Khi nào nên dùng giao diện hàm tự định nghĩa thay vì Function, Predicate hoặc một giao diện chuẩn khác, và cần tránh sai lầm nào khi giao diện đó phát triển?
    answer: >-
      Nên dùng giao diện hàm tự định nghĩa khi ý nghĩa miền nghiệp vụ đáng có tên riêng, khi hợp đồng cần khai báo một ngoại lệ được kiểm tra cụ thể, hoặc khi một kiểu chuẩn quá chung sẽ che mất cam kết ngữ nghĩa quan trọng. Giao diện chuẩn phù hợp hơn khi hình dạng của nó đã diễn đạt rõ ý định và khả năng kết hợp chuẩn có ích. Nếu một giao diện được chủ đích dùng làm đích cho lambda, việc thêm thao tác trừu tượng thứ hai không tương thích phải dẫn tới xem xét lại thiết kế; chỉ xóa @FunctionalInterface để trình biên dịch im lặng là bỏ đi một hàng rào hữu ích chứ không sửa mô hình trừu tượng.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.FunctionalInterfaceContracts/FunctionalInterfaceContracts.md", anchor: "custom-functional-interface"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Suy kiểu theo đích (target typing) đối với lambda là gì, và lambda có thể nhận kiểu đích từ những ngữ cảnh nào? Vì sao cùng một cú pháp lambda có thể mang ý nghĩa khác nhau trong các ngữ cảnh khác nhau?
    answer: >-
      Lambda được suy kiểu theo ngữ cảnh đích: cú pháp Java xung quanh cung cấp giao diện hàm dùng để kiểm tra lambda. Các nguồn phổ biến gồm ngữ cảnh gán, vị trí đối số của phương thức, ngữ cảnh trả về hoặc phép ép kiểu tường minh. Kiểu đích quyết định kiểu tham số, hợp đồng kết quả và các ngoại lệ được kiểm tra được phép, nên cùng một đoạn lambda có thể hợp lệ cho các giao diện khác nhau với ý nghĩa khác nhau. Nếu không có giao diện hàm đích phù hợp, lambda thông thường không thể tự đứng độc lập như một giá trị có kiểu riêng.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.LambdaAndTargetTyping/LambdaAndTargetTyping.md", anchor: "target-typing"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Kiểu tham số được suy ra, kiểu tham số khai báo tường minh và var hoạt động thế nào trong danh sách tham số lambda, và quy tắc nhất quán nào áp dụng trong cùng một danh sách?
    answer: >-
      Giao diện hàm đích thường cung cấp được kiểu cho tham số lambda, nên nhiều trường hợp không cần viết kiểu tường minh. Tham số cũng có thể được khai báo bằng kiểu cụ thể; từ Java 11 có thể dùng var khi hữu ích, chẳng hạn để gắn chú thích nhất quán. Trong cùng một danh sách tham số lambda, cách khai báo phải nhất quán: không trộn tham số suy kiểu ngầm với tham số có kiểu tường minh hoặc với var. Suy luận kiểu (type inference) chỉ loại bỏ cú pháp lặp lại, không có nghĩa tham số thiếu kiểu tại thời điểm biên dịch.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.LambdaAndTargetTyping/LambdaAndTargetTyping.md", anchor: "lambda-parameter-typing"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Hãy giải thích thân lambda tương thích giá trị (value-compatible) và tương thích void (void-compatible). Vì sao Consumer đôi khi có thể gọi một phương thức trả về giá trị, và vì sao điều đó không khiến mọi biểu thức sinh giá trị đều hợp lệ với đích void?
    answer: >-
      Lambda dạng khối nhắm tới đích có giá trị phải thỏa các quy tắc cấu trúc để tạo ra giá trị: khối đó không được kết thúc theo luồng bình thường và mọi câu lệnh return trong khối đều phải trả về một biểu thức, sau đó kết quả của biểu thức phải tương thích với kiểu kết quả đích. Đích void chấp nhận khối tương thích không có return trả về giá trị; thân lambda dạng biểu thức cũng có thể là một biểu thức được phép dùng như câu lệnh (statement expression). Vì vậy Consumer có thể gọi một phương thức có giá trị trả về rồi bỏ qua giá trị đó. Tuy nhiên không phải biểu thức sinh giá trị tùy ý nào cũng hợp lệ với void.
