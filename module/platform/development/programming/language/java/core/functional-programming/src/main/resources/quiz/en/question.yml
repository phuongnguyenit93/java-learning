  - id: fp-q06
    question: "Which interface can still be a functional interface?"
    answers:
      - {id: A, answer: "An interface with two unrelated abstract methods and no defaults.", explanation: "Incorrect. Two unrelated abstract contracts prevent a single SAM."}
      - {id: B, answer: "An interface with one abstract method plus any number of compatible default and static methods.", explanation: "Correct. Implemented default/static methods do not add abstract behavior to the SAM."}
      - {id: C, answer: "Only an interface explicitly annotated with @FunctionalInterface.", explanation: "Incorrect. The annotation is optional; structural compatibility is what matters."}
      - {id: D, answer: "Only an interface declared inside java.util.function.", explanation: "Incorrect. Functional interfaces can live in any package."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
