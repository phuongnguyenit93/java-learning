      - {id: B, answer: "Parameter types, result type, and the checked-exception contract.", explanation: "Correct. These are central to lambda and method-reference compatibility."}
      - {id: C, answer: "The runtime class name generated for a lambda.", explanation: "Incorrect. Runtime implementation class identity is not the function type."}
      - {id: D, answer: "The package name of every implementation class.", explanation: "Incorrect. Implementations do not define the target function type."}
