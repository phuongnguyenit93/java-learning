      - {id: C, answer: "Only a field declaration.", explanation: "Incorrect. Target typing is much broader than fields."}
      - {id: D, answer: "No context is needed because every lambda has an intrinsic standalone type.", explanation: "Incorrect. A lambda needs a compatible target functional-interface type."}
