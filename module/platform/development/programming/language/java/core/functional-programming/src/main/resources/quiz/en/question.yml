  - id: fp-q03
    question: "What relationship between anonymous classes and lambdas is most accurate?"
    answers:
      - {id: A, answer: "Anonymous classes cannot represent behavior through interfaces.", explanation: "Incorrect. They have long been able to implement interface behavior."}
      - {id: B, answer: "A lambda always creates exactly the same scope and this semantics as an anonymous class.", explanation: "Incorrect. Lambdas use lexical scope and differ in this semantics."}
      - {id: C, answer: "Lambdas provide concise syntax for compatible functional-interface behavior that could often be expressed with an anonymous class.", explanation: "Correct. Lambda syntax reduces ceremony while still relying on a target functional-interface type."}
      - {id: D, answer: "Lambdas are untyped replacements for anonymous objects.", explanation: "Incorrect. A lambda requires a compatible target type."}
    correctAnswerId: C
