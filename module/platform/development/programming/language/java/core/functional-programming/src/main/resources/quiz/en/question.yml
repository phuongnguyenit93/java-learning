  - id: fp-q07
    question: "An interface declares boolean matches(String value) and also redeclares boolean equals(Object other). Why can it still be functional?"
    answers:
      - {id: A, answer: "equals is automatically a default method in every interface.", explanation: "Incorrect. The reason is not that equals becomes default."}
      - {id: B, answer: "Any method named equals is ignored regardless of signature.", explanation: "Incorrect. The rule concerns signatures corresponding to public instance methods of Object."}
      - {id: C, answer: "A declaration matching the relevant public Object method does not add a second functional abstract contract.", explanation: "Correct. matches remains the functional contract."}
      - {id: D, answer: "@FunctionalInterface silently removes equals from the bytecode.", explanation: "Incorrect. The annotation validates the contract; it does not rewrite methods."}
