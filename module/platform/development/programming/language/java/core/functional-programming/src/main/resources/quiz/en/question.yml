  - id: fp-q17
    question: "A local List is never reassigned, and a lambda calls list.add(value). Which statement is correct?"
    answers:
      - {id: A, answer: "This can compile because the local reference may be effectively final even though the List object is mutable.", explanation: "Correct. The capture rule fixes the local binding, not the object's internal state."}
      - {id: B, answer: "It cannot compile because effectively final makes every reachable object immutable.", explanation: "Incorrect. Effectively final does not imply object immutability."}
      - {id: C, answer: "It compiles only when the List implementation is immutable.", explanation: "Incorrect. Mutability of the object is separate from local-variable capture legality."}
      - {id: D, answer: "The lambda receives a deep copy of the List.", explanation: "Incorrect. The captured value is the reference, not a deep copy."}
    correctAnswerId: A
    aiGenerated: true
