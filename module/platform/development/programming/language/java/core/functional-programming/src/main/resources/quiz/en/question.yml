  - id: fp-q09
    question: "What does @FunctionalInterface guarantee?"
    answers:
      - {id: A, answer: "The compiler verifies that the interface satisfies functional-interface rules.", explanation: "Correct. It is a compile-time design check and documentation signal."}
      - {id: B, answer: "The JVM always allocates a new lambda object for each evaluation.", explanation: "Incorrect. The annotation says nothing about runtime allocation or identity."}
      - {id: C, answer: "The interface may never have default, static, or private methods.", explanation: "Incorrect. Those methods may coexist with one functional abstract contract."}
      - {id: D, answer: "The interface becomes functional only because the annotation is present.", explanation: "Incorrect. An unannotated interface can still be functional if it satisfies the rules."}
    correctAnswerId: A
    aiGenerated: true
