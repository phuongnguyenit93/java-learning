      - {id: C, answer: "Predicate<String> p = s -> !s.isEmpty();", explanation: "Incorrect. The body produces the required boolean result."}
      - {id: D, answer: "Function<String, Integer> f = s -> { s.length(); };", explanation: "Correct. This block can complete normally without returning a value, so it cannot satisfy a value-returning Function."}
