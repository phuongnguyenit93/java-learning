  - id: fp-q01
    question: "What is the central Java-specific idea of functional programming in this module?"
    answers:
      - {id: A, answer: "Represent behavior through typed functional-interface values that can be passed and invoked.", explanation: "Correct. Java models behavior through functional-interface contracts, with lambdas or method references supplying implementations."}
      - {id: B, answer: "Replace every object with a standalone function value that has no Java type.", explanation: "Incorrect. Java remains strongly typed and functional behavior is represented through interface types."}
      - {id: C, answer: "Make all methods static so state disappears.", explanation: "Incorrect. Functional style does not require static methods or eliminate state."}
      - {id: D, answer: "Turn every loop into a Stream pipeline.", explanation: "Incorrect. Stream mechanics are a separate topic and functional Java is broader than Streams."}
