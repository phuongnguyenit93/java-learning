  - id: fp-q16
    question: "A local int minimum is assigned 3, later reassigned to 5, and then referenced by a lambda. What happens?"
    answers:
      - {id: A, answer: "It compiles because primitive locals are always capturable.", explanation: "Incorrect. Primitive and reference locals follow the same effectively-final capture rule."}
      - {id: B, answer: "It compiles if the lambda never executes.", explanation: "Incorrect. Capture legality is checked at compile time."}
      - {id: C, answer: "It compiles only if minimum is boxed to Integer.", explanation: "Incorrect. Boxing does not change the effectively-final rule."}
      - {id: D, answer: "It does not compile because minimum is no longer final or effectively final.", explanation: "Correct. Reassignment breaks effectively-final status."}
