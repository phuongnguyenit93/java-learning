  - id: fp-q11
    question: "Why can the same lambda text () -> value be assigned to two different compatible functional-interface types?"
    answers:
      - {id: A, answer: "Because lambdas are dynamically typed at runtime.", explanation: "Incorrect. Lambda typing is compile-time and target driven."}
      - {id: B, answer: "Because all no-argument interfaces are assignment compatible with each other.", explanation: "Incorrect. Their function types still must be compatible."}
      - {id: C, answer: "Because target typing uses the surrounding expected functional-interface type to interpret the lambda.", explanation: "Correct. The same syntax can acquire different Java types in different target contexts."}
      - {id: D, answer: "Because the compiler ignores return types for lambdas.", explanation: "Incorrect. Result compatibility is part of lambda typing."}
