  - id: fp-q08
    question: "Left declares CharSequence value(), Right declares String value(), and Combined extends both. Why may Combined still be a functional interface?"
    answers:
      - {id: A, answer: "Because inherited abstract methods are always ignored for SAM analysis.", explanation: "Incorrect. Inherited abstract methods matter unless they form one compatible contract."}
      - {id: B, answer: "Because String and CharSequence become the same erased primitive type.", explanation: "Incorrect. The reason is override compatibility, not primitive erasure."}
      - {id: C, answer: "Because Java arbitrarily keeps the method from the rightmost parent.", explanation: "Incorrect. Parent order is not the rule."}
      - {id: D, answer: "Because the inherited methods are override-compatible and String is a covariant return for CharSequence.", explanation: "Correct. They can represent one coherent abstract contract."}
    correctAnswerId: D
