  - id: fp-q02
    question: "Why is behavior parameterization useful when an algorithm is stable but one rule varies?"
    answers:
      - {id: A, answer: "It guarantees the varying rule is always pure.", explanation: "Incorrect. Java functional interfaces do not enforce purity."}
      - {id: B, answer: "The stable algorithm can stay unchanged while callers supply the varying behavior.", explanation: "Correct. The algorithm owns when and where behavior runs; callers choose which behavior."}
      - {id: C, answer: "It removes compile-time type checking from the varying rule.", explanation: "Incorrect. The functional-interface type provides compile-time checking."}
      - {id: D, answer: "It requires one subclass for every rule.", explanation: "Incorrect. Passing behavior is often used to avoid unnecessary subclass variation."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
