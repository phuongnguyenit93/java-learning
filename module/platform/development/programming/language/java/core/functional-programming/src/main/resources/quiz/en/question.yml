      - {id: B, answer: "Imperative control flow is invalid once functional interfaces are introduced.", explanation: "Incorrect. Clear imperative control flow remains appropriate in many workflows."}
      - {id: C, answer: "Functional style should be used only in libraries, never application code.", explanation: "Incorrect. It is useful anywhere behavior variation is clearer as a contract."}
      - {id: D, answer: "Functional style is another Java tool and can coexist with objects and imperative workflows.", explanation: "Correct. Java is multi-paradigm; choose the form that best exposes intent and constraints."}
