# <roadmap-schema>
# Module Roadmap Structure
# schema-version: 1
#
# YAML CONTRACT
# roadmap: High-level learning milestones for the current language roadmap.
#
# - id [string, required]: Stable and unique milestone identity within the current language roadmap.
# - title [string, required]: Milestone title displayed to the learner.
# - purpose [string, required]: What the learner should understand or achieve from this milestone.
# - dependsOn [list, optional]: Prerequisite milestone ids when item order alone is not enough to express the dependency.
# - objectives [list, optional]: Milestone-level learning objectives; do not use this to list every small fact/API/syntax item.
# - relatedKnowledge [list, optional]: Knowledge category ids in the current module that support this milestone. Portal displays this list on the side opposite the milestone and clicking an item navigates to the matching Knowledge category.
# - relatedModules [list, optional]: Related modules displayed as Portal Level 2 cards. Each item requires routeId and may provide localized label/note; this relation is navigation only and does not create child milestones or change learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - What is this topic/module?
#   - Why does it exist?
#   - What problem exists without it?
# FOUNDATION
#   - What prerequisite or mental model must the learner have first?
# CORE MODEL
#   - What major abstractions or building blocks make up this topic?
# MECHANICS
#   - How does it work at the language/runtime/API level appropriate for this module?
# USAGE
#   - How is it used in real code?
# DECISION / TRADE-OFF
#   - When should this mechanism be chosen over another?
#   - When should it not be used?
# FAILURE / PITFALL
#   - What mistakes, compile-time failures, or runtime failures matter?
# INTEGRATION
#   - How does this topic connect to neighboring concepts/modules?
# SYNTHESIS
#   - What end-to-end mental model should the learner retain?
#
# Each language owns its own roadmap. Do not infer or synchronize its structure from another language roadmap.
# Item order in roadmap is the default learning order. Use dependsOn only when a dependency needs to be expressed beyond the linear order.
# The skeleton must not force every module to have the same number of nodes. It is a thinking framework, not a rigid template.
# </roadmap-schema>

roadmap:
  - id: annotation-purpose
    title: What Are Annotations and Why Does Java Need Them?
    purpose: Understand annotations as structured information attached directly to code for compilers, tools, or frameworks to consume, and understand the problem they solve better than comments, naming conventions, or separate manual registration.
    relatedKnowledge:
      - Basic
    objectives:
      - Explain why annotations exist and why they do not create behavior by themselves without a consumer.
      - Read basic @Name(...) usage syntax, annotation elements, and their values before moving into deeper mechanisms.
  - id: built-in-annotations
    title: Built-In Compiler and Tool Contracts
    purpose: Understand how standard annotations such as @Override, @Deprecated, @SuppressWarnings, @SafeVarargs, and @FunctionalInterface communicate structured contracts to the compiler, documentation, and tools.
    relatedKnowledge:
      - BuiltIn
    objectives:
      - Distinguish compiler-checked guarantees from documentation/tooling hints.
      - Use built-in annotations at the narrowest meaningful scope.
  - id: custom-annotation-schema
    title: Custom Annotation Types
    purpose: Understand how to declare project-specific annotation types with @interface, typed elements, default values, and clear semantics.
    relatedKnowledge:
      - CustomAnnotation
    objectives:
      - Design annotation elements that encode stable metadata rather than hidden behavior.
      - Understand that custom annotations need a clear, checkable metadata schema.
  - id: retention-lifecycle
    title: Retention and Annotation Lifetime
    purpose: Understand how @Retention determines how long annotation metadata survives and which consumers can still observe it.
    relatedKnowledge:
      - Retention
    relatedModules:
      - routeId: JAVA_REFLECTION
        label: Reflection
        note: Reflection is the primary Java Core mechanism for consuming RUNTIME-retained annotation metadata.
    objectives:
      - Choose SOURCE, CLASS, or RUNTIME from the needs of the actual consumer rather than habit.
      - Understand why Reflection cannot observe annotation metadata that does not survive until runtime.
  - id: targets-and-use-sites
    title: Targets and Annotation Use Sites
    purpose: Understand how @Target determines where an annotation is legal and why its usage should be restricted to meaningful program locations.
    relatedKnowledge:
      - Target
    objectives:
      - Distinguish declaration annotations from annotations applied at type-use locations such as TYPE_USE.
      - Design usage boundaries tightly enough to prevent annotations from appearing in meaningless contexts.
  - id: meta-annotations-and-composition
    title: Meta-Annotations and Annotation-Type Contracts
    purpose: Understand meta-annotations as the mechanism for declaring the contract of an annotation type through @Retention, @Target, @Documented, @Inherited, and @Repeatable.
    relatedKnowledge:
      - MetaAnnotation
    objectives:
      - Read the meta-annotation set as part of the annotation type's retention, usage, documentation, and lookup contract.
      - Distinguish Java meta-annotation mechanics from framework-defined annotation composition.
  - id: repeatable-and-inherited-semantics
    title: Repeatable and Inherited Semantics
    purpose: Understand container-backed @Repeatable annotations and the narrow class-inheritance behavior of @Inherited.
    relatedKnowledge:
      - RepeatableInherited
    objectives:
      - Understand conceptually how repeated annotations are represented and retrieved.
      - Recognize that @Inherited does not make method or interface annotations inherit like class annotations.
  - id: compile-time-processing
    title: Compile-Time Annotation Processing
    purpose: Understand annotation processors as compile-time consumers that inspect the source model and can generate source code or resources across processing rounds.
    relatedKnowledge:
      - AnnotationProcessing
    objectives:
      - Understand the compile-time processing lifecycle and its ability to validate or generate source code and resources.
      - Separate compile-time generation from runtime reflection.
  - id: annotation-design-and-synthesis
    title: When Should You Use Annotations?
    purpose: Synthesize the complete annotation model so the learner can decide when metadata belongs in annotations and when an explicit API, interface, or configuration is clearer.
    relatedKnowledge:
      - AnnotationDesign
    objectives:
      - Trace the end-to-end path from annotation declaration and usage through retention to the consumer that creates behavior, without treating the annotation itself as behavior.
      - Recognize overuse risks such as hidden control flow, framework coupling, hard-to-find configuration, or incorrect target and retention choices.
