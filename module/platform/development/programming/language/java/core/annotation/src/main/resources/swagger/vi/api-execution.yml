AnnotationInspectionController:
  retention():
    execution: |-
      <p><strong>Khái niệm:</strong> Chính sách lưu giữ quyết định một Annotation chỉ tồn tại trong mã nguồn, đến class file hay tới thời gian chạy.</p>
      <p><strong>Luồng:</strong> <code>Sample</code> được gắn ba Annotation có chính sách lưu giữ khác nhau, sau đó endpoint dùng Reflection để kiểm tra chính class đó.</p>
      <pre><code>@SourceOnly
      @ClassOnly
      @RuntimeVisible
      static final class Sample {}</code></pre>
      <p><strong>Bằng chứng:</strong> Reflection gọi <code>isAnnotationPresent(...)</code> và <code>getDeclaredAnnotations()</code> trên <code>Sample.class</code>.</p>
      <p><strong>Quan sát:</strong> SOURCE và CLASS trả false ở thời gian chạy; RUNTIME trả true và xuất hiện trong danh sách Annotation mà Reflection nhìn thấy.</p>
      <p><strong>Kết luận:</strong> <code>RUNTIME</code> không tạo hành vi; nó chỉ giữ siêu dữ liệu đủ lâu để thành phần ở thời gian chạy có thể đọc.</p>
    usage: true
BuiltInAnnotationController:
  compilerContracts():
    execution: |-
      <p><strong>Khái niệm:</strong> Một số Annotation có sẵn biến ý định của lập trình viên thành quy tắc mà trình biên dịch kiểm tra.</p>
      <p><strong>Luồng:</strong> Mã nguồn chứa một implementation có <code>@Override</code> hợp lệ và một interface có <code>@FunctionalInterface</code> hợp lệ; ứng dụng chỉ chạy được vì các quy tắc đó đã vượt qua bước kiểm tra khi biên dịch.</p>
      <pre><code>@Override
      public String name() { return "child"; }

      @FunctionalInterface
      interface Transformer {
          String transform(String value);
      }</code></pre>
      <p><strong>Quan sát:</strong> Endpoint trả kết quả gọi method của implementation và kết quả lambda. Nó không cố tạo một khai báo sai tại thời gian chạy.</p>
      <p><strong>Kết luận:</strong> Annotation có thể được trình biên dịch xử lý trước thời gian chạy; response ở đây chỉ là bằng chứng rằng mã nguồn hợp lệ đã biên dịch thành công.</p>
    usage: true
InheritedAnnotationController:
  inheritance():
    execution: |-
      <p><strong>Khái niệm:</strong> <code>@Inherited</code> chỉ thay đổi cách tra cứu Annotation trên class qua chuỗi superclass.</p>
      <p><strong>Luồng:</strong> Một subclass kế thừa class được gắn Annotation, một class khác chỉ implements interface được gắn Annotation, và subclass ghi đè một method đã được gắn Annotation ở superclass.</p>
      <pre><code>@AuditedType
      static class BaseService { ... }

      static final class ChildService extends BaseService { ... }

      @AuditedType
      interface AuditedContract {}
      static final class InterfaceOnlyService implements AuditedContract {}</code></pre>
      <p><strong>Quan sát:</strong> Child class nhìn thấy annotation từ superclass; class chỉ implements annotated interface thì không. Annotation trên method base cũng không tự xuất hiện trên overriding method.</p>
      <p><strong>Kết luận:</strong> <code>@Inherited</code> không phải cơ chế kế thừa siêu dữ liệu tổng quát cho interface hay member.</p>
    usage: true
MetaAnnotationController:
  inspectTargets():
    execution: |-
      <p><strong>Khái niệm:</strong> Meta-Annotation mô tả quy tắc của một kiểu Annotation khác.</p>
      <p><strong>Luồng:</strong> <code>AuditedComponent</code> được cấu hình bằng <code>@Target</code>, <code>@Retention</code> và <code>@Documented</code>; endpoint dùng Reflection trên chính kiểu Annotation này.</p>
      <pre><code>@Documented
      @Retention(RetentionPolicy.RUNTIME)
      @Target({ElementType.TYPE, ElementType.METHOD})
      @interface AuditedComponent {}</code></pre>
      <p><strong>Quan sát:</strong> Response trả <code>TYPE</code>, <code>METHOD</code>, retention <code>RUNTIME</code> và trạng thái documented.</p>
      <p><strong>Kết luận:</strong> Target và retention là siêu dữ liệu về kiểu Annotation, cho trình biên dịch và thành phần ở thời gian chạy biết Annotation được dùng ở đâu và tồn tại đến khi nào.</p>
    usage: true
RepeatableAnnotationController:
  repeatable():
    execution: |-
      <p><strong>Khái niệm:</strong> Annotation lặp lại dùng Annotation chứa để biểu diễn nhiều Annotation cùng type tại một vị trí.</p>
      <p><strong>Luồng:</strong> Method <code>transfer()</code> có hai <code>@Audit</code>; endpoint so sánh <code>getAnnotation(Audit.class)</code>, tra cứu Annotation chứa và <code>getAnnotationsByType(Audit.class)</code>.</p>
      <pre><code>@Audit(action = "SECURITY")
      @Audit(action = "COMPLIANCE", level = 2)
      void transfer() {}</code></pre>
      <p><strong>Quan sát:</strong> Tra cứu một <code>Audit</code> không trả tùy ý một giá trị lặp; Annotation chứa tồn tại, còn tra cứu theo type trả đủ hai Annotation theo thứ tự khai báo.</p>
      <p><strong>Kết luận:</strong> Thành phần đọc Annotation lặp lại nên dùng API <code>*AnnotationsByType</code> khi cần các giá trị Annotation logic thay vì tự xử lý Annotation chứa.</p>
    usage: true
