AnnotationInspectionController:
  description: |-
    <h2>Vòng đời Annotation và kiểm tra tại thời gian chạy</h2>
    <p>Quan sát Annotation nào thực sự còn nhìn thấy được bằng Reflection khi cùng một class được gắn siêu dữ liệu với các chính sách SOURCE, CLASS và RUNTIME.</p>
  readmeRelated:
    file: 4.Retention/Retention.md
BuiltInAnnotationController:
  description: |-
    <h2>Các Annotation có sẵn và quy tắc của trình biên dịch</h2>
    <p>Dùng các khai báo hợp lệ đã biên dịch với <code>@Override</code> và <code>@FunctionalInterface</code> để nối Annotation với quy tắc được trình biên dịch kiểm tra, thay vì giả lập lỗi biên dịch ở thời gian chạy.</p>
  readmeRelated:
    file: 2.BuiltIn/BuiltIn.md
InheritedAnnotationController:
  description: |-
    <h2>Ranh giới của @Inherited</h2>
    <p>So sánh kế thừa qua superclass, việc implements interface và method ghi đè để thấy <code>@Inherited</code> chỉ ảnh hưởng tra cứu Annotation ở cấp class qua chuỗi superclass.</p>
  readmeRelated:
    file: 7.RepeatableInherited/RepeatableInherited.md
MetaAnnotationController:
  description: |-
    <h2>Kiểm tra Meta-Annotation</h2>
    <p>Đọc <code>@Target</code>, <code>@Retention</code> và <code>@Documented</code> trên một kiểu Annotation tùy chỉnh để quan sát cách kiểu Annotation tự mô tả quy tắc của chính nó.</p>
  readmeRelated:
    file: 6.MetaAnnotation/MetaAnnotation.md
RepeatableAnnotationController:
  description: |-
    <h2>Tra cứu Annotation lặp lại</h2>
    <p>Quan sát cách Annotation chứa biểu diễn nhiều giá trị và sự khác nhau giữa tra cứu một Annotation với <code>getAnnotationsByType()</code>.</p>
  readmeRelated:
    file: 7.RepeatableInherited/RepeatableInherited.md
