  - question: >-
      How does TYPE_USE differ from TYPE_PARAMETER, and why should a runtime consumer of a type annotation not rely only on getAnnotation() on the declaration?
    answer: >-
      TYPE_PARAMETER describes the declaration of a type parameter such as T, while TYPE_USE describes an occurrence of a type such as String inside List<String>, a return type, or a cast. With RUNTIME retention, type annotations are commonly represented through AnnotatedType and its subtypes. Declaration lookup and type-use lookup are separate semantic channels, so the consumer needs the matching model.
