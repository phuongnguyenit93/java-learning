  - question: >-
      Why does @Repeatable still require a container annotation instead of letting the compiler store multiple instances in an arbitrary form?
    answer: >-
      @Repeatable provides convenient repeated syntax while relying on a defined container contract for representation and lookup. The container needs value() returning an array of the repeated annotation and must be compatible in retention, target, and contracts such as @Documented or @Inherited when relevant. This gives compilers and reflection deterministic rules instead of an ad hoc repeated format.
