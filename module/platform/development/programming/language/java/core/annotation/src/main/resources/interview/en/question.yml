  - question: >-
      When you declare a custom annotation with @interface, are you defining behavior or a schema, and how should that affect the design process?
    answer: >-
      @interface defines a metadata schema: element names, types, and defaults; it does not execute behavior. Annotation elements have specialized constraints such as no parameters, type parameters, or throws clause, and their return types must be valid annotation-element types. Because the consumer determines compile-time or runtime meaning, design should start from what that consumer needs to know rather than from annotation syntax.
    aiGenerated: true
    reviewed: false
