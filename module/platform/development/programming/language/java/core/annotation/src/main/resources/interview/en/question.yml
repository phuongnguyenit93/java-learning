  - question: >-
      Why should @Target restrict an annotation to the smallest meaningful set of contexts, and is adding another target later an API change?
    answer: >-
      Target is part of the public contract: the compiler uses it to reject meaningless usage, and consumers use it to know which contexts they must support. Adding FIELD, TYPE, or RECORD_COMPONENT expands the surface whose semantics the consumer must define, so it is a design change rather than just looser syntax. Record components also have specific propagation rules, so an annotation should not be assumed to copy automatically to every related field, accessor, or constructor parameter.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.Target/Target.md"
      anchor: "target-design"
