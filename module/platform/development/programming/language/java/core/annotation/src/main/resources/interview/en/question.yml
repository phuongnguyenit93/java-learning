  - question: >-
      How are two occurrences of a repeatable annotation represented and ordered, and why is the container not an implementation detail consumers can always ignore?
    answer: >-
      Java uses the containing annotation named by @Repeatable to represent the repeated values, preserving source order through the container representation. Raw reflection APIs and by-type APIs have different semantics around that container, so consumers need to understand it. Mixing an explicit container with repeated annotations at the same context can also create invalid or confusing combinations.
