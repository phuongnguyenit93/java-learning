  - question: >-
      Why can changing an annotation element's default affect code that was compiled earlier even when the annotation usage itself did not change?
    answer: >-
      The default belongs to the annotation type; it is not copied as an explicit value into every usage that omits the element. When the annotation is read, the annotation type's current default can be applied, so changing it may change the value observed from an older class. Defaults are therefore part of the compatibility contract; for an “absent” state, prefer a meaningful sentinel instead of null or an ambiguous magic value.
    aiGenerated: true
    reviewed: false
