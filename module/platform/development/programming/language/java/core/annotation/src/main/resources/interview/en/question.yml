  - question: >-
      Why is @FunctionalInterface useful even though an interface can still be a lambda target without it?
    answer: >-
      Functional-interface semantics come from Java's type rules: the interface must have a valid function descriptor, not from @FunctionalInterface itself. The annotation asks the compiler to preserve that invariant as the API evolves, so accidentally adding an incompatible abstract method fails early. Default, static, and private interface methods do not by themselves break the contract, and Object-equivalent abstract declarations follow special SAM rules.
    aiGenerated: true
    reviewed: false
