questions:
  - question: >-
      What kind of problem do annotations solve, and why does an annotation not create behavior by itself?
    answer: >-
      An annotation attaches structured metadata to code so a compiler, tool, processor, framework, or runtime component can read it. It is useful when code needs a local, typed description of a contract or characteristic instead of comments, naming conventions, or manual registration. Behavior appears only when a consumer interprets that metadata and decides to warn, validate, generate, register, or execute something.
    aiGenerated: true
    reviewed: false
    readmeRelated:
