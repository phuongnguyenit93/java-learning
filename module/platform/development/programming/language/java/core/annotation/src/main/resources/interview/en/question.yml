  - question: >-
      Why should a consumer of a repeatable annotation prefer getAnnotationsByType() over getAnnotation(), and what changes when one annotation becomes two?
    answer: >-
      getAnnotation(T) uses single-annotation semantics and does not unwrap the repeatable container. With one directly present annotation it may return T, but after a second occurrence is added the metadata can be represented through the container and the same lookup no longer returns what the old code expected. getAnnotationsByType(T) understands directly/indirectly present semantics, unwraps the container, and is the more stable contract for repeatable annotations.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.RepeatableInherited/RepeatableInherited.md"
      anchor: "get-annotations-by-type"
