  - question: >-
      What does @Inherited actually inherit, and why is it misleading to say that annotations generally follow an inheritance hierarchy?
    answer: >-
      @Inherited affects certain runtime lookups of class declarations through the superclass chain when the annotation type has suitable retention. It does not move an interface annotation to an implementing class, copy a method annotation to an overriding method, or apply to fields and constructors. With repeatable plus inherited annotations, by-type lookup is also rule-based fallback rather than an automatic merge of every superclass value.
    aiGenerated: true
    reviewed: false
    readmeRelated:
