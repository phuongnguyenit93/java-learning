      methodSignature: ""

  - question: >-
      How does a processor's Element/TypeMirror model differ from runtime reflection with Class<?>, and what coordination meaning does process()'s return value have?
    answer: >-
      An annotation processor works on the compiler model: Element represents declarations, TypeMirror represents compile-time types, and AnnotationMirror represents annotations; it should not assume application classes are already loaded as Class<?>. Returning true from process() claims the annotation types for that invocation and can prevent later processors from handling the same set; false leaves them available. Claiming is therefore a coordination contract, not default boilerplate.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.AnnotationProcessing/AnnotationProcessing.md"
      anchor: "processor-contract"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Is writing a class that extends AbstractProcessor enough for javac to run it, and what separate contracts do supported annotation types, source version, and options express?
    answer: >-
      No. The processor must be compiled first, placed on the processor path or build configuration, and discovered through service registration, module provides, or explicit compiler/build-tool configuration. Supported annotation types describe which annotations it handles; supported source version describes the language level it understands; supported options declare build-level inputs such as -Akey=value. These do not change the project's source compatibility or replace per-declaration annotation elements.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.AnnotationProcessing/AnnotationProcessing.md"
      anchor: "supported-types-source-version"
    apiRelated:
