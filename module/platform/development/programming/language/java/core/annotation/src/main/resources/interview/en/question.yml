  - question: >-
      How would you decide whether a requirement should become an annotation or runtime configuration?
    answer: >-
      Identify the consumer, what the metadata describes, where it is valid, and how long it must survive. An annotation fits small, declarative, relatively stable metadata that naturally belongs near code. If the data is large, environment-dependent, secret, frequently changing, or has complex override/object-graph rules, a configuration file, database, or runtime object is usually easier to evolve and operate.
    aiGenerated: true
    reviewed: false
