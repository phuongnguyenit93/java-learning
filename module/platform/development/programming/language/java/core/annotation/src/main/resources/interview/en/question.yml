  - question: >-
      Why does annotation processing use multiple rounds, and how should that change a processor compared with a “scan once and finish” design?
    answer: >-
      A processor can generate new source or class files, and those outputs become inputs to later rounds; processingOver() eventually marks the final round. The same processor may therefore be invoked repeatedly, even with an empty annotation set, so it must tolerate repeated calls and avoid declaring a generated type missing too early. The final round is suitable for final diagnostics or cleanup, not for generating a type that requires another processing round.
    aiGenerated: true
    reviewed: false
    readmeRelated:
