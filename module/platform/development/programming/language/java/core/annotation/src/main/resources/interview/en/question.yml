  - question: >-
      When deprecating a public API, how should @Deprecated, since/forRemoval, and the Javadoc @deprecated tag work together?
    answer: >-
      @Deprecated is the machine-readable signal used by compilers and tools; since records when deprecation began, while forRemoval signals an intent to remove the API in the future. The Javadoc @deprecated tag should explain the reason and migration path for humans. Deprecation does not remove the API automatically, and forRemoval does not promise a specific removal release.
    aiGenerated: true
    reviewed: false
