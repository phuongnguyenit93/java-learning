  - question: >-
      If an annotation type carries a custom meta-annotation, does Java automatically treat every class using that annotation as directly carrying the meta-annotation too?
    answer: >-
      No. Java Core lets metadata be attached to an annotation type, but it does not define recursive composition or transitive lookup automatically. A framework that supports stereotypes or composed annotations must explicitly traverse and interpret meta-annotations according to its own semantics. “The meta-annotation exists on the annotation type” and “the framework treats it as composed behavior” are separate claims.
