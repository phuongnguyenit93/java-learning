  - question: >-
      What mistakes does @Override protect against, and why is it wrong to say that @Override creates polymorphism or dynamic dispatch?
    answer: >-
      @Override turns the intent to override or implement a method into a compiler-checked contract, so a typo or incompatible signature fails instead of silently becoming a new method. Java overriding and dynamic dispatch exist independently of the annotation; removing @Override does not stop a valid method from overriding. The annotation is a compile-time guardrail and documentation of design intent.
    aiGenerated: true
    reviewed: false
