  - question: >-
      How does @SafeVarargs differ from @SuppressWarnings("unchecked"), and when would @SafeVarargs be a false safety claim?
    answer: >-
      @SuppressWarnings hides warnings in the annotated scope; @SafeVarargs asserts that a variable-arity constructor or method does not perform unsafe operations on its non-reifiable varargs parameter and also affects related call-site warnings. For methods it is only legal on static, final, or private instance methods. If the implementation pollutes the backing array or exposes it where an incompatible value can be stored, the annotation only hides risk rather than making the code safe.
    aiGenerated: true
    reviewed: false
    readmeRelated:
