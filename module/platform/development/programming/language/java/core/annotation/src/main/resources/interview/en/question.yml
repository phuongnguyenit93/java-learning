      controller: ""
      methodSignature: ""

  - question: >-
      Why should custom annotations not default to RUNTIME retention, and how should you choose among SOURCE, CLASS, and RUNTIME?
    answer: >-
      Choose retention from the consumer: source/compiler/static analysis usually needs SOURCE, bytecode tooling may need CLASS, and reflection/runtime frameworks need RUNTIME. Keeping metadata longer than required creates unnecessary runtime surface and can encourage accidental reflection dependencies. The design question is “who needs to read this, and at what stage?” rather than “would RUNTIME be more convenient?”.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Retention/Retention.md"
      anchor: "retention-use-case"
    apiRelated:
