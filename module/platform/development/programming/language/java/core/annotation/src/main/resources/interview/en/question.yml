  - question: >-
      Does SOURCE retention mean an annotation processor cannot read that annotation? Explain using the compile-time lifecycle.
    answer: >-
      No. SOURCE means the metadata is not retained in class-file output; annotation processors run during compilation and inspect the source/language model before that metadata is discarded. SOURCE is therefore a strong fit for build-time validation or generation. Runtime reflection is the consumer that cannot see a SOURCE annotation after compilation.
    aiGenerated: true
    reviewed: false
    readmeRelated:
