  - question: >-
      When a processor generates code with Filer, what rules keep the output deterministic and safe across processing rounds?
    answer: >-
      A processor should create new artifacts through Filer, avoid creating the same file more than once, never overwrite user source, and avoid timestamps, randomness, or unstable iteration order when they have no semantic meaning. The same source and options should produce the same output, generated types may appear only in later rounds, and diagnostics should go through Messager. Supplying an appropriate originating element can also help build tools understand dependencies.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.AnnotationProcessing/AnnotationProcessing.md"
      anchor: "processor-pitfalls"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      When should annotation processing be used instead of runtime reflection, and why does a Class-valued annotation element not mean a processor should load Class<?>?
    answer: >-
      Processing fits compile-time validation or generation and can read SOURCE metadata through Element and TypeMirror; reflection fits runtime inspection of loaded Class, Method, and Field objects with metadata retained to runtime. For Class-valued elements, processors should prefer AnnotationMirror/TypeMirror because the type may exist only in the compiler model; proxy-style access can lead to MirroredTypeException or MirroredTypesException. An annotation does not need RUNTIME retention merely because a processor consumes it.
    aiGenerated: true
    reviewed: false
