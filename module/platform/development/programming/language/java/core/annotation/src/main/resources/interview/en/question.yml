  - question: >-
      How do declaration annotations and TYPE_USE annotations differ semantically, and why must a consumer distinguish them?
    answer: >-
      A declaration annotation describes a declaration such as a class, method, field, or parameter; a TYPE_USE annotation describes a use of a type such as a generic argument, return type, cast, or array component. They have different models and lookup paths, so annotations written near similar syntax do not necessarily belong to the same semantic channel. At runtime, type-use metadata is commonly exposed through AnnotatedType rather than only declaration-annotation APIs.
    aiGenerated: true
    reviewed: false
