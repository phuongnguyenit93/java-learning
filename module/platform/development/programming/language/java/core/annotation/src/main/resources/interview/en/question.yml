      methodSignature: ""

  - question: >-
      Why can annotation elements not contain arbitrary objects, null, or dynamic structures like a normal configuration object?
    answer: >-
      Annotation metadata needs a stable representation in the source and class-file models, so Java restricts element types to primitives, String, Class, enums, annotations, and one-dimensional arrays of valid element types. Values must fit the compile-time annotation contract; null and arbitrary object graphs do not. Large, dynamic, environment-dependent data usually belongs in objects, configuration, or a database instead.
    aiGenerated: true
    reviewed: false
