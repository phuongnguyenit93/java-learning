  - id: annotation-use-sites
    question: "Điểm khác nhau cốt lõi giữa declaration annotation và TYPE_USE annotation là gì?"
    answers:
      - {id: A, answer: "Declaration annotation luôn có SOURCE retention còn TYPE_USE luôn có RUNTIME retention.", explanation: "Sai. Retention và target là hai dimension độc lập."}
