  - id: override-annotation
    question: "Giá trị chính của @Override là gì?"
    answers:
      - {id: A, answer: "Nó biến method thành virtual để polymorphism hoạt động.", explanation: "Sai. Overriding semantics của Java tồn tại độc lập với annotation."}
      - {id: B, answer: "Nó yêu cầu compiler xác nhận declaration thực sự override hoặc implement theo contract mà Java cho phép.", explanation: "Đúng. Vì vậy typo hoặc signature sai có thể trở thành compile-time error."}
      - {id: C, answer: "Nó tự sao chép implementation từ superclass vào subclass.", explanation: "Sai. @Override không sao chép code."}
      - {id: D, answer: "Nó chỉ có tác dụng với method của abstract class.", explanation: "Sai. Annotation còn dùng khi implement interface method và các trường hợp Java cho phép khác."}
