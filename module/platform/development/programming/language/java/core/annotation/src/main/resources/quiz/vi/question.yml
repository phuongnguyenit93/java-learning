      - {id: D, answer: "Hiểu nguyên nhân trước, sửa code nếu có thể và chỉ suppress ở phạm vi nhỏ nhất khi contract thật sự cho phép.", explanation: "Đúng. Suppression là quyết định chấp nhận warning có chủ đích, không phải cơ chế sửa lỗi."}
