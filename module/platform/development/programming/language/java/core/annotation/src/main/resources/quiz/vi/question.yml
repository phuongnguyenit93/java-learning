questions:
  - id: annotation-model
    question: "Phát biểu nào mô tả đúng nhất vai trò của annotation trong Java?"
    answers:
      - {id: A, answer: "Annotation tự thực thi business logic ngay khi JVM load class.", explanation: "Sai. Annotation chỉ mang metadata; behavior chỉ xuất hiện khi compiler, tool, framework hoặc code khác đọc và xử lý metadata đó."}
      - {id: B, answer: "Annotation chỉ là comment có cú pháp đặc biệt nên chương trình không thể đọc.", explanation: "Sai. Annotation là metadata có cấu trúc mà consumer có thể đọc theo contract của Java hoặc framework."}
      - {id: C, answer: "Annotation mô tả code bằng metadata có cấu trúc; consumer mới là thành phần kiểm tra, sinh code hoặc tạo behavior từ metadata đó.", explanation: "Đúng. Mental model cốt lõi là annotation mô tả, còn consumer quyết định hành động."}
      - {id: D, answer: "Annotation chỉ có ý nghĩa khi retention là RUNTIME.", explanation: "Sai. Compiler và annotation processor vẫn có thể dùng annotation ở compile time, kể cả khi metadata không tồn tại đến runtime."}
    correctAnswerId: C
