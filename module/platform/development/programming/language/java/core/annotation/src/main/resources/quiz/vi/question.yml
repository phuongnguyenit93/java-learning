  - id: safevarargs
    question: "Vì sao @SafeVarargs chỉ hợp lệ trên constructor variable-arity hoặc method variable-arity là static, final hay private?"
    answers:
      - {id: A, answer: "Để lời khẳng định an toàn không thể bị một overriding implementation phá vỡ.", explanation: "Đúng. Annotation là lời khẳng định của programmer về cách xử lý generic varargs và cần contract implementation ổn định."}
      - {id: B, answer: "Vì Java cấm generic varargs trên mọi instance method khác.", explanation: "Sai. Generic varargs có thể tồn tại, nhưng @SafeVarargs có điều kiện áp dụng riêng."}
      - {id: C, answer: "Vì annotation tự chuyển varargs thành immutable List.", explanation: "Sai. @SafeVarargs không thay đổi runtime representation của varargs."}
      - {id: D, answer: "Vì static/final/private method luôn type-safe dù implementation làm gì.", explanation: "Sai. Implementation vẫn có thể gây heap pollution; annotation chỉ nên dùng khi code thực sự an toàn."}
