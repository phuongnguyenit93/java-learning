      - {id: B, answer: "Class<? extends Runnable> handler();", explanation: "Đúng. Class và parameterized use của Class thuộc nhóm element type hợp lệ."}
      - {id: C, answer: "Object policy();", explanation: "Sai. Arbitrary domain/object type không thể làm annotation element type."}
      - {id: D, answer: "String[][] matrix();", explanation: "Sai. Annotation chỉ cho phép array một chiều của một element type hợp lệ; nested array không hợp lệ."}
