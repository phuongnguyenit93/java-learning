      - {id: B, answer: "Bất kỳ khi nào annotation chỉ có một element, dù element mang tên gì.", explanation: "Sai. Shorthand đặc biệt gắn với element có tên value."}
      - {id: C, answer: "Chỉ khi value có kiểu String.", explanation: "Sai. Quy tắc shorthand không bị giới hạn riêng cho String."}
      - {id: D, answer: "Chỉ khi annotation là marker annotation.", explanation: "Sai. Marker annotation không có element để truyền giá trị."}
