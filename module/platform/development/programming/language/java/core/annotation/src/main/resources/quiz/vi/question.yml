  - id: deprecated-annotation
    question: "Ý nghĩa đúng của @Deprecated(forRemoval = true) là gì?"
    answers:
      - {id: A, answer: "API bị JVM chặn không cho gọi ngay.", explanation: "Sai. Deprecated API vẫn có thể được gọi; compiler/tool thường phát warning."}
      - {id: B, answer: "API chắc chắn bị xóa ở phiên bản kế tiếp.", explanation: "Sai. forRemoval biểu thị ý định loại bỏ trong tương lai chứ không ấn định phiên bản cụ thể."}
      - {id: C, answer: "API được đánh dấu là candidate cho việc loại bỏ trong tương lai; since có thể ghi phiên bản bắt đầu deprecate.", explanation: "Đúng. Hai element này giúp công cụ và người dùng hiểu lifecycle của API."}
      - {id: D, answer: "Javadoc @deprecated trở nên không cần thiết vì annotation đã chứa migration guide.", explanation: "Sai. Annotation machine-readable và Javadoc tag phục vụ mục đích bổ sung nhau."}
