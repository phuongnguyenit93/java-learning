    answers:
      - {id: A, answer: "Suppress toàn bộ module để mọi build luôn sạch warning.", explanation: "Sai. Cách này dễ che warning mới và không liên quan."}
      - {id: B, answer: "Suppress warning trước khi tìm nguyên nhân vì warning không ảnh hưởng type safety.", explanation: "Sai. Suppression không làm thao tác vốn nguy hiểm trở nên an toàn."}
