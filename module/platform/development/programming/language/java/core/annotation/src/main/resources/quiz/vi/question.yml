      - {id: D, answer: "Giá trị quan sát được có thể thay đổi theo default hiện tại của annotation type, nên default là một phần compatibility contract.", explanation: "Đúng. Đây là khác biệt quan trọng so với việc explicit value đã được ghi trực tiếp trong usage."}
