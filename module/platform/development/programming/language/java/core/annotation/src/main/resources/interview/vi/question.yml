  - question: >-
      Một repeatable annotation được viết hai lần trong source được biểu diễn và giữ thứ tự thế nào, và vì sao container không phải chi tiết có thể bỏ qua hoàn toàn?
    answer: >-
      Java dùng containing annotation theo contract @Repeatable để biểu diễn tập các annotation lặp; các value giữ source order theo representation của container. API reflection raw và API by-type có semantics khác nhau đối với container, nên consumer cần hiểu representation này. Trộn explicit container với repeated annotations ở cùng context còn có thể tạo combination không hợp lệ hoặc khó dự đoán.
    aiGenerated: true
