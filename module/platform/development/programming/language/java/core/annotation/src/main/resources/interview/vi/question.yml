  - question: >-
      Vì sao thay đổi default value của một annotation element có thể ảnh hưởng code đã compile trước đó dù annotation usage không đổi?
    answer: >-
      Default thuộc annotation type, không được copy thành value explicit vào từng usage thiếu element đó. Khi annotation được đọc, default hiện tại của annotation type có thể được áp dụng, nên đổi default có thể thay đổi giá trị quan sát được từ class cũ. Vì vậy default là một phần của compatibility contract; với trạng thái “không có giá trị”, nên dùng sentinel có nghĩa rõ thay vì null hoặc magic value mơ hồ.
