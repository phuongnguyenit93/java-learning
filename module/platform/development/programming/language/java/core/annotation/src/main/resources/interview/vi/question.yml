questions:
  - question: >-
      Annotation giải quyết loại bài toán nào, và vì sao bản thân một annotation không tự tạo ra behavior?
    answer: >-
      Annotation gắn metadata có cấu trúc vào code để compiler, tool, processor, framework hoặc code runtime đọc. Nó phù hợp khi cần mô tả đặc điểm hay contract của program element mà không nhét logic đó vào tên, comment hoặc đăng ký thủ công. Behavior chỉ xuất hiện khi một consumer đọc metadata và quyết định cảnh báo, validate, generate, register hoặc thực thi điều gì đó.
    aiGenerated: true
