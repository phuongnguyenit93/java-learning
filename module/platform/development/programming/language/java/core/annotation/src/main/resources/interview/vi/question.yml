  - question: >-
      Declaration annotation và TYPE_USE annotation khác nhau về ý nghĩa thế nào, và vì sao consumer phải phân biệt chúng?
    answer: >-
      Declaration annotation mô tả declaration như class, method, field hoặc parameter; TYPE_USE mô tả một lần sử dụng của type như generic argument, return type, cast hay array component. Hai loại metadata có lookup/model khác nhau, nên consumer không thể giả định annotation đặt gần cùng một đoạn cú pháp luôn thuộc cùng một semantic channel. Với runtime reflection, type-use metadata thường đi qua AnnotatedType thay vì chỉ các API declaration annotation.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.Target/Target.md"
      anchor: "annotation-use-sites"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      TYPE_USE khác TYPE_PARAMETER ra sao, và vì sao một runtime consumer của type annotation không nên chỉ gọi getAnnotation() trên declaration?
    answer: >-
      TYPE_PARAMETER mô tả declaration của type parameter như T, còn TYPE_USE mô tả một occurrence của type như String trong List<String>, return type hoặc cast. Với RUNTIME retention, type annotation thường được biểu diễn qua AnnotatedType và các subtype của nó. Declaration lookup và type-use lookup là hai semantic channel khác nhau nên consumer phải dùng model phù hợp.
    aiGenerated: true
    reviewed: false
    readmeRelated:
