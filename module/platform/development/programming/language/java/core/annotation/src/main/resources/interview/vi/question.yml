  - question: >-
      Một yêu cầu có đặc điểm nào thì Annotation là lựa chọn phù hợp, và tín hiệu nào cho thấy nên dùng cơ chế khác?
    answer: >-
      Annotation phù hợp khi thông tin nhỏ, mang tính khai báo, tương đối ổn định, gắn tự nhiên với class/method/field/type và có thành phần đọc rõ ràng. Nếu dữ liệu thay đổi thường xuyên, phụ thuộc môi trường, chứa secret, mô tả object graph động hoặc thực chất là behavioral contract mà compiler nên kiểm tra, cấu hình, object, database, API hay interface thường rõ hơn. Câu hỏi cốt lõi không phải “có thể dùng Annotation không?” mà là “Annotation có làm contract dễ hiểu hơn không?”.
