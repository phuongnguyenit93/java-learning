  - question: >-
      Tại sao @Target nên giới hạn annotation vào tập context nhỏ nhất có ý nghĩa, và việc mở thêm target sau này có phải thay đổi API không?
    answer: >-
      Target là một phần public contract: compiler dùng nó để chặn usage vô nghĩa và consumer dựa vào nó để biết cần xử lý context nào. Thêm FIELD, TYPE hay RECORD_COMPONENT mở rộng surface mà consumer phải định nghĩa semantics, nên đó là một thay đổi thiết kế chứ không chỉ nới cú pháp. Với record component còn có rule propagation riêng; không nên giả định một annotation tự được copy sang mọi field/accessor/constructor parameter liên quan.
    aiGenerated: true
    reviewed: false
    readmeRelated:
