  - question: >-
      Ở cấp Meta-Annotation, @Repeatable(Audits.class) đang khai báo điều gì, và phần nào chưa nên suy ra chỉ từ khai báo này?
    answer: >-
      @Repeatable(Audits.class) thiết lập quan hệ giữa kiểu Annotation lặp lại @Audit và Annotation chứa Audits để Java có một representation xác định cho nhiều giá trị. Từ khai báo này chưa nên suy ra rằng getAnnotation() sẽ tự mở container, rằng metadata được kế thừa, hay rằng retention/target tự được chọn. Các ràng buộc tương thích của container và lookup semantics thuộc bước mechanics tiếp theo ở chapter Repeatable/Inherited.
