  - question: >-
      Vì sao annotation processing có nhiều round, và processor phải thay đổi cách suy nghĩ thế nào so với mô hình “scan một lần rồi xong”?
    answer: >-
      Processor có thể sinh source/class mới, và output đó trở thành input cho round sau; cuối cùng processingOver() báo final round. Vì cùng processor có thể được gọi nhiều lần, kể cả với tập annotation rỗng, implementation phải chịu được repeated invocation và không kết luận thiếu generated type quá sớm. Final round phù hợp cho final diagnostics/cleanup, không phải để sinh type rồi mong có thêm round xử lý tiếp.
    aiGenerated: true
    reviewed: false
