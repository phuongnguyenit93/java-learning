  - question: >-
      Vì sao @FunctionalInterface hữu ích dù một interface không cần annotation này vẫn có thể làm target cho lambda?
    answer: >-
      Functional-interface semantics đến từ Java type rules: interface phải có một function descriptor phù hợp, không phải từ @FunctionalInterface. Annotation yêu cầu compiler giữ invariant đó khi API tiến hóa, nên việc vô tình thêm abstract method không tương thích sẽ fail sớm. Default, static và private interface methods không tự phá contract; các Object-equivalent abstract declarations cũng có rule riêng khi xác định SAM.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.BuiltIn/BuiltIn.md"
      anchor: "functionalinterface"
