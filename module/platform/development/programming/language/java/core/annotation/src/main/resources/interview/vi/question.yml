  - question: >-
      @Override bảo vệ developer khỏi lỗi gì, và tại sao nói nó không tạo ra polymorphism hay dynamic dispatch?
    answer: >-
      @Override biến ý định override/implement thành contract mà compiler kiểm tra, nên typo hoặc signature sai sẽ fail thay vì vô tình tạo method mới. Cơ chế overriding và dynamic dispatch của Java tồn tại độc lập với annotation; bỏ @Override không làm method hợp lệ ngừng override. Giá trị của annotation là guardrail compile-time và documentation cho ý định thiết kế.
    aiGenerated: true
    reviewed: false
    readmeRelated:
