  - question: >-
      @SafeVarargs khác @SuppressWarnings("unchecked") ở contract nào, và khi nào gắn @SafeVarargs lại là một lời khẳng định sai?
    answer: >-
      @SuppressWarnings chỉ che warning trong phạm vi được annotate; @SafeVarargs khẳng định implementation của variable-arity constructor/method không thực hiện thao tác unsafe trên non-reifiable varargs và còn ảnh hưởng warning ở call site. Với method, annotation chỉ hợp lệ khi static, final hoặc private instance method. Nếu implementation làm backing array bị heap pollution hoặc để array thoát ra nơi có thể bị ghi sai type, annotation chỉ đang che rủi ro chứ không tạo safety.
    aiGenerated: true
