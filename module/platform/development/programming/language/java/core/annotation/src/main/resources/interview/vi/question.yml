  - question: >-
      Khi deprecate một public API, @Deprecated, since/forRemoval và Javadoc @deprecated nên phối hợp với nhau như thế nào?
    answer: >-
      @Deprecated là machine-readable signal để compiler/tool cảnh báo; since cho biết từ phiên bản nào API bị deprecate và forRemoval cho biết có dự kiến loại bỏ hay không. Javadoc @deprecated nên giải thích lý do và migration path cho con người. Deprecation không tự xóa API và forRemoval cũng không cam kết một phiên bản loại bỏ cụ thể.
    aiGenerated: true
