  - question: >-
      Processor làm việc với Element/TypeMirror khác runtime reflection với Class<?> như thế nào, và return value của process() có ý nghĩa phối hợp gì?
    answer: >-
      Annotation processor làm việc trên compiler model: Element mô tả declaration, TypeMirror mô tả compile-time type và AnnotationMirror mô tả annotation; nó không nên giả định application class đã được load thành Class<?>. process() trả true nghĩa processor claim các annotation type của invocation đó, có thể ngăn processor sau xử lý cùng tập; false để chúng tiếp tục được offer. Vì vậy return true phải là quyết định contract, không phải boilerplate mặc định.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.AnnotationProcessing/AnnotationProcessing.md"
      anchor: "processor-contract"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Chỉ viết một class extends AbstractProcessor có đủ để javac chạy processor không, và supported annotation types/source version/options giải quyết các contract khác nhau nào?
    answer: >-
      Không. Processor phải được compile trước, có trên processor path/build configuration và được discover qua service registration, module provides hoặc cấu hình explicit. Supported annotation types nói processor quan tâm annotation nào; supported source version nói language level mà processor hiểu; supported options công bố build-level inputs như -Akey=value. Các contract này không thay đổi source compatibility của project và cũng không thay annotation element gắn trên declaration.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.AnnotationProcessing/AnnotationProcessing.md"
      anchor: "supported-types-source-version"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Khi nào nên dùng annotation processing thay vì runtime reflection, và vì sao annotation có Class-valued element không đồng nghĩa processor nên load Class<?>?
    answer: >-
      Processing phù hợp cho validation/generation ở compile time và có thể đọc SOURCE metadata trên Element/TypeMirror; reflection phù hợp khi application đang chạy và cần inspect loaded Class/Method/Field với metadata còn ở runtime. Với Class-valued element, processor nên ưu tiên AnnotationMirror/TypeMirror vì type có thể chỉ tồn tại trong compiler model; proxy-style access có thể dẫn tới MirroredTypeException/MirroredTypesException. Không cần nâng retention lên RUNTIME chỉ vì processor cần đọc annotation.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.AnnotationProcessing/AnnotationProcessing.md"
      anchor: "processing-vs-reflection"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Khi processor sinh code bằng Filer, những nguyên tắc nào giúp output deterministic và an toàn qua nhiều round?
    answer: >-
      Processor nên tạo artifact mới qua Filer, tránh tạo cùng file nhiều lần, không overwrite source người dùng và không phụ thuộc timestamp/random/unordered iteration nếu chúng không mang semantic. Cùng source và options nên tạo cùng output, generated type có thể chỉ xuất hiện ở round sau, và diagnostics nên đi qua Messager. Với originating element phù hợp, truyền nó cho Filer cũng giúp build tool hiểu dependency tốt hơn.
