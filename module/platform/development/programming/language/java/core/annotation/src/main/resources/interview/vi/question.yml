  - question: >-
      Vì sao annotation element không được chứa object tùy ý, null hoặc cấu trúc dữ liệu động như một configuration object thông thường?
    answer: >-
      Annotation metadata phải có biểu diễn ổn định trong source/class-file model nên Java giới hạn element vào primitive, String, Class, enum, annotation và mảng một chiều của các loại hợp lệ đó. Giá trị cũng phải phù hợp với contract compile-time của annotation; null và object graph tùy ý không có chỗ trong mô hình này. Nếu dữ liệu lớn, động hoặc phụ thuộc runtime, object/config/database thường là abstraction phù hợp hơn.
