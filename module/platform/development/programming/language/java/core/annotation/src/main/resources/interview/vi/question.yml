  - question: >-
      Vì sao consumer của repeatable annotation nên ưu tiên getAnnotationsByType() thay vì getAnnotation(), và điều gì xảy ra khi từ một annotation chuyển thành hai?
    answer: >-
      getAnnotation(T) dùng single-annotation semantics và không unwrap repeatable container. Khi chỉ có một annotation trực tiếp nó có thể trả về T, nhưng sau khi thêm instance thứ hai metadata có thể nằm trong container nên cùng code lookup không còn thấy T như trước. getAnnotationsByType(T) hiểu directly/indirectly present semantics, unwrap container và là contract bền hơn cho repeatable annotation.
    aiGenerated: true
    reviewed: false
    readmeRelated:
