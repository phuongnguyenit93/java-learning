  - question: >-
      SOURCE retention có nghĩa annotation processor không đọc được annotation đó hay không? Hãy giải thích theo lifecycle compile-time.
    answer: >-
      Không. SOURCE chỉ nói metadata không được giữ trong class-file output; annotation processor chạy trong compilation và làm việc với source/language model trước khi metadata bị loại bỏ. Vì vậy SOURCE thường rất phù hợp cho validation hoặc code generation chỉ cần ở build time. Runtime reflection mới là consumer không thể thấy SOURCE annotation sau compilation.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Retention/Retention.md"
      anchor: "retention-source"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Vì sao không nên mặc định chọn RUNTIME cho mọi custom annotation, và cách chọn SOURCE, CLASS hay RUNTIME hợp lý là gì?
    answer: >-
      Retention nên đi từ consumer: source/compiler/static analysis thường chỉ cần SOURCE; bytecode tooling có thể cần CLASS; reflection/runtime framework cần RUNTIME. Chọn lifetime dài hơn nhu cầu làm metadata trở thành runtime surface không cần thiết và dễ khiến thiết kế phụ thuộc reflection. Câu hỏi đúng là “ai cần đọc nó ở giai đoạn nào?” chứ không phải “RUNTIME có tiện hơn không?”.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Retention/Retention.md"
      anchor: "retention-use-case"
    apiRelated:
