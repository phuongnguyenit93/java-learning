      methodSignature: ""

  - question: >-
      Khi khai báo một custom annotation bằng @interface, bạn đang định nghĩa behavior hay định nghĩa schema, và điều đó ảnh hưởng cách thiết kế thế nào?
    answer: >-
      @interface định nghĩa schema metadata: tên element, type và default; nó không tự thực thi behavior. Element có contract chuyên biệt như không có parameter/type parameter/throws và return type phải là annotation-element type hợp lệ. Vì consumer mới quyết định ý nghĩa runtime hoặc compile-time, thiết kế nên bắt đầu từ consumer cần dữ liệu gì thay vì bắt đầu từ cú pháp.
