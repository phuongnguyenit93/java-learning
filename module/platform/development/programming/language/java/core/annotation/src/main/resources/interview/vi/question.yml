  - question: >-
      @Inherited thực sự kế thừa điều gì, và vì sao nó không tương đương với “annotation đi theo inheritance hierarchy” nói chung?
    answer: >-
      @Inherited chỉ ảnh hưởng một số runtime lookup trên class declaration qua superclass chain, với annotation type có retention phù hợp. Nó không truyền annotation từ interface sang implementing class, không làm method annotation đi theo overriding method, và không áp dụng cho field hay constructor. Với repeatable + inherited, by-type lookup còn là fallback theo rule chứ không mặc định merge tất cả annotation từ mọi superclass.
    aiGenerated: true
    reviewed: false
    readmeRelated:
