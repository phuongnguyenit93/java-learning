  - question: >-
      Nếu một annotation type được gắn custom meta-annotation, Java có tự xem mọi class dùng annotation đó là trực tiếp mang meta-annotation không?
    answer: >-
      Không. Java Core cho phép metadata được gắn lên annotation type, nhưng không tự định nghĩa recursive composition hay transitive lookup. Framework muốn hỗ trợ stereotype/composed annotation phải chủ động traverse và diễn giải meta-annotation theo semantics của riêng nó. Vì vậy cần tách “meta-annotation tồn tại trên annotation type” khỏi “framework coi nó như composed behavior”.
    aiGenerated: true
    reviewed: false
