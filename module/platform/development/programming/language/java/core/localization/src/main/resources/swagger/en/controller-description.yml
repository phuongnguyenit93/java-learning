LocaleController:
  description: |-
    <h2>Locale as localization context</h2>
    <p>Observe language, script, region, and default Locale categories to see that Locale selects conventions rather than representing physical location, time zone, or currency.</p>
  readmeRelated:
    file: 2.Locale/Locale.md
BundleController:
  description: |-
    <h2>ResourceBundle candidate lookup</h2>
    <p>Observe target-Locale candidates and the bundle actually selected while default-locale fallback is deliberately disabled, keeping candidate generation separate from fallback-Locale policy.</p>
  readmeRelated:
    file: 4.ResourceBundle/ResourceBundle.md
MessageController:
  description: |-
    <h2>Localized messages with MessageFormat</h2>
    <p>Combine ResourceBundle and MessageFormat so the same dynamic values enter Vietnamese and English patterns without fragment concatenation.</p>
  readmeRelated:
    file: 5.MessageFormat/MessageFormat.md
NumberLocalizationController:
  description: |-
    <h2>Locale-sensitive number formatting and parsing</h2>
    <p>Keep the numeric value unchanged while its representation varies by locale, and observe controlled parsing plus compact-number styles.</p>
  readmeRelated:
    file: 6.NumberFormatting/NumberFormatting.md
CurrencyController:
  description: |-
    <h2>Currency is separate from Locale</h2>
    <p>Separate currency identity from display locale by rendering explicit currencies under different presentation conventions.</p>
  readmeRelated:
    file: 7.Currency/Currency.md
CollationController:
  description: |-
    <h2>Collator and human-facing text order</h2>
    <p>Compare raw String ordering with a Vietnamese Collator to show that machine lexical order is not the same contract as linguistic order.</p>
  readmeRelated:
    file: 8.Collator/Collator.md
DateTimeLocalizationController:
  description: |-
    <h2>Date-Time Localization</h2>
