# <roadmap-schema>
# Cấu trúc Roadmap Module
# schema-version: 1
#
# YAML CONTRACT
# roadmap: Danh sách milestone cấp cao của roadmap cho language hiện tại.
#
# - id [string, required]: ID ổn định và duy nhất của milestone trong roadmap language hiện tại.
# - title [string, required]: Tên milestone hiển thị cho learner.
# - purpose [string, required]: Milestone này tồn tại để learner hiểu hoặc đạt được điều gì.
# - dependsOn [list, optional]: Danh sách id milestone prerequisite khi dependency không thể hiện đủ chỉ bằng thứ tự item.
# - objectives [list, optional]: Các learning objective cấp milestone; không dùng để liệt kê mọi fact/API/syntax nhỏ.
# - relatedKnowledge [list, optional]: Danh sách Knowledge category id trong chính module hiện tại hỗ trợ milestone. Portal hiển thị danh sách này ở phía đối diện milestone và click item sẽ điều hướng sang Knowledge category tương ứng.
# - relatedModules [list, optional]: Các module liên quan hiển thị ở Level 2 của Portal. Mỗi item dùng routeId bắt buộc và có thể có label/note localized; relation này chỉ để điều hướng, không tạo child milestone hoặc thay đổi learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - Topic/module này là gì?
#   - Vì sao nó tồn tại?
#   - Không có nó thì learner gặp vấn đề gì?
# FOUNDATION
#   - Learner cần prerequisite hoặc mental model nào trước?
# CORE MODEL
#   - Những abstraction hoặc building block lớn nào tạo nên chủ đề này?
# MECHANICS
#   - Nó hoạt động như thế nào ở mức language/runtime/API phù hợp với module?
# USAGE
#   - Nó được dùng như thế nào trong code thực tế?
# DECISION / TRADE-OFF
#   - Khi nào nên chọn cơ chế này thay vì cơ chế khác?
#   - Khi nào không nên dùng?
# FAILURE / PITFALL
#   - Những sai lầm, compile-time failure hoặc runtime failure nào đáng biết?
# INTEGRATION
#   - Chủ đề này kết nối với những concept/module lân cận nào?
# SYNTHESIS
#   - Sau cùng learner phải giữ mental model end-to-end nào?
#
# Mỗi language tự chịu trách nhiệm cho roadmap của chính nó. Không suy luận hoặc đồng bộ cấu trúc từ roadmap của language khác.
# Thứ tự item trong roadmap chính là thứ tự học mặc định. Chỉ dùng dependsOn khi cần biểu diễn dependency rõ hơn thứ tự tuyến tính.
# Skeleton không nên ép mọi module có đúng bấy nhiêu node. Nó là framework suy nghĩ chứ không phải template cứng.
# </roadmap-schema>

roadmap:
  - id: localization-model
    title: Mô hình tư duy về bản địa hóa
    purpose: Hiểu bản địa hóa (localization) là điều chỉnh cách hiển thị và quy ước ngôn ngữ cho người dùng mà không làm thay đổi dữ liệu hay ý nghĩa nghiệp vụ bên dưới.
    objectives:
      - Phân biệt quốc tế hóa (internationalization/i18n) với bản địa hóa (localization/l10n) và hiểu vì sao phần mềm cần tách hai bước này.
      - Tách dữ liệu nghiệp vụ khỏi cách hiển thị văn bản, số, tiền tệ và ngày giờ theo Locale.
  - id: locale-and-language-tags
    title: Locale và thẻ ngôn ngữ
    purpose: Hiểu Locale biểu diễn ngữ cảnh ngôn ngữ/khu vực nào và cách thẻ ngôn ngữ theo chuẩn BCP 47 truyền thông tin về ngôn ngữ, hệ chữ viết và khu vực giữa các hệ thống.
    objectives:
      - Tạo, đọc và so sánh định danh Locale có chủ đích.
      - Không nhầm ngôn ngữ, khu vực, hệ chữ viết và múi giờ là cùng một khái niệm.
  - id: resource-bundles-and-fallback
    title: ResourceBundle và cơ chế tìm kiếm dự phòng
    purpose: Hiểu cách Java tìm tài nguyên bản địa hóa, quy ước đặt tên gói tài nguyên, thứ tự Locale ứng viên và cơ chế dự phòng (fallback).
    objectives:
      - Tổ chức tài nguyên theo ngôn ngữ mà không lặp lại logic nghiệp vụ.
      - Dự đoán tài nguyên nào được chọn khi không tồn tại tài nguyên khớp chính xác với Locale yêu cầu.
  - id: localized-messages
    title: Thông điệp bản địa hóa có tham số
    purpose: Hiểu MessageFormat giúp đưa tham số vào thông điệp theo Locale mà không phải nối chuỗi thủ công hoặc cố định cấu trúc câu trong code.
    objectives:
      - Giữ cấu trúc thông điệp cần dịch trong tài nguyên thay vì đặt cứng trong code.
      - Xử lý quy tắc dấu nháy và định dạng tham số của MessageFormat có chủ đích.
  - id: numbers-and-currency
    title: Định dạng số và tiền tệ theo Locale
    purpose: Hiểu sự khác biệt giữa giá trị số/tiền tệ trong nghiệp vụ với cách các giá trị đó được định dạng hoặc phân tích theo Locale.
    relatedModules:
      - routeId: JAVA_NUMBERS
        label: Numbers
        note: Biểu diễn số và quy tắc làm tròn thuộc Numbers; Localization chịu trách nhiệm cách trình bày theo Locale.
    objectives:
      - Định dạng và phân tích số theo Locale mà không làm thay đổi ý nghĩa của giá trị số.
      - Tách định danh tiền tệ khỏi cách ký hiệu và số tiền được hiển thị cho người dùng.
  - id: collation-and-text-order
    title: So sánh và sắp xếp văn bản theo Locale
    purpose: Hiểu vì sao thứ tự văn bản dành cho người dùng phải tuân theo quy tắc ngôn ngữ của Locale thay vì chỉ dựa vào thứ tự Unicode hoặc thứ tự tự nhiên của String.
    relatedModules:
      - routeId: JAVA_STRING
        label: String
        note: Unicode, chuẩn hóa văn bản và ngữ nghĩa cốt lõi của String là nền tảng trước khi xử lý văn bản theo Locale.
    objectives:
      - Dùng Collator khi cần so sánh hoặc sắp xếp theo quy tắc ngôn ngữ.
      - Hiểu mức độ so sánh (strength) và chế độ phân rã ký tự (decomposition) mà không làm thay đổi nội dung String gốc.
  - id: date-time-localization
    title: Hiển thị ngày giờ theo Locale
    purpose: Hiểu Locale quyết định quy ước hiển thị ngày giờ, trong khi ZoneId và giá trị thời gian trên dòng thời gian vẫn là những khái niệm riêng.
    relatedModules:
      - routeId: JAVA_DATE_TIME
        label: Date-Time
        note: Date-Time chịu trách nhiệm ý nghĩa thời gian, múi giờ và phép tính; Localization chịu trách nhiệm quy ước trình bày theo Locale.
    objectives:
      - Định dạng ngày giờ theo quy ước của Locale mà không làm thay đổi giá trị thời gian bên dưới.
      - Giữ quyết định về múi giờ trong mô hình Date-Time thay vì gộp nó vào Locale.
  - id: text-segmentation-and-bidi
    title: Phân tách văn bản và văn bản hai chiều
    purpose: Hiểu vì sao ranh giới ký tự/từ/câu trong ngôn ngữ tự nhiên và thứ tự hiển thị có thể khác chỉ số code unit, dấu cách hoặc thứ tự lưu trữ logic.
    objectives:
      - Dùng BreakIterator khi cần xác định ranh giới ký tự, từ, câu hoặc dòng theo Locale thay vì tách văn bản một cách ngây thơ.
      - Hiểu Bidi phân tích quan hệ giữa thứ tự logic và thứ tự hiển thị trong văn bản trộn chiều trái-sang-phải và phải-sang-trái.
  - id: locale-defaults-and-synthesis
    title: Locale mặc định, cơ chế dự phòng và tổng hợp
    purpose: Kết nối Locale, tài nguyên bản địa hóa, định dạng, sắp xếp văn bản, hiển thị ngày giờ và xử lý văn bản thành một mô hình thống nhất, đồng thời tránh phụ thuộc ngầm vào Locale mặc định của hệ thống.
    objectives:
      - Đưa việc lựa chọn Locale thành quyết định rõ ràng tại ranh giới của ứng dụng.
      - Nhận biết khi cơ chế dự phòng hữu ích và khi nó che giấu tài nguyên bản địa hóa bị thiếu.
