# <roadmap-schema>
# Module Roadmap Structure
# schema-version: 1
#
# YAML CONTRACT
# roadmap: High-level learning milestones for the current language roadmap.
#
# - id [string, required]: Stable and unique milestone identity within the current language roadmap.
# - title [string, required]: Milestone title displayed to the learner.
# - purpose [string, required]: What the learner should understand or achieve from this milestone.
# - dependsOn [list, optional]: Prerequisite milestone ids when item order alone is not enough to express the dependency.
# - objectives [list, optional]: Milestone-level learning objectives; do not use this to list every small fact/API/syntax item.
# - relatedKnowledge [list, optional]: Knowledge category ids in the current module that support this milestone. Portal displays this list on the side opposite the milestone and clicking an item navigates to the matching Knowledge category.
# - relatedModules [list, optional]: Related modules displayed as Portal Level 2 cards. Each item requires routeId and may provide localized label/note; this relation is navigation only and does not create child milestones or change learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - What is this topic/module?
#   - Why does it exist?
#   - What problem exists without it?
# FOUNDATION
#   - What prerequisite or mental model must the learner have first?
# CORE MODEL
#   - What major abstractions or building blocks make up this topic?
# MECHANICS
#   - How does it work at the language/runtime/API level appropriate for this module?
# USAGE
#   - How is it used in real code?
# DECISION / TRADE-OFF
#   - When should this mechanism be chosen over another?
#   - When should it not be used?
# FAILURE / PITFALL
#   - What mistakes, compile-time failures, or runtime failures matter?
# INTEGRATION
#   - How does this topic connect to neighboring concepts/modules?
# SYNTHESIS
#   - What end-to-end mental model should the learner retain?
#
# Each language owns its own roadmap. Do not infer or synchronize its structure from another language roadmap.
# Item order in roadmap is the default learning order. Use dependsOn only when a dependency needs to be expressed beyond the linear order.
# The skeleton must not force every module to have the same number of nodes. It is a thinking framework, not a rigid template.
# </roadmap-schema>

roadmap:
  - id: localization-model
    title: Localization Mental Model
    purpose: Understand localization as adapting presentation and language conventions without changing the underlying domain meaning.
    relatedKnowledge:
      - MentalModel
    objectives:
      - Distinguish internationalization from localization and understand why software needs to separate those responsibilities.
      - Separate domain values from locale-specific text/number/date presentation.
      - Recognize the problems caused by hard-coding language and presentation rules into domain logic as an application adds locales.
  - id: locale-and-language-tags
    title: Locale and Language Tags
    purpose: Understand what Locale identifies and how BCP 47-style language tags carry language, script, region, and selected localization preferences across systems.
    relatedKnowledge:
      - Locale
      - LanguageTags
    objectives:
      - Create and compare locale identities intentionally.
      - Avoid treating language, region, script, and timezone as the same concept.
      - Understand how requested language preferences are matched against the locales an application actually supports.
      - Recognize that language tags can carry extensions used by localized services, while Locale is still distinct from time zone, currency, and domain data.
  - id: resource-bundles-and-fallback
    title: ResourceBundle and Localized Resources
    purpose: Understand how Java organizes and locates localized resources for a Locale through bundle naming conventions and candidate-locale selection.
    relatedKnowledge:
      - ResourceBundle
    objectives:
      - Organize localized resources without duplicating domain logic.
      - Understand bundle naming and the candidate-locale sequence ResourceBundle uses to locate a matching bundle.
  - id: localized-messages
    title: Parameterized Localized Messages
    purpose: Understand MessageFormat as a locale-aware way to compose parameterized messages without manual concatenation.
    relatedKnowledge:
      - MessageFormat
    objectives:
      - Keep translatable message structure in resources rather than code.
      - Handle quoting and argument formatting intentionally.
  - id: numbers-and-currency
    title: Locale-Sensitive Numbers and Currency
    purpose: Understand the difference between numeric/currency domain values and how those values are formatted or parsed for a locale.
    relatedKnowledge:
      - NumberFormatting
      - Currency
    relatedModules:
      - routeId: JAVA_NUMBERS
        label: Numbers
        note: Numeric representation and rounding belong to Numbers; localization owns presentation.
    objectives:
      - Use locale-sensitive number formatting without changing numeric meaning.
      - Separate currency identity from localized currency display.
  - id: collation-and-text-order
    title: Locale-Sensitive Collation
    purpose: Understand why user-facing text order depends on locale rules rather than raw Unicode/String natural order.
    relatedKnowledge:
      - Collator
    relatedModules:
      - routeId: JAVA_STRING
        label: String
        note: Unicode, normalization, and core String semantics are prerequisites for locale-aware text processing.
    objectives:
      - Use Collator when linguistic ordering matters.
      - Reason about collation strength and decomposition without changing string identity.
  - id: date-time-localization
    title: Locale-Sensitive Date-Time Localization
    purpose: Understand how Locale affects date-time formatting, parsing, and presentation conventions while ZoneId and temporal meaning remain owned by the Date-Time model.
    relatedKnowledge:
      - DateTimeLocalization
    relatedModules:
      - routeId: JAVA_DATE_TIME
        label: Date-Time
        note: Date-Time owns temporal meaning, zones, and arithmetic; Localization owns presentation conventions.
    objectives:
      - Format and parse dates/times using locale conventions without changing the temporal value.
      - Keep timezone decisions owned by the date-time model.
      - Recognize locale-sensitive conventions such as date-field order, week rules, numbering systems, and display calendars.
  - id: text-segmentation-and-bidi
    title: Text Segmentation and Bidirectional Text
    purpose: Understand why natural-language boundaries and visual order can differ from code-unit indexes, spaces, and logical storage order.
    relatedKnowledge:
      - TextSegmentation
      - BidirectionalText
    relatedModules:
      - routeId: JAVA_STRING
        label: String
        note: The Unicode, code-unit, code-point, and grapheme model from String is foundational for understanding text boundaries and logical-versus-visual ordering.
    objectives:
      - Recognize that user-perceived character boundaries require Unicode-aware handling while word, sentence, and line boundaries can be language- or locale-sensitive.
      - Use BreakIterator when text boundaries must be identified instead of naively splitting by indexes, spaces, or punctuation.
      - Understand that Bidi analyzes logical order and directional runs while actual rendering and layout remain the responsibility of the presentation layer.
  - id: locale-defaults-and-synthesis
    title: Fallback, Default Locale, Common Pitfalls, and Localization Synthesis
    purpose: Understand how ResourceBundle behaves when an exact localized resource is missing, then connect the pieces of localization into one model while avoiding implicit default-locale dependencies or formatted data crossing the wrong boundary.
    relatedKnowledge:
      - Locale
      - Fallback
      - LocalePitfalls
    objectives:
      - Predict fallback resolution and recognize when it is a useful safety net versus when it hides missing localized resources.
      - Make locale choice explicit at application boundaries.
      - Distinguish FORMAT and DISPLAY default Locale categories and understand why implicit environment defaults can change behavior across machines.
      - Avoid locale-sensitive behavior for identifiers, protocols, or machine-stable data representations.
      - Synthesize how to choose locale, resources, and presentation APIs without changing domain meaning.
