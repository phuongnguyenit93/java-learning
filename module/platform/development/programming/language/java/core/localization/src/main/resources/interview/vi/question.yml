      methodSignature: "compareLocales()"

  - question: >-
      Tại sao thẻ ngôn ngữ BCP 47 vẫn cần tồn tại khi Java đã có đối tượng Locale?
    answer: >-
      Locale là đối tượng trong tiến trình Java, còn HTTP, URL, cấu hình và cơ sở dữ liệu cần một cách biểu diễn dạng văn bản để trao đổi giữa các hệ thống. BCP 47 cung cấp cấu trúc chuẩn cho ngôn ngữ, hệ chữ viết, khu vực, biến thể và phần mở rộng, giúp các bên hiểu cùng một ngữ cảnh Locale. Vì thẻ có cấu trúc, ứng dụng nên dùng API chuẩn thay vì tự tách hoặc nối chuỗi.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.LanguageTags/LanguageTags.md"
      anchor: "bcp47-language-tag"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Khi máy khách gửi nhiều lựa chọn ngôn ngữ như vi-VN, vi, en-US, ứng dụng nên tư duy về việc chọn Locale thế nào?
    answer: >-
      Đây là bài toán đối chiếu giữa danh sách lựa chọn có thứ tự ưu tiên và tập Locale mà sản phẩm thật sự hỗ trợ, không phải lấy thẻ đầu tiên một cách mù quáng. Locale.LanguageRange cùng các thao tác lookup/filter có thể mô hình hóa bước chọn này. Khung web có thể thực hiện giúp, nhưng ứng dụng vẫn cần biết các Locale được hỗ trợ và chính sách dự phòng của mình.
