      Khi client gửi nhiều language preference như vi-VN, vi, en-US, ứng dụng nên tư duy về việc chọn Locale thế nào?
    answer: >-
      Đây là bài toán matching giữa danh sách preference có thứ tự ưu tiên và tập locale mà sản phẩm thật sự hỗ trợ, không phải lấy tag đầu tiên một cách mù quáng. Locale.LanguageRange cùng lookup/filter mô hình hóa bước chọn này. Framework web có thể thực hiện giúp, nhưng application vẫn cần biết supported locales và fallback policy của mình.
    aiGenerated: true
