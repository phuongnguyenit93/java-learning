  - question: >-
      ResourceBundle giải quyết bài toán gì, và tại sao nói nó không phải là bộ máy dịch?
    answer: >-
      ResourceBundle tra cứu tài nguyên đã chuẩn bị sẵn dựa trên tên cơ sở (base name), Locale được yêu cầu, chuỗi ứng viên/dự phòng và khóa ổn định. Nó không tạo ra bản dịch mới; nhóm vẫn phải biên soạn và rà soát các tài nguyên đã bản địa hóa. Giá trị của cơ chế này là tách mã nguồn khỏi nội dung dịch và gom chính sách tra cứu về một chỗ.
