  - question: >-
      Khi nào CompactNumberFormat hữu ích, và vì sao không nên persist kết quả compact?
    answer: >-
      Compact format phù hợp cho dashboard, statistic card hoặc UI hẹp cần representation kiểu 1.2M/biến thể theo locale. Pattern compact đến từ locale data chứ không nên tự nối K/M/B. Chuỗi compact có thể round hoặc bỏ chi tiết, nên domain/persistence vẫn phải giữ numeric value gốc.
