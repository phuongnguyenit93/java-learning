  - question: >-
      Collator giải quyết vấn đề gì mà String.compareTo không giải quyết, và khi nào không nên dùng Collator?
    answer: >-
      String.compareTo cho thứ tự deterministic dựa trên Unicode values, phù hợp cho nhiều key/protocol/internal ordering nhưng không đại diện đầy đủ thứ tự chữ mà người đọc mong đợi. Collator áp dụng linguistic rules theo Locale cho user-visible text. Không nên dùng user Locale để sort technical identifiers cần cùng một thứ tự ở mọi môi trường.
    aiGenerated: true
    reviewed: false
    readmeRelated:
