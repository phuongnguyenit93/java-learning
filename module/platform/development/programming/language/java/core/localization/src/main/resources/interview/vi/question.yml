questions:
  - question: >-
      Hãy phân biệt internationalization (i18n) và localization (l10n), và giải thích vì sao một hệ thống có bản dịch tiếng Việt chưa chắc đã được localization đúng.
    answer: >-
      i18n là thiết kế phần mềm để có thể thích nghi với nhiều ngôn ngữ, vùng và convention mà không phải viết lại business logic; l10n là cung cấp nội dung và convention cụ thể cho một locale. Chỉ dịch label chưa đủ, vì number, date/time, currency, collation, text boundary và bidi vẫn có thể dùng convention sai. Thiết kế tốt tách khả năng thích nghi khỏi dữ liệu bản địa hóa cụ thể.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.MentalModel/MentalModel.md"
      anchor: "i18n-vs-l10n"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Vì sao domain value như BigDecimal, Instant hoặc currency code không nên thay đổi chỉ vì người dùng đổi Locale?
    answer: >-
      Locale mô tả cách con người nhìn và đọc dữ liệu, không thay đổi ý nghĩa nghiệp vụ của dữ liệu đó. Nếu amount hoặc instant bị biến thành localized String quá sớm, hệ thống dễ mất precision, khó tính toán, khó đổi locale và dễ nhầm presentation với canonical value. Domain giữ representation ổn định; localization chỉ xảy ra khi đi qua human-facing boundary.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.MentalModel/MentalModel.md"
      anchor: "locale-sensitive-data"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Bạn sẽ đặt localization ở đâu trong kiến trúc backend, và những nơi nào nên tránh dùng Locale của người dùng?
    answer: >-
      Localization phù hợp ở UI response, email, report, invoice hoặc sorting text dành cho người đọc. Machine contracts, database numeric values, cache keys, protocol identifiers và log fields dùng cho parsing nên có format ổn định, explicit và thường locale-neutral. Ranh giới này giúp cùng một domain value có thể được trình bày khác nhau mà không làm thay đổi identity hay semantics bên trong hệ thống.
    aiGenerated: true
