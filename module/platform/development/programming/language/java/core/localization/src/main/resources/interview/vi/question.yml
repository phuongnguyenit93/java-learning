      methodSignature: "formatAndParse()"

  - question: >-
      DecimalFormat pattern, DecimalFormatSymbols và business rounding nên được phân chia trách nhiệm ra sao?
    answer: >-
      Pattern mô tả shape hiển thị như digit/grouping/fraction positions, còn DecimalFormatSymbols cung cấp ký hiệu thực tế của locale. Formatter có thể round để đáp ứng presentation, nhưng rule tính tiền, thuế hay scale lưu trữ là business policy và phải được quyết định riêng. Đổi Locale không được phép làm thay đổi số tiền nghiệp vụ phải thanh toán.
