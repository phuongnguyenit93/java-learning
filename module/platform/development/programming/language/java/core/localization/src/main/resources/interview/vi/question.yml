  - question: >-
      Phần mở rộng Locale Unicode (Unicode locale extension) có thể bổ sung gì cho một thẻ ngôn ngữ, và không nên nhầm chúng với điều gì?
    answer: >-
      Các phần mở rộng như u-ca-buddhist hoặc u-nu-thai có thể mang thêm lựa chọn bản địa hóa, chẳng hạn hệ lịch trình bày hoặc hệ chữ số, để những API có hỗ trợ diễn giải. Chúng không biến Locale thành nơi chứa mọi ngữ cảnh nghiệp vụ: Currency của giao dịch, chính sách múi giờ và dữ liệu miền vẫn là các khái niệm riêng. Không phải API nào cũng hiểu mọi phần mở rộng, nên phải dựa vào hợp đồng của API cụ thể thay vì suy luận toàn cục.
