  - question: >-
      DecimalFormat mẫu, DecimalFormatSymbols và quy tắc làm tròn nghiệp vụ nên được phân chia trách nhiệm ra sao?
    answer: >-
      Mẫu mô tả hình thức hiển thị như vị trí chữ số, nhóm chữ số và phần thập phân; DecimalFormatSymbols cung cấp ký hiệu thực tế của Locale. Bộ định dạng có thể làm tròn để phục vụ trình bày, nhưng quy tắc tính tiền, thuế hay scale lưu trữ là chính sách nghiệp vụ và phải được quyết định riêng. Đổi Locale không được phép làm thay đổi số tiền nghiệp vụ phải thanh toán.
