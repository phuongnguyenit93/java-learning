  - question: >-
      Vì sao Locale mặc định là một phụ thuộc ẩn nguy hiểm trong hệ thống phía máy chủ phục vụ nhiều người dùng?
    answer: >-
      JVM có Locale mặc định chung cùng hai nhóm mặc định DISPLAY và FORMAT. Các API không đọc cùng một giá trị: chuyển đổi hoa/thường của String dùng Locale mặc định chung, còn các API định dạng thường dùng nhóm FORMAT. Những trạng thái toàn cục này có thể khác lựa chọn của từng yêu cầu/người dùng và khác giữa các môi trường. Hệ thống phía máy chủ nên truyền Locale tường minh khi đó là một phần của hợp đồng và chỉ dùng giá trị mặc định như một chính sách có chủ đích.
