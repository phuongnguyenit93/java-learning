  - question: >-
      Locale thực sự mô hình hóa điều gì, và tại sao không nên coi nó là vị trí địa lý, ZoneId hoặc hồ sơ người dùng?
    answer: >-
      Locale là ngữ cảnh về ngôn ngữ, hệ chữ viết, khu vực, biến thể và phần mở rộng để các API phụ thuộc Locale chọn quy ước phù hợp. Nó không cho biết thiết bị đang ở đâu, không chứa quy tắc múi giờ và cũng không chứng minh quốc tịch, địa chỉ hay Currency của giao dịch. Những khái niệm nghiệp vụ khác phải được mô hình hóa riêng thay vì suy diễn từ Locale.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Locale/Locale.md"
