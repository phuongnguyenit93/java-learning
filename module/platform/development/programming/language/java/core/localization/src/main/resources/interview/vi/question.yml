  - question: >-
      Hãy đi qua một quyết định bản địa hóa đầu-cuối cho dịch vụ có giá trị nghiệp vụ chuẩn, đầu ra cho người dùng, hợp đồng máy-với-máy và cơ chế dự phòng.
    answer: >-
      Bắt đầu từ ý nghĩa nghiệp vụ chuẩn và giữ số, Currency, Instant hay định danh độc lập với văn bản hiển thị. Xác định mỗi ranh giới dành cho con người hay dành cho máy. Ở ranh giới dành cho con người, chọn Locale tường minh, giữ ZoneId và Currency là ngữ cảnh riêng rồi dùng ResourceBundle/MessageFormat, NumberFormat, DateTimeFormatter, Collator, BreakIterator hoặc Bidi đúng trách nhiệm của từng API. Chính sách dự phòng và Locale mặc định phải có chủ đích và quan sát được. Hợp đồng dành cho máy nên dùng biểu diễn ổn định thay vì chuỗi đã bản địa hóa.
