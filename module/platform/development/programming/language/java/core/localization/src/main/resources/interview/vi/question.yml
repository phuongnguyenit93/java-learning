questions:
  - question: >-
      Hãy phân biệt quốc tế hóa (internationalization/i18n) và bản địa hóa (localization/l10n), và giải thích vì sao một hệ thống có bản dịch tiếng Việt chưa chắc đã được bản địa hóa đúng.
    answer: >-
      i18n là thiết kế phần mềm để có thể thích nghi với nhiều ngôn ngữ, vùng và quy ước mà không phải viết lại logic nghiệp vụ; l10n là cung cấp nội dung và quy ước cụ thể cho một Locale. Chỉ dịch nhãn chưa đủ, vì số, ngày giờ, tiền tệ, thứ tự sắp xếp, ranh giới văn bản và bidi vẫn có thể dùng quy ước sai. Thiết kế tốt tách khả năng thích nghi khỏi dữ liệu bản địa hóa cụ thể.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.MentalModel/MentalModel.md"
      anchor: "i18n-vs-l10n"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Vì sao giá trị nghiệp vụ như BigDecimal, Instant hoặc mã tiền tệ không nên thay đổi chỉ vì người dùng đổi Locale?
    answer: >-
      Locale mô tả cách con người nhìn và đọc dữ liệu, không thay đổi ý nghĩa nghiệp vụ của dữ liệu đó. Nếu số tiền hoặc Instant bị biến thành String đã bản địa hóa quá sớm, hệ thống dễ mất độ chính xác, khó tính toán, khó đổi Locale và dễ nhầm cách trình bày với giá trị chuẩn. Miền nghiệp vụ giữ cách biểu diễn ổn định; bản địa hóa chỉ xảy ra khi đi qua ranh giới dành cho con người.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.MentalModel/MentalModel.md"
      anchor: "locale-sensitive-data"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Bạn sẽ đặt logic bản địa hóa ở đâu trong kiến trúc hệ thống phía máy chủ, và những nơi nào nên tránh dùng Locale của người dùng?
    answer: >-
      Bản địa hóa phù hợp ở phản hồi UI, email, báo cáo, hóa đơn hoặc khi sắp xếp văn bản dành cho người đọc. Hợp đồng dành cho máy, giá trị số trong cơ sở dữ liệu, khóa bộ nhớ đệm, định danh giao thức và trường log dùng cho phân tích nên có định dạng ổn định, tường minh và thường không phụ thuộc Locale. Ranh giới này giúp cùng một giá trị nghiệp vụ có thể được trình bày khác nhau mà không làm thay đổi định danh hay ngữ nghĩa bên trong hệ thống.
    aiGenerated: true
