  - question: >-
      Vì sao Locale en và en-US có thể phục vụ cùng một số tài nguyên nhưng vẫn không equals nhau?
    answer: >-
      Phép so sánh bằng của Locale dựa trên các thành phần định danh như ngôn ngữ, hệ chữ viết, khu vực, biến thể và phần mở rộng; en-US có khu vực còn en thì không. Cơ chế dự phòng của ResourceBundle là một chính sách tra cứu riêng, có thể đi từ Locale cụ thể về Locale tổng quát hơn. Không nên dùng khả năng dự phòng để suy rằng hai Locale có cùng định danh.
    aiGenerated: true
    reviewed: false
    readmeRelated:
