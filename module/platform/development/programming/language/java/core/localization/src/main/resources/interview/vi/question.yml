  - question: >-
      Hãy giải thích Collator strength và decomposition, và vì sao compare(a, b) == 0 không nhất thiết nghĩa a.equals(b).
    answer: >-
      Strength quyết định mức khác biệt linguistic nào được xem là quan trọng, còn decomposition liên quan cách xử lý các Unicode representation tương đương/gần nhau. Ở strength thấp, hai String khác code point vẫn có thể được coi là tương đương cho collation và compare trả 0. Điều đó là equality theo comparator hiện tại, không thay đổi Object/String equality.
