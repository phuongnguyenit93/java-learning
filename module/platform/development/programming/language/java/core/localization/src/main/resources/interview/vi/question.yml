  - question: >-
      Hãy phân biệt tính hợp lệ cú pháp của thẻ ngôn ngữ với phạm vi Locale ứng dụng hỗ trợ, và cho biết khi nào Locale.Builder hữu ích hơn Locale.forLanguageTag.
    answer: >-
      Một thẻ có thể hợp lệ theo cấu trúc BCP 47 nhưng sản phẩm vẫn không có tài nguyên hay chính sách để hỗ trợ Locale đó. Locale.forLanguageTag phù hợp với cách phân tích dung thứ đầu vào, còn Locale.Builder.setLanguageTag có thể tạo ranh giới kiểm tra chặt hơn và ném IllformedLocaleException khi đầu vào sai cấu trúc. Sau khi kiểm tra cú pháp vẫn phải kiểm tra riêng chính sách các Locale được hỗ trợ.
