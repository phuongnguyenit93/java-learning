  - question: >-
      Giải thích chuỗi Locale ứng viên của ResourceBundle và vì sao không nên tự mô phỏng nó bằng cách nối tên tệp.
    answer: >-
      ResourceBundle.Control tạo danh sách Locale ứng viên cho một Locale đích từ cụ thể đến tổng quát; ví dụ en-US có các ứng viên en-US, en rồi ROOT. Hệ chữ và biến thể có thể làm danh sách phong phú hơn, còn phần mở rộng được Control mặc định loại khỏi quá trình tạo ứng viên. Việc chọn một Locale dự phòng khác là bước riêng, nên tự nối tên tệp rất dễ trộn hai cơ chế và lệch khỏi API chuẩn.
