  - question: >-
      Vì sao dấu nháy đơn trong MessageFormat là một bẫy dễ gây lỗi ở môi trường vận hành và cần được kiểm thử?
    answer: >-
      Dấu nháy đơn (apostrophe) là ký tự trích dẫn trong mẫu MessageFormat, nên văn bản tự nhiên do người dịch thêm vào có thể vô tình thay đổi cách bộ phân tích hiểu tham số giữ chỗ. Tài nguyên dùng MessageFormat không còn là chuỗi thuần túy; nó là một mẫu có cú pháp. Vì vậy cần kiểm thử mẫu với các đối số thực tế và kiểm tra cách thoát dấu nháy đơn ở những Locale thường dùng ký tự này.
