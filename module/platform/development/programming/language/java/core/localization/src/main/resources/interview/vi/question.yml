  - question: >-
      Vì sao parse localized number cần một validation policy rõ ràng thay vì chỉ gọi NumberFormat.parse(String)?
    answer: >-
      Parser có thể đọc một prefix hợp lệ rồi dừng trước phần dư, nên kết quả khác với yêu cầu “toàn bộ input phải hợp lệ”. Với strict validation cần ParsePosition và kiểm tra vị trí consume/error; khi cần decimal exact có thể bật parseBigDecimal trên DecimalFormat. Locale của parser cũng phải đến từ input/user context chứ không dựa vào default không rõ nguồn.
