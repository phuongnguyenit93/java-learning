  - question: >-
      Hãy phân biệt syntax validity của language tag với application support, và cho biết khi nào Locale.Builder hữu ích hơn Locale.forLanguageTag.
    answer: >-
      Một tag có thể hợp lệ theo cấu trúc BCP 47 nhưng sản phẩm vẫn không có resource hay policy để hỗ trợ locale đó. Locale.forLanguageTag phù hợp với best-effort parsing, còn Locale.Builder.setLanguageTag có thể tạo boundary validation chặt hơn và ném IllformedLocaleException khi input sai cấu trúc. Sau validation cú pháp vẫn phải kiểm tra supported-locale policy riêng.
    aiGenerated: true
