  - question: >-
      Hãy giải thích sự khác nhau giữa numeric value và localized numeric text, và vai trò của NumberFormat.
    answer: >-
      Numeric value là dữ liệu nghiệp vụ dùng để tính toán/persist, còn localized text là cách con người nhìn giá trị đó với separator, grouping, percent hoặc currency convention phù hợp. NumberFormat là abstraction format/parse giữa hai phía theo Locale. Nó không thay thế BigDecimal hay biến presentation thành canonical numeric model.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.NumberFormatting/NumberFormatting.md"
