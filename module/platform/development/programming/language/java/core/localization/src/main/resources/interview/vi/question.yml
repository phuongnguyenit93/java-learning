      methodSignature: "compareLocales()"

  - question: >-
      Tại sao BCP 47 language tag cần tồn tại khi Java đã có Locale object?
    answer: >-
      Locale là object trong process Java, còn HTTP, URL, config và database cần một representation dạng text có thể trao đổi giữa các hệ thống. BCP 47 cung cấp cấu trúc chuẩn cho language, script, region, variant và extensions, giúp các bên hiểu cùng một locale context. Vì tag có cấu trúc, application nên dùng API chuẩn thay vì tự split hoặc nối chuỗi.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.LanguageTags/LanguageTags.md"
