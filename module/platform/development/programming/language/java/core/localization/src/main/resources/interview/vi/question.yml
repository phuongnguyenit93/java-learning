  - question: >-
      Locale thực sự mô hình hóa điều gì, và tại sao không nên coi nó là vị trí địa lý, ZoneId hoặc hồ sơ người dùng?
    answer: >-
      Locale là context về language, script, region, variant/extensions để các API locale-sensitive chọn convention phù hợp. Nó không nói thiết bị đang ở đâu, không chứa timezone rules và cũng không chứng minh quốc tịch, địa chỉ hay currency của giao dịch. Những khái niệm nghiệp vụ khác phải được model riêng thay vì suy diễn từ Locale.
    aiGenerated: true
