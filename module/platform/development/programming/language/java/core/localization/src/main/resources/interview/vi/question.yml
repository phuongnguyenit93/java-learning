  - question: >-
      Giải thích candidate locale chain của ResourceBundle và vì sao không nên tự mô phỏng nó bằng cách nối tên file.
    answer: >-
      ResourceBundle ưu tiên candidate cụ thể hơn rồi đi về các mức tổng quát, ví dụ en-US có thể thử en_US, en rồi base; với script, variant hoặc extensions chain có thể chi tiết hơn. Control của JDK đã biết các rule này và cả fallback policy. Tự nối tên file dễ bỏ sót trường hợp và tạo lookup khác với semantics của API chuẩn.
