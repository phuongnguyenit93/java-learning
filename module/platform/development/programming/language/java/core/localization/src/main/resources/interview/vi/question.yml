  - question: >-
      Vì sao MessageFormat tốt hơn việc ghép nhiều mảnh chuỗi khi thông điệp có dữ liệu động?
    answer: >-
      Việc nối các mảnh câu khóa cấu trúc theo ngôn ngữ của lập trình viên và khiến người dịch khó đổi thứ tự thành phần một cách tự nhiên. MessageFormat giữ toàn bộ mẫu câu trong tài nguyên và chèn các đối số qua tham số giữ chỗ, nên cùng dữ liệu có thể được sắp xếp khác nhau theo ngôn ngữ. ResourceBundle chọn mẫu; MessageFormat chỉ điền tham số vào mẫu đó.
