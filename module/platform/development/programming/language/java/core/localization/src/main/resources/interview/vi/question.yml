  - question: >-
      ResourceBundle caching ảnh hưởng thế nào tới performance và runtime resource update?
    answer: >-
      Cache tránh việc load và dựng bundle lại trên mỗi request, nên có lợi cho performance. Mặt khác, thay file resource trên disk không có nghĩa JVM đang chạy sẽ nhìn thấy ngay; reload cần Control/TTL hoặc clearCache có chủ đích. Nếu sản phẩm không có hot-reload requirement, deployment-based refresh thường đơn giản và an toàn hơn.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.ResourceBundle/ResourceBundle.md"
      anchor: "bundle-cache"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Vì sao MessageFormat tốt hơn việc ghép nhiều fragment string khi message có dữ liệu động?
    answer: >-
      Fragment concatenation khóa cấu trúc câu theo ngôn ngữ của developer và làm translator không thể đổi thứ tự thành phần một cách tự nhiên. MessageFormat giữ toàn bộ sentence pattern trong resource và chèn arguments qua placeholder, nên cùng dữ liệu có thể được sắp xếp khác nhau theo ngôn ngữ. ResourceBundle chọn pattern; MessageFormat chỉ parameterize pattern đó.
