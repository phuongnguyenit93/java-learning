  - question: >-
      Vì sao định dạng bản địa hóa rồi phân tích ngược không phải là một chiến lược tuần tự hóa an toàn giữa các dịch vụ?
    answer: >-
      Bộ định dạng dành cho con người có thể làm tròn, bỏ trường, dùng dấu phân cách mơ hồ hoặc thay đổi mẫu theo Locale và dữ liệu của môi trường chạy. Ngay cả cùng một bộ định dạng cũng không bảo đảm chuyển đổi hai chiều về đúng đối tượng ban đầu nếu cách trình bày cố ý giảm độ chính xác. Ranh giới dành cho máy nên dùng hợp đồng chuẩn tường minh như số trong JSON, mã tiền tệ và định dạng thời gian ISO khi phù hợp.
