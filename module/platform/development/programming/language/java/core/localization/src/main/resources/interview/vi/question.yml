  - question: >-
      Vì sao default Locale là một hidden dependency nguy hiểm trong backend phục vụ nhiều người dùng?
    answer: >-
      Default Locale thuộc JVM/environment, nên cùng một đoạn code có thể cho output khác giữa laptop, CI và production hoặc giữa các node. Nó cũng không nhất thiết trùng preference của request hiện tại. Backend nên truyền Locale tường minh theo user/request khi đó là contract, và chỉ dùng default khi chính environment default là policy đã được quyết định.
