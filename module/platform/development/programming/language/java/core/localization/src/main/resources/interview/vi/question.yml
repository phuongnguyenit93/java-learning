  - question: >-
      Vì sao dự phòng qua Locale mặc định có thể làm cùng một bản dựng hiển thị ngôn ngữ khác nhau giữa hai môi trường?
    answer: >-
      Khi Locale đích không có tài nguyên phù hợp, chính sách mặc định của ResourceBundle có thể đi qua Locale mặc định của JVM trước khi về gói tài nguyên gốc. Nếu nút A và nút B có Locale mặc định khác nhau, cùng một Locale được yêu cầu có thể phân giải khác nhau. Hệ thống cần chính sách dự phòng rõ ràng của sản phẩm và có thể dùng Control không dự phòng khi muốn loại bỏ phụ thuộc này.
