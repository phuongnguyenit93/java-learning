  - question: >-
      Khi nào properties bundle phù hợp hơn class-based bundle, và trade-off chính giữa hai loại là gì?
    answer: >-
      Properties bundle thường phù hợp cho message text vì tách nội dung khỏi Java source, dễ cho translator/tooling xử lý và không cần model resource bằng code. Class-based bundle có thể trả object và dùng logic Java nhưng gắn resource với compile/runtime code lifecycle. Nên chọn theo loại resource và vận hành thực tế, không theo thói quen.
    aiGenerated: true
    reviewed: false
    readmeRelated:
