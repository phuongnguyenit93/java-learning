      Cơ chế dự phòng là chính sách tiếp tục tra cứu khi đường tra cứu của Locale ưu tiên không phân giải được tài nguyên phù hợp. Nó có thể gồm các ứng viên ít cụ thể hơn và, tùy ResourceBundle.Control, một nhánh Locale dự phòng riêng như Locale mặc định của JVM. Ứng dụng vẫn có thể hiển thị nội dung dù bản dịch mong muốn đang thiếu, nên độ đầy đủ phải được kiểm tra trong quá trình xây dựng và kiểm thử thay vì suy ra từ việc tra cứu thành công.
