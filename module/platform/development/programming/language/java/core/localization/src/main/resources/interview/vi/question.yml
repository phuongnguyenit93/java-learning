      Giá trị số là dữ liệu nghiệp vụ dùng để tính toán và lưu trữ, còn văn bản đã bản địa hóa là cách con người nhìn giá trị đó với dấu phân cách, nhóm chữ số, phần trăm hoặc quy ước tiền tệ phù hợp. NumberFormat là cơ chế định dạng và phân tích giữa hai phía theo Locale. Nó không thay thế BigDecimal hay biến cách trình bày thành mô hình số chuẩn.
    aiGenerated: true
    reviewed: false
    readmeRelated:
