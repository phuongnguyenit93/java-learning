  - question: >-
      Vì sao apostrophe trong MessageFormat là một production pitfall đáng test?
    answer: >-
      Apostrophe là ký tự quote của MessageFormat pattern, nên text tự nhiên do translator thêm vào có thể vô tình thay đổi cách parser hiểu placeholder. Resource dùng MessageFormat không còn là plain string hoàn toàn; nó là một pattern có syntax. Vì vậy cần test pattern với arguments thực tế và kiểm tra escaping ở các locale có apostrophe thường xuyên.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.MessageFormat/MessageFormat.md"
      anchor: "quote-escaping"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Bạn sẽ thiết kế pipeline ResourceBundle + MessageFormat thế nào để tránh dùng sai Locale và tránh vấn đề thread-safety?
    answer: >-
      Request/user Locale nên được dùng nhất quán để chọn bundle và tạo MessageFormat, nhờ đó sentence pattern và number/date sub-format cùng một context. MessageFormat và nhiều java.text Format là mutable, nên backend đơn giản nhất là tạo formatter theo request/operation hoặc quản lý cache/synchronization rất rõ. Không nên load pattern theo một locale rồi âm thầm format arguments theo JVM default khác.
    aiGenerated: true
    reviewed: false
    readmeRelated:
