  - question: >-
      Vì sao Locale en và en-US có thể phục vụ cùng một số resource nhưng vẫn không equals nhau?
    answer: >-
      Equality của Locale dựa trên identity components như language, script, region, variant và extensions; en-US có region còn en thì không. ResourceBundle fallback là một lookup policy riêng, có thể đi từ locale cụ thể về tổng quát hơn. Không nên dùng khả năng fallback để suy rằng hai Locale có cùng identity.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Locale/Locale.md"
