# <roadmap-schema>
# Cấu trúc Roadmap Module
# schema-version: 1
#
# YAML CONTRACT
# roadmap: Danh sách milestone cấp cao của roadmap cho language hiện tại.
#
# - id [string, required]: ID ổn định và duy nhất của milestone trong roadmap language hiện tại.
# - title [string, required]: Tên milestone hiển thị cho learner.
# - purpose [string, required]: Milestone này tồn tại để learner hiểu hoặc đạt được điều gì.
# - dependsOn [list, optional]: Danh sách id milestone prerequisite khi dependency không thể hiện đủ chỉ bằng thứ tự item.
# - objectives [list, optional]: Các learning objective cấp milestone; không dùng để liệt kê mọi fact/API/syntax nhỏ.
# - relatedKnowledge [list, optional]: Danh sách Knowledge category id trong chính module hiện tại hỗ trợ milestone. Portal hiển thị danh sách này ở phía đối diện milestone và click item sẽ điều hướng sang Knowledge category tương ứng.
# - relatedModules [list, optional]: Các module liên quan hiển thị ở Level 2 của Portal. Mỗi item dùng routeId bắt buộc và có thể có label/note localized; relation này chỉ để điều hướng, không tạo child milestone hoặc thay đổi learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - Topic/module này là gì?
#   - Vì sao nó tồn tại?
#   - Không có nó thì learner gặp vấn đề gì?
# FOUNDATION
#   - Learner cần prerequisite hoặc mental model nào trước?
# CORE MODEL
#   - Những abstraction hoặc building block lớn nào tạo nên chủ đề này?
# MECHANICS
#   - Nó hoạt động như thế nào ở mức language/runtime/API phù hợp với module?
# USAGE
#   - Nó được dùng như thế nào trong code thực tế?
# DECISION / TRADE-OFF
#   - Khi nào nên chọn cơ chế này thay vì cơ chế khác?
#   - Khi nào không nên dùng?
# FAILURE / PITFALL
#   - Những sai lầm, compile-time failure hoặc runtime failure nào đáng biết?
# INTEGRATION
#   - Chủ đề này kết nối với những concept/module lân cận nào?
# SYNTHESIS
#   - Sau cùng learner phải giữ mental model end-to-end nào?
#
# Mỗi language tự chịu trách nhiệm cho roadmap của chính nó. Không suy luận hoặc đồng bộ cấu trúc từ roadmap của language khác.
# Thứ tự item trong roadmap chính là thứ tự học mặc định. Chỉ dùng dependsOn khi cần biểu diễn dependency rõ hơn thứ tự tuyến tính.
# Skeleton không nên ép mọi module có đúng bấy nhiêu node. Nó là framework suy nghĩ chứ không phải template cứng.
# </roadmap-schema>

roadmap:
  - id: generics-purpose
    title: Generics là gì và vì sao cần?
    purpose: Hiểu Generics cho phép dùng kiểu như một tham số để tái sử dụng cấu trúc và thuật toán mà vẫn kiểm tra an toàn kiểu khi biên dịch, thay vì dùng Object rồi ép kiểu hoặc viết lặp lại cùng một cách xử lý cho nhiều kiểu.
    relatedKnowledge:
      - GenericsPurpose
    relatedModules:
      - routeId: JAVA_OOP
        label: Lập trình hướng đối tượng (OOP)
        note: Kế thừa, kiểu con và khả năng thay thế là nền tảng để hiểu giới hạn kiểu, tính bất biến và quan hệ giữa các kiểu generic.
      - routeId: JAVA_ABSTRACT_INTERFACE
        label: Lớp trừu tượng & Interface
        note: Giao diện (interface) và hợp đồng kiểu là nền tảng để hiểu giao diện generic, giới hạn bằng giao diện và cách Generics biểu diễn các quan hệ kiểu dùng chung.
      - routeId: JAVA_COLLECTION
        label: Collections Framework
        note: Collections Framework là một trong những nơi sử dụng Generics quan trọng nhất trong Java.
    objectives:
      - Phân biệt tham số kiểu (type parameter) với đối số kiểu (type argument) và đọc được khai báo generic cơ bản.
      - Giải thích vì sao Generics giúp phát hiện sai kiểu ngay khi biên dịch và giảm ép kiểu thủ công so với cách dùng Object.
  - id: generic-types-and-methods
    title: Kiểu generic và phương thức generic
    purpose: Hiểu khi tham số kiểu nên thuộc về lớp/giao diện (interface) và khi nó chỉ nên thuộc về một phương thức hoặc hàm tạo (constructor).
    relatedKnowledge:
      - GenericTypesAndMethods
    objectives:
      - Khai báo và sử dụng lớp/giao diện generic với tham số kiểu có ý nghĩa.
      - Dùng phương thức hoặc hàm tạo generic và suy luận kiểu khi quan hệ kiểu chỉ thuộc một thao tác cụ thể.
  - id: bounded-type-parameters
    title: Tham số kiểu có giới hạn
    purpose: Hiểu giới hạn tham số kiểu (bounded type parameter) là cách yêu cầu kiểu cung cấp những khả năng cần thiết mà vẫn giữ được khả năng tái sử dụng của Generics.
    relatedKnowledge:
      - BoundedTypeParameters
    objectives:
      - Dùng giới hạn trên (upper bound) để giới hạn kiểu và xác định những thao tác mã generic được phép gọi an toàn.
      - Nhận biết nhiều giới hạn (multiple bounds) và giới hạn đệ quy (recursive bound) là các dạng nâng cao của cùng mô hình giới hạn kiểu.
  - id: invariance-and-subtyping
    title: Tính bất biến và quan hệ kiểu con
    purpose: Hiểu vì sao Dog có thể là kiểu con của Animal nhưng List<Dog> không vì thế trở thành kiểu con của List<Animal>, từ đó thấy được giới hạn mà wildcard cần giải quyết.
    relatedKnowledge:
      - InvarianceAndSubtyping
    objectives:
      - Phân biệt quan hệ kế thừa giữa các kiểu với quan hệ tương thích giữa các kiểu generic.
      - Nhận biết tính bất biến không xóa quan hệ kế thừa của chính khai báo generic; ví dụ ArrayList<Dog> vẫn là một List<Dog>.
      - So sánh cách Generics và mảng xử lý quan hệ kiểu con để hiểu lý do an toàn kiểu phía sau tính bất biến.
  - id: wildcards-and-type-families
    title: Wildcard, PECS và chiều đọc/ghi dữ liệu
    purpose: Hiểu wildcard dùng để biểu diễn một đối số kiểu chưa biết khi API cần chấp nhận cả một họ kiểu generic tương thích, sau đó dùng vai trò bên cung cấp dữ liệu (producer) và bên tiếp nhận dữ liệu (consumer) để chọn ? extends hoặc ? super có chủ đích.
    relatedKnowledge:
      - WildcardsAndPECS
    objectives:
      - Phân biệt wildcard không giới hạn, wildcard giới hạn trên, wildcard giới hạn dưới và List<?> với List<Object>.
      - Áp dụng extends cho bên cung cấp và super cho bên tiếp nhận dựa trên mục đích của API.
      - Phân biệt khi wildcard chỉ cần mô tả một họ kiểu tại vị trí sử dụng với khi cần tham số kiểu có tên để giữ quan hệ kiểu giữa nhiều vị trí trong API.
  - id: raw-types-and-legacy-boundaries
    title: Kiểu thô (raw type) và ranh giới mã cũ
    purpose: Hiểu kiểu thô (raw type) tồn tại để tương thích với mã Java có từ trước Generics, nhưng có thể bỏ qua các đảm bảo an toàn kiểu và tạo ra cảnh báo không được kiểm tra đầy đủ (unchecked warning) khi trình biên dịch không còn kiểm chứng đầy đủ.
    relatedKnowledge:
      - RawTypesAndLegacyBoundaries
    objectives:
      - Khoanh vùng phần mã phải tương tác với kiểu thô thay vì để các thao tác không được kiểm tra đầy đủ (unchecked) lan rộng.
      - Hiểu cảnh báo của trình biên dịch là dấu hiệu các đảm bảo an toàn kiểu đã bị suy yếu.
  - id: erasure-runtime-model
    title: Xóa kiểu (Type Erasure) và mô hình lúc chạy
    purpose: Hiểu thông tin kiểu generic chủ yếu hướng dẫn quá trình biên dịch, trong khi phần lớn mã thực thi lúc chạy sử dụng kiểu đã được xóa.
    relatedKnowledge:
      - TypeErasureAndRuntimeModel
    relatedModules:
      - routeId: JAVA_REFLECTION
        label: Reflection
        note: Reflection có thể đọc phần siêu dữ liệu chữ ký generic vẫn còn được lưu sau quá trình xóa kiểu.
    objectives:
      - Hiểu ở mức khái niệm cách tham số kiểu được xóa về giới hạn tương ứng hoặc Object và vì sao trình biên dịch có thể chèn phép ép kiểu cần thiết.
      - Phân biệt kiểu dùng để thực thi lúc chạy với siêu dữ liệu chữ ký generic vẫn còn được lưu lại.
  - id: generic-limitations-and-synthesis
    title: Giới hạn của Generics và thiết kế API
    purpose: Tổng hợp các giới hạn và đánh đổi của Generics, bao gồm các ràng buộc liên quan đến xóa kiểu, thông tin kiểu lúc chạy, ngữ cảnh static, tính bất biến và wildcard, để thiết kế API generic thực tế và an toàn.
    relatedKnowledge:
      - GenericLimitationsAndApiDesign
    relatedModules:
      - routeId: JAVA_FUNCTIONAL_PROGRAMMING
        label: Lập trình hàm
        note: Các giao diện hàm (functional interface) chuẩn dùng Generics để biểu diễn rõ quan hệ giữa kiểu đầu vào và đầu ra.
    objectives:
      - Nhận biết các giới hạn quan trọng của ngôn ngữ và các ranh giới không an toàn liên quan đến xóa kiểu, thông tin kiểu lúc chạy, ngữ cảnh static và tính bất biến.
      - Thiết kế API generic an toàn kiểu mà không lạm dụng wildcard hoặc giới hạn kiểu phức tạp.
