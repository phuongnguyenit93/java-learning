    question: "Khi gọi một generic method, compiler có thể dùng thông tin nào để suy luận method type parameter?"
    answers:
      - {id: A, answer: "Chỉ runtime class của các argument object, vì generic type inference diễn ra sau khi bytecode bắt đầu chạy.", explanation: "Sai. Method type inference là quá trình compile time và không chờ runtime class của object."}
      - {id: B, answer: "Các constraint từ argument expression, target type và surrounding invocation context.", explanation: "Đúng. Java kết hợp các constraint compile time phù hợp để suy ra type thỏa generic method invocation."}
