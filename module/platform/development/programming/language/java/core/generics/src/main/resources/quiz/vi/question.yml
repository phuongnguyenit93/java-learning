      - {id: C, answer: "Biến Java thành dynamically typed.", explanation: "Sai. Generics làm compile-time type checking chặt hơn."}
      - {id: D, answer: "Tạo một runtime class mới cho mỗi type argument.", explanation: "Sai. Java Generics dùng type erasure."}
    correctAnswerId: A
