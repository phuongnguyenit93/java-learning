      - {id: D, answer: "Explicit type witness luôn bắt buộc nếu generic method trả về chính type parameter của nó.", explanation: "Sai. Type witness có thể dùng khi cần, nhưng phần lớn lời gọi thông thường cho phép compiler tự suy luận method type argument."}
