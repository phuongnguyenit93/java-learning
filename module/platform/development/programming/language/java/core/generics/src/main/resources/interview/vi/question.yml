  - question: "Khi thiết kế một API generic, bạn quyết định lúc nào dùng named type parameter, bound, wildcard/PECS hay raw boundary như thế nào?"
    answer: "Bắt đầu từ quan hệ kiểu cần biểu diễn. Dùng named <T> khi nhiều vị trí phải giữ cùng một type identity; thêm bound khi T phải cung cấp capability tối thiểu; dùng wildcard khi chỉ cần chấp nhận một family ở use site, với ? extends cho producer và ? super cho consumer; dùng exact List<T> khi cần vừa đọc vừa ghi cùng T. Raw type không phải công cụ thiết kế bình thường mà chỉ nên bị cô lập ở legacy boundary. Mục tiêu là cơ chế đơn giản nhất vẫn diễn đạt đúng relation và giữ type safety."
