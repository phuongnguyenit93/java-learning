  - question: "Những giới hạn chính của Generics với Throwable là gì, và vì sao throws E vẫn có thể hợp lệ?"
    answer: "Java không cho một generic class trực tiếp extends Throwable như Problem<T> extends Exception, và không cho catch một type parameter vì catch matching cần runtime exception type cụ thể. Tuy nhiên type parameter có bound phù hợp có thể xuất hiện trong throws, ví dụ <E extends Exception> ... throws E, để compile-time contract truyền chính xác checked-exception type từ callback ra caller. Đây là type relationship ở compile time chứ không tạo generic exception class ở runtime."
