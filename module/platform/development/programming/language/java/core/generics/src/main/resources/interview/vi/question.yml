  - question: "Nếu generic code cần biết class thật của T ở runtime, vì sao T.class hoặc instanceof T không dùng được và API nên thiết kế thế nào?"
    answer: "T là type variable phục vụ compile-time checking và không tự đại diện cho một runtime Class object độc lập sau erasure, nên T.class và instanceof T không hợp lệ. Nếu operation thật sự cần runtime type information, caller phải truyền nó vào, thường qua Class<T> hoặc một type token phù hợp. Cách này làm requirement runtime trở thành một phần tường minh của API contract thay vì cố phục hồi T từ thông tin đã erase."
