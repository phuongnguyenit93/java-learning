  - question: "Tại sao static member của Box<T> không thể dùng trực tiếp class type parameter T, nhưng static <U> U identity(U value) lại hợp lệ?"
    answer: "Static member thuộc về class runtime duy nhất, không thuộc riêng Box<String> hay Box<Integer>. Nếu static field dùng T của class, không có một T duy nhất để chọn cho shared static state. Static generic method lại tự khai báo U cho từng invocation, nên U không phụ thuộc vào parameterization của Box. Cùng cơ chế erasure cũng giải thích vì sao hai overload chỉ khác List<String> và List<Integer> có thể name-clash sau erasure."
