  - question: "Mô tả type erasure từ source tới runtime. Vì sao List<String> và List<Integer> có thể có cùng runtime class mà compile-time safety vẫn tồn tại?"
    answer: "Compiler dùng type arguments và bounds để kiểm tra source trước. Type variable như T được erase về leftmost bound hoặc Object, còn parameterized type như List<String> được erase về raw type List; compiler chèn cast khi cần để giữ typed view cho caller. Vì parameterization không tạo class runtime riêng, ArrayList<String> và ArrayList<Integer> đều có thể là java.util.ArrayList ở runtime. API inspectRuntimeTypes() cho thấy hai source parameterization khác nhau nhưng getClass() giống nhau."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.TypeErasureAndRuntimeModel/TypeErasureAndRuntimeModel.md", anchor: "erasure-model"}
    apiRelated: {controller: "ErasureController", methodSignature: "inspectRuntimeTypes()"}

  - question: "Type erasure và generic signature metadata có mâu thuẫn nhau không? Vì sao Reflection đôi khi vẫn thấy List<String> dù runtime execution dùng List đã erase?"
    answer: "Không mâu thuẫn. Erasure quyết định kiểu chủ yếu dùng cho thực thi bytecode, ví dụ List<String> erase về List. Đồng thời class file có thể giữ Signature metadata mô tả type parameter/type argument của declaration để compiler, Reflection và tooling đọc lại. Metadata đó không biến runtime object thành một List<String> reified và không có nghĩa JVM kiểm tra từng element là String."
    aiGenerated: true
