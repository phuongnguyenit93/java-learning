  - question: "Nếu bắt buộc tích hợp một legacy API trả raw List, bạn sẽ thiết kế boundary thế nào để phần còn lại của ứng dụng vẫn typed?"
    answer: "Giữ raw value trong một ranh giới tích hợp nhỏ, kiểm tra hoặc chuyển đổi phần tử theo invariant thật của API rồi chỉ trả parameterized type vào phần code có kiểu rõ ràng. Mặc định an toàn hơn là copy sang collection typed mới để không còn raw alias có thể ghi sai kiểu về sau. Nếu bắt buộc zero-copy bằng unchecked cast, phải document invariant mạnh hơn: dữ liệu hiện tại hợp lệ và không còn đường raw nào có thể phá contract sau validation."
