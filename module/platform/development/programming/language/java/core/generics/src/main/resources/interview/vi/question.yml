  - question: "Vì sao không thể new T() trực tiếp trong generic code, và design nào nên dùng khi code thật sự cần tạo instance của T?"
    answer: "T là compile-time type variable; bản thân khai báo <T> không hề yêu cầu mọi type argument phải có một constructor cụ thể, và sau erasure runtime cũng không tự có constructor target chỉ từ T. Vì vậy generic code không thể giả định new T(). Thiết kế thường là nhận chiến lược tạo object từ caller như Factory<T>/supplier-like abstraction, hoặc khi phù hợp nhận explicit type token cho Reflection. Quyết định constructor nằm ở nơi thật sự biết concrete type."
