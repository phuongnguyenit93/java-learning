  - question: "Bridge method là gì, vì sao javac có thể phải sinh nó sau erasure, và nó liên quan gì tới polymorphism?"
    answer: "Erasure có thể làm erased signature của generic supertype khác signature cụ thể mà subclass viết. Ví dụ Mapper<T>.map(T) erase gần thành map(Object), còn StringMapper implement map(String). javac có thể sinh một synthetic bridge map(Object) chuyển tiếp tới map(String), kèm cast, để lời gọi qua erased supertype contract vẫn dispatch đúng implementation. API bridgeMethod() dùng Reflection để quan sát method synthetic/bridge đó."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.TypeErasureAndRuntimeModel/TypeErasureAndRuntimeModel.md", anchor: "bridge-method"}
    apiRelated: {controller: "ErasureController", methodSignature: "bridgeMethod()"}

  - question: "Reifiable và non-reifiable type khác nhau ở điểm nào, và vì sao distinction này quan trọng với runtime type checks?"
    answer: "Reifiable type có runtime representation đủ cho thao tác cần runtime type check, như String, raw List, List<?> hoặc String[]. Non-reifiable type như List<String> hay T không giữ full concrete generic identity theo cách runtime có thể tùy ý xác minh. Điều này đặc biệt quan trọng với array creation và runtime type checks; với cast, target non-reifiable có thể dẫn tới unchecked cast vì JVM không xác minh được full generic target. Java 16+ vẫn cho phép một số parameterized instanceof khi static type có checked casting conversion phù hợp."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.TypeErasureAndRuntimeModel/TypeErasureAndRuntimeModel.md", anchor: "non-reifiable-types"}
