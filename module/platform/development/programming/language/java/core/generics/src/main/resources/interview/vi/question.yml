questions:
  - question: "Generics giải quyết vấn đề gì mà việc viết nhiều class riêng hoặc dùng Object không giải quyết tốt cùng lúc?"
    answer: "Viết riêng từng class giữ type safety nhưng lặp implementation; dùng Object tái sử dụng được code nhưng làm mất thông tin kiểu, buộc caller cast và có thể đẩy lỗi sang runtime. Generics cho phép một declaration như Box<T> biểu diễn cùng logic cho nhiều kiểu trong khi compiler vẫn theo dõi quan hệ kiểu, chặn nhiều sai sót tại compile time và giảm cast thủ công. Điểm cốt lõi là tái sử dụng code mà vẫn giữ type contract rõ ràng."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.GenericsPurpose/GenericsPurpose.md", anchor: "generic-type-purpose"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Phân biệt type parameter và type argument. Vì sao Box<String> không có nghĩa JVM tạo một class Box riêng cho String?"
    answer: "Trong declaration Box<T>, T là type parameter: một type variable do declaration định nghĩa. Trong Box<String>, String là type argument được cung cấp khi sử dụng declaration đó. Box<String> là một parameterized type để compiler kiểm tra kiểu; với Java Generics thông thường, JVM không tạo một class bytecode mới cho từng type argument. Runtime representation chi tiết được giải thích bởi type erasure."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.GenericsPurpose/GenericsPurpose.md", anchor: "type-parameter"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Type inference của generic method diễn ra ở đâu và compiler dựa vào những thông tin nào? Nếu inference thất bại thì điều đó nói lên gì?"
    answer: "Inference diễn ra ở compile time, không phải runtime guessing. Compiler gom constraint từ argument types, target type và các quan hệ generic khác của lời gọi để tìm type argument thỏa tất cả điều kiện. Nếu không tìm được nghiệm phù hợp, lời gọi không compile; explicit type witness chỉ hữu ích khi cần hướng compiler hoặc làm ý định rõ hơn, chứ không thay đổi runtime type system. API inference() minh họa cùng một generic method giữ quan hệ return type khác nhau cho từng lời gọi."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.GenericTypesAndMethods/GenericTypesAndMethods.md", anchor: "type-inference"}
    apiRelated: {controller: "GenericMethodController", methodSignature: "inference()"}

  - question: "Khi nào nên đặt type parameter ở class và khi nào nên khai báo generic method riêng?"
    answer: "Đặt type parameter ở class khi cùng một type identity phải tồn tại xuyên suốt state hoặc nhiều member của object, như Box<T> lưu và trả cùng T. Dùng generic method khi quan hệ kiểu chỉ cần cho một operation, như <T> T echo(T value), để không ép cả class mang một type parameter không cần thiết. Type variable của method có scope riêng và độc lập với type variable của class."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.GenericTypesAndMethods/GenericTypesAndMethods.md", anchor: "generic-method-vs-type"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Tại sao một type parameter không bound không thể gọi doubleValue(), còn <T extends Number> thì có thể? Bound đánh đổi điều gì?"
    answer: "Với <T>, compiler chỉ có thể dựa vào contract chung mà mọi reference type đều có, nên không thể giả định doubleValue() tồn tại. <T extends Number> thu hẹp tập type argument hợp lệ và đổi lại implementation được quyền dùng capability do Number bảo đảm. Bound vì thế vừa hạn chế caller vừa làm contract cho implementation mạnh hơn; bound quá cụ thể sẽ giảm khả năng tái sử dụng, nên chỉ nên yêu cầu capability thuật toán thật sự cần."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.BoundedTypeParameters/BoundedTypeParameters.md", anchor: "bound-api-capability"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Nói 'Generics invariant' có nghĩa mọi quan hệ kế thừa giữa generic types biến mất không?"
    answer: "Không. Invariance chỉ nói quan hệ subtype giữa type arguments không tự được nâng qua cùng một generic constructor: Dog <: Animal không kéo theo Container<Dog> <: Container<Animal>. Nếu chính declarations có inheritance, quan hệ đó vẫn tồn tại với cùng type argument, ví dụ ArrayContainer<String> vẫn là Container<String> khi ArrayContainer<T> implements Container<T>."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.InvarianceAndSubtyping/InvarianceAndSubtyping.md", anchor: "generic-declaration-subtyping"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao Dog là subtype của Animal nhưng List<Dog> không phải subtype của List<Animal>? Điều gì sẽ hỏng nếu Java cho phép phép gán đó?"
    answer: "List<Animal> có quyền nhận bất kỳ Animal nào. Nếu một List<Dog> được xem như List<Animal>, code có thể add một Cat hoặc Animal khác vào object vốn hứa chỉ chứa Dog, làm guarantee của List<Dog> sai. Vì vậy generic types như List là invariant theo type argument mặc định. API invariance() minh họa phép gán exact bị từ chối và cách dùng List<? extends Animal> làm read view an toàn."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.InvarianceAndSubtyping/InvarianceAndSubtyping.md", anchor: "generic-invariance"}
    apiRelated: {controller: "VarianceController", methodSignature: "invariance()"}

  - question: "So sánh array covariance với generic invariance. Vì sao arrays có thể compile rồi ném ArrayStoreException còn generics chặn sớm hơn?"
    answer: "Java arrays là covariant và reified: Integer[] có thể gán cho Number[], nhưng object array vẫn biết component type thật ở runtime nên JVM kiểm tra store và có thể ném ArrayStoreException khi ghi Double vào Integer[]. Generics chọn invariant compile-time checking cho các parameterized types như List<Integer>, vì type arguments phần lớn bị erase và mutable generic structures cần được bảo vệ trước khi runtime. Hai cơ chế đặt điểm kiểm tra an toàn ở thời điểm khác nhau."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.InvarianceAndSubtyping/InvarianceAndSubtyping.md", anchor: "variance-vs-arrays"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "List<?> và List<Object> khác nhau về contract như thế nào, đặc biệt khi ghi dữ liệu?"
    answer: "List<Object> có element type chính xác là Object, nên có thể thêm String, Integer hay object khác vì tất cả đều là subtype của Object. List<?> có một element type cụ thể nhưng caller không biết đó là gì; nó có thể thực sự là List<String> hoặc List<Integer>. Vì không biết type thật, caller chỉ đọc an toàn dưới dạng Object và không thể thêm một concrete value tùy ý."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.WildcardsAndPECS/WildcardsAndPECS.md", anchor: "wildcard-vs-object"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Wildcard ? giải quyết bài toán gì khác với việc khai báo thêm một type parameter T?"
    answer: "Wildcard phù hợp khi API chỉ cần nói 'đây là một generic value của kiểu nào đó' mà không cần đặt tên hoặc liên kết type identity đó với chỗ khác. Named type parameter hữu ích khi cùng một kiểu phải nối nhiều parameter, return type hoặc constraint. Ví dụ sizeOf(List<?>) chỉ cần thao tác độc lập với element type nên ? diễn đạt intent gọn hơn <T> int sizeOf(List<T>)."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.WildcardsAndPECS/WildcardsAndPECS.md", anchor: "wildcard-vs-type-parameter"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Giải thích vì sao List<? extends Number> đọc ra Number an toàn nhưng không thể add Integer, dù Integer là Number."
    answer: "? extends Number nghĩa là list có một element type cụ thể chưa biết nhưng type đó là Number hoặc subtype của Number. Vì mọi khả năng đều là Number, đọc ra Number an toàn. Nhưng list thật có thể là List<Double>; nếu cho add Integer thì contract của List<Double> bị phá. Hạn chế này đến từ việc unknown subtype phải được giữ nhất quán, không phải vì collection trở thành bất biến hay hoàn toàn read-only."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.WildcardsAndPECS/WildcardsAndPECS.md", anchor: "extends-wildcard"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Giải thích vì sao List<? super Integer> cho phép add Integer nhưng khi đọc thường chỉ chắc chắn được Object."
    answer: "? super Integer nghĩa là element type thật là Integer hoặc một supertype của Integer, chẳng hạn Number hay Object. Integer có thể được ghi an toàn vào mọi khả năng đó. Khi đọc, list thật có thể là List<Object> và có thể chứa các Object khác không phải Number, nên type duy nhất luôn an toàn cho caller là Object. Lower-bounded wildcard đổi độ chính xác khi đọc lấy khả năng ghi linh hoạt."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.WildcardsAndPECS/WildcardsAndPECS.md", anchor: "super-wildcard"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Hãy dùng PECS để giải thích signature copy(List<? extends T> source, List<? super T> target). Vì sao hai phía đi ngược hướng?"
    answer: "Source produce T cho method đọc nên ? extends T cho phép source là List<T> hoặc list của subtype T mà vẫn đọc mỗi phần tử dưới dạng T. Target consume T do method ghi vào nên ? super T cho phép target là List<T> hoặc list của supertype T, nơi mọi T đều có thể được thêm an toàn. API producerConsumer() minh họa List<Integer> làm producer và List<Number> làm consumer trong cùng một phép copy."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.WildcardsAndPECS/WildcardsAndPECS.md", anchor: "pecs-rule"}
    apiRelated: {controller: "WildcardController", methodSignature: "producerConsumer()"}

  - question: "PECS có nên được áp dụng máy móc cho mọi generic parameter và return type không?"
    answer: "Không. PECS hữu ích khi một boundary chủ yếu đọc T hoặc ghi T. Nếu parameter cần vừa đọc chính xác T vừa ghi T, exact type như List<T> thường rõ hơn. Nếu wildcard không mở rộng tập caller hợp lệ, nó chỉ làm signature khó đọc. Wildcard ở public return type cũng thường đẩy unknown type sang caller, nên chỉ nên dùng khi đó thực sự là contract cần biểu diễn."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.WildcardsAndPECS/WildcardsAndPECS.md", anchor: "pecs-api-design"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Wildcard capture giải quyết vấn đề gì? Vì sao helper <T> có thể swap phần tử của List<?> trong khi code trực tiếp với ? thường không ghi lại được?"
    answer: "List<?> có một element type cụ thể nhưng chưa biết, và compiler phải giữ type đó nhất quán. Một helper như <T> void swapHelper(List<T>) cho phép compiler capture unknown type thành một type variable nội bộ T; sau đó giá trị đọc ra là T và có thể ghi lại đúng vào cùng List<T>. Capture không biến unknown thành Object và không làm runtime cast magic; nó chỉ giúp compiler đặt tên cho cùng một unknown type trong phạm vi helper."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.WildcardsAndPECS/WildcardsAndPECS.md", anchor: "wildcard-capture"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Raw type khác List<?> thế nào và vì sao Java vẫn giữ raw types?"
    answer: "List<?> vẫn là parameterized type an toàn: có một element type cụ thể nhưng bên gọi không biết chính xác đó là gì. Raw List bỏ type argument và làm suy yếu hoặc bỏ qua một phần generic checking ở những thao tác nhất định. Java giữ raw type chủ yếu để tương thích với code và binary có từ trước Generics. Vì vậy raw type là lối tương thích với mã cũ, không phải cách viết ngắn thay cho wildcard trong code mới."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.RawTypesAndLegacyBoundaries/RawTypesAndLegacyBoundaries.md", anchor: "raw-type-compatibility"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Một unchecked warning đang nói gì về bằng chứng type safety, và vì sao suppress warning ngay lập tức là nguy hiểm?"
    answer: "Unchecked warning nghĩa là compiler không thể chứng minh đầy đủ một generic operation là type-safe, thường vì raw type, unchecked cast hoặc non-reifiable boundary. Code có thể vẫn chạy đúng nếu developer biết một invariant mà compiler không biết, nhưng warning đánh dấu nơi guarantee đã yếu đi. Suppress quá sớm che mất trust boundary; nên trước hết xác định nguồn dữ liệu, validate hoặc convert nếu cần, rồi chỉ cô lập suppression ở phạm vi nhỏ có invariant rõ ràng."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.RawTypesAndLegacyBoundaries/RawTypesAndLegacyBoundaries.md", anchor: "unchecked-warning"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Heap pollution là gì và vì sao lỗi có thể xuất hiện rất xa dòng code gây ra pollution?"
    answer: "Heap pollution xảy ra khi một variable của parameterized type cuối cùng tham chiếu tới dữ liệu không phù hợp với parameterized contract của nó. Raw type hoặc unchecked operation có thể ghi sai kiểu mà runtime chưa fail ngay; lỗi chỉ lộ ra sau đó khi typed code đọc giá trị và compiler-inserted cast thất bại. API heapPollution() cố ý ghi Integer qua raw List vào List<String>, rồi ClassCastException xuất hiện ở typed read để cho thấy khoảng cách giữa nguyên nhân và triệu chứng."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.RawTypesAndLegacyBoundaries/RawTypesAndLegacyBoundaries.md", anchor: "heap-pollution"}
