  - question: "Vì sao Java cấm new T[] và new List<String>[], trong khi String[] hoàn toàn hợp lệ?"
    answer: "Array là reified và covariant: runtime phải biết component type để kiểm tra mỗi phép store. T và List<String> là non-reifiable trong các ngữ cảnh này, nên JVM không có đủ concrete component information để thực hiện array store contract một cách đầy đủ. Vì vậy Java cấm tạo các generic array đó. List<?>[] hợp lệ vì List<?> là reifiable, nhưng collection thường vẫn là lựa chọn đơn giản hơn cho generic code."
