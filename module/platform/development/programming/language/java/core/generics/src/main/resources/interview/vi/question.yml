  - question: "Vì sao overload process(List<String>) và process(List<Integer>) gây name clash sau erasure? Điều này ảnh hưởng thiết kế API thế nào?"
    answer: "Cả List<String> và List<Integer> đều erase về List, nên hai method cùng trở thành signature process(List) ở mức JVM và không thể cùng tồn tại. Khi thiết kế API, không nên dựa vào generic argument bị erase để phân biệt overload; hãy dùng tên method khác, parameter runtime khác thực sự phân biệt được, hoặc thiết kế abstraction khác thể hiện intent rõ hơn."
