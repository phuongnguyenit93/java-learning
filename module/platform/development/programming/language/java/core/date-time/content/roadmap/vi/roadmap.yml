# <roadmap-schema>
# Cấu trúc Roadmap Module
# schema-version: 1
#
# YAML CONTRACT
# roadmap: Danh sách milestone cấp cao của roadmap cho language hiện tại.
#
# - id [string, required]: ID ổn định và duy nhất của milestone trong roadmap language hiện tại.
# - title [string, required]: Tên milestone hiển thị cho learner.
# - purpose [string, required]: Milestone này tồn tại để learner hiểu hoặc đạt được điều gì.
# - dependsOn [list, optional]: Danh sách id milestone prerequisite khi dependency không thể hiện đủ chỉ bằng thứ tự item.
# - objectives [list, optional]: Các learning objective cấp milestone; không dùng để liệt kê mọi fact/API/syntax nhỏ.
# - relatedKnowledge [list, optional]: Danh sách Knowledge category id trong chính module hiện tại hỗ trợ milestone. Portal hiển thị danh sách này ở phía đối diện milestone và click item sẽ điều hướng sang Knowledge category tương ứng.
# - relatedModules [list, optional]: Các module liên quan hiển thị ở Level 2 của Portal. Mỗi item dùng routeId bắt buộc và có thể có label/note localized; relation này chỉ để điều hướng, không tạo child milestone hoặc thay đổi learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - Topic/module này là gì?
#   - Vì sao nó tồn tại?
#   - Không có nó thì learner gặp vấn đề gì?
# FOUNDATION
#   - Learner cần prerequisite hoặc mental model nào trước?
# CORE MODEL
#   - Những abstraction hoặc building block lớn nào tạo nên chủ đề này?
# MECHANICS
#   - Nó hoạt động như thế nào ở mức language/runtime/API phù hợp với module?
# USAGE
#   - Nó được dùng như thế nào trong code thực tế?
# DECISION / TRADE-OFF
#   - Khi nào nên chọn cơ chế này thay vì cơ chế khác?
#   - Khi nào không nên dùng?
# FAILURE / PITFALL
#   - Những sai lầm, compile-time failure hoặc runtime failure nào đáng biết?
# INTEGRATION
#   - Chủ đề này kết nối với những concept/module lân cận nào?
# SYNTHESIS
#   - Sau cùng learner phải giữ mental model end-to-end nào?
#
# Mỗi language tự chịu trách nhiệm cho roadmap của chính nó. Không suy luận hoặc đồng bộ cấu trúc từ roadmap của language khác.
# Thứ tự item trong roadmap chính là thứ tự học mặc định. Chỉ dùng dependsOn khi cần biểu diễn dependency rõ hơn thứ tự tuyến tính.
# Skeleton không nên ép mọi module có đúng bấy nhiêu node. Nó là framework suy nghĩ chứ không phải template cứng.
# </roadmap-schema>

roadmap:
  - id: date-time-model
    title: Ngày và thời gian là gì, vì sao cần nhiều mô hình?
    purpose: Hiểu dữ liệu ngày và thời gian không phải một loại dấu thời gian duy nhất; ngày theo lịch, giờ trong ngày, ngày-giờ cục bộ, mốc trên dòng thời gian, độ lệch UTC và quy tắc múi giờ trả lời những câu hỏi khác nhau, vì vậy java.time cung cấp nhiều kiểu chuyên biệt thay vì một kiểu dùng cho mọi trường hợp.
    relatedKnowledge:
      - MentalModel
    objectives:
      - Chọn kiểu ngày-giờ từ ý nghĩa của dữ liệu nghiệp vụ thay vì từ định dạng chuỗi đang nhìn thấy.
      - Phân biệt giá trị theo lịch của con người với một mốc chính xác trên dòng thời gian toàn cục.
      - Hiểu các kiểu chính của java.time là bất biến và thao tác thay đổi sẽ tạo giá trị mới.
  - id: local-date-and-time
    title: Ngày, giờ và ngày-giờ cục bộ
    purpose: Hiểu LocalDate, LocalTime và LocalDateTime biểu diễn các giá trị theo lịch hoặc đồng hồ cục bộ; chúng hữu ích khi nghiệp vụ cố ý chưa gắn múi giờ, nhưng không tự xác định một mốc duy nhất trên dòng thời gian toàn cục.
    relatedKnowledge:
      - LocalDate
      - LocalTime
      - LocalDateTime
    objectives:
      - Dùng LocalDate khi nghiệp vụ chỉ quan tâm ngày và LocalTime khi chỉ quan tâm giờ trong ngày.
      - Dùng LocalDateTime cho dữ liệu nghiệp vụ cố ý chưa gắn múi giờ.
      - Giải thích vì sao cần thêm thông tin múi giờ hoặc độ lệch UTC trước khi ánh xạ LocalDateTime thành một Instant.
      - Nhận biết việc gắn múi giờ sau đó có thể gặp thời điểm không tồn tại hoặc không duy nhất; nguyên nhân sẽ được giải thích khi học quy tắc múi giờ.
  - id: instant-and-timeline
    title: Instant và dòng thời gian toàn cục
    purpose: Hiểu Instant biểu diễn một mốc chính xác trên dòng thời gian dựa trên UTC, độc lập với cách con người nhìn mốc đó dưới ngày, giờ và múi giờ cụ thể.
    relatedKnowledge:
      - Instant
    objectives:
      - Dùng Instant cho thời điểm sự kiện của hệ thống, sắp xếp theo thời gian và ranh giới lưu trữ khi cần một mốc không mơ hồ.
      - Hiểu số giây hoặc mili giây tính từ mốc gốc Unix (epoch) chỉ là cách biểu diễn bằng số của một mốc trên cùng dòng thời gian.
      - Chuyển đổi có chủ đích giữa Instant và cách biểu diễn ngày-giờ có múi giờ cho người dùng.
  - id: offsets-and-zone-rules
    title: ZoneOffset, ZoneId và quy tắc múi giờ
    purpose: Hiểu một độ lệch UTC cụ thể như +07:00 không đồng nghĩa với một múi giờ theo vùng như Asia/Ho_Chi_Minh; ZoneId có thể mang tập quy tắc thay đổi theo lịch sử hoặc chính sách, còn ZoneOffset chỉ mô tả một độ lệch cụ thể.
    relatedKnowledge:
      - ZoneOffsetZoneId
    objectives:
      - Phân biệt ZoneOffset, ZoneId và vai trò của ZoneRules.
      - Hiểu vì sao múi giờ theo vùng có thể thay đổi độ lệch theo thời điểm và tạo khoảng trống hoặc thời điểm lặp, đặc biệt khi áp dụng giờ mùa hè (DST).
      - Tránh coi một độ lệch UTC hiện tại là thay thế đầy đủ cho danh tính và quy tắc của múi giờ.
  - id: offsets-zones-and-zoned-values
    title: OffsetDateTime, ZonedDateTime và chuyển đổi múi giờ
    purpose: Hiểu cách OffsetDateTime và ZonedDateTime gắn ngữ cảnh độ lệch hoặc quy tắc múi giờ vào ngày-giờ, từ đó phân biệt giữ nguyên cùng một mốc thời gian với giữ nguyên cùng các trường ngày-giờ cục bộ.
    relatedKnowledge:
      - ZonedOffsetDateTime
    objectives:
      - Chọn OffsetDateTime khi giá trị cần mang một độ lệch UTC cụ thể và ZonedDateTime khi cần giữ danh tính cùng quy tắc của múi giờ theo vùng.
      - Phân biệt chuyển đổi giữ nguyên Instant với việc diễn giải lại cùng LocalDateTime trong một múi giờ khác.
      - Nhận biết hai giá trị có thể có ngày-giờ cục bộ khác nhau nhưng vẫn biểu diễn cùng một Instant.
  - id: duration-and-period
    title: Duration và Period — thời lượng trôi qua và khoảng theo lịch
    purpose: Hiểu Duration và Period mô hình hóa hai loại khoảng thời gian khác nhau — thời lượng đo trên dòng thời gian và lượng năm/tháng/ngày theo lịch — nên không thể thay thế nhau một cách máy móc.
    relatedKnowledge:
      - DurationPeriod
    objectives:
      - Dùng Duration cho lượng thời gian đo bằng giờ/phút/giây trên dòng thời gian.
      - Dùng Period cho lượng năm/tháng/ngày chịu ảnh hưởng bởi quy tắc của lịch.
      - Giải thích vì sao 24 giờ không phải lúc nào cũng tương đương một ngày theo lịch khi có thay đổi múi giờ hoặc DST.
  - id: formatting-and-parsing
    title: Định dạng và phân tích chuỗi ngày-giờ
    purpose: Hiểu DateTimeFormatter là ranh giới chuyển đổi giữa giá trị ngày-giờ và văn bản; định dạng hiển thị không làm thay đổi ý nghĩa thời gian của chính giá trị.
    relatedKnowledge:
      - FormattingParsing
    relatedModules:
      - routeId: JAVA_LOCALIZATION
        label: Bản địa hóa
        note: Cách hiển thị ngày và giờ theo Locale thuộc mô hình bản địa hóa rộng hơn và được học sâu trong mô-đun Bản địa hóa.
    objectives:
      - Chọn DateTimeFormatter có sẵn hoặc mẫu tùy chỉnh với quy ước đầu vào/đầu ra rõ ràng.
      - Hiểu việc phân tích chuỗi phải tạo đúng loại giá trị ngày-giờ mà dữ liệu thực sự mang ý nghĩa.
      - Tách quy tắc định dạng và phân tích chuỗi khỏi ý nghĩa cốt lõi của giá trị thời gian.
  - id: arithmetic-comparison-and-dst
    title: Phép toán, so sánh và ảnh hưởng của quy tắc múi giờ
    purpose: Hiểu kết quả cộng/trừ, tính khoảng cách và so sánh phụ thuộc vào loại giá trị đang dùng; với dữ liệu có múi giờ, quy tắc lịch và chuyển đổi DST có thể làm phép toán theo ngày khác phép toán theo số giờ thực tế.
    relatedKnowledge:
      - ArithmeticComparison
    objectives:
      - Chọn phép toán theo dòng thời gian hoặc theo lịch một cách có chủ đích.
      - Dùng plus/minus, ChronoUnit, Duration hoặc Period theo đúng ý nghĩa cần đo.
      - So sánh đúng loại giá trị và nhận biết thời điểm cục bộ không hợp lệ hoặc không duy nhất quanh chuyển đổi DST.
      - Tách quy tắc ngày làm việc của nghiệp vụ khỏi phép toán ngày-giờ chung của thư viện.
  - id: clock-and-testability
    title: Clock và thời gian có thể kiểm thử
    purpose: Hiểu Clock là nguồn cung cấp thời điểm “hiện tại” có thể truyền vào mã nguồn, giúp tách logic phụ thuộc thời gian khỏi đồng hồ hệ thống và làm kiểm thử có kết quả ổn định.
    relatedKnowledge:
      - Clock
    objectives:
      - Dùng Clock cố định hoặc Clock được truyền vào để kiểm thử logic phụ thuộc thời gian một cách xác định.
      - Tránh gọi trực tiếp now() rải rác trong logic nghiệp vụ khi thời điểm hiện tại là một phụ thuộc cần kiểm soát.
  - id: legacy-interop-and-synthesis
    title: Tương tác với API ngày-giờ cũ và tổng hợp mô hình
    purpose: Kết nối java.time với Date/Calendar và các ranh giới hệ thống cũ mà không để múi giờ mặc định hoặc chuyển đổi ngầm làm thay đổi ý nghĩa dữ liệu, sau đó tổng hợp cách chọn mô hình ngày-giờ phù hợp từ đầu đến cuối.
    relatedKnowledge:
      - LegacyInteropPitfalls
    objectives:
      - Chuyển đổi giữa Date/Calendar và java.time tại ranh giới rõ ràng, ưu tiên Instant khi cần nối hai mô hình.
      - Nhận biết rủi ro của múi giờ mặc định hệ thống và quyết định rõ khi nào lưu Instant, ngày-giờ cục bộ hoặc thông tin múi giờ.
      - Chọn mô hình ngày-giờ nhỏ nhất nhưng vẫn bảo toàn đầy đủ ý nghĩa nghiệp vụ.
