  - question: >-
      Khi thiết kế một luồng xử lý ngày-giờ từ đầu đến cuối, bạn sẽ quyết định kiểu dữ liệu, múi giờ, Duration/Period, định dạng văn bản, Clock, giá trị mặc định hệ thống, API cũ và cách lưu trữ theo thứ tự nào để tránh làm sai ý nghĩa nghiệp vụ?
    answer: >-
      Bắt đầu từ ý nghĩa mà nghiệp vụ thật sự sở hữu rồi chọn kiểu hẹp nhất phù hợp: LocalDate/LocalTime/LocalDateTime cho dữ kiện cục bộ, Instant cho mốc trên dòng thời gian, OffsetDateTime khi có độ lệch cụ thể và ZonedDateTime khi ZoneId theo vùng cùng quy tắc của nó là một phần của ý nghĩa. Chọn Duration cho thời lượng thực đã trôi qua và Period hoặc phép toán ngày khi yêu cầu mang ý nghĩa theo lịch. Chỉ thêm ZoneId khi nghiệp vụ thật sự có múi giờ; không âm thầm dùng ZoneId.systemDefault() nếu đó không phải một phần của hợp đồng. Tách DateTimeFormatter và Locale thành chính sách ở ranh giới văn bản, truyền Clock hoặc InstantSource vào nơi cần "bây giờ" để kiểm thử có kết quả xác định, và chuyển API cũ sang java.time ngay tại ranh giới khi có thể. Cuối cùng, thiết kế lược đồ lưu trữ đủ thông tin để phục hồi đúng ý nghĩa ban đầu, kể cả ZoneId cho lịch tương lai khi cần, thay vì áp dụng máy móc quy tắc "mọi thứ đều lưu UTC".
