  - question: >-
      Vì sao LocalDateTime không nên được gọi là một dấu thời gian toàn cục?
    answer: >-
      LocalDateTime có ngày + giờ nhưng không có ZoneId hay ZoneOffset, nên cùng các trường cục bộ có thể ánh xạ tới các Instant khác nhau ở các vùng khác nhau. Trong khoảng trống (gap) của DST, một giờ cục bộ có thể không tồn tại; trong chồng lặp (overlap), nó có thể xảy ra hai lần. Vì vậy nó không đủ để sắp thứ tự hoặc định danh sự kiện trên toàn cục nếu chưa có ngữ cảnh.
