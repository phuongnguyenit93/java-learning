      ZoneId có thể biểu diễn múi giờ theo độ lệch cố định hoặc múi giờ theo vùng như thế nào, và ZoneId.SHORT_IDS nên được hiểu ra sao?
    answer: >-
      ZoneId có thể đại diện cho một múi giờ cố định theo độ lệch hoặc một vùng có tên với ZoneRules thay đổi theo lịch sử/chính sách. ZoneId.SHORT_IDS chỉ là bảng ánh xạ bí danh phục vụ tương thích; nó không làm cho lời gọi một tham số như ZoneId.of("EST") mặc nhiên hợp lệ. Với dữ liệu nghiệp vụ, định danh vùng rõ ràng như Europe/Paris thường an toàn hơn mã viết tắt ba chữ mơ hồ.
