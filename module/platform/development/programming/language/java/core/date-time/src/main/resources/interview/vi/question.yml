  - question: >-
      Hãy giải thích ranh giới giữa hệ lịch ISO, hệ lịch không phải ISO và Locale trong java.time.
    answer: >-
      LocalDate, LocalDateTime và các kiểu Local* tương ứng dùng hệ lịch ISO; đổi Locale không biến chúng thành một hệ lịch khác. Locale chủ yếu ảnh hưởng cách trình bày và phân tích văn bản. Khi nghiệp vụ thật sự dùng hệ lịch khác ISO, java.time.chrono cung cấp các kiểu và API riêng như ChronoLocalDate; đó là nhánh nâng cao, không phải một cấu hình của LocalDate.
