      Trình điều khiển hỗ trợ JDBC 4.2 có ánh xạ chuẩn để setObject/getObject trực tiếp với LocalDate, LocalTime, LocalDateTime, OffsetTime và OffsetDateTime, nên mã mới không bắt buộc đi vòng qua java.sql.Date/Time/Timestamp. Tuy vậy kiểu SQL, độ chính xác và ý nghĩa múi giờ vẫn thuộc hợp đồng của cơ sở dữ liệu/lược đồ/trình điều khiển. Không nên suy rằng ánh xạ trực tiếp Instant giống nhau ở mọi nhà cung cấp.
