  - question: >-
      Một ca làm từ 22:00 đến 06:00 bị tính duration âm khi chỉ dùng LocalTime. Bạn chẩn đoán vấn đề thế nào?
    answer: >-
      LocalTime chỉ biết giờ trong ngày và phép toán của nó quay vòng trong 24 giờ; nó không biết 06:00 là cùng ngày hay ngày hôm sau. Muốn tính thời lượng đã trôi qua phải bổ sung ngày hoặc một quy tắc rõ ràng. Nếu ca làm thuộc vùng có DST thì LocalDateTime vẫn chưa đủ; cần ZoneId/ZonedDateTime hoặc quy về Instant trước khi đo thời lượng đã trôi qua trên dòng thời gian.
