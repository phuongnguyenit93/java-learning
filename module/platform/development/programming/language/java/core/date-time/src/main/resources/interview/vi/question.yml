  - question: >-
      Một form đã có ngày và giờ nhưng người dùng chỉ chọn múi giờ ở bước sau. Vì sao LocalDateTime là mô hình hợp lý ở giai đoạn này, và nó chưa đảm bảo điều gì?
    answer: >-
      LocalDateTime giữ đúng các trường ngày và giờ cục bộ mà ứng dụng đã biết, nhưng chưa tự gắn ZoneId hay ZoneOffset. Vì vậy nó phù hợp khi việc ánh xạ lên dòng thời gian cố ý chưa xảy ra. Nó chưa xác định một Instant duy nhất, chưa đủ để sắp xếp sự kiện toàn cục và có thể gặp gap/overlap khi sau này được gắn với một vùng có quy tắc DST.
