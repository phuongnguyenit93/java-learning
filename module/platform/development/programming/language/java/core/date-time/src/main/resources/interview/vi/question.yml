  - question: >-
      Khi migrate mã JDBC cũ, những bẫy nào cần nhớ với java.sql.Date, java.sql.Time và java.sql.Timestamp?
    answer: >-
      java.sql.Date nên chuyển theo LocalDate và java.sql.Time theo LocalTime; Date.toInstant() và Time.toInstant() không cung cấp một Instant hợp lệ mà ném UnsupportedOperationException vì thiếu phần thời gian hoặc ngày tương ứng. Time.valueOf(LocalTime) cũng không giữ phần nano. java.sql.Timestamp có chuyển đổi trực tiếp tới Instant và LocalDateTime, nhưng hai hướng đó mang ý nghĩa khác nhau. Với JDBC 4.2, mã mới nên ưu tiên ánh xạ java.time trực tiếp khi trình điều khiển hỗ trợ thay vì ép mọi giá trị đi qua lớp bọc cũ.
