  - question: >-
      Khi nhận một yêu cầu nghiệp vụ mới, bạn chọn kiểu thời gian theo nguyên tắc nào?
    answer: >-
      Hãy hỏi dữ liệu thật sự biết gì và chỉ mô hình đúng phần đó. LocalDate/LocalTime/LocalDateTime giữ các dữ kiện lịch hoặc đồng hồ cục bộ; Instant giữ một mốc trên dòng thời gian; ZonedDateTime giữ các trường cục bộ cùng ZoneId và quy tắc vùng; OffsetDateTime giữ độ lệch cụ thể nhưng không biết vùng. Các kiểu như YearMonth hay MonthDay giúp tránh tự tạo ngày hoặc năm giả chỉ để vừa một kiểu lớn hơn.
