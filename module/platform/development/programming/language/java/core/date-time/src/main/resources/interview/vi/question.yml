questions:
  - question: >-
      Vì sao Java cần nhiều mô hình ngày-giờ thay vì gom mọi thứ vào một kiểu "dấu thời gian" chung?
    answer: >-
      Vì ngày trên lịch, giờ trong ngày, ngày-giờ cục bộ, một Instant trên dòng thời gian và quy tắc múi giờ trả lời các câu hỏi khác nhau. Dùng một kiểu chung thường hoặc làm mất ngữ cảnh cần thiết, hoặc buộc ta tự tạo thêm dữ liệu mà nghiệp vụ không sở hữu. Thiết kế tốt chọn kiểu giữ đúng ý nghĩa: ví dụ LocalDate cho ngày lịch, Instant cho sự kiện đã xảy ra, ZonedDateTime khi quy tắc vùng là một phần của ý nghĩa.
