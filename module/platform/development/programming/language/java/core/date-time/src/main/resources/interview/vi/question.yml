  - question: >-
      Vì sao một lỗi ngày-giờ có thể chỉ xuất hiện sau khi triển khai dù chạy đúng trên máy lập trình viên?
    answer: >-
      Mã dùng múi giờ mặc định hệ thống có thể nhận múi giờ khác giữa máy phát triển, CI, container và môi trường thực tế. Cùng một Instant quanh nửa đêm còn có thể ánh xạ thành LocalDate khác nhau theo múi giờ. Múi giờ nghiệp vụ nên được truyền hoặc cấu hình rõ ràng; chỉ dùng giá trị mặc định khi chính múi giờ của môi trường là một phần có chủ đích của hợp đồng.
