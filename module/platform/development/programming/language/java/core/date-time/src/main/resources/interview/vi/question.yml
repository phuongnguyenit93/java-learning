  - question: >-
      Những rủi ro nào xuất hiện khi hệ thống lưu hoặc truyền epoch time dưới dạng một giá trị số thô?
    answer: >-
      Một giá trị số thô không tự nói đơn vị là giây, mili giây, micro giây hay nano giây; nhầm đơn vị có thể tạo dấu thời gian lệch cực lớn. Chuyển đổi như toEpochMilli còn có thể mất độ chính xác nhỏ hơn mili giây. Lược đồ/giao thức nên ghi rõ đơn vị hoặc dùng cách biểu diễn văn bản chuẩn có hợp đồng xác định.
