  - question: >-
      Tại sao LocalDate.of(2026, 1, 31).plusMonths(1) không đơn giản là cộng một số ngày cố định, và nếu nghiệp vụ muốn quy tắc khác thì làm gì?
    answer: >-
      plusMonths là phép toán theo lịch: trước hết chuyển sang tháng đích rồi điều chỉnh ngày về một ngày hợp lệ, nên 31/01/2026 + 1 tháng trở thành 28/02/2026. Nó không có nghĩa "cộng N giây". Nếu nghiệp vụ muốn ý nghĩa khác, ví dụ từ chối hoặc chuyển phần dư sang tháng tiếp theo, quy tắc đó phải được cài đặt và kiểm tra riêng thay vì suy từ hành vi mặc định của JDK.
