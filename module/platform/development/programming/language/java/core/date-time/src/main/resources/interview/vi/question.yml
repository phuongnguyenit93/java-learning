  - question: >-
      Hãy thiết kế lưu trữ bền vững cho ba loại dữ liệu: sự kiện đã xảy ra, lịch tương lai gắn vùng và ngày/giờ nghiệp vụ cục bộ.
    answer: >-
      Sự kiện đã xảy ra thường nên lưu mốc trên dòng thời gian như Instant hoặc giá trị hướng UTC. Lịch tương lai theo địa điểm cần giữ các trường cục bộ + ZoneId nếu quy tắc vùng là một phần của ý định. Các dữ kiện cục bộ như ngày sinh hoặc giờ mở cửa nên giữ LocalDate/LocalTime thay vì ép thành Instant. Mọi lựa chọn còn phải xác định kiểu cơ sở dữ liệu, độ chính xác và đọc lại ý nghĩa; "luôn lưu mọi thứ UTC" không phải quy tắc đúng cho mọi nghiệp vụ.
