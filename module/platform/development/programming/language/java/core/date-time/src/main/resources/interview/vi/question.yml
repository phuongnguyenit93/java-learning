  - question: >-
      Vì sao TemporalAdjusters không nên bị dùng như một bộ xử lý lịch nghiệp vụ?
    answer: >-
      TemporalAdjusters cung cấp cơ chế lịch tổng quát như ngày cuối tháng hay thứ Hai kế tiếp. "Ngày làm việc tiếp theo" còn phụ thuộc cuối tuần, ngày lễ, quốc gia, sàn giao dịch, chính sách công ty hoặc mốc chốt giờ. Những quy tắc đó thuộc chính sách ứng dụng và nên được được đóng gói trong lịch nghiệp vụ hoặc dịch vụ riêng.
