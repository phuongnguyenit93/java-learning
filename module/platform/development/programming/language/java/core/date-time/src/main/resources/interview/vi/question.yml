  - question: >-
      Vì sao một ngày sinh nên là LocalDate thay vì LocalDateTime với giờ 00:00?
    answer: >-
      Nếu nghiệp vụ chỉ biết ngày thì 00:00 là dữ liệu do mã tự tạo. Trường giả đó có thể rò vào dữ liệu tuần tự hóa, truy vấn cơ sở dữ liệu hoặc các bước chuyển đổi múi giờ và làm xuất hiện câu hỏi vô nghĩa như "sinh nhật xảy ra ở Instant nào". LocalDate diễn đạt chính xác hơn vì cố ý không chứa giờ trong ngày hay múi giờ.
