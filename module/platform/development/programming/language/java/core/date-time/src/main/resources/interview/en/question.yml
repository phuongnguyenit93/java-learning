  - question: >-
      When migrating legacy JDBC code, what traps should you remember around java.sql.Date, java.sql.Time, and java.sql.Timestamp?
    answer: >-
      java.sql.Date naturally bridges to LocalDate and java.sql.Time to LocalTime; Date.toInstant() and Time.toInstant() throw UnsupportedOperationException because those SQL types lack the corresponding time-of-day or date information. Time.valueOf(LocalTime) also does not preserve the nanosecond fraction. java.sql.Timestamp has direct bridges to both Instant and LocalDateTime, but those paths express different semantics. With JDBC 4.2, new code should prefer direct java.time mappings when the driver supports them instead of forcing every value through legacy wrappers.
