questions:
  - question: >-
      Why does Java need several date-time models instead of one generic "timestamp" type?
    answer: >-
      A calendar date, a time-of-day, a local date-time, an instant on the timeline, and time-zone rules answer different questions. Forcing them into one type usually either loses required context or invents context the domain never owned. A good design chooses the type that preserves the intended meaning, such as LocalDate for a calendar date, Instant for an occurred event, or ZonedDateTime when regional rules are part of the value.
