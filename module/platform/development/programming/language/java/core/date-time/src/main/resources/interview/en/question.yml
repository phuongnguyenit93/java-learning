  - question: >-
      When you receive a new business requirement, what principle should guide your choice of temporal type?
    answer: >-
      Ask what the data actually knows and model only that. LocalDate, LocalTime, and LocalDateTime represent local calendar or wall-clock facts; Instant represents one global timeline point; ZonedDateTime carries local fields plus ZoneId/rules; OffsetDateTime carries one concrete offset without a region. Types such as YearMonth and MonthDay avoid inventing a fake day or year just to fit a larger type.
