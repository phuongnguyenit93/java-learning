  - question: >-
      Why do immutability and value semantics in java.time matter in production code?
    answer: >-
      Operations such as plus, minus, and with return new values instead of mutating the original object, which reduces hidden side effects when date-time values cross layers and makes reasoning easier. The main types should be treated as values, so code should follow their equality contracts rather than rely on object identity. A common migration bug from mutable APIs is calling plusDays(...) and forgetting to keep the returned value.
