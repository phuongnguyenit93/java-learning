  - question: >-
      Explain the boundary among ISO chronology, non-ISO chronology, and Locale in java.time.
    answer: >-
      LocalDate, LocalDateTime, and the corresponding Local* concrete types use the ISO calendar system; changing Locale does not switch them to another chronology. Locale mainly affects presentation and parsing of text. When a domain genuinely uses a non-ISO calendar, java.time.chrono provides separate abstractions and types such as ChronoLocalDate; that is an advanced branch, not a configuration option of LocalDate.
