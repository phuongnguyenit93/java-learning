  - question: >-
      When designing a time range for event filtering, why is [start, end) often a useful convention?
    answer: >-
      java.time does not impose one universal core Interval type, so inclusive/exclusive boundaries must be defined by the domain. A half-open range [start, end) lets adjacent ranges meet without double-counting the boundary and makes splitting or composing windows simpler. For a calendar date in a zone, derive the two boundaries with day.atStartOfDay(zone) and day.plusDays(1).atStartOfDay(zone) instead of inventing 00:00/23:59:59...; atStartOfDay consults the zone rules, including start-of-day gaps and the rare case where an entire local date is skipped. The most important requirement is an explicit and consistent boundary contract.
