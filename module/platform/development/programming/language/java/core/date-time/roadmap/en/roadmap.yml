# <roadmap-schema>
# Module Roadmap Structure
# schema-version: 1
#
# YAML CONTRACT
# roadmap: High-level learning milestones for the current language roadmap.
#
# - id [string, required]: Stable and unique milestone identity within the current language roadmap.
# - title [string, required]: Milestone title displayed to the learner.
# - purpose [string, required]: What the learner should understand or achieve from this milestone.
# - dependsOn [list, optional]: Prerequisite milestone ids when item order alone is not enough to express the dependency.
# - objectives [list, optional]: Milestone-level learning objectives; do not use this to list every small fact/API/syntax item.
# - relatedKnowledge [list, optional]: Knowledge category ids in the current module that support this milestone. Portal displays this list on the side opposite the milestone and clicking an item navigates to the matching Knowledge category.
# - relatedModules [list, optional]: Related modules displayed as Portal Level 2 cards. Each item requires routeId and may provide localized label/note; this relation is navigation only and does not create child milestones or change learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - What is this topic/module?
#   - Why does it exist?
#   - What problem exists without it?
# FOUNDATION
#   - What prerequisite or mental model must the learner have first?
# CORE MODEL
#   - What major abstractions or building blocks make up this topic?
# MECHANICS
#   - How does it work at the language/runtime/API level appropriate for this module?
# USAGE
#   - How is it used in real code?
# DECISION / TRADE-OFF
#   - When should this mechanism be chosen over another?
#   - When should it not be used?
# FAILURE / PITFALL
#   - What mistakes, compile-time failures, or runtime failures matter?
# INTEGRATION
#   - How does this topic connect to neighboring concepts/modules?
# SYNTHESIS
#   - What end-to-end mental model should the learner retain?
#
# Each language owns its own roadmap. Do not infer or synchronize its structure from another language roadmap.
# Item order in roadmap is the default learning order. Use dependsOn only when a dependency needs to be expressed beyond the linear order.
# The skeleton must not force every module to have the same number of nodes. It is a thinking framework, not a rigid template.
# </roadmap-schema>

roadmap:
  - id: date-time-model
    title: Date-Time Mental Model
    purpose: Understand that calendar date, wall-clock time, local date-time, timeline instant, offset, and zone answer different questions.
    objectives:
      - Choose a date-time type from the meaning of the domain value.
      - Avoid treating all temporal values as interchangeable timestamps.
  - id: local-date-and-time
    title: Local Calendar and Wall-Clock Values
    purpose: Understand LocalDate, LocalTime, and LocalDateTime as values without global timeline meaning.
    objectives:
      - Use local types for domain concepts that intentionally have no offset/zone.
      - Recognize when attaching a zone later can create ambiguity.
  - id: instant-and-timeline
    title: Instant and Global Timeline
    purpose: Understand Instant as a precise point on the UTC-based timeline and distinguish it from human calendar representation.
    objectives:
      - Use Instant for machine-oriented event time and ordering.
      - Convert between Instant and human-facing zoned representations intentionally.
  - id: offsets-zones-and-zoned-values
    title: Offsets, Zones, and Zoned Values
    purpose: Understand fixed UTC offsets versus named region rules and how OffsetDateTime/ZonedDateTime carry that context.
    objectives:
      - Distinguish ZoneOffset from ZoneId and DST-aware region rules.
      - Choose OffsetDateTime or ZonedDateTime from interchange versus rule-aware needs.
  - id: duration-and-period
    title: Elapsed Time vs Calendar Amount
    purpose: Understand Duration and Period as different models for time-based and date-based amounts.
    objectives:
      - Use Duration for elapsed timeline-based quantities.
      - Use Period for calendar-aware year/month/day quantities.
  - id: formatting-and-parsing
    title: Formatting and Parsing
    purpose: Understand date-time formatters as explicit text boundaries rather than part of the temporal value itself.
    relatedModules:
      - routeId: JAVA_LOCALIZATION
        label: Localization
        note: Locale-sensitive date/time presentation belongs to the broader localization model.
    objectives:
      - Use standard and custom formatters with explicit expectations.
      - Keep parsing/formatting separate from core temporal semantics.
  - id: arithmetic-comparison-and-dst
    title: Arithmetic, Comparison, and DST Boundaries
    purpose: Understand how temporal arithmetic and comparison depend on the chosen type and how zone transitions create gaps or overlaps.
    objectives:
      - Choose timeline versus calendar arithmetic intentionally.
      - Recognize ambiguous or invalid local times around DST transitions.
  - id: clock-and-testability
    title: Clock and Testable Time
    purpose: Understand Clock as an injectable source of “now” that separates time-dependent behavior from the system clock.
    objectives:
      - Make time-sensitive code deterministic in tests.
      - Avoid scattering direct now() calls through business logic.
  - id: legacy-interop-and-synthesis
    title: Legacy Interop and Date-Time Synthesis
    purpose: Connect modern java.time types with legacy Date/Calendar interop while avoiding default-zone and conversion pitfalls.
    objectives:
      - Convert across legacy and modern APIs at explicit boundaries.
      - Choose the smallest temporal model that preserves the domain meaning.
