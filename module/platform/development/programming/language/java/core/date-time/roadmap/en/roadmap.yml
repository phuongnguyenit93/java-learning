# <roadmap-schema>
# Module Roadmap Structure
# schema-version: 1
#
# YAML CONTRACT
# roadmap: High-level learning milestones for the current language roadmap.
#
# - id [string, required]: Stable and unique milestone identity within the current language roadmap.
# - title [string, required]: Milestone title displayed to the learner.
# - purpose [string, required]: What the learner should understand or achieve from this milestone.
# - dependsOn [list, optional]: Prerequisite milestone ids when item order alone is not enough to express the dependency.
# - objectives [list, optional]: Milestone-level learning objectives; do not use this to list every small fact/API/syntax item.
# - relatedKnowledge [list, optional]: Knowledge category ids in the current module that support this milestone. Portal displays this list on the side opposite the milestone and clicking an item navigates to the matching Knowledge category.
# - relatedModules [list, optional]: Related modules displayed as Portal Level 2 cards. Each item requires routeId and may provide localized label/note; this relation is navigation only and does not create child milestones or change learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - What is this topic/module?
#   - Why does it exist?
#   - What problem exists without it?
# FOUNDATION
#   - What prerequisite or mental model must the learner have first?
# CORE MODEL
#   - What major abstractions or building blocks make up this topic?
# MECHANICS
#   - How does it work at the language/runtime/API level appropriate for this module?
# USAGE
#   - How is it used in real code?
# DECISION / TRADE-OFF
#   - When should this mechanism be chosen over another?
#   - When should it not be used?
# FAILURE / PITFALL
#   - What mistakes, compile-time failures, or runtime failures matter?
# INTEGRATION
#   - How does this topic connect to neighboring concepts/modules?
# SYNTHESIS
#   - What end-to-end mental model should the learner retain?
#
# Each language owns its own roadmap. Do not infer or synchronize its structure from another language roadmap.
# Item order in roadmap is the default learning order. Use dependsOn only when a dependency needs to be expressed beyond the linear order.
# The skeleton must not force every module to have the same number of nodes. It is a thinking framework, not a rigid template.
# </roadmap-schema>

roadmap:
  - id: date-time-model
    title: What Date-Time Means and Why Multiple Models Exist
    purpose: Understand that date and time data is not one interchangeable “timestamp” concept; calendar dates, time-of-day values, local date-times, timeline instants, UTC offsets, and zone rules answer different questions, so java.time provides specialized immutable types instead of one universal representation.
    objectives:
      - Choose a date-time type from domain meaning rather than from the text format currently displayed.
      - Distinguish human calendar values from precise positions on the global timeline.
      - Understand that the main java.time types are immutable value types whose operations return new values.
  - id: local-date-and-time
    title: Local Calendar and Wall-Clock Values
    purpose: Understand LocalDate, LocalTime, and LocalDateTime as local calendar or wall-clock values that are useful when the domain intentionally has no zone yet, but do not identify one unique position on the global timeline by themselves.
    objectives:
      - Use LocalDate when the domain owns only a date and LocalTime when it owns only a time of day.
      - Use LocalDateTime for domain values that intentionally do not yet carry a zone.
      - Explain why zone or offset context is required before mapping a LocalDateTime to an Instant.
      - Recognize that attaching a zone later can encounter invalid or ambiguous local times around DST transitions.
  - id: instant-and-timeline
    title: Instant and Global Timeline
    purpose: Understand Instant as a precise point on the UTC-based timeline that is independent from the calendar, clock, and zone representation a person uses to view it.
    objectives:
      - Use Instant for system event time, chronological ordering, and persistence boundaries that require an unambiguous moment.
      - Understand epoch seconds and milliseconds as numeric representations of positions on the same timeline.
      - Convert intentionally between Instant and human-facing zoned representations.
  - id: offsets-and-zone-rules
    title: ZoneOffset, ZoneId, and Zone Rules
    purpose: Understand that a concrete UTC offset such as +07:00 is not the same as a named region such as Asia/Ho_Chi_Minh; ZoneId can carry rules that vary across history or policy while ZoneOffset describes one concrete offset.
    objectives:
      - Distinguish ZoneOffset, ZoneId, and the role of ZoneRules.
      - Understand why region-based zones can change offsets over time and create DST gaps or overlaps.
      - Avoid treating the current UTC offset as a complete substitute for zone identity and rules.
  - id: offsets-zones-and-zoned-values
    title: OffsetDateTime, ZonedDateTime, and Zone Conversion
    purpose: Understand how OffsetDateTime and ZonedDateTime attach offset or zone-rule context to a local date-time, and distinguish preserving the same timeline instant from preserving the same local fields.
    objectives:
      - Choose OffsetDateTime when a value needs one concrete UTC offset and ZonedDateTime when it must preserve named-zone identity and rules.
      - Distinguish conversion that preserves the same Instant from reinterpreting the same LocalDateTime in another zone.
      - Recognize that two zoned values can have different local fields while representing the same Instant.
  - id: duration-and-period
    title: Elapsed Time vs Calendar Amount
    purpose: Understand Duration and Period as different models for elapsed timeline time versus calendar year/month/day amounts, so they cannot be substituted mechanically.
    objectives:
      - Use Duration for elapsed quantities measured in hours, minutes, and seconds on the timeline.
      - Use Period for year/month/day quantities governed by calendar rules.
      - Explain why 24 hours is not always the same as one calendar day around zone or DST changes.
  - id: formatting-and-parsing
    title: Formatting and Parsing
    purpose: Understand DateTimeFormatter as the explicit boundary between date-time values and text; presentation format does not change the temporal meaning of the value itself.
    relatedModules:
      - routeId: JAVA_LOCALIZATION
        label: Localization
        note: Locale-sensitive date/time presentation belongs to the broader localization model.
    objectives:
      - Choose predefined or custom formatters with explicit input/output expectations.
      - Parse text into the temporal type that matches the meaning the data actually carries.
      - Keep parsing and formatting separate from core temporal semantics.
  - id: arithmetic-comparison-and-dst
    title: Arithmetic, Comparison, and DST Boundaries
    purpose: Understand that addition, subtraction, distance calculation, and comparison depend on the chosen temporal model; with zoned values, calendar rules and DST transitions can make date-based arithmetic differ from elapsed-hour arithmetic.
    objectives:
      - Choose timeline-based versus calendar-based arithmetic intentionally.
      - Use plus/minus, ChronoUnit, Duration, or Period according to the quantity being modeled.
      - Compare temporal values with the correct semantics and recognize invalid or ambiguous local times around DST transitions.
      - Keep business-calendar policy separate from general-purpose date-time arithmetic.
  - id: clock-and-testability
    title: Clock and Testable Time
    purpose: Understand Clock as an injectable source of “now” that separates time-dependent behavior from the system clock and makes tests deterministic.
    objectives:
      - Use a fixed or injected Clock to test time-sensitive logic deterministically.
      - Avoid scattering direct now() calls through business logic when current time is a dependency that should be controlled.
  - id: legacy-interop-and-synthesis
    title: Legacy Interop and Date-Time Synthesis
    purpose: Connect java.time with legacy Date/Calendar and older system boundaries without letting implicit default zones or conversions change the meaning of data, then synthesize an end-to-end type-selection model.
    objectives:
      - Convert between Date/Calendar and java.time at explicit boundaries, using Instant as the bridge when appropriate.
      - Recognize system-default-zone risks and decide explicitly whether persistence owns an Instant, a local date-time, or zone information.
      - Choose the smallest temporal model that still preserves complete domain meaning.
