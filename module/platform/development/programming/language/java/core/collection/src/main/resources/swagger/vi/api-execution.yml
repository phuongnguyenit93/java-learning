ListController:
  arrayVsLinked():
    execution: |-
      <p><strong>Khái niệm:</strong> cùng là <code>List</code> nhưng <code>ArrayList</code> và <code>LinkedList</code> dựa trên mô hình lưu trữ khác nhau, nên chi phí thao tác không giống nhau.</p>
      <ol>
        <li><strong>Flow:</strong> endpoint tạo hai list cùng dữ liệu, đọc một phần tử theo index, chèn giữa list và thêm một phần tử ở đầu LinkedList.</li>
        <li><strong>Code evidence:</strong><pre><code>List&lt;String&gt; arrayList = new ArrayList&lt;&gt;(List.of("A", "B", "C"));
      String before = arrayList.get(1);
      arrayList.add(1, "X");

      LinkedList&lt;String&gt; linkedList = new LinkedList&lt;&gt;(List.of("A", "B", "C"));
      linkedList.add(1, "X");
      linkedList.addFirst("HEAD");</code></pre></li>
        <li><strong>Observation:</strong> response trả <code>arrayIndexOneBeforeInsert=B</code>, ArrayList sau middle insert là <code>[A,X,B,C]</code>, còn LinkedList expose cả middle insert và head operation.</li>
        <li><strong>Ý nghĩa:</strong> ArrayList hỗ trợ direct indexed access nhưng middle insert phải dịch phần tử; LinkedList có thao tác đầu/cuối tự nhiên nhưng indexed lookup vẫn cần traversal.</li>
      </ol>
      <p><strong>Kết luận:</strong> chọn implementation theo workload và semantics, không dựa vào câu khẩu quyết “LinkedList insert nhanh hơn”.</p>
    usage: true
SetController:
  uniquenessAndOrder():
    execution: |-
      <p><strong>Khái niệm:</strong> <code>Set</code> đưa uniqueness vào contract, còn encounter order phụ thuộc implementation.</p>
      <ol>
        <li><strong>Flow:</strong> input <code>[B,A,B,C,A]</code> được đưa vào HashSet, LinkedHashSet và TreeSet.</li>
        <li><strong>Code evidence:</strong><pre><code>Set&lt;String&gt; hashSet = new HashSet&lt;&gt;(input);
      Set&lt;String&gt; linkedHashSet = new LinkedHashSet&lt;&gt;(input);
      Set&lt;String&gt; treeSet = new TreeSet&lt;&gt;(input);</code></pre></li>
        <li><strong>Observation:</strong> <code>uniqueSize=3</code>, thêm lại B trả false; LinkedHashSet giữ <code>[B,A,C]</code>, TreeSet trả <code>[A,B,C]</code>, còn HashSet không công bố order guarantee.</li>
        <li><strong>Ý nghĩa:</strong> uniqueness là semantics chung của Set, nhưng insertion order hay sorted order là capability bổ sung của implementation cụ thể.</li>
      </ol>
      <p><strong>Kết luận:</strong> chọn Set dựa trên cả uniqueness và order contract mà caller cần.</p>
    usage: true
MapController:
  orderingAndCompute():
    execution: |-
      <p><strong>Khái niệm:</strong> các default method <code>compute</code>, <code>computeIfAbsent</code> và <code>merge</code> diễn đạt update intent trực tiếp trên mapping.</p>
      <ol>
        <li><strong>Flow:</strong> endpoint bắt đầu với <code>{NEW=2, PAID=1}</code>, tăng NEW, tạo PACKING nếu thiếu, cộng PAID và tạo SHIPPED bằng merge.</li>
        <li><strong>Code evidence:</strong><pre><code>counts.compute("NEW", (status, current) -&gt; current == null ? 1 : current + 1);
      counts.computeIfAbsent("PACKING", status -&gt; 0);
      counts.merge("PAID", 2, Integer::sum);
      counts.merge("SHIPPED", 1, Integer::sum);</code></pre></li>
        <li><strong>Observation:</strong> NEW trở thành 3, PAID thành 3, PACKING và SHIPPED được tạo; LinkedHashMap vẫn expose encounter order của các key.</li>
        <li><strong>Ý nghĩa:</strong> các operation này thay thế pattern get-if-put bằng một update expression gần với ý định hơn, nhưng plain Map không vì thế mà có concurrent atomicity guarantee.</li>
      </ol>
      <p><strong>Kết luận:</strong> dùng compute/merge khi update logic thực sự dựa trên mapping hiện tại hoặc cần tạo mapping khi thiếu.</p>
    usage: true
QueueController:
  queueOperations():
    execution: |-
      <p><strong>Khái niệm:</strong> Queue có hai family operation cùng mục đích nhưng báo failure bằng exception hoặc special value.</p>
      <ol>
        <li><strong>Flow:</strong> endpoint gọi <code>poll/peek</code> và <code>remove/element</code> trên ArrayDeque rỗng, rồi offer A/B và poll phần tử đầu.</li>
        <li><strong>Code evidence:</strong><pre><code>String pollOnEmpty = queue.poll();
      String peekOnEmpty = queue.peek();
      try { queue.remove(); } catch (NoSuchElementException ex) { ... }
      queue.offer("A");
      queue.offer("B");</code></pre></li>
        <li><strong>Observation:</strong> poll/peek trả null khi rỗng; remove/element được ghi nhận là <code>NoSuchElementException</code>; poll sau khi offer trả A và head còn lại là B.</li>
        <li><strong>Ý nghĩa:</strong> empty có thể là trạng thái bình thường hoặc invariant violation; API family được chọn theo semantics của failure đó.</li>
      </ol>
      <p><strong>Kết luận:</strong> không có cặp method nào “luôn tốt hơn”; hãy chọn cách biểu diễn failure phù hợp với caller.</p>
    usage: true
IterationController:
  failFast():
    execution: |-
      <p><strong>Khái niệm:</strong> iterator fail-fast có thể phát hiện structural modification ngoài iterator ngay cả trong một thread; mutation qua chính iterator có contract khác.</p>
      <ol>
        <li><strong>Flow:</strong> endpoint lấy iterator từ ArrayList, đọc U01, thêm U04 trực tiếp vào list rồi gọi iterator.next(); sau đó tạo list khác và xóa U02 qua Iterator.remove().</li>
        <li><strong>Code evidence:</strong><pre><code>Iterator&lt;String&gt; iterator = unsafe.iterator();
      iterator.next();
      unsafe.add("U04");
      iterator.next(); // CME

      if (safeIterator.next().equals("U02")) {
          safeIterator.remove();
      }</code></pre></li>
        <li><strong>Observation:</strong> response có <code>iteratorDetected=ConcurrentModificationException</code> và safe list trở thành <code>[U01,U03]</code>.</li>
        <li><strong>Ý nghĩa:</strong> CME là bug-detection signal cho traversal contract, không phải proof của data race hay thread-safety.</li>
      </ol>
      <p><strong>Kết luận:</strong> khi cần xóa phần tử hiện tại trong traversal, dùng mutation path mà iterator hỗ trợ thay vì sửa collection ngoài iterator.</p>
    usage: true
ImmutabilityController:
  viewVsCopy():
    execution: |-
      <p><strong>Khái niệm:</strong> unmodifiable view và unmodifiable snapshot đều reject mutation qua reference của chúng nhưng khác nhau về backing state.</p>
      <ol>
        <li><strong>Flow:</strong> endpoint tạo source [A,B], một <code>Collections.unmodifiableList(source)</code> và một <code>List.copyOf(source)</code>, rồi thêm C vào source.</li>
        <li><strong>Code evidence:</strong><pre><code>List&lt;String&gt; unmodifiableView = Collections.unmodifiableList(source);
      List&lt;String&gt; snapshot = List.copyOf(source);
      source.add("C");</code></pre></li>
        <li><strong>Observation:</strong> view sau source mutation là <code>[A,B,C]</code>, snapshot vẫn <code>[A,B]</code>; cả hai đều ném <code>UnsupportedOperationException</code> khi add qua chính reference đó.</li>
        <li><strong>Ý nghĩa:</strong> “không sửa được qua reference này” không trả lời câu hỏi dữ liệu có share backing state với nguồn hay không.</li>
      </ol>
      <p><strong>Kết luận:</strong> dùng view khi muốn read-only facade phản ánh source; dùng copy khi cần structural snapshot độc lập.</p>
    usage: true
HashingController:
  mutableKey():
    execution: |-
      <p><strong>Khái niệm:</strong> state tham gia <code>equals/hashCode</code> của hash key phải ổn định khi key đang nằm trong HashMap.</p>
      <ol>
        <li><strong>Flow:</strong> endpoint put key ORDER-1 vào map, xác nhận lookup thành công, đổi id của cùng object thành ORDER-2 rồi lookup lại.</li>
        <li><strong>Code evidence:</strong><pre><code>orders.put(key, "PAID");
      key.setId("ORDER-2");
      orders.containsKey(key);
      orders.containsKey(new MutableKey("ORDER-2"));</code></pre></li>
        <li><strong>Observation:</strong> entry vẫn chứa key id ORDER-2/value PAID khi duyệt trực tiếp, nhưng lookup bằng same reference và key tương đương mới đều false.</li>
        <li><strong>Ý nghĩa:</strong> key được lưu theo bucket tính từ hash cũ; mutation làm lookup dùng hash mới nên không tìm đúng vị trí đã lưu.</li>
      </ol>
      <p><strong>Kết luận:</strong> tránh mutate field tham gia equality/hash khi object đang là hash key hoặc hash-set element.</p>
    usage: true
EnumCollectionController:
  specializedCollections():
    execution: |-
      <p><strong>Khái niệm:</strong> EnumSet và EnumMap khai thác enum universe hữu hạn để cung cấp collection chuyên biệt với declaration-order traversal.</p>
      <ol>
        <li><strong>Flow:</strong> endpoint insert SHIPPED, NEW, PAID theo thứ tự không giống enum declaration order vào EnumSet và EnumMap.</li>
        <li><strong>Code evidence:</strong><pre><code>EnumSet&lt;OrderStatus&gt; active = EnumSet.of(SHIPPED, NEW, PAID);
      EnumMap&lt;OrderStatus, Integer&gt; limits = new EnumMap&lt;&gt;(OrderStatus.class);
      limits.put(SHIPPED, 40);
      limits.put(NEW, 10);
      limits.put(PAID, 20);</code></pre></li>
        <li><strong>Observation:</strong> cả EnumSet và EnumMap key traversal đều theo <code>NEW, PAID, SHIPPED</code>, tức declaration order, không theo insertion order.</li>
        <li><strong>Ý nghĩa:</strong> specialized representation và closed enum key space tạo semantics rõ ràng hơn so với chọn HashSet/HashMap chỉ theo thói quen.</li>
      </ol>
      <p><strong>Kết luận:</strong> khi domain key/element là một enum cụ thể, hãy cân nhắc EnumSet/EnumMap trước collection tổng quát.</p>
    usage: true
