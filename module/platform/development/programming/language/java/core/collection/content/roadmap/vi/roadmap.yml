# <roadmap-schema>
# Cấu trúc Roadmap Module
# schema-version: 1
#
# YAML CONTRACT
# roadmap: Danh sách milestone cấp cao của roadmap cho language hiện tại.
#
# - id [string, required]: ID ổn định và duy nhất của milestone trong roadmap language hiện tại.
# - title [string, required]: Tên milestone hiển thị cho learner.
# - purpose [string, required]: Milestone này tồn tại để learner hiểu hoặc đạt được điều gì.
# - dependsOn [list, optional]: Danh sách id milestone prerequisite khi dependency không thể hiện đủ chỉ bằng thứ tự item.
# - objectives [list, optional]: Các learning objective cấp milestone; không dùng để liệt kê mọi fact/API/syntax nhỏ.
# - relatedKnowledge [list, optional]: Danh sách Knowledge category id trong chính module hiện tại hỗ trợ milestone. Portal hiển thị danh sách này ở phía đối diện milestone và click item sẽ điều hướng sang Knowledge category tương ứng.
# - relatedModules [list, optional]: Các module liên quan hiển thị ở Level 2 của Portal. Mỗi item dùng routeId bắt buộc và có thể có label/note localized; relation này chỉ để điều hướng, không tạo child milestone hoặc thay đổi learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - Topic/module này là gì?
#   - Vì sao nó tồn tại?
#   - Không có nó thì learner gặp vấn đề gì?
# FOUNDATION
#   - Learner cần prerequisite hoặc mental model nào trước?
# CORE MODEL
#   - Những abstraction hoặc building block lớn nào tạo nên chủ đề này?
# MECHANICS
#   - Nó hoạt động như thế nào ở mức language/runtime/API phù hợp với module?
# USAGE
#   - Nó được dùng như thế nào trong code thực tế?
# DECISION / TRADE-OFF
#   - Khi nào nên chọn cơ chế này thay vì cơ chế khác?
#   - Khi nào không nên dùng?
# FAILURE / PITFALL
#   - Những sai lầm, compile-time failure hoặc runtime failure nào đáng biết?
# INTEGRATION
#   - Chủ đề này kết nối với những concept/module lân cận nào?
# SYNTHESIS
#   - Sau cùng learner phải giữ mental model end-to-end nào?
#
# Mỗi language tự chịu trách nhiệm cho roadmap của chính nó. Không suy luận hoặc đồng bộ cấu trúc từ roadmap của language khác.
# Thứ tự item trong roadmap chính là thứ tự học mặc định. Chỉ dùng dependsOn khi cần biểu diễn dependency rõ hơn thứ tự tuyến tính.
# Skeleton không nên ép mọi module có đúng bấy nhiêu node. Nó là framework suy nghĩ chứ không phải template cứng.
# </roadmap-schema>

roadmap:
  - id: collection-foundation
    title: Collection là gì và vì sao Collections Framework tồn tại?
    purpose: Hiểu Collection là gì, mảng đã giải quyết được điều gì, vì sao nhóm dữ liệu có kích thước thay đổi cần mô hình phong phú hơn, Collections Framework chuẩn hóa điều gì và vì sao hệ thống phân cấp của nó thể hiện nhiều khả năng khác nhau thay vì là một cây phải học thuộc.
    relatedKnowledge:
      - Hierarchy
    relatedModules:
      - routeId: JAVA_GENERICS
        label: Generics
        note: API của Collection sử dụng tham số kiểu generic, wildcard và PECS để tái sử dụng mã mà vẫn an toàn kiểu dữ liệu.
    objectives:
      - Phân biệt ở mức nhập môn vai trò của Collection, Collections, Iterable và Map, đồng thời hiểu vì sao Map nằm ở hệ thống phân cấp riêng.
      - Nhận biết API chung của Collection và phân tích riêng biệt thứ tự, phần tử trùng lặp, chính sách null, khả năng thay đổi và độ phức tạp của thao tác.
      - Chọn interface theo hành vi cần có trước khi chọn lớp triển khai cụ thể.
  - id: core-collection-contracts
    title: Các mô hình dữ liệu cốt lõi
    purpose: Xây dựng cách nhìn tổng thể về List, Set, Map, Queue và Deque như những lời giải khác nhau cho các nhu cầu truy cập và xử lý dữ liệu khác nhau.
    relatedKnowledge:
      - List
      - Set
      - Map
      - QueueDeque
    objectives:
      - Phân biệt dữ liệu có thứ tự và vị trí, tính duy nhất, tra cứu theo khóa, xử lý FIFO/LIFO, thao tác hai đầu và lấy phần tử theo độ ưu tiên.
      - Hiểu mỗi mô hình có quy tắc khác nhau về phần tử trùng lặp, thứ tự, tra cứu và thay đổi dữ liệu trước khi so sánh các lớp triển khai.
      - Nhận biết các ranh giới tiêu biểu như thao tác theo vị trí của List, phép toán tập hợp của Set, Map.Entry/view của Map và cách Queue/Deque báo thất bại mà không xem chúng là một API chung duy nhất.
  - id: traversal-and-iteration
    title: Duyệt dữ liệu với Iterator
    purpose: Hiểu cách thuật toán duyệt các cấu trúc dữ liệu thông qua giao thức duyệt chung mà không phụ thuộc vào lớp triển khai cụ thể.
    relatedKnowledge:
      - Iteration
    relatedModules:
      - routeId: JAVA_FUNCTIONAL_PROGRAMMING
        label: Lập trình hàm
        note: Lambda, tham chiếu phương thức và cách xử lý theo Stream dùng quanh collection được đào sâu trong module Lập trình hàm.
    objectives:
      - Dùng Iterator, vòng lặp for-each và ListIterator theo đúng mô hình duyệt của chúng.
      - Nhận biết cách thay đổi dữ liệu an toàn qua Iterator và xem Spliterator/Stream là ranh giới chuyển sang module Lập trình hàm.
  - id: ordering-comparison-and-navigation
    title: Thứ tự, so sánh và điều hướng
    purpose: Hiểu sự khác nhau giữa thứ tự duyệt và thứ tự sắp xếp, cách quy ước so sánh xác định thứ tự và cách SortedSet/NavigableSet hoặc SortedMap/NavigableMap hỗ trợ truy vấn phạm vi hay phần tử gần nhất.
    relatedKnowledge:
      - OrderingSorting
    relatedModules:
      - routeId: JAVA_OBJECT_CONTRACT
        label: Quy ước của Object
        note: Các quy tắc của Comparable và Comparator xác định thứ tự được dùng bởi các cấu trúc có sắp xếp và các thuật toán sắp xếp.
    objectives:
      - Hiểu ý nghĩa kết quả so sánh âm, bằng 0, dương và phân biệt thứ tự tự nhiên với thứ tự do Comparator xác định.
      - Dùng sắp xếp ổn định, điều kiện của tìm kiếm nhị phân, các thao tác điều hướng và backed view theo phạm vi đúng cách.
  - id: equality-hashing-and-lookup
    title: Tính bằng nhau, hash và tính đúng đắn khi tra cứu
    purpose: Hiểu cách equals, hashCode và tính nhất quán của phép so sánh chi phối tính duy nhất, tra cứu và tính bằng nhau của cả cấu trúc, bao gồm lý do khóa hoặc phần tử có thể thay đổi có thể phá vỡ các giả định của cấu trúc dữ liệu.
    relatedKnowledge:
      - EqualityHashing
    relatedModules:
      - routeId: JAVA_OBJECT_CONTRACT
        label: Quy ước của Object
        note: Các quy tắc của equals, hashCode, Comparable và Comparator trực tiếp chi phối hành vi của các cấu trúc dữ liệu này.
    objectives:
      - Dự đoán hệ quả khi quy ước không nhất quán hoặc khi khóa/phần tử thay đổi trong cấu trúc dựa trên hash hay cấu trúc có sắp xếp.
      - Phân biệt quy tắc so sánh bằng nhau của List, Set, Map và Queue/Deque.
  - id: mutation-views-and-fail-fast
    title: Khả năng thay đổi, view và Fail-Fast
    purpose: Hiểu ai sở hữu quyền thay đổi cấu trúc, view và các dạng không cho sửa/bất biến ảnh hưởng đến thay đổi dữ liệu ra sao, đồng thời hiểu vì sao thay đổi cấu trúc khi đang duyệt có thể làm mất hiệu lực các giả định của Iterator.
    relatedKnowledge:
      - MutableImmutable
      - FailFast
    objectives:
      - Phân biệt cấu trúc có thể sửa, cấu trúc cố định kích thước, backed view, lớp bọc không cho sửa, kết quả bất biến từ phương thức tạo/copyOf và bản sao phòng vệ.
      - Dự đoán thao tác nào được phép và thay đổi có được phản ánh sang đối tượng khác thông qua view hay không.
      - Hiểu fail-fast chỉ cố gắng phát hiện lỗi và không bảo đảm tuyệt đối; đây không phải cơ chế đồng bộ hay bảo đảm an toàn khi chạy đồng thời.
      - Thay đổi dữ liệu an toàn qua thao tác được Iterator hỗ trợ khi phù hợp và hiểu ConcurrentModificationException thực sự đảm bảo điều gì, không đảm bảo điều gì.
  - id: implementation-choice-and-specialization
    title: Lựa chọn cách triển khai và cấu trúc chuyên biệt
    purpose: Tổng hợp hành vi cần có, độ phức tạp thao tác, bộ nhớ, khả năng thay đổi, yêu cầu về thứ tự và chính sách null thành cách chọn lớp triển khai thực tế, đồng thời nhận biết khi nào cấu trúc chuyên biệt cho enum phù hợp hơn.
    relatedKnowledge:
      - ImplementationChoice
      - EnumCollections
    relatedModules:
      - routeId: JAVA_CLASS_OBJECT
        label: Lớp & đối tượng
        note: Enum trong Java và đặc tính kiểu dữ liệu của enum được giới thiệu trong module Lớp & đối tượng.
    objectives:
      - So sánh các lớp triển khai List, Set, Map và Queue phổ biến theo loại công việc mà chúng phù hợp, lấy tính đúng đắn về hành vi làm bộ lọc đầu tiên.
      - Tính đến độ phức tạp thao tác, bộ nhớ, thứ tự, khả năng thay đổi, chính sách null và giới hạn của các phương thức tạo trước khi tối ưu vi mô.
      - Nhận biết EnumSet và EnumMap là lựa chọn chuyên biệt cho miền enum, không phải mặc định thay thế các cấu trúc đa dụng.
