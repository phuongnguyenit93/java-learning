# <roadmap-schema>
# Module Roadmap Structure
# schema-version: 1
#
# YAML CONTRACT
# roadmap: High-level learning milestones for the current language roadmap.
#
# - id [string, required]: Stable and unique milestone identity within the current language roadmap.
# - title [string, required]: Milestone title displayed to the learner.
# - purpose [string, required]: What the learner should understand or achieve from this milestone.
# - dependsOn [list, optional]: Prerequisite milestone ids when item order alone is not enough to express the dependency.
# - objectives [list, optional]: Milestone-level learning objectives; do not use this to list every small fact/API/syntax item.
# - relatedKnowledge [list, optional]: Knowledge category ids in the current module that support this milestone. Portal displays this list on the side opposite the milestone and clicking an item navigates to the matching Knowledge category.
# - relatedModules [list, optional]: Related modules displayed as Portal Level 2 cards. Each item requires routeId and may provide localized label/note; this relation is navigation only and does not create child milestones or change learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - What is this topic/module?
#   - Why does it exist?
#   - What problem exists without it?
# FOUNDATION
#   - What prerequisite or mental model must the learner have first?
# CORE MODEL
#   - What major abstractions or building blocks make up this topic?
# MECHANICS
#   - How does it work at the language/runtime/API level appropriate for this module?
# USAGE
#   - How is it used in real code?
# DECISION / TRADE-OFF
#   - When should this mechanism be chosen over another?
#   - When should it not be used?
# FAILURE / PITFALL
#   - What mistakes, compile-time failures, or runtime failures matter?
# INTEGRATION
#   - How does this topic connect to neighboring concepts/modules?
# SYNTHESIS
#   - What end-to-end mental model should the learner retain?
#
# Each language owns its own roadmap. Do not infer or synchronize its structure from another language roadmap.
# Item order in roadmap is the default learning order. Use dependsOn only when a dependency needs to be expressed beyond the linear order.
# The skeleton must not force every module to have the same number of nodes. It is a thinking framework, not a rigid template.
# </roadmap-schema>

roadmap:
  - id: collection-foundation
    title: Why the Collections Framework Exists
    purpose: Understand what a collection is, what arrays already solve, why variable-size group data needs richer abstractions, what the Collections Framework standardizes, and how its hierarchy represents different capabilities rather than a tree to memorize.
    relatedKnowledge:
      - Hierarchy
    relatedModules:
      - routeId: JAVA_GENERICS
        label: Generics
        note: Collection APIs rely on generic type parameters, wildcards, and PECS for type-safe reuse.
    objectives:
      - Distinguish Collection, Collections, Iterable, and Map at a beginner level and understand why Map forms a separate hierarchy.
      - Recognize the shared Collection API and reason separately about order, duplicates, null policy, mutability, and operation complexity.
      - Choose an interface from required behavior before choosing a concrete implementation.
  - id: core-collection-contracts
    title: Core Collection Contracts
    purpose: Build a mental model of List, Set, Map, Queue, and Deque as different answers to different data-access and processing needs.
    relatedKnowledge:
      - List
      - Set
      - Map
      - QueueDeque
    objectives:
      - Distinguish ordered positional data, uniqueness, key-based lookup, FIFO/LIFO processing, double-ended access, and priority-based removal.
      - Understand that each contract has different rules for duplicates, order, lookup, and mutation before comparing implementations.
      - Recognize representative boundaries such as List positional operations, Set algebra, Map entries/views, and Queue/Deque failure contracts without treating them as one universal API.
  - id: traversal-and-iteration
    title: Traversal and Iteration
    purpose: Understand how algorithms traverse collections through common iteration protocols without depending on concrete implementations.
    relatedKnowledge:
      - Iteration
    relatedModules:
      - routeId: JAVA_FUNCTIONAL_PROGRAMMING
        label: Functional Programming
        note: Lambda, method-reference, and stream-style behavior used around collections is owned by Functional Programming.
    objectives:
      - Use Iterator, enhanced for, and ListIterator with the correct traversal model.
      - Recognize safe iterator mutation and treat Spliterator/Stream behavior as a boundary to Functional Programming.
  - id: ordering-comparison-and-navigation
    title: Ordering, Comparison, and Navigation
    purpose: Understand the difference between encounter order and sorted order, how comparison contracts define ordering, and how sorted/navigable collections expose range and nearest-element operations.
    relatedKnowledge:
      - OrderingSorting
    relatedModules:
      - routeId: JAVA_OBJECT_CONTRACT
        label: Object Contract
        note: Comparable and Comparator contracts define the ordering rules used by sorted collections and sorting algorithms.
    objectives:
      - Interpret negative, zero, and positive comparison results and distinguish natural from Comparator-based ordering.
      - Use stable sorting, binary-search preconditions, navigable operations, and backed range views correctly.
  - id: equality-hashing-and-lookup
    title: Equality, Hashing, and Lookup Correctness
    purpose: Understand how equals, hashCode, and comparison consistency control uniqueness, lookup, and whole-container equality, including why mutable keys or elements can break collection assumptions.
    relatedKnowledge:
      - EqualityHashing
    relatedModules:
      - routeId: JAVA_OBJECT_CONTRACT
        label: Object Contract
        note: equals, hashCode, Comparable, and Comparator laws directly control collection behavior.
    objectives:
      - Predict the consequences of inconsistent or mutable keys/elements in hash-based and sorted structures.
      - Distinguish List, Set, Map, and Queue/Deque equality boundaries.
  - id: mutation-views-and-fail-fast
    title: Mutation Ownership, Views, and Fail-Fast Behavior
    purpose: Understand who owns structural change, how views and immutable/unmodifiable forms affect mutation, and why structural modification during traversal can invalidate iterator assumptions.
    relatedKnowledge:
      - MutableImmutable
      - FailFast
    objectives:
      - Distinguish modifiable collections, fixed-size adapters, backed views, unmodifiable wrappers, immutable factory/copy results, and defensive copies.
      - Predict whether a change is allowed and whether it is shared through a view.
      - Treat fail-fast behavior as best-effort bug detection, not as synchronization or a concurrency guarantee.
      - Mutate safely through supported iterator operations when appropriate and understand what ConcurrentModificationException does and does not guarantee.
  - id: implementation-choice-and-specialization
    title: Choosing Implementations and Specialized Collections
    purpose: Synthesize collection semantics, operation complexity, memory, mutation, ordering, and null constraints into a practical implementation-choice model, including enum-specialized structures when their constraints fit.
    relatedKnowledge:
      - ImplementationChoice
      - EnumCollections
    relatedModules:
      - routeId: JAVA_CLASS_OBJECT
        label: Class & Object
        note: Java enums and their type semantics are introduced in Class & Object.
    objectives:
      - Compare common List, Set, Map, and Queue implementations from the workload they are meant to serve, treating semantic correctness as the first filter.
      - Account for operation complexity, memory, ordering, mutation, null policies, and factory restrictions before optimizing micro-performance.
      - Recognize EnumSet and EnumMap as specialized choices for enum domains rather than general-purpose defaults.
