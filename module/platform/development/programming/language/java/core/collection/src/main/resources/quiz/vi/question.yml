      - {id: D, answer: "hashCode giúp thu hẹp bucket/vùng ứng viên, rồi equals xác nhận element có bằng nhau về logic hay không.", explanation: "Đúng. Contract equals/hashCode ổn định là điều kiện quan trọng cho hành vi đúng của hash-based collection."}
