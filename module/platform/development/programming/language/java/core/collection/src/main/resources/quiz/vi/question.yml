      - {id: C, answer: "Xóa phần tử ở index 1, tức value 20.", explanation: "Đúng. Muốn xóa value 10 theo object equality có thể dùng remove(Integer.valueOf(10))."}
      - {id: D, answer: "Không compile vì remove bị ambiguous với List<Integer>.", explanation: "Sai. Overload resolution chọn remove(int)."}
