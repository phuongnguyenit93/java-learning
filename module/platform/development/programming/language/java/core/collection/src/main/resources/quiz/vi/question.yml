    question: "Hai Set bằng nhau theo contract Set khi nào?"
    answers:
      - {id: A, answer: "Chỉ khi cùng concrete implementation và cùng iteration order.", explanation: "Sai. Set equality cố ý độc lập với concrete implementation và encounter order."}
      - {id: B, answer: "Chỉ khi mọi element được insert theo đúng cùng thứ tự thời gian.", explanation: "Sai. Insertion order không tham gia Set.equals."}
      - {id: C, answer: "Khi chúng có cùng size và cùng các member, không phụ thuộc encounter order.", explanation: "Đúng. Vì vậy HashSet và LinkedHashSet vẫn có thể equals dù thứ tự duyệt khác nhau."}
      - {id: D, answer: "Khi hashCode của hai set tình cờ bằng nhau.", explanation: "Sai. Set bằng nhau phải có hash code tương thích, nhưng hash code bằng nhau không chứng minh equality."}
