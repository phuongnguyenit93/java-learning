  - id: collection-q05
    question: "Đặc tính nào là nền tảng của contract List?"
    answers:
      - {id: A, answer: "Phần tử có encounter order và vị trí index, đồng thời các phần tử bằng nhau vẫn có thể xuất hiện nhiều lần.", explanation: "Đúng. List mô hình hóa một sequence có thứ tự, có vị trí và không ép uniqueness."}
      - {id: B, answer: "Mỗi phần tử phải duy nhất và thứ tự duyệt không quan trọng.", explanation: "Sai. Mô tả này gần với semantics của Set hơn."}
      - {id: C, answer: "Mỗi phần tử phải có một key riêng tách khỏi value.", explanation: "Sai. Quan hệ key-to-value thuộc Map."}
      - {id: D, answer: "Head luôn là phần tử nhỏ nhất theo Comparator.", explanation: "Sai. Đây có thể là hành vi của priority queue, không phải semantics của List."}
