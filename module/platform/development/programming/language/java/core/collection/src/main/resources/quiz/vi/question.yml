  - id: collection-q04
    question: "Vì sao list.add(x) có thể ném UnsupportedOperationException dù add được khai báo trong Collection?"
    answers:
      - {id: A, answer: "Vì add chỉ dùng được khi element implement Cloneable.", explanation: "Sai. Cloneable không liên quan tới Collection.add."}
      - {id: B, answer: "Vì method của Collection chỉ là gợi ý compile-time và implementation có thể âm thầm bỏ qua.", explanation: "Sai. Optional operation không được hỗ trợ phải fail rõ ràng, thường bằng UnsupportedOperationException."}
      - {id: C, answer: "Vì add là default method luôn ném exception trừ khi ArrayList override.", explanation: "Sai. Điểm cốt lõi là contract optional operation, không phải một default implementation chung như vậy."}
      - {id: D, answer: "Vì các operation thay đổi dữ liệu là optional; implementation như List.of(...) có thể cố ý từ chối chúng.", explanation: "Đúng. Interface cung cấp vocabulary chung, còn collection cụ thể có thể là unmodifiable."}
    correctAnswerId: D
