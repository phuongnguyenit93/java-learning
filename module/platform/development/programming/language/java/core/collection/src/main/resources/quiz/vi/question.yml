    question: "Phát biểu nào về Arrays.asList(array) là đúng?"
    answers:
      - {id: A, answer: "Nó tạo fixed-size list backed by array: set được hỗ trợ, nhưng add/remove làm thay đổi size thì không.", explanation: "Đúng. Thay đổi qua set phản ánh vào backing array và ngược lại."}
