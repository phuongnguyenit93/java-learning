  - id: collection-q01
    question: "Vì sao Java Collections Framework vẫn cần thiết khi array đã có thể chứa nhiều giá trị?"
    answers:
      - {id: A, answer: "Nó cung cấp các abstraction và implementation chuẩn cho nhóm dữ liệu động với các hành vi như thứ tự, tính duy nhất, lookup theo key và queueing.", explanation: "Đúng. Array giải quyết lưu trữ theo index với kích thước xác định, còn JCF chuẩn hóa nhiều contract và thao tác phổ biến cho nhóm dữ liệu."}
      - {id: B, answer: "Vì array không thể lưu object.", explanation: "Sai. Array có thể lưu reference tới object; framework bổ sung contract và hành vi cấu trúc dữ liệu có thể tái sử dụng."}
      - {id: C, answer: "Vì JCF thay thế hoàn toàn mọi trường hợp dùng array trong Java.", explanation: "Sai. Array vẫn hữu ích cho dữ liệu kích thước cố định và các boundary API hoặc performance phù hợp."}
      - {id: D, answer: "Vì JCF chủ yếu là framework persistence cho các row trong database.", explanation: "Sai. JCF là framework collection trong bộ nhớ, không phải framework persistence database."}
    correctAnswerId: A
