  - id: collection-q10
    question: "Có thể dùng common Set/Collection API thế nào để biểu diễn phép giao của hai mutable set mà không cần tự viết nested loop?"
    answers:
      - {id: A, answer: "Gọi addAll trên set thứ nhất.", explanation: "Sai. addAll biểu diễn cập nhật gần với phép hợp, không phải phép giao."}
      - {id: B, answer: "Copy một set rồi gọi retainAll(other) trên bản copy.", explanation: "Đúng. retainAll chỉ giữ lại những member cũng có trong collection còn lại."}
      - {id: C, answer: "Gọi clear trên cả hai set rồi so sánh size.", explanation: "Sai. Cách đó phá dữ liệu và không tính phép giao."}
      - {id: D, answer: "Chuyển cả hai set thành map vì Set không có bulk operation.", explanation: "Sai. Collection có các bulk operation như retainAll, removeAll và addAll."}
