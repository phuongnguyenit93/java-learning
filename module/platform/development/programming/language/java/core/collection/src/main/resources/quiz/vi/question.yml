  - id: collection-q02
    question: "Phát biểu nào phân biệt đúng Collection, Collections và Java Collections Framework?"
    answers:
      - {id: A, answer: "Collection là utility class, Collections là root interface, còn JCF chỉ gồm List và Set.", explanation: "Sai. Vai trò của Collection và Collections bị đảo ngược, và JCF rộng hơn List và Set."}
      - {id: B, answer: "Collection là interface gốc cho các nhóm phần tử, Collections là utility class chứa static method, còn JCF là toàn bộ họ interface, implementation và algorithm liên quan.", explanation: "Đúng. Ba tên gần giống nhau nhưng đại diện cho ba vai trò khác nhau trong framework."}
      - {id: C, answer: "Collection và Collections là hai alias; JCF là package java.collection.", explanation: "Sai. Chúng là các type khác nhau, còn JCF là một khái niệm framework chứ không phải package đó."}
      - {id: D, answer: "Collections là implementation của Collection được ArrayList sử dụng.", explanation: "Sai. Collections là utility class và không implement Collection."}
    correctAnswerId: B
    aiGenerated: true
