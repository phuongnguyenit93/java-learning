    question: "Một method chỉ cần truy cập theo index và duyệt theo thứ tự. Declaration nào diễn đạt dependency tốt nhất?"
    answers:
      - {id: A, answer: "ArrayList<Order>, vì caller luôn nên phụ thuộc concrete storage class.", explanation: "Sai. Phụ thuộc concrete class làm lộ nhiều chi tiết implementation hơn mức method cần."}
      - {id: B, answer: "Object, vì type càng rộng thì luôn càng tốt.", explanation: "Sai. Object không biểu đạt các operation mà method cần."}
      - {id: C, answer: "List<Order>, vì nó nói đúng contract cần dùng nhưng vẫn để implementation có thể thay đổi.", explanation: "Đúng. Nên phụ thuộc interface nhỏ nhất vẫn biểu đạt đầy đủ hành vi mà code cần."}
      - {id: D, answer: "Collection<Order>, vì Collection đảm bảo có get(index).", explanation: "Sai. Collection không định nghĩa positional get(index)."}
