  - id: collection-q06
    question: "Với workload chủ yếu random access theo index và append, vì sao ArrayList thường là lựa chọn mặc định tốt hơn LinkedList?"
    answers:
      - {id: A, answer: "LinkedList.get(index) là O(1), còn ArrayList.get(index) phải duyệt node.", explanation: "Sai. Chi phí bị đảo ngược: ArrayList truy cập index trực tiếp, còn LinkedList phải traversal node."}
      - {id: B, answer: "ArrayList có indexed access O(1) và append amortized O(1), còn LinkedList phải traversal với index bất kỳ và có overhead cho từng node.", explanation: "Đúng. Đây là hệ quả trực tiếp của mô hình lưu trữ và chi phí operation phổ biến của hai implementation."}
      - {id: C, answer: "ArrayList không bao giờ phải cấp lại backing storage.", explanation: "Sai. Nó có thể resize và copy backing array; append là amortized O(1), không phải mọi lần đều làm lượng công việc hằng số."}
      - {id: D, answer: "LinkedList không thể thêm hoặc xóa ở hai đầu.", explanation: "Sai. LinkedList hỗ trợ endpoint operations hiệu quả và còn implement Deque."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "11.ImplementationChoice/ImplementationChoice.md", anchor: "list-choice"}
    apiRelated: {controller: "ListController", methodSignature: "arrayVsLinked()"}

