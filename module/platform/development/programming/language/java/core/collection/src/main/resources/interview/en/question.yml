      controller: ""
      methodSignature: ""

  - question: >-
      Why does Map not extend Collection, and what does Map.Entry represent?
    answer: >-
      Collection manages individual elements, while Map manages key→value mappings; an add(E) operation cannot express that one mapping needs both a key and a value. Map.Entry<K,V> represents one mapping inside a map. When an algorithm needs both key and value, entrySet is usually the right traversal unit and avoids iterating keys only to call get(key) again.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Map/Map.md"
      anchor: "map-entry-model"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Are keySet(), values(), and entrySet() copies or views? Why does that matter at an API boundary?
    answer: >-
      They are normally backed views of the original map, not independent collections. Supported mutations through a view can change the map, and changes to the map are visible through the view. Some operations are unsupported because the view lacks enough information, for example keySet().add(key) has no value to attach. An API that requires an independent snapshot should copy explicitly rather than return a view and assume callers will not affect backing state.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Map/Map.md"
      anchor: "map-views"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Describe the HashMap lookup mental model and explain why a mutable key is dangerous.
    answer: >-
      HashMap uses hashCode to choose a candidate region and equals to confirm a matching key. State participating in hashCode/equals must therefore remain stable while the key is stored. If that state changes after put, the object can remain in its old internal location while lookup computes a new hash and fails to find it. This is a hash-based collection invariant, not a random containsKey/get bug.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.EqualityHashing/EqualityHashing.md"
      anchor: "mutable-element-risk"
    apiRelated:
      controller: "HashingController"
      methodSignature: "mutableKey()"

  - question: >-
      LinkedHashMap and TreeMap both have order. What kind of order does each one provide?
    answer: >-
      LinkedHashMap preserves encounter order based on insertion order or access order depending on configuration. TreeMap maintains keys according to natural ordering or a Comparator and supports sorted/navigable operations. The design question is therefore whether the domain needs “remember encounter/access history” or “maintain an ordering relation over keys”; both are ordered, but their contracts and costs differ.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Map/Map.md"
      anchor: "linkedhashmap-order"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      What pattern do Map compute/merge operations improve, and why should plain Map not be assumed atomic across threads?
    answer: >-
      compute/merge combine “read current value, derive a new value, write it back” into operations that express intent more directly than a get→if→put sequence, which is useful for counters, grouping, and accumulation. The plain Map interface does not promise that those updates become atomic across threads. Atomicity is implementation-specific for concurrent types such as ConcurrentMap/ConcurrentHashMap and belongs to the concurrency contract.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Map/Map.md"
      anchor: "map-compute-merge"
    apiRelated:
      controller: "MapController"
      methodSignature: "orderingAndCompute()"

  - question: >-
      How do Queue and Deque differ from List in their mental model? When should offer/poll/peek be preferred over add/remove/element?
    answer: >-
      Queue/Deque emphasize processing order and which ends may be used rather than positional indexing. Queue provides two operation families: add/remove/element report failure with exceptions, while offer/poll/peek use special return values such as false/null. If empty/full is an ordinary state, the special-value family is often convenient; if failure represents an invariant violation, exception-based methods may fit. Deque exposes both ends, so it can model FIFO queues and LIFO stacks.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.QueueDeque/QueueDeque.md"
      anchor: "exception-vs-special-value"
    apiRelated:
      controller: "QueueController"
      methodSignature: "queueOperations()"

  - question: >-
      Is PriorityQueue a list that is always fully sorted? Why can its iterator be misleading?
    answer: >-
      No. PriorityQueue guarantees that the head follows the queue's priority ordering; its heap representation does not need every element to appear in globally sorted sequence. To consume in priority order, repeatedly poll. The iterator does not promise priority-sorted traversal, and elements that compare as equal do not receive stable ordering by default.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.QueueDeque/QueueDeque.md"
      anchor: "priority-queue"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      How do Iterator, enhanced for, and ListIterator differ in role?
    answer: >-
      Iterator is the sequential traversal protocol with hasNext/next and optional remove. Enhanced for is syntax that uses Iterable/Iterator underneath while hiding the cursor. ListIterator is specific to List and adds bidirectional traversal, indexes, and positional mutation such as add/set/remove. Use the simplest abstraction that matches the algorithm instead of choosing ListIterator merely because it exposes more methods.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Iteration/Iteration.md"
      anchor: "listiterator-contract"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      What does ConcurrentModificationException actually mean, and why is fail-fast not a thread-safety mechanism?
    answer: >-
      CME usually means an iterator detected a structural modification that invalidated its traversal contract; one thread alone can trigger it by modifying the collection directly while an iterator is active. Fail-fast is best-effort bug detection, not a guarantee that every modification is detected and not synchronization. The absence of CME therefore proves nothing about concurrent correctness.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "10.FailFast/FailFast.md"
      anchor: "concurrent-modification-exception"
    apiRelated:
      controller: "IterationController"
      methodSignature: "failFast()"

  - question: >-
      Where is the boundary between Spliterator and Iterator, and why does Spliterator not automatically mean parallel execution?
    answer: >-
      Iterator is optimized for sequential element-by-element traversal. Spliterator adds source characteristics and trySplit-style partitioning that higher-level consumers such as Stream can use. Having a Spliterator only creates the ability to partition traversal; a stream/execution engine decides whether work is parallel, and Spliterator does not provide thread-safety for the underlying collection.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Iteration/Iteration.md"
      anchor: "spliterator-boundary"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Distinguish encounter order, insertion order, and sorted order.
    answer: >-
      Encounter order is the order a traversal observes elements. Insertion order is one way to define encounter order, as with LinkedHashSet by default, but ordered collections need not use insertion order. TreeSet encounters elements in sorted order, while List uses index order. HashSet makes no encounter-order promise. Observing the same output order repeatedly does not turn an unspecified order into a contract.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.OrderingSorting/OrderingSorting.md"
      anchor: "encounter-order"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      How do Comparable and Comparator differ, and what do negative, zero, and positive comparison results mean?
    answer: >-
      Comparable defines natural ordering inside the type through compareTo; Comparator defines an ordering outside the type so one type can have multiple orderings. Only the sign matters: negative means a comes before b, zero means equal under the ordering, and positive means a comes after b; callers must not assume only -1/0/1 are returned. For TreeSet/TreeMap, compare==0 also affects uniqueness, so the comparator becomes part of the data contract.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.OrderingSorting/OrderingSorting.md"
      anchor: "comparison-result-contract"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      When is NavigableSet/NavigableMap worth choosing over HashSet/HashMap?
    answer: >-
      Use sorted/navigable structures when the problem needs maintained ordering and order-based queries such as lower/floor/ceiling/higher or range views with subSet/subMap/head/tail. HashSet/HashMap are better fits when the goal is equality/hash-based membership or key lookup without navigation. Tree range results are commonly backed views, so mutability and aliasing still matter.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.OrderingSorting/OrderingSorting.md"
      anchor: "navigable-range-operations"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Do List, Set, Map, and Queue share the same equality contract?
    answer: >-
      No. List uses size plus equal elements at corresponding positions; Set uses the same members regardless of encounter order; Map uses the same mappings. Collection/Queue do not impose one universal element-based equality contract, so ArrayDeque and PriorityQueue typically keep Object identity equality. LinkedList is a List, so it follows List value equality even though it can also be used as a Deque. “Same elements” is therefore not enough to conclude all collections are equal.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.EqualityHashing/EqualityHashing.md"
      anchor: "collection-equality-boundary"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Why can mutable keys/elements make HashMap, HashSet, TreeMap, or TreeSet behave unexpectedly?
    answer: >-
      Hash-based structures depend on state used by hashCode/equals to find a bucket, while sorted structures depend on state used by comparison to place an item in the tree. Mutating that state while the object remains stored can make lookup use a new hash or make tree ordering inconsistent with the stored position. A common design is to use stable identity/order fields or remove and reinsert deliberately after a relevant mutation.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.EqualityHashing/EqualityHashing.md"
      anchor: "mutable-element-risk"
    apiRelated:
      controller: "HashingController"
      methodSignature: "mutableKey()"

  - question: >-
      Distinguish a mutable collection, an unmodifiable view, a fixed-size adapter, and a snapshot copy.
    answer: >-
      A mutable collection allows structural changes according to its contract. Collections.unmodifiableList(source) is a read-only wrapper but still sees source changes because it shares backing state. Arrays.asList(array) is a fixed-size adapter: set works, add/remove changing size do not, and it shares the array. List.copyOf(source) is an unmodifiable structural snapshot that does not see later structural changes to source but remains shallow for mutable element objects. “Cannot call add” therefore does not imply identical semantics.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.MutableImmutable/MutableImmutable.md"
      anchor: "view-vs-copy"
    apiRelated:
      controller: "ImmutabilityController"
      methodSignature: "viewVsCopy()"

  - question: >-
      When choosing a Collection implementation for a new API, where should the decision start instead of choosing by habit?
    answer: >-
      Start with semantics: positional order, uniqueness, key lookup, FIFO/LIFO, priority, or sorted navigation. Then consider encounter order, mutability/ownership, null and factory restrictions, memory overhead, and the costs of the operations that dominate the real workload. Check whether the domain admits a specialized structure such as EnumSet or EnumMap before defaulting to a general-purpose implementation. Only after the contract is correct should implementation-level performance drive the choice; Big-O or a microbenchmark cannot rescue a data structure with the wrong semantics.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "11.ImplementationChoice/ImplementationChoice.md"
      anchor: "choice-by-characteristics"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Why must null policy be read from the implementation/factory contract rather than inferred from List, Set, Map, or Queue alone?
    answer: >-
      The interfaces do not impose one null policy on every implementation. ArrayList and HashMap permit null according to their own contracts; ArrayDeque and PriorityQueue reject null; List.of/Set.of/Map.of and copyOf reject null. TreeSet/TreeMap using ordinary natural ordering generally cannot compare null keys/elements. Queue APIs are especially sensitive because poll/peek use null to mean empty, so storing null would make the meaning ambiguous.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "11.ImplementationChoice/ImplementationChoice.md"
      anchor: "null-policy-matrix"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      How are EnumSet and EnumMap specialized, and when are they preferable to general-purpose collections?
    answer: >-
      They are specialized for a known enum universe. EnumSet commonly uses a bit-vector-like representation, while EnumMap uses array-oriented storage for enum keys. Both iterate in enum declaration order, express the domain clearly, and are often compact and efficient. EnumSet rejects null elements; EnumMap rejects null keys but can hold null values. Their defined order does not mean they implement Java 21 SequencedSet/SequencedMap.
    aiGenerated: true
    reviewed: false
    readmeRelated:
