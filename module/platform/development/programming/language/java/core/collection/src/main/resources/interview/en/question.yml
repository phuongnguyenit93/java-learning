  - question: >-
      Compare the ArrayList and LinkedList mental models. When is LinkedList actually advantageous?
    answer: >-
      ArrayList uses resizable array storage, so indexed get/set is O(1), appending is usually amortized O(1), and middle insertion/removal shifts later elements. LinkedList uses doubly linked nodes; locating an index is O(n), but once an algorithm already has the correct iterator/node position, relinking around that position is cheap. It is therefore too broad to say “LinkedList inserts faster than ArrayList.” For ordinary Java workloads, ArrayList is often the better default unless two-ended operations or traversal-position mutation genuinely match LinkedList's structure.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.List/List.md"
      anchor: "arraylist-model"
    apiRelated:
      controller: "ListController"
      methodSignature: "arrayVsLinked()"

  - question: >-
      Explain the differences among Arrays.asList, List.of, List.copyOf, and new ArrayList<>(source).
    answer: >-
      Arrays.asList(array) is a fixed-size list backed by the array: set works, size-changing add/remove does not, and replacing an element may be visible in both directions. List.of creates an unmodifiable list from arguments and rejects null. List.copyOf creates an unmodifiable structural snapshot of an existing collection, also rejects null, and may reuse a suitable unmodifiable input. new ArrayList<>(source) creates a mutable list with independent structural state. All of these remain shallow with respect to the element objects themselves.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.List/List.md"
      anchor: "list-practical-boundaries"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Why use Set instead of List plus manual duplicate checks? How do addAll, retainAll, and removeAll map to set reasoning?
    answer: >-
      Set makes uniqueness part of the data contract instead of scattering duplicate checks through application code. For Set values, addAll can be read as union, retainAll as intersection, and removeAll as difference. These bulk operations normally mutate the receiving set, so copy first when the original input must be preserved. Set also changes whole-container equality: two sets with the same members can be equal even if their encounter order differs.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Set/Set.md"
      anchor: "set-semantics"
    apiRelated:
      controller: "SetController"
      methodSignature: "uniquenessAndOrder()"

  - question: >-
      How does TreeSet determine uniqueness, and why can a Comparator inconsistent with equals be surprising?
    answer: >-
      TreeSet uses its ordering to place elements and treats compare(a,b)==0 as one logical position. If the comparator returns zero for objects whose equals result is false, TreeSet still has defined behavior, but its uniqueness semantics no longer match equality-based Set intuition. A comparator used by TreeSet should normally be consistent with equals or include a tie-breaker that reflects the domain identity the set is intended to model.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Set/Set.md"
      anchor: "treeset-order"
