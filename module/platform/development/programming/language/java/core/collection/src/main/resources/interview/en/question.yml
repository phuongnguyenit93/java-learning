questions:
  - question: >-
      What is a Collection, and why does Java need the Collections Framework when arrays already exist?
    answer: >-
      A collection is an abstraction for managing a group of elements as one object instead of managing separate variables. Arrays already store many values of one component type, but their size is fixed and they do not themselves standardize contracts such as uniqueness, key lookup, FIFO/LIFO processing, bulk operations, or multiple ordering strategies. The Collections Framework standardizes interfaces, implementations, and algorithms for those recurring needs. Choosing a collection does not make arrays obsolete; arrays still fit fixed-size data and API or performance boundaries that explicitly require them.
    aiGenerated: true
    reviewed: false
    readmeRelated:
