  - question: >-
      Collection declares add/remove/clear, so why can calling them still throw UnsupportedOperationException?
    answer: >-
      Many mutating Collection methods are optional operations. The interface supplies a common vocabulary that implementations may support, but a concrete collection may deliberately reject mutation, as List.of(...) does. Compile-time method availability therefore does not guarantee that the runtime object supports the operation. A caller must understand the mutability contract of the object it receives, not only the Collection/List type.
    aiGenerated: true
    reviewed: false
    readmeRelated:
