      methodSignature: ""

  - question: >-
      Distinguish Collection<E>, Collections, and the Java Collections Framework.
    answer: >-
      Collection<E> is the root interface for groups of elements such as List, Set, and Queue. Collections is a utility class containing static algorithms/helpers such as sort, reverse, binarySearch, and unmodifiable wrappers. The Java Collections Framework is the broader family of interfaces, implementations, and utilities; Map belongs to that framework even though it does not extend Collection<E>.
    aiGenerated: true
    reviewed: false
