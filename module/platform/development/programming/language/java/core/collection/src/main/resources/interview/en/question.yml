  - question: >-
      Why is List<Order> orders = new ArrayList<>() usually preferable to exposing ArrayList<Order> everywhere?
    answer: >-
      The variable type List<Order> publishes the contract callers need, while new ArrayList<>() chooses the current implementation. Depending on List lets the implementation change with less impact on callers. However, “program to an interface” does not mean implementation details are irrelevant: performance, null policy, mutability, and ordering still belong to the concrete object and must be chosen deliberately.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Hierarchy/Hierarchy.md"
      anchor: "interface-vs-implementation"
