questions:
  - id: collection-q01
    question: "Why does the Java Collections Framework exist when arrays can already hold multiple values?"
    answers:
      - {id: A, answer: "It provides standard abstractions and implementations for dynamic groups with behaviors such as ordering, uniqueness, key lookup, and queueing.", explanation: "Correct. Arrays solve fixed indexed storage, while JCF standardizes several common group-data contracts and operations."}
      - {id: B, answer: "Its main purpose is to resize an existing array in place while preserving the same array type and covariance rules.", explanation: "Incorrect. Collection implementations manage their own storage; the framework is not an in-place resizing layer over arbitrary arrays."}
      - {id: C, answer: "It gives every container one common ordering and duplicate policy so callers no longer need List, Set, Map, or Queue distinctions.", explanation: "Incorrect. Those distinctions are exactly the point: different collection contracts express different ordering, uniqueness, lookup, and queue semantics."}
      - {id: D, answer: "It is required because arrays cannot hold object references or participate in generic APIs.", explanation: "Incorrect. Arrays can hold reference types; Collections adds reusable contracts, implementations, and operations rather than fixing that nonexistent limitation."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Hierarchy/Hierarchy.md", anchor: "collection-purpose"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: collection-q02
    question: "Which statement correctly distinguishes Collection, Collections, and the Java Collections Framework?"
    answers:
      - {id: A, answer: "Collection is a utility class, Collections is the root interface, and JCF is only List and Set.", explanation: "Incorrect. Collection and Collections have the opposite roles, and JCF is broader than List and Set."}
      - {id: B, answer: "Collection is a root interface for element groups, Collections is a static utility class, and JCF is the overall family of interfaces, implementations, and algorithms.", explanation: "Correct. The similar names represent three different levels of the framework."}
      - {id: C, answer: "Collection and Collections are aliases; JCF is the package name java.collection.", explanation: "Incorrect. They are distinct types, and JCF is a framework concept rather than that package name."}
      - {id: D, answer: "Collections is an implementation of Collection used by ArrayList.", explanation: "Incorrect. Collections is a utility class and does not implement Collection."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Hierarchy/Hierarchy.md", anchor: "collection-vs-collections"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: collection-q03
    question: "A method only needs indexed access and ordered iteration. Which declaration best expresses its dependency?"
    answers:
      - {id: A, answer: "ArrayList<Order>, because callers should always depend on the concrete storage class.", explanation: "Incorrect. Depending on a concrete class exposes more implementation detail than the method requires."}
      - {id: B, answer: "Object, because the broadest possible type is always best.", explanation: "Incorrect. Object does not express the operations the method needs."}
      - {id: C, answer: "List<Order>, because it states the required contract while leaving the implementation selectable.", explanation: "Correct. Program to the smallest useful interface that expresses the behavior the code actually needs."}
      - {id: D, answer: "Collection<Order>, because Collection guarantees get(index).", explanation: "Incorrect. Collection does not define positional get(index)."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Hierarchy/Hierarchy.md", anchor: "interface-vs-implementation"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: collection-q04
    question: "Why can list.add(x) throw UnsupportedOperationException even though add is declared by Collection?"
    answers:
      - {id: A, answer: "Because add is only available when the element implements Cloneable.", explanation: "Incorrect. Cloneable has no role in Collection.add."}
      - {id: B, answer: "Because Collection methods are compile-time hints and implementations may omit them silently.", explanation: "Incorrect. Unsupported optional operations fail explicitly, commonly with UnsupportedOperationException."}
      - {id: C, answer: "Because add is a default method that always throws unless ArrayList overrides it.", explanation: "Incorrect. The point is the optional-operation contract, not a universal default implementation."}
      - {id: D, answer: "Because mutating operations are optional operations; an implementation such as List.of(...) may intentionally reject them.", explanation: "Correct. The interface exposes a common vocabulary while specific collections may be unmodifiable."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
