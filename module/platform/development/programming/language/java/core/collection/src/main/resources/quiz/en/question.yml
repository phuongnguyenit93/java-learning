  - id: collection-q15
    question: "What does Map<K,V> fundamentally model?"
    answers:
      - {id: A, answer: "A positional sequence where duplicate keys are stored at different indexes.", explanation: "Incorrect. Map is not positional, and each key has at most one current mapping."}
      - {id: B, answer: "A set of values in which both keys and values must be globally unique.", explanation: "Incorrect. Keys are unique, but multiple keys may map to equal values."}
      - {id: C, answer: "Mappings from unique keys to values; put on an existing key replaces the previous value and returns it.", explanation: "Correct. Map is a key-to-value association abstraction rather than a subtype of Collection."}
      - {id: D, answer: "A queue whose key is always the insertion index.", explanation: "Incorrect. Queue and Map express different contracts."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Map/Map.md", anchor: "map-semantics"}
