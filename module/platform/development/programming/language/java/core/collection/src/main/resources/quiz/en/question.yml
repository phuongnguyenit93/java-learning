  - id: collection-q13
    question: "A service needs unique IDs and must iterate them in first-insertion order. Which choice best matches the contract?"
    answers:
      - {id: A, answer: "LinkedHashSet, because it combines Set uniqueness with a defined insertion-based encounter order.", explanation: "Correct. Re-adding an existing element does not create a duplicate or normally move it to the end."}
      - {id: B, answer: "HashSet, because HashSet guarantees insertion order in Java 21.", explanation: "Incorrect. HashSet still does not promise a specific encounter order."}
      - {id: C, answer: "TreeSet, because TreeSet preserves first-insertion order rather than sorted order.", explanation: "Incorrect. TreeSet is ordered by comparison, not insertion chronology."}
      - {id: D, answer: "ArrayList, because List automatically rejects duplicates.", explanation: "Incorrect. List permits duplicate elements."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Set/Set.md", anchor: "linkedhashset-order"}
