  - id: collection-q19
    question: "Which statement about computeIfAbsent and merge is correct?"
    answers:
      - {id: A, answer: "computeIfAbsent always installs a mapping even when its mapping function returns null.", explanation: "Incorrect. A null result means no mapping is installed."}
      - {id: B, answer: "merge ignores the existing value and always overwrites it without invoking the remapping function.", explanation: "Incorrect. With an existing non-null value, merge calls the remapping function."}
      - {id: C, answer: "computeIfAbsent is useful for creating a value such as a List only when no non-null mapping exists; merge can combine an existing value and removes the mapping if its remapping result is null.", explanation: "Correct. Both operations encode common read-compute-write patterns with defined null semantics."}
      - {id: D, answer: "Both operations make arbitrary Map updates atomic across threads.", explanation: "Incorrect. Atomicity depends on the concrete concurrent-map contract, not plain Map."}
