  - id: collection-q18
    question: "Which implementation choice correctly matches Map ordering requirements?"
    answers:
      - {id: A, answer: "HashMap for sorted keys, LinkedHashMap for no order, TreeMap for insertion order.", explanation: "Incorrect. Those ordering contracts are mismatched."}
      - {id: B, answer: "HashMap when no encounter order is required, LinkedHashMap for insertion/access order, TreeMap for sorted key order.", explanation: "Correct. The three implementations differ mainly in ordering contract and associated costs."}
      - {id: C, answer: "All three guarantee the same insertion order; only memory usage differs.", explanation: "Incorrect. Their observable ordering contracts differ materially."}
      - {id: D, answer: "TreeMap is the only one that supports key lookup.", explanation: "Incorrect. All three are Map implementations that support key lookup."}
