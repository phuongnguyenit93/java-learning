  - id: collection-q20
    question: "For Queue operations, which method pairing correctly contrasts exception-based failure with special-value failure?"
    answers:
      - {id: A, answer: "add/offer are identical and both always throw when insertion fails.", explanation: "Incorrect. add uses an exception-style contract, while offer reports insertion failure with false."}
      - {id: B, answer: "remove/poll both return null on an empty queue.", explanation: "Incorrect. remove throws NoSuchElementException; poll returns null."}
      - {id: C, answer: "element/peek both throw on an empty queue.", explanation: "Incorrect. element throws, while peek returns null."}
      - {id: D, answer: "remove versus poll and element versus peek represent the same queue actions with exception versus special-value failure contracts.", explanation: "Correct. add/offer forms the analogous insertion pair."}
    correctAnswerId: D
