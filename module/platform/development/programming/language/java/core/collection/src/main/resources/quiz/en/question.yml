  - id: collection-q09
    question: "Which statement about Arrays.asList(array) is correct?"
    answers:
      - {id: A, answer: "It creates a fixed-size list backed by the array: set is supported, but size-changing add/remove operations are not.", explanation: "Correct. Changes through set are reflected in the backing array and vice versa."}
      - {id: B, answer: "It creates a normal resizable java.util.ArrayList independent of the array.", explanation: "Incorrect. The returned list is fixed-size and backed by the array."}
      - {id: C, answer: "It is identical to List.of and therefore rejects all element replacement.", explanation: "Incorrect. Arrays.asList allows set even though it does not allow size changes."}
      - {id: D, answer: "It copies the array deeply, including cloning every element.", explanation: "Incorrect. It is backed by the original array and does not deep-clone elements."}
    correctAnswerId: A
    aiGenerated: true
