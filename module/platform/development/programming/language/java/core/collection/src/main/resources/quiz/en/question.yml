  - id: collection-q10
    question: "How can the common Set/Collection API express the intersection of two mutable sets without manually nesting loops?"
    answers:
      - {id: A, answer: "Call addAll on the first set.", explanation: "Incorrect. addAll expresses a union-like update, not intersection."}
      - {id: B, answer: "Copy one set and call retainAll(other) on the copy.", explanation: "Correct. retainAll keeps only members also contained in the other collection."}
      - {id: C, answer: "Call clear on both sets and compare their sizes.", explanation: "Incorrect. That destroys the data and does not compute an intersection."}
      - {id: D, answer: "Convert both sets to maps because Set has no bulk operations.", explanation: "Incorrect. Collection provides bulk operations such as retainAll, removeAll, and addAll."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Set/Set.md", anchor: "set-algebra"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: collection-q11
    question: "When are two Sets equal according to the Set contract?"
    answers:
      - {id: A, answer: "Only when they use the same concrete implementation and iteration order.", explanation: "Incorrect. Set equality is intentionally independent of concrete implementation and encounter order."}
      - {id: B, answer: "Only when every element was inserted in the same chronological order.", explanation: "Incorrect. Insertion order is not part of Set.equals."}
      - {id: C, answer: "When they have the same size and the same members, regardless of encounter order.", explanation: "Correct. A HashSet and LinkedHashSet can therefore be equal even if they iterate differently."}
      - {id: D, answer: "Whenever their hashCode values happen to match.", explanation: "Incorrect. Equal sets must have compatible hash codes, but equal hash codes do not prove equality."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Set/Set.md", anchor: "set-equality"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: collection-q12
    question: "Which mental model best explains HashSet membership lookup?"
    answers:
      - {id: A, answer: "It sorts all elements on every contains call and then performs binary search.", explanation: "Incorrect. HashSet is hash-based rather than sorted by default."}
      - {id: B, answer: "It compares object identity only and never calls equals.", explanation: "Incorrect. Normal HashSet semantics use equals for logical equality."}
      - {id: C, answer: "It scans every element because hashCode is used only for printing.", explanation: "Incorrect. Hashing narrows the candidate region for expected-fast lookup."}
      - {id: D, answer: "hashCode narrows the candidate bucket/region and equals confirms whether an element is logically equal.", explanation: "Correct. A stable equals/hashCode contract is essential for correct hash-based behavior."}
    correctAnswerId: D
