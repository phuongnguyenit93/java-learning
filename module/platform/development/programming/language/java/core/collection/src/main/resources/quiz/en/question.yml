  - id: collection-q17
    question: "If a Map implementation permits null values, why can containsKey(k) still be necessary after getOrDefault/get-style lookup?"
    answers:
      - {id: A, answer: "Because a null result can be ambiguous between no mapping and a mapping whose value is null; containsKey tests key presence explicitly.", explanation: "Correct. Presence and mapped value are different questions when null values are allowed."}
      - {id: B, answer: "Because containsKey sorts the map before searching, making every lookup deterministic.", explanation: "Incorrect. containsKey checks presence; it does not establish a sort order."}
      - {id: C, answer: "Because getOrDefault always inserts the default value into the map.", explanation: "Incorrect. getOrDefault returns a fallback and does not insert it."}
      - {id: D, answer: "Because get cannot read entries created by putIfAbsent.", explanation: "Incorrect. get reads the current mapping regardless of which operation created it."}
    correctAnswerId: A
    aiGenerated: true
