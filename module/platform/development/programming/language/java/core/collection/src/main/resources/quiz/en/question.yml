  - id: collection-q21
    question: "How can one Deque naturally represent both FIFO and LIFO processing?"
    answers:
      - {id: A, answer: "FIFO can offerLast/pollFirst, while LIFO can use push/pop on the same double-ended abstraction.", explanation: "Correct. Deque supports operations at both ends and therefore expresses queue and stack patterns."}
      - {id: B, answer: "Deque is FIFO only; LIFO requires legacy Stack.", explanation: "Incorrect. Deque is the preferred modern stack abstraction as well."}
      - {id: C, answer: "Deque sorts elements before every removal, so FIFO and LIFO are aliases.", explanation: "Incorrect. Endpoint semantics, not sorting, distinguish the patterns."}
      - {id: D, answer: "Deque has indexes like List, and FIFO means remove(index 0) while LIFO means remove(lastIndex).", explanation: "Incorrect. Deque exposes endpoint operations rather than positional List indexing."}
    correctAnswerId: A
