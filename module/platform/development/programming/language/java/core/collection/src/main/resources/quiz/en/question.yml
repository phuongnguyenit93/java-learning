  - id: collection-q14
    question: "Why can a TreeSet keep only one of two objects for which comparator.compare(a, b) returns 0 even when a.equals(b) is false?"
    answers:
      - {id: A, answer: "TreeSet secretly converts every element to String and compares those strings.", explanation: "Incorrect. TreeSet uses its natural ordering or configured Comparator."}
      - {id: B, answer: "TreeSet uses comparison equivalence to determine a logical position for uniqueness, so compare == 0 means the elements collide in the sorted-set contract.", explanation: "Correct. This is why sorted-set ordering should normally be consistent with equals."}
      - {id: C, answer: "Set allows duplicates but TreeSet randomly discards some of them for performance.", explanation: "Incorrect. Set does not allow duplicate logical members, and TreeSet behavior follows its ordering contract."}
      - {id: D, answer: "This can happen only when both objects have the same hashCode.", explanation: "Incorrect. TreeSet is comparison-based, not hash-bucket-based."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Set/Set.md", anchor: "treeset-order"}
