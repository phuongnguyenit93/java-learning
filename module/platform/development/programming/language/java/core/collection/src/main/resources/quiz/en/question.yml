  - id: collection-q06
    question: "For a workload dominated by random indexed reads and appending, why is ArrayList usually a better default than LinkedList?"
    answers:
      - {id: A, answer: "LinkedList.get(index) is O(1), while ArrayList.get(index) must traverse nodes.", explanation: "Incorrect. The costs are reversed: ArrayList supports direct indexed access, while LinkedList traverses nodes."}
      - {id: B, answer: "ArrayList provides O(1) indexed access and amortized O(1) append, while LinkedList must traverse for arbitrary indexes and has per-node overhead.", explanation: "Correct. This matches the storage models and common workload costs."}
      - {id: C, answer: "ArrayList never reallocates its backing storage.", explanation: "Incorrect. It may resize and copy the backing array; append is amortized O(1), not always constant work."}
      - {id: D, answer: "LinkedList cannot add or remove at either end.", explanation: "Incorrect. LinkedList supports efficient endpoint operations and also implements Deque."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "11.ImplementationChoice/ImplementationChoice.md", anchor: "list-choice"}
    apiRelated: {controller: "ListController", methodSignature: "arrayVsLinked()"}

  - id: collection-q07
    question: "Given List<Integer> values = new ArrayList<>(List.of(10, 20, 30)), what does values.remove(1) do?"
    answers:
      - {id: A, answer: "It removes the Integer value 1 if present.", explanation: "Incorrect. A primitive int selects the remove(int index) overload."}
      - {id: B, answer: "It removes every value equal to 1.", explanation: "Incorrect. List.remove does not remove all matching values, and this call selects the index overload."}
      - {id: C, answer: "It removes the element at index 1, which is 20.", explanation: "Correct. To remove the value 10 by object equality, use something like remove(Integer.valueOf(10))."}
      - {id: D, answer: "It fails to compile because remove is ambiguous for Integer lists.", explanation: "Incorrect. Overload resolution selects remove(int)."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.List/List.md", anchor: "list-practical-boundaries"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: collection-q08
    question: "What is the key contract of list.subList(from, to)?"
    answers:
      - {id: A, answer: "It always creates a deep immutable copy of the selected elements.", explanation: "Incorrect. subList is not an independent deep copy."}
      - {id: B, answer: "It returns an unrelated mutable ArrayList containing copied references.", explanation: "Incorrect. The result remains connected to the original list."}
      - {id: C, answer: "It returns a fixed-size array adapter that cannot replace elements.", explanation: "Incorrect. That confuses subList with array/list adapter behavior."}
      - {id: D, answer: "It returns a backed view of a range, so supported mutations through the view affect the source list.", explanation: "Correct. If the backing list is structurally modified outside the returned subList, the subList semantics become undefined; a CME may be an implementation symptom, not the contract itself."}
    correctAnswerId: D
    aiGenerated: true
