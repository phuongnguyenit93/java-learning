  - id: collection-q16
    question: "What happens when a supported remove operation is performed through map.keySet()?"
    answers:
      - {id: A, answer: "Only the detached key-view copy changes; the Map is unaffected.", explanation: "Incorrect. keySet is normally a view backed by the map."}
      - {id: B, answer: "The key is replaced with null while its mapping stays present.", explanation: "Incorrect. Removing a key from the view removes its mapping."}
      - {id: C, answer: "The operation must always throw because all Map views are immutable.", explanation: "Incorrect. Some mutations such as removal are supported by these backed views."}
      - {id: D, answer: "The corresponding mapping is removed from the backing Map because keySet is a backed view.", explanation: "Correct. keySet, values, and entrySet expose live views with operation-specific mutation support."}
    correctAnswerId: D
