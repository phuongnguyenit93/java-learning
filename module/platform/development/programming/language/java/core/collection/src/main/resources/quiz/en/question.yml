  - id: collection-q05
    question: "Which property is fundamental to the List contract?"
    answers:
      - {id: A, answer: "Elements have an encounter order and positional indexes, and equal elements may appear more than once.", explanation: "Correct. List models an ordered positional sequence and does not impose uniqueness."}
      - {id: B, answer: "Every element must be unique and iteration order is irrelevant.", explanation: "Incorrect. That describes Set semantics more closely."}
      - {id: C, answer: "Every element must have a distinct key separate from the value.", explanation: "Incorrect. Key-to-value association belongs to Map."}
      - {id: D, answer: "The head is always the smallest element according to a comparator.", explanation: "Incorrect. That is a possible priority-queue behavior, not List semantics."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.List/List.md", anchor: "list-semantics"}
