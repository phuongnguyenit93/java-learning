  - question: >-
      keySet(), values() và entrySet() của Map là bản sao hay khung nhìn? Điều này ảnh hưởng thiết kế API thế nào?
    answer: >-
      Chúng thường là các khung nhìn liên kết với Map gốc, không phải collection độc lập. Thay đổi được hỗ trợ qua khung nhìn có thể thay đổi Map và thay đổi Map cũng được khung nhìn quan sát. Một số thao tác không có đủ thông tin nên không được hỗ trợ, ví dụ keySet().add(key) không biết giá trị nào cần gắn. Nếu API cần bản chụp độc lập phải tạo bản sao rõ ràng thay vì trả khung nhìn rồi giả định bên sử dụng không tác động tới trạng thái nền.
    aiGenerated: true
    reviewed: false
