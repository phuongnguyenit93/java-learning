  - question: >-
      Phân biệt collection có thể sửa, khung nhìn không cho sửa, cấu trúc cố định kích thước và bản chụp độc lập.
    answer: >-
      Collection có thể sửa cho phép thay đổi cấu trúc theo quy ước của nó. Collections.unmodifiableList(source) là lớp bọc không cho sửa nhưng vẫn nhìn thấy nguồn thay đổi vì chia sẻ trạng thái nền. Arrays.asList(array) là cấu trúc cố định kích thước: set được nhưng add/remove làm đổi kích thước thì không, đồng thời vẫn liên kết với mảng. List.copyOf(source) là bản chụp cấu trúc không cho sửa, không nhìn thấy thay đổi cấu trúc về sau của nguồn nhưng vẫn là bản sao nông đối với đối tượng phần tử. Vì vậy “không add được” chưa đủ để kết luận hai đối tượng có cùng ngữ nghĩa.
