  - question: >-
      Vì sao chính sách null phải được đọc theo cách triển khai/phương thức tạo thay vì chỉ nhìn interface?
    answer: >-
      Các interface List/Set/Map/Queue không áp một chính sách null giống nhau cho mọi cách triển khai. ArrayList và HashMap cho phép null theo quy ước riêng; ArrayDeque/PriorityQueue từ chối null; List.of/Set.of/Map.of và các họ copyOf cũng từ chối null. TreeSet/TreeMap với thứ tự tự nhiên thông thường không chấp nhận khóa/phần tử null vì không thể so sánh. Đặc biệt Queue dùng null từ poll/peek để biểu diễn trạng thái rỗng nên phần tử null sẽ làm ý nghĩa bị nhập nhằng.
