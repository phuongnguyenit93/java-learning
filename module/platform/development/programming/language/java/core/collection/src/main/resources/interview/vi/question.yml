  - question: >-
      EnumSet và EnumMap khác collection tổng quát ở điểm nào và khi nào nên chọn chúng?
    answer: >-
      Chúng chuyên biệt cho một enum universe đã biết. EnumSet thường dùng representation kiểu bit-vector; EnumMap dùng representation hướng array cho enum key. Cả hai duyệt theo thứ tự khai báo enum, cho semantics domain rõ và thường compact/efficient hơn cấu trúc tổng quát. EnumSet reject null element; EnumMap reject null key nhưng có thể chứa null value. Defined order của chúng không có nghĩa chúng implement Java 21 SequencedSet/SequencedMap.
