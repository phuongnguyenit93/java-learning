      methodSignature: ""

  - question: >-
      Vì sao thường khai báo List<Order> orders = new ArrayList<>() thay vì ArrayList<Order> ở cả hai phía?
    answer: >-
      Kiểu biến List<Order> công bố quy ước mà bên sử dụng cần, còn new ArrayList<>() chọn lớp triển khai hiện tại. Khi mã nguồn chỉ phụ thuộc List, lớp triển khai có thể đổi sang một List khác mà ít ảnh hưởng tới bên sử dụng. Tuy nhiên “program to interface” không có nghĩa bỏ qua lớp triển khai: hiệu năng, chính sách null, khả năng thay đổi và thứ tự thực tế vẫn phụ thuộc đối tượng cụ thể nên phải chọn có chủ đích.
    aiGenerated: true
    reviewed: false
    readmeRelated:
