  - question: >-
      Vì sao thường khai báo List<Order> orders = new ArrayList<>() thay vì ArrayList<Order> ở cả hai phía?
    answer: >-
      Kiểu biến List<Order> công bố contract mà caller cần, còn new ArrayList<>() chọn implementation hiện tại. Khi code chỉ phụ thuộc List, implementation có thể đổi sang một List khác mà ít ảnh hưởng tới caller. Tuy nhiên “program to interface” không có nghĩa bỏ qua implementation: performance, null policy, mutability và ordering thực tế vẫn phụ thuộc object cụ thể nên phải chọn implementation có chủ đích.
    aiGenerated: true
    reviewed: false
