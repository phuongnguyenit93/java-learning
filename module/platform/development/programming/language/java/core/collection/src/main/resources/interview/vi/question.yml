  - question: >-
      Thứ tự duyệt, thứ tự chèn và thứ tự sắp xếp khác nhau thế nào?
    answer: >-
      Thứ tự duyệt là thứ tự mà quá trình duyệt nhìn thấy phần tử. Thứ tự chèn là một cách tạo thứ tự duyệt, ví dụ LinkedHashSet mặc định, nhưng không phải mọi collection có thứ tự đều dùng thứ tự chèn. TreeSet duyệt theo thứ tự sắp xếp, còn List theo thứ tự chỉ số. HashSet không hứa thứ tự cụ thể. Vì vậy thấy kết quả lặp lại cùng một thứ tự không đủ để biến thứ tự đó thành quy ước.
    aiGenerated: true
    reviewed: false
    readmeRelated:
