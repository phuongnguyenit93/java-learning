  - question: >-
      Vì sao null policy phải được đọc theo implementation/factory thay vì chỉ nhìn interface?
    answer: >-
      List/Set/Map/Queue interface không áp một null policy giống nhau cho mọi implementation. ArrayList và HashMap cho null theo contract riêng; ArrayDeque/PriorityQueue reject null; List.of/Set.of/Map.of và copyOf reject null. TreeSet/TreeMap với natural ordering thường không chấp nhận null key/element vì không so sánh được. Đặc biệt Queue dùng null từ poll/peek để biểu diễn empty nên null element sẽ làm semantics mơ hồ.
