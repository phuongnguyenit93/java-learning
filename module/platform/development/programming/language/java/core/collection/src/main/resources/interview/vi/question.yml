  - question: >-
      Khi nào NavigableSet/NavigableMap đáng dùng thay vì HashSet/HashMap?
    answer: >-
      Dùng cấu trúc Sorted/Navigable khi bài toán cần duy trì thứ tự và truy vấn theo quan hệ thứ tự như lower/floor/ceiling/higher hoặc các phạm vi subSet/subMap/head/tail. HashSet/HashMap phù hợp hơn khi trọng tâm là tra cứu thành viên/khóa nhanh theo tính bằng nhau/hash và không cần điều hướng theo thứ tự. Các kết quả phạm vi của cấu trúc cây thường là khung nhìn liên kết nên cũng phải hiểu khả năng thay đổi và việc chia sẻ trạng thái của chúng.
