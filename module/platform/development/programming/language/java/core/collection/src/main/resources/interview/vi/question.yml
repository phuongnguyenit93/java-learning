  - question: >-
      Comparable và Comparator khác nhau thế nào? Kết quả compare âm, 0 và dương được hiểu ra sao?
    answer: >-
      Comparable đặt natural ordering bên trong type qua compareTo; Comparator đặt ordering bên ngoài để cùng type có nhiều cách sắp xếp. Contract chỉ quan tâm dấu: âm nghĩa là a đứng trước b, 0 là bằng nhau theo ordering, dương là a đứng sau b; caller không được giả định chỉ có -1/0/1. Với TreeSet/TreeMap, compare==0 còn ảnh hưởng uniqueness nên comparator là một phần quan trọng của data contract.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.OrderingSorting/OrderingSorting.md"
