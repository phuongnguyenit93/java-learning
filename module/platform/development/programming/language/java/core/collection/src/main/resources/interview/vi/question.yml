questions:
  - question: >-
      Collection là gì, tại sao Java cần Collections Framework khi đã có mảng?
    answer: >-
      Collection là mô hình trừu tượng để quản lý một nhóm phần tử như một đối tượng thay vì quản lý từng biến riêng lẻ. Mảng đã giải được việc chứa nhiều phần tử cùng kiểu thành phần nhưng có kích thước cố định và không tự cung cấp các quy ước như tính duy nhất, tra cứu theo khóa, FIFO/LIFO, thao tác hàng loạt hay nhiều chiến lược về thứ tự. Collections Framework chuẩn hóa các interface, lớp triển khai và thuật toán cho những nhu cầu đó. Chọn Collection không có nghĩa mảng trở nên vô dụng; mảng vẫn phù hợp khi kích thước cố định hoặc ranh giới API/hiệu năng yêu cầu nó.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Hierarchy/Hierarchy.md"
      anchor: "collection-purpose"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Phân biệt Collection<E>, Collections và Java Collections Framework.
    answer: >-
      Collection<E> là interface gốc cho các nhóm phần tử như List, Set và Queue. Collections là lớp tiện ích chứa các thuật toán/phương thức tĩnh như sort, reverse, binarySearch hoặc các lớp bọc không cho sửa. Java Collections Framework là khái niệm rộng hơn, bao gồm các interface, lớp triển khai và tiện ích liên quan; Map cũng thuộc framework dù không kế thừa Collection<E>.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Hierarchy/Hierarchy.md"
      anchor: "collection-vs-collections"
