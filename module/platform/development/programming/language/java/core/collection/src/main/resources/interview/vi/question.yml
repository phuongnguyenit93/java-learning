  - question: >-
      ConcurrentModificationException có nghĩa gì và vì sao fail-fast không phải cơ chế thread-safety?
    answer: >-
      CME thường có nghĩa iterator phát hiện structural modification làm traversal contract không còn hợp lệ; một thread duy nhất cũng có thể gây ra nó khi sửa collection trực tiếp ngoài iterator đang dùng. Fail-fast chỉ là best-effort bug detection, không phải guarantee phát hiện mọi modification và không tạo synchronization. Vì vậy không được dùng “không thấy CME” làm bằng chứng code concurrent an toàn.
