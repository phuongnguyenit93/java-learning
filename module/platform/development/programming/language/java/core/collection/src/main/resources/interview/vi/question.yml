  - question: >-
      compute/merge của Map giải quyết pattern gì và tại sao không nên tự suy ra atomicity cho Map thường?
    answer: >-
      compute/merge gom logic read-current-value rồi derive/write value mới thành operation có intent rõ hơn pattern get→if→put, rất hữu ích cho counter, grouping hoặc accumulation. Nhưng interface Map thường không hứa rằng operation đó trở thành atomic giữa nhiều thread. Atomicity cụ thể thuộc contract của concurrent implementation như ConcurrentMap/ConcurrentHashMap và nằm trong concurrency curriculum.
