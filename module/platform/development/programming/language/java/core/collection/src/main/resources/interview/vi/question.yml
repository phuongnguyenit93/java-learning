  - question: >-
      Vì sao mutable key/element có thể làm HashMap, HashSet, TreeMap hoặc TreeSet hoạt động khó hiểu?
    answer: >-
      Hash-based structure dựa vào state tham gia hashCode/equals để tìm bucket; sorted structure dựa vào state tham gia comparison để đặt vị trí trong tree. Nếu state đó thay đổi khi object đang nằm trong collection, object có thể không còn tìm được theo key/equality mới hoặc tree ordering bị phá invariant quan sát. Giải pháp thường là dùng key/value identity ổn định hoặc remove rồi reinsert sau mutation có chủ đích.
    aiGenerated: true
