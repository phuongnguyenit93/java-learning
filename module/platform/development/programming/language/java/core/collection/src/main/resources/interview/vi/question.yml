  - question: >-
      Spliterator khác Iterator ở boundary nào và tại sao Spliterator không tự đồng nghĩa với parallel execution?
    answer: >-
      Iterator tối ưu cho traversal tuần tự từng phần tử. Spliterator bổ sung metadata/characteristics về nguồn và khả năng trySplit để chia traversal cho consumer cao hơn như Stream. Việc source có Spliterator chỉ tạo khả năng partition; parallelStream/stream engine mới quyết định execution strategy, và Spliterator cũng không tự cung cấp thread-safety cho underlying collection.
