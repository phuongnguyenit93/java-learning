      anchor: "encounter-order"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Comparable và Comparator khác nhau thế nào? Kết quả compare âm, 0 và dương được hiểu ra sao?
    answer: >-
      Comparable đặt thứ tự tự nhiên bên trong kiểu qua compareTo; Comparator đặt thứ tự bên ngoài để cùng một kiểu có nhiều cách sắp xếp. Quy ước chỉ quan tâm dấu: âm nghĩa là a đứng trước b, 0 là bằng nhau theo thứ tự, dương là a đứng sau b; bên sử dụng không được giả định chỉ có -1/0/1. Với TreeSet/TreeMap, compare==0 còn ảnh hưởng tính duy nhất nên comparator là một phần quan trọng của quy ước dữ liệu.
