  - question: >-
      Vì sao Map không kế thừa Collection và Map.Entry đại diện cho điều gì?
    answer: >-
      Collection quản lý các element đơn lẻ, còn Map quản lý mapping key→value; operation add(E) không đủ mô tả việc một mapping cần cả key lẫn value. Map.Entry<K,V> là một mapping riêng lẻ bên trong map. Khi cần cả key và value, entrySet thường là đơn vị traversal đúng hơn pattern duyệt key rồi gọi get(key) lại.
