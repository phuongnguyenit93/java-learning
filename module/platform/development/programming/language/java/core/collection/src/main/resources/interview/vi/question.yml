  - question: >-
      LinkedHashMap và TreeMap đều có order nhưng order đó khác nhau thế nào?
    answer: >-
      LinkedHashMap giữ encounter order dựa trên insertion order hoặc access order tùy cách cấu hình. TreeMap duy trì key theo natural ordering hoặc Comparator và hỗ trợ sorted/navigable operations. Vì vậy cần hỏi nghiệp vụ muốn “nhớ lịch sử encounter/access” hay muốn “duy trì quan hệ sắp xếp theo key”; cùng có order nhưng contract và chi phí khác nhau.
