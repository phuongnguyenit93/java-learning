  - question: >-
      Vì sao Map không kế thừa Collection và Map.Entry đại diện cho điều gì?
    answer: >-
      Collection quản lý các phần tử đơn lẻ, còn Map quản lý ánh xạ khóa→giá trị; thao tác add(E) không đủ mô tả việc một ánh xạ cần cả khóa lẫn giá trị. Map.Entry<K,V> là một ánh xạ riêng lẻ bên trong Map. Khi cần cả khóa và giá trị, entrySet thường là đơn vị duyệt phù hợp hơn mẫu duyệt khóa rồi gọi get(key) lại.
    aiGenerated: true
    reviewed: false
    readmeRelated:
