  - question: >-
      Mô tả mô hình tra cứu của HashMap và vì sao khóa có thể thay đổi là nguy hiểm.
    answer: >-
      HashMap dùng hashCode để chọn vùng ứng viên rồi dùng equals để xác nhận khóa. Vì vậy khóa phải giữ ổn định các trạng thái tham gia hashCode/equals trong thời gian nằm trong Map. Nếu trường đó thay đổi sau put, đối tượng vẫn nằm trong cấu trúc nội bộ cũ nhưng tra cứu theo hash mới có thể không tìm thấy nó. Đây là bất biến của collection dựa trên hash, không phải lỗi ngẫu nhiên của containsKey/get.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.EqualityHashing/EqualityHashing.md"
      anchor: "mutable-element-risk"
    apiRelated:
      controller: "HashingController"
      methodSignature: "mutableKey()"

  - question: >-
      LinkedHashMap và TreeMap đều có thứ tự nhưng thứ tự đó khác nhau thế nào?
    answer: >-
      LinkedHashMap giữ thứ tự duyệt dựa trên thứ tự chèn hoặc thứ tự truy cập tùy cách cấu hình. TreeMap duy trì khóa theo thứ tự tự nhiên hoặc Comparator và hỗ trợ các thao tác sắp xếp/điều hướng. Vì vậy cần hỏi nghiệp vụ muốn “nhớ lịch sử chèn/truy cập” hay muốn “duy trì quan hệ sắp xếp theo khóa”; cùng có thứ tự nhưng quy ước và chi phí khác nhau.
