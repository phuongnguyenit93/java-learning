  - question: >-
      Quy tắc tính bằng nhau của List, Set, Map và Queue có giống nhau không?
    answer: >-
      Không. List định nghĩa tính bằng nhau theo kích thước và phần tử ở từng vị trí; Set theo cùng các phần tử không phụ thuộc thứ tự duyệt; Map theo cùng các ánh xạ. Collection/Queue không có một quy tắc bằng nhau theo phần tử chung, nên ArrayDeque/PriorityQueue thường giữ tính bằng nhau theo định danh từ Object. LinkedList là List nên dùng quy tắc của List dù cũng có thể dùng như Deque. Vì vậy “cùng phần tử” không đủ để kết luận mọi collection bằng nhau.
