  - question: >-
      Queue và Deque khác List ở mô hình tư duy nào? Khi nào nên dùng offer/poll/peek thay vì add/remove/element?
    answer: >-
      Queue/Deque nhấn mạnh thứ tự xử lý và các đầu được phép thao tác thay vì truy cập theo vị trí. Queue API có hai nhóm thao tác: add/remove/element báo thất bại bằng ngoại lệ, còn offer/poll/peek dùng giá trị trả về đặc biệt như false/null. Nếu rỗng/đầy là trạng thái bình thường, nhóm trả giá trị đặc biệt thường tiện hơn; nếu thất bại biểu thị bất biến bị phá, nhóm ném ngoại lệ có thể phù hợp. Deque mở hai đầu nên biểu diễn được cả Queue FIFO và Stack LIFO.
    aiGenerated: true
    reviewed: false
