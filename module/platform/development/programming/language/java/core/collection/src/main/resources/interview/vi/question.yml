  - question: >-
      EnumSet và EnumMap khác collection tổng quát ở điểm nào và khi nào nên chọn chúng?
    answer: >-
      Chúng chuyên biệt cho một miền enum đã biết. EnumSet thường dùng cách biểu diễn kiểu vector bit; EnumMap dùng cách lưu trữ dựa trên mảng cho khóa enum. Cả hai duyệt theo thứ tự khai báo enum, biểu đạt miền dữ liệu rõ và thường gọn/hiệu quả hơn cấu trúc tổng quát. EnumSet từ chối phần tử null; EnumMap từ chối khóa null nhưng có thể chứa giá trị null. Việc chúng có thứ tự xác định không có nghĩa chúng triển khai SequencedSet/SequencedMap trong Java 21.
