      methodSignature: ""

  - question: >-
      Khi nào NavigableSet/NavigableMap đáng dùng thay vì HashSet/HashMap?
    answer: >-
      Dùng sorted/navigable structure khi bài toán cần duy trì ordering và thực hiện query theo quan hệ thứ tự như lower/floor/ceiling/higher hoặc range subSet/subMap/head/tail. HashSet/HashMap phù hợp hơn khi trọng tâm là lookup membership/key nhanh theo equality/hash và không cần order-based navigation. Các range result của tree collections thường là backed views nên cũng phải hiểu mutability/aliasing của chúng.
