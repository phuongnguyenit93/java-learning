  - question: >-
      PriorityQueue có phải là một list luôn được sort không? Vì sao iterator của nó dễ gây hiểu nhầm?
    answer: >-
      Không. PriorityQueue chỉ đảm bảo head là phần tử có priority cao nhất/thấp nhất theo ordering của queue; internal heap không cần duy trì toàn bộ sequence ở sorted order. Muốn consume đúng priority phải poll lặp lại. Iterator không hứa trả tất cả phần tử theo priority order, và các phần tử compare bằng nhau cũng không có stable ordering mặc định.
