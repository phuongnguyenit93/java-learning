  - question: >-
      Collection interface công bố add/remove/clear nhưng tại sao gọi chúng vẫn có thể ném UnsupportedOperationException?
    answer: >-
      Nhiều mutation method của Collection là optional operation. Interface tạo vocabulary chung để các implementation có thể hỗ trợ khi phù hợp, nhưng một concrete collection có quyền không hỗ trợ mutation, ví dụ List.of(...). Vì vậy compile-time method availability không đồng nghĩa runtime object chắc chắn cho phép operation. API consumer phải hiểu mutability contract của object nhận được, không chỉ nhìn type Collection/List.
