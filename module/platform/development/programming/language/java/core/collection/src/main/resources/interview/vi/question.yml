  - question: >-
      PriorityQueue có phải là một List luôn được sắp xếp không? Vì sao Iterator của nó dễ gây hiểu nhầm?
    answer: >-
      Không. PriorityQueue chỉ đảm bảo phần tử đầu là phần tử có độ ưu tiên cao nhất/thấp nhất theo quy tắc sắp xếp của Queue; heap nội bộ không cần duy trì toàn bộ chuỗi theo thứ tự đã sắp xếp. Muốn lấy dữ liệu đúng thứ tự ưu tiên phải poll lặp lại. Iterator không hứa trả tất cả phần tử theo thứ tự ưu tiên, và các phần tử so sánh bằng nhau cũng không có thứ tự ổn định mặc định.
    aiGenerated: true
    reviewed: false
    readmeRelated:
