  - question: >-
      ArrayList và LinkedList khác nhau về mô hình tư duy và khi nào LinkedList thật sự có lợi?
    answer: >-
      ArrayList dùng vùng lưu trữ dạng mảng có khả năng tăng dung lượng nên get/set theo chỉ số là O(1), thêm cuối thường có chi phí amortized O(1), còn chèn/xóa giữa List phải dịch phần tử. LinkedList dùng các nút liên kết hai chiều; tìm vị trí bằng chỉ số là O(n), nhưng khi thuật toán đã có Iterator/nút đúng vị trí thì việc nối lại liên kết quanh vị trí đó rẻ. Vì vậy không nên nói chung rằng LinkedList chèn nhanh hơn ArrayList; với kiểu sử dụng Java thông thường, ArrayList thường là mặc định tốt hơn trừ khi thao tác hai đầu hoặc thay đổi tại vị trí Iterator thực sự phù hợp LinkedList.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.List/List.md"
      anchor: "arraylist-model"
    apiRelated:
      controller: "ListController"
      methodSignature: "arrayVsLinked()"

  - question: >-
      Hãy giải thích sự khác nhau giữa Arrays.asList, List.of, List.copyOf và new ArrayList<>(source).
    answer: >-
      Arrays.asList(array) tạo một List cố định kích thước liên kết với mảng: set được nhưng add/remove làm đổi kích thước thì không, và thay phần tử có thể phản ánh hai chiều với mảng. List.of tạo List không cho sửa từ các đối số và không cho null. List.copyOf tạo bản chụp cấu trúc không cho sửa của collection đầu vào, cũng từ chối null và có thể tái sử dụng đầu vào phù hợp. new ArrayList<>(source) tạo một List có thể sửa với trạng thái cấu trúc riêng; tất cả các cách này vẫn là bản sao nông đối với các đối tượng phần tử.
    aiGenerated: true
