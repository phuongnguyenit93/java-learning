  - question: >-
      Vì sao dùng Set thay vì List rồi tự kiểm tra trùng? addAll, retainAll và removeAll có ý nghĩa gì với Set?
    answer: >-
      Set đưa uniqueness vào chính contract của cấu trúc nên caller không phải rải duplicate-check logic khắp code. Với Set, addAll có thể đọc như union, retainAll như intersection và removeAll như difference. Các bulk operation này thường mutate set nhận lời gọi, nên nếu cần giữ input phải copy trước. Việc dùng Set còn ảnh hưởng equality của cả container: member giống nhau thì hai Set có thể equal dù encounter order khác.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Set/Set.md"
      anchor: "set-semantics"
    apiRelated:
      controller: "SetController"
      methodSignature: "uniquenessAndOrder()"

  - question: >-
      TreeSet xác định uniqueness như thế nào và vì sao Comparator không consistent with equals có thể gây bất ngờ?
    answer: >-
      TreeSet dùng ordering để đặt phần tử và xem compare(a,b)==0 là cùng một vị trí logic. Nếu comparator trả 0 cho hai object mà equals lại false, TreeSet vẫn có behavior xác định nhưng semantics uniqueness khác trực giác equality-based của Set. Vì vậy comparator dùng cho TreeSet thường nên consistent with equals hoặc phải có tie-breaker phù hợp với identity nghiệp vụ mà set muốn biểu diễn.
