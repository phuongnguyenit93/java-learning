  - question: >-
      Iterator, vòng lặp for-each và ListIterator khác nhau về vai trò như thế nào?
    answer: >-
      Iterator là giao thức duyệt tuần tự với hasNext/next và thao tác remove tùy chọn. Vòng for-each là cú pháp dùng Iterable/Iterator ở phía dưới để mã nguồn dễ đọc hơn nhưng không lộ con trỏ duyệt trực tiếp. ListIterator dành riêng cho List, hỗ trợ đi hai chiều, chỉ số và thay đổi theo vị trí như add/set/remove. Chọn mô hình đơn giản nhất đáp ứng thuật toán; không dùng ListIterator chỉ vì nó có nhiều phương thức hơn.
    aiGenerated: true
    reviewed: false
