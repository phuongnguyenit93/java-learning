  - question: >-
      ArrayList và LinkedList khác nhau về mental model và khi nào LinkedList thật sự có lợi?
    answer: >-
      ArrayList dùng vùng lưu trữ dạng mảng có khả năng tăng capacity nên get/set theo index O(1), append thường amortized O(1), còn insert/remove giữa list phải dịch phần tử. LinkedList dùng node liên kết hai chiều; tìm vị trí bằng index là O(n), nhưng khi thuật toán đã có iterator/node đúng vị trí thì relink quanh vị trí đó rẻ. Vì vậy không nên nói chung rằng LinkedList insert nhanh hơn ArrayList; với workload Java thông thường, ArrayList thường là mặc định tốt hơn trừ khi pattern thao tác hai đầu hoặc traversal-position mutation thực sự phù hợp LinkedList.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.List/List.md"
      anchor: "arraylist-model"
    apiRelated:
      controller: "ListController"
      methodSignature: "arrayVsLinked()"

  - question: >-
      Hãy giải thích sự khác nhau giữa Arrays.asList, List.of, List.copyOf và new ArrayList<>(source).
    answer: >-
      Arrays.asList(array) là fixed-size list backed by array: set được nhưng add/remove đổi size không được, và thay element có thể phản ánh hai chiều với array. List.of tạo unmodifiable list từ các argument và không cho null. List.copyOf tạo unmodifiable structural snapshot của collection đầu vào, cũng reject null và có thể reuse input phù hợp. new ArrayList<>(source) tạo một mutable list có structural state riêng; các cách này đều là shallow đối với object element.
    aiGenerated: true
    reviewed: false
