  - question: >-
      Iterator, enhanced for và ListIterator khác nhau về vai trò như thế nào?
    answer: >-
      Iterator là traversal protocol tuần tự với hasNext/next và optional remove. Enhanced for là syntax dùng Iterable/Iterator ở phía dưới để code đọc dễ hơn nhưng không expose cursor trực tiếp. ListIterator dành riêng cho List, hỗ trợ đi hai chiều, index và mutation theo vị trí như add/set/remove. Chọn abstraction đơn giản nhất đáp ứng thuật toán; không dùng ListIterator chỉ vì nó có nhiều method hơn.
