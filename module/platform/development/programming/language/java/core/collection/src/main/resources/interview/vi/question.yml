  - question: >-
      Phân biệt Collection<E>, Collections và Java Collections Framework.
    answer: >-
      Collection<E> là interface gốc cho các nhóm phần tử như List, Set và Queue. Collections là utility class chứa static algorithm/helper như sort, reverse, binarySearch hoặc các wrapper unmodifiable. Java Collections Framework là khái niệm rộng hơn bao gồm các interface, implementation và utility liên quan, trong đó Map cũng thuộc framework dù không kế thừa Collection<E>.
