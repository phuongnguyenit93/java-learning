questions:
  - question: >-
      Collection là gì, tại sao Java cần Collections Framework khi đã có array?
    answer: >-
      Collection là abstraction để quản lý một nhóm phần tử như một object thay vì quản lý từng biến riêng lẻ. Array đã giải được việc chứa nhiều phần tử cùng component type nhưng kích thước cố định và không tự cung cấp các contract như uniqueness, lookup theo key, FIFO/LIFO, bulk operation hay nhiều chiến lược ordering. Collections Framework chuẩn hóa các interface, implementation và algorithm cho những nhu cầu đó. Chọn Collection không có nghĩa array vô dụng; array vẫn phù hợp khi kích thước cố định hoặc API/performance boundary yêu cầu nó.
