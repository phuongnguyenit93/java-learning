  - question: >-
      Spliterator khác Iterator ở ranh giới nào và tại sao Spliterator không tự đồng nghĩa với thực thi song song?
    answer: >-
      Iterator tối ưu cho việc duyệt tuần tự từng phần tử. Spliterator bổ sung metadata/đặc tính của nguồn và khả năng trySplit để chia quá trình duyệt cho thành phần cấp cao hơn như Stream. Việc nguồn có Spliterator chỉ tạo khả năng chia dữ liệu; parallelStream/cơ chế Stream mới quyết định chiến lược thực thi, và Spliterator cũng không tự cung cấp an toàn luồng cho collection bên dưới.
