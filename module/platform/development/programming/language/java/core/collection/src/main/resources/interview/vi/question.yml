  - question: >-
      Encounter order, insertion order và sorted order khác nhau thế nào?
    answer: >-
      Encounter order là thứ tự traversal nhìn thấy phần tử. Insertion order là một cách tạo encounter order, ví dụ LinkedHashSet mặc định, nhưng không phải mọi ordered collection đều dùng insertion order. TreeSet có encounter order theo sorted ordering, còn List theo index order. HashSet không hứa order cụ thể. Vì vậy thấy output lặp lại cùng một thứ tự không đủ để biến thứ tự đó thành contract.
    aiGenerated: true
    reviewed: false
    readmeRelated:
