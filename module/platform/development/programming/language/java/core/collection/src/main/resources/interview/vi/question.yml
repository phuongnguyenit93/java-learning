  - question: >-
      Nếu phải chọn cách triển khai Collection cho một API mới, nên bắt đầu từ đâu thay vì chọn theo thói quen?
    answer: >-
      Bắt đầu từ ngữ nghĩa: có cần vị trí, tính duy nhất, tra cứu theo khóa, FIFO/LIFO, độ ưu tiên hay điều hướng theo thứ tự không. Sau đó xét thứ tự duyệt, quyền thay đổi/sở hữu dữ liệu, giới hạn null và phương thức tạo, chi phí bộ nhớ cùng chi phí của các thao tác chính. Trước khi mặc định dùng cấu trúc đa dụng, kiểm tra xem miền dữ liệu có phù hợp với cấu trúc chuyên biệt như EnumSet/EnumMap hay không. Chỉ sau khi quy ước đã đúng mới để hiệu năng của lớp triển khai quyết định; Big-O hoặc phép đo vi mô không cứu được một cấu trúc có ngữ nghĩa sai.
