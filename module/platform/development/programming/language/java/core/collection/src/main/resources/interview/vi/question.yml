  - question: >-
      Equality của List, Set, Map và Queue có giống nhau không?
    answer: >-
      Không. List định nghĩa value equality theo size và element ở từng vị trí; Set theo cùng member không phụ thuộc encounter order; Map theo cùng mapping. Collection/Queue không có một universal element-based equality contract, nên ArrayDeque/PriorityQueue thường giữ identity equality từ Object. LinkedList là List nên dùng List equality dù cũng có thể dùng như Deque. Vì vậy “cùng phần tử” không đủ để kết luận mọi collection equal nhau.
    aiGenerated: true
    reviewed: false
