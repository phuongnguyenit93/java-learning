  - question: >-
      keySet(), values() và entrySet() của Map là copy hay view? Điều này ảnh hưởng thiết kế API thế nào?
    answer: >-
      Chúng thường là backed views của map gốc, không phải collection độc lập. Mutation được hỗ trợ qua view có thể thay đổi map và thay đổi map cũng được view quan sát. Một số operation không có đủ thông tin nên bị unsupported, ví dụ keySet().add(key) không biết value nào cần gắn. Nếu API cần snapshot độc lập phải copy rõ ràng thay vì trả view rồi giả định caller không tác động tới backing state.
