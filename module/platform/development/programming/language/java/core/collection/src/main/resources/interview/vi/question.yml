  - question: >-
      Vì sao khóa/phần tử có thể thay đổi có thể làm HashMap, HashSet, TreeMap hoặc TreeSet hoạt động khó hiểu?
    answer: >-
      Cấu trúc dựa trên hash dùng trạng thái tham gia hashCode/equals để tìm bucket; cấu trúc có sắp xếp dùng trạng thái tham gia phép so sánh để đặt vị trí trong cây. Nếu trạng thái đó thay đổi khi đối tượng đang nằm trong collection, đối tượng có thể không còn được tìm thấy theo khóa/tính bằng nhau mới hoặc thứ tự cây bị phá vỡ. Giải pháp thường là dùng định danh khóa/phần tử ổn định hoặc xóa rồi chèn lại sau thay đổi có chủ đích.
