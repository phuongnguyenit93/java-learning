  - question: >-
      Mô tả mental model lookup của HashMap và vì sao key mutable nguy hiểm.
    answer: >-
      HashMap dùng hashCode để chọn vùng ứng viên rồi dùng equals để xác nhận key. Vì vậy key phải giữ ổn định những state tham gia hashCode/equals trong thời gian nằm trong map. Nếu field đó thay đổi sau put, object vẫn nằm trong internal structure cũ nhưng lookup theo hash mới có thể không tìm thấy nó. Đây là invariant của hash-based collection, không phải lỗi ngẫu nhiên của containsKey/get.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.EqualityHashing/EqualityHashing.md"
