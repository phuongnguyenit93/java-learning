  - question: >-
      Queue và Deque khác List ở mental model nào? Khi nào nên dùng offer/poll/peek thay vì add/remove/element?
    answer: >-
      Queue/Deque nhấn mạnh thứ tự xử lý và các đầu được phép thao tác thay vì positional indexing. Queue API có hai nhóm operation: add/remove/element báo failure bằng exception, còn offer/poll/peek dùng return value đặc biệt như false/null. Nếu empty/full là trạng thái bình thường, special-value pair thường tiện hơn; nếu failure biểu thị invariant bị phá, exception pair có thể phù hợp. Deque mở hai đầu nên biểu diễn cả FIFO queue và LIFO stack.
    aiGenerated: true
    reviewed: false
