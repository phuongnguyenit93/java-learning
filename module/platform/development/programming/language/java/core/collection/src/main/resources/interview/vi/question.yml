  - question: >-
      ConcurrentModificationException có nghĩa gì và vì sao fail-fast không phải cơ chế an toàn luồng?
    answer: >-
      CME thường có nghĩa Iterator phát hiện thay đổi cấu trúc làm quy ước duyệt không còn phù hợp; một luồng duy nhất cũng có thể gây ra nó khi sửa collection trực tiếp ngoài Iterator đang dùng. Fail-fast chỉ cố gắng phát hiện lỗi, không bảo đảm phát hiện mọi thay đổi và không tạo đồng bộ hóa. Vì vậy không được dùng “không thấy CME” làm bằng chứng rằng mã nguồn truy cập đồng thời là an toàn.
