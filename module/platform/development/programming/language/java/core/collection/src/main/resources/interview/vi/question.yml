  - question: >-
      Collection interface công bố add/remove/clear nhưng tại sao gọi chúng vẫn có thể ném UnsupportedOperationException?
    answer: >-
      Nhiều phương thức thay đổi dữ liệu của Collection là thao tác tùy chọn. Interface tạo một tập thao tác chung để các lớp triển khai hỗ trợ khi phù hợp, nhưng một collection cụ thể có quyền không hỗ trợ thay đổi, ví dụ List.of(...). Vì vậy việc phương thức tồn tại ở thời điểm biên dịch không đồng nghĩa đối tượng lúc chạy chắc chắn cho phép thao tác đó. Bên sử dụng API phải hiểu quy ước về khả năng thay đổi của đối tượng nhận được, không chỉ nhìn kiểu Collection/List.
