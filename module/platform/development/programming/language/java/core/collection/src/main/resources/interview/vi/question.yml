  - question: >-
      Phân biệt mutable collection, unmodifiable view, fixed-size adapter và snapshot copy.
    answer: >-
      Mutable collection cho phép structural mutation theo contract. Collections.unmodifiableList(source) là read-only wrapper nhưng vẫn nhìn thấy source đổi vì share backing state. Arrays.asList(array) là fixed-size adapter: set được nhưng add/remove đổi size không được và share array backing. List.copyOf(source) là unmodifiable structural snapshot, không nhìn thấy structural change sau đó của source nhưng vẫn shallow đối với mutable element object. Vì vậy “không add được” chưa đủ để kết luận hai object có cùng semantics.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.MutableImmutable/MutableImmutable.md"
      anchor: "view-vs-copy"
    apiRelated:
      controller: "ImmutabilityController"
      methodSignature: "viewVsCopy()"

  - question: >-
      Nếu phải chọn implementation Collection cho một API mới, nên bắt đầu từ đâu thay vì chọn theo thói quen?
    answer: >-
      Bắt đầu từ semantics: có cần positional order, uniqueness, key lookup, FIFO/LIFO, priority hay sorted navigation không. Sau đó xét encounter order, null policy, mutability/ownership và chi phí operation quan trọng trong workload. Chỉ sau khi contract đúng mới tối ưu performance bằng ArrayList/HashMap/TreeMap...; micro-benchmark hoặc Big-O không cứu được một data structure có semantics sai.
