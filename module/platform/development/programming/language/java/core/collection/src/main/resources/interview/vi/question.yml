  - question: >-
      Vì sao dùng Set thay vì List rồi tự kiểm tra trùng? addAll, retainAll và removeAll có ý nghĩa gì với Set?
    answer: >-
      Set đưa tính duy nhất vào chính quy ước của cấu trúc nên bên sử dụng không phải rải logic kiểm tra trùng lặp khắp mã nguồn. Với Set, addAll có thể đọc như phép hợp, retainAll như phép giao và removeAll như phép hiệu. Các thao tác hàng loạt này thường thay đổi Set nhận lời gọi, nên nếu cần giữ dữ liệu đầu vào phải tạo bản sao trước. Việc dùng Set còn ảnh hưởng tính bằng nhau của cả cấu trúc: cùng các phần tử thì hai Set có thể bằng nhau dù thứ tự duyệt khác.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Set/Set.md"
      anchor: "set-semantics"
    apiRelated:
      controller: "SetController"
      methodSignature: "uniquenessAndOrder()"

  - question: >-
      TreeSet xác định tính duy nhất như thế nào và vì sao Comparator không nhất quán với equals có thể gây bất ngờ?
    answer: >-
      TreeSet dùng thứ tự so sánh để đặt phần tử và xem compare(a,b)==0 là cùng một vị trí logic. Nếu comparator trả 0 cho hai đối tượng mà equals lại false, TreeSet vẫn có hành vi xác định nhưng ngữ nghĩa về tính duy nhất khác trực giác dựa trên equals của Set. Vì vậy comparator dùng cho TreeSet thường nên nhất quán với equals hoặc phải có tiêu chí phân xử phù hợp với định danh nghiệp vụ mà Set muốn biểu diễn.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Set/Set.md"
      anchor: "treeset-order"
