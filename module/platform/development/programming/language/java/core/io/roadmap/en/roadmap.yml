# <roadmap-schema>
# Module Roadmap Structure
# schema-version: 1
#
# YAML CONTRACT
# roadmap: High-level learning milestones for the current language roadmap.
#
# - id [string, required]: Stable and unique milestone identity within the current language roadmap.
# - title [string, required]: Milestone title displayed to the learner.
# - purpose [string, required]: What the learner should understand or achieve from this milestone.
# - dependsOn [list, optional]: Prerequisite milestone ids when item order alone is not enough to express the dependency.
# - objectives [list, optional]: Milestone-level learning objectives; do not use this to list every small fact/API/syntax item.
# - relatedKnowledge [list, optional]: Knowledge category ids in the current module that support this milestone. Portal displays this list on the side opposite the milestone and clicking an item navigates to the matching Knowledge category.
# - relatedModules [list, optional]: Related modules displayed as Portal Level 2 cards. Each item requires routeId and may provide localized label/note; this relation is navigation only and does not create child milestones or change learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - What is this topic/module?
#   - Why does it exist?
#   - What problem exists without it?
# FOUNDATION
#   - What prerequisite or mental model must the learner have first?
# CORE MODEL
#   - What major abstractions or building blocks make up this topic?
# MECHANICS
#   - How does it work at the language/runtime/API level appropriate for this module?
# USAGE
#   - How is it used in real code?
# DECISION / TRADE-OFF
#   - When should this mechanism be chosen over another?
#   - When should it not be used?
# FAILURE / PITFALL
#   - What mistakes, compile-time failures, or runtime failures matter?
# INTEGRATION
#   - How does this topic connect to neighboring concepts/modules?
# SYNTHESIS
#   - What end-to-end mental model should the learner retain?
#
# Each language owns its own roadmap. Do not infer or synchronize its structure from another language roadmap.
# Item order in roadmap is the default learning order. Use dependsOn only when a dependency needs to be expressed beyond the linear order.
# The skeleton must not force every module to have the same number of nodes. It is a thinking framework, not a rigid template.
# </roadmap-schema>

roadmap:
  - id: io-mental-model
    title: I/O Data-Flow Model and Resource Lifetime
    purpose: Understand why I/O exists: programs need one model for reading data from a source and writing data to a sink whether that endpoint is a file, console, memory region, or another resource, while accounting for representation, completion behavior, buffering, encoding, and resource lifetime.
    relatedKnowledge:
      - MentalModel
    objectives:
      - Identify what data is moving, where it comes from, where it goes, and, when a closeable resource exists, who owns the responsibility to close it before choosing an API.
      - Distinguish bytes from characters, buffering from storage, and resource lifetime from ordinary object lifetime; distinguish blocking/non-blocking call behavior from asynchronous completion and do not treat asynchronous as a synonym for non-blocking.
  - id: byte-streams
    title: Byte Streams and Structured Binary Data
    purpose: Understand when data must remain raw bytes and how Java reads or writes bytes and ordered primitive values.
    relatedKnowledge:
      - ByteStreams
    objectives:
      - Understand the InputStream/OutputStream model, read() return values, EOF, and partial reads/writes.
      - Distinguish arbitrary bytes from structured primitive binary values carried through DataInput/DataOutput and an explicit framing contract.
  - id: character-streams
    title: Character Streams and Charset Conversion
    purpose: Understand how bytes become characters for text I/O and why decoding and encoding require a charset-aware bridge.
    relatedKnowledge:
      - CharacterStreams
    relatedModules:
      - routeId: JAVA_STRING
        label: String
        note: The String module owns the charset/Unicode text model that text I/O relies on.
    objectives:
      - Choose Reader/Writer when the payload is text and make charset conversion explicit at byte ↔ character boundaries.
      - Avoid applying text semantics to arbitrary binary payloads.
  - id: buffered-io
    title: Stream Wrappers, Buffering, and Flush Semantics
    purpose: Understand how Java composes I/O layers with wrappers that add behavior, with buffering as a key case that batches small reads/writes to reduce underlying I/O overhead.
    relatedKnowledge:
      - BufferedIO
    objectives:
      - Understand how an outer I/O layer can add behavior and delegate to an inner resource instead of each API implementing the whole transfer itself.
      - Use buffering when the access pattern benefits from fewer underlying operations.
      - Flush intentionally without assuming every wrapper has identical behavior.
  - id: legacy-file-model
    title: File and the Legacy Path Model
    purpose: Understand what java.io.File represents in the legacy I/O model and why it is neither file contents nor an open file handle.
    relatedKnowledge:
      - File
    objectives:
      - Distinguish java.io.File from file contents and from resources opened for reading or writing.
      - Recognize File limitations so the transition to Path/Files in modern code is motivated rather than memorized.
  - id: modern-filesystem
    title: Path, Files, and the Modern Filesystem Model
    purpose: Understand how Path, Files, FileSystem, FileSystemProvider, and FileStore separate path identity, operations, filesystem capabilities, and storage metadata.
    relatedKnowledge:
      - PathFiles
    objectives:
      - Use Path/Files for resolve/normalize, read/write, copy/move/delete, temporary resources, attributes, and directory traversal.
      - Respect provider capabilities, permission/ownership views, and WatchService boundaries instead of assuming all filesystems behave alike.
  - id: buffers-and-channels
    title: Buffers and Channels in NIO
    purpose: Understand NIO's transfer model in which buffers hold stateful data while channels move data between memory and I/O resources.
    relatedKnowledge:
      - BuffersChannels
    objectives:
      - Reason about position, limit, capacity, and flip/clear/compact transitions rather than treating Buffer as a simple array.
      - Understand byte order, scatter/gather, and when lower-level control is justified over ordinary stream I/O.
  - id: file-channels-and-advanced-file-io
    title: FileChannel and Advanced File I/O
    purpose: Understand file-specific capabilities such as positional access, locking, memory mapping, direct transfer, and asynchronous I/O.
    relatedKnowledge:
      - FileChannel
    objectives:
      - Choose FileChannel or AsynchronousFileChannel only when their specialized capabilities solve a concrete need.
      - Recognize the boundaries and lifecycle implications of locking, mapping, transfer, and asynchronous file I/O.
  - id: resource-management
    title: Resource Lifetime and Failure Safety
    purpose: Understand why I/O resources require deterministic release and how structured cleanup interacts with failures during work and close operations.
    relatedKnowledge:
      - ResourceManagement
    relatedModules:
      - routeId: JAVA_EXCEPTION
        label: Exceptions
        note: The Exception module owns propagation, suppressed-exception, and cleanup semantics used by I/O resources.
    objectives:
      - Use try-with-resources as the default ownership structure when code owns a Closeable/AutoCloseable resource.
      - Preserve failure context when both the main operation and close operation fail.
  - id: serialization-boundary
    title: Java Object Serialization Boundary
    purpose: Understand Java Object Serialization as an object-graph serialization mechanism with identity, versioning, compatibility, and security boundaries rather than a universal data format.
    relatedKnowledge:
      - Serialization
    objectives:
      - Understand how Serializable, object graphs, serialVersionUID, and transient affect serialized state.
      - Recognize compatibility and security risks before choosing native Java serialization.
  - id: io-choice-synthesis
    title: Choosing the Simplest Correct I/O Abstraction
    purpose: Connect payload type, scale, operation pattern, resource lifetime, and API capabilities into one decision model.
    relatedKnowledge:
      - ChoosingIO
    relatedModules:
      - routeId: JAVA_CLASSLOADER
        label: ClassLoader
        note: Classpath resource lookup follows different rules from filesystem path I/O.
    objectives:
      - Prefer the highest-level API that preserves the required data semantics and performance characteristics.
      - Distinguish when to choose stream/reader, Path/Files, channels, or ClassLoader resource lookup.
