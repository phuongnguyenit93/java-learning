questions:
  - id: io-q01
    question: "Phát biểu nào mô tả đúng nhất I/O trong một chương trình Java?"
    answers:
      - {id: A, answer: "Chỉ là thao tác đọc và ghi tệp trên đĩa.", explanation: "Sai. Tệp chỉ là một loại nguồn hoặc đích; I/O còn bao gồm bảng điều khiển, vùng nhớ, socket và nhiều tài nguyên khác."}
      - {id: B, answer: "Là việc đưa dữ liệu từ nguồn vào chương trình hoặc từ chương trình tới đích.", explanation: "Đúng. Mô hình nguồn → luồng dữ liệu → đích bao quát tệp, bảng điều khiển, vùng nhớ, socket và cả I/O thuần trong bộ nhớ; I/O không bắt buộc phải vượt qua ranh giới tiến trình."}
      - {id: C, answer: "Là cách JVM tự động lưu mọi đối tượng trong RAM xuống đĩa.", explanation: "Sai. Đối tượng trong RAM không tự trở thành dữ liệu bền vững khi tiến trình kết thúc."}
      - {id: D, answer: "Chỉ là các API trong package java.io.", explanation: "Sai. Java I/O còn bao gồm NIO như java.nio.file và java.nio.channels."}
