      - {id: C, answer: "API không chặn cho phép lời gọi trả quyền điều khiển mà không chờ tài nguyên sẵn sàng/tiến triển; API bất đồng bộ khởi chạy thao tác rồi chuyển kết quả hoàn tất về sau, chẳng hạn qua Future hoặc callback.", explanation: "Đúng. Cơ chế thực thi bên dưới có thể khác nhau, nên không được định nghĩa bất đồng bộ như từ đồng nghĩa của không chặn."}
      - {id: D, answer: "Không chặn luôn tạo luồng thực thi mới còn bất đồng bộ không bao giờ dùng luồng thực thi.", explanation: "Sai. Không khái niệm nào có quy tắc luồng thực thi tuyệt đối như vậy."}
