    question: "Phát biểu nào phân biệt đúng nhất I/O bất đồng bộ với I/O không chặn?"
    answers:
      - {id: A, answer: "Hai khái niệm là đồng nghĩa: mọi API bất đồng bộ đều không chặn theo đúng cùng một nghĩa.", explanation: "Sai. Chúng mô tả hai chiều khác nhau của cách tổ chức chờ và hoàn tất."}
