  - id: io-q03
    question: "Điểm khác biệt cốt lõi của I/O không chặn (non-blocking I/O) là gì?"
    answers:
      - {id: A, answer: "Lời gọi có thể trả quyền điều khiển khi chưa có tiến triển, còn chương trình tự tổ chức việc theo dõi trạng thái sẵn sàng và thử lại.", explanation: "Đúng. Không chặn thay đổi cách tổ chức thời gian chờ; nó không loại bỏ độ trễ của tài nguyên bên ngoài."}
      - {id: B, answer: "Đĩa và mạng không còn độ trễ.", explanation: "Sai. Độ trễ vật lý vẫn tồn tại."}
      - {id: C, answer: "Mọi thao tác luôn chạy trên một luồng thực thi mới.", explanation: "Sai. Không chặn không đồng nghĩa tự tạo luồng thực thi mới cho từng thao tác."}
      - {id: D, answer: "Mỗi thao tác luôn xử lý toàn bộ dữ liệu trong một lần gọi.", explanation: "Sai. Tùy API, thao tác có thể chỉ tiến triển một phần hoặc chưa tiến triển."}
    correctAnswerId: A
    aiGenerated: true
