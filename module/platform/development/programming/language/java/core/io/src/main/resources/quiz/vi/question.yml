  - id: io-q02
    question: "Khi sao chép một ảnh PNG, mức trừu tượng nào giữ đúng ý nghĩa dữ liệu nhất?"
    answers:
      - {id: A, answer: "Reader/Writer vì chúng xử lý dữ liệu ở tầng cao hơn.", explanation: "Sai. PNG là dữ liệu nhị phân; giải mã byte thành ký tự có thể làm thay đổi dữ liệu gốc."}
      - {id: B, answer: "String vì mọi dữ liệu cuối cùng đều có thể chuyển thành văn bản.", explanation: "Sai. Ép dữ liệu nhị phân thành văn bản tạo thêm một quy ước mã hóa không tồn tại trong định dạng ảnh."}
      - {id: C, answer: "PrintWriter vì có thể in từng byte.", explanation: "Sai. PrintWriter là API hướng ký tự/văn bản và có cách báo lỗi riêng."}
      - {id: D, answer: "InputStream/OutputStream hoặc Channel để giữ dữ liệu ở dạng byte thô.", explanation: "Đúng. Dữ liệu nhị phân nên được giữ ở mức byte trừ khi định dạng thực sự quy định nội dung văn bản."}
    correctAnswerId: D
