questions:
  - question: >-
      Hãy giải thích I/O theo mô hình nguồn → luồng dữ liệu → đích, và vì sao chỉ xử lý dữ liệu trong RAM là chưa đủ cho phần lớn ứng dụng thực tế.
    answer: >-
      I/O là nhóm cơ chế đưa dữ liệu vào chương trình từ một nguồn hoặc đưa dữ liệu từ chương trình tới một đích. Nguồn/đích có thể là tệp, bảng điều khiển, socket hoặc vùng nhớ, nên I/O không bắt buộc phải vượt qua ranh giới tiến trình. RAM chỉ giữ trạng thái đang làm việc của tiến trình; khi tiến trình kết thúc, dữ liệu trong RAM không tự trở thành dữ liệu bền vững trên tệp. Mô hình nguồn/đích giúp tách ý nghĩa của dữ liệu khỏi nơi dữ liệu đến hoặc đi, nhờ đó cùng một cách tư duy đọc/ghi có thể áp dụng cho nhiều loại tài nguyên.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.MentalModel/MentalModel.md", anchor: "io-data-flow"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Khi nào nên nghĩ dữ liệu là byte và khi nào nên nghĩ là ký tự? Vì sao chọn sai mức trừu tượng có thể làm hỏng dữ liệu?
    answer: >-
      Byte là biểu diễn dữ liệu thô, phù hợp với ảnh, tệp nén, giao thức nhị phân hoặc dữ liệu chưa được diễn giải thành văn bản. Ký tự chỉ là mức trừu tượng đúng khi dữ liệu thực sự mang ý nghĩa văn bản và có charset xác định cách chuyển đổi giữa byte và ký tự. Dùng `Reader` cho ảnh có thể giải mã các byte thành ký tự sai rồi mã hóa trở lại thành dữ liệu khác ban đầu; ngược lại, xử lý văn bản chỉ bằng byte mà không xác định charset dễ gây mojibake hoặc làm hỏng vòng chuyển đổi đọc-ghi.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.MentalModel/MentalModel.md", anchor: "bytes-vs-characters"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      I/O chặn, I/O không chặn và I/O bất đồng bộ khác nhau như thế nào? Vì sao không chặn và bất đồng bộ không phải là hai từ đồng nghĩa?
    answer: >-
      Với I/O chặn, luồng thực thi gọi API có thể phải chờ cho tới khi thao tác có thể trả về tiến triển, kết quả hoàn tất, EOF hoặc lỗi. Với I/O không chặn, lời gọi được thiết kế để trả quyền điều khiển thay vì chờ tài nguyên sẵn sàng; nó có thể chưa tạo tiến triển và xử lý theo dõi trạng thái sẵn sàng sẽ quyết định khi nào thử lại. I/O bất đồng bộ là một mô hình hoàn tất khác: thao tác được khởi chạy trước rồi kết quả đến sau qua `Future`, callback hoặc cơ chế tương tự. Độ trễ của tài nguyên bên ngoài vẫn tồn tại trong cả ba trường hợp; khác biệt nằm ở cách tổ chức việc chờ và nhận kết quả.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.MentalModel/MentalModel.md", anchor: "blocking-io-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Vì sao bộ thu gom rác (garbage collector) không thay thế được `close()` đối với tệp, socket hay channel?
    answer: >-
      GC quản lý vòng đời của đối tượng Java trên heap, còn bộ mô tả tệp (file descriptor) hoặc handle gốc (native handle) là tài nguyên bên ngoài heap và thường có giới hạn do hệ điều hành đặt ra. Nếu chờ GC, thời điểm giải phóng không xác định và ứng dụng có thể cạn tài nguyên hệ điều hành hoặc giữ khóa/tài nguyên lâu hơn dự kiến. Vì vậy mã phải có quy tắc sở hữu rõ ràng và đóng tài nguyên tại thời điểm xác định, thường bằng `try-with-resources`.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.MentalModel/MentalModel.md", anchor: "resource-lifecycle"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      `System.in`, `System.out`/`System.err` và `Console` khác nhau thế nào? Vì sao `System.console()` có thể trả `null` trong IDE, CI hoặc khi I/O bị chuyển hướng?
    answer: >-
      `System.in` là đầu vào chuẩn, còn `System.out` và `System.err` là `PrintStream` cho đầu ra chuẩn và lỗi chuẩn. Các luồng này có thể bị chuyển hướng hoặc nối qua pipe, nên không nhất thiết gắn với thiết bị đầu cuối (terminal) tương tác. `Console` đại diện cho bảng điều khiển tương tác và cung cấp API như `readPassword`; khi tiến trình không có bảng điều khiển phù hợp, `System.console()` có thể trả `null`. Mã đa nền tảng cần có phương án dự phòng thay vì giả định mọi môi trường đều có terminal.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ByteStreams/ByteStreams.md", anchor: "standard-console-io"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Hãy giải thích quy ước của `InputStream.read`, việc đọc từng phần, EOF, `available()` và `mark/reset`. Những giả định sai phổ biến là gì?
    answer: >-
      `read()` trả giá trị byte trong khoảng 0..255 hoặc `-1` ở EOF; đọc theo khối trả số byte thực tế và không bảo đảm lấp đầy buffer. `available()` chỉ ước lượng số byte có thể đọc hoặc bỏ qua mà không bị chặn tại thời điểm gọi, chứ không phải tổng số byte còn lại. `mark/reset` chỉ dùng được khi `markSupported()` trả `true`. Lỗi phổ biến là giả định một lần đọc luôn đủ, xử lý toàn bộ buffer thay vì đúng `count` byte mới đọc, hoặc dùng `available()` để suy ra kích thước toàn bộ dữ liệu.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ByteStreams/ByteStreams.md", anchor: "read-contract"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      `DataInputStream`/`DataOutputStream` giải quyết bài toán gì mà luồng byte thô chưa giải quyết? Hãy nói về thứ tự trường, phân khung, `readFully`, EOF và `writeUTF/readUTF`.
    answer: >-
      Luồng byte thô chỉ di chuyển byte; `DataInput`/`DataOutput` bổ sung quy ước để ghi và đọc các giá trị nguyên thủy theo thứ tự trường mà hai bên đã thống nhất. Bên đọc phải biết lược đồ và cách phân khung, kiểm tra độ dài trước khi cấp phát và dùng `readFully` khi yêu cầu đúng N byte; gặp EOF giữa một bản ghi thường có nghĩa dữ liệu bị cắt cụt chứ không phải kết thúc hợp lệ. `writeUTF/readUTF` dùng modified UTF-8 theo quy ước riêng của `DataInput`/`DataOutput`, không phải UTF-8 chuẩn để trao đổi văn bản tổng quát.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ByteStreams/ByteStreams.md", anchor: "typed-binary-io"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      `Reader`/`Writer` khác `InputStream`/`OutputStream` ở mức trừu tượng nào? Vì sao `Reader.read(char[])` vẫn phải xử lý việc đọc từng phần và `PrintWriter` có quy tắc lỗi đáng chú ý?
    answer: >-
      `Reader`/`Writer` làm việc với ký tự, còn `InputStream`/`OutputStream` làm việc với byte. `Reader.read(char[])` vẫn trả số ký tự thực tế đã đọc, nên bên gọi không được mặc định mảng đã đầy. `PrintWriter` tiện cho `print/println/printf` nhưng các phương thức ghi của nó không truyền `IOException` ra ngoài theo cách của nhiều `Writer` khác; khi cần biết lỗi I/O, bên gọi phải kiểm tra `checkError()`.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.CharacterStreams/CharacterStreams.md", anchor: "reader-writer"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      InputStreamReader/OutputStreamWriter và Charset đóng vai trò gì? Khi nào cần CharsetDecoder với REPORT thay vì chấp nhận thay thế?
    answer: >-
      `InputStreamReader` và `OutputStreamWriter` là cầu nối giữa byte và ký tự: một bên giải mã byte thành ký tự, bên kia mã hóa ký tự thành byte theo `Charset`. Nếu định dạng hoặc giao thức yêu cầu dữ liệu hợp lệ nghiêm ngặt, việc âm thầm thay thế ký tự lỗi có thể che giấu dữ liệu hỏng; khi đó `CharsetDecoder`/`CharsetEncoder` với `CodingErrorAction.REPORT` giúp báo lỗi cho dữ liệu không hợp lệ hoặc không thể ánh xạ. Charset là một phần của quy ước dữ liệu và nên được thể hiện rõ khi định dạng đã xác định nó.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.CharacterStreams/CharacterStreams.md", anchor: "charset-bridge"}
