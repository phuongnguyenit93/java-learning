  - question: >-
      Khi review một yêu cầu I/O mới, bạn sẽ chọn Stream/Reader/Files/Channel và chiến lược memory/error/performance theo trình tự nào?
    answer: >-
      Bắt đầu từ semantics của payload: bytes, text hay structured binary; sau đó xét size bound, sequential/random access, charset/byte order/framing, resource ownership và failure policy. Dữ liệu lớn nên streaming/chunking thay vì load-all; partial read/write và filesystem race phải là một phần của correctness. Chỉ tối ưu buffer size, direct buffer, transfer, mapping hoặc async sau khi đo được bottleneck cụ thể; API “mạnh hơn” không tự động đúng hơn hay nhanh hơn.
