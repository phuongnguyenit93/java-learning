  - question: >-
      Vì sao `java.io.File` không nên được hiểu là “một tệp đang mở”, và tại sao mã Java hiện đại thường ưu tiên `Path`/`Files`?
    answer: >-
      `File` chủ yếu biểu diễn đường dẫn và cung cấp các thao tác hệ thống tệp kiểu cũ; tạo một đối tượng `File` không mở tệp và đích thậm chí có thể chưa tồn tại. `Path` tách vai trò biểu diễn đường dẫn khỏi `Files`, lớp cung cấp thao tác hệ thống tệp với mô hình phong phú hơn cho thuộc tính, liên kết tượng trưng, sao chép/di chuyển, duyệt cây và ngoại lệ cụ thể. `File` vẫn quan trọng khi làm việc với API cũ, nhưng không nên là lựa chọn mặc định chỉ vì tên của nó trực quan.
