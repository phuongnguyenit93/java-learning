  - question: >-
      Bộ đệm cải thiện I/O như thế nào, `flush()` thực sự bảo đảm điều gì và vì sao `flush()` không đồng nghĩa dữ liệu đã bền vững trên đĩa?
    answer: >-
      Bộ đệm gom nhiều thao tác nhỏ trong bộ nhớ để giảm số lần đi qua tầng I/O bên dưới. `flush()` yêu cầu lớp bọc đẩy dữ liệu đang giữ xuống tầng tiếp theo, nhưng dữ liệu vẫn có thể nằm trong bộ nhớ đệm của hệ điều hành, hệ thống tệp hoặc thiết bị. Độ bền dữ liệu là yêu cầu khác và có thể cần `FileChannel.force(...)` hoặc cơ chế tương ứng của tầng lưu trữ; gọi `flush()`/`force()` quá thường xuyên cũng có chi phí, nên phải xuất phát từ yêu cầu thực tế.
