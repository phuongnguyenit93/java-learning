      `ObjectOutputStream` ghi đồ thị các đối tượng `Serializable` có thể truy cập được và giữ quan hệ tham chiếu thay vì biến mỗi đối tượng thành một bản sao độc lập. Với lớp `Serializable` thông thường, `serialVersionUID` tham gia kiểm tra tương thích giữa mô tả lớp đã lưu và lớp dùng khi đọc; `transient` loại một trường khỏi trạng thái tuần tự hóa mặc định nhưng không biến định dạng thành một lược đồ ổn định. Record có quy tắc riêng: hàm tạo chuẩn tham gia giải tuần tự hóa, UID mặc định là `0L` nếu không khai báo và Java không yêu cầu UID trong luồng phải khớp UID cục bộ. Vì cơ chế này gắn chặt với kiểu Java và quá trình tiến hóa của lớp, nó không phải lựa chọn mặc định tốt cho lưu trữ dài hạn hoặc trao đổi qua mạng.
