  - question: >-
      File owner/permission attributes trong NIO.2 có portability boundary nào? Vì sao không nên giả định POSIX permission tồn tại ở mọi filesystem?
    answer: >-
      NIO.2 expose nhiều attribute view như basic, POSIX, DOS và owner, nhưng provider/store quyết định view nào được hỗ trợ. `FileStore.supportsFileAttributeView(...)` giúp kiểm capability, còn operation cụ thể vẫn có thể fail vì permission, race hoặc file state. Code portable phải xem permission model là capability của filesystem/provider thay vì hard-code giả định Unix trên mọi môi trường.
