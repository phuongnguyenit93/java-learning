  - question: >-
      Hãy mô tả state machine của Buffer với position/limit/capacity và vai trò của flip, clear, compact, mark/reset, rewind.
    answer: >-
      Khi ghi vào buffer, `position` tiến tới `limit`; sau đó `flip()` đặt limit thành lượng dữ liệu vừa ghi và position về 0 để đọc. `clear()` mở toàn bộ vùng cho pha ghi mới nhưng không xóa byte cũ; `compact()` giữ phần chưa đọc rồi chuẩn bị ghi tiếp. `rewind()` đọc lại cùng vùng từ đầu, còn mark/reset là bookmark tạm và bị discard bởi các transition nhất định. Hiểu sai state thường dẫn tới underflow/overflow hoặc đọc dữ liệu stale.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.BuffersChannels/BuffersChannels.md", anchor: "flip-clear-compact"}
