  - question: >-
      Trong một chain wrapper như BufferedReader → InputStreamReader → InputStream, ai nên close resource? Try-with-resources giúp gì và không giải quyết được gì?
    answer: >-
      Ownership phải do design quyết định: thường component mở resource chịu trách nhiệm đóng, còn borrower không tự close tài nguyên của người khác. Với wrapper chain, close outer wrapper thường delegate xuống inner resource, nên tránh double-ownership mơ hồ. Try-with-resources bảo đảm deterministic close và close order, nhưng không tự quyết định ownership architecture hay biến shared resource thành an toàn để bất kỳ caller nào cũng đóng.
