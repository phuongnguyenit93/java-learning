  - question: >-
      WatchService nên được dùng với mental model nào? Vì sao không nên coi nó là transaction log chính xác của filesystem?
    answer: >-
      `WatchService` đăng ký directory và phát event create/modify/delete qua `WatchKey`; consumer lấy key bằng `take/poll`, đọc events rồi `reset()` key. Event có thể coalesce, `OVERFLOW` báo mất chi tiết, behavior phụ thuộc provider và việc watch không recursive mặc định. Vì vậy watcher phù hợp để phát hiện “có thay đổi, hãy kiểm tra lại trạng thái” hơn là làm audit log hoặc nguồn sự thật transaction-level.
    aiGenerated: true
