  - question: >-
      AsynchronousFileChannel khác FileChannel ở mô hình completion nào? Những trách nhiệm nào vẫn thuộc caller dù operation là async?
    answer: >-
      `AsynchronousFileChannel` thực hiện positional I/O và trả completion qua `Future` hoặc `CompletionHandler`, nên caller không cần block chính thread gọi cho tới khi operation xong. Nhưng caller vẫn phải quản lý channel lifetime, buffer lifetime, partial completion, failure và concurrency policy. Async không đảm bảo nhanh hơn; nó là orchestration model khác, còn executor/cancellation/memory-visibility sâu thuộc concurrency curriculum.
