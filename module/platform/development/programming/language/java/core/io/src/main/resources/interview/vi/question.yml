  - question: >-
      Khi xem xét một yêu cầu I/O mới, bạn sẽ chọn Stream/Reader/Files/Channel/tài nguyên ClassLoader và chiến lược bộ nhớ, xử lý lỗi, hiệu năng theo trình tự nào?
    answer: >-
      Bắt đầu từ ý nghĩa dữ liệu: byte, văn bản hay dữ liệu nhị phân có cấu trúc. Sau đó xác định đích là đường dẫn hệ thống tệp hay tài nguyên đóng gói trên classpath/module path, vì tài nguyên qua `Class`/`ClassLoader` thuộc không gian tên khác và có thể nằm trong JAR thay vì một `File`/`Path` thông thường. Tiếp theo xét giới hạn kích thước, truy cập tuần tự hay ngẫu nhiên, charset/thứ tự byte/phân khung, quyền sở hữu tài nguyên và chính sách khi lỗi. Dữ liệu lớn thường nên được xử lý theo luồng hoặc từng khối thay vì nạp toàn bộ; đọc/ghi từng phần và thay đổi đồng thời của hệ thống tệp đều là vấn đề tính đúng đắn. Chỉ tinh chỉnh kích thước buffer, direct buffer, truyền dữ liệu, ánh xạ hoặc I/O bất đồng bộ sau khi phép đo chỉ ra điểm nghẽn thật.
