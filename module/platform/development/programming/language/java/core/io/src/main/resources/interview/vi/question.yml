  - question: >-
      Trong một chuỗi lớp bọc, việc ghép khả năng, sự lan truyền của close() và quyền sở hữu ở cấp ứng dụng khác nhau như thế nào?
    answer: >-
      Mỗi lớp bọc bổ sung một hành vi rồi ủy quyền xuống đối tượng bên dưới: chẳng hạn `InputStreamReader` thêm bước giải mã theo charset còn `BufferedReader` thêm bộ đệm và `readLine()`. Các lớp bọc chuẩn thường lan truyền `close()` xuống chuỗi bên trong, nhưng việc tạo lớp bọc không tự chuyển quyền sở hữu một tài nguyên do bên gọi cung cấp. Quy ước của ứng dụng phải xác định ai sở hữu tài nguyên bên dưới; khi phạm vi hiện tại sở hữu cả chuỗi thì đóng lớp bọc ngoài cùng thường là đủ.
