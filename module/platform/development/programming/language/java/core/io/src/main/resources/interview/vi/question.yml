  - question: >-
      ByteOrder là gì và tại sao endianness là correctness contract chứ không phải tuning detail?
    answer: >-
      Multi-byte primitive như int/long cần quy tắc xác định byte nào là phần high-order/low-order. `ByteBuffer` mặc định big-endian nhưng có thể đổi sang little-endian; cùng 4 bytes có thể cho int khác nhau tùy order. Vì vậy binary format/protocol phải quy định endianness và code phải cấu hình đúng trước `getInt/putInt` hoặc typed view, nếu không dữ liệu vẫn “đọc được” nhưng semantic value sai.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.BuffersChannels/BuffersChannels.md", anchor: "byte-order-structured-binary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Channel + Buffer model khác Stream model ở đâu? Scatter/gather giải quyết bài toán gì và tại sao nó không đồng nghĩa parallel I/O?
    answer: >-
      Channel tách conduit khỏi vùng chứa dữ liệu explicit là `Buffer`, nhờ đó code quản lý state/position và có các capability NIO cụ thể. Scattering read phân phối bytes vào nhiều buffer, gathering write lấy bytes từ nhiều buffer theo thứ tự, phù hợp layout kiểu header + body. Một operation vẫn có thể partial và không tự tạo thread hay parallelism; scatter/gather là multi-buffer transfer, không phải concurrent execution.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.BuffersChannels/BuffersChannels.md", anchor: "scatter-gather-boundary"}
