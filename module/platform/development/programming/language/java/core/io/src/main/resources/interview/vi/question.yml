questions:
  - question: >-
      Hãy giải thích I/O là gì theo mental model source → data flow → sink, và vì sao chương trình chỉ xử lý dữ liệu trong RAM là chưa đủ cho phần lớn ứng dụng thực tế.
    answer: >-
      I/O là việc dữ liệu đi qua ranh giới của process giữa một source và một sink. RAM chỉ giữ working state của process; khi process kết thúc, dữ liệu đó không tự trở thành file bền vững, cũng không giúp chương trình nhận input, đọc file hay giao tiếp với tài nguyên bên ngoài. Mental model source/sink giúp tách ý nghĩa của payload khỏi nơi dữ liệu đến hoặc đi, nên cùng một contract đọc/ghi có thể áp dụng cho file, memory, console hoặc socket.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.MentalModel/MentalModel.md", anchor: "io-data-flow"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Khi nào nên nghĩ dữ liệu là bytes và khi nào nên nghĩ là characters? Vì sao chọn sai abstraction có thể làm hỏng dữ liệu?
    answer: >-
      Bytes là representation nhị phân thô, phù hợp ảnh, file nén, protocol binary hoặc dữ liệu chưa được diễn giải thành text. Characters chỉ đúng khi payload có semantics văn bản và có charset xác định cách bytes ↔ characters. Dùng Reader cho ảnh có thể decode các byte thành ký tự sai rồi encode lại khác ban đầu; ngược lại xử lý text chỉ bằng byte mà không xác định charset dễ tạo mojibake hoặc lỗi round-trip.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.MentalModel/MentalModel.md", anchor: "bytes-vs-characters"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Blocking I/O và non-blocking I/O khác nhau ở điểm nào? Tại sao non-blocking không có nghĩa là tài nguyên bên ngoài không còn độ trễ?
    answer: >-
      Với blocking I/O, thread gọi operation chờ cho tới khi operation tiến triển đủ để trả kết quả hoặc lỗi. Với non-blocking I/O, lời gọi có thể trả ngay khi chưa có tiến triển, còn readiness/event-loop tổ chức việc quay lại sau. Độ trễ của disk/network vẫn tồn tại; khác biệt là cách chương trình tổ chức thời gian chờ và thread, không phải phép biến I/O thành tức thời.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.MentalModel/MentalModel.md", anchor: "blocking-io-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Vì sao garbage collector không thay thế được close() đối với file, socket hay channel?
    answer: >-
      GC quản lý lifetime của object Java trên heap, còn file descriptor/native handle là tài nguyên bên ngoài heap và thường có giới hạn ở OS. Nếu chờ GC, thời điểm release không xác định và ứng dụng có thể cạn handle hoặc giữ lock/resource lâu hơn dự kiến. Vì vậy code cần ownership rõ ràng và deterministic cleanup, thường qua try-with-resources.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.MentalModel/MentalModel.md", anchor: "resource-lifecycle"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Hãy giải thích contract của InputStream.read, partial read, EOF, available() và mark/reset. Những giả định sai phổ biến là gì?
    answer: >-
      `read()` trả byte 0..255 hoặc `-1` ở EOF; bulk read trả số byte thực tế và không hứa lấp đầy buffer. `available()` chỉ ước lượng số byte có thể đọc/skip mà không block, không phải tổng số byte còn lại. `mark/reset` chỉ đáng tin khi `markSupported()` là true. Bug phổ biến là xem một lần read là đủ, dùng toàn bộ buffer thay vì phần `count`, hoặc dùng available() để cấp phát toàn bộ payload.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ByteStreams/ByteStreams.md", anchor: "read-contract"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      System.in, System.out/System.err và Console khác nhau thế nào? Vì sao System.console() có thể trả null trong IDE, CI hoặc khi redirect I/O?
    answer: >-
      `System.in` là standard input, còn `System.out` và `System.err` là `PrintStream` cho standard output/error; các stream này có thể bị redirect hoặc pipe, không nhất thiết gắn với terminal tương tác. `Console` biểu diễn interactive console và có API như `readPassword`; khi process không có console thật, `System.console()` có thể là null. Code portable phải có fallback hoặc contract rõ ràng thay vì giả định mọi môi trường đều có terminal.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ByteStreams/ByteStreams.md", anchor: "standard-console-io"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      DataInputStream/DataOutputStream giải quyết bài toán gì mà raw byte stream chưa giải quyết? Hãy nói về field order, framing, readFully, EOF và writeUTF/readUTF.
    answer: >-
      Raw stream chỉ di chuyển bytes; typed binary I/O thêm contract để ghi/đọc primitive theo thứ tự field mà hai bên đã thống nhất. Reader phải biết schema/framing, validate length trước allocation và dùng `readFully` khi cần đúng N bytes; EOF giữa record thường là dữ liệu truncated chứ không phải kết thúc hợp lệ. `writeUTF/readUTF` dùng modified UTF-8 theo contract riêng của DataInput/DataOutput, không phải format UTF-8 text tổng quát để trao đổi tùy ý.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ByteStreams/ByteStreams.md", anchor: "typed-binary-io"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Reader/Writer khác InputStream/OutputStream ở abstraction nào? Vì sao Reader.read(char[]) vẫn phải xử lý partial read và PrintWriter có error semantics đáng chú ý?
    answer: >-
      Reader/Writer làm việc với characters, còn byte stream làm việc với raw bytes. `Reader.read(char[])` vẫn trả số char thực tế, nên caller không được mặc định mảng đã đầy. `PrintWriter` tiện cho print/println/printf nhưng không propagate `IOException` từ các method ghi theo cách writer thông thường; khi cần biết lỗi I/O phải xem `checkError()`, nên convenience này không phù hợp mọi error-handling contract.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.CharacterStreams/CharacterStreams.md", anchor: "reader-writer"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      InputStreamReader/OutputStreamWriter và Charset đóng vai trò gì? Khi nào cần CharsetDecoder với REPORT thay vì chấp nhận replacement?
    answer: >-
      Bridge classes chịu trách nhiệm decode bytes thành characters và encode characters thành bytes theo một `Charset`. Nếu format/protocol yêu cầu dữ liệu hợp lệ tuyệt đối, silent replacement có thể che corruption; khi đó `CharsetDecoder`/`CharsetEncoder` với `CodingErrorAction.REPORT` giúp reject malformed/unmappable input. Charset là một phần của data contract, không nên để caller đoán từ môi trường nếu format đã quy định rõ.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.CharacterStreams/CharacterStreams.md", anchor: "charset-bridge"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Buffering cải thiện I/O như thế nào, flush() thực sự bảo đảm điều gì và vì sao flush không đồng nghĩa dữ liệu đã bền vững trên disk?
    answer: >-
      Buffering gom nhiều thao tác nhỏ trong memory để giảm số lần đi qua boundary đắt hơn tới tầng I/O bên dưới. `flush()` yêu cầu wrapper đẩy dữ liệu đang giữ xuống tầng tiếp theo, nhưng dữ liệu vẫn có thể nằm trong OS/filesystem/device cache. Durability là yêu cầu khác, có thể cần `FileChannel.force` hoặc cơ chế storage-specific; gọi flush/force quá thường xuyên cũng có cost nên phải xuất phát từ durability contract thật sự.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.BufferedIO/BufferedIO.md", anchor: "flush-semantics"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Vì sao java.io.File không nên được hiểu là “một file đang mở”, và tại sao code Java hiện đại thường ưu tiên Path/Files?
    answer: >-
      `File` chủ yếu là legacy pathname/metadata abstraction; tạo object File không mở file và target thậm chí có thể chưa tồn tại. `Path` tách representation đường dẫn khỏi `Files` là lớp thao tác filesystem, có model phong phú hơn cho attributes, links, copy/move options, tree walking và exception cụ thể. `File` vẫn xuất hiện ở API cũ, nhưng không nên là default chỉ vì tên của nó trực quan.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.File/File.md", anchor: "file-api-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Hãy giải thích quan hệ Path → FileSystem → FileSystemProvider → FileStore và vì sao mental model này quan trọng cho portability.
    answer: >-
      Mỗi `Path` thuộc một `FileSystem`; filesystem được triển khai bởi `FileSystemProvider`, còn `FileStore` mô tả backing storage/capability. Vì provider/filesystem khác nhau có thể hỗ trợ khác nhau về POSIX attributes, atomic move, symlink hay WatchService, code không nên suy luận capability từ máy developer. `Path.toFile()` cũng không universal cho non-default provider, nên modern code nên giữ `Path` và kiểm capability khi requirement phụ thuộc provider.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.PathFiles/PathFiles.md", anchor: "filesystem-provider-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      normalize(), toAbsolutePath(), toRealPath() và Files.isSameFile() trả lời những câu hỏi khác nhau thế nào, đặc biệt khi có symbolic link?
    answer: >-
      `normalize()` chỉ rút gọn cú pháp như `.` và `name/..` mà không truy cập filesystem. `toAbsolutePath()` tạo dạng absolute theo context hiện tại nhưng chưa chứng minh identity; `toRealPath()` truy cập filesystem, yêu cầu target tồn tại và resolve link theo option. Khi cần biết hai path có cùng file identity hay không, `Files.isSameFile` phù hợp hơn so với so sánh chuỗi hay normalize thuần cú pháp.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.PathFiles/PathFiles.md", anchor: "resolve-normalize"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      Những boundary nào cần nhớ khi dùng Files.copy/move/delete và ATOMIC_MOVE? Vì sao “copy directory” không tự động nghĩa là recursive copy?
    answer: >-
      `Files.copy` với directory chỉ tạo directory đích tương ứng, không copy cả cây; delete cũng không recursive với directory không rỗng. Copy source symlink mặc định có thể follow target còn move di chuyển chính link. `ATOMIC_MOVE` phụ thuộc filesystem, có thể ném `AtomicMoveNotSupportedException`; các option khác bị bỏ qua và behavior khi target tồn tại có thể provider-specific, nên publish policy phải explicit thay vì dựa vào trực giác.
    aiGenerated: true
