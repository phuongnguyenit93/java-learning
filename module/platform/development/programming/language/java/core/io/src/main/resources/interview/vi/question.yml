  - question: >-
      Temporary file/directory nên được quản lý ownership và cleanup thế nào? DELETE_ON_CLOSE có phải là lời giải cleanup tuyệt đối không?
    answer: >-
      Code tạo temp resource nên xác định rõ ai sở hữu nó và khi nào cleanup; temp directory chứa nhiều file thường cần cleanup theo tree thay vì chỉ xóa directory cha. `DELETE_ON_CLOSE` chỉ là một option hữu ích trong vài trường hợp và vẫn phụ thuộc provider/lifecycle của handle, không thay thế policy cleanup tổng thể. Nếu process crash hoặc resource không được đóng đúng, application vẫn cần hiểu boundary của cơ chế temp mà nó đang dùng.
