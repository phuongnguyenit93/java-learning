  - question: >-
      Heap ByteBuffer và direct ByteBuffer nên được chọn theo tiêu chí nào? Vì sao direct buffer không phải lựa chọn mặc định luôn nhanh hơn?
    answer: >-
      Heap buffer sống trong Java heap và thường thuận tiện cho allocation/access của application. Direct buffer dùng off-heap/native-friendly memory và có thể giảm một số copy trong native I/O path, nhưng allocation/deallocation đắt hơn và memory pressure khó thấy hơn trong heap metrics. Chỉ nên chọn direct buffer khi workload/channel path và benchmark chứng minh lợi ích, thay vì xem `allocateDirect` là optimization mặc định.
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.BuffersChannels/BuffersChannels.md", anchor: "bytebuffer-types"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: >-
      FileChannel random access khác sequential stream như thế nào, và RandomAccessFile nằm ở đâu trong bức tranh này?
    answer: >-
      `FileChannel` hỗ trợ position và cả positional read/write không nhất thiết thay đổi channel position, nên phù hợp khi cần truy cập offset cụ thể. `RandomAccessFile` là API legacy hơn, vừa implement `DataInput/DataOutput` vừa có `seek`; channel lấy từ nó chia sẻ position liên quan với file pointer. Code mới thường ưu tiên FileChannel khi cần NIO capabilities, nhưng hiểu RandomAccessFile giúp đọc code cũ và thấy evolution của API.
