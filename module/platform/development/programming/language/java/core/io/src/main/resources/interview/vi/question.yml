  - question: >-
      Files.list/walk/find/lines trả java.util.stream.Stream, vậy tại sao vẫn phải close? Điều này nói gì về resource ownership của Stream API được tạo từ I/O?
    answer: >-
      Các stream này là Stream API ở mức xử lý phần tử nhưng phía dưới vẫn giữ directory/file resource mở trong lúc traversal hoặc reading. Vì vậy chúng có close lifecycle và nên nằm trong try-with-resources. Đây là ví dụ quan trọng cho thấy type `Stream<T>` không tự nói tài nguyên có external lifetime hay không; ownership phải được suy ra từ API tạo ra stream.
