  - question: >-
      `normalize()`, `toAbsolutePath()` và `toRealPath()` trả lời những câu hỏi khác nhau về đường dẫn như thế nào, đặc biệt khi có liên kết tượng trưng?
    answer: >-
      `normalize()` chỉ rút gọn cú pháp như `.` và các cặp `name/..` có thể rút gọn mà không truy cập hệ thống tệp. `toAbsolutePath()` tạo biểu diễn tuyệt đối dựa trên ngữ cảnh hiện tại nhưng không chứng minh tệp tồn tại hay xác nhận định danh. `toRealPath()` truy cập hệ thống tệp, yêu cầu đích tồn tại và xử lý liên kết tượng trưng theo các tùy chọn của nó. Cần tách rõ biến đổi đường dẫn thuần cú pháp với việc phân giải dựa trên trạng thái thực của hệ thống tệp.
