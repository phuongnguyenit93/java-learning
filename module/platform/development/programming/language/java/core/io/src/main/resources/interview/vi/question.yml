  - question: >-
      File lock và memory-mapped file có những boundary nào khiến chúng không nên được xem như “magic concurrency/performance solution”?
    answer: >-
      File lock chủ yếu là cơ chế coordination theo filesystem/OS; shared lock có thể bị nâng thành exclusive và semantics/advisory behavior phụ thuộc nền tảng, nên nó không thay Java thread lock. Memory mapping đưa file pages vào virtual-memory model, có page fault, size/window/lifetime và mutation/truncate boundary; đóng FileChannel không tự unmap mapping đã tạo. Cả hai đều cần requirement cụ thể thay vì dùng theo trực giác “nhanh hơn/an toàn hơn”.
