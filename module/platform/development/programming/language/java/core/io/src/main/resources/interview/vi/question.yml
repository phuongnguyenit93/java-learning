  - question: >-
      transferTo/transferFrom và force() giải quyết hai bài toán khác nhau thế nào? Vì sao vẫn phải xử lý partial transfer và durability contract?
    answer: >-
      `transferTo/transferFrom` tối ưu hình dạng copy giữa channel/file nhưng số byte thực tế có thể nhỏ hơn requested, nên caller phải theo dõi progress nếu cần chuyển đủ. `force(false/true)` liên quan durability: yêu cầu đẩy content, và với true cả metadata cần thiết, xuống storage stack. Transfer API không bảo đảm durability; completion của copy và persistence sau failure là hai contract khác nhau.
