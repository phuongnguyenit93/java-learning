  - question: >-
      Native Java serialization mô hình hóa object graph như thế nào, và serialVersionUID/transient liên quan gì tới compatibility contract?
    answer: >-
      `ObjectOutputStream` ghi object graph reachable của các object Serializable, giữ reference relationships chứ không chỉ dump từng object độc lập. `serialVersionUID` tham gia kiểm tra compatibility giữa class descriptor lúc ghi và class khi đọc; `transient` loại field khỏi default serialized state nhưng không biến format thành schema ổn định. Vì serialization gắn chặt với Java class/version, nó không nên được chọn mặc định cho persistence hay network interchange lâu dài.
