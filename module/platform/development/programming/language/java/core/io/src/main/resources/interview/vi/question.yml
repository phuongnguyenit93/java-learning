  - question: >-
      Những ranh giới nào cần nhớ khi dùng `Files.copy/move/delete` và `ATOMIC_MOVE`? Vì sao “sao chép thư mục” không tự động nghĩa là sao chép đệ quy cả cây?
    answer: >-
      `Files.copy` với thư mục chỉ tạo thư mục đích tương ứng, không sao chép toàn bộ cây; `Files.delete` cũng không xóa đệ quy thư mục không rỗng. Khi nguồn là liên kết tượng trưng, `copy` mặc định đi theo đích trừ khi dùng `NOFOLLOW_LINKS`, còn `move` di chuyển chính liên kết. `ATOMIC_MOVE` phụ thuộc khả năng của hệ thống tệp và có thể ném `AtomicMoveNotSupportedException`; các tùy chọn di chuyển khác bị bỏ qua và hành vi khi đích đã tồn tại có thể phụ thuộc phần triển khai, nên chính sách công bố tệp phải được xác định rõ.
