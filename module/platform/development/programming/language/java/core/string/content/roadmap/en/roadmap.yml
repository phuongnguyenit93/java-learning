# <roadmap-schema>
# Module Roadmap Structure
# schema-version: 1
#
# YAML CONTRACT
# roadmap: High-level learning milestones for the current language roadmap.
#
# - id [string, required]: Stable and unique milestone identity within the current language roadmap.
# - title [string, required]: Milestone title displayed to the learner.
# - purpose [string, required]: What the learner should understand or achieve from this milestone.
# - dependsOn [list, optional]: Prerequisite milestone ids when item order alone is not enough to express the dependency.
# - objectives [list, optional]: Milestone-level learning objectives; do not use this to list every small fact/API/syntax item.
# - relatedKnowledge [list, optional]: Knowledge category ids in the current module that support this milestone. Portal displays this list on the side opposite the milestone and clicking an item navigates to the matching Knowledge category.
# - relatedModules [list, optional]: Related modules displayed as Portal Level 2 cards. Each item requires routeId and may provide localized label/note; this relation is navigation only and does not create child milestones or change learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - What is this topic/module?
#   - Why does it exist?
#   - What problem exists without it?
# FOUNDATION
#   - What prerequisite or mental model must the learner have first?
# CORE MODEL
#   - What major abstractions or building blocks make up this topic?
# MECHANICS
#   - How does it work at the language/runtime/API level appropriate for this module?
# USAGE
#   - How is it used in real code?
# DECISION / TRADE-OFF
#   - When should this mechanism be chosen over another?
#   - When should it not be used?
# FAILURE / PITFALL
#   - What mistakes, compile-time failures, or runtime failures matter?
# INTEGRATION
#   - How does this topic connect to neighboring concepts/modules?
# SYNTHESIS
#   - What end-to-end mental model should the learner retain?
#
# Each language owns its own roadmap. Do not infer or synchronize its structure from another language roadmap.
# Item order in roadmap is the default learning order. Use dependsOn only when a dependency needs to be expressed beyond the linear order.
# The skeleton must not force every module to have the same number of nodes. It is a thinking framework, not a rigid template.
# </roadmap-schema>

roadmap:
  - id: string-purpose
    title: What String Is and Why Text Matters
    purpose: Build a first mental model of String as Java’s core immutable reference type for text values, why Java needs a dedicated text abstraction, and where text representation appears at application and system boundaries.
    relatedKnowledge:
      - Immutability
    objectives:
      - Explain what a String value represents and why text is more than just an array of char values.
      - Separate text representation from structured, numeric, date/time, binary, or other domain values.
      - Recognize text at input/output, configuration, logging, persistence, network, UI, and API boundaries.
  - id: immutability-and-value-semantics
    title: Immutability and Value Semantics
    purpose: Understand why String is immutable and how immutability affects sharing, hashing, thread-safety, and transformation APIs.
    relatedKnowledge:
      - Immutability
    objectives:
      - Treat String operations as producing new values rather than mutating existing ones.
      - Understand why mutable char arrays cannot alias-mutate an existing String value.
      - Recognize safe-sharing, hashing, thread-safety, and allocation consequences.
  - id: pool-identity-and-equality
    title: String Pool, Reference Identity, and Equality
    purpose: Understand why equal String values may or may not share the same reference and why pooled identity never replaces content-based comparison.
    relatedKnowledge:
      - StringPool
      - Equality
    relatedModules:
      - routeId: JAVA_OBJECT_CONTRACT
        label: Object Contract
        note: String equality and hashing are concrete examples of general object contracts.
    objectives:
      - Explain literal pooling and the literal/new String distinction.
      - Distinguish reference comparison with == from content comparison with equals().
      - Recognize why case-insensitive comparison and locale-sensitive text rules require additional care.
  - id: core-string-operations
    title: Core String Operations
    purpose: Learn to inspect, search, extract, split, join, transform, and format text while respecting index and immutability boundaries.
    relatedKnowledge:
      - CoreStringOperations
    objectives:
      - Understand String as a CharSequence implementation and the abstraction boundary this creates in APIs.
      - Choose operations by intent rather than memorizing isolated methods.
      - Recognize index/range, split-limit, regex, case-conversion, and whitespace edge cases.
  - id: text-construction
    title: Text Construction and Reuse Trade-offs
    purpose: Understand the cost model of repeated concatenation, when mutable builders are appropriate, and why explicit String canonicalization is a specialized reuse technique rather than a default optimization.
    relatedKnowledge:
      - Concatenation
      - StringBuilder
      - StringBuffer
      - Intern
    objectives:
      - Distinguish compile-time concatenation from repeated runtime construction.
      - Use StringBuilder for efficient incremental construction without assuming String itself becomes mutable.
      - Explain StringBuffer’s synchronization difference and the boundary of what that synchronization guarantees.
      - Explain what intern() returns and how canonical reference reuse differs from ordinary content equality.
      - Evaluate memory and cardinality trade-offs instead of treating interning as a default optimization.
  - id: unicode-text-model
    title: Unicode, Code Points, and User-Visible Text
    purpose: Understand why Java char, Unicode code point, grapheme, and normalized text are different levels of the text model.
    relatedKnowledge:
      - UnicodeCodePoint
    relatedModules:
      - routeId: JAVA_LOCALIZATION
        label: Localization
        note: Locale-aware collation, segmentation, and presentation build on the Unicode text model.
    objectives:
      - Avoid assuming one char equals one user-visible character.
      - Distinguish UTF-16 code units, Unicode code points, and user-perceived grapheme clusters.
      - Recognize normalization, canonical-equivalence, and segmentation boundaries.
  - id: encoding-and-charset
    title: Encoding and Charset Boundaries
    purpose: Understand how Unicode text becomes bytes and bytes become text, and why charset choice must be explicit at external system boundaries.
    relatedKnowledge:
      - Encoding
    relatedModules:
      - routeId: JAVA_IO
        label: I/O
        note: Character streams and file/network I/O make charset decisions operational.
    objectives:
      - Separate in-memory text from encoded byte sequences.
      - Connect encoding and decoding decisions to the Unicode text model learned earlier.
      - Avoid platform-default charset assumptions.
  - id: regex-patterns
    title: Regular Expressions and Pattern Matching
    purpose: Understand regex as a pattern language for text matching and transformation, together with its readability and performance boundaries.
    relatedKnowledge:
      - Regex
    objectives:
      - Use regex when pattern semantics justify the complexity.
      - Recognize escaping, backtracking, and flag-related pitfalls.
  - id: string-synthesis
    title: Source Representation and String Processing Synthesis
    purpose: Connect value semantics, construction, Unicode, encoding, patterns, source representation, and neighboring-module boundaries into one text-processing model.
    relatedKnowledge:
      - TextBlocks
    objectives:
      - Choose the correct text representation or abstraction before optimizing implementation details.
      - Recognize text blocks as source-level String syntax rather than a separate runtime text model.
      - Identify when the problem moves into I/O or localization rather than String itself.
