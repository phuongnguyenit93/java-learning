questions:
  - question: "What is String and what role does it play in a Java system? Why should not every domain value be modeled as String?"
    answer: "String is Java's core object type for representing text. It appears frequently at input/output, API payload/header, configuration, logging, protocol, and persistence-conversion boundaries. Business logic should still keep values such as money, time, state, and identifiers in meaningful domain types when appropriate; String should represent text or a textual boundary representation, not replace the domain type system."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Immutability/Immutability.md", anchor: "string-purpose"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Why is String immutability important to Java APIs and runtime behavior?"
    answer: "Immutable text can be safely shared, cached, pooled, used as a stable hash key, and passed across APIs without callers mutating an existing value. Operations return new values, which simplifies reasoning and supports the String pool contract."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Immutability/Immutability.md", anchor: "string-immutability"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Explain the String pool mental model and why == is still the wrong default for text comparison."
    answer: "The pool can canonicalize literals and explicitly interned values so some equal Strings share identity. That sharing is an implementation/runtime contract for pooling, not value equality. == checks identity; equals checks characters."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.StringPool/StringPool.md", anchor: "string-pool-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "How do String, Unicode, and Charset relate when data crosses an I/O boundary?"
    answer: "A String represents text as Java characters/code points over UTF-16 code units. External storage/transmission uses bytes. Charset defines the reversible mapping between text and bytes, so both sides must agree on the encoding."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.Encoding/Encoding.md", anchor: "charset-encode-decode"}
    apiRelated: {controller: "EncodingController", methodSignature: "roundTrip()"}

  - question: "Why is char not a safe synonym for a user-visible character?"
    answer: "char is one UTF-16 code unit. A supplementary Unicode code point uses two chars, and one user-perceived grapheme may contain multiple code points such as a base letter plus combining marks or emoji sequences."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.UnicodeCodePoint/UnicodeCodePoint.md", anchor: "code-unit-code-point-grapheme"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "When does Unicode normalization matter in application logic?"
    answer: "Visually equivalent text can use different canonical code-point sequences. Normalize at a deliberate comparison/search/storage boundary when the domain requires canonical equivalence, while remembering normalization is not locale-aware collation or general case folding."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.UnicodeCodePoint/UnicodeCodePoint.md", anchor: "unicode-normalization"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "How would you choose between String concatenation, StringBuilder, and StringBuffer?"
    answer: "Use ordinary concatenation for simple readable expressions; compilers already optimize many cases. Use StringBuilder for explicit incremental construction, especially loops. StringBuffer adds synchronized methods for legacy/shared-buffer scenarios, but synchronization does not solve broader compound-operation concurrency design."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.StringBuffer/StringBuffer.md", anchor: "builder-vs-buffer"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "What problem does String.intern solve, and why should it not be applied indiscriminately?"
    answer: "Interning canonicalizes equal String values to one pooled identity, which can help specialized symbol-like workloads. It also creates pool-management and memory-retention trade-offs, so normal value equality should not depend on interning."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.Intern/Intern.md", anchor: "intern-tradeoffs"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "How do you review a regex for production safety rather than only correctness?"
    answer: "Check input bounds, ambiguous nested quantifiers/alternatives, catastrophic-backtracking risk, compilation reuse, and whether a parser or simpler string operation is clearer. Correct matching behavior alone does not guarantee predictable runtime cost."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "11.Regex/Regex.md", anchor: "regex-performance"}
    apiRelated: {controller: "RegexController", methodSignature: "backtracking()"}

  - question: "How is String immutability preserved when a String is created from a mutable char[] or when toCharArray() is called?"
    answer: "A String must be isolated from mutable-array aliases. Mutating the original char[] after String construction does not change the String, and toCharArray() returns an independent array that callers may mutate without changing the String. The actual internal storage remains a JVM implementation detail."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Immutability/Immutability.md", anchor: "string-immutability"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Why does declaring a String variable final not necessarily make concatenation a compile-time constant expression?"
    answer: "final only prevents reassignment of the reference. To participate in a constant expression, the variable must be a constant variable initialized from a constant expression known at compile time. A final String initialized from args, a method call, or runtime data therefore has no compile-time folding or pooled-identity guarantee."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.StringPool/StringPool.md", anchor: "pool-identity"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "How do String and CharSequence differ in their immutability and equality contracts?"
    answer: "String implements CharSequence, but CharSequence does not promise immutability; StringBuilder and StringBuffer are mutable CharSequence implementations. String.equals follows the String equality contract and does not define cross-implementation equality for every CharSequence. When comparing String content with another suitable CharSequence, contentEquals expresses that intent directly."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Equality/Equality.md", anchor: "string-equals"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "How do you choose between direct String APIs and regex when inspecting, searching, extracting, or transforming text?"
    answer: "Choose by intent: length/isBlank/charAt for inspection, startsWith/contains/indexOf for literal search, substring for known index boundaries, replace for literal replacement, and regex when the problem truly requires pattern matching. Regex should not be the default for every text operation because direct String APIs usually communicate simple intent more clearly."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CoreStringOperations/CoreStringOperations.md", anchor: "string-search"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Explain String.split(regex, limit) semantics for positive, zero, and negative limit values."
    answer: "With limit > 0, the result has at most limit elements and the last element keeps the remaining input. With limit == 0, matching has no positive bound but trailing empty strings are discarded. With limit < 0, matching also has no positive bound and trailing empty strings are preserved. The limit is therefore part of the data-parsing contract, not merely a performance option."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CoreStringOperations/CoreStringOperations.md", anchor: "string-split-join"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Why is it wrong to say every String + operation is always compiled into StringBuilder, and why can += inside a loop still be expensive?"
    answer: "Java specifies concatenation semantics, while compiler/runtime implementations may use different strategies such as invokedynamic, so application code must not depend on one lowering. Repeated += can still create successive immutable results and copy an increasingly large prefix, producing much more copying than an explicit mutable construction buffer."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.Concatenation/Concatenation.md", anchor: "loop-concat-cost"}
    apiRelated: {controller: "StringConcatController", methodSignature: "constructionTrace()"}

  - question: "How do length, capacity, and the snapshot semantics of StringBuilder.toString() differ?"
    answer: "length is the number of code units currently stored; capacity is the current internal buffer space before growth and is a performance concern rather than a maximum length. toString() produces an immutable String representing the builder content at that call; later builder mutations do not change the previously produced String."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.StringBuilder/StringBuilder.md", anchor: "builder-usage"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Why do synchronized StringBuffer methods not make a multi-step workflow automatically atomic?"
    answer: "StringBuffer synchronization protects individual method calls. A sequence such as reading length, deciding, then appending spans multiple operations, so another thread can still interleave between them. If an invariant must cover the whole sequence, the caller needs a larger synchronization boundary or a design that avoids the shared mutable buffer."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.StringBuffer/StringBuffer.md", anchor: "thread-safety-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Why is interning high-cardinality or user-controlled data usually a poor optimization?"
    answer: "When most values are nearly unique, interning provides little deduplication while still adding lookup/canonicalization work and retention pressure in the pool. It can also couple code unnecessarily to identity. Intern only when cardinality/workload is controlled and measurement or an actual canonical-identity contract justifies it."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.Intern/Intern.md", anchor: "intern-tradeoffs"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "If the default charset in Java 21 is normally UTF-8, why should file or protocol contracts still specify a Charset explicitly?"
    answer: "Since JDK 18, standard Java APIs default to UTF-8 under JEP 400, so the old model that the default always varies with OS is no longer the normal Java 21 behavior. Encoding at file/network boundaries is still a data contract between producer and consumer; StandardCharsets.UTF_8 makes that contract explicit, reviewable, and independent of compatibility or implementation configuration."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.Encoding/Encoding.md", anchor: "default-charset-risk"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "What is the difference between malformed input and an unmappable character during text encoding or decoding?"
    answer: "Malformed means the input sequence is invalid for the encoding being processed, such as an illegal UTF-8 byte sequence or malformed character input to an encoder. Unmappable means the input is valid but the target charset cannot represent it, such as é when encoding to US-ASCII. CharsetEncoder/Decoder lets the application deliberately choose REPORT, REPLACE, or IGNORE."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.Encoding/Encoding.md", anchor: "malformed-input"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Why does having a String not guarantee well-formed Unicode text, and why is a code point still not the same as a grapheme?"
    answer: "A String is a sequence of UTF-16 code units and may contain an unpaired surrogate, so the type itself does not validate a complete Unicode scalar sequence. Even with well-formed code points, one user-perceived grapheme may contain several code points; UI cursor, deletion, or counting logic may therefore need segmentation boundaries rather than char or code-point indexing."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.UnicodeCodePoint/UnicodeCodePoint.md", anchor: "code-unit-code-point-grapheme"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "How do Pattern flags change regex semantics, and why should they not be enabled by habit?"
    answer: "MULTILINE changes how ^/$ behave across lines, DOTALL lets . match line terminators, CASE_INSENSITIVE changes case matching, and UNICODE_CASE/UNICODE_CHARACTER_CLASS broaden Unicode semantics for case and character classes. Flags are part of the regex contract and can affect both correctness and performance; they also do not replace locale-sensitive Collator rules."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "11.Regex/Regex.md", anchor: "pattern-matcher"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "How does text-block processing in source differ from String.indent/stripIndent and translateEscapes at runtime?"
    answer: "A text block is processed by the compiler at source level through steps such as line-terminator normalization, incidental-indentation handling, and escape processing to produce a String value. String.indent/stripIndent are runtime transformations on an existing multiline String, and translateEscapes() is another runtime operation that interprets escape notation stored in String data. They are separate mechanisms even though all deal with text, whitespace, or escapes."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "12.TextBlocks/TextBlocks.md", anchor: "escape-processing"}
    apiRelated: {controller: "", methodSignature: ""}
