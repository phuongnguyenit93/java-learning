questions:
  - question: "String là gì và nó đóng vai trò gì trong một hệ thống Java? Vì sao không nên mô hình hóa mọi giá trị nghiệp vụ thành String?"
    answer: "String là kiểu tham chiếu cốt lõi của Java để biểu diễn văn bản. Nó xuất hiện nhiều ở đầu vào/đầu ra, giao diện người dùng, API, cấu hình, log, giao thức, lưu trữ và các ranh giới truyền dữ liệu. Tuy nhiên các giá trị như tiền, thời gian, trạng thái hay mã định danh nghiệp vụ vẫn nên dùng kiểu có ngữ nghĩa riêng khi phù hợp; String nên biểu diễn văn bản hoặc dạng văn bản tại ranh giới, không thay thế hệ kiểu của miền nghiệp vụ."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Immutability/Immutability.md", anchor: "string-purpose"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao tính bất biến của String quan trọng đối với API Java và cách chương trình vận hành?"
    answer: "Nội dung String không bị sửa tại chỗ nên có thể chia sẻ an toàn về mặt nội dung, dùng làm khóa băm ổn định và tham gia String Pool. Các phép biến đổi trả về một kết quả String thay vì sửa đối tượng cũ; kết quả đó không nhất thiết phải là một đối tượng khác nếu nội dung không cần thay đổi. Điều này giúp giảm rủi ro nhiều tham chiếu cùng trỏ tới dữ liệu có thể thay đổi và làm hợp đồng API dễ suy luận hơn."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Immutability/Immutability.md", anchor: "string-immutability"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Giải thích mô hình tư duy của String Pool và vì sao == vẫn không phải lựa chọn mặc định để so sánh nội dung văn bản."
    answer: "String Pool cung cấp tham chiếu chuẩn hóa cho String literal, hằng String và các giá trị được intern(). Vì vậy một số String có cùng nội dung có thể dùng chung định danh tham chiếu. Tuy nhiên == chỉ kiểm tra định danh tham chiếu, còn equals() kiểm tra nội dung String. Literal/hằng String được intern theo ngữ nghĩa Java; logic nghiệp vụ không nên dựa vào định danh tham chiếu trong pool để thay cho so sánh bằng nhau theo nội dung."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.StringPool/StringPool.md", anchor: "string-pool-model"}
    apiRelated: {controller: "StringPoolController", methodSignature: "identity()"}

  - question: "String, Unicode và Charset liên hệ với nhau thế nào khi dữ liệu đi qua ranh giới I/O?"
    answer: "String là giá trị văn bản mà các API cơ bản đánh chỉ số theo đơn vị mã UTF-16. Khi văn bản đi ra tệp, mạng hoặc giao thức byte, Charset xác định cách mã hóa văn bản thành byte và giải mã byte trở lại văn bản. Hai phía phải thống nhất Charset và chính sách xử lý lỗi phù hợp; String bản thân không mang sẵn UTF-8 hay một cách mã hóa byte bên ngoài JVM."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.Encoding/Encoding.md", anchor: "charset-encode-decode"}
    apiRelated: {controller: "EncodingController", methodSignature: "roundTrip()"}

  - question: "Vì sao char không phải là từ đồng nghĩa an toàn cho một ký tự người dùng nhìn thấy?"
    answer: "char là một đơn vị mã UTF-16. Một điểm mã Unicode ngoài BMP cần hai char dưới dạng surrogate pair, còn một cụm ký tự người dùng cảm nhận có thể gồm nhiều điểm mã, chẳng hạn chữ cái cơ sở + dấu kết hợp hoặc chuỗi emoji. Vì vậy char, code point và grapheme cluster là ba tầng xử lý khác nhau."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.UnicodeCodePoint/UnicodeCodePoint.md", anchor: "code-unit-code-point-grapheme"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Khi nào chuẩn hóa Unicode quan trọng trong logic ứng dụng?"
    answer: "Hai văn bản nhìn giống nhau có thể dùng các chuỗi điểm mã tương đương chuẩn tắc khác nhau, ví dụ ký tự dựng sẵn và ký tự cơ sở + dấu kết hợp. Nếu nghiệp vụ cần coi chúng tương đương trong so sánh, tìm kiếm hoặc lưu trữ, hãy chuẩn hóa tại một ranh giới có chủ đích. Chuẩn hóa Unicode không thay thế so sánh theo Locale, Collator hay quy tắc chữ hoa/thường của ngôn ngữ tự nhiên."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.UnicodeCodePoint/UnicodeCodePoint.md", anchor: "unicode-normalization"}
    apiRelated: {controller: "UnicodeController", methodSignature: "normalization()"}

  - question: "Bạn chọn giữa phép nối String, StringBuilder và StringBuffer như thế nào?"
    answer: "Dùng phép nối String cho biểu thức nhỏ, rõ ràng. Dùng StringBuilder khi xây chuỗi tăng dần qua nhiều bước hoặc vòng lặp để tránh tạo/sao chép nhiều String trung gian. StringBuffer cung cấp đồng bộ hóa ở nhiều phương thức và chủ yếu phù hợp khi thực sự cần bộ đệm ký tự dùng chung hoặc phải tương thích API cũ; đồng bộ hóa từng phương thức không tự giải quyết luồng xử lý nhiều bước."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.StringBuffer/StringBuffer.md", anchor: "builder-vs-buffer"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "String.intern() giải quyết vấn đề gì và vì sao không nên dùng một cách máy móc?"
    answer: "intern() trả về tham chiếu chuẩn hóa trong String Pool cho nội dung tương ứng. Cơ chế này có thể hữu ích trong khối lượng xử lý chuyên biệt có tập giá trị lặp lại và được kiểm soát, nhưng nó thêm chi phí tra cứu/quản lý bảng String và làm mã dễ phụ thuộc không cần thiết vào định danh tham chiếu. Với dữ liệu có số lượng giá trị khác nhau rất lớn, lợi ích loại bỏ trùng lặp thường thấp."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.Intern/Intern.md", anchor: "intern-tradeoffs"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Bạn rà soát một Regex cho môi trường vận hành thực tế như thế nào thay vì chỉ kiểm tra nó so khớp đúng?"
    answer: "Ngoài tính đúng đắn, cần kiểm tra giới hạn đầu vào, lượng từ/nhánh lựa chọn lồng nhau mơ hồ, nguy cơ quay lui bùng nổ, việc tái sử dụng Pattern đã biên dịch và xem API String hoặc bộ phân tích cú pháp (parser) có đơn giản hơn không. Một Regex so khớp đúng trên đầu vào thuận lợi vẫn có thể có chi phí lúc chạy khó dự đoán trên đầu vào xấu."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "11.Regex/Regex.md", anchor: "regex-performance"}
    apiRelated: {controller: "RegexController", methodSignature: "backtracking()"}

  - question: "Tính bất biến của String được giữ thế nào khi tạo String từ char[] hoặc khi gọi toCharArray()?"
    answer: "String phải tách khỏi alias tới mảng có thể thay đổi. Sau khi new String(char[]) hoàn tất, sửa mảng nguồn không được làm String đã tạo đổi nội dung; toCharArray() cũng trả về một mảng độc lập mà bên gọi có thể sửa. Cách String lưu dữ liệu nội bộ vẫn là chi tiết triển khai của JVM."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Immutability/Immutability.md", anchor: "string-immutability"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao một biến final String chưa chắc làm phép nối trở thành biểu thức hằng tại thời điểm biên dịch?"
    answer: "final chỉ ngăn gán lại tham chiếu. Muốn tham gia biểu thức hằng, biến phải là biến hằng được khởi tạo bằng biểu thức hằng mà trình biên dịch biết tại thời điểm biên dịch. final String nhận giá trị từ args, lời gọi phương thức hoặc dữ liệu chỉ biết khi chương trình chạy không có bảo đảm việc tính trước/tham chiếu intern như một String biểu thức hằng."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.Concatenation/Concatenation.md", anchor: "compile-time-concat"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "String và CharSequence khác nhau thế nào về tính bất biến và hợp đồng so sánh bằng nhau?"
    answer: "String triển khai CharSequence, nhưng CharSequence không hứa bất biến; StringBuilder và StringBuffer cũng triển khai CharSequence nhưng có thể thay đổi. String.equals() chỉ tuân theo hợp đồng so sánh bằng nhau của String, không tạo hợp đồng so sánh bằng nhau chung giữa mọi kiểu triển khai. Khi cần so nội dung String với một CharSequence phù hợp, contentEquals(...) thể hiện ý định trực tiếp hơn."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CoreStringOperations/CoreStringOperations.md", anchor: "string-char-sequence"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Bạn chọn API String trực tiếp hay Regex thế nào khi kiểm tra, tìm kiếm, trích xuất hoặc biến đổi văn bản?"
    answer: "Chọn theo ý định: length()/isBlank()/charAt() cho kiểm tra, startsWith()/contains()/indexOf() cho tìm literal, substring() cho phạm vi chỉ số đã biết, replace() cho thay thế literal, và Regex khi bài toán thật sự cần so khớp mẫu. Regex không nên là mặc định cho mọi thao tác văn bản vì API trực tiếp thường biểu đạt bài toán đơn giản rõ hơn."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "11.Regex/Regex.md", anchor: "regex-purpose"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Giải thích String.split(regex, limit) khi limit dương, bằng 0 và âm."
    answer: "limit > 0 tạo tối đa limit phần tử và phần tử cuối giữ phần đầu vào còn lại. limit == 0 không đặt giới hạn dương nhưng loại các chuỗi rỗng ở cuối. limit < 0 cũng không đặt giới hạn dương và giữ các chuỗi rỗng ở cuối. Tham số limit vì vậy ảnh hưởng trực tiếp tới dữ liệu đầu ra, không chỉ là một tùy chọn hiệu năng."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.CoreStringOperations/CoreStringOperations.md", anchor: "string-split-join"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao không nên nói mọi phép nối String bằng + luôn được trình biên dịch đổi thành StringBuilder, và vì sao += trong vòng lặp vẫn có thể tốn kém?"
    answer: "Java quy định ngữ nghĩa phép nối, còn trình biên dịch/môi trường chạy có thể dùng các chiến lược triển khai khác nhau như invokedynamic. Mã ứng dụng không nên phụ thuộc vào một cách hạ biểu thức xuống mã thực thi cụ thể. Với += lặp lại, mỗi bước có thể tạo kết quả String bất biến mới và sao chép phần tiền tố ngày càng dài, nên tổng lượng sao chép có thể lớn hơn khi dùng một bộ đệm có thể thay đổi."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.Concatenation/Concatenation.md", anchor: "loop-concat-cost"}
    apiRelated: {controller: "StringConcatController", methodSignature: "constructionTrace()"}

  - question: "Phân biệt length, capacity và ý nghĩa của StringBuilder.toString() tại thời điểm gọi."
    answer: "length() là số đơn vị mã UTF-16 hiện có; capacity() là dung lượng bộ đệm trước khi cần mở rộng và là mối quan tâm hiệu năng chứ không phải độ dài tối đa. toString() tạo một String biểu diễn nội dung tại thời điểm gọi; thay đổi builder về sau không làm String đã tạo thay đổi."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "", anchor: ""}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao các phương thức synchronized của StringBuffer không làm một luồng xử lý nhiều bước tự động nguyên tử (atomic)?"
    answer: "StringBuffer đồng bộ hóa từng lời gọi phương thức. Một chuỗi như đọc length, quyết định rồi append gồm nhiều thao tác riêng, nên luồng khác vẫn có thể xen vào giữa. Nếu một điều kiện bất biến phải bao phủ toàn chuỗi, bên gọi cần ranh giới đồng bộ lớn hơn hoặc thiết kế tránh bộ đệm dùng chung."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.StringBuffer/StringBuffer.md", anchor: "thread-safety-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao intern dữ liệu có số lượng giá trị khác nhau rất lớn hoặc do người dùng kiểm soát thường là một tối ưu kém?"
    answer: "Khi phần lớn giá trị gần như duy nhất, intern() đem lại rất ít lợi ích loại bỏ trùng lặp nhưng vẫn thêm chi phí tra cứu và quản lý bảng String. Nó cũng có thể làm mã phụ thuộc không cần thiết vào định danh tham chiếu. Chỉ nên intern khi khối lượng xử lý/số lượng giá trị khác nhau được kiểm soát và có lý do hoặc đo đạc thực tế chứng minh lợi ích."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.Intern/Intern.md", anchor: "intern-tradeoffs"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Trong Java 21, vì sao vẫn nên ghi Charset rõ ràng ở hợp đồng tệp hoặc giao thức dù Charset mặc định của Java là UTF-8?"
    answer: "Từ JDK 18, JEP 400 quy định UTF-8 là Charset mặc định của Java, nên Charset.defaultCharset() trên JDK chuẩn Java 21 là UTF-8 và các API dùng Charset mặc định theo hợp đồng sẽ theo lựa chọn đó. Tuy nhiên cách mã hóa tại ranh giới dữ liệu vẫn là hợp đồng giữa hai phía; console và một số luồng chuẩn còn có cơ chế Charset riêng. Dùng StandardCharsets.UTF_8 khi phù hợp giúp ý định rõ ràng và không phụ thuộc ngầm vào cấu hình tương thích."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.Encoding/Encoding.md", anchor: "default-charset-risk"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Đầu vào sai định dạng (malformed input) và ký tự không thể ánh xạ (unmappable character) khác nhau thế nào khi mã hóa/giải mã?"
    answer: "Malformed nghĩa là cấu trúc đầu vào không hợp lệ cho thao tác đang thực hiện, ví dụ byte UTF-8 sai cấu trúc khi giải mã hoặc surrogate đứng riêng khi mã hóa. Unmappable nghĩa là đầu vào hợp lệ nhưng Charset đích không biểu diễn được, ví dụ é khi mã hóa sang US-ASCII. Các phiên bản phương thức tiện dụng getBytes(Charset) và new String(bytes, Charset) dùng giá trị thay thế; khi cần REPORT/IGNORE/chính sách tùy chỉnh hãy dùng CharsetEncoder/CharsetDecoder."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.Encoding/Encoding.md", anchor: "malformed-input"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao có một String không đồng nghĩa văn bản đã hợp lệ hoàn toàn theo Unicode, và vì sao điểm mã vẫn chưa bằng cụm ký tự?"
    answer: "String là chuỗi đơn vị mã UTF-16 và có thể chứa surrogate đứng riêng; codePoints() cũng không phải bộ xác thực Unicode. Ngoài ra một cụm ký tự người dùng nhìn thấy có thể gồm nhiều điểm mã. Vì vậy logic giao diện về con trỏ, xóa hoặc đếm ký tự có thể cần ranh giới phân đoạn văn bản thay vì chỉ số char hoặc điểm mã."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.UnicodeCodePoint/UnicodeCodePoint.md", anchor: "code-unit-code-point-grapheme"}
