EncodingController:
  roundTrip():
    execution: |-
      <p><strong>Concept:</strong> Charset is the contract between text and bytes.</p>
      <ol>
        <li><strong>Flow:</strong> create <code>"Xin chào ☕"</code> → <code>getBytes(UTF_8)</code> → <code>new String(bytes, UTF_8)</code>.</li>
        <li><strong>Code evidence:</strong><pre><code>byte[] bytes = text.getBytes(StandardCharsets.UTF_8);&#10;String decoded = new String(bytes, StandardCharsets.UTF_8);</code></pre>The same Charset is used in both directions.</li>
        <li><strong>Observation:</strong> <code>decoded</code> equals <code>text</code> and <code>roundTrip=true</code>; <code>utf8Bytes</code> is a byte count, not <code>String.length()</code>.</li>
        <li><strong>Conclusion:</strong> compatible Charset use can preserve content across the byte boundary. A String does not intrinsically carry UTF-8.</li>
      </ol>
    usage: true
  wrongCharset():
    execution: |-
      <p><strong>Concept:</strong> the same bytes can reconstruct different text when the Charset contract disagrees.</p>
      <ol>
        <li><strong>Flow:</strong> encode <code>"café"</code> with UTF-8, then deliberately decode the bytes as ISO-8859-1.</li>
        <li><strong>Code evidence:</strong><pre><code>byte[] utf8 = text.getBytes(StandardCharsets.UTF_8);&#10;String wrong = new String(utf8, StandardCharsets.ISO_8859_1);</code></pre>The two sides deliberately disagree.</li>
        <li><strong>Observation:</strong> <code>decodedAsLatin1</code> differs from <code>original</code> and <code>same=false</code>.</li>
        <li><strong>Conclusion:</strong> transport can preserve every byte while text is still wrong because byte interpretation differs; this is mojibake, not evidence of byte loss.</li>
      </ol>
    usage: true
RegexController:
  groups():
    execution: |-
      <p><strong>Concept:</strong> Matcher carries match state, and captures are meaningful only after a successful match.</p>
      <ol>
        <li><strong>Flow:</strong> compile a Pattern with named <code>user</code>/<code>domain</code> groups → create a Matcher for <code>ada@example.com</code> → call <code>matches()</code> → read groups.</li>
        <li><strong>Code evidence:</strong><pre><code>boolean found = m.matches();&#10;String user = found ? m.group("user") : "";</code></pre>Captures are read only after a successful match state.</li>
        <li><strong>Observation:</strong> the response contains <code>matched=true</code>, <code>user=ada</code>, and <code>domain=example.com</code>.</li>
        <li><strong>Conclusion:</strong> Pattern represents the compiled rule; Matcher binds that rule to input and stores the resulting state/captures.</li>
      </ol>
    usage: true
  backtracking():
    execution: |-
      <p><strong>Concept:</strong> ambiguous nested quantifiers can force a backtracking engine to explore many paths.</p>
      <ol>
        <li><strong>Flow:</strong> run <code>(a+)+$</code> on eighteen <code>a</code> characters followed by <code>!</code>, causing failure near the end.</li>
        <li><strong>Code evidence:</strong><pre><code>String input = "a".repeat(18) + "!";&#10;Pattern risky = Pattern.compile("(a+)+$");</code></pre>The sample is deliberately bounded and measured once.</li>
        <li><strong>Observation:</strong> <code>matched=false</code>, <code>boundedSample=true</code>; <code>elapsedNanos</code> only records this particular run.</li>
        <li><strong>Conclusion:</strong> regex shape and input bounds matter. Do not treat the timing as a benchmark, SLA, or universal safety threshold.</li>
      </ol>
    usage: true
StringConcatController:
  constructionTrace():
    execution: |-
      <p><strong>Concept:</strong> repeated String concatenation produces successive immutable results, while StringBuilder reuses one mutable construction buffer.</p>
      <ol>
        <li><strong>Flow:</strong> the first loop performs <code>s = s + i</code>; the second performs <code>b.append(i)</code>.</li>
        <li><strong>Code evidence:</strong><pre><code>s = s + i;&#10;ids.add(System.identityHashCode(s));&#10;b.append(i);</code></pre>Both branches construct <code>0123</code>.</li>
        <li><strong>Observation:</strong> <code>concatResult</code> equals <code>builderResult</code>; <code>concatIntermediateIdentities</code> provides a trace of intermediate results.</li>
        <li><strong>Conclusion:</strong> equal final content does not imply the same construction strategy. Identity hashes are not allocation counters and can collide, so they cannot count allocations precisely.</li>
      </ol>
    usage: true
StringPoolController:
  identity():
    execution: |-
      <p><strong>Concept:</strong> content equality and reference identity answer different questions.</p>
      <ol>
        <li><strong>Flow:</strong> create the <code>"java"</code> literal, constant concatenation <code>"ja"+"va"</code>, <code>new String("java")</code>, then call <code>intern()</code>.</li>
        <li><strong>Code evidence:</strong><pre><code>String literalB = "ja" + "va";&#10;String runtime = new String("java");&#10;String interned = runtime.intern();</code></pre>The response exposes both <code>==</code> and <code>equals()</code> observations.</li>
        <li><strong>Observation:</strong> <code>literalIdentity=true</code>, <code>newStringIdentity=false</code>, <code>contentEquals=true</code>, <code>internIdentity=true</code>.</li>
        <li><strong>Conclusion:</strong> literal/constant Strings use canonical identity, <code>new</code> creates a distinct object, and <code>intern()</code> returns the canonical reference. Content comparison still uses <code>equals()</code>.</li>
      </ol>
    usage: true
UnicodeController:
  charVsCodePoint():
    execution: |-
      <p><strong>Concept:</strong> <code>String.length()</code> counts UTF-16 code units, not code points or grapheme clusters.</p>
      <ol>
        <li><strong>Flow:</strong> use <code>"A😀"</code> and compute <code>length()</code>, <code>codePointCount(...)</code>, and <code>codePoints()</code>.</li>
        <li><strong>Code evidence:</strong><pre><code>value.length();&#10;value.codePointCount(0, value.length());&#10;value.codePoints();</code></pre>The three APIs observe the same String at different counting layers.</li>
        <li><strong>Observation:</strong> <code>utf16Length=3</code>, <code>codePointCount=2</code>, with code points <code>U+0041</code> and <code>U+1F600</code>.</li>
        <li><strong>Conclusion:</strong> choose the counting unit for the actual problem. This endpoint neither counts user-perceived graphemes nor validates Unicode well-formedness.</li>
      </ol>
    usage: true
  normalization():
    execution: |-
      <p><strong>Concept:</strong> canonically equivalent Strings can have different code-point sequences and compare unequal before normalization.</p>
      <ol>
        <li><strong>Flow:</strong> compare precomposed <code>"é"</code> with decomposed <code>"e\u0301"</code> → inspect equality/code points → normalize both to NFC → compare again.</li>
        <li><strong>Code evidence:</strong><pre><code>String nfcA = Normalizer.normalize(composed, Normalizer.Form.NFC);&#10;String nfcB = Normalizer.normalize(decomposed, Normalizer.Form.NFC);</code></pre>The controller performs NFC only.</li>
        <li><strong>Observation:</strong> <code>equalsBefore=false</code>, the code-point lists differ, and <code>equalsAfterNfc=true</code>.</li>
        <li><strong>Conclusion:</strong> visual rendering does not make <code>String.equals()</code> normalize automatically. This experiment demonstrates NFC only, not NFD/NFKC/NFKD.</li>
      </ol>
    usage: true
