StringPoolController:
  identity():
    summary: String Pool và định danh tham chiếu
    description: Đặt literal "java", biểu thức hằng "ja"+"va", new String("java")
      và intern() cạnh nhau. literalIdentity=true cho thấy hằng String dùng chung
      tham chiếu chuẩn hóa; newStringIdentity=false nhưng contentEquals=true tách
      định danh tham chiếu khỏi nội dung; internIdentity=true cho thấy intern() trả
      tham chiếu chuẩn hóa tương ứng.
