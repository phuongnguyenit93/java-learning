UnicodeController:
  charVsCodePoint():
    summary: UTF-16 code units and Unicode code points
    description: Uses "A😀" to compare utf16Length=3 with codePointCount=2 and the
      returned codePoints. The experiment demonstrates that length() counts UTF-16
      code units; the supplementary emoji occupies two code units but one code point.
      It does not measure user-perceived grapheme clusters.
