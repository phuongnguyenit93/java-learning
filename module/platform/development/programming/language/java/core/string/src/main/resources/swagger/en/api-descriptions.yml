  wrongCharset():
    summary: Mojibake from a Charset mismatch
    description: Encodes "café" as UTF-8 but intentionally decodes those bytes as
      ISO-8859-1. Observe decodedAsLatin1 and same=false to see that intact bytes
      can still produce wrong text when the interpretation contract disagrees.
