EncodingController:
  roundTrip():
    summary: UTF-8 text/bytes round trip
    description: Encodes "Xin chào ☕" to bytes with UTF-8 and decodes the same bytes
      with UTF-8. Compare text, utf8Bytes, decoded, and roundTrip to observe a content-preserving
      round trip when both sides use the same Charset and the data is representable.
