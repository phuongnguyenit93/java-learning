  normalization():
    summary: Canonical equivalence and equals()
    description: Compares precomposed "é" with decomposed "e\u0301". equalsBefore=false
      and the different code-point lists show that visual rendering does not determine
      String equality; after both values are normalized to NFC, equalsAfterNfc=true.
      This endpoint demonstrates NFC only; it does not run NFD, NFKC, or NFKD.
