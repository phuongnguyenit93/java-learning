StringPoolController:
  identity():
    summary: String pool and reference identity
    description: Places the "java" literal, constant expression "ja"+"va", new String("java"),
      and intern() side by side. literalIdentity=true demonstrates canonical identity
      for the constant String; newStringIdentity=false with contentEquals=true separates
      identity from content; internIdentity=true shows the canonical reference returned
      by intern().
