  wrongCharset():
    summary: Mojibake from a Charset mismatch
    description: Encodes "café" with UTF-8 but intentionally decodes the same bytes
      as ISO-8859-1. Observe original, decodedAsLatin1, and same=false to see that
      bytes can arrive intact while reconstructed text is wrong because the interpretation
      contract disagrees.
