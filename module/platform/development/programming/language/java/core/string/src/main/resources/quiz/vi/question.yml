      - {id: B, answer: "Chỉ System.identityHashCode.", explanation: "Sai. String không nạp chồng ==; == vẫn là so sánh định danh tham chiếu."}
      - {id: C, answer: "equals(), vì nó so sánh nội dung String thay vì định danh tham chiếu.", explanation: "Đúng. String không nạp chồng toán tử ==; == vẫn so sánh tham chiếu."}
      - {id: D, answer: "compareTo luôn phải trả chính xác 1.", explanation: "Sai. String không nạp chồng ==; == vẫn là so sánh định danh tham chiếu."}
