  - id: string-intern-canonical
    question: "String.intern() trả về gì?"
    answers:
      - {id: A, answer: "Một bản sao sâu được bảo đảm nằm ngoài vùng heap.", explanation: "Sai. intern() liên quan tham chiếu chuẩn hóa trong String Pool, không làm String có thể thay đổi và không quyết định cách mã hóa byte."}
      - {id: B, answer: "Một phiên bản String có thể thay đổi.", explanation: "Sai. intern() liên quan tham chiếu chuẩn hóa trong String Pool, không làm String có thể thay đổi và không quyết định cách mã hóa byte."}
      - {id: C, answer: "Tham chiếu chuẩn hóa trong String Pool cho nội dung String tương ứng.", explanation: "Đúng. intern() liên quan chuẩn hóa định danh tham chiếu, không làm String có thể thay đổi và không liên quan Charset."}
      - {id: D, answer: "Mảng byte UTF-8 làm bộ nhớ backing bắt buộc của String.", explanation: "Sai. intern() liên quan tham chiếu chuẩn hóa trong String Pool, không làm String có thể thay đổi và không quyết định cách mã hóa byte."}
