  - id: string-pool-identity
    question: "Vì sao hai String literal giống nhau có thể cho == là true trong khi hai new String(\"x\") thường không?"
    answers:
      - {id: A, answer: "== luôn so sánh nội dung String.", explanation: "Sai. == so sánh định danh tham chiếu; so sánh nội dung dùng equals()."}
      - {id: B, answer: "Các String literal bằng nhau được intern và dùng cùng tham chiếu chuẩn hóa, còn new String(...) yêu cầu tạo đối tượng riêng; == so sánh định danh tham chiếu.", explanation: "Đúng. Pool giải thích vì sao một số String bằng nhau có cùng định danh tham chiếu, nhưng nội dung vẫn phải so bằng equals()."}
      - {id: C, answer: "new String(...) tự động intern đối tượng mới.", explanation: "Sai. Tạo bằng new không tự động thay đối tượng đó bằng tham chiếu chuẩn hóa từ pool."}
      - {id: D, answer: "equals() so sánh địa chỉ còn == so sánh văn bản.", explanation: "Sai. Hai ý này bị đảo ngược."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.StringPool/StringPool.md", anchor: "pool-identity"}
    apiRelated: {controller: "StringPoolController", methodSignature: "identity()"}

