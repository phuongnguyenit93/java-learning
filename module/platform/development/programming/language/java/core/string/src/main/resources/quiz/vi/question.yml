      - {id: B, answer: "String ban đầu bị sửa trực tiếp.", explanation: "Sai. Phép biến đổi String không sửa đối tượng hiện có tại chỗ."}
      - {id: C, answer: "String ban đầu tự trở thành null.", explanation: "Sai. Việc bỏ qua giá trị trả về không làm biến hiện tại trở thành null."}
      - {id: D, answer: "JVM sửa String trong pool nên mọi tham chiếu cùng thay đổi.", explanation: "Sai. String bất biến; một String dùng chung trong pool không bị sửa nội dung tại chỗ."}
