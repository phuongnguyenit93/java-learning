questions:
  - id: string-purpose-and-role
    question: "Mô hình tư duy nào đúng nhất về vai trò của String trong một ứng dụng Java?"
    answers:
      - {id: A, answer: "String là kiểu tham chiếu cốt lõi để biểu diễn văn bản, thường xuất hiện ở đầu vào/đầu ra và ranh giới hệ thống; dữ liệu nghiệp vụ vẫn nên giữ kiểu có ý nghĩa khi phù hợp.", explanation: "Đúng. String rất phổ biến ở các ranh giới văn bản, nhưng không nên biến mọi dữ liệu nghiệp vụ thành String và làm mất ngữ nghĩa kiểu."}
      - {id: B, answer: "Mọi số, ngày tháng và mã định danh nghiệp vụ nên chuyển sang String càng sớm càng tốt.", explanation: "Sai. Cách này làm mất ngữ nghĩa kiểu và các quy tắc kiểm tra hợp lệ của miền nghiệp vụ."}
      - {id: C, answer: "String chỉ dùng để in console và không nên xuất hiện ở API hoặc ranh giới lưu trữ.", explanation: "Sai. Văn bản xuất hiện rộng trong API, cấu hình, log, giao thức và chuyển đổi lưu trữ."}
      - {id: D, answer: "String là kiểu nguyên thủy đại diện trực tiếp cho byte UTF-8.", explanation: "Sai. String biểu diễn văn bản; khi đi qua ranh giới byte mới cần Charset để mã hóa/giải mã."}
