  - id: string-charset-roundtrip
    question: "Để vòng mã hóa/giải mã văn bản ↔ byte đáng tin cậy, phía tạo và phía đọc dữ liệu phải thống nhất điều gì?"
    answers:
      - {id: A, answer: "Chỉ cần String.length() bằng nhau.", explanation: "Sai. Byte không tự mang thông tin diễn giải văn bản; Charset là một phần của hợp đồng dữ liệu."}
      - {id: B, answer: "Charset mặc định của mọi môi trường và mọi luồng I/O luôn là UTF-8.", explanation: "Sai. JEP 400 chuẩn hóa Charset mặc định của Java, nhưng không nên suy rộng thành mọi console/một số luồng chuẩn đều dùng cùng cơ chế Charset."}
      - {id: C, answer: "Thứ tự byte có thể thay thế việc thống nhất Charset.", explanation: "Sai. Cách diễn giải byte thành văn bản vẫn cần một Charset/hợp đồng mã hóa rõ ràng."}
      - {id: D, answer: "Phải thống nhất Charset và bảo đảm Charset/chính sách lỗi phù hợp với dữ liệu cần truyền.", explanation: "Đúng. Hai phía phải cùng diễn giải byte theo một hợp đồng mã hóa tương thích; nếu Charset không biểu diễn được dữ liệu hoặc chính sách lỗi khác nhau, vòng chuyển đổi có thể mất thông tin."}
    correctAnswerId: D
