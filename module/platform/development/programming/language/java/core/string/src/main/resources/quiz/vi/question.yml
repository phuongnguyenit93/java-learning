  - id: string-codepoint-length
    question: "Vì sao String.length() có thể lớn hơn số điểm mã Unicode trong văn bản?"
    answers:
      - {id: A, answer: "length() đếm đơn vị mã UTF-16; một điểm mã ngoài BMP cần cặp surrogate gồm hai đơn vị mã.", explanation: "Đúng. Chỉ số của String dựa trên đơn vị mã UTF-16, không phải điểm mã Unicode hay cụm ký tự người dùng cảm nhận."}
      - {id: B, answer: "length() đếm byte UTF-8.", explanation: "Sai. Chỉ số của String dựa trên đơn vị mã UTF-16, không phải điểm mã Unicode hay cụm ký tự người dùng cảm nhận."}
      - {id: C, answer: "Mọi chữ có dấu luôn được lưu thành bốn char.", explanation: "Sai. Chỉ số của String dựa trên đơn vị mã UTF-16, không phải điểm mã Unicode hay cụm ký tự người dùng cảm nhận."}
      - {id: D, answer: "length() đếm cụm ký tự còn codePointCount() đếm byte.", explanation: "Sai. Chỉ số của String dựa trên đơn vị mã UTF-16, không phải điểm mã Unicode hay cụm ký tự người dùng cảm nhận."}
    correctAnswerId: A
