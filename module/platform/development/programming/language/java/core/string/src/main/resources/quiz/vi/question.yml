      - {id: C, answer: "Garbage collector lập tức gộp mọi String có cùng nội dung.", explanation: "Sai. Xử lý biểu thức hằng tại thời điểm biên dịch khác với phép nối thông thường khi chương trình chạy."}
      - {id: D, answer: "Java đánh giá biểu thức hằng này tại thời điểm biên dịch; kết quả là một hằng String được intern.", explanation: "Đúng. Đây là ngữ nghĩa của biểu thức hằng String, không phải một tối ưu tùy chọn có thể suy rộng sang phép nối khi chương trình chạy."}
