AccessReflectionController:
  accessChecks():
    execution: |-
      <p><strong>Khái niệm:</strong> khám phá được thành phần private không đồng nghĩa với việc bên gọi được phép sử dụng thành phần đó.</p>
      <ol>
        <li><strong>Luồng:</strong> API lấy <code>internalStatus()</code> bằng <code>getDeclaredMethod()</code>, đo <code>canAccess</code>, gọi <code>trySetAccessible()</code>, rồi chỉ gọi method nếu mở quyền thành công.</li>
        <li><strong>Minh chứng từ mã:</strong><pre><code>Method method = PaymentAccessSample.class.getDeclaredMethod("internalStatus");
      boolean before = method.canAccess(service);
      boolean opened = method.trySetAccessible();
      boolean after = method.canAccess(service);
      Object value = opened ? method.invoke(service) : "not-accessible";</code></pre></li>
        <li><strong>Quan sát:</strong> trong mô-đun minh họa chạy trên classpath, phản hồi thường cho <code>canAccessBefore=false</code>, <code>trySetAccessible=true</code>, <code>canAccessAfter=true</code>.</li>
        <li><strong>Ý nghĩa:</strong> đối tượng mô tả và quyền sử dụng là hai lớp khác nhau; JPMS có thể khiến bước mở quyền thất bại trong môi trường mô-đun đóng gói chặt hơn.</li>
      </ol>
      <p><strong>Kết luận:</strong> Reflection không tự xóa tính đóng gói; việc yêu cầu bỏ qua một số kiểm tra truy cập ở lúc chạy có thể thành công hoặc thất bại.</p>
    usage: true
ClassMetadataController:
  inspectType():
    execution: |-
      <p><strong>Khái niệm:</strong> <code>Class&lt;?&gt;</code> là đối tượng lúc chạy mô tả một kiểu, không phải mã nguồn của class.</p>
      <ol>
        <li><strong>Luồng:</strong> API dùng <code>PaymentService.class</code>, sau đó đọc loại kiểu, modifier, <code>accessFlags()</code>, superclass, interface và quan hệ gán kiểu.</li>
        <li><strong>Minh chứng từ mã:</strong><pre><code>Class&lt;?&gt; type = PaymentService.class;
      type.isRecord();
      type.accessFlags();
      type.getSuperclass();
      type.getInterfaces();
      PaymentProcessor.class.isAssignableFrom(type);</code></pre></li>
        <li><strong>Quan sát:</strong> <code>PaymentService</code> là class final, superclass là <code>Object</code>, triển khai <code>PaymentProcessor</code>; <code>PaymentRequest</code> được nhận diện là record.</li>
        <li><strong>Ý nghĩa:</strong> framework có thể phân loại và kiểm tra kiểu lúc chạy trước khi đi xuống Field/Method/Constructor.</li>
      </ol>
      <p><strong>Kết luận:</strong> <code>Class&lt;?&gt;</code> là cửa vào trung tâm của Reflection để chuyển từ kiểu lúc chạy sang siêu dữ liệu có cấu trúc.</p>
    usage: true
ConstructorReflectionController:
  construct():
    execution: |-
      <p><strong>Khái niệm:</strong> constructor có thể được khám phá như siêu dữ liệu rồi dùng để tạo đối tượng khi cách khởi tạo chỉ được quyết định lúc chạy.</p>
      <ol>
        <li><strong>Luồng:</strong> API tra cứu constructor <code>PaymentService(String)</code>, đọc siêu dữ liệu tham số và gọi <code>newInstance("stripe")</code>.</li>
        <li><strong>Minh chứng từ mã:</strong><pre><code>Constructor&lt;PaymentService&gt; constructor =
        PaymentService.class.getConstructor(String.class);
      PaymentService service = constructor.newInstance("stripe");</code></pre></li>
        <li><strong>Quan sát:</strong> phản hồi cho thấy một tham số kiểu <code>String</code>, kiểu lúc chạy được tạo là <code>PaymentService</code>, provider là <code>stripe</code>.</li>
        <li><strong>Ý nghĩa:</strong> việc tạo đối tượng có thể được điều khiển bởi siêu dữ liệu lúc chạy thay vì biểu thức <code>new PaymentService(...)</code> cố định trong bên gọi.</li>
      </ol>
      <p><strong>Kết luận:</strong> Constructor Reflection hữu ích cho factory/container tổng quát nhưng chuyển nhiều lỗi khởi tạo sang lúc chạy.</p>
    usage: true
DynamicProxyController:
  intercept():
    execution: |-
      <p><strong>Khái niệm:</strong> JDK Dynamic Proxy tạo phần triển khai của interface lúc chạy và gom logic chặn lời gọi vào một <code>InvocationHandler</code>.</p>
      <ol>
        <li><strong>Luồng:</strong> API tạo đối tượng đích <code>PaymentGatewayImpl</code>, bọc bằng <code>TracingHandler</code>, tạo proxy với <code>Proxy.newProxyInstance()</code> rồi gọi <code>pay(...)</code>.</li>
        <li><strong>Minh chứng từ mã:</strong><pre><code>PaymentGateway proxy = (PaymentGateway) Proxy.newProxyInstance(
        PaymentGateway.class.getClassLoader(),
        new Class&lt;?&gt;[]{PaymentGateway.class},
        handler
      );
      String value = proxy.pay(new PaymentRequest("ORD-42", 150_000L));</code></pre></li>
        <li><strong>Quan sát:</strong> dấu vết chứa <code>before:pay</code> rồi <code>after:pay</code>; <code>Proxy.isProxyClass(...)=true</code> và proxy vẫn <code>instanceof PaymentGateway</code>.</li>
        <li><strong>Ý nghĩa:</strong> bên gọi giữ hợp đồng interface an toàn kiểu trong khi hành vi dùng chung được chèn ở lúc chạy.</li>
      </ol>
      <p><strong>Kết luận:</strong> JDK Proxy giải bài toán chặn lời gọi qua interface; nó không biến đối tượng đích thành proxy kiểu subclass và không chặn lời gọi đi thẳng vào đối tượng đích.</p>
    usage: true
FieldReflectionController:
  inspectAndMutate():
    execution: |-
      <p><strong>Khái niệm:</strong> <code>Field</code> là đối tượng mô tả lúc chạy có thể đọc/ghi trạng thái khi đối tượng nhận và quyền truy cập phù hợp.</p>
      <ol>
        <li><strong>Luồng:</strong> API tra cứu <code>processedCount</code> public, đọc giá trị bằng <code>getInt</code>, ghi <code>5</code> bằng <code>setInt</code>, rồi khám phá thêm field private <code>provider</code>.</li>
        <li><strong>Minh chứng từ mã:</strong><pre><code>Field field = PaymentFieldSample.class.getField("processedCount");
      int before = field.getInt(state);
      field.setInt(state, 5);
      int after = field.getInt(state);</code></pre></li>
        <li><strong>Quan sát:</strong> phản hồi cho thấy <code>before=1</code>, <code>after=5</code>; field private được khám phá nhưng <code>canAccess</code> vẫn false từ controller này.</li>
        <li><strong>Ý nghĩa:</strong> khám phá, tính tương thích của đối tượng nhận/giá trị và quyền truy cập là các bước khác nhau.</li>
      </ol>
      <p><strong>Kết luận:</strong> Reflection có thể thao tác trạng thái động, nhưng việc tìm thấy field không tự bỏ qua kiểm soát truy cập.</p>
    usage: true
GenericReflectionController:
  genericSignature():
    execution: |-
      <p><strong>Khái niệm:</strong> xóa kiểu (type erasure) không có nghĩa mọi siêu dữ liệu của khai báo generic đều biến mất.</p>
      <ol>
        <li><strong>Luồng:</strong> API đọc field <code>List&lt;? extends T&gt; values</code>, so sánh kiểu thô với <code>getGenericType()</code>, rồi kiểm tra <code>ParameterizedType</code>, <code>WildcardType</code> và <code>TypeVariable</code>.</li>
        <li><strong>Minh chứng từ mã:</strong><pre><code>Field field = Repository.class.getDeclaredField("values");
      ParameterizedType parameterized = (ParameterizedType) field.getGenericType();
      WildcardType wildcard = (WildcardType) parameterized.getActualTypeArguments()[0];
      TypeVariable&lt;Class&lt;Repository&gt;&gt; variable = Repository.class.getTypeParameters()[0];</code></pre></li>
        <li><strong>Quan sát:</strong> kiểu field thô là <code>java.util.List</code>, kiểu generic giữ <code>? extends T</code>; các giới hạn của <code>T</code> gồm <code>Number</code> và <code>Comparable&lt;T&gt;</code>.</li>
        <li><strong>Ý nghĩa:</strong> Reflection đọc chữ ký generic trên khai báo chứ không phục hồi đối số kiểu cụ thể của mọi đối tượng sau xóa kiểu.</li>
      </ol>
      <p><strong>Kết luận:</strong> framework cần xử lý cây <code>Type</code>, không thể giả định siêu dữ liệu generic luôn là <code>Class&lt;?&gt;</code>.</p>
    usage: true
MethodReflectionController:
  invoke():
    execution: |-
      <p><strong>Khái niệm:</strong> <code>Method.invoke()</code> thực hiện lời gọi động và bọc ngoại lệ do method đích ném bằng <code>InvocationTargetException</code>.</p>
      <ol>
        <li><strong>Luồng:</strong> API tra cứu <code>pay(PaymentRequest)</code>, gọi thành công, rồi tra cứu <code>reject()</code> và bắt lớp bọc khi mã đích ném <code>IllegalStateException</code>.</li>
        <li><strong>Minh chứng từ mã:</strong><pre><code>Method pay = PaymentService.class.getMethod("pay", PaymentRequest.class);
      Object success = pay.invoke(service, new PaymentRequest("ORD-42", 150_000L));

      Method reject = PaymentService.class.getMethod("reject");
      try {
          reject.invoke(service);
      } catch (InvocationTargetException ex) {
          Throwable cause = ex.getCause();
      }</code></pre></li>
        <li><strong>Quan sát:</strong> nhánh thành công trả <code>paid:ORD-42</code>; nhánh lỗi trả lớp bọc <code>InvocationTargetException</code> nhưng nguyên nhân là <code>IllegalStateException</code>.</li>
        <li><strong>Ý nghĩa:</strong> lỗi của cơ chế Reflection và lỗi từ mã nghiệp vụ đích phải được phân biệt khi framework báo lỗi hoặc truyền tiếp ngoại lệ.</li>
      </ol>
      <p><strong>Kết luận:</strong> lời gọi phản chiếu chuyển việc chọn thành phần, kiểm tra kiểu, quyền truy cập và lỗi sang lúc chạy; framework phải kiểm tra và bóc đúng lớp lỗi.</p>
    usage: true
