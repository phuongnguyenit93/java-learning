AccessReflectionController:
  accessChecks():
    summary: Observe discovery versus reflective access on a private method
    description: The API obtains the private internalStatus() descriptor, measures
      canAccess before and after trySetAccessible(), and invokes only when access
      is opened. The response separates discovering a member from being permitted
      to use it.
