AccessReflectionController:
  accessChecks():
    execution: |-
      <p><strong>Concept:</strong> discovering a private member does not mean the caller is permitted to invoke it.</p>
      <ol>
        <li><strong>Flow:</strong> The API resolves <code>internalStatus()</code> with <code>getDeclaredMethod()</code>, checks <code>canAccess</code>, calls <code>trySetAccessible()</code>, and invokes only if access is opened.</li>
        <li><strong>Code evidence:</strong><pre><code>Method method = PaymentAccessSample.class.getDeclaredMethod("internalStatus");
      boolean before = method.canAccess(service);
      boolean opened = method.trySetAccessible();
      boolean after = method.canAccess(service);
      Object value = opened ? method.invoke(service) : "not-accessible";</code></pre></li>
        <li><strong>Observation:</strong> In this classpath-based demo, the response normally shows <code>canAccessBefore=false</code>, <code>trySetAccessible=true</code>, and <code>canAccessAfter=true</code>.</li>
        <li><strong>Meaning:</strong> descriptor discovery and permission are separate layers; JPMS can make the access-opening step fail in a more strongly encapsulated deployment.</li>
      </ol>
      <p><strong>Conclusion:</strong> reflection does not automatically erase encapsulation; access suppression is a runtime request that can succeed or fail.</p>
    usage: true
ClassMetadataController:
  inspectType():
    execution: |-
      <p><strong>Concept:</strong> <code>Class&lt;?&gt;</code> is the runtime object describing a type, not the class's source code.</p>
      <ol>
        <li><strong>Flow:</strong> The API starts from <code>PaymentService.class</code> and reads type kind, modifiers, <code>accessFlags()</code>, superclass, interfaces, and assignability.</li>
        <li><strong>Code evidence:</strong><pre><code>Class&lt;?&gt; type = PaymentService.class;
      type.isRecord();
      type.accessFlags();
      type.getSuperclass();
      type.getInterfaces();
      PaymentProcessor.class.isAssignableFrom(type);</code></pre></li>
        <li><strong>Observation:</strong> <code>PaymentService</code> is a final class whose superclass is <code>Object</code> and which implements <code>PaymentProcessor</code>; <code>PaymentRequest</code> is detected as a record.</li>
        <li><strong>Meaning:</strong> Framework code can classify and validate a runtime type before moving into fields, methods, or constructors.</li>
      </ol>
      <p><strong>Conclusion:</strong> <code>Class&lt;?&gt;</code> is Reflection's central entry point from a runtime type into structured metadata.</p>
    usage: true
ConstructorReflectionController:
  construct():
    execution: |-
      <p><strong>Concept:</strong> A constructor can be discovered as metadata and then used to create an object when the construction path is chosen at runtime.</p>
      <ol>
        <li><strong>Flow:</strong> The API resolves <code>PaymentService(String)</code>, inspects parameter metadata, and calls <code>newInstance("stripe")</code>.</li>
        <li><strong>Code evidence:</strong><pre><code>Constructor&lt;PaymentService&gt; constructor =
        PaymentService.class.getConstructor(String.class);
      PaymentService service = constructor.newInstance("stripe");</code></pre></li>
        <li><strong>Observation:</strong> The response shows one <code>String</code> parameter, a created runtime type of <code>PaymentService</code>, and provider <code>stripe</code>.</li>
        <li><strong>Meaning:</strong> Object creation can be driven by runtime metadata instead of a fixed <code>new PaymentService(...)</code> expression in the caller.</li>
      </ol>
      <p><strong>Conclusion:</strong> Constructor reflection supports generic factories and containers but moves many construction failures to runtime.</p>
    usage: true
DynamicProxyController:
  intercept():
    execution: |-
      <p><strong>Concept:</strong> JDK Dynamic Proxy generates an interface implementation at runtime and centralizes interception in an <code>InvocationHandler</code>.</p>
      <ol>
        <li><strong>Flow:</strong> The API creates a <code>PaymentGatewayImpl</code> target, wraps it in <code>TracingHandler</code>, creates a proxy with <code>Proxy.newProxyInstance()</code>, and calls <code>pay(...)</code>.</li>
        <li><strong>Code evidence:</strong><pre><code>PaymentGateway proxy = (PaymentGateway) Proxy.newProxyInstance(
        PaymentGateway.class.getClassLoader(),
        new Class&lt;?&gt;[]{PaymentGateway.class},
        handler
      );
      String value = proxy.pay(new PaymentRequest("ORD-42", 150_000L));</code></pre></li>
        <li><strong>Observation:</strong> The trace contains <code>before:pay</code> followed by <code>after:pay</code>; <code>Proxy.isProxyClass(...)=true</code> while the proxy still satisfies <code>PaymentGateway</code>.</li>
        <li><strong>Meaning:</strong> The caller keeps a type-safe interface contract while runtime cross-cutting behavior is inserted behind that contract.</li>
      </ol>
      <p><strong>Conclusion:</strong> JDK Proxy solves interface interception; it does not turn the target into a subclass proxy and cannot intercept calls made directly on the target.</p>
    usage: true
FieldReflectionController:
  inspectAndMutate():
    execution: |-
      <p><strong>Concept:</strong> A <code>Field</code> descriptor can read or write state when the receiver, value type, and access rules are compatible.</p>
      <ol>
        <li><strong>Flow:</strong> The API resolves public <code>processedCount</code>, reads it with <code>getInt</code>, writes <code>5</code> with <code>setInt</code>, and also discovers the private <code>provider</code> field.</li>
        <li><strong>Code evidence:</strong><pre><code>Field field = PaymentFieldSample.class.getField("processedCount");
      int before = field.getInt(state);
      field.setInt(state, 5);
      int after = field.getInt(state);</code></pre></li>
        <li><strong>Observation:</strong> The response shows <code>before=1</code> and <code>after=5</code>; the private field is discoverable while <code>canAccess</code> remains false from this controller.</li>
        <li><strong>Meaning:</strong> Discovery, receiver/value compatibility, and access permission are separate steps.</li>
      </ol>
      <p><strong>Conclusion:</strong> Reflection can manipulate state dynamically, but discovering a field does not automatically bypass access control.</p>
    usage: true
GenericReflectionController:
  genericSignature():
    execution: |-
      <p><strong>Concept:</strong> Type erasure does not mean all generic declaration metadata disappears.</p>
      <ol>
        <li><strong>Flow:</strong> The API reads <code>List&lt;? extends T&gt; values</code>, compares the raw type with <code>getGenericType()</code>, and inspects <code>ParameterizedType</code>, <code>WildcardType</code>, and <code>TypeVariable</code>.</li>
        <li><strong>Code evidence:</strong><pre><code>Field field = Repository.class.getDeclaredField("values");
      ParameterizedType parameterized = (ParameterizedType) field.getGenericType();
      WildcardType wildcard = (WildcardType) parameterized.getActualTypeArguments()[0];
      TypeVariable&lt;Class&lt;Repository&gt;&gt; variable = Repository.class.getTypeParameters()[0];</code></pre></li>
        <li><strong>Observation:</strong> The raw field type is <code>java.util.List</code>, the generic type retains <code>? extends T</code>, and <code>T</code> has bounds <code>Number</code> and <code>Comparable&lt;T&gt;</code>.</li>
        <li><strong>Meaning:</strong> Reflection reads declaration-site generic signatures; it does not reconstruct a concrete type argument for every object after erasure.</li>
      </ol>
      <p><strong>Conclusion:</strong> Frameworks must handle the <code>Type</code> tree instead of assuming generic metadata is always a <code>Class&lt;?&gt;</code>.</p>
    usage: true
MethodReflectionController:
  invoke():
    execution: |-
      <p><strong>Concept:</strong> <code>Method.invoke()</code> performs dynamic invocation and wraps exceptions thrown by target code in <code>InvocationTargetException</code>.</p>
      <ol>
        <li><strong>Flow:</strong> The API resolves <code>pay(PaymentRequest)</code> and invokes it successfully, then resolves <code>reject()</code> and catches the wrapper when the target throws <code>IllegalStateException</code>.</li>
        <li><strong>Code evidence:</strong><pre><code>Method pay = PaymentService.class.getMethod("pay", PaymentRequest.class);
      Object success = pay.invoke(service, new PaymentRequest("ORD-42", 150_000L));

      Method reject = PaymentService.class.getMethod("reject");
      try {
          reject.invoke(service);
      } catch (InvocationTargetException ex) {
          Throwable cause = ex.getCause();
      }</code></pre></li>
        <li><strong>Observation:</strong> The success path returns <code>paid:ORD-42</code>; the failure path reports <code>InvocationTargetException</code> as the wrapper and <code>IllegalStateException</code> as the cause.</li>
        <li><strong>Meaning:</strong> Reflection-protocol failures and failures from business target code are different boundaries that frameworks must report or propagate differently.</li>
      </ol>
      <p><strong>Conclusion:</strong> Reflective invocation moves selection, type, access, and failure checks to runtime, so framework code must validate and unwrap the right boundary.</p>
    usage: true
