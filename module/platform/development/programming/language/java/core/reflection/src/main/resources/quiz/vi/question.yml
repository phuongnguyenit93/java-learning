  - id: reflection-q37
    question: "Mô hình nào mô tả đúng quan hệ giữa Member, Executable, AccessibleObject và AnnotatedElement?"
    answers:
      - {id: A, answer: "Member là superclass trực tiếp của Field, Method và Constructor.", explanation: "Sai. Member là interface chung, không phải superclass."}
      - {id: B, answer: "Executable là nền tảng chung của Method và Constructor; Field/Method/Constructor đều tham gia mô hình truy cập qua AccessibleObject.", explanation: "Đúng. Các abstraction chung giúp framework không phải coi ba loại thành phần là API hoàn toàn rời rạc."}
      - {id: C, answer: "AnnotatedElement chỉ áp dụng cho annotation class và không liên quan các thành phần Reflection.", explanation: "Sai. Nhiều phần tử Reflection triển khai AnnotatedElement."}
      - {id: D, answer: "AccessibleObject tự động cấp quyền truy cập private cho mọi thành phần.", explanation: "Sai. Nó cung cấp mô hình kiểm tra/yêu cầu quyền, không bảo đảm quyền luôn được mở."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ClassMetadata/ClassMetadata.md", anchor: "member-abstraction-model"}
    apiRelated: {controller: "", methodSignature: ""}

