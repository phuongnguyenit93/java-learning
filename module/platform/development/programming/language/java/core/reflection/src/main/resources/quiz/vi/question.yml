    answers:
      - {id: A, answer: "Annotation phải luôn có @Inherited.", explanation: "Sai. @Inherited chỉ điều chỉnh một phần ngữ nghĩa kế thừa trên class."}
      - {id: B, answer: "Annotation phải được giữ đến lúc chạy, điển hình bằng retention RUNTIME.", explanation: "Đúng. Annotation SOURCE hoặc CLASS không tự xuất hiện qua API Reflection lúc chạy."}
      - {id: C, answer: "Annotation phải được khai báo trong java.lang.", explanation: "Sai. Annotation tùy chỉnh cũng có thể được đọc."}
      - {id: D, answer: "Mọi annotation trong mã nguồn đều luôn tồn tại lúc chạy.", explanation: "Sai. Retention quyết định annotation còn tồn tại tới giai đoạn nào."}
    correctAnswerId: B
    aiGenerated: true
