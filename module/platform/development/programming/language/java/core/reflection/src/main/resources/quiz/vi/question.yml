  - id: reflection-q07
    question: "getInterfaces() trên một class trả điều gì?"
    answers:
      - {id: A, answer: "Toàn bộ transitive interface graph đã flatten.", explanation: "Sai. Framework phải traverse thêm nếu cần full closure."}
      - {id: B, answer: "Mọi interface đang được JVM nạp.", explanation: "Sai. API chỉ liên quan kiểu đang được kiểm tra."}
      - {id: C, answer: "Các interface mà class trực tiếp implements.", explanation: "Đúng. Với interface, nó trả direct superinterfaces."}
      - {id: D, answer: "Chỉ interface có public method.", explanation: "Sai. Không lọc theo method như vậy."}
    correctAnswerId: C
    aiGenerated: true
