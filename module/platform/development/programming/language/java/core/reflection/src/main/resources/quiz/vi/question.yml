      - {id: B, answer: "Class.isRecord()", explanation: "Đúng. Đây là classification API trực tiếp."}
      - {id: C, answer: "Record.isClass()", explanation: "Sai. Không có API này."}
      - {id: D, answer: "Class.getRecord()", explanation: "Sai. Không có API này."}
