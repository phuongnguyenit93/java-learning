    apiRelated: {controller: "ClassMetadataController", methodSignature: "inspectType()"}

  - id: reflection-q08
    question: "Khác biệt chính giữa getDeclaredMethod() và getMethod() là gì?"
    answers:
      - {id: A, answer: "getDeclaredMethod chỉ thấy public method được kế thừa.", explanation: "Sai. Nó tập trung vào khai báo trực tiếp."}
      - {id: B, answer: "getMethod thấy private method ở mọi superclass.", explanation: "Sai. Nó tìm trên bề mặt public."}
      - {id: C, answer: "Hai API luôn trả cùng tập method.", explanation: "Sai. Hợp đồng của chúng khác nhau."}
      - {id: D, answer: "getDeclaredMethod tìm khai báo trực tiếp ở mọi mức truy cập; getMethod tìm bề mặt public và có thể gồm method được kế thừa.", explanation: "Đúng. Đây là sự phân biệt cốt lõi."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ClassMetadata/ClassMetadata.md", anchor: "declared-vs-public-members"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: reflection-q35
    question: "Vì sao framework không nên giả định mọi Class<?> có cùng một tập siêu dữ liệu có ý nghĩa?"
    answers:
      - {id: A, answer: "Vì mảng, enum, record và kiểu sealed có siêu dữ liệu chuyên biệt như kiểu phần tử, hằng enum, record component hoặc kiểu con được phép.", explanation: "Đúng. Framework nên phân loại kiểu rồi dùng API phù hợp thay vì áp một mô hình duy nhất cho mọi Class<?>."}
      - {id: B, answer: "Vì Class<?> chỉ dùng được với class thường, không dùng được với mảng hoặc primitive.", explanation: "Sai. Mảng và primitive cũng có đối tượng Class."}
      - {id: C, answer: "Vì Reflection tự chuyển mọi record thành enum lúc chạy.", explanation: "Sai. Record và enum là các loại kiểu khác nhau."}
      - {id: D, answer: "Vì getSuperclass() luôn trả null cho mọi Class<?>.", explanation: "Sai. Class thường có thể trả superclass trực tiếp."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ClassMetadata/ClassMetadata.md", anchor: "specialized-type-metadata"}
    apiRelated: {controller: "ClassMetadataController", methodSignature: "inspectType()"}

  - id: reflection-q36
