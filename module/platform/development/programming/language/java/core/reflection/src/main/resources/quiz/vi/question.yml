      - {id: A, answer: "getDeclaredField('processedCount')", explanation: "Đúng. Tra cứu declared thấy thành phần private của chính class."}
      - {id: B, answer: "getField('processedCount') luôn tìm được.", explanation: "Sai. getField tuân theo hợp đồng chỉ tìm field public."}
      - {id: C, answer: "getMethod('processedCount')", explanation: "Sai. Đây là field, không phải method."}
      - {id: D, answer: "getFields()[0] vì thứ tự field ổn định.", explanation: "Sai. Không nên phụ thuộc thứ tự liệt kê."}
