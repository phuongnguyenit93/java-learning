questions:
  - id: reflection-q01
    question: "Reflection giải quyết bài toán cốt lõi nào?"
    answers:
      - {id: A, answer: "Cho mã kiểm tra siêu dữ liệu và chọn kiểu/thành phần lúc chạy khi cấu trúc không được ghi cứng sẵn.", explanation: "Đúng. Đây là lý do cốt lõi Reflection tồn tại."}
      - {id: B, answer: "Biến Java thành ngôn ngữ kiểu động và bỏ kiểm tra kiểu tại thời điểm biên dịch.", explanation: "Sai. Java vẫn là ngôn ngữ kiểu tĩnh; Reflection chỉ chuyển một số quyết định sang lúc chạy."}
      - {id: C, answer: "Tự động quét mọi class đã nạp mà bên gọi không cần chính sách.", explanation: "Sai. Bên gọi/framework vẫn phải quyết định cách khám phá."}
      - {id: D, answer: "Thay thế hoàn toàn interface, factory và registry.", explanation: "Sai. Các khái niệm tĩnh thường rõ hơn khi cấu trúc cụ thể đã biết."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Basic/Basic.md", anchor: "reflection-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: reflection-q02
    question: "Khi chỉ có tên nhị phân của class từ cấu hình, điểm vào nào phù hợp nhất?"
    answers:
      - {id: A, answer: "object.getClass()", explanation: "Sai. Cách này cần có đối tượng trước."}
      - {id: B, answer: "Class.forName(name)", explanation: "Đúng. API này phân giải Class từ tên nhị phân được biết lúc chạy."}
      - {id: C, answer: "new Class(name)", explanation: "Sai. Không tạo đối tượng Class theo cách này."}
      - {id: D, answer: "Method.forName(name)", explanation: "Sai. Method không có entry point như vậy."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ClassMetadata/ClassMetadata.md", anchor: "class-object-entrypoints"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: reflection-q03
    question: "Ý nghĩa đúng nhất của Class<?> là gì?"
    answers:
      - {id: A, answer: "Class chỉ có thể đại diện Object.", explanation: "Sai. Nó có thể đại diện nhiều kiểu Java mà JVM biết lúc chạy."}
      - {id: B, answer: "Class đã mất mọi siêu dữ liệu lúc chạy.", explanation: "Sai. Đối tượng Class chính là nguồn siêu dữ liệu quan trọng về kiểu lúc chạy."}
      - {id: C, answer: "Đó là một đối tượng Class hợp lệ nhưng mã hiện tại chưa biết kiểu cụ thể mà nó đại diện.", explanation: "Đúng. Wildcard diễn tả kiểu đại diện chưa biết tại thời điểm biên dịch."}
      - {id: D, answer: "Dấu ? làm Reflection bỏ qua hoàn toàn độ an toàn kiểu.", explanation: "Sai. Các kiểm tra lúc chạy và ràng buộc generic vẫn tồn tại."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ClassMetadata/ClassMetadata.md", anchor: "class-object-entrypoints"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: reflection-q04
    question: "Trường hợp nào hợp lý nhất để dùng Reflection?"
    answers:
      - {id: A, answer: "Gọi một method cố định mà trình biên dịch đã biết rõ.", explanation: "Sai. Lời gọi trực tiếp đơn giản hơn."}
      - {id: B, answer: "Đọc hằng cục bộ trong cùng method.", explanation: "Sai. Không có bài toán khám phá lúc chạy."}
      - {id: C, answer: "Thay mọi lời gọi trực tiếp bằng Method.invoke cho đồng nhất.", explanation: "Sai. Điều này tăng độ phức tạp vô ích."}
      - {id: D, answer: "Framework tổng quát phải kiểm tra/tạo kiểu do người dùng định nghĩa chỉ biết từ siêu dữ liệu lúc chạy.", explanation: "Đúng. Đây là trường hợp sử dụng điển hình."}
    correctAnswerId: D
    aiGenerated: true
