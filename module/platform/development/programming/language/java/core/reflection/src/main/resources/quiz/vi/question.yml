  - id: reflection-q05
    question: "Cái giá lớn nào xuất hiện khi chuyển từ lời gọi trực tiếp sang Reflection?"
    answers:
      - {id: A, answer: "Nhiều lỗi về tên/kiểu/quyền truy cập chuyển từ thời điểm biên dịch sang lúc chạy và sự phụ thuộc có thể ẩn trong siêu dữ liệu/chuỗi.", explanation: "Đúng. Tính linh hoạt đổi lấy một phần độ an toàn và khả năng nhìn thấy quan hệ khi tái cấu trúc."}
      - {id: B, answer: "JVM không còn garbage collection.", explanation: "Sai. Reflection không tắt GC."}
      - {id: C, answer: "Mọi lời gọi phản chiếu tự bỏ qua kiểm soát truy cập.", explanation: "Sai. Kiểm soát truy cập vẫn tồn tại."}
      - {id: D, answer: "Đối tượng Class không còn dùng được để kiểm tra kiểu lúc chạy.", explanation: "Sai. Class có nhiều API kiểm tra kiểu lúc chạy."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.LimitationsRisks/LimitationsRisks.md", anchor: "reflection-cost-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

