  - question: >-
      Vì sao varargs qua Method.invoke(...) có thể gây nhầm ngay cả khi method đích hoàn toàn hợp lệ? Bạn sẽ thiết kế hàm tiện ích gọi động thế nào để tránh lỗi này?
    answer: >-
      Có hai lớp varargs: method đích có thể nhận T..., đồng thời Method.invoke(...) bản thân nhận Object... arguments. Reflection nhìn varargs của method đích như tham số mảng ở vị trí cuối và không tự thực hiện mọi thao tác đóng gói giống cú pháp gọi Java trực tiếp. Với method chỉ nhận String..., String[] phải được truyền như một đối số phản chiếu duy nhất, đôi khi cần ép sang Object để trình biên dịch không bung mảng vào Object... bên ngoài. Hàm tiện ích nên đọc isVarArgs(), chuẩn hóa đối số theo chính sách rõ ràng và kiểm tra hình dạng cuối cùng trước khi gọi.
