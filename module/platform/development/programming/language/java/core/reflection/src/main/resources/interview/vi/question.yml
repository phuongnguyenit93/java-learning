  - question: >-
      Member, Executable, AccessibleObject và AnnotatedElement giúp xây mô hình tư duy chung cho Field, Method và Constructor như thế nào? Vì sao framework nên hiểu các khái niệm trừu tượng này thay vì viết ba luồng xử lý hoàn toàn tách biệt?
    answer: >-
      Member là hợp đồng chung cho Field, Method và Constructor về tên, class khai báo, modifier và trạng thái synthetic. Method và Constructor còn cùng kế thừa Executable, nơi gom siêu dữ liệu về tham số, ngoại lệ, varargs và khai báo generic. Field, Method và Constructor đều đi qua AccessibleObject cho mô hình kiểm tra/yêu cầu quyền truy cập phản chiếu; AccessibleObject đồng thời triển khai AnnotatedElement nên các đối tượng mô tả này có cách đọc annotation tương đối thống nhất. Nhờ các khái niệm trừu tượng chung, framework có thể chuẩn hóa các bước khám phá → đọc siêu dữ liệu → kiểm tra quyền trước khi tách sang thao tác riêng của Field, Method hoặc Constructor.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.ClassMetadata/ClassMetadata.md'
      anchor: 'member-abstraction-model'
