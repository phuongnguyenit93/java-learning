  - question: >-
      Khi dùng Field để đọc hoặc ghi trạng thái, framework phải tách discovery, receiver, value và access như thế nào? Những lỗi nào nên được xem là lỗi contract của adapter?
    answer: >-
      Trước hết framework resolve một Field descriptor theo phạm vi phù hợp, sau đó mới dùng descriptor trên receiver cụ thể. Instance field yêu cầu receiver tương thích với declaring class; static field không cần instance và thường truyền null. Giá trị ghi phải có kiểu phù hợp; primitive field cho phép một số unboxing/widening nhưng không tự parse hay chuyển đổi domain value. Sai receiver hoặc value thường dẫn tới IllegalArgumentException, còn member tồn tại nhưng không có reflective access dẫn tới IllegalAccessException. Vì vậy discovery thành công chưa chứng minh rằng thao tác get/set sẽ hợp lệ.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '3.Fields/Fields.md'
      anchor: 'field-read-write'
    apiRelated:
      controller: 'FieldReflectionController'
      methodSignature: 'inspectAndMutate()'

  - question: >-
      Tại sao code framework không nên coi mọi Field mà Reflection nhìn thấy là state có thể đọc/ghi tùy ý? Hãy liên hệ static, final, volatile, transient và synthetic field với policy của framework.
    answer: >-
      Reflection cung cấp metadata, còn framework phải tự định nghĩa field nào thuộc contract của mình. Static field là state của class nên mapper theo object thường bỏ qua; transient chỉ là metadata mà serializer có thể dùng theo policy riêng; volatile vẫn giữ semantics visibility của Java; synthetic field có thể là artifact compiler không thuộc domain model. Final thể hiện một ranh giới thiết kế và một số final field trên Java hiện đại không thể bị sửa bằng deep reflection. Cách an toàn là filter có chủ đích thay vì xử lý mọi declared field chỉ vì API trả chúng về.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '3.Fields/Fields.md'
      anchor: 'field-modifiers'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      Khi resolve Method bằng Reflection, vì sao framework không thể đưa arguments runtime vào rồi trông chờ getMethod/getDeclaredMethod làm overload resolution giống compiler?
    answer: >-
      Method lookup nhận tên và declared parameter types chính xác, nên int.class và Integer.class là hai signature khác nhau và lookup không tự boxing, widening hay chọn overload “gần nhất”. getMethod tìm public surface có thể gồm inherited instance methods, còn getDeclaredMethod chỉ nhìn declaration của class hiện tại với mọi visibility. Khi enumerate, compiler còn có thể tạo bridge/synthetic methods, vì vậy thứ tự hoặc “method đầu tiên cùng tên” không phải contract. Framework nên resolve signature theo rule rõ ràng rồi cache Method đã được validate.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '4.Methods/Methods.md'
      anchor: 'method-discovery'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      Sau khi đã có Method descriptor, Method.invoke(...) khác một direct call ở những trách nhiệm runtime nào?
    answer: >-
      Direct call được compiler kiểm tra target, signature và phần lớn conversion ở compile time; Method.invoke chuyển các kiểm tra đó sang runtime. Instance method cần receiver tương thích, static method có thể dùng null receiver, arguments phải đúng số lượng và có conversion Reflection cho phép. Primitive return được boxing và void cho kết quả null vì invoke trả Object. Nếu receiver hoặc argument sai, lỗi thường là IllegalArgumentException; nếu access không hợp lệ, IllegalAccessException xảy ra trước khi target method body chạy.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '4.Methods/Methods.md'
      anchor: 'method-invoke'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      InvocationTargetException cho bạn biết điều gì mà IllegalAccessException hoặc IllegalArgumentException không cho biết? Framework nên xử lý wrapper này như thế nào?
    answer: >-
      InvocationTargetException có nghĩa reflective protocol đã đi đủ xa để target method hoặc constructor thực sự chạy, và chính target code đã ném exception. Ngược lại, IllegalAccessException hay IllegalArgumentException thường báo lỗi trước khi body chạy, chẳng hạn access bị từ chối hoặc receiver/argument sai. Framework thường nên lấy getCause(), giữ nguyên hoặc map cause theo contract của lớp adapter, thay vì log wrapper rồi làm mất business failure thật. Sự phân biệt này giúp chẩn đoán “Reflection setup sai” khác với “business code đã chạy và thất bại”.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '4.Methods/Methods.md'
      anchor: 'invocation-exception'
    apiRelated:
      controller: 'MethodReflectionController'
      methodSignature: 'invoke()'

  - question: >-
      Vì sao varargs qua Method.invoke(...) có thể gây nhầm ngay cả khi target method hoàn toàn hợp lệ? Bạn sẽ thiết kế utility invocation thế nào để tránh lỗi này?
    answer: >-
      Có hai lớp varargs: target method có thể nhận T..., đồng thời Method.invoke(...) bản thân nhận Object... arguments. Reflection nhìn varargs target như parameter array ở vị trí cuối và không tự thực hiện mọi packing giống cú pháp gọi Java trực tiếp. Với method chỉ nhận String..., String[] phải được truyền như một reflective argument duy nhất, đôi khi cần cast sang Object để compiler không bung array vào Object... bên ngoài. Utility nên đọc isVarArgs(), normalize arguments theo policy rõ ràng và validate shape trước khi invoke.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '4.Methods/Methods.md'
      anchor: 'varargs-reflection'
