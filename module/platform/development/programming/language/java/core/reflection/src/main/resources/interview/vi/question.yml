  - question: >-
      Reflection và MethodHandle giải quyết các phần nào khác nhau của bài toán dynamic invocation? Khi nào MethodHandle là lựa chọn đáng cân nhắc?
    answer: >-
      Core Reflection mạnh ở discovery và metadata: tìm Method/Field/Constructor, đọc annotation, modifier, parameter và generic signature rồi có thể invoke qua descriptor. MethodHandle biểu diễn một callable target động với MethodType và cơ chế lookup/adaptation riêng, phù hợp hơn khi target đã được resolve và cần gọi lặp lại qua một type shape được kiểm soát. invokeExact yêu cầu call-site type khớp chính xác, còn invoke có thể thích nghi hơn; việc tạo handle vẫn chịu access rules của MethodHandles.Lookup. Không nên thay mọi Method.invoke bằng MethodHandle chỉ vì giả định nó luôn nhanh hơn; chọn abstraction theo use case và đo khi performance thật sự quan trọng.
