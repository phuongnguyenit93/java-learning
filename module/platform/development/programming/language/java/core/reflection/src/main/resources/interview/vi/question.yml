questions:
  - question: >-
      Hãy giải thích Reflection là gì, vấn đề nào khiến nó tồn tại và vì sao các framework tổng quát thường cần cơ chế này.
    answer: >-
      Reflection cho phép chương trình xem cấu trúc của code như dữ liệu ở runtime: từ Class<?> có thể khám phá Field, Method, Constructor và dùng các descriptor đó để đọc trạng thái, gọi hành vi hoặc tạo object. Nó hữu ích khi concrete type/member chưa thể biết ở compile time, chẳng hạn container DI, serializer, ORM, test runner hoặc router phải làm việc với các class do người dùng định nghĩa sau này. Nếu không có Reflection, framework thường phải yêu cầu đăng ký factory/adapter hoặc viết nhánh riêng cho từng type. Đổi lại, nhiều lỗi về tên, signature, access và argument chuyển từ compile time sang runtime, nên Reflection nên được giữ trong một ranh giới có kiểm soát.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Basic/Basic.md'
      anchor: 'reflection-model'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      Khi nào bạn sẽ chọn Reflection, và khi nào bạn sẽ chủ động tránh nó dù technically có thể dùng được?
    answer: >-
      Reflection hợp lý khi việc không biết trước cấu trúc ở compile time chính là requirement, ví dụ framework cần khám phá plugin, model, annotation hoặc handler ở runtime. Nếu type và hành vi đã biết rõ, direct call, interface, polymorphism, factory hoặc registry thường cho contract rõ hơn, compile-time safety tốt hơn và dễ refactor hơn. ServiceLoader, generated code hay annotation processing cũng có thể thay Reflection trong một số bài toán extensibility. Quyết định tốt không dựa trên câu hỏi “Reflection có làm được không?” mà dựa trên việc runtime discovery có tạo ra giá trị đủ lớn để trả chi phí về safety, coupling và vận hành hay không.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Basic/Basic.md'
      anchor: 'reflection-cost-boundary'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      Class<?> nên được hiểu như thế nào trong mental model của Reflection, và ba cách lấy Class bằng class literal, getClass() và Class.forName(...) khác nhau về ý nghĩa sử dụng ra sao?
    answer: >-
      Class<?> là object runtime đại diện cho một type mà JVM đã biết, chứ không phải source code của class đó. Type.class phù hợp khi type đã được tham chiếu trực tiếp trong source; object.getClass() phù hợp khi có một object và cần concrete runtime class của nó; Class.forName(...) phù hợp khi binary class name chỉ xuất hiện ở runtime từ cấu hình hoặc plugin. Class.forName(String) còn có thể kích hoạt class initialization, trong khi class literal và getClass() phục vụ mục đích khác. Sau khi có Class<?>, Reflection mới có điểm xuất phát để đọc metadata và tìm member.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Basic/Basic.md'
      anchor: 'class-object-entrypoints'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      Hãy giải thích cách dùng isInstance, isAssignableFrom, cast và asSubclass khi framework cần kiểm tra quan hệ type ở runtime. Vì sao direction của isAssignableFrom dễ gây lỗi?
    answer: >-
      isInstance(object) là phép kiểm tra kiểu động tương tự instanceof khi Class chỉ được biết ở runtime. Với A.isAssignableFrom(B), câu hỏi đúng là “một giá trị của B có thể gán vào biến kiểu A hay không?”, nên PaymentProcessor.class.isAssignableFrom(PaymentService.class) là true nếu PaymentService implements PaymentProcessor. cast(object) thực hiện checked cast bằng Class object, còn asSubclass(parentType) kiểm tra và thu hẹp chính Class object thành Class<? extends parentType>. Viết ngược direction của isAssignableFrom thường làm registry hoặc plugin validation chấp nhận/reject type sai dù tên API nghe có vẻ đối xứng.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.ClassMetadata/ClassMetadata.md'
      anchor: 'class-kind'
    apiRelated:
      controller: 'ClassMetadataController'
      methodSignature: 'inspectType()'

  - question: >-
      So sánh họ API getDeclaredXxx(...) và getXxx(...) khi khám phá member. Những khác biệt nào về inheritance khiến framework dễ chọn sai member?
    answer: >-
      getDeclaredXxx(...) nhìn các member được khai báo trực tiếp trên class hiện tại và có thể thấy mọi visibility, nhưng không tự lấy member inherited. Với Field và Method, getXxx(...) nhìn public surface và có thể gồm public member từ superclass hoặc interface hierarchy. Constructor là ngoại lệ vì constructor không được kế thừa: getConstructors() chỉ trả public constructor của chính class. Static method của interface cũng không được inherited bởi implementing class hoặc subinterface, nên muốn reflect nó phải lookup trên interface khai báo. Framework cần chọn rõ “declaration của class này” hay “public API surface” trước khi lookup.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.ClassMetadata/ClassMetadata.md'
      anchor: 'declared-vs-public-members'
    apiRelated:
