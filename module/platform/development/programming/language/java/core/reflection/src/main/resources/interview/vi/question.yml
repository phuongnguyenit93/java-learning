questions:
  - question: >-
      Hãy giải thích Reflection là gì, vấn đề nào khiến nó tồn tại và vì sao các framework tổng quát thường cần cơ chế này.
    answer: >-
      Reflection cho phép chương trình xem cấu trúc của mã như dữ liệu lúc chạy: từ Class<?> có thể khám phá Field, Method, Constructor và dùng các đối tượng mô tả đó để đọc trạng thái, gọi hành vi hoặc tạo đối tượng. Nó hữu ích khi kiểu/thành phần cụ thể chưa thể biết tại thời điểm biên dịch, chẳng hạn container DI, serializer, ORM, test runner hoặc router phải làm việc với các class do người dùng định nghĩa sau này. Nếu không có Reflection, framework thường phải yêu cầu đăng ký factory/adapter hoặc viết nhánh riêng cho từng kiểu. Đổi lại, nhiều lỗi về tên, chữ ký, quyền truy cập và đối số chuyển từ thời điểm biên dịch sang lúc chạy, nên Reflection nên được giữ trong một ranh giới có kiểm soát.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Basic/Basic.md'
      anchor: 'reflection-model'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      Khi nào bạn sẽ chọn Reflection, và khi nào bạn sẽ chủ động tránh nó dù về mặt kỹ thuật vẫn có thể dùng được?
    answer: >-
      Reflection hợp lý khi việc không biết trước cấu trúc tại thời điểm biên dịch chính là yêu cầu, ví dụ framework cần khám phá plugin, mô hình dữ liệu, annotation hoặc handler lúc chạy. Nếu kiểu và hành vi đã biết rõ, lời gọi trực tiếp, interface, đa hình, factory hoặc registry thường cho hợp đồng rõ hơn, độ an toàn lúc biên dịch tốt hơn và dễ tái cấu trúc hơn. ServiceLoader, mã được sinh tự động hay annotation processing cũng có thể thay Reflection trong một số bài toán mở rộng. Quyết định tốt không dựa trên câu hỏi “Reflection có làm được không?” mà dựa trên việc khám phá lúc chạy có tạo ra giá trị đủ lớn để trả chi phí về độ an toàn, sự phụ thuộc ẩn và vận hành hay không.
    aiGenerated: true
    reviewed: false
    readmeRelated:
