  - question: >-
      Một DI container hoặc object factory nên chọn Constructor thế nào khi concrete class chỉ được biết ở runtime? Vì sao giả định luôn có no-arg constructor là nguy hiểm?
    answer: >-
      Constructor không được kế thừa, nên framework phải inspect các constructor của chính class rồi áp dụng rule lựa chọn rõ ràng: annotation, một constructor duy nhất, signature mong muốn hoặc policy dependency resolution. getConstructor chỉ tìm public constructor, còn getDeclaredConstructor có thể tìm mọi visibility nhưng không bảo đảm quyền invoke. Lookup yêu cầu parameter types chính xác và không chạy overload resolution kiểu compiler. Java chỉ sinh default no-arg constructor khi source không khai báo constructor nào, vì vậy factory giả định getDeclaredConstructor() luôn tồn tại sẽ hỏng với rất nhiều class bình thường.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '5.Constructors/Constructors.md'
      anchor: 'constructor-discovery'
    apiRelated:
      controller: 'ConstructorReflectionController'
      methodSignature: 'construct()'

  - question: >-
      Hãy phân loại các failure mode khi gọi Constructor.newInstance(...). Làm sao biết lỗi thuộc discovery/access/invocation protocol hay do chính constructor body?
    answer: >-
      NoSuchMethodException thuộc giai đoạn discovery vì không có constructor đúng signature. IllegalAccessException cho biết descriptor tồn tại nhưng không được phép gọi; IllegalArgumentException thường chỉ ra arguments không phù hợp hoặc trường hợp Reflection cấm instantiate; InstantiationException có thể xuất hiện khi declaring class không thể được instantiate như abstract class. Nếu constructor body chạy rồi ném lỗi, Reflection bọc lỗi đó trong InvocationTargetException. Class initialization cũng có thể gây ExceptionInInitializerError trước hoặc trong quá trình tạo object, nên framework nên báo stage và cause thay vì gom tất cả thành một lỗi “reflection failed”.
    aiGenerated: true
    reviewed: false
