      Proxy.newProxyInstance tạo một class lúc chạy triển khai các interface đã cho; khi bên gọi gọi method qua interface, proxy được sinh tự động chuyển lời gọi thành Method + mảng đối số rồi gọi InvocationHandler.invoke(proxy, method, args). Với method không tham số, args có thể là null. Handler có thể thực hiện ghi log/kiểm tra quyền/đo lường hoặc ủy quyền tới đối tượng đích, thường bằng Method.invoke và lấy ngoại lệ gốc khỏi InvocationTargetException khi cần. Ba method public không final equals, hashCode và toString của Object cũng đi qua handler, với Method có class khai báo là Object. Nếu handler đơn giản gọi lại method trên chính proxy có thể gây đệ quy vô hạn; nếu ủy quyền mù sang đối tượng đích có thể phá ngữ nghĩa equals/hashCode, nên handler phải định nghĩa hợp đồng cho ba method này có chủ đích.
