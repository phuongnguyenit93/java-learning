  - question: >-
      Nếu getDeclaredMethod(...) có thể tìm thấy private method, tại sao vẫn nói Reflection tôn trọng access control? Hãy phân biệt discovery với quyền sử dụng member.
    answer: >-
      Discovery chỉ tạo descriptor mô tả member; nó không cấp quyền đọc, ghi hoặc invoke. Khi dùng Field, Method hoặc Constructor, JVM vẫn áp dụng reflective access checks dựa trên caller, visibility và module boundary. canAccess(...) cho biết member hiện có thể được caller sử dụng với receiver phù hợp hay không. Vì vậy “Reflection thấy private” không đồng nghĩa “private đã thành public”; deep reflection chỉ hoạt động khi runtime cho phép suppress một phần access checks.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '6.AccessControl/AccessControl.md'
      anchor: 'language-vs-reflective-access'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      Giải thích quan hệ giữa trySetAccessible/setAccessible và JPMS exports/opens. Vì sao một package exported chưa chắc cho phép deep reflection?
    answer: >-
      trySetAccessible() cố bật suppression và trả false nếu không được phép; setAccessible(true) yêu cầu cùng mục tiêu nhưng có thể ném InaccessibleObjectException. Trong named modules, exports chủ yếu cho module khác sử dụng public API của package, còn opens cho phép deep reflection vào member không public của package đó. Vì vậy package exported nhưng không opened vẫn có thể chặn framework ở module khác khi framework cố mở private/package/protected internals. Unnamed module và open module có mức openness rộng hơn; trong thiết kế module rõ ràng, package cần reflective access nên được opens có chủ đích hoặc mở bằng cấu hình deployment phù hợp.
    aiGenerated: true
    reviewed: false
    readmeRelated:
