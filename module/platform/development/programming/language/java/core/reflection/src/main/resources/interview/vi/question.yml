  - question: >-
      Sau khi đã có đối tượng mô tả Method, Method.invoke(...) khác một lời gọi trực tiếp ở những trách nhiệm lúc chạy nào?
    answer: >-
      Lời gọi trực tiếp được trình biên dịch kiểm tra đối tượng đích, chữ ký và phần lớn chuyển đổi tại thời điểm biên dịch; Method.invoke chuyển các kiểm tra đó sang lúc chạy. Instance method cần đối tượng nhận tương thích, static method có thể dùng đối tượng nhận null, các đối số phải đúng số lượng và có chuyển đổi Reflection cho phép. Giá trị trả về primitive được boxing và void cho kết quả null vì invoke trả Object. Nếu đối tượng nhận hoặc đối số sai, lỗi thường là IllegalArgumentException; nếu quyền truy cập không hợp lệ, IllegalAccessException xảy ra trước khi thân method đích chạy.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '6.DynamicInvocation/DynamicInvocation.md'
      anchor: 'method-invoke'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      InvocationTargetException cho bạn biết điều gì mà IllegalAccessException hoặc IllegalArgumentException không cho biết? Framework nên xử lý lớp bọc này như thế nào?
    answer: >-
      InvocationTargetException có nghĩa cơ chế gọi phản chiếu đã đi đủ xa để method đích hoặc constructor thực sự chạy, và chính mã đích đã ném ngoại lệ. Ngược lại, IllegalAccessException hay IllegalArgumentException thường báo lỗi trước khi thân mã chạy, chẳng hạn quyền truy cập bị từ chối hoặc đối tượng nhận/đối số sai. Framework thường nên lấy getCause(), giữ nguyên hoặc ánh xạ nguyên nhân theo hợp đồng của lớp adapter, thay vì chỉ ghi log lớp bọc rồi làm mất lỗi nghiệp vụ thật. Sự phân biệt này giúp chẩn đoán “cấu hình Reflection sai” khác với “mã nghiệp vụ đã chạy và thất bại”.
    aiGenerated: true
    reviewed: false
