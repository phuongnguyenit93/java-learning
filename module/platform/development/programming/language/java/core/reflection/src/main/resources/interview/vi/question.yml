  - question: >-
      Hãy mô tả luồng bên trong JDK Dynamic Proxy từ lời gọi interface tới InvocationHandler, và giải thích vì sao equals, hashCode, toString cần policy riêng trong handler.
    answer: >-
      Proxy.newProxyInstance tạo một runtime class implements các interface đã cho; khi caller gọi interface method, generated proxy chuyển lời gọi thành Method + arguments rồi gọi InvocationHandler.invoke(proxy, method, args). Handler có thể thực hiện logging/security/metrics hoặc delegate tới target, thường bằng Method.invoke và unwrap InvocationTargetException khi cần. Ba public non-final method equals, hashCode và toString của Object cũng đi qua handler, với Method có declaring class là Object. Nếu handler đơn giản invoke lại method trên chính proxy có thể gây recursion; nếu delegate mù sang target có thể phá equality semantics, nên handler phải định nghĩa contract cho ba method này có chủ đích.
