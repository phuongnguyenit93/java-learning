  - question: >-
      Reflection ảnh hưởng maintainability và refactoring như thế nào, đặc biệt khi framework phụ thuộc vào private member hoặc tên member dạng string?
    answer: >-
      Direct symbol reference được compiler và IDE hiểu, còn string như "pay" hoặc "processedCount" trong reflection/config có thể trở thành hidden dependency mà rename tool không nhìn thấy. Deep reflection vào private member còn biến implementation detail thành một contract ngầm giữa framework và class sở hữu. Vì vậy thay đổi tên, package, visibility hoặc module openness có thể làm lỗi chỉ xuất hiện ở runtime. Thiết kế bền hơn thường gom Reflection vào adapter/metadata layer, resolve và validate sớm, ưu tiên typed registration/annotation/Class khi có thể và giữ business code dùng contract tĩnh rõ ràng.
