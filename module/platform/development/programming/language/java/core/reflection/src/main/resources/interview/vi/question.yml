  - question: >-
      Tại sao java.lang.reflect.Type tồn tại trong khi Java đã có Class<?>? Hãy giải thích vai trò của Class, ParameterizedType, TypeVariable, WildcardType và GenericArrayType.
    answer: >-
      Class<?> chỉ biểu diễn tốt raw/reifiable runtime type, còn generic declaration có thể chứa cấu trúc mà một Class không biểu diễn được. ParameterizedType mô tả dạng như List<String>; TypeVariable mô tả biến kiểu như T; WildcardType giữ upper/lower bounds của ? extends hoặc ? super; GenericArrayType mô tả array có component generic như T[]. Vì các thành phần này có thể lồng nhau, framework thường phải xử lý Type như một cây. Reflection đang đọc metadata của declaration chứ không tạo ra một hệ generic runtime mới.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '7.GenericTypeInspection/GenericTypeInspection.md'
      anchor: 'type-interface'
    apiRelated:
      controller: ''
