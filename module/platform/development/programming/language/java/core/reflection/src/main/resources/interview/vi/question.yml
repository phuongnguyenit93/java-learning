  - question: >-
      JDK Dynamic Proxy bị giới hạn bởi interface model như thế nào, và ranh giới giữa JDK Proxy với class-based proxy trong Spring AOP nên được giải thích ra sao?
    answer: >-
      JDK Proxy tạo implementation cho interface chứ không subclass concrete target, nên caller phải làm việc qua interface contract; static method, constructor, private state và lời gọi trực tiếp target không trở thành interception point. Trên Java 21, hidden hoặc sealed interface không hợp lệ làm proxy interface. Một final target class vẫn có thể nằm phía sau JDK Proxy nếu nó implements interface, vì target không bị subclass. Class-based proxy trong Spring AOP dùng cơ chế subclass nên final class/final method/private method tạo các giới hạn khác. Nếu ứng dụng chỉ cần một call tĩnh đã biết trước, direct call/decorator thường rõ hơn; proxy phù hợp khi cần runtime interception chung trên interface boundary.
