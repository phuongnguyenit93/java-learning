  - question: >-
      Một DI container hoặc factory tạo đối tượng nên chọn Constructor thế nào khi class cụ thể chỉ được biết lúc chạy? Vì sao giả định luôn có constructor không tham số là nguy hiểm?
    answer: >-
      Constructor không được kế thừa, nên framework phải kiểm tra các constructor của chính class rồi áp dụng quy tắc lựa chọn rõ ràng: annotation, một constructor duy nhất, chữ ký mong muốn hoặc chính sách phân giải dependency. getConstructor chỉ tìm constructor public, còn getDeclaredConstructor có thể tìm mọi mức truy cập nhưng không bảo đảm quyền gọi. Tra cứu yêu cầu kiểu tham số chính xác và không chạy cơ chế chọn overload kiểu trình biên dịch. Java chỉ sinh constructor mặc định không tham số khi mã nguồn không khai báo constructor nào, vì vậy factory giả định getDeclaredConstructor() luôn tồn tại sẽ hỏng với rất nhiều class bình thường.
    aiGenerated: true
    reviewed: false
    readmeRelated:
