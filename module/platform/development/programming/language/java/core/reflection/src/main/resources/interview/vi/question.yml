  - question: >-
      Khi dùng Field để đọc hoặc ghi trạng thái, framework phải tách việc khám phá, đối tượng nhận, giá trị và quyền truy cập như thế nào? Những lỗi nào nên được xem là lỗi hợp đồng của adapter?
    answer: >-
      Trước hết framework phân giải một đối tượng mô tả Field theo phạm vi phù hợp, sau đó mới dùng nó trên đối tượng nhận cụ thể. Instance field yêu cầu đối tượng nhận tương thích với class khai báo; static field không cần instance và thường truyền null. Giá trị ghi phải có kiểu phù hợp; field primitive cho phép một số unboxing/widening nhưng không tự phân tích hay chuyển đổi giá trị nghiệp vụ. Sai đối tượng nhận hoặc giá trị thường dẫn tới IllegalArgumentException, còn thành phần tồn tại nhưng không có quyền truy cập phản chiếu dẫn tới IllegalAccessException. Vì vậy khám phá thành công chưa chứng minh rằng thao tác get/set sẽ hợp lệ.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '6.DynamicInvocation/DynamicInvocation.md'
      anchor: 'field-read-write'
    apiRelated:
      controller: 'FieldReflectionController'
      methodSignature: 'inspectAndMutate()'

  - question: >-
      Tại sao mã framework không nên coi mọi Field mà Reflection nhìn thấy là trạng thái có thể đọc/ghi tùy ý? Hãy liên hệ static, final, volatile, transient và synthetic field với chính sách của framework.
    answer: >-
      Reflection cung cấp siêu dữ liệu, còn framework phải tự định nghĩa field nào thuộc hợp đồng của mình. Static field là trạng thái của class nên mapper theo đối tượng thường bỏ qua; transient chỉ là siêu dữ liệu mà serializer có thể dùng theo chính sách riêng; volatile vẫn giữ ngữ nghĩa khả năng nhìn thấy giữa các luồng của Java; synthetic field có thể là phần tử do trình biên dịch sinh ra và không thuộc mô hình miền. Final thể hiện một ranh giới thiết kế và một số final field trên Java hiện đại không thể bị sửa bằng Reflection truy cập sâu. Cách an toàn là lọc có chủ đích thay vì xử lý mọi field khai báo trực tiếp chỉ vì API trả chúng về.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '3.Fields/Fields.md'
      anchor: 'field-modifiers'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      Khi phân giải Method bằng Reflection, vì sao framework không thể đưa các đối số lúc chạy vào rồi trông chờ getMethod/getDeclaredMethod chọn overload giống trình biên dịch?
    answer: >-
      Việc tra cứu Method nhận tên và kiểu tham số đã khai báo chính xác, nên int.class và Integer.class là hai chữ ký khác nhau và tra cứu không tự boxing, widening hay chọn overload “gần nhất”. getMethod tìm bề mặt public có thể gồm instance method được kế thừa, còn getDeclaredMethod chỉ nhìn khai báo của class hiện tại với mọi mức truy cập. Khi liệt kê, trình biên dịch còn có thể tạo bridge/synthetic method, vì vậy thứ tự hoặc “method đầu tiên cùng tên” không phải hợp đồng. Framework nên phân giải chữ ký theo quy tắc rõ ràng rồi lưu đệm Method đã được kiểm tra.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '4.Methods/Methods.md'
