  - question: >-
      Những conversion nào Method.invoke thường hỗ trợ cho arguments, và vì sao code động vẫn nên validate arguments trước khi invoke?
    answer: >-
      Với primitive formal parameter, Reflection có thể unbox wrapper và thực hiện primitive widening hợp lệ; nó không tự làm narrowing tùy ý. Reference argument phải assignable tới formal type; null hợp lệ cho reference nhưng không thể unbox thành primitive. Reflection cũng không parse String thành number hay chạy lại overload resolution của compiler. Nếu input đến từ config, plugin hoặc dữ liệu deserialize, validate signature và value sớm giúp báo lỗi theo domain/framework thay vì để IllegalArgumentException xuất hiện muộn tại invocation boundary.
