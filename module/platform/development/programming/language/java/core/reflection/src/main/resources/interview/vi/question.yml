  - question: >-
      TypeVariable thuộc về declaration nào, và vì sao điều đó quan trọng khi generic type variable được khai báo trên class, method hoặc constructor?
    answer: >-
      TypeVariable không chỉ có tên và bounds; getGenericDeclaration() cho biết declaration sở hữu nó. Class generic trả TypeVariable từ Class.getTypeParameters(), còn generic Method hoặc Constructor có thể khai báo bộ type variables riêng qua Executable.getTypeParameters(). Hai biến cùng tên T ở hai declaration khác nhau không phải một identity chỉ vì text giống nhau. Framework resolve generic metadata cần giữ context của owner để tránh gán nhầm bounds hoặc mapping type argument giữa các declaration độc lập.
    aiGenerated: true
