  - question: >-
      Nói “Reflection chậm” có đủ để đánh giá thiết kế không? Framework nên cache gì và vẫn phải đo những gì?
    answer: >-
      Overhead của Reflection không chỉ nằm ở một lệnh invoke; repeated member lookup, scan metadata, generic/annotation parsing, access checks, argument packing/conversion và reflective dispatch đều có thể đóng góp. Framework thường resolve và validate metadata ở bootstrap/registration/lần dùng đầu rồi cache Method, Field, Constructor hoặc một invocation plan để tránh discovery lặp lại. Cache không xóa chi phí invocation hay hidden coupling, và JVM hiện đại đã tối ưu Core Reflection đáng kể. Nếu reflection nằm trên hot path, benchmark/profiler với workload thật mới cho biết có cần MethodHandle, generated code hay thiết kế khác hay không.
