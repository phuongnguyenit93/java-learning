  - question: >-
      Type erasure và generic signature metadata cùng tồn tại như thế nào? Vì sao Reflection có thể thấy List<String> ở một field nhưng thường không thể hỏi một List object bất kỳ xem nó là List<String> hay List<Long>?
    answer: >-
      Java thực thi generic code chủ yếu trên erased runtime types, nên nhiều object như Repository<Integer> và Repository<Long> có cùng runtime Class. Tuy nhiên compiler có thể ghi generic signature metadata trên declaration như field, method, superclass hoặc type parameter. Reflection đọc metadata đó bằng getGenericType(), getGenericReturnType(), getGenericSuperclass() và các API Type liên quan. Vì vậy field List<String> có thể giữ thông tin String trong signature, nhưng một object List bất kỳ không tự mang một runtime identity riêng cho type argument. Các pattern type token hoạt động khi một declaration cụ thể giữ lại signature, không phải vì erasure biến mất.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '7.GenericTypeInspection/GenericTypeInspection.md'
      anchor: 'erasure-vs-signature-metadata'
    apiRelated:
      controller: 'GenericReflectionController'
      methodSignature: 'genericSignature()'

  - question: >-
      Dynamic invocation qua Reflection khác ordinary Java call ở đâu, và Reflection có làm mất virtual dispatch của instance method không?
    answer: >-
      Ordinary call có compiler chọn overload, kiểm tra target/signature và chuẩn bị conversion trước runtime. Với Reflection, code phải resolve Method descriptor, kiểm tra access, receiver và arguments rồi invoke ở runtime, nên nhiều lỗi chỉ xuất hiện khi đường chạy đó được thực hiện. Tuy vậy Method.invoke trên instance method vẫn tuân theo dynamic method lookup: nếu descriptor đại diện method overridable và receiver là subclass có override, dispatch có thể đi tới override. Reflection thay đổi cách chọn descriptor và call boundary, không biến virtual dispatch thành static dispatch.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '8.DynamicInvocation/DynamicInvocation.md'
      anchor: 'reflective-dispatch'
    apiRelated:
