  - question: >-
      Class<?> nên được hiểu như thế nào trong mô hình tư duy của Reflection, và ba cách lấy Class bằng class literal, getClass() và Class.forName(...) khác nhau về ý nghĩa sử dụng ra sao?
    answer: >-
      Class<?> là đối tượng lúc chạy đại diện cho một kiểu mà JVM đã biết, chứ không phải mã nguồn của class đó. Type.class phù hợp khi kiểu đã được tham chiếu trực tiếp trong mã nguồn; object.getClass() phù hợp khi có một đối tượng và cần class cụ thể của nó lúc chạy; Class.forName(...) phù hợp khi tên nhị phân của class chỉ xuất hiện lúc chạy từ cấu hình hoặc plugin. Class.forName(String) còn có thể kích hoạt quá trình khởi tạo class, trong khi class literal và getClass() phục vụ mục đích khác. Sau khi có Class<?>, Reflection mới có điểm xuất phát để đọc siêu dữ liệu và tìm thành phần.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.ClassMetadata/ClassMetadata.md'
      anchor: 'class-object-entrypoints'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      Hãy giải thích cách dùng isInstance, isAssignableFrom, cast và asSubclass khi framework cần kiểm tra quan hệ kiểu lúc chạy. Vì sao chiều của isAssignableFrom dễ gây lỗi?
    answer: >-
      isInstance(object) là phép kiểm tra kiểu động tương tự instanceof khi Class chỉ được biết lúc chạy. Với A.isAssignableFrom(B), câu hỏi đúng là “một giá trị của B có thể gán vào biến kiểu A hay không?”, nên PaymentProcessor.class.isAssignableFrom(PaymentService.class) là true nếu PaymentService implements PaymentProcessor. cast(object) thực hiện ép kiểu có kiểm tra bằng đối tượng Class, còn asSubclass(parentType) kiểm tra và thu hẹp chính đối tượng Class thành Class<? extends parentType>. Viết ngược chiều của isAssignableFrom thường làm registry hoặc bước kiểm tra plugin chấp nhận/từ chối sai kiểu dù tên API nghe có vẻ đối xứng.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.ClassMetadata/ClassMetadata.md'
      anchor: 'class-kind'
    apiRelated:
      controller: 'ClassMetadataController'
      methodSignature: 'inspectType()'

  - question: >-
      Khi một framework nhận Class<?> bất kỳ, vì sao nó cần phân biệt mảng, enum, record, kiểu sealed và annotation được giữ đến lúc chạy thay vì xử lý mọi kiểu theo cùng một cách?
    answer: >-
      Class<?> là cửa vào chung nhưng không phải mọi kiểu có cùng siêu dữ liệu có ý nghĩa. Mảng có kiểu phần tử; enum có các hằng enum; record có RecordComponent theo thứ tự record header; kiểu sealed có các kiểu con trực tiếp được phép. Framework nên phân loại kiểu bằng isArray/isEnum/isRecord/isSealed rồi dùng API tương ứng thay vì suy đoán từ field/method thông thường. Annotation là một chiều siêu dữ liệu khác: Reflection chỉ đọc được annotation còn tồn tại lúc chạy, điển hình với retention RUNTIME; retention SOURCE hoặc CLASS không tự xuất hiện qua các API lúc chạy. Vì vậy framework cần phân loại kiểu và hiểu chính sách siêu dữ liệu trước khi quyết định cách xử lý.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.ClassMetadata/ClassMetadata.md'
      anchor: 'specialized-type-metadata'
    apiRelated:
      controller: 'ClassMetadataController'
      methodSignature: 'inspectType()'

  - question: >-
      So sánh họ API getDeclaredXxx(...) và getXxx(...) khi khám phá thành phần. Những khác biệt nào về kế thừa khiến framework dễ chọn sai thành phần?
    answer: >-
      getDeclaredXxx(...) nhìn các thành phần được khai báo trực tiếp trên class hiện tại và có thể thấy mọi mức truy cập, nhưng không tự lấy thành phần được kế thừa. Với Field và Method, getXxx(...) nhìn bề mặt public và có thể gồm thành phần public từ superclass hoặc hệ phân cấp interface. Constructor là ngoại lệ vì constructor không được kế thừa: getConstructors() chỉ trả constructor public của chính class. Static method của interface cũng không được kế thừa bởi class triển khai hoặc subinterface, nên muốn dùng Reflection với nó phải tra cứu trên interface khai báo. Framework cần chọn rõ “khai báo của class này” hay “bề mặt API public” trước khi tra cứu.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.ClassMetadata/ClassMetadata.md'
      anchor: 'declared-vs-public-members'
