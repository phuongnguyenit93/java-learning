  - question: >-
      Is saying “Reflection is slow” sufficient design reasoning? What should a framework cache, and what still needs measurement?
    answer: >-
      Reflection overhead is not one single invoke cost; repeated member lookup, metadata scanning, generic or annotation parsing, access checks, argument packing/conversion, and reflective dispatch can all contribute. Frameworks commonly resolve and validate metadata during bootstrap, registration, or first use and then cache Method, Field, Constructor, or a prepared invocation plan to avoid repeating discovery work. Caching does not remove invocation cost or hidden coupling, and modern JVMs have significantly optimized Core Reflection. If reflective work sits on a hot path, benchmarks and profiling on the real workload should determine whether MethodHandle, generated code, or another design is justified.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '10.LimitationsRisks/LimitationsRisks.md'
      anchor: 'reflection-performance'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      How does Reflection affect maintainability and refactoring, especially when a framework depends on private members or member names stored as strings?
    answer: >-
      Compilers and IDEs understand direct symbol references, while a string such as "pay" or "processedCount" in reflective code or configuration can become a hidden dependency that rename tools do not see. Deep reflection into private members also turns implementation details into an implicit contract between a framework and the owning class. Renaming a member, moving a package, changing visibility, or tightening module openness can therefore fail only at runtime. More maintainable designs centralize Reflection in an adapter or metadata layer, resolve and validate early, prefer typed registration, annotations, or Class values over raw strings where possible, and keep business code on explicit static contracts.
    aiGenerated: true
    reviewed: false
    readmeRelated:
