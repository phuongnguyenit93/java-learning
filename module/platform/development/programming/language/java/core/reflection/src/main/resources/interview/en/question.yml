      anchor: 'reflective-dispatch'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      Which argument conversions does Method.invoke generally support, and why should dynamic code still validate arguments before invocation?
    answer: >-
      For a primitive formal parameter, Reflection can unbox wrapper values and perform valid primitive widening; it does not perform arbitrary narrowing. A reference argument must be assignable to the formal reference type, and null is valid for a reference but cannot be unboxed to a primitive. Reflection also does not parse a String into a number or rerun the compiler's overload-resolution algorithm. If input comes from configuration, plugins, or deserialized data, validating the resolved signature and values early allows the framework to report a meaningful contract error instead of exposing a late IllegalArgumentException at the invocation boundary.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '6.DynamicInvocation/DynamicInvocation.md'
      anchor: 'argument-conversion'
    apiRelated:
