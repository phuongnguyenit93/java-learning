  - question: >-
      Why can an application that uses Reflection correctly on the JVM still fail when built as a native image? What problem does reachability metadata solve?
    answer: >-
      A normal JVM can decide at runtime which class or member is needed and then discover it reflectively. A native-image closed-world analysis needs to know at build time which code and metadata must remain in the executable, so targets referenced only through runtime strings or configuration may not be discovered by static analysis. Reachability metadata or hints declare the classes, members, proxies, and other dynamic features that must be retained. This is an AOT/deployment boundary rather than a change to Reflection semantics on the JVM, but frameworks that rely on dynamic discovery must provide enough metadata for the native executable to preserve those targets.
    aiGenerated: true
    reviewed: false
    readmeRelated:
