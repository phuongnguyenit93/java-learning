questions:
  - question: >-
      Explain what Reflection is, what problem led to it, and why general-purpose frameworks often need it.
    answer: >-
      Reflection lets a program treat code structure as runtime data: starting from Class<?>, it can discover Field, Method, and Constructor descriptors and use them to read state, invoke behavior, or create objects. It is useful when the concrete type or member cannot be known at compile time, such as when a DI container, serializer, ORM, test runner, or router must work with classes defined later by application code. Without Reflection, a framework often needs explicit factory/adapter registration or a separate branch for every supported type. The trade-off is that many name, signature, access, and argument errors move from compile time to runtime, so reflective behavior should stay inside a controlled boundary.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Basic/Basic.md'
      anchor: 'reflection-model'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      When would you choose Reflection, and when would you deliberately avoid it even though it could technically solve the problem?
    answer: >-
      Reflection is appropriate when not knowing the structure at compile time is itself a requirement, for example when a framework discovers plugins, models, annotations, or handlers at runtime. If the type and behavior are already known, direct calls, interfaces, polymorphism, factories, or registries usually provide clearer contracts, stronger compile-time safety, and easier refactoring. ServiceLoader, generated code, or annotation processing can also replace Reflection in some extensibility scenarios. The design question is therefore not merely “can Reflection do this?”, but whether runtime discovery creates enough value to justify the safety, coupling, and operational costs.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '10.LimitationsRisks/LimitationsRisks.md'
      anchor: 'reflection-cost-boundary'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      How should Class<?> be understood in Reflection's mental model, and how do class literals, getClass(), and Class.forName(...) differ in intent?
    answer: >-
      Class<?> is a runtime object representing a type known to the JVM; it is not the source code of that class. Type.class fits when source code already names the type, object.getClass() fits when code has an object and needs its concrete runtime class, and Class.forName(...) fits when only a binary class name is available at runtime from configuration or a plugin. Class.forName(String) may also trigger class initialization, which gives it different side effects from the other entry points. Once code has a Class<?>, it has the starting point for inspecting metadata and discovering members.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.ClassMetadata/ClassMetadata.md'
      anchor: 'class-object-entrypoints'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      Explain how isInstance, isAssignableFrom, cast, and asSubclass help a framework validate runtime type relationships. Why is the direction of isAssignableFrom easy to get wrong?
    answer: >-
      isInstance(object) is a dynamic type check similar to instanceof when the Class is only known at runtime. For A.isAssignableFrom(B), the correct reading is “can a value of B be assigned to a variable of type A?”, so PaymentProcessor.class.isAssignableFrom(PaymentService.class) is true when PaymentService implements PaymentProcessor. cast(object) performs a checked runtime cast through a Class object, while asSubclass(parentType) validates and narrows the Class object itself to Class<? extends parentType>. Reversing isAssignableFrom often causes registries or plugin validation to accept or reject the wrong type even though the API name sounds symmetric.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.ClassMetadata/ClassMetadata.md'
      anchor: 'class-kind'
    apiRelated:
      controller: 'ClassMetadataController'
      methodSignature: 'inspectType()'

  - question: >-
      When a framework receives an arbitrary Class<?>, why should it distinguish arrays, enums, records, sealed types, and runtime-retained annotations instead of treating every type the same way?
    answer: >-
      Class<?> is a common entry point, but different kinds of type expose specialized metadata. Arrays expose a component type; enums expose enum constants; records expose RecordComponent values in record-header order; sealed types expose permitted subclasses. A framework should classify the type with isArray/isEnum/isRecord/isSealed and use the matching APIs rather than infer those structures from ordinary fields or methods. Annotations add another metadata dimension: Reflection only reads annotations that survive to runtime, typically through RUNTIME retention; SOURCE- or CLASS-retained annotations do not automatically appear through runtime APIs. Correct processing therefore starts with type classification and metadata policy.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.ClassMetadata/ClassMetadata.md'
      anchor: 'specialized-type-metadata'
    apiRelated:
      controller: 'ClassMetadataController'
      methodSignature: 'inspectType()'

  - question: >-
      Compare the getDeclaredXxx(...) and getXxx(...) families for member discovery. Which inheritance differences commonly cause frameworks to select the wrong member?
    answer: >-
      getDeclaredXxx(...) looks at members declared directly on the current class and can expose any visibility, but it does not automatically include inherited members. For Field and Method, getXxx(...) represents the public surface and may include public members from superclasses or interface hierarchies. Constructors are different because constructors are never inherited: getConstructors() returns only public constructors declared by that class. Static interface methods are also not inherited by implementing classes or subinterfaces, so they must be reflected from the interface that declares them. A framework should first decide whether it wants the current declaration or the inherited public API surface.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.ClassMetadata/ClassMetadata.md'
      anchor: 'declared-vs-public-members'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      How do Member, Executable, AccessibleObject, and AnnotatedElement form a shared mental model for Field, Method, and Constructor, and why should framework code understand those abstractions?
    answer: >-
      Member is the common contract for Field, Method, and Constructor metadata such as name, declaring class, modifiers, and synthetic state. Method and Constructor additionally share Executable, which centralizes parameter, exception, varargs, and generic-declaration metadata. Field, Method, and Constructor participate in reflective access checks through AccessibleObject, which also implements AnnotatedElement and therefore provides a common annotation-inspection model. These shared abstractions let a framework standardize discovery → metadata inspection → access validation before branching into the operation specific to a field, method, or constructor.
    aiGenerated: true
    reviewed: false
    readmeRelated:
