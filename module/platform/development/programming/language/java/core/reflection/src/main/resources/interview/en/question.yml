  - question: >-
      Which parts of dynamic invocation are Reflection and MethodHandle designed to solve, and when is MethodHandle worth considering?
    answer: >-
      Core Reflection is centered on discovery and metadata: it can find Method, Field, and Constructor objects, inspect annotations, modifiers, parameters, and generic signatures, and then invoke through descriptors. MethodHandle represents a dynamic callable target with a MethodType and its own lookup/adaptation model, which can fit better after a target has been resolved and will be invoked repeatedly through a controlled type shape. invokeExact requires the call-site type to match exactly, while invoke can adapt more; creating a handle still follows MethodHandles.Lookup access rules. Replacing every Method.invoke simply because MethodHandle is assumed to be faster is poor reasoning; choose the abstraction for the use case and measure when performance actually matters.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '6.DynamicInvocation/DynamicInvocation.md'
      anchor: 'method-handle-boundary'
