  - question: >-
      How can type erasure and generic signature metadata both be true? Why can Reflection inspect List<String> on a field but usually cannot ask an arbitrary List object whether it is List<String> or List<Long>?
    answer: >-
      Java executes generic code mostly through erased runtime types, so objects such as Repository<Integer> and Repository<Long> normally share the same runtime Class. The compiler can still record generic signature metadata on declarations such as fields, methods, superclasses, and type parameters. Reflection reads that metadata through getGenericType(), getGenericReturnType(), getGenericSuperclass(), and related Type APIs. A field declared as List<String> can therefore preserve String in its signature, while an arbitrary List object does not automatically carry a distinct runtime identity for its type argument. Type-token patterns work when a specific declaration preserves a signature, not because erasure has disappeared.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '8.GenericTypeInspection/GenericTypeInspection.md'
      anchor: 'erasure-vs-signature-metadata'
