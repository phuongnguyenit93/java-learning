  - question: >-
      Once a Method descriptor has been resolved, which runtime responsibilities make Method.invoke(...) different from a direct Java call?
    answer: >-
      A direct call lets the compiler validate the target, signature, and many conversions at compile time; Method.invoke moves those checks to runtime. An instance method needs a compatible receiver, a static method can use a null receiver, and arguments must have the required count and supported conversions. Primitive returns are boxed and a void method produces null because invoke returns Object. An invalid receiver or argument normally causes IllegalArgumentException, while insufficient reflective access causes IllegalAccessException before the target method body executes.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '6.DynamicInvocation/DynamicInvocation.md'
      anchor: 'method-invoke'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      What does InvocationTargetException tell you that IllegalAccessException or IllegalArgumentException does not, and how should a framework handle that wrapper?
    answer: >-
      InvocationTargetException means the reflective protocol got far enough for the target method or constructor to actually execute and the target code threw an exception. IllegalAccessException or IllegalArgumentException usually indicates a failure before the body ran, such as denied access or an invalid receiver or argument. Framework code normally inspects getCause() and either preserves or maps that cause according to the adapter's contract instead of logging only the wrapper and hiding the real business failure. This distinction separates “the reflection setup is invalid” from “the target code ran and failed”.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '6.DynamicInvocation/DynamicInvocation.md'
      anchor: 'invocation-exception'
    apiRelated:
      controller: 'MethodReflectionController'
      methodSignature: 'invoke()'

  - question: >-
      Why can varargs be confusing through Method.invoke(...) even when the target method itself is valid, and how would you design an invocation utility to avoid that trap?
    answer: >-
      There are two varargs layers: the target method may accept T..., and Method.invoke(...) itself accepts Object... arguments. Reflection represents the target's varargs parameter as an array and does not reproduce every compiler packing decision from an ordinary Java call. For a method that accepts only String..., the String[] must be passed as one reflective argument, sometimes with an Object cast so the outer Object... call does not spread the array. A utility should inspect isVarArgs(), normalize arguments according to an explicit policy, and validate the final argument shape before invocation.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '6.DynamicInvocation/DynamicInvocation.md'
      anchor: 'varargs-reflection'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      How should a DI container or object factory select a Constructor when the concrete class is only known at runtime, and why is assuming a no-argument constructor unsafe?
    answer: >-
      Constructors are not inherited, so the framework must inspect constructors declared by the actual class and apply a clear selection rule such as an annotation, a single-constructor rule, an expected signature, or dependency-resolution policy. getConstructor finds only public constructors, while getDeclaredConstructor can find any visibility but does not guarantee permission to invoke it. Lookup requires exact parameter types and does not perform compiler-style overload resolution. Java generates a default no-argument constructor only when source declares no constructor at all, so a factory that always assumes getDeclaredConstructor() exists will fail for many ordinary classes.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '5.Constructors/Constructors.md'
      anchor: 'constructor-discovery'
    apiRelated:
      controller: 'ConstructorReflectionController'
      methodSignature: 'construct()'

  - question: >-
      Classify the main failure modes of Constructor.newInstance(...). How can you tell whether the problem belongs to discovery/access/invocation protocol or to the constructor body itself?
    answer: >-
      NoSuchMethodException belongs to discovery because no constructor matches the requested signature. IllegalAccessException means the descriptor exists but cannot be invoked; IllegalArgumentException usually indicates incompatible arguments or a case Reflection forbids; InstantiationException can occur when the declaring class cannot be instantiated, such as an abstract class. If the constructor body runs and throws, Reflection reports that failure through InvocationTargetException. Class initialization can also fail with ExceptionInInitializerError, so good framework diagnostics should report the stage and underlying cause instead of collapsing everything into “reflection failed”.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '6.DynamicInvocation/DynamicInvocation.md'
      anchor: 'constructor-reflection-failure'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      If getDeclaredMethod(...) can discover a private method, why is it still correct to say that Reflection respects access control? Distinguish discovery from permission to use a member.
    answer: >-
      Discovery only creates a descriptor describing the member; it does not grant permission to read, write, or invoke that member. When Field, Method, or Constructor is used, the JVM still performs reflective access checks based on the caller, visibility, and module boundary. canAccess(...) reports whether the current caller can use the reflected member with the supplied receiver. Therefore “Reflection can see private” does not mean “private became public”; deep reflection works only when the runtime permits suppression of some access checks.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '7.AccessControl/AccessControl.md'
      anchor: 'language-vs-reflective-access'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      Explain the relationship between trySetAccessible/setAccessible and JPMS exports/opens. Why does an exported package not necessarily permit deep reflection?
    answer: >-
      trySetAccessible() attempts to enable access-check suppression and returns false if the boundary does not allow it; setAccessible(true) requests the same outcome but may throw InaccessibleObjectException. In named modules, exports primarily allows other modules to use a package's public API, while opens permits deep reflection into non-public members of that package. An exported but unopened package can therefore still block another module from forcing access to private, package-private, or protected internals. Unnamed modules and open modules are more permissive; in an explicit module design, packages that require framework reflection should be opened deliberately or through appropriate deployment configuration.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '7.AccessControl/AccessControl.md'
      anchor: 'strong-encapsulation-boundary'
    apiRelated:
      controller: 'AccessReflectionController'
      methodSignature: 'accessChecks()'

  - question: >-
      Why does java.lang.reflect.Type exist when Java already has Class<?>? Explain the roles of Class, ParameterizedType, TypeVariable, WildcardType, and GenericArrayType.
    answer: >-
      Class<?> represents types for which the JVM provides a direct Class object, such as String, raw List, int, or String[]. A generic declaration may contain structure that a single Class cannot express. ParameterizedType represents forms such as List<String>; TypeVariable represents a variable such as T; WildcardType carries the upper or lower bounds of ? extends or ? super; and GenericArrayType represents an array whose component is generic, such as T[]. These pieces can nest, so framework code often has to process Type as a tree. Reflection is reading declaration metadata, not creating a new runtime generic type system.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '8.GenericTypeInspection/GenericTypeInspection.md'
      anchor: 'type-interface'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: >-
      Which declaration owns a TypeVariable, and why does that matter when type variables may be declared by a class, method, or constructor?
    answer: >-
      A TypeVariable has more than a name and bounds; getGenericDeclaration() identifies the declaration that owns it. A generic class exposes variables through Class.getTypeParameters(), while a generic Method or Constructor may declare its own variables through Executable.getTypeParameters(). Two variables both named T in different declarations are not the same identity simply because their text matches. Generic-resolution code must preserve owner context so it does not apply bounds or type-argument mappings from one declaration to another unrelated declaration.
    aiGenerated: true
    reviewed: false
    readmeRelated:
