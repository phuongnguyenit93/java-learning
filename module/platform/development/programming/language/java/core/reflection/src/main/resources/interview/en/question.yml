  - question: >-
      When resolving a Method reflectively, why can a framework not simply provide runtime arguments and expect getMethod/getDeclaredMethod to perform overload resolution like the compiler?
    answer: >-
      Method lookup takes a name plus exact declared parameter types, so int.class and Integer.class describe different signatures and lookup does not automatically box, widen, or choose the “closest” overload. getMethod searches the public surface and may find inherited instance methods, while getDeclaredMethod searches only declarations on the current class with any visibility. Enumeration may also expose bridge or synthetic methods created by the compiler, so array order or “the first method with this name” is not a valid contract. A framework should resolve a signature by an explicit rule and then cache the validated Method.
    aiGenerated: true
    reviewed: false
    readmeRelated:
