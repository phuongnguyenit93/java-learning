  - question: >-
      How does dynamic invocation through Reflection differ from an ordinary Java call, and does Reflection remove normal virtual dispatch for instance methods?
    answer: >-
      An ordinary call lets the compiler choose an overload, validate the target and signature, and prepare conversions before runtime. With Reflection, code must resolve the Method descriptor, validate access, receiver, and arguments, and then invoke it at runtime, so many failures only appear when that path executes. Method.invoke on an instance method still follows normal dynamic method lookup: if the descriptor represents an overridable method and the receiver is a subclass with an override, dispatch may reach the override. Reflection changes descriptor selection and the call boundary; it does not turn virtual dispatch into static dispatch.
    aiGenerated: true
    reviewed: false
    readmeRelated:
