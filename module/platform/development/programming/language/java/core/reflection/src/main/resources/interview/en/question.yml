  - question: >-
      When using Field to read or write state, how should a framework separate discovery, receiver, value, and access concerns? Which failures indicate a broken adapter contract?
    answer: >-
      The framework first resolves a Field descriptor in the intended scope, then applies that descriptor to a concrete receiver. An instance field needs a receiver compatible with the declaring class, while a static field needs no instance and is normally accessed with null. A written value must also be compatible with the field type; primitive fields allow some unboxing and widening but do not perform arbitrary domain conversion. A bad receiver or incompatible value typically causes IllegalArgumentException, while a member that exists but is not reflectively accessible causes IllegalAccessException. Successful discovery therefore does not prove that get or set is valid.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '6.DynamicInvocation/DynamicInvocation.md'
      anchor: 'field-read-write'
    apiRelated:
      controller: 'FieldReflectionController'
      methodSignature: 'inspectAndMutate()'

  - question: >-
      Why should framework code not treat every Field visible through Reflection as state it may freely read or write? Relate static, final, volatile, transient, and synthetic fields to framework policy.
    answer: >-
      Reflection exposes metadata; the framework must still define which fields belong to its own contract. A static field is class state and is commonly excluded by object mappers; transient is metadata a serializer may interpret according to its policy; volatile keeps its normal Java visibility semantics; and a synthetic field may be a compiler artifact rather than part of the domain model. Final expresses an important design boundary, and some final fields on modern Java cannot be modified through deep reflection. A deliberate filter is therefore safer than processing every declared field merely because Reflection returns it.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '3.Fields/Fields.md'
      anchor: 'field-modifiers'
