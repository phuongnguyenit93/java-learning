  - question: >-
      Describe the internal call flow of a JDK Dynamic Proxy from an interface call to InvocationHandler, and explain why equals, hashCode, and toString need an explicit handler policy.
    answer: >-
      Proxy.newProxyInstance creates a runtime class that implements the requested interfaces; when a caller invokes an interface method, the generated proxy represents the call as a Method plus arguments and calls InvocationHandler.invoke(proxy, method, args). The handler can apply logging, security, or metrics and can delegate to a target, often through Method.invoke while unwrapping InvocationTargetException as needed. The three public non-final Object methods equals, hashCode, and toString are also dispatched to the handler, with Object as the Method's declaring class. Invoking the method again on the proxy can recurse forever, while blindly delegating to the target can break equality semantics, so the handler must define those methods deliberately.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '9.DynamicProxy/DynamicProxy.md'
      anchor: 'object-methods-proxy'
    apiRelated:
      controller: 'DynamicProxyController'
      methodSignature: 'intercept()'

  - question: >-
      How is JDK Dynamic Proxy constrained by its interface model, and how should the boundary between JDK Proxy and class-based proxying in Spring AOP be explained?
    answer: >-
      JDK Proxy generates an interface implementation rather than subclassing the concrete target, so callers must work through interface contracts; static methods, constructors, private state, and calls made directly on the target do not become interception points. On Java 21, hidden or sealed interfaces are not valid proxy interfaces. A final target class can still sit behind a JDK Proxy if it implements an interface because the target is not subclassed. Class-based proxying in Spring AOP relies on subclassing, so final classes, final methods, and private methods create a different set of limits. If an application only needs a known static call path, a direct call or explicit decorator is usually clearer; proxies are valuable when runtime interception is needed across an interface boundary.
    aiGenerated: true
    reviewed: false
