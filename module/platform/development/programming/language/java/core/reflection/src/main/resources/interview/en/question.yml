  - question: >-
      If you must decide whether to use Reflection in a new design, which questions should you answer before writing the reflective code?
    answer: >-
      First ask whether the type or structure is genuinely unknown until runtime. If it is already known at compile time, direct calls, interfaces, polymorphism, or factories are usually clearer. If runtime discovery is a real requirement, ask whether Reflection can be isolated behind a small infrastructure boundary, whether metadata can be resolved and validated early and cached when useful, whether callers can still see typed contracts, and whether access, module, and native-image constraints are handled deliberately. Reflection is strongest when dynamism provides real value and is contained; it is a design smell when it merely replaces a known static call with strings and invoke calls.
    aiGenerated: true
    reviewed: false
