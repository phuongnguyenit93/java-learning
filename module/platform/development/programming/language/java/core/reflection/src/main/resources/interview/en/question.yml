      methodSignature: ''

  - question: >-
      What problem does java.lang.reflect.Array solve when the component type is known only at runtime, and why is new Object[] not a general replacement for Array.newInstance(...)?
    answer: >-
      The syntax new T[length] requires T to be statically available in source, while framework code may only receive a Class<?> componentType at runtime. Array.newInstance(componentType, length) creates an array with the correct runtime component type, such as String[] or int[], even if the Java variable holding it is only Object. Array.get/Array.set and primitive helpers such as getInt/setInt then provide access without a statically known array type. new Object[] creates only Object[]; it is not String[], int[], or an array of another runtime-selected component type, so it cannot solve the general case.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '6.DynamicInvocation/DynamicInvocation.md'
      anchor: 'dynamic-array-reflection'
