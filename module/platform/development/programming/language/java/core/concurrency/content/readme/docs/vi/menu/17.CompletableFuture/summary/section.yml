  | Tên | CompletionStage và CompletableFuture khác Future truyền thống | completedFuture(), supplyAsync(), runAsync() | thenApply(), thenAccept(), thenRun() | thenApplyAsync() và ý nghĩa của executor | thenCompose() để nối các tác vụ bất đồng bộ | thenCombine() khi cần phối hợp hai kết quả | allOf(), anyOf() với nhiều tác vụ song song | applyToEither() và acceptEither() khi cạnh tranh kết quả | handle(), exceptionally(), whenComplete() | Khác biệt get() và join() khi xử lý lỗi | orTimeout(), completeOnTimeout() và fallback | Propagate lỗi trong chuỗi CompletableFuture | Chọn custom executor để quản lý tải và tránh tắc nghẽn | Giới hạn concurrency khi tạo hàng loạt future | Cancellation, interrupt và giới hạn của CompletableFuture | Fan-out / fan-in thực hành với nhiều tác vụ I/O | CompletableFuture chưa hoàn tất: complete(), completeExceptionally() và cuộc đua hoàn tất | completedStage(), failedFuture(), failedStage(): kết quả đã có và kết quả lỗi | getNow(): đọc kết quả không chặn và phân biệt null với chưa hoàn tất | exceptionallyCompose(): phục hồi bằng một CompletionStage bất đồng bộ | minimalCompletionStage() và copy(): giới hạn quyền hoàn tất future của bên nhận | delayedExecutor(): lên lịch khởi chạy mà không chặn luồng chờ | Callback không có hậu tố Async có thể chạy trên luồng hoàn tất hoặc luồng gọi | thenAcceptBoth() và runAfterBoth(): phối hợp hai nhánh không cần giá trị trả về | HttpClient.sendAsync(): ghép phản hồi HTTP, lỗi mạng và CompletableFuture | Thời hạn HTTP request so với timeout và cancellation của CompletableFuture | NIO CompletionHandler: chuyển callback completed()/failed() sang CompletionStage |
  | Vấn đề cần hiểu | Vì sao Future truyền thống thường cần get và CompletionStage có thể chain callback? | completedFuture có chạy một task trên thread khác không? | Ba phương thức nhận tham số callback gì và trả về loại stage nào? | thenApply và thenApplyAsync khác nhau ở bảo đảm scheduling nào? | thenApply trả nested stage khác thenCompose trả flattened stage ra sao? | Khi nào A/B độc lập đủ điều kiện dùng thenCombine? | Vì sao allOf không tự trả một List các kết quả đầu vào? | applyToEither và acceptEither khác nhau về callback và return type gì? | handle, exceptionally và whenComplete chạy ở những trạng thái nào? | Cùng một lỗi task thì get và join ném wrapper gì? | orTimeout và completeOnTimeout tác động future nào? | Mapper sau source exceptional có chạy không? | Vì sao blocking I/O trong commonPool có thể ảnh hưởng workload khác? | Batch window khác semaphore trước submit về mức concurrency thế nào? | cancel(true) của CompletableFuture và FutureTask khác nhau thế nào? | Lúc nào dùng all-required thay vì partial success cho ba nguồn I/O? | complete và completeExceptionally trả boolean thể hiện điều gì? | completedStage khác completedFuture về kiểu API ra sao? | Vì sao getNow(null) không tách pending khỏi completed-null? | exceptionallyCompose khác exceptionally ở return type như thế nào? | Chỉ trả interface CompletionStage có đủ ngăn client sửa source không? | delayedExecutor tạo task thực thi hay chỉ trả Executor trì hoãn? | Đăng ký thenApply trước complete thì thread nào thường chạy callback? | thenAcceptBoth nhận input nào mà runAfterBoth không nhận? | Vì sao HTTP 404 không nhất thiết là exceptional CompletableFuture? | HttpRequest.timeout bảo vệ thời gian nào ở tầng HTTP? | completed và failed nên hoàn tất Future bằng phương thức nào? |
  | Giá trị đối với OOP/module | Phân biệt hợp đồng kết quả với graph phụ thuộc | Khởi tạo stage phù hợp dữ liệu và kiểu tác vụ | Chọn callback theo return type và side effect | Điều khiển scheduling và policy executor | Diễn đạt dependency không chặn worker | Phối hợp hai kết quả độc lập an toàn | Thu kết quả N task theo completion semantics | Giải quyết cạnh tranh hai nguồn có lỗi | Phân biệt observer và handler phục hồi | Chọn API chờ với exception/interrupt đúng | Thiết kế timeout và giá trị dự phòng | Bảo toàn lỗi qua các dependent stages | Quản lý pool, queue và rejection | Giới hạn in-flight, queue và downstream | Điều khiển cancellation hợp tác và cleanup | Thiết kế fan-out/fan-in I/O có deadline | Kiểm soát completion race của promise | Trả stage đã có result hoặc failure | Đọc result không chặn và phân biệt null | Phục hồi lỗi bằng một stage async khác | Giới hạn quyền hoàn tất của API consumer | Lên lịch trì hoãn mà không block caller | Hiểu luồng chạy callback non-Async | Chạy Void actions sau hai nguồn thành công | Phân biệt HTTP status và lỗi transport | Quản lý timeout HTTP, Future và cancellation | Chuyển callback NIO có partial I/O thành stage |
