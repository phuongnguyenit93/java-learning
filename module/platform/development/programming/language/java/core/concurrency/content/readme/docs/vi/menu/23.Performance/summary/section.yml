version: 1
type: LEARNING_ROADMAP
title: "HIỆU NĂNG JAVA CONCURRENCY — MẠCH LIÊN KẾT BÀI HỌC"
roadmapHeading: "Mạch liên kết bài học"
roadmap:
  - id: performance-001
    order: 1
    title: "Latency, throughput, utilization và độ ổn định"
    description: "Thiết lập bốn đại lượng đánh giá concurrency và cách đo theo cùng ranh giới, nhất là queue wait, percentile, error rate và stability."
    transition:
      to: performance-002
      description: "Khi đã có bộ chỉ số, dùng Amdahl để lượng hóa giới hạn lý tưởng của việc thêm năng lực chạy song song."
  - id: performance-002
    order: 2
    title: "Amdahl's law và giới hạn speedup"
    description: "Ước tính cận trên speedup từ phần tuần tự và phân biệt cận lý tưởng với overhead khi chạy Java ExecutorService."
    transition:
      to: performance-003
      description: "Từ giới hạn lý thuyết chuyển sang thí nghiệm thay đổi thread count và đo tác động scheduling thực."
  - id: performance-003
    order: 3
    title: "Đo tác động của thread count và context switching"
    description: "Đo thực nghiệm số worker và context switching, tách overhead scheduling khỏi throughput, CPU saturation và blocking wait."
    transition:
      to: performance-004
      description: "Khi biết thread count liên quan scheduling, phân biệt CPU saturation thực với thời gian chờ I/O."
  - id: performance-004
    order: 4
    title: "CPU saturation so với I/O wait"
    description: "Chẩn đoán CPU saturation, thread CPU versus wall time và các kiểu I/O wait; dùng JVM+OS metrics để tránh tối ưu sai."
    transition:
      to: performance-005
      description: "Khi tách được CPU/I/O bottleneck, xem sự chậm trễ do lock contention và đánh đổi fairness."
  - id: performance-005
    order: 5
    title: "Lock contention, starvation và fairness trade-off"
    description: "Đánh giá chi phí tranh chấp lock, starvation và fair/nonfair tradeoff qua latency, throughput và cách giảm chia sẻ trạng thái."
    transition:
      to: performance-006
      description: "Từ tranh chấp trên lock chuyển sang tranh chấp tại hàng đợi executor và cơ chế rejection."
  - id: performance-006
    order: 6
    title: "Queue length, rejection và hiệu ứng quá tải"
    description: "Phân tích cơ chế nhận task của ThreadPoolExecutor, giới hạn queue và ý nghĩa từng rejection policy khi tải vượt capacity."
    transition:
      to: performance-007
      description: "Khi biết queue tác động latency, dùng Little's Law để liên hệ throughput, số việc đang chờ và thời gian lưu hệ thống."
  - id: performance-007
    order: 7
    title: "Little's Law để liên hệ lượng tác vụ, thời gian chờ và throughput"
    description: "Áp dụng Little's Law vào bounded executor và phân biệt queue wait, in-flight, throughput trong một cửa sổ ổn định."
    transition:
      to: performance-008
      description: "Sau các hàng đợi phần mềm, xem chi phí phần cứng khi những thread cập nhật dữ liệu khác nhau nhưng gần cùng cache line."
  - id: performance-008
    order: 8
    title: "False sharing và cache-line contention"
    description: "Giải thích false sharing theo cache-line coherence và giới hạn của benchmark, padding, @Contended trên các JVM/hardware khác nhau."
    transition:
      to: performance-009
      description: "Từ tranh chấp cache-line chuyển sang lựa chọn bộ đếm AtomicLong và LongAdder khi nhiều thread cùng cập nhật một giá trị."
  - id: performance-009
    order: 9
    title: "LongAdder so với AtomicLong dưới contention"
    description: "So sánh atomic single-value counter với striped adder, giới hạn sum/reset và chọn theo semantic của số liệu."
    transition:
      to: performance-010
      description: "Khi muốn tin kết luận AtomicLong và LongAdder nhanh hơn, cần benchmark JMH đúng workload và nhiều thread."
  - id: performance-010
    order: 10
    title: "Benchmark đáng tin cậy với JMH (công cụ ngoài JDK)"
    description: "Dùng JMH ngoài JDK để xây dựng benchmark concurrency có fork, warmup, Group, Blackhole và phân tích số liệu lặp lại."
    transition:
      to: performance-011
      description: "Từ công cụ JMH, đi sâu vào lý do cần warm-up JVM/JIT và chống những tối ưu hóa làm phép đo sai."
  - id: performance-011
    order: 11
    title: "Warming up JVM, JIT và tránh microbenchmark sai"
    description: "Phân tích warmup/JIT và optimizer để phân biệt cold-start, steady-state, loại bỏ phép đo sai do constant folding hoặc dead-code elimination."
    transition:
      to: performance-012
      description: "Sau khi đo đúng khả năng xử lý, thiết kế giới hạn admission và backpressure để bảo vệ hệ thống khi tải vượt capacity."
  - id: performance-012
    order: 12
    title: "Giới hạn tài nguyên và backpressure để bảo vệ hệ thống"
    description: "Thiết kế giới hạn tài nguyên và backpressure qua bounded executor, Semaphore, Flow demand, deadlines và load shedding."
    transition:
      to: performance-013
      description: "Kết thúc chương bằng một nút contention nhỏ nhưng phổ biến: sinh số ngẫu nhiên trong nhiều thread và giới hạn của ThreadLocalRandom."
  - id: performance-013
    order: 13
    title: "ThreadLocalRandom.current(): tránh tranh chấp, khả năng tái lập và giới hạn bảo mật"
    description: "Giảm contention khi nhiều worker sinh pseudo-random, phân biệt reproducible seeded tasks và yêu cầu mật mã của SecureRandom."
    transition: null
