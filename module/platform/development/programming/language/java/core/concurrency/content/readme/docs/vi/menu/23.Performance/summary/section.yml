  | Tên | Latency, throughput, utilization và độ ổn định | Amdahl's law và giới hạn speedup | Đo tác động của thread count và context switching | CPU saturation so với I/O wait | Lock contention, starvation và fairness trade-off | Queue length, rejection và hiệu ứng quá tải | Little's Law để liên hệ lượng tác vụ, thời gian chờ và throughput | False sharing và cache-line contention | LongAdder so với AtomicLong dưới contention | Benchmark đáng tin cậy với JMH (công cụ ngoài JDK) | Warming up JVM, JIT và tránh microbenchmark sai | Giới hạn tài nguyên và backpressure để bảo vệ hệ thống | ThreadLocalRandom.current(): tránh tranh chấp, khả năng tái lập và giới hạn bảo mật |
  | Vấn đề cần hiểu | Đo nhanh, nhiều, bận và ổn định theo cách nào? | Vì sao thêm worker không thể tạo speedup vô hạn? | Bao nhiêu thread là quá nhiều, đo bằng gì? | Chậm vì thiếu CPU hay vì chờ tài nguyên? | Công bằng có cải thiện throughput hay chỉ tail latency? | Điều gì xảy ra khi task đến nhanh hơn executor xử lý? | Số việc in-flight, throughput và thời gian liên hệ sao? | Vì sao các biến độc lập vẫn có thể chậm do cache? | Khi nào striped adder tốt hơn atomic counter? | Làm sao so benchmark đáng tin trên JVM? | Tại sao cùng code có thời gian chạy khác nhau? | Làm sao bảo vệ tài nguyên khi producer quá nhanh? | Sinh số ngẫu nhiên nhiều thread sao cho nhanh và đúng? |
  | Giá trị đối với OOP/module | Tạo baseline hiệu năng và cảnh báo quá tải | Không đầu tư sai vào parallelism kém hiệu quả | Chọn worker theo workload và CPU hữu dụng | Tránh tăng thread khi sai bottleneck | Giảm chờ lock và tránh starvation | Ngăn backlog vô hạn và chọn rejection minh bạch | Kiểm tra nhất quán chỉ số và sizing ban đầu | Giảm chi phí coherence ở workload ghi nóng | Đo đếm đúng và giảm CAS contention | Có bằng chứng tái lập trước khi tối ưu | Tránh benchmark sai vì JIT và warmup | Giữ hệ thống ổn định khi quá tải | Tránh seed contention, giữ test tái lập, bảo vệ token |
  | Tư duy hình thành | Đặt cùng ranh giới đo và cân bằng nhiều metric | Phân biệt giới hạn lý tưởng và kết quả đo thật | Thay một biến và quan sát toàn bộ chi phí | Bằng chứng từ nhiều tầng trước khi kết luận | Đo chi phí tiến triển của từng nhóm worker | Queue chỉ đệm burst, không tạo thêm capacity | Đặt ranh giới hệ thống trước khi dùng công thức | Xem layout và mẫu truy cập, không chỉ tên biến | Chọn theo hợp đồng đọc/ghi của dữ liệu | Thiết kế thí nghiệm và đọc sai số thay vì tin một số | Xem JVM phase là một phần của phép đo | Chỉ nhận khối lượng công việc có thể phục vụ | Tách hiệu năng PRNG, tái lập và an toàn mật mã |
