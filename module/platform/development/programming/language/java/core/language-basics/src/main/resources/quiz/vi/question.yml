      - {id: B, answer: "`byte`", explanation: "Sai. Kiểu của biến đầu vào không đồng nghĩa kiểu của kết quả phép toán vẫn là byte."}
      - {id: C, answer: "`short`", explanation: "Sai. Java không chọn short làm kiểu kết quả trung gian ở đây."}
