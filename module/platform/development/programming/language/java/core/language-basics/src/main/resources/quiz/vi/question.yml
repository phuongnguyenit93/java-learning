      - {id: C, answer: "Chỉ học cú pháp của if/for mà không cần hiểu hệ thống kiểu.", explanation: "Sai. Luồng điều khiển chỉ là một phần; mô hình giá trị, kiểu và lời gọi cũng là nền tảng."}
      - {id: D, answer: "Thay thế hoàn toàn các mô-đun OOP, Generics và Collections.", explanation: "Sai. Language Basics chuẩn bị nền tảng để hiểu các mô-đun đó, không thay thế chúng."}
