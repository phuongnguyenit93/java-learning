  - id: source-code-statement-expression
    question: "Trong `int total = price * quantity;`, nhận định nào đúng?"
    answers:
      - {id: A, answer: "`price * quantity` là một biểu thức; toàn bộ khai báo biến kết thúc bằng `;` là một câu lệnh.", explanation: "Đúng. Biểu thức tạo hoặc góp phần tạo giá trị, còn câu lệnh biểu diễn một bước hành động/điều khiển của chương trình."}
      - {id: B, answer: "`price * quantity` là một câu lệnh và toàn bộ dòng là một kiểu dữ liệu.", explanation: "Sai. Phép nhân là biểu thức; toàn bộ khai báo biến mới là câu lệnh."}
      - {id: C, answer: "Cả hai chỉ là chú thích mã nguồn nên không tham gia thực thi.", explanation: "Sai. Đây là mã Java thực thi bình thường, không phải comment."}
      - {id: D, answer: "Java không phân biệt biểu thức và câu lệnh.", explanation: "Sai. Đây là hai khái niệm cú pháp/ngữ nghĩa khác nhau và ảnh hưởng cách đọc mã."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.SourceCodeStructure/SourceCodeStructure.md", anchor: "statement-expression-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: primitive-reference-copy
    question: "Sau `User b = a`, Java sao chép thứ gì?"
    answers:
      - {id: A, answer: "Giá trị tham chiếu; `a` và `b` có thể cùng nhận diện một đối tượng `User`.", explanation: "Đúng. Phép gán tham chiếu sao chép giá trị tham chiếu, không sao chép toàn bộ đồ thị đối tượng."}
      - {id: B, answer: "Một bản sao sâu mới của đối tượng `User`.", explanation: "Sai. Phép gán tham chiếu không tự clone đối tượng."}
      - {id: C, answer: "Chỉ giá trị của một trường trong `User`.", explanation: "Sai. Java sao chép chính giá trị tham chiếu đang nằm trong biến `a`."}
      - {id: D, answer: "Địa chỉ bộ nhớ vật lý dưới dạng `long` nguyên thủy.", explanation: "Sai. Mô hình ngôn ngữ Java không cho lập trình viên thao tác tham chiếu như một địa chỉ nguyên thủy."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.PrimitiveReference/PrimitiveReference.md", anchor: "primitive-vs-reference-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: local-definite-assignment
    question: "Vì sao biến cục bộ `int x;` không được đọc trước khi trình biên dịch thấy nó đã được gán trên mọi đường thực thi liên quan?"
    answers:
      - {id: A, answer: "Vì mọi biến cục bộ đều ngầm `final`.", explanation: "Sai. `final` không phải lý do của quy tắc definite assignment."}
      - {id: B, answer: "Vì biến cục bộ chịu phân tích definite assignment lúc biên dịch và không nhận giá trị mặc định tự động.", explanation: "Đúng. Trường có giá trị mặc định trong quá trình khởi tạo; biến cục bộ thì phải được gán chắc chắn trước khi đọc."}
      - {id: C, answer: "Vì JVM khởi tạo mọi biến cục bộ thành null.", explanation: "Sai. Biến cục bộ không được cấp giá trị mặc định theo cách trường được cấp."}
      - {id: D, answer: "Vì chỉ phương thức `static` mới được khởi tạo biến cục bộ.", explanation: "Sai. Biến cục bộ có thể xuất hiện trong cả phương thức static và instance."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.VariablesScope/VariablesScope.md", anchor: "definite-assignment"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: wrapper-identity-cache
    question: "Khi hai giá trị cùng kiểu wrapper biểu diễn cùng một giá trị số, quy tắc an toàn nào đúng?"
    answers:
      - {id: A, answer: "Luôn dùng `==` vì autoboxing loại bỏ tính đồng nhất của đối tượng.", explanation: "Sai. `==` trên tham chiếu vẫn kiểm tra tính đồng nhất."}
      - {id: B, answer: "Chỉ cần so `hashCode()`.", explanation: "Sai. `hashCode()` không phải phép so sánh bằng trực tiếp."}
      - {id: C, answer: "Với cùng kiểu wrapper và cần so giá trị, dùng `equals` hoặc unbox; không dựa vào `==` vì cache không phải hợp đồng so sánh bằng theo giá trị.", explanation: "Đúng. Với wrapper khác kiểu, cần chuẩn hóa/chuyển đổi theo hợp đồng số mong muốn trước khi so sánh."}
      - {id: D, answer: "Wrapper không thể so sánh giá trị sau boxing.", explanation: "Sai. Có thể so sánh theo giá trị bằng hợp đồng phù hợp; vấn đề là không nhầm tính đồng nhất với so sánh bằng theo giá trị."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.WrapperBoxing/WrapperBoxing.md", anchor: "wrapper-caching"}
    apiRelated: {controller: "WrapperController", methodSignature: "wrapperIdentity()"}

  - id: wrapper-null-unboxing
    question: "Điều gì xảy ra khi `Integer count = null; int x = count;` chạy?"
