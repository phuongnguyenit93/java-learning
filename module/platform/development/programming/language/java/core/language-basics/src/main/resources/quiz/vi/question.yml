  - id: short-circuit-null-guard
    question: "Vì sao `value != null && value.isBlank()` không gọi `isBlank()` khi `value` là null?"
    answers:
      - {id: A, answer: "Vì `isBlank()` tự xử lý null.", explanation: "Sai. Lời gọi instance trên null vẫn có thể gây lỗi nếu nó thực sự được thực thi."}
      - {id: B, answer: "Vì `&&` chỉ đánh giá vế phải khi vế trái là true.", explanation: "Đúng. Đây là đánh giá ngắn mạch của toán tử logic."}
      - {id: C, answer: "Vì trình biên dịch đổi null thành chuỗi rỗng.", explanation: "Sai. Java không tự thay null bằng chuỗi rỗng."}
      - {id: D, answer: "Vì cả hai vế vẫn chạy nhưng `NullPointerException` bị bỏ qua.", explanation: "Sai. Vế phải không được thực thi khi vế trái đã là false."}
