  - id: language-basics-foundation
    question: "Mục tiêu quan trọng nhất của mô-đun Language Basics là gì?"
    answers:
      - {id: A, answer: "Học thuộc toàn bộ Java API trước khi học OOP.", explanation: "Sai. Mô-đun tập trung vào nền tảng của ngôn ngữ Java, không phải danh mục toàn bộ JDK."}
