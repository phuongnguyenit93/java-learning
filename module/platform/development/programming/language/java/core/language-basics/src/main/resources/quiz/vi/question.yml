    question: "Với các overload `f(long)`, `f(Integer)`, `f(int...)`, lời gọi `f(1)` chọn phương thức nào?"
    answers:
      - {id: A, answer: "`f(Integer)` vì boxing luôn được ưu tiên cao nhất.", explanation: "Sai. Boxing không được ưu tiên trước widening primitive ở giai đoạn sớm hơn."}
      - {id: B, answer: "`f(int...)` vì phần tử varargs có kiểu chính xác là int.", explanation: "Sai. Varargs được xét ở giai đoạn muộn hơn khi đã có overload áp dụng được trước đó."}
      - {id: C, answer: "Lời gọi luôn mơ hồ.", explanation: "Sai. Trường hợp này có lựa chọn xác định."}
      - {id: D, answer: "`f(long)` vì fixed-arity widening áp dụng được ở giai đoạn trước boxing và varargs.", explanation: "Đúng. Phân giải overload xét các giai đoạn khả dụng theo thứ tự."}
