      - {id: A, answer: "`x` trở thành 0.", explanation: "Sai. `null` không cung cấp được giá trị nguyên thủy cho unboxing."}
      - {id: B, answer: "Trình biên dịch bỏ qua phép gán.", explanation: "Sai. Mã có thể biên dịch nhưng lỗi xuất hiện khi unboxing ở lúc chạy."}
      - {id: C, answer: "`x` trở thành `Integer.MIN_VALUE`.", explanation: "Sai. Không có quy tắc thay `null` bằng giá trị số đặc biệt."}
      - {id: D, answer: "Unboxing cố lấy giá trị nguyên thủy từ reference null nên ném `NullPointerException`.", explanation: "Đúng. Đây là rủi ro riêng khi wrapper có thể là null."}
