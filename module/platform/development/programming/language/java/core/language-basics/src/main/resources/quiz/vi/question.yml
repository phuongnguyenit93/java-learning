    answers:
      - {id: A, answer: "Vì `Integer` không phải `Object`.", explanation: "Sai. Integer là subtype của Object; vấn đề nằm ở kiểu thực tế của đối tượng mảng."}
      - {id: B, answer: "Vì `Object[]` không thể chứa giá trị nào.", explanation: "Sai. Object[] có thể chứa reference tương thích; ở đây biến chỉ đang nhìn một đối tượng String[]."}
      - {id: C, answer: "Mảng là covariant, nhưng đối tượng mảng thực tế vẫn là `String[]`; JVM từ chối ghi Integer và ném `ArrayStoreException`.", explanation: "Đúng. Assignment qua góc nhìn Object[] hợp lệ lúc biên dịch nhưng store check xảy ra lúc chạy."}
      - {id: D, answer: "Sau phép gán, mảng đổi kiểu thực tế thành `Object[]`.", explanation: "Sai. Phép gán không thay đổi lớp thực tế của đối tượng mảng."}
    correctAnswerId: C
