  - question: "`var` có làm Java trở thành ngôn ngữ kiểu động không? Khi nào `var` giúp hoặc làm giảm khả năng đọc?"
    answer: "Không. `var` chỉ yêu cầu trình biên dịch suy ra kiểu tĩnh của biến cục bộ từ biểu thức khởi tạo; kiểu đó vẫn cố định cho kiểm tra lúc biên dịch. `var` hữu ích khi biểu thức khởi tạo đã làm kiểu rất rõ hoặc tên kiểu quá dài, nhưng ghi kiểu tường minh có thể tốt hơn khi kiểu là thông tin quan trọng mà người đọc cần thấy ngay."
    aiGenerated: true
