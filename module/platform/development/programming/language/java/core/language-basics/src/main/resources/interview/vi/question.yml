  - question: "Giải thích phạm vi theo luồng (flow scope) của pattern variable với `instanceof String s && ...` và một mệnh đề bảo vệ phủ định pattern."
    answer: "Pattern variable chỉ tồn tại ở nơi trình biên dịch có thể chứng minh pattern đã khớp. Ở vế phải của `&&`, điều đó được bảo đảm vì vế phải chỉ chạy sau khi vế trái true. Với `if (!(x instanceof String s)) return;`, luồng phía sau chỉ có thể đi tới khi pattern đã khớp, nên `s` dùng được sau mệnh đề bảo vệ. Phạm vi vì vậy phụ thuộc luồng điều khiển chứ không chỉ dấu ngoặc block."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "15.TypeSystemMentalModel/TypeSystemMentalModel.md", anchor: "instanceof-safe-cast"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao dùng `==` với wrapper như Integer có thể gây lỗi dù một số giá trị nhỏ đôi khi cho true?"
    answer: "`==` trên tham chiếu wrapper kiểm tra tính đồng nhất, không phải so sánh bằng theo giá trị. Một số đối tượng có thể được lấy từ bộ nhớ đệm nên tính đồng nhất tình cờ trùng ở một số giá trị, khiến ví dụ minh họa có vẻ đúng. Với hai wrapper cùng kiểu và cần so giá trị, dùng `equals` hoặc unbox; nếu so khác kiểu wrapper thì phải chuẩn hóa/chuyển đổi theo hợp đồng số mong muốn thay vì dựa vào bộ nhớ đệm."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.WrapperBoxing/WrapperBoxing.md", anchor: "wrapper-caching"}
    apiRelated: {controller: "WrapperController", methodSignature: "wrapperIdentity()"}

  - question: "Vì sao `byte + byte` có kiểu biểu thức là int và vì sao `b += 1` khác `b = b + 1`?"
    answer: "Binary numeric promotion thường nâng byte/short/char lên int trước phép toán, nên `b + 1` có kiểu int. Gán thông thường trở lại byte cần một chuyển đổi hợp lệ hoặc ép kiểu. Phép gán kết hợp (compound assignment) có quy tắc riêng bao gồm bước chuyển đổi về kiểu biến đích và chỉ đánh giá vế trái một lần, nên nó không chỉ là phép thay chữ cho `b = b + 1`."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.Operators/Operators.md", anchor: "numeric-promotion"}
    apiRelated: {controller: "TypeSystemController", methodSignature: "conversionContexts()"}

  - question: "Chuyển đổi mở rộng kiểu nguyên thủy (widening primitive conversion) có luôn giữ chính xác giá trị không? Ép kiểu thu hẹp (narrowing cast) bảo đảm điều gì và không bảo đảm điều gì?"
    answer: "Widening là một phân loại chuyển đổi của hệ thống kiểu, không phải lời hứa luôn giữ độ chính xác; ví dụ một long đủ lớn chuyển sang double có thể mất độ chính xác. Narrowing cast chỉ cho phép chuyển đổi tường minh; nó vẫn có thể cắt bớt, bao vòng hoặc mất thông tin khi giá trị không phù hợp kiểu đích. Ép kiểu không thay thế kiểm tra phạm vi theo nghiệp vụ."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.Casting/Casting.md", anchor: "primitive-casting"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Đánh giá ngắn mạch (short-circuit) của `&&`/`||` và toán tử điều kiện `?:` giống nhau ở điểm nào, và vì sao tác dụng phụ trong nhánh bị bỏ qua dễ gây lỗi?"
    answer: "Cả hai đều có đánh giá có điều kiện: một phần biểu thức có thể không chạy. `&&`/`||` quyết định có đánh giá toán hạng phải hay không; `?:` chỉ đánh giá một trong hai biểu thức kết quả. Nếu tính đúng đắn phụ thuộc vào tác dụng phụ trong phần có thể bị bỏ qua, mã trở nên khó đọc và mong manh; tác dụng phụ quan trọng thường nên được tách thành câu lệnh rõ ràng."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.Operators/Operators.md", anchor: "short-circuit-operators"}
    apiRelated: {controller: "OperatorController", methodSignature: "shortCircuit()"}

  - question: "Mô tả thứ tự thực thi của vòng `for` cổ điển và giải thích chính xác `continue` tác động tới biểu thức cập nhật thế nào."
    answer: "Vòng `for` cổ điển chạy phần khởi tạo một lần, sau đó lặp điều kiện → thân vòng lặp → cập nhật → điều kiện. `continue` không nhãn bỏ phần thân còn lại của lượt lặp hiện tại nhưng vẫn chuyển tới biểu thức cập nhật trước lần kiểm tra điều kiện tiếp theo. Điều này quan trọng nếu phần cập nhật có tác dụng phụ hoặc quyết định việc vòng lặp có kết thúc hay không."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.ControlFlow/ControlFlow.md", anchor: "loop-control"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Java 21 pattern switch mở rộng mô hình switch thế nào? `case null` và pattern variable có ý nghĩa gì?"
    answer: "Switch có thể phân loại giá trị chọn (selector) kiểu tham chiếu bằng type pattern, không chỉ các case hằng/enum/String. `case Integer i` vừa kiểm tra kiểu thực tế lúc chạy vừa tạo biến `i` có kiểu tĩnh Integer trong nhánh đó. `case null` làm cách xử lý null trở nên tường minh; không nên mặc định hiểu `default` là tự xử lý null. Pattern switch hữu ích khi nhiều nhánh cùng phân loại một giá trị chọn."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "15.TypeSystemMentalModel/TypeSystemMentalModel.md", anchor: "instanceof-safe-cast"}
    apiRelated: {controller: "ControlFlowController", methodSignature: "patternSwitch()"}

  - question: "Quy tắc về đường trả về của phương thức non-void liên hệ thế nào với definite assignment?"
    answer: "Cả hai đều là phân tích luồng điều khiển ở thời điểm biên dịch. Với biến cục bộ, trình biên dịch phải chứng minh biến đã được gán trước khi đọc trên mọi đường liên quan. Với phương thức non-void, trình biên dịch phải chứng minh không có đường thực thi bình thường có thể đi tới cuối phương thức mà thiếu giá trị trả về; đường kết thúc bằng `throw` không hoàn tất bình thường nên không cần return sau đó."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "11.Methods/Methods.md", anchor: "method-signature"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao Java định nghĩa thứ tự đánh giá đối số từ trái sang phải vẫn không phải lý do tốt để viết lời gọi chứa nhiều tác dụng phụ?"
    answer: "Thứ tự là xác định nên kết quả có thể dự đoán, nhưng một lời gọi như `f(i++, update(i))` buộc người đọc mô phỏng nhiều thay đổi trạng thái trong một biểu thức dày đặc. Điều đó làm ý đồ và việc rà soát khó hơn. Tách các giá trị trung gian thành câu lệnh thường rõ ràng hơn dù ngôn ngữ đã định nghĩa thứ tự đánh giá."
