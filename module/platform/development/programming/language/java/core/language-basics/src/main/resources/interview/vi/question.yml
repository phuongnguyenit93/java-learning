questions:
  - question: "Nếu phải giải thích Language Basics cho người mới, bạn sẽ nối các chủ đề trong mô-đun thành một mô hình tư duy như thế nào?"
    answer: "Bắt đầu từ cách một tệp Java được tổ chức; tiếp theo là mô hình giá trị nguyên thủy/tham chiếu, biến/phạm vi/vòng đời, null, kiểu bao và boxing/unboxing; sau đó nối sang biểu thức, toán tử, ép kiểu, luồng điều khiển và mảng; rồi đến phương thức, varargs, pass-by-value, package/import; cuối cùng phân biệt kiểu lúc biên dịch với kiểu lúc chạy và ghép toàn bộ thành một mô hình xuyên suốt. Chuỗi này giúp học OOP, Generics, Collections và các framework sau đó mà không chỉ ghi nhớ cú pháp rời rạc."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "16.LanguageBasicsSynthesis/LanguageBasicsSynthesis.md", anchor: "language-basics-synthesis"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Khi đọc một tệp Java nhỏ từ trên xuống, bạn nên nhận diện những lớp cấu trúc nào trước khi phân tích logic chi tiết?"
    answer: "Đọc từ ngoài vào trong: tệp mã nguồn → package/import → khai báo kiểu → thành viên → thân phương thức/constructor → câu lệnh và biểu thức. Sau đó nhận diện định danh, từ khóa, literal và chú thích. Bản đồ này giúp người mới biết mỗi đoạn mã nằm ở đâu trước khi suy luận về kiểu, giá trị hay luồng điều khiển."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.SourceCodeStructure/SourceCodeStructure.md", anchor: "source-file-type-structure"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Giải thích khác biệt giữa sao chép giá trị nguyên thủy và sao chép giá trị tham chiếu trong Java."
    answer: "Phép gán với primitive sao chép chính giá trị nguyên thủy. Phép gán với reference sao chép giá trị tham chiếu, vì vậy hai biến có thể cùng nhận diện một đối tượng; Java không tự sao chép đối tượng đó. Đây là nền tảng để hiểu hiện tượng nhiều tham chiếu cùng trỏ một đối tượng, thay đổi trạng thái đối tượng và pass-by-value."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.PrimitiveReference/PrimitiveReference.md", anchor: "primitive-vs-reference-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao trường có giá trị mặc định còn biến cục bộ phải thỏa definite assignment?"
    answer: "Trong quá trình khởi tạo đối tượng/lớp, trường được cấp giá trị mặc định theo quy tắc ngôn ngữ trước khi biểu thức khởi tạo tường minh chạy. Biến cục bộ thì không có cơ chế mặc định đó; trình biên dịch dùng phân tích definite assignment và chỉ cho đọc biến khi mọi đường thực thi liên quan đều bảo đảm biến đã được gán."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.VariablesScope/VariablesScope.md", anchor: "definite-assignment"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Mở rộng kiểu (widening), boxing, varargs và bước chọn phương thức cụ thể nhất tương tác thế nào trong overload resolution?"
    answer: "Trình biên dịch xét khả năng áp dụng của overload theo các giai đoạn có thứ tự. Các lời gọi có số lượng tham số cố định (fixed-arity) dùng chuyển đổi ở giai đoạn sớm được xét trước các giai đoạn boxing/varargs muộn hơn; sau khi xác định tập ứng viên trong một giai đoạn, trình biên dịch mới chọn phương thức cụ thể nhất. Kiểu thực tế của đối tượng nhận ở lúc chạy không làm overload resolution chạy lại."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "11.Methods/Methods.md", anchor: "overload-resolution-phases"}
    apiRelated: {controller: "OverloadResolutionController", methodSignature: "selectionMatrix()"}

  - question: "Chứng minh Java là pass-by-value dù phương thức được gọi có thể thay đổi một đối tượng mà bên gọi nhìn thấy."
    answer: "Tham số nhận một bản sao của giá trị tham chiếu. Hai tham chiếu sau đó có thể cùng nhận diện một đối tượng có thể thay đổi nên việc thay đổi trạng thái qua tham số được bên gọi quan sát. Nhưng nếu gán lại tham số sang đối tượng khác, biến của bên gọi không đổi. Chính sự khác nhau giữa thay đổi trạng thái đối tượng và gán lại tham số chứng minh Java vẫn là pass-by-value."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "13.PassByValue/PassByValue.md", anchor: "java-pass-by-value"}
    apiRelated: {controller: "PassByValueController", methodSignature: "mutateAndReassign()"}

  - question: "Vì sao mảng có tính hiệp biến (covariant) còn kiểu generic thường bất biến (invariant), và hậu quả an toàn của mảng là gì?"
    answer: "Java cho phép mảng của kiểu con được nhìn qua tham chiếu mảng của kiểu cha. Vì vậy trình biên dịch có thể chấp nhận một phép ghi qua góc nhìn tổng quát, còn JVM phải kiểm tra kiểu thành phần thực tế của mảng khi chạy; nếu không tương thích sẽ ném ArrayStoreException. Generics thường bất biến để chặn loại lỗi này sớm hơn ở lúc biên dịch."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.Arrays/Arrays.md", anchor: "array-covariance-risk"}
    apiRelated: {controller: "ArrayController", methodSignature: "covarianceFailure()"}

  - question: "Trong lời gọi phương thức Java thông thường, quyết định nào dựa vào kiểu lúc biên dịch và quyết định nào dựa vào kiểu lúc chạy?"
    answer: "Kiểu tĩnh quyết định thành viên nào khả dụng, overload nào được chọn và nhiều quy tắc gán/ép kiểu. Sau khi một chữ ký phương thức instance đã được chọn, lớp thực tế của đối tượng nhận quyết định thân override nào chạy. Trường và phương thức static không dùng cơ chế phân phối động (dynamic dispatch) theo cách phương thức instance đã override dùng."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "15.TypeSystemMentalModel/TypeSystemMentalModel.md", anchor: "compile-time-vs-runtime-type"}
    apiRelated: {controller: "TypeSystemController", methodSignature: "inspectRuntimeType(Object)"}

  - question: "Vì sao kiểu bao (wrapper) có thể gây NullPointerException trong một biểu thức nhìn giống phép toán số học bình thường?"
    answer: "Phép toán hoặc so sánh có thể kích hoạt unboxing ngầm. Nếu tham chiếu wrapper là null thì không có giá trị nguyên thủy để lấy ra, vì vậy NullPointerException xảy ra tại bước unboxing trước khi phép toán số học thật sự được thực hiện."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.WrapperBoxing/WrapperBoxing.md", anchor: "unboxing-null"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Một API nên quyết định giữa null, kết quả rỗng, ngoại lệ hay kiểu biểu diễn trạng thái vắng giá trị như Optional dựa trên điều gì?"
    answer: "Dựa trên ngữ nghĩa của hợp đồng: trạng thái vắng giá trị có phải trạng thái bình thường không, có khác một kết quả rỗng không, hay thực sự là tình huống lỗi? Điều quan trọng là chọn một biểu diễn nhất quán và tài liệu hóa rõ. Mục tiêu không phải cấm null máy móc mà làm trạng thái vắng giá trị có ý nghĩa và dễ dự đoán."
    aiGenerated: true
