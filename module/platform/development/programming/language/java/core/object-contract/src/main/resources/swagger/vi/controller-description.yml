EqualityController:
  description: |-
    <h2>Định danh và phép bằng nhau</h2>
    <p>Nhóm thí nghiệm giúp quan sát trực tiếp sự khác nhau giữa <strong>định danh tham chiếu</strong> và <strong>phép bằng nhau về mặt logic</strong>.</p>
    <p>Mục tiêu là nhìn thấy hai đối tượng có định danh khác nhau vẫn có thể bằng nhau theo quy tắc nghiệp vụ, thay vì chỉ ghi nhớ rằng <code>==</code> và <code>equals</code> khác nhau.</p>
  readmeRelated:
    file: 2.IdentityEquality/IdentityEquality.md
HashContractController:
  description: |-
    <h2>Quy ước giữa equals và hashCode</h2>
    <p>Nhóm thí nghiệm cho thấy <code>equals</code> và <code>hashCode</code> tạo thành một quy ước vận hành chung trong cấu trúc dữ liệu dựa trên mã băm.</p>
    <p>Hai endpoint tập trung vào hai dạng lỗi thực tế: hai đối tượng bằng nhau nhưng có mã băm khác nhau, và khóa bị thay đổi sau khi đã được đưa vào cấu trúc dữ liệu.</p>
    <p>Đây cũng là minh chứng trực tiếp cho ý chính của mô-đun: thư viện dựa vào các cam kết về hành vi của đối tượng dù trình biên dịch không thể chứng minh phần triển khai giữ đúng mọi quy tắc ngữ nghĩa.</p>
  readmeRelated:
    file: 5.EqualsHashCode/EqualsHashCode.md
OrderingController:
  description: |-
    <h2>Thứ tự sắp xếp</h2>
    <p>Nhóm thí nghiệm so sánh thứ tự tự nhiên qua <code>Comparable</code> với chính sách sắp xếp do đoạn mã sử dụng cung cấp qua <code>Comparator</code>.</p>
    <p>Đồng thời quan sát hệ quả khi quan hệ “bằng nhau theo thứ tự” (<code>compareTo == 0</code>) không trùng với phép bằng nhau về mặt logic.</p>
  readmeRelated:
    file: 8.Comparator/Comparator.md
