  - question: "Giả sử một kiểu nghiệp vụ vừa được dùng làm khóa HashMap, vừa nằm trong TreeSet, vừa xuất hiện trong log vận hành. Bạn sẽ kiểm tra những quy ước nào trước khi chấp nhận thiết kế?"
    answer: "Trước hết phải xác định ý nghĩa nghiệp vụ của định danh và phép bằng nhau, kiểm tra các quy tắc của equals và bảo đảm hai đối tượng bằng nhau luôn có cùng mã băm. Trạng thái tham gia equals/hashCode phải đủ ổn định khi đối tượng đang làm khóa. Tiếp theo cần quyết định kiểu dữ liệu có thật sự sở hữu một thứ tự tự nhiên hay nên để đoạn mã sử dụng cung cấp Comparator, rồi kiểm tra tính bắc cầu và chủ đích nhất quán/không nhất quán với equals. Cuối cùng, toString phải hữu ích cho chẩn đoán nhưng không làm lộ dữ liệu nhạy cảm hay bị nhầm thành định dạng lưu trữ. Mục tiêu không phải làm mọi quy ước giống nhau mà làm từng quy ước rõ ràng và có thể dự đoán với API sử dụng nó."
