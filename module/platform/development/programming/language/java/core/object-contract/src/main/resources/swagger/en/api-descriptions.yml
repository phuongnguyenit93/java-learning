HashContractController:
  brokenHashSetLookup():
    summary: HashSet lookup with a broken equals/hashCode contract
    description: |-
      Creates two keys for which `equals == true` but deliberately returns different hash codes, inserts one into a `HashSet`, and looks it up through the other logically equal key.
      The response turns an abstract contract violation into observable failure: the collection can miss a value that `equals` says is equal.
