  compareToEquals():
    summary: When compareTo and equals disagree
    description: |-
      Compares `BigDecimal("1.0")` with `BigDecimal("1.00")`: `equals` is false while `compareTo` is zero, then inserts both values into a `HashSet` and a `TreeSet`.
      The response demonstrates why hash-based and sorted collections can report different sizes when they use different notions of "same key".
