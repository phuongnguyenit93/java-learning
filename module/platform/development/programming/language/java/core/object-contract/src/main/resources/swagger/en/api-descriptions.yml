  mutableKey():
    summary: Mutating equality/hash state after insertion
    description: |-
      Inserts a mutable key into a `HashMap`, checks lookup before mutation, changes the field used by `equals/hashCode`, and checks again.
      The experiment shows why hash keys should keep equality/hash state stable; the post-mutation result is evidence from the current implementation, not a promise that every implementation must fail in exactly the same way.
