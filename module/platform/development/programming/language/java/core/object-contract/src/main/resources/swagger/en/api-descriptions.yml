OrderingController:
  naturalVsCustom():
    summary: Natural ordering versus a custom Comparator
    description: |-
      Uses the same `Person` list twice: `Collections.sort` applies the type's natural `Comparable` order by age, while `Comparator.comparing(Person::name)` applies caller-owned ordering by name.
      The two results make the design difference between type-owned and external ordering directly observable.
