  compareToEquals():
    summary: Khi compareTo và equals không nhất quán
    description: |-
      So sánh `BigDecimal("1.0")` với `BigDecimal("1.00")`: `equals` trả false nhưng `compareTo` trả 0, sau đó đưa cả hai vào `HashSet` và `TreeSet`.
      Kết quả cho thấy cấu trúc dựa trên mã băm và cấu trúc có thứ tự có thể có kích thước khác nhau khi phép bằng nhau và thứ tự xác định tính tương đương của khóa theo hai cách khác nhau.
