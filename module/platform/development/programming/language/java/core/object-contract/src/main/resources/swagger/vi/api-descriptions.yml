OrderingController:
  naturalVsCustom():
    summary: Thứ tự tự nhiên so với Comparator tùy chỉnh
    description: |-
      Dùng cùng một danh sách `Person`: `Collections.sort` áp dụng thứ tự tự nhiên từ `Comparable` theo `age`, còn `Comparator.comparing(Person::name)` áp dụng chính sách sắp xếp bên ngoài theo `name`.
      Hai kết quả cho thấy thứ tự do kiểu dữ liệu sở hữu hay do đoạn mã sử dụng cung cấp là một quyết định thiết kế, không phải hai cú pháp tương đương.
