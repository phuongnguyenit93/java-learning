  mutableKey():
    summary: Rủi ro thay đổi trạng thái equals/hashCode sau khi đưa khóa vào
    description: |-
      Đưa một khóa có thể thay đổi vào `HashMap`, kiểm tra tra cứu trước khi thay đổi, sửa trường dữ liệu tham gia `equals/hashCode`, rồi kiểm tra lại.
      Thí nghiệm cho thấy vì sao khóa trong cấu trúc dữ liệu dựa trên mã băm nên giữ trạng thái liên quan tới phép bằng nhau và mã băm ổn định; kết quả sau thay đổi là minh chứng của phần triển khai đang chạy, không phải quy ước bảo đảm mọi lần tra cứu đều thất bại theo cùng một cách.
