# <roadmap-schema>
# Cấu trúc Roadmap Module
# schema-version: 1
#
# YAML CONTRACT
# roadmap: Danh sách milestone cấp cao của roadmap cho language hiện tại.
#
# - id [string, required]: ID ổn định và duy nhất của milestone trong roadmap language hiện tại.
# - title [string, required]: Tên milestone hiển thị cho learner.
# - purpose [string, required]: Milestone này tồn tại để learner hiểu hoặc đạt được điều gì.
# - dependsOn [list, optional]: Danh sách id milestone prerequisite khi dependency không thể hiện đủ chỉ bằng thứ tự item.
# - objectives [list, optional]: Các learning objective cấp milestone; không dùng để liệt kê mọi fact/API/syntax nhỏ.
# - relatedKnowledge [list, optional]: Danh sách Knowledge category id trong chính module hiện tại hỗ trợ milestone. Portal hiển thị danh sách này ở phía đối diện milestone và click item sẽ điều hướng sang Knowledge category tương ứng.
# - relatedModules [list, optional]: Các module liên quan hiển thị ở Level 2 của Portal. Mỗi item dùng routeId bắt buộc và có thể có label/note localized; relation này chỉ để điều hướng, không tạo child milestone hoặc thay đổi learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - Topic/module này là gì?
#   - Vì sao nó tồn tại?
#   - Không có nó thì learner gặp vấn đề gì?
# FOUNDATION
#   - Learner cần prerequisite hoặc mental model nào trước?
# CORE MODEL
#   - Những abstraction hoặc building block lớn nào tạo nên chủ đề này?
# MECHANICS
#   - Nó hoạt động như thế nào ở mức language/runtime/API phù hợp với module?
# USAGE
#   - Nó được dùng như thế nào trong code thực tế?
# DECISION / TRADE-OFF
#   - Khi nào nên chọn cơ chế này thay vì cơ chế khác?
#   - Khi nào không nên dùng?
# FAILURE / PITFALL
#   - Những sai lầm, compile-time failure hoặc runtime failure nào đáng biết?
# INTEGRATION
#   - Chủ đề này kết nối với những concept/module lân cận nào?
# SYNTHESIS
#   - Sau cùng learner phải giữ mental model end-to-end nào?
#
# Mỗi language tự chịu trách nhiệm cho roadmap của chính nó. Không suy luận hoặc đồng bộ cấu trúc từ roadmap của language khác.
# Thứ tự item trong roadmap chính là thứ tự học mặc định. Chỉ dùng dependsOn khi cần biểu diễn dependency rõ hơn thứ tự tuyến tính.
# Skeleton không nên ép mọi module có đúng bấy nhiêu node. Nó là framework suy nghĩ chứ không phải template cứng.
# </roadmap-schema>

roadmap:
  - id: object-contract-purpose
    title: Mục đích của Object Contract
    purpose: Hiểu object contract là tập behavioral promise mà Java API khác phụ thuộc vào, chứ không phải một keyword hay interface đơn lẻ.
    relatedModules:
      - routeId: JAVA_CLASS_OBJECT
        label: Class & Object
        note: Object Contract dựa trên Object method chung và object identity model từ Class & Object.
    objectives:
      - Giải thích vì sao contract bị phá vỡ gây behavior bất ngờ ở bên ngoài class định nghĩa nó.
      - Nhận biết equality, hashing, representation và ordering là các contract riêng nhưng liên kết với nhau.
  - id: identity-and-logical-equality
    title: Identity và Logical Equality
    purpose: Phân biệt hai reference cùng trỏ một object với hai object biểu diễn cùng logical value.
    objectives:
      - Tách == reference identity khỏi equals-based logical equality.
      - Nhận biết scenario value object nơi logical equality quan trọng.
  - id: equals-contract
    title: Contract của equals
    purpose: Hiểu các behavioral law mà một equals implementation đúng phải giữ được theo thời gian và giữa các object.
    objectives:
      - Reason về reflexive, symmetric, transitive, consistent và null behavior.
      - Tránh equality implementation phá vỡ subtype hoặc mutable-state assumption.
  - id: hashing-consistency
    title: hashCode và Hash Consistency
    purpose: Hiểu vì sao object bằng nhau phải tạo hash tương thích và cách hash-based API phụ thuộc vào promise đó.
    relatedModules:
      - routeId: JAVA_COLLECTION
        label: Collections
        note: HashSet và HashMap làm equals/hashCode contract trở nên trực tiếp quan sát được.
    objectives:
      - Giải thích equals/hashCode consistency rule.
      - Dự đoán failure do mutable key hoặc hash implementation không nhất quán.
  - id: human-readable-representation
    title: Biểu diễn object cho người và tool
    purpose: Hiểu toString như diagnostic/representation contract cần được thiết kế có chủ đích về usefulness và safety.
    objectives:
      - Tạo representation ổn định và có ý nghĩa cho debugging/tooling.
      - Tránh làm lộ sensitive hoặc misleading state qua textual representation.
  - id: natural-ordering
    title: Natural Ordering với Comparable
    purpose: Hiểu cách một type định nghĩa một natural order và các behavioral property mà compareTo phải giữ.
    objectives:
      - Hiểu đúng semantics của comparison result âm/0/dương.
      - Reason về consistency giữa ordering và logical equality.
  - id: alternate-ordering
    title: Alternate Ordering với Comparator
    purpose: Hiểu caller-defined ordering như strategy tách biệt khỏi natural order của type.
    objectives:
      - Compose/reverse comparator mà không thay đổi domain equality.
      - Chọn giữa Comparable và Comparator dựa trên ownership và use-case.
  - id: contract-synthesis
    title: Tổng hợp tương tác giữa các Contract
    purpose: Kết nối identity, equality, hashing, representation, mutability và ordering thành một model cho object an toàn khi dùng với library.
    relatedModules:
      - routeId: JAVA_NUMBERS
        label: Numbers
        note: BigDecimal là ví dụ rõ về equality và ordering trả lời hai câu hỏi khác nhau.
    objectives:
      - Dự đoán class behavior trong hash-based và sorted data structure.
      - Nhận biết case domain-specific như BigDecimal nơi equality và ordering cố ý khác nhau.
