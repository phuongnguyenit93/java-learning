      - {id: B, answer: "Bắt buộc mọi lỗi đều phải được phục hồi ngay tại phương thức phát sinh.", explanation: "Sai. Một vai trò quan trọng của exception là cho phép lỗi lan truyền tới ranh giới phù hợp."}
