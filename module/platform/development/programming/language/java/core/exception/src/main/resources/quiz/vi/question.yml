      - {id: C, answer: "Đổi wrapper từ checked sang unchecked hoặc ngược lại theo loại exception đang làm cause.", explanation: "Sai. Checked hay unchecked phụ thuộc hierarchy của chính wrapper, không phụ thuộc cause."}
      - {id: D, answer: "Yêu cầu cơ chế catch tự retry cause trước khi propagate wrapper lên caller.", explanation: "Sai. Causal chain lưu provenance của failure; retry và recovery là policy riêng của ứng dụng."}
