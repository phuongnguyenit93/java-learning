ExceptionDesignController:
  description: |-
    <h2>Thiết kế ranh giới xử lý Exception</h2>
    <p>Nhóm thí nghiệm về chuyển đổi exception tại ranh giới trừu tượng: tầng cao dùng kiểu lỗi phù hợp với hợp đồng của mình nhưng vẫn giữ <code>cause</code> để không làm đứt chuỗi nguyên nhân.</p>
  readmeRelated:
    file: 8.ExceptionBoundaryDesign/ExceptionBoundaryDesign.md
FinallyController:
  description: |-
    <h2>Luồng điều khiển của finally</h2>
    <p>Thí nghiệm tập trung vào giá trị trả về đang chờ khi đi qua <code>finally</code>, đặc biệt trường hợp chính <code>finally</code> tạo một <code>return</code> mới và thay kết quả trước đó.</p>
  readmeRelated:
    file: 5.HandlingCleanup/HandlingCleanup.md
PropagationController:
  description: |-
    <h2>Lan truyền, stack unwinding và Cause</h2>
    <p>Các thí nghiệm cho thấy exception đi qua chuỗi lời gọi như thế nào và cách tạo một exception mới mà vẫn giữ exception cũ làm <code>cause</code>.</p>
    <p>Đây là bằng chứng khi chương trình chạy cho cơ chế lan truyền và chuỗi nguyên nhân; quyết định có nên chuyển đổi exception tại ranh giới trừu tượng thuộc nhóm thí nghiệm thiết kế riêng.</p>
  readmeRelated:
    file: 4.ThrowingPropagation/ThrowingPropagation.md
ResourceController:
  description: |-
    <h2>Try-with-resources và lỗi khi dọn dẹp</h2>
    <p>Các thí nghiệm quan sát vòng đời của nhiều tài nguyên: thứ tự mở/đóng ngược nhau và cách try-with-resources giữ lỗi chính khi <code>close()</code> cũng thất bại.</p>
  readmeRelated:
    file: 6.ResourceSafeFailure/ResourceSafeFailure.md
