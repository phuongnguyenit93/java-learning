  - question: "Phân biệt việc cố ý bỏ qua một lỗi cụ thể với việc nuốt exception."
    answer: "Bỏ qua có chủ ý phải có phạm vi hẹp, kiểu lỗi cụ thể, lý do rõ và trạng thái sau đó vẫn hợp lệ; ví dụ xóa file tạm khi file đã không tồn tại. Nuốt exception thường là catch rộng rồi bỏ trống, làm mất tín hiệu lỗi và khiến bên gọi tưởng thao tác thành công dù trạng thái có thể chưa hoàn chỉnh. Điểm cốt lõi là kết quả có còn đúng theo hợp đồng hay không."
