  - question: "Tại sao không nên dùng exception như luồng điều khiển bình thường? Có trường hợp API phân tích dữ liệu bằng exception vẫn hợp lý không?"
    answer: "Exception mô hình hóa sự kết thúc bất thường và làm luồng điều khiển trở nên không cục bộ; dùng nó cho nhánh bình thường thường làm mã khó đọc hơn và có thể tạo chi phí không cần thiết. Nếu một API như Integer.parseInt() vốn dùng NumberFormatException để báo dữ liệu không hợp lệ, một ranh giới nhỏ bắt exception rồi áp dụng fallback đã được xác định có thể hợp lý. Quan trọng là phân biệt trạng thái bình thường với kết quả bất thường."
