  - question: "Phân biệt dọn dẹp, phục hồi, thử lại và lan truyền. Hãy đưa ra mô hình ra quyết định khi exception tới một tầng."
    answer: "Dọn dẹp giải phóng tài nguyên hoặc hoàn tất công việc bắt buộc khi rời phạm vi, nhưng không có nghĩa thao tác đã phục hồi. Phục hồi phải tạo ra một kết quả hợp lệ thật sự. Thử lại chỉ nên dùng cho lỗi có khả năng tạm thời khi thao tác an toàn để lặp lại hoặc có cơ chế chống tác dụng phụ trùng lặp, đồng thời phải có giới hạn, backoff và timeout phù hợp. Nếu mức trừu tượng thay đổi thì có thể chuyển đổi exception và giữ cause; nếu tầng không có trách nhiệm xử lý có ý nghĩa thì nên tiếp tục lan truyền."
