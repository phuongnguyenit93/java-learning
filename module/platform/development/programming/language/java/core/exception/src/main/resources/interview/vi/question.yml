  - question: "Vì sao ghi log cùng một exception ở mọi tầng là vấn đề và nên chọn ranh giới ghi log thế nào?"
    answer: "Repository, service và controller cùng ghi log rồi ném lại sẽ tạo nhiều stack trace gần giống nhau nhưng ít thông tin mới. Tầng chỉ chuyển đổi hoặc ném lại thường nên giữ ngữ cảnh/cause mà không ghi lại cùng lỗi; ranh giới kết thúc yêu cầu, tác vụ hoặc thông điệp thường có đủ ngữ cảnh để ghi nhận một lần. Số liệu đo lường (metric) hoặc audit có thể được phát riêng, nhưng không nên lặp lại cùng một bản ghi chẩn đoán đầy đủ."
