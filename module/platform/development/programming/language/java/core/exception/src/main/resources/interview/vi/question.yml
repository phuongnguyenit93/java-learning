questions:
  - question: "Exception là gì, tại sao Java cần một kênh kết thúc bất thường riêng, và vì sao Throwable vừa mang dữ liệu vừa ảnh hưởng luồng điều khiển?"
    answer: "Cơ chế exception tách lỗi khỏi đường trả về bình thường để lỗi có thể mang kiểu, thông điệp, stack trace và cause rồi lan truyền qua nhiều tầng gọi tới nơi có đủ trách nhiệm xử lý. Một Throwable vừa là đối tượng chứa thông tin chẩn đoán, vừa trở thành tín hiệu điều khiển luồng khi bị throw: đường chạy hiện tại kết thúc bất thường và Java tìm khối xử lý phù hợp hoặc tiếp tục lần ngược ngăn xếp. So với việc mọi bên gọi tự kiểm tra mã trạng thái, cơ chế này tạo một kênh lỗi có cấu trúc hơn; nhưng exception không nên thay thế luồng điều khiển bình thường cho các nhánh dự kiến."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.ExceptionPurpose/ExceptionPurpose.md", anchor: "exception-purpose"}
    apiRelated: {controller: "PropagationController", methodSignature: "propagate()"}

  - question: "Phân biệt Error và Exception về mặt thiết kế. Vì sao catch Throwable thường quá rộng?"
    answer: "Error thường biểu diễn các điều kiện nghiêm trọng liên quan tới JVM, môi trường chạy hoặc quá trình liên kết lớp mà mã ứng dụng không nên mặc định có thể phục hồi như một lỗi thông thường. Exception thường là nhánh lỗi mà API/ứng dụng có thể mô hình hóa, xử lý, chuyển đổi hoặc tiếp tục lan truyền. catch (Throwable) hợp lệ về cú pháp nhưng còn bắt cả Error, nên dùng nó như khối xử lý chung có thể vô tình coi lỗi nghiêm trọng của môi trường chạy như một lỗi có thể phục hồi."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ThrowableModel/ThrowableModel.md", anchor: "error-vs-exception"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Stack trace, message và cause khác nhau thế nào khi chẩn đoán một exception đã được bọc?"
    answer: "Message mô tả lỗi ở mức trừu tượng hiện tại; stack trace cho biết đường gọi gần nơi Throwable ghi lại ngăn xếp; cause liên kết exception hiện tại với lỗi thấp hơn đã dẫn tới nó. Khi chuyển đổi exception, kiểu mới có thể phù hợp hơn với bên gọi còn cause vẫn giữ nguyên nhân gốc để chẩn đoán. Không nên phân tích stack trace hoặc message như một hợp đồng nghiệp vụ ổn định vì chúng có thể thay đổi sau refactor."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ThrowableModel/ThrowableModel.md", anchor: "stack-trace-cause"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Bạn quyết định dùng checked hay unchecked exception trong API như thế nào?"
    answer: "Không có quy tắc tuyệt đối kiểu lỗi nghiệp vụ luôn là checked hay Java hiện đại luôn dùng unchecked. Hãy hỏi bên gọi có nên bị trình biên dịch buộc phải nhận biết lỗi này không, họ có khả năng xử lý nó một cách có ý nghĩa không, và catch-or-declare có làm hợp đồng API rõ hơn hay chỉ tạo mã lặp. Checked phù hợp khi việc bắt buộc xác nhận lỗi tại thời điểm biên dịch có giá trị; unchecked thường hợp với lỗi vi phạm hợp đồng, invariant, lỗi lập trình hoặc trường hợp các bên gọi gần đó không thể phục hồi hợp lý."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.CheckedUncheckedContracts/CheckedUncheckedContracts.md", anchor: "checked-vs-unchecked-design"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Giải thích catch-or-declare và vì sao unchecked exception vẫn có thể xuất hiện trong throws clause."
    answer: "Nếu checked exception có thể thoát khỏi phương thức, phương thức phải bắt nó hoặc khai báo bằng throws. RuntimeException và Error không chịu quy tắc catch-or-declare này. Java vẫn cho phép ghi unchecked exception trong throws để mô tả hợp đồng nếu hữu ích, nhưng việc khai báo không biến nó thành checked và cũng không bắt bên gọi phải catch hoặc khai báo lại."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.CheckedUncheckedContracts/CheckedUncheckedContracts.md", anchor: "checked-exception"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Phân biệt throw và throws về thời điểm và trách nhiệm. Một câu lệnh throw có bắt buộc phải tạo exception mới không?"
    answer: "throw là câu lệnh thực thi khi chương trình chạy: nó ném một biểu thức Throwable và làm đường chạy hiện tại kết thúc bất thường. throws nằm trong phần khai báo phương thức/constructor để mô tả những exception có thể thoát ra. throw không bắt buộc phải dùng new tại chỗ; có thể ném lại một exception instance đã có. Vì câu hỏi đồng thời bao quát cả throw và throws nên không ép liên kết tới một Knowledge anchor duy nhất."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "", anchor: ""}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Mô tả exception propagation và stack unwinding. Việc dọn dẹp có bị bỏ qua khi ngăn xếp được lần ngược không?"
    answer: "Khi phương thức không bắt exception, lỗi tiếp tục lan truyền tới bên gọi cho tới khi gặp khối xử lý phù hợp hoặc ranh giới của thread. Trong lúc stack unwinding diễn ra, các khối finally và phần dọn dẹp của try-with-resources vẫn tham gia theo quy tắc ngôn ngữ; lần ngược ngăn xếp không có nghĩa bỏ qua dọn dẹp. Endpoint propagate() cho thấy đường levelTwo → levelOne → propagate qua stack trace."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.ThrowingPropagation/ThrowingPropagation.md", anchor: "exception-propagation"}
    apiRelated: {controller: "PropagationController", methodSignature: "propagate()"}

  - question: "Java chọn khối catch như thế nào và vì sao không nên phân nhánh xử lý bằng cách đọc nội dung exception message?"
    answer: "Java xét các khối catch theo thứ tự trong mã nguồn và tính tương thích kiểu. Catch cho kiểu cụ thể phải đứng trước kiểu cha rộng hơn, nếu không nhánh cụ thể có thể trở thành unreachable. Message là văn bản chẩn đoán có thể thay đổi, không phải hợp đồng có cấu trúc. Nếu cần chính sách xử lý khác nhau, kiểu exception hoặc dữ liệu ngữ cảnh có cấu trúc là nền tảng ổn định hơn."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.ThrowingPropagation/ThrowingPropagation.md", anchor: "catch-selection"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Exception chaining hoạt động như thế nào khi tạo một exception mới từ exception cũ, và wrapCause() chứng minh điều gì?"
    answer: "Exception mới có thể nhận exception cũ trong constructor làm cause. Nhờ đó kiểu/thông điệp mới và lỗi gốc cùng tồn tại trong một chuỗi nguyên nhân. wrapCause() trả cả OrderReadException lẫn IllegalArgumentException gốc để làm quan hệ này quan sát được. Việc có nên bọc exception tại một ranh giới trừu tượng hay không là quyết định thiết kế riêng ở chương về ranh giới xử lý."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.ThrowingPropagation/ThrowingPropagation.md", anchor: "exception-chaining"}
    apiRelated: {controller: "PropagationController", methodSignature: "wrapCause()"}

  - question: "Lost-cause anti-pattern gây hậu quả gì và bạn nhận ra nó trong mã nguồn như thế nào?"
    answer: "Dấu hiệu điển hình là bắt exception rồi ném một lớp bọc mới nhưng constructor không nhận exception gốc. Chuỗi nguyên nhân bị cắt, stack trace và ngữ cảnh của lỗi gốc không còn nối với exception mới. Nếu cần chuyển đổi exception, hãy dùng constructor nhận cause; nếu mức trừu tượng không đổi, có thể cân nhắc ném lại chính exception cũ."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.ThrowingPropagation/ThrowingPropagation.md", anchor: "lost-cause-pitfall"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Precise rethrow là gì và nó giúp giữ hợp đồng phương thức hẹp hơn ra sao?"
    answer: "Khi catch bằng kiểu cha như Exception nhưng khối try chỉ có thể phát sinh một tập checked exception hẹp, trình biên dịch có thể dùng phân tích luồng để suy luận các kiểu thực sự có thể đi vào tham số catch nếu tham số đó không bị gán lại. Vì vậy throw ex không nhất thiết buộc phương thức khai báo throws Exception; phương thức vẫn có thể chỉ khai báo IOException và SQLException. Cơ chế này cho phép dùng chung logic xử lý mà không làm hợp đồng rộng hơn cần thiết."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.ThrowingPropagation/ThrowingPropagation.md", anchor: "precise-rethrow"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Giải thích quy tắc của checked exception khi overriding và liên hệ với substitutability."
    answer: "Phương thức ghi đè có thể giữ nguyên, thu hẹp hoặc bỏ checked exception đã được lớp cha khai báo, nhưng không được mở rộng thành một checked exception rộng hơn. Bên gọi được biên dịch theo hợp đồng của lớp cha phải có thể thay đối tượng con vào mà không bị buộc xử lý một checked exception mới mà lớp cha chưa công bố. Unchecked exception không chịu cùng giới hạn catch-or-declare này."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.ThrowingPropagation/ThrowingPropagation.md", anchor: "override-throws-rules"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao 'đã catch' không đồng nghĩa với 'đã phục hồi'? Khi nào catch (Exception) có thể chấp nhận được?"
    answer: "Catch chỉ dừng quá trình lan truyền; phục hồi đòi hỏi chương trình tạo ra một kết quả hoặc trạng thái hợp lệ theo hợp đồng. catch (Exception) ở tầng trung gian dễ che lỗi lập trình hoặc bắt những lỗi mà tầng đó không hiểu. Nó có thể hợp lý ở ranh giới cuối của ứng dụng khi cần ánh xạ một nhóm lỗi thành kết quả thống nhất, miễn là không biến thất bại thật thành thành công giả."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.HandlingCleanup/HandlingCleanup.md", anchor: "try-catch-flow"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Khi nào multi-catch giúp mã nguồn rõ hơn và giới hạn quan trọng của nó là gì?"
    answer: "Multi-catch phù hợp khi nhiều kiểu exception thực sự dùng cùng một chính sách xử lý, giúp tránh lặp lại cùng thân khối xử lý. Các kiểu trong cùng multi-catch không được có quan hệ kiểu con/kiểu cha với nhau; ví dụ FileNotFoundException | IOException là không hợp lệ. Cũng không nên gom những lỗi có ngữ nghĩa khác nhau chỉ vì hiện tại phần xử lý trông giống nhau."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.HandlingCleanup/HandlingCleanup.md", anchor: "multi-catch"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Giải thích finally khi đang có return hoặc exception chờ hoàn tất. Vì sao return/throw bên trong finally nguy hiểm?"
    answer: "finally chạy trước khi kết quả đang chờ rời khỏi cấu trúc try/catch. Nếu finally hoàn thành bình thường, return hoặc exception đang chờ tiếp tục được giữ. Nhưng nếu chính finally return hoặc throw, lý do hoàn thành mới có thể thay thế kết quả/lỗi trước đó. returnInteraction() chứng minh return 1 bị return 2 trong finally thay thế; nguyên lý tương tự áp dụng khi finally ném exception mới."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.HandlingCleanup/HandlingCleanup.md", anchor: "return-finally"}
    apiRelated: {controller: "FinallyController", methodSignature: "returnInteraction()"}

  - question: "Vì sao try-with-resources cần AutoCloseable và không nên dựa vào Garbage Collector để giải phóng tài nguyên file/socket/JDBC?"
    answer: "GC quản lý bộ nhớ của đối tượng Java, không phải cơ chế đảm bảo giải phóng tài nguyên hệ điều hành hoặc cơ sở dữ liệu đúng thời điểm. TWR biểu diễn quyền sở hữu tài nguyên và gọi close() khi rời khối qua đường thành công, return hoặc exception. AutoCloseable là giao ước để Java biết một tài nguyên có thể được đóng như thế nào."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.ResourceSafeFailure/ResourceSafeFailure.md", anchor: "autocloseable"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Giải thích thứ tự khởi tạo/đóng tài nguyên trong TWR, kể cả khi tài nguyên thứ hai khởi tạo thất bại."
    answer: "Các tài nguyên được khởi tạo từ trái sang phải và đóng theo thứ tự ngược. Nếu A mở thành công, B thất bại khi khởi tạo và C chưa được tạo, TWR vẫn đóng A. Điều này quan trọng vì tài nguyên tạo sau thường bọc hoặc phụ thuộc tài nguyên tạo trước, còn việc tự xử lý khởi tạo dở dang bằng nhiều finally lồng nhau rất dễ sai."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.ResourceSafeFailure/ResourceSafeFailure.md", anchor: "resource-close-order"}
    apiRelated: {controller: "ResourceController", methodSignature: "closeOrder()"}

  - question: "Nếu phần thân try và close() cùng ném exception, TWR giữ các lỗi như thế nào và vì sao tốt hơn finally thủ công?"
    answer: "Exception từ phần thân đang là lỗi chính. Nếu close() cũng thất bại trong lúc dọn dẹp, lỗi đóng tài nguyên được gắn dưới dạng suppressed exception thay vì che lỗi chính. finally thủ công viết không cẩn thận có thể để lỗi close() thay thế lỗi ban đầu. Endpoint suppressed() cho phép quan sát trực tiếp lỗi chính, getSuppressed() và thứ tự dọn dẹp."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.ResourceSafeFailure/ResourceSafeFailure.md", anchor: "primary-vs-suppressed"}
    apiRelated: {controller: "ResourceController", methodSignature: "suppressed()"}

  - question: "Phân biệt cause với suppressed exception. Nếu phần thân thành công nhưng nhiều close() cùng thất bại thì lỗi chính được chọn thế nào?"
    answer: "Cause biểu diễn quan hệ nguyên nhân giữa exception hiện tại và lỗi thấp hơn dẫn tới nó; suppressed exception giữ các lỗi phụ xảy ra khi một lỗi khác đã là kết quả chính. Nếu phần thân thành công, các tài nguyên đóng theo thứ tự ngược; lỗi close() đầu tiên trở thành lỗi chính và các lỗi close() tiếp theo được suppressed trên nó. Một Throwable có thể đồng thời có cả cause và suppressed exceptions."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.ResourceSafeFailure/ResourceSafeFailure.md", anchor: "get-suppressed"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Cú pháp tài nguyên effectively final từ Java 9 giải quyết điều gì, và tại sao quyền sở hữu vẫn quan trọng?"
    answer: "Java 9 cho phép một biến cục bộ đã tồn tại xuất hiện trực tiếp trong phần khai báo tài nguyên nếu nó là final hoặc effectively final, nhờ đó không cần tạo biến thay thế chỉ để dùng TWR. Nhưng cú pháp không tự quyết định quyền sở hữu: phương thức chỉ mượn tài nguyên do bên gọi sở hữu không nên tự đóng nếu hợp đồng không giao vòng đời tài nguyên cho nó. Phải phân biệt rõ ai tạo, ai sở hữu và ai đóng tài nguyên."
