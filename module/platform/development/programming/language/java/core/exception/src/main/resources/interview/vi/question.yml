  - question: "Chuyển đổi exception tại ranh giới trừu tượng là gì và khi nào không nên bọc thêm một lớp nữa?"
    answer: "Tầng hiện tại bắt lỗi mang chi tiết triển khai rồi chuyển sang kiểu phù hợp với ngôn ngữ/hợp đồng của mức trừu tượng cao hơn, đồng thời giữ cause. Không nên bọc nếu mức trừu tượng không đổi và lớp bọc mới không bổ sung ý nghĩa, nhóm xử lý hoặc ngữ cảnh. translateBoundary() minh họa một kiểu lỗi ở tầng cao hơn cùng nguyên nhân gốc vẫn được giữ lại."
