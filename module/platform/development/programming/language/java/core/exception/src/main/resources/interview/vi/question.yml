  - question: "Hãy nối toàn bộ module thành một luồng xuyên suốt: từ hợp đồng checked/unchecked khi thiết kế API tới throw, sự lan truyền, dọn dẹp, cause/suppressed, chuyển đổi exception và ranh giới xử lý cuối."
    answer: "Ở mức thiết kế API, chọn checked hay unchecked dựa trên việc bên gọi có cần bị trình biên dịch buộc phải nhận biết lỗi hay không. Khi chạy, throw làm đường chạy kết thúc bất thường; nếu chưa có khối xử lý thì exception tiếp tục lan truyền và ngăn xếp được lần ngược, trong khi finally/TWR vẫn thực hiện dọn dẹp. Nếu tạo exception mới phải giữ cause; nếu close() trong TWR cũng thất bại thì lỗi phụ được giữ dưới dạng suppressed theo quy tắc của lỗi chính. Tầng có đủ ngữ cảnh mới quyết định phục hồi, thử lại, chuyển đổi hoặc ánh xạ kết quả cuối và ghi log/quan sát. Nếu tầng không có chính sách có ý nghĩa thì tiếp tục lan truyền thay vì nuốt hoặc bọc lỗi máy móc."
