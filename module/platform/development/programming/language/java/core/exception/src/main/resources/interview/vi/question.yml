  - question: "Khi nào nên ném lại nguyên exception và khi nào nên bọc bằng exception mới? Vì sao phải giữ cause?"
    answer: "Nếu mức trừu tượng không đổi và tầng hiện tại chỉ thực hiện một tác vụ phụ hợp lệ như audit, ném lại chính exception cũ có thể đã đủ. Khi hợp đồng hoặc ngôn ngữ lỗi thay đổi thật sự tại một ranh giới trừu tượng, bọc bằng kiểu ở tầng cao hơn có thể hợp lý. Nếu tạo exception mới thì phải giữ cause để thông tin chẩn đoán vẫn dẫn về lỗi kỹ thuật gốc; bọc máy móc ở mọi tầng chỉ làm chuỗi lỗi dài hơn mà không tăng giá trị."
