# <roadmap-schema>
# Cấu trúc Roadmap Module
# schema-version: 1
#
# YAML CONTRACT
# roadmap: Danh sách milestone cấp cao của roadmap cho language hiện tại.
#
# - id [string, required]: ID ổn định và duy nhất của milestone trong roadmap language hiện tại.
# - title [string, required]: Tên milestone hiển thị cho learner.
# - purpose [string, required]: Milestone này tồn tại để learner hiểu hoặc đạt được điều gì.
# - dependsOn [list, optional]: Danh sách id milestone prerequisite khi dependency không thể hiện đủ chỉ bằng thứ tự item.
# - objectives [list, optional]: Các learning objective cấp milestone; không dùng để liệt kê mọi fact/API/syntax nhỏ.
# - relatedKnowledge [list, optional]: Danh sách Knowledge category id trong chính module hiện tại hỗ trợ milestone. Portal hiển thị danh sách này ở phía đối diện milestone và click item sẽ điều hướng sang Knowledge category tương ứng.
# - relatedModules [list, optional]: Các module liên quan hiển thị ở Level 2 của Portal. Mỗi item dùng routeId bắt buộc và có thể có label/note localized; relation này chỉ để điều hướng, không tạo child milestone hoặc thay đổi learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - Topic/module này là gì?
#   - Vì sao nó tồn tại?
#   - Không có nó thì learner gặp vấn đề gì?
# FOUNDATION
#   - Learner cần prerequisite hoặc mental model nào trước?
# CORE MODEL
#   - Những abstraction hoặc building block lớn nào tạo nên chủ đề này?
# MECHANICS
#   - Nó hoạt động như thế nào ở mức language/runtime/API phù hợp với module?
# USAGE
#   - Nó được dùng như thế nào trong code thực tế?
# DECISION / TRADE-OFF
#   - Khi nào nên chọn cơ chế này thay vì cơ chế khác?
#   - Khi nào không nên dùng?
# FAILURE / PITFALL
#   - Những sai lầm, compile-time failure hoặc runtime failure nào đáng biết?
# INTEGRATION
#   - Chủ đề này kết nối với những concept/module lân cận nào?
# SYNTHESIS
#   - Sau cùng learner phải giữ mental model end-to-end nào?
#
# Mỗi language tự chịu trách nhiệm cho roadmap của chính nó. Không suy luận hoặc đồng bộ cấu trúc từ roadmap của language khác.
# Thứ tự item trong roadmap chính là thứ tự học mặc định. Chỉ dùng dependsOn khi cần biểu diễn dependency rõ hơn thứ tự tuyến tính.
# Skeleton không nên ép mọi module có đúng bấy nhiêu node. Nó là framework suy nghĩ chứ không phải template cứng.
# </roadmap-schema>

roadmap:
  - id: exception-purpose
    title: Exception là gì và vì sao Java cần nó?
    purpose: Hiểu Exception là cơ chế biểu diễn tình huống bất thường hoặc thất bại tách khỏi luồng thành công bình thường, giúp thông tin về sự cố đi qua nhiều lời gọi phương thức mà không buộc mọi tầng phải trả và kiểm tra mã trạng thái.
    relatedKnowledge:
      - ExceptionPurpose
    objectives:
      - Giải thích vai trò của Exception trong việc tách luồng xử lý thành công khỏi luồng xử lý khi thất bại và truyền ngữ cảnh đến nơi có trách nhiệm xử lý.
      - Nhận biết Exception không nên được dùng như cơ chế mặc định cho luồng điều khiển bình thường đã được dự kiến trước.
  - id: throwable-model
    title: Throwable và cách Java phân loại lỗi
    purpose: Hiểu Throwable là đối tượng mang thông tin về sự cố và là gốc của hệ phân cấp kiểu mà Java dùng cho cơ chế Exception.
    relatedKnowledge:
      - ThrowableModel
    objectives:
      - Phân biệt vai trò của Error, Exception, RuntimeException, nguyên nhân (cause) và dấu vết ngăn xếp (stack trace).
      - Dùng quan hệ phân cấp kiểu để hiểu loại lỗi nào nên hoặc không nên được bắt, thay vì chỉ ghi nhớ tên lớp.
  - id: checked-and-unchecked-contracts
    title: Checked Exception và Unchecked Exception
    purpose: Hiểu khi nào một lỗi trở thành một phần của hợp đồng phương thức được trình biên dịch kiểm tra và sự khác nhau về trách nhiệm xử lý giữa checked với unchecked exception.
    relatedKnowledge:
      - CheckedUncheckedContracts
    objectives:
      - Giải thích yêu cầu bắt hoặc khai báo mà trình biên dịch áp dụng cho checked exception.
      - Chọn checked hay unchecked dựa trên khả năng phục hồi và hợp đồng của tầng trừu tượng, không dựa trên thói quen.
  - id: throwing-and-propagation
    title: throw, throws và sự lan truyền Exception
    purpose: Hiểu cách Exception được ném, khai báo và tiếp tục lan truyền qua ngăn xếp lời gọi khi chưa có nơi xử lý phù hợp.
    relatedKnowledge:
      - ThrowingPropagation
    objectives:
      - Phân biệt `throw` với `throws` và hiểu vai trò của chúng trong hợp đồng phương thức.
      - Theo dõi quá trình tháo dỡ ngăn xếp (stack unwinding), cách Java chọn khối `catch` và chuỗi nguyên nhân qua nhiều tầng.
  - id: handling-and-cleanup
    title: Xử lý Exception với try/catch/finally
    purpose: Hiểu cách `try`, `catch` và `finally` điều khiển luồng khi có Exception và thực hiện công việc dọn dẹp mà không che mất kết quả hoặc sự cố đang chờ xử lý.
    relatedKnowledge:
      - HandlingCleanup
    objectives:
      - Theo dõi luồng thực thi qua `try` và `catch` khi có hoặc không có Exception.
      - Hiểu vai trò của `finally` và tránh để logic dọn dẹp che mất kết quả hoặc lỗi đang chờ xử lý.
  - id: resource-safe-failure
    title: Quản lý tài nguyên an toàn với try-with-resources
    purpose: Hiểu cách try-with-resources và AutoCloseable quản lý vòng đời tài nguyên, thứ tự đóng và giữ lại lỗi chính khi quá trình đóng tài nguyên cũng phát sinh lỗi.
    relatedKnowledge:
      - ResourceSafeFailure
    relatedModules:
      - routeId: JAVA_IO
        label: I/O
        note: Tài nguyên I/O là ví dụ điển hình để quan sát việc đóng tài nguyên an toàn khi có Exception.
    objectives:
      - Hiểu hợp đồng AutoCloseable và thứ tự đóng tài nguyên theo chiều ngược trong try-with-resources.
      - Phân biệt lỗi chính, Suppressed Exception và nguyên nhân (cause); hiểu Suppressed Exception là lỗi phụ được Java lưu kèm khi quá trình dọn dẹp cũng thất bại.
  - id: custom-exceptions-and-context
    title: Ngoại lệ tùy chỉnh (Custom Exception)
    purpose: Hiểu khi nào một loại Exception riêng giúp diễn đạt lỗi ở đúng mức trừu tượng và cách giữ nguyên nhân cùng dữ liệu ngữ cảnh hữu ích mà không làm lộ chi tiết tầng thấp không cần thiết.
    relatedKnowledge:
      - CustomExceptionsContext
    objectives:
      - Chỉ tạo ngoại lệ tùy chỉnh hoặc cây phân cấp nhỏ khi nó giúp mã gọi đưa ra quyết định rõ ràng hơn.
      - Giữ nguyên nhân (cause) và dữ liệu ngữ cảnh cần thiết khi bọc Exception, thay vì chỉ thay thông điệp hoặc tạo thêm lớp bọc vô nghĩa.
  - id: exception-boundary-design
    title: Ranh giới xử lý Exception trong ứng dụng
    purpose: Xây dựng mô hình xuyên suốt để quyết định ở tầng nào Exception nên được chuyển đổi, ghi log, thử lại, phục hồi hoặc tiếp tục lan truyền.
    relatedKnowledge:
      - ExceptionBoundaryDesign
    objectives:
      - Tránh nuốt lỗi, ghi log lặp lại ở nhiều tầng và dùng Exception cho luồng điều khiển bình thường.
      - Tách trách nhiệm dọn dẹp, phục hồi, chuyển đổi lỗi và ghi nhận thông tin phục vụ quan sát/chẩn đoán giữa các ranh giới xử lý.
  - id: exception-synthesis
    title: Tổng hợp mô hình xử lý Exception
    purpose: Kết nối biểu diễn lỗi, lan truyền, xử lý, dọn dẹp tài nguyên, chuyển đổi và phục hồi thành một mô hình xử lý lỗi xuyên suốt.
    relatedKnowledge:
      - ExceptionSynthesis
    objectives:
      - Theo dõi một lỗi từ nơi phát sinh qua các bước lan truyền hoặc chuyển đổi đến ranh giới chịu trách nhiệm cuối cùng.
      - Nhận biết khi việc bọc Exception thực sự bổ sung ngữ cảnh và khi nó chỉ tạo thêm một lớp bọc không cần thiết.
