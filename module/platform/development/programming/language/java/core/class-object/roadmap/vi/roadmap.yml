# <roadmap-schema>
# Cấu trúc Roadmap Module
# schema-version: 1
#
# YAML CONTRACT
# roadmap: Danh sách milestone cấp cao của roadmap cho language hiện tại.
#
# - id [string, required]: ID ổn định và duy nhất của milestone trong roadmap language hiện tại.
# - title [string, required]: Tên milestone hiển thị cho learner.
# - purpose [string, required]: Milestone này tồn tại để learner hiểu hoặc đạt được điều gì.
# - dependsOn [list, optional]: Danh sách id milestone prerequisite khi dependency không thể hiện đủ chỉ bằng thứ tự item.
# - objectives [list, optional]: Các learning objective cấp milestone; không dùng để liệt kê mọi fact/API/syntax nhỏ.
# - relatedKnowledge [list, optional]: Danh sách Knowledge category id trong chính module hiện tại hỗ trợ milestone. Portal hiển thị danh sách này ở phía đối diện milestone và click item sẽ điều hướng sang Knowledge category tương ứng.
# - relatedModules [list, optional]: Các module liên quan hiển thị ở Level 2 của Portal. Mỗi item dùng routeId bắt buộc và có thể có label/note localized; relation này chỉ để điều hướng, không tạo child milestone hoặc thay đổi learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - Topic/module này là gì?
#   - Vì sao nó tồn tại?
#   - Không có nó thì learner gặp vấn đề gì?
# FOUNDATION
#   - Learner cần prerequisite hoặc mental model nào trước?
# CORE MODEL
#   - Những abstraction hoặc building block lớn nào tạo nên chủ đề này?
# MECHANICS
#   - Nó hoạt động như thế nào ở mức language/runtime/API phù hợp với module?
# USAGE
#   - Nó được dùng như thế nào trong code thực tế?
# DECISION / TRADE-OFF
#   - Khi nào nên chọn cơ chế này thay vì cơ chế khác?
#   - Khi nào không nên dùng?
# FAILURE / PITFALL
#   - Những sai lầm, compile-time failure hoặc runtime failure nào đáng biết?
# INTEGRATION
#   - Chủ đề này kết nối với những concept/module lân cận nào?
# SYNTHESIS
#   - Sau cùng learner phải giữ mental model end-to-end nào?
#
# Mỗi language tự chịu trách nhiệm cho roadmap của chính nó. Không suy luận hoặc đồng bộ cấu trúc từ roadmap của language khác.
# Thứ tự item trong roadmap chính là thứ tự học mặc định. Chỉ dùng dependsOn khi cần biểu diễn dependency rõ hơn thứ tự tuyến tính.
# Skeleton không nên ép mọi module có đúng bấy nhiêu node. Nó là framework suy nghĩ chứ không phải template cứng.
# </roadmap-schema>

roadmap:
  - id: class-object-model
    title: Lớp (class) và đối tượng (object)
    purpose: Hiểu lớp là cách Java mô tả một loại thực thể có dữ liệu và hành vi chung, còn đối tượng là từng thực thể cụ thể được tạo khi chương trình chạy; từ đó thấy vì sao cần một mô hình tổ chức thay cho việc quản lý dữ liệu và thao tác liên quan như các phần rời rạc.
    relatedKnowledge:
      - ClassObject
    relatedModules:
      - routeId: JAVA_LANGUAGE_BASICS
        label: Kiến thức nền tảng về ngôn ngữ
        note: Kiểu tham chiếu, biến, phạm vi và cấu trúc mã nguồn là nền tảng trực tiếp trước khi học sâu về lớp và đối tượng.
      - routeId: JAVA_OOP
        label: Lập trình hướng đối tượng (OOP)
        note: OOP xây dựng các nguyên lý thiết kế trên nền tảng lớp và đối tượng được học trong mô-đun này.
    objectives:
      - Phân biệt lớp, đối tượng, trạng thái, hành vi, danh tính của đối tượng và biến tham chiếu đang trỏ tới đối tượng.
      - Hiểu một biến tham chiếu có thể ra khỏi phạm vi sử dụng trong khi đối tượng vẫn còn được truy cập qua một tham chiếu khác.
  - id: construction-and-invariants
    title: Hàm khởi tạo (constructor) và trạng thái hợp lệ
    purpose: Hiểu vì sao một đối tượng cần được tạo ra ở trạng thái dùng được ngay từ đầu, và cách hàm khởi tạo, nạp chồng hàm khởi tạo và gọi nối tiếp hàm khởi tạo tổ chức quá trình đó.
    relatedKnowledge:
      - Constructor
    objectives:
      - Phân biệt hàm khởi tạo mặc định, hàm khởi tạo do lập trình viên khai báo và trường hợp khởi tạo thất bại.
      - Thiết kế hàm khởi tạo thiết lập trạng thái hợp lệ trước khi đối tượng được đưa ra cho phần còn lại của chương trình sử dụng.
  - id: this-super-and-chaining
    title: this, super và chuỗi khởi tạo
    purpose: Hiểu this đại diện cho đối tượng hiện tại, super đại diện cho ngữ cảnh lớp cha, và cách hai từ khóa này tham gia truy cập thành viên cũng như nối chuỗi hàm khởi tạo.
    relatedKnowledge:
      - ThisSuper
    objectives:
      - Dùng this và super đúng ngữ nghĩa khi truy cập thành viên và gọi hàm khởi tạo.
      - Theo dõi đúng thứ tự hàm khởi tạo của lớp cha và lớp con mà không hiểu nhầm rằng có nhiều đối tượng khác nhau được tạo ra.
  - id: access-control
    title: Phạm vi truy cập thành viên
    purpose: Hiểu ai được phép nhìn thấy hoặc sử dụng một thành viên của lớp, và vì sao Java cần các mức truy cập để tạo ranh giới đóng gói.
    relatedKnowledge:
      - AccessModifier
    objectives:
      - Phân biệt private, phạm vi mặc định theo package (package-private), protected và public theo phạm vi truy cập thực tế.
      - Hiểu các từ bổ nghĩa truy cập chỉ quyết định ai có thể truy cập thành viên; static và final giải quyết những vấn đề khác và được học ở chặng tiếp theo.
  - id: class-instance-member-ownership
    title: Thành viên cấp lớp, thành viên cấp đối tượng và final
    purpose: Hiểu dữ liệu hoặc hành vi nào thuộc về toàn bộ lớp, dữ liệu hoặc hành vi nào thuộc từng đối tượng, và final giới hạn việc gán lại như thế nào.
    relatedKnowledge:
      - StaticFinal
    objectives:
      - Phân biệt thành viên static với thành viên của từng đối tượng.
      - Phân biệt final trên biến nguyên thủy, biến tham chiếu và hằng số tại thời điểm biên dịch.
  - id: initialization-lifecycle
    title: Thứ tự khởi tạo và quá trình tạo đối tượng
    purpose: Phân biệt khởi tạo lớp với khởi tạo từng đối tượng, rồi kết nối khởi tạo trường, khối khởi tạo đối tượng, kế thừa, cấp phát bộ nhớ và thực thi hàm khởi tạo thành quá trình tạo một đối tượng hoàn chỉnh.
    relatedKnowledge:
      - InitializationBlocks
      - InitializationOrder
      - ObjectCreationLifecycle
    relatedModules:
      - routeId: JAVA_CLASSLOADER
        label: ClassLoader
        note: Khởi tạo lớp chỉ là một giai đoạn trong vòng đời nạp, liên kết và khởi tạo lớp rộng hơn của JVM.
    objectives:
      - Hiểu khối khởi tạo static thuộc quá trình khởi tạo lớp; việc tạo đối tượng có thể kích hoạt bước này nếu lớp chưa được khởi tạo, nhưng khối static không chạy lại cho mỗi đối tượng mới.
      - Phân biệt vai trò của khởi tạo trường, khối khởi tạo đối tượng và hàm khởi tạo trong quá trình tạo từng instance.
      - Theo dõi đúng thứ tự các bước khởi tạo lớp và đối tượng khi có kế thừa.
      - Nhận biết rủi ro khi hàm khởi tạo gọi phương thức có thể bị lớp con ghi đè hoặc chia sẻ tham chiếu this ra ngoài trước khi đối tượng khởi tạo xong.
  - id: nested-types-and-capture
    title: Lớp lồng nhau và lớp nội bộ
    purpose: Hiểu khi nào một lớp nên được khai báo bên trong lớp khác và loại lớp đó có thể truy cập thành viên của đối tượng bao quanh hoặc sử dụng biến cục bộ từ phạm vi bên ngoài như thế nào.
    relatedKnowledge:
      - NestedInnerClass
    objectives:
      - Phân biệt lớp lồng static, lớp nội bộ, lớp cục bộ và lớp vô danh.
      - Giải thích quan hệ với đối tượng bao quanh và điều kiện để lớp bên trong có thể sử dụng biến cục bộ từ phạm vi bên ngoài.
  - id: object-root-type
    title: Object – lớp gốc chung
    purpose: Hiểu Object là lớp gốc chung mà các lớp Java khác trực tiếp hoặc gián tiếp kế thừa và vì sao các đối tượng có một tập hành vi cơ bản dùng chung.
    relatedKnowledge:
      - ObjectClass
    relatedModules:
      - routeId: JAVA_OBJECT_CONTRACT
        label: Quy ước của Object
        note: Quy tắc hành vi đầy đủ của equals, hashCode, toString và các quan hệ liên quan được học sâu trong mô-đun Quy ước của Object.
    objectives:
      - Nhận biết các phương thức cốt lõi của Object và vai trò khái quát của chúng.
      - Biết ranh giới của mô-đun này là giới thiệu nền tảng, còn các quy ước hành vi chi tiết thuộc mô-đun Quy ước của Object.
  - id: enum-model
    title: Kiểu liệt kê (enum)
    purpose: Hiểu vì sao enum phù hợp để mô hình một tập giá trị hữu hạn có kiểu, thay vì dùng các hằng số rời rạc khó kiểm soát.
    relatedKnowledge:
      - Enum
    relatedModules:
      - routeId: JAVA_ABSTRACT_INTERFACE
        label: Lớp trừu tượng và giao diện
        note: enum có thể triển khai giao diện (interface), nhưng cơ chế và thiết kế giao diện được học đầy đủ ở mô-đun Lớp trừu tượng và giao diện.
    objectives:
      - Hiểu mỗi hằng enum là một thể hiện của chính kiểu enum đó.
      - Dùng trường, hàm khởi tạo và phương thức trong enum; nhận biết khả năng triển khai giao diện và hành vi riêng theo từng hằng mà không học lấn sang thiết kế giao diện.
  - id: copy-semantics
    title: Cách sao chép đối tượng
    purpose: Hiểu khi nào thao tác sao chép chỉ tạo thêm một tham chiếu, khi nào tạo một đối tượng mới nhưng vẫn dùng chung trạng thái bên trong, và khi nào cần tách toàn bộ trạng thái có thể thay đổi.
    relatedKnowledge:
      - CopySemantics
    objectives:
      - Phân biệt sao chép tham chiếu, sao chép nông và sao chép sâu.
      - Nhận biết vai trò của hàm khởi tạo sao chép, phương thức tạo đối tượng và sao chép thủ công từng trường thay cho việc phụ thuộc vào clone như lựa chọn mặc định.
  - id: shared-references-and-mutability
    title: Dùng chung tham chiếu và trạng thái có thể thay đổi
    purpose: Hiểu hiện tượng nhiều biến tham chiếu cùng trỏ tới một đối tượng và vì sao thay đổi trạng thái qua một tham chiếu có thể được quan sát qua những tham chiếu khác.
    relatedKnowledge:
      - ObjectAliasingMutability
    objectives:
      - Phân biệt việc gán lại một biến tham chiếu với việc thay đổi trạng thái của đối tượng mà biến đó trỏ tới.
      - Dự đoán ảnh hưởng của trạng thái dùng chung, kể cả khi đối tượng chứa các đối tượng con cũng có trạng thái có thể thay đổi.
  - id: immutability-and-defensive-copy
    title: Tính bất biến và sao chép phòng vệ
    purpose: Hiểu cách thiết kế đối tượng bất biến và tạo bản sao phòng vệ như hai chiến lược kiểm soát rủi ro phát sinh từ trạng thái có thể thay đổi và tham chiếu dùng chung.
    relatedKnowledge:
      - ImmutabilityDefensiveCopy
    objectives:
      - Thiết kế đối tượng bất biến vượt ra ngoài việc chỉ đánh dấu các trường là final.
      - Tạo bản sao phù hợp khi nhận dữ liệu có thể thay đổi vào đối tượng hoặc trả dữ liệu đó ra ngoài để tránh làm lộ trạng thái nội bộ.
  - id: class-object-synthesis
    title: Tổng hợp mô hình lớp và đối tượng
    purpose: Kết nối việc định nghĩa lớp, tạo đối tượng, quan hệ với Object, kiểm soát truy cập, khởi tạo, dùng chung tham chiếu, sao chép và thiết kế bất biến thành một mô hình thống nhất để đọc và thiết kế mã Java.
    relatedKnowledge:
      - ClassObjectSynthesis
    objectives:
      - Giải thích được toàn bộ hành trình từ định nghĩa lớp đến khi một đối tượng được tạo, sử dụng, chia sẻ và bảo vệ trạng thái.
      - Xác định phần kiến thức sâu hơn thuộc OOP, Quy ước của Object, Reflection hoặc ClassLoader để tránh học trùng phạm vi.
