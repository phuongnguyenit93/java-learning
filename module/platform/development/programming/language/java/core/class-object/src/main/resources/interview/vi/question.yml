  - question: "Vì sao Object.clone() và finalization thường không phải lựa chọn mặc định phù hợp cho thiết kế domain hiện đại?"
    answer: "Object.clone() mặc định gắn với shallow copy và có ngữ nghĩa tạo object/bảo toàn các điều kiện để trạng thái luôn hợp lệ khó diễn đạt quyền sở hữu rõ ràng, nên copy constructor, factory, builder hoặc mapper tường minh thường dễ hiểu hơn. Finalization có thời điểm chạy không xác định và đã bị deprecated for removal, nên không nên dùng để quản lý tài nguyên bên ngoài quan trọng. Với việc dọn dẹp tài nguyên, nên ưu tiên cơ chế xác định như AutoCloseable và try-with-resources."
