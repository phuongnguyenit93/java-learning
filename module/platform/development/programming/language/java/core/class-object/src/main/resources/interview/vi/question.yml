  - question: "Với domain object có các điều kiện phải luôn giữ trạng thái hợp lệ (invariant), bạn ưu tiên chiến lược sao chép nào và vì sao?"
    answer: "Ưu tiên copy constructor, factory, builder hoặc mapper tường minh để mô tả rõ field nào được dùng chung, sao chép, biến đổi hoặc kiểm tra lại. Cách này làm quyền sở hữu và các điều kiện cần giữ trạng thái hợp lệ hiện rõ trong code tạo object thông thường. Sao chép toàn bộ bằng serialization hoặc Object.clone() có thể che mất các quyết định đó. Chiến lược tốt phụ thuộc vào hợp đồng của domain, không phụ thuộc vào mục tiêu sao chép cơ học càng sâu càng tốt."
