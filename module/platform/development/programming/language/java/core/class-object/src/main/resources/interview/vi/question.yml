  - question: "Enum constant có thể hoạt động như một tập chiến lược đóng như thế nào, và enumBehavior() cho thấy điều gì?"
    answer: "Enum có thể implement interface và mỗi constant có thể cung cấp phần thân method khác nhau. FeeTier.STANDARD và FeeTier.PREMIUM cùng thỏa FeePolicy nhưng tính phí khác nhau, nên code gọi làm việc với một hợp đồng có kiểu rõ ràng trên một tập giá trị đóng đã biết. enumBehavior() còn cho thấy identity qua valueOf() và thứ tự khai báo qua values()."
