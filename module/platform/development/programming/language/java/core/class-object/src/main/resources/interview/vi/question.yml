questions:
  - question: "Giải thích mối quan hệ giữa class, object, reference, identity và trạng thái."
    answer: "Class định nghĩa kiểu và cách triển khai. Object là một instance khi chương trình chạy, có identity và trạng thái riêng. Biến tham chiếu giữ giá trị reference để trỏ tới object. Nhiều reference có thể cùng trỏ tới một object, còn hai object khác nhau vẫn có thể có trạng thái bằng nhau."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.ClassObject/ClassObject.md", anchor: "class-object-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Constructor nên bảo đảm điều gì trước khi object được công bố ra bên ngoài?"
    answer: "Constructor nên thiết lập các điều kiện cần thiết để trạng thái luôn hợp lệ (invariant) và khởi tạo trạng thái mà object sở hữu. Công bố this hoặc đăng ký callback quá sớm có thể làm lộ một object chưa được khởi tạo hoàn chỉnh, vì vậy quá trình tạo object nên hoàn tất trước khi code bên ngoài quan sát nó."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Constructor/Constructor.md", anchor: "constructor-purpose"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Mô tả thứ tự khởi tạo instance qua lớp cha và lớp con."
    answer: "Các field bắt đầu với giá trị mặc định của JVM. Phần lớp cha được khởi tạo trước. Ở mỗi cấp class, instance field initializer và instance initializer block chạy theo thứ tự xuất hiện trong source code trước phần thân constructor. Thứ tự này giải thích vì sao dynamic dispatch từ constructor có thể nguy hiểm."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.InitializationOrder/InitializationOrder.md", anchor: "inheritance-initialization-order"}
    apiRelated: {controller: "InitializationController", methodSignature: "traceOrder()"}

  - question: "Vì sao quyền truy cập protected phức tạp hơn private, package-private và public khi đi qua ranh giới package?"
    answer: "Subclass ở package khác chỉ được truy cập protected theo ngữ cảnh subclass và quy tắc của biểu thức đứng trước member; nó không thể tùy ý truy cập protected member qua mọi instance của lớp cha. Quyền truy cập từ cùng package là một trường hợp riêng."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.AccessModifier/AccessModifier.md", anchor: "protected-cross-package"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao enum không chỉ là một nhóm hằng số nguyên?"
    answer: "Mỗi enum constant là một instance của enum type. Enum có thể có field, constructor, method, implement interface và cung cấp hành vi riêng cho từng constant, đồng thời vẫn giữ một tập hữu hạn các instance có tên với identity ổn định."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "11.Enum/Enum.md", anchor: "enum-type-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Deep copy nên được hiểu thế nào trong một domain model thực tế?"
    answer: "Deep copy nên sao chép phần trạng thái mutable mà object mới cần sở hữu độc lập. Giá trị bất biến có thể dùng chung; cấu trúc có vòng lặp cần được xử lý cẩn thận; tài nguyên bên ngoài có thể không sao chép được. Độ sâu sao chép là một phần của hợp đồng quyền sở hữu, không phải quy tắc đệ quy áp dụng giống nhau cho mọi object."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "12.CopySemantics/CopySemantics.md", anchor: "deep-copy"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Aliasing và trạng thái mutable kết hợp tạo ra sự phụ thuộc ẩn như thế nào?"
    answer: "Nếu nhiều reference cùng trỏ tới một object mutable, một thành phần có thể thay đổi trạng thái mà thành phần khác nhìn thấy dù không có bước truyền dữ liệu tường minh. Quy tắc quyền sở hữu, đóng gói, tính bất biến và sao chép phòng vệ giúp giảm kiểu phụ thuộc này."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "13.ObjectAliasingMutability/ObjectAliasingMutability.md", anchor: "aliasing-model"}
    apiRelated: {controller: "AliasingController", methodSignature: "mutateAlias()"}

  - question: "Vì sao một field final chưa đủ để bảo đảm tính bất biến sâu?"
    answer: "final chỉ ngăn việc gán lại reference của field. Object được tham chiếu vẫn có thể bị thay đổi qua reference này hoặc qua alias khác. Tính bất biến sâu yêu cầu phần trạng thái còn truy cập được phải bất biến, hoặc được sở hữu độc quyền và không bị thay đổi sau khi object được tạo xong."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "14.ImmutabilityDefensiveCopy/ImmutabilityDefensiveCopy.md", anchor: "deep-immutability"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao mô hình class/object của Java đặt trạng thái và hành vi cùng nhau thay vì để code gọi thao tác trực tiếp mọi dữ liệu?"
    answer: "Lợi ích cốt lõi là object có thể sở hữu và bảo vệ các điều kiện để trạng thái luôn hợp lệ (invariant). Nếu BankAccount công khai balance để mọi nơi sửa tự do, mỗi nơi gọi phải tự nhớ các quy tắc như không được rút quá số dư. Khi trạng thái và các thao tác bảo vệ trạng thái nằm sau ranh giới object, các quy tắc được tập trung ở một nơi và trạng thái không hợp lệ khó xuất hiện hơn. Điều đó không có nghĩa mọi field đều cần getter/setter; ranh giới hữu ích nằm ở hành vi và ràng buộc mà object thực sự sở hữu."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.ClassObject/ClassObject.md", anchor: "class-object-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vòng đời object khác phạm vi của một biến tham chiếu thế nào, và vì sao tài nguyên bên ngoài không nên phụ thuộc vào GC?"
    answer: "Một biến local có thể ra khỏi phạm vi nhưng object vẫn còn được truy cập qua reference khác, nên việc object có đủ điều kiện để GC thu gom phụ thuộc vào reachability chứ không chỉ vào phạm vi từ vựng của một biến. File, socket và các tài nguyên bên ngoài tương tự cần được giải phóng theo cách xác định vì thời điểm GC chạy không xác định và khả năng truy cập bộ nhớ không phải hợp đồng quản lý tài nguyên. Với loại tài nguyên này nên dùng cơ chế dọn dẹp tường minh như AutoCloseable và try-with-resources."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.ClassObject/ClassObject.md", anchor: "object-reference-lifecycle"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Khác nhau giữa constructor nạp chồng, constructor mặc định và lời gọi super() ngầm định là gì?"
    answer: "Constructor nạp chồng là các constructor do ta khai báo với danh sách tham số khác nhau. Constructor mặc định là constructor không tham số do trình biên dịch sinh khi class không khai báo constructor nào. Với class có lớp cha, nếu constructor không bắt đầu bằng this(...) hoặc super(...), Java chèn lời gọi super() không tham số; lời gọi này phải trỏ tới constructor lớp cha có thể truy cập thì mã mới biên dịch. Object là class gốc nên không có lớp cha để gọi."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Constructor/Constructor.md", anchor: "default-constructor"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Giải thích this(...) và super(...), và vì sao cả hai không có nghĩa là tạo thêm một object khác."
    answer: "this(...) ủy quyền sang constructor khác trong cùng class; super(...) gọi constructor của lớp cha ở bước tiếp theo của quá trình tạo object. Các lời gọi này tạo thành một chuỗi constructor cho cùng một object đang được tạo. super không trỏ tới một object lớp cha thứ hai nằm bên trong object lớp con; phần lớp cha và lớp con chỉ là các phần được khởi tạo của cùng một identity."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ThisSuper/ThisSuper.md", anchor: "constructor-chaining-order"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Khi nào trạng thái nên là static thay vì thuộc từng instance, và trạng thái static mutable mang rủi ro gì?"
    answer: "Dùng trạng thái instance khi giá trị thuộc về từng object, ví dụ balance của một tài khoản. Dùng trạng thái static khi giá trị thực sự thuộc về khái niệm ở cấp class chứ không thuộc một object nhận lời gọi cụ thể. Trạng thái static mutable được dùng chung giữa các instance nên làm tăng mức phụ thuộc, gây ảnh hưởng chéo giữa test, làm vòng đời khó quản lý hơn và tăng rủi ro đồng thời. static nên phản ánh quyền sở hữu, không nên chỉ là lối tắt để tạo truy cập toàn cục."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.StaticFinal/StaticFinal.md", anchor: "static-vs-instance"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Vì sao final List<String> tags chưa đủ để làm BankAccount trở thành bất biến?"
    answer: "final chỉ ngăn reference của field bị gán lại sau lần gán hợp lệ; nó không đóng băng object List. Code còn giữ reference tới List vẫn có thể thêm hoặc xóa phần tử nếu quyền sở hữu và cách làm lộ reference không được kiểm soát. Vì vậy tính bất biến phụ thuộc vào cả đồ thị object còn truy cập được và các alias, không chỉ vào modifier final trên object bên ngoài."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.StaticFinal/StaticFinal.md", anchor: "final-variable-reference"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Khởi tạo class và khởi tạo instance khác nhau thế nào?"
    answer: "Khởi tạo class chuẩn bị trạng thái static và khi cần sẽ khởi tạo lớp cha trước; các static field initializer và static block sau đó chạy theo thứ tự xuất hiện trong source code. Khởi tạo instance xảy ra cho từng object được tạo. Sau khi phần lớp cha hoàn tất, instance field initializer và instance initializer block của class hiện tại chạy theo thứ tự source trước phần thân constructor. Nhầm lẫn hai vòng đời này dễ dẫn tới kỳ vọng sai về thời điểm trạng thái sẵn sàng."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.InitializationOrder/InitializationOrder.md", anchor: "class-initialization-order"}
    apiRelated: {controller: "InitializationController", methodSignature: "traceOrder()"}

  - question: "Initializer block hữu ích khi nào, và khi nào nó làm quá trình tạo object khó hiểu hơn?"
    answer: "Field initializer đơn giản thường rõ nhất cho trạng thái mặc định đơn giản; constructor hoặc helper thường rõ hơn khi cần kiểm tra dữ liệu hay thiết lập có ngữ cảnh. Instance initializer có thể hữu ích khi nhiều constructor thực sự dùng chung một bước khởi tạo nhỏ; static initializer phù hợp cho bước thiết lập ở cấp class khó biểu diễn bằng một biểu thức. Chúng trở thành vấn đề khi logic quan trọng, I/O hoặc tác dụng phụ bị giấu ở nơi người đọc khó đoán."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.InitializationBlocks/InitializationBlocks.md", anchor: "initializer-use-cases"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Khác nhau giữa việc bộ nhớ đã được cấp phát/gán giá trị mặc định và việc một object đã được tạo hợp lệ là gì?"
    answer: "Bước cấp phát tạo vùng nhớ cho object và các instance field ban đầu nhận giá trị mặc định của JVM như 0, false hoặc null. Điều đó chưa có nghĩa các điều kiện để trạng thái của class luôn hợp lệ đã được thiết lập. Constructor lớp cha, các field/initializer và phần thân constructor vẫn phải hoàn tất thành công. Vì vậy code quan sát object quá sớm có thể thấy một object đã có bộ nhớ nhưng trạng thái về mặt nghiệp vụ hoặc ngữ nghĩa vẫn chưa hợp lệ."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.ObjectCreationLifecycle/ObjectCreationLifecycle.md", anchor: "allocation-initialization-construction"}
    apiRelated: {controller: "ConstructionController", methodSignature: "constructorDispatchRisk()"}

  - question: "Dùng constructorDispatchRisk() để giải thích vì sao dynamic dispatch từ constructor có thể nguy hiểm."
    answer: "Parent() gọi hook(), và dynamic dispatch đi tới Child.hook() vì object thực tế là Child. Nhưng field initializer của Child chưa chạy nên method override nhìn thấy value vẫn ở giá trị mặc định 0. Sau khi tạo object xong, value là 42. API cố ý cho thấy cả hai giá trị. Rủi ro nằm ở việc dispatch hoạt động trước khi các điều kiện để trạng thái lớp con luôn hợp lệ được thiết lập đầy đủ."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.ObjectCreationLifecycle/ObjectCreationLifecycle.md", anchor: "constructor-dynamic-dispatch-risk"}
    apiRelated: {controller: "ConstructionController", methodSignature: "constructorDispatchRisk()"}

  - question: "this escape là gì, và vì sao nó đặc biệt nguy hiểm trong code đồng thời?"
    answer: "this escape là việc công bố reference tới object trước khi constructor hoàn tất, ví dụ đăng ký this vào listener hoặc registry toàn cục ngay trong constructor. Code khác có thể quan sát object khi các điều kiện để trạng thái luôn hợp lệ chưa được thiết lập đầy đủ. Trong môi trường nhiều thread, việc công bố quá sớm còn liên quan đến khả năng nhìn thấy dữ liệu và quy tắc công bố an toàn, nên thread khác có thể thấy trạng thái trước khi object được công bố đúng cách. Chi tiết Java Memory Model thuộc module concurrency, nhưng ranh giới của quá trình tạo object cần được tôn trọng ngay từ đây."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.ObjectCreationLifecycle/ObjectCreationLifecycle.md", anchor: "this-escape"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Khi nào nên chọn static nested class thay vì non-static inner class?"
    answer: "Chọn static nested class khi kiểu chỉ cần được nhóm tên bên trong outer type nhưng không cần trạng thái của một outer object cụ thể; cách này tránh quan hệ ngầm với outer instance. Chọn non-static inner class khi mỗi instance lồng thực sự thuộc về và cần truy cập một outer instance cụ thể. Việc giữ inner object cũng có thể khiến outer object tiếp tục còn được truy cập."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.NestedInnerClass/NestedInnerClass.md", anchor: "static-nested-class"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "capture() cho thấy điều gì về biến local effectively final so với field của instance bao quanh?"
    answer: "LocalCalculator đọc localBase, một biến local trong method chỉ được gán một lần nên effectively final, và outerOffset, một field của controller instance bao quanh. Java giới hạn các biến local được capture, còn instance field được truy cập thông qua ngữ cảnh của object bao quanh. capture() trả về cả hai giá trị đầu vào và kết quả tính toán để khác biệt này có thể quan sát được."
