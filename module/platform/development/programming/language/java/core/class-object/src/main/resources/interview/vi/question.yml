  - question: "Hãy nối toàn bộ mô hình Class/Object từ lúc định nghĩa class đến khi object được chia sẻ và bảo vệ trạng thái."
    answer: "Class định nghĩa trạng thái và hành vi. Quá trình tạo object cấp phát bộ nhớ, gán giá trị mặc định, chạy chuỗi constructor cùng các bước khởi tạo cho tới khi các điều kiện hợp lệ cần thiết hoàn tất. Sau đó reference quyết định cách object được truy cập và chia sẻ; ngữ nghĩa sao chép quyết định phần trạng thái nào còn dùng chung; nhiều reference cùng trỏ tới trạng thái mutable tạo ra mức phụ thuộc; tính bất biến và sao chép phòng vệ giúp kiểm soát ranh giới quyền sở hữu. Các hợp đồng equals/hashCode chi tiết hơn thuộc Object Contract, còn nạp class và khởi tạo class sâu hơn thuộc ClassLoader."
