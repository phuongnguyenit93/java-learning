  - question: "Nói Object là class gốc nghĩa là gì, và một reference có kiểu Object che giấu điều gì?"
    answer: "Mọi class thông thường ngoài Object đều có Object ở đâu đó trong chuỗi lớp cha, nên một reference kiểu Object có thể trỏ tới instance của nhiều class khác nhau. Tuy nhiên, kiểu tại thời điểm biên dịch là Object chỉ cho phép dùng các member thuộc hợp đồng của Object; member riêng của subtype cần thông tin kiểu phù hợp và thường cần ép kiểu hoặc pattern check. Primitive không phải subtype của Object; wrapper type giúp giá trị primitive tham gia các API dựa trên reference."
    aiGenerated: true
