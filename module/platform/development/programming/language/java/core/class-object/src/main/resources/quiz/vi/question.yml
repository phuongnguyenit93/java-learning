questions:
  - id: class-vs-object
    question: "Hai instance Account được tạo từ cùng một class nhưng giữ balance khác nhau. Mental model nào giải thích đúng nhất?"
    answers:
      - {id: A, answer: "Class định nghĩa kiểu và khuôn mẫu triển khai; object là một instance khi chương trình chạy, có định danh (identity) và trạng thái riêng.", explanation: "Đúng. Nhiều object có thể dùng chung một định nghĩa class nhưng mỗi object vẫn có trạng thái riêng."}
      - {id: B, answer: "Class sở hữu một bản dùng chung của mọi instance field, còn mỗi object chỉ là một view lên trạng thái dùng chung đó.", explanation: "Sai. Instance field thuộc từng object; trạng thái dùng chung ở cấp class được mô hình hóa riêng bằng thành viên static."}
      - {id: C, answer: "Object là metadata class đã biên dịch, còn class là vùng cấp phát heap giữ balance của một account.", explanation: "Sai. Cách hiểu này đảo vai trò: class mô tả kiểu, còn object mới là instance tồn tại lúc chạy."}
      - {id: D, answer: "Balance khác nhau chứng tỏ hai giá trị phải đến từ hai class khác nhau vì instance của cùng class dùng chung state.", explanation: "Sai. Các object của cùng một class có thể có instance state độc lập trong khi vẫn dùng chung type definition."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.ClassObject/ClassObject.md", anchor: "class-object-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: constructor-default-rule
    question: "Khi nào Java tự sinh hàm khởi tạo mặc định không tham số?"
    answers:
      - {id: A, answer: "Luôn được sinh, kể cả khi lớp đã khai báo constructor riêng.", explanation: "Sai. Chỉ cần lớp khai báo bất kỳ constructor nào thì trình biên dịch sẽ không sinh constructor mặc định."}
      - {id: B, answer: "Khi lớp không khai báo constructor nào. Constructor mặc định được sinh sẽ ngầm gọi super(); với lớp khác Object, lời gọi đó còn phải hợp lệ thì mã mới biên dịch.", explanation: "Đúng. Điều kiện để constructor mặc định được sinh là lớp không khai báo constructor; khả năng biên dịch của lời gọi super() là bước kiểm tra riêng."}
      - {id: C, answer: "Chỉ với lớp abstract.", explanation: "Sai. Việc lớp có abstract hay không không ảnh hưởng đến quy tắc sinh constructor mặc định."}
      - {id: D, answer: "Chỉ khi mọi field đều final.", explanation: "Sai. Việc field có final hay không không ảnh hưởng đến quy tắc sinh constructor mặc định."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Constructor/Constructor.md", anchor: "default-constructor"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: constructor-chaining
    question: "Quan hệ giữa `this(...)` và `super(...)` trong chuỗi hàm khởi tạo là gì?"
    answers:
      - {id: A, answer: "Cả hai phải xuất hiện thành hai lời gọi liên tiếp ở đầu constructor.", explanation: "Sai. Một constructor chỉ bắt đầu bằng một nhánh ủy quyền; không gọi this(...) và super(...) như hai bước song song."}
      - {id: B, answer: "super tạo một đối tượng lớp cha riêng biệt.", explanation: "Sai. super không tạo đối tượng thứ hai; phần lớp cha và lớp con thuộc cùng một đối tượng."}
      - {id: C, answer: "Với lớp khác Object, constructor hoặc ủy quyền sang constructor khác cùng lớp bằng this(...), hoặc gọi/ngầm gọi constructor lớp cha bằng super(...); chuỗi this(...) cuối cùng phải dẫn tới super(...).", explanation: "Đúng. Chuỗi constructor của cùng một object lần lượt đi qua các constructor cần thiết và cuối cùng đi lên lớp cha; Object là lớp gốc nên không có superclass."}
      - {id: D, answer: "this chỉ dùng trong phương thức static.", explanation: "Sai. this đại diện cho object hiện tại và không tồn tại trong ngữ cảnh static."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ThisSuper/ThisSuper.md", anchor: "constructor-chaining-order"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: protected-cross-package
    question: "Mô tả nào về quyền truy cập protected giữa các package là chính xác?"
    answers:
      - {id: A, answer: "protected hoạt động giống public khi truy cập từ package khác.", explanation: "Sai. protected có quy tắc riêng khi truy cập qua ranh giới package, đặc biệt với subclass."}
      - {id: B, answer: "protected chỉ nhìn thấy bên trong chính class khai báo member đó.", explanation: "Sai. protected còn cho phép truy cập trong cùng package và trong một số ngữ cảnh của subclass."}
      - {id: C, answer: "Mọi class không liên quan đều có thể truy cập field protected qua bất kỳ instance nào.", explanation: "Sai. Class không liên quan ở package khác không có quyền truy cập như vậy."}
      - {id: D, answer: "Subclass ở package khác được truy cập protected theo ngữ cảnh subclass và quy tắc của biểu thức đứng trước member, không phải tùy ý qua mọi instance của lớp cha.", explanation: "Đúng. protected có quy tắc chặt hơn việc hiểu đơn giản là 'package cộng mọi subclass'."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.AccessModifier/AccessModifier.md", anchor: "protected-cross-package"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: final-reference-mutability
    question: "`final List<String> names = new ArrayList<>();` bảo đảm điều gì?"
    answers:
      - {id: A, answer: "Biến names không thể được gán lại sang List khác, nhưng object List mà nó tham chiếu tới vẫn có thể thay đổi.", explanation: "Đúng. final giới hạn việc gán lại biến tham chiếu; nó không làm object được tham chiếu trở thành bất biến sâu."}
      - {id: B, answer: "List trở thành bất biến sâu (deep immutable).", explanation: "Sai. final không ngăn các thao tác thay đổi nội dung của List."}
      - {id: C, answer: "Mọi phần tử thêm vào List đều tự động trở thành final.", explanation: "Sai. final áp dụng cho biến names, không tự áp dụng cho các phần tử bên trong List."}
      - {id: D, answer: "Có thể gán names sang List khác, nhưng không thể thay đổi phần tử.", explanation: "Sai. Điều ngược lại mới đúng: names không thể được gán lại, còn List vẫn có thể thay đổi nếu bản thân List cho phép."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.StaticFinal/StaticFinal.md", anchor: "final-variable-reference"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: initialization-parent-child
    question: "Trong `new Child()`, thứ tự khởi tạo tổng quát nào là đúng?"
    answers:
      - {id: A, answer: "Phần thân constructor của Child chạy trước mọi constructor của lớp cha.", explanation: "Sai. Phần lớp cha phải được khởi tạo trước khi quá trình khởi tạo lớp con hoàn tất."}
      - {id: B, answer: "Quá trình khởi tạo lớp cha chạy trước initializer của instance lớp con và trước phần thân constructor lớp con.", explanation: "Đúng. Khi tạo một object thuộc lớp con, Java khởi tạo phần lớp cha trước rồi mới hoàn tất phần lớp con."}
      - {id: C, answer: "Mọi field của lớp con được khởi tạo trước constructor của lớp cha.", explanation: "Sai. Field initializer của lớp con chạy sau khi constructor lớp cha đã hoàn tất."}
      - {id: D, answer: "Thứ tự constructor là ngẫu nhiên tùy JVM.", explanation: "Sai. Java định nghĩa rõ thứ tự khởi tạo qua chuỗi kế thừa."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.InitializationOrder/InitializationOrder.md", anchor: "inheritance-initialization-order"}
    apiRelated: {controller: "InitializationController", methodSignature: "traceOrder()"}

  - id: constructor-override-risk
    question: "Vì sao gọi một method có thể bị override từ constructor của lớp cha lại có rủi ro?"
    answers:
      - {id: A, answer: "Cơ chế override bị tắt trong lúc object đang được tạo.", explanation: "Sai. Dynamic dispatch vẫn hoạt động trong constructor, nên method override ở lớp con vẫn có thể được gọi."}
      - {id: B, answer: "Nó luôn tạo ra hai object riêng biệt.", explanation: "Sai. Toàn bộ quá trình vẫn đang xây dựng cùng một object."}
      - {id: C, answer: "Dynamic dispatch có thể gọi method override của lớp con trước khi các field của lớp con được khởi tạo tường minh.", explanation: "Đúng. Method override có thể quan sát các field lớp con khi chúng vẫn còn giá trị mặc định của JVM."}
      - {id: D, answer: "JVM bỏ qua constructor của lớp cha.", explanation: "Sai. Constructor lớp cha vẫn chạy; rủi ro nằm ở việc dynamic dispatch xảy ra quá sớm."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.ObjectCreationLifecycle/ObjectCreationLifecycle.md", anchor: "constructor-dynamic-dispatch-risk"}
    apiRelated: {controller: "ConstructionController", methodSignature: "constructorDispatchRisk()"}

  - id: inner-class-outer
    question: "Điểm nào phân biệt non-static inner class với static nested class?"
    answers:
      - {id: A, answer: "static nested class luôn kế thừa outer class.", explanation: "Sai. static nested class chỉ được khai báo bên trong outer class; nó không tự động kế thừa outer class."}
      - {id: B, answer: "Inner class không thể truy cập member của outer class.", explanation: "Sai. non-static inner class gắn với một outer instance và có thể truy cập member của instance đó."}
      - {id: C, answer: "Chỉ static nested class mới có method.", explanation: "Sai. Cả hai loại class lồng đều có thể khai báo method."}
      - {id: D, answer: "non-static inner class gắn với một outer instance và có thể ngầm truy cập trạng thái của outer instance đó.", explanation: "Đúng. static nested class không có tham chiếu ngầm tới một outer instance cụ thể."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.NestedInnerClass/NestedInnerClass.md", anchor: "inner-class"}
