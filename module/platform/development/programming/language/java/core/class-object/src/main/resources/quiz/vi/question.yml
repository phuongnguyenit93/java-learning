  - id: defensive-copy-input
    question: "Vì sao một object bất biến có thể cần sao chép phòng vệ đối số mutable truyền vào constructor?"
    answers:
      - {id: A, answer: "Để constructor chạy hai lần.", explanation: "Sai. Sao chép phòng vệ dùng để kiểm soát trạng thái mutable có thể bị chia sẻ qua reference."}
      - {id: B, answer: "Vì field final không thể lưu object.", explanation: "Sai. Field final vẫn có thể tham chiếu tới object; final chỉ ngăn việc gán lại reference đó."}
      - {id: C, answer: "Để biến so sánh reference thành so sánh primitive.", explanation: "Sai. Sao chép phòng vệ liên quan đến quyền sở hữu và khả năng thay đổi trạng thái, không phải cơ chế so sánh."}
      - {id: D, answer: "Để ngăn code gọi giữ một alias rồi thay đổi trạng thái bên trong object sau khi constructor hoàn tất.", explanation: "Đúng. Tính bất biến đòi hỏi kiểm soát cả trạng thái mutable có thể truy cập qua các reference liên quan."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
