  - id: shallow-copy-nested
    question: "Rủi ro chính của shallow copy khi object chứa một List lồng có thể thay đổi là gì?"
    answers:
      - {id: A, answer: "Shallow copy luôn tạo deep copy cho mọi collection.", explanation: "Sai. Shallow copy sao chép giá trị của từng field; với field tham chiếu, giá trị được sao chép vẫn là cùng một reference."}
      - {id: B, answer: "Object bên ngoài là object mới, nhưng bản gốc và bản sao vẫn có thể cùng tham chiếu tới một List lồng.", explanation: "Đúng. Vì reference tới List được sao chép nguyên giá trị, hai object có thể cùng chia sẻ List đó."}
      - {id: C, answer: "Object bên ngoài mới bắt buộc phải có cùng identity với object gốc.", explanation: "Sai. Bản sao là object khác; vấn đề là các object lồng có thể vẫn được dùng chung."}
      - {id: D, answer: "Field kiểu primitive không thể được sao chép nông.", explanation: "Sai. Giá trị primitive vẫn được sao chép bình thường trong shallow copy."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "12.CopySemantics/CopySemantics.md", anchor: "shallow-copy"}
    apiRelated: {controller: "CopyController", methodSignature: "shallowVsDeep()"}

  - id: aliasing-visible-mutation
    question: "Object aliasing nghĩa là gì?"
    answers:
      - {id: A, answer: "Hai object khác nhau tình cờ có các field bằng nhau.", explanation: "Sai. Aliasing nói về nhiều reference cùng trỏ tới một object, không phải hai object có trạng thái giống nhau."}
      - {id: B, answer: "Một biến được khai báo final.", explanation: "Sai. final và aliasing là hai khái niệm khác nhau."}
      - {id: C, answer: "Nhiều reference cùng trỏ tới một object, nên thay đổi qua một alias có thể được quan sát qua alias khác.", explanation: "Đúng. Aliasing xuất hiện khi nhiều reference cùng nhận diện một object."}
      - {id: D, answer: "Một class có nhiều constructor.", explanation: "Sai. Số lượng constructor không liên quan đến aliasing."}
    correctAnswerId: C
    aiGenerated: true
