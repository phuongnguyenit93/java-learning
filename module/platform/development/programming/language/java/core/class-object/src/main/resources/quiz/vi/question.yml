  - id: defensive-copy-output
    question: "Vấn đề gì xảy ra khi trả trực tiếp một collection nội bộ có thể thay đổi?"
    answers:
      - {id: A, answer: "Nó làm lộ alias, cho phép code gọi thay đổi trạng thái nội bộ ngoài các thao tác mà object sở hữu.", explanation: "Đúng. Nên trả một biểu diễn bất biến, một bản sao, hoặc một view có hợp đồng quyền sở hữu được mô tả rõ."}
      - {id: B, answer: "Nó luôn tự động sao chép collection trước khi trả về.", explanation: "Sai. Trả trực tiếp field mutable thường trả chính reference nội bộ."}
      - {id: C, answer: "Nó tự biến method thành static.", explanation: "Sai. Cách trả collection không quyết định method có static hay không."}
      - {id: D, answer: "Nó ngăn code gọi đọc các phần tử.", explanation: "Sai. Vấn đề chính là code gọi có thể thay đổi collection nội bộ, không phải không đọc được."}
    correctAnswerId: A
