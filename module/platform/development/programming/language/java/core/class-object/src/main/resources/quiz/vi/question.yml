  - id: enum-ordinal-persistence
    question: "Vì sao thường không nên lưu `ordinal()` của enum làm định danh nghiệp vụ lâu dài?"
    answers:
      - {id: A, answer: "Đổi thứ tự hoặc chèn thêm constant có thể làm ordinal thay đổi, khiến dữ liệu đã lưu bị hiểu sai mà không báo lỗi.", explanation: "Đúng. Khi enum đi qua ranh giới lưu trữ hoặc giao thức, nên dùng một mã bên ngoài ổn định được định nghĩa tường minh."}
      - {id: B, answer: "ordinal luôn được sinh ngẫu nhiên.", explanation: "Sai. ordinal phản ánh vị trí khai báo của constant, vì vậy nó có thể đổi khi source code được sắp xếp lại."}
      - {id: C, answer: "Không thể đọc ordinal khi chương trình đang chạy.", explanation: "Sai. Có thể gọi ordinal(), nhưng không nên dùng nó làm định danh bền vững."}
      - {id: D, answer: "Mọi enum constant đều có ordinal bằng 0.", explanation: "Sai. Các constant nhận ordinal theo thứ tự khai báo bắt đầu từ 0."}
    correctAnswerId: A
    aiGenerated: true
