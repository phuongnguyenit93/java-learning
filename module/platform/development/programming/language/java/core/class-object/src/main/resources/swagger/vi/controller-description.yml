ConstructionController:
  description: |-
    <h2>Quá trình tạo đối tượng</h2>
    <p>Quan sát vì sao cơ chế điều phối động (dynamic dispatch) từ hàm khởi tạo lớp cha có thể chạy mã lớp con trước khi trạng thái lớp con được khởi tạo.</p>
  readmeRelated:
    file: 8.ObjectCreationLifecycle/ObjectCreationLifecycle.md
CopyController:
  description: |-
    <h2>Sao chép đối tượng</h2>
    <p>So sánh sao chép nông (shallow copy) và sao chép sâu (deep copy) bằng cách quan sát quyền sở hữu của trạng thái lồng có thể thay đổi.</p>
  readmeRelated:
    file: 12.CopySemantics/CopySemantics.md
EnumController:
  description: |-
    <h2>Kiểu liệt kê (enum)</h2>
