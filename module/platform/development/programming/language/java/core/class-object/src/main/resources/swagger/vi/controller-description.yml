AliasingController:
  description: |-
    <h2>Dùng chung tham chiếu</h2>
    <p>Quan sát cách hai tham chiếu cùng trỏ tới một đối tượng có thể thay đổi, vì vậy chúng có cùng danh tính đối tượng và cùng nhìn thấy thay đổi trạng thái.</p>
