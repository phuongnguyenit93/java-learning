AliasingController:
  mutateAlias():
    execution: |-
      <p><strong>Khái niệm:</strong> Aliasing xảy ra khi nhiều reference cùng nhận diện một mutable object.</p>
      <p><strong>Luồng:</strong> Tạo một <code>BankAccount</code>, gán thêm một reference tới đúng object đó rồi mutate tags thông qua alias.</p>
      <pre><code>BankAccount account = new BankAccount();
      BankAccount alias = account;
      alias.tags().add("VIP");</code></pre>
      <p><strong>Ý nghĩa:</strong> Phép gán chỉ copy reference value; nó không tạo account thứ hai.</p>
      <p><strong>Quan sát:</strong> <code>sameIdentity</code> là true và cả hai danh sách tags đều chứa <code>VIP</code>.</p>
      <p><strong>Kết luận:</strong> Shared mutable state tạo coupling quan sát được giữa các alias.</p>
    usage: true
ConstructionController:
  constructorDispatchRisk():
    execution: |-
      <p><strong>Khái niệm:</strong> Dynamic dispatch vẫn hoạt động khi object đang được construct.</p>
      <p><strong>Luồng:</strong> <code>Parent()</code> gọi <code>hook()</code>; runtime dispatch đi tới <code>Child.hook()</code> trước khi child field initializer gán <code>42</code>.</p>
      <pre><code>Parent() { hook(); }
      int value = 42;
      @Override void hook() { observed = value; }</code></pre>
      <p><strong>Ý nghĩa:</strong> Runtime object đã là <code>Child</code> nhưng subclass initialization chưa hoàn tất.</p>
      <p><strong>Quan sát:</strong> Response cho thấy <code>valueObservedDuringSuperConstructor = 0</code> và <code>valueAfterConstruction = 42</code>.</p>
      <p><strong>Kết luận:</strong> Tránh gọi overridable method từ constructor trừ khi design chủ động chấp nhận partially initialized subclass state.</p>
    usage: true
CopyController:
  shallowVsDeep():
    execution: |-
      <p><strong>Khái niệm:</strong> Shallow copy tạo outer object mới nhưng nested reference vẫn có thể được dùng chung.</p>
      <p><strong>Luồng:</strong> Tạo shallow copy dùng lại List tags và deep copy tạo List mới, sau đó mutate source.</p>
      <pre><code>BankAccount shallowCopy() { return new BankAccount(id, tags); }
      BankAccount deepCopy() { return new BankAccount(id, new ArrayList&lt;&gt;(tags)); }</code></pre>
      <p><strong>Ý nghĩa:</strong> Copy depth là quyết định ownership đối với reachable mutable state.</p>
      <p><strong>Quan sát:</strong> <code>shallowSharesNested</code> là true, <code>deepSharesNested</code> là false và chỉ shallow copy thấy mutation về sau của source.</p>
      <p><strong>Kết luận:</strong> Chọn copy depth theo ownership contract mong muốn, không chỉ theo từ "copy".</p>
    usage: true
EnumController:
  enumBehavior():
    execution: |-
      <p><strong>Khái niệm:</strong> Enum constant là instance thật và có thể có behavior riêng theo từng constant.</p>
      <p><strong>Luồng:</strong> <code>STANDARD</code> và <code>PREMIUM</code> cùng implement <code>FeePolicy</code> nhưng tính fee khác nhau; endpoint đồng thời dùng <code>valueOf</code> và <code>values()</code>.</p>
      <pre><code>enum FeeTier implements FeePolicy {
          STANDARD { public int feeFor(int amount) { return amount / 100; } },
          PREMIUM  { public int feeFor(int amount) { return 0; } }
      }</code></pre>
      <p><strong>Quan sát:</strong> Hai constant trả fee khác nhau, <code>valueOf("PREMIUM") == PREMIUM</code> là true và <code>values()</code> giữ declaration order.</p>
      <p><strong>Kết luận:</strong> Enum có thể mô hình hóa closed typed strategy set; persistence nên dùng stable code riêng thay vì <code>ordinal()</code>.</p>
    usage: true
ImmutabilityController:
  defensiveCopy():
    execution: |-
      <p><strong>Khái niệm:</strong> Defensive copy bảo vệ ownership boundary khỏi mutable alias bên ngoài.</p>
      <p><strong>Luồng:</strong> Copy mutable input của caller vào <code>BankAccountSnapshot</code>, mutate List gốc rồi thử mutate List mà snapshot trả ra.</p>
      <pre><code>BankAccountSnapshot(List&lt;String&gt; input) { tags = List.copyOf(input); }
      List&lt;String&gt; tags() { return tags; }</code></pre>
      <p><strong>Ý nghĩa:</strong> Copy input cắt caller alias; stored List không sửa được ngăn output mutation qua accessor.</p>
      <p><strong>Quan sát:</strong> Caller input có thêm <code>VIP</code>, storedSnapshot không đổi và <code>returnedCollectionMutable</code> là false.</p>
      <p><strong>Kết luận:</strong> final field chưa đủ tạo immutability; reachable mutable state và alias cũng phải được kiểm soát.</p>
    usage: true
InitializationController:
  traceOrder():
    execution: |-
      <p><strong>Khái niệm:</strong> Superclass construction xảy ra trước subclass field/block initialization và subclass constructor body.</p>
      <p><strong>Luồng:</strong> Tạo <code>Child</code>; parent constructor ghi trace trước, sau đó child field initialization, child instance initialization và child constructor ghi theo runtime order.</p>
      <pre><code>private final int field = initField();
      { trace.add("child-instance-initializer"); }
      Child(List&lt;String&gt; trace) { super(trace); trace.add("child-constructor"); }</code></pre>
      <p><strong>Quan sát:</strong> <code>instanceConstruction</code> là <code>[parent-constructor, child-field-initializer, child-instance-initializer, child-constructor]</code>; static initialization được trả riêng.</p>
      <p><strong>Kết luận:</strong> Initialization order là deterministic và giải thích vì sao subclass behavior bị gọi sớm có thể thấy default value.</p>
    usage: true
NestedClassController:
  capture():
    execution: |-
      <p><strong>Khái niệm:</strong> Local class có thể truy cập enclosing-instance state và local variable nếu local variable là final/effectively final.</p>
      <p><strong>Luồng:</strong> <code>LocalCalculator</code> đọc method-local <code>localBase</code> và enclosing field <code>outerOffset</code>, rồi cộng hai giá trị.</p>
      <pre><code>int localBase = 40;
      class LocalCalculator {
          int answer() { return localBase + outerOffset; }
      }</code></pre>
      <p><strong>Quan sát:</strong> Response cho thấy <code>capturedLocal = 40</code>, <code>outerInstanceValue = 2</code> và <code>computed = 42</code>.</p>
      <p><strong>Kết luận:</strong> Captured local phải final/effectively final, còn field được truy cập qua enclosing object context.</p>
    usage: true
