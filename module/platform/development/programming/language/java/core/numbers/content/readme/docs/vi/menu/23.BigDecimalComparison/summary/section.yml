  | Tên | compareTo so sánh giá trị số | equals đồng thời xét giá trị và scale | Ví dụ 2.0 và 2.00 theo từng cách so sánh | hashCode và hệ quả trong HashSet hoặc HashMap | Thứ tự tự nhiên không nhất quán với equals | Hệ quả khi dùng TreeSet hoặc TreeMap | Chính sách chuẩn hóa scale trước khi lưu hoặc so sánh | Kiểm tra số 0 bằng signum hoặc compareTo | So sánh null và lựa chọn hợp đồng API | Không thay đổi equals toàn hệ thống chỉ để giải quyết một phép so sánh cụ thể |
  | Vấn đề cần hiểu | Thứ tự compareTo | Equals xét cả scale | Ví dụ 2.0/2.00 | HashCode và khóa | Comparable consistency | TreeSet/TreeMap gộp khóa | Scale normalization policy | Zero và signum | Null comparison contract | Không đổi equals toàn hệ thống |
  | Giá trị đối với OOP/module | So sánh decimal chính xác | Giữ đúng equality biểu diễn | Minh họa thực nghiệm equality | Tránh cache miss và gộp sai | Thiết kế ordering hợp lệ | Tránh ghi đè ngoài ý muốn | Bảo toàn số học khi lưu | Phòng sai zero hoặc chia cho 0 | Tránh đồng nhất null với 0 | Bảo vệ identity và hash contract |
  | Tư duy hình thành | Quan tâm giá trị thay vì scale | Tách nghĩa bằng nhau theo số và representation | Phân biệt tham chiếu, số và scale | Chuẩn hóa nhất quán khi tạo và tra khóa | Phân biệt equivalence của thứ tự với equality | Đọc quy tắc comparator khi thao tác | Tách canonicalization và rounding | Xác định giá trị trước/sau rounding | Phân biệt unknown với equality | Giới hạn chính sách equality theo nghiệp vụ |
