  | Vấn đề cần hiểu | Giá trị có dùng để tính toán không? | Giá trị, kiểu và bit lưu khác nhau ở đâu? | Ba họ số tuân quy tắc tính nào? | Miền biểu diễn khác độ phân giải ra sao? | Các kiểu primitive, wrapper, Number liên hệ thế nào? | Ra quyết định chọn kiểu theo điều gì? | Chuẩn bị và ôn theo thứ tự nào? | Làm sao chứng minh API chạy trên JDK đích? |
  | Giá trị đối với OOP/module | Đặt đúng ngữ nghĩa miền cho trường dữ liệu | Tránh nhầm thuộc tính kiểu với lưu trữ JVM | Chọn đúng quy tắc số học và làm tròn | Xác định biên và sai số cần kiểm thử | Thiết kế tham số và đối tượng số an toàn | Đặt hợp đồng tính toán, API và lưu trữ | Chuẩn bị nền tảng và điều phối lộ trình | Bảo đảm module tương thích API/runtime |
  | Tư duy hình thành | Suy nghĩ từ ý nghĩa đại lượng | Tách mức trừu tượng của dữ liệu | Dự đoán hành vi phép toán | Đo được giới hạn biểu diễn | Nhận diện hợp đồng đối tượng và conversion | Quyết định có căn cứ và thử biên | Tự chẩn đoán và học có bằng chứng | Xác minh dựa trên tài liệu phiên bản |