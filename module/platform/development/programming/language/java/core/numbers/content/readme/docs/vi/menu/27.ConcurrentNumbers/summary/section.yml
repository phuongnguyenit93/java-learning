version: 1
type: LEARNING_ROADMAP
title: "SỐ VÀ ĐỒNG THỜI — LIÊN KẾT BÀI HỌC"
roadmapHeading: "Mạch liên kết bài học"
roadmap:
  - id: concurrent-numbers-001
    order: 1
    title: "count++ là nhiều bước, không phải thao tác nguyên tử"
    description: "Giải thích read–modify–write của count++, lịch lost update, join và hai phương án sửa bằng synchronized hoặc AtomicInteger."
    transition:
      to: concurrent-numbers-002
      description: "Từ phép tăng bị mất cập nhật chuyển sang phân biệt visibility của volatile với atomicity."
  - id: concurrent-numbers-002
    order: 2
    title: "volatile không làm phép tăng trở thành nguyên tử"
    description: "Làm rõ volatile/JMM, happens-before, visibility so với atomicity, và sửa lost update bằng các primitive concurrency."
    transition:
      to: concurrent-numbers-003
      description: "Sau khi biết giới hạn volatile, khám phá AtomicInteger và AtomicLong cho một bộ đếm nguyên tử."
  - id: concurrent-numbers-003
    order: 3
    title: "AtomicInteger và AtomicLong"
    description: "Giới thiệu AtomicInteger, AtomicLong, CAS, trả giá trị cũ/mới và giới hạn đối với nhiều biến hoặc overflow."
    transition:
      to: concurrent-numbers-004
      description: "Từ lớp atomic và các API cơ bản đi sâu vào giá trị trả về và phép cập nhật qua hàm."
  - id: concurrent-numbers-004
    order: 4
    title: "getAndIncrement, incrementAndGet và các phép cập nhật"
    description: "Đào sâu getAndIncrement/incrementAndGet, add/update/accumulate, CAS và hàm cập nhật nguyên tử."
    transition:
      to: concurrent-numbers-005
      description: "Sau các API cập nhật, phân tích CAS retry và yêu cầu callback không có side effect."
  - id: concurrent-numbers-005
    order: 5
    title: "Compare-and-set và việc hàm cập nhật có thể bị gọi lại"
    description: "Giải thích compare-and-set, callback retry, tác dụng phụ, ABA và vòng lặp cập nhật có điều kiện."
    transition:
      to: concurrent-numbers-006
      description: "Khi hiểu CAS dưới contention, mở rộng lựa chọn sang adder cho thống kê nhiều writer."
  - id: concurrent-numbers-006
    order: 6
    title: "LongAdder, DoubleAdder và bài toán thống kê có tranh chấp"
    description: "Lựa chọn LongAdder, DoubleAdder cho metrics tranh chấp cao; thêm theo nhãn, đọc tổng/reset và giới hạn precision."
    transition:
      to: concurrent-numbers-007
      description: "Từ hiệu năng cộng dồn chuyển sang giới hạn snapshot của sum() và sumThenReset()."
  - id: concurrent-numbers-007
    order: 7
    title: "sum của adder không phải snapshot nguyên tử trong lúc đang cập nhật"
    description: "Đào sâu hợp đồng sum/sumThenReset của adder, ranh giới snapshot, quota và cách chốt số liệu chính xác."
    transition:
      to: concurrent-numbers-008
      description: "Rời mô hình số primitive để cập nhật đồng thời giá trị BigInteger và BigDecimal bất biến."
  - id: concurrent-numbers-008
    order: 8
    title: "BigInteger, BigDecimal bất biến nhưng cập nhật tham chiếu dùng chung vẫn cần phối hợp"
    description: "BigInteger/BigDecimal immutable dưới chia sẻ nhưng cập nhật holder cần synchronized hoặc AtomicReference và precision policy."
    transition:
      to: concurrent-numbers-009
      description: "Từ sự an toàn của cập nhật tham chiếu, xét độ đúng số học và tràn tại biên atomic."
  - id: concurrent-numbers-009
    order: 9
    title: "Atomic không có nghĩa tự phát hiện tràn số"
    description: "Tách atomicity khỏi arithmetic correctness, kết hợp Math.*Exact với CAS/updateAndGet và chính sách overflow."
    transition:
      to: concurrent-numbers-010
      description: "Sau khi kết hợp atomic và checked arithmetic, tổng hợp cách chọn cơ chế theo hợp đồng nhất quán."
  - id: concurrent-numbers-010
    order: 10
    title: "Chọn mức đồng bộ theo hợp đồng nhất quán cần có"
    description: "Tổng hợp các mức đồng bộ theo hợp đồng từ flag, atomic single state, adder metrics đến invariant nhiều trường và DB."
    transition: null
comparisonMarkdown: |-
  ## 2. Bảng đối chiếu các bài học
  
  | Tiêu chí | Bài 1 | Bài 2 | Bài 3 | Bài 4 | Bài 5 | Bài 6 | Bài 7 | Bài 8 | Bài 9 | Bài 10 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Tên | count++ là nhiều bước, không phải thao tác nguyên tử | volatile không làm phép tăng trở thành nguyên tử | AtomicInteger và AtomicLong | getAndIncrement, incrementAndGet và các phép cập nhật | Compare-and-set và việc hàm cập nhật có thể bị gọi lại | LongAdder, DoubleAdder và bài toán thống kê có tranh chấp | sum của adder không phải snapshot nguyên tử trong lúc đang cập nhật | BigInteger, BigDecimal bất biến nhưng cập nhật tham chiếu dùng chung vẫn cần phối hợp | Atomic không có nghĩa tự phát hiện tràn số | Chọn mức đồng bộ theo hợp đồng nhất quán cần có |
  | Vấn đề cần hiểu | Vì sao hai lần count++ có thể chỉ tăng một? | Vì sao volatile không làm tăng số nguyên tử? | AtomicInteger và AtomicLong bảo vệ việc gì? | API nào trả giá trị cũ, mới và cập nhật theo hàm? | Callback CAS vì sao chạy lại và gây side effect nào? | Khi nào adder hữu ích hơn atomic đơn? | Khi nào sum không phản ánh một snapshot duy nhất? | Giá trị immutable có làm cập nhật tham chiếu atomic không? | Tại sao atomic update vẫn làm tràn số? | Hợp đồng nhất quán quyết định công cụ đồng bộ thế nào? |
  | Giá trị đối với OOP/module | Nhận diện race condition ở bộ đếm | Phân biệt quan sát bộ nhớ với cập nhật | Cập nhật một bộ đếm chia sẻ đúng cách | Chọn đúng ngữ nghĩa cập nhật số | Thiết kế cập nhật lock-free đúng | Tối ưu thống kê đông writer | Tránh quyết định nghiệp vụ từ số liệu chưa chốt | Cộng dồn số lớn/tiền an toàn trong JVM | Ngăn giá trị bộ đếm sai tại biên | Thiết kế số liệu nhất quán theo nghiệp vụ |
  | Tư duy hình thành | Tách đọc, tính, ghi và lịch chạy | Xem hợp đồng toàn thao tác, không chỉ từng access | Xác định phạm vi nguyên tử của mỗi API | Tách update đã chốt khỏi giá trị trả về | Phân biệt tính lại với cập nhật thành công | Đánh đổi throughput và tính quan sát | Xác định thời điểm quan sát và ranh giới writer | Tách bất biến của object khỏi trạng thái holder | Kiểm tra miền trong cùng phép cập nhật | Bắt đầu từ invariant và thời điểm cần đúng |
