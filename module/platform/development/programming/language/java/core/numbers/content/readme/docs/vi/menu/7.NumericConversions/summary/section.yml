version: 1
type: LEARNING_ROADMAP
title: "CHUYỂN KIỂU SỐ — MẠCH LIÊN KẾT BÀI HỌC"
roadmapHeading: "Mạch liên kết bài học"
roadmap:
  - id: numeric-conversions-001
    order: 1
    title: "Widening và narrowing giữa các kiểu số"
    description: "Thiết lập bản đồ widening, narrowing, ngoại lệ gán hằng và numeric promotion. Phân biệt tính hợp lệ của cú pháp với khả năng giữ nguyên dữ liệu."
    transition:
      to: numeric-conversions-002
      description: "Từ quy tắc chuyển tự động, phân tích riêng các widening vẫn làm mất đơn vị do giới hạn bit phần trị."
  - id: numeric-conversions-002
    order: 2
    title: "Nâng kiểu vẫn có thể mất độ chính xác khi chuyển sang float hoặc double"
    description: "Phân tích độ chính xác 24/53 bit, hiện tượng hai số nguyên nhập làm một và bẫy so sánh hỗn hợp. Kiểm chứng cả ca cast ngược tại Long.MAX_VALUE."
    transition:
      to: numeric-conversions-003
      description: "Sau khi hiểu sai số phần trị, quan sát một cơ chế mất dữ liệu khác: các bit cao biến mất khi thu hẹp số nguyên."
  - id: numeric-conversions-003
    order: 3
    title: "Thu hẹp số nguyên và các bit bị loại bỏ"
    description: "Giữ n bit thấp khi narrowing integer, giải thích signedness và phép gán kết hợp. Áp dụng mask unsigned và kiểm tra miền trước cast."
    transition:
      to: numeric-conversions-004
      description: "Tiếp tục quy tắc bit với char, nơi 16 bit cùng độ rộng vẫn có cách diễn giải khác short."
  - id: numeric-conversions-004
    order: 4
    title: "Chuyển char với byte hoặc short"
    description: "Làm rõ sự khác biệt signed byte/short và char UTF-16 không dấu. Đối chiếu cast số, chuyển unsigned và giải mã UTF-8 bằng charset."
    transition:
      to: numeric-conversions-005
      description: "Rời narrowing nguyên sang nguyên để học quy tắc riêng khi nguồn là float hoặc double hữu hạn."
  - id: numeric-conversions-005
    order: 5
    title: "Ép float hoặc double sang số nguyên cắt về phía 0"
    description: "Trọng tâm là cắt phần lẻ hướng về 0, khác floor/ceil/round và thời điểm đặt cast. Thực hành kiểm tra double đầu vào trước khi thu hẹp."
    transition:
      to: numeric-conversions-006
      description: "Từ miền hữu hạn hợp lệ, xét các trường hợp NaN, vô cực và vượt cận mà cast xử lý theo quy tắc đặc biệt."
  - id: numeric-conversions-006
    order: 6
    title: "Chuyển NaN, vô cực và số ngoài phạm vi sang kiểu nguyên"
    description: "Giải thích NaN thành 0, vô cực/ngoài miền bị chặn và narrowing tiếp qua int cho các kiểu nhỏ. Kiểm soát cận 2^63 khi xác thực double sang long."
    transition:
      to: numeric-conversions-007
      description: "Tiếp tục từ chuyển thực sang nguyên sang thu hẹp giữa hai kiểu số thực, nơi rounding và overflow hoạt động khác."
  - id: numeric-conversions-007
    order: 7
    title: "Thu hẹp double sang float và mất độ chính xác"
    description: "Phân tích narrowing binary64 sang binary32: độ chính xác 24 bit, ULP, overflow, subnormal và zero có dấu. Phân biệt round-trip exact với kiểm tra sai số theo nghiệp vụ."
    transition:
      to: numeric-conversions-008
      description: "Sau cơ chế primitive, xét các phương thức chuyển của Number và hành vi khác nhau giữa những lớp số."
  - id: numeric-conversions-008
    order: 8
    title: "Chuyển đổi qua Number.intValue, longValue và doubleValue"
    description: "Giải thích ba phương thức Number trả primitive và quy tắc phụ thuộc lớp con thực tế. So sánh wrapper, BigInteger, BigDecimal và các phương thức exact."
    transition:
      to: numeric-conversions-009
      description: "Từ các phương thức chuyển phổ biến, hệ thống hóa sự khác nhau giữa cast, phép làm tròn và yêu cầu exact."
  - id: numeric-conversions-009
    order: 9
    title: "Phân biệt ép kiểu, làm tròn và kiểm tra chuyển đổi exact"
    description: "Đối chiếu cast, rounding và exact với Math, BigDecimal, BigInteger. Thực hành RoundingMode và kiểm tra cả phần lẻ lẫn giới hạn kiểu đích."
    transition:
      to: numeric-conversions-010
      description: "Khép chương bằng ranh giới kiểu dữ liệu: boolean cần phép so sánh và mapping, không có primitive numeric cast."
  - id: numeric-conversions-010
    order: 10
    title: "Không có phép cast trực tiếp giữa kiểu số và boolean"
    description: "Khẳng định boolean đứng ngoài numeric conversion primitive. Thực hành phép so sánh, mapping có kiểm tra, bitmask và Boolean.parseBoolean."
    transition: null
comparisonMarkdown: |-
  ## 2. Bảng đối chiếu các bài học
  
  | Tiêu chí | Bài 1 | Bài 2 | Bài 3 | Bài 4 | Bài 5 | Bài 6 | Bài 7 | Bài 8 | Bài 9 | Bài 10 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Tên | Widening và narrowing giữa các kiểu số | Nâng kiểu vẫn có thể mất độ chính xác khi chuyển sang float hoặc double | Thu hẹp số nguyên và các bit bị loại bỏ | Chuyển char với byte hoặc short | Ép float hoặc double sang số nguyên cắt về phía 0 | Chuyển NaN, vô cực và số ngoài phạm vi sang kiểu nguyên | Thu hẹp double sang float và mất độ chính xác | Chuyển đổi qua Number.intValue, longValue và doubleValue | Phân biệt ép kiểu, làm tròn và kiểm tra chuyển đổi exact | Không có phép cast trực tiếp giữa kiểu số và boolean |
  | Vấn đề cần hiểu | Lúc nào cần cast và Java áp dụng kiểu nào cho biểu thức? | Vì sao widening sang số thực không nhất thiết giữ từng số nguyên? | Bit cao nào mất đi và bit đích được đọc có dấu ra sao? | Vì sao char cùng 16 bit với short mà không đổi giá trị giống nhau? | Cắt về 0 khác phép làm tròn và thứ tự tính như thế nào? | NaN và vô cực thành giá trị nguyên nào, và dữ liệu nào bị che giấu? | Float làm tròn, tràn hoặc mất giá trị nhỏ khi nào? | Lời gọi Number có thể làm mất dữ liệu theo kiểu nguồn nào? | Nên cast, round hay từ chối một chuyển đổi mất giá trị? | Vì sao boolean cần quy tắc ánh xạ thay cho cast? |
  | Giá trị đối với OOP/module | Nền tảng đọc và viết chuyển đổi kiểu primitive | Bảo toàn ID, bộ đếm và giá trị nguyên lớn | Xử lý dữ liệu bit và chuyển đổi nguyên an toàn | Chuyển đổi nhị phân và văn bản chính xác | Đưa phép đo sang số nguyên theo chính sách rõ ràng | Phòng tránh chấp nhận sai dữ liệu đặc biệt | Lựa chọn binary32 theo độ chính xác yêu cầu | Thiết kế API số đa hình có hợp đồng rõ | Chọn chính sách chuyển đổi theo hợp đồng nghiệp vụ | Biểu đạt đúng điều kiện và mã trạng thái |
  | Tư duy hình thành | Tách quy tắc kiểu khỏi tính chính xác của giá trị | Kiểm tra khả năng biểu diễn thay vì tin vào tên widening | Đọc bit-pattern trước khi suy luận giá trị | Tách giá trị số khỏi ký tự và charset | Xác định miền đầu vào trước phép chuyển | Phân tích lần lượt từng giai đoạn cast | Đo sai số theo miền dữ liệu cụ thể | Xem kiểu runtime trước khi suy luận quy tắc chuyển | Tách rounding khỏi kiểm tra tính chính xác | Chọn predicate theo ý nghĩa của dữ liệu |