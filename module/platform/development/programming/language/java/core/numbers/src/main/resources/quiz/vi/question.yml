  - id: floating-decimal-approx
    question: "Vì sao `0.1 + 0.2` có thể khác giá trị thập phân 0.3 chính xác?"
    answers:
      - {id: A, answer: "JVM ngẫu nhiên thay đổi giá trị double.", explanation: "Sai. IEEE 754 dùng dấu phẩy động nhị phân nên nhiều phân số thập phân chỉ được biểu diễn gần đúng."}
      - {id: B, answer: "Phép cộng nội bộ chuyển mọi thứ sang String.", explanation: "Sai. IEEE 754 dùng dấu phẩy động nhị phân nên nhiều phân số thập phân chỉ được biểu diễn gần đúng."}
      - {id: C, answer: "Phần lớn phân số thập phân không có biểu diễn dấu phẩy động nhị phân hữu hạn nên phép toán dùng giá trị biểu diễn gần nhất.", explanation: "Đúng. IEEE 754 dùng dấu phẩy động nhị phân nên nhiều phân số thập phân chỉ được biểu diễn gần đúng."}
      - {id: D, answer: "double lưu chính xác số thập phân, chỉ println làm thay đổi kết quả.", explanation: "Sai. IEEE 754 dùng dấu phẩy động nhị phân nên nhiều phân số thập phân chỉ được biểu diễn gần đúng."}
    correctAnswerId: C
