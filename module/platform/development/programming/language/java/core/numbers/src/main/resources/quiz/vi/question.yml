  - id: nan-comparison
    question: "Cách đúng để kiểm tra một double có phải NaN không?"
    answers:
      - {id: A, answer: "Dùng `value == Double.NaN`.", explanation: "Sai. NaN không tuân theo quan hệ bằng thông thường và ngay cả `NaN == NaN` cũng là false."}
      - {id: B, answer: "Dùng `value > Double.MAX_VALUE`.", explanation: "Sai. NaN không tuân theo quan hệ bằng thông thường và ngay cả `NaN == NaN` cũng là false."}
      - {id: C, answer: "Dùng `value == null`.", explanation: "Sai. NaN không tuân theo quan hệ bằng thông thường và ngay cả `NaN == NaN` cũng là false."}
      - {id: D, answer: "Dùng `Double.isNaN(value)`, không so sánh bằng với `Double.NaN`.", explanation: "Đúng. NaN không tuân theo quan hệ bằng thông thường và ngay cả `NaN == NaN` cũng là false."}
