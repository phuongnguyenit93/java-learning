questions:
  - id: integer-overflow-wrap
    question: "`Integer.MAX_VALUE + 1` làm gì trong phép toán int thông thường?"
    answers:
      - {id: A, answer: "Nó quay vòng thành Integer.MIN_VALUE và không tự ném exception.", explanation: "Đúng. Tràn số nguyên kiểu nguyên thủy quay vòng theo ngữ nghĩa số nguyên có dấu độ rộng cố định, trừ khi dùng phương thức có kiểm tra."}
      - {id: B, answer: "Nó tự thành long.", explanation: "Sai. Tràn số nguyên kiểu nguyên thủy quay vòng theo ngữ nghĩa số nguyên có dấu độ rộng cố định trừ khi dùng phương thức có kiểm tra."}
      - {id: C, answer: "Nó tự ném ArithmeticException.", explanation: "Sai. Tràn số nguyên kiểu nguyên thủy quay vòng theo ngữ nghĩa số nguyên có dấu độ rộng cố định trừ khi dùng phương thức có kiểm tra."}
      - {id: D, answer: "Nó dừng ở Integer.MAX_VALUE.", explanation: "Sai. Tràn số nguyên kiểu nguyên thủy quay vòng theo ngữ nghĩa số nguyên có dấu độ rộng cố định trừ khi dùng phương thức có kiểm tra."}
    correctAnswerId: A
