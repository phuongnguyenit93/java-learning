questions:
  - question: "How would you explain OOP without reducing it to the four-pillar slogan?"
    answer: "OOP decomposes a system into objects with responsibilities, state, behavior, and collaboration boundaries. Encapsulation, inheritance, polymorphism, and abstraction are tools within that model, not the end goal; the goal is localized rules and understandable change."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.MentalModel/MentalModel.md", anchor: "oop-object-collaboration"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "How is encapsulation different from simply making fields private?"
    answer: "Private controls visibility. Encapsulation controls valid access and mutation through a stable abstraction that protects invariants and hides decisions. A class with private fields plus unrestricted setters can still have weak encapsulation."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Encapsulation/Encapsulation.md", anchor: "encapsulation-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "What does substitutability mean in a Java inheritance hierarchy?"
    answer: "Code written against the supertype should continue to behave correctly when given the subtype. That includes honoring invariants, accepted inputs, outputs, side effects, and checked-contract expectations, not only passing the compiler type check."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Polymorphism/Polymorphism.md", anchor: "substitutability"}
    apiRelated: {controller: "SubstitutabilityController", methodSignature: "substituteImplementations()"}

  - question: "Compare overriding, static-method hiding, and field hiding for `Parent x = new Child()`."
    answer: "An overridden instance method dispatches to Child at runtime. A hidden static method and hidden field are selected from the compile-time Parent view. They are different language mechanisms even when accessed through the same expression."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.OverloadingOverriding/OverloadingOverriding.md", anchor: "dispatch-vs-hiding"}
    apiRelated: {controller: "DispatchController", methodSignature: "dispatchVsHiding()"}

  - question: "How do you decide between inheritance and composition?"
    answer: "Use inheritance when the child is a true behavioral subtype and the shared base contract/implementation is valuable. Use composition when you mainly need behavior reuse, replaceable strategies, or looser ownership/coupling without creating an is-a contract."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.Composition/Composition.md", anchor: "composition-vs-inheritance"}
    apiRelated: {controller: "CompositionController", methodSignature: "strategySwap()"}

  - question: "What is the practical difference among dependency, association, aggregation, and composition in Java code?"
    answer: "They communicate increasing relationship/ownership expectations rather than distinct runtime features: temporary use, longer-lived association, weak/shared ownership, and strong ownership/lifecycle. Ordinary references implement them; APIs and lifecycle conventions communicate meaning."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.Composition/Composition.md", anchor: "object-relationships"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "What is the fragile-base-class risk?"
    answer: "Subclasses depend on base-class implementation assumptions, initialization, protected hooks, and overridable behavior. A base change that seems local can alter subclass behavior, so inheritance creates stronger coupling than simple delegation."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.Inheritance/Inheritance.md", anchor: "inheritance-coupling"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "When is an abstraction considered leaky, and is every leak automatically a bug?"
    answer: "It leaks when callers must understand implementation details to use it correctly, such as lifecycle, ordering, provider errors, or performance cliffs. Some constraints are inherently relevant and should be documented; the problem is hiding details that materially affect correctness."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.Abstraction/Abstraction.md", anchor: "abstraction-leak"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "When can a procedural style be clearer than OOP, and when do object boundaries start adding value?"
    answer: "Procedural style is often natural for short algorithms, stateless pipelines, or linear data transformations. Object boundaries add value when state is long-lived, invariants need protection, behavior varies by type, and multiple collaborators evolve together. OOP is not the goal by itself; the useful test is whether responsibilities and change become better localized."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.MentalModel/MentalModel.md", anchor: "oop-vs-procedural"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "A class makes every field private but returns its mutable internal List directly. Is its encapsulation still strong?"
    answer: "Not necessarily. The caller receives an alias to internal representation and can mutate state without going through behavior that protects invariants. Private controls direct member access, while encapsulation must also control reference escape; depending on the contract, use defensive copies, immutable views, or intent-oriented operations."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Encapsulation/Encapsulation.md", anchor: "encapsulation-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "What problem does Tell, Don't Ask address, and why should it not become a ban on getters?"
    answer: "The heuristic keeps domain decisions near the object that owns the relevant state instead of having callers extract data and duplicate rules. That reduces rule leakage and coupling. Reporting, serialization, DTOs, and read models may legitimately expose data; the issue is behavior that belongs to an object's responsibility being pushed into callers, not the existence of every getter."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Encapsulation/Encapsulation.md", anchor: "tell-dont-ask-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Does subtype polymorphism require class inheritance? Explain using an interface."
    answer: "No. `CardPayment implements PaymentMethod` makes `CardPayment` a subtype of the `PaymentMethod` interface; variables or parameters of type `PaymentMethod` can reference a `CardPayment`, and implemented/overridden instance methods still dispatch from the runtime receiver. Class inheritance is one way to create a subtype; interface implementation is another."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Polymorphism/Polymorphism.md", anchor: "subtype-polymorphism"}
    apiRelated: {controller: "PolymorphismController", methodSignature: "dispatch()"}

  - question: "Why can `Parent.execute()` end up running `Child.step()` when `execute()` calls `this.step()`?"
    answer: "Running the body of `Parent.execute()` does not change the runtime receiver into a Parent. `this` still refers to the actual Child object; if `step()` is an overridable instance method, dynamic dispatch uses the receiver's runtime class and selects `Child.step()`. A call such as `super.step()` explicitly selects the supertype implementation instead."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Polymorphism/Polymorphism.md", anchor: "dynamic-dispatch"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Why does the runtime type not make Java reselect an overload, while it can affect an override?"
    answer: "Overload resolution selects a method signature at compile time from static argument types and invocation conversions. After an instance-method signature is resolved, the runtime receiver decides which override body executes. Therefore `Parent x = new Child(); select(x)` can choose `select(Parent)`, while `x.call()` can still execute `Child.call()` when overridden."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.OverloadingOverriding/OverloadingOverriding.md", anchor: "overloading-compile-time"}
    apiRelated: {controller: "DispatchController", methodSignature: "overloadVsOverride()"}

  - question: "What important overriding boundaries apply to visibility, return types, and checked exceptions?"
    answer: "An override cannot reduce accessibility; a reference return type may be covariant, meaning more specific than the parent's return type; and checked exceptions may be preserved, narrowed, or removed but not broadened beyond the parent contract. `private`, `final`, `static`, and constructors have separate semantics and should not all be treated as normal overriding cases."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.OverloadingOverriding/OverloadingOverriding.md", anchor: "override-rules"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "Why is `private final Player captain` not enough to conclude that the relationship is UML composition?"
    answer: "`final` only prevents the field reference from being reassigned; it does not say that `Player` has one owner, cannot be shared, or has a lifecycle tied to `Team`. Aggregation/composition are modeling semantics expressed through creation, exposure, sharing, and lifecycle rules, not a dedicated Java keyword."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.Composition/Composition.md", anchor: "object-relationships"}
    apiRelated: {controller: "", methodSignature: ""}

  - question: "How do composition and delegation differ even though they often appear together?"
    answer: "Composition in the broad object-design sense describes A keeping or collaborating with B; delegation describes an interaction where A hands a specific responsibility to B. `Checkout` having `Pricing` is an object relationship; `Checkout.total()` calling `pricing.price()` delegates the pricing responsibility. Composition does not mean every behavior is delegated."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.Composition/Composition.md", anchor: "delegation"}
    apiRelated: {controller: "CompositionController", methodSignature: "strategySwap()"}

  - question: "Why is an interface with a few methods not enough to guarantee a good abstraction? What else can the contract need to communicate?"
    answer: "The interface keyword is only a mechanism. A useful abstraction must communicate enough behavior for correct use: valid inputs/preconditions, results/postconditions, failure semantics, side effects, and lifecycle or ordering constraints when they affect correctness. If callers still need implementation secrets to use it correctly, the abstraction is weak or leaking."
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.Abstraction/Abstraction.md", anchor: "abstraction-model"}
    apiRelated: {controller: "", methodSignature: ""}
