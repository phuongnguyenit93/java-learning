      - {id: B, answer: "Class hiện có nào đã nhiều method nhất để thêm discount rule vào đó mà không phải tạo type mới?", explanation: "Sai. Số lượng method không chứng minh ownership và có thể biến class vốn đã rộng thành coupling hotspot lớn hơn."}
      - {id: C, answer: "Caller nào nhận raw price trước để mỗi caller tiếp tục giữ một bản discount rule cục bộ?", explanation: "Sai. Giữ policy copy ở nhiều caller bảo toàn chính vấn đề change propagation cần loại bỏ."}
      - {id: D, answer: "Pricing field nào có thể expose để các caller tự phối hợp rule mà không cần một object chịu trách nhiệm?", explanation: "Sai. Expose state đẩy policy ra ngoài và làm boundary yếu hơn thay vì gán responsibility rõ ràng."}
