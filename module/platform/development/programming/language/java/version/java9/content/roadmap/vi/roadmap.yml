# <roadmap-schema>
# Cấu trúc Roadmap Module
# schema-version: 1
#
# YAML CONTRACT
# roadmap: Danh sách milestone cấp cao của roadmap cho language hiện tại. ID milestone phải duy nhất.
#
# - id [string, required]: ID ổn định và duy nhất của milestone trong roadmap language hiện tại.
# - title [string, required]: Tên milestone hiển thị cho learner.
# - purpose [string, required]: Milestone này tồn tại để learner hiểu hoặc đạt được điều gì.
# - dependsOn [list, optional]: Danh sách id milestone prerequisite khi dependency không thể hiện đủ chỉ bằng thứ tự item.
# - objectives [list, optional]: Các learning objective cấp milestone; không dùng để liệt kê mọi fact/API/syntax nhỏ.
# - relatedKnowledge [list, optional]: Danh sách Knowledge category id trong chính module hiện tại hỗ trợ milestone. Portal hiển thị danh sách này ở phía đối diện milestone và click item sẽ điều hướng sang Knowledge category tương ứng.
# - relatedModules [list, optional]: Các module liên quan hiển thị ở Level 2 của Portal. Mỗi item dùng routeId bắt buộc và có thể có label/note localized; relation này chỉ để điều hướng, không tạo child milestone hoặc thay đổi learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - Topic/module này là gì?
#   - Vì sao nó tồn tại?
#   - Không có nó thì learner gặp vấn đề gì?
# FOUNDATION
#   - Learner cần prerequisite hoặc mental model nào trước?
# CORE MODEL
#   - Những abstraction hoặc building block lớn nào tạo nên chủ đề này?
# MECHANICS
#   - Nó hoạt động như thế nào ở mức language/runtime/API phù hợp với module?
# USAGE
#   - Nó được dùng như thế nào trong code thực tế?
# DECISION / TRADE-OFF
#   - Khi nào nên chọn cơ chế này thay vì cơ chế khác?
#   - Khi nào không nên dùng?
# FAILURE / PITFALL
#   - Những sai lầm, compile-time failure hoặc runtime failure nào đáng biết?
# INTEGRATION
#   - Chủ đề này kết nối với những concept/module lân cận nào?
# SYNTHESIS
#   - Sau cùng learner phải giữ mental model end-to-end nào?
#
# Mỗi language tự chịu trách nhiệm cho roadmap của chính nó. Không suy luận hoặc đồng bộ cấu trúc từ roadmap của language khác.
# Thứ tự item trong roadmap chính là thứ tự học mặc định. Chỉ dùng dependsOn khi cần biểu diễn dependency rõ hơn thứ tự tuyến tính.
# Skeleton không nên ép mọi module có đúng bấy nhiêu node. Nó là framework suy nghĩ chứ không phải template cứng.
# </roadmap-schema>

roadmap:
  - id: jshell
    title: JShell
    purpose: Thử nhanh cú pháp và API bằng phản hồi tức thời.
    objectives:
      - Chạy biểu thức, khai báo biến và phương thức
      - Lưu, mở lại và chỉnh sửa các đoạn thử nghiệm
  - id: cai-tien-ngon-ngu
    title: Cải tiến ngôn ngữ
    purpose: Viết mã gọn hơn mà vẫn giữ rõ trách nhiệm.
    objectives:
      - Tái sử dụng mã bằng private method trong interface
      - Dùng biến effectively final trong try-with-resources
      - Áp dụng diamond cho lớp ẩn danh khi hợp lệ
  - id: tap-hop-chi-doc
    title: Tập hợp chỉ đọc
    purpose: Tạo tập hợp nhỏ bằng API chuẩn, ngắn gọn.
    objectives:
      - Dùng List.of, Set.of, Map.of và Map.ofEntries
      - Nhận biết giới hạn null và phần tử trùng
      - Phân biệt cấu trúc chỉ đọc với phần tử khả biến
  - id: stream-va-optional
    title: Stream và Optional
    purpose: Diễn đạt xử lý chuỗi dữ liệu và giá trị vắng mặt rõ hơn.
    objectives:
      - Dùng takeWhile, dropWhile, ofNullable và iterate có điều kiện
      - Kết hợp Optional.stream, or và ifPresentOrElse
  - id: mo-dun-java
    title: Mô-đun Java
    purpose: Khai báo phụ thuộc và ranh giới đóng gói rõ ràng.
    objectives:
      - Viết module-info với requires, exports và opens
      - Phân biệt classpath với module path
      - Phân tích phụ thuộc bằng jdeps và tạo runtime bằng jlink
  - id: varhandle
    title: VarHandle
    purpose: Truy cập biến có kiểm soát về tính nguyên tử và thứ tự bộ nhớ.
    objectives:
      - Tạo VarHandle cho trường hoặc phần tử mảng
      - Phân biệt truy cập thường, volatile và compareAndSet
  - id: api-bat-dong-bo
    title: API bất đồng bộ
    purpose: Điều phối kết quả và kiểm soát tốc độ truyền dữ liệu.
    objectives:
      - Dùng timeout và delayedExecutor của CompletableFuture
      - Mô tả Publisher, Subscriber và Subscription trong Flow
      - Điều khiển nhu cầu nhận dữ liệu bằng request
  - id: quan-ly-tien-trinh
    title: Quản lý tiến trình
    purpose: Theo dõi tiến trình hệ điều hành bằng API chuẩn.
    objectives:
      - Tra cứu PID, thông tin và tiến trình con bằng ProcessHandle
      - Chờ kết thúc qua onExit và kiểm tra quyền khi dừng tiến trình
