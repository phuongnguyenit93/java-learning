questions:
  - id: thread-pool-execution-flow
    question: "Với `ThreadPoolExecutor(core=1, max=2, queueCapacity=1)` đang RUNNING, thứ tự xử lý admission tiêu chuẩn khi submit task mới là gì?"
    answers:
      - id: A
        answer: "Luôn tạo tới max worker trước, sau đó mới dùng queue."
        explanation: "Sai. Queue thường được thử sau khi đạt core, trước khi mở rộng tới maximumPoolSize."
      - id: B
        answer: "Nếu worker < core thì tạo worker; nếu không thì thử enqueue; queue full mới cân nhắc tăng worker tới max; hết capacity thì reject."
        explanation: "Đúng. Đây là flow cốt lõi của ThreadPoolExecutor trong README: core → queue → max → rejection."
      - id: C
        answer: "Nếu queue full, `execute()` mặc định block caller cho đến khi queue trống."
        explanation: "Sai. `execute()` không có contract tự block caller để tạo backpressure."
      - id: D
        answer: "`maximumPoolSize` luôn quyết định worker count ngay cả khi queue còn nhận task."
        explanation: "Sai. Với queue còn nhận task, pool có thể không cần mở rộng tới max."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Thread_Pool_Executor/ThreadPoolExecutor.md"
      anchor: "thread-pool-flow"
    apiRelated:
