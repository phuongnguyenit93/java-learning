# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: thread-pool-execution-flow
    question: "For a running `ThreadPoolExecutor(core=1, max=2, queueCapacity=1)`, what is the normal admission order when a new task is submitted?"
    answers:
      - id: A
        answer: "Always create workers up to max first, then use the queue."
        explanation: "Incorrect. After core workers are reached, the queue is normally tried before expanding toward maximumPoolSize."
      - id: B
        answer: "If workers < core, create a worker; otherwise try to enqueue; if the queue is full, grow workers up to max; if capacity is exhausted, reject."
        explanation: "Correct. This is the core ThreadPoolExecutor flow from the README: core → queue → max → rejection."
      - id: C
        answer: "If the queue is full, `execute()` blocks the caller by default until space becomes available."
        explanation: "Incorrect. `execute()` has no default contract to block the caller as backpressure."
      - id: D
        answer: "`maximumPoolSize` always determines worker count even while the queue can still accept tasks."
        explanation: "Incorrect. If the queue still accepts tasks, the pool may not need to expand to max."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Thread_Pool_Executor/ThreadPoolExecutor.md"
      anchor: "thread-pool-flow"
    apiRelated:
      controller: "ThreadPoolController"
      methodSignature: "executorFlow()"

  - id: executor-execute-vs-submit
    question: "What is an important practical difference between `execute(Runnable)` and `submit(...)` when a task throws an exception?"
    answers:
      - id: A
        answer: "`execute()` always retries the task, while `submit()` never retries."
        explanation: "Incorrect. Retry is not the default semantic difference between these APIs."
      - id: B
        answer: "`submit()` always prints the stack trace to the console immediately."
        explanation: "Incorrect. A submit failure is commonly captured in the Future; if the Future is ignored, the failure may not be observed as the developer expects."
      - id: C
        answer: "`execute()` returns no Future and uncaught task failure follows the worker's uncaught-exception path; `submit()` returns a Future and failure is observed from `get()` as `ExecutionException`."
        explanation: "Correct. This is why submit-and-forget can lose an important failure-observation channel."
      - id: D
        answer: "Only `execute()` accepts Runnable; `submit()` only accepts Callable."
        explanation: "Incorrect. `submit()` has overloads for both Runnable and Callable."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Thread_Pool_Executor/ThreadPoolExecutor.md"
      anchor: "executor-abstraction"
    apiRelated:
      controller: "ThreadPoolController"
      methodSignature: "executeVsSubmit()"

  - id: caller-runs-feedback
    question: "Why can `CallerRunsPolicy` create feedback pressure when a thread pool is saturated?"
    answers:
      - id: A
        answer: "The rejected task runs on the caller thread, occupying the caller and naturally slowing further submissions."
        explanation: "Correct. This is feedback/backpressure at the submission path; it is not the queue making `execute()` block by itself."
      - id: B
        answer: "The policy increases `maximumPoolSize` without limit."
        explanation: "Incorrect. CallerRunsPolicy does not change the maximum pool size."
      - id: C
        answer: "The policy silently drops the newly submitted task."
        explanation: "Incorrect. Silent dropping is characteristic of DiscardPolicy."
      - id: D
        answer: "The policy persists the task to disk for later execution."
        explanation: "Incorrect. Durable fallback must be designed explicitly by the application; CallerRunsPolicy does not provide it."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Thread_Pool_Executor/ThreadPoolExecutor.md"
      anchor: "rejection-policy"
    apiRelated:
      controller: "ThreadPoolController"
      methodSignature: "callerRuns()"

  - id: executor-shutdown-now
    question: "Which statement best describes `ExecutorService.shutdownNow()`?"
    answers:
      - id: A
        answer: "It guarantees immediate termination of every running task, whether the task cooperates or not."
        explanation: "Incorrect. Java interruption is cooperative; uncooperative code may not stop immediately."
      - id: B
        answer: "It waits for every queued task to execute before returning."
        explanation: "Incorrect. `shutdownNow()` tries to prevent queued tasks from starting and returns tasks that never began execution."
      - id: C
        answer: "It resets the executor back to RUNNING after interrupting workers."
        explanation: "Incorrect. Shutdown moves the executor lifecycle toward termination; it is not a reset operation."
      - id: D
        answer: "It attempts to interrupt running tasks and returns tasks that have not started, but it cannot guarantee immediate termination of code that ignores interruption."
        explanation: "Correct. Graceful shutdown still needs bounded waiting, cleanup, and well-defined task cancellation behavior."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Thread_Pool_Executor/ThreadPoolExecutor.md"
      anchor: "graceful-shutdown"
    apiRelated:
      controller: "ThreadPoolController"
      methodSignature: "forcedShutdown()"

  - id: lifecycle-leak-ownership
    question: "Which observation most strongly suggests an executor lifecycle/ownership bug rather than a pool that is only temporarily busy?"
    answers:
      - id: A
        answer: "One worker is WAITING in a thread dump."
        explanation: "Incorrect. WAITING may be perfectly normal for an idle worker in a pool with clear ownership and lifecycle."
      - id: B
        answer: "One request shows a latency increase of a few milliseconds."
        explanation: "Incorrect. A single latency spike is not enough evidence of a leak."
      - id: C
        answer: "Pool size stays stable while completedTaskCount increases."
        explanation: "Incorrect. That can simply show normal worker reuse."
      - id: D
        answer: "Request rate has stabilized, but new pool/thread-name prefixes keep appearing and old pools are never shut down."
        explanation: "Correct. That is a strong signal that resources are being created without an appropriate owner/shutdown lifecycle."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Leak/Leak.md"
      anchor: "lifecycle-rule"
    apiRelated:
      controller: "LeakController"
      methodSignature: "poolLeakPattern()"

  - id: queue-growth-resource-pressure
    question: "A service keeps a stable thread count, but `queueSize` grows continuously because arrival rate exceeds service rate. What is the most reasonable conclusion?"
    answers:
      - id: A
        answer: "The system is definitely safe because worker count is not increasing."
        explanation: "Incorrect. Backlog still retains tasks/objects/context and can increase memory usage and latency even with a stable thread count."
      - id: B
        answer: "This may be saturation/backlog pressure; inspect queue depth, latency, rejection, and downstream capacity rather than only thread count."
        explanation: "Correct. The README emphasizes that queue growth is resource pressure and that bounded capacity plus an overload strategy matter."
      - id: C
        answer: "The best fix is always to make the queue unbounded."
        explanation: "Incorrect. An unbounded queue can merely hide overload by accumulating memory usage and latency."
      - id: D
        answer: "Queue growth only affects CPU and never affects memory."
        explanation: "Incorrect. Queued tasks may retain many heap objects and contextual references."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Leak/Leak.md"
      anchor: "queue-growth"
    apiRelated:
      controller: "LeakController"
      methodSignature: "queuePressure()"

  - id: scheduled-periodic-failure
    question: "A task is scheduled with `scheduleAtFixedRate()`, and one execution throws an unhandled exception. According to the README, what happens to later executions of that same periodic task?"
    answers:
      - id: A
        answer: "The scheduler ignores the failure by default and guarantees all later runs continue."
        explanation: "Incorrect. Production code should not rely on that assumption."
      - id: B
        answer: "Subsequent executions of the same periodic task are suppressed by the scheduled-executor contract."
        explanation: "Correct. That is why production periodic jobs need an explicit error-observation and handling policy."
      - id: C
        answer: "The executor automatically switches the task to fixed-delay mode."
        explanation: "Incorrect. Failure does not automatically change the scheduling mode."
      - id: D
        answer: "The scheduler clones the task onto another worker and retries forever."
        explanation: "Incorrect. That retry behavior is not part of the described semantics."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Thread_Pool_Executor/ThreadPoolExecutor.md"
      anchor: "scheduled-execution"
    apiRelated:
      controller: "ThreadPoolController"
      methodSignature: "scheduledFailure()"

