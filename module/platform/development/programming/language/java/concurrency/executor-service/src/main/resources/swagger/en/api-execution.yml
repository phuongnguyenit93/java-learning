  executorFactories():
    execution: |-
      <p><b>Concept:</b> The endpoint runs bounded samples for four <code>Executors</code> factory methods.</p>
      <ol>
        <li>A fixed pool with two blocked workers queues the remaining submitted tasks.
          <div><i>Source: ThreadPoolService.executorFactoriesDemo()</i></div>
          <pre><code>    public Map&lt;String, Object&gt; executorFactoriesDemo() throws InterruptedException {
                  return map(
                          "fixedThreadPool", fixedPoolFactorySample(),
                          "cachedThreadPool", cachedPoolFactorySample(),
                          "singleThreadExecutor", singleThreadFactorySample(),
                          "scheduledThreadPool", scheduledPoolFactorySample()
                  );
              }</code></pre>
        </li>
        <li>A cached pool receives four simultaneous blocked tasks and grows because no worker is idle.</li>
        <li>A single-thread executor processes three tasks in submission order.</li>
        <li>A scheduled pool runs a task after a requested delay and records the worker and elapsed time.</li>
      </ol>
      <p><b>Conclusion:</b> Compare Executors factory methods. The response and Execution Context are the runtime evidence for this behavior; the colocated source snippet shows the code path that creates the experiment.</p>
    usage: true
  scheduledExecution():
    execution: |-
      <p><b>Concept:</b> The service measures three executions each for fixed-rate and fixed-delay scheduling on a single scheduled worker.</p>
      <ol>
        <li>Both modes use a 30 ms configured interval while each task deliberately sleeps for about 60 ms.
          <div><i>Source: ThreadPoolService.scheduledExecutionModesDemo()</i></div>
          <pre><code>    public Map&lt;String, Object&gt; scheduledExecutionModesDemo() throws InterruptedException {
                  return map(
                          "fixedRate", observePeriodicSchedule(true),
                          "fixedDelay", observePeriodicSchedule(false)
                  );
              }</code></pre>
        </li>
        <li>For fixed rate, missed schedule times do not create overlapping executions on the single worker, so later runs can start as soon as the previous run finishes.</li>
        <li>For fixed delay, each next run waits for the configured delay after the previous run ends.</li>
        <li>The response contains start/end timestamps and the observed inter-run gaps.</li>
      </ol>
      <p><b>Conclusion:</b> Compare fixed-rate and fixed-delay scheduling. The response and Execution Context are the runtime evidence for this behavior; the colocated source snippet shows the code path that creates the experiment.</p>
    usage: true
