LeakController:
  threadLeakPattern():
    execution: |-
      <p><b>Concept:</b> The service creates a thread that waits indefinitely on a latch to model a thread-leak pattern, then bounds the demo with cleanup.</p>
      <ol>
        <li>The worker starts and blocks waiting for a stop latch.
          <div><i>Source: LeakService.threadLeakPatternDemo()</i></div>
          <pre><code>    public Map&lt;String, Object&gt; threadLeakPatternDemo() throws InterruptedException {
                  CountDownLatch stop = new CountDownLatch(1);
                  Thread worker = new Thread(() -&gt; await(stop), "bounded-leak-demo-thread");
                  boolean aliveBeforeCleanup;
                  try {
                      worker.start();
                      waitUntilAlive(worker);
                      aliveBeforeCleanup = worker.isAlive();
                  } finally {
              ...
          }</code></pre>
        </li>
        <li>The service records that the thread is alive and would remain so if the owning code never released it.</li>
        <li>In <code>finally</code>, the latch is released and the worker is joined with a deadline; the response confirms the worker is no longer alive.</li>
      </ol>
      <p><b>Conclusion:</b> Observe a Thread leak pattern safely. The response and Execution Context are the runtime evidence for this behavior; the colocated source snippet shows the code path that creates the experiment.</p>
    usage: true
  poolLeakPattern():
    execution: "<p><b>Concept:</b> A fixed thread pool completes two trivial tasks\
      \ but is intentionally inspected before shutdown.</p>\n<ol>\n  <li>Two tasks\
      \ count down a latch and the caller waits for both to finish.\n    <div><i>Source:\
      \ LeakService.poolLeakPatternDemo()</i></div>\n    <pre><code>    public Map&lt;String,\
      \ Object&gt; poolLeakPatternDemo() throws InterruptedException {\n         \
      \   ExecutorService pool = Executors.newFixedThreadPool(2);\n            CountDownLatch\
      \ tasksDone = new CountDownLatch(2);\n    \n            try {\n            \
      \    pool.execute(tasksDone::countDown);\n                pool.execute(tasksDone::countDown);\n\
      \                if (!tasksDone.await(2, TimeUnit.SECONDS)) {\n            \
      \        throw new IllegalStateException(\"Pool leak demo task không hoàn thà\
      nh đúng hạn.\");\n        ...\n    }</code></pre>\n  </li>\n  <li>The service\
      \ records that the executor is still not shut down after its work is complete,\
      \ illustrating the ownership leak if shutdown were forgotten.</li>\n  <li>The\
      \ <code>finally</code> block performs graceful shutdown with a forced fallback\
      \ if termination takes too long.</li>\n</ol>\n<p><b>Conclusion:</b> Observe\
      \ a pool leak caused by missing shutdown. The response and Execution Context\
      \ are the runtime evidence for this behavior; the colocated source snippet shows\
      \ the code path that creates the experiment.</p>"
    usage: true
  queuePressure():
    execution: |-
      <p><b>Concept:</b> The service creates a single-worker <code>ThreadPoolExecutor</code> with a queue capacity of three and <code>AbortPolicy</code>.</p>
      <ol>
        <li>The worker is occupied by a latch-blocked task.
          <div><i>Source: LeakService.queuePressureDemo()</i></div>
          <pre><code>    public Map&lt;String, Object&gt; queuePressureDemo() throws InterruptedException {
                  CountDownLatch releaseWorker = new CountDownLatch(1);
                  ThreadPoolExecutor executor = new ThreadPoolExecutor(
                          1,
                          1,
                          0,
                          TimeUnit.MILLISECONDS,
                          new LinkedBlockingQueue&lt;&gt;(3),
                          new ThreadPoolExecutor.AbortPolicy()
              ...
          }</code></pre>
        </li>
        <li>Four additional tasks are submitted while the worker remains busy; three fill the bounded queue and the fourth is rejected.</li>
        <li>The response reports queue size and rejection count, then releases the worker and shuts the executor down.</li>
      </ol>
      <p><b>Conclusion:</b> Observe queue backlog and rejection. The response and Execution Context are the runtime evidence for this behavior; the colocated source snippet shows the code path that creates the experiment.</p>
    usage: true
ThreadPoolController:
  executorFlow():
    execution: |-
      <p><b>Concept:</b> The service drives a <code>ThreadPoolExecutor</code> through its core-thread, queue, maximum-thread, and rejection decisions.</p>
      <ol>
        <li>Task 1 creates the single core worker.
          <div><i>Source: ThreadPoolService.executorFlowDemo()</i></div>
          <pre><code>    public Map&lt;String, Object&gt; executorFlowDemo() throws InterruptedException {
                  CountDownLatch releaseTasks = new CountDownLatch(1);
                  ThreadPoolExecutor executor = new ThreadPoolExecutor(
                          1,
                          2,
                          10,
                          TimeUnit.SECONDS,
                          new LinkedBlockingQueue&lt;&gt;(1),
                          namedFactory("flow-worker-"),
              ...
          }</code></pre>
        </li>
        <li>Task 2 is queued because the core worker is busy and the queue has one slot.</li>
        <li>Task 3 causes a second worker to be created up to <code>maximumPoolSize = 2</code>.</li>
        <li>Task 4 arrives with both workers busy and the queue full, so <code>AbortPolicy</code> rejects it; snapshots record pool and queue sizes at each stage.</li>
      </ol>
      <p><b>Conclusion:</b> Observe core, queue, max, and rejection. The response and Execution Context are the runtime evidence for this behavior; the colocated source snippet shows the code path that creates the experiment.</p>
    usage: true
  executeVsSubmit():
    execution: |-
      <p><b>Concept:</b> Two single-thread executors expose the different exception channels of <code>execute()</code> and <code>submit()</code>.</p>
      <ol>
        <li>An <code>execute()</code> task throws, and a custom uncaught-exception handler on the worker records that failure.
          <div><i>Source: ThreadPoolService.executeVsSubmitDemo()</i></div>
          <pre><code>    public Map&lt;String, Object&gt; executeVsSubmitDemo() throws InterruptedException {
                  AtomicReference&lt;Throwable&gt; executeUncaught = new AtomicReference&lt;&gt;();
                  CountDownLatch executeExceptionObserved = new CountDownLatch(1);
                  ThreadFactory executeFactory = runnable -&gt; {
                      Thread thread = new Thread(runnable, "execute-exception-worker");
                      thread.setUncaughtExceptionHandler((ignored, error) -&gt; {
                          executeUncaught.set(error);
                          executeExceptionObserved.countDown();
                      });
              ...
          }</code></pre>
        </li>
        <li>A <code>submit()</code> task throws, but its exception is captured inside the returned <code>Future</code>.</li>
        <li>The caller invokes <code>get()</code>, receives <code>ExecutionException</code>, records its cause, and shuts both executors down.</li>
      </ol>
      <p><b>Conclusion:</b> Compare execute() and submit(). The response and Execution Context are the runtime evidence for this behavior; the colocated source snippet shows the code path that creates the experiment.</p>
    usage: true
