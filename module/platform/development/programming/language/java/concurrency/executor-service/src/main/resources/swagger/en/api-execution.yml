  discardPolicies():
    execution: |-
      <p><b>Concept:</b> Two saturated one-worker executors demonstrate the data-loss semantics of discard rejection policies.</p>
      <ol>
        <li>With <code>DiscardPolicy</code>, a running task occupies the worker, one task fills the queue, and the next task is silently dropped.
          <div><i>Source: ThreadPoolService.discardPoliciesDemo()</i></div>
          <pre><code>    public Map&lt;String, Object&gt; discardPoliciesDemo() throws InterruptedException {
                  return map(
                          "discardPolicy", discardPolicySample(),
                          "discardOldestPolicy", discardOldestPolicySample()
                  );
              }</code></pre>
        </li>
        <li>With <code>DiscardOldestPolicy</code>, the queued oldest task is removed when a newer task arrives, and the newer task takes its place.</li>
        <li>After releasing the worker, counters reveal which queued tasks actually ran.</li>
      </ol>
      <p><b>Conclusion:</b> Compare DiscardPolicy and DiscardOldestPolicy. The response and Execution Context are the runtime evidence for this behavior; the colocated source snippet shows the code path that creates the experiment.</p>
    usage: true
