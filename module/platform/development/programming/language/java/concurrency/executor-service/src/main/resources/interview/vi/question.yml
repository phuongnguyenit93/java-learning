questions:
  - question: >-
      ThreadPoolExecutor xử lý một task mới theo thứ tự nào?
    answer: >-
      Mental model là: nếu worker count nhỏ hơn corePoolSize thì tạo core worker; nếu không thì thử enqueue; nếu queue đầy và worker count còn nhỏ hơn maximumPoolSize thì tạo worker bổ sung; nếu vẫn không nhận được thì đi vào rejection policy. execute() không tự block caller chỉ vì queue đầy. Vì vậy maximumPoolSize thường chỉ phát huy khi queue không còn nhận thêm task.
    aiGenerated: true
    reviewed: false
    readmeRelated:
