questions:
  - question: >-
      In what order does ThreadPoolExecutor handle a newly submitted task?
    answer: >-
      The core mental model is: if worker count is below corePoolSize, create a core worker; otherwise try to enqueue; if the queue is full and worker count is below maximumPoolSize, create an extra worker; otherwise invoke the rejection policy. execute() does not automatically block the caller when the queue is full. Consequently maximumPoolSize usually matters only after the queue stops accepting new tasks.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Thread_Pool_Executor/ThreadPoolExecutor.md"
      anchor: "thread-pool-flow"
    apiRelated:
      controller: "ThreadPoolController"
      methodSignature: "executorFlow()"

  - question: >-
      How do execute() and submit() differ in result and failure observation?
    answer: >-
      execute(Runnable) returns void, and an exception escaping the task follows the worker's uncaught-exception path. submit(Runnable/Callable) returns a Future and captures result or failure in that Future; get() exposes failure through ExecutionException. Therefore submitting an important task and discarding its Future can remove an important failure-observation channel from the application.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Thread_Pool_Executor/ThreadPoolExecutor.md"
      anchor: "executor-abstraction"
    apiRelated:
      controller: "ThreadPoolController"
      methodSignature: "executeVsSubmit()"

  - question: >-
      Can production pool sizing be chosen only from formulas such as CPU-bound = Ncpu and I/O-bound > Ncpu?
    answer: >-
      No. Those formulas are only starting heuristics. Production sizing should consider arrival rate, service time, latency SLO, downstream capacity, memory held by queued tasks, contention and overload behavior. Convenience factories also have trade-offs: fixed and single executors normally use very large queues, while a cached pool can grow platform Threads aggressively with SynchronousQueue. The real queue, capacity and rejection semantics must be understood.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Thread_Pool_Executor/ThreadPoolExecutor.md"
      anchor: "pool-sizing"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      How do scheduleAtFixedRate() and scheduleWithFixedDelay() differ, and what happens when a periodic task throws?
    answer: >-
      Fixed rate tries to maintain cadence based on scheduled start milestones; fixed delay waits for a configured delay after the previous execution completes before scheduling the next one. The same periodic task does not overlap with itself under ScheduledThreadPoolExecutor's contract. If an execution lets an exception escape, later executions of that same periodic task are suppressed, so production jobs need explicit failure observation and handling.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Thread_Pool_Executor/ThreadPoolExecutor.md"
      anchor: "scheduled-execution"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      What overload semantics do ThreadPoolExecutor rejection policies provide?
    answer: >-
      AbortPolicy throws RejectedExecutionException. CallerRunsPolicy executes the task on the caller when the executor has not shut down, creating feedback pressure because submission slows. DiscardPolicy silently drops the new task. DiscardOldestPolicy removes the head of the work queue and retries the new task. The discard policies change business semantics about which work may disappear, so they are appropriate only when that loss is understood and acceptable.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Thread_Pool_Executor/ThreadPoolExecutor.md"
      anchor: "rejection-policy"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      What is the difference between ExecutorService.shutdown() and shutdownNow()?
    answer: >-
      shutdown() stops accepting new tasks while allowing queued and running tasks to continue. shutdownNow() attempts to interrupt running tasks and returns tasks that have not started, but it cannot forcibly stop code that does not cooperate with interruption. An executor created by application code needs a lifecycle owner; awaitTermination is commonly used to bound graceful shutdown before considering a forced shutdown path.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Thread_Pool_Executor/ThreadPoolExecutor.md"
      anchor: "graceful-shutdown"
    apiRelated:
      controller: "ThreadPoolController"
      methodSignature: "forcedShutdown()"

  - question: >-
      When should a Thread, pool or queue be considered a leak or resource-pressure problem, and what should production monitoring inspect?
    answer: >-
      A leak occurs when a concurrency resource outlives its intended owner because lifecycle management is missing, such as a Thread without a cancellation path, a per-request pool without shutdown, duplicated scheduled registration or stale ThreadLocal state. Stable Thread count can still be unsafe when queue backlog grows. Production monitoring should correlate thread and pool counts, active count, queue depth, memory, CPU, rejection and shutdown duration, and compare multiple thread dumps over time to identify the owner and missing lifecycle rule.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Leak/Leak.md"
      anchor: "observability"
    apiRelated:
      controller: ""
      methodSignature: ""

