questions:
  - id: virtual-thread-blocking-model
    question: "Một virtual thread gọi blocking I/O được runtime hỗ trợ unmount. Cách mô tả nào đúng nhất?"
    answers:
      - id: A
        answer: "Blocking call đã trở thành reactive non-blocking API."
        explanation: "Sai. Operation vẫn semantically blocking; chỉ execution cost model thay đổi vì virtual thread có thể được unmount khỏi carrier."
      - id: B
        answer: "Virtual thread vẫn đang chờ về mặt logic, nhưng JVM có thể unmount nó để carrier chạy virtual thread khác."
        explanation: "Đúng. Đây là cách virtual thread hỗ trợ thread-per-task style scale tốt hơn cho nhiều workload chờ/blocking."
      - id: C
        answer: "Carrier thread bị dành riêng cho virtual thread đó cho tới khi I/O xong trong mọi trường hợp."
        explanation: "Sai. Với supported blocking operation, mục tiêu chính là có thể free carrier; pinning là trường hợp cần xem riêng."
      - id: D
        answer: "Không còn bất kỳ Thread object nào liên quan đến task."
        explanation: "Sai. Virtual thread vẫn là Java `Thread`; nó chỉ có implementation/scheduling model nhẹ hơn platform thread."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Virtual_Thread/VirtualThread.md"
      anchor: "mount-unmount"
    apiRelated:
      controller: "VirtualThreadController"
      methodSignature: "blockingScale()"

  - id: virtual-thread-downstream-limit
    question: "Service có thể tạo rất nhiều virtual thread nhưng DB chỉ có 20 connections. Thiết kế nào đúng hơn?"
    answers:
      - id: A
        answer: "Tạo càng nhiều virtual thread càng tốt vì virtual thread làm DB connection trở nên vô hạn."
        explanation: "Sai. Virtual thread không mở rộng capacity của downstream resource như DB pool."
      - id: B
        answer: "Tăng Thread priority của virtual thread để DB phục vụ nhanh hơn."
        explanation: "Sai. Java 2. virtual thread có fixed NORM_PRIORITY và priority cũng không tạo thêm DB capacity."
      - id: C
        answer: "Vẫn giới hạn admission/concurrency theo downstream capacity, ví dụ Semaphore/rate limiter/resource pool phù hợp."
        explanation: "Đúng. Virtual thread giải bài toán thread scalability, không xóa bỏ giới hạn connection, API rate limit, file descriptor hay resource hữu hạn."
      - id: D
        answer: "Bỏ connection pool vì virtual thread đã thay thế mọi loại pool."
        explanation: "Sai. Resource pool và thread pool giải các bài toán khác nhau; DB connections vẫn là resource hữu hạn cần quản lý."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Virtual_Thread/VirtualThread.md"
      anchor: "resource-limits"
    apiRelated:
      controller: "VirtualThreadController"
      methodSignature: "limitedResource()"

  - id: virtual-thread-pinning-java2.
    question: "Trong Java 2., tình huống nào là một pinning risk đáng chú ý đối với virtual thread?"
    answers:
      - id: A
        answer: "Virtual thread thực hiện blocking lâu trong khi đang giữ intrinsic monitor `synchronized`, khiến carrier có thể không được giải phóng như mong muốn."
        explanation: "Đúng. README gắn caveat này cụ thể với Java 2. và nhấn mạnh behavior có thể thay đổi ở JDK mới hơn."
      - id: B
        answer: "Virtual thread gọi `ThreadLocal.get()` một lần."
        explanation: "Sai. ThreadLocal có memory/lifecycle concerns ở scale lớn, nhưng đây không phải pinning rule được mô tả."
      - id: C
        answer: "Virtual thread có tên dài hơn 20 ký tự."
        explanation: "Sai. Thread name không tạo pinning."
      - id: D
        answer: "Virtual thread được tạo bằng `Thread.startVirtualThread(...)` thay vì executor."
        explanation: "Sai. Creation API không phải nguyên nhân pinning."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Virtual_Thread/VirtualThread.md"
      anchor: "pinning-java2."
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: virtual-thread-daemon-priority
    question: "Trong Java 2., phát biểu nào đúng về daemon status và priority của virtual thread?"
    answers:
      - id: A
        answer: "Virtual thread luôn là daemon thread và dùng `Thread.NORM_PRIORITY`."
        explanation: "Đúng. README nhấn mạnh không dùng thread priority như tuning knob cho virtual-thread scalability."
      - id: B
        answer: "Virtual thread luôn là user thread để giữ JVM sống."
        explanation: "Sai. Trong Java 2., virtual thread là daemon thread."
      - id: C
        answer: "Có thể tăng priority virtual thread lên MAX_PRIORITY để tăng downstream capacity."
        explanation: "Sai. Priority cố định ở NORM_PRIORITY, và priority cũng không tạo thêm capacity cho downstream resource."
      - id: D
        answer: "Daemon status của virtual thread thay đổi theo số carrier thread."
        explanation: "Sai. Đây không phải semantics được mô tả."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Virtual_Thread/VirtualThread.md"
      anchor: "virtual-thread-basic"
    apiRelated:
      controller: "VirtualThreadController"
      methodSignature: "basic()"

