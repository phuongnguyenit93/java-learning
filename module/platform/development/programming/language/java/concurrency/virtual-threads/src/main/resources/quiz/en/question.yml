# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: virtual-thread-blocking-model
    question: "A virtual thread calls blocking I/O that the runtime can unmount. Which description is most accurate?"
    answers:
      - id: A
        answer: "The blocking call has become a reactive non-blocking API."
        explanation: "Incorrect. The operation is still semantically blocking; only the execution cost model changes because the virtual thread can be unmounted from its carrier."
      - id: B
        answer: "The virtual thread is still logically waiting, but the JVM may unmount it so the carrier can execute another virtual thread."
        explanation: "Correct. This is how virtual threads help thread-per-task code scale for many waiting/blocking workloads."
      - id: C
        answer: "The carrier is always dedicated to that virtual thread until the I/O finishes."
        explanation: "Incorrect. Supported blocking operations can free the carrier; pinning is a separate case that must be considered."
      - id: D
        answer: "There is no longer any Java Thread object associated with the task."
        explanation: "Incorrect. A virtual thread is still a Java `Thread`; it simply uses a lighter implementation/scheduling model than a platform thread."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Virtual_Thread/VirtualThread.md"
      anchor: "mount-unmount"
    apiRelated:
      controller: "VirtualThreadController"
      methodSignature: "blockingScale()"

  - id: virtual-thread-downstream-limit
    question: "A service can create many virtual threads, but its database pool only has 20 connections. Which design is more appropriate?"
    answers:
      - id: A
        answer: "Create as many virtual threads as possible because virtual threads make database connections effectively unlimited."
        explanation: "Incorrect. Virtual threads do not expand the capacity of downstream resources such as a DB connection pool."
      - id: B
        answer: "Increase the virtual-thread priority so the database serves them faster."
        explanation: "Incorrect. Java 2. virtual threads use fixed NORM_PRIORITY, and thread priority would not create more database capacity anyway."
      - id: C
        answer: "Still limit admission/concurrency according to downstream capacity, using a Semaphore, rate limiter, resource pool, or another suitable mechanism."
        explanation: "Correct. Virtual threads improve thread scalability; they do not remove finite limits such as connections, API rate limits, or file descriptors."
      - id: D
        answer: "Remove the database connection pool because virtual threads replace every kind of pool."
        explanation: "Incorrect. Resource pools and thread pools solve different problems; database connections remain finite resources."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Virtual_Thread/VirtualThread.md"
      anchor: "resource-limits"
    apiRelated:
      controller: "VirtualThreadController"
      methodSignature: "limitedResource()"

  - id: virtual-thread-pinning-java2.
    question: "In Java 2., which situation is a notable pinning risk for a virtual thread?"
    answers:
      - id: A
        answer: "The virtual thread performs long blocking work while holding an intrinsic `synchronized` monitor, preventing the carrier from being released as expected."
        explanation: "Correct. The README ties this caveat specifically to Java 2. and notes that behavior may change in newer JDKs."
      - id: B
        answer: "The virtual thread calls `ThreadLocal.get()` once."
        explanation: "Incorrect. ThreadLocal has memory/lifecycle concerns at large scale, but that is not the pinning rule described here."
      - id: C
        answer: "The virtual thread's name is longer than 20 characters."
        explanation: "Incorrect. Thread naming does not cause pinning."
      - id: D
        answer: "The virtual thread is created with `Thread.startVirtualThread(...)` instead of an executor."
        explanation: "Incorrect. The creation API is not what causes pinning."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Virtual_Thread/VirtualThread.md"
      anchor: "pinning-java2."
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: virtual-thread-daemon-priority
    question: "In Java 2., which statement about virtual-thread daemon status and priority is correct?"
    answers:
      - id: A
        answer: "A virtual thread is always a daemon thread and uses `Thread.NORM_PRIORITY`."
        explanation: "Correct. The README emphasizes that thread priority is not a tuning knob for virtual-thread scalability."
      - id: B
        answer: "A virtual thread is always a user thread so it keeps the JVM alive."
        explanation: "Incorrect. In Java 2., virtual threads are daemon threads."
      - id: C
        answer: "You can raise a virtual thread to MAX_PRIORITY to increase downstream capacity."
        explanation: "Incorrect. Virtual-thread priority is fixed at NORM_PRIORITY, and priority would not create more downstream capacity anyway."
      - id: D
        answer: "A virtual thread's daemon status changes according to the number of carrier threads."
        explanation: "Incorrect. That is not the described semantic."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Virtual_Thread/VirtualThread.md"
      anchor: "virtual-thread-basic"
    apiRelated:
      controller: "VirtualThreadController"
      methodSignature: "basic()"

