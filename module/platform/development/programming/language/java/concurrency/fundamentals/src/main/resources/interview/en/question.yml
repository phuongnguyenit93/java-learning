      methodSignature: ""

  - question: >-
      Do Future.cancel(false), Future.cancel(true) and CompletableFuture.cancel(true) have the same semantics?
    answer: >-
      No. For a Future returned by ExecutorService, cancel(false) does not request interruption of a running task, so that task may continue. cancel(true) may request interruption, but the task must still cooperate. CompletableFuture does not use mayInterruptIfRunning to control underlying processing in the same way; cancellation mainly changes completion state. No cancel(true) call should be treated as a universal Thread-kill primitive.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Q&A/Q&A.md"
      anchor: "future-question"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      How does CompletableFuture differ from Future, and what are the important allOf()/anyOf() details?
    answer: >-
      Future is mainly a handle for completion, cancellation and blocking get(). CompletableFuture adds pipelines and composition such as thenApply, thenCompose, thenCombine and error handling. allOf() waits for all inputs and is not a fail-fast barrier; anyOf() selects the first completion, which may be success or failure. Neither automatically cancels sibling futures. Both get() and join() may block; a major difference is checked exceptions versus CompletionException or CancellationException.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Q&A/Q&A.md"
      anchor: "future-question"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      What risks do ThreadLocal and InheritableThreadLocal have with Thread Pools?
    answer: >-
      ThreadLocal associates a value with the current Thread and can avoid sharing a context value, but it does not make other shared objects thread-safe. Pool workers are reused, so a value that is not removed can become stale context or retain references too long. InheritableThreadLocal inherits at Thread creation time; later task submissions to an existing worker do not inherit the caller's new context. Pool context therefore usually needs explicit propagation and cleanup.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.Context/ThreadLocal.md"
      anchor: "thread-pool-problem"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      What important Java 21 Virtual Thread caveats should you remember?
    answer: >-
      Virtual Threads still obey the JMM and do not remove race conditions, locks or deadlocks. In Java 21 they are always daemon Threads and use fixed Thread.NORM_PRIORITY. ThreadLocal remains per-Thread, so large payloads across very many Virtual Threads can create heap pressure. Java 21 also has pinning in some cases, notably blocking while holding a synchronized monitor; long or frequent pinning can reduce scalability. Enabling spring.threads.virtual.enabled=true also does not turn every Thread in the application into a Virtual Thread.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Q&A/Q&A.md"
      anchor: "virtual-thread-question"
    apiRelated:
      controller: ""
      methodSignature: ""
