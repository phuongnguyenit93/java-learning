  - question: >-
      What is the difference between isInterrupted() and Thread.interrupted()?
    answer: >-
      isInterrupted() is an instance method that observes the interrupt status of the target Thread without clearing it. Thread.interrupted() is a static method that checks the current Thread and clears its interrupt status. Therefore Thread.interrupted() should not be used casually when upper layers still need to observe the cancellation signal.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Interruption/Interruption.md"
      anchor: "interrupt-flag"
    apiRelated:
      controller: "InterruptionController"
      methodSignature: "inspectInterruptFlag()"

  - question: >-
      Why is interrupt status often restored after catching InterruptedException?
    answer: >-
      Many interruptible blocking APIs clear the interrupt flag when they throw InterruptedException. If a method catches the exception but does not propagate it, a common pattern is Thread.currentThread().interrupt() so upper layers can still observe cancellation. Resource cleanup belongs in finally so it executes on both the normal path and the cancellation path.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Interruption/Interruption.md"
      anchor: "interrupted-exception"
    apiRelated:
      controller: "InterruptionController"
      methodSignature: "interruptSleepingWorker()"

  - question: >-
      Does interrupt() immediately release a Thread that is BLOCKED acquiring a synchronized monitor?
    answer: >-
      No. When a Thread is BLOCKED waiting for an intrinsic synchronized monitor, interrupt() can set interrupt status but does not abort monitor acquisition. The Thread still waits until the monitor is released. If interruptible lock acquisition is required, ReentrantLock provides lockInterruptibly().
