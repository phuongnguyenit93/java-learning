      anchor: "interrupt-vs-stop-flag"
    apiRelated:
      controller: "InterruptionController"
      methodSignature: "stopFlagVsInterrupt()"

  - question: >-
      Why is count++ not thread-safe when multiple Threads update it?
    answer: >-
      count++ is a read-modify-write sequence, not one atomic action. Two Threads can read the same old value, compute the same new value and overwrite each other's update, producing a lost update. Protecting the increment requires suitable atomicity, such as AtomicInteger or a critical section guarded by synchronized or a Lock.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "shared-state-race-condition"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "raceCondition()"

  - question: >-
      How are race condition, data race, visibility and ordering different?
    answer: >-
      A race condition is a correctness problem where the result depends on uncontrolled interleaving. A data race has a specific JMM meaning: two Threads access the same variable, at least one access is a write, and the conflicting accesses are not ordered by happens-before. Visibility asks whether another Thread is guaranteed to see a write; ordering asks which observation order is guaranteed. These problems can coexist but are not one concept.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Q&A/Q&A.md"
      anchor: "race-vs-visibility"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      What does happens-before mean in the Java Memory Model?
    answer: >-
      Happens-before is a relation that provides visibility and ordering guarantees; it is not merely wall-clock order. Important edges include program order, Thread.start(), successful join(), monitor unlock to a later lock, volatile write to a subsequent read, executor submission to task execution, asynchronous computation to successful Future.get(), synchronizer release/acquire and transitivity.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "happens-before"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "startJoinHappensBefore()"

  - question: >-
      What is safe publication, what do final fields provide, and why is this escape during construction dangerous?
    answer: >-
      Safe publication means a reference crosses to another Thread through a clear memory-consistency boundary such as volatile, a monitor/Lock, a concurrent collection, Thread.start() or Executor submission. Final fields have special initialization-safety when the object is constructed correctly and this does not escape before construction completes. Early this escape can let another Thread observe an object before its invariants are fully established.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "safe-publication-final"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      What does volatile guarantee, and what does it not guarantee?
    answer: >-
      volatile provides visibility and ordering semantics. A volatile write happens-before a subsequent read of the same volatile variable, so a flag such as ready can publish earlier writes. volatile does not make compound operations such as count++ atomic; read-modify-write updates still need Atomic classes, synchronized, Lock or another suitable design.
    aiGenerated: true
    reviewed: false
    readmeRelated:
