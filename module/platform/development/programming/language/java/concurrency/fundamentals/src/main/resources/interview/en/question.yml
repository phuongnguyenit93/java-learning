  - question: >-
      How are deadlock, livelock and starvation different?
    answer: >-
      Deadlock means Threads are stuck in a dependency cycle and cannot make progress. Livelock means Threads remain active and repeatedly react to one another but still make no progress. Starvation means a Thread could theoretically proceed but repeatedly fails to obtain enough CPU, lock or resource while other Threads continue. They are all progress/liveness problems with different behavior.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "progress-problems"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      What are the four Coffman conditions for deadlock, and how does global lock ordering help?
    answer: >-
      The four conditions are mutual exclusion, hold and wait, no preemption and circular wait. A practical prevention strategy is to break circular wait with a global lock order: every code path that needs multiple locks acquires them in the same order, for example always A then B and never B then A elsewhere.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Concurrency_Problems/ConcurrencyProblem.md"
      anchor: "deadlock-prevention"
    apiRelated:
      controller: "ConcurrencyProblemController"
      methodSignature: "deadlockPrevention()"

  - question: >-
      What is the difference between synchronization and coordination?
    answer: >-
      Synchronization focuses on protecting shared state: who may access or mutate it at a given time. Coordination focuses on dependencies between Threads: who waits, which event or phase they wait for, and when they continue. A synchronized counter is synchronization; a CountDownLatch waiting for several workers is coordination. Real applications commonly need both.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Q&A/Q&A.md"
      anchor: "synchronization-vs-coordination"
    apiRelated:
