questions:
  - question: >-
      How are a Process and a Thread different inside a JVM application?
    answer: >-
      A Process is a running program with its own resource scope managed by the operating system. A Thread is an execution flow inside that process. Threads in the same JVM process can access objects on the shared heap, while each Thread has its own execution stack. Multiple Threads accessing shared mutable state is the source of many concurrency problems.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Basic/Basic.md"
      anchor: "process-and-thread"
    apiRelated:
      controller: "BasicThreadController"
      methodSignature: "processAndThread()"

  - question: >-
      What are the different roles of Thread, Runnable, Callable and Executor?
    answer: >-
      Runnable and Callable describe work; Callable can also return a result and throw checked exceptions. Thread represents an execution flow. Executor is the abstraction that decides how tasks are executed. Runnable and Callable do not create Threads by themselves; they still need a Thread, Executor or another execution mechanism to run.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Basic/Basic.md"
      anchor: "thread-task"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      What is the difference between calling thread.run() and thread.start()?
    answer: >-
      run() is only a normal Java method call, so the task executes on the current caller Thread. start() begins the Thread lifecycle and the JVM invokes run() on that Thread's execution. A Thread object can only be started once; starting it again results in IllegalThreadStateException.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Basic/Basic.md"
      anchor: "start-vs-run"
    apiRelated:
      controller: "BasicThreadController"
      methodSignature: "startVsRun()"

  - question: >-
      Which Thread.State values exist in Java, and how is BLOCKED different from WAITING?
    answer: >-
      Java defines NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING and TERMINATED; there is no RUNNING enum value. BLOCKED specifically means a Thread is waiting to acquire an intrinsic monitor for synchronized. WAITING means an indefinite wait for an event or condition, such as Object.wait(), Thread.join() or LockSupport.park(). TIMED_WAITING is a wait with a time bound.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Basic/Basic.md"
      anchor: "thread-state"
    apiRelated:
      controller: "BasicThreadController"
      methodSignature: "threadLifeCycle()"

  - question: >-
      How does a daemon Thread affect the JVM lifecycle?
    answer: >-
      The JVM remains alive while user Threads are still alive. When only daemon Threads remain, the JVM is not required to wait for them to finish. Daemon does not mean low priority; it is a JVM liveness property. A newly created Thread inherits the creator's daemon status by default, and setDaemon(...) must be called before start().
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Basic/Basic.md"
      anchor: "daemon-thread"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Does interrupt() kill a Thread?
    answer: >-
      No. interrupt() sends a cooperative cancellation signal. A CPU loop must explicitly inspect interrupt status. If a Thread is in an interruptible operation such as sleep(), wait() or join(), the operation may finish early with InterruptedException. The task still owns its cleanup and safe termination behavior.
    aiGenerated: true
    reviewed: false
    readmeRelated:
