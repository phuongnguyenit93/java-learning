BasicThreadController:
  processAndThread():
    execution: "<p><b>Concept:</b> The service inspects the JVM process and the exact\
      \ thread handling the HTTP request.</p>\n<ol>\n  <li>It reads the current process\
      \ id from <code>ProcessHandle.current()</code>.\n    <div><i>Source: BasicThreadService.describeProcessAndCurrentThread()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; describeProcessAndCurrentThread()\
      \ {\n            Thread currentThread = Thread.currentThread();\n    \n    \
      \        Map&lt;String, Object&gt; result = new LinkedHashMap&lt;&gt;();\n \
      \           result.put(\"processId\", ProcessHandle.current().pid());\n    \
      \        result.put(\"threadName\", currentThread.getName());\n            result.put(\"\
      threadId\", currentThread.threadId());\n            result.put(\"threadState\"\
      , currentThread.getState().name());\n            result.put(\"daemon\", currentThread.isDaemon());\n\
      \        ...\n    }</code></pre>\n  </li>\n  <li>It reads the current thread\
      \ name, id, state, and daemon flag.</li>\n  <li>Those values are returned directly\
      \ so the request can be tied to one execution thread inside the JVM process.</li>\n\
      </ol>\n<p><b>Conclusion:</b> Observe the JVM process and HTTP request Thread.\
      \ The response and Execution Context are the runtime evidence for this behavior;\
      \ the colocated source snippet shows the code path that creates the experiment.</p>"
    usage: true
  startVsRun():
    execution: "<p><b>Concept:</b> The service executes equivalent tasks through direct\
      \ <code>run()</code> invocation and through <code>Thread.start()</code>.</p>\n\
      <ol>\n  <li>A runnable is called with <code>run()</code>, so it executes on\
      \ the HTTP caller thread.\n    <div><i>Source: BasicThreadService.compareRunAndStart()</i></div>\n\
      \    <pre><code>    public List&lt;String&gt; compareRunAndStart() throws InterruptedException\
      \ {\n            String callerThreadName = Thread.currentThread().getName();\n\
      \    \n            Runnable directTask = () -&gt; System.out.println(\n    \
      \                \"run() trực tiếp đang chạy trên: \"\n                    \
      \        + Thread.currentThread().getName()\n            );\n    \n        \
      \    directTask.run();\n        ...\n    }</code></pre>\n  </li>\n  <li>A second\
      \ runnable is placed in a named <code>Thread</code> and started, so its task\
      \ executes on <code>basic-start-worker</code>.</li>\n  <li>The service joins\
      \ the worker and returns both thread identities.</li>\n</ol>\n<p><b>Conclusion:</b>\
      \ Compare Thread.run() and Thread.start(). The response and Execution Context\
      \ are the runtime evidence for this behavior; the colocated source snippet shows\
      \ the code path that creates the experiment.</p>"
    usage: true
  threadLifeCycle():
    execution: "<p><b>Concept:</b> The service drives one worker through observable\
      \ <code>Thread.State</code> values with latches and monitors.</p>\n<ol>\n  <li>Before\
      \ start it records <code>NEW</code>, then keeps the worker spinning long enough\
      \ to observe <code>RUNNABLE</code>.\n    <div><i>Source: BasicThreadService.observeThreadLifecycle()</i></div>\n\
      \    <pre><code>    public List&lt;String&gt; observeThreadLifecycle() throws\
      \ InterruptedException {\n            List&lt;String&gt; observations = new\
      \ ArrayList&lt;&gt;();\n    \n            AtomicBoolean stayRunnable = new AtomicBoolean(true);\n\
      \            CountDownLatch runnableEntered = new CountDownLatch(1);\n     \
      \       CountDownLatch timedWaitGate = new CountDownLatch(1);\n    \n      \
      \      Object blockedMonitor = new Object();\n            Object waitingMonitor\
      \ = new Object();\n        ...\n    }</code></pre>\n  </li>\n  <li>A timed latch\
      \ wait produces <code>TIMED_WAITING</code>.</li>\n  <li>The caller holds a monitor\
      \ while releasing the latch, forcing the worker into <code>BLOCKED</code>.</li>\n\
      \  <li>The worker then calls <code>wait()</code> to enter <code>WAITING</code>;\
      \ the caller notifies it, joins it, and records <code>TERMINATED</code>.</li>\n\
      </ol>\n<p><b>Conclusion:</b> Observe all Thread.State values. The response and\
      \ Execution Context are the runtime evidence for this behavior; the colocated\
      \ source snippet shows the code path that creates the experiment.</p>"
    usage: true
CreateThreadController:
  createByExtends():
    execution: "<p><b>Concept:</b> The service creates a concrete <code>MyWorker</code>\
      \ subclass of <code>Thread</code>.</p>\n<ol>\n  <li>The request thread constructs\
      \ the named worker.\n    <div><i>Source: CreateThreadService.createByExtends()</i></div>\n\
      \    <pre><code>    public List&lt;String&gt; createByExtends() throws InterruptedException\
      \ {\n            String callerThread = Thread.currentThread().getName();\n \
      \   \n            MyWorker worker = new MyWorker(\"extends-thread-worker\");\n\
      \            try {\n                worker.start();\n                joinOrFail(worker);\n\
      \            } finally {\n                cleanup(worker);\n        ...\n  \
      \  }</code></pre>\n  </li>\n  <li><code>start()</code> invokes the subclass\
      \ implementation of <code>run()</code> on <code>extends-thread-worker</code>.</li>\n\
      \  <li>The service joins the worker, performs bounded cleanup if necessary,\
      \ and returns caller and worker thread names.</li>\n</ol>\n<p><b>Conclusion:</b>\
      \ Create a Thread by extending Thread. The response and Execution Context are\
      \ the runtime evidence for this behavior; the colocated source snippet shows\
      \ the code path that creates the experiment.</p>"
    usage: true
