      \         \"Runnable.run() đang chạy trên thread: \"\n                     \
      \       + Thread.currentThread().getName()\n            );\n    \n         \
      \   Thread worker = new Thread(\n        ...\n    }</code></pre>\n  </li>\n\
      \  <li>The runnable is passed to a new named <code>Thread</code> and started.</li>\n\
      \  <li>The service joins and cleans up the worker, then returns the caller and\
