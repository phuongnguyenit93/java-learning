ConcurrencyProblemController:
  raceCondition():
    execution: "<p><b>Concept:</b> The service creates a deterministic lost update\
      \ on an unsynchronized integer.</p>\n<ol>\n  <li>Two workers read the same counter\
      \ value into separate snapshots.\n    <div><i>Source: ConcurrencyProblemService.deterministicRaceCondition()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; deterministicRaceCondition()\n\
      \                throws InterruptedException {\n    \n            PlainCounter\
      \ counter = new PlainCounter();\n    \n            AtomicInteger snapshotA =\
      \ new AtomicInteger();\n            AtomicInteger snapshotB = new AtomicInteger();\n\
      \    \n            CountDownLatch bothRead = new CountDownLatch(2);\n      \
      \  ...\n    }</code></pre>\n  </li>\n  <li>A latch holds both workers until\
      \ both reads have happened.</li>\n  <li>Each worker writes its own <code>snapshot\
      \ + 1</code>, so one update overwrites the other.</li>\n  <li>After joining\
      \ both workers, the response compares the sequential expectation of two with\
      \ the actual value and reports the lost update.</li>\n</ol>\n<p><b>Conclusion:</b>\
      \ Create a lost update to observe a race condition. The response and Execution\
      \ Context are the runtime evidence for this behavior; the colocated source snippet\
      \ shows the code path that creates the experiment.</p>"
    usage: true
  startJoinHappensBefore():
    execution: "<p><b>Concept:</b> The experiment uses plain fields and relies on\
      \ the memory-consistency guarantees of <code>Thread.start()</code> and <code>join()</code>.</p>\n\
      <ol>\n  <li>The parent writes <code>beforeStart = 7</code> before starting the\
      \ worker.\n    <div><i>Source: ConcurrencyProblemService.startJoinHappensBefore()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; startJoinHappensBefore()\n\
      \                throws InterruptedException {\n    \n            StartJoinState\
      \ state = new StartJoinState();\n            state.beforeStart = 7;\n    \n\
      \            Thread worker = new Thread(() -&gt; {\n                state.observedByWorker\
      \ = state.beforeStart;\n                state.writtenByWorker = 42;\n      \
      \  ...\n    }</code></pre>\n  </li>\n  <li>The worker reads that value and writes\
      \ <code>writtenByWorker = 42</code>.</li>\n  <li>The parent joins the worker,\
      \ then reads the worker-written value and returns both observations.</li>\n\
      </ol>\n<p><b>Conclusion:</b> Observe happens-before from start() and join().\
      \ The response and Execution Context are the runtime evidence for this behavior;\
      \ the colocated source snippet shows the code path that creates the experiment.</p>"
    usage: true
  volatilePublication():
    execution: "<p><b>Concept:</b> A writer publishes ordinary data through a volatile\
      \ readiness flag.</p>\n<ol>\n  <li>The reader starts first and spins on volatile\
      \ <code>ready</code>.\n    <div><i>Source: ConcurrencyProblemService.volatilePublication()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; volatilePublication()\n\
      \                throws InterruptedException {\n    \n            PublicationState\
      \ state = new PublicationState();\n            Thread reader = new Thread(()\
      \ -&gt; {\n                while (!state.ready) {\n                    if (Thread.currentThread().isInterrupted())\
      \ {\n                        return;\n                    }\n        ...\n \
      \   }</code></pre>\n  </li>\n  <li>The writer stores <code>data = 42</code>\
      \ and then sets <code>ready = true</code>.</li>\n  <li>Once the reader observes\
      \ the volatile write, it reads the previously written data, and both threads\
      \ are joined before the values are returned.</li>\n</ol>\n<p><b>Conclusion:</b>\
      \ Publish data through a volatile flag. The response and Execution Context are\
      \ the runtime evidence for this behavior; the colocated source snippet shows\
      \ the code path that creates the experiment.</p>"
    usage: true
  volatileIsNotAtomic():
    execution: "<p><b>Concept:</b> The service repeats the deterministic lost-update\
      \ experiment with the counter field declared <code>volatile</code>.</p>\n<ol>\n\
      \  <li>Both workers read the same volatile value before either is allowed to\
      \ write.\n    <div><i>Source: ConcurrencyProblemService.volatileIsNotAtomic()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; volatileIsNotAtomic()\n\
      \                throws InterruptedException {\n    \n            VolatileCounter\
      \ counter = new VolatileCounter();\n    \n            AtomicInteger snapshotA\
      \ = new AtomicInteger();\n            AtomicInteger snapshotB = new AtomicInteger();\n\
      \    \n            CountDownLatch bothRead = new CountDownLatch(2);\n      \
      \  ...\n    }</code></pre>\n  </li>\n  <li>After the latch releases them, each\
      \ stores <code>snapshot + 1</code>.</li>\n  <li>The final value is still lower\
      \ than the sequential expectation, demonstrating that visibility does not make\
      \ the read-modify-write sequence atomic.</li>\n</ol>\n<p><b>Conclusion:</b>\
      \ Prove volatile does not provide atomicity. The response and Execution Context\
      \ are the runtime evidence for this behavior; the colocated source snippet shows\
      \ the code path that creates the experiment.</p>"
    usage: true
  deadlockRisk():
    execution: "<p><b>Concept:</b> The service constructs circular lock ownership\
      \ while using non-blocking second-lock attempts so the demo cannot hang.</p>\n\
      <ol>\n  <li>Worker A locks A and worker B locks B.\n    <div><i>Source: ConcurrencyProblemService.deadlockRisk()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; deadlockRisk()\n      \
      \          throws InterruptedException {\n    \n            ReentrantLock lockA\
      \ = new ReentrantLock();\n            ReentrantLock lockB = new ReentrantLock();\n\
      \    \n            CountDownLatch bothHoldingFirstLock = new CountDownLatch(2);\n\
      \            CountDownLatch bothTriedSecondLock = new CountDownLatch(2);\n \
      \   \n        ...\n    }</code></pre>\n  </li>\n  <li>A latch ensures both first\
      \ locks are held before each worker calls <code>tryLock()</code> on the other\
      \ lock.</li>\n  <li>Both second-lock attempts fail, exposing the circular dependency\
      \ that would deadlock with blocking acquisition.</li>\n  <li>Each worker releases\
      \ its first lock and terminates cleanly.</li>\n</ol>\n<p><b>Conclusion:</b>\
      \ Observe circular lock dependency safely. The response and Execution Context\
      \ are the runtime evidence for this behavior; the colocated source snippet shows\
      \ the code path that creates the experiment.</p>"
    usage: true
  deadlockPrevention():
    execution: "<p><b>Concept:</b> Both workers use the same global lock order to\
      \ remove circular wait.</p>\n<ol>\n  <li>A start latch releases the two workers\
      \ together.\n    <div><i>Source: ConcurrencyProblemService.deadlockPrevention()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; deadlockPrevention()\n\
      \                throws InterruptedException {\n    \n            ReentrantLock\
      \ lockA = new ReentrantLock();\n            ReentrantLock lockB = new ReentrantLock();\n\
      \            CountDownLatch start = new CountDownLatch(1);\n            AtomicInteger\
      \ completed = new AtomicInteger();\n    \n            Runnable orderedTask =\
      \ () -&gt; {\n        ...\n    }</code></pre>\n  </li>\n  <li>Each worker acquires\
      \ lock A first and lock B second, performs its work, then releases B and A.</li>\n\
      \  <li>The caller joins both workers and reports that both completed with the\
      \ fixed <code>A -&gt; B</code> order.</li>\n</ol>\n<p><b>Conclusion:</b> Prevent\
      \ deadlock with global lock ordering. The response and Execution Context are\
      \ the runtime evidence for this behavior; the colocated source snippet shows\
      \ the code path that creates the experiment.</p>"
    usage: true
  boundedLivelock():
    execution: "<p><b>Concept:</b> The service models livelock for exactly five synchronized\
      \ rounds so the API remains bounded.</p>\n<ol>\n  <li>Both workers announce\
      \ that they are trying to proceed and meet at a barrier.\n    <div><i>Source:\
      \ ConcurrencyProblemService.boundedLivelock()</i></div>\n    <pre><code>   \
      \ public Map&lt;String, Object&gt; boundedLivelock()\n                throws\
      \ InterruptedException {\n    \n            int rounds = 5;\n    \n        \
      \    AtomicBoolean workerATrying = new AtomicBoolean(false);\n            AtomicBoolean\
      \ workerBTrying = new AtomicBoolean(false);\n            AtomicInteger workerABackoffs\
      \ = new AtomicInteger();\n            AtomicInteger workerBBackoffs = new AtomicInteger();\n\
      \        ...\n    }</code></pre>\n  </li>\n  <li>Each sees the other trying,\
      \ backs off, and meets at another barrier before the next round.</li>\n  <li>Because\
      \ they react symmetrically, they keep changing state without making progress;\
      \ after five rounds both threads terminate and the backoff counts are returned.</li>\n\
      </ol>\n<p><b>Conclusion:</b> Simulate livelock with bounded execution. The response\
      \ and Execution Context are the runtime evidence for this behavior; the colocated\
      \ source snippet shows the code path that creates the experiment.</p>"
    usage: true
ThreadLocalController:
  isolation():
    execution: "<p><b>Concept:</b> Two platform threads use the same static <code>ThreadLocal</code>\
      \ but store different request values.</p>\n<ol>\n  <li>Thread A sets <code>REQ-A</code>\
      \ and Thread B sets <code>REQ-B</code>.\n    <div><i>Source: ThreadLocalService.isolationDemo()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; isolationDemo() throws\
      \ InterruptedException {\n            AtomicReference&lt;String&gt; threadAValue\
      \ = new AtomicReference&lt;&gt;();\n            AtomicReference&lt;String&gt;\
      \ threadBValue = new AtomicReference&lt;&gt;();\n    \n            Thread threadA\
      \ = new Thread(() -&gt; useLocalContext(\"REQ-A\", threadAValue), \"context-a\"\
      );\n            Thread threadB = new Thread(() -&gt; useLocalContext(\"REQ-B\"\
      , threadBValue), \"context-b\");\n            try {\n                threadA.start();\n\
      \                threadB.start();\n        ...\n    }</code></pre>\n  </li>\n\
      \  <li>Each reads its own value and removes it in <code>finally</code>.</li>\n\
      \  <li>After both threads are joined, the caller also reads the <code>ThreadLocal</code>,\
      \ demonstrating that the values are isolated per thread.</li>\n</ol>\n<p><b>Conclusion:</b>\
      \ Observe ThreadLocal isolation. The response and Execution Context are the\
      \ runtime evidence for this behavior; the colocated source snippet shows the\
      \ code path that creates the experiment.</p>"
    usage: true
  inheritance():
    execution: "<p><b>Concept:</b> The service shows when an <code>InheritableThreadLocal</code>\
      \ value is captured for a newly created thread.</p>\n<ol>\n  <li>The parent\
      \ sets <code>PARENT-A</code> and constructs the child.\n    <div><i>Source:\
      \ ThreadLocalService.inheritanceDemo()</i></div>\n    <pre><code>    public\
      \ Map&lt;String, Object&gt; inheritanceDemo() throws InterruptedException {\n\
      \            AtomicReference&lt;String&gt; childValue = new AtomicReference&lt;&gt;();\n\
      \            INHERITABLE_CONTEXT.set(\"PARENT-A\");\n    \n            Thread\
      \ child = new Thread(() -&gt; childValue.set(INHERITABLE_CONTEXT.get()), \"\
      inheritable-child\");\n            INHERITABLE_CONTEXT.set(\"PARENT-B\");\n\
      \    \n            try {\n                child.start();\n        ...\n    }</code></pre>\n\
      \  </li>\n  <li>Before starting the child, the parent changes its own value\
      \ to <code>PARENT-B</code>.</li>\n  <li>The child still observes <code>PARENT-A</code>,\
      \ the value inherited at thread construction, and the parent removes its context\
      \ during cleanup.</li>\n</ol>\n<p><b>Conclusion:</b> Observe InheritableThreadLocal\
      \ at Thread creation. The response and Execution Context are the runtime evidence\
      \ for this behavior; the colocated source snippet shows the code path that creates\
      \ the experiment.</p>"
    usage: true
  poolReuseProblem():
    execution: "<p><b>Concept:</b> A one-thread pool demonstrates why inherited context\
      \ and worker reuse do not mix safely.</p>\n<ol>\n  <li>The parent sets <code>USER_A</code>\
      \ and submits the first task, causing the pool worker to inherit that value.\n\
      \    <div><i>Source: ThreadLocalService.poolReuseProblemDemo()</i></div>\n \
      \   <pre><code>    public Map&lt;String, Object&gt; poolReuseProblemDemo() throws\
      \ Exception {\n            ExecutorService pool = Executors.newFixedThreadPool(1);\n\
      \            try {\n                INHERITABLE_CONTEXT.set(\"USER_A\");\n \
      \               Future&lt;String&gt; first = pool.submit(INHERITABLE_CONTEXT::get);\n\
      \                String firstValue = first.get(2, TimeUnit.SECONDS);\n    \n\
      \                INHERITABLE_CONTEXT.set(\"USER_B\");\n                Future&lt;String&gt;\
      \ second = pool.submit(INHERITABLE_CONTEXT::get);\n        ...\n    }</code></pre>\n\
      \  </li>\n  <li>The parent changes its context to <code>USER_B</code> and submits\
      \ a second task.</li>\n  <li>The same worker is reused and still reads <code>USER_A</code>,\
      \ so the response marks the stale context before the pool is shut down.</li>\n\
      </ol>\n<p><b>Conclusion:</b> Demonstrate stale context with worker reuse. The\
      \ response and Execution Context are the runtime evidence for this behavior;\
      \ the colocated source snippet shows the code path that creates the experiment.</p>"
    usage: true
  explicitPropagation():
    execution: "<p><b>Concept:</b> The service explicitly propagates a plain <code>ThreadLocal</code>\
      \ into an already-created pool worker.</p>\n<ol>\n  <li>A warm-up task creates\
      \ the single pool worker before any context is set.\n    <div><i>Source: ThreadLocalService.explicitPropagationDemo()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; explicitPropagationDemo()\
      \ throws Exception {\n            ExecutorService pool = Executors.newFixedThreadPool(1);\n\
      \            try {\n                pool.submit(() -&gt; null).get(2, TimeUnit.SECONDS);\
      \ // tạo worker trước khi set context\n                LOCAL_CONTEXT.set(\"\
      USER_B\");\n    \n                Callable&lt;String&gt; propagated = propagate(LOCAL_CONTEXT::get);\n\
      \                String observed = pool.submit(propagated).get(2, TimeUnit.SECONDS);\n\
      \    \n        ...\n    }</code></pre>\n  </li>\n  <li>The caller stores <code>USER_B</code>\
      \ and wraps the real callable with a propagation helper that captures that value.</li>\n\
      \  <li>The wrapper installs the captured value on the worker, runs the task,\
      \ then restores the worker's previous context in <code>finally</code>.</li>\n\
      </ol>\n<p><b>Conclusion:</b> Propagate context with capture, restore, and cleanup.\
      \ The response and Execution Context are the runtime evidence for this behavior;\
      \ the colocated source snippet shows the code path that creates the experiment.</p>"
    usage: true
InterruptionController:
  interruptBusyWorker():
    execution: "<p><b>Concept:</b> A CPU-bound worker cooperatively polls its interrupt\
      \ status.</p>\n<ol>\n  <li>The worker signals that it has started, then spins\
      \ while <code>isInterrupted()</code> is false and counts iterations.\n    <div><i>Source:\
      \ InterruptionService.interruptBusyWorker()</i></div>\n    <pre><code>    public\
      \ Map&lt;String, Object&gt; interruptBusyWorker() throws InterruptedException\
      \ {\n            CountDownLatch started = new CountDownLatch(1);\n         \
      \   AtomicLong iterations = new AtomicLong();\n            AtomicBoolean interruptObserved\
      \ = new AtomicBoolean(false);\n    \n            Thread worker = new Thread(()\
      \ -&gt; {\n                started.countDown();\n    \n                while\
      \ (!Thread.currentThread().isInterrupted()) {\n        ...\n    }</code></pre>\n\
      \  </li>\n  <li>The request thread calls <code>interrupt()</code>.</li>\n  <li>The\
      \ worker observes the flag, exits its loop, records that interruption was seen,\
      \ and is joined before its final state is returned.</li>\n</ol>\n<p><b>Conclusion:</b>\
      \ Cancel a CPU loop with cooperative interruption. The response and Execution\
      \ Context are the runtime evidence for this behavior; the colocated source snippet\
      \ shows the code path that creates the experiment.</p>"
    usage: true
  inspectInterruptFlag():
    execution: "<p><b>Concept:</b> The worker compares the non-clearing and clearing\
      \ interrupt-status APIs in a controlled sequence.</p>\n<ol>\n  <li>The caller\
