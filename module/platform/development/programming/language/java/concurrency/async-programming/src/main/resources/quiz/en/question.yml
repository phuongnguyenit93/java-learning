# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: async-not-nonblocking
    question: "`CompletableFuture.supplyAsync(() -> blockingJdbcCall())` lets the caller continue earlier. What can still be true?"
    answers:
      - id: A
        answer: "The JDBC call automatically becomes a non-blocking API because it is wrapped in CompletableFuture."
        explanation: "Incorrect. An async wrapper does not change the blocking semantics of the JDBC operation."
      - id: B
        answer: "The worker executing the lambda can still be blocked in JDBC; async describes the caller/completion relationship and is not the same as non-blocking."
        explanation: "Correct. This is the key distinction between async, parallel, blocking, and non-blocking execution."
      - id: C
        answer: "The task is guaranteed to run in parallel with every other task in the process."
        explanation: "Incorrect. Parallelism depends on executor capacity, scheduling, and workload."
      - id: D
        answer: "No thread is used while the JDBC call waits."
        explanation: "Incorrect. With a normal blocking JDBC call on a platform worker, that worker remains occupied while waiting."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Async/Async.md"
      anchor: "async-mental-model"
    apiRelated:
      controller: "AsyncController"
      methodSignature: "pipeline()"

  - id: completable-allof-anyof
    question: "Which statement about `CompletableFuture.allOf()` and `anyOf()` is correct?"
    answers:
      - id: A
        answer: "`allOf()` always fails fast as soon as one child fails and automatically cancels every remaining child."
        explanation: "Incorrect. The README explicitly warns not to treat allOf as a fail-fast or cancel-siblings policy."
      - id: B
        answer: "`anyOf()` always chooses the best business result, such as the lowest price."
        explanation: "Incorrect. anyOf selects the first completion; it has no knowledge of business ranking."
      - id: C
        answer: "`allOf()` aggregates completion of all inputs; `anyOf()` completes with the first input to complete, and that first completion may be either success or failure."
        explanation: "Correct. Both are completion-aggregation primitives, not business-selection or automatic-cancellation policies."
      - id: D
        answer: "`allOf()` directly returns a typed list containing every child result."
        explanation: "Incorrect. `allOf()` returns `CompletableFuture<Void>`; keep references to each child future if typed results are needed."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Async/Async.md"
      anchor: "combine-race"
    apiRelated:
      controller: "AsyncController"
      methodSignature: "allOf()"

  - id: future-cancel-semantics
    question: "For a `Future` returned by `ExecutorService.submit(...)`, which interpretation of `cancel(true)` is correct?"
    answers:
      - id: A
        answer: "If cancellation is accepted, the implementation may interrupt the thread running the task, but the task still has to cooperate with interruption."
        explanation: "Correct. `true` does not mean the JVM forcibly kills the task; it is a cancellation request that may be accompanied by interruption."
      - id: B
        answer: "It guarantees rollback of every side effect already performed by the task."
        explanation: "Incorrect. Future cancellation is not transaction rollback."
      - id: C
        answer: "It is identical to `CompletableFuture.cancel(true)` in how it interrupts the underlying worker."
        explanation: "Incorrect. The README distinguishes these semantics: CompletableFuture's mayInterruptIfRunning argument does not control underlying processing in the same way."
      - id: D
        answer: "After cancellation, `get()` must still return the final result if the underlying code eventually completes."
        explanation: "Incorrect. A cancelled Future exposes cancellation, normally via `CancellationException`, even if underlying work may continue in some cases."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Async/Async.md"
      anchor: "future"
    apiRelated:
      controller: "AsyncController"
      methodSignature: "futureCancellation()"

  - id: completablefuture-get-vs-join
    question: "Which statement best describes `CompletableFuture.get()` versus `join()`?"
    answers:
      - id: A
        answer: "`join()` is the non-blocking variant of `get()`."
        explanation: "Incorrect. If the stage has not completed, `join()` may still wait."
      - id: B
        answer: "A major difference is the exception API: `get()` uses checked exceptions such as `ExecutionException`, while `join()` exposes exceptional completion through unchecked `CompletionException`."
        explanation: "Correct. Both methods may wait for completion; they are not two different execution models."
      - id: C
        answer: "`get()` works only on plain Future and cannot be used on CompletableFuture."
        explanation: "Incorrect. CompletableFuture implements Future and supports `get()`."
      - id: D
        answer: "`join()` always dispatches a continuation to the common pool."
        explanation: "Incorrect. `join()` waits for/reads a result; it is not a continuation-dispatch policy."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Async/Async.md"
      anchor: "completable-future-pipeline"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: completablefuture-cancel-underlying-work
    question: "In the module's experiment with `CompletableFuture.cancel(true)`, what is true about an underlying worker that is currently blocked?"
    answers:
      - id: A
        answer: "The `true` argument must interrupt the underlying worker exactly like every other Future implementation."
        explanation: "Incorrect. The README explicitly distinguishes this behavior from a Future returned by `ExecutorService.submit(...)`."
      - id: B
        answer: "The future becomes cancelled, but `mayInterruptIfRunning` does not control CompletableFuture's underlying processing; the worker may still need separate cleanup or release."
        explanation: "Correct. Cancelling the completion state is not a primitive that forcibly kills a Thread."
      - id: C
        answer: "Cancellation rolls back every side effect already performed by the lambda."
        explanation: "Incorrect. CompletableFuture cancellation is not transaction rollback."
      - id: D
        answer: "Cancellation only has an effect after the future has already completed successfully."
        explanation: "Incorrect. Cancellation is a terminal completion path when accepted before normal completion."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Async/Async.md"
      anchor: "timeout-cancellation"
    apiRelated:
      controller: "AsyncController"
      methodSignature: "timeoutCancellation()"

