questions:
  - question: >-
      Asynchronous có đồng nghĩa với non-blocking không?
    answer: >-
      Không. Async mô tả quan hệ giữa caller và completion: caller không nhất thiết chờ công việc hoàn thành ngay tại điểm submit. Worker vẫn có thể block, ví dụ CompletableFuture.supplyAsync(() -> blockingJdbcCall()). Non-blocking là property của cách operation chờ external event/resource, còn async không tự biến blocking I/O thành non-blocking.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Async/Async.md"
      anchor: "async-mental-model"
    apiRelated:
      controller: ""
      methodSignature: ""

