  futureCancellation():
    summary: So sánh Future.cancel(false) và cancel(true)
    description: Chạy hai task đang block rồi hủy bằng cancel(false) và cancel(true)
      để quan sát cancellation state và interruption behavior. cancel(true) có thể
      interrupt worker, còn cancel(false) không yêu cầu interruption và underlying
      task có thể tiếp tục chạy.
