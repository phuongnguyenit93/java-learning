    usage: true
  reentrantLockPolicy():
    execution: "<p><b>Concept:</b> API không tạo contention mà đọc trực tiếp policy\
      \ của ba ReentrantLock.</p>\n<ol>\n  <li>So sánh lock mặc định, explicit unfair\
      \ và fair bằng isFair.\n    <div><i>Nguồn: SynchronizationService.reentrantLockPolicyDemo()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; reentrantLockPolicyDemo()\
      \ {\n            ReentrantLock defaultLock = new ReentrantLock();\n        \
      \    ReentrantLock explicitUnfairLock = new ReentrantLock(false);\n        \
      \    ReentrantLock fairLock = new ReentrantLock(true);\n    \n            return\
      \ linkedMap(\n                    \"defaultIsFair\", defaultLock.isFair(),\n\
      \                    \"explicitUnfairIsFair\", explicitUnfairLock.isFair(),\n\
      \                    \"explicitFairIsFair\", fairLock.isFair(),\n        ...\n\
      \    }</code></pre>\n  </li>\n  <li>Response ghi lại điểm cần lưu ý rằng untimed tryLock\
      \ có thể barge dù lock fair, còn timed tryLock tôn trọng fairness.</li>\n  <li>Fairness\
      \ không bảo đảm thứ tự start tuyệt đối và có trade-off throughput.</li>\n</ol>\n\
      <p><b>Kết luận:</b> Quan sát fair và non-fair policy của ReentrantLock. Response\
      \ và Execution Context là bằng chứng runtime cho behavior này; đoạn source colocated\
      \ ở trên cho thấy code path tạo experiment.</p>"
    usage: true
