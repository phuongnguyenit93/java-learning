      \ và chuyển sang waiting state.\n    <div><i>Nguồn: SynchronizationService.interruptibleLockDemo()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; interruptibleLockDemo()\
      \ throws InterruptedException {\n            ReentrantLock lock = new ReentrantLock();\n\
      \            CountDownLatch waiterStarted = new CountDownLatch(1);\n       \
      \     AtomicBoolean waiterInterrupted = new AtomicBoolean(false);\n        \
      \    AtomicBoolean waiterAcquired = new AtomicBoolean(false);\n    \n      \
      \      lock.lock();\n            Thread waiter = new Thread(() -&gt; {\n   \
      \             waiterStarted.countDown();\n        ...\n    }</code></pre>\n\
      \  </li>\n  <li>Caller interrupt worker trước khi nhả lock.</li>\n  <li>lockInterruptibly\
      \ ném InterruptedException, worker không acquire lock và terminate; finally\
