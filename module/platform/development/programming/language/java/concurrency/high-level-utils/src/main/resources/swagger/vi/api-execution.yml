CoordinationController:
  join():
    execution: "<p><b>Concept:</b> API start một worker đơn giản rồi dùng join như\
      \ điểm đồng bộ.</p>\n<ol>\n  <li>Worker đặt cờ completed.\n    <div><i>Nguồ\
      n: CoordinationService.joinDemo()</i></div>\n    <pre><code>    public Map&lt;String,\
      \ Object&gt; joinDemo() throws InterruptedException {\n            AtomicBoolean\
      \ workerCompleted = new AtomicBoolean(false);\n            Thread worker = new\
      \ Thread(() -&gt; workerCompleted.set(true), \"join-worker\");\n    \n     \
      \       try {\n                worker.start();\n                joinOrFail(worker);\n\
      \            } finally {\n                cleanupThreads(worker);\n        ...\n\
      \    }</code></pre>\n  </li>\n  <li>Caller join và chỉ tiếp tục khi worker đ\
      ã terminate.</li>\n  <li>Response kiểm tra cờ hoàn thành và state TERMINATED\
      \ sau join.</li>\n</ol>\n<p><b>Kết luận:</b> Phối hợp lifecycle bằng Thread.join().\
      \ Response và Execution Context là bằng chứng runtime cho behavior này; đoạ\
      n source colocated ở trên cho thấy code path tạo experiment.</p>"
    usage: true
