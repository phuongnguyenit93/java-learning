      \ tại put vì chưa có consumer nhận.\n    <div><i>Nguồn: CoordinationService.synchronousQueueDemo()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; synchronousQueueDemo()\
      \ throws InterruptedException {\n            SynchronousQueue&lt;String&gt;\
      \ queue = new SynchronousQueue&lt;&gt;();\n            AtomicReference&lt;String&gt;\
      \ received = new AtomicReference&lt;&gt;();\n    \n            Thread consumer\
      \ = new Thread(() -&gt; {\n                try {\n                    received.set(queue.take());\n\
      \                } catch (InterruptedException e) {\n                    Thread.currentThread().interrupt();\n\
      \        ...\n    }</code></pre>\n  </li>\n  <li>Sau khi quan sát producer đ\
