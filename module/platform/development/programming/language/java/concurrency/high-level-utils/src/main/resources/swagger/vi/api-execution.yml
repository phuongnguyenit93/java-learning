  synchronizers():
    execution: |-
      <p><b>Concept:</b> API chạy một bộ thí nghiệm nhỏ cho các synchronizer chuẩn của JDK.</p>
      <ol>
        <li>CountDownLatch chờ hai worker; CyclicBarrier cho hai participant gặp nhau và chạy barrier action.
          <div><i>Nguồn: CoordinationService.synchronizersDemo()</i></div>
          <pre><code>    public Map&lt;String, Object&gt; synchronizersDemo() throws InterruptedException {
                  Map&lt;String, Object&gt; result = new LinkedHashMap&lt;&gt;();
                  result.put("countDownLatch", countDownLatchSample());
                  result.put("cyclicBarrier", cyclicBarrierSample());
                  result.put("semaphore", semaphoreSample());
                  result.put("phaser", phaserSample());
                  result.put("exchanger", exchangerSample());
                  return result;
              }</code></pre>
        </li>
        <li>Semaphore giới hạn tối đa hai worker trong vùng bảo vệ; Phaser đồng bộ nhiều phase và deregister.</li>
        <li>Exchanger cho hai thread trao đổi payload trực tiếp rồi service tổng hợp kết quả.</li>
      </ol>
      <p><b>Kết luận:</b> So sánh các synchronizer cấp cao. Response và Execution Context là bằng chứng runtime cho behavior này; đoạn source colocated ở trên cho thấy code path tạo experiment.</p>
    usage: true
  synchronizersTimeout():
    execution: "<p><b>Concept:</b> API tập trung vào timeout, failure và recovery\
      \ semantics của nhiều synchronizer.</p>\n<ol>\n  <li>CountDownLatch timeout\
      \ ở caller nhưng worker vẫn có thể chạy tiếp sau khi được release.\n    <div><i>Nguồ\
      n: CoordinationService.synchronizerTimeoutDemo()</i></div>\n    <pre><code>\
      \    public Map&lt;String, Object&gt; synchronizerTimeoutDemo() throws InterruptedException\
      \ {\n            Map&lt;String, Object&gt; result = new LinkedHashMap&lt;&gt;();\n\
      \    \n            CountDownLatch workerFinished = new CountDownLatch(1);\n\
      \            CountDownLatch workerStarted = new CountDownLatch(1);\n       \
      \     CountDownLatch releaseWorker = new CountDownLatch(1);\n            AtomicBoolean\
      \ workerContinuedAfterCallerTimeout = new AtomicBoolean(false);\n          \
      \  Thread slowWorker = new Thread(() -&gt; {\n                try {\n      \
      \  ...\n    }</code></pre>\n  </li>\n  <li>CyclicBarrier timeout làm barrier\
      \ broken, sau reset một generation mới lại chạy được; Semaphore thử acquire\
      \ thêm permit với timeout.</li>\n  <li>Phaser cho worker deregister theo phase;\
      \ Exchanger được thử cả timeout không có partner và interrupt khi đang chờ.</li>\n\
      </ol>\n<p><b>Kết luận:</b> Quan sát timeout và failure của synchronizer. Response\
      \ và Execution Context là bằng chứng runtime cho behavior này; đoạn source colocated\
      \ ở trên cho thấy code path tạo experiment.</p>"
    usage: true
  semaphorePermitAccounting():
    execution: "<p><b>Concept:</b> API cố ý release Semaphore mà chưa acquire để quan\
      \ sát permit accounting.</p>\n<ol>\n  <li>Semaphore bắt đầu với một permit.\n\
      \    <div><i>Nguồn: CoordinationService.semaphorePermitAccountingDemo()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; semaphorePermitAccountingDemo()\
      \ {\n            Semaphore semaphore = new Semaphore(1);\n            int initialPermits\
      \ = semaphore.availablePermits();\n    \n            semaphore.release();\n\
      \            int permitsAfterUnmatchedRelease = semaphore.availablePermits();\n\
      \    \n            boolean acquiredTwice = semaphore.tryAcquire(2);\n      \
      \      if (acquiredTwice) {\n        ...\n    }</code></pre>\n  </li>\n  <li>Mộ\
      t unmatched release làm số permit tăng thành hai vì Semaphore không theo dõ\
      i ownership.</li>\n  <li>Service thử acquire cả hai permit và sau đó trả lạ\
      i, minh họa vì sao code phải chỉ release permit thực sự đã acquire.</li>\n</ol>\n\
      <p><b>Kết luận:</b> Chứng minh Semaphore không enforce ownership. Response và\
      \ Execution Context là bằng chứng runtime cho behavior này; đoạn source colocated\
      \ ở trên cho thấy code path tạo experiment.</p>"
    usage: true
