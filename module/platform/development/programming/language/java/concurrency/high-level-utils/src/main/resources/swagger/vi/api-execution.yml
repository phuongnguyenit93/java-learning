      y.\n    <div><i>Nguồn: CoordinationService.blockingQueueDemo()</i></div>\n \
      \   <pre><code>    public Map&lt;String, Object&gt; blockingQueueDemo() throws\
      \ InterruptedException {\n            BlockingQueue&lt;String&gt; queue = new\
      \ ArrayBlockingQueue&lt;&gt;(2);\n            List&lt;String&gt; consumed =\
      \ java.util.Collections.synchronizedList(new ArrayList&lt;&gt;());\n    \n \
      \           Thread producer = new Thread(() -&gt; {\n                try {\n\
      \                    for (int i = 1; i &lt;= 5; i++) {\n                   \
      \     queue.put(\"item-\" + i);\n                    }\n        ...\n    }</code></pre>\n\
      \  </li>\n  <li>Consumer take đúng 5 item, đồng thời giải phóng chỗ cho producer.</li>\n\
      \  <li>Service join cả hai và xác nhận queue rỗng khi kết thúc.</li>\n</ol>\n\
      <p><b>Kết luận:</b> Xây producer-consumer với BlockingQueue. Response và Execution\
      \ Context là bằng chứng runtime cho behavior này; đoạn source colocated ở trê\
      n cho thấy code path tạo experiment.</p>"
