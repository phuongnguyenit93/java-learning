  condition():
    execution: |-
      <p><b>Concept:</b> API dùng một ReentrantLock với hai Condition tách biệt cho hai loại sự kiện.</p>
      <ol>
        <li>Một waiter chờ dataAvailable, waiter còn lại chờ shutdownRequested.
          <div><i>Nguồn: CoordinationService.conditionDemo()</i></div>
          <pre><code>    public Map&lt;String, Object&gt; conditionDemo() throws InterruptedException {
                  ReentrantLock lock = new ReentrantLock();
                  Condition dataAvailable = lock.newCondition();
                  Condition shutdownRequested = lock.newCondition();
                  BooleanBox dataReady = new BooleanBox();
                  BooleanBox shutdown = new BooleanBox();
                  CountDownLatch waitersStarted = new CountDownLatch(2);
                  AtomicBoolean dataWaiterProceeded = new AtomicBoolean(false);
                  AtomicBoolean shutdownWaiterProceeded = new AtomicBoolean(false);
              ...
          }</code></pre>
        </li>
        <li>Signal dataAvailable chỉ cho data waiter đi tiếp trong khi shutdown waiter vẫn chờ.</li>
        <li>Sau đó signal shutdownRequested và join cả hai, chứng minh mỗi Condition có wait queue logic riêng.</li>
      </ol>
      <p><b>Kết luận:</b> Phối hợp nhiều Condition với ReentrantLock. Response và Execution Context là bằng chứng runtime cho behavior này; đoạn source colocated ở trên cho thấy code path tạo experiment.</p>
    usage: true
