      \ and blocks in <code>put(\"payload\")</code> because no consumer is waiting.\n\
      \    <div><i>Source: CoordinationService.synchronousQueueDemo()</i></div>\n\
      \    <pre><code>    public Map&lt;String, Object&gt; synchronousQueueDemo()\
      \ throws InterruptedException {\n            SynchronousQueue&lt;String&gt;\
      \ queue = new SynchronousQueue&lt;&gt;();\n            AtomicReference&lt;String&gt;\
      \ received = new AtomicReference&lt;&gt;();\n    \n            Thread consumer\
      \ = new Thread(() -&gt; {\n                try {\n                    received.set(queue.take());\n\
      \                } catch (InterruptedException e) {\n                    Thread.currentThread().interrupt();\n\
      \        ...\n    }</code></pre>\n  </li>\n  <li>After that waiting state is\
      \ observed, the consumer starts and calls <code>take()</code>.</li>\n  <li>The\
      \ producer and consumer rendezvous, both terminate, and the queue still reports\
      \ size zero because it never stores the element.</li>\n</ol>\n<p><b>Conclusion:</b>\
      \ Observe direct handoff with SynchronousQueue. The response and Execution Context\
      \ are the runtime evidence for this behavior; the colocated source snippet shows\
      \ the code path that creates the experiment.</p>"
