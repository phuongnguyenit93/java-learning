          <div><i>Source: CoordinationService.synchronizersDemo()</i></div>
          <pre><code>    public Map&lt;String, Object&gt; synchronizersDemo() throws InterruptedException {
                  Map&lt;String, Object&gt; result = new LinkedHashMap&lt;&gt;();
                  result.put("countDownLatch", countDownLatchSample());
                  result.put("cyclicBarrier", cyclicBarrierSample());
                  result.put("semaphore", semaphoreSample());
                  result.put("phaser", phaserSample());
                  result.put("exchanger", exchangerSample());
                  return result;
              }</code></pre>
        </li>
        <li>A two-party <code>CyclicBarrier</code> releases both parties and runs its barrier action once.</li>
        <li>A two-permit <code>Semaphore</code> limits four workers to at most two active holders.</li>
        <li>A <code>Phaser</code> coordinates two worker phases with registration and deregistration.</li>
        <li>An <code>Exchanger</code> pairs two workers and swaps their values.</li>
      </ol>
      <p><b>Conclusion:</b> Compare higher-level synchronizers. The response and Execution Context are the runtime evidence for this behavior; the colocated source snippet shows the code path that creates the experiment.</p>
