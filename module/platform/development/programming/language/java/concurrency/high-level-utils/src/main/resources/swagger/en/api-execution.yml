      \    public Map&lt;String, Object&gt; joinDemo() throws InterruptedException\
      \ {\n            AtomicBoolean workerCompleted = new AtomicBoolean(false);\n\
      \            Thread worker = new Thread(() -&gt; workerCompleted.set(true),\
      \ \"join-worker\");\n    \n            try {\n                worker.start();\n\
      \                joinOrFail(worker);\n            } finally {\n            \
      \    cleanupThreads(worker);\n        ...\n    }</code></pre>\n  </li>\n  <li>A\
      \ bounded <code>join()</code> waits for it to terminate.</li>\n  <li>The response\
