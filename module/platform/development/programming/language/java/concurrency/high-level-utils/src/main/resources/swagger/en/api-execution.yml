      \            List&lt;String&gt; consumed = java.util.Collections.synchronizedList(new\
      \ ArrayList&lt;&gt;());\n    \n            Thread producer = new Thread(() -&gt;\
      \ {\n                try {\n                    for (int i = 1; i &lt;= 5; i++)\
      \ {\n                        queue.put(\"item-\" + i);\n                   \
