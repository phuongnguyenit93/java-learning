      <ol>
        <li>A data waiter awaits <code>dataAvailable</code> and a shutdown waiter awaits <code>shutdownRequested</code>.
          <div><i>Source: CoordinationService.conditionDemo()</i></div>
          <pre><code>    public Map&lt;String, Object&gt; conditionDemo() throws InterruptedException {
                  ReentrantLock lock = new ReentrantLock();
                  Condition dataAvailable = lock.newCondition();
                  Condition shutdownRequested = lock.newCondition();
                  BooleanBox dataReady = new BooleanBox();
                  BooleanBox shutdown = new BooleanBox();
                  CountDownLatch waitersStarted = new CountDownLatch(2);
                  AtomicBoolean dataWaiterProceeded = new AtomicBoolean(false);
                  AtomicBoolean shutdownWaiterProceeded = new AtomicBoolean(false);
              ...
          }</code></pre>
        </li>
        <li>The caller signals only <code>dataAvailable</code> and verifies that the shutdown waiter has not proceeded.</li>
        <li>It then sets the shutdown predicate and signals the second condition.</li>
        <li>Both workers are joined and the response records the targeted wake-up behavior.</li>
      </ol>
      <p><b>Conclusion:</b> Coordinate multiple Conditions with ReentrantLock. The response and Execution Context are the runtime evidence for this behavior; the colocated source snippet shows the code path that creates the experiment.</p>
