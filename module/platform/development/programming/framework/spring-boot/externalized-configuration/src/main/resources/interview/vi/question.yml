  - question: 'Metadata cấu hình của Spring Boot dùng để làm gì, và kỹ sư cần tránh suy luận sai điều gì về runtime chỉ từ gợi ý IDE hoặc tệp metadata?'
    answer: 'Metadata cấu hình mô tả các key được hỗ trợ, kiểu, giá trị mặc định, mô tả, deprecation và gợi ý để IDE hay công cụ khác có thể hỗ trợ completion và tài liệu. Configuration processor có thể sinh metadata lúc biên dịch từ các kiểu @ConfigurationProperties. Metadata không phải PropertySource lúc chạy, không tạo giá trị, không đổi precedence và cũng không cấp quyền hay thực hiện binding. Một key vẫn có thể bind dù metadata tùy chỉnh bị thiếu; ngược lại có entry metadata không chứng minh rằng runtime thật sự nhận key đó từ một nguồn nào hoặc validation đã thành công. Nếu IDE gợi ý sai, hãy điều tra việc sinh metadata. Nếu ứng dụng nhận sai giá trị, hãy quay về Environment, PropertySource, precedence và binding. Tách tooling compile-time khỏi hành vi runtime giúp tránh sửa nhầm lớp vấn đề.'
    aiGenerated: true
