  - question: 'Bạn sẽ quyết định thế nào giữa import bắt buộc, import optional và configtree cho cấu hình được mount, và cần giải thích những đánh đổi vận hành nào với đội production?'
    answer: 'Import bắt buộc nên làm startup thất bại khi tài nguyên đó là một phần của hợp đồng cấu hình, vì tiếp tục chạy khi thiếu dữ liệu bắt buộc chỉ đẩy lỗi sang giai đoạn sau và làm nguyên nhân khó thấy hơn. optional: chỉ phù hợp khi việc tài nguyên không tồn tại thật sự là trạng thái được thiết kế chấp nhận, ví dụ lớp ghi đè cục bộ cho lập trình viên hoặc tài nguyên nền tảng có thể vắng hợp lệ. configtree: phù hợp khi nền tảng mount mỗi giá trị thành một tệp và Boot cần đưa cây tệp đó vào Environment. Đánh đổi là tính tiện dụng có thể làm giảm khả năng quan sát nếu mọi thứ đều bị đánh dấu optional hoặc bị chia nhỏ quá mức. Đội vận hành nên giữ fail-fast cho đầu vào bắt buộc, tài liệu hóa đường dẫn mount và để vòng đời, lưu trữ, rotation cùng quyền truy cập secret cho hệ thống hạ tầng hoặc security chịu trách nhiệm.'
    aiGenerated: true
