  - question: 'So sánh spring.config.location, spring.config.additional-location và spring.config.import. Khi nào nên dùng từng cơ chế, và chuyện gì dễ xảy ra nếu coi chúng là tương đương?'
    answer: 'spring.config.location thay tập vị trí tìm Config Data mặc định bằng danh sách được cung cấp, vì vậy phù hợp khi môi trường triển khai muốn một hợp đồng tìm kiếm thay thế có chủ đích. spring.config.additional-location giữ các vị trí mặc định rồi bổ sung vị trí mới, nên thường hợp với mô hình cấu hình đóng gói làm nền và một thư mục vận hành dùng để ghi đè. spring.config.import giải quyết bài toán khác: một tài liệu Config Data kéo thêm tài nguyên vào thành phần cấu hình của chính nó, và dữ liệu được import tham gia thứ tự tương đối với tài liệu khai báo. Nếu coi ba cơ chế là một, đội ngũ có thể vô tình làm mất vị trí mặc định, tạo chuỗi import khó lần theo hoặc hiểu sai thứ tự giá trị. Câu hỏi thiết kế đúng là đang thay cách tìm, mở rộng cách tìm hay ghép thêm tài liệu vào một tài liệu hiện có.'
    aiGenerated: true
    reviewed: false
