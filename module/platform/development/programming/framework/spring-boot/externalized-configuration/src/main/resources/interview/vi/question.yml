  - question: 'Vì sao List phức hợp ở nguồn precedence cao thay toàn bộ List ở nguồn thấp thay vì vá từng phần tử, và vì sao không được khái quát quy tắc đó sang Map hoặc property đặc biệt của Boot?'
    answer: 'Với binding List phức hợp thông thường qua @ConfigurationProperties, List từ nguồn tham gia có precedence cao hơn thay toàn bộ List ở nguồn thấp; nó không vá từng index trên danh sách đã bind trước đó. Vì vậy một ghi đè tưởng như chỉ đổi một phần tử có thể làm các phần tử khác biến mất khỏi List có hiệu lực. Map có hành vi khác: các key có thể được kết hợp qua nhiều nguồn, còn khi trùng key thì giá trị từ nguồn precedence cao hơn thắng. Một số property đặc biệt của Boot như spring.profiles.include lại có quy tắc xử lý riêng và không nên suy luận như List binder thông thường. Ý nghĩa thực tế là phải xác định cơ chế đang xử lý cấu hình trước khi giả định merge hay replace. Nếu một List thường xuyên cần vá một phần theo môi trường, nên xem lại hình dạng cấu hình hoặc cân nhắc Map hay cấu trúc tường minh khác phù hợp hơn với ý nghĩa ghi đè mong muốn.'
    aiGenerated: true
