  - question: 'Bạn phân biệt thế nào giữa lỗi nạp Config Data, lỗi binding hoặc chuyển đổi kiểu và lỗi validation, và vì sao xác định đúng giai đoạn lại quan trọng?'
    answer: 'Lỗi nạp nghĩa là Boot chưa lấy được hoặc chưa phân tích được đầu vào cấu hình, ví dụ import bắt buộc bị thiếu. Lỗi binding hoặc chuyển đổi kiểu xảy ra sau khi key đã có thể tham gia: tên hay cấu trúc không khớp mô hình Java, hoặc một giá trị đã phân giải như timeout=banana không thể chuyển thành Duration. Lỗi validation xảy ra muộn hơn, khi binding đã tạo được giá trị có kiểu nhưng giá trị đó vi phạm ràng buộc miền, ví dụ -1 bị @Positive từ chối. Phân biệt giai đoạn quan trọng vì mỗi lỗi cần bằng chứng và cách sửa khác nhau. Đánh dấu import thành optional không sửa được lỗi chuyển đổi kiểu, nới validation không sửa dữ liệu sai định dạng, và điều tra precedence không giúp ích nếu tài nguyên chưa từng được nạp. Chẩn đoán theo luồng giúp tránh thay đổi cấu hình ngẫu nhiên chỉ để làm quá trình khởi động đi qua.'
