  - question: 'Hãy giải thích constructor binding của @ConfigurationProperties trong Spring Boot 3.x, gồm cách chọn constructor và hệ quả ở bước build liên quan đến tên tham số Java.'
    answer: 'Constructor binding cho phép Boot tạo trực tiếp một đối tượng cấu hình bất biến từ tham số constructor thay vì tạo bean khả biến rồi gọi setter. Trong Boot 3.x, nếu kiểu @ConfigurationProperties chỉ có một constructor có tham số thì Boot thường dùng constructor đó mà không cần @ConstructorBinding. Nếu có nhiều constructor, @ConstructorBinding có thể chỉ rõ constructor cần dùng; constructor đánh dấu @Autowired sẽ đi theo cơ chế tạo bean khác. Kiểu dùng constructor binding vẫn phải được đăng ký qua @ConfigurationPropertiesScan hoặc @EnableConfigurationProperties thay vì coi là @Component thông thường. Binder còn cần tên tham số constructor khả dụng lúc chạy, nên mã thường phải biên dịch với -parameters. Boot Gradle plugin tự cấu hình tùy chọn này, Maven dùng spring-boot-starter-parent kế thừa thiết lập phù hợp, còn cấu hình build tùy chỉnh phải tự bảo đảm. Vì vậy lỗi binding có thể bắt nguồn từ thông tin tên tham số do trình biên dịch giữ lại, dù mã Java nhìn hoàn toàn đúng.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '7.ConfigurationProperties/ConfigurationProperties.md'
      anchor: 'constructor-binding'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: 'Relaxed binding có ý nghĩa gì đối với cách đặt tên biến môi trường, và kỷ luật đặt tên nào giúp tránh bất ngờ khi triển khai?'
    answer: 'Relaxed binding cho phép một property chuẩn được biểu diễn bằng dạng vật lý phù hợp với từng nguồn. Với khóa cấu hình công khai của ứng dụng, nên dùng dạng kebab-case chữ thường làm hợp đồng chuẩn. Khi chuyển sang biến môi trường, Boot áp dụng quy tắc xác định: dấu chấm thành gạch dưới, dấu gạch ngang bị bỏ, chữ chuyển thành chữ hoa và chỉ số List được đặt giữa hai dấu gạch dưới. Ví dụ my.service[0].other trở thành MY_SERVICE_0_OTHER. Điều này quan trọng vì nền tảng triển khai thường chỉ cung cấp biến môi trường trong khi mã nguồn và tài liệu dùng tên property chuẩn. Đội ngũ nên tài liệu hóa key chuẩn rồi suy ra tên theo quy tắc của từng nguồn, thay vì tự tạo nhiều cách viết riêng. Cách làm đó giúp cấu hình dễ di chuyển và giúp chẩn đoán nhanh khi một biến không bind vì tên vật lý được chuyển đổi sai.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '8.RelaxedAndComplexBinding/RelaxedAndComplexBinding.md'
      anchor: 'environment-variable-mapping'
    apiRelated:
      controller: ''
