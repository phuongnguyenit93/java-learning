  - question: 'Bạn chọn @Value hay @ConfigurationProperties cho cấu hình ứng dụng theo tiêu chí nào, và vì sao đây là quyết định thiết kế chứ không phải quyết định về precedence?'
    answer: '@Value tiện cho một số ít giá trị đơn lẻ, cục bộ và còn hỗ trợ SpEL, nên phù hợp khi cấu hình chỉ phục vụ một điểm tiêu thụ nhỏ. @ConfigurationProperties phù hợp hơn khi nhiều giá trị cùng tạo thành một không gian tên có thể tái sử dụng, đặc biệt khi cần đối tượng lồng nhau, List, Map, validation, chuyển đổi kiểu, metadata và khả năng refactor an toàn. Cả hai đều nhận dữ liệu sau khi Environment đã phân giải nguồn thắng, vì vậy không annotation nào có precedence cao hơn annotation kia. Quyết định nằm ở hình dạng và quyền sở hữu của hợp đồng cấu hình phía ứng dụng. Một dấu hiệu nên chuyển sang @ConfigurationProperties là có nhiều @Value cùng lặp tiền tố, quy tắc kiểm tra và logic chuyển đổi ở nhiều nơi, khiến hợp đồng cấu hình bị phân tán.'
    aiGenerated: true
