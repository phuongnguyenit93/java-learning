  - question: 'Externalized Configuration của Spring Boot dừng ở đâu trong môi trường production, và khi nào một cuộc điều tra nên bàn giao sang Actuator, Testing, Spring Cloud Config hoặc quản lý secret?'
    answer: 'Module này sở hữu cách Boot nhận đầu vào cấu hình, xử lý Config Data, áp dụng precedence và profile, cung cấp giá trị đã phân giải, bind cấu hình có kiểu, tích hợp validation và xuất metadata cấu hình. Cơ chế ghi đè chỉ dành cho test thuộc Spring Boot Testing vì nó hoạt động trong test context chứ không phải quá trình khởi động production thông thường. Actuator có thể cung cấp bằng chứng vận hành qua env hoặc configprops, nhưng hành vi endpoint, quyền truy cập và khả năng quan sát ở production thuộc phạm vi Actuator hoặc Application Runtime. Yêu cầu cấu hình tập trung từ xa nên bàn giao sang Spring Cloud Config thay vì ép vào Config Data cục bộ. Việc lưu trữ, rotation, phân phối và chính sách truy cập secret thuộc security hoặc infrastructure; Boot chỉ tiêu thụ giá trị đã được cung cấp. Ranh giới rõ ràng giúp cuộc điều tra chuyển đúng nơi thay vì biến Externalized Configuration thành module chịu trách nhiệm cho mọi vấn đề vận hành lân cận.'
