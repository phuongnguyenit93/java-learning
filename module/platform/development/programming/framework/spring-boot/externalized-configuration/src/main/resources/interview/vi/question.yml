questions:
  - question: 'Vì sao Externalized Configuration của Spring Boot nhấn mạnh việc chạy cùng một gói ứng dụng với các giá trị khác nhau theo môi trường, và ranh giới thiết kế nào vẫn phải nằm trong mã ứng dụng?'
    answer: 'Externalized Configuration tách các giá trị phụ thuộc lúc triển khai khỏi hành vi của chương trình để cùng một gói đã biên dịch có thể đi qua development, staging và production mà không phải build lại chỉ vì endpoint, port, timeout, ngưỡng hoặc tham chiếu thông tin xác thực thay đổi. Lợi ích là khả năng tái sử dụng và vận hành linh hoạt, nhưng điều đó không có nghĩa mọi quyết định đều nên đưa vào property. Mã ứng dụng vẫn phải sở hữu quy tắc nghiệp vụ và logic diễn giải cấu hình. Một ranh giới hữu ích là hỏi đội vận hành có thể đổi giá trị này mà năng lực của ứng dụng vẫn giữ nguyên hay không. Nếu thay đổi đó làm đổi quy tắc cốt lõi hoặc cấu trúc chương trình, nó nên nằm trong code. Tách hai phần như vậy cũng giúp giải thích rõ gói ứng dụng nào đang chạy và đầu vào môi trường nào đang làm hành vi thay đổi.'
    aiGenerated: true
