  - question: 'Khi nào nên dùng Spring profile thay cho cách ghi đè property thông thường, và việc tạo profile cho mọi giá trị phụ thuộc môi trường sẽ gây vấn đề gì?'
    answer: 'Profile phù hợp khi một chế độ có tên kích hoạt một biến thể cấu hình gồm nhiều khác biệt có liên hệ, chẳng hạn bộ thiết lập production cho database, messaging và feature. Nếu chỉ một timeout, port, hostname hoặc endpoint cần đổi, ghi đè property trực tiếp thường rõ hơn. Khi mỗi cluster, region, customer hay secret lại có profile riêng, profile trở thành một hệ cấu hình thứ hai nằm chồng lên precedence thông thường. Hệ quả là số tổ hợp tăng, quan hệ kích hoạt khó nhìn và việc chẩn đoán phải suy luận đồng thời cả tập profile lẫn thứ tự nguồn. Nên chọn cơ chế nhỏ nhất diễn đạt đúng yêu cầu: override trực tiếp cho giá trị đơn lẻ và profile cho một biến thể có tên thật sự gồm nhiều thay đổi liên quan.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '5.ProfilesAndActivation/ProfilesAndActivation.md'
      anchor: 'profile-boundary'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: 'Vì sao @PropertySource có thể quá muộn với các thiết lập như logging.* hoặc spring.main.*, dù sau đó property vẫn xuất hiện trong Environment?'
    answer: '@PropertySource được thêm khi ApplicationContext đang refresh, trong khi một số quyết định của Boot phải được thực hiện trước giai đoạn đó. Các thiết lập được đọc sớm như logging.* hoặc spring.main.* có thể đã được Boot tiêu thụ trước khi @PropertySource được đăng ký. Vì vậy có một failure mode dễ gây nhầm: key xuất hiện hợp lệ trong Environment về sau nhưng không còn khả năng thay đổi quyết định bootstrap đã xảy ra. Với thiết lập cần tác động sớm, nên dùng nguồn có mặt trước thời điểm quyết định, chẳng hạn Config Data phù hợp, biến môi trường, JVM system property hoặc tham số dòng lệnh. Điểm cần nhớ là không chỉ precedence quyết định kết quả; thời điểm một PropertySource tham gia vòng đời khởi động cũng quan trọng.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.PropertySourcesAndPrecedence/PropertySourcesAndPrecedence.md'
      anchor: 'propertysource-timing'
    apiRelated:
      controller: ''
