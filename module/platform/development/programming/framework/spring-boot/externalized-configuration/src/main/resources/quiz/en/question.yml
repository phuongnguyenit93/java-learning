  - id: 'q20-effective-value-diagnostics'
    question: 'The application starts successfully, but app.region has an unexpected value. Which diagnostic sequence best follows the module mental model?'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '10.DiagnosticsAndSynthesis/DiagnosticsAndSynthesis.md'
      anchor: 'effective-value-debugging'
    apiRelated:
      controller: ''
      methodSignature: ''
    answers:
      - id: A
        answer: 'Start from the observed value, inspect the target binding type, then compare PropertySources only if conversion looks correct.'
        explanation: 'For an unexpected effective value, source participation and precedence should be established before investigating how the consumer binds that value.'
      - id: B
        answer: 'List candidate configuration files first, compare their physical order, then check profiles only if two files define the key.'
        explanation: 'File order alone is insufficient because active documents, imports, and PropertySource precedence determine which candidates actually participate and win.'
      - id: C
        answer: 'Check active profiles first, then change the highest-precedence source that mentions the key and observe whether the value changes.'
        explanation: 'Changing configuration before identifying all participating candidates can hide the cause; first trace the observed value back through sources and ordering.'
      - id: D
        answer: 'Write down the canonical key and observed value, list participating sources, check active documents, then apply precedence.'
        explanation: 'Correct. Trace the effective key backward through source participation and ordering before investigating placeholder or binding details.'
    correctAnswerId: D
