  - question: 'Explain Spring Boot 3.x constructor binding for @ConfigurationProperties, including constructor selection and the build-time implication of Java parameter names.'
    answer: 'Constructor binding lets Boot create an immutable configuration object directly from constructor parameters instead of constructing a mutable bean and calling setters. In Boot 3.x, a @ConfigurationProperties type with one parameterized constructor normally uses that constructor without requiring @ConstructorBinding; if several constructors exist, @ConstructorBinding can identify the intended one, while an @Autowired constructor opts out of this binding path. The type must still be registered through @ConfigurationPropertiesScan or @EnableConfigurationProperties rather than treated as an ordinary component. The binder also needs constructor parameter names to be discoverable at runtime, so compilation normally requires -parameters. The Boot Gradle plugin configures that option, Maven builds using spring-boot-starter-parent inherit the relevant compiler setup, and custom build configurations must ensure it explicitly. A deployment failure here can therefore come from build metadata even when the Java constructor itself looks correct.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
