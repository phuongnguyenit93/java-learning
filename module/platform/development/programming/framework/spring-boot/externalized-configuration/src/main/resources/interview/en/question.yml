  - question: 'How do you choose between @Value and @ConfigurationProperties for application configuration, and why is this a design decision rather than a precedence decision?'
    answer: '@Value is convenient for a small number of local scalar values and can also evaluate SpEL, so it works well when configuration is isolated to one consuming component. @ConfigurationProperties is the better fit when several values form one reusable namespace, especially when nested objects, lists, maps, validation, type-safe conversion, metadata, and refactoring support matter. Both consume values that have already been resolved through Environment, so neither annotation has a special precedence advantage. The choice is about the shape and ownership of the application-facing configuration contract. A warning sign is many related @Value injections that duplicate prefixes and validation logic; that usually indicates a typed configuration object would communicate intent more clearly.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
