  - question: 'Compare spring.config.location, spring.config.additional-location, and spring.config.import. When would you choose each, and what mistake happens if their roles are treated as interchangeable?'
    answer: 'spring.config.location changes the search locations and replaces the normal defaults unless those defaults are explicitly included, so it is appropriate when a deployment wants a deliberate replacement search contract. spring.config.additional-location keeps the normal defaults and adds extra locations, which fits the common pattern of packaged defaults plus an operational override directory. spring.config.import is different: a Config Data document composes in another resource and the imported data participates relative to that declaring document. Treating them as interchangeable can silently remove expected default locations, create hidden import chains, or produce surprising ordering. The design question is whether you are replacing discovery, extending discovery, or composing one document with another.'
    aiGenerated: true
    reviewed: false
