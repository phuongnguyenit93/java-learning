questions:
  - question: 'Why does Spring Boot externalized configuration emphasize running the same application artifact with different environment-specific values, and what design boundary should remain in application code?'
    answer: 'Externalized configuration separates deploy-time values from program behavior so the same compiled artifact can move across development, staging, and production without being rebuilt just to change endpoints, ports, timeouts, thresholds, or credential references. The benefit is portability and operational flexibility, but it does not mean every decision belongs in properties. Application code should still own domain rules and the logic that interprets configuration. A useful boundary is whether operations can change a value while preserving the same application capability; if changing it redefines core behavior, it is probably code rather than configuration. This distinction also improves reproducibility because teams can reason separately about artifact identity and environment-specific inputs.'
    aiGenerated: true
    reviewed: false
