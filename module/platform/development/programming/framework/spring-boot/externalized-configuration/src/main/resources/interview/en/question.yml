  - question: 'Why can @PropertySource be too late for settings such as logging.* or spring.main.*, even if the property later appears in Environment?'
    answer: '@PropertySource is added while the application context is being refreshed, but some Boot decisions are made before that refresh stage. Early settings such as logging configuration or spring.main.* may already have been consumed by the time the @PropertySource is registered. That creates an important failure mode: the key can be visible later in Environment and still have had no effect on the earlier decision. For early Boot controls, use a source that participates before the decision is made, such as supported Config Data, an environment variable, JVM system property, or command-line argument. The lesson is that source timing matters in addition to source precedence.'
    aiGenerated: true
    reviewed: false
