  - id: 'q04-config-location-vs-additional'
    question: 'Một môi trường triển khai cần giữ các vị trí Config Data mặc định của Boot và thêm file:./ops/ làm vị trí ghi đè bổ sung. Thiết lập nào phù hợp nhất?'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '3.ConfigDataFilesAndLocations/ConfigDataFilesAndLocations.md'
      anchor: 'spring-config-additional-location'
    apiRelated:
      controller: ''
      methodSignature: ''
    answers:
      - id: A
        answer: 'Dùng spring.config.location=file:./ops/ và mong Boot tự nối thêm mọi vị trí mặc định.'
        explanation: 'spring.config.location thay thế tập tìm kiếm mặc định trừ khi các vị trí mong muốn được đưa vào tường minh.'
      - id: B
        answer: 'Dùng spring.config.name=ops để Boot tìm cả basename application và ops trong mọi vị trí mặc định.'
        explanation: 'spring.config.name thay đổi basename được tìm kiếm; nó không bổ sung một thư mục độc lập.'
      - id: C
        answer: 'Dùng spring.config.import=file:./ops/ vì import mở rộng tập tìm kiếm mặc định toàn cục cho mọi tài liệu.'
        explanation: 'Import kết hợp Config Data từ tài liệu khai báo và không tương đương với việc mở rộng các vị trí tìm kiếm toàn cục.'
      - id: D
        answer: 'Dùng spring.config.additional-location=file:./ops/ để giữ nguyên các vị trí tìm kiếm mặc định.'
        explanation: 'Đúng. additional-location mở rộng tập tìm kiếm thông thường thay vì thay thế nó.'
    correctAnswerId: D

