      - id: A
        answer: 'Chạy cùng một gói ứng dụng ở nhiều môi trường bằng cách cung cấp các giá trị khác nhau.'
        explanation: 'Đúng. Các giá trị phụ thuộc môi trường có thể thay đổi trong khi gói ứng dụng đã biên dịch vẫn giữ nguyên.'
      - id: B
        answer: 'Chuyển các quyết định nghiệp vụ sang tệp cấu hình để mã ứng dụng không còn sở hữu hành vi.'
        explanation: 'Quy tắc nghiệp vụ vẫn thuộc mã ứng dụng; cấu hình bên ngoài dành cho các giá trị có thể thay đổi mà không định nghĩa lại hành vi.'
      - id: C
        answer: 'Bảo đảm tệp cấu hình bên ngoài ghi đè mọi nguồn thuộc tính khác mà ứng dụng sử dụng.'
        explanation: 'Tệp bên ngoài tham gia thứ tự ưu tiên, nhưng nguồn đứng sau như tham số dòng lệnh vẫn có thể ghi đè chúng.'
      - id: D
        answer: 'Buộc mã ứng dụng đọc trực tiếp từng nguồn cấu hình vật lý thay vì dùng Environment.'
        explanation: 'Spring thường cung cấp kết quả đã phân giải qua Environment hoặc binding thay vì yêu cầu đọc trực tiếp mọi nguồn.'
    correctAnswerId: A

