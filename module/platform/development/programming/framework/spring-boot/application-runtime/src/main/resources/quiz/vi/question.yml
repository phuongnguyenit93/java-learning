      anchor: "applicationrunner-vs-commandlinerunner"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Khi startup logic cần góc nhìn option và non-option đã được Boot parse từ command line."
        explanation: "`ApplicationRunner` nhận `ApplicationArguments`, cung cấp option, non-option và source arguments đã được phân loại."
      - id: B
        answer: "Khi startup logic phải chạy sau `ApplicationReadyEvent` thay vì trước readiness."
        explanation: "Cả hai runner interface đều chạy trước `ApplicationReadyEvent`; khác biệt không nằm ở lifecycle timing."
      - id: C
        answer: "Khi startup logic chỉ cần raw argument string mà không cần góc nhìn đã parse của Boot."
        explanation: "`CommandLineRunner` là interface nhận trực tiếp chuỗi `String...` nguyên bản."
      - id: D
        answer: "Khi startup logic phải chạy bất đồng bộ trên một managed thread riêng."
        explanation: "Không runner interface nào mặc định có ngữ nghĩa async; cả hai cùng tham gia startup runner phase."
    correctAnswerId: A
  - id: "application-runtime-q04"
    question: "Ứng dụng được khởi động với `--mode=demo sample`. `ApplicationArguments` của Boot nên biểu diễn đầu vào này như thế nào?"
