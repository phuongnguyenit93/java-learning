questions:
  - id: "application-runtime-q01"
    question: "Một startup runner mất vài giây để hoàn tất. Chuỗi nào khớp nhất với lifecycle mặc định của Spring Boot quanh runner đó?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.ApplicationLifecycleEvents/ApplicationLifecycleEvents.md"
      anchor: "context-started-ready-events"
    apiRelated:
      controller: "ApplicationRuntimeExperimentController"
      methodSignature: "lifecycleTimeline()"
    answers:
      - id: A
        answer: "Sau refresh, ready và readiness chấp nhận traffic xảy ra trước khi runner bắt đầu."
        explanation: "Runner chạy trước `ApplicationReadyEvent`; Boot không chuyển readiness sang nhận traffic trước khi runner hoàn tất."
      - id: B
        answer: "Sau refresh là started và liveness; runner chạy; ready và readiness chấp nhận traffic diễn ra sau."
        explanation: "Chuỗi này giữ đúng khác biệt giữa một context đã live và một ứng dụng đã hoàn tất công việc khởi động bắt buộc."
      - id: C
        answer: "Trước refresh, runner chạy để có thể ảnh hưởng bean nào được tạo."
        explanation: "Runner cần context đã refresh nên không thể dùng theo cách đó để điều khiển việc tạo bean ở giai đoạn trước."
      - id: D
        answer: "Sau refresh, runner chạy; liveness và readiness đều chỉ đổi khi runner hoàn tất."
        explanation: "Boot phát liveness sau giai đoạn started, còn readiness chấp nhận traffic sau giai đoạn ready, tức là sau runner."
    correctAnswerId: B
  - id: "application-runtime-q02"
    question: "Một thành phần cần quan sát `ApplicationEnvironmentPreparedEvent`, khi bean graph thông thường chưa tồn tại. Cách đăng ký nào phù hợp nhất?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.ApplicationLifecycleEvents/ApplicationLifecycleEvents.md"
      anchor: "early-listener-registration"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Chỉ khai báo listener dạng `@Bean` và dựa vào eager bean creation."
        explanation: "Event có thể xảy ra trước khi bean đó tồn tại, nên bean lifecycle thông thường không thể giúp listener quan sát một mốc sớm hơn."
      - id: B
        answer: "Đưa logic vào `ApplicationRunner` vì runner sẽ nhận lại toàn bộ event trước đó."
        explanation: "Runner chạy ở giai đoạn sau và Spring Boot không replay các SpringApplication event sớm cho runner."
      - id: C
        answer: "Tự phát lại một environment event tương tự sau khi context refresh."
        explanation: "Phát lại event muộn hơn sẽ thay đổi ý nghĩa lifecycle thay vì quan sát đúng checkpoint thật."
      - id: D
        answer: "Đăng ký qua cơ chế early-listener được hỗ trợ trên `SpringApplication` hoặc builder của nó."
        explanation: "Event sớm cần listener nằm ngoài bean lifecycle thông thường vì `ApplicationContext` chưa thể tạo listener bean ở thời điểm đó."
    correctAnswerId: D
  - id: "application-runtime-q03"
    question: "Hai runner interface chạy trong cùng startup phase. Khi nào `ApplicationRunner` là lựa chọn phù hợp hơn `CommandLineRunner`?"
