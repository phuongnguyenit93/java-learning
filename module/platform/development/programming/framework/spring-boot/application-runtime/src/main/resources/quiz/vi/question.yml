        explanation: "Tên type mô tả hạ tầng nhưng không chứng minh task quan sát được đã vượt qua ranh giới thread."
      - id: D
        answer: "Endpoint trả response trong vòng ba giây."
        explanation: "Timeout chỉ giới hạn experiment; thời gian hoàn tất không cho biết thread nào đã thực thi task."
