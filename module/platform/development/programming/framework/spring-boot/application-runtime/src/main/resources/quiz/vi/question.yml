  - id: "application-runtime-q05"
    question: "Database tạm thời bị mất kết nối nên request không thể xử lý, nhưng process có thể tự phục hồi khi database hoạt động lại. Cách nhìn availability nào an toàn hơn theo mô hình của module?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.AvailabilityFailureExit/AvailabilityFailureExit.md"
      anchor: "liveness-readiness-model"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Chuyển liveness sang broken và vẫn để readiness chấp nhận traffic cho tới khi database phục hồi."
        explanation: "Gắn liveness trực tiếp với một dependency dùng chung có thể tạo restart storm và làm sự cố nghiêm trọng hơn."
      - id: B
        answer: "Chuyển readiness sang từ chối traffic còn liveness tập trung vào trạng thái process không thể tự phục hồi."
        explanation: "Readiness trả lời có nên nhận traffic lúc này hay không; liveness không nên biến mọi lỗi dependency có thể hồi phục thành lý do restart process."
      - id: C
        answer: "Giữ cả liveness và readiness chấp nhận traffic vì dependency outage luôn nằm ngoài availability."
        explanation: "Readiness hoàn toàn có thể phản ánh việc ứng dụng hiện tại có phục vụ traffic được hay không."
      - id: D
        answer: "Chuyển cả liveness và readiness sang broken để restart và loại traffic xảy ra cùng lúc."
        explanation: "Dependency outage dùng chung có thể khiến readiness từ chối traffic, nhưng coi nó là liveness failure có thể khuếch đại sự cố bằng restart."
    correctAnswerId: B
  - id: "application-runtime-q06"
    question: "Một ứng dụng kiểu command gọi `SpringApplication.exit(context)` và nhận exit code 7. Chỉ từ lời gọi này, điều gì đúng?"
