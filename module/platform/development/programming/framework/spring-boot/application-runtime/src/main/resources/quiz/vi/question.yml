  - id: "application-runtime-q09"
    question: "Một ứng dụng non-web đặt toàn bộ công việc lâu dài lên virtual thread rồi thoát ngoài ý muốn khi không còn non-daemon thread nào khác. Setting nào của Boot xử lý trực tiếp vấn đề vòng đời process này?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.VirtualThreads/VirtualThreads.md"
      anchor: "virtual-thread-daemon-keepalive"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Đặt `spring.task.scheduling.pool.size=1` để platform scheduler thread giữ JVM sống."
        explanation: "Các property về pool không còn mô tả cùng một mô hình khi Boot dùng scheduler dựa trên virtual thread."
      - id: B
        answer: "Đặt `spring.main.keep-alive=true` để Boot giữ JVM sống khi không còn non-daemon thread khác."
        explanation: "Boot cung cấp setting này cho trường hợp không còn non-daemon thread nào khác giữ process hoạt động."
      - id: C
        answer: "Đặt `spring.main.lazy-initialization=false` để eager bean creation giữ JVM sống."
        explanation: "Thời điểm khởi tạo bean không tạo ra bảo đảm non-daemon process liveness đang thiếu."
      - id: D
        answer: "Đặt readiness thành accepting để Boot giữ JVM sống khi scheduled work còn tồn tại."
        explanation: "Availability mô tả khả năng nhận traffic; nó không giữ JVM sống."
    correctAnswerId: B
