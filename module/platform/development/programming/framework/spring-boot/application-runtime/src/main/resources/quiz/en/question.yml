    answers:
      - id: A
        answer: "Both tokens become non-option arguments, and the original source arguments are not retained."
        explanation: "Boot keeps the source arguments and also separates option arguments from positional input."
      - id: B
        answer: "`sample` becomes an option, while `--mode=demo` becomes a non-option argument."
        explanation: "The `--name=value` form is an option; the positional token is the non-option argument."
      - id: C
        answer: "`mode` is option value `demo`, `sample` is non-option, and both remain in source arguments."
        explanation: "That is the parsed view the runtime experiment is designed to expose without manual `String[]` parsing."
      - id: D
        answer: "`mode` is option value `demo`, while `sample` is discarded from parsed and source views."
        explanation: "`ApplicationArguments` preserves non-option arguments as well as the original source arguments."
    correctAnswerId: C
  - id: "application-runtime-q05"
    question: "A temporary database outage prevents requests from succeeding, but the application process itself can recover when the database returns. Which availability response is the safer default mental model?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.AvailabilityFailureExit/AvailabilityFailureExit.md"
      anchor: "liveness-readiness-model"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Set liveness to broken and leave readiness accepting until the database returns."
        explanation: "Coupling liveness directly to a shared external dependency can create restart storms and amplify the outage."
      - id: B
        answer: "Set readiness to refuse traffic while keeping liveness focused on unrecoverable process state."
        explanation: "Readiness answers whether traffic should arrive now; liveness should avoid treating every recoverable external outage as a reason to restart the process."
      - id: C
        answer: "Keep liveness and readiness accepting because dependency outages are always external to availability."
        explanation: "Readiness can legitimately reflect whether the application can currently serve traffic."
      - id: D
        answer: "Set both liveness and readiness to broken so restart and traffic removal happen together."
        explanation: "A recoverable shared dependency outage may justify refusing traffic, but treating it as liveness failure can amplify the outage through restarts."
    correctAnswerId: B
  - id: "application-runtime-q06"
    question: "A command-style Boot application calls `SpringApplication.exit(context)` and receives exit code 7. What follows from that call alone?"
