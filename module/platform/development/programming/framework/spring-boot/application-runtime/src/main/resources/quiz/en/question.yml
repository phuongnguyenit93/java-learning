      - id: B
        answer: "When `main()` would make an already-supported setting more visible to application developers."
        explanation: "Code visibility alone does not add a capability or lifecycle requirement that justifies replacing the supported property."
      - id: C
        answer: "When the property cannot express the requirement or customization must occur before the normal context exists."
        explanation: "The narrowest supported owner is preferred; programmatic bootstrap code is justified by a concrete capability or lifecycle need."
      - id: D
        answer: "When auto-configuration consumes the property and the application only needs to override its supported default value."
        explanation: "A supported property already provides that override surface; extra bootstrap code can instead interfere with Boot conventions."
