      - id: B
        answer: "Logging initializes before ordinary configuration beans, so their property sources can arrive too late."
        explanation: "Logging must be available during early startup and failure, so Boot prepares it before normal bean configuration."
      - id: C
        answer: "Logging initializes after ordinary configuration beans, but ignores their property sources by design."
        explanation: "The ordering is reversed: Boot prepares logging before ordinary configuration beans are processed."
      - id: D
        answer: "Logging reads only JVM system properties, so Environment property sources never participate."
        explanation: "Boot can read logging properties from the early Environment; the limitation is source timing, not a JVM-only rule."
