# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: "application-runtime-q01"
    question: "A startup runner takes several seconds. Which sequence best matches Spring Boot's default lifecycle around that runner?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.ApplicationLifecycleEvents/ApplicationLifecycleEvents.md"
      anchor: "context-started-ready-events"
    apiRelated:
      controller: "ApplicationRuntimeExperimentController"
      methodSignature: "lifecycleTimeline()"
    answers:
      - id: A
        answer: "After refresh, ready and readiness acceptance occur before the runner begins."
        explanation: "Runners execute before `ApplicationReadyEvent`; readiness is not moved to accepting traffic first."
      - id: B
        answer: "After refresh, started and liveness occur; the runner runs; ready and readiness acceptance follow."
        explanation: "This preserves the important distinction between a live context and an application whose required startup runners have finished."
      - id: C
        answer: "Before refresh, the runner executes so it can influence which beans are created."
        explanation: "A runner relies on a refreshed context and is therefore too late to control bean creation that way."
      - id: D
        answer: "After refresh, the runner runs; liveness and readiness both change only when it finishes."
        explanation: "Boot publishes liveness after the started phase, while readiness acceptance follows the ready phase after runners."
    correctAnswerId: B
  - id: "application-runtime-q02"
    question: "A component must observe `ApplicationEnvironmentPreparedEvent`, before the normal bean graph exists. What is the most appropriate registration strategy?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.ApplicationLifecycleEvents/ApplicationLifecycleEvents.md"
      anchor: "early-listener-registration"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Declare only a normal `@Bean` listener and rely on eager bean creation."
        explanation: "The event can occur before that bean exists, so eager creation inside the normal context cannot make the listener observe an earlier phase."
      - id: B
        answer: "Put the work in an `ApplicationRunner` because runners receive all earlier events retrospectively."
        explanation: "Runners execute later and do not replay early SpringApplication events."
      - id: C
        answer: "Publish a replacement environment event after the context refresh."
        explanation: "Recreating an event later changes its lifecycle meaning instead of observing the real bootstrap checkpoint."
      - id: D
        answer: "Register it through a supported early-listener mechanism on `SpringApplication` or its builder."
        explanation: "Early events require listener registration outside the ordinary bean lifecycle because the `ApplicationContext` is not yet able to create the listener bean."
    correctAnswerId: D
  - id: "application-runtime-q03"
    question: "Both runner interfaces execute in the same startup phase. When is `ApplicationRunner` the better choice than `CommandLineRunner`?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.ArgumentsAndRunners/ArgumentsAndRunners.md"
      anchor: "applicationrunner-vs-commandlinerunner"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "When startup logic needs Boot's parsed option and non-option view of command-line input."
        explanation: "`ApplicationRunner` receives `ApplicationArguments`, which exposes parsed options, non-options, and source arguments."
      - id: B
        answer: "When startup logic must run after `ApplicationReadyEvent` instead of before readiness."
        explanation: "Both runner interfaces execute before `ApplicationReadyEvent`; their difference is not lifecycle timing."
      - id: C
        answer: "When startup logic must receive only the raw argument strings without Boot's parsed view."
        explanation: "`CommandLineRunner` is the interface that directly receives the raw `String...` argument sequence."
      - id: D
        answer: "When startup logic must execute asynchronously on a separate managed thread."
        explanation: "Neither runner interface implies asynchronous execution; both participate in the same startup runner phase."
    correctAnswerId: A
  - id: "application-runtime-q04"
    question: "The application starts with `--mode=demo sample`. What should Boot's `ApplicationArguments` expose?"
    aiGenerated: true
