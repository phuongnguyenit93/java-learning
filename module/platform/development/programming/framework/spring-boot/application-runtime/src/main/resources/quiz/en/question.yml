      anchor: "virtual-thread-switch"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Boot switches supported executors and schedulers to virtual threads and also converts third-party pools."
        explanation: "The property governs supported Boot-managed infrastructure, not arbitrary executors created elsewhere."
      - id: B
        answer: "Boot keeps platform-thread executors and schedulers but changes task submission to non-blocking mode."
        explanation: "The property changes supported Boot-managed executor and scheduler implementations rather than merely altering task submission semantics."
      - id: C
        answer: "Boot switches supported executors and schedulers to virtual threads; Java still defines thread semantics."
        explanation: "Boot owns the integration switch; Java still owns behavior such as scheduling, pinning, interruption, and workload suitability."
      - id: D
        answer: "Boot switches supported executors and schedulers to virtual threads and guarantees CPU-bound throughput gains."
        explanation: "Virtual threads do not add processors and do not guarantee performance improvements for every workload."
    correctAnswerId: C
  - id: "application-runtime-q09"
    question: "A non-web application schedules all of its ongoing work on virtual threads and unexpectedly exits when no other non-daemon thread remains. Which Boot setting directly addresses that process-lifecycle issue?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.VirtualThreads/VirtualThreads.md"
      anchor: "virtual-thread-daemon-keepalive"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Set `spring.task.scheduling.pool.size=1` so a platform scheduler thread keeps the JVM alive."
        explanation: "Pooling properties do not describe the same model when Boot uses its virtual-thread scheduler strategy."
      - id: B
        answer: "Set `spring.main.keep-alive=true` so Boot keeps the JVM alive without another non-daemon thread."
        explanation: "Boot provides this setting specifically for applications that otherwise have no non-daemon thread keeping the process alive."
      - id: C
        answer: "Set `spring.main.lazy-initialization=false` so eager bean creation keeps the JVM alive."
        explanation: "Bean initialization timing does not provide the missing non-daemon process-liveness guarantee."
      - id: D
        answer: "Set readiness to accepting so Boot keeps the JVM alive while scheduled work exists."
        explanation: "Availability state communicates traffic readiness; it does not keep the JVM alive."
    correctAnswerId: B
  - id: "application-runtime-q10"
    question: "Why can global lazy initialization make a deployment look faster while increasing runtime risk?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.StartupOptimization/StartupOptimization.md"
      anchor: "lazy-initialization-tradeoffs"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Bean creation stays eager, but dependency injection is postponed until the first request."
        explanation: "Lazy initialization defers eligible bean creation itself; it does not keep eager construction and postpone only injection."
      - id: B
        answer: "Bean creation is deferred, but configuration errors are still guaranteed to surface before readiness."
        explanation: "Some failures can move to first use, so readiness does not guarantee that every lazy bean has already been created successfully."
      - id: C
        answer: "Bean creation is deferred, and unused beans are removed permanently after startup."
        explanation: "Lazy beans remain part of the application graph and can still be created when a later dependency or request needs them."
      - id: D
        answer: "Bean creation is deferred, so first-use latency and some failures can move into live traffic."
        explanation: "A shorter startup path can simply defer work and failure discovery, so optimization should be measured end to end."
    correctAnswerId: D
