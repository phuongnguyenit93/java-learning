        answer: "`SpringApplication.exit` returns code 7 and immediately terminates the JVM."
        explanation: "`SpringApplication.exit` computes and returns an exit code; it does not itself guarantee JVM termination."
      - id: B
        answer: "`SpringApplication.exit` returns code 7 and converts it into an `ApplicationFailedEvent`."
        explanation: "An application exit code is a process result contract and is not automatically a startup-failure event."
      - id: C
        answer: "`SpringApplication.exit` returns code 7 and automatically publishes it to the operating system."
        explanation: "Command applications can pass the returned value to `System.exit(...)` when process termination is intended."
      - id: D
        answer: "`SpringApplication.exit` returns code 7; terminating the JVM or passing that code to the OS is separate."
        explanation: "This separates Boot's exit-code calculation from the Java process termination action."
    correctAnswerId: D
  - id: "application-runtime-q07"
