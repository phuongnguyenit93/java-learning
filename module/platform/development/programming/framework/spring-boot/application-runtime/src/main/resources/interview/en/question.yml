- question: "How should you investigate a Spring Boot startup failure when a FailureAnalyzer prints a friendly APPLICATION FAILED TO START message? What evidence should remain authoritative?"
  answer: >-
    The analyzer output is a diagnostic interpretation of the failure, not a replacement for the underlying exception. Start with the root exception and causal chain, then use any FailureAnalyzer description and action to narrow the likely cause. If auto-configuration decisions are relevant, inspect the condition evaluation report as additional evidence. ApplicationFailedEvent can be used for bootstrap-level observation or telemetry, but a listener should not swallow the fatal exception merely to make startup appear successful. This order prevents trial-and-error property changes from masking the real cause and preserves a failure mode that deployment tooling can detect correctly.
