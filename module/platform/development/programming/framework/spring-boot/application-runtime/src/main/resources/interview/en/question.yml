- question: "A team enables lazy initialization and celebrates a faster readiness time. What failures or latency might they merely have moved, and how would you decide whether the trade-off is acceptable?"
  answer: >-
    Lazy initialization defers creation of eligible beans until first use. That can shorten the startup critical path, but the deferred work still exists. A misconfigured bean that previously failed during deployment can now fail on the first request or background task, and expensive initialization can move from startup latency to first-use latency. The application may still eventually allocate the same steady-state object graph, so startup memory observations are not the whole capacity story. Measure startup and first-use behavior, identify which beans are actually deferred, and preserve eager initialization for components whose failures should be discovered before traffic. The optimization is acceptable only when the operational value of faster startup outweighs delayed failure detection and runtime latency risk.
  aiGenerated: true
  reviewed: false
