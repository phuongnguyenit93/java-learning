- question: "Compare an application event listener, ApplicationRunner/CommandLineRunner, and a managed executor or scheduler as runtime extension points. How do prerequisites and readiness requirements determine the right choice?"
  answer: >-
    An application event listener is appropriate when the intent is to observe or react to a lifecycle transition and the required state exists at that event. A runner is appropriate for bounded startup work that needs the refreshed context and whose successful completion should delay ApplicationReadyEvent and readiness. A managed executor or scheduler is for work that continues independently after startup; an endless loop or long-lived consumer in a runner prevents startup from completing. The decision therefore has two dimensions: what state must already exist, and whether readiness must wait for the work. Choosing by those guarantees also makes failure timing clear: a runner failure is a startup failure, while a later background-task failure belongs to steady-state runtime handling.
  aiGenerated: true
  reviewed: false
