- question: "A locally running Compose database maps its container port to an ephemeral host port, while application.properties contains a fixed database port. Why can Boot still connect to the ephemeral port, and what should you inspect before changing the property?"
  answer: >-
    Spring Boot's Docker Compose integration can create service-connection details for a recognized service and uses the mapped host port that the local JVM can actually reach. Those connection details take precedence over the ordinary connection-related configuration properties consumed by the corresponding auto-configuration. That precedence is intentional because a dynamic host port cannot be known by static configuration in advance. Before editing the property, inspect the current Compose mapping and the service connection that Boot created. Also confirm that the service is recognized or correctly labeled; if no supported connection details exist, then normal application properties may again be the active source.
  aiGenerated: true
  reviewed: false
