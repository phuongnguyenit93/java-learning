- question: "When would you choose ApplicationRunner instead of CommandLineRunner, and what does ApplicationArguments add beyond manually parsing String[] args?"
  answer: >-
    Both runner interfaces execute in the same Boot startup phase, so the choice is about input semantics rather than timing. CommandLineRunner receives the raw argument sequence, while ApplicationRunner receives ApplicationArguments, which preserves the original arguments and also exposes option names, option values, and non-option arguments. ApplicationRunner is therefore preferable when startup logic treats values such as --mode=demo as structured options; CommandLineRunner is suitable when the exact raw sequence is the useful contract. ApplicationArguments does not replace externalized-configuration precedence, because command-line options may also participate in that broader configuration model. The runtime arguments experiment demonstrates the parsed option/non-option view without requiring custom parsing code.
  aiGenerated: true
  reviewed: false
