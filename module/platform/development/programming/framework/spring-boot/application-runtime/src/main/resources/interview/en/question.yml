- question: "What problem do named SSL bundles solve, and why does having an SslBundle bean neither define an organization's PKI policy nor automatically configure every third-party client?"
  answer: >-
    A named SSL bundle separates reusable key/trust material and SSL options from the consumers that need them. Boot can bind JKS/PKCS12 or PEM configuration, expose it through the SslBundles catalog, and let supported integrations or application code obtain an SslBundle and create the SSL objects they require. The abstraction removes repeated file-path and credential configuration, but consumers still need explicit Boot bundle support or a compatible SSL hook; arbitrary libraries are not rewritten just because a bundle exists. The bundle also expresses configured material, not security policy. Certificate issuance, trust-chain design, rotation, hostname verification, protocol and cipher choices, and other PKI decisions remain security responsibilities.
  aiGenerated: true
  reviewed: false
