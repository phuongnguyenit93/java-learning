- question: "Why can a property source declared on a normal @Configuration class be too late to influence Boot's earliest logging, and why do logback-spring.xml or log4j2-spring.xml change the integration boundary?"
  answer: >-
    Boot initializes logging before the ApplicationContext so startup messages and early failures can be logged. A @PropertySources declaration on a normal configuration class is processed after that bootstrap decision and therefore cannot retroactively configure the earliest logging system. Boot-supported environment properties that are available during early bootstrap can participate. The -spring native configuration variants let Boot control the supported initialization phase and apply Boot extensions such as profile- or environment-aware features before handing behavior to the underlying logging implementation. Use Boot properties for common controls and native configuration for implementation-specific appenders, filters, encoders, or routing; log shipping and centralized analysis remain observability concerns.
  aiGenerated: true
