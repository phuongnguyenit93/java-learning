- question: "When should you prefer a supported Boot property over programmatic SpringApplication customization, and when does SpringApplicationBuilder represent a real architectural choice rather than nicer syntax?"
  answer: >-
    Prefer a supported property when it already expresses the behavior because it is visible in configuration metadata, participates in externalized configuration, and preserves Boot's documented lifecycle and back-off conventions. Programmatic SpringApplication customization is appropriate for bootstrap behavior that must be assembled before the normal context and cannot be expressed by the property surface, such as explicit listener or initializer registration. SpringApplicationBuilder becomes architecturally significant when it is used to create parent/child ApplicationContext hierarchies; those contexts share an Environment and have placement constraints for web components. A hierarchy therefore changes runtime structure and ownership. Programmatic bootstrap code should remain small so it does not become a second container-configuration system hidden inside main().
