questions:
- question: "Explain the Spring Boot runtime as a sequence of increasingly complete states. Why are context refresh, ApplicationStartedEvent, liveness, startup runners, ApplicationReadyEvent, and readiness not interchangeable checkpoints?"
  answer: >-
    Context refresh means the Spring container has completed refresh, but Boot still has startup work to coordinate. ApplicationStartedEvent is published after refresh and before ApplicationRunner/CommandLineRunner execution. Boot then publishes liveness as CORRECT, runs the startup runners, publishes ApplicationReadyEvent, and only afterward publishes readiness as ACCEPTING_TRAFFIC. Each checkpoint therefore provides a different guarantee. Code that only needs beans can run after refresh, while work that must wait for required startup initialization should treat runner completion or readiness as the stronger boundary. Conflating the checkpoints creates bugs such as accepting traffic while required startup work is still running. The lifecycle experiment is useful evidence because it records these phases from the running application rather than inferring them from names.
  aiGenerated: true
  reviewed: false
  readmeRelated:
    file: 1.RuntimeModel/RuntimeModel.md
    anchor: runtime-phase-model
  apiRelated:
