- question: "During an incident the application is live but never becomes ready, logs show normal context refresh, and no requests are being served. How would you classify the problem before changing configuration?"
  answer: >-
    Start from the runtime timeline rather than from a random property. A live application has passed context refresh and the started/liveness phase, while readiness still waits for startup runners and the final ready transition. Inspect runner execution, blocking startup work, and availability changes first. If a runner is waiting on an external dependency, decide whether that dependency truly must block readiness or whether the work belongs in managed background infrastructure. If the runner itself was selected because of a configuration or auto-configuration decision, follow that evidence to the owning module next. This classification narrows the search to the phase between liveness and readiness and avoids unrelated changes to logging, web-server settings, or probe configuration.
