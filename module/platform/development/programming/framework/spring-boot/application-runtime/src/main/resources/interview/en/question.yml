- question: "Why is carrying platform-thread pool-size tuning directly into a virtual-thread configuration a conceptual error, and when can spring.main.keep-alive become relevant?"
  answer: >-
    Pool-size properties describe capacity management for a bounded set of platform worker threads. Boot's virtual-thread-backed SimpleAsyncTaskExecutor and SimpleAsyncTaskScheduler use a different model, so old pool arithmetic no longer controls parallelism in the same way and some pooling-related scheduler properties are ignored. Virtual threads still consume CPU, memory, connections, and downstream capacity, so limits may still be necessary, but they must be placed where the constrained resource actually exists. Virtual threads are daemon threads, which also creates a process-lifecycle concern: a non-web or scheduling-oriented application may exit when only daemon virtual threads remain. spring.main.keep-alive can keep the JVM alive in that case; it is a lifecycle setting, not a performance knob.
