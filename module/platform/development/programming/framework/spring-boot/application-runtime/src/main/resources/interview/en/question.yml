    methodSignature: lifecycleTimeline()
- question: "A component must observe ApplicationEnvironmentPreparedEvent and also needs an application service bean. Why is a normal bean listener the wrong design, and how would you redesign the responsibility?"
  answer: >-
    ApplicationEnvironmentPreparedEvent happens before a normal ApplicationContext bean graph exists, so a listener created as an ordinary bean cannot reliably observe it and cannot depend on application services at that point. A genuinely early listener must be registered before bean creation through SpringApplication, SpringApplicationBuilder, or the supported early-listener mechanism, and its responsibility should stay narrow enough to operate with the state available at that phase. If the real work requires repositories or services, move that work to a later event or startup hook and keep the early listener limited to capturing or preparing bootstrap information. The design principle is to choose the latest lifecycle phase that satisfies the requirement rather than forcing dependency injection into a phase where its prerequisites do not exist.
  aiGenerated: true
