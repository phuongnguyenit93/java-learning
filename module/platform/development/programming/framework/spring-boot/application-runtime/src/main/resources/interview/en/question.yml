- question: "Explain the difference between changing readiness, closing the ApplicationContext through Boot's shutdown lifecycle, gracefully draining an embedded web server, and returning a process exit code. Why should these remain separate concerns?"
  answer: >-
    Readiness is a routing signal that says whether new work should be accepted. Closing the ApplicationContext is the generic application-lifecycle action that runs managed destruction and lifecycle callbacks, normally coordinated by SpringApplication's JVM shutdown hook on a normal JVM exit. Graceful HTTP request draining is server- and protocol-specific behavior owned by the web runtime. An exit code is a process contract: ExitCodeGenerator and SpringApplication.exit can calculate a code, but SpringApplication.exit does not itself terminate the JVM. Keeping these concerns separate avoids assuming that one mechanism automatically supplies the others; for example, a context shutdown hook does not make unmanaged threads orderly, and a readiness change does not define HTTP drain timeouts.
  aiGenerated: true
  reviewed: false
