- question: "Why can replacing Boot's default executor to optimize one @Async use case affect unrelated framework behavior? What should you inventory before defining a custom executor?"
  answer: >-
    Boot's task executor is shared runtime infrastructure, not merely a convenience bean for one service. Supported integrations can consume it for asynchronous application work, MVC or WebFlux integration, GraphQL callable handling, and related framework needs. Defining an Executor can cause auto-configuration to back off, while some web integrations specifically expect an AsyncTaskExecutor with the conventional applicationTaskExecutor name. Before replacing it, inventory the consumers, required type and bean name, workload isolation needs, lifecycle behavior, and the configuration that the default already provides. A custom executor becomes an application-owned contract, so replacing the default only to reproduce it adds maintenance risk without improving the runtime model.
  aiGenerated: true
  reviewed: false
