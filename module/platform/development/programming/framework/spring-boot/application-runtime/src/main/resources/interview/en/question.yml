- question: "Why can a long-running or endless ApplicationRunner make an application look live but never ready, and why is adding @Order usually not a real fix?"
  answer: >-
    Boot publishes the started phase and liveness before invoking runners, but ApplicationReadyEvent and readiness follow only after all runners finish. A runner that blocks indefinitely can therefore leave a valid, live context that never becomes ready. @Order only controls relative ordering among runners; it does not make long-running work asynchronous and does not remove it from the startup critical path. If work must continue after startup, move it to managed background infrastructure. Use runner ordering only when there is a small, explicit startup dependency, and avoid turning numeric priorities into a hidden workflow engine whose failure and dependency model is difficult to reason about.
  aiGenerated: true
