- question: "A database becomes temporarily unavailable in production. Explain why marking liveness BROKEN may be more dangerous than refusing readiness, and what policy question Spring Boot leaves to the application."
  answer: >-
    Liveness asks whether the process is internally healthy enough to keep running or recover; readiness asks whether it should receive new traffic. If every instance converts a shared database outage into broken liveness, the platform may restart all instances even though restarting cannot repair the dependency, creating a restart storm and amplifying the incident. Refusing readiness can stop new traffic while preserving the process for recovery. Boot provides ApplicationAvailability and AvailabilityChangeEvent as the state model and signaling API, but it does not decide which domain condition should change those states. The application must define an operational policy based on whether a failure is internal and unrecoverable or external and potentially transient.
  aiGenerated: true
  reviewed: false
