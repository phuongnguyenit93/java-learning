- question: "Why does Spring Boot distinguish a Compose project it started from one that was already running, and why should Docker Compose development support not become a production orchestration strategy?"
  answer: >-
    Lifecycle ownership determines what Boot may safely stop. When Boot starts a discovered Compose project under a lifecycle policy, it can coordinate that project with application startup and normal shutdown. When the project is already running, Boot can still derive supported connection details but should not assume ownership and shut down infrastructure that another developer or process started. The feature is designed to remove local development glue around external services, including readiness and connection discovery. Image construction, networks, volumes, deployment topology, security, and production orchestration remain Docker/container-platform concerns. Using the development integration as a production orchestrator would give Boot responsibility it was not designed to own.
  aiGenerated: true
  reviewed: false
