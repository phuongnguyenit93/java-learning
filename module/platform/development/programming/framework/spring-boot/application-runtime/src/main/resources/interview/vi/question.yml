- question: "Vì sao property source khai báo trên @Configuration thông thường có thể quá muộn để ảnh hưởng logging sớm nhất của Boot, và vì sao logback-spring.xml hoặc log4j2-spring.xml thay đổi ranh giới tích hợp?"
  answer: >-
    Boot khởi tạo logging trước ApplicationContext để có thể ghi startup message và failure xảy ra sớm. @PropertySources trên configuration class thông thường được xử lý sau quyết định bootstrap đó nên không thể quay lại cấu hình logging system ở thời điểm sớm nhất. Các environment property Boot hỗ trợ và đã có mặt trong early bootstrap có thể tham gia. Biến thể native configuration dạng -spring cho phép Boot kiểm soát phase khởi tạo được hỗ trợ và áp dụng extension của Boot như profile/environment-aware feature trước khi giao behavior cho logging implementation bên dưới. Dùng Boot property cho control chung và native configuration cho appender, filter, encoder hoặc routing đặc thù implementation; log shipping và centralized analysis thuộc observability.
