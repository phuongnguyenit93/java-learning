- question: "Vì sao Spring Boot phân biệt Compose project do chính nó start với project đã chạy sẵn, và vì sao Docker Compose development support không nên trở thành chiến lược production orchestration?"
  answer: >-
    Lifecycle ownership quyết định Boot có thể stop thứ gì một cách an toàn. Khi Boot start Compose project được phát hiện theo lifecycle policy, nó có thể điều phối project đó cùng startup và normal shutdown của application. Khi project đã chạy sẵn, Boot vẫn có thể derive supported connection details nhưng không nên giả định ownership rồi tắt infrastructure do developer hoặc process khác khởi động. Feature này được thiết kế để giảm phần glue của local development quanh external service, bao gồm readiness và connection discovery. Image construction, network, volume, deployment topology, security và production orchestration vẫn thuộc Docker/container platform. Dùng development integration làm production orchestrator sẽ trao cho Boot trách nhiệm mà feature này không được thiết kế để sở hữu.
