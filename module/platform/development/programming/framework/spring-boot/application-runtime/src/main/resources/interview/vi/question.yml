- question: "Bạn nên điều tra lỗi startup của Spring Boot như thế nào khi FailureAnalyzer đã in ra thông báo APPLICATION FAILED TO START dễ đọc? Bằng chứng nào vẫn phải là nguồn chính?"
  answer: >-
    Output của analyzer là diễn giải chẩn đoán cho failure, không thay thế exception gốc. Hãy bắt đầu từ root exception và causal chain, sau đó dùng description/action của FailureAnalyzer để thu hẹp nguyên nhân. Nếu quyết định auto-configuration liên quan, condition evaluation report là bằng chứng bổ sung. ApplicationFailedEvent có thể phục vụ observation hoặc telemetry ở bootstrap, nhưng listener không nên nuốt fatal exception chỉ để startup có vẻ thành công. Thứ tự này tránh việc thử ngẫu nhiên các property cho đến khi chạy được và giữ failure mode rõ ràng để deployment tooling phát hiện chính xác.
