- question: "Database tạm thời mất kết nối ở production. Hãy giải thích vì sao đánh dấu liveness BROKEN có thể nguy hiểm hơn việc từ chối readiness, và Spring Boot để lại quyết định policy nào cho application?"
  answer: >-
    Liveness hỏi process có đủ khỏe để tiếp tục chạy hoặc tự phục hồi hay không; readiness hỏi process có nên nhận traffic mới hay không. Nếu mọi instance chuyển một database outage dùng chung thành broken liveness, platform có thể restart toàn bộ instance dù restart không sửa được dependency, tạo restart storm và làm incident nặng hơn. Refusing readiness có thể chặn traffic mới trong khi giữ process sống để phục hồi. Boot cung cấp ApplicationAvailability và AvailabilityChangeEvent làm model state và API báo hiệu, nhưng Boot không quyết định domain condition nào phải đổi các state đó. Application phải xác định policy vận hành dựa trên việc lỗi là nội bộ, không thể phục hồi hay là dependency bên ngoài có thể chỉ tạm thời gián đoạn.
  aiGenerated: true
  reviewed: false
