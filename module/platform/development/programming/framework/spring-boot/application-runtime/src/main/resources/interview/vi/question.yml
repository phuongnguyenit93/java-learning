- question: "Vì sao mang nguyên cách tune pool-size của platform thread sang cấu hình virtual thread là sai về mental model, và khi nào spring.main.keep-alive có thể trở nên cần thiết?"
  answer: >-
    Pool-size property mô tả cách quản lý capacity của một tập worker platform thread có giới hạn. SimpleAsyncTaskExecutor và SimpleAsyncTaskScheduler dựa trên virtual thread của Boot dùng mô hình khác, nên phép tính pool cũ không còn điều khiển parallelism theo cùng cách và một số property liên quan pooling của scheduler bị bỏ qua. Virtual thread vẫn tiêu thụ CPU, memory, connection và downstream capacity, vì vậy vẫn có thể cần giới hạn nhưng phải đặt ở nơi resource bị giới hạn thực sự. Virtual thread là daemon thread, từ đó phát sinh vấn đề process lifecycle: application non-web hoặc thiên về scheduling có thể thoát khi chỉ còn daemon virtual thread. spring.main.keep-alive có thể giữ JVM sống trong trường hợp đó; đây là lifecycle setting chứ không phải performance knob.
