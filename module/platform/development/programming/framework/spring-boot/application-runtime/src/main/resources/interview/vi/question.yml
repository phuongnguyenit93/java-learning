- question: "So sánh application event listener, ApplicationRunner/CommandLineRunner và managed executor hoặc scheduler như các runtime extension point. Prerequisite và yêu cầu về readiness quyết định lựa chọn như thế nào?"
  answer: >-
    Application event listener phù hợp khi mục đích là quan sát hoặc phản ứng với lifecycle transition và state cần thiết đã tồn tại ở event đó. Runner phù hợp cho startup work có giới hạn, cần context đã refresh và phải hoàn tất thành công trước ApplicationReadyEvent/readiness. Managed executor hoặc scheduler phù hợp cho công việc tiếp tục độc lập sau startup; vòng lặp vô hạn hoặc consumer chạy lâu trong runner sẽ ngăn startup hoàn tất. Vì vậy quyết định có hai trục: state nào phải tồn tại trước, và readiness có phải chờ công việc này hay không. Chọn theo các bảo đảm đó cũng làm rõ thời điểm lỗi: runner failure là startup failure, còn lỗi của background task về sau thuộc xử lý runtime ổn định.
  aiGenerated: true
