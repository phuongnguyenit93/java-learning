- question: "Khi nào bạn chọn ApplicationRunner thay vì CommandLineRunner, và ApplicationArguments cung cấp thêm điều gì so với tự parse String[] args?"
  answer: >-
    Hai runner interface chạy trong cùng một startup phase của Boot, nên lựa chọn dựa trên ngữ nghĩa input chứ không phải timing. CommandLineRunner nhận chuỗi argument thô, còn ApplicationRunner nhận ApplicationArguments, vừa giữ source arguments gốc vừa cung cấp option name, option value và non-option arguments. Vì vậy ApplicationRunner phù hợp khi startup logic coi giá trị như --mode=demo là option có cấu trúc; CommandLineRunner phù hợp khi chính thứ tự raw argument là contract cần dùng. ApplicationArguments không thay thế property-source precedence của externalized configuration, vì command-line option còn có thể tham gia model configuration rộng hơn đó. Experiment application arguments chứng minh góc nhìn option/non-option mà không cần code tự parse.
  aiGenerated: true
  reviewed: false
  readmeRelated:
    file: 3.ArgumentsAndRunners/ArgumentsAndRunners.md
    anchor: applicationrunner-vs-commandlinerunner
  apiRelated:
    controller: ApplicationRuntimeExperimentController
