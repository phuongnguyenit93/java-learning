- question: "Một component cần quan sát ApplicationEnvironmentPreparedEvent nhưng đồng thời cần một application service bean. Vì sao listener dạng bean thông thường là thiết kế sai, và bạn sẽ tách lại trách nhiệm như thế nào?"
  answer: >-
    ApplicationEnvironmentPreparedEvent xảy ra trước khi graph bean thông thường của ApplicationContext tồn tại, nên listener được tạo như bean bình thường không thể tin cậy để quan sát event này và cũng không thể phụ thuộc application service ở thời điểm đó. Listener thực sự cần chạy sớm phải được đăng ký trước bean creation qua SpringApplication, SpringApplicationBuilder hoặc cơ chế early-listener được hỗ trợ, đồng thời trách nhiệm của nó phải đủ hẹp để chỉ dùng state có sẵn ở phase đó. Nếu công việc thật sự cần repository hoặc service, hãy chuyển phần đó sang event hoặc startup hook muộn hơn và chỉ để early listener thu thập hoặc chuẩn bị thông tin bootstrap. Nguyên tắc thiết kế là chọn phase muộn nhất vẫn đáp ứng yêu cầu thay vì ép dependency injection vào phase chưa có đủ prerequisite.
  aiGenerated: true
