questions:
- question: "Hãy giải thích runtime của Spring Boot như một chuỗi trạng thái ngày càng hoàn chỉnh. Vì sao context refresh, ApplicationStartedEvent, liveness, startup runner, ApplicationReadyEvent và readiness không phải các mốc có thể thay thế cho nhau?"
  answer: >-
    Context refresh có nghĩa Spring container đã hoàn tất refresh, nhưng Boot vẫn còn công việc startup phải điều phối. ApplicationStartedEvent được publish sau refresh và trước khi ApplicationRunner/CommandLineRunner chạy. Sau đó Boot publish liveness là CORRECT, chạy các startup runner, publish ApplicationReadyEvent và chỉ sau đó mới publish readiness là ACCEPTING_TRAFFIC. Vì vậy mỗi mốc đưa ra một bảo đảm khác nhau. Code chỉ cần bean có thể chạy sau refresh, còn công việc bắt buộc phải hoàn tất trước khi nhận traffic cần coi runner completion hoặc readiness là ranh giới mạnh hơn. Đánh đồng các mốc dễ tạo lỗi như nhận traffic khi initialization bắt buộc vẫn đang chạy. Experiment lifecycle hữu ích vì ghi lại trực tiếp các phase từ application đang chạy thay vì suy luận từ tên event.
  aiGenerated: true
  reviewed: false
