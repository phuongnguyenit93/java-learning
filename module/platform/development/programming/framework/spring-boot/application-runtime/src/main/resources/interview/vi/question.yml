- question: "Trong một incident, application đã live nhưng không bao giờ ready, log cho thấy context refresh bình thường và chưa có request nào được phục vụ. Bạn sẽ phân loại vấn đề như thế nào trước khi thay configuration?"
  answer: >-
    Bắt đầu từ runtime timeline thay vì chọn ngẫu nhiên một property. Application đã live nghĩa là đã qua context refresh và started/liveness phase, trong khi readiness vẫn phải chờ startup runner và ready transition cuối. Hãy kiểm tra runner execution, startup work đang block và availability change trước. Nếu runner đang chờ external dependency, cần quyết định dependency đó có thật sự phải chặn readiness hay công việc nên chuyển sang managed background infrastructure. Nếu runner tồn tại do một quyết định configuration hoặc auto-configuration, tiếp tục lần theo evidence sang module sở hữu quyết định đó. Cách phân loại này thu hẹp phạm vi vào phase giữa liveness và readiness, tránh sửa không liên quan ở logging, web-server setting hoặc probe configuration.
