- question: "spring.threads.virtual.enabled=true thực sự thay đổi điều gì trong Spring Boot 3.3, và experiment task-executor có thể chứng minh điều gì về thay đổi đó mà không chứng minh virtual thread làm workload nhanh hơn?"
  answer: >-
    Property này yêu cầu Boot chọn strategy dựa trên virtual thread cho các hạ tầng runtime được hỗ trợ. Với task execution, Boot có thể dùng SimpleAsyncTaskExecutor cấu hình virtual thread thay cho ThreadPoolTaskExecutor thông thường; scheduling dùng strategy virtual-thread tương ứng. Experiment task-executor có thể cho thấy concrete executor class, task thật sự được dispatch sang worker khác và worker có Thread.isVirtual() bằng true hay không sau khi restart với switch được bật. Những dữ liệu đó chứng minh execution model nào của Boot đang active. Chúng không chứng minh throughput hay latency tốt hơn, vì khả năng mở rộng của workload, blocking behavior, CPU, downstream capacity, pinning và các vấn đề concurrency Java khác cần đo lường và phân tích riêng.
  aiGenerated: true
