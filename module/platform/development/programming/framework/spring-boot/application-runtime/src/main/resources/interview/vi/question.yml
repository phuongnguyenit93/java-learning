- question: "Một team bật lazy initialization rồi vui mừng vì readiness nhanh hơn. Những failure hoặc latency nào có thể chỉ bị dời sang thời điểm khác, và bạn đánh giá trade-off này như thế nào?"
  answer: >-
    Lazy initialization trì hoãn việc tạo các bean phù hợp đến lần dùng đầu tiên. Điều đó có thể rút ngắn startup critical path, nhưng công việc bị trì hoãn vẫn tồn tại. Bean cấu hình sai trước đây fail lúc deployment có thể nay chỉ fail ở request hoặc background task đầu tiên, còn initialization tốn kém có thể chuyển từ startup latency sang first-use latency. Application cuối cùng vẫn có thể tạo toàn bộ steady-state object graph, nên quan sát memory lúc startup không phải toàn bộ bài toán capacity. Hãy đo cả startup và first-use behavior, xác định bean nào thật sự bị defer, và giữ eager initialization cho component mà failure cần được phát hiện trước traffic. Tối ưu chỉ đáng chấp nhận khi giá trị vận hành của startup nhanh hơn lớn hơn rủi ro failure muộn và runtime latency.
  aiGenerated: true
  reviewed: false
  readmeRelated:
