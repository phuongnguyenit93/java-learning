    methodSignature: ""
- question: "Vì sao thay executor mặc định của Boot chỉ để tối ưu một use case @Async có thể ảnh hưởng các hành vi framework không liên quan? Trước khi định nghĩa custom executor cần kiểm kê điều gì?"
  answer: >-
    Task executor của Boot là hạ tầng runtime dùng chung, không chỉ là bean tiện ích cho một service. Các integration được hỗ trợ có thể dùng nó cho asynchronous application work, MVC hoặc WebFlux integration, GraphQL callable và các nhu cầu framework liên quan. Định nghĩa một Executor có thể khiến auto-configuration back off, trong khi một số web integration lại yêu cầu cụ thể AsyncTaskExecutor với tên convention applicationTaskExecutor. Trước khi thay, cần kiểm kê consumer, type và bean name bắt buộc, nhu cầu isolation của workload, lifecycle behavior và configuration mà default đang cung cấp. Custom executor trở thành contract do application sở hữu, nên thay default chỉ để tái tạo cùng behavior sẽ tăng chi phí bảo trì mà không cải thiện runtime model.
  aiGenerated: true
