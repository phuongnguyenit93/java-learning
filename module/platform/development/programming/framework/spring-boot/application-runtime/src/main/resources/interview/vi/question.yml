- question: "Hãy phân biệt việc đổi readiness, đóng ApplicationContext qua shutdown lifecycle của Boot, graceful drain của embedded web server và trả process exit code. Vì sao các trách nhiệm này nên tách riêng?"
  answer: >-
    Readiness là tín hiệu routing cho biết có nên nhận công việc mới hay không. Đóng ApplicationContext là hành động application-lifecycle tổng quát để chạy managed destruction và lifecycle callback, thường do JVM shutdown hook của SpringApplication điều phối khi JVM thoát bình thường. Graceful drain HTTP request là hành vi phụ thuộc server và protocol, thuộc web runtime. Exit code là contract với process caller: ExitCodeGenerator và SpringApplication.exit có thể tính code, nhưng SpringApplication.exit không tự kết thúc JVM. Tách các trách nhiệm tránh giả định một cơ chế tự động cung cấp tất cả phần còn lại; ví dụ shutdown hook của context không làm unmanaged thread trở nên có trật tự, và readiness change không định nghĩa timeout drain HTTP.
  aiGenerated: true
  reviewed: false
  readmeRelated:
    file: 4.AvailabilityFailureExit/AvailabilityFailureExit.md
    anchor: shutdown-boundaries
  apiRelated:
