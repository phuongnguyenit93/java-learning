- question: "Khi nào nên ưu tiên property được Boot hỗ trợ thay vì tùy biến SpringApplication bằng code, và khi nào SpringApplicationBuilder là một lựa chọn kiến trúc thật sự thay vì chỉ là syntax dễ đọc hơn?"
  answer: >-
    Hãy ưu tiên property khi nó đã diễn tả được behavior vì property xuất hiện trong configuration metadata, tham gia externalized configuration và giữ các convention lifecycle/back-off được Boot tài liệu hóa. Tùy biến SpringApplication bằng code phù hợp cho behavior bootstrap phải được lắp ráp trước context thông thường và không thể biểu diễn bằng property surface, ví dụ đăng ký listener hoặc initializer tường minh. SpringApplicationBuilder trở thành lựa chọn kiến trúc khi dùng để tạo hierarchy ApplicationContext cha/con; các context này chia sẻ Environment và có constraint về nơi đặt web component. Vì vậy hierarchy thay đổi runtime structure và ownership. Bootstrap code nên giữ nhỏ để không biến main() thành một hệ thống container configuration thứ hai bị ẩn.
