- question: "Named SSL bundle giải quyết vấn đề gì, và vì sao có SslBundle bean không đồng nghĩa Boot đã định nghĩa PKI policy của tổ chức hoặc tự cấu hình mọi third-party client?"
  answer: >-
    Named SSL bundle tách key/trust material và SSL option có thể dùng lại khỏi các consumer cần chúng. Boot có thể bind cấu hình JKS/PKCS12 hoặc PEM, expose qua catalog SslBundles, rồi để integration được hỗ trợ hoặc application code lấy SslBundle và tạo SSL object cần thiết. Abstraction này tránh lặp file path và credential configuration, nhưng consumer vẫn cần hỗ trợ bundle của Boot hoặc một SSL hook tương thích; library bất kỳ không tự bị rewiring chỉ vì bundle tồn tại. Bundle cũng chỉ biểu diễn material đã cấu hình chứ không quyết định security policy. Certificate issuance, trust-chain design, rotation, hostname verification, protocol/cipher và các quyết định PKI khác vẫn thuộc trách nhiệm security.
