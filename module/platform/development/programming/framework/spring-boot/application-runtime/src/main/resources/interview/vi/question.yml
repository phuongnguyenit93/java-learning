- question: "Một Compose database chạy local map container port sang host port ngẫu nhiên, trong khi application.properties chứa database port cố định. Vì sao Boot vẫn có thể kết nối host port ngẫu nhiên, và nên kiểm tra gì trước khi sửa property?"
  answer: >-
    Docker Compose integration của Spring Boot có thể tạo service-connection details cho service được nhận diện và sử dụng mapped host port mà JVM local thật sự truy cập được. Các connection detail này có độ ưu tiên cao hơn ordinary connection property mà auto-configuration tương ứng dùng. Độ ưu tiên đó là chủ đích vì static configuration không thể biết trước dynamic host port. Trước khi sửa property, hãy kiểm tra Compose mapping hiện tại và service connection Boot đã tạo. Đồng thời xác nhận service có được nhận diện hoặc gắn label đúng hay không; nếu không có supported connection details thì application property thông thường có thể lại là source đang có hiệu lực.
