- question: "Vì sao ApplicationRunner chạy rất lâu hoặc không kết thúc có thể khiến application trông vẫn live nhưng không bao giờ ready, và vì sao thêm @Order thường không phải cách sửa thật sự?"
  answer: >-
    Boot publish started phase và liveness trước khi gọi runner, nhưng ApplicationReadyEvent và readiness chỉ đến sau khi toàn bộ runner hoàn tất. Runner bị block vô thời hạn vì thế có thể để lại một context hợp lệ, đang live nhưng không bao giờ ready. @Order chỉ điều khiển thứ tự tương đối giữa các runner; nó không biến công việc dài thành asynchronous và không đưa công việc ra khỏi startup critical path. Nếu công việc phải tiếp tục sau startup, hãy chuyển sang managed background infrastructure. Chỉ dùng runner ordering khi có dependency startup nhỏ và rõ ràng, tránh biến các priority số thành workflow engine ẩn khiến dependency và failure khó lý giải.
  aiGenerated: true
  reviewed: false
