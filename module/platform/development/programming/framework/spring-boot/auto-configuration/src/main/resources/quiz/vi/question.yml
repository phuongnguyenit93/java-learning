  - id: auto-configuration-order-vs-bean-order
    question: "AcmeMetricsAutoConfiguration được sắp sau AcmeCoreAutoConfiguration. Thứ tự này chủ yếu bảo đảm điều gì?"
    answers:
      - id: A
        answer: "Bean definition của core được xử lý trước, vì vậy mọi bean instance của core cũng chắc chắn được tạo trước mọi bean instance của metrics."
        explanation: "Sai. Ordering có thể ảnh hưởng quá trình xử lý definition, nhưng không tạo ra một thứ tự khởi tạo bean toàn cục ở runtime."
      - id: B
        answer: "Condition của metrics chỉ được đánh giá sau khi vòng đời ApplicationContext của core hoàn tất, nên có thể quan sát các core bean đã khởi tạo đầy đủ."
        explanation: "Sai. Ordering áp dụng trong quá trình xử lý configuration; nó không chờ một vòng đời context riêng của core hoàn tất trước."
      - id: C
        answer: "Spring tạo dependency ngầm từ từng bean definition của metrics tới các definition của core để thứ tự init và destroy đi theo thứ tự configuration."
        explanation: "Sai. Auto-configuration order không tạo dependency edge giữa bean; quan hệ vòng đời vẫn phải xuất phát từ dependency thật của các bean."
      - id: D
        answer: "Core configuration có cơ hội đóng góp definition trước khi các condition trong auto-configuration phía sau được đánh giá."
        explanation: "Đúng. Auto-configuration ordering điều phối quá trình xử lý definition, điều này quan trọng khi condition phía sau quan sát các definition đã được đóng góp."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
