  - id: imports-vs-component-scanning
    question: "Một thư viện công bố AcmeClientAutoConfiguration. Trong Spring Boot 3.3, cách thông thường để Boot khám phá class này như một auto-configuration candidate là gì?"
    answers:
      - id: A
        answer: "Đặt class bên dưới base package của ứng dụng sử dụng thư viện để component scanning từ @SpringBootApplication tìm thấy nó."
        explanation: "Sai. Cơ chế khám phá auto-configuration không nên phụ thuộc vào ranh giới component scan của ứng dụng sử dụng thư viện."
      - id: B
        answer: "Liệt kê tên class đầy đủ trong META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports."
        explanation: "Đúng. Boot 3.3 khám phá các auto-configuration candidate được công bố từ AutoConfiguration.imports."
      - id: C
        answer: "Gắn @Component lên class và để Spring quét toàn bộ dependency JAR một cách tự động."
        explanation: "Sai. Component scanning rộng không phải cơ chế công bố auto-configuration của Boot."
      - id: D
        answer: "Chỉ đăng ký class trong application.properties vì file cấu hình sở hữu toàn bộ quá trình khám phá candidate."
        explanation: "Sai. Property có thể ảnh hưởng condition hoặc exclusion, nhưng không phải cơ chế đăng ký candidate thông thường."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ActivationDiscovery/ActivationDiscovery.md", anchor: "auto-configuration-imports"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: candidate-discovery-not-bean-creation
    question: "Boot đã khám phá một auto-configuration class từ AutoConfiguration.imports. Ở thời điểm này có thể kết luận điều gì?"
    answers:
      - id: A
        answer: "Boot đã chấp nhận class để xử lý configuration, nên các class-level condition đã khớp dù method-level condition vẫn có thể thất bại."
        explanation: "Sai. Discovery mới xác định candidate; việc các condition của configuration có khớp hay không vẫn thuộc giai đoạn xử lý tiếp theo."
      - id: B
        answer: "Boot sẽ đăng ký các bean definition của class trừ khi một exclusion tường minh loại candidate đó ở giai đoạn sau."
        explanation: "Sai. Candidate đã được khám phá vẫn có thể bị loại bởi class-level hoặc method-level condition mà không cần exclusion tường minh."
      - id: C
        answer: "Boot đã xác nhận imports entry hợp lệ và sẽ tạo configuration instance trước khi đánh giá condition trên các phương thức @Bean."
        explanation: "Sai. Discovery không kéo theo việc khởi tạo configuration sớm; condition vẫn chi phối definition nào thực sự được đóng góp."
      - id: D
        answer: "Chỉ có thể kết luận class đủ điều kiện đi tiếp vào quá trình xử lý auto-configuration; việc condition khớp và đóng góp bean vẫn là các quyết định riêng."
        explanation: "Đúng. AutoConfiguration.imports cung cấp candidate, còn condition ở các bước sau mới quyết định configuration và bean definition nào thực sự được áp dụng."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.ActivationDiscovery/ActivationDiscovery.md", anchor: "candidate-discovery-vs-bean-creation"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: optional-class-linkage-boundary
    question: "Một thư viện tùy chọn có thể vắng mặt. Vì sao chỉ đặt @ConditionalOnClass trên một phương thức @Bean trả về trực tiếp type của thư viện tùy chọn vẫn có rủi ro?"
    answers:
      - id: A
        answer: "JVM có thể phải phân giải chữ ký phương thức trước khi condition ở mức method kịp bảo vệ type tùy chọn đó."
        explanation: "Đúng. Type tùy chọn trong chữ ký có thể gây lỗi liên kết trước khi method-level condition phát huy tác dụng; cô lập phía sau configuration có class-level guard an toàn hơn."
      - id: B
        answer: "Vì Boot có thể đọc annotation metadata mà không load class tùy chọn, chữ ký phương thức sẽ an toàn miễn là condition tham chiếu class đó qua metadata."
        explanation: "Sai. Annotation metadata có thể được đọc an toàn trong nhiều trường hợp, nhưng JVM vẫn có thể resolve type tùy chọn xuất hiện trực tiếp trong chữ ký phương thức."
      - id: C
        answer: "Condition ở mức method được đánh giá trước khi Spring cần chữ ký @Bean method, nên guard tại method là đủ khi type tùy chọn chỉ xuất hiện ở return type."
        explanation: "Sai. Chính chữ ký có thể trở thành ranh giới linkage trước khi condition ở mức method kịp bảo vệ type tùy chọn."
      - id: D
        answer: "Rủi ro linkage chủ yếu nằm ở class tùy chọn dùng trong annotation attribute; return type chỉ được resolve lúc @Bean method chạy nên thường không cần cô lập thêm."
        explanation: "Sai. Type tùy chọn trong configuration signature có thể được resolve sớm hơn lúc gọi bean method, vì vậy ranh giới configuration có class-level guard an toàn hơn."
    correctAnswerId: A
    aiGenerated: true
