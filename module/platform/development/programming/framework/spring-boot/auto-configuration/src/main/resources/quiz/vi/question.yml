questions:
  - id: auto-configuration-defaults-control
    question: "Phát biểu nào mô tả đúng nhất mục tiêu thiết kế của Spring Boot auto-configuration?"
    answers:
      - id: A
        answer: "Nó thiết lập một baseline theo quy ước và ứng dụng chủ yếu tùy biến baseline đó bằng các external property."
        explanation: "Sai. External property chỉ là một cơ chế điều khiển; auto-configuration còn phải back off khi bean hoặc condition khác cho thấy ứng dụng đã tự sở hữu quyết định."
      - id: B
        answer: "Nó đóng góp các mặc định hạ tầng được suy ra từ dependency và giữ các mặc định đó trừ khi bean của người dùng được đánh dấu @Primary."
        explanation: "Sai. @Primary ảnh hưởng cách chọn bean khi inject; nó không phải tín hiệu chung để auto-configuration back off."
      - id: C
        answer: "Nó đóng góp các mặc định theo quy ước khi condition phù hợp và back off khi cấu hình của ứng dụng nên sở hữu quyết định đó."
        explanation: "Đúng. Boot dùng condition để cung cấp mặc định hữu ích mà vẫn nhường quyền kiểm soát cho cấu hình tường minh của ứng dụng."
      - id: D
        answer: "Nó tập trung hóa cấu hình hạ tầng phổ biến để ứng dụng thường thay thế mặc định bằng cách exclude toàn bộ auto-configuration tương ứng."
        explanation: "Sai. Exclusion có tồn tại, nhưng cách tùy biến thông thường thường chi tiết hơn thông qua condition và back-off thay vì tắt toàn bộ candidate."
    correctAnswerId: C
