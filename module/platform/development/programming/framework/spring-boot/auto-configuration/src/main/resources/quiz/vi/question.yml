  - id: property-condition-input-model
    question: "Trong module này, mối quan hệ nào giữa externalized configuration và @ConditionalOnProperty là chính xác nhất?"
    answers:
      - id: A
        answer: "Externalized Configuration quyết định trạng thái property hiệu lực; @ConditionalOnProperty đọc trạng thái đó từ Environment làm đầu vào cho quyết định auto-configuration."
        explanation: "Đúng. Việc nạp và ưu tiên property source quyết định giá trị hiệu lực, còn condition dùng giá trị đó để quyết định configuration có khớp hay không."
      - id: B
        answer: "@ConditionalOnProperty đọc trực tiếp property source khớp đầu tiên, nên thứ tự lookup của nó có thể khác precedence của giá trị hiệu lực trong Environment."
        explanation: "Sai. Condition dựa trên cơ chế phân giải property của Environment thay vì định nghĩa một mô hình precedence riêng giữa các property source."
      - id: C
        answer: "@ConditionalOnProperty đánh giá sau khi @ConfigurationProperties binding hoàn tất, nên giá trị field đã convert trong object được dùng làm đầu vào condition."
        explanation: "Sai. Condition có thể đọc trạng thái property mà không cần tạo và bind một @ConfigurationProperties bean trước đó."
      - id: D
        answer: "@ConditionalOnProperty tham gia vào Config Data loading bằng cách chọn property source nào cần được thêm trước khi auto-configuration được đánh giá."
        explanation: "Sai. Config Data quyết định các property source sẵn có; condition tiêu thụ Environment kết quả chứ không chọn source để nạp."
    correctAnswerId: A
