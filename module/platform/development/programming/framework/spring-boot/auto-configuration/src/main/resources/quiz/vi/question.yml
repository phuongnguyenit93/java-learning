  - id: exclusion-vs-indirect-fighting
    question: "Ứng dụng chủ động không muốn một auto-configuration dù các condition của nó có thể khớp, nhưng dependency công bố candidate vẫn phải được giữ lại. Cách nào biểu đạt quyết định cấp ứng dụng rõ nhất?"
    answers:
      - id: A
        answer: "Đặt một feature property lân cận sao cho property condition hiện tại của candidate thất bại và dựa vào đường condition đó để giữ candidate không hoạt động."
        explanation: "Sai. Cách này gắn quyết định opt-out cấp ứng dụng vào một đường condition nội bộ thay vì biểu đạt trực tiếp rằng toàn bộ candidate không được mong muốn."
      - id: B
        answer: "Cung cấp một application bean thỏa missing-bean guard của candidate và để cơ chế back-off thông thường ngăn hạ tầng mặc định của nó được đóng góp."
        explanation: "Sai. Back-off phù hợp khi ứng dụng thật sự sở hữu vai trò bean đó; nó là cách gián tiếp để tắt candidate khi ứng dụng không muốn một implementation thay thế."
      - id: C
        answer: "Dùng cơ chế exclusion tường minh được hỗ trợ khi ứng dụng muốn tắt toàn bộ auto-configuration candidate đó."
        explanation: "Đúng. Exclusion biểu đạt trực tiếp quyết định ở cấp ứng dụng và vẫn rõ ràng ngay cả khi các condition nội bộ của candidate thay đổi sau này."
      - id: D
        answer: "Sắp configuration của ứng dụng trước auto-configuration không mong muốn để condition phía sau nhìn thấy application definition trước khi được đánh giá."
        explanation: "Sai. Ordering có thể ảnh hưởng một số condition phụ thuộc definition, nhưng không biểu đạt rằng candidate bị tắt và cũng không bảo đảm các nhánh khác không match."
    correctAnswerId: C
