  - id: missing-bean-target-vs-return-type
    question: "Auto-configuration cần back off khi người dùng cung cấp bất kỳ AcmeClient nào, nhưng phương thức tạo mặc định trả về DefaultAcmeClient. Khai báo nào giữ đúng cả hai ý định?"
    answers:
      - id: A
        answer: "Dùng @ConditionalOnMissingBean không chỉ rõ target trên phương thức trả về DefaultAcmeClient vì Boot tự động kiểm tra mọi interface mà type đó triển khai."
        explanation: "Sai. Khi không chỉ rõ target, return type của phương thức @Bean trở thành type condition kiểm tra, nên một cách triển khai AcmeClient khác có thể không làm mặc định back off."
      - id: B
        answer: "Đổi return type thành AcmeClient và bỏ condition để container tự chọn cách triển khai nào là primary."
        explanation: "Sai. Cách này loại bỏ quy ước back-off và đồng thời làm bean definition mất bớt thông tin type cụ thể của implementation."
      - id: C
        answer: "Dùng @ConditionalOnMissingBean(AcmeClient.class) trên phương thức trả về DefaultAcmeClient."
        explanation: "Đúng. Condition target tường minh bảo vệ vai trò AcmeClient, còn return type cụ thể vẫn giữ thông tin DefaultAcmeClient cho bean-definition reasoning."
      - id: D
        answer: "Dùng @ConditionalOnClass(AcmeClient.class) vì class có trên classpath tương đương với việc người dùng đã định nghĩa bean."
        explanation: "Sai. Classpath presence và bean presence trả lời hai câu hỏi khác nhau."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.BackOffUserControl/BackOffUserControl.md", anchor: "bean-type-specificity"}
