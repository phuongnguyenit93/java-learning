  - id: conditional-expression-early-bean
    question: "Vì sao tham chiếu trực tiếp tới bean trong SpEL của @ConditionalOnExpression có thể gây vấn đề cho auto-configuration?"
    answers:
      - id: A
        answer: "Expression được phân giải từ Environment trước khi bean post-processor chạy, nên bean reference sẽ được hoãn cho tới khi quá trình binding thông thường hoàn tất."
        explanation: "Sai. Bean reference có thể kích hoạt truy cập bean ngay trong lúc đánh giá condition thay vì được hoãn tới sau giai đoạn hậu xử lý thông thường."
      - id: B
        answer: "Bean được tham chiếu có thể bị khởi tạo ngay trong lúc đánh giá condition và bỏ lỡ hậu xử lý thông thường như binding @ConfigurationProperties."
        explanation: "Đúng. Việc tham chiếu bean trong expression có thể kích hoạt khởi tạo quá sớm, trước khi vòng đời hậu xử lý thông thường hoàn tất."
      - id: C
        answer: "Expression dùng bean resolver thông thường sau khi definition đã được đăng ký, nên việc resolve bean có cùng thời điểm vòng đời như dependency injection bình thường."
        explanation: "Sai. Condition được đánh giá ở một giai đoạn nhạy cảm, nơi resolve bean có thể khiến bean khởi tạo sớm hơn so với injection thông thường."
      - id: D
        answer: "Kết quả expression được cache trước khi profile và property processing hoàn tất, nên thay đổi cấu hình sau đó không thể ảnh hưởng kết quả condition."
        explanation: "Sai. Rủi ro được cảnh báo là khởi tạo bean quá sớm, không phải một quy tắc riêng đóng băng expression trước khi các nguồn cấu hình sẵn sàng."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
