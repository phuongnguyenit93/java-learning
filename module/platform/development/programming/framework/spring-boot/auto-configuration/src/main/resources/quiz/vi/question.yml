  - id: condition-report-diagnosis
    question: "Một auto-configuration candidate đã được xác nhận là Boot đã khám phá, nhưng một bean kỳ vọng từ nó lại không xuất hiện. Bằng chứng nào giải thích tốt nhất condition nào đã khớp hoặc không khớp?"
