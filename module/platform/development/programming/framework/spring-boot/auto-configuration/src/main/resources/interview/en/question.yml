questions:
  - question: >-
      Why is back-off a design contract in Spring Boot auto-configuration rather than merely a side effect of @ConditionalOnMissingBean? What would make an auto-configuration feel too aggressive to an application author?
    answer: >-
      Auto-configuration exists to provide a useful conventional baseline without taking ownership away from the application. Back-off is therefore a design promise: defaults should appear when the application has not made the relevant choice, and explicit application configuration should win when it has. @ConditionalOnMissingBean is one common mechanism, but the contract is broader than that annotation because classpath, property, resource, and application-type conditions can all define when Boot should stay out. An auto-configuration becomes too aggressive when it creates infrastructure despite an equivalent user choice, requires users to fight internal conditions, or forces exclusion for ordinary customization that should have been modeled as a supported override point.
    aiGenerated: true
    reviewed: false
