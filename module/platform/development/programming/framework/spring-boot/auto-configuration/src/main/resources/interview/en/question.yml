  - question: >-
      Trace the path from @SpringBootApplication to a published auto-configuration candidate. Why must you keep candidate discovery separate from condition matching and bean creation when debugging startup behavior?
    answer: >-
      @SpringBootApplication includes @EnableAutoConfiguration, which activates Boot's auto-configuration import path. A library publishes candidate class names through META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports. Finding a class in that resource only makes it eligible for auto-configuration processing; it does not prove that its class-level conditions match, that its @Bean methods match, or that any bean instance will exist. Keeping the phases separate prevents a common debugging error: seeing a valid imports entry and assuming Boot must create the bean. The next evidence should be condition evaluation and contributed bean definitions, not candidate discovery alone.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.ActivationDiscovery/ActivationDiscovery.md"
      anchor: "candidate-discovery-vs-bean-creation"
    apiRelated:
      controller: ""
