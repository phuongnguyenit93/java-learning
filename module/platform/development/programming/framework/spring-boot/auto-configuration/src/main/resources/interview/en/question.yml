  - question: >-
      Why should the public class identity of an auto-configuration be treated as a compatibility concern in Spring Boot 3.3, even though applications normally do not instantiate that class directly?
    answer: >-
      Other auto-configurations and applications can refer to the class in before/after relationships, exclusions, and name-based configuration. That makes the package and class name part of the integration's externally observable contract. In the Spring Boot 3.3 baseline there is no general AutoConfiguration.replacements mapping that transparently rewrites every old identity to a renamed class. Moving or renaming a published auto-configuration can therefore break ordering or exclusion references even though no caller invokes its constructor. Treat such refactors like public integration changes: understand downstream references, preserve compatibility where necessary, and do not assume Boot will repair the identity automatically.
    aiGenerated: true
    reviewed: false
