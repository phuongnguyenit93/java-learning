  - question: >-
      A library dependency is optional, and an auto-configuration has a @Bean method whose signature mentions a type from that library. Why can a method-level @ConditionalOnClass be insufficient, and how would you structure the configuration more safely?
    answer: >-
      Condition metadata can often be inspected without loading the referenced optional class, but the JVM may still resolve types that appear in a configuration method signature before a method-level condition can protect that method. That can turn an optional integration into a linkage failure. A safer design isolates signatures that mention the optional technology inside a separate or nested configuration class guarded at class level by @ConditionalOnClass. The outer auto-configuration can remain loadable without the optional library, while the guarded branch is considered only when the required classes are present. FilteredClassLoader tests are a good way to prove that absence is safe rather than trusting the annotation placement by inspection.
    aiGenerated: true
    reviewed: false
    readmeRelated:
