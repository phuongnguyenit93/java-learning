  - question: >-
      Explain why bean conditions are sensitive to evaluation timing. Include the special @ConditionalOnExpression pitfall when SpEL directly references a bean.
    answer: >-
      Bean conditions reason about definitions that are visible at the point configuration is processed, so authoring order and which definitions have already been contributed can affect a match. They should not be treated as a query over a completely initialized final context. @ConditionalOnExpression adds a sharper timing hazard: if its SpEL expression directly resolves a bean, that bean can be initialized very early during context refresh. A bean created that early is not eligible for normal post-processing such as @ConfigurationProperties binding, so the state seen by the expression may be incomplete. Prefer conditions based on classpath, properties, or bean-definition presence when those model the decision directly, and avoid using a bean reference in SpEL as a shortcut around the normal condition model.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.ConditionModel/ConditionModel.md"
      anchor: "bean-conditions-and-timing"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      How should you explain the boundary between Externalized Configuration and @ConditionalOnProperty? Why is saying that the condition "binds configuration properties and then checks the object" misleading?
    answer: >-
      Externalized Configuration owns how property sources are loaded, ordered, overridden, and exposed through the Environment. @ConditionalOnProperty consumes the effective property state from that Environment as an input to an auto-configuration decision. It does not own Config Data precedence, and it does not need a @ConfigurationProperties object to be created and bound first. Saying that the condition checks a bound object reverses the dependency: property resolution establishes the input, the condition decides whether configuration should apply, and configuration-properties binding may happen later for beans that are actually registered. This boundary keeps configuration-source semantics separate from conditional configuration semantics.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.ConditionModel/ConditionModel.md"
      anchor: "property-conditions"
    apiRelated:
      controller: ""
