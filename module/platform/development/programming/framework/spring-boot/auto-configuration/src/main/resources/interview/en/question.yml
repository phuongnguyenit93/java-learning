  - question: >-
      A bean expected from auto-configuration is missing in production. Describe a disciplined diagnostic sequence using exclusions and the Condition Evaluation Report instead of changing random properties or qualifiers.
    answer: >-
      Start from evidence. Confirm whether the auto-configuration candidate participated and inspect the Condition Evaluation Report or Boot debug output for positive and negative matches. From the report, classify the cause: missing class, property mismatch, resource/application-type mismatch, user bean causing back-off, explicit exclusion, or a definition-order dependency. Only then inspect the relevant input. If the application intentionally wants the whole candidate disabled, use a supported exclusion mechanism so that intent is explicit. If the candidate should match, fix the real failed condition rather than creating dummy beans, changing unrelated qualifiers, or abusing a feature property merely to manipulate another condition. This keeps diagnostics explainable even when internal conditions evolve.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.ExclusionsDiagnostics/ExclusionsDiagnostics.md"
      anchor: "condition-diagnosis-playbook"
    apiRelated:
      controller: ""
