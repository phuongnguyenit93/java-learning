  - question: >-
      An auto-configuration wants to provide DefaultAcmeClient but must back off when the user supplies any AcmeClient. Why does the difference between the condition target and the @Bean method return type matter?
    answer: >-
      A bare @ConditionalOnMissingBean on a @Bean method normally derives its search target from the method's return type. If the method returns DefaultAcmeClient, a user bean implementing AcmeClient with a different concrete class may not satisfy that derived target, so the default could still be contributed. The author should make the ownership role explicit with @ConditionalOnMissingBean(AcmeClient.class) while keeping the method return type as DefaultAcmeClient when that concrete type information is useful to later condition processing. The condition target expresses which application choice should trigger back-off; the return type describes the definition being contributed. Conflating them can produce surprising duplicate defaults or hide useful type information.
    aiGenerated: true
    reviewed: false
    readmeRelated:
