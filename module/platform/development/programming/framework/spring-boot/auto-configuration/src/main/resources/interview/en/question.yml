  - question: >-
      Explain the roles of a starter and an autoconfigure artifact. When is splitting them useful, when can combining them be reasonable, and what misconception should you avoid about starter discovery?
    answer: >-
      The conceptual roles are different. Auto-configuration contains conditional configuration behavior; a starter provides a convenient opinion about dependencies that puts the expected integration pieces on the classpath. Splitting them is useful when the auto-configuration needs to be reused without the starter's full dependency opinion, or when the dependency boundary is significant to consumers. A small integration can combine both roles in one artifact when a separate reuse boundary adds little value. The important misconception to avoid is that "starter" is itself a discovery mechanism. Even in a combined artifact, auto-configuration classes still need to be published through Boot's auto-configuration mechanism; dependency convenience does not make arbitrary configuration classes candidates.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.StarterSynthesis/StarterSynthesis.md"
      anchor: "starter-split-or-combine"
    apiRelated:
      controller: ""
