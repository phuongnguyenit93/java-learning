  - question: >-
      A consumer adds an Acme starter and unexpectedly gets no AcmeClient. Walk through the end-to-end reasoning path you would use from dependency to configured application, and name the curriculum boundaries you would not collapse while debugging.
    answer: >-
      I would first verify that the starter places the intended autoconfigure artifact and required runtime dependencies on the classpath. Next I would verify that the auto-configuration class is published in AutoConfiguration.imports. Then I would inspect the Condition Evaluation Report: required classpath, effective Environment properties, existing user beans/back-off, application type, exclusions, and any ordering dependency. If the candidate matches, I would inspect the definitions it contributes and only then the runtime bean behavior. I would keep boundaries explicit: Externalized Configuration owns how the effective property value was produced; Spring Framework owns container and bean mechanics; build tooling owns dependency-management mechanics; this module owns Boot's candidate discovery and conditional contribution. That sequence prevents a missing bean from turning into random edits across unrelated layers.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.StarterSynthesis/StarterSynthesis.md"
