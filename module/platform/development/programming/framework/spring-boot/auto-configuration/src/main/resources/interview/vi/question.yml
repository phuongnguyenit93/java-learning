  - question: >-
      Sắp một auto-configuration trước hoặc sau auto-configuration khác thực sự điều khiển điều gì, và không điều khiển điều gì? Khi nào quan hệ ordering là hợp lý?
    answer: >-
      Auto-configuration ordering điều phối thứ tự xử lý configuration definition. Nó có thể cho một configuration cơ hội đóng góp definition sớm hơn trước khi condition của configuration khác được đánh giá. Nó không bảo đảm mọi bean instance của configuration trước sẽ được tạo trước mọi bean instance của configuration sau, và cũng không tự tạo cạnh phụ thuộc ở runtime. Tôi chỉ thêm quan hệ before/after khi quyết định ở thời điểm xử lý definition của một auto-configuration thật sự phụ thuộc vào definition mà candidate khác có thể đóng góp. Thứ tự khởi tạo runtime nên đi theo dependency thật giữa bean hoặc quy ước lifecycle. Ordering toàn cục không cần thiết sẽ khiến các integration vốn độc lập khó phối hợp hơn.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.OrderingComposition/OrderingComposition.md"
      anchor: "configuration-order-vs-bean-order"
    apiRelated:
      controller: ""
