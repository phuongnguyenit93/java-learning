  - question: >-
      Một dependency của thư viện là tùy chọn và @Bean method trong auto-configuration nhắc trực tiếp tới type của thư viện đó. Vì sao chỉ đặt @ConditionalOnClass ở mức method vẫn có thể chưa an toàn, và bạn sẽ tổ chức configuration thế nào?
    answer: >-
      Metadata của condition thường có thể được đọc mà không cần load class tùy chọn, nhưng JVM vẫn có thể resolve type xuất hiện trong method signature trước khi condition ở mức method kịp bảo vệ method đó. Khi đó integration vốn tùy chọn lại trở thành lỗi linkage. Thiết kế an toàn hơn là cô lập các signature nhắc tới công nghệ tùy chọn trong một configuration riêng hoặc nested configuration được bảo vệ bởi @ConditionalOnClass ở mức class. Auto-configuration bên ngoài vẫn có thể load khi thư viện không tồn tại, còn nhánh tùy chọn chỉ được xem xét khi class cần thiết có mặt. Test bằng FilteredClassLoader là cách tốt để chứng minh trường hợp thiếu dependency thật sự an toàn thay vì chỉ nhìn annotation và giả định.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.ConditionModel/ConditionModel.md"
      anchor: "optional-class-linkage"
    apiRelated:
