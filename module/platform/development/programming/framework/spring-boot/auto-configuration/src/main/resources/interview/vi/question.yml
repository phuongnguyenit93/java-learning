      methodSignature: ""

  - question: >-
      Vì sao bean condition nhạy cảm với thời điểm đánh giá? Hãy giải thích thêm bẫy riêng của @ConditionalOnExpression khi SpEL tham chiếu trực tiếp tới một bean.
    answer: >-
      Bean condition suy luận từ các definition có thể nhìn thấy tại thời điểm configuration đang được xử lý, vì vậy thứ tự authoring và những definition đã được đóng góp có thể ảnh hưởng kết quả. Không nên xem nó như truy vấn trên một ApplicationContext cuối cùng đã khởi tạo đầy đủ. @ConditionalOnExpression còn có một rủi ro rõ hơn: nếu SpEL resolve trực tiếp một bean, bean đó có thể bị khởi tạo rất sớm trong quá trình refresh context. Bean được tạo sớm như vậy không còn đủ điều kiện nhận hậu xử lý thông thường, trong đó có binding @ConfigurationProperties, nên trạng thái mà expression quan sát có thể chưa hoàn chỉnh. Khi quyết định có thể mô hình hóa trực tiếp bằng classpath, property hoặc sự hiện diện của bean definition, nên ưu tiên các condition đó thay vì dùng bean reference trong SpEL như đường tắt.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.ConditionModel/ConditionModel.md"
      anchor: "bean-conditions-and-timing"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Nên giải thích ranh giới giữa Externalized Configuration và @ConditionalOnProperty như thế nào? Vì sao câu "condition bind @ConfigurationProperties rồi mới kiểm tra object" là sai mental model?
    answer: >-
      Externalized Configuration sở hữu cách property source được nạp, sắp thứ tự, ghi đè và biểu diễn qua Environment. @ConditionalOnProperty dùng trạng thái property hiệu lực từ Environment làm đầu vào cho quyết định auto-configuration. Nó không sở hữu precedence của Config Data và cũng không cần một object @ConfigurationProperties được tạo rồi bind trước. Nói condition kiểm tra object đã bind sẽ đảo ngược quan hệ phụ thuộc: quá trình phân giải property tạo ra đầu vào hiệu lực, condition quyết định configuration có áp dụng hay không, và configuration-properties binding có thể diễn ra sau đó cho các bean thực sự được đăng ký. Ranh giới này giúp tách ngữ nghĩa của nguồn cấu hình khỏi ngữ nghĩa của conditional configuration.
    aiGenerated: true
