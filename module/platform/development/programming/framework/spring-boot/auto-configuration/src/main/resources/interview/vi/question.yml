  - question: >-
      Hãy lần theo đường đi từ @SpringBootApplication tới một auto-configuration candidate đã được công bố. Vì sao khi debug startup phải tách candidate discovery khỏi condition matching và bean creation?
    answer: >-
      @SpringBootApplication bao gồm @EnableAutoConfiguration, từ đó kích hoạt đường import auto-configuration của Boot. Thư viện công bố tên class candidate qua META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports. Việc tìm thấy class trong resource này chỉ làm nó đủ điều kiện tham gia quá trình auto-configuration; điều đó chưa chứng minh condition ở mức class khớp, condition trên @Bean khớp, hay bean instance cuối cùng sẽ tồn tại. Tách ba giai đoạn giúp tránh lỗi suy luận phổ biến: thấy imports entry hợp lệ rồi kết luận Boot bắt buộc phải tạo bean. Bằng chứng tiếp theo phải là kết quả đánh giá condition và các bean definition được đóng góp, không phải discovery đơn thuần.
    aiGenerated: true
    reviewed: false
    readmeRelated:
