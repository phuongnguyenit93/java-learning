  - question: >-
      Bạn sẽ thiết kế ma trận test tập trung cho custom auto-configuration bằng ApplicationContextRunner, FilteredClassLoader và các web context runner như thế nào? Vì sao một @SpringBootTest lớn thường cho bằng chứng yếu hơn cho các quyết định này?
    answer: >-
      Tôi sẽ coi mỗi đầu vào quan trọng của condition là một chiều có kiểm soát: dependency có hoặc không, các biến thể property, bean do người dùng cung cấp có hoặc không, Servlet so với Reactive context khi phù hợp, và nhánh ordering hoặc công nghệ tùy chọn cần chứng minh. ApplicationContextRunner tạo context mới nhỏ cho từng kịch bản và giúp kiểm tra kết quả bean rõ ràng. FilteredClassLoader chứng minh dependency tùy chọn thật sự có thể biến mất mà không gây linkage failure. WebApplicationContextRunner hoặc ReactiveWebApplicationContextRunner cung cấp đúng loại ứng dụng cho web-specific condition. Một full @SpringBootTest chứng minh được ứng dụng tích hợp có thể khởi động nhưng trộn nhiều đầu vào cùng lúc, nên thường khó cho biết condition nào tạo ra kết quả. Focused runner làm ma trận quyết định rõ ràng và dễ chẩn đoán hơn.
