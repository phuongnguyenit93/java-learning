  - question: >-
      Condition metadata do auto-configuration annotation processor tạo ra giải quyết vấn đề gì, và vì sao không được xem metadata đó là nguồn sự thật cuối cùng của condition?
    answer: >-
      Annotation processor có thể ghi metadata cho một số condition được hỗ trợ để Boot loại sớm các auto-configuration candidate rõ ràng không khớp, từ đó giảm việc load hoặc xử lý configuration class không cần thiết. Đây là tối ưu startup. Processor chạy lúc build thư viện nên không thể biết classpath cuối cùng, Environment, user bean, resource hay loại web application của ứng dụng sử dụng. Vì vậy semantics của condition khi runtime vẫn là nguồn quyết định. Mental model phù hợp là metadata giúp cùng một decision pipeline chạy rẻ hơn; nó không tạo ra một mô hình semantics thứ hai nơi kết quả compile-time ghi đè ý nghĩa của condition lúc runtime.
