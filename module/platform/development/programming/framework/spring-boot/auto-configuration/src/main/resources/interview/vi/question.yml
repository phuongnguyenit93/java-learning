  - question: >-
      Một ứng dụng sử dụng thêm Acme starter nhưng không nhận được AcmeClient như kỳ vọng. Hãy trình bày đường suy luận end-to-end từ dependency tới ứng dụng đã cấu hình, đồng thời nêu những ranh giới curriculum không nên trộn lẫn khi debug.
    answer: >-
      Trước tiên tôi xác nhận starter đưa autoconfigure artifact và runtime dependency dự kiến lên classpath. Tiếp theo kiểm tra auto-configuration class đã được công bố trong AutoConfiguration.imports. Sau đó đọc Condition Evaluation Report: classpath cần thiết, property hiệu lực trong Environment, bean do người dùng cung cấp gây back-off, loại ứng dụng, exclusion và dependency về ordering. Nếu candidate match, mới kiểm tra bean definition nó đóng góp rồi mới tới hành vi của bean ở runtime. Tôi giữ ranh giới rõ ràng: Externalized Configuration sở hữu cách giá trị property hiệu lực được tạo ra; Spring Framework sở hữu container và bean mechanics; build tooling sở hữu cơ chế dependency management; module này sở hữu discovery candidate và conditional contribution của Boot. Trình tự đó tránh biến một missing bean thành chuỗi thay đổi ngẫu nhiên ở các layer không liên quan.
