questions:
  - question: >-
      Vì sao back-off là một quy ước thiết kế của Spring Boot auto-configuration chứ không chỉ là hệ quả của @ConditionalOnMissingBean? Dấu hiệu nào cho thấy một auto-configuration đang can thiệp quá mức vào ứng dụng?
    answer: >-
      Auto-configuration tồn tại để cung cấp một nền mặc định hữu ích mà không lấy mất quyền quyết định của ứng dụng. Vì vậy back-off là lời hứa thiết kế: giá trị mặc định chỉ nên xuất hiện khi ứng dụng chưa đưa ra lựa chọn tương ứng, còn cấu hình tường minh của ứng dụng phải thắng khi nó đã sở hữu quyết định đó. @ConditionalOnMissingBean là một cơ chế phổ biến nhưng quy ước rộng hơn annotation này, vì condition theo classpath, property, resource hoặc loại ứng dụng cũng có thể quyết định khi nào Boot nên đứng ngoài. Auto-configuration trở nên quá mạnh tay khi vẫn tạo hạ tầng dù ứng dụng đã cung cấp lựa chọn tương đương, buộc người dùng phải chống lại condition nội bộ, hoặc bắt họ loại trừ cả candidate chỉ để thực hiện một tùy biến thông thường lẽ ra phải có điểm ghi đè rõ ràng.
