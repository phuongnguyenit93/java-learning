  - question: >-
      Hãy giải thích vai trò của starter và autoconfigure artifact. Khi nào tách hai artifact hữu ích, khi nào gộp là hợp lý, và nhầm lẫn phổ biến nào về starter discovery cần tránh?
    answer: >-
      Hai vai trò khác nhau về mặt khái niệm. Auto-configuration chứa hành vi configuration có điều kiện; starter cung cấp một lựa chọn dependency thuận tiện để đưa các thành phần integration dự kiến lên classpath. Tách hai artifact hữu ích khi auto-configuration cần được tái sử dụng mà không kéo toàn bộ lựa chọn dependency của starter, hoặc khi ranh giới dependency quan trọng với ứng dụng sử dụng. Một integration nhỏ có thể gộp hai vai trò trong cùng artifact nếu việc tách ra không tạo thêm giá trị tái sử dụng. Nhầm lẫn quan trọng là nghĩ "starter" tự nó là cơ chế discovery. Ngay cả khi gộp artifact, auto-configuration class vẫn phải được công bố qua cơ chế của Boot; sự tiện lợi về dependency không tự biến configuration class bất kỳ thành candidate.
