  - question: >-
      Một bean được kỳ vọng từ auto-configuration lại mất trong môi trường production. Hãy mô tả một trình tự chẩn đoán có kỷ luật bằng exclusion và Condition Evaluation Report thay vì thử ngẫu nhiên property hoặc qualifier.
    answer: >-
      Bắt đầu từ bằng chứng. Trước tiên xác nhận candidate có tham gia hay không và đọc Condition Evaluation Report hoặc debug output của Boot để thấy condition nào khớp hoặc không khớp. Từ report, phân loại nguyên nhân: thiếu class, property không khớp, resource hoặc loại ứng dụng không phù hợp, bean do người dùng cung cấp làm back-off, exclusion tường minh, hoặc dependency về thứ tự definition. Sau đó mới kiểm tra đúng đầu vào liên quan. Nếu ứng dụng chủ động không muốn toàn bộ candidate, dùng cơ chế exclusion được hỗ trợ để ý định đó rõ ràng. Nếu candidate đáng lẽ phải match, sửa condition thật sự không khớp thay vì tạo bean giả, thay qualifier không liên quan hoặc lợi dụng một feature property chỉ để đánh trượt condition khác. Cách này giữ việc chẩn đoán dễ giải thích ngay cả khi condition nội bộ thay đổi.
    aiGenerated: true
