  - question: >-
      Khi viết một Spring Boot 3.3 auto-configuration có thể tái sử dụng, bạn sẽ giữ những ranh giới nào? Vì sao component scanning rộng trong ứng dụng sử dụng là cách công bố kém phù hợp?
    answer: >-
      Tôi sẽ dùng một @AutoConfiguration entry point tập trung, công bố nó qua AutoConfiguration.imports, giữ package độc lập với base package của ứng dụng sử dụng và import tường minh các configuration hỗ trợ. @AutoConfiguration dùng proxyBeanMethods=false, phù hợp với configuration không dựa vào proxy giữa các @Bean method. Component scanning rộng khiến integration phụ thuộc vào package layout của ứng dụng sử dụng và có thể kéo class thư viện không liên quan vào context, làm ranh giới sở hữu mờ đi. Công nghệ tùy chọn nên nằm sau class-level condition hẹp, configuration key cần namespace có chủ đích, còn điểm mở rộng/back-off phải rõ ràng. Discovery, phạm vi sở hữu của configuration và application component scanning nên là các trách nhiệm tách biệt.
