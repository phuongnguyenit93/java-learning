  - question: >-
      Auto-configuration muốn cung cấp DefaultAcmeClient nhưng phải back off nếu người dùng có bất kỳ AcmeClient nào. Vì sao cần phân biệt type mà condition kiểm tra với return type của @Bean method?
    answer: >-
      @ConditionalOnMissingBean không có type kiểm tra tường minh trên @Bean method thường suy ra type cần tìm từ kiểu trả về của method. Nếu method trả về DefaultAcmeClient, một bean do người dùng cung cấp triển khai AcmeClient bằng concrete class khác có thể không thỏa type được suy ra và bean mặc định vẫn bị đóng góp. Tác giả nên biểu đạt vai trò sở hữu bằng @ConditionalOnMissingBean(AcmeClient.class), đồng thời vẫn có thể để method trả về DefaultAcmeClient khi thông tin concrete type hữu ích cho condition xử lý sau đó. Type mà condition kiểm tra nói lựa chọn nào của ứng dụng phải làm bean mặc định back off; kiểu trả về mô tả definition đang được đóng góp. Trộn hai ý nghĩa này dễ dẫn tới bean mặc định trùng lặp hoặc mất thông tin type cần thiết.
    aiGenerated: true
