  - question: >-
      Vì sao danh tính công khai của class auto-configuration cần được xem là vấn đề tương thích trong Spring Boot 3.3 dù ứng dụng thường không tự khởi tạo class đó?
    answer: >-
      Auto-configuration khác và ứng dụng có thể tham chiếu class này trong quan hệ before/after, exclusion và cấu hình theo tên. Vì vậy package cùng tên class trở thành một phần có thể quan sát từ bên ngoài của integration. Ở baseline Spring Boot 3.3 chưa có cơ chế AutoConfiguration.replacements tổng quát tự ánh xạ mọi danh tính cũ sang class mới. Đổi tên hoặc di chuyển một auto-configuration đã công bố vì thế có thể làm hỏng ordering hoặc tham chiếu exclusion dù không có bên gọi nào gọi constructor. Nên xem refactor này như thay đổi integration công khai: tìm các tham chiếu phía sau, giữ tương thích khi cần và không giả định Boot sẽ tự sửa danh tính.
