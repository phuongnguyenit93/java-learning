questions:
  - id: native-image-quiz-01
    question: "Vì sao Spring Boot native image không chỉ là một cách khác để launch cùng một JAR?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Purpose/NativeImage.md"
      anchor: "native-image-purpose"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Nó ship ứng dụng dưới dạng bytecode cùng bundled JVM nhưng giữ nguyên cách Boot startup thông thường."
        explanation: "Native executable được tạo qua AOT preparation và native compilation; nó không chỉ che một JVM launch thông thường."
      - id: B
        answer: "Nó precompute dependency version, còn Spring vẫn khám phá toàn bộ application model lúc native startup."
        explanation: "Native preparation tập trung vào application model và reachability, không chỉ resolve dependency version sớm hơn."
      - id: C
        answer: "Nó compile application model đã được AOT chuẩn bị thành executable dành cho platform trước deployment."
        explanation: "Đúng. Spring AOT chuẩn bị ứng dụng rồi GraalVM Native Image phân tích và compile trước runtime."
      - id: D
        answer: "Nó repackage executable JAR thành archive riêng cho platform nhưng vẫn chạy bằng java -jar."
        explanation: "Native executable không phải JAR wrapper riêng cho platform; nó chạy mà không cần normal java -jar launch."
    correctAnswerId: C

