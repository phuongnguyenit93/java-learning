  - id: native-image-quiz-12
    question: "An application is native-ready except for one third-party library that performs undocumented runtime scanning. What is the best next step?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.CompatibilityTradeoffs/CompatibilityTradeoffs.md"
      anchor: "dependency-native-readiness"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Add broad reflection metadata for the library package first because runtime-scanning failures usually mean missing type retention."
        explanation: "Broad application workarounds can hide the actual contract and retain unnecessary behavior."
      - id: B
        answer: "Pin or replace the library immediately because native support is version-specific and application metadata should not compensate for it."
        explanation: "A version change may help, but first inspect the library's actual support and metadata before deciding that replacement is necessary."
      - id: C
        answer: "Check that exact library/version's native support and metadata first, then add a focused tested workaround only if needed."
        explanation: "Correct. Native readiness is dependency/version specific, and metadata should stay close to the dynamic behavior it describes."
      - id: D
        answer: "Register a custom RuntimeHintsRegistrar immediately, before checking whether upstream metadata already covers the behavior."
        explanation: "Application-owned hints are appropriate only when the required behavior is not already covered by supported library metadata."
    correctAnswerId: C

  - id: native-image-quiz-13
    question: "A long-running service scales rarely, benefits from JVM JIT optimization, and depends on libraries with weak native support. Which delivery choice is most defensible?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.CompatibilityTradeoffs/CompatibilityTradeoffs.md"
      anchor: "when-not-native"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Choose native because startup and memory gains should outweigh JIT benefits once the application is native-capable."
        explanation: "Native image is a trade-off, not a mandatory modernization step."
      - id: B
        answer: "Choose a native OCI image because container packaging isolates weak native support from the application runtime."
        explanation: "Putting a native executable in a container does not remove its closed-world or dependency compatibility constraints."
      - id: C
        answer: "Either form is comparable because long-running services converge to similar runtime economics after warm-up."
        explanation: "The runtime and build economics are exactly what should drive the choice."
      - id: D
        answer: "Use the JVM unless measured native gains justify the added build and compatibility cost."
        explanation: "Correct. The described workload favors the JVM's compatibility, JIT, and faster build/test feedback."
    correctAnswerId: D

  - id: native-image-quiz-14
    question: "JVM startup works, AOT processing and native compilation succeed, and the executable starts, but one classpath resource-loading path fails only natively. Which boundary should be investigated first?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.ReadinessSynthesis/ReadinessSynthesis.md"
      anchor: "native-failure-location"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The generated AOT bean model, because the resource consumer may have been omitted from generated initialization."
        explanation: "The failing path is already executing after successful startup, so the first suspect is its native resource reachability rather than basic bean inclusion."
      - id: B
        answer: "The native resource/reachability metadata and the dependency or code path that loads that resource."
        explanation: "Correct. The latest successful boundaries point to a native-runtime path whose required resource/reachability evidence may be missing."
      - id: C
        answer: "The original executable-JAR layout, because native resource lookup still depends on BOOT-INF/lib class loading semantics."
        explanation: "Native executables do not rely on Boot Loader's BOOT-INF class-loading model for their runtime resource reachability."
      - id: D
        answer: "The OS filesystem layout, because classpath resources become direct relative-file lookups in native executables."
        explanation: "Classpath resources do not simply become arbitrary relative filesystem paths; native resource inclusion/reachability must be checked first."
    correctAnswerId: B
