questions:
- question: "Hãy giải thích vì sao Spring AOT là cầu nối giữa ứng dụng Boot động thông thường và quá trình biên dịch native theo closed-world của GraalVM, chứ không thay thế Spring hay GraalVM."
  answer: >-
    Ứng dụng Spring Boot chạy JVM thông thường có thể trì hoãn nhiều quyết định đến runtime vì vẫn còn classpath, reflection, class loading, resource lookup và khả năng khám phá của framework. Native Image phải suy luận từ code và metadata có ở thời điểm build, nên các giả định động đó cần trở thành bằng chứng build-time. Spring AOT chuẩn bị phần thuộc Spring bằng cách hiện thực hóa BeanFactory model, sinh initialization/proxy asset và thu thập Runtime Hints. Sau đó GraalVM thực hiện reachability analysis và native compilation trên input đã chuẩn bị. Spring vẫn chạy trong application kết quả, còn GraalVM vẫn sở hữu native compilation. Xem AOT như cầu nối giúp hiểu một lỗi native-only có thể nằm ở prepared Spring model hoặc ở reachability/compiler về sau, thay vì gom mọi lỗi thành một vấn đề "native" duy nhất.
  aiGenerated: true
