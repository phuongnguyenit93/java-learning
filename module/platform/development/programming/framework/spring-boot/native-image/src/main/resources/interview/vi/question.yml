- question: "So sánh reflection, resource, Java serialization, JDK proxy và JNI Runtime Hints. Vì sao chọn đúng category là một phần mô tả runtime contract chứ không chỉ để làm compiler hết lỗi?"
  answer: >-
    Mỗi category giữ một capability khác nhau. Reflection hint giữ metadata type/member và reflective operation được phép; resource hint đưa classpath resource cần mở lúc chạy vào executable; Java serialization hint giữ type cần Java serialization; JDK proxy hint mô tả tổ hợp interface phải có để tạo proxy; JNI hint giữ member access cần qua JNI. Các category không thay thế nhau. Ví dụ convert object sang JSON không tự động có nghĩa cần Java serialization metadata; binding library thường cần reflective construction. Chọn category nhỏ và đúng giúp tài liệu hóa behavior thật, làm metadata dễ review và tránh giữ lại thứ không liên quan. Build thành công nhờ metadata quá rộng vẫn có thể là native contract khó hiểu và tốn kém.
  aiGenerated: true
  reviewed: false
  readmeRelated:
    file: 4.RuntimeHints/RuntimeHints.md
