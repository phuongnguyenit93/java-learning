- question: "Hãy tách runtime form khỏi packaging form khi chọn giữa native executable, native OCI image, JVM JAR và JVM OCI image. Quyết định nào nên theo deployment platform và quyết định nào nên theo application economics?"
  answer: >-
    Native hay JVM là quyết định runtime. Nó thay đổi compilation model, startup/warm-up behavior, compatibility constraint, build cost, memory characteristic và diagnostic capability. Executable hay OCI image chủ yếu là quyết định delivery/packaging. Platform bắt buộc container vẫn có thể chạy native executable trong OCI image, nên containerization không đồng nghĩa JVM và cũng không xóa closed-world constraint của native. Chọn direct binary hay container theo target platform và release contract. Chọn native hay JVM theo startup, memory, throughput, build latency, dependency readiness, operational tooling và maintenance cost đã đo. Tách hai trục giúp tránh chọn native chỉ vì muốn container hoặc bỏ native chỉ vì production yêu cầu OCI delivery.
  aiGenerated: true
  reviewed: false
