- question: "Build assumption nào ẩn sau command như Maven -Pnative hoặc Gradle nativeCompile, và vì sao copy những command đó giữa các project có thể fail dù cả hai đều dùng Spring Boot?"
  answer: >-
    Command chỉ là entry point vào build integration đã được cấu hình. Với Maven, documented native profile được cung cấp khi project kế thừa spring-boot-starter-parent; project không dùng parent phải tự cấu hình Boot process-aot và GraalVM Native Build Tools execution tương đương. Với Gradle, native task đến từ GraalVM Native Build Tools plugin, và Spring Boot plugin nối AOT processing vào native flow khi plugin đó có mặt. Vì vậy contract thật là AOT-to-native task graph đã cấu hình chứ không phải spelling của command. Copy command mà thiếu parent/profile hoặc native plugin có thể chọn lifecycle khác hoặc hoàn toàn không có native integration. Hãy chẩn đoán build model trước khi coi missing task/profile là lỗi application compatibility.
