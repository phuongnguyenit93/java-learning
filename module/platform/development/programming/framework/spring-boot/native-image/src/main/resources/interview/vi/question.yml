- question: "Một Spring library tái sử dụng đăng ký infrastructure bean bằng cách scan class rồi gọi registerSingleton trong application startup. Vì sao thiết kế này cần được xem xét kỹ cho native image, và một thiết kế tương thích AOT cần đạt điều gì?"
  answer: >-
    Spring AOT chuẩn bị một BeanFactory model cụ thể và sinh initialization cho model đó trước khi native executable được tạo. Infrastructure chỉ xuất hiện qua late scanning hoặc singleton registration tùy ý có thể vô hình lúc model được chuẩn bị, nên native runtime không thể giả định sẽ tự tạo một bean graph hoàn toàn khác về sau. Integration tương thích AOT phải làm cấu trúc kết quả nhìn thấy được trong processing hoặc dùng supported Spring extension point có tham gia AOT. Mục tiêu không phải cấm mọi library động; mục tiêu là đảm bảo bean, proxy, resource và requirement khác mà library tạo ra có thể được biểu diễn trong prepared model. Với library author, native readiness vì thế là một phần integration contract chứ không phải reflection workaround để application bổ sung sau cùng.
