- question: "Một team nói service đã 'native-ready' vì một native build đã hoàn tất thành công. Bằng chứng nào biến one-time success đó thành production-readiness claim có thể duy trì?"
  answer: >-
    Native readiness là chuỗi bằng chứng được duy trì. Team cần runtime goal đo được, JDK/GraalVM/Boot toolchain có thể tái lập, build-time profile/property được kiểm soát, dependency/version support được hiểu và reachability metadata cho native-sensitive behavior đã được review. Generated AOT asset và build log phải inspect được khi behavior đổi. Focused test phải exercise reflection, resource, proxy, binding hoặc path khác có thể khác dưới native execution, còn CI cần strategy lặp lại được cho từng OS/architecture hỗ trợ. Production-like startup, memory, latency và diagnostics phải biện minh cho runtime choice. Workaround cần test cùng điều kiện xóa khi dependency cải thiện. JVM fallback hoặc rollback path cũng có thể là một phần operational readiness. Một build badge chỉ chứng minh một tập input compile được một lần.
