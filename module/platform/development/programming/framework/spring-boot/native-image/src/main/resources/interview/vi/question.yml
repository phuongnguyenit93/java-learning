- question: "Một team báo native executable khởi động nhanh gấp năm lần bản JVM. Vì sao kết quả đó chưa đủ để quyết định triển khai native, và bạn sẽ yêu cầu thêm bằng chứng gì?"
  answer: >-
    Startup speed chỉ chứng minh một phần của bài toán runtime. Native compilation chuyển chi phí sang build, tăng nhu cầu CPU/memory cho CI, tạo artifact phụ thuộc nền tảng và thêm công việc compatibility quanh hành vi động cùng dependency bên thứ ba. So sánh runtime còn phải đo memory dưới tải thực tế, throughput, tail latency, CPU, pattern scaling, diagnostics và behavior của JVM sau warm-up. So sánh delivery phải tính thời gian native build, khả năng tái lập, chi phí test, target platform và việc bảo trì hint/workaround. Native phù hợp khi cold start, memory, density hoặc short-lived execution thật sự quan trọng và lợi ích đo được bù chi phí đó. Một con số startup của process idle hoặc workload không tương đương chưa đủ để chứng minh trade-off.
  aiGenerated: true
