- question: "Bạn sẽ review application cho native-sensitive dynamic behavior như thế nào mà không rơi vào bẫy đăng ký blanket reflection access cho mọi class?"
  answer: >-
    Bắt đầu từ behavior có target được chọn gián tiếp: reflection, resource lookup bằng string, JDK proxy, serialization/binding cần reflective access, runtime class loading hoặc generated bytecode, JNI và configuration chỉ tên class/resource. Sau đó xác định ownership và support đã có. Spring có thể infer nhiều framework pattern phổ biến, còn dependency có thể đã ship reachability metadata. Hãy exercise representative path, inspect generated metadata và chỉ thêm explicit application hint khi còn dynamic requirement thực sự chưa được mô tả. Đăng ký capability nhỏ nhất khớp behavior thay vì cả package. Blanket reflection có thể che contract thật, giữ member/resource không cần, tăng analysis/footprint và khiến không ai giải thích được vì sao access đó tồn tại.
  aiGenerated: true
  reviewed: false
  readmeRelated:
