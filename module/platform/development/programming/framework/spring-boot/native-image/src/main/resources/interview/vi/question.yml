- question: "Điều gì khiến bạn vẫn khuyến nghị regular JVM deployment dù team đã build và test native executable thành công?"
  answer: >-
    Compile thành công chứng minh feasibility chứ không chứng minh value. Service chạy dài và hiếm khi scale có thể nhận ít lợi ích từ cold-start nhưng hưởng nhiều hơn từ JVM JIT optimization, diagnostic trưởng thành, agent support rộng và build/test feedback nhanh. Native cũng có thể không hấp dẫn khi dependency quan trọng cần workaround mong manh, mỗi target platform cần build capacity đắt hoặc runtime memory/startup gain nhỏ dưới production-like measurement. Operational requirement quan trọng không kém performance: incident tooling, profiling, release frequency và rollback path đều có cost. JVM vẫn là deployment model hạng nhất của Boot. Tôi sẽ chọn JVM khi native benefit đo được không bù recurring build, compatibility, testing và operations complexity dù artifact native về kỹ thuật vẫn chạy được.
