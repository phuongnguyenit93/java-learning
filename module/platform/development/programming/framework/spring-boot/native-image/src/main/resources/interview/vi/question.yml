- question: "Cùng resource path và reflection path ít dùng đó chạy đúng trên normal JVM, và native executable cũng start đúng, nhưng khi chạy native thì các path này lần lượt không load được resource và không tìm thấy constructor. Hãy mô tả cách chẩn đoán có kỷ luật thay vì thêm metadata thật rộng cho đến khi hết lỗi."
  answer: >-
    JVM, AOT, native compile và native startup đều đã thành công nên focused runtime reachability problem là giả thuyết mạnh. Trước hết xác định từng dynamic operation chính xác: resource path nào được yêu cầu và type/member nào đang reflection. Kiểm tra Spring hoặc dependency đã có supported native path hay chưa, inspect generated reachability metadata và xác nhận target lỗi có được mô tả không. Nếu application sở hữu behavior, thêm resource/reflection hint nhỏ nhất và test registration đó trước khi rebuild focused scenario. Tracing agent có thể giúp discover access nhưng output vẫn phải review vì broad test execution có thể ghi metadata không liên quan. Đổi nhiều hint set cùng lúc sẽ phá evidence dùng để chứng minh contract nào thật sự thiếu.
