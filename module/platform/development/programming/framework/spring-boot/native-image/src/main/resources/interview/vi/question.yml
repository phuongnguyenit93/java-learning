- question: "Một third-party library chạy trên JVM nhưng dùng runtime scanning và native support chưa đầy đủ. Team nên cân nhắc application workaround, dependency upgrade, upstream fix hoặc ở lại JVM như thế nào?"
  answer: >-
    Bắt đầu bằng native support của đúng library version và kiểm tra library hoặc reachability-metadata ecosystem đã mô tả dynamic behavior chưa. Nếu version mới tương thích có support đúng, upgrade thường giảm ownership dài hạn. Nếu application phải cung cấp workaround, giữ nó hẹp, nhận biết version và có focused test exercise failing path. Private hint set lớn là maintenance debt vì có thể over-retain behavior và âm thầm stale khi library đổi. Ưu tiên upstream fix khi library sở hữu dynamic contract. Nếu dependency là thiết yếu, support vẫn yếu và native runtime benefit nhỏ, ở lại JVM có thể là lựa chọn engineering tốt hơn thay vì mang fragile metadata vô thời hạn.
