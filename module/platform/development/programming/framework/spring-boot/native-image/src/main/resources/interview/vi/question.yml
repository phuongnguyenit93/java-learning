- question: "Closed-world đôi khi được mô tả là 'mọi thứ đều bị cố định ở build time'. Vì sao mental model đó quá mạnh, và engineer nên dùng distinction nào thay thế?"
  answer: >-
    Process Spring Boot native vẫn đọc environment variable và external property, nhận request, kết nối database, schedule work và thay đổi business state ở runtime. Closed-world chủ yếu ràng buộc reachable code, metadata, dynamic capability và framework structure mà build đã chuẩn bị. Đổi database URL là ordinary runtime value change vì bean đã tồn tại có thể dùng giá trị khác. Profile/property cố đưa vào bean definition vắng mặt trong AOT model là structural mismatch. Reflection tới type mà build không giữ lại là reachability problem. Vì vậy distinction hữu ích là thay đổi runtime state/value so với thay đổi đòi hỏi code, member, resource, proxy hoặc bean structure mà executable chưa chứa hoặc chưa mô tả.
  aiGenerated: true
  reviewed: false
