- question: "Application khởi động thành công ở normal JVM mode, nhưng application đã qua AOT chạy trên JVM lại lỗi trước native compilation. Điều đó cho biết gì, và vì sao inspect generated AOT output hữu ích hơn việc lập tức thêm GraalVM reflection configuration?"
  answer: >-
    Failure đã xuất hiện trước khi closed-world executable của GraalVM tham gia, nên boundary sớm nhất chưa được chứng minh là prepared AOT application model của Spring. Generated initialization source có thể cho thấy configuration/bean dự kiến có được đưa vào hay không, proxy asset cho thấy Spring đã chuẩn bị gì, còn hint output và build log cho biết environment nào được dùng lúc processing. Thêm reflection configuration tùy ý sẽ nhắm vào reachability concern ở stage muộn hơn khi chưa có bằng chứng đó là vấn đề hiện tại. Trước tiên hãy sửa AOT model, unsupported registration pattern, build-time condition hoặc preparation issue tương ứng. Chỉ khi AOT-mode behavior đã đúng mới chuyển điều tra sang native compilation và dynamic path chỉ lỗi ở native.
  aiGenerated: true
