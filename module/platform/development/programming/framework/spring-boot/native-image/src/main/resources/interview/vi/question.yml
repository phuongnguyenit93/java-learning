- question: "Vì sao hai build dùng cùng application source vẫn có thể tạo native application model khác nhau khi profile, property, classpath hoặc dependency version khác nhau?"
  answer: >-
    AOT processing yêu cầu Spring chuẩn bị application model bằng build-time classpath và environment. Auto-configuration condition, component availability, profile và property vì thế có thể ảnh hưởng bean definition tồn tại và generated asset/hint được tạo. Dependency thay đổi cũng có thể đổi class, native metadata hoặc framework integration dù application source không đổi. Khi structural choice đã được mã hóa vào native build, runtime không thể được giả định sẽ tự dựng lại một BeanFactory trái ngược tùy ý. Vì vậy build-time environment và dependency composition là một phần contract tái lập của native artifact. Team phải version và kiểm soát chúng có kỷ luật như source code, đồng thời phân biệt structural configuration với ordinary runtime value mà bean đã được chuẩn bị vẫn có thể đọc.
