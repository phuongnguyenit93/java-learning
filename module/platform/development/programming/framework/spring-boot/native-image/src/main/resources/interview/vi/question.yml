- question: "Vì sao JVM-first test strategy vẫn tương thích với việc validate native image nghiêm túc, và normal JVM test, AOT-mode JVM execution cùng native test cung cấp bằng chứng khác nhau nào?"
  answer: >-
    Phần lớn business logic và ordinary Spring integration behavior được validate nhanh hơn nhiều bằng JVM với tooling trưởng thành, nên compile mọi test thành native sẽ tốn build time mà không chứng minh thêm native-sensitive behavior. AOT-mode JVM execution thêm một intermediate check: nó exercise generated initialization và prepared application model của Spring nhưng không tái tạo toàn bộ closed-world compiler/runtime của GraalVM. Selected native test hoặc smoke test sau đó chứng minh reflection, resource, proxy, dependency integration và startup path đại diện còn sống qua actual native analysis/execution. Các layer trả lời câu hỏi khác nhau và giúp định vị failure. JVM test lỗi thì sửa ordinary behavior trước; chỉ AOT mode lỗi thì inspect preparation; chỉ native lỗi thì điều tra closed-world/reachability hoặc environment difference.
