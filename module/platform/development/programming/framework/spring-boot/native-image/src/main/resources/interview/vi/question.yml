- question: "Hãy giải thích supported build handoff từ Spring AOT sang GraalVM Native Image. Vì sao gọi native-image trên ordinary artifact không có AOT asset cần thiết không tương đương native workflow của Boot?"
  answer: >-
    Supported flow chuẩn bị Spring application trước. AOT-generated Java source được compile, generated bytecode được thêm vào input, còn Runtime Hints/native metadata được đặt ở nơi native-image tooling có thể dùng. GraalVM sau đó thực hiện reachability analysis và machine-code generation trên application model đã được làm giàu. Nếu ordinary Boot artifact thiếu các prepared asset đó, gọi native-image trực tiếp đã bỏ qua stage Spring dùng để biến dynamic framework decision thành build-time evidence. Compiler không thể được kỳ vọng tự dựng lại Spring semantics mà AOT được thiết kế để hiện thực hóa. Build tooling có thể package flow theo cách khác nhau, nhưng semantic order vẫn là Spring AOT trước rồi native compilation. Reproducible configuration phải mã hóa thứ tự đó thay vì phụ thuộc generated file sửa tay.
  aiGenerated: true
  reviewed: false
