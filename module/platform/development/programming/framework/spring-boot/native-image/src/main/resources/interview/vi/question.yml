- question: "Spring AOT có thể sinh những loại asset nào, vì sao chúng là input build thật chứ không chỉ là diagnostic report, và vì sao developer không nên sửa chúng như source of truth?"
  answer: >-
    Spring AOT có thể sinh Java source cho context/bean initialization, bytecode như proxy class cần thiết và Runtime Hints hoặc native-image metadata cho khả năng động. Source/bytecode được sinh sẽ được compile cùng application, còn metadata được native-image tooling sử dụng ở stage sau, nên chúng trực tiếp ảnh hưởng executable. Chúng đồng thời là diagnostic evidence vì cho thấy application structure và dynamic requirement nào Spring đã chuẩn bị. Không nên duy trì bằng tay vì lần AOT tiếp theo sẽ sinh lại từ application configuration, dependency, classpath và build-time environment. Nếu output sai, hãy sửa configuration, integration, hint registration hoặc dependency sở hữu nguyên nhân thay vì patch một generated artifact không thể tái lập.
  aiGenerated: true
