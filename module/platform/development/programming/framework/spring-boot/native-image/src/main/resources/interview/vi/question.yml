- question: "Vì sao native test AOT có thể cần xử lý riêng dù main application context đã native-ready, và chi phí native test nên ảnh hưởng coverage CI như thế nào?"
  answer: >-
    Test có thể tạo context/configuration mà production application không bao giờ tạo: test-specific bean, dependency replacement, infrastructure bổ sung và property set khác. Spring vì thế AOT-process eligible test context riêng, và test context có thể lộ unsupported runtime dynamism dù main application AOT model đã hợp lệ. Native test cũng đắt hơn ordinary JVM test đáng kể, nên coverage nên target native-sensitive integration path và representative startup/use case thay vì duplicate mọi business test. Developer có thể chạy focused native check khi đổi hint/dependency, còn CI chạy risk-based suite ở pull request, scheduled hoặc release stage. Fresh CI environment vẫn phải reproduce result từ declared input; cache chỉ giảm cost chứ không được trở thành correctness requirement không khai báo.
