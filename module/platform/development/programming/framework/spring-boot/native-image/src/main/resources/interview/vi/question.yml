- question: "Hãy mô tả cách phương pháp 'last successful boundary' thay đổi việc troubleshoot native image. Phân loại failure ở JVM startup, AOT processing, native compilation và một dynamic runtime path duy nhất."
  answer: >-
    Phương pháp này ngăn mọi native problem biến thành phỏng đoán reflection config. Nếu ordinary JVM startup hoặc test cũng fail, owner đầu tiên là application/configuration bình thường vì native processing chưa tạo evidence riêng. Nếu JVM chạy nhưng AOT processing fail, inspect prepared Spring model, unsupported registration pattern, condition và build-time input. Nếu AOT thành công nhưng native compilation fail, điều tra native build integration, unsupported construct, toolchain và reachability metadata. Nếu native executable compile/start được nhưng một dynamic path fail, tập trung exact reflection, resource, proxy, serialization, JNI hoặc dependency metadata của path đó. Giữ generated asset và build log làm evidence để mỗi boundary thành công loại bớt lớp nguyên nhân trước và khiến thay đổi tiếp theo có thể kiểm chứng.
