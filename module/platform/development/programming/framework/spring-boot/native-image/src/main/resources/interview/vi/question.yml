- question: "Ai nên sở hữu native reachability metadata khi dynamic behavior đến từ Spring, third-party library hoặc application-specific code, và vì sao ownership đó quan trọng theo thời gian?"
  answer: >-
    Metadata nên nằm gần nhất có thể với component sở hữu dynamic behavior. Spring và integration được hỗ trợ nên cung cấp hoặc infer hint cho Spring contract. Third-party library tự dùng reflection, resource discovery hoặc proxy nên lý tưởng là ship native support hoặc được bao phủ bởi reachability metadata nhận biết version. Application code nên đóng góp RuntimeHints cho dynamic behavior do chính application tạo. Vị trí ownership quan trọng vì owner biết behavior thay đổi khi nào và có thể test contract chính xác. Application-level workaround cho library đôi lúc cần thiết nhưng có thể stale, quá rộng hoặc sai sau dependency upgrade. Hãy đối xử reachability metadata như code: version, test và xóa workaround khi upstream support làm nó không còn cần thiết.
  aiGenerated: true
