- question: "Why can two builds from identical application source produce different native application models when their profiles, properties, classpaths, or dependency versions differ?"
  answer: >-
    AOT processing asks Spring to prepare the application model using the build-time classpath and environment. Auto-configuration conditions, component availability, profiles, and properties can therefore influence which bean definitions exist and which generated assets or hints are produced. Dependency changes can also change classes, native metadata, or framework integrations without changing application source. Once those structural choices are encoded into the native build, runtime cannot be assumed to reconstruct an arbitrary contradictory BeanFactory. This makes build-time environment and dependency composition part of the native artifact's reproducibility contract. Teams should version and control those inputs just as deliberately as source code and should distinguish structural configuration from ordinary runtime values that an already-prepared bean can still consume.
  aiGenerated: true
  reviewed: false
