- question: "The application starts successfully in normal JVM mode, but running the AOT-processed application on the JVM fails before native compilation. What does that tell you, and why is inspecting generated AOT output more useful than immediately adding GraalVM reflection configuration?"
  answer: >-
    The failure already appears before GraalVM's closed-world executable is involved, so the earliest unproven boundary is Spring's prepared AOT application model. Generated initialization source can show whether expected configuration or beans were included, generated proxy assets can reveal what Spring prepared, and hint output plus build logs can show the environment used during processing. Adding arbitrary reflection configuration would target a later reachability concern without evidence that reachability is the current problem. First correct the AOT model, unsupported registration pattern, build-time condition, or other preparation issue. Only after AOT-mode behavior is sound does it make sense to move the investigation forward to native compilation and native-only dynamic paths.
