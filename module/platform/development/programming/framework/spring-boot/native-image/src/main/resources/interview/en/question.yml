- question: "A team reports that its native executable starts five times faster than the JVM version. Why is that result insufficient to justify native deployment, and what evidence would you ask for before deciding?"
  answer: >-
    Startup speed proves only one part of the runtime economics. Native compilation moves work and cost into the build, adds CPU and memory requirements to CI, creates platform-specific artifacts, and introduces compatibility work around dynamic behavior and third-party dependencies. The runtime comparison should also include memory under representative load, throughput, tail latency, CPU, scaling pattern, diagnostics, and the JVM's behavior after warm-up. The delivery comparison should include native build duration, reproducibility, test cost, supported target platforms, and maintenance of hints or dependency workarounds. Native is attractive when cold start, memory, density, or short-lived execution materially matters and the measured benefit pays for those costs. A headline startup number from an idle or unrelated workload is not enough to establish that trade-off.
