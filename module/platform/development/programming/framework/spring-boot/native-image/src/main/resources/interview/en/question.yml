- question: "What kinds of assets can Spring AOT generate, why are they real build inputs rather than merely diagnostic reports, and why should developers avoid editing them as the source of truth?"
  answer: >-
    Spring AOT can generate Java source for context and bean initialization, bytecode such as required proxy classes, and Runtime Hints or native-image metadata for dynamic capabilities. The generated source and bytecode are compiled with the application, while the metadata is consumed later by native-image tooling, so these artifacts directly influence the executable. They are also valuable diagnostic evidence because they reveal which application structure and dynamic requirements Spring prepared. They should not become manually maintained source because the next AOT run derives them again from application configuration, dependencies, classpath, and build-time environment. If a generated result is wrong, fix the owning configuration, integration, hint registration, or dependency rather than patching an output that cannot be reproduced.
