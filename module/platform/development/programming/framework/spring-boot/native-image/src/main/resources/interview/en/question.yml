questions:
- question: "Explain why Spring AOT is a bridge between a normal dynamic Boot application and GraalVM's closed-world native compilation rather than a replacement for either Spring or GraalVM."
  answer: >-
    A normal Spring Boot application can defer many decisions to runtime because the JVM still has a classpath, reflection, class loading, resource lookup, and framework discovery available. Native Image must reason from code and metadata available during the build, so those late assumptions need to become build-time evidence. Spring AOT prepares Spring's side of that handoff by materializing a BeanFactory model, generating initialization and proxy assets, and collecting Runtime Hints. GraalVM then performs reachability analysis and native compilation over that prepared input. Spring still runs in the resulting application, and GraalVM still owns native compilation. Thinking of AOT as a bridge explains why a native-only failure can belong either to the prepared Spring model or to later reachability/compiler behavior instead of treating all failures as one "native" problem.
  aiGenerated: true
