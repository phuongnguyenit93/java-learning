- question: "How would you review an application for native-sensitive dynamic behavior without falling into the trap of registering blanket reflection access for every class?"
  answer: >-
    Start with behaviors whose target is selected indirectly: reflection, resource lookup by string, JDK proxies, reflective serialization or binding, runtime class loading or generated bytecode, JNI, and configuration that names classes or resources. Then determine ownership and existing support. Spring can infer many common framework patterns, and dependencies may already ship reachability metadata. Exercise representative paths, inspect generated metadata, and add an explicit application hint only where a real dynamic requirement remains undescribed. Register the narrowest capability that matches the behavior rather than whole packages. Blanket reflection can hide the actual contract, retain unnecessary members or resources, increase analysis and footprint, and leave no clear explanation of why the access is needed.
