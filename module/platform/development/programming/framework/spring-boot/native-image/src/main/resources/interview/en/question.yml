- question: "Explain the supported build handoff from Spring AOT to GraalVM Native Image. Why is invoking native-image on an ordinary artifact without the required AOT assets not equivalent to Boot's native workflow?"
  answer: >-
    The supported flow prepares the Spring application first. AOT-generated Java source is compiled, generated bytecode is added to the inputs, and Runtime Hints/native metadata are placed where native-image tooling can consume them. GraalVM then performs reachability analysis and machine-code generation over that enriched application model. If an ordinary Boot artifact lacks those prepared assets, invoking native-image directly skips Spring's step for converting dynamic framework decisions into build-time evidence. The compiler cannot be expected to reconstruct Spring semantics that AOT was designed to materialize. Build tooling can package the flow differently, but the semantic order remains Spring AOT first and native compilation second. Reproducible configuration should encode that order rather than relying on manual generated files.
