- question: "What build assumption is hidden behind commands such as Maven -Pnative or Gradle nativeCompile, and why can copying those commands between projects fail even when both projects use Spring Boot?"
  answer: >-
    The command is only an entry point into configured build integration. For Maven, the documented native profile is supplied when the project inherits from spring-boot-starter-parent; a project that does not use that parent must configure equivalent Boot process-aot and GraalVM Native Build Tools executions itself. For Gradle, native tasks come from the GraalVM Native Build Tools plugin, and the Spring Boot plugin wires AOT processing into that native flow when the plugin is present. Therefore the real contract is the configured AOT-to-native task graph, not the spelling of a command. Copying a command without the parent/profile or native plugin can select a different lifecycle or no native integration at all. Diagnose the build model before treating a missing task or profile as an application compatibility failure.
  aiGenerated: true
  reviewed: false
