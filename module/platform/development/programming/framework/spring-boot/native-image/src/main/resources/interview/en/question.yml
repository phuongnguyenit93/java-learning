- question: "Why is a JVM-first test strategy compatible with serious native-image validation, and what distinct evidence do normal JVM tests, AOT-mode JVM execution, and native tests provide?"
  answer: >-
    Most business logic and ordinary Spring integration behavior can be validated much faster with mature JVM tooling, so compiling every test natively would spend large amounts of build time without proving additional native-sensitive behavior. AOT-mode JVM execution adds an intermediate check: it exercises Spring's generated initialization and prepared application model but does not reproduce GraalVM's full closed-world compiler/runtime. Selected native tests or smoke tests then prove that representative reflection, resources, proxies, dependency integrations, and startup paths survive actual native analysis and execution. These layers answer different questions and together localize failures. If the JVM test fails, fix ordinary behavior first; if AOT mode alone fails, inspect preparation; if only native fails, investigate closed-world/reachability or environment differences.
