- question: "A third-party library works on the JVM but uses runtime scanning and has incomplete native support. How should a team choose between an application workaround, a dependency upgrade, an upstream fix, or staying on the JVM?"
  answer: >-
    Start by checking native support for the exact library version and whether the library or reachability-metadata ecosystem already describes its dynamic behavior. If a newer compatible version has proper support, upgrading usually gives a smaller long-term ownership burden. If the application must supply a workaround, keep it narrow, version-aware, and covered by a focused test that exercises the failing path. A large private hint set is ongoing maintenance debt because it may over-retain behavior and silently become stale when the library changes. Prefer an upstream fix when the library owns the dynamic contract. If the dependency is essential, support remains weak, and native runtime benefits are modest, staying on the JVM can be the better engineering choice rather than carrying fragile metadata indefinitely.
