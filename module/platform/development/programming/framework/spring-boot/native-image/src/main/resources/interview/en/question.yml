- question: "Compare reflection, resource, Java serialization, JDK proxy, and JNI Runtime Hints. Why is choosing the correct category part of explaining the runtime contract rather than just satisfying the compiler?"
  answer: >-
    Each category preserves a different capability. Reflection hints retain type or member metadata and allowed reflective operations; resource hints include classpath resources that code will open later; Java serialization hints retain types needed by Java serialization; JDK proxy hints describe interface combinations required for proxy creation; JNI hints preserve member access needed through JNI. These categories are not interchangeable. For example, converting an object to JSON does not automatically mean Java serialization metadata is required; binding libraries often need reflective construction instead. Choosing the smallest correct category documents what the runtime path actually does, keeps metadata reviewable, and avoids retaining unrelated behavior. A build that succeeds because of excessively broad metadata may still have a poorly understood and expensive native contract.
  aiGenerated: true
  reviewed: false
