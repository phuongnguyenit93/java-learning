- question: "Who should own native reachability metadata when the dynamic behavior comes from Spring, a third-party library, or application-specific code, and why does that ownership matter over time?"
  answer: >-
    Metadata should live as close as practical to the component that owns the dynamic behavior. Spring and supported framework integrations should provide or infer hints for Spring contracts. A third-party library that performs its own reflection, resource discovery, or proxy creation should ideally ship native support or be covered by version-aware reachability metadata. Application code should contribute RuntimeHints for dynamic behavior the application itself creates. This placement matters because the owner understands when the behavior changes and can test the exact contract. An application-level workaround for a library may be necessary temporarily, but it can become stale, overly broad, or wrong after a dependency upgrade. Treat reachability metadata like code: version it, test it, and remove workarounds when upstream support makes them unnecessary.
