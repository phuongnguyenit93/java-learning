- question: "A team says its service is 'native-ready' because one native build completed successfully. What evidence would turn that one-time success into a maintainable production-readiness claim?"
  answer: >-
    Native readiness is a maintained evidence chain. The team should have a measurable runtime goal, a reproducible JDK/GraalVM/Boot toolchain, controlled build-time profiles and properties, understood dependency/version support, and reviewed reachability metadata for native-sensitive behavior. Generated AOT assets and build logs should be inspectable when behavior changes. Focused tests should exercise reflection, resources, proxies, binding, or other paths that could diverge under native execution, and CI must have a repeatable strategy for every supported OS/architecture. Production-like startup, memory, latency, and diagnostics should justify the runtime choice. Workarounds need tests and removal criteria when dependencies improve. A JVM fallback or rollback path may also be part of operational readiness. A build badge alone proves only that one set of inputs compiled once.
