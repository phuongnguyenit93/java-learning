- question: "The same rarely used resource and reflective code paths work on the normal JVM, and the native executable starts correctly, but those paths fail natively to load the resource and find the constructor. Describe a disciplined diagnosis instead of adding broad metadata until the errors disappear."
  answer: >-
    The successful JVM, AOT, native compile, and native startup boundaries make a focused runtime reachability problem a strong hypothesis. Identify each exact dynamic operation first: which resource path is requested and which type/member is reflected on. Check whether Spring or the dependency already has a supported native path, inspect generated reachability metadata, and confirm that the failing target is represented. If application code owns the behavior, add the smallest matching resource or reflection hint and test that registration before rebuilding the focused scenario. A tracing agent can help discover accesses, but its output must be reviewed because broad test execution can record unrelated metadata. Changing multiple hint sets at once destroys the evidence that identifies which contract was actually missing.
