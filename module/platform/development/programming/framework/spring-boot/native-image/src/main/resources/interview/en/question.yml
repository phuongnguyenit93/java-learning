- question: "A reusable Spring library registers infrastructure beans by scanning classes and calling registerSingleton during application startup. Why should that design receive special scrutiny for native images, and what would an AOT-compatible design need to achieve?"
  answer: >-
    Spring AOT prepares a concrete BeanFactory model and generates initialization for it before the native executable is produced. Infrastructure that appears only through arbitrary late scanning or singleton registration may be invisible when that model is prepared, so the native runtime cannot safely assume it can invent an unrelated bean graph later. An AOT-compatible integration needs to make the resulting structure visible during processing or use supported Spring extension points that participate in AOT. The goal is not to ban all dynamic libraries; it is to ensure the beans, proxies, resources, and other requirements the library creates can be represented in the prepared model. For a library author, native readiness therefore becomes part of the integration contract, not an application-level reflection workaround added after the fact.
