- question: "Closed-world execution is sometimes described as 'everything is fixed at build time.' Why is that mental model too strong, and what distinction should an engineer use instead?"
  answer: >-
    A native Spring Boot process still reads environment variables and external properties, accepts requests, connects to databases, schedules work, and mutates business state at runtime. Closed-world primarily constrains the reachable code, metadata, dynamic capabilities, and framework structure that the build prepared. A database URL changing is an ordinary runtime value change because an existing bean can consume a different value. A profile or property that tries to introduce a bean definition that was absent from the AOT model is a structural mismatch. A reflective call to a type that the build did not preserve is a reachability problem. The useful distinction is therefore runtime state/value changes versus changes that require code, members, resources, proxies, or bean structure the executable did not contain or describe.
  aiGenerated: true
  reviewed: false
