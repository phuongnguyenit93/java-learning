- question: "Describe how the 'last successful boundary' method changes native-image troubleshooting. Classify failures at JVM startup, AOT processing, native compilation, and a single dynamic runtime path."
  answer: >-
    The method prevents every native problem from becoming a reflection-config guess. If ordinary JVM startup or tests fail, the first owner is normal application or configuration behavior because native processing has not yet added unique evidence. If JVM behavior works but AOT processing fails, inspect the prepared Spring model, unsupported registration patterns, conditions, and build-time inputs. If AOT succeeds but native compilation fails, investigate native build integration, unsupported constructs, toolchain, and reachability metadata. If the native executable compiles and starts but one dynamic path fails, focus on the exact reflection, resource, proxy, serialization, JNI, or dependency metadata used by that path. Preserving generated assets and build logs lets each successful boundary rule out earlier classes of failure and makes the next change testable.
