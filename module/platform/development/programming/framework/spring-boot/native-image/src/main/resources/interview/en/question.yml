- question: "Why can native test AOT require work even when the main application context is already native-ready, and how should native-test cost influence CI coverage?"
  answer: >-
    Tests can create contexts and configuration that the production application never creates: test-specific beans, replacement dependencies, additional infrastructure, and different property sets. Spring therefore AOT-processes eligible test contexts separately, and a test context can expose unsupported runtime dynamism even when the main application AOT model is valid. Native tests are also substantially more expensive than ordinary JVM tests, so coverage should target native-sensitive integration paths and representative startup/use cases rather than duplicate every business test. Developers can run focused native checks while changing hints or dependencies, while CI can run a risk-based suite at pull-request, scheduled, or release stages. A fresh CI environment must still reproduce the result from declared inputs; caching should reduce cost, not become an undeclared correctness requirement.
