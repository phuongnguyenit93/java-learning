# <roadmap-schema>
# Module Roadmap Structure
# schema-version: 1
#
# YAML CONTRACT
# roadmap: High-level learning milestones for the current language roadmap.
#
# - id [string, required]: Stable and unique milestone identity within the current language roadmap.
# - title [string, required]: Milestone title displayed to the learner.
# - purpose [string, required]: What the learner should understand or achieve from this milestone.
# - dependsOn [list, optional]: Prerequisite milestone ids when item order alone is not enough to express the dependency.
# - objectives [list, optional]: Milestone-level learning objectives; do not use this to list every small fact/API/syntax item.
# - relatedKnowledge [list, optional]: Knowledge category ids in the current module that support this milestone. Portal displays this list on the side opposite the milestone and clicking an item navigates to the matching Knowledge category.
# - relatedModules [list, optional]: Related modules displayed as Portal Level 2 cards. Each item requires routeId and may provide localized label/note; this relation is navigation only and does not create child milestones or change learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - What is this topic/module?
#   - Why does it exist?
#   - What problem exists without it?
# FOUNDATION
#   - What prerequisite or mental model must the learner have first?
# CORE MODEL
#   - What major abstractions or building blocks make up this topic?
# MECHANICS
#   - How does it work at the language/runtime/API level appropriate for this module?
# USAGE
#   - How is it used in real code?
# DECISION / TRADE-OFF
#   - When should this mechanism be chosen over another?
#   - When should it not be used?
# FAILURE / PITFALL
#   - What mistakes, compile-time failures, or runtime failures matter?
# INTEGRATION
#   - How does this topic connect to neighboring concepts/modules?
# SYNTHESIS
#   - What end-to-end mental model should the learner retain?
#
# Each language owns its own roadmap. Do not infer or synchronize its structure from another language roadmap.
# Item order in roadmap is the default learning order. Use dependsOn only when a dependency needs to be expressed beyond the linear order.
# The skeleton must not force every module to have the same number of nodes. It is a thinking framework, not a rigid template.
# </roadmap-schema>

roadmap:
  - id: native-image-purpose-and-aot-need
    title: "Why Spring Boot Needs AOT for Native Images"
    purpose: "Understand why the normal dynamic Spring Boot runtime model must be prepared ahead of time before GraalVM can turn the application into a native executable, and what benefits motivate that extra build work."
    objectives:
      - "Contrast a regular JVM deployment with a native executable at the level that matters to a Spring Boot developer: build-time static analysis, a platform-specific executable, faster startup, and typically lower memory use."
      - "Explain why Spring's dynamic bean discovery and runtime configuration need AOT preparation instead of treating native compilation as a simple replacement for java -jar."
      - "Recognize native image as an alternative runtime form with different constraints and economics, not an automatic upgrade for every application."
      - "Keep GraalVM compiler/runtime internals outside this module while retaining the application-level mental model needed to reason about native behavior."
    relatedKnowledge:
      - NativeImage
    relatedModules:
      - routeId: SPRING_BOOT_APPLICATION_RUNTIME
        label: "Spring Boot Application Runtime"
        note: "Provides the normal JVM runtime model that AOT/native execution deliberately changes and constrains."

  - id: spring-aot-pipeline
    title: "The Spring Boot AOT Pipeline"
    purpose: "Build the mental model for how Spring Boot and Spring AOT analyze the application at build time and generate the assets that make a Spring ApplicationContext understandable to native-image tooling."
    objectives:
      - "Trace AOT processing from the application entry point and prepared BeanFactory to generated source code, generated bytecode, and native-image hint metadata."
      - "Understand that relevant conditions and bean-definition decisions are evaluated during AOT processing using the build-time classpath and environment."
      - "Recognize that AOT generated assets become inputs to later native compilation rather than replacing the application source or redefining Spring Boot auto-configuration ownership."
      - "Use generated AOT output as diagnostic evidence when native behavior differs from the regular JVM application."
    relatedKnowledge:
      - AOTPipeline
    relatedModules:
      - routeId: SPRING_BOOT_AUTO_CONFIGURATION
        label: "Spring Boot Auto-Configuration"
        note: "Owns conditional auto-configuration semantics that AOT processing evaluates against a fixed build-time application model."

  - id: closed-world-application-model
    title: "Closed-World Consequences for a Boot Application"
    purpose: "Understand how native-image's closed-world assumption changes application design decisions that are normally deferred until runtime in a JVM-based Spring Boot application."
    objectives:
      - "Reason about a fixed build-time classpath and why code or types that are not reachable or explicitly described may be absent from the native executable."
      - "Understand that the bean graph cannot freely change after AOT processing and that profile or property choices affecting bean presence must be compatible with the build-time model."
      - "Identify dynamic behavior that deserves native-readiness review without re-teaching generic Java reflection, proxies, class loading, or GraalVM compiler internals."
      - "Separate Spring AOT restrictions from ordinary application-runtime configuration so failures are diagnosed in the correct layer."
    relatedKnowledge:
      - ClosedWorld

  - id: runtime-hints-for-dynamic-access
    title: "Runtime Hints for Dynamic Access"
    purpose: "Learn how Spring AOT communicates dynamic runtime requirements that static analysis cannot infer reliably, with emphasis on reflection, resources, and proxy usage in Spring applications."
    objectives:
      - "Understand RuntimeHints as Spring's application-level contract for describing reflection, resource loading, serialization, and JDK proxy needs to native-image tooling."
      - "Distinguish hints Spring can infer automatically from cases where application or library code must contribute explicit hints."
      - "Recognize the role of RuntimeHintsRegistrar and supported hint annotations without turning this milestone into an inventory of low-level reflection or proxy APIs."
      - "Use missing-resource, reflection, or proxy behavior as a signal to inspect generated/custom hints and third-party reachability metadata rather than guessing at compiler internals."
    relatedKnowledge:
      - RuntimeHints

  - id: native-build-and-run-workflow
    title: "Build and Run a Native Spring Boot Application"
    purpose: "Understand the supported Boot/GraalVM build paths from AOT processing to a runnable native executable or native container image while preserving the build-tooling ownership boundary."
    objectives:
      - "Use Spring Boot's Maven/Gradle integration with GraalVM Native Build Tools to produce a native executable through the native profile/nativeCompile workflow."
      - "Use Boot's Buildpacks integration to create an OCI image containing a native executable when container packaging is the desired delivery form."
      - "Understand that Boot configures AOT outputs as inputs to native compilation and that the resulting executable is platform-specific."
      - "Keep generic Maven/Gradle mechanics, Docker/Buildpacks internals, and image delivery strategy in their owning curricula while understanding the native-image handoff points."
    relatedKnowledge:
      - BuildAndRun
    relatedModules:
      - routeId: SPRING_BOOT_BUILD_TOOLING_PACKAGING
        label: "Spring Boot Build Tooling and Packaging"
        note: "Owns the general Boot plugin, packaging, and Buildpacks workflows that this module reuses for native-image production."

  - id: native-testing-and-aot-test-processing
    title: "Test AOT and Native Behavior Deliberately"
    purpose: "Build a cost-aware testing strategy that validates AOT-generated application behavior and native execution without replacing the faster JVM-focused testing workflow."
    objectives:
      - "Keep most unit and integration feedback on the JVM, then target AOT/native testing at behavior that can differ because of generated assets, hints, or closed-world constraints."
      - "Run an AOT-processed application on the JVM when useful to validate generated initialization before paying the full native compilation cost."
      - "Understand how processTestAot/process-test-aot prepares Spring test ApplicationContexts and how nativeTest executes tests inside a native image."
      - "Use native tests strategically in local or CI workflows based on confidence needs and build-time cost rather than assuming every test must run natively."
    relatedKnowledge:
      - NativeTesting
    relatedModules:
      - routeId: SPRING_BOOT_TESTING
        label: "Spring Boot Testing"
        note: "Owns the broader Boot testing model; this milestone focuses only on AOT/native-specific test processing and execution."

  - id: native-tradeoffs-compatibility-and-metadata
    title: "Trade-offs, Compatibility, and Reachability Metadata"
    purpose: "Decide when native image is worth adopting and diagnose ecosystem limitations by balancing runtime gains against build cost, compatibility work, and metadata quality."
    objectives:
      - "Evaluate faster startup and typically smaller memory footprint against longer, more resource-intensive builds and the operational cost of native-specific validation."
      - "Recognize that third-party libraries may need their own native support or reachability metadata and that Spring does not supply hints for every external library."
      - "Use compatibility evidence, generated/custom hints, reachability metadata, and focused native tests to classify failures before choosing a workaround or alternative deployment model."
      - "Know when the application's dynamic behavior, dependency ecosystem, or build constraints make a regular JVM deployment the more appropriate choice."
    relatedKnowledge:
      - CompatibilityTradeoffs

  - id: native-image-readiness-synthesis
    title: "End-to-End Native Image Readiness"
    purpose: "Synthesize the native-image journey into a practical reasoning workflow from AOT readiness through build, test, diagnosis, and deployment-form decision."
    objectives:
      - "Trace one application from its normal Boot runtime model through AOT analysis, generated assets, native compilation, native testing, and final execution."
      - "Diagnose whether a native failure belongs to build-time configuration, closed-world assumptions, missing hints/metadata, native build integration, or an unsupported dependency."
      - "Choose a native executable, native container image, or normal JVM deployment based on startup, memory, build-time, compatibility, and operational requirements."
      - "Explain the handoffs to auto-configuration, application-runtime, build-tooling-packaging, testing, Java dynamic-language features, and GraalVM runtime/compiler owners without duplicating their curricula."
    relatedKnowledge:
      - ReadinessSynthesis
