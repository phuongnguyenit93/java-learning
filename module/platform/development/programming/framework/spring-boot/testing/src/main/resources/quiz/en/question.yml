        explanation: 'MockMvc can verify framework redirect behavior, but it does not cross the actual embedded-server and network boundary required here.'
      - id: B
        answer: '@SpringBootTest with WebEnvironment.MOCK, because a full Boot context is enough to reproduce real client/server transport.'
        explanation: 'MOCK loads a Boot web context without starting the real embedded server, so it still misses the required transport boundary.'
      - id: C
