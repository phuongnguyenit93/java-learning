        answer: 'Stack @WebMvcTest and the second @...Test slice so Boot merges both component filters automatically.'
        explanation: 'Boot does not support composing multiple @...Test slice annotations on the same test.'
      - id: B
        answer: 'Replace both slices with a full context because slice customization is not intended to add test facilities.'
        explanation: 'Slices can be customized with targeted test support when the primary boundary remains appropriate.'
      - id: C
        answer: 'Keep adding production component scanning until both slice boundaries become visible in one context.'
        explanation: 'Broad scanning defeats the focused slice boundary and hides the intended test design.'
      - id: D
        answer: 'Choose one primary slice, then add needed support through the relevant @AutoConfigure... or import mechanism.'
        explanation: 'Correct. One slice defines the boundary; targeted support can refine that context.'
    correctAnswerId: D

