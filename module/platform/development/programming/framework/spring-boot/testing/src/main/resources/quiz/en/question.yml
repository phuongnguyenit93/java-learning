# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: 'q01-boot-aware-context-bootstrap'
    question: 'A test must verify configuration binding, conditional auto-configuration, and application bean wiring together. Why is Boot-aware test bootstrap useful here?'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Introduction/BootTesting.md'
      anchor: 'springapplication-test-bootstrap'
    apiRelated:
      controller: ''
      methodSignature: ''
    answers:
      - id: A
        answer: 'It replaces Spring TestContext so Boot can manage the entire test lifecycle independently.'
        explanation: 'Boot testing builds on Spring TestContext; it does not replace the underlying test-context framework.'
      - id: B
        answer: 'It creates the context through SpringApplication so Boot startup features can participate.'
        explanation: 'Correct. Boot-aware bootstrap reproduces the relevant Boot startup model inside the test context.'
      - id: C
        answer: 'It starts every external service used by the production application before the context is created.'
        explanation: 'Boot-aware bootstrap does not automatically provision all external infrastructure.'
      - id: D
        answer: 'It starts a real embedded server as part of Boot-aware bootstrap so the test exercises network behavior.'
        explanation: 'Starting a real server is a separate WebEnvironment choice, not an inherent property of Boot-aware bootstrap.'
    correctAnswerId: B

  - id: 'q02-primary-configuration-discovery'
    question: 'An @SpringBootTest class is moved to a package outside the application package hierarchy and now fails to find a Boot configuration. What is the most likely cause?'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Introduction/BootTesting.md'
      anchor: 'primary-test-configuration-discovery'
    apiRelated:
      controller: ''
      methodSignature: ''
    answers:
      - id: A
        answer: 'SpringBootTest searches only the package containing the main class, so tests elsewhere cannot use it.'
        explanation: 'Exact package equality is not required; the issue is how Boot searches upward through the package hierarchy.'
      - id: B
        answer: 'Boot disables component scanning whenever the test class is placed below a test source directory.'
        explanation: 'The source directory is not the cause; configuration discovery is based on package structure.'
      - id: C
        answer: 'The test needs a nested @Configuration because Boot test bootstrap expects its primary configuration locally.'
        explanation: 'Boot normally searches for the primary application configuration when explicit classes are absent.'
      - id: D
        answer: 'Boot searches upward from the test package, so the primary @SpringBootConfiguration may no longer be discoverable.'
        explanation: 'Correct. Moving the test outside the application hierarchy can break Boot primary-configuration discovery.'
    correctAnswerId: D

  - id: 'q03-springboottest-default-server-behavior'
    question: 'A test uses @SpringBootTest without specifying webEnvironment. Which statement is correct when a supported web stack is available?'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.SpringBootTest/SpringBootTest.md'
      anchor: 'springboottest-context-model'
    apiRelated:
      controller: ''
      methodSignature: ''
    answers:
      - id: A
        answer: 'Boot uses WebEnvironment.MOCK by default, so a web context can exist without starting a real embedded server.'
        explanation: 'Correct. Full Boot context does not automatically imply a listening network server.'
      - id: B
        answer: 'Boot uses RANDOM_PORT by default because a full web application context implies a listening HTTP server.'
        explanation: 'RANDOM_PORT must be selected explicitly; it is not the default WebEnvironment.'
      - id: C
        answer: 'Boot uses NONE by default and disables all web infrastructure until a test client is injected.'
        explanation: 'NONE is an explicit non-web mode, not the default when web infrastructure is present.'
      - id: D
        answer: 'Boot uses DEFINED_PORT by default and binds the same port configured for the production application.'
        explanation: 'DEFINED_PORT is an explicit real-server mode, not the default.'
    correctAnswerId: A

  - id: 'q04-random-port-selection'
    question: 'A CI suite runs the same real-server tests in parallel. Why is WebEnvironment.RANDOM_PORT usually preferable to DEFINED_PORT?'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '3.WebEnvironment/WebEnvironment.md'
      anchor: 'web-environment-real-server'
    apiRelated:
      controller: ''
      methodSignature: ''
    answers:
      - id: A
        answer: 'RANDOM_PORT replaces the embedded server with MockMvc, avoiding all network allocation.'
        explanation: 'RANDOM_PORT starts a real server; MockMvc belongs to a mock request-processing path.'
      - id: B
        answer: 'RANDOM_PORT shares one process-wide port among all test contexts and serializes access automatically.'
        explanation: 'It asks for an available port per server instance rather than reserving one shared suite port.'
      - id: C
        answer: 'RANDOM_PORT asks for an available port, reducing collisions between concurrently running server tests.'
        explanation: 'Correct. The actual assigned port can then be injected when a custom client needs it.'
      - id: D
        answer: 'RANDOM_PORT disables the web ApplicationContext after startup so later tests can reuse its port.'
        explanation: 'The web context and server remain part of the test context while it is active.'
    correctAnswerId: C

  - id: 'q05-real-server-transaction-boundary'
    question: 'A @Transactional test calls an endpoint in @SpringBootTest(webEnvironment = RANDOM_PORT). The endpoint commits a database change. Why might the change remain after the test method rolls back?'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '3.WebEnvironment/WebEnvironment.md'
      anchor: 'real-server-transaction-boundary'
    apiRelated:
      controller: ''
      methodSignature: ''
    answers:
      - id: A
        answer: 'RANDOM_PORT disables test-managed transactions whenever a DataSource bean exists.'
        explanation: 'The test can still have its own test-managed transaction; the issue is the separate server-side transaction.'
      - id: B
        answer: 'Client and server run on different threads, so the server transaction is outside the test transaction.'
        explanation: 'Correct. Rolling back the test thread does not automatically roll back work committed on the server thread.'
      - id: C
        answer: 'Assigning the random port commits the test transaction before the server begins handling requests.'
        explanation: 'Port allocation does not determine transaction commit behavior.'
      - id: D
        answer: 'Spring TestContext skips rollback only when the embedded server uses the production port.'
        explanation: 'The boundary appears in both RANDOM_PORT and DEFINED_PORT real-server arrangements.'
    correctAnswerId: B

  - id: 'q06-single-slice-rule'
