        explanation: 'The mock itself can exist before refresh; the timing problem is when the desired stubbing becomes available.'
      - id: B
        answer: 'Boot refuses mocked return values during refresh whenever the mock replaces an existing bean.'
        explanation: 'Boot does not impose a general prohibition on mocked behavior during refresh.'
      - id: C
        answer: 'Spring automatically resets all mocks immediately before every bean initialization callback.'
        explanation: 'The issue is not an automatic reset before each bean initialization.'
      - id: D
