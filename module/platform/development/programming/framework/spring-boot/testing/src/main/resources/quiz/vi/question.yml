  - id: 'q03-springboottest-default-server-behavior'
    question: 'Một test dùng @SpringBootTest nhưng không chỉ định webEnvironment. Khi có web stack được hỗ trợ, phát biểu nào đúng?'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.SpringBootTest/SpringBootTest.md'
      anchor: 'springboottest-context-model'
    apiRelated:
      controller: ''
      methodSignature: ''
    answers:
      - id: A
        answer: 'Boot mặc định dùng WebEnvironment.MOCK, nên có thể có web context mà không khởi động embedded server thật.'
        explanation: 'Đúng. Full Boot context không đồng nghĩa tự động có network server đang lắng nghe.'
      - id: B
        answer: 'Boot mặc định dùng RANDOM_PORT vì full web application context kéo theo một HTTP server đang lắng nghe.'
        explanation: 'RANDOM_PORT phải được chọn tường minh; nó không phải WebEnvironment mặc định.'
      - id: C
        answer: 'Boot mặc định dùng NONE và vô hiệu mọi web infrastructure cho tới khi test client được inject.'
        explanation: 'NONE là non-web mode phải chọn tường minh, không phải mặc định khi web infrastructure tồn tại.'
      - id: D
        answer: 'Boot mặc định dùng DEFINED_PORT và bind cùng cổng đã cấu hình cho production application.'
        explanation: 'DEFINED_PORT là chế độ server thật phải chọn tường minh, không phải mặc định.'
    correctAnswerId: A

