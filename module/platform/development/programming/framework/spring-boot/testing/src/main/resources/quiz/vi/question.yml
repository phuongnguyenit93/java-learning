      - id: B
        answer: 'RANDOM_PORT chia sẻ một port duy nhất cho mọi test context và tự động tuần tự hóa truy cập.'
        explanation: 'Nó yêu cầu một port khả dụng cho từng server instance, không giữ một suite port dùng chung.'
      - id: C
        answer: 'RANDOM_PORT yêu cầu một port còn trống, nhờ đó giảm xung đột giữa các server test chạy đồng thời.'
