    readmeRelated:
      file: '1.Introduction/BootTesting.md'
      anchor: 'springapplication-test-bootstrap'
    apiRelated:
      controller: ''
      methodSignature: ''
    answers:
      - id: A
        answer: 'Nó thay thế Spring TestContext để Boot tự quản lý toàn bộ test lifecycle một cách độc lập.'
        explanation: 'Boot testing xây trên Spring TestContext, không thay thế test-context framework bên dưới.'
      - id: B
        answer: 'Nó tạo context qua SpringApplication để các startup feature của Boot cùng tham gia.'
        explanation: 'Đúng. Bootstrap nhận biết Boot tái hiện phần startup model cần thiết của Boot bên trong test context.'
      - id: C
        answer: 'Nó khởi động mọi external service của production application trước khi tạo context.'
        explanation: 'Bootstrap theo Boot không tự động cấp phát toàn bộ external infrastructure.'
      - id: D
        answer: 'Nó khởi động embedded server thật như một phần của Boot-aware bootstrap để test đi qua network behavior.'
        explanation: 'Khởi động server thật là lựa chọn WebEnvironment riêng, không phải đặc tính mặc định của Boot-aware bootstrap.'
    correctAnswerId: B

