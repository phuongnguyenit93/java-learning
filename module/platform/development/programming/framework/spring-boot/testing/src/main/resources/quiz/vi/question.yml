questions:
  - id: 'q01-boot-aware-context-bootstrap'
    question: 'Một test cần kiểm chứng đồng thời configuration binding, conditional auto-configuration và wiring giữa các application bean. Vì sao bootstrap test theo mô hình Boot hữu ích trong trường hợp này?'
