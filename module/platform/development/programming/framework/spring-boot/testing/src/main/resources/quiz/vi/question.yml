  - id: 'q05-real-server-transaction-boundary'
    question: 'Một test @Transactional gọi endpoint trong @SpringBootTest(webEnvironment = RANDOM_PORT). Endpoint commit thay đổi database. Vì sao thay đổi đó có thể vẫn còn sau khi test method rollback?'
