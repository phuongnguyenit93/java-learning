      methodSignature: ''

  - question: 'How would you decide between @SpringBootTest and a focused test slice, and why is context size a correctness decision as well as a performance decision?'
    answer: '@SpringBootTest is appropriate when the assertion depends on several layers cooperating, broad auto-configuration, production-style Boot startup, or another cross-cutting application boundary that a slice would deliberately omit. A slice is preferable when one focused boundary such as MVC, WebFlux, JPA, or JDBC contains everything the assertion needs. Smaller contexts start faster and fail with less unrelated noise, but shrinking past the required boundary can hide integration defects or force mocks around the behavior that should have been proven. Full contexts provide more fidelity but enlarge startup cost, external dependency exposure, and the failure surface. The right choice is therefore the smallest context that still includes every collaboration the test is intended to establish.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.SpringBootTest/SpringBootTest.md'
      anchor: 'full-context-vs-slice'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: 'A @SpringBootTest passes with WebEnvironment.MOCK but the same scenario fails with RANDOM_PORT and leaves database changes behind. Explain why both outcomes can be valid and what boundary changed.'
    answer: 'MOCK builds a web application context without starting the embedded server, so request processing can remain inside the test-side framework boundary. RANDOM_PORT starts a real server and the client request is handled by server-side code on another thread. A test-managed @Transactional transaction around the test method therefore does not automatically contain the transaction opened by application code while serving the HTTP request. The test transaction can roll back its own work while the server transaction may commit. The failure also exposes additional real-server concerns such as networking, connectors, serialization through the client/server path, and production web wiring. The changed result is a signal that the test crossed a different boundary rather than evidence that one mode is universally more correct.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '3.WebEnvironment/WebEnvironment.md'
      anchor: 'real-server-transaction-boundary'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: 'Why should a Boot test normally start from one @...Test slice instead of stacking several slice annotations, and how should you add one missing testing capability?'
    answer: 'Each Boot slice defines a primary context boundary through focused scanning and a curated set of auto-configurations. Boot does not support combining multiple @...Test slice annotations as if their contexts could simply be merged. Start with the slice that best matches the behavior being proved. If that boundary is still correct but one facility is missing, add the narrow capability through a matching @AutoConfigure... annotation, @ImportAutoConfiguration for a specific auto-configuration, @Import for ordinary test or user configuration, or an explicit collaborator. If many production pieces must be imported to keep the test alive, the design signal is that the behavior probably belongs in a larger integration context.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '4.TestSlices/TestSlices.md'
      anchor: 'single-slice-rule'
    apiRelated:
      controller: ''
