  - question: 'Design a Spring Boot test strategy for a feature that has controller mapping, repository queries, full application wiring, and a database-specific SQL feature. Why should one large @SpringBootTest not automatically replace all smaller tests?'
    answer: 'Use different boundaries for different risks. A focused web slice can prove controller mapping, validation, serialization, and controlled collaboration without paying for persistence. A data slice can prove repository mappings and ordinary queries. A full @SpringBootTest can prove that broader Boot configuration and cross-layer wiring work together. If a database-specific SQL feature is a real product risk, add a focused or full integration test backed by the actual database through Testcontainers and a service connection. One large full-context test may exercise many pieces at once, but it gives slower feedback, a larger failure surface, and less precise diagnosis. The suite is stronger when each test pays only for the fidelity required by the behavior it is meant to prove.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '11.IntegrationTestingStrategy/IntegrationTestingStrategy.md'
      anchor: 'testing-strategy-spectrum'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: 'A complex integration test fails before the assertion runs. How would you classify the failure so that debugging starts at the earliest incorrect boundary instead of changing test configuration at random?'
    answer: 'First determine whether Boot found the intended primary configuration and completed context bootstrap. If configuration discovery or startup fails, remain at the bootstrap and condition layer. If a focused context starts but lacks a bean, inspect slice selection, imported test auto-configuration, and whether the collaborator should have been explicit. If the wrong property or bean appears, inspect test properties, imported test configuration, mocks, spies, and other context customizers. If the application is configured correctly but cannot reach a real dependency, inspect service-connection adaptation and then the external service or container. This ordering narrows the failure by the earliest broken boundary and prevents low-level infrastructure debugging before the test context itself is known to be correct.'
    aiGenerated: true
    reviewed: false
