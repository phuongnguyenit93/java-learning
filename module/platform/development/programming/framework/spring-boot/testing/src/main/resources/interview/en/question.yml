  - question: 'Why can many small inline test-property changes make a Spring Boot suite unexpectedly slow even when each individual test looks lightweight?'
    answer: 'Spring TestContext reuses an application context only when the effective test configuration is compatible with an existing cache entry. Inline properties, profiles, imported configuration, mock or spy definitions, and other context customizers can contribute to the cache key. If many tests each create a slightly different configuration shape, the suite may repeatedly start nearly identical Boot contexts instead of reusing one expensive startup. The practical response is to group tests around stable context shapes, reuse common test configuration and property sets where they represent the same scenario, and move object-level behavior out of Spring when no context integration is being tested. Context customization is therefore part of suite architecture rather than free per-test setup.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '8.PropertyOverrides/PropertyOverrides.md'
      anchor: 'test-property-cache-impact'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: 'Explain the design difference between a nested @TestConfiguration and a nested plain @Configuration in a Boot test. Why can confusing the two change what the test actually proves?'
    answer: '@TestConfiguration expresses additive, test-only configuration. A nested test configuration can be combined with the application primary configuration so the test gains helper beans or alternative infrastructure without redefining the application entry point. A nested plain @Configuration can instead act as the primary test configuration, which changes the configuration model being bootstrapped. That may be intentional for a specialized test, but if it happens accidentally the test can stop representing normal application startup. Use @TestConfiguration when the goal is to supplement production wiring, and use an explicit replacement configuration only when changing the top-level application model is itself part of the test design.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '8.PropertyOverrides/PropertyOverrides.md'
      anchor: 'testconfiguration-purpose'
    apiRelated:
      controller: ''
