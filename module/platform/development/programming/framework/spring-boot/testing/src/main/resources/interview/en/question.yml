  - question: 'When can the default test database behavior of @DataJpaTest give misleading confidence, and how would you decide whether to keep an embedded database or use a real service?'
    answer: '@DataJpaTest can use an embedded test database when one is available, which is useful for fast checks of mappings, repositories, and ordinary JPA behavior. The risk appears when the product-specific database behavior is part of what must be proven. Dialect differences, native SQL, migrations, extensions, isolation behavior, indexing, or driver characteristics may all pass against an in-memory substitute and fail in production. Keep the embedded database when the test contract is portable persistence behavior. Use @AutoConfigureTestDatabase to control replacement when appropriate, or move to a real database through Testcontainers and a service connection when production-specific behavior is part of the risk. The decision should follow the boundary, not a blanket rule that all repository tests must use either fake or real infrastructure.'
    aiGenerated: true
    reviewed: false
