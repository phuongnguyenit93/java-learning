  - question: 'Compare @MockBean and @SpyBean as Spring Boot test-context choices. When does each make sense, and why can both affect suite performance?'
    answer: '@MockBean replaces or adds a Spring bean with a Mockito mock, so it is useful when the Spring context is part of the test boundary but one collaborator should be fully controlled. @SpyBean keeps the real bean and wraps it with a spy, which fits cases where production behavior should mostly execute while selected interactions are observed or overridden. A spy still creates the real bean and its dependencies, so it is not a cheaper mock. Both mechanisms alter the effective bean graph through context customizers, and different mock or spy sets can produce different context-cache keys. Use them when Spring injection of the test double is part of the scenario; plain Mockito is usually clearer for unit tests that do not need a Spring context.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '9.MockReplacement/MockReplacement.md'
      anchor: 'mock-replacement-context-boundary'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: 'Why can stubbing a @MockBean inside a test method be too late for a bean that needs the mocked value during context initialization, and what pattern solves that timing problem?'
    answer: '@MockBean makes the mock available to the context before refresh, but ordinary test-method stubbing happens only after the context has already been created. If another bean calls the collaborator while it is being constructed or initialized, the desired stubbed behavior did not exist at the moment it was needed. The failure is therefore about lifecycle timing rather than Mockito syntax. Define and configure the mock through a @Bean method in test configuration when its behavior must be established before dependent beans initialize. That moves the configured test double into the context bootstrap phase and makes the initialization dependency explicit.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '9.MockReplacement/MockReplacement.md'
      anchor: 'mock-refresh-time-limit'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: 'What problem does @ServiceConnection solve in a Testcontainers-backed Boot test, and why can ConnectionDetails legitimately override ordinary connection properties?'
    answer: 'Testcontainers can start a real dependency, but the application still needs a host, port, credentials, URL, or another typed connection contract. @ServiceConnection lets Boot derive supported ConnectionDetails from the running container and feed them into normal auto-configuration. Those connection details take precedence over ordinary connection-related properties because the test has a concrete running service whose location is often dynamic and should be authoritative for that context. This avoids copying container values into ad hoc properties. The container lifecycle still belongs to Testcontainers when it is a Testcontainers-managed field, while a container declared as a Spring bean follows the application-context lifecycle.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '10.Testcontainers/Testcontainers.md'
      anchor: 'service-connection-purpose'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: 'When should a Testcontainers test use @DynamicPropertySource instead of @ServiceConnection, and what does that choice tell you about the integration contract?'
    answer: '@ServiceConnection is the preferred Boot-specific path when a supported container can be expressed through a typed ConnectionDetails integration. @DynamicPropertySource is the better fallback when no service-connection factory exists, the application consumes a custom property contract, or the test must publish dynamic values that do not map to a supported ConnectionDetails type. The dynamic-property approach is more manual because the test reads container values and registers properties itself. Choosing it should therefore be deliberate evidence that the integration contract is property-based or unsupported by the typed adapter, rather than a default habit that duplicates values Boot already knows how to derive.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '10.Testcontainers/Testcontainers.md'
      anchor: 'dynamic-property-source-fallback'
    apiRelated:
