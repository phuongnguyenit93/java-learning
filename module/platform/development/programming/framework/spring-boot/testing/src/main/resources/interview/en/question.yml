  - question: 'A focused Boot test reports NoSuchBeanDefinitionException. Describe a diagnostic sequence that avoids turning every missing bean into an import or mock.'
    answer: 'Begin with the chosen test boundary. Determine whether the missing type should be selected by the slice scanning rules, created by one of the slice auto-configurations, or supplied explicitly as a collaborator. If an auto-configuration should provide it, inspect the relevant conditions and exclusions instead of assuming production configuration must be imported. If the type is outside the intended slice, decide whether a controlled test double is the right collaborator or whether the test objective really crosses into another layer. Only after those questions should you add configuration. This order distinguishes an expected omission from a broken Boot condition and from a test whose stated boundary is too small.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
