  - question: 'An @WebMvcTest fails because a controller service dependency is missing. What should you investigate before importing the whole service layer, and what does each possible fix say about the intended boundary?'
    answer: '@WebMvcTest intentionally selects MVC-oriented components and excludes most services and repositories. A missing service is therefore often expected rather than evidence that component scanning is broken. First ask whether the controller should be tested with that collaborator controlled; if so, supply it explicitly, commonly with a Boot-managed mock bean, and keep the web slice focused on mapping, validation, serialization, advice, or controller behavior. If the assertion actually depends on real service and repository cooperation, broad imports only disguise the fact that the test boundary has expanded. In that case a larger context such as @SpringBootTest is clearer because it states the integration requirement directly.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
