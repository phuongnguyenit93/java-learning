  - question: 'Why is @ImportAutoConfiguration different from @Import when extending a test context, and what can go wrong if an auto-configuration class is treated like ordinary user configuration?'
    answer: '@ImportAutoConfiguration is designed for Boot auto-configuration classes and preserves the auto-configuration model, including condition handling and ordering. @Import is appropriate for ordinary application or test configuration classes. Importing an auto-configuration class as normal user configuration blurs that distinction and can bypass the expectations under which Boot composes auto-configuration. In a focused test, first keep the primary slice boundary, then add only the specific auto-configuration that the scenario requires. This keeps the reason for the extra infrastructure visible and avoids gradually reconstructing the entire production context through ad hoc imports.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
