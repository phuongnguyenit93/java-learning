  - question: 'Vì sao @ImportAutoConfiguration khác @Import khi mở rộng test context, và chuyện gì có thể xảy ra nếu một auto-configuration class bị đối xử như user configuration thông thường?'
    answer: '@ImportAutoConfiguration được thiết kế cho các class auto-configuration của Boot và giữ mô hình auto-configuration, gồm condition handling và ordering. @Import phù hợp với application hoặc test configuration thông thường. Import một auto-configuration class như user configuration làm mờ ranh giới đó và có thể bỏ qua những giả định mà Boot dùng khi compose auto-configuration. Trong focused test, trước hết giữ primary slice boundary, sau đó chỉ thêm auto-configuration cụ thể mà scenario thật sự cần. Cách này làm lý do xuất hiện của hạ tầng bổ sung rõ ràng và tránh việc dần dần dựng lại toàn production context bằng các import rời rạc.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '7.TestAutoConfiguration/TestAutoConfiguration.md'
      anchor: 'import-auto-configuration'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: 'Vì sao nhiều thay đổi inline test property rất nhỏ có thể làm cả Spring Boot test suite chậm bất ngờ dù từng test nhìn riêng lẻ khá nhẹ?'
    answer: 'Spring TestContext chỉ tái sử dụng ApplicationContext khi effective test configuration tương thích với một cache entry đã có. Inline property, profile, imported configuration, mock hoặc spy definition và các context customizer khác đều có thể tham gia cache key. Nếu nhiều test tạo ra các configuration shape chỉ khác nhau một chút, suite có thể liên tục khởi động những Boot context gần giống nhau thay vì tái sử dụng một startup đắt tiền. Cách xử lý là gom test quanh các context shape ổn định, tái sử dụng test configuration và property set chung khi chúng thể hiện cùng một scenario, đồng thời đưa object-level behavior ra khỏi Spring khi không cần context integration. Vì vậy context customization là một phần của kiến trúc test suite chứ không phải setup miễn phí cho từng test.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '8.PropertyOverrides/PropertyOverrides.md'
      anchor: 'test-property-cache-impact'
    apiRelated:
      controller: ''
