  - question: '@ServiceConnection giải quyết vấn đề gì trong Boot test dùng Testcontainers, và vì sao ConnectionDetails có thể hợp lý khi override connection property thông thường?'
    answer: 'Testcontainers có thể khởi động dependency thật, nhưng ứng dụng vẫn cần host, port, credential, URL hoặc một typed connection contract khác. @ServiceConnection cho phép Boot suy ra ConnectionDetails được hỗ trợ từ container đang chạy rồi đưa chúng vào auto-configuration bình thường. ConnectionDetails này được ưu tiên hơn connection property thông thường vì test đang có một service thật, vị trí thường động, và endpoint đó nên là nguồn có thẩm quyền trong context hiện tại. Cách này tránh phải copy giá trị từ container sang các property thủ công. Container lifecycle vẫn thuộc Testcontainers nếu đó là field do Testcontainers quản lý, còn container được khai báo thành Spring bean sẽ đi theo application-context lifecycle.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '10.Testcontainers/Testcontainers.md'
      anchor: 'service-connection-purpose'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: 'Khi nào Testcontainers test nên dùng @DynamicPropertySource thay vì @ServiceConnection, và lựa chọn đó cho biết điều gì về integration contract?'
    answer: '@ServiceConnection là đường tích hợp đặc trưng của Boot nên được ưu tiên khi container được hỗ trợ có thể biểu diễn bằng typed ConnectionDetails. @DynamicPropertySource là fallback phù hợp khi không có service-connection factory, ứng dụng dùng custom property contract hoặc test phải công bố giá trị động không ánh xạ sang một ConnectionDetails được hỗ trợ. Cách dynamic property thủ công hơn vì test tự đọc giá trị từ container rồi đăng ký property. Vì vậy lựa chọn này nên thể hiện có chủ đích rằng integration contract đang dựa trên property hoặc chưa có typed adapter hỗ trợ, thay vì trở thành thói quen mặc định làm trùng lặp những giá trị Boot đã biết cách suy ra.'
