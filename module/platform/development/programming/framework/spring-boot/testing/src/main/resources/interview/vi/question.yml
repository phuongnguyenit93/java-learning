  - question: 'Hãy thiết kế chiến lược Spring Boot testing cho một feature có controller mapping, repository query, full application wiring và một tính năng SQL đặc thù database. Vì sao một @SpringBootTest lớn không nên tự động thay thế mọi test nhỏ hơn?'
    answer: 'Dùng các boundary khác nhau cho các rủi ro khác nhau. Focused web slice có thể chứng minh controller mapping, validation, serialization và collaborator được kiểm soát mà không phải trả chi phí persistence. Data slice có thể chứng minh repository mapping và query thông thường. Full @SpringBootTest có thể chứng minh Boot configuration rộng hơn cùng cross-layer wiring hoạt động đồng thời. Nếu tính năng SQL đặc thù database là rủi ro sản phẩm thật, bổ sung một focused hoặc full integration test dùng database thật qua Testcontainers và service connection. Một full-context test lớn có thể chạy qua nhiều thành phần cùng lúc nhưng feedback chậm hơn, failure surface lớn hơn và khó chẩn đoán chính xác. Suite mạnh hơn khi mỗi test chỉ trả chi phí fidelity mà hành vi nó có nhiệm vụ chứng minh thực sự cần.'
    aiGenerated: true
    reviewed: false
