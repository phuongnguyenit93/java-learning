  - question: 'Vì sao stub một @MockBean bên trong test method có thể quá muộn với bean cần giá trị mock ngay trong lúc context initialization, và pattern nào giải quyết được vấn đề timing này?'
    answer: '@MockBean làm mock xuất hiện trong context trước refresh, nhưng việc stubbing thông thường trong test method chỉ chạy sau khi context đã được tạo xong. Nếu một bean khác gọi collaborator khi chính nó đang được tạo hoặc initialize, behavior mong muốn của mock chưa tồn tại ở thời điểm cần thiết. Đây là lỗi về lifecycle timing chứ không phải cú pháp Mockito. Khi behavior của mock phải có sẵn trước lúc dependent bean initialize, hãy khai báo và cấu hình mock thông qua một @Bean method trong test configuration. Cách đó đưa test double đã cấu hình vào giai đoạn bootstrap context và làm dependency trong initialization trở nên tường minh.'
