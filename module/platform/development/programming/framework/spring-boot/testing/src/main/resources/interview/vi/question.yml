  - question: 'So sánh @MockBean và @SpyBean dưới góc nhìn thiết kế Spring Boot test context. Khi nào mỗi cơ chế phù hợp, và vì sao cả hai đều có thể ảnh hưởng hiệu năng của suite?'
    answer: '@MockBean thay hoặc thêm một Spring bean bằng Mockito mock, phù hợp khi Spring context là một phần của test boundary nhưng một collaborator cần được kiểm soát hoàn toàn. @SpyBean giữ bean thật và bọc nó bằng spy, phù hợp khi phần lớn production behavior vẫn nên chạy nhưng test cần quan sát interaction hoặc override một phần nhỏ. Spy vẫn tạo bean thật cùng dependency của nó nên không phải phiên bản rẻ hơn của mock. Cả hai cơ chế đều làm thay đổi effective bean graph thông qua context customizer, và các tập mock/spy khác nhau có thể tạo context-cache key khác nhau. Chỉ nên dùng chúng khi việc đưa test double qua Spring injection là một phần của scenario; với unit test không cần Spring context, Mockito trực tiếp thường rõ hơn.'
    aiGenerated: true
