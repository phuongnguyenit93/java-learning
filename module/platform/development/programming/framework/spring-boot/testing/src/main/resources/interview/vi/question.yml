questions:
  - question: 'Vì sao bootstrap dành riêng cho Spring Boot khác với việc chỉ nạp một Spring test context thông thường, và khi nào khác biệt đó trở nên quan trọng?'
    answer: 'Ứng dụng Spring Boot thường phụ thuộc vào nhiều hành vi ngoài việc đăng ký bean: externalized configuration, xử lý environment, auto-configuration, configuration binding và hạ tầng theo điều kiện đều có thể ảnh hưởng đến startup. Boot-aware test tái tạo mô hình khởi động Boot liên quan thông qua SpringApplication và cơ chế tìm primary configuration, vì vậy lỗi có thể phản ánh cùng mô hình cấu hình và điều kiện mà ứng dụng thật sử dụng. Khác biệt này quan trọng khi hành vi cần kiểm tra phụ thuộc vào Boot startup semantics. Nếu test chỉ cần boundary ở mức object thì đưa Boot vào làm tăng chi phí không cần thiết; nếu test phụ thuộc vào cấu hình Boot thì một context Spring chung có thể tạo cảm giác an toàn giả do bỏ qua chính hành vi production đang dùng.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Introduction/BootTesting.md'
      anchor: 'boot-testing-problem'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: 'Bạn quyết định giữa @SpringBootTest và một test slice tập trung như thế nào, và vì sao kích thước context vừa là quyết định về tính đúng vừa là quyết định về hiệu năng?'
    answer: '@SpringBootTest phù hợp khi assertion phụ thuộc vào nhiều layer phối hợp, auto-configuration trên phạm vi rộng, startup gần với production hoặc một boundary xuyên suốt ứng dụng mà slice cố ý bỏ qua. Slice phù hợp hơn khi một boundary tập trung như MVC, WebFlux, JPA hoặc JDBC đã chứa đủ mọi thứ assertion cần. Context nhỏ hơn khởi động nhanh và giảm lỗi nhiễu không liên quan, nhưng thu nhỏ quá mức boundary cần thiết có thể che giấu lỗi tích hợp hoặc buộc phải mock chính hành vi cần chứng minh. Full context cho fidelity cao hơn nhưng cũng tăng thời gian startup, mức phụ thuộc vào hạ tầng ngoài và failure surface. Vì vậy lựa chọn đúng là context nhỏ nhất vẫn chứa đầy đủ mọi cộng tác mà test có nhiệm vụ chứng minh.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.SpringBootTest/SpringBootTest.md'
      anchor: 'full-context-vs-slice'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: 'Một @SpringBootTest chạy qua với WebEnvironment.MOCK nhưng cùng scenario lại lỗi khi dùng RANDOM_PORT và còn để lại thay đổi trong database. Hãy giải thích vì sao cả hai kết quả đều có thể hợp lý và boundary nào đã thay đổi.'
    answer: 'MOCK tạo web application context nhưng không khởi động embedded server, vì vậy request processing có thể vẫn nằm trong boundary framework phía test. RANDOM_PORT khởi động server thật và request từ client được xử lý bởi code phía server trên thread khác. Do đó test-managed @Transactional quanh test method không tự động bao luôn transaction mà application code mở khi phục vụ HTTP request. Transaction của test có thể rollback phần việc của nó trong khi transaction phía server đã commit. Chế độ real server còn đưa thêm các mối quan tâm như network, connector, serialization qua đường client/server và web wiring thật. Kết quả khác nhau cho thấy test đã đi qua một boundary khác, không có nghĩa một mode luôn đúng hơn mode kia.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '3.WebEnvironment/WebEnvironment.md'
      anchor: 'real-server-transaction-boundary'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: 'Vì sao một Boot test thường nên bắt đầu từ một @...Test slice thay vì chồng nhiều slice annotation, và nên bổ sung một test capability còn thiếu bằng cách nào?'
    answer: 'Mỗi Boot slice định nghĩa một context boundary chính thông qua focused scanning và một tập auto-configuration đã được chọn lọc. Boot không hỗ trợ việc kết hợp nhiều @...Test slice annotation như thể các context của chúng có thể tự động merge. Hãy bắt đầu với slice khớp nhất với hành vi cần chứng minh. Nếu boundary đó vẫn đúng nhưng chỉ thiếu một capability, bổ sung hẹp bằng @AutoConfigure... tương ứng, @ImportAutoConfiguration cho một auto-configuration cụ thể, @Import cho user/test configuration thông thường hoặc một collaborator tường minh. Nếu phải import ngày càng nhiều thành phần production để giữ test chạy được thì đó là dấu hiệu hành vi thực tế phù hợp với một integration context lớn hơn.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '4.TestSlices/TestSlices.md'
      anchor: 'single-slice-rule'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: 'Một @WebMvcTest thất bại vì thiếu service dependency của controller. Trước khi import toàn bộ service layer, bạn nên điều tra điều gì, và mỗi cách sửa thể hiện gì về boundary dự kiến của test?'
    answer: '@WebMvcTest chủ động chọn các thành phần thiên về MVC và loại hầu hết service cùng repository. Vì vậy thiếu service thường là hành vi dự kiến của slice chứ chưa phải bằng chứng component scanning bị lỗi. Trước hết hãy hỏi controller có nên được test với collaborator được kiểm soát hay không; nếu có, cung cấp collaborator đó một cách tường minh, thường bằng mock bean tích hợp với Boot, rồi giữ web slice tập trung vào mapping, validation, serialization, advice hoặc hành vi controller. Nếu assertion thật sự phụ thuộc vào service và repository chạy thật cùng nhau thì import rộng chỉ che giấu việc boundary đã mở rộng. Khi đó context lớn hơn như @SpringBootTest diễn đạt yêu cầu tích hợp rõ ràng hơn.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '5.WebLayerTesting/WebLayerTesting.md'
      anchor: 'webmvc-test-collaborators'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: 'Khi nào hành vi test database mặc định của @DataJpaTest có thể tạo cảm giác an toàn sai, và bạn quyết định giữ embedded database hay dùng service thật dựa trên tiêu chí nào?'
    answer: '@DataJpaTest có thể dùng embedded test database khi thư viện phù hợp có mặt, rất hữu ích cho kiểm tra nhanh mapping, repository và hành vi JPA thông thường. Rủi ro xuất hiện khi hành vi đặc thù của database production chính là thứ cần được chứng minh. Khác biệt dialect, native SQL, migration, extension, isolation, indexing hoặc driver có thể chạy qua trên in-memory database nhưng lỗi ở production. Giữ embedded database khi contract cần kiểm tra là persistence behavior có tính portable. Dùng @AutoConfigureTestDatabase để điều khiển replacement khi phù hợp, hoặc chuyển sang database thật qua Testcontainers và service connection khi hành vi đặc thù production là một phần của rủi ro. Quyết định nên đi theo boundary chứ không theo quy tắc cứng rằng mọi repository test đều phải dùng fake hoặc service thật.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '6.DataLayerTesting/DataLayerTesting.md'
      anchor: 'data-test-database-customization'
    apiRelated:
      controller: ''
      methodSignature: ''

  - question: 'Một focused Boot test báo NoSuchBeanDefinitionException. Hãy mô tả trình tự chẩn đoán giúp tránh biến mọi missing bean thành một @Import hoặc mock.'
    answer: 'Bắt đầu từ test boundary đã chọn. Xác định type bị thiếu có đáng lẽ được slice scanning chọn vào, được một slice auto-configuration tạo ra hay phải được cung cấp tường minh dưới dạng collaborator. Nếu một auto-configuration đáng lẽ tạo bean đó, kiểm tra condition và exclusion liên quan thay vì giả định phải import production configuration. Nếu type nằm ngoài boundary dự kiến của slice, quyết định xem test double có phải collaborator phù hợp hay test objective thực tế đã vượt sang layer khác. Chỉ sau các bước đó mới nên bổ sung configuration. Trình tự này phân biệt được omission có chủ đích, Boot condition bị sai và test có boundary quá nhỏ so với hành vi cần chứng minh.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '7.TestAutoConfiguration/TestAutoConfiguration.md'
      anchor: 'test-context-missing-bean-diagnosis'
    apiRelated:
      controller: ''
