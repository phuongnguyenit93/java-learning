  - question: 'Hãy giải thích khác biệt thiết kế giữa nested @TestConfiguration và nested @Configuration thông thường trong Boot test. Vì sao nhầm hai loại này có thể thay đổi chính điều mà test đang chứng minh?'
    answer: '@TestConfiguration biểu đạt cấu hình bổ sung chỉ dành cho test. Một nested test configuration có thể được kết hợp với primary configuration của ứng dụng để test có thêm helper bean hoặc alternative infrastructure mà không định nghĩa lại application entry point. Nested @Configuration thông thường lại có thể trở thành primary test configuration, tức là thay đổi mô hình cấu hình được bootstrap. Điều đó có thể là chủ đích trong một test chuyên biệt, nhưng nếu xảy ra ngoài ý muốn thì test có thể không còn đại diện cho startup bình thường của ứng dụng. Dùng @TestConfiguration khi mục tiêu là bổ sung production wiring; chỉ dùng replacement configuration tường minh khi việc thay đổi top-level application model chính là một phần của test design.'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '8.PropertyOverrides/PropertyOverrides.md'
      anchor: 'testconfiguration-purpose'
    apiRelated:
