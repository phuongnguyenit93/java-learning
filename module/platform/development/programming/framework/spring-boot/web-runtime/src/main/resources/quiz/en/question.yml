        answer: 'Every supported server must implement the feature with identical internal algorithms and edge-case behavior.'
        explanation: 'A common configuration intent does not make different server implementations internally identical.'
      - id: B
        answer: 'Boot expresses one portable intent, while each supported server can still implement it differently.'
        explanation: 'Correct. Boot provides a portable intent and adapts it to each supported integration.'
      - id: C
        answer: 'The property is portable only when the application never changes its embedded server dependency.'
        explanation: 'Portability is specifically useful across supported server choices; it is not conditioned on keeping one dependency forever.'
      - id: D
        answer: 'The property disables every server-specific namespace so conflicting settings cannot be supplied.'
        explanation: 'Common and server-specific namespaces can coexist; the developer must choose the appropriate level deliberately.'
    correctAnswerId: B

