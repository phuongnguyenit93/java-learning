        answer: 'It reports the server that Boot actually created and started after classpath selection and auto-configuration.'
        explanation: 'Correct. Runtime inspection observes the concrete server participating in the active application context.'
      - id: B
        answer: 'It forces Boot to replace the configured server with the server type returned by the endpoint.'
        explanation: 'The endpoint observes runtime state; it does not select or replace the server.'
      - id: C
        answer: 'It bypasses WebServerFactory and asks the operating system which Java server library owns the port.'
        explanation: 'The server is exposed by the Boot web application context; the operating system does not identify the Java factory path.'
      - id: D
