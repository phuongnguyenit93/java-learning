# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: 'q01-mixed-web-stack-precedence'
    question: 'A Spring Boot application has both Spring MVC and Spring WebFlux on the classpath. No web application type is configured explicitly. Which runtime model does Boot choose by default?'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.WebApplicationType/WebApplicationType.md'
      anchor: 'servlet-reactive-precedence'
    apiRelated:
      controller: ''
      methodSignature: ''
    answers:
      - id: A
        answer: 'REACTIVE, because WebFlux being present always takes precedence over MVC.'
        explanation: 'WebFlux being present does not force the reactive runtime when MVC is also available.'
      - id: B
        answer: 'NONE, because Boot treats two web stacks as an ambiguous web environment.'
        explanation: 'A mixed classpath is still a web environment; Boot has a defined default precedence.'
      - id: C
        answer: 'SERVLET, because MVC/Servlet takes precedence when both web stacks are present.'
        explanation: 'Correct. Boot defaults to the Servlet/MVC model when both MVC and WebFlux signals are present.'
      - id: D
        answer: 'The result depends only on which starter appears first in the build file.'
        explanation: 'Build-file declaration order is not the rule that selects the web application type.'
    correctAnswerId: C

  - id: 'q02-none-vs-disabled-http-endpoints'
    question: 'Which statement correctly distinguishes spring.main.web-application-type=none from server.port=-1?'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '6.ServerProperties/ServerProperties.md'
      anchor: 'port-address-endpoint-controls'
    apiRelated:
      controller: ''
      methodSignature: ''
    answers:
      - id: A
        answer: 'Both create the normal web ApplicationContext but prevent its server from binding a TCP port.'
        explanation: 'The two settings act at different layers; web-application-type=none prevents the web runtime path itself.'
      - id: B
        answer: 'none creates a non-web context; server.port=-1 keeps a web context but opens no HTTP endpoint.'
        explanation: 'Correct. One changes the application type; the other disables HTTP listening while retaining the web context.'
      - id: C
        answer: 'server.port=-1 changes the application type to NONE, while web-application-type=none only changes the port.'
        explanation: 'This reverses the responsibilities of the two settings.'
      - id: D
        answer: 'They are aliases; Boot normalizes either setting to the same WebApplicationType value.'
        explanation: 'They are separate controls and do not normalize to one equivalent setting.'
    correctAnswerId: B

  - id: 'q03-replacing-default-server'
    question: 'A Servlet application uses spring-boot-starter-web with its default Tomcat server. The team wants Jetty while keeping the Servlet runtime model. What is the normal Boot approach?'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '3.EmbeddedServerModel/EmbeddedServerModel.md'
      anchor: 'replacing-default-server'
    apiRelated:
      controller: ''
      methodSignature: ''
    answers:
      - id: A
        answer: 'Keep Tomcat and register Jetty manually from main so both servers can compete for the application port.'
        explanation: 'Boot does not require manual server bootstrap for a supported server replacement.'
      - id: B
        answer: 'Change WebApplicationType to REACTIVE because Jetty is available only through the reactive server path.'
        explanation: 'Jetty is supported in the Servlet stack as well; changing server implementation does not require changing runtime model.'
      - id: C
        answer: 'Declare a custom ServletWebServerFactory bean first, then leave the starter dependencies unchanged.'
        explanation: 'A custom factory is a stronger hook than needed for a normal supported server swap.'
      - id: D
        answer: 'Swap the Tomcat starter for the Jetty starter so Boot selects the matching Servlet factory.'
        explanation: 'Correct. Supported server replacement is normally a dependency choice that preserves the surrounding Boot lifecycle.'
    correctAnswerId: D

  - id: 'q04-runtime-server-observation'
