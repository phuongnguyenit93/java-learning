  - id: 'q05-configured-vs-actual-port'
    question: 'The application starts with server.port=0. The serverProperties() experiment returns configuredPort=0 and actualPort=53142. What does this demonstrate?'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '6.ServerProperties/ServerProperties.md'
      anchor: 'server-properties-model'
    apiRelated:
      controller: 'WebRuntimeExperimentController'
      methodSignature: 'serverProperties()'
    answers:
      - id: A
        answer: 'ServerProperties is stale because Boot should replace configuredPort with the assigned runtime port.'
        explanation: 'ServerProperties represents configured intent; it is not required to mutate into the final runtime state.'
      - id: B
        answer: 'server.port=0 requests an ephemeral port; the running WebServer exposes the port assigned at startup.'
        explanation: 'Correct. server.port=0 is configuration intent and the actual bound port becomes known after server initialization.'
      - id: C
        answer: 'The application opened two HTTP listeners, one on port 0 and another on port 53142.'
        explanation: 'Port 0 is a request for an available port, not a second listening endpoint.'
      - id: D
        answer: 'The endpoint changed server.port after startup, so future context refreshes must use 53142.'
        explanation: 'The experiment only reads configured and runtime values; it does not rewrite configuration.'
    correctAnswerId: B

  - id: 'q06-custom-factory-backoff'
    question: 'An application declares its own ServletWebServerFactory bean. Which effect best matches Boot server auto-configuration?'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '7.ServerCustomization/ServerCustomization.md'
      anchor: 'custom-web-server-factory'
    apiRelated:
      controller: ''
      methodSignature: ''
    answers:
      - id: A
        answer: 'Boot ignores the custom bean and always creates the starter default factory first.'
        explanation: 'Boot factory auto-configuration is designed to back off when the application supplies the relevant factory bean.'
      - id: B
        answer: 'Boot backs off from choosing its implementation-specific factory and also disables every auto-configured factory customizer.'
        explanation: 'Back-off from factory creation does not remove the entire customization pipeline.'
      - id: C
        answer: 'Boot uses the supplied factory, and auto-configured WebServerFactoryCustomizer beans can still customize it.'
        explanation: 'Correct. A custom factory replaces Boot factory selection but still participates in the customizer chain.'
      - id: D
        answer: 'Boot converts the custom Servlet factory into a ReactiveWebServerFactory when reactive libraries are present.'
        explanation: 'A Servlet factory is not converted into a reactive factory; runtime model and factory type remain distinct.'
    correctAnswerId: C

  - id: 'q07-customization-escalation'
    question: 'A requirement cannot be expressed by a common server.* property but has a documented property under server.tomcat.*. Which customization choice best preserves the Boot model?'
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '7.ServerCustomization/ServerCustomization.md'
      anchor: 'server-customization-decision-order'
    apiRelated:
      controller: ''
      methodSignature: ''
    answers:
      - id: A
        answer: 'Use the server.tomcat.* property before moving to a WebServerFactoryCustomizer or replacing the factory.'
        explanation: 'Correct. The preferred escalation keeps customization declarative for as long as the property model can express the requirement.'
      - id: B
        answer: 'Declare a custom TomcatServletWebServerFactory bean because server-specific properties are intended only for Boot internals.'
        explanation: 'Server-specific namespaces are public configuration hooks and are less invasive than replacing the factory.'
      - id: C
        answer: 'Create a WebServerFactoryCustomizer first because any server-specific property is less maintainable than Java code.'
        explanation: 'The taught decision order prefers an available property before programmatic customization.'
      - id: D
        answer: 'Move the setting into Spring MVC configuration because Tomcat-specific controls are part of request mapping.'
        explanation: 'Tomcat server configuration belongs to the server runtime boundary, not MVC request mapping.'
    correctAnswerId: A

  - id: 'q08-portable-vs-specific-settings'
