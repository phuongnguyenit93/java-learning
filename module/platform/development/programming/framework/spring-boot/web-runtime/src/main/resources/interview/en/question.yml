  - question: >-
      Why are forwarded headers a trust-boundary decision rather than just a convenience for generating correct URLs behind a proxy? Compare NONE, NATIVE, and FRAMEWORK at a reasoning level.
    answer: >-
      Forwarded headers can rewrite the scheme, host, port, client address, and URL that application code believes originated at the network boundary. Trusting attacker-supplied values can therefore corrupt redirects, security decisions, logging, and link generation. NONE leaves those headers unapplied. NATIVE delegates interpretation to the embedded server's own mechanism. FRAMEWORK lets Spring Framework transform request metadata. The correct strategy depends on the deployment topology and on ensuring that only trusted proxies can supply or preserve authoritative forwarding metadata. Boot selects the strategy; the security of the proxy chain and header sanitization remains an infrastructure responsibility.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "10.ForwardedHeadersProxy/ForwardedHeadersProxy.md"
      anchor: "forwarded-header-trust-boundary"
    apiRelated:
      controller: "WebRuntimeExperimentController"
      methodSignature: "requestMetadata()"

  - question: >-
      Describe graceful shutdown as a coordination problem. Why is "the process received SIGTERM" not enough to conclude that in-flight HTTP work will complete safely?
    answer: >-
      A termination signal only starts the shutdown path. In Spring Boot 3.3, server.shutdown defaults to immediate, so graceful request draining must first be enabled with server.shutdown=graceful. Once enabled, safe completion still depends on the application context closing, the embedded server entering its graceful behavior, new work being rejected or drained according to that server, and in-flight requests finishing before the configured shutdown phase timeout expires. Application availability, orchestration readiness changes, background work, and downstream timeouts also influence whether the overall service shuts down cleanly. Graceful server shutdown therefore provides a bounded opportunity, not an unlimited guarantee. Production settings should align Boot's shutdown timeout with platform termination grace periods and with the longest request work the service intends to finish.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "11.GracefulShutdown/GracefulShutdown.md"
      anchor: "in-flight-request-grace-period"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      You inherit a Boot web service with many explicit server customizations. How would you decide which settings should remain explicit and which should return to Boot defaults without turning "convention over configuration" into blind trust?
    answer: >-
      First classify every customization by the requirement it satisfies: correctness, security, deployment topology, observability, performance evidence, or historical accident. Keep explicit choices whose requirement would be violated by the Boot default and verify them with focused runtime evidence. Remove settings that merely restate the default or compensate for an obsolete deployment assumption, because unnecessary overrides hide upgrades and increase coupling. Then re-check the boundary of ownership: request-processing policy belongs to MVC/WebFlux, network and proxy policy may belong to infrastructure, and only embedded-server bootstrap/configuration belongs here. Convention is valuable when it removes accidental decisions while preserving the decisions the system actually needs.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "12.BootWebDefaults/BootWebDefaults.md"
      anchor: "web-runtime-end-to-end-model"
