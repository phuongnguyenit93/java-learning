  - question: >-
      How would you explain the difference between ServerProperties and the running WebServer to someone debugging production configuration? Why should portable server.* settings generally be preferred before server-specific namespaces?
    answer: >-
      ServerProperties is Boot's bound configuration model: it captures the effective supported server.* intent after external configuration has been resolved and bound. The running WebServer is the realized runtime object after factory selection, customization, binding to the operating system, and startup. Comparing the two distinguishes what was requested from what actually happened. Portable server.* properties should be preferred when they express the requirement because they keep the application less coupled to Tomcat, Jetty, Undertow, or Netty details. Server-specific namespaces are appropriate when the requirement genuinely depends on a feature or tuning knob outside Boot's common abstraction.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.ServerProperties/ServerProperties.md"
      anchor: "portable-vs-server-specific-properties"
    apiRelated:
      controller: "WebRuntimeExperimentController"
      methodSignature: "serverProperties()"

  - question: >-
      When customizing an embedded server, why is the usual decision order "properties, then WebServerFactoryCustomizer, then a custom factory bean"? What maintenance cost increases at each step?
    answer: >-
      Properties use Boot's stable public configuration contract and keep construction, defaults, ordering, and lifecycle ownership with Boot, so they carry the lowest coupling. A WebServerFactoryCustomizer is appropriate when the required setting is programmatic or not represented by a property while still allowing Boot to own the factory; the application now depends on factory APIs and customizer ordering. Supplying the factory bean transfers construction ownership to the application and therefore carries the strongest coupling to server choice and Boot internals around factory creation. Choosing the least powerful hook that expresses the requirement usually produces the most portable and upgrade-friendly configuration.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.ServerCustomization/ServerCustomization.md"
      anchor: "server-customization-decision-order"
    apiRelated:
