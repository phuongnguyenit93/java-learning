  - question: >-
      HTTP/2, compression, header limits, access logging, and connection tuning can all look like "HTTP configuration." How would you decide whether to use a Boot-portable setting or a server-specific capability?
    answer: >-
      Start from the behavioral requirement and look for a common Boot property that expresses it across supported servers. Use that portable contract when its semantics are sufficient. Move to a server-specific namespace or customizer only when the requirement depends on implementation-specific behavior, such as a connector option, logging facility, or tuning control that Boot deliberately does not normalize. The trade-off is portability versus precision: server-specific controls can expose more capability but also tie configuration, tests, and operational knowledge to one implementation. The decision should be explicit so a later server replacement does not silently inherit invalid assumptions.
    aiGenerated: true
    reviewed: false
