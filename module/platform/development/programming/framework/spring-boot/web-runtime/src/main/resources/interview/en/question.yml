questions:
  - question: >-
      What problem does Spring Boot's web-runtime layer solve between SpringApplication and Spring MVC or WebFlux, and why is it useful to keep that boundary explicit when diagnosing a web application that starts incorrectly?
    answer: >-
      Boot's web-runtime layer decides whether the application is web-capable, chooses the appropriate web application context, supplies and configures an embedded server factory, and starts the resulting WebServer as part of context refresh. MVC and WebFlux begin after that handoff and own request-processing semantics. Keeping the boundary explicit prevents category errors: a failure to create or start the embedded server belongs to Boot/server bootstrap, while handler mappings, codecs, controllers, and request dispatch belong to the web framework. The distinction narrows diagnostics and avoids changing controller code to solve a server-startup problem.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/Introduction.md"
      anchor: "web-runtime-boundaries"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      How does WebApplicationType influence the rest of Spring Boot startup, and what surprising behavior can occur when both Servlet and Reactive indicators are present on the classpath?
    answer: >-
      WebApplicationType is an early classification that affects which ApplicationContext implementation Boot creates and which web-server auto-configuration path can match. Classpath deduction is therefore not just descriptive metadata; it changes the runtime model that follows. When Servlet and Reactive indicators coexist, the Servlet model normally takes precedence, so merely adding a reactive library does not necessarily produce a reactive server application. If the application intentionally needs another model, an explicit spring.main.web-application-type choice is clearer than relying on an accidental dependency mix. This matters because later conditions, server factories, and framework infrastructure are all evaluated in the selected application type.
    aiGenerated: true
    reviewed: false
    readmeRelated:
