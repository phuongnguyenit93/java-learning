  - question: >-
      What is the design advantage of applying a named SSL bundle to the web server instead of repeating discrete TLS material in server.ssl.* settings, and when might direct server.ssl configuration still be reasonable?
    answer: >-
      A named SSL bundle gives TLS material and options a reusable identity that can be consumed consistently by more than one client or server integration. It reduces duplicated keystore, truststore, certificate, and protocol configuration and makes rotation or policy changes easier to centralize. Direct server.ssl.* settings remain reasonable when TLS is local to one web-server endpoint and reuse would add indirection without benefit. In either form Boot integrates TLS material with the embedded server; certificate issuance, PKI policy, trust architecture, and external load-balancer termination remain separate operational concerns that should not be confused with Boot's server configuration API.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.TlsSslBundles/TlsSslBundles.md"
