  - question: >-
      Why should you separate reactive server bootstrap from Spring WebFlux request processing when reasoning about a reactive Boot application? Give an example of a symptom that belongs on each side of the boundary.
    answer: >-
      Reactive server bootstrap is responsible for selecting and configuring a ReactiveWebServerFactory, creating the concrete server, and starting it with the reactive application context. WebFlux owns the higher-level request pipeline after the server is running. A failure such as no suitable reactive server factory or a port-binding error belongs to bootstrap. A request that reaches the server but fails route matching, codec negotiation, or handler execution belongs to WebFlux. Mixing the layers leads to poor fixes, such as changing RouterFunction definitions for a missing server dependency or replacing the server because a codec is misconfigured.
    aiGenerated: true
    reviewed: false
    readmeRelated:
