  - question: >-
      Explain the lifecycle relationship between a web ApplicationContext, a WebServerFactory, and the running WebServer. Why is the actual listening port a runtime fact rather than merely a configuration value?
    answer: >-
      Boot first obtains a suitable WebServerFactory from the context, applies configuration and customizers to that factory, creates the WebServer, and starts it as part of web-application-context refresh. The factory is the construction/configuration abstraction; the WebServer is the realized runtime instance. Configuration such as server.port expresses intent, but the runtime may resolve it differently. The clearest example is server.port=0: the configured value remains zero while the operating system assigns a real free port after server startup. Code that needs the listening endpoint must therefore inspect the initialized server state rather than assuming the configured property equals the realized port.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.EmbeddedServerModel/EmbeddedServerModel.md"
      anchor: "web-server-context-startup"
    apiRelated:
      controller: "WebRuntimeExperimentController"
      methodSignature: "embeddedServer()"

  - question: >-
      A Servlet Boot application defines its own ServletWebServerFactory bean. What should happen to Boot's default server-factory auto-configuration, and why is that back-off behavior important for customization design?
    answer: >-
      Boot's default Servlet server-factory contribution should back off when the application supplies its own ServletWebServerFactory. The application has made an explicit ownership decision, so creating another competing factory would make startup ambiguous and turn customization into a fight with defaults. This also explains the preferred escalation path: supported server properties are cheapest, WebServerFactoryCustomizer is the normal programmatic hook when the factory can remain Boot-managed, and a custom factory bean is the strongest override when the application truly needs to own construction. Back-off preserves convention without taking control away from the application.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.ServletServerAutoConfiguration/ServletServerAutoConfiguration.md"
      anchor: "servlet-server-backoff"
