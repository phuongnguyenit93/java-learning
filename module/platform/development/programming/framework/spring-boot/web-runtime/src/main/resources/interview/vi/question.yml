  - question: >-
      Vì sao forwarded headers là quyết định về trust boundary chứ không chỉ là tiện ích để tạo URL đúng phía sau proxy? Hãy so sánh NONE, NATIVE và FRAMEWORK ở mức mental model.
    answer: >-
      Forwarded header có thể thay đổi scheme, host, port, client address và URL mà application code tin là đến từ network boundary. Tin dữ liệu do attacker tự gửi có thể làm sai redirect, quyết định security, logging và link generation. NONE không áp dụng các header đó. NATIVE giao việc diễn giải cho cơ chế của embedded server. FRAMEWORK để Spring Framework biến đổi request metadata. Strategy đúng phụ thuộc deployment topology và việc bảo đảm chỉ trusted proxy có thể cung cấp hoặc giữ metadata forwarding có thẩm quyền. Boot chọn strategy; độ an toàn của proxy chain và việc sanitize header vẫn là trách nhiệm infrastructure.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "10.ForwardedHeadersProxy/ForwardedHeadersProxy.md"
      anchor: "forwarded-header-trust-boundary"
    apiRelated:
      controller: "WebRuntimeExperimentController"
      methodSignature: "requestMetadata()"

  - question: >-
      Hãy mô tả graceful shutdown như một bài toán phối hợp. Vì sao câu "process đã nhận SIGTERM" chưa đủ để kết luận HTTP work đang chạy sẽ hoàn tất an toàn?
    answer: >-
      Termination signal chỉ khởi đầu shutdown path. Trong Spring Boot 3.3, server.shutdown mặc định là immediate, vì vậy muốn drain request theo cơ chế graceful thì trước hết phải bật server.shutdown=graceful. Khi đã bật, việc hoàn tất an toàn vẫn còn phụ thuộc ApplicationContext đóng, embedded server đi vào graceful behavior, work mới bị từ chối hoặc drain theo server, và request đang chạy kết thúc trước khi shutdown phase timeout hết hạn. Application availability, thay đổi readiness của orchestrator, background work và downstream timeout cũng ảnh hưởng việc service có dừng sạch hay không. Vì vậy graceful server shutdown chỉ cho một khoảng cơ hội có giới hạn chứ không phải bảo đảm vô hạn. Ở production cần căn timeout của Boot với termination grace period của platform và độ dài request mà service chủ đích cho phép hoàn tất.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "11.GracefulShutdown/GracefulShutdown.md"
      anchor: "in-flight-request-grace-period"
    apiRelated:
      controller: ""
