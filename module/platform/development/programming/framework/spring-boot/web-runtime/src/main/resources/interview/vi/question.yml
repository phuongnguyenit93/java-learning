  - question: >-
      Hãy giải thích quan hệ lifecycle giữa web ApplicationContext, WebServerFactory và WebServer đang chạy. Vì sao listening port thực tế là trạng thái runtime chứ không đơn thuần là giá trị cấu hình?
    answer: >-
      Boot lấy WebServerFactory phù hợp từ context, áp dụng configuration và customizer lên factory, tạo WebServer rồi khởi động nó trong quá trình refresh web application context. Factory là abstraction để xây dựng/cấu hình; WebServer là instance runtime đã hiện thực hóa. Cấu hình như server.port biểu đạt ý định nhưng runtime có thể resolve khác. Ví dụ rõ nhất là server.port=0: giá trị cấu hình vẫn là 0 trong khi hệ điều hành cấp một port trống thật sau khi server khởi động. Code cần endpoint đang lắng nghe phải đọc trạng thái server đã khởi tạo thay vì giả định property cấu hình bằng port thực tế.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.EmbeddedServerModel/EmbeddedServerModel.md"
      anchor: "web-server-context-startup"
    apiRelated:
      controller: "WebRuntimeExperimentController"
      methodSignature: "embeddedServer()"

  - question: >-
      Một ứng dụng Boot Servlet tự khai báo ServletWebServerFactory bean. Auto-configuration factory mặc định của Boot nên xử lý thế nào, và vì sao hành vi back-off đó quan trọng đối với thiết kế tùy biến?
    answer: >-
      Factory mặc định do Boot đóng góp phải back off khi ứng dụng cung cấp ServletWebServerFactory riêng. Ứng dụng đã đưa ra quyết định sở hữu tường minh, nên tạo thêm factory cạnh tranh sẽ làm startup mơ hồ và biến tùy biến thành cuộc đấu với default. Điều này cũng giải thích thứ tự nâng mức tùy biến: property server được hỗ trợ là cách rẻ nhất; WebServerFactoryCustomizer là hook chương trình thông thường khi vẫn để Boot sở hữu factory; custom factory bean là override mạnh nhất khi ứng dụng thực sự cần sở hữu việc xây dựng. Back-off giúp giữ convention mà không lấy mất quyền kiểm soát của ứng dụng.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.ServletServerAutoConfiguration/ServletServerAutoConfiguration.md"
      anchor: "servlet-server-backoff"
    apiRelated:
      controller: ""
