  - question: >-
      Bạn sẽ giải thích khác biệt giữa ServerProperties và WebServer đang chạy như thế nào khi debug cấu hình production? Vì sao nhìn chung nên ưu tiên setting portable trong server.* trước namespace riêng của từng server?
    answer: >-
      ServerProperties là model cấu hình đã bind của Boot: nó biểu diễn ý định server.* hiệu lực sau khi external configuration được resolve và bind. WebServer đang chạy là object runtime sau khi chọn factory, customize, bind vào hệ điều hành và startup. So sánh hai phía giúp tách điều được yêu cầu khỏi điều thực tế đã xảy ra. Nên ưu tiên property portable trong server.* khi chúng đủ biểu đạt yêu cầu vì ứng dụng ít phụ thuộc hơn vào chi tiết Tomcat, Jetty, Undertow hoặc Netty. Namespace riêng phù hợp khi yêu cầu thật sự dựa vào feature hay tuning knob nằm ngoài abstraction chung của Boot.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.ServerProperties/ServerProperties.md"
      anchor: "portable-vs-server-specific-properties"
    apiRelated:
      controller: "WebRuntimeExperimentController"
      methodSignature: "serverProperties()"

  - question: >-
      Khi tùy biến embedded server, vì sao thứ tự quyết định thường là "properties, rồi WebServerFactoryCustomizer, rồi custom factory bean"? Chi phí bảo trì tăng thế nào ở mỗi mức?
    answer: >-
      Property dùng public configuration contract ổn định của Boot và để Boot tiếp tục sở hữu construction, default, ordering cùng lifecycle, nên mức coupling thấp nhất. WebServerFactoryCustomizer phù hợp khi cần cấu hình bằng code hoặc setting chưa có property nhưng vẫn muốn Boot sở hữu factory; lúc này ứng dụng phụ thuộc thêm vào factory API và thứ tự customizer. Tự cung cấp factory bean chuyển quyền sở hữu construction sang ứng dụng và tạo coupling mạnh nhất với loại server cùng cơ chế factory của Boot. Chọn hook ít quyền lực nhất nhưng vẫn diễn đạt đủ yêu cầu thường cho cấu hình portable và dễ nâng cấp nhất.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.ServerCustomization/ServerCustomization.md"
      anchor: "server-customization-decision-order"
