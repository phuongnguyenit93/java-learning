  - question: >-
      Bạn tiếp quản một Boot web service có rất nhiều server customization tường minh. Làm sao quyết định setting nào nên giữ và setting nào nên trả về Boot default mà không biến "convention over configuration" thành niềm tin mù quáng?
    answer: >-
      Trước tiên phân loại từng customization theo yêu cầu mà nó đáp ứng: correctness, security, deployment topology, observability, bằng chứng performance hay chỉ là di sản lịch sử. Giữ lựa chọn tường minh nếu Boot default sẽ làm vi phạm yêu cầu đó và xác minh bằng runtime evidence tập trung. Loại setting chỉ lặp lại default hoặc bù cho giả định deployment đã lỗi thời vì override không cần thiết che khuất upgrade và tăng coupling. Sau đó kiểm tra lại ownership boundary: request-processing policy thuộc MVC/WebFlux, network và proxy policy có thể thuộc infrastructure, còn embedded-server bootstrap/configuration mới thuộc module này. Convention có giá trị khi nó loại bỏ quyết định ngẫu nhiên nhưng vẫn giữ các quyết định hệ thống thực sự cần.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "12.BootWebDefaults/BootWebDefaults.md"
      anchor: "web-runtime-end-to-end-model"
