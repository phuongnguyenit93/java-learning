  - question: >-
      HTTP/2, compression, giới hạn header, access logging và connection tuning đều có thể trông như "HTTP configuration". Bạn sẽ quyết định dùng setting portable của Boot hay capability riêng của server thế nào?
    answer: >-
      Bắt đầu từ yêu cầu hành vi và tìm common Boot property có thể diễn đạt nó trên các server được hỗ trợ. Dùng contract portable khi semantics đó đủ. Chỉ chuyển sang namespace hoặc customizer riêng khi yêu cầu phụ thuộc vào hành vi implementation-specific, chẳng hạn connector option, cơ chế logging hay tuning mà Boot chủ đích không chuẩn hóa. Trade-off là portability so với độ chính xác: control riêng có thể mạnh hơn nhưng cũng buộc configuration, test và kiến thức vận hành vào một implementation. Quyết định cần tường minh để lần thay server sau không âm thầm mang theo giả định sai.
    aiGenerated: true
    reviewed: false
    readmeRelated:
