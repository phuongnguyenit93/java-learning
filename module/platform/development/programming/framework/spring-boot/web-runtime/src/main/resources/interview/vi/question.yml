  - question: >-
      Lợi ích thiết kế của việc áp dụng named SSL bundle cho web server thay vì lặp lại TLS material trong các setting server.ssl.* là gì, và khi nào cấu hình server.ssl trực tiếp vẫn hợp lý?
    answer: >-
      Named SSL bundle tạo một danh tính có thể tái sử dụng cho TLS material và options, cho phép nhiều client hoặc server integration tiêu thụ nhất quán. Nó giảm lặp keystore, truststore, certificate và protocol configuration, đồng thời giúp rotation hay thay policy tập trung hơn. server.ssl.* trực tiếp vẫn hợp lý khi TLS chỉ thuộc một web-server endpoint và reuse chỉ làm tăng indirection. Dù dùng cách nào, Boot chỉ tích hợp TLS material với embedded server; certificate issuance, PKI policy, trust architecture và TLS termination ở load balancer vẫn là trách nhiệm vận hành khác, không nên trộn với API cấu hình server của Boot.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.TlsSslBundles/TlsSslBundles.md"
      anchor: "ssl-bundle-consumption"
    apiRelated:
