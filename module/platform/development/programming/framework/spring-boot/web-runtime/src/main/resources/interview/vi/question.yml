  - question: >-
      Vì sao khi suy luận về một reactive Boot application cần tách reactive server bootstrap khỏi xử lý request của Spring WebFlux? Hãy nêu một triệu chứng thuộc mỗi phía của ranh giới.
    answer: >-
      Reactive server bootstrap chịu trách nhiệm chọn và cấu hình ReactiveWebServerFactory, tạo concrete server và khởi động nó cùng reactive application context. WebFlux sở hữu pipeline request ở tầng cao hơn sau khi server đã chạy. Lỗi không có reactive server factory phù hợp hoặc bind port thất bại thuộc bootstrap. Request đã tới server nhưng route không match, codec negotiation lỗi hoặc handler thực thi thất bại thuộc WebFlux. Trộn hai tầng dễ dẫn tới cách sửa sai như đổi RouterFunction vì thiếu dependency server hoặc thay server chỉ vì codec cấu hình sai.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.ReactiveServerAutoConfiguration/ReactiveServerAutoConfiguration.md"
      anchor: "reactive-server-webflux-boundary"
    apiRelated:
      controller: ""
