questions:
  - question: >-
      Lớp web runtime của Spring Boot giải quyết vấn đề gì giữa SpringApplication và Spring MVC hoặc WebFlux, và vì sao cần giữ ranh giới đó rõ ràng khi chẩn đoán ứng dụng web khởi động sai?
    answer: >-
      Web runtime của Boot quyết định ứng dụng có thuộc loại web hay không, chọn web ApplicationContext phù hợp, cung cấp và cấu hình embedded server factory, rồi khởi động WebServer trong quá trình refresh context. MVC và WebFlux bắt đầu sau điểm bàn giao đó và sở hữu semantics xử lý request. Giữ ranh giới rõ giúp tránh chẩn đoán sai tầng: lỗi tạo hoặc khởi động embedded server thuộc bootstrap của Boot/server, còn handler mapping, codec, controller và request dispatch thuộc web framework. Nhờ vậy ta không sửa controller để giải quyết lỗi server không khởi động.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/Introduction.md"
      anchor: "web-runtime-boundaries"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      WebApplicationType ảnh hưởng thế nào tới phần còn lại của quá trình Spring Boot startup, và điều gì dễ gây bất ngờ khi classpath đồng thời có tín hiệu Servlet lẫn Reactive?
    answer: >-
      WebApplicationType là phân loại sớm, ảnh hưởng ApplicationContext mà Boot tạo và nhánh web-server auto-configuration nào có thể match. Vì vậy việc suy ra từ classpath không chỉ là metadata mô tả mà thay đổi runtime model phía sau. Khi tín hiệu Servlet và Reactive cùng tồn tại, Servlet thường có ưu tiên, nên chỉ thêm một reactive library chưa chắc biến ứng dụng thành reactive server application. Nếu ứng dụng thật sự cần model khác, cấu hình tường minh spring.main.web-application-type rõ ràng hơn phụ thuộc vào hỗn hợp dependency tình cờ. Các condition, server factory và framework infrastructure phía sau đều dựa trên application type đã chọn.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.WebApplicationType/WebApplicationType.md"
