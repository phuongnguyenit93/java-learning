references:
  - title: "Spring Boot 3.3 Reference - Web"
    url: "https://docs.spring.io/spring-boot/3.3/reference/web/"
    description: "Official overview of Spring Boot web applications and the Servlet and Reactive web runtime integration."
  - title: "Spring Boot 3.3 How-to - Embedded Web Servers"
    url: "https://docs.spring.io/spring-boot/3.3/how-to/webserver.html"
    description: "Official guidance for embedded server selection, configuration, HTTP features, TLS, customization, proxy deployment, and server-specific options."
  - title: "Spring Boot 3.3 Common Application Properties"
    url: "https://docs.spring.io/spring-boot/3.3/appendix/application-properties/index.html"
    description: "Official catalog for server.* and related configuration properties used by the embedded web runtime."
  - title: "Spring Boot 3.3 Reference - SSL"
    url: "https://docs.spring.io/spring-boot/3.3/reference/features/ssl.html"
    description: "Official reference for named SSL bundles that can be consumed by an embedded web server."
  - title: "Spring Boot 3.3 Reference - Graceful Shutdown"
    url: "https://docs.spring.io/spring-boot/3.3/reference/web/graceful-shutdown.html"
    description: "Official behavior and configuration model for graceful shutdown of Boot-managed web servers."
  - title: "Spring Boot 3.3 API - WebApplicationType"
    url: "https://docs.spring.io/spring-boot/3.3/api/java/org/springframework/boot/WebApplicationType.html"
    description: "Official API contract for NONE, SERVLET, and REACTIVE application types."
  - title: "Spring Boot 3.3 API - WebServerFactoryCustomizer"
    url: "https://docs.spring.io/spring-boot/3.3/api/java/org/springframework/boot/web/server/WebServerFactoryCustomizer.html"
    description: "Official customization hook for Boot-managed embedded web-server factories."
