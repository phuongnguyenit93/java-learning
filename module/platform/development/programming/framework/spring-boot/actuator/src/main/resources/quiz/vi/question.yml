questions:
  - id: "actuator-q01"
    question: "Phát biểu nào mô tả đúng nhất vai trò của Spring Boot Actuator trong một ứng dụng đang chạy?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.ActuatorPurpose/ActuatorPurpose.md"
      anchor: "runtime-state-vs-actuator-view"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Nó tạo lifecycle và health state rồi expose các state đó qua management endpoint."
        explanation: "Application runtime sở hữu lifecycle và availability transition; Actuator chỉ có thể expose các trạng thái đó."
      - id: B
        answer: "Nó expose operational state được chọn, còn subsystem tạo ra state vẫn giữ ownership."
        explanation: "Mô hình consumer-view này giải thích health, availability, metrics, logging và startup diagnostics mà không chuyển ownership nguồn state sang Actuator."
      - id: C
        answer: "Nó lưu operational state trên các replica nên external observability infrastructure trở thành tùy chọn."
        explanation: "Actuator cung cấp management view cục bộ theo application; collection bền vững và phân tích cross-instance thuộc observability infrastructure."
      - id: D
        answer: "Nó chuyển domain API thành management operation để hai surface dùng chung một contract."
        explanation: "Actuator thêm một management surface riêng; business API thông thường vẫn là contract hướng domain."
    correctAnswerId: B
  - id: "actuator-q02"
    question: "Vì sao nên xem Actuator endpoint ID là management identity thay vì một HTTP path hard-code?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.EndpointModel/EndpointModel.md"
      anchor: "endpoint-id-and-operations"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Vì ID được suy ra từ active management port còn operation name vẫn transport-neutral."
        explanation: "Endpoint ID là management identity ổn định và không được suy ra từ server port."
      - id: B
        answer: "Vì ID chỉ xác định JMX object name còn HTTP dùng route identifier không liên quan."
        explanation: "Cùng một logical endpoint có thể được expose qua HTTP, JMX hoặc cả hai."
      - id: C
        answer: "Vì ID xác định response format còn operation annotation xác định endpoint identity."
        explanation: "Endpoint ID xác định capability; operation và exposure adapter quyết định representation theo transport."
      - id: D
        answer: "Vì ID đặt tên management capability, còn operation và exposure adapter tạo HTTP hoặc JMX representation."
        explanation: "Cách nhìn này giữ management intent độc lập với transport dùng để expose nó."
    correctAnswerId: D
  - id: "actuator-q03"
    question: "Một endpoint bean cần tồn tại để dùng nội bộ nhưng không được reachable qua HTTP. Nên dựa vào distinction nào khi cấu hình?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.EndpointAvailabilityExposure/EndpointAvailabilityExposure.md"
      anchor: "endpoint-exposure"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Giữ endpoint enabled nhưng exclude ID của nó khỏi web exposure."
        explanation: "Enablement quyết định capability có tồn tại hay không; web exposure độc lập quyết định HTTP reachability."
      - id: B
        answer: "Disable endpoint rồi dựa vào Spring Security để bean vẫn còn dùng nội bộ."
        explanation: "Disable sẽ loại endpoint capability thay vì chỉ bảo vệ HTTP route."
      - id: C
        answer: "Đổi `/actuator` base path vì path khác sẽ khiến endpoint chỉ còn nội bộ."
        explanation: "Đổi path chỉ thay routing, không thay exposure hay authorization."
      - id: D
        answer: "Expose qua HTTP và bỏ authorization vì internal caller sẽ bypass management surface."
        explanation: "HTTP exposure tạo reachability; authorization của caller vẫn là quyết định riêng."
    correctAnswerId: A
  - id: "actuator-q04"
    question: "Một management URL trả 404 cho endpoint mà team kỳ vọng sử dụng. Chuỗi kiểm tra đầu tiên nào hợp lý nhất?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.EndpointAvailabilityExposure/EndpointAvailabilityExposure.md"
      anchor: "endpoint-availability"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Kiểm tra authorization trước, rồi mới xem endpoint enablement và exposure nếu policy cho phép."
        explanation: "Authorization nên được xem xét sau khi xác nhận endpoint availability và exposure."
      - id: B
        answer: "Kiểm tra management base path và route mapping trước, rồi mới xác nhận endpoint capability có tồn tại."
        explanation: "Routing nằm sau việc xác nhận endpoint capability và transport exposure thực sự tồn tại."
      - id: C
        answer: "Kiểm tra enablement và transport prerequisite, rồi exposure, routing và cuối cùng authorization."
        explanation: "Thứ tự này tách missing capability khỏi missing transport mapping trước khi đi sang network/security."
      - id: D
        answer: "Tạm mở rộng exposure trước, rồi thu hẹp lại sau khi missing route xuất hiện."
        explanation: "Broad exposure không phải diagnostic default an toàn và có thể làm endpoint nhạy cảm reachable."
    correctAnswerId: C
  - id: "actuator-q05"
    question: "Learning API đặt simulated dependency thành unavailable. Điều gì nên xảy ra trong custom-health experiment?"
