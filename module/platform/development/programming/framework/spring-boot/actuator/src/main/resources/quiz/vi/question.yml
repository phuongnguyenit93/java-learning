    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Xem masking là giảm disclosure; vẫn giới hạn endpoint exposure và authorization."
        explanation: "Sanitization giảm accidental disclosure nhưng không làm privileged diagnostic endpoint an toàn để expose rộng."
      - id: B
        answer: "Xem masking tương đương encryption at rest, chỉ còn transport security cần cấu hình."
        explanation: "Actuator sanitization liên quan endpoint representation, không phải storage encryption."
      - id: C
        answer: "Xem masking là đủ nếu sensitive key khớp known pattern, nên authorization có thể bỏ."
        explanation: "Pattern-based masking có thể bỏ sót sensitive value, nên endpoint authorization vẫn là control riêng."
      - id: D
        answer: "Xem masking là JMX access-control boundary, nên HTTP exposure có thể mở rộng."
        explanation: "Show-values authorization semantics không thay thế JMX connectivity và access control."
