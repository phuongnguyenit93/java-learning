      anchor: "health-status-aggregation"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Custom mapping chỉ đổi custom status; default mapping của DOWN và OUT_OF_SERVICE vẫn tự động giữ nguyên."
        explanation: "Khi có custom status HTTP mapping, default mapping behavior thay đổi nên hai default 503 không còn được giữ tự động."
      - id: B
        answer: "Custom mapping đổi status ordering nhưng HTTP translation vẫn cố định bởi Boot."
        explanation: "HTTP health status mapping có thể cấu hình trực tiếp."
      - id: C
        answer: "Custom mapping thay health aggregation bằng HTTP code riêng cho từng contributor."
        explanation: "Health aggregation vẫn diễn ra; mapping chỉ điều khiển việc đổi aggregate health status sang HTTP status."
      - id: D
        answer: "Custom mapping bỏ default 503 cho DOWN và OUT_OF_SERVICE trừ khi team khai báo lại rõ ràng."
        explanation: "Boot không còn tự áp dụng hai default mapping 503 này khi custom status HTTP mappings được cung cấp."
    correctAnswerId: D
  - id: "actuator-q07"
    question: "Load balancer chỉ cần health status, còn operator cần contributor details. Thiết kế Actuator nào phù hợp cho cả hai audience?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Health/Health.md"
      anchor: "health-detail-visibility"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Expose basic status rộng hơn nhưng gate component và details bằng visibility cùng authorization policy rõ ràng."
        explanation: "Actuator hỗ trợ show-components/show-details riêng nên các operational audience không bắt buộc nhận cùng mức evidence."
      - id: B
        answer: "Expose full details rộng hơn nhưng đặt credentials trong payload để chỉ operator hiểu response."
        explanation: "Health detail không nên chứa secret; access policy mới là nơi bảo vệ detail nhạy cảm."
      - id: C
        answer: "Tạo business API thứ hai cho operator detail vì Actuator health không thể đổi detail visibility."
        explanation: "Actuator đã có control cho visibility của component và details."
      - id: D
        answer: "Trả full details cho caller đã authenticate và dựa vào masking để bảo vệ contributor value nhạy cảm."
        explanation: "Cách bảo thủ là expose đúng lượng detail mà từng audience cần."
    correctAnswerId: A
  - id: "actuator-q08"
    question: "Vì sao copy mọi external dependency check vào cả liveness và readiness group thường là thiết kế probe kém?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.AvailabilityProbes/AvailabilityProbes.md"
      anchor: "probe-external-dependency-boundary"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Đưa mỗi external dependency vào cả hai probe để probe nào fail cũng có thể loại hoặc restart instance."
        explanation: "Đưa shared dependency vào liveness có thể làm mọi instance restart vô ích trong lúc external outage."
      - id: B
        answer: "Đưa mỗi external dependency chỉ vào liveness vì restart là phản ứng chuẩn khi mất connectivity."
        explanation: "Shared external outage có thể không được sửa bằng restart process, nên liveness nên tập trung vào internal failure mà restart có thể giúp."
      - id: C
        answer: "Dùng readiness khi mất dependency nên dừng traffic, còn liveness dành cho failure mà restart có thể giúp."
        explanation: "Liveness tập trung vào việc restart có thể giúp hay không; readiness trả lời instance có nên nhận traffic lúc này hay không."
      - id: D
        answer: "Loại external dependency khỏi cả hai probe vì readiness chỉ nên mô tả JVM-local state."
        explanation: "Readiness có thể hợp lý khi chứa dependency nếu mất dependency nghĩa là instance nên ngừng nhận traffic."
    correctAnswerId: C
  - id: "actuator-q09"
