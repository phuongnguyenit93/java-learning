        answer: "Controller tự report DOWN trực tiếp, còn HealthIndicator chỉ là background check."
        explanation: "Controller chỉ là deterministic trigger; health endpoint lấy evidence từ HealthIndicator."
      - id: B
        answer: "Controller đổi shared state; HealthIndicator báo DOWN; Actuator aggregate và hiển thị kết quả."
        explanation: "Shared state làm thay đổi evidence của contributor; Actuator vẫn chịu trách nhiệm aggregate và management representation."
      - id: C
        answer: "Controller đổi shared state; Actuator yêu cầu HealthIndicator repair dependency trước khi report."
        explanation: "Health contributor báo bounded evidence; repair behavior nằm ngoài trách nhiệm của nó."
      - id: D
        answer: "Controller đổi shared state; metrics counter trở thành nguồn cho aggregate health."
        explanation: "Experiment này nối vào HealthIndicator chứ không phải metric."
    correctAnswerId: B
  - id: "actuator-q06"
    question: "Ứng dụng thêm custom health status và cấu hình một entry `management.endpoint.health.status.http-mapping.*`. Cần lưu ý hành vi HTTP tinh tế nào?"
    aiGenerated: true
    reviewed: false
