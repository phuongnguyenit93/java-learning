      anchor: "probe-endpoint-paths"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Probe the management port only because a healthy management listener represents both HTTP connectors."
        explanation: "A separate management listener can remain healthy while the main request path has failed."
      - id: B
        answer: "Enable `/livez` and `/readyz` on the main server when the probe must include the main connector."
        explanation: "Boot provides main-port probe paths specifically so the probe can include the application's actual request listener in the failure domain."
      - id: C
        answer: "Probe a normal business URL instead and stop using readiness because the management port is separate."
        explanation: "Business and management surfaces should not be merged to solve probe placement."
      - id: D
        answer: "Move all management endpoints back to the main port because additional probe paths are unsupported."
        explanation: "Separate placement does not remove the distinct operational meaning of readiness."
    correctAnswerId: B
