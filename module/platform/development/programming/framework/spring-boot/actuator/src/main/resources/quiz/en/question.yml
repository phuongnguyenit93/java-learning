      - id: B
        answer: "Treat masking as equivalent to encryption at rest, leaving only transport security to configure."
        explanation: "Actuator sanitization is about endpoint representation, not storage encryption."
      - id: C
        answer: "Treat masking as sufficient when sensitive keys match known patterns, making authorization optional."
        explanation: "Pattern-based masking can miss sensitive values, so endpoint authorization remains a separate control."
      - id: D
