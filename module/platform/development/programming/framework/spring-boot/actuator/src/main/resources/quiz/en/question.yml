# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: "actuator-q01"
    question: "Which statement best captures Spring Boot Actuator's role in a running application?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.ActuatorPurpose/ActuatorPurpose.md"
      anchor: "runtime-state-vs-actuator-view"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "It produces lifecycle and health state, then exposes that state through management endpoints."
        explanation: "Application runtime owns lifecycle and availability transitions; Actuator can expose those states."
      - id: B
        answer: "It exposes selected operational state while the subsystem that produces that state keeps ownership."
        explanation: "This consumer-view model explains health, availability, metrics, logging, and startup diagnostics without moving their source ownership into Actuator."
      - id: C
        answer: "It stores operational state across replicas so external observability infrastructure is optional."
        explanation: "Actuator provides application-local management views; durable collection and cross-instance analysis belong to observability infrastructure."
      - id: D
        answer: "It converts domain APIs into management operations so both surfaces share one contract."
        explanation: "Actuator adds a separate management surface; normal business APIs remain domain-facing contracts."
    correctAnswerId: B
  - id: "actuator-q02"
    question: "Why is an Actuator endpoint ID better treated as a management identity than as a hard-coded HTTP path?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.EndpointModel/EndpointModel.md"
      anchor: "endpoint-id-and-operations"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Because the ID is derived from the active management port while operation names stay transport-neutral."
        explanation: "Endpoint IDs are stable management identities and do not derive from the server port."
      - id: B
        answer: "Because the ID identifies only a JMX object name while HTTP uses unrelated route identifiers."
        explanation: "The same logical endpoint may be exposed through HTTP, JMX, or both."
      - id: C
        answer: "Because the ID identifies the response format while operation annotations determine endpoint identity."
        explanation: "The endpoint ID identifies the capability; operations and exposure adapters determine transport representation."
      - id: D
        answer: "Because the ID names the management capability, while operations and exposure adapters produce its HTTP or JMX representation."
        explanation: "This keeps management intent independent from the transport that exposes it."
    correctAnswerId: D
  - id: "actuator-q03"
    question: "An endpoint bean should exist for internal use but must not be reachable over HTTP. Which distinction should guide the configuration?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.EndpointAvailabilityExposure/EndpointAvailabilityExposure.md"
      anchor: "endpoint-exposure"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Keep the endpoint enabled but exclude its ID from web exposure."
        explanation: "Enablement controls whether the capability exists; web exposure separately controls HTTP reachability."
      - id: B
        answer: "Disable the endpoint and rely on Spring Security to keep the bean available internally."
        explanation: "Disabling removes the endpoint capability rather than merely protecting its HTTP route."
      - id: C
        answer: "Change the `/actuator` base path because a different path makes the endpoint internal-only."
        explanation: "Changing a path changes routing, not exposure or authorization."
      - id: D
        answer: "Expose it through HTTP and omit authorization because internal callers bypass the management surface."
        explanation: "HTTP exposure creates reachability; caller authorization remains a separate decision."
    correctAnswerId: A
  - id: "actuator-q04"
    question: "A management URL returns 404 for an endpoint that a team expects to use. What is the best first diagnostic sequence?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.EndpointAvailabilityExposure/EndpointAvailabilityExposure.md"
      anchor: "endpoint-availability"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Check authorization first, then inspect endpoint enablement and exposure if the policy permits access."
        explanation: "Authorization should be investigated after confirming endpoint availability and exposure."
      - id: B
        answer: "Check the management base path and route mapping first, then verify whether the endpoint capability exists."
        explanation: "Routing is downstream of whether the endpoint capability and its transport exposure actually exist."
      - id: C
        answer: "Check enablement and transport prerequisites, then exposure, routing, and finally authorization."
        explanation: "This order distinguishes a missing capability from a missing transport mapping before moving to network or security causes."
      - id: D
        answer: "Temporarily broaden exposure first, then narrow it again after the missing route becomes visible."
        explanation: "Broad exposure is not a safe diagnostic default and can make sensitive endpoints reachable."
    correctAnswerId: C
  - id: "actuator-q05"
    question: "The learning API sets its simulated dependency to unavailable. What should happen in the custom-health experiment?"
    aiGenerated: true
