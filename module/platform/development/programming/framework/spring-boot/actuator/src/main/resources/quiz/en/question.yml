    answers:
      - id: A
        answer: "The controller should report DOWN directly, while the HealthIndicator remains only a background check."
        explanation: "The controller is only a deterministic trigger; the health endpoint obtains evidence from the HealthIndicator."
      - id: B
        answer: "The controller changes shared state; the HealthIndicator reports DOWN; Actuator aggregates and displays it."
        explanation: "The shared state changes the contributor's evidence; Actuator remains responsible for health aggregation and management representation."
      - id: C
        answer: "The controller changes shared state; Actuator asks the HealthIndicator to repair the dependency before reporting."
        explanation: "A health contributor reports bounded evidence; repair behavior is outside its responsibility."
      - id: D
        answer: "The controller changes shared state; a metrics counter becomes the source for aggregate health."
        explanation: "This experiment is wired to a HealthIndicator, not to a metric."
    correctAnswerId: B
  - id: "actuator-q06"
    question: "An application adds a custom health status and configures one `management.endpoint.health.status.http-mapping.*` entry. What subtle HTTP behavior must be considered?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Health/Health.md"
      anchor: "health-status-aggregation"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "A custom mapping changes only the custom status; default DOWN and OUT_OF_SERVICE mappings remain automatic."
        explanation: "Supplying custom status HTTP mappings changes the default mapping behavior, so those 503 defaults are not retained automatically."
      - id: B
        answer: "A custom mapping changes status ordering, but HTTP translation remains fixed by Boot."
        explanation: "HTTP health status mapping is explicitly configurable."
      - id: C
        answer: "A custom mapping replaces health aggregation with separate HTTP codes for each contributor."
        explanation: "Health aggregation still occurs; the mapping controls translation from aggregate health status to HTTP status."
      - id: D
        answer: "A custom mapping removes the default DOWN and OUT_OF_SERVICE 503 mappings unless they are added explicitly."
        explanation: "Boot stops applying those default 503 mappings when custom status HTTP mappings are supplied."
    correctAnswerId: D
  - id: "actuator-q07"
    question: "A load balancer needs only health status, while operators need contributor details. Which Actuator design fits both audiences?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Health/Health.md"
      anchor: "health-detail-visibility"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Expose basic status broadly, but gate components and details with explicit visibility and authorization policy."
        explanation: "Actuator supports separate show-components/show-details policies so different operational audiences need not receive the same evidence."
      - id: B
        answer: "Expose full details broadly, but place credentials in the payload so only operators can interpret the response."
        explanation: "Health detail payloads should not contain secrets; access policy should protect sensitive detail."
      - id: C
        answer: "Create a second business API for operator detail because Actuator health cannot vary detail visibility."
        explanation: "Actuator already has visibility controls for components and details."
      - id: D
        answer: "Return full details to authenticated callers and rely on masking to protect sensitive contributor values."
        explanation: "The conservative approach is to expose only the detail each audience requires."
    correctAnswerId: A
  - id: "actuator-q08"
    question: "Why is copying every external dependency check into both liveness and readiness groups usually a bad probe design?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.AvailabilityProbes/AvailabilityProbes.md"
      anchor: "probe-external-dependency-boundary"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Put each external dependency in both probes so either probe can remove or restart an unhealthy instance."
        explanation: "Duplicating a shared dependency into liveness can cause pointless restarts across all instances during an external outage."
      - id: B
        answer: "Put each external dependency only in liveness because restart is the normal response to lost connectivity."
        explanation: "A shared external outage may not be repaired by restarting the process, so liveness should focus on restart-worthy internal failure."
      - id: C
        answer: "Use readiness when dependency loss should stop traffic, while keeping liveness for failures where restart can help."
        explanation: "Liveness should focus on whether restart may help; readiness answers whether this instance should currently receive traffic."
      - id: D
        answer: "Exclude external dependencies from both probes because readiness should describe only JVM-local state."
        explanation: "Readiness can legitimately include a dependency when losing it means the instance should stop receiving traffic."
    correctAnswerId: C
  - id: "actuator-q09"
    question: "Management endpoints run on a separate port, but the platform must detect failure of the main HTTP connector. Which probe arrangement best addresses that failure domain?"
    aiGenerated: true
