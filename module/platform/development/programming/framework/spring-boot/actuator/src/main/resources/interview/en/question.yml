- question: "An Actuator endpoint is enabled, included in web exposure, and still returns 403. Explain why enablement, exposure, network reachability, and authorization must be debugged as separate layers."
  answer: >-
    Enablement decides whether the capability exists at all. Exposure decides whether an enabled endpoint is represented through a management technology such as HTTP. Network routing and management-port placement decide whether a client can reach that surface. Authorization then decides whether the reached caller may invoke it. A 403 after the endpoint is known to exist and be exposed therefore points toward the active security policy rather than toward endpoint enablement. Conversely, enabling an endpoint cannot repair a route that is not exposed, and authentication does not make an unexposed endpoint reachable. Debugging the layers in order prevents configuration thrashing and preserves least privilege because each control can keep its own purpose.
  aiGenerated: true
  reviewed: false
