- question: "Explain the mental model endpoint ID -> operations -> exposure adapter. Why does this make a generic @Endpoint different from a Spring MVC controller even when both are reachable over HTTP?"
  answer: >-
    The endpoint ID is the stable management identity, operations express management intent, and the exposure adapter maps that model to HTTP or JMX. A generic @Endpoint therefore does not begin with URL routing or controller semantics. @ReadOperation, @WriteOperation, and @DeleteOperation describe the capability once, after which Actuator can represent it through supported management technologies. A Spring MVC controller begins with the web stack and its request/response contract. The distinction matters for portability, testing, and ownership: a technology-agnostic management capability can survive a transport change without being rewritten as a controller. The learning endpoint experiment demonstrates this by invoking the same @Endpoint implementation through a Swagger bridge and through the real /actuator/learning management route.
