- question: "An operator sees effectiveLevel=INFO and configuredLevel=null for a logger, then temporarily sets DEBUG through Actuator. Explain what those values mean and why the change should not be treated as durable configuration."
  answer: >-
    configuredLevel describes whether that exact logger has an explicit runtime setting. A null configured level means the logger is inheriting its behavior from its logger ancestors, ultimately including the root logger. effectiveLevel is the resolved level that currently governs emitted events after inheritance. Setting DEBUG through the loggers endpoint creates an explicit runtime configuration for that logger, so both values may then reflect DEBUG. Logger groups can be convenient targets for runtime changes, but they are not the inheritance source represented by configuredLevel=null. The change is operational state inside the running LoggingSystem, not a rewrite of application configuration. A restart normally rebuilds logging from the normal Boot configuration sources and can remove the temporary override. During incidents, target a narrow logger, account for extra I/O and sensitive log content, and restore the level after collecting enough evidence.
  aiGenerated: true
  reviewed: false
  readmeRelated:
    file: 8.LoggersDiagnostics/LoggersDiagnostics.md
    anchor: configured-effective-log-levels
