questions:
- question: "Why is it useful to think of Actuator as a management projection over runtime state rather than as the owner of that state? Give examples where fixing the endpoint configuration would not fix the underlying problem."
  answer: >-
    Actuator turns operational state produced elsewhere into a consistent management surface. Application runtime owns liveness/readiness transitions, Boot logging owns the running LoggingSystem, Micrometer owns meter state, and ApplicationStartup can own startup-step data. Actuator exposes or controls views over those sources. This distinction guides incident response. If /actuator/health/readiness faithfully reports REFUSING_TRAFFIC, changing the health endpoint does not explain why the runtime changed readiness. If /actuator/loggers reports an inherited level, the source may be logging configuration rather than Actuator. If /actuator/metrics lacks a meter, the first question is whether instrumentation registered it. Treating the endpoint as a projection keeps the fix with the subsystem that produced the evidence instead of repeatedly changing the management surface.
  aiGenerated: true
  reviewed: false
