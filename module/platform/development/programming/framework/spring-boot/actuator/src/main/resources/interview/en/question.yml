- question: "When should a custom management capability remain a generic @Endpoint, use a web/JMX-specific endpoint or extension, or become a normal business/controller API instead?"
  answer: >-
    Start from who consumes the capability and what contract it needs. Use generic @Endpoint when the operation is genuinely operational and its meaning does not depend on HTTP or JMX; this preserves transport portability. Use @WebEndpoint, @JmxEndpoint, or a supported endpoint extension when the same operational responsibility requires technology-specific representation or augments a built-in endpoint. Use a normal MVC/WebFlux controller when the requirement truly needs full web framework request/response semantics, and use a business API when domain clients need the capability as part of the product contract. The key trade-off is ownership and portability, not which annotation feels familiar. Forcing a business workflow into Actuator or hiding HTTP-specific behavior inside a generic endpoint makes exposure and maintenance harder to reason about.
  aiGenerated: true
  reviewed: false
