- question: "A counter appears in MeterRegistry but an operator cannot find useful history in /actuator/metrics. Explain what the metrics endpoint is designed to answer and which expectations belong to external telemetry infrastructure."
  answer: >-
    The metrics endpoint is an on-demand diagnostic view over meters currently known to the application's MeterRegistry. It can answer whether a meter name exists, which measurements are available, and which tags can narrow the current inspection. It is not a time-series database, a durable history, or a cross-instance query engine. Micrometer owns the meter model and registry API; Boot auto-configures supported registries and binders; Actuator exposes the diagnostic management view. Long-term history, aggregation across replicas, alerting, retention, and dashboards belong to a monitoring backend or exporter flow. The learning metric experiment demonstrates the local side by registering and incrementing a tagged counter and then inspecting that same meter through Actuator.
  aiGenerated: true
  reviewed: false
  readmeRelated:
