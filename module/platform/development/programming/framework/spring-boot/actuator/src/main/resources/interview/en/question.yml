- question: "Why are thread dump and heap dump endpoints evidence-delivery tools rather than analysis tools, and what production risks should determine whether they are remotely exposed?"
  answer: >-
    Actuator can capture and deliver diagnostic artifacts from the running process, but it does not decide whether a blocked thread is pathological, which lock causes a deadlock, which objects dominate retained memory, or why GC pressure exists. Those interpretations belong to JVM, concurrency, and memory-analysis tooling. The endpoint itself also has risk: thread dumps reveal code paths and synchronization state; heap dumps can contain credentials, request data, caches, and other production objects, and generating or downloading a large dump can add load to an already stressed service. Exposure therefore needs both confidentiality and resource-impact analysis, with narrow network/authorization controls and an incident workflow that collects only the evidence needed.
  aiGenerated: true
  reviewed: false
