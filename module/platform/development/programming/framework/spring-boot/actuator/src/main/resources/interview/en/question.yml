- question: "How should a custom HealthIndicator be designed so that it provides useful operational evidence without becoming a repair workflow or creating a new outage source?"
  answer: >-
    A HealthIndicator should evaluate one bounded operational condition and return a Health result with a meaningful status and small diagnostic details. It should be fast, side-effect free, and protected by appropriate timeouts when it touches a remote system because platforms may call health frequently. The indicator reports evidence; it should not restart components, repair state, or execute an expensive workflow. Its inclusion also has system consequences because a DOWN leaf can influence an aggregate status and potentially HTTP 503 behavior. Only conditions that materially affect the service's operational usefulness should contribute to the relevant health group. The learning health experiment makes this boundary visible: the controller only changes deterministic state, the custom indicator reports UP or DOWN, and Actuator owns aggregation and the management representation.
  aiGenerated: true
  reviewed: false
