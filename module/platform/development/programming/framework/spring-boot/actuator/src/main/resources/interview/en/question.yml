- question: "During an incident, /actuator/health is reachable but shows DOWN, /actuator/metrics does not contain the expected business meter, and a dashboard is also missing data. How would you classify these symptoms before changing Actuator configuration?"
  answer: >-
    Treat each symptom according to the layer that already succeeded. A reachable health endpoint means endpoint construction, exposure, routing, and basic access are working; DOWN is evidence from a contributor, so investigate the contributor or subsystem that produced it. A missing meter requires checking whether application instrumentation and the MeterRegistry created that meter before changing metrics endpoint exposure. A dashboard adds another boundary: even if the local meter exists, the export registry, scrape or push path, backend ingestion, query, and retention may fail outside the application. Actuator is most useful when it narrows ownership. Change endpoint configuration only when the failure is actually availability, exposure, representation, or access rather than underlying runtime state or telemetry transport.
