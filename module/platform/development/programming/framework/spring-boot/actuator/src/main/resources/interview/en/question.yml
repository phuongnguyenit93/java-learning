- question: "What can go wrong if Kubernetes probes call only a separate Actuator management port, and why can adding /livez and /readyz on the main application port change the failure domain being tested?"
  answer: >-
    A separate management server can remain healthy while the main application connector or request path is unable to accept business traffic. A readiness probe that reaches only the management port may therefore report success for the management server while missing failure of the path users depend on. Boot can expose additional liveness/readiness paths on the main server so the platform checks a route that shares more of the business connector's failure domain. This is not automatically superior in every deployment: a dedicated management port still provides isolation and may be required by network design. The point is to choose the probe path according to what failure must remove the instance from service, rather than assuming every HTTP 200 from any local port proves the application path is healthy.
