    methodSignature: recordMetric(String)
- question: "Compare /actuator/metrics with a Prometheus scrape endpoint. Why are they both related to metrics but intended for different consumers and workflows?"
  answer: >-
    The generic metrics endpoint is designed for interactive inspection of Micrometer meters in one running application. An operator can discover names, measurements, and tag dimensions and narrow a query while diagnosing an instance. A Prometheus endpoint is a transport for a Prometheus server: with the appropriate registry it exposes scrape-format telemetry for collection into an external time-series system. The first is a management diagnostic; the second participates in an export pipeline. Retention, multi-instance queries, recording rules, dashboards, and alerts begin after the telemetry leaves the application. Treating /actuator/metrics as a polling backend would lose the storage and system-wide semantics that dedicated observability infrastructure provides.
