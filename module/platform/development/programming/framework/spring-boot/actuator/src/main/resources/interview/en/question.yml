- question: "Why should liveness and readiness health groups usually not contain the same external dependency checks? Analyze the failure mode when a shared database outage is included in liveness."
  answer: >-
    Liveness asks whether restarting this process may help; readiness asks whether this instance should receive traffic now. If a shared database outage makes every instance report broken liveness, an orchestrator may restart the whole fleet even though process restarts cannot repair the database. That can create a cascading restart storm and erase useful local state during the incident. Readiness may include an external dependency when the service truly cannot serve useful traffic without it, but even there the team must decide whether removing every replica is better than degraded behavior. Boot deliberately keeps arbitrary external indicators out of the probe groups by default. The correct probe design follows failure semantics, not the convenience of reusing every HealthIndicator everywhere.
  aiGenerated: true
  reviewed: false
  readmeRelated:
