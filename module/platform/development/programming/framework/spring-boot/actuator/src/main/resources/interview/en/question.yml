- question: "Why can adding your own SecurityFilterChain silently change the protection assumptions around Actuator, and what should be reviewed after that customization?"
  answer: >-
    Boot's Actuator-aware security auto-configuration applies only while the application has not supplied its own SecurityFilterChain. Once application security defines a filter chain, Boot backs off and the team owns the matching and authorization rules. The review must therefore include which management paths or EndpointRequest matchers are covered, which endpoints are permitted or authenticated, how the management port/network is placed, and whether write or sensitive diagnostic endpoints have stronger policy than basic health. Exposure and authorization remain independent: a secure filter chain does not justify exposing every endpoint, and excluding an endpoint from HTTP is not an authentication rule. A 401 or 403 after availability is confirmed should be followed into the active Spring Security policy rather than “fixed” by broadening Actuator exposure.
  aiGenerated: true
  reviewed: false
