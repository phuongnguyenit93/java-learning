- question: "A team introduces a custom health Status and configures management.endpoint.health.status.http-mapping for it. Why can this accidentally change the HTTP behavior of DOWN and OUT_OF_SERVICE, and what should the team verify?"
  answer: >-
    Health aggregation and HTTP mapping are separate steps. StatusAggregator decides which status wins; HttpCodeStatusMapper then converts the aggregate to an HTTP status. Boot normally maps DOWN and OUT_OF_SERVICE to 503 while UP and UNKNOWN remain 200. Once the application defines any custom management.endpoint.health.status.http-mapping entry, Boot no longer supplies those default DOWN and OUT_OF_SERVICE mappings automatically. The team should explicitly retain the desired 503 mappings alongside the custom status and verify the complete ordered status model, not only the new value. Otherwise the health JSON may correctly say DOWN while the HTTP response unexpectedly remains successful, which can break load balancer or monitoring assumptions.
