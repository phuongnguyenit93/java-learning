    methodSignature: recordMetric(String)
- question: "Why does Actuator's tag filtering capability not make high-cardinality tags safe? Use a request ID or user ID tag as the failure example."
  answer: >-
    A tag filter such as tag=outcome:success selects from meter identities that already exist; it does not collapse or prevent those identities from being created. If every request ID or user ID becomes a tag value, the application and backend can create an unbounded number of time series, increasing memory, storage, indexing, and query cost. Actuator may reveal the symptom by listing many available tag values, but the fix is instrumentation design: choose bounded dimensions that represent useful categories. The learning counter intentionally restricts outcome to success or failure so the experiment can demonstrate filtering without teaching an unsafe cardinality pattern. Diagnostic convenience cannot compensate for an unbounded metric model.
  aiGenerated: true
  reviewed: false
  readmeRelated:
