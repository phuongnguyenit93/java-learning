- question: "Why are env and configprops valuable during an incident but still poor candidates for broad exposure even when values are sanitized?"
  answer: >-
    These endpoints can reveal which property sources exist, which names are present, how ConfigurationProperties objects are structured, and enough deployment context to explain a configuration problem. Sanitization can mask sensitive values and show-values policies can limit when originals are returned, but masking does not remove all useful metadata from the response. Property names, source names, object topology, and values not recognized as sensitive can still help an attacker. Therefore sanitization is defense in depth rather than an exposure policy or secret-management system. Keep the endpoints restricted by exposure, network placement, and authorization, then hand precedence or binding questions to externalized-configuration once Actuator has shown the runtime view.
