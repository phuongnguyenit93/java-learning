- question: "How do @ReadOperation and @WriteOperation preserve management intent without making a custom @Endpoint an MVC controller, and what constraints follow for operation parameters?"
  answer: >-
    The annotations describe logical management operations on an endpoint ID. Actuator later adapts those operations to HTTP or JMX, so endpoint code does not need @GetMapping or @PostMapping. Operation parameters are explicit method parameters, required by default and optionally nullable; a @Selector can become a web path segment. Generic endpoint input uses simple parameter values rather than treating one complex DTO as an arbitrary HTTP request body, and parameter names must be retained so Actuator can bind the input. Conversion goes through ApplicationConversionService plus endpoint converters. The learning read experiment demonstrates the read operation by comparing the endpoint implementation with /actuator/learning while the bridge remains only a teaching surface.
