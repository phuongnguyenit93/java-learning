- question: "Custom HealthIndicator nên được thiết kế thế nào để cung cấp operational evidence hữu ích mà không biến thành repair workflow hoặc tự tạo thêm nguồn outage?"
  answer: >-
    HealthIndicator nên đánh giá một operational condition có giới hạn và trả Health với status có ý nghĩa cùng một ít diagnostic detail. Check phải nhanh, side-effect free và có timeout phù hợp nếu chạm remote system vì platform có thể gọi health thường xuyên. Indicator chỉ báo evidence; nó không nên restart component, sửa state hay chạy workflow tốn kém. Việc đưa indicator vào group còn có hệ quả hệ thống vì leaf DOWN có thể ảnh hưởng aggregate status và HTTP 503. Chỉ condition thực sự ảnh hưởng khả năng vận hành của service mới nên nằm trong health group liên quan. Experiment learning health làm ranh giới này rõ: controller chỉ đổi state xác định, custom indicator báo UP/DOWN, còn Actuator sở hữu aggregation và management representation.
  aiGenerated: true
