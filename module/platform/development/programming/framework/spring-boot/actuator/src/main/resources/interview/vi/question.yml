- question: "@ReadOperation và @WriteOperation giữ management intent như thế nào mà không biến custom @Endpoint thành MVC controller, và operation parameter phải tuân theo constraint nào?"
  answer: >-
    Các annotation mô tả logical management operation trên endpoint ID. Actuator sau đó adapt các operation sang HTTP hoặc JMX nên endpoint code không cần @GetMapping hay @PostMapping. Operation parameter là method parameter tường minh, mặc định bắt buộc và có thể nullable; @Selector có thể trở thành web path segment. Generic endpoint input dùng các parameter value đơn giản thay vì coi một complex DTO là arbitrary HTTP request body, và parameter name phải được giữ để Actuator bind input. Conversion đi qua ApplicationConversionService cùng endpoint converter. Learning read experiment chứng minh read operation bằng cách so endpoint implementation với /actuator/learning, trong khi bridge chỉ là teaching surface.
