- question: "Điều gì có thể sai nếu Kubernetes probe chỉ gọi Actuator management port riêng, và vì sao thêm /livez và /readyz trên main application port làm thay đổi failure domain được kiểm tra?"
  answer: >-
    Management server riêng có thể vẫn khỏe trong khi main application connector hoặc request path không thể nhận business traffic. Readiness probe chỉ chạm management port vì thế có thể báo thành công cho management server nhưng bỏ sót failure của path người dùng phụ thuộc. Boot có thể expose thêm path liveness/readiness trên main server để platform kiểm tra route chia sẻ nhiều hơn failure domain của business connector. Điều này không tự động tốt hơn ở mọi deployment: management port riêng vẫn đem lại isolation và có thể là yêu cầu network design. Điểm quan trọng là chọn probe path theo failure nào phải loại instance khỏi service, thay vì giả định HTTP 200 từ bất kỳ local port nào đều chứng minh application path khỏe.
