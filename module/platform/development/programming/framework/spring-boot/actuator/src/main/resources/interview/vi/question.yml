- question: "Một team thêm custom health Status và cấu hình management.endpoint.health.status.http-mapping cho status đó. Vì sao việc này có thể vô tình đổi HTTP behavior của DOWN và OUT_OF_SERVICE, và team phải kiểm tra gì?"
  answer: >-
    Health aggregation và HTTP mapping là hai bước riêng. StatusAggregator quyết định status nào thắng; HttpCodeStatusMapper sau đó chuyển aggregate thành HTTP status. Bình thường Boot map DOWN và OUT_OF_SERVICE sang 503, còn UP và UNKNOWN vẫn là 200. Khi application định nghĩa bất kỳ management.endpoint.health.status.http-mapping tùy chỉnh nào, Boot không còn tự bổ sung các mapping mặc định cho DOWN và OUT_OF_SERVICE. Team phải khai báo rõ các mapping 503 vẫn muốn giữ bên cạnh custom status và kiểm tra toàn bộ ordered status model chứ không chỉ giá trị mới. Nếu không, health JSON có thể đúng là DOWN nhưng HTTP response lại thành successful, phá assumption của load balancer hoặc monitoring.
  aiGenerated: true
