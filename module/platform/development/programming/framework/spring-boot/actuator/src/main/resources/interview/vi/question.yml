- question: "Trong incident, /actuator/health reachable nhưng báo DOWN, /actuator/metrics không có business meter mong đợi, đồng thời dashboard cũng thiếu dữ liệu. Bạn sẽ phân loại các symptom này thế nào trước khi đổi Actuator configuration?"
  answer: >-
    Hãy xử lý từng symptom theo layer đã thành công. Health endpoint reachable nghĩa endpoint construction, exposure, routing và basic access đang hoạt động; DOWN là evidence từ contributor nên điều tra contributor hoặc subsystem tạo ra nó. Meter bị thiếu cần kiểm tra application instrumentation và MeterRegistry có tạo meter hay chưa trước khi đổi metrics endpoint exposure. Dashboard thêm một boundary khác: ngay cả khi local meter tồn tại, export registry, scrape/push path, backend ingestion, query hoặc retention có thể fail bên ngoài application. Actuator hữu ích nhất khi giúp thu hẹp ownership. Chỉ đổi endpoint configuration khi failure thật sự nằm ở availability, exposure, representation hoặc access chứ không phải underlying runtime state hay telemetry transport.
