- question: "Vì sao env và configprops rất hữu ích trong incident nhưng vẫn không phù hợp để expose rộng dù các value đã được sanitize?"
  answer: >-
    Các endpoint này có thể cho thấy property source nào tồn tại, property name nào có mặt, ConfigurationProperties object có cấu trúc ra sao và đủ deployment context để giải thích configuration problem. Sanitization có thể mask sensitive value và show-values policy có thể giới hạn khi trả original value, nhưng masking không xóa toàn bộ metadata hữu ích khỏi response. Property name, source name, object topology và value không bị nhận diện là sensitive vẫn có thể giúp attacker. Vì vậy sanitization là defense in depth chứ không phải exposure policy hay secret-management system. Hãy hạn chế endpoint bằng exposure, network placement và authorization, rồi bàn giao câu hỏi precedence/binding sang externalized-configuration sau khi Actuator đã cho thấy runtime view.
