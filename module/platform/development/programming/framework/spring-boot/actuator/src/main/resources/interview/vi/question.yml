- question: "Hãy giải thích mental model endpoint ID -> operations -> exposure adapter. Vì sao model này làm generic @Endpoint khác Spring MVC controller dù cả hai đều có thể truy cập qua HTTP?"
  answer: >-
    Endpoint ID là management identity ổn định, operation diễn tả management intent, còn exposure adapter ánh xạ model đó sang HTTP hoặc JMX. Vì vậy generic @Endpoint không bắt đầu từ URL routing hay controller semantics. @ReadOperation, @WriteOperation và @DeleteOperation mô tả capability một lần, sau đó Actuator có thể biểu diễn nó qua management technology được hỗ trợ. Spring MVC controller bắt đầu từ web stack và request/response contract. Khác biệt này quan trọng với portability, testing và ownership: management capability độc lập công nghệ có thể tồn tại qua thay đổi transport mà không phải viết lại thành controller. Experiment learning endpoint chứng minh điều đó bằng cách gọi cùng @Endpoint implementation qua Swagger bridge và qua management route thật /actuator/learning.
  aiGenerated: true
  reviewed: false
