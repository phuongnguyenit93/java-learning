- question: "Khi nào custom management capability nên giữ generic @Endpoint, dùng web/JMX-specific endpoint hoặc extension, và khi nào nên trở thành normal business/controller API?"
  answer: >-
    Bắt đầu từ ai tiêu thụ capability và contract nào thực sự cần. Dùng generic @Endpoint khi operation thật sự mang tính vận hành và ý nghĩa không phụ thuộc HTTP/JMX; điều này giữ portability giữa transport. Dùng @WebEndpoint, @JmxEndpoint hoặc supported endpoint extension khi cùng operational responsibility cần representation riêng của technology hoặc bổ sung built-in endpoint. Dùng normal MVC/WebFlux controller khi requirement thật sự cần đầy đủ web framework request/response semantics, và dùng business API khi domain client cần capability như một phần product contract. Trade-off cốt lõi là ownership và portability chứ không phải annotation nào quen tay. Ép business workflow vào Actuator hoặc giấu HTTP-specific behavior trong generic endpoint sẽ khiến exposure và maintenance khó lý giải.
