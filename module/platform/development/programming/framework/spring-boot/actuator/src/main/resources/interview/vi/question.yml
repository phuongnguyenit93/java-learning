- question: "Vì sao thread dump và heap dump endpoint là công cụ delivery evidence chứ không phải analysis tool, và production risk nào phải quyết định việc expose chúng từ xa?"
  answer: >-
    Actuator có thể capture và cung cấp diagnostic artifact từ process đang chạy nhưng không quyết định blocked thread có bất thường hay không, lock nào gây deadlock, object nào chiếm retained memory lớn nhất hoặc vì sao có GC pressure. Việc diễn giải đó thuộc JVM, concurrency và memory-analysis tooling. Chính endpoint cũng có risk: thread dump lộ code path và synchronization state; heap dump có thể chứa credential, request data, cache và object production khác, còn việc tạo/download dump lớn có thể tăng tải lên service đang gặp sự cố. Vì vậy exposure cần cả phân tích confidentiality lẫn resource impact, với network/authorization hẹp và incident workflow chỉ thu evidence cần thiết.
