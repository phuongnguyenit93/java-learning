- question: "Một custom endpoint cần maintenance toggle. Trước khi expose nó dưới dạng @WriteOperation phải trả lời các câu hỏi thiết kế nào, và learning maintenance experiment chứng minh điều gì?"
  answer: >-
    Trước hết phải xác định action là operational management capability chứ không phải customer workflow. Cần định nghĩa side effect có giới hạn, input tường minh, expectation về idempotency/retry, audience được authorize, nhu cầu audit và chuyện gì xảy ra nếu operation bị gọi nhầm hoặc concurrent. Write-capable management surface xứng đáng policy exposure chặt hơn passive status endpoint. Learning experiment chỉ thay một maintenance boolean có giới hạn qua cùng technology-agnostic endpoint implementation rồi đọc state lại. Nó chứng minh read/write operation có thể thuộc một @Endpoint model và được Actuator mapping. Nó không biện minh cho arbitrary business mutation phía sau Actuator hoặc dùng transport default làm security policy.
