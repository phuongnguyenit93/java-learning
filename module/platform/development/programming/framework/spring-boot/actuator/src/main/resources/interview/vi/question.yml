- question: "Vì sao thêm SecurityFilterChain của riêng application có thể âm thầm thay đổi assumption bảo vệ Actuator, và sau customization đó cần review những gì?"
  answer: >-
    Security auto-configuration có nhận biết Actuator của Boot chỉ áp dụng khi application chưa cung cấp SecurityFilterChain riêng. Khi application security định nghĩa filter chain, Boot back off và team sở hữu matching cùng authorization rule. Vì vậy cần review management path hoặc EndpointRequest matcher nào được cover, endpoint nào được permit/authenticate, management port/network được đặt ở đâu và write/sensitive diagnostic endpoint có policy mạnh hơn basic health hay không. Exposure và authorization vẫn độc lập: secure filter chain không biện minh cho expose mọi endpoint, còn exclude endpoint khỏi HTTP không phải authentication rule. Khi availability đã được xác nhận mà request trả 401/403, hãy theo active Spring Security policy thay vì “sửa” bằng cách mở rộng Actuator exposure.
  aiGenerated: true
  reviewed: false
