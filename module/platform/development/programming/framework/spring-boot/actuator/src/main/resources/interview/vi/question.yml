- question: "Một counter có trong MeterRegistry nhưng operator không tìm thấy history hữu ích trong /actuator/metrics. Hãy giải thích metrics endpoint được thiết kế để trả lời gì và expectation nào thuộc external telemetry infrastructure."
  answer: >-
    Metrics endpoint là góc nhìn chẩn đoán on-demand trên các meter hiện đang có trong MeterRegistry của application. Nó có thể trả lời meter name có tồn tại không, measurement nào đang có và tag nào có thể dùng để thu hẹp việc inspect hiện tại. Nó không phải time-series database, durable history hay cross-instance query engine. Micrometer sở hữu meter model và registry API; Boot auto-configure registry/binder được hỗ trợ; Actuator expose management view để chẩn đoán. Long-term history, aggregation giữa replica, alerting, retention và dashboard thuộc monitoring backend hoặc exporter flow. Experiment learning metric chứng minh phía local bằng cách đăng ký và tăng tagged counter rồi inspect chính meter đó qua Actuator.
  aiGenerated: true
  reviewed: false
  readmeRelated:
