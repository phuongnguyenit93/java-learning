- question: "So sánh /actuator/metrics với Prometheus scrape endpoint. Vì sao cả hai đều liên quan metrics nhưng hướng tới consumer và workflow khác nhau?"
  answer: >-
    Generic metrics endpoint được thiết kế để inspect tương tác các Micrometer meter trong một application đang chạy. Operator có thể khám phá name, measurement, tag dimension và thu hẹp query khi chẩn đoán một instance. Prometheus endpoint là transport cho Prometheus server: với registry phù hợp nó expose telemetry dạng scrape để thu thập vào external time-series system. Cái đầu là management diagnostic; cái sau tham gia export pipeline. Retention, multi-instance query, recording rule, dashboard và alert bắt đầu sau khi telemetry rời application. Dùng /actuator/metrics như polling backend sẽ thiếu storage và system-wide semantics mà observability infrastructure chuyên dụng cung cấp.
