- question: "Vì sao health group liveness và readiness thường không nên chứa cùng các external dependency check? Hãy phân tích failure mode khi shared database outage được đưa vào liveness."
  answer: >-
    Liveness hỏi restart process này có thể giúp hay không; readiness hỏi instance này có nên nhận traffic ngay lúc đó hay không. Nếu shared database outage làm mọi instance báo broken liveness, orchestrator có thể restart cả fleet dù restart process không sửa được database. Điều đó dễ tạo cascading restart storm và làm mất local state hữu ích trong incident. Readiness có thể chứa external dependency khi service thật sự không thể phục vụ traffic hữu ích nếu mất dependency đó, nhưng ngay cả khi đó team phải cân nhắc loại toàn bộ replica khỏi service có tốt hơn degraded behavior hay không. Boot chủ động không đưa arbitrary external indicator vào probe group mặc định. Probe design đúng phải theo failure semantics chứ không theo sự tiện lợi của việc tái sử dụng mọi HealthIndicator ở mọi group.
  aiGenerated: true
