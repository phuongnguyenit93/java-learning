questions:
- question: "Vì sao nên xem Actuator như management projection trên runtime state thay vì owner của state đó? Hãy nêu các ví dụ mà sửa endpoint configuration không sửa được vấn đề gốc."
  answer: >-
    Actuator biến operational state do subsystem khác tạo ra thành management surface nhất quán. Application runtime sở hữu transition liveness/readiness, Boot logging sở hữu LoggingSystem đang chạy, Micrometer sở hữu meter state, còn ApplicationStartup có thể sở hữu startup-step data. Actuator expose hoặc điều khiển các góc nhìn trên những source đó. Phân biệt này định hướng incident response. Nếu /actuator/health/readiness trung thực báo REFUSING_TRAFFIC, sửa health endpoint không giải thích vì sao runtime đổi readiness. Nếu /actuator/loggers báo level kế thừa, source có thể là logging configuration. Nếu /actuator/metrics thiếu meter, câu hỏi đầu tiên là instrumentation có đăng ký meter hay chưa. Xem endpoint là projection giúp đặt cách sửa vào subsystem tạo ra evidence thay vì liên tục thay đổi management surface.
  aiGenerated: true
