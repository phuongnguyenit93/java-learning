- question: "Một Actuator endpoint đã enabled, được include trong web exposure nhưng vẫn trả 403. Vì sao enablement, exposure, network reachability và authorization phải được debug như các layer riêng biệt?"
  answer: >-
    Enablement quyết định capability có tồn tại hay không. Exposure quyết định endpoint enabled có được biểu diễn qua management technology như HTTP hay không. Network routing và management-port placement quyết định client có chạm được surface đó không. Authorization sau đó quyết định caller đã chạm tới surface có được phép invoke hay không. Vì vậy 403 sau khi biết endpoint tồn tại và đã expose hướng điều tra sang active security policy chứ không phải endpoint enablement. Ngược lại, enabling endpoint không sửa được route chưa expose và authentication không làm endpoint chưa expose trở nên reachable. Debug các layer theo thứ tự tránh configuration thrashing và giữ least privilege vì mỗi control vẫn có mục đích riêng.
  aiGenerated: true
