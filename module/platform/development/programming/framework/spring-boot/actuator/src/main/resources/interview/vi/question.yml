    anchor: metrics-endpoint-purpose
  apiRelated:
    controller: ActuatorLearningController
    methodSignature: recordMetric(String)
- question: "Vì sao khả năng filter theo tag của Actuator không làm high-cardinality tag trở nên an toàn? Hãy dùng request ID hoặc user ID làm ví dụ failure."
  answer: >-
    Tag filter như tag=outcome:success chỉ chọn từ các meter identity đã tồn tại; nó không gộp hoặc ngăn các identity đó được tạo. Nếu mỗi request ID hoặc user ID trở thành một tag value, application và backend có thể tạo số lượng time series không giới hạn, làm tăng memory, storage, indexing và query cost. Actuator có thể cho thấy symptom bằng danh sách rất nhiều available tag value, nhưng cách sửa thuộc instrumentation design: chọn dimension có tập giá trị hữu hạn và mang ý nghĩa. Learning counter cố ý giới hạn outcome thành success hoặc failure để experiment chứng minh filtering mà không dạy cardinality pattern nguy hiểm. Diagnostic convenience không thể bù cho metric model không giới hạn.
