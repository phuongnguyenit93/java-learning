- question: "Operator thấy effectiveLevel=INFO và configuredLevel=null cho một logger, rồi tạm thời đặt DEBUG qua Actuator. Các giá trị đó nghĩa là gì và vì sao thay đổi này không nên được xem là durable configuration?"
  answer: >-
    configuredLevel cho biết chính logger đó có runtime setting tường minh hay không. Configured level null nghĩa logger đang kế thừa hành vi từ chuỗi logger cha, cuối cùng có thể tới root logger. effectiveLevel là level đã resolve đang thật sự điều khiển event sau inheritance. Đặt DEBUG qua loggers endpoint tạo explicit runtime configuration cho logger đó nên cả hai value sau đó có thể phản ánh DEBUG. Logger group có thể là target thuận tiện khi đổi level lúc runtime, nhưng không phải nguồn inheritance được biểu diễn bởi configuredLevel=null. Thay đổi này là operational state bên trong LoggingSystem đang chạy, không phải rewrite application configuration. Restart thường dựng lại logging từ configuration source bình thường của Boot và có thể xóa override tạm thời. Trong incident, chỉ target logger hẹp, tính đến I/O tăng và khả năng log sensitive data, rồi restore level sau khi thu đủ evidence.
  aiGenerated: true
