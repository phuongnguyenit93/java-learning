  - question: "A Boot process reaches main and begins SpringApplication bootstrap, but context refresh fails because a required bean dependency cannot be satisfied. How should you reason about the failure before reaching for specialized diagnostics?"
    answer: "Start by locating the failing layer instead of reacting to whichever stack-frame name looks familiar. The JVM already reached main, so this is not an initial Java/process launch failure. Because the ApplicationContext cannot refresh due to bean creation or dependency injection, the first useful classification is a Spring container failure. Follow the earliest meaningful failure message and root cause through the bean-creation or dependency-resolution chain. If the evidence later shows that the bean is missing because a specific auto-configuration did not match or backed off, then hand the question to auto-configuration diagnostics such as condition reasoning. If startup succeeds and the question becomes the operational state of the running service, that is where Actuator becomes appropriate."
    aiGenerated: true
