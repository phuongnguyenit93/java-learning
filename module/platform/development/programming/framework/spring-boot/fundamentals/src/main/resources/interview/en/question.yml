  - question: "Explain the launch path of a typical executable Spring Boot JAR from java -jar to SpringApplication.run. How do manifest Main-Class, Start-Class, and the Boot launcher differ, and where should Fundamentals hand packaging details off?"
    answer: "In a typical executable Boot JAR, java -jar follows the archive manifest Main-Class, which points to a Boot launcher rather than directly to the application's logical main class. The launcher understands the Boot archive layout, establishes access to application classes and nested dependency JARs, reads the configured Start-Class as the application entry class, and invokes that class's main method. The application then follows the same logical bootstrap as before: main calls SpringApplication.run. Packaging therefore changes how the JVM reaches the application and its dependencies; it does not replace the application's logical bootstrap. Fundamentals should keep that mental model and hand detailed bootJar or Maven repackage behavior, loader internals, alternative layouts, layers, reproducible archives, OCI images, and Buildpacks to build-tooling-packaging."
