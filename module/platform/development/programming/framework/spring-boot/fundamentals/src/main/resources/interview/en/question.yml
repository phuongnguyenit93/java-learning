  - question: "A service moved its @SpringBootApplication class from com.example.orders to com.example.orders.web, and components under com.example.orders.service stopped appearing. Explain the diagnosis using both the composition of @SpringBootApplication and the root-package convention. What fixes would you consider?"
    answer: "@SpringBootApplication composes primary Boot configuration, auto-configuration enablement, and component scanning. By default, component scanning begins from the package of the primary configuration class and covers its subpackages. Moving the class down into com.example.orders.web narrows that natural boundary, so the sibling com.example.orders.service package is no longer inside the default scan path. The cleanest fix is usually to place the primary class back in a sensible application root such as com.example.orders. If the package structure is intentionally unusual, an explicit scan base can express that structure, but it should not be used merely to hide a confusing layout. The failure is primarily a component-discovery boundary issue; detailed auto-configuration condition reasoning is a separate concern."
