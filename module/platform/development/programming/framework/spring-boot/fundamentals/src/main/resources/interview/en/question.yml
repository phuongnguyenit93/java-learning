  - question: "Why can DevTools automatic restart be faster than a cold JVM restart, and why might saving a source file still produce no restart? Describe how the two-ClassLoader model also creates a useful failure hypothesis."
    answer: "DevTools separates relatively stable dependency JARs into a base ClassLoader and application classes being actively developed into a restart ClassLoader. When it detects a relevant runtime-classpath update, it can discard and recreate the restart ClassLoader and restart the ApplicationContext while keeping the already populated base loader, which is usually cheaper than restarting the whole JVM process. Saving source code alone is not always a runtime-classpath change: the source must be compiled or copied so updated classes or resources reach a watched classpath directory. The two-loader model can also explain class identity or library-behavior problems. If a library assumes a particular classloader relationship, or a shared module lands in an unexpected loader, behavior can differ under DevTools; if disabling restart removes the symptom, classloader placement becomes a strong next diagnostic direction."
    aiGenerated: true
    reviewed: false
