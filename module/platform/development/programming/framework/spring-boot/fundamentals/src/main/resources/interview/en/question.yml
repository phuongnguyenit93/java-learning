questions:
  - question: "Explain how Spring Boot builds on Spring Framework rather than replacing it. Then describe how convention over configuration changes a team's setup decisions, including when accepting a default, overriding it, or replacing a convention is the right trade-off."
    answer: "Spring Framework still owns the core application mechanisms: ApplicationContext, bean registration and dependency injection, transactions, Spring MVC/WebFlux, and related container semantics. Spring Boot adds bootstrap support, conventions, dependency coordination, auto-configuration integration, development tooling, and executable packaging around those mechanisms. Convention over configuration means starting from a documented default that fits the common case, then overriding only the decision that differs. A supported property or hook is preferable when the requirement is a narrow exception; replacing a convention is justified when the application's architecture truly does not fit the default. The key reasoning is that Boot reduces repeated decisions without taking away explicit control or creating a separate container."
