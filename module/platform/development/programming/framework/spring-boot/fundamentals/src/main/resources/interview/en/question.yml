  - question: "How would you explain the non-web, Servlet, and reactive application shapes to a teammate who thinks every Boot application starts an embedded server? Include the evidence you would inspect if a supposedly non-web service unexpectedly starts one."
    answer: "Boot can create a plain non-web ApplicationContext, a Servlet web ApplicationContext, or a reactive web ApplicationContext. A web server is a consequence of a web runtime shape and matching infrastructure, not the definition of Spring Boot. A non-web process can still use Boot bootstrap, configuration, dependency injection, and other integrations without listening for HTTP. Servlet and reactive shapes use different Spring web stacks and context types, and when both MVC and WebFlux are present Boot normally prefers the Servlet/MVC application type unless the application explicitly chooses otherwise. If a service unexpectedly starts a server, first read startup output for server and context evidence, then inspect the dependency tree and runtime classpath for a web stack that may have changed the available application shape. After that, deeper server-selection and web-runtime rules belong to web-runtime."
