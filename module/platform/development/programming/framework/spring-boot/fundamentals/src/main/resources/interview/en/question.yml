  - question: "Suppose a design review raises these questions: property precedence, why an auto-configuration backed off, exact runner/event timing, TLS and graceful shutdown, production health/metrics, Boot test slices, and executable-image packaging. Show how you would route each concern and explain why ownership routing is part of the Fundamentals mental model."
    answer: "Route property sources, precedence, profiles, binding, and Config Data to externalized-configuration. Route condition matching, back-off, exclusions, and custom auto-configuration to auto-configuration. Route detailed SpringApplication lifecycle, events, runners, availability, logging, and related runtime integration to application-runtime. Route web application detection details, embedded-server configuration, TLS, proxy handling, and graceful shutdown to web-runtime. Route production endpoints, health, metrics integration, and operational diagnostics to actuator. Route Boot test bootstrap and slices to testing. Route Boot build plugins, executable archive mechanics, layers, OCI images, and Buildpacks to build-tooling-packaging. Fundamentals owns this map because its job is to connect the end-to-end Boot model while preventing one introductory module from duplicating the deeper mechanisms owned by its siblings."
