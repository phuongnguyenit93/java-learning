  - question: "Vì sao DevTools automatic restart có thể nhanh hơn cold JVM restart, và vì sao chỉ lưu source file đôi khi vẫn không gây restart? Hãy giải thích thêm cách mô hình hai ClassLoader tạo ra một giả thuyết chẩn đoán hữu ích."
    answer: "DevTools tách các dependency JAR tương đối ổn định vào base ClassLoader và các application class đang được phát triển vào restart ClassLoader. Khi phát hiện cập nhật phù hợp trên runtime classpath, DevTools có thể bỏ restart ClassLoader cũ, tạo loader mới và restart ApplicationContext trong khi giữ base loader đã được nạp, nên thường rẻ hơn restart toàn bộ JVM process. Chỉ lưu source code chưa chắc làm runtime classpath thay đổi; source phải được compile hoặc copy để class/resource mới thực sự tới thư mục classpath đang được theo dõi. Mô hình hai loader cũng giải thích một nhóm lỗi về class identity hoặc hành vi thư viện. Nếu thư viện giả định quan hệ classloader cố định, hoặc một shared module bị nạp vào loader không mong muốn, hành vi có thể khác khi bật DevTools; nếu tắt restart làm triệu chứng biến mất thì vị trí classloader là hướng chẩn đoán mạnh tiếp theo."
