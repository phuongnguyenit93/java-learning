  - question: "Bạn sẽ giải thích các dạng non-web, Servlet và reactive thế nào cho một đồng đội đang nghĩ mọi ứng dụng Boot đều khởi động embedded server? Hãy nêu cả bằng chứng sẽ kiểm tra nếu một dịch vụ dự kiến non-web lại bất ngờ khởi động server."
    answer: "Boot có thể tạo ApplicationContext non-web thông thường, Servlet web ApplicationContext hoặc reactive web ApplicationContext. Web server là hệ quả của web runtime shape cùng hạ tầng phù hợp, không phải định nghĩa của Spring Boot. Tiến trình non-web vẫn có Boot bootstrap, cấu hình, dependency injection và các tích hợp khác nhưng không cần lắng nghe HTTP. Servlet và reactive dùng các Spring web stack cùng context type khác nhau; khi cả MVC và WebFlux cùng có mặt, Boot thường ưu tiên Servlet/MVC application type trừ khi ứng dụng chủ động chọn khác. Nếu dịch vụ bất ngờ khởi động server, trước hết đọc startup output để tìm dấu hiệu về server và context, rồi kiểm tra dependency tree cùng runtime classpath xem web stack nào đã làm thay đổi dạng ứng dụng khả dụng. Sau bước đó, các quy tắc sâu về lựa chọn server và web runtime thuộc web-runtime."
