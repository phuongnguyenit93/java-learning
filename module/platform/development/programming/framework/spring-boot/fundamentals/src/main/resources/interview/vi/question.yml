  - question: "Hãy giải thích luồng khởi chạy của một executable Spring Boot JAR điển hình từ java -jar tới SpringApplication.run. Manifest Main-Class, Start-Class và Boot launcher khác nhau ra sao, và Fundamentals nên bàn giao chi tiết đóng gói ở đâu?"
    answer: "Trong executable Boot JAR điển hình, java -jar đi theo manifest Main-Class, và Main-Class trỏ tới Boot launcher chứ không trực tiếp tới class main logic của ứng dụng. Launcher hiểu layout của Boot archive, thiết lập truy cập tới các class ứng dụng cùng các dependency JAR lồng bên trong, đọc Start-Class đã cấu hình để xác định class điểm vào của ứng dụng rồi gọi main method của class đó. Từ đây ứng dụng quay về luồng bootstrap quen thuộc: main gọi SpringApplication.run. Vì vậy cơ chế đóng gói thay đổi cách JVM tìm tới ứng dụng cùng các dependency, nhưng không thay thế luồng bootstrap logic của ứng dụng. Fundamentals chỉ cần giữ mô hình này; chi tiết bootJar hoặc Maven repackage, nội bộ launcher, layout thay thế, layers, archive có khả năng tái lập, OCI image và Buildpacks thuộc build-tooling-packaging."
