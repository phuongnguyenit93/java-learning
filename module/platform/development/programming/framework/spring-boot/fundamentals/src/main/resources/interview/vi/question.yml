questions:
  - question: "Hãy giải thích Spring Boot xây trên Spring Framework như thế nào thay vì thay thế nó. Sau đó phân tích convention over configuration thay đổi các quyết định thiết lập của một nhóm ra sao, gồm khi nào nên dùng mặc định, ghi đè mặc định hoặc thay hẳn một quy ước."
    answer: "Spring Framework vẫn sở hữu các cơ chế ứng dụng cốt lõi như ApplicationContext, đăng ký bean và dependency injection, transaction, Spring MVC/WebFlux cùng semantics của container. Spring Boot bổ sung bootstrap, quy ước, điều phối dependency, tích hợp auto-configuration, công cụ phục vụ phát triển và cách đóng gói thực thi quanh các cơ chế đó. Convention over configuration nghĩa là bắt đầu bằng mặc định đã được tài liệu hóa cho trường hợp phổ biến rồi chỉ ghi đè đúng quyết định khác với nhu cầu. Khi yêu cầu chỉ là một ngoại lệ hẹp, property hoặc hook được hỗ trợ thường là lựa chọn phù hợp; chỉ nên thay hẳn quy ước khi kiến trúc ứng dụng thực sự không khớp mặc định. Điểm cần giữ là Boot giảm các quyết định lặp lại nhưng vẫn để quyền kiểm soát tường minh và không tạo một container riêng thay Spring Framework."
