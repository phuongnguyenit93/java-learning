  - question: "Hãy so sánh Boot starter, các phiên bản dependency được quản lý, runtime classpath và auto-configuration. Nếu nhóm thêm web starter rồi sau đó ghi đè version của một dependency đang được Boot quản lý, trách nhiệm thay đổi ở từng bước thế nào và nhóm phải kiểm chứng điều gì?"
    answer: "Starter là dependency metadata chọn một tập thư viện theo quy ước cho một khả năng; bản thân starter không đăng ký bean của ứng dụng. Tập managed dependency của Boot cung cấp baseline version đã được điều phối để các thư viện phổ biến có thể di chuyển cùng nhau. Các lựa chọn dependency này định hình runtime classpath, và classpath trở thành bằng chứng về công nghệ cùng dạng ứng dụng đang khả dụng. SpringApplication có thể dùng bằng chứng đó khi chọn application type và context ở mức lớn; auto-configuration đóng góp cấu hình phù hợp bên trong context khi các condition thỏa mãn. Vì vậy thêm web starter làm xuất hiện các class mới và có thể khiến web shape cùng server infrastructure trở nên khả dụng. Ghi đè managed version là quyết định khác: project chủ động rời version đã được Boot tuyển chọn cho dependency đó, nên một phần trách nhiệm tương thích quay lại nhóm. Nhóm cần kiểm tra dependency graph và khả năng tương thích khi chạy thay vì giả định baseline được quản lý vẫn bảo đảm tổ hợp mới."
