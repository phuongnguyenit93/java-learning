  - question: "Một dịch vụ chuyển class @SpringBootApplication từ com.example.orders xuống com.example.orders.web, sau đó component trong com.example.orders.service không còn được phát hiện. Hãy chẩn đoán bằng cả composition của @SpringBootApplication và quy ước root package. Bạn sẽ cân nhắc cách sửa nào?"
    answer: "@SpringBootApplication tổng hợp primary Boot configuration, việc bật auto-configuration và component scanning. Theo mặc định, component scanning bắt đầu từ package của primary configuration class và đi xuống các subpackage. Khi class bị chuyển xuống com.example.orders.web, ranh giới mặc định bị thu hẹp nên package ngang cấp com.example.orders.service nằm ngoài phạm vi scan. Cách sửa sạch nhất thường là đưa primary class trở lại root package hợp lý như com.example.orders. Nếu package layout đặc biệt là chủ ý, có thể khai báo scan base tường minh để diễn đạt cấu trúc đó, nhưng không nên dùng cấu hình scan chỉ để che một layout khó hiểu. Đây trước hết là vấn đề ranh giới component discovery; condition chi tiết của auto-configuration là một mảng khác."
