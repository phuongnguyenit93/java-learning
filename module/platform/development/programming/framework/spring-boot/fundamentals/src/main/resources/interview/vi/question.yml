  - question: "Một nhóm muốn bật Remote DevTools trên bản triển khai vận hành thực tế để lập trình viên có thể làm mới và kiểm tra dịch vụ từ xa. Bạn sẽ đánh giá đề xuất đó thế nào và thiết lập ranh giới công cụ vận hành ra sao?"
    answer: "Không nên dùng Remote DevTools như cơ chế vận hành trong môi trường thực tế. Đây là quy trình phát triển phải bật chủ động, yêu cầu phía ứng dụng từ xa có DevTools cùng remote secret; Boot coi tính năng này nhạy cảm về bảo mật, khuyến nghị mạng tin cậy hoặc SSL cho trường hợp phát triển và nêu rõ không bao giờ nên bật trên bản triển khai vận hành thực tế. Một secret mạnh hay việc chỉ bật trong lúc xử lý sự cố không làm mất ranh giới đó. Với môi trường vận hành, nên dùng công cụ được thiết kế cho dịch vụ đang chạy, chẳng hạn Actuator cho health, tích hợp metrics, loggers và các endpoint quản lý/chẩn đoán, đi kèm các quyết định phơi bày endpoint và bảo mật thông thường của ứng dụng. DevTools nên tiếp tục phục vụ mục tiêu rút ngắn vòng phản hồi khi phát triển."
