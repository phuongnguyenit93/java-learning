  - question: "Hãy mô tả một ứng dụng Boot đi từ JVM main(String[]) tới context đang chạy ở mức tổng quan. Phần giải thích nên dừng ở đâu trước khi trở thành nội dung lifecycle chi tiết của SpringApplication, và vì sao ranh giới đó hữu ích khi chẩn đoán lỗi?"
    answer: "JVM đi vào main method bình thường của ứng dụng, rồi main giao việc bootstrap cho SpringApplication.run(primarySource, args). SpringApplication chuẩn bị environment và thiết lập ứng dụng, xác định dạng ứng dụng ở mức lớn, tạo ApplicationContext phù hợp, nạp các nguồn cấu hình, refresh context để thiết lập bean cùng các tích hợp được quản lý, rồi trả về context đang chạy. Sau đó ứng dụng tiếp tục sống tùy dạng runtime và các công việc non-daemon còn hoạt động; khi JVM shutdown có trật tự, context được đóng. Fundamentals nên dừng ở mô hình start/run/stop cấp cao này. Thứ tự event chính xác, thời điểm runner chạy, availability state, logging integration, task execution và các lifecycle hook khác thuộc application-runtime. Ranh giới này tránh việc dùng sơ đồ tổng quan như hợp đồng runtime chính xác và giúp phân loại lỗi thành trước Boot, trong bootstrap/refresh context hoặc sau khi ứng dụng đã chạy."
