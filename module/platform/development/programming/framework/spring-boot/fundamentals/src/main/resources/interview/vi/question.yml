  - question: "Một tiến trình Boot đã tới main và bắt đầu SpringApplication bootstrap, nhưng context refresh thất bại vì không thỏa mãn một bean dependency bắt buộc. Bạn nên lập luận về lỗi này thế nào trước khi dùng các công cụ chẩn đoán chuyên sâu?"
    answer: "Hãy xác định lớp lỗi trước thay vì bám vào stack frame có tên quen thuộc. JVM đã tới main nên đây không còn là lỗi khởi chạy Java/process ban đầu. Vì ApplicationContext không thể refresh do bean creation hoặc dependency injection, phân loại hữu ích đầu tiên là lỗi Spring container. Từ đó lần theo thông báo lỗi có ý nghĩa xuất hiện sớm nhất và root cause trong chuỗi tạo bean hoặc phân giải dependency. Nếu bằng chứng sau đó cho thấy bean thiếu vì một auto-configuration cụ thể không match hoặc đã back off, lúc đó mới chuyển sang diagnostics của auto-configuration và lập luận condition. Nếu startup đã thành công và câu hỏi trở thành trạng thái vận hành của dịch vụ đang chạy, đó là lúc dùng Actuator."
