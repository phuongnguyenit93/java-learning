  - question: "Trong một buổi rà soát thiết kế xuất hiện các câu hỏi về property precedence, lý do auto-configuration back off, thứ tự chính xác của runner/event, TLS và graceful shutdown, health/metrics trong môi trường vận hành, Boot test slice và cách đóng gói executable image. Hãy chỉ ra module chịu trách nhiệm cho từng nhóm và giải thích vì sao việc điều hướng trách nhiệm thuộc mô hình tư duy của Fundamentals."
    answer: "Đưa property source, precedence, profile, binding và Config Data sang externalized-configuration. Đưa condition matching, back-off, exclusions và custom auto-configuration sang auto-configuration. Đưa vòng đời SpringApplication chi tiết, event, runner, availability, logging cùng tích hợp runtime sang application-runtime. Đưa chi tiết nhận diện web application, cấu hình embedded server, TLS, proxy và graceful shutdown sang web-runtime. Đưa các endpoint vận hành, health, tích hợp metrics và chẩn đoán vận hành sang actuator. Đưa Boot test bootstrap và slices sang testing. Đưa Boot build plugins, cơ chế executable archive, layers, OCI image và Buildpacks sang build-tooling-packaging. Fundamentals chịu trách nhiệm cho bản đồ này vì vai trò của nó là kết nối mô hình Boot từ đầu đến cuối, đồng thời giữ các cơ chế chuyên sâu ở đúng module ngang hàng để tránh lặp lại nội dung học."
