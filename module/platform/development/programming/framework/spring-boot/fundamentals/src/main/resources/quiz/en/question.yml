        explanation: "These features can be useful in Boot applications, but they are not the composition of @SpringBootApplication."
      - id: D
        answer: "@SpringBootConfiguration, @RestController, and @EnableAutoConfiguration, combining primary configuration, HTTP request handling, and automatic configuration."
        explanation: "@RestController is a Spring MVC annotation and is not part of @SpringBootApplication's composition."
