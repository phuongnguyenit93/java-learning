      anchor: "classpath-configuration-conventions"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Classpath, configuration inputs, and auto-configuration are the three peer inputs; existing application beans are produced only after all automatic decisions finish."
        explanation: "Auto-configuration is not another peer input, and existing beans or bean definitions can influence configuration while the context is being built."
      - id: B
        answer: "Classpath and configuration inputs affect SpringApplication, but application beans become relevant only after refresh, when auto-configuration runs as a post-start integration phase."
        explanation: "Auto-configuration is processed as configuration during context preparation and refresh, not as a separate post-refresh phase."
      - id: C
        answer: "Classpath, configuration inputs, and application beans or bean definitions are signals; Boot conventions and auto-configuration react to them during context preparation and refresh."
        explanation: "This is the synthesis model: inputs/signals feed context construction, while auto-configuration is a configuration mechanism applied within that lifecycle."
      - id: D
        answer: "Starters execute first and convert configuration inputs into beans; auto-configuration then supplies the classpath that SpringApplication uses for context selection."
        explanation: "Starters primarily shape dependencies/classpath, and auto-configuration does not construct the classpath for SpringApplication."
    correctAnswerId: C

