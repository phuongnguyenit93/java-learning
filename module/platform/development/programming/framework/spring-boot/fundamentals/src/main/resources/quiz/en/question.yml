  - id: "root-package-component-scan"
    question: "OrdersApplication is moved from com.example.orders to com.example.orders.web. A sibling com.example.orders.service component is no longer discovered. What is the most direct Fundamentals explanation?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.PrimaryConfiguration/PrimaryConfiguration.md"
      anchor: "root-package-boundary"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The move changed Boot's managed dependency versions, so component metadata from the service package is no longer compatible."
        explanation: "Package placement does not change the dependency-management baseline; this symptom is about discovery scope."
      - id: B
        answer: "The web package caused auto-configuration to disable component scanning once a Servlet application type was inferred."
        explanation: "Web application type does not normally disable component scanning; the issue is the default scan boundary."
      - id: C
        answer: "The primary class now establishes a default component-scan boundary that is too deep, leaving the sibling service package outside that search path."
        explanation: "Placing the primary class in a sensible root package lets default component scanning cover the application's subpackages."
      - id: D
        answer: "SpringApplication switches to a non-web context when the primary class is below the project root, so service components are skipped."
        explanation: "Application type is determined by classpath and settings, not by how deep the Java package of the primary class is."
    correctAnswerId: C

  - id: "managed-dependency-version-override"
    question: "A project uses Boot's supported dependency management, then explicitly overrides one managed library version for a required fix. Which interpretation is most accurate?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.StartersAndClasspath/StartersAndClasspath.md"
      anchor: "managed-dependencies"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Treat Boot's managed versions as a coordinated baseline; override for the concrete need, then verify compatibility because that library now differs from the curated combination."
        explanation: "Dependency management supplies a tested baseline rather than an immovable rule. An intentional override shifts some compatibility responsibility back to the application team."
      - id: B
        answer: "Rely on dependency management to converge all transitive libraries onto a compatible set automatically, so the override keeps the same compatibility assurance as the managed baseline."
        explanation: "Version resolution can converge dependencies, but that does not mean an arbitrary override inherits Boot's compatibility guarantee for the curated version set."
      - id: C
        answer: "Assume the override remains inside Boot's curated baseline as long as the project still imports the Boot BOM or uses the Boot build plugin."
        explanation: "The BOM or plugin can provide dependency-management mechanics, but explicitly choosing another version still departs from the curated version for that library."
      - id: D
        answer: "Treat the override as only a build-resolution detail; if dependency resolution and compilation succeed, compatibility responsibility still remains entirely with Boot."
        explanation: "A successful build proves resolution and compilation, not runtime compatibility with the rest of Boot's managed ecosystem."
    correctAnswerId: A

  - id: "classpath-web-type-vs-auto-configuration"
    question: "A previously non-web application adds the usual Servlet web stack. Which sequence most accurately separates SpringApplication from auto-configuration?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.StartersAndClasspath/StartersAndClasspath.md"
      anchor: "classpath-driven-behavior"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The starter adds the web classes and then selects the Servlet ApplicationContext; auto-configuration mainly applies server settings inside that selected context."
        explanation: "The starter shapes the classpath but does not select the context. SpringApplication owns the broad application-type and context choice."
      - id: B
        answer: "Auto-configuration reads the web classpath and selects WebApplicationType first; SpringApplication then creates that context and refreshes the infrastructure it was given."
        explanation: "This reverses the responsibility boundary: SpringApplication determines the broad application type and creates the corresponding context."
      - id: C
        answer: "SpringApplication first creates a generic context and refreshes it; afterward auto-configuration detects the web stack, converts the context to Servlet, and adds the server."
        explanation: "The application type and matching context are chosen before refresh; auto-configuration does not convert a completed generic context after refresh."
      - id: D
        answer: "SpringApplication uses classpath and settings to determine WebApplicationType and create the matching context; auto-configuration contributes matching server infrastructure while that context is built."
        explanation: "This keeps context selection with SpringApplication and conditional infrastructure contribution with auto-configuration during context construction."
    correctAnswerId: D

