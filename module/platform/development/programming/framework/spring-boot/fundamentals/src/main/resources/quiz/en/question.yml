  - id: "startup-failure-layer"
    question: "The JVM reaches main and SpringApplication begins startup, but context refresh fails because a required bean dependency cannot be satisfied. Which failure class should you investigate first?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.StartupObservation/StartupObservation.md"
      anchor: "startup-failure-classes"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Java/process failure, because any startup exception means the JVM failed before Boot could meaningfully begin."
        explanation: "The JVM already reached main and Boot began bootstrap, so this is beyond the initial Java/process failure layer."
      - id: B
        answer: "Operational-state failure, because a missing bean should be diagnosed through production health and metrics after startup."
        explanation: "The context has not successfully refreshed, so this is a startup/container problem rather than a post-start operational-state problem."
      - id: C
        answer: "Spring container failure, following the root cause and earliest meaningful bean-creation or dependency-injection message."
        explanation: "An unsatisfied bean dependency during context refresh is a core container failure; the layer model is a triage aid before deeper diagnosis."
      - id: D
        answer: "Packaging failure, because a dependency-injection problem usually means the executable JAR launcher selected the wrong application class."
        explanation: "The application already reached SpringApplication and context refresh, so launcher entry-point selection is not the direct failure layer."
    correctAnswerId: C

  - id: "devtools-restart-classloader-model"
    question: "Why can DevTools automatic restart be faster than a cold JVM restart, and what event must actually occur for restart detection?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.DevTools/DevTools.md"
      anchor: "restart-classloader-model"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Stable dependency jars stay in the base ClassLoader while changing application classes use the recreated restart ClassLoader; DevTools must detect a relevant runtime-classpath update."
        explanation: "Keeping stable dependencies loaded reduces restart work, and the trigger is a classpath-visible change rather than merely editing a source file."
      - id: B
        answer: "Stable dependency jars stay in the base ClassLoader and application classes use the restart ClassLoader, but saving the source file itself is enough to trigger restart before new class output exists."
        explanation: "The loader placement is right, but a source edit must be compiled or copied so the relevant change reaches a watched runtime classpath directory."
      - id: C
        answer: "Application classes stay in the base ClassLoader while changing dependency jars use the restart ClassLoader; a runtime-classpath update then recreates only the dependency side."
        explanation: "The placement is reversed. Stable dependencies normally use the base loader, while actively developed application classes use the restart loader."
      - id: D
        answer: "The two-loader placement is the same as the normal model, but restart include/exclude rules make a saved source file a restart trigger even when the runtime classpath has not changed."
        explanation: "Include/exclude rules can refine restart scope or classloader placement, but they do not remove the need for the changed content to reach the watched classpath."
    correctAnswerId: A

