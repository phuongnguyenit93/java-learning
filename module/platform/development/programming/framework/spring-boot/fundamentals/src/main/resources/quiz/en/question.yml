      anchor: "springbootapplication-composition"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "@Configuration, @Bean, and @Import, combining bean declaration, factory methods, and explicit configuration imports."
        explanation: "Those are Spring configuration concepts, but they are not the three annotations composed by @SpringBootApplication."
      - id: B
        answer: "@SpringBootConfiguration, @EnableAutoConfiguration, and @ComponentScan, combining primary configuration, Boot auto-configuration enablement, and component discovery."
        explanation: "These are the three composed responsibilities that explain why a small Boot primary class can provide a useful default setup."
      - id: C
