        answer: "Allow Remote DevTools in production when the service is reachable only on a private network and a strong remote secret protects the connection."
        explanation: "Network restriction and a secret reduce exposure, but they do not change Boot's explicit boundary that Remote DevTools must not be enabled on production deployments."
      - id: B
        answer: "Package DevTools in production but disable restart and LiveReload, leaving only the remote channel available for tightly controlled diagnostics."
