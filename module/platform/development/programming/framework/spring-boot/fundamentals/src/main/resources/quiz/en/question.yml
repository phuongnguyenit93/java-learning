  - id: "executable-jar-main-class-start-class"
    question: "For a typical executable Spring Boot JAR, which statement correctly distinguishes the archive launcher entry point from the application's logical entry point?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.FundamentalsSynthesis/FundamentalsSynthesis.md"
      anchor: "common-misconceptions"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The application class is the manifest Main-Class, while Start-Class names the embedded server implementation that Boot should launch."
        explanation: "In the standard executable layout, the Boot launcher is the manifest Main-Class; Start-Class identifies the application's main class."
      - id: B
        answer: "The manifest Main-Class points to a Boot launcher, Start-Class identifies the application class, and the launcher eventually invokes that application's main method."
        explanation: "This separates the archive-level bootstrap from the application's logical main-to-SpringApplication bootstrap."
      - id: C
        answer: "Main-Class and Start-Class both point to the application class, and Boot chooses one only when nested dependency loading fails."
        explanation: "The two attributes serve different roles: launcher versus application entry class, not redundant fallback entries."
      - id: D
        answer: "Executable Boot JARs omit an application entry class because the launcher discovers a @SpringBootApplication class by scanning BOOT-INF/classes."
        explanation: "The launcher uses the configured start class; it does not choose the application's main class by scanning for the annotation."
    correctAnswerId: B

  - id: "classpath-config-beans-vs-auto-configuration"
