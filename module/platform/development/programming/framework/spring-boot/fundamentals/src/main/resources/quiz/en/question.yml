# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: "boot-vs-framework-boundary"
    question: "A teammate says a Spring Boot application runs on a separate container that replaces Spring Framework. Which correction best matches the Fundamentals model?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.SpringBootPurpose/SpringBootPurpose.md"
      anchor: "boot-vs-framework"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Boot replaces ApplicationContext with a Boot-specific container, while Spring Framework is used mainly for annotations and utility APIs."
        explanation: "Boot does not introduce a replacement dependency-injection container. A Boot application normally runs a Spring ApplicationContext."
      - id: B
        answer: "Boot normally runs a Spring ApplicationContext and adds conventions, bootstrap support, dependency coordination, and integrations around Spring mechanisms."
        explanation: "This preserves the ownership boundary: Spring Framework supplies core container/framework mechanisms, while Boot makes common combinations easier to assemble and run."
      - id: C
        answer: "Spring Framework owns only dependency injection, while Boot owns Spring MVC, transactions, and the application container once Boot is on the classpath."
        explanation: "Spring MVC, transactions, and the ApplicationContext remain Spring Framework concerns; Boot integrates and configures them rather than taking ownership of those mechanisms."
      - id: D
        answer: "Boot is primarily an executable-packaging layer, and the runtime container used by the application is unrelated to Spring Framework."
        explanation: "Executable packaging is one Boot capability, but Boot also participates in bootstrap and integration of a normal Spring application."
    correctAnswerId: B

  - id: "convention-over-configuration-decision"
    question: "A team relies on the same Boot default in every environment, but one environment now needs different behavior. Which change best follows convention over configuration without giving up control?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.SpringBootPurpose/SpringBootPurpose.md"
      anchor: "convention-over-configuration"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Keep the Boot default and encode the difference in application logic so every environment continues to share the same Boot configuration."
        explanation: "This preserves one Boot configuration, but it moves a configurable infrastructure difference into application code instead of using the intended control point."
      - id: B
        answer: "Replace the Boot default with one custom infrastructure component used in every environment so all environment-specific behavior is centralized outside the convention."
        explanation: "Centralization can be useful when the convention is inadequate, but replacing it everywhere is unnecessary when the difference is already configurable."
      - id: C
        answer: "Keep the Boot default for the common case, change the differing environment through the supported configuration point, and replace the convention only if that control is insufficient."
        explanation: "This keeps the useful default for the common case while using the supported override boundary for the real exception."
      - id: D
        answer: "Keep application code unchanged and vary the environment's dependency set so Boot infers different behavior from the classpath instead of changing configuration."
        explanation: "Classpath is a real Boot input, but changing capabilities or inferred shape is the wrong lever for behavior that is directly configurable."
    correctAnswerId: C

  - id: "springapplication-main-to-context"
    question: "What is the best high-level interpretation of SpringApplication.run(MyApplication.class, args) in a typical Boot main method?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.ApplicationBootstrap/ApplicationBootstrap.md"
      anchor: "main-to-context"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "It uses the primary source and arguments to prepare an appropriate Spring context, load configuration, refresh it, and return the running ApplicationContext."
        explanation: "That is the Fundamentals bootstrap model: main delegates application startup to SpringApplication, whose result is a real Spring ApplicationContext."
      - id: B
        answer: "It constructs only an instance of MyApplication and returns that object after command-line arguments have been assigned to its fields."
        explanation: "The primary source is configuration/bootstrap input; SpringApplication.run is not simply an object constructor for the application class."
      - id: C
        answer: "It first packages the application's dependencies, then launches an embedded server, and only afterward creates a Spring context if web support is present."
        explanation: "Packaging is a build/delivery concern, and a Boot application can also be non-web. Context bootstrap is not conditional on packaging an embedded server."
      - id: D
        answer: "It replaces the JVM main method with a hidden Boot event loop, and the Spring context is discovered later after that loop is already running."
        explanation: "The ordinary Java main method remains the entry point; it explicitly delegates to SpringApplication to create and start the context."
    correctAnswerId: A

