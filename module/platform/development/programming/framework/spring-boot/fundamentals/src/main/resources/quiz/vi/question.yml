      - id: C
        answer: "Primary class giờ tạo ranh giới component scanning mặc định quá sâu, khiến service package cùng cấp nằm ngoài phạm vi tìm kiếm."
        explanation: "Đặt primary class ở root package hợp lý giúp component scanning mặc định bao phủ các subpackage của ứng dụng."
