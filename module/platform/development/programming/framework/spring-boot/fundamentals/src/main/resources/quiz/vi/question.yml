  - id: "managed-dependency-version-override"
    question: "Một project dùng dependency management được Boot hỗ trợ, sau đó ghi đè tường minh version của một managed library để lấy bản sửa cần thiết. Cách hiểu nào chính xác nhất?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.StartersAndClasspath/StartersAndClasspath.md"
      anchor: "managed-dependencies"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Xem các managed version của Boot là tập phiên bản chuẩn đã được điều phối; ghi đè cho nhu cầu cụ thể rồi kiểm chứng tương thích vì thư viện đó đã khác tổ hợp được tuyển chọn."
        explanation: "Dependency management cung cấp tập phiên bản chuẩn được hỗ trợ chứ không phải luật bất biến. Khi chủ động ghi đè, một phần trách nhiệm tương thích quay lại nhóm ứng dụng."
      - id: B
        answer: "Dựa vào dependency management để mọi transitive dependency tự hội tụ về tổ hợp tương thích, nên version đã ghi đè vẫn có cùng mức bảo đảm như tập phiên bản được quản lý."
        explanation: "Cơ chế phân giải có thể hội tụ version, nhưng điều đó không khiến một lần ghi đè bất kỳ thừa hưởng bảo đảm tương thích của tập version Boot đã tuyển chọn."
      - id: C
        answer: "Xem version đã ghi đè vẫn nằm trong tập phiên bản chuẩn của Boot miễn là dự án còn dùng Boot BOM hoặc Boot build plugin."
        explanation: "BOM hoặc plugin cung cấp cơ chế quản lý dependency, nhưng chọn một version khác vẫn đưa thư viện đó ra ngoài version mà Boot đã tuyển chọn."
      - id: D
        answer: "Xem việc ghi đè chỉ là chi tiết phân giải dependency khi build; nếu dependency được phân giải và code biên dịch thành công thì trách nhiệm tương thích vẫn hoàn toàn thuộc về Boot."
        explanation: "Build thành công chỉ chứng minh dependency được phân giải và code biên dịch, không chứng minh khả năng tương thích khi chạy với phần còn lại của hệ sinh thái Boot."
    correctAnswerId: A

