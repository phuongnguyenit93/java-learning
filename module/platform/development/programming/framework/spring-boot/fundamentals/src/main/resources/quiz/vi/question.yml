  - id: "springbootapplication-composition"
    question: "Phân rã nào giải thích đúng @SpringBootApplication tổng hợp những gì ở mức Fundamentals?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.PrimaryConfiguration/PrimaryConfiguration.md"
      anchor: "springbootapplication-composition"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "@Configuration, @Bean và @Import, kết hợp khai báo cấu hình, factory method và import configuration tường minh."
        explanation: "Đây là các khái niệm cấu hình của Spring, nhưng không phải ba annotation được @SpringBootApplication tổng hợp."
      - id: B
        answer: "@SpringBootConfiguration, @EnableAutoConfiguration và @ComponentScan, kết hợp primary configuration, bật Boot auto-configuration và component discovery."
        explanation: "Đây là ba trách nhiệm được tổng hợp và giải thích vì sao primary class nhỏ vẫn tạo được thiết lập mặc định hữu ích."
      - id: C
        answer: "@EnableScheduling, @ConfigurationPropertiesScan và @ComponentScan, kết hợp scheduling, discovery cho property binding và component discovery."
        explanation: "Các tính năng này có thể xuất hiện trong ứng dụng Boot nhưng không phải composition của @SpringBootApplication."
      - id: D
        answer: "@SpringBootConfiguration, @RestController và @EnableAutoConfiguration, kết hợp primary configuration, HTTP request handling và automatic configuration."
        explanation: "@RestController là annotation của Spring MVC và không nằm trong composition của @SpringBootApplication."
    correctAnswerId: B

  - id: "root-package-component-scan"
    question: "OrdersApplication được chuyển từ com.example.orders xuống com.example.orders.web. Một component ở package cùng cấp com.example.orders.service không còn được phát hiện. Giải thích trực tiếp nhất ở mức Fundamentals là gì?"
