        explanation: "Cách này đảo ngược trách nhiệm: SpringApplication xác định dạng ứng dụng lớn và tạo context tương ứng."
      - id: C
        answer: "SpringApplication tạo một context chung rồi refresh trước; sau đó auto-configuration phát hiện web stack, chuyển context sang Servlet và thêm server."
