questions:
  - id: "boot-vs-framework-boundary"
    question: "Một thành viên trong nhóm nói rằng ứng dụng Spring Boot chạy trên một container riêng thay thế Spring Framework. Cách sửa nào phù hợp nhất với mô hình Fundamentals?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.SpringBootPurpose/SpringBootPurpose.md"
      anchor: "boot-vs-framework"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Boot thay ApplicationContext bằng container riêng của Boot, còn Spring Framework chủ yếu cung cấp annotation và utility API."
        explanation: "Boot không tạo một dependency-injection container thay thế. Ứng dụng Boot thông thường vẫn chạy trên Spring ApplicationContext."
      - id: B
        answer: "Boot thông thường chạy một Spring ApplicationContext và bổ sung quy ước, hỗ trợ bootstrap, điều phối dependency cùng các tích hợp quanh cơ chế của Spring."
        explanation: "Cách hiểu này giữ đúng ranh giới: Spring Framework cung cấp cơ chế container/framework cốt lõi, còn Boot giúp ghép và khởi động các tổ hợp phổ biến dễ hơn."
      - id: C
        answer: "Spring Framework chỉ chịu trách nhiệm dependency injection, còn Boot sở hữu Spring MVC, transaction và application container khi Boot có trên classpath."
        explanation: "Spring MVC, transaction và ApplicationContext vẫn là phần của Spring Framework; Boot tích hợp và cấu hình chúng chứ không chuyển quyền sở hữu các cơ chế đó."
      - id: D
        answer: "Boot chủ yếu là lớp đóng gói executable, còn runtime container của ứng dụng không liên quan tới Spring Framework."
        explanation: "Executable packaging chỉ là một khả năng của Boot; Boot còn tham gia bootstrap và tích hợp một ứng dụng Spring thông thường."
    correctAnswerId: B

  - id: "convention-over-configuration-decision"
    question: "Một nhóm dùng cùng mặc định của Boot ở mọi môi trường, nhưng giờ một môi trường cần hành vi khác. Thay đổi nào tuân theo convention over configuration tốt nhất mà vẫn giữ quyền kiểm soát?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.SpringBootPurpose/SpringBootPurpose.md"
      anchor: "convention-over-configuration"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Giữ mặc định của Boot và đưa khác biệt vào logic ứng dụng để mọi môi trường tiếp tục dùng cùng một cấu hình Boot."
        explanation: "Cách này giữ một cấu hình Boot thống nhất, nhưng lại đẩy khác biệt hạ tầng vốn có thể cấu hình vào code ứng dụng thay vì dùng đúng điểm điều khiển."
      - id: B
        answer: "Thay mặc định của Boot bằng một thành phần hạ tầng tùy chỉnh dùng ở mọi môi trường để tập trung toàn bộ khác biệt môi trường bên ngoài quy ước."
        explanation: "Tập trung như vậy hữu ích khi quy ước không đủ, nhưng thay ở mọi nơi là không cần thiết nếu khác biệt đã có thể cấu hình trực tiếp."
      - id: C
        answer: "Giữ mặc định của Boot cho trường hợp chung, đổi môi trường khác biệt qua điểm cấu hình được hỗ trợ, và chỉ thay quy ước nếu điểm điều khiển đó không đủ."
        explanation: "Cách này giữ mặc định hữu ích cho trường hợp chung đồng thời dùng đúng ranh giới ghi đè được hỗ trợ cho ngoại lệ thực sự."
      - id: D
        answer: "Giữ nguyên code ứng dụng và thay tập dependency theo môi trường để Boot suy ra hành vi khác từ classpath thay vì đổi cấu hình."
        explanation: "Classpath là một đầu vào thực của Boot, nhưng đổi khả năng hoặc dạng được suy ra là sai đòn bẩy cho hành vi có thể cấu hình trực tiếp."
    correctAnswerId: C

  - id: "springapplication-main-to-context"
    question: "Cách hiểu tổng quan nào đúng nhất về SpringApplication.run(MyApplication.class, args) trong main method của một ứng dụng Boot điển hình?"
