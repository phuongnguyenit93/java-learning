    reviewed: false
    readmeRelated:
      file: "2.ApplicationBootstrap/ApplicationBootstrap.md"
      anchor: "main-to-context"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Nó dùng primary source và arguments để chuẩn bị Spring context phù hợp, nạp cấu hình, refresh context rồi trả về ApplicationContext đang chạy."
        explanation: "Đây là mô hình bootstrap của Fundamentals: main bàn giao việc khởi động cho SpringApplication và kết quả là một Spring ApplicationContext thực sự."
      - id: B
        answer: "Nó chỉ tạo một đối tượng MyApplication và trả về đối tượng đó sau khi gán command-line arguments vào các trường."
        explanation: "Primary source là đầu vào cấu hình/bootstrap; SpringApplication.run không chỉ là thao tác gọi constructor cho lớp ứng dụng."
      - id: C
        answer: "Nó đóng gói dependencies trước, sau đó khởi động embedded server rồi mới tạo Spring context nếu có hỗ trợ web."
        explanation: "Đóng gói là mảng build và bàn giao, còn ứng dụng Boot có thể là non-web. Context bootstrap không phụ thuộc vào việc đóng gói embedded server."
      - id: D
        answer: "Nó thay JVM main method bằng một event loop ẩn của Boot, rồi Spring context mới được phát hiện sau khi loop đã chạy."
        explanation: "Java main method thông thường vẫn là điểm vào; chính main gọi SpringApplication để tạo và khởi động context."
    correctAnswerId: A

