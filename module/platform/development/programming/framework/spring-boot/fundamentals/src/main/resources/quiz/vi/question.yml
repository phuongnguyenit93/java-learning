        answer: "Việc di chuyển làm thay đổi managed dependency versions nên component metadata của service package không còn tương thích."
        explanation: "Vị trí package không thay tập phiên bản dependency được quản lý; triệu chứng này liên quan phạm vi phát hiện component."
      - id: B
        answer: "Web package khiến auto-configuration tắt component scanning sau khi suy ra Servlet application type."
