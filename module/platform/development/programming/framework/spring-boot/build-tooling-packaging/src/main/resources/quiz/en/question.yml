      anchor: "artifact-strategy"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "An executable JAR, because Boot applications should never rely on an external servlet container."
        explanation: "Executable JAR is the common standalone default, but WAR remains valid when an external servlet-container contract is intentional."
      - id: B
        answer: "A WAR, because the target platform explicitly supplies and manages the servlet container."
        explanation: "Correct. The artifact format should match the target environment's execution contract."
      - id: C
        answer: "An OCI image, because every production Boot deployment must be container-based."
