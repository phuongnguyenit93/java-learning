# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: build-tooling-quiz-01
    question: "A team says the Spring Boot Gradle plugin should fix a repository-authentication failure because it owns the Boot build. Which reasoning is correct?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Purpose/Purpose.md"
      anchor: "build-tooling-purpose"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The Boot plugin owns repository access whenever a Boot task consumes dependencies."
        explanation: "Repository declaration, authentication, and dependency resolution remain responsibilities of the underlying build tool."
      - id: B
        answer: "Gradle still owns repository access; the Boot plugin adds Boot-aware run, package, and image operations on top."
        explanation: "Correct. Boot integrates application-specific behavior with Gradle without replacing Gradle's project and dependency-resolution model."
      - id: C
        answer: "Repository access becomes a SpringApplication runtime concern once the Boot plugin is applied."
        explanation: "Repository access happens while resolving build inputs, before SpringApplication runtime behavior begins."
      - id: D
        answer: "The Boot plugin owns repository access only when the application will later be packaged as an executable JAR."
        explanation: "Packaging format does not transfer generic repository and dependency-resolution ownership from Gradle to Boot."
    correctAnswerId: B

  - id: build-tooling-quiz-02
    question: "A project imports spring-boot-dependencies but never declares a database driver directly or transitively. What should the learner expect?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.DependencyManagement/DependencyManagement.md"
      anchor: "spring-boot-dependencies"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The driver is present because every artifact listed in the BOM becomes a managed runtime dependency."
        explanation: "A BOM manages versions; it does not automatically add every dependency listed in its dependency-management data."
      - id: B
        answer: "The driver is present when the Boot plugin is applied because the plugin turns managed entries into dependencies."
        explanation: "Applying the Boot plugin changes build integration, but a BOM still does not declare all managed libraries as application dependencies."
      - id: C
        answer: "The driver is absent unless declared or pulled transitively; the BOM only supplies its managed version."
        explanation: "Correct. Dependency declaration and version management are separate concerns."
      - id: D
        answer: "The driver is resolved for version selection but omitted at runtime because managed artifacts are build-time only."
        explanation: "Importing the BOM does not require downloading each managed artifact merely to establish the managed version set."
    correctAnswerId: C

  - id: build-tooling-quiz-03
    question: "A Gradle build already compiles classes and resolves runtime dependencies correctly. What does applying the Spring Boot plugin add at this boundary?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.BuildPlugins/BuildPlugins.md"
      anchor: "plugin-responsibilities"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Boot-aware tasks such as bootRun, bootJar, and bootBuildImage that consume the build outputs Gradle already produces."
        explanation: "Correct. The Boot plugin adds Boot-specific run, package, and image operations on top of Gradle's normal build model."
      - id: B
        answer: "A second build engine that replaces Gradle's compilation, dependency resolution, and task graph for Boot projects."
        explanation: "The Boot plugin integrates with Gradle; it does not replace Gradle's project, compilation, or dependency-resolution model."
      - id: C
        answer: "Automatic declarations for every Boot-managed dependency so the project no longer has to choose its application libraries."
        explanation: "Boot tooling can align versions, but the application still declares the dependencies it actually uses."
      - id: D
        answer: "Runtime ownership of SpringApplication events and bean lifecycle so those behaviors execute as Gradle task semantics."
        explanation: "The plugin can launch the application, but SpringApplication runtime semantics remain runtime concerns."
    correctAnswerId: A

  - id: build-tooling-quiz-04
    question: "A Gradle team moves from io.spring.dependency-management to Gradle's native platform support. Which expectation should change?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.DependencyManagement/DependencyManagement.md"
      anchor: "gradle-dependency-alignment"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Managed dependencies now appear automatically because native platforms also declare the libraries they constrain."
        explanation: "Neither supported alignment path turns the BOM into a dependency bundle."
      - id: B
        answer: "Executable packaging now follows the platform because its constraints become metadata stored inside BOOT-INF."
        explanation: "Dependency alignment affects selected versions; it does not redefine the executable archive layout."
      - id: C
        answer: "Version conflict resolution now follows the imported platform alone because it replaces Gradle's normal resolution rules."
        explanation: "Native platform support participates in Gradle's own resolution model rather than replacing it."
      - id: D
        answer: "Managed-version overrides now use Gradle's constraint/platform model instead of dependency-management plugin properties."
        explanation: "Correct. The Boot baseline is similar, but the mechanism used to express and override constraints differs."
    correctAnswerId: D

  - id: build-tooling-quiz-05
    question: "Why might a team run both bootRun during development and java -jar on the packaged artifact before release?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.BootRun/BootRun.md"
      anchor: "build-tool-run-vs-packaged-run"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "bootRun executes the packaged JAR, while java -jar executes compiled classes from the source-set classpath."
        explanation: "The relationship is reversed: bootRun launches from build outputs/classpath, while java -jar exercises the packaged archive."
      - id: B
        answer: "bootRun launches the development classpath, while java -jar validates the executable archive produced for handoff."
        explanation: "Correct. The two launches validate different stages of the delivery path."
      - id: C
        answer: "bootRun follows SpringApplication lifecycle, while java -jar starts through Boot Loader without SpringApplication."
        explanation: "Both paths ultimately start the Boot application lifecycle; the difference is mainly how the launch inputs are prepared."
      - id: D
        answer: "bootRun uses only compile dependencies, while java -jar is needed to verify the full runtime dependency graph."
        explanation: "The choice is about validating the packaged artifact, not about enabling or disabling dependency management."
    correctAnswerId: B

  - id: build-tooling-quiz-06
    question: "An executable Spring Boot JAR contains application classes and dependency JARs without flattening all dependency classes together. Which layout is expected?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.ExecutableArchives/ExecutableArchives.md"
      anchor: "boot-archive-layout"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Application classes and all dependency classes are merged under the archive root."
        explanation: "That describes a flattened uber-JAR style rather than Boot's nested executable archive layout."
      - id: B
        answer: "Application classes are under META-INF/classes and dependency JARs remain beside the archive on disk."
        explanation: "Boot executable JARs package both application content and nested dependencies inside the archive."
      - id: C
        answer: "Application classes are under BOOT-INF/classes and dependency JARs are nested under BOOT-INF/lib."
        explanation: "Correct. This separation is a core part of the executable JAR layout handled by Spring Boot Loader."
      - id: D
        answer: "Application classes are under WEB-INF/classes and dependency JARs are always under WEB-INF/lib."
        explanation: "WEB-INF is associated with WAR layout; executable JARs use BOOT-INF."
    correctAnswerId: C

  - id: build-tooling-quiz-07
    question: "Why does an executable Boot JAR need Spring Boot Loader instead of relying only on the JVM's ordinary classpath handling?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.ExecutableArchives/ExecutableArchives.md"
      anchor: "spring-boot-loader-purpose"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "It launches application classes while making nested dependency JARs in the Boot archive available to the application."
        explanation: "Correct. The loader understands Boot's executable archive structure and nested dependencies."
      - id: B
        answer: "It recompiles application classes at startup so they match the JDK inside the deployment environment."
        explanation: "Boot Loader is a launch/class-loading mechanism; it does not recompile the application."
      - id: C
        answer: "It resolves missing Maven or Gradle dependencies from remote repositories when the process starts."
        explanation: "Dependency resolution belongs to the build; the packaged executable archive should already contain the required runtime dependencies."
      - id: D
        answer: "It converts the executable JAR into an OCI filesystem before invoking the application's main class."
        explanation: "OCI image creation is a separate build concern; Boot Loader launches the archive as a JVM application."
    correctAnswerId: A

  - id: build-tooling-quiz-08
    question: "A service changes application classes frequently but upgrades external dependencies rarely. Which layer order best supports cache reuse?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.LayeredArchives/LayeredArchives.md"
      anchor: "layer-order-and-cache"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Place application content before stable dependencies so every rebuild starts from the newest files."
        explanation: "Putting volatile application content first tends to invalidate later cached layers more often."
      - id: B
        answer: "Combine dependencies and application classes into one layer so the cache has only one decision to make."
        explanation: "Combining stable and volatile content removes the reuse benefit that layering is intended to create."
      - id: C
        answer: "Order layers alphabetically because cache reuse depends on layer names rather than change frequency."
        explanation: "Useful layer ordering is based on content stability and invalidation behavior, not alphabetical naming."
      - id: D
        answer: "Place less frequently changing dependency/loader content before the more frequently changing application content."
        explanation: "Correct. Stable earlier layers are more likely to remain reusable when application code changes."
    correctAnswerId: D

  - id: build-tooling-quiz-09
    question: "Two builds use the same source and dependency versions, yet their JAR checksums differ because file timestamps vary. Which concern is most directly involved?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.ReproducibleBuilds/ReproducibleBuilds.md"
      anchor: "archive-order-and-timestamps"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Runtime reproducibility, because SpringApplication normalizes archive timestamps before loading classes."
        explanation: "Runtime lifecycle does not rewrite archive metadata to make separate builds byte-for-byte stable."
      - id: B
        answer: "Archive reproducibility, because entry timestamps and ordering can change bytes even when logical inputs match."
        explanation: "Correct. Archive metadata such as timestamps and entry order directly affects reproducibility."
      - id: C
        answer: "Dependency reproducibility, because the Boot BOM must align timestamps as well as managed library versions."
        explanation: "The BOM governs compatible dependency versions, not timestamps of archive entries."
      - id: D
        answer: "Image reproducibility, because Buildpacks decide which checksum is stored in the Boot JAR manifest."
        explanation: "A JAR can be built and compared without Buildpacks; reproducible archive settings are the relevant boundary."
    correctAnswerId: B

