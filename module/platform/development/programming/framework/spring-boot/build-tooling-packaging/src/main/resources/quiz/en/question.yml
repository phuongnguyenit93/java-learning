      anchor: "build-failure-classification"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Treat it primarily as an application runtime failure because the JAR contains the same application code."
        explanation: "The JAR already launches successfully, so runtime bootstrapping is not the first unresolved boundary."
      - id: B
        answer: "Treat it primarily as dependency-management failure because every image build starts by invalidating the Boot BOM."
        explanation: "A successful JAR build is evidence that dependency resolution and packaging have already crossed important earlier boundaries."
      - id: C
        answer: "Investigate Buildpacks, builder/container-engine, and image configuration because executable packaging already succeeded."
