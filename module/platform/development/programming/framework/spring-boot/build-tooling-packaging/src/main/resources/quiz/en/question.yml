  - id: build-tooling-quiz-11
    question: "The application compiles and bootJar succeeds, but bootBuildImage fails before producing an image because no container engine can be reached. Where should investigation start?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "10.OciImages/OciImages.md"
      anchor: "image-builder-connection"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Check the Docker daemon or supported Docker-compatible connection used by the image-building task."
        explanation: "Correct. A successful JAR build followed by connection failure points to the image builder/container-engine boundary."
      - id: B
        answer: "Check SpringApplication event ordering because the runtime lifecycle must initialize the image builder."
        explanation: "bootBuildImage is a build-time operation and does not depend on SpringApplication starting first."
      - id: C
        answer: "Check BOOT-INF class loading because Boot Loader opens the Docker socket from inside the executable archive."
        explanation: "Boot Loader handles archive launch; it is not the component that connects the build task to a container engine."
      - id: D
        answer: "Check Maven or Gradle repository authentication first because image creation always re-resolves the project's source dependencies."
