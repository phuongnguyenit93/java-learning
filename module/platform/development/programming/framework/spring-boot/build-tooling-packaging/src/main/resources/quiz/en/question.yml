  - id: build-tooling-quiz-12
    question: "A platform team wants one centrally maintained Java image path for many services, while an exceptional service needs custom OS packages and filesystem steps. Which choice matches those ownership needs?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "11.DockerBuildStrategy/DockerBuildStrategy.md"
      anchor: "dockerfile-vs-buildpacks"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Use one shared Dockerfile template for the common path, and fork that template only for the exceptional service."
        explanation: "A shared template reduces duplication, but each repository still owns Dockerfile mechanics instead of using one centrally managed application-to-image lifecycle."
      - id: B
        answer: "Use centrally managed Buildpacks for every service, and customize the builder to absorb the exceptional OS-package requirements."
        explanation: "Buildpacks are customizable, but a service that needs explicit low-level filesystem and image-construction steps can justify a Dockerfile boundary."
      - id: C
        answer: "Standardize on executable JARs, then let each deployment platform choose its own container recipe for each service."
        explanation: "That keeps a common application artifact, but it disperses image-construction ownership instead of providing the centrally maintained image path requested here."
      - id: D
        answer: "Prefer centrally managed Buildpacks for the common path, and use a Dockerfile where explicit image-level control is actually required."
        explanation: "Correct. This aligns standardization with central ownership while preserving explicit control for exceptional image requirements."
    correctAnswerId: D

  - id: build-tooling-quiz-13
    question: "A company deploys applications into an externally managed servlet container that is part of its platform contract. Which artifact is the most direct fit?"
    aiGenerated: true
