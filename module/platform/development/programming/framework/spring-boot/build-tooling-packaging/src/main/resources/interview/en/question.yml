  - question: "A project produces both a plain JAR and a Spring Boot executable JAR. Why are these not interchangeable artifacts, and what design or publishing problems can appear if the distinction is left ambiguous?"
    answer: "A plain library JAR is designed to be placed on another application's classpath, while a Boot executable archive is an application delivery unit with application classes, nested runtime dependencies, and launcher metadata for java -jar. Using an executable Boot archive as if it were a normal library can confuse consumers because its dependency layout is optimized for launching, not for ordinary classpath reuse. Conversely, publishing both outputs under ambiguous naming can make CI, repositories, or downstream consumers select the wrong artifact. The build should make ownership explicit: decide which output is the runnable application, which output is a reusable library if one is needed, and configure classifiers or publication coordinates so the distinction remains visible. This is especially important in multi-purpose projects where application delivery and library publication are separate contracts."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.BootJarBootWar/BootJarBootWar.md"
      anchor: "executable-vs-plain-archive"
