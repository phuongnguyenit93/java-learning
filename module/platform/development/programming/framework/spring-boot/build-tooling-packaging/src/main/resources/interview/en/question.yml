  - question: "Two CI runs use the same source revision and dependency versions, but their Boot JAR hashes differ. Why is 'same source' insufficient to claim reproducibility, and what investigation path would you use before declaring the packaging non-reproducible?"
    answer: "Reproducibility depends on the complete build input graph, not only the Git revision. Archive entry ordering, timestamps, generated resources, build-info or Git metadata, toolchain versions, plugin configuration, dependency artifacts, locale or time-zone sensitive steps, and other filesystem inputs can all change bytes without a source-code edit. Start by confirming the same declared inputs and toolchain, then compare archive entry lists, dependency versions, manifest data, timestamps, and generated resources before comparing final hashes. Boot archive tasks can participate in deterministic ordering and timestamp control, but they cannot make nondeterministic generated inputs reproducible automatically. The project must define whether it requires logical equivalence or byte-for-byte identity and validate the whole pipeline against that contract."
    aiGenerated: true
    reviewed: false
    readmeRelated:
