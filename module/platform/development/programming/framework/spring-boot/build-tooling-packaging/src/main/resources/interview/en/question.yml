questions:
  - question: "A teammate says that once the Spring Boot Gradle or Maven plugin is applied, Spring Boot now owns compilation, repositories, dependency resolution, and every other build concern. How would you correct that mental model, and how would it change the way you debug a failed build?"
    answer: "Gradle or Maven remains the build engine: it owns the project model, compilation, repository access, dependency resolution, task or lifecycle execution, and generic build behavior. Spring Boot integrates with that engine and adds Boot-aware operations such as development launch, executable packaging, and OCI image creation. The practical diagnostic rule is to ask whether the same failure could occur in a non-Boot Java build. Repository authentication, compiler setup, or a broken dependency graph should first be investigated at the build-tool layer, while failures involving bootJar, repackage, BOOT-INF, or bootBuildImage point more directly to Boot integration. This boundary prevents the Boot plugin from becoming a catch-all explanation for failures that originate in the underlying build system."
    aiGenerated: true
    reviewed: false
    readmeRelated:
