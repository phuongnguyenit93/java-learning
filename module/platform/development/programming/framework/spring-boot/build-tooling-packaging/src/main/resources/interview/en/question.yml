  - question: "A team overrides a dependency version managed by Spring Boot because of a security fix. Explain what responsibility the team takes on, how the override mechanism differs between dependency-management approaches, and what evidence you would require before keeping the override."
    answer: "Boot's managed versions are a tested compatibility baseline, so overriding one means the project accepts responsibility for validating the new combination. The team should confirm why the deviation is necessary, whether related libraries must move together, whether Boot or auto-configuration assumptions still hold, and whether integration tests cover the affected path. With io.spring.dependency-management, a managed family may often be customized through the dependency-management model and its version properties; with Gradle native platform support, the project should use Gradle's constraints or resolution mechanisms instead. The team should also document when the override can be removed, because a temporary security exception can otherwise become permanent maintenance debt. A successful resolution alone is not enough evidence; runtime and integration compatibility still need verification."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.DependencyManagement/DependencyManagement.md"
      anchor: "managed-version-override"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: "Why can bootRun or spring-boot:run succeed while the artifact that will be released is still broken? Walk through the different evidence each launch path provides and give one concrete pitfall that only the packaged run may reveal."
    answer: "A build-tool run launches from compiled output plus the development runtime classpath, so success proves that the application can start from the build model currently assembled by Gradle or Maven. It does not prove that the final archive has the correct manifest, main-class metadata, nested dependency layout, or Boot Loader configuration. Building the executable artifact and launching the exact JAR with java -jar exercises that second boundary. A concrete pitfall is a development-only dependency that is available to bootRun but intentionally excluded from the production archive; the local development launch can work while the packaged application fails because it never contained that component. Release validation should therefore treat the packaged artifact as a separate test subject."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.BootRun/BootRun.md"
      anchor: "build-tool-run-vs-packaged-run"
