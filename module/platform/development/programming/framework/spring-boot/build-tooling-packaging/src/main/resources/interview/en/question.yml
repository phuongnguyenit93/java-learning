  - question: "An executable Boot JAR fails before SpringApplication starts because one of its packaged classes cannot be found. Explain why Spring Boot Loader is part of the diagnosis, how nested JARs change normal java -jar behavior, and where you would draw the boundary before investigating Spring beans."
    answer: "The JVM's ordinary java -jar behavior does not automatically turn arbitrary JARs nested inside another JAR into the application's normal classpath. Spring Boot Loader understands Boot's executable archive layout, builds the effective classpath from BOOT-INF or the corresponding packaged locations, and then invokes the configured application main class. If the launcher cannot find a packaged class or nested dependency, inspect the manifest, archive layout, nested libraries, classpath metadata, and loader configuration first. SpringApplication and the ApplicationContext have not yet started, so bean creation or auto-configuration diagnostics are premature. The useful checkpoint is whether the Boot launcher successfully reached the application's Start-Class; only failures after that handoff belong to the application bootstrap layer."
    aiGenerated: true
    reviewed: false
    readmeRelated:
