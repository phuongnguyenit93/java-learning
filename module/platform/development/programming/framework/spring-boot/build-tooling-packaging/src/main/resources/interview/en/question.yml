  - question: "bootJar succeeds in CI, but bootBuildImage cannot produce an image. Explain why that does not point first to SpringApplication, and show how you would separate container-engine, builder-network, and registry failures during diagnosis."
    answer: "A successful bootJar already proves that dependency resolution, compilation, and executable packaging reached a later boundary than ordinary source build failures. bootBuildImage adds a new prerequisite: the Boot plugin must reach a supported container engine so the builder and lifecycle can run. From there separate three connections rather than treating them as one network problem: the build tool must reach the Docker daemon or compatible engine, the builder container may need outbound access to dependency sources, and the image task may need registry access for pull or publish operations. Evidence from each connection should guide the next step because a proxy or credential fix for one path may not affect the others. SpringApplication startup is not the first suspect because the application process has not yet been launched."
    aiGenerated: true
    reviewed: false
    readmeRelated:
