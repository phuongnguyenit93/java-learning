  - question: "During a Buildpacks image build, detection fails before any application process is launched. How would you explain the roles of the builder, buildpacks, and run image, and how would the ordered lifecycle help you avoid debugging the wrong subsystem?"
    answer: "The builder image provides the build environment, lifecycle, and available buildpacks; individual buildpacks detect application needs and contribute build or runtime layers; the run image supplies the base runtime filesystem for the final application image. The lifecycle is intentionally ordered: analyze prior state, detect applicable buildpacks, restore reusable layers, build the application and runtime layers, then export the OCI image. A detection failure means the workflow has not reached application runtime at all, so changing SpringApplication properties is unlikely to help. Instead inspect the selected builder, available buildpacks, application input, and detection logs. If the failure occurs later during export or publication, shift the investigation toward daemon, registry, credentials, or image-output concerns rather than treating every Buildpacks failure as the same problem."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.Buildpacks/Buildpacks.md"
      anchor: "buildpack-lifecycle-boundary"
    apiRelated:
