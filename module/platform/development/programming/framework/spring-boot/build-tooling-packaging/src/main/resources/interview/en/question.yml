  - question: "How would you choose between Buildpacks and a Dockerfile for a platform with many Spring Boot services? Discuss control, standardization, security updates, and the organizational ownership implied by each choice."
    answer: "Buildpacks fit well when the organization wants a standardized application-to-image path, shared Java conventions, centrally managed builders or run images, and less per-service image recipe maintenance. A Dockerfile is a better fit when a service genuinely needs explicit low-level control over base-image policy, filesystem steps, OS packages, or process composition. The trade-off is also organizational: updating a managed builder can roll a security or JDK change across many services, while Dockerfile-per-service models often require each repository to update and rebuild its own pinned base. A custom builder or buildpack can sometimes satisfy an organization-wide requirement without forcing every application to own a Dockerfile. Choose based on who should own image policy and maintenance over time, not simply on which syntax the team already knows."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "11.DockerBuildStrategy/DockerBuildStrategy.md"
      anchor: "control-standardization-maintenance"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: "A release pipeline can build and launch an executable JAR, then builds an OCI image successfully, but production later runs the wrong image digest. How would you classify the failure using the latest successful boundary, and what handoff design would make this class of incident easier to diagnose?"
    answer: "The successful JAR proves the application can be packaged and launched, and the successful OCI build proves the image-construction boundary also completed. If production runs a different digest, the remaining failure is in artifact promotion, registry/tag handling, or deployment selection rather than Boot packaging or SpringApplication startup. The build should record the immutable JAR checksum or image digest it produced, and deployment should promote that exact unit instead of rebuilding or relying only on a mutable tag such as latest. During an incident, compare the digest produced by CI with the digest stored, promoted, and finally pulled by the runtime. Using the latest successful boundary plus immutable artifact identity turns the investigation into a chain of verifiable handoffs rather than guesses across the whole delivery pipeline."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "12.DeploymentHandoff/DeploymentHandoff.md"
      anchor: "build-failure-classification"
    apiRelated:
