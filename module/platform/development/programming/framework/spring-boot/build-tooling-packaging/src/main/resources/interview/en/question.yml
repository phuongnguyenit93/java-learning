  - question: "A team enables Spring Boot layered archives but their container builds still invalidate almost every layer after a small code change. Explain why archive layering alone does not guarantee cache reuse and how you would decide whether custom layers are justified."
    answer: "Boot's layer metadata groups archive content by expected change frequency, but downstream image tooling must actually preserve and consume those boundaries for the cache to benefit. If a Dockerfile copies the entire executable JAR as one opaque file into a single image layer, a logically layered archive still produces poor image-layer reuse. The first check is therefore whether the image build extracts or otherwise maps Boot's logical groups into reusable image layers. Custom layering is justified only when the default assumptions do not match observed change patterns, such as large internal modules that change at different rates from application code. Add custom rules after measuring cache behavior, keep the layer order complete, and avoid creating fine-grained layers that merely mirror source packages without a delivery benefit."
    aiGenerated: true
    reviewed: false
    readmeRelated:
