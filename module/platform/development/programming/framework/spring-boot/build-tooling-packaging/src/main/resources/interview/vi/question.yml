  - question: "Hai lần chạy CI dùng cùng source revision và cùng dependency version nhưng hash của Boot JAR khác nhau. Vì sao 'cùng source' chưa đủ để khẳng định reproducibility, và bạn sẽ điều tra theo hướng nào trước khi kết luận packaging không reproducible?"
    answer: "Reproducibility phụ thuộc vào toàn bộ build input graph chứ không chỉ Git revision. Archive entry order, timestamp, generated resource, build-info hoặc Git metadata, toolchain version, plugin configuration, dependency artifact, locale hoặc time-zone sensitive step và các filesystem input khác đều có thể làm byte thay đổi dù source code không đổi. Trước hết hãy xác nhận cùng declared input và toolchain, sau đó so sánh archive entry list, dependency version, manifest data, timestamp và generated resource trước khi so final hash. Boot archive task có thể tham gia vào deterministic ordering và timestamp control, nhưng không thể tự làm cho generated input không xác định trở nên reproducible. Project phải định nghĩa rõ contract là logical equivalence hay byte-for-byte identity rồi kiểm chứng toàn bộ pipeline theo contract đó."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.ReproducibleBuilds/ReproducibleBuilds.md"
      anchor: "reproducibility-expectation"
    apiRelated:
      controller: ""
