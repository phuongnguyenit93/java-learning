  - question: "Trong một Buildpacks image build, bước detection thất bại trước khi bất kỳ application process nào được chạy. Bạn sẽ giải thích vai trò của builder, buildpack và run image thế nào, và lifecycle có thứ tự giúp tránh debug sai subsystem ra sao?"
    answer: "Builder image cung cấp build environment, lifecycle và các buildpack khả dụng; từng buildpack phát hiện nhu cầu của ứng dụng rồi đóng góp build/runtime layer; run image cung cấp base runtime filesystem cho final application image. Lifecycle có thứ tự rõ ràng: analyze prior state, detect buildpack phù hợp, restore reusable layer, build application cùng runtime layer rồi export OCI image. Detection failure nghĩa là workflow chưa hề tới application runtime, nên thay SpringApplication property hầu như không giúp gì. Thay vào đó hãy kiểm tra builder đã chọn, tập buildpack khả dụng, application input và detection log. Nếu lỗi xảy ra muộn hơn ở export hoặc publication, hãy chuyển điều tra sang daemon, registry, credential hoặc image-output concern thay vì coi mọi Buildpacks failure là cùng một loại."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.Buildpacks/Buildpacks.md"
      anchor: "buildpack-lifecycle-boundary"
    apiRelated:
