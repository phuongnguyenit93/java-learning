  - question: "Bạn sẽ chọn Buildpacks hay Dockerfile cho một platform có nhiều Spring Boot service như thế nào? Hãy phân tích control, standardization, security update và ownership của tổ chức mà mỗi lựa chọn kéo theo."
    answer: "Buildpacks phù hợp khi tổ chức muốn một application-to-image path chuẩn hóa, Java convention dùng chung, builder hoặc run image được quản lý tập trung và giảm maintenance recipe theo từng service. Dockerfile phù hợp hơn khi một service thực sự cần low-level control rõ ràng đối với base-image policy, filesystem step, OS package hoặc process composition. Trade-off cũng mang tính tổ chức: cập nhật managed builder có thể đưa một security hoặc JDK change tới nhiều service, còn mô hình Dockerfile-per-service thường yêu cầu từng repository cập nhật base image đã pin và rebuild riêng. Custom builder hoặc buildpack đôi khi có thể đáp ứng yêu cầu chung của tổ chức mà không bắt mọi application sở hữu Dockerfile. Hãy chọn dựa trên ai nên sở hữu image policy và maintenance lâu dài, thay vì chỉ dựa trên cú pháp mà nhóm đã quen."
