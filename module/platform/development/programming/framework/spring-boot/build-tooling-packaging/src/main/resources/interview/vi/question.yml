  - question: "Một nhóm ghi đè version của dependency đang được Spring Boot quản lý để vá lỗ hổng bảo mật. Hãy giải thích trách nhiệm mà nhóm nhận thêm, cơ chế override khác nhau giữa các hướng dependency management ra sao, và bạn cần bằng chứng gì trước khi giữ override đó."
    answer: "Các managed version của Boot là một compatibility baseline đã được kiểm thử, nên khi override một version thì project nhận trách nhiệm xác minh tổ hợp mới. Nhóm cần chứng minh vì sao deviation là cần thiết, các library liên quan có phải nâng đồng bộ hay không, các giả định của Boot hoặc auto-configuration còn đúng hay không, và integration test có bao phủ đường đi bị ảnh hưởng hay không. Với io.spring.dependency-management, một dependency family thường có thể được tùy biến thông qua model dependency-management và version property của nó; với Gradle native platform support, project nên dùng constraint hoặc resolution mechanism của chính Gradle. Nhóm cũng nên ghi rõ điều kiện loại bỏ override, vì một ngoại lệ tạm thời cho security có thể âm thầm trở thành maintenance debt lâu dài. Việc dependency resolve thành công chưa đủ; vẫn cần kiểm chứng compatibility ở runtime và integration."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.DependencyManagement/DependencyManagement.md"
      anchor: "managed-version-override"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: "Vì sao bootRun hoặc spring-boot:run có thể chạy thành công trong khi artifact chuẩn bị release vẫn bị hỏng? Hãy mô tả bằng chứng mà mỗi cách chạy cung cấp và nêu một pitfall cụ thể chỉ có thể lộ ra khi chạy artifact đã đóng gói."
    answer: "Build-tool run khởi động từ compiled output cùng development runtime classpath, nên thành công chỉ chứng minh ứng dụng có thể chạy từ build model hiện tại do Gradle hoặc Maven lắp ráp. Nó không chứng minh final archive có manifest đúng, main-class metadata đúng, nested dependency layout đúng hoặc Boot Loader configuration đúng. Việc build executable artifact rồi chạy chính JAR đó bằng java -jar sẽ kiểm tra boundary thứ hai này. Một pitfall cụ thể là development-only dependency có mặt trong bootRun nhưng bị loại khỏi production archive theo chủ đích; local development launch vẫn có thể chạy trong khi packaged application thất bại vì component đó không hề được đóng gói. Vì vậy release validation nên xem packaged artifact là một test subject riêng."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.BootRun/BootRun.md"
      anchor: "build-tool-run-vs-packaged-run"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: "Một project tạo cả plain JAR và Spring Boot executable JAR. Vì sao hai artifact này không thể thay thế lẫn nhau, và vấn đề thiết kế hoặc publishing nào có thể xuất hiện nếu ranh giới giữa chúng bị để mơ hồ?"
    answer: "Plain library JAR được thiết kế để nằm trên classpath của một ứng dụng khác, còn Boot executable archive là application delivery unit có application class, nested runtime dependency và launcher metadata để chạy bằng java -jar. Dùng executable Boot archive như một library thông thường có thể làm consumer khó hiểu vì dependency layout của nó tối ưu cho launch chứ không phải classpath reuse. Ngược lại, publish cả hai output dưới tên hoặc classifier mơ hồ có thể khiến CI, repository hoặc downstream consumer chọn nhầm artifact. Build nên thể hiện ownership rõ ràng: output nào là runnable application, output nào là reusable library nếu thực sự cần, rồi cấu hình classifier hoặc publication coordinate để ranh giới luôn nhìn thấy được. Điều này đặc biệt quan trọng với multi-purpose project nơi application delivery và library publication là hai contract riêng."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.BootJarBootWar/BootJarBootWar.md"
      anchor: "executable-vs-plain-archive"
    apiRelated:
      controller: ""
