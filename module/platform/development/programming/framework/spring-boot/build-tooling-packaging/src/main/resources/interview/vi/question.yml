questions:
  - question: "Một đồng đội cho rằng chỉ cần áp dụng Spring Boot Gradle hoặc Maven plugin thì Spring Boot sẽ sở hữu luôn compilation, repository, dependency resolution và mọi vấn đề build khác. Bạn sẽ sửa mental model đó thế nào, và nó thay đổi cách chẩn đoán một build bị lỗi ra sao?"
    answer: "Gradle hoặc Maven vẫn là build engine: chúng sở hữu project model, compilation, truy cập repository, dependency resolution, task hoặc lifecycle execution và các hành vi build tổng quát. Spring Boot tích hợp vào build engine đó rồi bổ sung các thao tác hiểu Boot như chạy ứng dụng khi phát triển, đóng gói executable archive và tạo OCI image. Quy tắc chẩn đoán thực tế là hỏi xem lỗi tương tự có thể xảy ra trong một Java project không dùng Boot hay không. Repository authentication, compiler setup hoặc dependency graph bị hỏng nên được điều tra trước ở lớp build tool; còn lỗi liên quan bootJar, repackage, BOOT-INF hoặc bootBuildImage thì hướng mạnh hơn tới Boot integration. Ranh giới này ngăn việc biến Boot plugin thành lời giải thích chung cho những lỗi thực sự phát sinh từ build system bên dưới."
    aiGenerated: true
