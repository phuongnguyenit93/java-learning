  - question: "Release pipeline build và chạy executable JAR thành công, sau đó tạo OCI image cũng thành công, nhưng production lại chạy sai image digest. Bạn sẽ phân loại lỗi bằng boundary thành công gần nhất thế nào, và thiết kế handoff nào giúp loại incident này dễ chẩn đoán hơn?"
    answer: "JAR thành công chứng minh ứng dụng có thể được đóng gói và launch, còn OCI build thành công chứng minh image-construction boundary cũng đã hoàn tất. Nếu production chạy digest khác, failure còn lại nằm ở artifact promotion, registry/tag handling hoặc deployment selection chứ không phải Boot packaging hay SpringApplication startup. Build nên ghi lại immutable JAR checksum hoặc image digest mà nó tạo ra, và deployment nên promote đúng unit đó thay vì rebuild hoặc chỉ dựa vào mutable tag như latest. Khi có incident, hãy so digest do CI tạo với digest được lưu, promote và cuối cùng được runtime pull. Dùng boundary thành công gần nhất cùng immutable artifact identity biến việc điều tra thành chuỗi handoff có thể kiểm chứng thay vì phỏng đoán trên toàn delivery pipeline."
