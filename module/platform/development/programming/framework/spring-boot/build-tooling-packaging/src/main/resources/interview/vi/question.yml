  - question: "bootJar chạy thành công trong CI nhưng bootBuildImage không tạo được image. Hãy giải thích vì sao điều đó không trỏ trước hết tới SpringApplication, và bạn sẽ tách container-engine, builder-network và registry failure khi chẩn đoán như thế nào."
    answer: "bootJar thành công đã chứng minh dependency resolution, compilation và executable packaging đi qua một boundary muộn hơn các lỗi source build thông thường. bootBuildImage bổ sung một prerequisite mới: Boot plugin phải kết nối được tới container engine được hỗ trợ để builder và lifecycle có thể chạy. Từ đó hãy tách ba connection thay vì coi là một network problem: build tool phải tới được Docker daemon hoặc compatible engine, builder container có thể cần outbound access tới nguồn dependency, và image task có thể cần registry access để pull hoặc publish. Bằng chứng của từng connection nên quyết định bước tiếp theo vì proxy hoặc credential fix cho một đường có thể hoàn toàn không tác động tới đường khác. SpringApplication startup không phải nghi phạm đầu tiên vì application process còn chưa được launch."
