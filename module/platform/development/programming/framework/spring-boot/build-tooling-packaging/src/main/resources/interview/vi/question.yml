  - question: "Một nhóm đã bật Spring Boot layered archive nhưng container build vẫn invalidate gần như mọi layer sau một thay đổi code nhỏ. Vì sao archive layering tự nó không bảo đảm cache reuse, và bạn sẽ quyết định khi nào custom layer thực sự đáng làm thế nào?"
    answer: "Layer metadata của Boot nhóm nội dung archive theo tần suất thay đổi dự kiến, nhưng downstream image tooling phải thực sự giữ và tiêu thụ các boundary đó thì cache mới được lợi. Nếu Dockerfile copy toàn bộ executable JAR như một file opaque vào một image layer duy nhất, archive dù được chia logical layer vẫn cho khả năng image-layer reuse rất kém. Vì vậy bước kiểm tra đầu tiên là image build có extract hoặc ánh xạ các logical group của Boot thành reusable image layer hay không. Chỉ nên custom layering khi giả định mặc định không khớp với pattern thay đổi đã quan sát, chẳng hạn các internal module lớn thay đổi với nhịp khác application code. Hãy thêm custom rule sau khi đo cache behavior, giữ layer order đầy đủ và tránh tạo quá nhiều layer chỉ để phản chiếu source package mà không đem lại lợi ích delivery."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.LayeredArchives/LayeredArchives.md"
      anchor: "layer-order-and-cache"
    apiRelated:
      controller: ""
