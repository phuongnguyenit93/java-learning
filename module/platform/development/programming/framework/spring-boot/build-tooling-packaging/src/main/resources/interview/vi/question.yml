  - question: "Một executable Boot JAR lỗi trước khi SpringApplication bắt đầu vì không tìm thấy một packaged class. Hãy giải thích vì sao Spring Boot Loader nằm trong hướng chẩn đoán, nested JAR thay đổi hành vi java -jar thông thường ra sao, và nên dừng ở ranh giới nào trước khi điều tra Spring bean."
    answer: "Hành vi java -jar thông thường của JVM không tự động biến các JAR lồng bên trong một JAR khác thành application classpath. Spring Boot Loader hiểu executable archive layout của Boot, dựng effective classpath từ BOOT-INF hoặc các vị trí đóng gói tương ứng rồi mới gọi application main class đã cấu hình. Nếu launcher không tìm thấy packaged class hoặc nested dependency, trước hết hãy kiểm tra manifest, archive layout, nested library, classpath metadata và loader configuration. SpringApplication cùng ApplicationContext chưa bắt đầu, nên bean creation hoặc auto-configuration diagnostics còn quá sớm. Checkpoint hữu ích là Boot launcher đã gọi được Start-Class của ứng dụng hay chưa; chỉ các lỗi sau handoff đó mới thuộc lớp application bootstrap."
    aiGenerated: true
    reviewed: false
