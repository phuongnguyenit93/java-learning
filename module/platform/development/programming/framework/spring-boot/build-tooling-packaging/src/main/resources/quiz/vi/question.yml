        explanation: "Cả hai cuối cùng đều khởi động lifecycle của Boot application; khác biệt chính nằm ở cách chuẩn bị launch input."
      - id: D
        answer: "bootRun chỉ dùng compile dependency, còn java -jar cần để xác minh đầy đủ runtime dependency graph."
