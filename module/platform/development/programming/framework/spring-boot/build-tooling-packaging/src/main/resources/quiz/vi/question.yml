        explanation: "Đúng. Khai báo dependency và quản lý version là hai mối quan tâm khác nhau."
      - id: D
        answer: "Driver được resolve để chọn version nhưng bị loại lúc runtime vì managed artifact chỉ phục vụ build-time."
