        explanation: "Quan hệ ngược lại: bootRun chạy từ build output/classpath, còn java -jar thực sự chạy packaged archive."
      - id: B
        answer: "bootRun chạy development classpath, còn java -jar xác minh executable archive được tạo để bàn giao."
