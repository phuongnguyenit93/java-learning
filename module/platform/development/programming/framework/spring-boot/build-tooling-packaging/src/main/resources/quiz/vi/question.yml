questions:
  - id: build-tooling-quiz-01
    question: "Một team cho rằng Spring Boot Gradle plugin phải sửa được lỗi xác thực repository vì plugin này sở hữu build của Boot. Cách suy luận nào đúng?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Purpose/Purpose.md"
      anchor: "build-tooling-purpose"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Boot plugin sở hữu truy cập repository mỗi khi một Boot task dùng dependency."
        explanation: "Khai báo repository, xác thực và dependency resolution vẫn thuộc trách nhiệm của build tool nền."
      - id: B
        answer: "Gradle vẫn sở hữu truy cập repository; Boot plugin bổ sung các thao tác run, package và image dành riêng cho Boot."
        explanation: "Đúng. Boot tích hợp hành vi riêng của ứng dụng vào Gradle mà không thay thế project model hay dependency resolution của Gradle."
      - id: C
        answer: "Truy cập repository trở thành trách nhiệm runtime của SpringApplication ngay khi Boot plugin được apply."
        explanation: "Repository được dùng khi resolve build input, trước khi hành vi runtime của SpringApplication bắt đầu."
      - id: D
        answer: "Boot plugin chỉ sở hữu truy cập repository khi ứng dụng sau đó được đóng gói thành executable JAR."
        explanation: "Định dạng package không chuyển quyền sở hữu repository và dependency resolution từ Gradle sang Boot."
    correctAnswerId: B

  - id: build-tooling-quiz-02
    question: "Một project import spring-boot-dependencies nhưng không khai báo database driver trực tiếp hay gián tiếp. Learner nên kỳ vọng điều gì?"
