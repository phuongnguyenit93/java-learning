      anchor: "plugin-responsibilities"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Các Boot-aware task như bootRun, bootJar và bootBuildImage tiêu thụ chính build output mà Gradle đã tạo."
        explanation: "Đúng. Boot plugin bổ sung thao tác run, package và image riêng của Boot trên mô hình build bình thường của Gradle."
      - id: B
        answer: "Một build engine thứ hai thay thế compilation, dependency resolution và task graph của Gradle cho project Boot."
        explanation: "Boot plugin tích hợp với Gradle; nó không thay mô hình project, compilation hay dependency resolution của Gradle."
      - id: C
        answer: "Khai báo tự động mọi dependency do Boot quản lý để project không còn phải chọn library mà ứng dụng sử dụng."
        explanation: "Boot tooling có thể align version, nhưng ứng dụng vẫn khai báo các dependency mà nó thực sự dùng."
      - id: D
        answer: "Quyền sở hữu runtime đối với SpringApplication event và bean lifecycle để các behavior đó trở thành Gradle task semantics."
        explanation: "Plugin có thể launch ứng dụng, nhưng semantics runtime của SpringApplication vẫn thuộc runtime."
    correctAnswerId: A

  - id: build-tooling-quiz-04
    question: "Một team Gradle chuyển từ io.spring.dependency-management sang native platform support của Gradle. Kỳ vọng nào cần thay đổi?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
