  - id: build-tooling-quiz-06
    question: "Một executable Spring Boot JAR giữ application classes và dependency JAR riêng thay vì flatten toàn bộ class dependency. Layout nào được kỳ vọng?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.ExecutableArchives/ExecutableArchives.md"
      anchor: "boot-archive-layout"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Application classes và toàn bộ dependency classes được merge ở archive root."
        explanation: "Đó là kiểu flattened uber-JAR chứ không phải nested executable archive layout của Boot."
      - id: B
        answer: "Application classes nằm ở META-INF/classes còn dependency JAR nằm ngoài archive trên filesystem."
        explanation: "Executable JAR của Boot đóng gói cả application content và nested dependencies bên trong archive."
      - id: C
        answer: "Application classes nằm ở BOOT-INF/classes và dependency JAR được lồng dưới BOOT-INF/lib."
        explanation: "Đúng. Sự phân tách này là phần cốt lõi của executable JAR layout được Spring Boot Loader xử lý."
      - id: D
        answer: "Application classes nằm ở WEB-INF/classes và dependency JAR luôn nằm ở WEB-INF/lib."
        explanation: "WEB-INF gắn với WAR layout; executable JAR sử dụng BOOT-INF."
    correctAnswerId: C

  - id: build-tooling-quiz-07
    question: "Vì sao executable Boot JAR cần Spring Boot Loader thay vì chỉ dựa vào cơ chế classpath thông thường của JVM?"
