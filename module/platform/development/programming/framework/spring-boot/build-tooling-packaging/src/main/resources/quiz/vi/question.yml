    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Nó launch application classes đồng thời làm cho nested dependency JAR trong Boot archive khả dụng cho ứng dụng."
        explanation: "Đúng. Loader hiểu cấu trúc executable archive của Boot và các dependency được lồng bên trong."
      - id: B
        answer: "Nó compile lại application classes lúc startup để khớp với JDK của môi trường deployment."
        explanation: "Boot Loader là cơ chế launch/class loading; nó không compile lại ứng dụng."
      - id: C
        answer: "Nó resolve Maven hoặc Gradle dependency còn thiếu từ remote repository khi process bắt đầu."
        explanation: "Dependency resolution thuộc build; executable archive đã package phải chứa các runtime dependency cần thiết."
      - id: D
        answer: "Nó chuyển executable JAR thành OCI filesystem trước khi gọi main class của ứng dụng."
        explanation: "Tạo OCI image là build concern riêng; Boot Loader launch archive như một JVM application."
    correctAnswerId: A

  - id: build-tooling-quiz-08
    question: "Một service thay application classes thường xuyên nhưng hiếm khi nâng cấp external dependency. Thứ tự layer nào hỗ trợ cache reuse tốt nhất?"
