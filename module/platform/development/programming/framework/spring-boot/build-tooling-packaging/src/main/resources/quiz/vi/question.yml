      methodSignature: ""
    answers:
      - id: A
        answer: "Driver sẽ có mặt vì mọi artifact được liệt kê trong BOM đều trở thành managed runtime dependency."
        explanation: "BOM quản lý version; nó không tự động thêm mọi dependency có trong dữ liệu dependency management."
      - id: B
        answer: "Driver sẽ có mặt khi Boot plugin được apply vì plugin biến managed entry thành dependency thực tế."
