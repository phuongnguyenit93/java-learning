      anchor: "gradle-dependency-alignment"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Managed dependency giờ tự xuất hiện vì native platform cũng khai báo các library mà nó đặt constraint."
        explanation: "Không có cách alignment nào biến BOM thành một bundle dependency."
      - id: B
        answer: "Executable packaging giờ đi theo platform vì các constraint của nó trở thành metadata nằm trong BOOT-INF."
        explanation: "Dependency alignment ảnh hưởng version được chọn; nó không định nghĩa lại layout của executable archive."
      - id: C
        answer: "Version conflict resolution giờ chỉ theo imported platform vì platform thay thế resolution rules bình thường của Gradle."
        explanation: "Native platform support tham gia vào chính resolution model của Gradle thay vì thay thế nó."
      - id: D
        answer: "Managed-version override giờ dùng constraint/platform model của Gradle thay vì property của dependency-management plugin."
        explanation: "Đúng. Boot baseline tương tự, nhưng cơ chế biểu diễn và override constraint đã thay đổi."
    correctAnswerId: D

  - id: build-tooling-quiz-05
    question: "Vì sao một team có thể dùng bootRun khi phát triển nhưng vẫn chạy java -jar trên artifact đã package trước khi release?"
