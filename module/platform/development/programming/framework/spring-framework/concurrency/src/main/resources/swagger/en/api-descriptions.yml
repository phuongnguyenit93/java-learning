  asyncVoidException():
    summary: Observe exceptions from void @Async methods
    description: Invoke a void @Async method that intentionally throws and observe
      AsyncUncaughtExceptionHandler receiving the failure through a correlation id.
      The response proves the method-body failure path; the controller also terminates
      its probe if submission itself fails, while the dedicated saturation experiment
      demonstrates rejection deterministically.
