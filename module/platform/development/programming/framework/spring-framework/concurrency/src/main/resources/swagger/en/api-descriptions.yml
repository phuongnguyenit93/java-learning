TaskSchedulerExperimentController:
  executionModels():
    summary: Compare Spring scheduler execution models
    description: Run bounded fixed-rate scenarios through ThreadPoolTaskScheduler
      and SimpleAsyncTaskScheduler. The response shows that one pooled periodic registration
      stays serialized while SimpleAsyncTaskScheduler can overlap fixed-rate firings,
      then confirms that its fixed-delay task runs on the scheduler thread itself.
