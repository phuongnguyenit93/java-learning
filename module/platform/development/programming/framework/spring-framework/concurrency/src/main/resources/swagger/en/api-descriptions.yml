  saturation():
    summary: Observe ThreadPoolTaskExecutor saturation and rejection
    description: Create an isolated ThreadPoolTaskExecutor with core=1, max=2, and
      one queue slot. The first task occupies the core worker, the second fills the
      queue, the third grows the pool to max, and the fourth is rejected. The response
      exposes the pool/queue state that proves each admission transition.
