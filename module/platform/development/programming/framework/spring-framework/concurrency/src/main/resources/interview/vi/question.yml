  - question: >-
      Hãy giải thích core pool size, queue capacity, max pool size và rejection tương tác thế nào trong ThreadPoolTaskExecutor, và vì sao queue quá lớn có thể làm maxPoolSize ít được dùng hơn dự đoán.
    answer: >-
      Với queue capacity dương, công việc trước hết dùng core workers; khi các worker này bận, task mới được đưa vào queue. Pool chỉ tăng vượt core size khi queue không nhận thêm được nữa, và rejection chỉ xảy ra sau khi cả queue lẫn max worker đều đã cạn capacity. Vì vậy queue rất lớn có thể hấp thụ công việc trong thời gian dài khiến pool gần như chỉ giữ ở core size, đổi worker growth lấy queueing latency. Việc sizing phải dựa trên workload và downstream capacity thay vì chọn các con số độc lập.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Spring_Task_Executor/SpringExecutor.md"
      anchor: "spring-executor-config"
    apiRelated:
      controller: "TaskExecutorController"
      methodSignature: "saturation()"

  - question: >-
      So sánh ThreadPoolTaskScheduler và SimpleAsyncTaskScheduler cho fixed-rate và fixed-delay. Vì sao khác biệt này quan trọng khi phân tích khả năng chạy chồng lấn?
    answer: >-
      ThreadPoolTaskScheduler chạy task body trên scheduler pool và các lần kế tiếp của cùng một fixed-rate hoặc fixed-delay registration được tuần tự hóa theo periodic-task contract bên dưới dù pool có nhiều thread. SimpleAsyncTaskScheduler dùng một scheduling thread và thông thường bàn giao fixed-rate hoặc trigger-based firing sang execution thread riêng nên các task body có thể overlap. Fixed-delay là ngoại lệ có chủ ý: body chạy ngay trên scheduler thread để giữ delay-after-completion semantics. Vì vậy timing policy tự nó chưa quyết định concurrency; phải xét execution model của scheduler cụ thể.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.TaskScheduler/TaskScheduler.md"
      anchor: "scheduler-execution-models"
    apiRelated:
      controller: "TaskSchedulerExperimentController"
      methodSignature: "executionModels()"

  - question: >-
      Một maintenance job chạy trong process có thể có nhiều khai báo @Scheduled lặp lại và ứng dụng cũng có thể chạy trên nhiều instance. @Scheduled không cung cấp bảo đảm concurrency nào, và bạn sẽ thiết kế để xử lý điều đó ra sao?
    answer: >-
      @Scheduled không phải distributed lock hay bảo đảm single-flight tổng quát. Các khai báo schedule khác nhau trên cùng method được đăng ký độc lập, nhiều bean instance có thể tạo thêm registration, và các process ứng dụng khác nhau không biết trạng thái scheduler trong process của nhau. Ngay cả khi một scheduler implementation tuần tự hóa các lần chạy kế tiếp của cùng một registration, điều đó vẫn không bảo vệ logical job trước các nguồn concurrency còn lại. Nếu overlap không an toàn, hãy làm job idempotent và chọn cơ chế coordination đúng phạm vi: serialize cục bộ, application-level locking hoặc distributed scheduling/locking khi có nhiều process tham gia.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.Scheduling/Scheduling.md"
      anchor: "scheduled-overlap"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      SimpleAsyncTaskExecutor dùng virtual thread cùng concurrency limit. Vì sao không nên reasoning limit này như pool size, queue capacity hay rejection threshold?
    answer: >-
      SimpleAsyncTaskExecutor theo mô hình thread-per-task chứ không phải worker pool. Trong baseline Spring 6.1, concurrency limit dương là throttle: khi số task active chạm limit, thread submit sẽ chờ cho tới khi có slot được trả lại. Vì vậy lời gọi qua @Async proxy có thể tự block ngay ở bước submit khi throttle đã bão hòa. Setting này không tạo buffering queue và cũng không reject chỉ vì limit dương đang đầy. Limit bằng 0 lại có nghĩa khác: không cho concurrent execution và execution sẽ fail thay vì chờ. Cơ chế này bảo vệ downstream capacity nhưng không tương đương mô hình core/max/queue admission của ThreadPoolTaskExecutor.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.VirtualThreadIntegration/VirtualThreadIntegration.md"
      anchor: "virtual-thread-concurrency-limits"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Hãy phân biệt submission rejection, failure của @Async có Future, failure của void @Async và scheduled-task failure. Vì sao phân biệt này quan trọng trong vận hành?
    answer: >-
      Submission rejection xảy ra trước khi business code bắt đầu và có thể fail đồng bộ ngay tại executor boundary. @Async trả Future hoặc CompletableFuture ghi nhận execution failure trong completion handle để caller quan sát khi get, join hoặc compose. void @Async không có completion handle trả về nên uncaught method-body failure đi qua AsyncUncaughtExceptionHandler. Scheduled failure thuộc scheduler/error-handler semantics và recurring schedule cần quyết định retry/idempotency riêng. Vận hành phải biết failure nằm ở boundary nào vì retry task chưa từng chạy khác hoàn toàn với retry business logic có thể đã tạo side effect.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.LifecycleFailureProduction/LifecycleFailureProduction.md"
      anchor: "failure-boundaries"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Bạn sẽ thiết kế shutdown cho Spring-managed executor thế nào để "graceful shutdown" không trở thành một bảo đảm sai?
    answer: >-
      Trước hết phải chọn work-completion policy: task đang chạy và queued task sẽ được phép hoàn tất hay bị interrupt/clear. Sau đó mới chọn container sẽ chờ termination bao lâu. Đây là hai control khác nhau; hết await timeout không tự động là hard task-kill deadline. Chính sách executor còn phải khớp với termination window thật của deployment và lifetime của resource mà task còn cần, như database hoặc network client. Submission mới trong lúc shutdown cũng là một rejection/lifecycle concern riêng. Graceful shutdown chỉ đáng tin khi các boundary này được căn chỉnh với nhau.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.LifecycleFailureProduction/LifecycleFailureProduction.md"
