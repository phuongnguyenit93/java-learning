questions:
  - question: >-
      Luồng truyền context đúng qua Executor hoặc Spring TaskDecorator nên diễn ra như thế nào?
    answer: >-
      Mô hình cần nhớ là capture context tại submission boundary, cài lại context đó trên worker trước khi task chạy, rồi cleanup hoặc khôi phục trạng thái trước đó của worker trong finally. Spring TaskDecorator là nơi phù hợp để đóng gói pattern này cho ThreadPoolTaskExecutor, ví dụ với correlation id, MDC hoặc RequestAttributes. Việc truyền context không kéo dài vòng đời của HTTP request, nên khi có thể chỉ nên capture các giá trị bất biến thực sự cần thiết thay vì giữ request object quá lâu.
    aiGenerated: true
