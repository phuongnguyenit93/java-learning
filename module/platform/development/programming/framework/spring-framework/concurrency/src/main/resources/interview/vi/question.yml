  - question: >-
      Một team cho rằng TaskExecutor, @Async và TaskScheduler/@Scheduled chỉ là các cách khác nhau để "thêm thread". Bạn sẽ tách ba concern này như thế nào?
    answer: >-
      Task execution trả lời công việc đã sẵn sàng ngay bây giờ sẽ được thực thi theo chiến lược nào, nên TaskExecutor chọn execution strategy. @Async là ranh giới của lời gọi method: interceptor của Spring biến lời gọi bean phù hợp thành công việc chạy qua executor và làm thay đổi control flow, cách quan sát lỗi cùng thread/context boundary. Scheduling đưa thời gian vào mô hình: TaskScheduler hoặc @Scheduled quyết định khi nào công việc đủ điều kiện chạy. Trong cả ba trường hợp, Spring không thay thế ngữ nghĩa Java Concurrency mà tích hợp execution policy với bean, cấu hình, proxy, lifecycle và ApplicationContext. Tách rõ các concern này giúp tránh tuning sai thành phần.
    aiGenerated: true
    reviewed: false
    readmeRelated:
