  - id: spring-executor-saturation-order
    question: "Một `ThreadPoolTaskExecutor` có `corePoolSize=1`, `maxPoolSize=2`, `queueCapacity=1` và `AbortPolicy`. Task 1 vẫn đang chạy khi task 2, 3 và 4 lần lượt được submit. Chuỗi admission nào khớp với thí nghiệm của module?"
    answers:
      - id: A
        answer: "Task 2 mở worker thứ hai, task 3 vào queue và task 4 bị reject."
        explanation: "Sai. Với queue capacity dương, task 2 được queue trước khi pool tăng vượt core size."
      - id: B
        answer: "Task 2 vào queue, task 3 bị reject và pool vẫn chỉ có một worker."
        explanation: "Sai. Khi queue đầy, executor còn có thể tăng số worker từ core tới max trước khi reject."
      - id: C
        answer: "Task 2 và task 3 cùng vào queue, sau đó task 4 mới làm pool tăng lên hai worker."
        explanation: "Sai. Queue chỉ có một slot nên task 3 không thể tiếp tục được buffer ở đó."
      - id: D
        answer: "Task 2 vào queue, task 3 làm pool tăng lên hai worker và task 4 bị reject."
        explanation: "Đúng. Đây là chuỗi core → queue → grow-to-max → reject được Step 5 chứng minh một cách xác định."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Spring_Task_Executor/SpringExecutor.md"
      anchor: "spring-executor-config"
    apiRelated:
      controller: "TaskExecutorController"
      methodSignature: "saturation()"

  - id: spring-threadpool-scheduler-fixed-rate
    question: "Một fixed-rate registration chạy mỗi 20 ms trên `ThreadPoolTaskScheduler` có pool size 2, nhưng mỗi lần chạy mất khoảng 80 ms. Điều gì nên xảy ra với chính registration đó?"
    answers:
      - id: A
        answer: "Các lần chạy kế tiếp vẫn được serialize; chúng có thể chạy trễ dù scheduler còn thread khác."
        explanation: "Đúng. Contract periodic task của JDK không cho các lần kế tiếp của cùng registration overlap."
      - id: B
        answer: "Hai lần chạy của cùng registration overlap ngay vì scheduler có hai thread."
        explanation: "Sai. Pool lớn hơn cho phép các registration khác nhau chạy đồng thời, không làm các lần kế tiếp của cùng periodic registration chồng lấn."
      - id: C
        answer: "Mọi firing bị trễ trong lúc lần trước đang chạy đều bị bỏ vĩnh viễn theo fixed-rate semantics."
        explanation: "Sai. Fixed-rate có thể bị trễ so với lịch; serialization không đồng nghĩa mọi lần chạy trễ đều bị drop."
      - id: D
        answer: "Scheduler tự đổi registration sang fixed-delay khi thời lượng chạy dài hơn period."
        explanation: "Sai. Fixed-rate và fixed-delay vẫn là hai chính sách timing riêng."
    correctAnswerId: A
