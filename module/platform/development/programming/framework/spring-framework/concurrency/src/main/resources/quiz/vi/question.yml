  - id: spring-simple-scheduler-fixed-delay
    question: "Vì sao fixed-delay là trường hợp đặc biệt trên `SimpleAsyncTaskScheduler`?"
    answers:
      - id: A
        answer: "Fixed-delay luôn tạo virtual thread mới nên hoàn toàn bỏ qua scheduler thread."
        explanation: "Sai. Fixed-delay chính là path chạy task body trực tiếp trên scheduler thread."
      - id: B
        answer: "Fixed-delay được chuyển thành cron trigger để target executor tính firing tiếp theo."
        explanation: "Sai. Fixed-delay vẫn giữ timing semantics dựa trên completion."
      - id: C
        answer: "Task body chạy trên scheduler thread, nên task chậm có thể giữ scheduling lane và bỏ qua normal hand-off controls."
        explanation: "Đúng. Normal target-executor hand-off dùng cho fixed-rate/cron-style execution không áp dụng cho fixed-delay body này."
      - id: D
        answer: "Task body luôn được đưa vào một pooled platform-thread executor ngay cả khi virtual thread đã bật."
        explanation: "Sai. `SimpleAsyncTaskScheduler` không bắt buộc fixed-delay phải qua pooled platform-thread executor."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
