questions:
  - id: spring-async-proxy
    question: "Một method `@Async` được gọi từ method khác trong cùng bean bằng `this.asyncMethod()`. Vì sao lời gọi có thể vẫn chạy đồng bộ trong proxy mode mặc định?"
    answers:
      - id: A
        answer: "Vì self-invocation bỏ qua executor lookup và tự động fallback sang một TaskExecutor đồng bộ."
        explanation: "Sai. Spring không thay self-invocation bằng synchronous executor; vấn đề là lời gọi có đi qua proxy để được intercept hay không."
      - id: B
        answer: "Vì executor qualification chỉ được đánh giá cho call từ bên ngoài target bean, nên self-call dùng current thread."
        explanation: "Sai. Executor qualification không dựa trên vị trí caller; self-invocation quan trọng vì nó có thể bypass chính proxy."
      - id: C
        answer: "Vì self-invocation có thể bypass Spring proxy, nên async interceptor không có cơ hội dispatch lời gọi sang TaskExecutor."
        explanation: "Đúng. Async boundary thường rõ ràng hơn khi nằm giữa hai Spring bean và lời gọi đi qua proxy."
      - id: D
        answer: "Vì proxy nhìn thấy self-invocation nhưng chủ động bỏ async dispatch để ngăn recursive task submission."
        explanation: "Sai. Thông thường self-call không đi vào proxy ngay từ đầu; đây không phải cơ chế chống recursion của proxy."
    correctAnswerId: C
    aiGenerated: true
