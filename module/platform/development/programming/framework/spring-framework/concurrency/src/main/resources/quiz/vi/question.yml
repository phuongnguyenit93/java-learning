  - id: spring-task-decorator-context
    question: "Trách nhiệm phù hợp nhất của Spring `TaskDecorator` trong module là gì?"
    answers:
      - id: A
        answer: "Capture context bên gọi, cài nó trên worker cho task, rồi restore context trước đó của worker trong `finally`."
        explanation: "Đúng. Đây là bridge trực tiếp giữa ThreadLocal/context propagation và ThreadPoolTaskExecutor."
      - id: B
        answer: "Đọc ThreadLocal của bên gọi một cách lazy từ worker rồi clear giá trị sau khi task kết thúc."
        explanation: "Sai. Thread-bound state không tự xuất hiện trên pooled worker khác; state phía caller phải được capture trước khi dispatch."
      - id: C
        answer: "Cài một context snapshot khi pool khởi động rồi dùng lại snapshot đó cho mọi task."
        explanation: "Sai. Context thường gắn với từng task; dùng chung một snapshot dễ gây stale state hoặc lẫn context giữa request."
      - id: D
        answer: "Copy request-scoped object sang worker và giữ nó cho tới khi worker thread kết thúc."
        explanation: "Sai. Propagation không kéo dài request lifecycle; chỉ nên capture giá trị cần thiết và phải cleanup rõ ràng."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
