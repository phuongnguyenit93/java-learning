  - id: spring-executor-shutdown-semantics
    question: "Quan hệ giữa `setWaitForTasksToCompleteOnShutdown(true)` và `setAwaitTerminationSeconds(2)` trên `ThreadPoolTaskExecutor` là gì?"
    answers:
      - id: A
        answer: "Setting đầu chọn soft shutdown path để công việc còn lại tiếp tục hoàn tất; setting sau giới hạn thời gian container chờ termination."
        explanation: "Đúng. Hai setting trả lời hai câu hỏi khác nhau và hết thời gian chờ không tự động là hard task-kill deadline."
      - id: B
        answer: "Setting đầu luôn chờ đúng hai giây, còn setting sau quyết định có discard queued task hay không."
        explanation: "Sai. Trách nhiệm đã bị đảo và timeout được cấu hình độc lập."
      - id: C
        answer: "Hai setting là alias và chỉ cần một trong hai là bảo đảm mọi queued task hoàn tất trước khi process thoát."
        explanation: "Sai. Chúng là hai control khác nhau và không thể bảo đảm vượt qua termination window của deployment."
      - id: D
        answer: "Hai setting chỉ tác động tới submission trước shutdown và không còn tác dụng khi context close bắt đầu."
        explanation: "Sai. Chúng trực tiếp ảnh hưởng shutdown behavior và termination waiting."
    correctAnswerId: A
