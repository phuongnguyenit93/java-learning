  - id: spring-async-void-failure
    question: "Một `void @Async` method ném exception sau khi đã được dispatch thành công. Bên gọi có nhận exception đó qua `Future` không?"
    answers:
      - id: A
        answer: "Có. Proxy tạo một Future ngầm cho void method rồi complete exceptionally cho bên gọi."
        explanation: "Sai. Lời gọi `void @Async` không trả completion handle cho bên gọi."
      - id: B
        answer: "Không. Method-body failure đi tới `AsyncUncaughtExceptionHandler`; submission rejection vẫn là một synchronous boundary riêng."
        explanation: "Đúng. Knowledge phân biệt exception trong thân async method với failure xảy ra ngay khi submit task."
      - id: C
        answer: "Không. `ErrorHandler` của scheduler quan sát lỗi rồi giữ async method đủ điều kiện chạy ở lần sau."
        explanation: "Sai. `@Async` method-body failure và scheduled-task failure thuộc hạ tầng khác nhau."
      - id: D
        answer: "Không. Spring đổi method-body exception thành `TaskRejectedException` rồi báo lại ngay tại original submission call."
        explanation: "Sai. Submission rejection xảy ra trước execution; câu hỏi mô tả lỗi xuất hiện sau khi dispatch thành công."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Spring_Task_Executor/SpringExecutor.md"
