  - id: spring-virtual-thread-capacity
    question: "Một service chuyển blocking work từ bounded platform-thread pool sang virtual threads. Vấn đề production nào vẫn phải được thiết kế rõ?"
    answers:
      - id: A
        answer: "Không còn vấn đề capacity vì virtual thread làm database connection và downstream quota trở nên không giới hạn."
        explanation: "Sai. Virtual thread giảm thread scarcity chứ không xóa giới hạn của tài nguyên bên ngoài."
      - id: B
        answer: "Downstream capacity và admission vẫn cần giới hạn dù ứng dụng có thể chạy nhiều blocking task trên các thread rẻ hơn."
        explanation: "Đúng. Database pool, remote quota, CPU, memory và các resource khác vẫn hữu hạn."
      - id: C
        answer: "Chỉ thread naming còn quan trọng vì shared-state correctness tự thay đổi khi dùng virtual thread."
        explanation: "Sai. Quy tắc shared-state correctness và context propagation không thay đổi."
      - id: D
        answer: "Ứng dụng luôn phải phục hồi platform-thread queue vì virtual-thread executor bắt buộc có queue capacity."
