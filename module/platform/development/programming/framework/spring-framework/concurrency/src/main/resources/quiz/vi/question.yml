  - id: spring-reactive-scheduled-resubscription
    question: "Lifecycle nào mô tả đúng reactive `@Scheduled` method trong Spring Framework 6.1?"
    answers:
      - id: A
        answer: "Spring gọi lại method ở mỗi firing và dùng từng giá trị emitted làm scheduling result."
        explanation: "Sai. Spring lấy Publisher một lần rồi các firing sẽ subscribe lại; giá trị onNext bị bỏ qua."
      - id: B
        answer: "Spring gọi method một lần, subscribe một lần và giữ subscription đó suốt vòng đời ứng dụng."
        explanation: "Sai. Publisher được lấy một lần nhưng schedule tạo nhiều lần subscription."
      - id: C
        answer: "Spring lấy Publisher một lần, nhưng bất kỳ `onError` nào cũng xóa recurring schedule vĩnh viễn."
        explanation: "Sai. Reactive scheduled error được log và recover để các subscription sau vẫn tiếp tục."
      - id: D
        answer: "Spring lấy Publisher một lần, subscribe lại ở mỗi firing, bỏ qua `onNext` và recover từ `onError` để các firing sau tiếp tục."
        explanation: "Đúng. Vì vậy Publisher phải phù hợp với deferred và repeated subscription."
