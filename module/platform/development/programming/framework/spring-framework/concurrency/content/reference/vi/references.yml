references:
  - title: "Spring Framework Reference — Task Execution and Scheduling"
    url: "https://docs.spring.io/spring-framework/reference/integration/scheduling.html"
    description: "Tổng quan cơ chế đồng thời trong Spring: TaskExecutor, TaskScheduler, @Async, @Scheduled, thread pools, cron triggers và xử lý exception."
  - title: "Spring Framework API — TaskExecutor"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/core/task/TaskExecutor.html"
    description: "Abstraction thực thi Runnable, tích hợp các chiến lược đồng bộ, bất đồng bộ và thread pool thông qua dependency injection."
  - title: "Spring Framework API — ThreadPoolTaskExecutor"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/scheduling/concurrent/ThreadPoolTaskExecutor.html"
    description: "Cấu hình corePoolSize, maxPoolSize, queueCapacity, khả năng giám sát và quản lý lifecycle của executor."
  - title: "Spring Framework API — TaskScheduler"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/scheduling/TaskScheduler.html"
    description: "Giao diện lập lịch với Trigger, fixed rate, fixed delay, thời điểm chạy và ScheduledFuture."
  - title: "Spring Framework API — ThreadPoolTaskScheduler"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/scheduling/concurrent/ThreadPoolTaskScheduler.html"
    description: "Triển khai TaskScheduler dựa trên ScheduledThreadPoolExecutor, thread pool, scheduling và lifecycle."
  - title: "Spring Framework API — @Async"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/scheduling/annotation/Async.html"
    description: "Phương thức bất đồng bộ thông qua Spring proxy, lựa chọn Executor và các kiểu trả về Future/CompletableFuture."
  - title: "Spring Framework API — @Scheduled"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/scheduling/annotation/Scheduled.html"
    description: "Lập lịch theo cron, fixedDelay, fixedRate, initialDelay và các giới hạn về phương thức được đánh dấu."
  - title: "Spring Framework API — @EnableAsync"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/scheduling/annotation/EnableAsync.html"
    description: "Kích hoạt xử lý @Async, lựa chọn executor, async configuration và lưu ý proxy/self-invocation."
