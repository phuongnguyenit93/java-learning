references:
  - title: "Spring Framework — Message API"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/messaging/Message.html"
    description: "Hợp đồng Message<T> với payload và headers; nền tảng cho tầng spring-messaging."
  - title: "Spring Framework — MessageChannel API"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/messaging/MessageChannel.html"
    description: "Giao diện gửi thông điệp và kết quả send, làm rõ ranh giới giữa ứng dụng và message transport."
  - title: "Spring Framework — Using Spring JMS"
    url: "https://docs.spring.io/spring-framework/reference/integration/jms/using.html"
    description: "JmsTemplate, listener container, chuyển đổi message, connection/session và transaction khi trao đổi thông điệp qua JMS."
  - title: "Spring Framework — Annotation-driven JMS Listener Endpoints"
    url: "https://docs.spring.io/spring-framework/reference/integration/jms/annotated.html"
    description: "@EnableJms, @JmsListener, listener factory, chuyển đổi payload, header và reply destination."
  - title: "Spring Framework — STOMP over WebSocket"
    url: "https://docs.spring.io/spring-framework/reference/web/websocket/stomp.html"
    description: "Giới thiệu giao thức STOMP trên WebSocket, destination, publish-subscribe và cấu trúc tương tác client/server."
  - title: "Spring Framework — Enable STOMP"
    url: "https://docs.spring.io/spring-framework/reference/web/websocket/stomp/enable.html"
    description: "Cấu hình @EnableWebSocketMessageBroker, STOMP endpoint, application destination prefix và message broker."
  - title: "Spring Framework — STOMP Annotated Controllers"
    url: "https://docs.spring.io/spring-framework/reference/web/websocket/stomp/handle-annotations.html"
    description: "@MessageMapping, @SubscribeMapping, @SendTo và @MessageExceptionHandler để xử lý và phản hồi message."
  - title: "Spring Framework — STOMP Message Flow"
    url: "https://docs.spring.io/spring-framework/reference/web/websocket/stomp/message-flow.html"
    description: "Các kênh clientInboundChannel, brokerChannel và clientOutboundChannel; luồng thông điệp từ client đến handler/broker."
  - title: "Spring Framework — RSocket"
    url: "https://docs.spring.io/spring-framework/reference/rsocket.html"
    description: "RSocketRequester, @MessageMapping, request-response/stream/channel, backpressure và nhắn tin reactive."
