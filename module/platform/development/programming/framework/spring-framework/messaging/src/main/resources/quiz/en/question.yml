# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: messaging-transport-neutral-foundation
    question: "Which statement best describes what Spring Messaging provides at its foundation?"
    answers:
      - {id: A, answer: "It guarantees that every message is persisted before a consumer sees it.", explanation: "Incorrect. Persistence and durability depend on the concrete broker or surrounding infrastructure, not the core Message and channel abstractions."}
      - {id: B, answer: "It provides transport-neutral abstractions for messages, channels, handlers, conversion, and interception.", explanation: "Correct. The foundation defines a common messaging vocabulary without imposing a particular transport, broker, or threading model."}
      - {id: C, answer: "It defines STOMP commands and RSocket frames as the common wire format for all Spring applications.", explanation: "Incorrect. STOMP and RSocket are distinct protocol layers built above or alongside the transport-neutral Spring Messaging model."}
      - {id: D, answer: "It makes communication asynchronous whenever application code sends through a MessageChannel.", explanation: "Incorrect. A MessageChannel can deliver on the caller thread; asynchronous execution depends on the concrete channel and executor."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Introduction/SpringMessaging.md", anchor: "spring-messaging-foundation"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: channel-executor-delivery-semantics
    question: "An ExecutorSubscribableChannel is constructed with an Executor. What must be checked before claiming that handler work runs asynchronously?"
    answers:
      - {id: A, answer: "Whether the Executor uses one worker thread or a pool of multiple worker threads.", explanation: "Incorrect. Pool size affects concurrency, but either design can still hand work off from the sender thread."}
      - {id: B, answer: "Whether the Executor preserves task submission order when several tasks are queued.", explanation: "Incorrect. Ordering policy does not by itself tell you whether execution is inline or handed off to another thread."}
      - {id: C, answer: "Whether threads created by the Executor are daemon threads or non-daemon threads.", explanation: "Incorrect. Thread lifetime policy is separate from whether the Executor performs a thread handoff."}
      - {id: D, answer: "Whether the concrete Executor schedules work on another thread or executes the task inline.", explanation: "Correct. An Executor such as SyncTaskExecutor can still execute on the calling thread, so the concrete executor semantics determine the handoff."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.MessageModel/MessageModel.md", anchor: "channel-delivery-semantics"}
    apiRelated: {controller: "ChannelExperimentController", methodSignature: "deliverySemantics()"}

  - id: channel-async-failure-visibility
    question: "A channel uses an executor that truly dispatches handlers to another thread. A handler fails after send has already returned. Which conclusion is most accurate?"
    answers:
      - {id: A, answer: "The sender may already have returned successfully, so later handler failures need an asynchronous-path error mechanism.", explanation: "Correct. With asynchronous handler execution, send can finish before handler work fails, so failure is no longer necessarily propagated through the original call path."}
      - {id: B, answer: "The failure must be rethrown synchronously from the original send call because MessageChannel guarantees that behavior.", explanation: "Incorrect. MessageChannel does not guarantee synchronous error propagation when handler work is dispatched asynchronously."}
      - {id: C, answer: "The presence of MessageHeaders.errorChannel automatically retries the failed handler until it succeeds.", explanation: "Incorrect. The core messaging abstraction does not provide a universal retry mechanism merely because that header exists."}
      - {id: D, answer: "The failure is converted into a STOMP ERROR frame even when no STOMP transport is involved.", explanation: "Incorrect. STOMP ERROR is a protocol-specific mechanism and is not a generic MessageChannel failure contract."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.MessageModel/MessageModel.md", anchor: "messaging-errors"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: websocket-vs-stomp-layering
    question: "Why might an application add STOMP on top of WebSocket instead of using raw WebSocket frames directly?"
    answers:
      - {id: A, answer: "STOMP changes WebSocket into a durable broker so messages survive application restarts.", explanation: "Incorrect. STOMP adds messaging semantics, while durability depends on broker capabilities and application design."}
      - {id: B, answer: "STOMP is required for WebSocket to carry text and binary data in both directions.", explanation: "Incorrect. Raw WebSocket already supports full-duplex text and binary messages without STOMP."}
      - {id: C, answer: "STOMP adds destinations, subscriptions, commands, headers, receipts, and broker-oriented routing.", explanation: "Correct. WebSocket supplies the duplex transport, while STOMP defines higher-level application messaging semantics."}
      - {id: D, answer: "STOMP removes the need for application-level routing because every frame is delivered to every connected client.", explanation: "Incorrect. STOMP introduces explicit routing and subscription semantics rather than broadcasting every frame indiscriminately."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.StompModel/StompModel.md", anchor: "stomp-purpose"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: stomp-routing-prefix-boundary
    question: "A Spring STOMP application uses `/app` as its application prefix and `/topic` as a broker prefix. What does that configuration primarily decide?"
    answers:
      - {id: A, answer: "It makes every `/topic` destination durable and every `/app` destination transient.", explanation: "Incorrect. Durability is a broker capability; prefix text does not create persistence semantics."}
      - {id: B, answer: "It separates messages routed to application handlers from messages routed to the configured broker.", explanation: "Correct. Prefixes are routing rules that assign responsibility to application handling or broker handling."}
      - {id: C, answer: "It chooses whether the WebSocket handshake uses HTTP GET or HTTP POST.", explanation: "Incorrect. Destination prefixes apply after the connection is established and do not choose the HTTP upgrade method."}
      - {id: D, answer: "It forces all application-handler replies to return on the same destination used by the incoming SEND frame.", explanation: "Incorrect. Reply destinations can be determined by annotations, headers, templates, or broker routing and are not fixed by the application prefix alone."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.StompMessageFlow/StompMessageFlow.md", anchor: "destination-prefixes"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: stomp-application-round-trip-flow
    question: "A client subscribes to `/topic/experiment.echo` and sends a message to `/app/experiment.echo`. The mapped handler returns to the topic. Which flow best describes the round trip?"
    answers:
      - {id: A, answer: "The SEND frame goes directly to clientOutboundChannel and waits there; only after the subscriber receives it does the handler run.", explanation: "Incorrect. Inbound application messages first travel through the inbound path toward application handling, not directly to the outbound client channel."}
      - {id: B, answer: "The simple broker invokes the `@MessageMapping` method directly and bypasses clientInboundChannel.", explanation: "Incorrect. Application-destination messages are dispatched through Spring's inbound messaging infrastructure before the annotated handler is invoked."}
      - {id: C, answer: "The WebSocket transport echoes the payload first, then Spring converts the echoed frame into a Message for the handler.", explanation: "Incorrect. WebSocket is the transport; the application flow is driven by STOMP destination routing inside Spring."}
      - {id: D, answer: "The message enters clientInboundChannel, reaches the handler, then its result goes through the broker and clientOutboundChannel to the subscriber.", explanation: "Correct. This is the end-to-end application-destination path demonstrated by the module's STOMP round-trip experiment."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.StompMessageFlow/StompMessageFlow.md", anchor: "application-message-flow"}
    apiRelated: {controller: "StompExperimentController", methodSignature: "roundTrip()"}

  - id: message-mapping-application-role
    question: "What is the primary role of an `@MessageMapping` method in Spring's STOMP programming model?"
    answers:
      - {id: A, answer: "It handles application-destination messages and lets application code produce a reply or another message.", explanation: "Correct. `@MessageMapping` is the application-handler side of destination routing, analogous to a message-oriented controller method."}
      - {id: B, answer: "It creates and manages durable broker queues for every destination pattern declared on the method.", explanation: "Incorrect. Broker queue lifecycle and durability belong to the broker rather than an annotated application method."}
      - {id: C, answer: "It registers the WebSocket HTTP upgrade endpoint used before STOMP CONNECT.", explanation: "Incorrect. STOMP endpoint registration is configured through StompEndpointRegistry, not through `@MessageMapping`."}
      - {id: D, answer: "It replaces client subscriptions by pushing every handler result to all connected sessions.", explanation: "Incorrect. Handler results are routed according to reply destinations and broker subscriptions; `@MessageMapping` does not remove subscription semantics."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.StompApplicationHandling/StompApplicationHandling.md", anchor: "message-mapping"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: simple-broker-feature-boundary
    question: "An application requires STOMP receipts, acknowledgement modes, and cross-instance broker routing. Which conclusion follows from Spring's built-in simple broker limits?"
    answers:
      - {id: A, answer: "The simple broker already provides those capabilities once a TaskScheduler is configured.", explanation: "Incorrect. A TaskScheduler can support heartbeats, but it does not add full receipt, acknowledgement, or clustered broker semantics."}
      - {id: B, answer: "Those features should be implemented by adding more `@MessageMapping` methods around the simple broker.", explanation: "Incorrect. Application handlers do not turn the in-process simple broker into a full STOMP broker."}
      - {id: C, answer: "Use an external STOMP-capable broker through Spring's broker relay when those broker features are required.", explanation: "Correct. The broker relay preserves Spring's application model while delegating full broker capabilities and shared routing to an external broker."}
      - {id: D, answer: "The application must abandon STOMP and move to raw WebSocket because receipts cannot exist with an external broker.", explanation: "Incorrect. Full STOMP brokers can support receipts and acknowledgements through the relay."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.BrokerRouting/BrokerRouting.md", anchor: "simple-broker-limits"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: broker-relay-connection-recovery
    question: "A STOMP broker relay loses its TCP connectivity to the external broker. Which recovery behavior should an operator expect from Spring?"
    answers:
      - {id: A, answer: "Every client broker connection is transparently restored with the same STOMP session and subscriptions.", explanation: "Incorrect. Per-client broker connections are not automatically reconnected; affected clients need to reconnect and recreate session state."}
      - {id: B, answer: "The relay retries the shared system connection; client-specific broker connections require clients to reconnect.", explanation: "Correct. Recovery is asymmetric between the shared system connection and the independent per-client broker connections."}
      - {id: C, answer: "Only client-specific broker connections are retried; the system connection remains permanently down until the application restarts.", explanation: "Incorrect. Spring's relay automatically attempts to re-establish the shared system connection."}
      - {id: D, answer: "Spring converts the relay to the built-in simple broker until the external broker becomes healthy again.", explanation: "Incorrect. Broker relay failure does not automatically change the configured broker topology."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.BrokerRouting/BrokerRouting.md", anchor: "broker-relay-connections"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: broker-outage-send-policy
    question: "A service publishes server-originated STOMP messages through a broker relay, and BrokerAvailabilityEvent reports the broker as unavailable. What is the best design response?"
    answers:
      - {id: A, answer: "Use an explicit outage policy: fail fast, bounded durable buffering, idempotent retry, or intentional drop.", explanation: "Correct. Relay reconnection does not make sends during an outage durable, so the application must define what happens to work produced while the broker is unavailable."}
      - {id: B, answer: "Continue sending normally because BrokerAvailabilityEvent is informational and the relay stores all messages until recovery.", explanation: "Incorrect. The relay does not provide an automatic durable store for application messages produced during the outage."}
      - {id: C, answer: "Switch all destinations to `/user` because user destinations bypass the broker relay.", explanation: "Incorrect. User destinations are a routing feature and do not provide a general broker-outage bypass."}
      - {id: D, answer: "Rely on the WebSocket endpoint health check because an open endpoint proves that the external broker is routable.", explanation: "Incorrect. The application can accept WebSocket connections while the external broker or relay path is unavailable."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "13.OperationsTestingDecisions/OperationsTestingDecisions.md", anchor: "broker-availability-recovery"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: user-destination-multi-session
    question: "One authenticated user has three active WebSocket sessions. A server sends a normal user-targeted message to that user. What should application code assume by default?"
    answers:
      - {id: A, answer: "Exactly one arbitrary session receives it because a user identity can map to only one WebSocket session.", explanation: "Incorrect. A single authenticated user can have multiple simultaneous sessions from tabs, devices, or reconnects."}
      - {id: B, answer: "The message is rejected until application code chooses a concrete WebSocket session id.", explanation: "Incorrect. Spring's user-destination mechanism resolves the logical user destination to active session-specific destinations."}
      - {id: C, answer: "It can fan out to all active sessions unless the application narrows a reply to the originating session.", explanation: "Correct. User and session identities are distinct; default user-targeted delivery can reach all sessions, while `broadcast=false` can narrow a handler reply."}
      - {id: D, answer: "The broker creates one durable queue shared by every session regardless of the broker implementation.", explanation: "Incorrect. User destinations are Spring routing abstractions and do not imply a universal durable-queue policy."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.BrokerRouting/BrokerRouting.md", anchor: "multi-session-users"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: stomp-client-receipt-semantics
    question: "A Spring STOMP client receives a RECEIPT for a SEND frame. What has that receipt established?"
    answers:
      - {id: A, answer: "Every subscribed consumer has already handled the business payload successfully.", explanation: "Incorrect. A receipt confirms protocol-level processing by the STOMP server, not completion by downstream consumers."}
      - {id: B, answer: "The message has been durably stored even if the server is Spring's built-in simple broker.", explanation: "Incorrect. A receipt is not a durability guarantee, and the built-in simple broker does not provide full receipt semantics."}
      - {id: C, answer: "Any database transaction triggered by the message has committed successfully.", explanation: "Incorrect. Business transactions require their own domain-level confirmation and are outside STOMP receipt semantics."}
      - {id: D, answer: "The STOMP server processed the frame and correlated it with the requested receipt id.", explanation: "Correct. RECEIPT is protocol progress confirmation; stronger business or durability guarantees require separate mechanisms."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.StompClientLifecycle/StompClientLifecycle.md", anchor: "stomp-client-receipts"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: stomp-reconnect-subscriptions
    question: "A WebSocketStompClient loses its transport connection and later reconnects. What should the application do with subscriptions from the old StompSession?"
    answers:
      - {id: A, answer: "Reuse the old subscription handles because Spring automatically transfers them to the new session.", explanation: "Incorrect. A transport loss ends the old STOMP session, and its subscriptions are no longer active."}
      - {id: B, answer: "Establish a new session, then recreate the subscriptions the application still needs.", explanation: "Correct. Reconnection creates new session state, so required subscriptions must be restored explicitly."}
      - {id: C, answer: "Send a RECEIPT request on the old session to reactivate all previous subscriptions.", explanation: "Incorrect. Receipts confirm frame processing; they do not resurrect state from a failed session."}
      - {id: D, answer: "Enable preservePublishOrder because that setting performs client reconnection and subscription restoration.", explanation: "Incorrect. Publish-order preservation controls outbound ordering per session and does not implement reconnect orchestration."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.StompClientLifecycle/StompClientLifecycle.md", anchor: "stomp-connection-recovery"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: executor-channel-interceptor-boundary
    question: "When is ExecutorChannelInterceptor a better fit than a basic ChannelInterceptor?"
    answers:
      - {id: A, answer: "When logic must run around each MessageHandler invocation on the executor thread doing the handler work.", explanation: "Correct. ExecutorChannelInterceptor exposes callbacks at the handler-execution boundary, which is useful for execution-thread context and timing."}
      - {id: B, answer: "When a preSend hook only needs to inspect, modify, or reject a Message on the channel send path.", explanation: "Incorrect. Those send-path concerns fit ChannelInterceptor; they do not require callbacks around executor-driven handler invocation."}
      - {id: C, answer: "When timing only needs to cover the caller's send operation rather than the handler work executed by a worker thread.", explanation: "Incorrect. Basic ChannelInterceptor callbacks can observe the send path; ExecutorChannelInterceptor matters when the actual handler-execution boundary is required."}
      - {id: D, answer: "When context can be carried explicitly in message headers and no setup or cleanup is needed around handler invocation.", explanation: "Incorrect. Explicit headers are often preferable for message-contract data, but this case does not require executor-aware callbacks around MessageHandler execution."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.StompLifecycleInterception/StompLifecycleInterception.md", anchor: "executor-channel-interceptor"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: stomp-ordering-per-session
    question: "An application enables preserve receive order for STOMP. Which guarantee is being requested?"
    answers:
      - {id: A, answer: "All messages from every connected client are processed in one global sequence.", explanation: "Incorrect. Receive-order preservation is scoped per client session, not globally across all sessions."}
      - {id: B, answer: "The external broker must persist messages in the same order they entered the application.", explanation: "Incorrect. The setting controls Spring's inbound processing path and does not define broker persistence behavior."}
      - {id: C, answer: "Messages from the same client session are handled on clientInboundChannel in receive order.", explanation: "Correct. The option trades some parallelism for per-session ordering on the Spring inbound path."}
      - {id: D, answer: "Replies to one client are published in order even if inbound processing remains concurrent.", explanation: "Incorrect. That is the separate preserve publish order concern on the outbound path."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.StompLifecycleInterception/StompLifecycleInterception.md", anchor: "preserve-receive-order"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: messaging-security-boundary
    question: "Spring Messaging exposes destinations, message types, headers, user identity, and interceptors. Which layer should own the policy that decides whether a user may send or subscribe?"
    answers:
      - {id: A, answer: "The STOMP destination naming convention, because prefixes such as `/app` and `/topic` inherently authorize users.", explanation: "Incorrect. Destination prefixes route messages; they do not define authorization policy."}
      - {id: B, answer: "The built-in simple broker, because broker routing automatically authenticates and authorizes every message.", explanation: "Incorrect. Broker routing and security policy are separate responsibilities."}
      - {id: C, answer: "The WebSocket transport alone, because successful HTTP upgrade grants access to every STOMP destination.", explanation: "Incorrect. A successful connection does not imply permission for every later messaging operation."}
      - {id: D, answer: "Spring Security, using the identity and message hooks exposed by the messaging infrastructure.", explanation: "Correct. Spring Framework Messaging provides the route and interception plumbing, while authentication and authorization policy belong to Spring Security."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.StompLifecycleInterception/StompLifecycleInterception.md", anchor: "message-authorization-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: rsocket-interaction-cardinality
    question: "A Spring RSocket responder accepts a multi-value Flux request payload and returns a Flux of results. Which interaction model does that signature imply?"
    answers:
      - {id: A, answer: "Request-stream, because any Flux return type always makes the interaction request-stream.", explanation: "Incorrect. Request-stream has zero or one input value and many outputs; a multi-value input changes the interaction to request-channel."}
      - {id: B, answer: "Request-channel, because a multi-value request input selects the channel interaction regardless of output cardinality.", explanation: "Correct. Spring determines the model from input and output cardinality, and a many-valued input selects request-channel."}
      - {id: C, answer: "Fire-and-forget, because multiple request values are sent without waiting and therefore cannot create a response stream.", explanation: "Incorrect. Fire-and-forget is a one-way interaction and does not describe a multi-value request stream with response values."}
      - {id: D, answer: "Request-response, because one route is selected for the whole exchange.", explanation: "Incorrect. Route count does not determine the interaction type; request and response cardinality do."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "12.RSocketResponders/RSocketResponders.md", anchor: "rsocket-interaction-cardinality"}
    apiRelated: {controller: "RSocketExperimentController", methodSignature: "interactionCardinality()"}

  - id: rsocket-requester-responder-symmetry
    question: "After an RSocket connection is established, what does requester/responder symmetry mean?"
    answers:
      - {id: A, answer: "Either peer may initiate an interaction and act as requester while the other peer responds on that stream.", explanation: "Correct. Client and server describe connection establishment, while requester and responder are per-interaction roles after setup."}
      - {id: B, answer: "Both peers must send the same payload at the same time for every request to remain symmetric.", explanation: "Incorrect. Symmetry concerns which peer may initiate interactions, not mirrored simultaneous payloads."}
      - {id: C, answer: "The connection alternates permanently between client mode and server mode after each frame.", explanation: "Incorrect. A peer can be requester on one stream and responder on another concurrently without changing a global connection mode."}
      - {id: D, answer: "Only the TCP-accepting side can create new requests, while the connecting side can only answer them.", explanation: "Incorrect. RSocket explicitly allows either side to initiate requests after setup."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.RSocketInteraction/RSocketInteraction.md", anchor: "rsocket-symmetry"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: messaging-topology-choice
    question: "Two backend peers need many concurrent interactions on one long-lived connection, including bidirectional streams where Reactive Streams demand should propagate across the network. No durable broker semantics are required. Which model is the strongest fit?"
    answers:
      - {id: A, answer: "Raw WebSocket with a custom application protocol and application-built flow-control rules.", explanation: "Incorrect. Raw WebSocket could implement the contract, but the application would have to design the interaction protocol, multiplexing, routing, and flow control itself."}
      - {id: B, answer: "STOMP over WebSocket because destinations and subscriptions automatically provide Reactive Streams demand.", explanation: "Incorrect. STOMP provides messaging destinations and subscriptions, not RSocket-style network propagation of Reactive Streams demand."}
      - {id: C, answer: "RSocket, using its requester/responder interaction models such as request-response and request-channel.", explanation: "Correct. RSocket directly models multiplexed requester/responder interactions, bidirectional streaming, and demand propagation across the network."}
      - {id: D, answer: "STOMP with a broker relay because an external broker automatically turns every subscription into a bidirectional reactive stream.", explanation: "Incorrect. A broker relay strengthens broker-oriented routing and broker features; it does not convert STOMP subscriptions into RSocket request-channel semantics."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "13.OperationsTestingDecisions/OperationsTestingDecisions.md", anchor: "choose-messaging-model"}
    apiRelated: {controller: "", methodSignature: ""}
