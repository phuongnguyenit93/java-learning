  - id: stomp-routing-prefix-boundary
    question: "Một ứng dụng Spring STOMP dùng `/app` làm application prefix và `/topic` làm broker prefix. Cấu hình đó chủ yếu quyết định điều gì?"
    answers:
      - {id: A, answer: "Nó làm mọi `/topic` destination trở nên durable và mọi `/app` destination trở nên transient.", explanation: "Sai. Durability là broker capability; prefix text không tự tạo persistence semantics."}
      - {id: B, answer: "Nó tách message route tới application handler khỏi message route tới broker đã cấu hình.", explanation: "Đúng. Prefix là routing rule dùng để phân trách nhiệm cho application handling hoặc broker handling."}
      - {id: C, answer: "Nó chọn WebSocket handshake sẽ dùng HTTP GET hay HTTP POST.", explanation: "Sai. Destination prefix chỉ có ý nghĩa sau khi connection đã được thiết lập và không chọn HTTP upgrade method."}
      - {id: D, answer: "Nó buộc mọi reply của application handler quay lại đúng destination của SEND frame đầu vào.", explanation: "Sai. Reply destination có thể do annotation, header, template hoặc broker routing quyết định; application prefix không tự cố định điều đó."}
    correctAnswerId: B
