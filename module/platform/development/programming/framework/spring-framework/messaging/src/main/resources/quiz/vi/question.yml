  - id: channel-async-failure-visibility
    question: "Một channel dùng executor thực sự dispatch handler sang thread khác. Handler lỗi sau khi send đã trả về. Kết luận nào chính xác nhất?"
    answers:
      - {id: A, answer: "Sender có thể đã return thành công, nên handler failure xảy ra sau cần cơ chế lỗi dành cho asynchronous path.", explanation: "Đúng. Khi handler chạy bất đồng bộ, send có thể kết thúc trước lúc handler lỗi nên failure không nhất thiết quay về original call path."}
      - {id: B, answer: "Failure bắt buộc phải được rethrow đồng bộ từ lời gọi send ban đầu vì MessageChannel đảm bảo điều đó.", explanation: "Sai. MessageChannel không đảm bảo synchronous error propagation khi handler work được dispatch bất đồng bộ."}
      - {id: C, answer: "Chỉ cần có MessageHeaders.errorChannel thì handler lỗi sẽ tự retry cho tới khi thành công.", explanation: "Sai. Core messaging abstraction không cung cấp universal retry chỉ vì header đó tồn tại."}
      - {id: D, answer: "Failure luôn được chuyển thành STOMP ERROR frame kể cả khi không có STOMP transport.", explanation: "Sai. STOMP ERROR là cơ chế protocol-specific, không phải generic MessageChannel failure contract."}
    correctAnswerId: A
