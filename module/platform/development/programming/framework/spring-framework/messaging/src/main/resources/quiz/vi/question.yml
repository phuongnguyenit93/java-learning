      - {id: B, answer: "Cứ tiếp tục send bình thường vì BrokerAvailabilityEvent chỉ mang tính thông tin và relay sẽ lưu mọi message tới khi recovery.", explanation: "Sai. Relay không cung cấp automatic durable store cho application message phát sinh trong outage."}
