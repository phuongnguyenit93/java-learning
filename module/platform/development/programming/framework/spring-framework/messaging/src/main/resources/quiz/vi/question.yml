  - id: channel-executor-delivery-semantics
    question: "Một ExecutorSubscribableChannel được tạo với một Executor. Cần kiểm tra điều gì trước khi kết luận handler chạy bất đồng bộ?"
    answers:
      - {id: A, answer: "Executor dùng một worker thread hay một pool gồm nhiều worker thread.", explanation: "Sai. Pool size ảnh hưởng concurrency, nhưng cả hai thiết kế vẫn có thể hand off công việc khỏi sender thread."}
      - {id: B, answer: "Executor có preserve submission order khi nhiều task được queue hay không.", explanation: "Sai. Ordering policy không tự cho biết task chạy inline hay được hand off sang thread khác."}
      - {id: C, answer: "Thread do Executor tạo là daemon thread hay non-daemon thread.", explanation: "Sai. Thread lifetime policy tách biệt với việc Executor có thực hiện thread handoff hay không."}
      - {id: D, answer: "Concrete Executor có schedule công việc sang thread khác hay chạy task inline.", explanation: "Đúng. Một Executor như SyncTaskExecutor vẫn có thể chạy trên calling thread, vì vậy concrete executor semantics mới quyết định thread handoff."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
