  - id: websocket-vs-stomp-layering
    question: "Vì sao ứng dụng có thể thêm STOMP phía trên WebSocket thay vì chỉ dùng raw WebSocket frame?"
    answers:
      - {id: A, answer: "STOMP biến WebSocket thành durable broker để message sống qua application restart.", explanation: "Sai. STOMP thêm messaging semantics; durability phụ thuộc broker capability và application design."}
      - {id: B, answer: "STOMP là bắt buộc để WebSocket có thể mang text và binary data theo hai chiều.", explanation: "Sai. Raw WebSocket đã hỗ trợ full-duplex text và binary message mà không cần STOMP."}
      - {id: C, answer: "STOMP thêm destination, subscription, command, header, receipt và broker-oriented routing.", explanation: "Đúng. WebSocket cung cấp duplex transport, còn STOMP định nghĩa application messaging semantics ở mức cao hơn."}
      - {id: D, answer: "STOMP loại bỏ nhu cầu application-level routing vì mọi frame đều được gửi tới tất cả client đang kết nối.", explanation: "Sai. STOMP đưa vào explicit routing và subscription semantics thay vì broadcast mọi frame một cách vô điều kiện."}
    correctAnswerId: C
