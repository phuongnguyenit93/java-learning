  - id: stomp-application-round-trip-flow
    question: "Client subscribe `/topic/experiment.echo` rồi gửi message tới `/app/experiment.echo`. Handler tương ứng trả kết quả về topic. Flow nào mô tả đúng nhất round trip này?"
    answers:
      - {id: A, answer: "SEND frame đi thẳng vào clientOutboundChannel và chờ ở đó; application handler chỉ chạy sau khi subscriber đã nhận message.", explanation: "Sai. Inbound application message trước tiên đi qua inbound path tới application handling, không đi thẳng ra outbound client channel."}
      - {id: B, answer: "Simple broker gọi trực tiếp method `@MessageMapping` và bỏ qua clientInboundChannel.", explanation: "Sai. Message có application destination được dispatch qua Spring inbound messaging infrastructure trước khi annotated handler được gọi."}
      - {id: C, answer: "WebSocket transport echo payload trước, rồi Spring mới chuyển echoed frame thành Message cho handler.", explanation: "Sai. WebSocket là transport; application flow được điều khiển bởi STOMP destination routing bên trong Spring."}
      - {id: D, answer: "Message đi vào clientInboundChannel, tới handler, rồi result đi qua broker và clientOutboundChannel tới subscriber.", explanation: "Đúng. Đây là application-destination path end-to-end mà STOMP round-trip experiment của module quan sát."}
