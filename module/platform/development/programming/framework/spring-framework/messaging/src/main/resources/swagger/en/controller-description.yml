ChannelExperimentController:
  description: |-
    <h2>Message Channel Delivery Experiment</h2>
    <p>Compares caller-thread delivery with a deliberately asynchronous ExecutorSubscribableChannel and exposes the observed thread and completion boundary.</p>
  readmeRelated:
