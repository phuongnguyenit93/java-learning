  - question: >-
      During a broker outage, why can a Spring STOMP broker relay recover its system connection while existing client sessions still need to reconnect, and how should an application react operationally?
    answer: >-
      The relay maintains a shared system connection for server-originated broker traffic and separate broker connections associated with STOMP client sessions. Spring automatically retries the shared system connection, but it does not recreate the per-client broker connections, so affected clients must reconnect and establish new sessions. BrokerAvailabilityEvent is useful for pausing or rejecting server-originated sends while the system connection is unavailable, but reconnection by itself does not make messages created during the outage durable. The application still needs an explicit fail, buffer, retry, or drop policy that matches its business semantics.
    aiGenerated: true
    reviewed: false
