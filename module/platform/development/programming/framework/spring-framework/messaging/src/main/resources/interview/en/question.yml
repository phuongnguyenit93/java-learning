  - question: >-
      Trace a STOMP SEND from a WebSocket client to an /app destination through an annotated Spring handler and back to a subscribed client. Which components own each hop?
    answer: >-
      Spring decodes WebSocket data into a STOMP frame, represents it as a Spring Message, and sends it through clientInboundChannel. An application destination such as /app is routed to an annotated handler such as @MessageMapping; the handler result or an application send is then published toward the broker through brokerChannel. The simple broker or broker relay performs subscription routing, and matching messages travel through clientOutboundChannel to the WebSocket session. Following those channels is more reliable than reasoning only from endpoint URLs or annotations.
    aiGenerated: true
    reviewed: false
    readmeRelated:
