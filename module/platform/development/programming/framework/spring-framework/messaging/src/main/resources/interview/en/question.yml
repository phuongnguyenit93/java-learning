  - question: >-
      Why does configuring an Executor on ExecutorSubscribableChannel not automatically prove asynchronous delivery, and what behavior can change when a real thread handoff is introduced?
    answer: >-
      Without an Executor, ExecutorSubscribableChannel invokes handlers on the sender thread. With an Executor, handler invocation is delegated to that executor, but an executor such as SyncTaskExecutor can still run work synchronously on the caller thread. A real handoff can let send return before handling finishes, move failures into executor tasks, break ordinary ThreadLocal continuity, and change ordering according to executor behavior. The concrete executor semantics therefore matter more than the mere presence of an Executor object.
    aiGenerated: true
    reviewed: false
