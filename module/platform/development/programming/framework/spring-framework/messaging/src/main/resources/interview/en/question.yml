      methodSignature: "interactionCardinality()"

  - question: >-
      What does requester/responder symmetry mean in RSocket, and how do @ConnectMapping and metadata fit into the connection lifecycle without becoming ordinary request handlers?
    answer: >-
      After setup, either peer can initiate RSocket interactions, so a server can keep the peer-specific RSocketRequester and later call routes implemented by a client responder. @ConnectMapping handles connection-level SETUP and METADATA_PUSH frames, must complete setup before normal requests proceed, and cannot return application response data. Routing, security material, tracing, and other metadata are encoded under MIME-type contracts and must be decoded or extracted into Spring headers by compatible strategies. That makes setup and metadata part of the connection contract, while @MessageMapping continues to handle ordinary request interactions.
    aiGenerated: true
    reviewed: false
