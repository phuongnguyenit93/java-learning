  - question: >-
      If a messaging application works correctly in development but fails under load, what operational and testing questions would you ask before changing business logic?
    answer: >-
      Start with executor capacity, queue growth, blocking work, rejection behavior, and the cost of fan-out on clientInboundChannel and clientOutboundChannel. For STOMP/WebSocket, inspect slow-client behavior, send-time and send-buffer limits, message-size limits, broker availability, connection lifecycle, and broker statistics; for RSocket, also inspect demand, cancellation, codecs, metadata, and requester lifecycle. Focused tests should exercise routing, conversion, handlers, and infrastructure without requiring a network when possible, while a smaller end-to-end suite should prove the real WebSocket/STOMP or RSocket wiring. Load tests should use representative payload sizes, connection counts, and slow consumers because resource boundaries often fail before the handler code does.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: ""
      anchor: ""
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      How would you choose among raw WebSocket, STOMP over WebSocket, RSocket, and a handoff to Spring Integration for a new system, and what secondary decision remains after choosing STOMP?
    answer: >-
      Raw WebSocket fits when the application wants a custom duplex text or binary protocol and is willing to own framing, routing, errors, and compatibility. STOMP fits destination- and subscription-oriented messaging, especially when broker-style pub/sub is useful; RSocket fits multiplexed requester/responder interactions and reactive streaming with network-level demand. When the real problem becomes composing adapters, routers, filters, transformations, and multi-system flows, Spring Integration is the stronger owner. If STOMP is chosen, the design still has to decide separately whether the in-process simple broker or an external broker relay matches scale and delivery requirements.
    aiGenerated: true
    reviewed: false
