  - question: >-
      How would you choose between Spring's built-in simple broker and an external STOMP broker relay, and what do STOMP acknowledgements or receipts reveal about the boundary between Spring and the broker?
    answer: >-
      The simple broker is an in-process subscription router that is useful for basic, non-clustered broadcasting, but it does not provide full broker features such as STOMP acknowledgements or receipts and does not share subscription state across application instances. A broker relay is the usual choice when horizontal scale or full broker capabilities matter, but the external broker still defines durability, queue lifecycle, acknowledgement semantics, and vendor behavior. Receipts or acknowledgements therefore do not become automatic end-to-end reliability guarantees merely because a relay is enabled; the application, client, and broker configuration must agree on the intended delivery contract.
    aiGenerated: true
    reviewed: false
