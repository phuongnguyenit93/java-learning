questions:
  - question: >-
      How would you explain the boundary of Spring Messaging when designing a real-time feature, and how do you know when the problem belongs to a neighboring Spring module or to the broker itself?
    answer: >-
      Spring Messaging owns the transport-neutral Message, channel, handler, conversion, interception, WebSocket/STOMP, and RSocket programming models used by Spring Framework. Spring Integration owns enterprise integration patterns and composed flows, Spring Security owns authentication and authorization policy, Spring Session owns HTTP-session lifecycle, and Spring Web MVC/WebFlux own their web stacks. Broker-native durability, acknowledgement behavior, queue lifecycle, clustering, and vendor routing remain broker concerns. The design stays easier to reason about when each requirement is assigned to the layer that actually controls it.
