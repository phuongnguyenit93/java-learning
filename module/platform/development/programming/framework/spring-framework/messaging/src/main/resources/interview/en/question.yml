  - question: >-
      Where do interception, executor thread boundaries, ordering controls, security, and HTTP-session integration meet in a long-lived STOMP connection, and which responsibilities should remain separate?
    answer: >-
      ChannelInterceptor runs around channel send operations, while ExecutorChannelInterceptor surrounds handler execution on executor workers and is therefore the relevant hook for thread-bound execution context. Concurrent inbound and outbound executors can reorder work, so Spring's receive and publish order options should be enabled only when per-session semantics require them. Identity usually enters through the authenticated WebSocket handshake; Spring Security owns authorization policy, and Spring Session owns integration that keeps HTTP-session lifecycle aligned with WebSocket activity. Mixing those responsibilities into one interceptor makes ordering, context propagation, and policy much harder to diagnose.
    aiGenerated: true
    reviewed: false
