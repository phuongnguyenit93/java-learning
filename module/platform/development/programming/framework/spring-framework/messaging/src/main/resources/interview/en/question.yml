  - question: >-
      In Spring RSocket, how can changing a handler signature from one value to a stream change the protocol interaction, and why must requester and responder cardinality agree?
    answer: >-
      Spring derives the RSocket interaction from input and output cardinality rather than from a method name. A single input with a single output is request-response, a single input with many outputs is request-stream, and a many-valued input selects request-channel; zero-output interactions can represent fire-and-forget or a request-response with no value depending on the requester operation. Changing Mono to Flux can therefore change the protocol contract visible on the wire. Requester retrieval and responder signatures must describe compatible cardinalities or the two peers disagree about the interaction they are performing.
    aiGenerated: true
    reviewed: false
    readmeRelated:
