  - question: >-
      How should you reason about /user destinations when one user has several WebSocket sessions and the application runs on several nodes?
    answer: >-
      A /user destination is a logical address that Spring resolves into session-specific destinations. By default, a send to an authenticated user may reach all of that user's active sessions, while @SendToUser(broadcast = false) narrows a handler response to the originating session. In a multi-node deployment, the node performing the send may not host the target session, so unresolved user-destination broadcasts and user-registry broadcasts can give other nodes a chance to resolve it through shared broker infrastructure. That mechanism solves routing discovery; it does not turn Spring Messaging into a distributed identity or session store.
    aiGenerated: true
    reviewed: false
