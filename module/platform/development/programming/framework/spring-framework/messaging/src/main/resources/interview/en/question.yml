  - question: >-
      How do @MessageMapping, return-value routing, @SendTo or @SendToUser, and SimpMessagingTemplate fit together, and when would you choose each one?
    answer: >-
      @MessageMapping handles inbound application destinations and lets Spring perform argument resolution and payload conversion before invoking application code. A return value is converted and sent through the messaging infrastructure; @SendTo customizes broker destinations, while @SendToUser targets the user associated with the input message. SimpMessagingTemplate is appropriate when sending happens outside the handler return path or when destinations must be selected programmatically. These are different entry points into the same messaging flow, so conversion errors, handler failures, and routing mistakes should be diagnosed at the stage where they occur.
