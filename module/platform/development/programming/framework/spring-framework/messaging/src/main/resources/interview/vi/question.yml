  - question: >-
      Hãy lần theo một STOMP SEND từ WebSocket client tới destination /app, đi qua handler dùng annotation của Spring rồi quay lại subscriber. Thành phần nào sở hữu từng chặng trong luồng này?
    answer: >-
      Spring giải mã dữ liệu WebSocket thành STOMP frame, biểu diễn frame đó thành Spring Message rồi đưa qua clientInboundChannel. Destination ứng dụng như /app được route tới handler dùng annotation, chẳng hạn @MessageMapping; kết quả từ handler hoặc message do application gửi sau đó được chuyển về phía broker qua brokerChannel. Simple broker hoặc broker relay thực hiện định tuyến subscription, rồi message phù hợp đi qua clientOutboundChannel tới WebSocket session. Lần theo các channel này đáng tin cậy hơn việc chỉ suy luận từ endpoint URL hoặc annotation.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.StompMessageFlow/StompMessageFlow.md"
      anchor: "application-message-flow"
    apiRelated:
      controller: "StompExperimentController"
      methodSignature: "roundTrip()"

  - question: >-
      @MessageMapping, return-value routing, @SendTo hoặc @SendToUser và SimpMessagingTemplate liên hệ với nhau thế nào, và khi nào nên chọn từng cách?
    answer: >-
      @MessageMapping xử lý inbound application destination và cho Spring thực hiện argument resolution cùng payload conversion trước khi gọi application code. Return value được convert rồi gửi qua messaging infrastructure; @SendTo tùy biến broker destination, còn @SendToUser nhắm tới user gắn với input message. SimpMessagingTemplate phù hợp khi việc gửi xảy ra ngoài luồng trả về của handler hoặc khi destination cần được chọn bằng code. Đây là các cách đi vào cùng một messaging flow, nên conversion error, handler failure và routing mistake cần được chẩn đoán đúng tại giai đoạn phát sinh.
