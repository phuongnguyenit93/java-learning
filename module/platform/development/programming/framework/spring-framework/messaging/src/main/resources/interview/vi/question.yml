  - question: >-
      Trong Spring RSocket, vì sao thay đổi handler signature từ một value sang stream có thể làm thay đổi interaction ở mức protocol, và tại sao cardinality của requester với responder phải tương thích?
    answer: >-
      Spring suy ra RSocket interaction từ input/output cardinality thay vì từ tên method. Một input và một output tương ứng request-response; một input và nhiều output tương ứng request-stream; input nhiều value chọn request-channel; trường hợp output bằng zero có thể là fire-and-forget hoặc request-response không trả value tùy operation phía requester. Vì vậy đổi Mono thành Flux có thể thay đổi protocol contract thể hiện trên wire. Cách requester nhận dữ liệu và responder signature phải mô tả cardinality tương thích, nếu không hai peer đang hiểu khác nhau về interaction đang thực hiện.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "12.RSocketResponders/RSocketResponders.md"
      anchor: "rsocket-interaction-cardinality"
    apiRelated:
      controller: "RSocketExperimentController"
      methodSignature: "interactionCardinality()"

  - question: >-
      Requester/responder symmetry trong RSocket có nghĩa gì, và @ConnectMapping cùng metadata tham gia vào connection lifecycle như thế nào mà không trở thành handler cho request thông thường?
    answer: >-
      Sau setup, mỗi peer đều có thể khởi tạo RSocket interaction, vì vậy server có thể giữ RSocketRequester gắn với peer rồi gọi các route do client responder cung cấp. @ConnectMapping xử lý frame cấp connection như SETUP và METADATA_PUSH, phải hoàn tất setup trước khi các request thông thường tiếp tục và không được trả application response data. Routing, security material, tracing cùng các metadata khác được encode theo MIME-type contract và cần strategy tương thích để decode hoặc extract thành Spring header. Vì vậy setup và metadata thuộc connection contract, còn @MessageMapping tiếp tục xử lý request interaction thông thường.
