  - question: >-
      Với một hệ thống mới, bạn sẽ chọn raw WebSocket, STOMP over WebSocket, RSocket hay handoff sang Spring Integration như thế nào, và sau khi đã chọn STOMP vẫn còn quyết định kiến trúc nào phải đưa ra riêng?
    answer: >-
      Raw WebSocket phù hợp khi application muốn tự định nghĩa duplex text/binary protocol và chấp nhận tự sở hữu framing, routing, error cùng compatibility. STOMP phù hợp với destination/subscription và broker-oriented pub/sub; RSocket phù hợp với requester/responder multiplexed và reactive streaming có network-level demand. Khi bài toán chính trở thành ghép adapter, router, filter, transformation và nhiều external system thành flow, phạm vi Spring Integration sẽ phù hợp hơn. Nếu chọn STOMP, thiết kế vẫn phải quyết định riêng giữa simple broker chạy trong process và external broker relay dựa trên yêu cầu scale cùng delivery semantics.
    aiGenerated: true
