  - question: >-
      Bạn sẽ chọn built-in simple broker hay external STOMP broker relay như thế nào, và STOMP acknowledgement hoặc receipt cho thấy điều gì về ranh giới trách nhiệm giữa Spring và broker?
    answer: >-
      Simple broker là subscription router chạy trong process, phù hợp cho broadcast cơ bản và không cần cluster, nhưng không cung cấp đầy đủ broker feature như STOMP acknowledgement hoặc receipt và cũng không chia sẻ subscription state giữa nhiều application instance. Broker relay thường phù hợp khi cần scale ngang hoặc cần broker feature đầy đủ hơn, nhưng external broker vẫn quyết định durability, vòng đời queue, acknowledgement semantics và hành vi đặc thù nhà cung cấp. Vì vậy bật relay không tự biến receipt hay acknowledgement thành bảo đảm reliability end-to-end; application, client và cấu hình broker vẫn phải thống nhất hợp đồng delivery mong muốn.
    aiGenerated: true
    reviewed: false
    readmeRelated:
