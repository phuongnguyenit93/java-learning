questions:
  - question: >-
      Khi thiết kế một tính năng real-time, bạn sẽ giải thích ranh giới của Spring Messaging như thế nào và dựa vào đâu để biết khi nào bài toán đã thuộc về module Spring lân cận hoặc thuộc về chính broker?
    answer: >-
      Spring Messaging sở hữu mô hình trung lập với transport gồm Message, channel, handler, conversion, interception cùng các mô hình lập trình WebSocket/STOMP và RSocket của Spring Framework. Spring Integration sở hữu Enterprise Integration Patterns và các flow tích hợp, Spring Security sở hữu policy xác thực/phân quyền, Spring Session sở hữu vòng đời HTTP session, còn Spring Web MVC/WebFlux sở hữu web stack của chúng. Durability, acknowledgement, vòng đời queue, clustering và routing đặc thù nhà cung cấp vẫn là trách nhiệm của broker. Thiết kế sẽ dễ phân tích hơn khi mỗi yêu cầu được giao cho đúng tầng thực sự kiểm soát hành vi đó.
