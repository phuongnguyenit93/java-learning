  - question: >-
      Khi broker bị outage, vì sao Spring STOMP broker relay có thể tự phục hồi system connection nhưng các client session hiện hữu vẫn phải reconnect, và application nên phản ứng vận hành như thế nào?
    answer: >-
      Relay duy trì một system connection dùng chung cho traffic xuất phát từ server và các broker connection riêng gắn với từng STOMP client session. Spring tự retry system connection dùng chung, nhưng không tái tạo các broker connection theo từng client, nên client bị ảnh hưởng phải reconnect và tạo session mới. BrokerAvailabilityEvent hữu ích để tạm dừng hoặc từ chối các lần gửi từ server khi system connection chưa sẵn sàng, nhưng việc reconnect tự nó không làm các message sinh ra trong thời gian outage trở nên durable. Application vẫn phải có policy fail, buffer, retry hoặc drop rõ ràng theo business semantics.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "13.OperationsTestingDecisions/OperationsTestingDecisions.md"
      anchor: "broker-availability-recovery"
    apiRelated:
      controller: ""
