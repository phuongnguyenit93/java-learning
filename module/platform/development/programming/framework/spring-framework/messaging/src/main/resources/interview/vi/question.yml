  - question: >-
      Vì sao cấu hình một Executor cho ExecutorSubscribableChannel chưa đủ để khẳng định việc chuyển giao là bất đồng bộ, và những hành vi nào có thể thay đổi khi thật sự chuyển sang luồng khác?
    answer: >-
      Khi không có Executor, ExecutorSubscribableChannel gọi handler trên chính luồng gửi. Khi có Executor, việc gọi handler được giao cho executor đó, nhưng một executor như SyncTaskExecutor vẫn có thể chạy đồng bộ trên luồng gọi. Việc chuyển thật sự sang luồng khác có thể làm send trả về trước khi handler hoàn tất, chuyển lỗi sang executor task, làm mất ThreadLocal thông thường và thay đổi ordering theo semantics của executor. Vì vậy cần nhìn vào hành vi của executor cụ thể thay vì chỉ nhìn thấy một đối tượng Executor.
    aiGenerated: true
    reviewed: false
