  - question: >-
      Interception, executor thread boundary, ordering control, security và HTTP-session integration gặp nhau ở đâu trong một STOMP connection sống lâu, và trách nhiệm nào cần được giữ tách biệt?
    answer: >-
      ChannelInterceptor chạy quanh thao tác send của channel, còn ExecutorChannelInterceptor bao quanh handler execution trên executor worker nên phù hợp với execution context gắn theo thread. Inbound và outbound executor chạy song song có thể làm thay đổi thứ tự xử lý, vì vậy các tùy chọn preserve receive/publish order chỉ nên bật khi semantics theo từng session thực sự yêu cầu. Identity thường đi vào từ WebSocket handshake đã xác thực; Spring Security sở hữu authorization policy, còn Spring Session sở hữu phần tích hợp giữa vòng đời HTTP session và WebSocket activity. Dồn các trách nhiệm này vào một interceptor sẽ làm ordering, context propagation và policy khó chẩn đoán hơn.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: ""
      anchor: ""
    apiRelated:
      controller: ""
