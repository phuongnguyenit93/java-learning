  - question: >-
      Nếu messaging application chạy đúng ở môi trường development nhưng lỗi dưới tải lớn, bạn sẽ kiểm tra những vấn đề vận hành và testing nào trước khi thay đổi business logic?
    answer: >-
      Trước hết cần xem executor capacity, queue growth, blocking work, rejection behavior và chi phí fan-out trên clientInboundChannel/clientOutboundChannel. Với STOMP/WebSocket, cần kiểm tra slow client, send-time/send-buffer limit, message-size limit, broker availability, connection lifecycle và broker stats; với RSocket còn phải xem demand, cancellation, codec, metadata và requester lifecycle. Focused test nên kiểm tra routing, conversion, handler và infrastructure mà không bắt buộc mở network khi có thể, còn một tập end-to-end nhỏ nên chứng minh wiring WebSocket/STOMP hoặc RSocket thật. Load test cần dùng payload size, connection count và slow-consumer pattern gần production vì giới hạn tài nguyên thường hỏng trước business handler.
    aiGenerated: true
    reviewed: false
