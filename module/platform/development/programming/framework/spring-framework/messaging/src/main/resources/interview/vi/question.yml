  - question: >-
      Nên phân tích /user destination như thế nào khi một user có nhiều WebSocket session và application chạy trên nhiều node?
    answer: >-
      /user destination là địa chỉ logic mà Spring resolve thành các destination gắn với session cụ thể. Mặc định, một message gửi tới authenticated user có thể tới tất cả session đang hoạt động của user đó, còn @SendToUser(broadcast = false) giới hạn handler response về đúng session khởi tạo request. Trong deployment nhiều node, node đang gửi có thể không giữ session đích, nên unresolved user-destination broadcast và user-registry broadcast cho phép các node khác thử resolve thông qua shared broker infrastructure. Cơ chế đó giải quyết việc tìm nơi định tuyến chứ không biến Spring Messaging thành distributed identity hoặc session store.
