  - id: core-container-q08-default-application-events
    question: "Với SimpleApplicationEventMulticaster mặc định của Spring, publisher thường nên kỳ vọng gì khi gọi publishEvent(...) ?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.ApplicationContextServices/ApplicationContextServices.md"
      anchor: "application-events"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Matching listener được đưa vào durable queue để publishEvent return trước khi listener local bắt đầu chạy."
        explanation: "Sai. Application event không phải durable broker abstraction, và default multicaster chạy đồng bộ."
      - id: B
        answer: "Matching listener chạy trên Spring worker pool riêng nên không bao giờ thấy publisher-thread context."
        explanation: "Sai. Default multicaster gọi listener ngay trên publishing thread nếu không được cấu hình khác."
      - id: C
        answer: "Event được persist cho đến khi mọi listener acknowledge, nên có retry semantics qua process failure."
        explanation: "Sai. ApplicationContext event mechanism không cam kết persistence, acknowledgement hay cross-process retry."
      - id: D
        answer: "Matching listener được gọi đồng bộ trên publishing thread, nên latency và failure của listener mặc định là một phần của publish call."
        explanation: "Đúng. Đây là in-process observer behavior mặc định của SimpleApplicationEventMulticaster."
    correctAnswerId: D

  - id: core-container-q09-post-processor-boundary
    question: "Phân biệt nào giữa BeanFactoryPostProcessor và BeanPostProcessor là đúng?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.ExtensionPoints/ExtensionPoints.md"
      anchor: "extension-point-purpose"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "BeanFactoryPostProcessor làm việc với definition metadata trước ordinary bean creation, còn BeanPostProcessor tham gia quanh initialization của bean instance."
        explanation: "Đúng. Một bên làm việc trên container model; bên kia tham gia lifecycle của bean instance đã được tạo."
      - id: B
        answer: "BeanFactoryPostProcessor wrap bean instance sau initialization, còn BeanPostProcessor chỉ thay đổi BeanDefinition metadata."
        explanation: "Sai. Phát biểu này đảo vai trò chính của hai extension point."
      - id: C
        answer: "Cả hai chỉ chạy sau khi mọi singleton đã initialized; khác nhau chủ yếu ở ordering metadata."
        explanation: "Sai. Factory post-processing diễn ra trước ordinary bean instantiation, còn bean post-processing tham gia trong quá trình tạo bean."
      - id: D
        answer: "Cả hai là service-layer callback dùng để chạy business logic trong ApplicationContext startup."
        explanation: "Sai. Chúng là container infrastructure extension point, không phải cơ chế thay thế application workflow."
    correctAnswerId: A

  - id: core-container-q10-diagnose-init-failure
    question: "Bean definition tồn tại, dependency resolution thành công, construction thành công, nhưng @PostConstruct ném exception. Nhóm chẩn đoán nào nên được kiểm tra trước?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "10.ContainerDesignAndDiagnostics/ContainerDesignAndDiagnostics.md"
      anchor: "startup-failure-diagnosis"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Registration failure, vì bean definition chưa được load vào factory."
        explanation: "Sai. Tình huống đã nói definition tồn tại và bean đã đi tới giai đoạn construction."
      - id: B
        answer: "Lifecycle hoặc initialization failure, vì exception xảy ra trong initialization callback."
        explanation: "Đúng. Nên xác định phase container bị lỗi trước khi thay đổi registration hay autowiring metadata."
      - id: C
        answer: "Candidate-selection failure, vì @PostConstruct chạy trước khi Spring biết candidate dependency nào cần inject."
        explanation: "Sai. Dependency resolution và population xảy ra trước normal initialization callback."
      - id: D
        answer: "Scope mismatch, vì mọi initialization exception đều có nghĩa singleton đã giữ shorter-lived bean."
        explanation: "Sai. Scope mismatch chỉ là một dạng graph-design problem, không phải lời giải thích chung cho init callback ném exception."
    correctAnswerId: B
