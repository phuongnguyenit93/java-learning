  - question: "Compare BeanFactoryPostProcessor, BeanPostProcessor, and FactoryBean. What does each extend, and why is premature bean creation dangerous while the processor chain is still being assembled?"
    answer: "BeanFactoryPostProcessor operates on configuration metadata after definitions are loaded but before ordinary bean creation; it is the right level for changing the container model. BeanPostProcessor participates in the lifecycle of bean instances before and after initialization and can inspect, wrap, or replace the exposed instance. FactoryBean is different again: it is a Spring-managed factory object whose bean name normally resolves to the product returned by getObject(), while the & prefix addresses the factory itself. Pulling ordinary application beans too early from a factory post-processor or from infrastructure being created during bootstrap can instantiate them before all BeanPostProcessors are registered, so they may miss annotation processing, proxying, or other infrastructure. These hooks are powerful because they operate on container mechanics, which is also why ordinary business services should not use them as workflow callbacks."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: ""
