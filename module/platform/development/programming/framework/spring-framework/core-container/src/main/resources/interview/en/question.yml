  - question: "Why are Spring ApplicationContext events not a substitute for a durable message broker? Explain the default synchronous behavior and the design consequences for a publisher."
    answer: "ApplicationContext events are an in-process observer mechanism. With the default SimpleApplicationEventMulticaster, matching listeners are invoked synchronously in the publishing thread, so publishEvent does not return until those listeners finish. That means listener latency and failures are part of the publisher call unless the multicaster or error strategy is deliberately changed, and publisher-thread context can be visible to the listener. The mechanism does not promise persistence, acknowledgements, cross-process delivery, or retry after process failure. It is a good fit for decoupled local reactions; durable integration messaging belongs to the messaging/broker boundary."
    aiGenerated: true
    reviewed: false
    readmeRelated:
