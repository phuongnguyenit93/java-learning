questions:
  - question: "Explain the difference between full and lite @Configuration semantics. Why can the same direct inter-@Bean call produce different object identity, and what configuration style avoids depending on that interception?"
    answer: "With full @Configuration semantics, Spring enhances the configuration class and can intercept calls between overridable instance @Bean methods. A direct call such as service() calling repository() is therefore routed through the container, so a singleton repository can resolve to the managed instance. With proxyBeanMethods=false, the configuration class is processed in lite mode and that same source-level call is an ordinary Java method call, so it can construct another object outside the managed singleton lookup path. The experiment demonstrates exactly that identity difference. Parameter injection makes the dependency edge explicit and does not rely on cross-method interception, so it is usually the clearer style when bean methods are intended to behave as independent factories."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.BeanRegistration/BeanRegistration.md"
      anchor: "full-vs-lite-configuration"
    apiRelated:
      controller: "ConfigurationExperimentController"
      methodSignature: "observeConfigurationIdentity()"

  - question: "A Spring context fails during refresh. How would you distinguish a missing dependency, an ambiguous dependency, and a constructor cycle, and how should the fix differ for each?"
    answer: "I would classify the deepest relevant cause instead of adding annotations blindly. A missing dependency means no eligible bean satisfies the required injection point; I would check registration, scan boundaries, conditions, type, and qualifier metadata. An ambiguous dependency means several beans remain eligible for one single-valued injection point; I would introduce a deliberate default with @Primary or a semantic constraint with @Qualifier rather than deleting a valid bean. A constructor cycle means A cannot be created without B while B cannot be created without A; the fix is usually to redesign the dependency graph, not to select another candidate. The module experiment makes these three shapes observable as NoSuchBeanDefinitionException, NoUniqueBeanDefinitionException, and BeanCurrentlyInCreationException inside their respective exception chains."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.DependencyInjection/DependencyInjection.md"
      anchor: "dependency-resolution-failures"
    apiRelated:
      controller: "DependencyFailureExperimentController"
      methodSignature: "observeDependencyFailure(DependencyFailureScenario)"

  - question: "Why does injecting a prototype directly into a singleton not give the singleton a fresh prototype on every use? Compare that with ObjectProvider and a scoped proxy."
    answer: "A prototype scope controls what happens when the container resolves that bean definition. Direct constructor injection into a singleton performs that resolution while the singleton is being created, and the singleton then stores one ordinary Java reference; nothing re-injects that field on each method call. ObjectProvider keeps resolution explicit and lets the consumer ask the container for a target later, so repeated getObject() calls can obtain fresh prototype instances. A scoped proxy instead injects one stable proxy and delegates each invocation to the target associated with the current scope. ObjectProvider exposes the lookup in the consumer API, while a scoped proxy hides most of the lookup behind proxy semantics. The right choice depends on whether explicit deferred resolution or transparent scope indirection is clearer for the design."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.BeanScope/BeanScope.md"
      anchor: "scoped-dependency-mismatch"
    apiRelated:
      controller: "ScopeExperimentController"
      methodSignature: "observeScopeIdentity()"

  - question: "Walk through the initialization and destruction order when a bean uses @PostConstruct, InitializingBean, custom init, @PreDestroy, DisposableBean, and custom destroy callbacks. Why is that ordering useful to reason about?"
    answer: "For the combined mechanisms demonstrated here, initialization proceeds through @PostConstruct, InitializingBean.afterPropertiesSet(), and then the custom init method after the bean has been instantiated, populated, and received its Aware callbacks. Destruction proceeds through @PreDestroy, DisposableBean.destroy(), and then the custom destroy method when the owning context closes. The order matters because the callbacks are not interchangeable: later initialization callbacks may rely on invariants established earlier, and destruction should release resources in a predictable shutdown phase. The experiment records both traces and verifies the expected ordering instead of treating lifecycle as a list of unrelated annotations and interfaces."
    aiGenerated: true
    reviewed: false
