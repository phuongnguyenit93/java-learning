  - question: "How would you explain the boundary among Environment, PropertySource, profiles, property placeholders, and SpEL? Which problems should remain outside this Core Container module?"
    answer: "Environment is the container abstraction that exposes profiles and property resolution, while PropertySource represents an individual source of key-value data searched through that environment. Profiles are registration conditions: they decide whether definitions participate in a particular environment and should not replace runtime business branching. Property placeholders perform key lookup, optionally with defaults, whereas SpEL evaluates expressions over an object/evaluation context and should be reserved for cases that genuinely need expression semantics. This module owns those Spring Framework mechanisms. Spring Boot Config Data, @ConfigurationProperties, and Boot-specific externalized-configuration precedence belong to the Spring Boot configuration curriculum rather than being folded into the Core Container model."
    aiGenerated: true
    reviewed: false
