  - question: "Give an end-to-end mental model for diagnosing a Spring Core Container startup failure before changing configuration. How does that model help keep application code container-agnostic?"
    answer: "I trace the flow from configuration sources to BeanDefinition metadata, factory post-processing, dependency resolution, bean instantiation and population, initialization/post-processing, the exposed ApplicationContext graph, and finally shutdown/destruction. I first locate the failing phase: missing definitions point to registration, several eligible beans point to candidate selection, constructor cycles or scope mismatches point to graph design, exceptions from init callbacks point to lifecycle, premature creation points to bootstrap/extension infrastructure, and wrong profiles or properties point to Environment configuration. This phase-oriented model avoids random annotation changes. At the application layer I still prefer constructor injection and narrow Java-facing dependencies so services can be instantiated and tested without calling ApplicationContext or BeanFactory directly; container lookup and Aware contracts should remain deliberate infrastructure choices."
    aiGenerated: true
    reviewed: false
