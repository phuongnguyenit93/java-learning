  - question: "Một Spring context fail trong lúc refresh. Bạn phân biệt missing dependency, ambiguous dependency và constructor cycle như thế nào, và cách sửa của ba trường hợp khác nhau ra sao?"
    answer: "Tôi tìm nguyên nhân sâu nhất liên quan trực tiếp đến failure thay vì thêm annotation một cách ngẫu nhiên. Missing dependency nghĩa là không có bean hợp lệ nào thỏa injection point bắt buộc; cần kiểm tra registration, scan boundary, condition, type và qualifier metadata. Ambiguous dependency nghĩa là còn nhiều bean cùng hợp lệ cho một single-valued injection point; nên chọn một mặc định có chủ đích bằng @Primary hoặc thu hẹp candidate theo vai trò bằng @Qualifier thay vì xóa một bean hợp lệ. Constructor cycle nghĩa là A không thể tạo nếu thiếu B trong khi B cũng không thể tạo nếu thiếu A; cách sửa thường là thiết kế lại dependency graph chứ không phải chọn candidate khác. Experiment của module làm ba dạng này quan sát được qua NoSuchBeanDefinitionException, NoUniqueBeanDefinitionException và BeanCurrentlyInCreationException trong exception chain tương ứng."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.DependencyInjection/DependencyInjection.md"
      anchor: "dependency-resolution-failures"
    apiRelated:
      controller: "DependencyFailureExperimentController"
      methodSignature: "observeDependencyFailure(DependencyFailureScenario)"

  - question: "Vì sao inject prototype trực tiếp vào singleton không làm singleton nhận prototype mới ở mỗi lần dùng? Hãy so sánh cách đó với ObjectProvider và scoped proxy."
    answer: "Prototype scope quyết định điều gì xảy ra khi container resolve bean definition đó. Direct constructor injection vào singleton thực hiện resolution khi singleton được tạo, rồi singleton giữ một Java reference thông thường; không có cơ chế tự re-inject field sau mỗi method call. ObjectProvider giữ deferred resolution một cách tường minh và cho consumer yêu cầu target về sau, nên nhiều lần getObject() có thể nhận các prototype instance mới. Scoped proxy dùng cách khác: consumer nhận một proxy ổn định, còn mỗi invocation được delegate tới target gắn với scope hiện tại. ObjectProvider làm lookup hiện rõ trong API của consumer, còn scoped proxy che phần lớn lookup phía sau proxy semantics. Chọn cơ chế dựa trên việc explicit deferred resolution hay transparent scope indirection làm thiết kế dễ hiểu hơn."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.BeanScope/BeanScope.md"
      anchor: "scoped-dependency-mismatch"
    apiRelated:
      controller: "ScopeExperimentController"
      methodSignature: "observeScopeIdentity()"

  - question: "Hãy mô tả thứ tự initialization và destruction khi bean dùng @PostConstruct, InitializingBean, custom init, @PreDestroy, DisposableBean và custom destroy callback. Vì sao thứ tự đó quan trọng khi reasoning về lifecycle?"
    answer: "Trong tổ hợp cơ chế được minh họa ở đây, initialization đi qua @PostConstruct, InitializingBean.afterPropertiesSet(), rồi custom init method sau khi bean đã được instantiate, populate dependency và nhận Aware callback. Khi context sở hữu bean đóng, destruction đi qua @PreDestroy, DisposableBean.destroy(), rồi custom destroy method. Thứ tự quan trọng vì các callback không phải những hook có thể hoán đổi tùy ý: bước initialization sau có thể dựa trên invariant do bước trước thiết lập, còn destruction cần giải phóng resource ở shutdown phase có thể dự đoán. Experiment ghi lại cả hai trace và kiểm tra đúng thứ tự thay vì xem lifecycle chỉ là danh sách annotation/interface rời rạc."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: ""
      anchor: ""
    apiRelated:
      controller: "LifecycleExperimentController"
      methodSignature: "observeLifecycleCallbacks()"

  - question: "Bạn sẽ giải thích ranh giới giữa Environment, PropertySource, profile, property placeholder và SpEL như thế nào? Những vấn đề nào nên nằm ngoài module Core Container này?"
    answer: "Environment là abstraction của container cho profile và property resolution, còn PropertySource biểu diễn một nguồn key-value riêng được tìm kiếm qua Environment. Profile là registration condition: nó quyết định definition nào tham gia trong một environment và không nên thay thế runtime business branching. Property placeholder thực hiện key lookup, có thể có default; SpEL đánh giá expression trên object/evaluation context và chỉ nên dùng khi thật sự cần expression semantics. Module này sở hữu các cơ chế Spring Framework đó. Spring Boot Config Data, @ConfigurationProperties và Boot-specific externalized-configuration precedence thuộc curriculum Spring Boot configuration, không nên bị trộn vào Core Container."
