  - question: "Hãy đưa ra mental model end-to-end để chẩn đoán một Spring Core Container startup failure trước khi đổi configuration. Mental model đó giúp giữ application code ít phụ thuộc container như thế nào?"
    answer: "Tôi lần theo luồng từ configuration source tới BeanDefinition metadata, factory post-processing, dependency resolution, bean instantiation và population, initialization/post-processing, exposed ApplicationContext graph, rồi shutdown/destruction. Trước hết xác định phase lỗi: thiếu definition thường là registration; nhiều bean cùng hợp lệ là candidate selection; constructor cycle hoặc scope mismatch là dependency-graph design; exception từ init callback là lifecycle; premature creation là bootstrap/extension infrastructure; profile/property sai là Environment configuration. Mô hình theo phase giúp tránh sửa annotation ngẫu nhiên. Ở application layer, tôi vẫn ưu tiên constructor injection và dependency Java hẹp để service có thể được tạo/test mà không gọi ApplicationContext hay BeanFactory trực tiếp; container lookup và Aware contract chỉ nên là lựa chọn infrastructure có chủ đích."
    aiGenerated: true
