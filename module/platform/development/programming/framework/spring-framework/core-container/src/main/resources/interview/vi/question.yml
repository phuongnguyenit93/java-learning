  - question: "Vì sao ApplicationContext event của Spring không thay thế durable message broker? Hãy giải thích behavior đồng bộ mặc định và hệ quả thiết kế đối với publisher."
    answer: "ApplicationContext event là cơ chế observer trong cùng process. Với SimpleApplicationEventMulticaster mặc định, matching listener được gọi đồng bộ trên publishing thread, nên publishEvent không return cho đến khi các listener đó hoàn tất. Vì vậy latency và failure của listener mặc định là một phần của publisher call, và listener có thể thấy execution context của publisher thread. Cơ chế này không cam kết persistence, acknowledgement, cross-process delivery hay retry sau process failure. Nó phù hợp cho local reaction cần decouple; durable integration messaging thuộc ranh giới messaging/broker."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.ApplicationContextServices/ApplicationContextServices.md"
      anchor: "application-events"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: "So sánh BeanFactoryPostProcessor, BeanPostProcessor và FactoryBean. Mỗi cơ chế mở rộng phần nào của container, và vì sao premature bean creation nguy hiểm khi processor chain còn đang được dựng?"
    answer: "BeanFactoryPostProcessor làm việc với configuration metadata sau khi definition được load nhưng trước ordinary bean creation; đây là tầng phù hợp để thay đổi container model. BeanPostProcessor tham gia lifecycle của bean instance trước và sau initialization, có thể inspect, wrap hoặc thay exposed instance. FactoryBean lại khác: nó là factory object do Spring quản lý, trong đó bean name thông thường resolve tới product từ getObject(), còn prefix & dùng để lấy chính factory. Nếu factory post-processor hoặc infrastructure đang bootstrap kéo ordinary application bean vào quá sớm, bean đó có thể được tạo trước khi mọi BeanPostProcessor được đăng ký, nên có thể bỏ lỡ annotation processing, proxying hoặc infrastructure khác. Các hook này mạnh vì chúng can thiệp container mechanics; đó cũng là lý do business service thông thường không nên dùng chúng như workflow callback."
    aiGenerated: true
    reviewed: false
