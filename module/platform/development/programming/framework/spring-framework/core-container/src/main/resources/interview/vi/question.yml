questions:
  - question: "Giải thích sự khác nhau giữa full và lite @Configuration. Vì sao cùng một direct inter-@Bean call có thể cho object identity khác nhau, và kiểu cấu hình nào giúp không phụ thuộc vào interception đó?"
    answer: "Với full @Configuration, Spring enhance configuration class và có thể intercept lời gọi giữa các instance @Bean method có thể override. Vì vậy khi service() gọi trực tiếp repository(), lời gọi có thể đi qua container và singleton repository được resolve về managed instance. Với proxyBeanMethods=false, class được xử lý theo lite mode và cùng lời gọi trong source trở thành Java method call thông thường, nên nó có thể tạo object khác ngoài managed singleton lookup path. Experiment của module chứng minh đúng khác biệt identity này. Parameter injection làm dependency edge hiện rõ và không phụ thuộc vào cross-method interception, nên thường là cách rõ ràng hơn khi các bean method được thiết kế như những factory độc lập."
    aiGenerated: true
    reviewed: false
