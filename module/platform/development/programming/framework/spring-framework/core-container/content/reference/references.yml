references:
  - title: "Spring Framework — Bean Overview"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/definition.html"
    description: "BeanDefinition, bean name, dependencies và cách IoC container quản lý các thành phần ứng dụng."
  - title: "Spring Framework — Dependency Injection"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/dependencies/factory-collaborators.html"
    description: "Constructor injection, setter injection, vòng phụ thuộc và cơ chế lắp ráp dependency trong container."
  - title: "Spring Framework — Bean Scopes"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/factory-scopes.html"
    description: "Singleton, prototype, request, session, application, websocket và phạm vi vòng đời của bean."
  - title: "Spring Framework — Using @Autowired"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/autowired.html"
    description: "Tiêm phụ thuộc qua constructor, method hoặc field; optional dependencies và quy tắc lựa chọn bean."
  - title: "Spring Framework — Autowiring Qualifiers"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/annotation-config/autowired-qualifiers.html"
    description: "Dùng @Qualifier để thu hẹp ứng viên khi có nhiều bean cùng type và giải quyết ambiguity."
  - title: "Spring Framework — Classpath Scanning and Managed Components"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/classpath-scanning.html"
    description: "Component scanning, stereotype annotations, filter và tự động phát hiện bean definitions."
  - title: "Spring Framework — Using the @Bean Annotation"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/java/bean-annotation.html"
    description: "Khai báo bean bằng Java config, inject tham số phương thức factory và tùy chỉnh init/destroy."
  - title: "Spring Framework — Using the @Configuration Annotation"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/java/configuration-annotation.html"
    description: "Cấu hình container bằng @Configuration, quan hệ giữa các @Bean và hành vi gọi phương thức cấu hình."
  - title: "Spring Framework — Customizing the Nature of a Bean"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/factory-nature.html"
    description: "Vòng đời bean: @PostConstruct, @PreDestroy, InitializingBean, DisposableBean và Lifecycle."
  - title: "Spring Framework — Container Extension Points"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/factory-extension.html"
    description: "Phân biệt BeanPostProcessor xử lý bean instance với BeanFactoryPostProcessor xử lý definition metadata."
  - title: "Spring Framework — Environment Abstraction"
    url: "https://docs.spring.io/spring-framework/reference/core/beans/environment.html"
    description: "Environment, @Profile, property sources và độ ưu tiên cấu hình theo môi trường chạy."
