# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: dispatcher-mapping-adapter-roles
    question: "During a Spring MVC request, which description best separates HandlerMapping from HandlerAdapter?"
    answers:
      - {id: A, answer: "HandlerMapping selects and invokes the handler; HandlerAdapter mainly converts the handler's return value afterward.", explanation: "Incorrect. HandlerMapping identifies the handler and execution chain; HandlerAdapter is responsible for invoking the selected handler through the appropriate programming model."}
      - {id: B, answer: "HandlerMapping selects the handler and chain; HandlerAdapter invokes the selected handler through its supported model.", explanation: "Correct. The separation lets DispatcherServlet route first and then invoke different handler styles through matching adapters."}
      - {id: C, answer: "HandlerAdapter narrows the URL candidates first, then HandlerMapping invokes whichever handler the adapter supports.", explanation: "Incorrect. URL-to-handler selection belongs to HandlerMapping; HandlerAdapter is chosen after a handler has been selected."}
      - {id: D, answer: "HandlerMapping selects both the handler and its adapter; HandlerAdapter only marks which selected handler types MVC supports at runtime.", explanation: "Incorrect. DispatcherServlet selects an adapter after mapping, and that adapter actively invokes the handler."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.DispatcherServletLifecycle/DispatcherServletLifecycle.md", anchor: "handler-mapping-and-execution-chain"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: annotated-functional-coexistence
    question: "How should annotated controllers and WebMvc.fn functional endpoints be understood in the same Spring MVC application?"
    answers:
      - {id: A, answer: "Both use DispatcherServlet, but registering a RouterFunction disables @RequestMapping handler methods for that application context.", explanation: "Incorrect. Annotated and functional endpoint mappings can coexist in the same MVC application context."}
      - {id: B, answer: "Functional routes share MVC infrastructure but are converted into HandlerMethod instances before invocation, so both models use the same handler adapter.", explanation: "Incorrect. WebMvc.fn has its own router/handler abstractions and matching adapter rather than becoming an annotated HandlerMethod."}
      - {id: C, answer: "They can coexist only in separate DispatcherServlet application contexts so their handler mappings never participate in the same dispatch pipeline.", explanation: "Incorrect. They can coexist in the same DispatcherServlet context when routes do not conflict."}
      - {id: D, answer: "Both are Servlet-stack MVC models that can coexist in the same DispatcherServlet pipeline; they mainly differ in how routes and handlers are declared.", explanation: "Correct. The distinction is primarily programming style and composition, not Servlet MVC versus WebFlux."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.WebMvcFunctionalEndpoints/WebMvcFunctionalEndpoints.md", anchor: "annotated-and-functional-coexistence"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: mvc-validation-exception-paths
    question: "Which exception pairing matches the two validation paths exercised by the Web module?"
    answers:
      - {id: A, answer: "Invalid @RequestBody object constraints produce HandlerMethodValidationException, while a direct @Min parameter produces MethodArgumentNotValidException.", explanation: "Incorrect. This reverses the two MVC validation paths used by the experiments."}
      - {id: B, answer: "Both cases produce MethodArgumentNotValidException because both failures are detected before normal controller completion.", explanation: "Incorrect. Spring MVC 6.1 has a distinct built-in method-validation path with HandlerMethodValidationException."}
      - {id: C, answer: "Invalid @RequestBody object validation can raise MethodArgumentNotValidException; direct method constraints can raise HandlerMethodValidationException.", explanation: "Correct. The two exception types reflect individual argument object validation versus MVC method validation."}
      - {id: D, answer: "A direct parameter constraint is checked only when class-level @Validated creates an AOP proxy, so without it the @Min value reaches the handler.", explanation: "Incorrect. The module demonstrates Spring MVC 6.1 built-in method validation without class-level @Validated."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.MvcBindingValidation/MvcBindingValidation.md", anchor: "validation-exception-paths"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: mvc-406-vs-415
    question: "For the validated-body endpoint, which distinction between HTTP 406 and 415 is correct?"
    answers:
      - {id: A, answer: "406 means MVC cannot produce a response matching Accept; 415 means the request Content-Type is unsupported.", explanation: "Correct. The two statuses concern response representation selection and request-body media type respectively."}
      - {id: B, answer: "406 means the request Content-Type is unsupported; 415 means MVC cannot produce a response matching Accept.", explanation: "Incorrect. This swaps the request and response media-type directions."}
      - {id: C, answer: "406 means the body was decoded but failed validation; 415 means validation passed but response serialization failed.", explanation: "Incorrect. Validation errors are distinct from these media-type negotiation statuses."}
      - {id: D, answer: "406 means the JSON body is malformed; 415 means the JSON body is valid but no Bean Validation provider accepted it.", explanation: "Incorrect. Malformed content and Bean Validation failures have different MVC error paths."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.MessageConversionRepresentation/MessageConversionRepresentation.md", anchor: "content-negotiation-and-media-types"}
    apiRelated: {controller: "MvcInputExperimentController", methodSignature: "validatedBody(CreateOrderRequest)"}

  - id: mvc-exception-advice-resolution
    question: "A controller exception matches an @ExceptionHandler declared in an applicable @ControllerAdvice. What is the most accurate MVC interpretation?"
    answers:
      - {id: A, answer: "@ControllerAdvice handles the exception only after DispatcherServlet's HandlerExceptionResolver chain declines it.", explanation: "Incorrect. @ExceptionHandler methods in applicable advice are themselves reached through MVC exception resolution."}
      - {id: B, answer: "ResponseStatusExceptionResolver owns @ControllerAdvice methods and invokes them after mapping the exception to a status.", explanation: "Incorrect. @ExceptionHandler methods are handled by ExceptionHandlerExceptionResolver, not ResponseStatusExceptionResolver."}
      - {id: C, answer: "DispatcherServlet invokes the matching @ExceptionHandler directly before it consults any HandlerExceptionResolver implementation.", explanation: "Incorrect. @ExceptionHandler support participates through the resolver chain rather than bypassing it."}
      - {id: D, answer: "ExceptionHandlerExceptionResolver can call the matching @ExceptionHandler within the resolver chain to produce an MVC response.", explanation: "Correct. If no resolver handles the exception, it can continue out to the Servlet container instead."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.MvcErrorHandling/MvcErrorHandling.md", anchor: "exception-handler-and-controller-advice"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: async-callable-runtime-evidence
    question: "The async experiment records REQUEST on one container thread, Callable work on spring-web-mvc-1, and a later ASYNC dispatch. What does that evidence support?"
    answers:
      - {id: A, answer: "The request became a WebFlux pipeline because the original Servlet thread was released.", explanation: "Incorrect. Servlet async processing can release the initial thread without changing the application to WebFlux."}
      - {id: B, answer: "MVC ran the Callable on its configured AsyncTaskExecutor, then resumed the same request through Servlet ASYNC redispatch.", explanation: "Correct. The trace demonstrates the Servlet async lifecycle and executor handoff used for Callable results."}
      - {id: C, answer: "DispatcherServlet permanently leaves the request after Callable starts, so no MVC processing occurs after the worker completes.", explanation: "Incorrect. MVC resumes processing when the async result is dispatched back through the Servlet pipeline."}
      - {id: D, answer: "The worker thread proves that response writes are automatically non-blocking and provide reactive backpressure.", explanation: "Incorrect. Servlet async execution does not by itself provide WebFlux-style non-blocking I/O or backpressure."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.AsyncMvcStreaming/AsyncMvcStreaming.md", anchor: "servlet-async-lifecycle"}
    apiRelated: {controller: "AsyncMvcExperimentController", methodSignature: "callable()"}

  - id: filter-interceptor-placement
    question: "Which placement best matches a concern that must wrap the raw Servlet request before MVC handler selection, compared with one that needs the selected handler metadata?"
    answers:
      - {id: A, answer: "Use HandlerInterceptor at the raw pre-MVC boundary and Servlet Filter after mapping when handler metadata is available.", explanation: "Incorrect. This reverses their normal positions in the request pipeline."}
      - {id: B, answer: "Use HandlerInterceptor for both concerns because preHandle runs before controller invocation and therefore also before the Servlet filter chain.", explanation: "Incorrect. Interceptors run inside MVC dispatch, after the enclosing Servlet filter chain has already been entered."}
      - {id: C, answer: "Use a Servlet Filter at the outer container/request boundary and a HandlerInterceptor when selected MVC handler metadata matters.", explanation: "Correct. Filters sit outside MVC dispatch, while interceptors participate around mapped MVC handler execution."}
      - {id: D, answer: "Use HandlerFilterFunction for both concerns because it can wrap both annotated handlers and functional handlers at the Servlet boundary.", explanation: "Incorrect. HandlerFilterFunction belongs to functional routing and is not a Servlet-wide wrapper for annotated controllers."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.CrossCuttingRequestInfrastructure/CrossCuttingRequestInfrastructure.md", anchor: "filters-interceptors-and-placement"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: conditional-get-revalidation
    question: "A GET first returns 200 with ETag spring-web-cache-v1. A second GET sends the same validator in If-None-Match and receives 304 with no body. What is the best conclusion?"
    answers:
      - {id: A, answer: "The client revalidated the same representation, so the server could omit sending the representation body again.", explanation: "Correct. This is the expected conditional GET behavior when the validator still matches."}
      - {id: B, answer: "Spring Cache returned the controller result from its application-level method cache instead of running HTTP validation.", explanation: "Incorrect. HTTP conditional requests are a representation-caching mechanism distinct from the Spring Cache abstraction."}
      - {id: C, answer: "The 304 means Cache-Control freshness alone was sufficient, so the server ignored If-None-Match and did not compare the ETag.", explanation: "Incorrect. The experiment specifically exercises validator-based conditional request handling."}
      - {id: D, answer: "A matching If-None-Match should still return 200 with the same body; only If-Modified-Since can produce 304.", explanation: "Incorrect. If-None-Match is a standard validator for conditional GET and can produce 304 when it matches."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "11.WebSupportResourceDelivery/WebSupportResourceDelivery.md", anchor: "conditional-requests-and-http-caching"}
    apiRelated: {controller: "ConditionalCacheExperimentController", methodSignature: "conditional()"}

  - id: rest-client-retrieve-vs-exchange
    question: "A RestClient has a default status handler for error responses. How do retrieve() and exchange() differ in the module's 404 experiment?"
    answers:
      - {id: A, answer: "Both APIs must run the configured retrieve status handler before application code can inspect the response.", explanation: "Incorrect. exchange() gives its callback direct ownership of the response and does not apply retrieve status handlers."}
      - {id: B, answer: "exchange() applies the configured status handler before invoking its callback, while retrieve() lets body extraction decide whether 404 is an error.", explanation: "Incorrect. exchange() bypasses retrieve/default status handlers and gives the callback the raw response."}
      - {id: C, answer: "retrieve() ignores default status handlers, while exchange() always invokes them after its callback returns.", explanation: "Incorrect. This reverses the behavior demonstrated by the experiment."}
      - {id: D, answer: "retrieve() applies the configured status handler; exchange() lets its callback inspect the raw 404 and decide what to do.", explanation: "Correct. The experiment records configured-handler:404 for retrieve() and exchangeStatus=404 for exchange()."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "13.SynchronousHttpClients/SynchronousHttpClients.md", anchor: "status-and-error-handling"}
    apiRelated: {controller: "HttpClientExperimentController", methodSignature: "restClientStatus()"}

  - id: http-service-adapter-independence
    question: "The same EchoHttpService interface succeeds through both RestClientAdapter and RestTemplateAdapter. What does this primarily demonstrate?"
    answers:
      - {id: A, answer: "The interface automatically provides service discovery, retries, and circuit breaking regardless of the client underneath.", explanation: "Incorrect. Those policies are not supplied merely by declaring an HTTP Service Interface."}
      - {id: B, answer: "The same @HttpExchange interface contract stays fixed while HttpServiceProxyFactory executes it through different HttpExchangeAdapters.", explanation: "Correct. The experiment changes the synchronous adapter while preserving one interface contract."}
      - {id: C, answer: "RestTemplateAdapter internally upgrades calls to RestClient, so both proxies ultimately inherit the RestClient instance and its status policy.", explanation: "Incorrect. Each adapter delegates to its own configured underlying client rather than converting RestTemplate into RestClient."}
      - {id: D, answer: "RestTemplateAdapter supports only reactive return values, while RestClientAdapter is the synchronous adapter for ordinary return types.", explanation: "Incorrect. Both adapters demonstrated here are synchronous HttpExchangeAdapter implementations."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "14.HttpServiceInterfaces/HttpServiceInterfaces.md", anchor: "synchronous-http-client-adapters"}
    apiRelated: {controller: "HttpClientExperimentController", methodSignature: "httpServiceAdapters(String)"}
