  - question: >-
      Why does returning Callable from a Spring MVC controller not make the application equivalent to WebFlux, and what runtime evidence would you expect?
    answer: >-
      Callable uses Servlet asynchronous request processing. MVC can start async processing, release the original request thread, execute the Callable on an AsyncTaskExecutor, and later resume through an ASYNC redispatch before completing normal MVC response processing. That can improve thread usage for deferred work, but the application is still using the Servlet programming and I/O model; it does not automatically gain the fully reactive execution model or backpressure semantics of WebFlux. Useful evidence is a different executor thread for the Callable together with REQUEST and ASYNC dispatch entries for the same request. Production configuration also needs a bounded executor and deliberate timeout behavior.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.AsyncMvcStreaming/AsyncMvcStreaming.md"
      anchor: "async-mvc-vs-webflux"
    apiRelated:
      controller: "AsyncMvcExperimentController"
      methodSignature: "callable()"

  - question: >-
      How would you decide whether a cross-cutting web concern belongs in a Servlet Filter, HandlerInterceptor, controller advice, or another MVC extension point?
    answer: >-
      Place the concern at the narrowest lifecycle layer that owns the information it needs. A Servlet Filter is appropriate for container-level request and response wrapping before or outside MVC handler selection. A HandlerInterceptor is useful when the selected MVC handler and preHandle/postHandle/afterCompletion lifecycle matter. RequestBodyAdvice or ResponseBodyAdvice belongs around body conversion, while @ControllerAdvice is useful for controller-wide binding or exception concerns rather than as a universal request wrapper. Async dispatch matters because filters may run for multiple dispatcher types, and security policy belongs to Spring Security rather than being reinvented with an MVC interceptor. The decision should follow lifecycle ownership, not convenience.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "15.SpringWebSynthesis/SpringWebSynthesis.md"
      anchor: "filter-interceptor-and-advice-placement"
