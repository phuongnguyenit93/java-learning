questions:
  - question: >-
      Explain how DispatcherServlet coordinates HandlerMapping and HandlerAdapter, and why Spring MVC separates those responsibilities.
    answer: >-
      DispatcherServlet is the front controller. It first asks HandlerMapping implementations to identify a handler and build the execution chain for the current request. It then chooses a HandlerAdapter that knows how to invoke that handler model, such as an annotated HandlerMethod, and continues with argument resolution and return-value processing. Separating selection from invocation lets MVC support multiple handler styles without teaching DispatcherServlet the calling convention of every handler type. The mental model is routing first, invocation second.
    aiGenerated: true
