  - question: >-
      Explain how ETag or Last-Modified validators interact with Cache-Control and why a conditional request can produce 304 or 412.
    answer: >-
      Cache-Control communicates caching policy. ETag and Last-Modified are validators used to revalidate a stored representation; conditional headers can use those validators to express preconditions. For conditional GET or HEAD, a matching validator can let the server return 304 Not Modified without a representation body. For state-changing requests, conditional headers act as preconditions; when a required precondition is not satisfied, 412 Precondition Failed can be the correct result instead of 304. These HTTP semantics are separate from the Spring Cache abstraction, which caches application-level method results or values rather than HTTP representations.
    aiGenerated: true
    reviewed: false
    readmeRelated:
