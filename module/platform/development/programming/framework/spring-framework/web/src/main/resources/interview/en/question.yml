  - question: >-
      How do object validation, Spring MVC 6.1 built-in method validation, and class-level @Validated differ in a controller?
    answer: >-
      Object validation commonly starts at an argument resolver, for example @Valid on an @RequestBody or @ModelAttribute, and failures for that single object can surface as MethodArgumentNotValidException. Direct constraints on controller method parameters or the return value can activate Spring MVC 6.1 built-in method validation and produce HandlerMethodValidationException when errors are not handled locally. Class-level @Validated is a different path: it applies generic AOP method validation through a proxy. If you want the MVC 6.1 built-in method-validation model, class-level @Validated should not be used as though it were the same mechanism. Errors or BindingResult can also keep some validation failures local when placed immediately after the supported parameter and all relevant errors are handled there.
    aiGenerated: true
