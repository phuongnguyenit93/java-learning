  - question: >-
      A server-rendered form POST should avoid duplicate submission, show a one-time success message on the following GET, and render a logical view such as orders/detail. Explain the Spring MVC flow and how it differs from returning a response body.
    answer: >-
      Use the Post/Redirect/Get flow: after the POST succeeds, add the one-time message as a flash attribute through RedirectAttributes and return a redirect outcome such as redirect:/orders/{id}. The redirect makes the client issue a new GET. Spring carries the output FlashMap across that transition and the matching GET can receive the flash attribute without encoding it into the redirect URL; ordinary model state does not automatically survive as the same request state, and redirect attributes intended for the URL are a different mechanism. The GET can populate a Model and return a logical view name such as orders/detail. A ViewResolver then resolves that name to a View, which renders the model into the response. By contrast, @ResponseBody bypasses normal view resolution and writes a representation through message-conversion infrastructure. Flash data is short-lived transition state, not durable business state or a general session cache.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.ViewRenderingNavigation/ViewRenderingNavigation.md"
      anchor: "redirects-and-flash-attributes"
