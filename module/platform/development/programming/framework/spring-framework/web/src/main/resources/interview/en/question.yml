  - question: >-
      How would you compare direct RestClient usage with an @HttpExchange HTTP Service Interface, and what should neither abstraction be expected to provide automatically?
    answer: >-
      RestClient is a fluent synchronous client where the caller explicitly builds the request and chooses response handling such as retrieve() or the lower-level exchange() callback. An HTTP Service Interface moves the HTTP contract into annotated Java methods and lets HttpServiceProxyFactory execute that contract through an HttpExchangeAdapter such as RestClientAdapter or RestTemplateAdapter. The interface can reduce repetitive call-site code and keep one contract while changing the underlying supported adapter, but it does not make a remote call local or automatically provide service discovery, retries, circuit breaking, latency control, or business-level resilience policy. Those concerns still need deliberate ownership elsewhere in the architecture.
    aiGenerated: true
    reviewed: false
    readmeRelated:
