  - question: >-
      A JSON endpoint sometimes returns 415 and sometimes 406. How would you diagnose the two failures in Spring MVC?
    answer: >-
      Start by asking which direction of representation processing failed. A 415 Unsupported Media Type points at the request: the Content-Type does not identify a body format that MVC can read for the target Java type through its HttpMessageConverters. A 406 Not Acceptable points at the response side: the request was handled, but MVC cannot produce a representation compatible with the client's Accept header and the available converters or handlers. That distinction helps avoid debugging validation or controller logic when the request never reached that stage, or debugging request decoding when the failure is actually response negotiation.
    aiGenerated: true
    reviewed: false
    readmeRelated:
