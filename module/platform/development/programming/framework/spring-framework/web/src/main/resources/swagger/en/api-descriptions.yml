AsyncMvcExperimentController:
  callable():
    summary: Observe Callable thread handoff and ASYNC redispatch
    description: Return a Callable so Spring MVC releases the initial Servlet request
      thread, executes the result on the configured bounded AsyncTaskExecutor, and
      later performs an ASYNC redispatch. The response reports thread identities and
      the request-scoped dispatch trace.
