ConditionalCacheExperimentController:
  conditional():
    summary: Revalidate a response with ETag and Last-Modified
    description: Return a deterministic cacheable representation with ETag and Last-Modified
      validators. Repeating the request with the current If-None-Match value lets
      Spring MVC short-circuit normal body rendering with HTTP 304.
