HttpClientExperimentController:
  restClientStatus():
    summary: Compare RestClient retrieve status handling with exchange
    description: Call bounded localhost fixtures through one RestClient. retrieve()
      applies the configured default status handler to a 404 response, while exchange()
      receives the raw 404 and owns the status decision itself.
