  - question: >-
      Bạn quyết định một cross-cutting web concern nên nằm ở Servlet Filter, HandlerInterceptor, controller advice hay MVC extension point khác bằng cách nào?
    answer: >-
      Hãy đặt concern ở lifecycle layer hẹp nhất sở hữu thông tin mà nó cần. Servlet Filter phù hợp với container-level request/response wrapping trước hoặc bên ngoài MVC handler selection. HandlerInterceptor phù hợp khi cần selected MVC handler và lifecycle preHandle/postHandle/afterCompletion. RequestBodyAdvice hoặc ResponseBodyAdvice nằm quanh body conversion, còn @ControllerAdvice phù hợp cho binding hoặc exception concern trên nhiều controller chứ không phải universal request wrapper. Async dispatch cũng quan trọng vì filter có thể chạy ở nhiều dispatcher type, và security policy thuộc Spring Security thay vì tự dựng lại bằng MVC interceptor. Quyết định nên theo lifecycle ownership, không theo sự tiện tay.
    aiGenerated: true
