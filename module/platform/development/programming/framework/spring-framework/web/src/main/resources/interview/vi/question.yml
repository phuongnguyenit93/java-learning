  - question: >-
      Hãy giải thích ETag hoặc Last-Modified validator tương tác với Cache-Control ra sao và vì sao conditional request có thể trả 304 hoặc 412.
    answer: >-
      Cache-Control mô tả chính sách cache. ETag và Last-Modified là các validator dùng để revalidate representation đang lưu; các conditional header có thể dùng những validator đó để biểu diễn precondition. Với conditional GET hoặc HEAD, validator khớp có thể cho phép server trả 304 Not Modified mà không gửi representation body. Với request thay đổi trạng thái, conditional header hoạt động như precondition; khi điều kiện bắt buộc không còn đúng, 412 Precondition Failed có thể là kết quả phù hợp thay vì 304. Các semantics HTTP này khác Spring Cache abstraction, vốn cache application-level method result hoặc value chứ không phải HTTP representation.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "11.WebSupportResourceDelivery/WebSupportResourceDelivery.md"
      anchor: "conditional-requests-and-http-caching"
