questions:
  - question: >-
      Hãy giải thích DispatcherServlet phối hợp HandlerMapping và HandlerAdapter như thế nào, và vì sao Spring MVC tách hai trách nhiệm này.
    answer: >-
      DispatcherServlet là front controller. Trước hết nó hỏi các HandlerMapping để xác định handler và tạo execution chain cho request hiện tại. Sau đó nó chọn HandlerAdapter biết cách gọi đúng handler model, chẳng hạn annotated HandlerMethod, rồi tiếp tục argument resolution và return-value processing. Việc tách selection khỏi invocation giúp MVC hỗ trợ nhiều kiểu handler mà DispatcherServlet không phải biết calling convention của từng kiểu. Mental model ngắn gọn là route trước, invoke sau.
