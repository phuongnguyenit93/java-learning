  - question: >-
      Object validation, built-in method validation của Spring MVC 6.1 và class-level @Validated khác nhau như thế nào trong controller?
    answer: >-
      Object validation thường bắt đầu tại argument resolver, ví dụ @Valid trên @RequestBody hoặc @ModelAttribute, và lỗi của object riêng lẻ có thể xuất hiện dưới dạng MethodArgumentNotValidException. Direct constraint trên controller method parameter hoặc return value có thể kích hoạt built-in MVC method validation của Spring 6.1 và tạo HandlerMethodValidationException khi lỗi không được xử lý cục bộ. Class-level @Validated là đường khác: nó dùng generic AOP method validation qua proxy. Nếu muốn dùng built-in MVC 6.1 method-validation model thì không nên xem class-level @Validated như cùng một cơ chế. Errors hoặc BindingResult cũng có thể giữ một số validation failure ở local handler khi được đặt ngay sau parameter phù hợp và mọi lỗi liên quan đều được xử lý ở đó.
