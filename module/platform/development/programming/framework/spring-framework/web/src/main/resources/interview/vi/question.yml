  - question: >-
      Một form POST render phía server cần tránh submit lặp, hiển thị success message đúng một lần ở GET kế tiếp và render logical view như orders/detail. Hãy giải thích flow Spring MVC và điểm khác với việc trả response body.
    answer: >-
      Hãy dùng Post/Redirect/Get: sau khi POST thành công, thêm success message dạng flash attribute qua RedirectAttributes rồi trả redirect outcome như redirect:/orders/{id}. Redirect khiến client tạo một GET mới. Spring mang output FlashMap qua bước chuyển này để GET phù hợp nhận flash attribute mà không encode nó vào redirect URL; ordinary model state không tự động trở thành cùng request state ở request kế tiếp, còn redirect attribute dành cho URL là cơ chế khác. GET có thể populate Model và trả logical view name như orders/detail. ViewResolver sẽ resolve tên đó thành View rồi View render model vào response. Ngược lại, @ResponseBody bỏ qua normal view resolution và ghi representation qua message-conversion infrastructure. Flash data chỉ là transition state ngắn hạn, không phải durable business state hay general session cache.
    aiGenerated: true
    reviewed: false
