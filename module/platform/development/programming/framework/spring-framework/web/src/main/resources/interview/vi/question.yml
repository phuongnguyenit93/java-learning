  - question: >-
      Bạn so sánh việc dùng RestClient trực tiếp với @HttpExchange HTTP Service Interface như thế nào, và không nên kỳ vọng hai abstraction này tự cung cấp điều gì?
    answer: >-
      RestClient là synchronous fluent client, nơi caller trực tiếp xây request và chọn response handling như retrieve() hoặc exchange() ở mức thấp hơn. HTTP Service Interface đưa HTTP contract vào các Java method có annotation và để HttpServiceProxyFactory thực thi contract đó qua HttpExchangeAdapter như RestClientAdapter hoặc RestTemplateAdapter. Interface có thể giảm code lặp ở call site và giữ một contract khi thay supported adapter bên dưới, nhưng nó không biến remote call thành local call và không tự cung cấp service discovery, retry, circuit breaking, latency control hay business-level resilience policy. Những concern đó vẫn cần ownership rõ ràng ở lớp kiến trúc phù hợp.
    aiGenerated: true
    reviewed: false
