  - question: >-
      Một JSON endpoint đôi khi trả 415 và đôi khi trả 406. Bạn sẽ chẩn đoán hai failure này trong Spring MVC như thế nào?
    answer: >-
      Trước hết hãy xác định hướng representation processing nào thất bại. 415 Unsupported Media Type chỉ về phía request: Content-Type không mô tả body format mà MVC có thể đọc thành Java type đích bằng các HttpMessageConverter hiện có. 406 Not Acceptable chỉ về phía response: request đã được xử lý nhưng MVC không tạo được representation tương thích với Accept header và các converter hoặc handler khả dụng. Phân biệt này giúp tránh debug validation hoặc controller logic khi request chưa tới stage đó, hoặc debug request decoding khi lỗi thực ra nằm ở response negotiation.
    aiGenerated: true
