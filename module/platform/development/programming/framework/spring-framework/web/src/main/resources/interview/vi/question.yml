  - question: >-
      Vì sao controller trả Callable trong Spring MVC không làm ứng dụng trở thành WebFlux, và bạn mong đợi runtime evidence nào?
    answer: >-
      Callable dùng Servlet asynchronous request processing. MVC có thể bắt đầu async processing, giải phóng request thread ban đầu, chạy Callable trên AsyncTaskExecutor rồi tiếp tục bằng ASYNC redispatch trước khi hoàn thành normal MVC response processing. Cách này có thể cải thiện thread usage cho deferred work, nhưng ứng dụng vẫn dùng Servlet programming và I/O model; nó không tự có reactive execution model hoặc backpressure semantics của WebFlux. Evidence hữu ích là Callable chạy trên executor thread khác cùng với REQUEST và ASYNC dispatch của cùng request. Production configuration cũng cần bounded executor và timeout policy có chủ đích.
    aiGenerated: true
    reviewed: false
    readmeRelated:
