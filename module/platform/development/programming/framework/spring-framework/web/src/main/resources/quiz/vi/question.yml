  - id: mvc-exception-advice-resolution
    question: "Một controller exception khớp với @ExceptionHandler trong @ControllerAdvice đang áp dụng. Cách hiểu MVC nào chính xác nhất?"
    answers:
      - {id: A, answer: "@ControllerAdvice chỉ xử lý exception sau khi HandlerExceptionResolver chain của DispatcherServlet đã từ chối nó.", explanation: "Sai. @ExceptionHandler trong advice được tiếp cận ngay trong MVC exception-resolution process."}
      - {id: B, answer: "ResponseStatusExceptionResolver sở hữu @ControllerAdvice và gọi advice sau khi map exception thành status.", explanation: "Sai. @ExceptionHandler được xử lý bởi ExceptionHandlerExceptionResolver, không phải ResponseStatusExceptionResolver."}
      - {id: C, answer: "DispatcherServlet gọi thẳng @ExceptionHandler phù hợp trước khi hỏi bất kỳ HandlerExceptionResolver nào.", explanation: "Sai. @ExceptionHandler support tham gia qua resolver chain chứ không bypass chain."}
      - {id: D, answer: "ExceptionHandlerExceptionResolver có thể gọi @ExceptionHandler phù hợp trong resolver chain để tạo MVC response.", explanation: "Đúng. Nếu không resolver nào xử lý, exception có thể tiếp tục quay ra Servlet container."}
