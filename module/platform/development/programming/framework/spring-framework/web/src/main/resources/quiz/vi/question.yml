      - {id: B, answer: "Spring Cache trả controller result từ application-level method cache thay vì chạy HTTP validation.", explanation: "Sai. HTTP conditional request là representation caching, khác với Spring Cache abstraction."}
      - {id: C, answer: "304 nghĩa là Cache-Control freshness đã đủ nên server bỏ qua If-None-Match và không so sánh ETag.", explanation: "Sai. Experiment này trực tiếp dùng validator-based conditional request handling."}
