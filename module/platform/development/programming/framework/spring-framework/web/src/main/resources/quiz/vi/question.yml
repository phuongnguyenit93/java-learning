  - id: async-callable-runtime-evidence
    question: "Async experiment ghi REQUEST trên một container thread, Callable trên spring-web-mvc-1 rồi có ASYNC dispatch sau đó. Evidence này chứng minh điều gì?"
    answers:
      - {id: A, answer: "Request đã trở thành WebFlux pipeline vì Servlet thread ban đầu được giải phóng.", explanation: "Sai. Servlet async có thể nhả thread ban đầu mà không biến ứng dụng thành WebFlux."}
      - {id: B, answer: "MVC chạy Callable trên AsyncTaskExecutor đã cấu hình rồi tiếp tục cùng request qua Servlet ASYNC redispatch.", explanation: "Đúng. Trace thể hiện Servlet async lifecycle và executor handoff của Callable result."}
      - {id: C, answer: "DispatcherServlet rời request vĩnh viễn sau khi Callable bắt đầu nên không còn MVC processing sau khi worker hoàn tất.", explanation: "Sai. MVC tiếp tục xử lý khi async result được dispatch trở lại Servlet pipeline."}
      - {id: D, answer: "Worker thread chứng minh response write tự động non-blocking và có reactive backpressure.", explanation: "Sai. Servlet async execution tự nó không cung cấp non-blocking I/O hay backpressure kiểu WebFlux."}
