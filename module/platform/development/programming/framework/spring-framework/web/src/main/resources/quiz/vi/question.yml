  - id: annotated-functional-coexistence
    question: "Nên hiểu annotated controller và WebMvc.fn functional endpoint như thế nào khi cùng tồn tại trong một ứng dụng Spring MVC?"
    answers:
      - {id: A, answer: "Cả hai dùng DispatcherServlet, nhưng đăng ký RouterFunction sẽ vô hiệu hóa các @RequestMapping handler trong cùng context.", explanation: "Sai. Annotated và functional endpoint mapping có thể cùng tồn tại trong một MVC application context."}
      - {id: B, answer: "Functional route dùng chung MVC nhưng được đổi thành HandlerMethod trước khi gọi, nên hai model dùng cùng handler adapter.", explanation: "Sai. WebMvc.fn có router/handler abstraction và adapter riêng thay vì biến thành annotated HandlerMethod."}
      - {id: C, answer: "Hai model chỉ có thể cùng tồn tại trong các DispatcherServlet context khác nhau để handler mapping không cùng tham gia một dispatch pipeline.", explanation: "Sai. Chúng có thể cùng tồn tại trong cùng DispatcherServlet context nếu route không xung đột."}
      - {id: D, answer: "Cả hai là Servlet-stack MVC model có thể cùng tồn tại trong DispatcherServlet; khác nhau chủ yếu ở cách khai báo route và handler.", explanation: "Đúng. Khác biệt chính là style và composition, không phải Servlet MVC đối lập với WebFlux."}
    correctAnswerId: D
