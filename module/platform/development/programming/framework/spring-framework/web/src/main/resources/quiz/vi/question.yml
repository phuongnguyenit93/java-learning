  - id: mvc-406-vs-415
    question: "Với endpoint validated-body, phân biệt nào giữa HTTP 406 và 415 là đúng?"
    answers:
      - {id: A, answer: "406 nghĩa là MVC không tạo được response phù hợp Accept; 415 nghĩa là request Content-Type không được hỗ trợ.", explanation: "Đúng. Hai status tương ứng với response representation selection và request-body media type."}
      - {id: B, answer: "406 nghĩa là request Content-Type không được hỗ trợ; 415 nghĩa là MVC không tạo được response phù hợp Accept.", explanation: "Sai. Câu này đảo hướng media type của request và response."}
      - {id: C, answer: "406 nghĩa là body decode được nhưng validation thất bại; 415 nghĩa là validation pass nhưng response serialization thất bại.", explanation: "Sai. Validation error khác với hai media-type negotiation status này."}
      - {id: D, answer: "406 nghĩa là JSON body malformed; 415 nghĩa là JSON hợp lệ nhưng không Bean Validation provider nào chấp nhận.", explanation: "Sai. Malformed content và Bean Validation failure đi theo các MVC error path khác."}
