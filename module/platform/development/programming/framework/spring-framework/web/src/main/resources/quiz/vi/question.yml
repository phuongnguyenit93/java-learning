  - id: filter-interceptor-placement
    question: "Placement nào phù hợp khi một concern cần wrap raw Servlet request trước MVC handler selection, còn concern khác cần metadata của handler đã được chọn?"
    answers:
      - {id: A, answer: "Dùng HandlerInterceptor ở raw pre-MVC boundary và Servlet Filter sau mapping khi đã có handler metadata.", explanation: "Sai. Câu này đảo ngược vị trí thông thường của hai cơ chế."}
      - {id: B, answer: "Dùng HandlerInterceptor cho cả hai vì preHandle chạy trước controller nên cũng chạy trước Servlet filter chain.", explanation: "Sai. Interceptor chạy bên trong MVC dispatch, sau khi request đã đi vào enclosing Servlet filter chain."}
      - {id: C, answer: "Dùng Servlet Filter ở container boundary; dùng HandlerInterceptor khi cần metadata của selected MVC handler.", explanation: "Đúng. Filter nằm ngoài MVC dispatch, còn interceptor chạy quanh mapped MVC handler execution."}
      - {id: D, answer: "Dùng HandlerFilterFunction cho cả hai vì nó có thể wrap cả annotated handler lẫn functional handler ở Servlet boundary.", explanation: "Sai. HandlerFilterFunction thuộc functional routing và không phải Servlet-wide wrapper cho annotated controller."}
