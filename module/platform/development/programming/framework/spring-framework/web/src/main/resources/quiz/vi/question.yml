      - {id: B, answer: "Cả hai trường hợp tạo MethodArgumentNotValidException vì đều phát hiện lỗi trước khi controller hoàn tất bình thường.", explanation: "Sai. Spring MVC 6.1 có method-validation path riêng với HandlerMethodValidationException."}
      - {id: C, answer: "@RequestBody validation có thể tạo MethodArgumentNotValidException; direct constraint có thể tạo HandlerMethodValidationException.", explanation: "Đúng. Hai exception phản ánh individual argument object validation và MVC method validation."}
      - {id: D, answer: "Direct parameter constraint chỉ được kiểm tra khi class-level @Validated tạo AOP proxy, nên thiếu @Validated thì @Min vẫn tới handler.", explanation: "Sai. Module minh họa built-in MVC method validation của Spring 6.1 mà không cần class-level @Validated."}
