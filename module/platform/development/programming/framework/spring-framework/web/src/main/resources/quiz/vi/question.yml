questions:
  - id: dispatcher-mapping-adapter-roles
    question: "Trong một request Spring MVC, mô tả nào phân biệt đúng vai trò của HandlerMapping và HandlerAdapter?"
    answers:
      - {id: A, answer: "HandlerMapping vừa chọn vừa gọi handler; HandlerAdapter chủ yếu convert return value sau khi handler chạy.", explanation: "Sai. HandlerMapping xác định handler và execution chain; HandlerAdapter chịu trách nhiệm gọi handler đã chọn theo programming model phù hợp."}
      - {id: B, answer: "HandlerMapping chọn handler và chain; HandlerAdapter sau đó gọi handler đã chọn qua handler model phù hợp.", explanation: "Đúng. Sự tách biệt này cho phép DispatcherServlet route trước rồi invoke nhiều kiểu handler qua adapter phù hợp."}
      - {id: C, answer: "HandlerAdapter thu hẹp URL candidate trước, rồi HandlerMapping gọi handler mà adapter đó hỗ trợ.", explanation: "Sai. Chọn URL-to-handler thuộc HandlerMapping; HandlerAdapter được chọn sau khi đã có handler."}
      - {id: D, answer: "HandlerMapping chọn cả handler lẫn adapter; HandlerAdapter chỉ đánh dấu những handler type mà MVC hỗ trợ.", explanation: "Sai. DispatcherServlet chọn adapter sau mapping và adapter thực sự gọi handler."}
    correctAnswerId: B
