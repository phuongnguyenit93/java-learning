references:
  - title: "Spring Framework Reference — Spring Web MVC"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc.html"
    description: "Tổng quan Spring MVC trên Servlet stack: kiến trúc request handling, REST controller, HTTP, view rendering và cấu hình."
  - title: "Spring Framework Reference — DispatcherServlet Processing"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-servlet/sequence.html"
    description: "Luồng xử lý request qua DispatcherServlet, handler mapping, interceptor, controller và view rendering."
  - title: "Spring Framework Reference — Annotated Controllers"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller.html"
    description: "Mô hình @Controller và @RestController, các kiểu tham số, kết quả và cách xử lý request."
  - title: "Spring Framework Reference — Mapping Requests"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-requestmapping.html"
    description: "@RequestMapping và @GetMapping/@PostMapping; định tuyến theo path, HTTP method, header, params và media types."
  - title: "Spring Framework Reference — @RequestBody"
    url: "https://docs.spring.io/spring/reference/7.1/web/webmvc/mvc-controller/ann-methods/requestbody.html"
    description: "Đọc request body qua HttpMessageConverter; chuyển dữ liệu từ HTTP sang đối tượng Java."
  - title: "Spring Framework Reference — Exception Handling"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-exceptionhandler.html"
    description: "@ExceptionHandler và @ControllerAdvice; xử lý lỗi tập trung và ánh xạ lỗi thành HTTP response."
  - title: "Spring Framework Reference — MVC Message Converters"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-config/message-converters.html"
    description: "Tùy chỉnh HttpMessageConverter để đọc/ghi HTTP message bodies, JSON hoặc XML."
  - title: "Spring Framework Reference — CORS"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc-cors.html"
    description: "CORS trên Servlet stack; @CrossOrigin, cấu hình toàn cục, preflight và origin/credentials."
  - title: "Spring Framework Reference — MVC Config"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-config.html"
    description: "WebMvcConfigurer, interceptors, content negotiation, resources, view resolution và các extension points."
