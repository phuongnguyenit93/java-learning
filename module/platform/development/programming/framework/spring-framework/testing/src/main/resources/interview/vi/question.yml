questions:
  - question: >-
      Bạn sẽ chọn giữa plain object test, integration test dựa trên TestContext, MockMvc hoặc WebTestClient mock-bound, và live-server test như thế nào?
    answer: >-
      Hãy bắt đầu từ hành vi cần có khả năng bị chứng minh là sai. Dùng plain object test khi Spring infrastructure không liên quan. Chuyển sang TestContext khi điều cần chứng minh phụ thuộc bean wiring, profile, lifecycle hoặc hành vi khác của ApplicationContext. Dùng MockMvc hoặc WebTestClient mock-bound khi request mapping, binding, validation, exception handling hay framework web dispatch là phần đang có rủi ro. Chỉ dùng live server khi evidence phải bao gồm real HTTP transport hoặc deployed server boundary. Quy tắc hữu ích không phải “test càng lớn càng tốt”, mà là “dùng phạm vi nhỏ nhất vẫn quan sát được failure mode mình quan tâm”.
    aiGenerated: true
