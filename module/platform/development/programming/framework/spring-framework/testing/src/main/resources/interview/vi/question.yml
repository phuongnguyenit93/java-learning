  - question: >-
      Hãy giải thích TestContext runtime model từ test engine xuống bước load ApplicationContext. TestContextManager, TestExecutionListener, SmartContextLoader và context cache nằm ở đâu trong flow này?
    answer: >-
      Test engine bên ngoài vẫn sở hữu discovery và test lifecycle cơ bản. Phần tích hợp Spring chuyển các lifecycle callback vào TestContextManager, nơi giữ TestContext hiện tại và gọi các TestExecutionListener đã được sắp thứ tự ở những phase xác định. Các listener bổ sung hành vi riêng của Spring như dependency injection, transaction, SQL script, event support hoặc context invalidation. Khi cần ApplicationContext, merged test configuration được dùng để lookup cache; nếu miss thì SmartContextLoader tạo context. Sự phân tách này giải thích vì sao Spring có thể thêm integration-test behavior mà không thay thế JUnit hoặc TestNG.
    aiGenerated: true
    reviewed: false
    readmeRelated:
