  - question: >-
      So sánh MockMvc standalone setup với WebApplicationContext setup. Khi nào chọn mỗi loại, và điều gì cả hai vẫn không chứng minh được so với live server?
    answer: >-
      Standalone setup phù hợp cho controller test có phạm vi tập trung, nơi controller và các MVC collaborator cần thiết được cấu hình rõ ràng. WebApplicationContext setup mạnh hơn khi điều cần chứng minh bao gồm real Spring MVC wiring như component scanning, configured advice, converter, interceptor hoặc MVC infrastructure ở mức context. Cả hai vẫn chạy bằng mock Servlet infrastructure và không có network connection thật. Chúng có thể chứng minh request processing ở mức DispatcherServlet nhưng không chứng minh connector behavior, TLS, socket thật, deployment-container default hay các transport concern khác. Những điều đó cần live-server boundary khi thực sự thuộc behavior đang có rủi ro.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.MockMvcTesting/MockMvcTesting.md"
      anchor: "mockmvc-limitations-and-live-server"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      WebTestClient có thể bind vào WebFlux target, MockMvc hoặc live server, còn MockRestServiceServer dùng để test outbound HTTP client collaborator. Các lựa chọn này làm thay đổi evidence của test ra sao?
    answer: >-
      WebTestClient mock-bound chạy in-process và chứng minh framework request handling mà không cần TCP connection. Khi backing bằng MockMvc, server side vẫn là Servlet MVC chứ không trở thành WebFlux dù assertion API là WebTestClient. bindToServer đi qua real HTTP transport boundary và có thể chứng minh transport-visible behavior, nhưng không còn nhìn được server internals vốn chỉ có ở in-process test infrastructure. MockRestServiceServer giải quyết chiều ngược lại: nó intercept request do Spring HTTP client tạo ra và kiểm chứng client-side request construction cùng response handling mà không dùng network I/O thật. Real mock web server hoặc live environment mạnh hơn khi DNS, socket, TLS, proxy, timeout hay remote service thực sự thuộc điều cần chứng minh.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.WebTestClientAndClientTesting/WebTestClientAndClientTesting.md"
      anchor: "mock-server-vs-live-integration"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Những rủi ro lifecycle và concurrency nào cần review trước khi thêm custom TestExecutionListener, assertion trên application event hoặc parallel execution vào Spring integration-test suite?
    answer: >-
      Listener ordering là một phần của contract vì listener chạy sau có thể phụ thuộc state do listener trước chuẩn bị; thay toàn bộ default listener set có thể vô tình loại dependency injection, transaction, SQL support hoặc event support. Test execution event phụ thuộc ApplicationContext đang hoạt động nên một số event quá sớm hoặc quá muộn có thể không xuất hiện nếu context chưa load hoặc đã bị dirtied. Recorded application event có giới hạn liên quan thread và không nên được coi là bằng chứng rằng arbitrary asynchronous work đã hoàn tất thành công. Parallel execution cũng cần nhiều hơn một TestContext cache thread-safe: mutable bean, database, file, DirtiesContext, method ordering, thread-bound transaction và copy semantics của custom TestContext đều phải an toàn. Framework có thể hỗ trợ concurrency nhưng không tự biến toàn bộ fixture xung quanh thành concurrent-safe.
    aiGenerated: true
    reviewed: false
