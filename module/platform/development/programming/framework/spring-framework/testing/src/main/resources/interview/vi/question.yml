  - question: >-
      Vì sao một transactional Spring test vẫn có thể tạo database state đã commit dù test-managed transaction mặc định rollback? Hãy nêu vài failure mode cụ thể.
    answer: >-
      Default rollback chỉ kiểm soát công việc thực sự tham gia test-managed transaction. Preemptive timeout có thể chạy test body trên thread khác, ngoài transaction đang bound vào test thread ban đầu. Request gửi tới live server cũng được xử lý trên server thread và không tự động nằm trong transaction của caller. SQL fixture dùng isolated transaction có thể commit độc lập, TestTransaction có thể kết thúc và commit transaction khi được flag, và application code có thể chủ động mở transaction độc lập. ORM test cũng có thể tạo cảm giác an toàn giả nếu không flush các thay đổi đang buffer trước assertion quyết định. Câu hỏi debug vì vậy là: thread và resource manager nào sở hữu từng write, và transaction nào thực sự kết thúc write đó?
    aiGenerated: true
    reviewed: false
