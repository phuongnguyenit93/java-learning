  - question: >-
      Một Spring test suite lớn reuse context kém và chậm hơn sau khi các subclass bắt đầu dùng dynamic property. Bạn sẽ phân tích cache như thế nào trước khi chỉ tăng maximum size?
    answer: >-
      Trước hết hãy kiểm tra context identity chứ không phải dung lượng cache. TestContext cache key được tạo từ merged configuration như configuration class hoặc location, loader, parent, active profile, test property source, customizer và web resource base path. DynamicPropertySource tham gia thông qua registration/customizer identity; supplier trả một giá trị khác không tự động tạo key mới. Vì vậy subclass có thể vô tình reuse context dù dynamic value lẽ ra cần đổi, khi đó có thể cần DirtiesContext hoặc một khác biệt cấu hình rõ ràng. Ngược lại, annotation hay customizer không nhất quán có thể làm cache bị phân mảnh thành nhiều key. Chỉ sau khi phân biệt context thực sự cần khác với fragmentation vô tình thì mới nên cân nhắc tăng cache size.
    aiGenerated: true
    reviewed: false
