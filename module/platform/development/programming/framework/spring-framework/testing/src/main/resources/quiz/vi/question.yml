  - id: testcontext-manager-role
    question: "Mô tả nào đúng nhất về mối quan hệ giữa test engine như JUnit Jupiter và Spring TestContext Framework?"
    answers:
      - id: A
        answer: "Test engine chạy test; TestContextManager nhận lifecycle callback và gọi các TestExecutionListener riêng của Spring."
        explanation: "Đúng. Spring tích hợp với test engine và bổ sung context loading, dependency injection, transaction cùng các lifecycle service liên quan."
      - id: B
        answer: "TestContextManager thay thế test engine và tự discovery mọi test method trong suite."
        explanation: "Sai. Test discovery và lifecycle cốt lõi vẫn thuộc trách nhiệm của test engine bên ngoài."
      - id: C
        answer: "Test engine load Spring ApplicationContext, còn TestContextManager chỉ định dạng assertion failure."
        explanation: "Sai. Spring TestContext quản lý context riêng của Spring; định dạng assertion failure không phải vai trò cốt lõi của nó."
      - id: D
        answer: "TestExecutionListener chỉ chạy sau khi mọi test method kết thúc nên không thể chuẩn bị fixture hoặc transaction."
        explanation: "Sai. Listener tham gia nhiều phase xác định rõ trước và sau class, instance, method và actual execution."
    correctAnswerId: A
    aiGenerated: true
