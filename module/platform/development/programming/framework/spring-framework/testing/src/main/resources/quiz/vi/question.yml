  - id: dynamic-property-cache-identity
    question: "Hai subclass kế thừa cùng một method đăng ký `@DynamicPropertySource`, nhưng supplier trả về endpoint bên ngoài khác nhau cho từng subclass. Điểm cần lưu ý về cache là gì?"
    answers:
      - id: A
        answer: "Runtime value luôn tự tạo cache key mới nên context reuse không thể xảy ra."
        explanation: "Sai. Dynamic-property registration tham gia thông qua context customizer; giá trị supplier trả về sau đó không tự động trở thành cache identity khác."
      - id: B
        answer: "Các subclass bắt buộc dùng chung một context vì TestContext bỏ qua dynamic property được kế thừa."
        explanation: "Sai. Dynamic property registration là một phần của effective test configuration; vấn đề là giá trị thay đổi có thể không làm identity thay đổi."
      - id: C
        answer: "Nếu giá trị mới cần context khác, hãy invalidate hoặc làm context identity khác đi; supplier value tự nó có thể không đổi cache identity."
        explanation: "Đúng. Registration được kế thừa có thể tái sử dụng context dù supplier về sau trả giá trị khác, nên boundary cần thiết phải được biểu diễn rõ."
      - id: D
        answer: "Thay `@DynamicPropertySource` bằng `@ActiveProfiles` vì profile là nguồn duy nhất Spring hỗ trợ cho test property."
        explanation: "Sai. DynamicPropertySource được hỗ trợ; câu hỏi nằm ở cách registration của nó tương tác với context identity."
    correctAnswerId: C
