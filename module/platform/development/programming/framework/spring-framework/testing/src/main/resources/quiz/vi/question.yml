  - id: context-failure-threshold
    question: "Trong Spring Framework 6.1, một context đã load thất bại một lần cho một cache key cụ thể và context failure threshold vẫn giữ mặc định. Lần thử sau cho cùng key thường sẽ thế nào?"
    answers:
      - id: A
        answer: "Tiếp tục retry việc load context tốn kém vô hạn cho tới khi thành công."
        explanation: "Sai. Failure threshold tồn tại để tránh lặp lại chi phí của cùng một context load đã biết là thất bại."
      - id: B
        answer: "Chặn mọi Spring test context khác trong JVM, kể cả khi chúng dùng cache key khác."
        explanation: "Sai. Failure tracking gắn với context key bị ảnh hưởng, không phải toàn bộ context trong suite."
      - id: C
        answer: "Âm thầm trả về ApplicationContext bị dựng dở từ cache."
        explanation: "Sai. Context load thất bại không được xem là một cached ApplicationContext hợp lệ."
      - id: D
        answer: "Fail sớm cho key đó thay vì thử load lại cùng context."
        explanation: "Đúng. Với threshold mặc định bằng 1, lần thử sau cho cùng key thất bại sẽ bị từ chối sớm."
