  - id: per-class-constructor-dirties-context
    question: "Một test JUnit Jupiter dùng `@TestInstance(PER_CLASS)`, constructor injection và `@DirtiesContext` làm đóng context giữa các test method. Rủi ro chính là gì?"
    answers:
      - id: A
        answer: "Spring tự tạo test instance mới sau mỗi lần đóng context nên constructor injection luôn được làm mới."
        explanation: "Sai. PER_CLASS giữ nguyên test instance nên constructor không được gọi lại mỗi khi context bị thay thế."
      - id: B
        answer: "Test instance được tái sử dụng có thể giữ reference constructor-injected tới bean thuộc context đã đóng."
        explanation: "Đúng. Field hoặc setter injection an toàn hơn khi cùng test instance cần được reinject sau khi context được thay thế."
      - id: C
        answer: "Test trở thành plain unit test vì constructor injection vô hiệu hóa TestContext Framework."
        explanation: "Sai. Constructor injection không vô hiệu hóa TestContext; vấn đề là reference cũ trên test instance được tái sử dụng."
      - id: D
        answer: "`@DirtiesContext` chỉ ảnh hưởng thống kê cache và không bao giờ đóng ApplicationContext."
        explanation: "Sai. Context bị đánh dấu dirty có thể bị loại khỏi cache và đóng, nên reference tới bean cũ mới trở thành rủi ro."
    correctAnswerId: B
