  - id: merged-context-configuration
    question: "Vì sao hai test trông khá giống nhau vẫn có thể nhận các ApplicationContext cache khác nhau?"
    answers:
      - id: A
        answer: "Vì Spring luôn tạo context mới cho từng test method bất kể cấu hình."
        explanation: "Sai. TestContext chủ động cache và tái sử dụng context khi merged configuration tạo cùng cache key."
      - id: B
        answer: "Vì chỉ tên Java package quyết định context identity nên test ở package khác nhau không bao giờ dùng chung context."
        explanation: "Sai. Vị trí package tự nó không phải quy tắc identity của TestContext cache."
      - id: C
        answer: "Vì khác biệt trong merged test configuration có thể tạo cache key khác nhau dù các test class nhìn khá giống nhau."
        explanation: "Đúng. Context reuse dựa trên effective merged configuration chứ không dựa vào việc hai test class nhìn có vẻ giống nhau."
      - id: D
        answer: "Vì cache key chỉ dựa trên tên test method nên luôn thay đổi ở từng method."
        explanation: "Sai. Tên method không phải cơ sở thông thường để nhận diện cached ApplicationContext."
    correctAnswerId: C
