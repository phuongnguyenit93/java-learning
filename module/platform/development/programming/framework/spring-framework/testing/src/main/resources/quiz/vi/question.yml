  - id: preemptive-timeout-test-transaction
    question: "Một Spring test đang chạy trong test-managed transaction với default rollback, nhưng preemptive timeout chạy test body trên thread khác. Vì sao thay đổi database có thể thoát khỏi rollback mong đợi?"
    answers:
      - id: A
        answer: "Test-managed transaction gắn với test thread ban đầu, nên công việc trên timeout thread có thể chạy ngoài transaction đó."
        explanation: "Đúng. Rollback chỉ kiểm soát công việc thực sự tham gia test-managed transaction."
      - id: B
        answer: "Preemptive timeout tự động đổi mọi Spring transaction thành `REQUIRES_NEW` rồi commit."
        explanation: "Sai. Vấn đề là thread boundary, không phải tự động thay đổi propagation."
      - id: C
        answer: "Default rollback chỉ áp dụng cho read-only test và bị tắt mỗi khi cấu hình timeout."
        explanation: "Sai. Default rollback không phụ thuộc test có read-only hay có timeout."
      - id: D
        answer: "Spring đóng DataSource trước khi timeout thread chạy nên thread thứ hai luôn mở database độc lập."
        explanation: "Sai. Điểm cốt lõi là transaction context binding chứ không phải DataSource tự bị thay thế."
    correctAnswerId: A
