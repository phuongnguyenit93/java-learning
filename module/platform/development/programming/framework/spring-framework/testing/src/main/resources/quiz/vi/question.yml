questions:
  - id: testing-scope-selection
    question: "Một service có thể được khởi tạo trực tiếp với các fake collaborator và hành vi cần kiểm thử không phụ thuộc cấu hình Spring. Phạm vi test nào cho bằng chứng phù hợp nhất?"
    answers:
      - id: A
        answer: "Load toàn bộ ApplicationContext để test giống production nhất có thể."
        explanation: "Sai. Việc load Spring làm tăng chi phí cấu hình nhưng không chứng minh thêm điều gì mà hành vi này cần."
      - id: B
        answer: "Dùng plain object test và tự khởi tạo service với các fake hoặc stub cần thiết."
        explanation: "Đúng. Khi Spring-managed infrastructure không thuộc điều cần chứng minh, phạm vi nhỏ nhất có thể làm sai giả thuyết là lựa chọn phù hợp hơn."
      - id: C
        answer: "Dùng MockMvc vì mọi ứng dụng Spring đều phải kiểm chứng đường đi qua DispatcherServlet."
        explanation: "Sai. MockMvc phù hợp khi MVC request processing thực sự là một phần của hành vi cần kiểm chứng."
      - id: D
        answer: "Dùng WebTestClient với live server để test đồng thời cả network."
        explanation: "Sai. Live HTTP boundary sẽ thêm hạ tầng không liên quan và làm test rộng hơn mức cần thiết."
    correctAnswerId: B
