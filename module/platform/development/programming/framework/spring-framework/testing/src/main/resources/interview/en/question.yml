questions:
  - question: >-
      How would you choose between a plain object test, a TestContext-based integration test, MockMvc or mock-bound WebTestClient, and a live-server test?
    answer: >-
      Start from the behavior that must be falsifiable. Use a plain object test when Spring infrastructure is irrelevant. Escalate to TestContext when the claim depends on bean wiring, profiles, lifecycle or other ApplicationContext behavior. Use MockMvc or a mock-bound WebTestClient when request mapping, binding, validation, exception handling or framework web dispatch is the behavior at risk. Use a live server only when evidence must include the real HTTP transport or deployed server boundary. The useful rule is not “bigger tests are better”; it is “use the smallest scope that still observes the failure mode you care about.”
    aiGenerated: true
    reviewed: false
    readmeRelated:
