  - question: >-
      Why can a transactional Spring test still produce committed database state even though test-managed transactions roll back by default? Give several concrete failure modes.
    answer: >-
      Default rollback only controls work that actually participates in the test-managed transaction. A preemptive timeout can run the test body on another thread, outside the transaction bound to the original test thread. A live-server request is also handled on a server thread and is not automatically enclosed by the caller's test transaction. SQL fixtures using an isolated transaction can commit independently, TestTransaction can explicitly end and commit a transaction when flagged, and application code can deliberately open an independent transaction. ORM tests can also create false confidence if they never flush buffered changes before asserting. The debugging question is therefore: which thread and resource manager owns each write, and which transaction will actually end it?
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.TransactionalDatabaseTesting/TransactionalDatabaseTesting.md"
      anchor: "transaction-testing-pitfalls"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Compare MockMvc standalone setup with WebApplicationContext setup. When would you choose each, and what does neither one prove compared with a live server?
    answer: >-
      Standalone setup is useful for a focused controller test where the controller and the relevant MVC collaborators can be configured explicitly. WebApplicationContext setup is stronger when the claim includes real Spring MVC wiring such as component scanning, configured advice, converters, interceptors, or other context-level MVC infrastructure. Both still execute with mock Servlet infrastructure and no real network connection. They can prove DispatcherServlet-level request processing but not connector behavior, TLS, real sockets, deployment-container defaults, or other transport concerns. Those require a live-server boundary when they are part of the behavior at risk.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.MockMvcTesting/MockMvcTesting.md"
      anchor: "mockmvc-limitations-and-live-server"
    apiRelated:
      controller: ""
