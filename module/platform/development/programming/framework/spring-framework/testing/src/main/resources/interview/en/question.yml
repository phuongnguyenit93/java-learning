  - question: >-
      What lifecycle and concurrency risks should you review before adding custom TestExecutionListeners, application-event assertions, or parallel execution to a Spring integration-test suite?
    answer: >-
      Listener ordering is part of the contract because later listeners may depend on state prepared earlier; replacing the default listener set can accidentally remove dependency injection, transactions, SQL support, or event support. Test execution events depend on an active ApplicationContext, so very early or very late events can be absent when the context has not yet loaded or has already been dirtied. Recorded application events have thread-related limits and should not be treated as proof that arbitrary asynchronous work completed successfully. Parallel execution also requires more than a thread-safe TestContext cache: mutable beans, databases, files, DirtiesContext usage, method ordering, thread-bound transactions, and custom TestContext copy semantics must all be safe. The framework can support concurrency without making the surrounding fixture automatically concurrent-safe.
    aiGenerated: true
    reviewed: false
