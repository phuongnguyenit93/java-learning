  - question: >-
      WebTestClient can be bound to WebFlux targets, MockMvc, or a live server, while MockRestServiceServer tests an outbound HTTP client collaborator. How do these choices change the evidence produced by a test?
    answer: >-
      A mock-bound WebTestClient stays in-process and proves framework request handling without a TCP connection. When backed by MockMvc it still exercises Servlet MVC, not WebFlux, although the assertion API is WebTestClient. bindToServer crosses the real HTTP transport boundary and can prove transport-visible behavior, but it loses access to server internals available only to in-process test infrastructure. MockRestServiceServer addresses the opposite direction: it intercepts requests made by a Spring HTTP client and verifies client-side request construction and response handling without real network I/O. A real mock web server or live environment is stronger when DNS, sockets, TLS, proxy configuration, timeouts, or the actual remote service are part of the claim.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.WebTestClientAndClientTesting/WebTestClientAndClientTesting.md"
      anchor: "mock-server-vs-live-integration"
