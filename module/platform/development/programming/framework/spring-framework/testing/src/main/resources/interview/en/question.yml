  - question: >-
      Explain the TestContext runtime model from the test engine down to ApplicationContext loading. Where do TestContextManager, TestExecutionListener, SmartContextLoader, and the context cache fit?
    answer: >-
      The external test engine still owns discovery and the basic test lifecycle. Its Spring integration delegates lifecycle callbacks into TestContextManager, which maintains the current TestContext and invokes ordered TestExecutionListeners at defined phases. Those listeners add Spring-specific behavior such as dependency injection, transactions, SQL scripts, event support, or context invalidation. When an ApplicationContext is needed, merged test configuration is used for a cache lookup; on a miss, a SmartContextLoader creates the context. This separation explains why Spring can add integration-test behavior without replacing JUnit or TestNG.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.TestContextFramework/TestContextFramework.md"
      anchor: "testcontext-framework-role"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      A large Spring test suite has poor context reuse and becomes slower after subclasses start using dynamic properties. How would you reason about the cache before simply increasing its maximum size?
    answer: >-
      First inspect context identity, not cache capacity. The TestContext cache key is derived from merged configuration such as configuration classes or locations, loaders, parents, active profiles, test property sources, customizers and the web resource base path. DynamicPropertySource contributes through its registration/customizer identity; a changed supplier value is not automatically a new key. Subclasses can therefore accidentally reuse a context whose dynamic value should have changed, in which case DirtiesContext or an explicit configuration distinction may be required. Conversely, inconsistent annotations or customizers can fragment the cache into many keys. Only after separating legitimate unique contexts from accidental fragmentation should cache-size tuning be considered.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.ContextCaching/ContextCaching.md"
      anchor: "context-cache-key"
    apiRelated:
