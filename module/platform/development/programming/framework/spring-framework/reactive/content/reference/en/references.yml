references:
  - title: "Spring Framework — Spring WebFlux"
    url: "https://docs.spring.io/spring-framework/reference/web/webflux.html"
    description: "Tổng quan mô hình web reactive non-blocking, Reactive Streams backpressure và khác biệt với Spring MVC."
  - title: "Spring Framework — Reactive Core"
    url: "https://docs.spring.io/spring-framework/reference/web/webflux/reactive-spring.html"
    description: "HttpHandler, WebHandler, kết nối HTTP bất đồng bộ và codecs làm nền tảng cho Spring WebFlux."
  - title: "Spring Framework — Reactive Libraries"
    url: "https://docs.spring.io/spring-framework/reference/web/webflux-reactive-libraries.html"
    description: "Cách Spring WebFlux sử dụng Reactor Core, Flux, Mono và tích hợp các kiểu Publisher của Reactive Streams."
  - title: "Spring Framework — Annotated Controllers in WebFlux"
    url: "https://docs.spring.io/spring-framework/reference/web/webflux/controller.html"
    description: "Xây dựng HTTP endpoint reactive bằng @Controller, @RestController và mapping annotation."
  - title: "Spring Framework — Functional Endpoints in WebFlux"
    url: "https://docs.spring.io/spring-framework/reference/web/webflux-functional.html"
    description: "Thiết kế RouterFunction, HandlerFunction, ServerRequest và ServerResponse trong WebFlux.fn."
  - title: "Spring Framework — WebClient"
    url: "https://docs.spring.io/spring-framework/reference/web/webflux-webclient.html"
    description: "HTTP client non-blocking, streaming và kết hợp luồng thao tác bất đồng bộ qua Reactor."
  - title: "Spring Framework — WebFlux Configuration"
    url: "https://docs.spring.io/spring-framework/reference/web/webflux/config.html"
    description: "Tùy chỉnh WebFlux bằng Java configuration, handler mappings, codecs và các thành phần hạ tầng."
  - title: "Spring Framework — WebFlux Testing"
    url: "https://docs.spring.io/spring-framework/reference/web/webflux-test.html"
    description: "Mock request-response reactive, WebTestClient và các phương pháp kiểm thử HTTP không cần server."
  - title: "Project Reactor — Reference Guide"
    url: "https://projectreactor.io/docs/core/release/reference/index.html"
    description: "Tài liệu chính thức về Reactor Core, lifecycle của Publisher, Mono, Flux, operators và lập trình reactive."
  - title: "Project Reactor — Backpressure"
    url: "https://projectreactor.io/docs/core/release/reference/subscribe-backpressure.html"
    description: "Diễn giải cơ chế request(n), kiểm soát demand và luồng tín hiệu backpressure giữa Subscriber và Publisher."
  - title: "Project Reactor — Threading and Schedulers"
    url: "https://projectreactor.io/docs/core/release/reference/coreFeatures/schedulers.html"
    description: "Phân biệt subscribeOn và publishOn, nhóm Schedulers và cách chuyển việc blocking sang boundedElastic."
