exchange:
  summary: Inactive historical framework parameter
  description: ServerWebExchange parameter from an earlier in-step signature. It is
    retained only because stale generated metadata uses usage=false.
  usage: false
count:
  summary: Number of SSE elements
  description: Finite event count for the streaming experiment. Accepted range is
    1 through 5; default is 3.
  usage: true
delayMillis:
  summary: Delay between SSE elements
  description: Delay in milliseconds between emitted events. Accepted range is 50
    through 500; default is 120.
  usage: true
correlationId:
  summary: Correlation id carried by Reactor Context
  description: Value from the X-Correlation-Id request header. When the header is
    absent or blank the experiment uses demo-context so the result stays deterministic.
  usage: true
