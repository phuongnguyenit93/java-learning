  - question: >-
      Explain the difference between streaming and aggregation in WebFlux, and what extra production concerns appear once a response has started streaming.
    answer: >-
      Aggregation waits until enough or all content has been collected into one value before later processing or response writing, while streaming preserves a sequence so values can be decoded, processed, and written incrementally when the media type and writer support it. Streaming can reduce the need to buffer an entire payload and can expose results earlier, but it adds lifecycle concerns. Pooled DataBuffer or multipart content must be consumed, relayed, or released correctly; backpressure and cancellation should be allowed to propagate where supported; and once status, headers, or part of the body have been committed, a late failure may no longer be replaceable with a clean error response. The Step 5 SSE experiment proves incremental delivery, but it does not imply that each Flux element becomes exactly one network packet.
    aiGenerated: true
    reviewed: false
