  - question: >-
      How does Spring Framework 6.1 controller validation distinguish argument-level validation from method validation in WebFlux?
    answer: >-
      Binding and validation begin with how the controller argument is produced. A body or model attribute can be decoded or bound and then validated as an object, for example through @Valid. Built-in controller method validation becomes applicable when constraints are declared directly on method parameters or on the return value. In that case violations are represented through HandlerMethodValidationException, while binding or object-validation failures can surface through errors such as WebExchangeBindException. @Valid by itself is a cascade marker rather than a direct constraint, so it does not automatically mean method validation. Class-level @Validated is also a different, older AOP-based method-validation path; for the built-in 6.1 controller mechanism, that distinction must be understood rather than mixing the two models.
    aiGenerated: true
    reviewed: false
