  - question: >-
      Compare annotated WebFlux controllers with WebFlux.fn. What does direct RouterFunction-to-HttpHandler adaptation change?
    answer: >-
      Both programming models run on the same reactive HTTP foundation, so neither is inherently "more reactive." Annotated controllers express routing and argument/result conventions declaratively and use the controller-method infrastructure. WebFlux.fn represents routing and handling explicitly with RouterFunction, HandlerFunction, ServerRequest, and ServerResponse, which can make composition and route-local behavior more visible. In the normal application-context arrangement, functional routes can still participate in DispatcherHandler through RouterFunctionMapping and the related strategies. A RouterFunction can also be adapted directly to HttpHandler with HandlerStrategies. That lower-level path bypasses DispatcherHandler route discovery, so the application must provide the functional strategies intentionally rather than assuming the standard discovery pipeline is still in control.
    aiGenerated: true
    reviewed: false
