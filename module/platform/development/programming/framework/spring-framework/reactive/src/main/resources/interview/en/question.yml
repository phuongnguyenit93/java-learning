  - question: >-
      Why is Reactor Context useful for request-scoped data in WebFlux, and what does the Step 5 correlation-id experiment prove?
    answer: >-
      Reactive execution is not defined by one request staying on one Java thread, so an ordinary ThreadLocal cannot be assumed to follow arbitrary asynchronous boundaries unless a dedicated bridge is present. Reactor Context is associated with the subscriber chain, which makes it suitable for contextual values that need to follow reactive composition. In the experiment, a WebFilter normalizes X-Correlation-Id and places it in Reactor Context, the controller crosses a Mono.delay asynchronous boundary, and deferContextual reads the value afterward. The response shows the same correlation id even when the resumed thread differs from the entry thread. The lesson is contextual continuity without thread affinity, not that ThreadLocal-based integrations can never work.
    aiGenerated: true
    reviewed: false
    readmeRelated:
