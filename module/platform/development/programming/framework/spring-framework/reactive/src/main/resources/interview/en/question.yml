  - question: >-
      How should you choose between WebClient retrieve() and exchangeToMono()/exchangeToFlux(), and what resource-lifecycle mistakes should you avoid?
    answer: >-
      retrieve() is a convenient choice when the success/error policy is straightforward: by default 4xx and 5xx responses become WebClientResponseException unless onStatus changes that policy, and the usual body-decoding methods keep the common response path compact. exchangeToMono() and exchangeToFlux() are better when status or headers must determine how the response is decoded or whether a body should be consumed at all, because they expose ClientResponse to the handler. The handler still has a body-lifecycle contract: after the handler publisher completes, unconsumed response content is released by the exchangeTo APIs, so any body needed later must be decoded within that function. A related exception is retrieve().toEntityFlux(), where the returned body Flux must actually be subscribed and consumed by the caller. Connector pools and event-loop resources are another separate lifecycle concern and should be shared or managed deliberately rather than recreated per request.
    aiGenerated: true
    reviewed: false
