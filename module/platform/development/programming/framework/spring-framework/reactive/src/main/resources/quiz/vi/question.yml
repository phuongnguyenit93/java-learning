  - id: webflux-data-buffer-ownership
    question: "Khi application code nhận pooled DataBuffer nhưng không consume hoặc forward toàn bộ, mental model an toàn nhất là gì?"
    answers:
      - id: A
        answer: "Nếu DataBuffer đến từ WebFlux decoder thì framework luôn giữ ownership kể cả khi user code intercept raw buffer."
        explanation: "Sai. Khi application code tham gia raw pooled-buffer handling, ownership phải theo đúng contract consume, relay, retain hoặc release."
      - id: B
        answer: "Sau khi pooled DataBuffer được emit downstream, lifetime của nó có thể kéo dài đến lúc garbage collection mà không cần quyết định retain/release."
        explanation: "Sai. Pooled-buffer lifetime không chỉ do Java GC quyết định; reference-counted ownership có thể cần xử lý tường minh."
      - id: C
        answer: "Code nhận ownership phải consume, relay hoặc release buffer theo contract WebFlux tương ứng."
        explanation: "Đúng. Ownership phải rõ ràng, đặc biệt với pooled buffer hoặc multipart streaming."
      - id: D
        answer: "Copy byte sang array riêng khiến original pooled DataBuffer có thể được giữ vô hạn mà không cần release ownership."
        explanation: "Sai. Copy dữ liệu không tự xóa lifecycle obligation của pooled buffer ban đầu."
    correctAnswerId: C
