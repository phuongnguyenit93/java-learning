questions:
  - id: webflux-nonblocking-benefit
    question: "Lợi ích chính mà Spring WebFlux hướng tới cho service có nhiều I/O chờ là gì?"
    answers:
      - id: A
        answer: "Chủ yếu giảm CPU cost của từng request bằng cách thay serialization và business logic bằng event-loop callback."
        explanation: "Sai. WebFlux thay đổi concurrency và I/O model; nó không loại bỏ serialization hay application work và reactive orchestration vẫn có overhead."
      - id: B
        answer: "Chủ yếu hấp thụ dependency blocking bằng cách tăng một request-worker pool lớn khi nhiều lời gọi phải chờ I/O."
        explanation: "Sai. Đây gần với blocking thread-pool strategy mà WebFlux muốn tránh; dependency blocking cần boundary tường minh."
      - id: C
        answer: "Duy trì nhiều I/O đang chờ đồng thời với số processing thread tương đối nhỏ khi request path vẫn non-blocking."
        explanation: "Đúng. Lợi ích chính là hiệu quả concurrency và tài nguyên khi có I/O latency, không phải tự động giảm latency."
      - id: D
        answer: "Phù hợp nhất với CPU-bound request path vì event-loop pool nhỏ tự động parallelize computation nặng."
        explanation: "Sai. Event-loop pool nhỏ không phù hợp cho CPU work kéo dài; WebFlux mạnh nhất khi concurrency chủ yếu là non-blocking I/O wait."
    correctAnswerId: C
