  - id: webflux-dispatch-strategy-chain
    question: "Sau khi DispatcherHandler nhận request trong flow annotated controller chuẩn, chuỗi trách nhiệm nào chính xác nhất?"
    answers:
      - id: A
        answer: "HandlerAdapter chọn route, HandlerMapping gọi controller và WebFilter serialize return value."
        explanation: "Sai. Các trách nhiệm này thuộc những strategy layer khác nhau."
      - id: B
        answer: "HandlerMapping tìm handler, HandlerAdapter gọi handler và HandlerResultHandler xử lý giá trị kết quả."
        explanation: "Đúng. DispatcherHandler điều phối các strategy contract này thay vì tự làm toàn bộ dispatch."
      - id: C
        answer: "HttpMessageWriter tìm controller, ReactiveAdapterRegistry gọi controller và HandlerMapping commit response."
        explanation: "Sai. Codec và reactive adapter tham gia ở các bước khác, không thay thế dispatch strategy chain."
      - id: D
        answer: "WebHandler chọn HandlerResultHandler trước, sau đó HandlerMapping mới quyết định response đã ghi có cần route hay không."
        explanation: "Sai. Routing phải xác định handler trước invocation và result handling."
    correctAnswerId: B
