        answer: "Một Flux hữu hạn với streaming media type có thể đưa phần tử ra tăng dần theo thời gian thay vì gom toàn bộ kết quả trước."
        explanation: "Đúng. Thí nghiệm phát các SSE frame hữu hạn với elapsed-time evidence tăng dần."
      - id: B
        answer: "Chỉ cần trả Flux là đủ; cùng incremental behavior sẽ luôn được bảo đảm ngay cả với response JSON có tính aggregation."
        explanation: "Sai. Publisher shape không tự bảo đảm HTTP flush tăng dần; media type, writer, buffering và transport đều có vai trò."
      - id: C
        answer: "delayElements chỉ làm chậm source creation; server vẫn đợi Flux complete rồi mới ghi toàn bộ SSE frame."
