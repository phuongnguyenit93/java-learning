  - id: webflux-event-loop-blocking
    question: "Một Reactor Netty WebFlux handler gọi JDBC blocking lâu trực tiếp trên request-processing thread. Rủi ro quan trọng nhất là gì?"
    answers:
      - id: A
        answer: "Chỉ request đó chậm hơn; các connection khác trên cùng event-loop worker không bị ảnh hưởng."
        explanation: "Sai. Event-loop worker bị block có thể làm chậm công việc khác được giao cho worker đó."
      - id: B
        answer: "Spring tự tạo một thread riêng cho mỗi request bị block, nên tác động chính chỉ là tốn thêm memory."
        explanation: "Sai. Đây không phải execution model mặc định của WebFlux event loop."
      - id: C
        answer: "JDBC driver trở thành non-blocking vì controller đang chạy bên trong reactive pipeline."
        explanation: "Sai. Reactive composition không thay đổi I/O model của dependency blocking."
      - id: D
        answer: "Event-loop worker bị giữ không thể xử lý công việc sẵn sàng khác, nên latency có thể tăng trên nhiều exchange đồng thời."
        explanation: "Đúng. Event-loop starvation có thể khuếch đại một dependency blocking thành vấn đề concurrency rộng hơn."
    correctAnswerId: D
    aiGenerated: true
