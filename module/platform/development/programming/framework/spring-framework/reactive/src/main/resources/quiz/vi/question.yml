  - id: webflux-reactor-context-propagation
    question: "Vì sao Reactor Context phù hợp hơn ThreadLocal không có bridge cho correlation data theo request khi đi qua async boundary trong cùng composed Reactor subscription?"
    answers:
      - id: A
        answer: "Reactor Context đi theo subscriber chain; execution có thể resume trên thread nơi ThreadLocal không có bridge sẽ không tự xuất hiện."
        explanation: "Đúng. Step 5 experiment cho thấy contextual data vẫn giữ nguyên dù resumed thread thay đổi."
      - id: B
        answer: "ThreadLocal thông thường vẫn đủ vì Reactor giữ một request trên cùng worker trừ khi application gọi publishOn."
        explanation: "Sai. Reactive execution có thể đi qua scheduler hoặc async boundary mà không giữ ordinary ThreadLocal state nếu không có bridge."
      - id: C
        answer: "ServerWebExchange attribute và Reactor Context tương đương vì mọi downstream operator đều đọc được exchange attribute mà không cần exchange reference."
        explanation: "Sai. Exchange attribute nằm trên ServerWebExchange; Reactor Context có thể được truy cập qua subscriber context mà không cần truyền exchange reference."
      - id: D
        answer: "Value được ghi vào Reactor Context bên trong controller tự động hiện với filter đã chạy trước đó trong chain."
        explanation: "Sai. Context visibility phụ thuộc composition và subscription direction; contextWrite không phải global retroactive mutation."
