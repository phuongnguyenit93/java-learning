  - id: webclient-retrieve-vs-exchange
    question: "Khi nào exchangeToMono hoặc exchangeToFlux phù hợp hơn retrieve()?"
    answers:
      - id: A
        answer: "Khi mọi status dùng cùng body decoding và custom error mapping có thể thực hiện sau khi retrieve() đã decode kết quả."
        explanation: "Sai. Trường hợp này thường phù hợp với retrieve(); exchangeTo* có giá trị khi status/header phải quyết định chính cách decode."
      - id: B
        answer: "Khi response handling cần branch tường minh theo status trước khi quyết định decode body như thế nào hoặc có decode hay không."
        explanation: "Đúng. exchangeToMono/exchangeToFlux expose ClientResponse để xử lý status-aware một cách chủ động."
      - id: C
        answer: "Khi caller chỉ cần status và header sau normal decoding nhưng vẫn muốn giữ default 4xx/5xx handling của retrieve()."
        explanation: "Sai. retrieve() có các entity-oriented variant cho nhiều trường hợp thông thường; riêng nhu cầu này chưa bắt buộc exchangeTo*."
      - id: D
        answer: "Khi ClientResponse body cần được decode ở downstream bên ngoài exchange handler vì exchangeTo* giữ unconsumed response content mở để dùng sau."
        explanation: "Sai. Sau khi publisher của exchange handler complete, unconsumed response content được release; body cần dùng phải được decode trong handler."
    correctAnswerId: B
