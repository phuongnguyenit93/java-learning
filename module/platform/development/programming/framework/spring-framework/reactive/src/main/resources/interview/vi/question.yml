  - question: >-
      Nên chọn WebClient retrieve() hay exchangeToMono()/exchangeToFlux() như thế nào, và cần tránh sai lầm resource-lifecycle nào?
    answer: >-
      retrieve() thuận tiện khi success/error policy đơn giản: mặc định response 4xx và 5xx trở thành WebClientResponseException trừ khi onStatus thay đổi policy, còn các body-decoding method thông thường giữ flow gọn. exchangeToMono() và exchangeToFlux() phù hợp hơn khi status hoặc header phải quyết định cách decode hoặc có consume body hay không, vì chúng expose ClientResponse cho handler. Handler vẫn có body-lifecycle contract: sau khi handler publisher hoàn tất, exchangeTo API release response content chưa consume, nên body cần dùng về sau phải được decode bên trong function đó. Một ngoại lệ liên quan là retrieve().toEntityFlux(), nơi caller phải thực sự subscribe và consume body Flux. Connector pool và event-loop resource lại là một lifecycle concern khác, cần được share hoặc quản lý có chủ đích thay vì tạo lại mỗi request.
