  - question: >-
      Vì sao Reactor Context hữu ích cho request-scoped data trong WebFlux, và correlation-id experiment ở Step 5 chứng minh điều gì?
    answer: >-
      Reactive execution không được định nghĩa bằng việc một request luôn ở trên một Java thread, vì vậy không thể mặc định ThreadLocal thông thường sẽ đi qua mọi asynchronous boundary nếu không có bridge riêng. Reactor Context gắn với subscriber chain nên phù hợp với contextual value cần đi theo reactive composition. Trong experiment, WebFilter chuẩn hóa X-Correlation-Id rồi đặt nó vào Reactor Context, controller đi qua Mono.delay asynchronous boundary và deferContextual đọc lại giá trị sau đó. Response cho thấy correlation id vẫn giống nhau dù resumed thread có thể khác entry thread. Bài học là contextual continuity không phụ thuộc thread affinity, chứ không phải ThreadLocal-based integration luôn không thể hoạt động.
    aiGenerated: true
    reviewed: false
    readmeRelated:
