questions:
  - question: >-
      Khi nào bạn chọn Spring WebFlux thay vì Spring MVC, và vì sao "reactive nhanh hơn" là tiêu chí quyết định kém?
    answer: >-
      WebFlux phù hợp khi request path chủ yếu là asynchronous hoặc non-blocking I/O, streaming, hoặc có rất nhiều I/O wait đồng thời và các dependency quan trọng có thể tham gia mà không giữ request-processing thread. Lợi ích chính là hiệu quả concurrency và tài nguyên khi có I/O latency, không phải bảo đảm mọi request có latency thấp hơn. Spring MVC thường đơn giản hơn khi dependency stack chủ yếu blocking, workload là request/response CRUD thông thường hoặc team không thu được nhiều lợi ích từ reactive composition. Quyết định tốt cần nhìn dominant dependency model, nhu cầu streaming, concurrency profile, operational complexity, kỹ năng của team và capacity đo được thay vì coi stack nào cũng luôn vượt trội.
