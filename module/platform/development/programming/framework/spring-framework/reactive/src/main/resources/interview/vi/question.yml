  - question: >-
      So sánh annotated WebFlux controller với WebFlux.fn. Direct RouterFunction-to-HttpHandler adaptation thay đổi điều gì?
    answer: >-
      Cả hai programming model chạy trên cùng reactive HTTP foundation nên không model nào mặc định "reactive hơn". Annotated controller biểu diễn routing và argument/result convention theo kiểu declarative và dùng controller-method infrastructure. WebFlux.fn biểu diễn routing/handling trực tiếp bằng RouterFunction, HandlerFunction, ServerRequest và ServerResponse, nhờ đó composition và route-local behavior rõ hơn. Trong cấu hình ApplicationContext thông thường, functional route vẫn có thể đi qua DispatcherHandler nhờ RouterFunctionMapping và các strategy liên quan. RouterFunction cũng có thể được adapt trực tiếp thành HttpHandler với HandlerStrategies. Lower-level path này bỏ qua DispatcherHandler route discovery nên application phải cung cấp functional strategies có chủ đích thay vì giả định discovery pipeline chuẩn vẫn điều khiển flow.
    aiGenerated: true
    reviewed: false
