  - question: >-
      Hãy giải thích khác biệt giữa streaming và aggregation trong WebFlux, và những production concern nào xuất hiện sau khi response bắt đầu stream?
    answer: >-
      Aggregation chờ đủ hoặc toàn bộ content được gom thành một value trước khi xử lý hoặc ghi response tiếp theo, còn streaming giữ sequence để value có thể được decode, xử lý và ghi tăng dần khi media type cùng writer hỗ trợ. Streaming có thể giảm nhu cầu buffer toàn bộ payload và đưa kết quả ra sớm hơn, nhưng làm lifecycle phức tạp hơn. Pooled DataBuffer hoặc multipart content phải được consume, relay hoặc release đúng contract; backpressure và cancellation nên được propagate khi boundary hỗ trợ; và khi status, header hoặc một phần body đã committed thì lỗi muộn có thể không còn thay bằng error response sạch. Step 5 SSE experiment chứng minh incremental delivery nhưng không có nghĩa mỗi Flux element tương ứng chính xác một network packet.
