  - question: >-
      Hãy mô tả request-dispatch path chuẩn của WebFlux từ server adapter tới controller result. DispatcherHandler và các strategy chịu trách nhiệm gì?
    answer: >-
      Server-specific adapter đưa request vào common reactive HTTP abstraction của Spring và cuối cùng vào WebHandler contract. Trong cấu hình ApplicationContext thông thường, DispatcherHandler đóng vai trò front controller. Nó hỏi các HandlerMapping để tìm handler, dùng HandlerAdapter tương thích để gọi handler và chuyển HandlerResult cho HandlerResultHandler phù hợp. Codec, reactive adaptation, view rendering và response-body writing tham gia qua những strategy layer xung quanh. Cách tách này giúp DispatcherHandler điều phối request lifecycle mà không hard-code từng controller model hay result type, còn HTTP adapter giữ chi tiết Netty hoặc Servlet container ở bên dưới application programming model.
    aiGenerated: true
    reviewed: false
