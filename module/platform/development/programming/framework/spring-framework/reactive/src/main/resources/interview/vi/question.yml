  - question: >-
      Spring Framework 6.1 phân biệt argument-level validation và method validation trong WebFlux controller như thế nào?
    answer: >-
      Binding và validation bắt đầu từ cách controller argument được tạo. Body hoặc model attribute có thể được decode/bind rồi validate như một object, ví dụ qua @Valid. Built-in controller method validation được áp dụng khi constraint nằm trực tiếp trên method parameter hoặc return value. Khi đó violation được biểu diễn qua HandlerMethodValidationException, còn lỗi binding hoặc object validation có thể xuất hiện dưới dạng WebExchangeBindException. @Valid tự nó là cascade marker chứ không phải direct constraint nên không tự động đồng nghĩa với method validation. Class-level @Validated cũng là một đường AOP-based method validation cũ khác; muốn hiểu built-in 6.1 controller mechanism thì phải tách rõ hai model này.
    aiGenerated: true
