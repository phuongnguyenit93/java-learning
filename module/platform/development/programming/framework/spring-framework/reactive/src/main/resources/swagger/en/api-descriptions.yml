ReactiveHttpDataController:
  stream(int,long):
    summary: Stream finite SSE elements over time
    description: Emit a bounded sequence of server-sent events with sequence numbers
      and per-subscription elapsed-time evidence. The experiment makes incremental
      response delivery visible without creating an unbounded stream or a load benchmark.
