  blockingExecution():
    summary: Observe Spring 6.1 blocking-controller offload
    description: Invoke a synchronous controller method selected by BlockingExecutionConfigurer
      and return its actual thread name plus bounded timing evidence. The result proves
      that Spring can invoke this selected annotated method on the configured executor
      without implying that arbitrary downstream reactive work is also offloaded.
