      methodSignature: "reactorContext(String)"

  - id: webflux-blocking-execution-boundary
    question: "What does WebFlux BlockingExecutionConfigurer prove when a selected annotated controller method runs on a configured executor?"
    answers:
      - id: A
        answer: "The selected controller method and all later operators in any Publisher it returns remain pinned to that executor until the HTTP response completes."
        explanation: "Incorrect. The configuration controls invocation of the selected controller method; later reactive execution follows the publisher's own scheduling semantics."
      - id: B
        answer: "It replaces Reactor scheduler choices for service-layer blocking calls, so selected controllers no longer need explicit boundaries around those dependencies."
        explanation: "Incorrect. It is a controller-invocation facility, not a general scheduler policy for arbitrary downstream blocking work."
      - id: C
        answer: "Spring can invoke selected annotated controller methods on the configured executor, creating an explicit bounded interoperability boundary."
        explanation: "Correct. The experiment demonstrates an invocation boundary, not a universal blocking-to-non-blocking transformation."
      - id: D
        answer: "Its controller-method predicate is also evaluated for functional HandlerFunction routes because both models share the same WebFlux runtime."
        explanation: "Incorrect. Sharing the runtime does not make HandlerFunction a controller HandlerMethod governed by this predicate."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.CrossCuttingProcessing/CrossCuttingProcessing.md"
      anchor: "webflux-blocking-execution"
    apiRelated:
