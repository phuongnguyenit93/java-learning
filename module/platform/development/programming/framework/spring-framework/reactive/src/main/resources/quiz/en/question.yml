  - id: webclient-retrieve-vs-exchange
    question: "When is exchangeToMono or exchangeToFlux a stronger fit than retrieve()?"
    answers:
      - id: A
        answer: "When every status should use the same body decoding and any custom error mapping can happen after retrieve() has already decoded the result."
        explanation: "Incorrect. That scenario usually fits retrieve(); exchangeTo* becomes valuable when status or headers must guide the decoding decision itself."
      - id: B
        answer: "When response handling needs explicit status-dependent branching before deciding how or whether to decode the body."
        explanation: "Correct. exchangeToMono/exchangeToFlux expose ClientResponse for deliberate status-aware handling."
      - id: C
        answer: "When the caller only needs status and headers after normal decoding while keeping retrieve() default handling for 4xx and 5xx responses."
        explanation: "Incorrect. retrieve() can expose entity-oriented variants for common cases; this alone does not require the lower-level exchange branch."
      - id: D
        answer: "When the ClientResponse body should be decoded later, outside the exchange handler, because exchangeTo* keeps unconsumed response content open for downstream use."
        explanation: "Incorrect. After the exchange handler publisher completes, unconsumed response content is released; required body data must be decoded within that handler."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.WebClient/WebClient.md"
      anchor: "webclient-exchange-control"
