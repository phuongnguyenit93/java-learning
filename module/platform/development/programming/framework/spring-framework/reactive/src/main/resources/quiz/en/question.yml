  - id: webflux-reactor-context-propagation
    question: "Why is Reactor Context a better fit than an unbridged ThreadLocal for request-scoped correlation data across asynchronous boundaries in the same composed Reactor subscription?"
    answers:
      - id: A
        answer: "Reactor Context follows the subscriber chain; execution may resume on a thread where an unbridged ThreadLocal value is absent."
        explanation: "Correct. The Step 5 experiment demonstrates preserved contextual data even when the resumed thread changes."
      - id: B
        answer: "An ordinary ThreadLocal remains sufficient because Reactor keeps one request on the same worker unless the application explicitly calls publishOn."
        explanation: "Incorrect. Reactive execution can cross scheduler or asynchronous boundaries without preserving ordinary ThreadLocal state unless a bridge is configured."
      - id: C
        answer: "ServerWebExchange attributes and Reactor Context are interchangeable because any downstream operator can read exchange attributes without receiving the exchange."
        explanation: "Incorrect. Exchange attributes live on ServerWebExchange; Reactor Context is available through the reactive subscriber context without passing that exchange reference."
      - id: D
        answer: "A value written to Reactor Context inside a controller is automatically visible to filters that have already executed earlier in the chain."
        explanation: "Incorrect. Context visibility depends on composition and subscription direction; contextWrite is not a global retroactive mutation."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.CrossCuttingProcessing/CrossCuttingProcessing.md"
      anchor: "webflux-reactor-context"
    apiRelated:
