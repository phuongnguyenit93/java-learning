  - id: webflux-controller-method-validation
    question: "In Spring Framework 6.1 WebFlux controllers, which situation most directly makes built-in method validation applicable?"
    answers:
      - id: A
        answer: "A parameter has only @Valid and no constraint annotations anywhere on the method signature."
        explanation: "Incorrect. @Valid enables nested validation but is not itself a constraint that makes method validation applicable."
      - id: B
        answer: "A constraint is declared directly on a method parameter or return value, so the controller invocation is evaluated through method validation."
        explanation: "Correct. Direct constraints on parameters or the return value are the key trigger described by the built-in 6.1 controller method-validation model."
      - id: C
        answer: "The controller returns Mono, because every reactive return type automatically enables Bean Validation on all method arguments."
        explanation: "Incorrect. Reactive return types and Bean Validation applicability are separate concerns."
      - id: D
        answer: "The controller uses @RestController, because that annotation performs method validation before request mapping."
        explanation: "Incorrect. @RestController does not itself enable method-validation semantics."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.AnnotatedControllers/AnnotatedControllers.md"
      anchor: "webflux-controller-binding-validation"
