  - id: webflux-functional-direct-adaptation
    question: "What changes when a RouterFunction is adapted directly to an HttpHandler with HandlerStrategies instead of being discovered through the usual WebFlux application context?"
    answers:
      - id: A
        answer: "The route is first converted into an annotated controller and then dispatched through controller-method infrastructure."
        explanation: "Incorrect. Direct functional adaptation does not translate the route into an annotated controller."
      - id: B
        answer: "The route still requires RouterFunctionMapping and DispatcherHandler to discover it from the ApplicationContext."
        explanation: "Incorrect. Direct adaptation is specifically a lower-level path that can bypass that discovery chain."
      - id: C
        answer: "HandlerStrategies are ignored because codecs and exception handling exist only in the annotated model."
        explanation: "Incorrect. HandlerStrategies supply functional request/response infrastructure such as codecs and other strategies."
      - id: D
        answer: "The RouterFunction can become an HttpHandler using supplied HandlerStrategies, bypassing DispatcherHandler route discovery."
        explanation: "Correct. This is the lower-level functional deployment path documented by WebFlux.fn."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.FunctionalEndpoints/FunctionalEndpoints.md"
