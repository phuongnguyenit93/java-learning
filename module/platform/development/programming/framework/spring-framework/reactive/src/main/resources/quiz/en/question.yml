  - id: webflux-dispatch-strategy-chain
    question: "After DispatcherHandler receives a request in the standard annotated-controller flow, which responsibility sequence is most accurate?"
    answers:
      - id: A
        answer: "HandlerAdapter chooses a route, HandlerMapping invokes the controller, and WebFilter serializes the return value."
        explanation: "Incorrect. Those responsibilities are assigned to different strategy layers."
      - id: B
        answer: "HandlerMapping finds a handler, HandlerAdapter invokes it, and a HandlerResultHandler processes the resulting value."
        explanation: "Correct. DispatcherHandler coordinates these strategy contracts rather than owning every dispatch detail directly."
      - id: C
        answer: "HttpMessageWriter finds a controller, ReactiveAdapterRegistry invokes it, and HandlerMapping commits the response."
        explanation: "Incorrect. Codecs and reactive adapters participate later in processing but do not replace the dispatch strategy chain."
      - id: D
        answer: "WebHandler selects a HandlerResultHandler first, then HandlerMapping decides whether the already-written response should be routed."
        explanation: "Incorrect. Routing must identify the handler before invocation and result handling."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.RuntimeArchitecture/WebFluxRuntime.md"
      anchor: "webflux-dispatch-strategies"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: webflux-event-loop-blocking
    question: "A Reactor Netty WebFlux handler performs a long blocking JDBC call directly on its request-processing thread. What is the most important risk?"
    answers:
      - id: A
        answer: "Only that one request becomes slower; other connections assigned to the same event-loop worker are unaffected."
        explanation: "Incorrect. Blocking an event-loop worker can delay other work assigned to that worker."
      - id: B
        answer: "Spring automatically creates one dedicated thread per blocked request, so the main effect is higher memory usage."
        explanation: "Incorrect. That is not the default WebFlux event-loop model."
      - id: C
        answer: "The JDBC driver becomes non-blocking because the controller itself runs inside a reactive pipeline."
        explanation: "Incorrect. Reactive composition does not alter the I/O model of a blocking dependency."
      - id: D
        answer: "The blocked event-loop worker cannot process other ready work, so latency can rise across multiple concurrent exchanges."
        explanation: "Correct. Event-loop starvation can amplify one blocking dependency into a wider concurrency problem."
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.RuntimeArchitecture/WebFluxRuntime.md"
      anchor: "webflux-runtime-threading"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: webflux-sse-streaming
    question: "What does the Step 5 SSE experiment demonstrate most directly?"
    answers:
      - id: A
        answer: "A finite Flux with a streaming media type can expose elements incrementally over time instead of aggregating the whole result first."
        explanation: "Correct. The experiment emits bounded SSE frames with increasing elapsed-time evidence."
      - id: B
        answer: "Returning Flux is sufficient by itself; the same incremental behavior would be guaranteed with an aggregating JSON response media type."
        explanation: "Incorrect. The publisher shape alone does not guarantee incremental HTTP flushing; media type, writer, buffering, and transport behavior also matter."
      - id: C
        answer: "delayElements delays source creation, but the server still waits for the Flux to complete before it writes any SSE frame."
        explanation: "Incorrect. The observed frames arrive before publisher completion, which is the runtime evidence for incremental delivery in this experiment."
      - id: D
        answer: "The experiment proves one reactive element maps to one network write, so transport buffering no longer matters for SSE."
        explanation: "Incorrect. It proves visible incremental delivery, not a one-element-to-one-network-write contract."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.HttpDataFlow/ReactiveHttpDataFlow.md"
      anchor: "webflux-streaming-vs-aggregation"
    apiRelated:
