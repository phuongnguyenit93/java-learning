      methodSignature: "stream(int,long)"

  - id: webflux-data-buffer-ownership
    question: "When application code receives pooled DataBuffer content that it does not fully consume or forward, what is the safest mental model?"
    answers:
      - id: A
        answer: "When a DataBuffer originated from a WebFlux decoder, framework code always retains ownership even after user code intercepts the raw buffer."
        explanation: "Incorrect. Once application code participates in raw pooled-buffer handling, ownership must follow the specific consume, relay, retain, or release contract."
      - id: B
        answer: "After a pooled DataBuffer is emitted downstream, its lifetime can be extended until garbage collection without an explicit retain or release decision."
        explanation: "Incorrect. Pooled-buffer lifetime is not governed only by Java garbage collection; reference-counted ownership may need explicit handling."
      - id: C
        answer: "The code that takes ownership must consume, relay, or release the buffer according to the relevant WebFlux contract."
        explanation: "Correct. Buffer ownership must remain explicit, especially when pooled buffers or multipart streaming are involved."
      - id: D
        answer: "Copying the bytes into a separate array makes the original pooled DataBuffer safe to keep indefinitely without releasing its ownership."
        explanation: "Incorrect. Copying data does not by itself discharge the lifecycle obligation for the original pooled buffer."
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.HttpDataFlow/ReactiveHttpDataFlow.md"
      anchor: "webflux-data-buffer-lifecycle"
