# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: jms-layer-responsibility
    question: "A listener stops receiving after the broker connection fails. Which ownership model gives the best first diagnostic path?"
    answers:
      - {id: A, answer: "Treat it as an application-domain failure first, because listener recovery is owned by the business handler.", explanation: "Incorrect. Business handlers should not own broker reconnection or listener-container recovery policy."}
      - {id: B, answer: "Inspect Spring listener-container recovery and provider connectivity; Spring owns the container lifecycle while the provider owns broker connectivity/runtime.", explanation: "Correct. The failure crosses the Spring-container and provider boundary, so both recovery configuration and provider connectivity are relevant."}
      - {id: C, answer: "Change Jakarta Messaging acknowledgement mode first, because acknowledgement mode controls whether a failed network connection is re-established.", explanation: "Incorrect. Acknowledgement affects delivery completion semantics; it is not the primary connection-recovery mechanism."}
      - {id: D, answer: "Replace JmsTemplate, because all Spring JMS consumer recovery is implemented by the synchronous template.", explanation: "Incorrect. Long-lived asynchronous consumption and recovery belong to listener-container infrastructure, not JmsTemplate."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Foundations/SpringJmsFoundations.md", anchor: "jms-framework-spec-provider-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: jms-sync-receive-timeout
    question: "A request-handling thread calls JmsTemplate.receive on a queue where messages may not arrive. Which configuration best prevents that thread from waiting forever?"
    answers:
      - {id: A, answer: "Use the default receive timeout, because JmsTemplate defaults to a bounded provider-specific wait.", explanation: "Incorrect. The default JmsTemplate receive behavior is an indefinite wait."}
      - {id: B, answer: "Use RECEIVE_TIMEOUT_NO_WAIT, because every synchronous workflow should always poll without waiting.", explanation: "Incorrect. No-wait is bounded but can turn normal latency into repeated empty polls; it is not automatically the right policy for every workflow."}
      - {id: C, answer: "Set a positive receiveTimeout from the request latency budget and handle null when the wait window expires.", explanation: "Correct. A positive timeout bounds the blocking call, and receive-style methods return null when the window expires without a message."}
      - {id: D, answer: "Enable explicit QoS on JmsTemplate, because time-to-live also bounds how long receive blocks.", explanation: "Incorrect. Producer QoS such as TTL controls message metadata, not the caller's synchronous receive wait."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.TemplateAccess/JmsTemplateAccess.md", anchor: "jms-template-sync-receive"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: jms-request-reply-runtime
    question: "What does a broker-mediated JmsTemplate.sendAndReceive round trip demonstrate in Spring Framework 6.1?"
    answers:
      - {id: A, answer: "The caller sends a request, waits on a temporary reply destination, and can verify reply correlation against the request message id.", explanation: "Correct. The experiment observes the temporary JMSReplyTo destination, a bounded synchronous wait, and explicit reply correlation."}
      - {id: B, answer: "The caller returns immediately after send, while Spring later invokes a callback when any response appears on the original request queue.", explanation: "Incorrect. sendAndReceive is synchronous and waits for a response rather than returning immediately."}
      - {id: C, answer: "The exchange automatically reuses any caller thread-bound local JMS transaction, so the request and reply always belong to that transaction.", explanation: "Incorrect. Spring 6.1 uses the template's local request-reply execution path and does not simply reuse a caller's thread-bound transactional session."}
      - {id: D, answer: "The responder must publish to a statically configured reply queue because sendAndReceive does not set JMSReplyTo.", explanation: "Incorrect. The operation uses a temporary reply destination for the exchange."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.TemplateAccess/JmsTemplateAccess.md", anchor: "jms-template-request-reply"}
    apiRelated: {controller: "JmsTemplateExperimentController", methodSignature: "observeRequestReplyRoundTrip()"}

  - id: jms-json-type-id
    question: "A MappingJackson2MessageConverter receives JSON from JMS but no type-id property is present. No custom type-resolution strategy is configured. What is the important Spring 6.1 implication?"
    answers:
      - {id: A, answer: "The converter always infers the Java type from JSON field names, so type metadata is optional for inbound JMS conversion.", explanation: "Incorrect. The default converter cannot reliably infer the intended application type from JSON structure alone."}
      - {id: B, answer: "The destination name becomes the Java class name automatically, so the converter can deserialize without type-id configuration.", explanation: "Incorrect. Destination resolution and payload type resolution are separate concerns."}
      - {id: C, answer: "A later higher-level receive method's target class automatically supplies the missing type to the JMS converter before conversion occurs.", explanation: "Incorrect. A later target type does not by itself remove the converter's inbound type-id requirement."}
      - {id: D, answer: "The default inbound path needs a configured type-id property, or the application must provide another type-resolution strategy.", explanation: "Correct. MappingJackson2MessageConverter's normal inbound path depends on configured type-id metadata unless type resolution is customized."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.DestinationsConversionMetadata/DestinationsConversionMetadata.md", anchor: "jms-payload-conversion"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: jms-listener-container-ownership
    question: "Why is a Spring MessageListenerContainer usually preferable to an application-written receive loop for a continuously running consumer?"
    answers:
      - {id: A, answer: "It converts every JMS provider into the same broker implementation, so provider-specific runtime behavior disappears.", explanation: "Incorrect. Spring standardizes framework integration but does not replace provider behavior or the Jakarta Messaging contract."}
      - {id: B, answer: "It centralizes long-lived consumer lifecycle, concurrency, recovery, resource reuse, and transaction/acknowledgement configuration.", explanation: "Correct. Those long-lived runtime responsibilities are exactly what the listener container is designed to own."}
      - {id: C, answer: "It guarantees exactly-once processing for every listener by preventing all redelivery after an exception.", explanation: "Incorrect. Redelivery and duplicates remain possible; transaction, acknowledgement, provider policy, and idempotency still matter."}
      - {id: D, answer: "It makes listener execution synchronous with the producer, so the sender waits until the business listener returns.", explanation: "Incorrect. Message-driven consumption changes control direction but does not turn the sender into a synchronous caller."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.ListenerContainer/ListenerContainer.md", anchor: "jms-listener-container-responsibilities"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: jms-listener-validation
    question: "An @JmsListener method has @Valid on its payload, but invalid objects are still accepted in a pure Spring Framework setup. What is the most likely missing configuration?"
    answers:
      - {id: A, answer: "A DestinationResolver, because validation runs only after destination names are resolved by a custom resolver.", explanation: "Incorrect. Destination lookup does not enable handler-method validation."}
      - {id: B, answer: "A transacted listener Session, because Bean Validation is activated only when sessionTransacted is true.", explanation: "Incorrect. Transaction configuration and payload validation are independent concerns."}
      - {id: C, answer: "A Validator on the DefaultMessageHandlerMethodFactory registered for JMS listener method invocation.", explanation: "Correct. @Valid marks the payload, but handler-method validation needs an actual Validator configured in the message-handler method factory."}
      - {id: D, answer: "A JmsTransactionManager, because it supplies the Jakarta Validation provider to the listener container.", explanation: "Incorrect. JmsTransactionManager coordinates JMS transactions; it does not provide payload validation."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.AnnotationEndpoints/AnnotationEndpoints.md", anchor: "jms-listener-conversion-validation"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: jms-listener-reply-precedence
    question: "An annotated JMS listener returns a JmsResponse with destination X. The incoming message also has JMSReplyTo=Y, and the method has @SendTo(\"Z\"). Which destination wins for that reply?"
    answers:
      - {id: A, answer: "Z wins; the precedence is @SendTo/default, then JMSReplyTo, then the JmsResponse destination.", explanation: "Incorrect. @SendTo/default is the final fallback, not the first choice when runtime reply destinations are present."}
      - {id: B, answer: "Y wins; the precedence is JMSReplyTo, then the JmsResponse destination, then @SendTo/default.", explanation: "Incorrect. An explicit destination carried by JmsResponse takes precedence over JMSReplyTo."}
      - {id: C, answer: "X wins; the precedence is the JmsResponse destination, then @SendTo/default, then JMSReplyTo.", explanation: "Incorrect. JmsResponse is first, but JMSReplyTo is considered before the configured/default destination."}
      - {id: D, answer: "X wins; the precedence is the JmsResponse destination, then JMSReplyTo, then @SendTo/default.", explanation: "Correct. The most explicit runtime destination wins, followed by the request reply destination and then the configured/default fallback."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.AnnotationEndpoints/AnnotationEndpoints.md", anchor: "jms-listener-replies"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: jms-rollback-redelivery-idempotency
    question: "A locally transacted listener throws on its first delivery, then succeeds when the provider redelivers the same message. What should the application conclude from that behavior?"
    answers:
      - {id: A, answer: "Use a stable business/idempotency key and make the effect duplicate-safe; the local JMS rollback covers message delivery, not arbitrary external effects.", explanation: "Correct. Redelivery is a recovery mechanism, while duplicate-safe business handling protects effects that are outside the local JMS transaction."}
      - {id: B, answer: "Use JMSRedelivered as the deduplication key; once it becomes true, skip the business effect because the flag uniquely identifies the earlier attempt.", explanation: "Incorrect. JMSRedelivered is delivery metadata, not a stable business identity or proof of what the prior attempt changed."}
      - {id: C, answer: "Rely on the local JMS transaction to roll back both the message and any database work on the same thread, so a separate idempotency mechanism is unnecessary.", explanation: "Incorrect. A local JMS transaction does not automatically coordinate an unrelated database transaction or other external side effects."}
      - {id: D, answer: "Use the provider's delivery-attempt count as the business identity and apply the effect whenever that counter starts over after reconnect or restart.", explanation: "Incorrect. Provider attempt counters are not a portable stable business identity and should not replace application-level idempotency."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.TransactionsDelivery/TransactionsDelivery.md", anchor: "jms-redelivery-idempotency"}
    apiRelated: {controller: "JmsTransactionExperimentController", methodSignature: "observeRollbackRedelivery()"}

  - id: jms-concurrency-ordering
    question: "A queue listener increases concurrent consumers from one to several to improve throughput. What trade-off should be reviewed first?"
    answers:
      - {id: A, answer: "Assume provider dispatch order also guarantees business completion order, so concurrency can be raised without revisiting ordering requirements.", explanation: "Incorrect. Several deliveries can be in flight and finish in a different order even when dispatch ordering constraints are respected."}
      - {id: B, answer: "Enable sessionTransacted so commits are globally serialized in original queue order across all concurrent consumers.", explanation: "Incorrect. A transacted session controls each consumer's delivery transaction; it does not create a global commit-order barrier across consumers."}
      - {id: C, answer: "Expect multiple in-flight messages to finish out of order, and define whether ordering must be global, keyed, or irrelevant before scaling concurrency.", explanation: "Correct. Throughput and ordering are separate requirements; keyed or serialized processing may be needed for order-sensitive work."}
      - {id: D, answer: "Assume per-aggregate ordering remains automatic as long as all consumers read the same queue, so no routing or serialization strategy is needed.", explanation: "Incorrect. Multiple consumers can process messages for the same aggregate concurrently unless the topology deliberately preserves that ordering."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.ConcurrencyRecoveryLifecycle/ConcurrencyRecoveryLifecycle.md", anchor: "jms-ordering-tradeoffs"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: jms-observability-boundary
    question: "A Spring Framework 6.1 JMS experiment records jms.message.publish and jms.message.process, then performs a bounded blocking receive on an empty destination. Which result matches the intended observation model?"
    answers:
      - {id: A, answer: "A jms.message.receive observation should measure the full empty wait; its absence means the ObservationRegistry is broken.", explanation: "Incorrect. Spring 6.1 intentionally does not model blocking receive wait time as jms.message.receive observation."}
      - {id: B, answer: "Publish and process observations can appear while the empty receive returns null without a jms.message.receive observation.", explanation: "Correct. This is the intended Spring 6.1 boundary between message publication/processing and time spent waiting for work."}
      - {id: C, answer: "Only jms.message.receive should appear, because publish and process observations are available only through Spring Integration rather than Spring JMS.", explanation: "Incorrect. Spring JMS 6.1 supports publish and process observations when the relevant components have an ObservationRegistry."}
      - {id: D, answer: "No observation can appear unless every JMS call uses an external transaction manager, because observability is transaction-scoped.", explanation: "Incorrect. Observation configuration is independent of requiring an external transaction manager."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.ProductionReadiness/ProductionReadiness.md", anchor: "jms-observability-61"}
    apiRelated: {controller: "JmsObservabilityExperimentController", methodSignature: "observePublishProcessBoundary()"}
