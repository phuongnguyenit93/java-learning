JmsTemplateExperimentController:
  observeRequestReplyRoundTrip():
    summary: Observe a JmsTemplate request-reply round trip
    description: Sends a text request through JmsTemplate.sendAndReceive, lets a bounded
      listener reply through the incoming JMSReplyTo destination, and returns runtime
      evidence for the temporary reply destination, listener invocation, correlation,
