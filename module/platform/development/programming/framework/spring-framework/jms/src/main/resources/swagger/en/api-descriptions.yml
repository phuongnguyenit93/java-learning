JmsTransactionExperimentController:
  observeRollbackRedelivery():
    summary: Observe rollback-driven JMS redelivery
    description: Sends one message to a locally transacted listener that intentionally
      fails its first delivery and succeeds on the next attempt. The response records
      delivery attempts, JMSRedelivered flags, the listener error, and the single
      successful business effect.
