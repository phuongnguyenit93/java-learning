  - id: jms-concurrency-ordering
    question: "Một queue listener tăng concurrent consumers từ một lên nhiều consumer để tăng throughput. Trade-off nào cần được xem xét đầu tiên?"
    answers:
      - {id: A, answer: "Giả định provider dispatch theo thứ tự cũng bảo đảm business completion order, nên có thể tăng concurrency mà không cần xem lại ordering requirement.", explanation: "Sai. Nhiều delivery có thể cùng in-flight và hoàn tất khác thứ tự ngay cả khi dispatch-order constraint vẫn được giữ."}
      - {id: B, answer: "Bật sessionTransacted để commit được serialize toàn cục theo thứ tự queue ban đầu trên mọi concurrent consumer.", explanation: "Sai. Transacted session điều khiển transaction của từng consumer chứ không tạo global commit-order barrier giữa nhiều consumer."}
      - {id: C, answer: "Dự kiến nhiều message in-flight có thể hoàn tất khác thứ tự, rồi xác định ordering phải global, theo key hay không quan trọng trước khi scale concurrency.", explanation: "Đúng. Throughput và ordering là hai requirement khác nhau; work nhạy với thứ tự có thể cần keyed hoặc serialized processing."}
      - {id: D, answer: "Giả định per-aggregate ordering vẫn tự động được giữ khi mọi consumer đọc cùng queue, nên không cần routing hay serialization strategy riêng.", explanation: "Sai. Nhiều consumer có thể xử lý message của cùng aggregate song song nếu topology không chủ đích bảo toàn ordering."}
