  - id: jms-observability-boundary
    question: "Một thí nghiệm Spring Framework 6.1 JMS ghi nhận jms.message.publish và jms.message.process rồi chạy blocking receive có giới hạn trên destination rỗng. Kết quả nào đúng với observation model mong đợi?"
    answers:
      - {id: A, answer: "Phải có jms.message.receive đo toàn bộ thời gian chờ rỗng; nếu không có nghĩa là ObservationRegistry bị lỗi.", explanation: "Sai. Spring 6.1 cố ý không mô hình hóa blocking receive wait time thành jms.message.receive observation."}
      - {id: B, answer: "Publish và process observation có thể xuất hiện trong khi empty receive trả null mà không có jms.message.receive observation.", explanation: "Đúng. Đây là ranh giới chủ đích của Spring 6.1 giữa publish/process message và thời gian chỉ chờ work."}
      - {id: C, answer: "Chỉ jms.message.receive xuất hiện vì publish/process observation chỉ thuộc Spring Integration chứ không thuộc Spring JMS.", explanation: "Sai. Spring JMS 6.1 hỗ trợ publish/process observation khi component liên quan có ObservationRegistry."}
      - {id: D, answer: "Không observation nào xuất hiện nếu mọi JMS call không dùng external transaction manager vì observability gắn với transaction scope.", explanation: "Sai. Observation configuration độc lập với việc có external transaction manager hay không."}
    correctAnswerId: B
