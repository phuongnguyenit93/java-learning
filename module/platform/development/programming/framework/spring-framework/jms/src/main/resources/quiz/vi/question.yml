  - id: jms-listener-container-ownership
    question: "Vì sao Spring MessageListenerContainer thường phù hợp hơn một receive loop tự viết cho consumer chạy liên tục?"
    answers:
      - {id: A, answer: "Nó biến mọi JMS provider thành cùng một broker implementation nên provider-specific runtime behavior biến mất.", explanation: "Sai. Spring chuẩn hóa framework integration nhưng không thay thế provider behavior hay Jakarta Messaging contract."}
      - {id: B, answer: "Nó gom lifecycle dài hạn của consumer, concurrency, recovery, resource reuse và transaction/acknowledgement configuration.", explanation: "Đúng. Đây chính là các runtime responsibility mà listener container được thiết kế để sở hữu."}
      - {id: C, answer: "Nó đảm bảo exactly-once processing cho mọi listener bằng cách ngăn toàn bộ redelivery sau exception.", explanation: "Sai. Redelivery và duplicate vẫn có thể xảy ra; transaction, acknowledgement, provider policy và idempotency vẫn quan trọng."}
      - {id: D, answer: "Nó làm listener execution đồng bộ với producer nên sender chờ tới khi business listener hoàn tất.", explanation: "Sai. Message-driven consumption đổi chiều điều khiển nhưng không biến sender thành synchronous caller."}
    correctAnswerId: B
