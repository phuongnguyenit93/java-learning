  - id: jms-listener-validation
    question: "Một @JmsListener method có @Valid trên payload nhưng object không hợp lệ vẫn được chấp nhận trong Spring Framework thuần. Cấu hình nào có khả năng đang thiếu nhất?"
    answers:
      - {id: A, answer: "DestinationResolver vì validation chỉ chạy sau khi destination name được custom resolver xử lý.", explanation: "Sai. Destination lookup không kích hoạt handler-method validation."}
      - {id: B, answer: "Transacted listener Session vì Bean Validation chỉ được bật khi sessionTransacted=true.", explanation: "Sai. Transaction configuration và payload validation là hai concern độc lập."}
      - {id: C, answer: "Một Validator trên DefaultMessageHandlerMethodFactory được đăng ký cho việc gọi JMS listener method.", explanation: "Đúng. @Valid đánh dấu payload, nhưng handler-method validation cần Validator thực sự được cấu hình trong message-handler method factory."}
      - {id: D, answer: "JmsTransactionManager vì nó cung cấp Jakarta Validation provider cho listener container.", explanation: "Sai. JmsTransactionManager phối hợp JMS transaction chứ không cung cấp payload validation."}
    correctAnswerId: C
