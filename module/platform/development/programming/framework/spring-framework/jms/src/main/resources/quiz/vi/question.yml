  - id: jms-json-type-id
    question: "MappingJackson2MessageConverter nhận JSON từ JMS nhưng không có type-id property và cũng không có custom type-resolution strategy. Hệ quả quan trọng trong Spring 6.1 là gì?"
    answers:
      - {id: A, answer: "Converter luôn suy ra Java type từ tên field trong JSON nên type metadata là tùy chọn cho inbound JMS conversion.", explanation: "Sai. Default converter không thể suy ra đáng tin cậy application type mong muốn chỉ từ cấu trúc JSON."}
      - {id: B, answer: "Destination name tự động trở thành Java class name nên converter deserialize được mà không cần type-id configuration.", explanation: "Sai. Destination resolution và payload type resolution là hai trách nhiệm khác nhau."}
      - {id: C, answer: "Target class của higher-level receive method ở bước sau tự động cung cấp type còn thiếu cho JMS converter trước khi conversion xảy ra.", explanation: "Sai. Target type ở tầng sau không tự loại bỏ yêu cầu type-id của converter ở inbound path."}
      - {id: D, answer: "Default inbound path cần type-id property đã cấu hình, hoặc ứng dụng phải cung cấp chiến lược xác định type khác.", explanation: "Đúng. MappingJackson2MessageConverter mặc định dựa vào type-id metadata cho inbound conversion trừ khi type resolution được tùy biến."}
    correctAnswerId: D
