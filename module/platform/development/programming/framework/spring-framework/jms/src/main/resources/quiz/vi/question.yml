  - id: jms-listener-reply-precedence
    question: "Một annotated JMS listener trả về JmsResponse với destination X. Incoming message cũng có JMSReplyTo=Y và method có @SendTo(\"Z\"). Destination nào được ưu tiên cho reply?"
    answers:
      - {id: A, answer: "Z được chọn; precedence là @SendTo/default, rồi JMSReplyTo, rồi destination trong JmsResponse.", explanation: "Sai. @SendTo/default là fallback cuối cùng, không phải lựa chọn đầu khi có runtime reply destination."}
      - {id: B, answer: "Y được chọn; precedence là JMSReplyTo, rồi destination trong JmsResponse, rồi @SendTo/default.", explanation: "Sai. Destination tường minh trong JmsResponse được ưu tiên hơn JMSReplyTo."}
      - {id: C, answer: "X được chọn; precedence là destination trong JmsResponse, rồi @SendTo/default, rồi JMSReplyTo.", explanation: "Sai. JmsResponse đứng đầu, nhưng JMSReplyTo được xét trước configured/default destination."}
      - {id: D, answer: "X được chọn; precedence là destination trong JmsResponse, rồi JMSReplyTo, rồi @SendTo/default.", explanation: "Đúng. Runtime destination tường minh nhất được ưu tiên, sau đó là reply destination của request và cuối cùng là configured/default fallback."}
    correctAnswerId: D
    aiGenerated: true
