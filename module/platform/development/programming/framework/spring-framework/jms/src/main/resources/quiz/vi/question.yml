  - id: jms-rollback-redelivery-idempotency
    question: "Một locally transacted listener ném lỗi ở delivery đầu rồi thành công khi provider giao lại cùng message. Ứng dụng nên kết luận gì từ hành vi đó?"
    answers:
      - {id: A, answer: "Dùng stable business/idempotency key và làm business effect duplicate-safe; local JMS rollback chỉ bao phủ message delivery chứ không bao phủ arbitrary external effect.", explanation: "Đúng. Redelivery là cơ chế phục hồi, còn duplicate-safe business handling bảo vệ các effect nằm ngoài local JMS transaction."}
      - {id: B, answer: "Dùng JMSRedelivered làm deduplication key; khi flag là true thì bỏ qua business effect vì flag này định danh duy nhất attempt trước.", explanation: "Sai. JMSRedelivered là delivery metadata, không phải stable business identity hay bằng chứng về những gì attempt trước đã thay đổi."}
      - {id: C, answer: "Dựa vào local JMS transaction để rollback cả message lẫn database work chạy cùng thread, nên không cần cơ chế idempotency riêng.", explanation: "Sai. Local JMS transaction không tự động phối hợp unrelated database transaction hay external side effect khác."}
      - {id: D, answer: "Dùng delivery-attempt count của provider làm business identity và áp dụng effect khi counter bắt đầu lại sau reconnect hoặc restart.", explanation: "Sai. Provider attempt counter không phải portable stable business identity và không nên thay thế application-level idempotency."}
    correctAnswerId: A
