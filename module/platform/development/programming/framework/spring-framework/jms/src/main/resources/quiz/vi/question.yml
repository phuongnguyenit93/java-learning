  - id: jms-sync-receive-timeout
    question: "Một request-handling thread gọi JmsTemplate.receive trên queue mà message có thể không đến. Cấu hình nào phù hợp nhất để thread không chờ vô hạn?"
    answers:
      - {id: A, answer: "Dùng receive timeout mặc định vì JmsTemplate mặc định có thời gian chờ hữu hạn do provider quyết định.", explanation: "Sai. Mặc định JmsTemplate chờ receive vô hạn."}
      - {id: B, answer: "Dùng RECEIVE_TIMEOUT_NO_WAIT vì mọi synchronous workflow luôn nên poll mà không chờ.", explanation: "Sai. No-wait có giới hạn nhưng có thể biến latency bình thường thành nhiều lần poll rỗng; nó không tự động đúng cho mọi workflow."}
      - {id: C, answer: "Đặt receiveTimeout dương theo latency budget của request và xử lý null khi hết khoảng chờ.", explanation: "Đúng. Timeout dương giới hạn blocking call, và receive-style method trả null khi hết khoảng chờ mà không có message."}
      - {id: D, answer: "Bật explicit QoS trên JmsTemplate vì time-to-live cũng giới hạn thời gian receive bị block.", explanation: "Sai. Producer QoS như TTL điều khiển metadata của message, không giới hạn thời gian synchronous receive của caller."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.TemplateAccess/JmsTemplateAccess.md", anchor: "jms-template-sync-receive"}
