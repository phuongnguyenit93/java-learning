questions:
  - id: jms-layer-responsibility
    question: "Một listener ngừng nhận message sau khi kết nối broker bị lỗi. Mô hình ownership nào cho hướng chẩn đoán đầu tiên tốt nhất?"
    answers:
      - {id: A, answer: "Trước tiên xem đây là lỗi domain của ứng dụng vì business handler sở hữu cơ chế recovery của listener.", explanation: "Sai. Business handler không nên sở hữu việc reconnect broker hay chính sách recovery của listener container."}
      - {id: B, answer: "Kiểm tra recovery của Spring listener container và provider connectivity; Spring sở hữu vòng đời container còn provider sở hữu broker runtime/kết nối.", explanation: "Đúng. Lỗi đi qua ranh giới giữa Spring container và provider nên cả recovery configuration lẫn provider connectivity đều liên quan."}
      - {id: C, answer: "Đổi acknowledgement mode của Jakarta Messaging trước vì acknowledgement mode quyết định việc thiết lập lại network connection.", explanation: "Sai. Acknowledgement ảnh hưởng semantics hoàn tất delivery, không phải cơ chế chính để khôi phục connection."}
      - {id: D, answer: "Thay JmsTemplate vì toàn bộ recovery của Spring JMS consumer được triển khai bởi synchronous template.", explanation: "Sai. Asynchronous consumption dài hạn và recovery thuộc listener-container infrastructure, không thuộc JmsTemplate."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Foundations/SpringJmsFoundations.md", anchor: "jms-framework-spec-provider-boundary"}
