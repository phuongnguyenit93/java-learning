  - id: jms-request-reply-runtime
    question: "Một vòng JmsTemplate.sendAndReceive đi qua broker chứng minh điều gì trong Spring Framework 6.1?"
    answers:
      - {id: A, answer: "Caller gửi request, chờ trên temporary reply destination và có thể kiểm tra correlation của reply với message id của request.", explanation: "Đúng. Thí nghiệm quan sát temporary JMSReplyTo, synchronous wait có giới hạn và reply correlation tường minh."}
      - {id: B, answer: "Caller trả về ngay sau send, còn Spring sẽ gọi callback sau khi response bất kỳ xuất hiện trên request queue ban đầu.", explanation: "Sai. sendAndReceive là synchronous và chờ response thay vì trả về ngay."}
      - {id: C, answer: "Exchange tự động tái sử dụng local JMS transaction đang gắn với thread của caller nên request và reply luôn thuộc transaction đó.", explanation: "Sai. Spring 6.1 dùng đường thực thi request-reply riêng của template và không đơn giản tái sử dụng transactional session đang gắn với thread của caller."}
      - {id: D, answer: "Responder bắt buộc publish vào static reply queue vì sendAndReceive không thiết lập JMSReplyTo.", explanation: "Sai. Operation này dùng temporary reply destination cho exchange."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.TemplateAccess/JmsTemplateAccess.md", anchor: "jms-template-request-reply"}
