  - question: >-
      Một transacted JMS listener thất bại sau khi đã chạm business state, broker giao lại message và attempt kế tiếp thành công. JMS transaction bảo đảm gì, không bảo đảm gì, và idempotency nằm ở đâu?
    answer: >-
      Với locally transacted listener Session, exception có thể khiến Spring rollback JMS transaction để consumed message đủ điều kiện provider redelivery. Delivery sau có thể mang JMSRedelivered=true, nhưng flag đó chỉ mô tả trạng thái giao message. Nó không chứng minh database, HTTP hay external side effect không liên quan ở attempt đầu được rollback atomically. Vì vậy rollback/redelivery là cơ chế phục hồi, không phải exactly-once business semantics. Business effect có thể bị retry cần thiết kế duplicate-safe, ví dụ dùng stable business/idempotency key và durable record cho work đã áp dụng. Nếu thật sự cần atomicity giữa nhiều transactional resource, phải đánh giá mô hình JTA/XA có coordinator và resource hỗ trợ thật thay vì giả định local JMS transaction tự mở rộng.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.TransactionsDelivery/TransactionsDelivery.md"
      anchor: "jms-redelivery-idempotency"
    apiRelated:
      controller: "JmsTransactionExperimentController"
      methodSignature: "observeRollbackRedelivery()"

  - question: >-
      Listener concurrency, ordering requirement, recovery policy và DMLC resource caching tác động với nhau thế nào trong một JMS consumer ở môi trường production?
    answer: >-
      Tăng concurrency làm nhiều message có thể in-flight cùng lúc và có thể tăng throughput, nhưng thứ tự hoàn tất có thể khác thứ tự delivery nên phải xác định business ordering requirement trước khi scale consumer. Recovery policy là concern riêng: BackOff và container recovery xử lý lỗi infrastructure/setup, còn rollback/redelivery xử lý một delivery bị lỗi. Resource caching phải khớp transaction model. Không có external transaction manager, DMLC thường cache tới consumer level; khi có external transaction manager, default chuyển về CACHE_NONE để môi trường có cơ hội enlist resource mới đúng transaction. Tăng cache level dưới JTA/XA là optimization đặc thù integration và phải được kiểm chứng với provider/server thực tế, không nên sao chép máy móc.
    aiGenerated: true
    reviewed: false
