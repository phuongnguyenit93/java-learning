  - question: >-
      Bạn sẽ kiểm chứng Spring JMS integration bằng test và observability kiểu production như thế nào, và khi nào Spring Integration trở thành abstraction phù hợp hơn Spring JMS trực tiếp?
    answer: >-
      Dùng layer test nhỏ nhất có thể chứng minh từng hành vi: unit-test business/idempotency logic, test converter riêng, dùng Spring configuration test cho @JmsListener binding và validation, và dùng provider integration test thật cho destination resolution, transaction, redelivery, selector, subscription và connection recovery. Mọi asynchronous wait phải có giới hạn thay vì dựa vào sleep tùy ý. Với observability Spring Framework 6.1, Micrometer Jakarta JMS instrumentation phải có mặt và ObservationRegistry phải được cấu hình trên component sở hữu operation; khi đó có thể mong đợi jms.message.publish cùng jms.message.process, còn thời gian blocking receive chờ message cố ý không được biểu diễn thành jms.message.receive observation. Spring JMS trực tiếp phù hợp khi bài toán cơ bản là JMS-shaped. Nếu topology integration tự nó cần routing, filtering, transformation, aggregation, gateway hoặc nhiều transport thì Spring Integration là EIP abstraction ở tầng cao hơn và có thể dùng Spring JMS bên dưới.
