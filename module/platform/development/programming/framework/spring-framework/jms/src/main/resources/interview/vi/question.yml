  - question: >-
      Một @JmsListener nhận domain object đã được convert, validate payload và đôi khi trả reply. Hãy giải thích các lớp xử lý và precedence của reply destination.
    answer: >-
      Trước hết JMS MessageConverter chuyển jakarta.jms.Message từ provider thành object của ứng dụng. Sau đó handler-method infrastructure của Spring resolve object và header đã convert thành method argument. Chỉ có @Valid chưa làm validation hoạt động trong Spring Framework thuần; handler-method factory cần một Validator thực sự. Với reply trả về, lựa chọn runtime tường minh nhất được ưu tiên: destination trong JmsResponse đứng trước, sau đó là JMSReplyTo của incoming message, cuối cùng mới là configured/default destination như @SendTo. Conversion failure và validation failure là hai failure mode khác nhau và nên được tách biệt trong log cũng như test.
    aiGenerated: true
    reviewed: false
