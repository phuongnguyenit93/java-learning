  - question: >-
      So sánh DefaultMessageListenerContainer và SimpleMessageListenerContainer. Runtime requirement nào nên quyết định lựa chọn thay vì xem chúng chỉ là hai kiểu configuration tương đương?
    answer: >-
      Cả hai đều chuyển JMS delivery thành application listener invocation nhưng sở hữu runtime behavior khác nhau. SimpleMessageListenerContainer là mô hình đơn giản với số consumer cố định và dùng callback MessageConsumer.setMessageListener của provider. DefaultMessageListenerContainer sở hữu receive loop và task-based invoker, hỗ trợ dynamic concurrency, recovery mạnh hơn, local/external transaction participation và resource caching có thể cấu hình. Hãy chọn dựa trên nhu cầu thực như recovery sau broker failure, transactional consumption, dynamic scaling, shutdown behavior và provider/container integration. Container sở hữu consumer resource và lifecycle nên application listener không nên giữ hoặc đóng chúng. Tăng concurrency là công cụ throughput, không phải bảo đảm ordering tốt hơn hay latency thấp hơn.
    aiGenerated: true
    reviewed: false
    readmeRelated:
