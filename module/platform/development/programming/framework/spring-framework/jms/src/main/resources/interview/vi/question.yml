questions:
  - question: >-
      Hãy giải thích ranh giới trách nhiệm giữa Spring JMS, Jakarta Messaging và JMS provider. Ranh giới đó giúp chẩn đoán lỗi production như thế nào?
    answer: >-
      Spring JMS sở hữu phần tích hợp framework như thực thi JmsTemplate, vòng đời listener container, destination resolution, conversion hook, annotation endpoint, transaction integration và cấu hình observability. Jakarta Messaging định nghĩa các contract như ConnectionFactory, Session, Destination, Message, producer, consumer, acknowledgement mode và selector. Provider hiện thực các contract đó và sở hữu hành vi broker/runtime như connectivity, storage, clustering, administration và tuning đặc thù. Khi chẩn đoán, hãy tìm đúng layer sở hữu hành vi: kiểm tra resolver/container configuration nếu lỗi nằm ở Spring integration, kiểm tra Jakarta contract nếu hiểu sai delivery/acknowledgement semantics, và kiểm tra provider connectivity/runtime nếu broker có vấn đề. Spring giảm ceremony lặp lại nhưng không xóa semantics của provider.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Foundations/SpringJmsFoundations.md"
      anchor: "jms-framework-spec-provider-boundary"
    apiRelated:
      controller: ""
