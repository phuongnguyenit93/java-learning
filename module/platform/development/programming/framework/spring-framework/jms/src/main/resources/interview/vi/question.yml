  - question: >-
      Khi nào JmsTemplate.sendAndReceive là lựa chọn thiết kế phù hợp, và cần giải thích trade-off nào về latency, correlation và transaction trước khi dùng?
    answer: >-
      Chỉ nên dùng request-reply khi caller thực sự cần câu trả lời trước khi tiếp tục và có failure policy hữu hạn. Trong Spring Framework 6.1, JmsTemplate.sendAndReceive gửi request rồi chờ đồng bộ trên temporary reply destination, vì vậy latency và availability của responder trở thành latency và availability của caller. Reply phải correlate đúng request, nhưng correlation metadata không làm repeated request trở nên idempotent. Một ranh giới transaction dễ bỏ sót là đường request-reply này dùng local non-transacted execution path của template thay vì đơn giản tái sử dụng transactional JMS Session đang gắn với thread của caller. Khi không cần câu trả lời ngay, one-way command/event thường cách ly lỗi tốt hơn và ít kéo failure của downstream vào caller hơn.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.TemplateAccess/JmsTemplateAccess.md"
      anchor: "jms-template-request-reply"
    apiRelated:
      controller: "JmsTemplateExperimentController"
      methodSignature: "observeRequestReplyRoundTrip()"

  - question: >-
      Bạn sẽ thiết kế payload conversion và type metadata cho JMS thế nào để hai service deploy độc lập có thể tiến hóa mà không buộc wire contract phụ thuộc vào chi tiết Java implementation?
    answer: >-
      Hãy xem conversion là integration contract chứ không phải serialization helper cục bộ. Với các service tiến hóa độc lập, nên ưu tiên representation ổn định như JSON cùng logical type id tường minh thay vì đưa trực tiếp package/class name Java lên wire. MappingJackson2MessageConverter cần type-id property đã cấu hình trên default inbound path trừ khi type resolution được tùy biến, nên producer và consumer phải thống nhất property và mapping. Destination resolution, payload type resolution và business identity là ba concern khác nhau. Contract cần được quản lý phiên bản một cách có chủ đích và conversion nên được test hai chiều; target type ở higher-level API về sau không tự xóa yêu cầu inbound type resolution của JMS converter.
    aiGenerated: true
    reviewed: false
    readmeRelated:
