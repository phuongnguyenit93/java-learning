  - question: >-
      How do listener concurrency, ordering requirements, recovery policy, and DMLC resource caching interact in a production JMS consumer?
    answer: >-
      Increasing concurrency raises the number of messages that can be in flight and can improve throughput, but completion order may diverge from delivery order, so business ordering requirements must be defined before scaling consumers. Recovery policy is a separate concern: BackOff and container recovery handle infrastructure/setup failures, while rollback/redelivery handles a failed message delivery. Resource caching must match the transaction model. Without an external transaction manager, DMLC normally caches through the consumer level; with an external manager it defaults to CACHE_NONE so the environment can enlist fresh resources correctly. Raising that cache level under JTA/XA is an integration-specific optimization that must be verified with the actual provider/server rather than copied blindly.
    aiGenerated: true
    reviewed: false
