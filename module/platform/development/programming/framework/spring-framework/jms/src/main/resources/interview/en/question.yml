questions:
  - question: >-
      Explain the responsibility boundary between Spring JMS, Jakarta Messaging, and the JMS provider. How does that boundary guide failure diagnosis in production?
    answer: >-
      Spring JMS owns framework integration such as JmsTemplate execution, listener-container lifecycle, destination resolution, conversion hooks, annotation endpoints, transaction integration, and observability configuration. Jakarta Messaging defines contracts such as ConnectionFactory, Session, Destination, Message, producers, consumers, acknowledgement modes, and selectors. The provider implements those contracts and owns broker/runtime behavior such as connectivity, storage, clustering, administration, and provider-specific tuning. Diagnose a failure at the layer that owns the behavior: inspect Spring resolver/container configuration for framework integration problems, the Jakarta contract for delivery or acknowledgement semantics, and provider connectivity/runtime when the broker is unavailable. Spring removes repetitive ceremony but does not erase provider semantics.
