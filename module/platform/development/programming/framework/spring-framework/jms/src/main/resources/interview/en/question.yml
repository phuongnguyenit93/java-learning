  - question: >-
      How would you design JMS payload conversion and type metadata so that two independently deployed services can evolve without coupling their wire contract to Java implementation details?
    answer: >-
      Treat conversion as an integration contract rather than a local serialization helper. Prefer a stable representation such as JSON with explicit logical type identifiers over exposing raw Java package/class names when services evolve independently. MappingJackson2MessageConverter needs a configured type-id property on its normal inbound path unless type resolution is customized, so producer and consumer must agree on the property and mappings. Keep destination resolution, payload type resolution, and business identity separate. Version the logical contract deliberately, test conversion in both directions, and remember that a later higher-level target type does not automatically remove the JMS converter's inbound type-resolution requirement.
