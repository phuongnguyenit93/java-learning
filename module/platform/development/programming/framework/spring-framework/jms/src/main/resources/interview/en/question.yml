  - question: >-
      When is JmsTemplate.sendAndReceive a good design choice, and what latency, correlation, and transaction trade-offs should you explain before using it?
    answer: >-
      Use request-reply when the caller truly needs an answer before it can continue and can define a bounded failure policy. In Spring Framework 6.1, JmsTemplate.sendAndReceive sends the request and waits synchronously on a temporary reply destination, so responder latency and availability become caller latency and availability. The reply must be correlated with the request, but correlation metadata does not make repeated requests idempotent. Another subtle boundary is transaction participation: this Spring 6.1 request-reply path uses the template's local non-transacted execution path rather than simply reusing a caller's thread-bound transactional JMS Session. One-way commands or events are often more failure-independent when no immediate answer is required.
    aiGenerated: true
    reviewed: false
