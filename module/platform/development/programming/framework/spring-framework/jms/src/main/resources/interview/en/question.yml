  - question: >-
      An @JmsListener receives converted domain objects, validates them, and sometimes returns replies. Explain the processing layers and the reply-destination precedence you would expect.
    answer: >-
      First the JMS MessageConverter turns the provider jakarta.jms.Message into an application object. Then Spring's handler-method infrastructure resolves that converted value and headers into method arguments. @Valid by itself does not make validation active in pure Spring Framework; the handler-method factory needs a configured Validator. For a returned reply, the most explicit runtime choice wins: a destination carried by JmsResponse has priority, then the incoming JMSReplyTo destination, and finally a configured/default destination such as @SendTo. Conversion failure and validation failure are different failure modes and should remain distinguishable in logging and tests.
    aiGenerated: true
