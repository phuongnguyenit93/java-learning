  - question: >-
      A transacted JMS listener fails after touching business state, the broker redelivers the message, and the next attempt succeeds. Explain what the JMS transaction guarantees, what it does not guarantee, and how idempotency fits.
    answer: >-
      With a locally transacted listener Session, an exception can cause Spring to roll back that JMS transaction so the consumed message becomes eligible for provider redelivery. The next delivery may carry JMSRedelivered=true, but that flag only describes message-delivery state. It does not prove that unrelated database, HTTP, or other external side effects from the first attempt were atomically rolled back. Therefore rollback/redelivery is a recovery mechanism, not exactly-once business semantics. Business effects that may be retried should be designed for duplicate safety, for example with a stable business/idempotency key and a durable record of already-applied work. If atomicity across multiple real transactional resources is required, evaluate a genuine JTA/XA-capable coordination model rather than assuming a local JMS transaction expands automatically.
    aiGenerated: true
    reviewed: false
