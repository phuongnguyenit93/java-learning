references:
  - title: "Spring Framework Reference — JMS (Java Message Service)"
    url: "https://docs.spring.io/spring-framework/reference/integration/jms.html"
    description: "Tổng quan Spring JMS: mô hình gửi và nhận message, các package hỗ trợ, MessageConverter, listener và tích hợp transaction."
  - title: "Spring Framework Reference — Using Spring JMS"
    url: "https://docs.spring.io/spring-framework/reference/integration/jms/using.html"
    description: "Cách dùng JmsTemplate, quản lý ConnectionFactory, connection/session caching, destination resolution và thông số chất lượng dịch vụ (QoS)."
  - title: "Spring Framework Reference — Sending a Message"
    url: "https://docs.spring.io/spring-framework/reference/integration/jms/sending.html"
    description: "Gửi message qua JmsTemplate, MessageCreator, destination, convertAndSend và chuyển đổi dữ liệu Java sang JMS message."
  - title: "Spring Framework Reference — Receiving a Message"
    url: "https://docs.spring.io/spring-framework/reference/integration/jms/receiving.html"
    description: "Nhận đồng bộ và bất đồng bộ, MessageListener, message listener container, acknowledgment, redelivery và JMS transaction."
  - title: "Spring Framework Reference — Annotation-driven Listener Endpoints"
    url: "https://docs.spring.io/spring-framework/reference/integration/jms/annotated.html"
    description: "Cấu hình @EnableJms, @JmsListener, JmsListenerContainerFactory, phương thức xử lý message và concurrency."
  - title: "Spring Framework Reference — JMS Namespace Support"
    url: "https://docs.spring.io/spring-framework/reference/integration/jms/namespace.html"
    description: "Khai báo listener container, listener endpoints và annotation-driven integration bằng XML namespace khi cần hiểu cấu hình legacy."
  - title: "Spring Framework API — JmsTemplate"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/jms/core/JmsTemplate.html"
    description: "API gửi/nhận đồng bộ, request-reply, message conversion, session transaction và các phương thức send, receive, convertAndSend."
  - title: "Spring Framework API — DefaultMessageListenerContainer"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/jms/listener/DefaultMessageListenerContainer.html"
    description: "API cấu hình consumers, listener concurrency, transaction manager, tự phục hồi kết nối và chính sách acknowledge/redelivery."
