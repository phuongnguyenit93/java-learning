questions:
  - question: >-
      Hãy giải thích sự khác nhau giữa lỗi binding/conversion và lỗi validation trong Spring. Làm thế nào chứng minh giai đoạn nào thất bại thay vì đoán từ trạng thái target?
    answer: >-
      Binding và conversion trả lời dữ liệu bên ngoài có thể trở thành trạng thái target có kiểu hay không. Validation chạy trên trạng thái đã có kiểu và quyết định trạng thái đó có được chấp nhận không. Giá trị như "not-a-number" cho int thất bại trước khi một quy tắc domain có ý nghĩa chạy được, còn "15" có thể bind thành công rồi mới vi phạm quy tắc tuổi. Tôi sẽ đọc BindingResult thay vì chỉ nhìn target: binding FieldError giữ rejected raw value và có bindingFailure=true, còn lỗi do validator tạo xuất hiện sau binding thành công và có bindingFailure=false. So sánh số lỗi trước và sau binder.validate() làm ranh giới hai giai đoạn trở nên rõ ràng.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Foundation/Foundation.md"
      anchor: "validation-vs-binding"
    apiRelated:
      controller: "ValidationExperimentController"
      methodSignature: "bindingVsValidation()"

  - question: >-
      Khi nào nên chọn Converter, Formatter hoặc Validator cho một yêu cầu xử lý input, và dấu hiệu thiết kế xấu nào xuất hiện khi trộn các trách nhiệm này?
    answer: >-
      Converter phù hợp với biến đổi kiểu có thể tái sử dụng và có ngữ nghĩa ổn định, ví dụ String sang OrderId. Formatter phù hợp khi dạng biểu diễn text phụ thuộc presentation và cần parse/print theo Locale. Validator nên nhận trạng thái đã có kiểu rồi quyết định trạng thái đó có thỏa quy tắc hay không. Dấu hiệu thiết kế xấu thường là parse text phụ thuộc locale bên trong Validator hoặc bắt Converter từ chối một giá trị đúng kiểu nhưng sai nghĩa nghiệp vụ. Các cách này làm mờ giai đoạn phát sinh lỗi, giảm khả năng tái sử dụng và khiến error reporting khó suy luận hơn.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Foundation/Foundation.md"
      anchor: "conversion-vs-formatting"
