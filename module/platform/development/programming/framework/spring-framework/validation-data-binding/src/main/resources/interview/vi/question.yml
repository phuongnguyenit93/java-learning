      controller: ""
      methodSignature: ""

  - question: >-
      BindingResult bổ sung điều gì cho mô hình tư duy ngoài việc "target đã được điền một phần", và vì sao điều đó quan trọng khi debug production?
    answer: >-
      BindingResult là bằng chứng có cấu trúc quanh một lần binding. Nó có thể cung cấp ObjectError và FieldError, rejected raw value, trạng thái bindingFailure, suppressed fields và các message-code candidate trong khi vẫn gắn với target thật. Điều này quan trọng vì chỉ nhìn target rất mơ hồ: field có thể không đổi vì conversion thất bại, bị bỏ qua do binding policy, hoặc đơn giản là không được gửi vào. Vì vậy khi debug production nên bắt đầu từ structured result và binding policy thay vì xem object được điền một phần là bằng chứng input processing đã thành công.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.PropertyAccess/PropertyAccess.md"
      anchor: "binding-result-model"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Vì sao declarative binding là cơ chế kiểm soát an toàn chứ không phải validation rule? Hãy so sánh ordinary property binding, declarative binding không có allowed field và declarative binding có allow-list tường minh.
    answer: >-
      Validation hỏi một giá trị đã được chấp nhận có hợp lệ hay không; binding security hỏi dữ liệu bên ngoài có được phép ghi property đó ngay từ đầu hay không. Ordinary property binding mặc định có thể ghi writable properties. Trong Spring 6.1, declarative binding thay đổi trạng thái này: nếu không cấu hình allowedFields thì property binding bị bỏ qua. Khi cấu hình allow-list như displayName, chỉ property đó được mở và role gửi kèm có thể được ghi nhận là suppressed. Nhờ vậy validator không bị dùng như một lớp vá muộn cho việc kiểm soát bề mặt input có thể ghi.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.SafeBinding/SafeBinding.md"
      anchor: "safe-binding-controls"
    apiRelated:
      controller: "SafeBindingExperimentController"
      methodSignature: "declarativeBinding()"

  - question: >-
      So sánh constructor binding và property binding của DataBinder. Vì sao không nên coi allowedFields, requiredFields và declarative binding là quy tắc chung cho mọi binding path?
    answer: >-
      Property binding bắt đầu với target đã tồn tại rồi áp các named property value qua writable properties. Constructor binding phân giải các giá trị cần để tạo target thông qua DataBinder.construct(...) và ValueResolver. Các chính sách field như allowedFields, disallowedFields, requiredFields và giới hạn declarative property binding quản lý property binding; chúng không định nghĩa lại constructor argument. Phân biệt này quan trọng cho cả security lẫn debugging: trước tiên phải xác định binding path nào đang hoạt động, sau đó mới suy luận các control thực sự áp dụng cho path đó.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.DataBinder/DataBinder.md"
      anchor: "constructor-binding-model"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      LocalValidatorFactoryBean nối Jakarta Bean Validation vào Spring như thế nào, và khi nào vẫn nên dùng Spring Validator bên cạnh nó?
    answer: >-
      LocalValidatorFactoryBean bootstrap Bean Validation và đưa validator kết quả vào hạ tầng validation của Spring, đồng thời hỗ trợ cấu hình do Spring quản lý. Nhờ đó constraint dựa trên annotation có thể tham gia những nơi tiêu thụ Spring Validator contract. Spring Validator viết bằng code vẫn hữu ích cho quy tắc dễ biểu diễn bằng logic lập trình, phụ thuộc collaborator của ứng dụng hoặc có cách composition rõ ràng hơn ngoài annotation. DataBinder có thể chứa nhiều validator, vì vậy hai cách tiếp cận bổ sung cho nhau thay vì loại trừ nhau.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.BeanValidation/BeanValidation.md"
      anchor: "local-validator-factory-bean"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Một service method có Bean Validation constraint nhưng khi gọi lại không có validation. Bạn sẽ suy luận thế nào về MethodValidationPostProcessor, @Validated, validation group và proxy boundary?
    answer: >-
      Tôi sẽ tách thành ba câu hỏi. Thứ nhất, proxy-based method validation đã được kích hoạt cho bean chưa? Với MethodValidationPostProcessor, @Validated ở mức type hoặc annotation tương đương đã cấu hình là điều làm bean khớp validation pointcut. Thứ hai, group nào được chọn? @Validated ở mức method có thể tinh chỉnh group cho invocation đó nhưng tự nó không kích hoạt proxy validation cho bean vốn không khớp. Thứ ba, lời gọi có đi qua proxy không? Một direct call bỏ qua Spring proxy không thể được sửa chỉ bằng cách thay constraint annotation. Cách kiểm tra này tách validation metadata khỏi proxy activation và invocation mechanics.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.BeanValidation/BeanValidation.md"
      anchor: "method-validation-post-processor"
    apiRelated:
      controller: ""
      methodSignature: ""
