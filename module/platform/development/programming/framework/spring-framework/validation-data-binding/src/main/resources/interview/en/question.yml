questions:
  - question: >-
      Explain the difference between binding/conversion failure and validation failure in Spring. How would you prove which phase failed instead of guessing from the target object?
    answer: >-
      Binding and conversion answer whether external values can be turned into typed target state. Validation runs against typed state and decides whether that state is acceptable. A value such as "not-a-number" for an int fails before a meaningful domain rule can run, while "15" can bind successfully and then fail an age rule. I would inspect BindingResult rather than only the target: a binding FieldError preserves the rejected raw value and reports bindingFailure=true, while a validator-created FieldError appears after successful binding and has bindingFailure=false. Comparing error counts before and after binder.validate() makes the phase boundary explicit.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Foundation/Foundation.md"
      anchor: "validation-vs-binding"
    apiRelated:
      controller: "ValidationExperimentController"
      methodSignature: "bindingVsValidation()"

  - question: >-
      When would you choose Converter, Formatter, or a Validator for an input-processing requirement, and what design smell appears when those responsibilities are mixed?
    answer: >-
      Converter is appropriate for reusable type-to-type transformation with stable semantics, such as String to OrderId. Formatter is appropriate when text representation is presentation-sensitive and needs Locale-aware parse/print behavior. Validator should receive typed state and decide whether that state satisfies rules. A common design smell is parsing locale-sensitive text inside a Validator or rejecting a type-correct but semantically invalid value inside a Converter. Those choices blur failure phases, reduce reuse, and make error reporting harder to reason about.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Foundation/Foundation.md"
      anchor: "conversion-vs-formatting"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      What information does BindingResult add to the mental model beyond "the target was partially populated", and why does that matter in production debugging?
    answer: >-
      BindingResult is structured evidence around a binding attempt. It can expose ObjectError and FieldError entries, rejected raw values, bindingFailure status, suppressed fields, and message-code candidates while still referring to the real target object. That matters because target state alone is ambiguous: a field may be unchanged because conversion failed, skipped because binding policy rejected it, or simply never supplied. Production debugging should therefore begin with the structured result and the binding policy rather than treating the partially populated object as proof that input processing succeeded.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.PropertyAccess/PropertyAccess.md"
      anchor: "binding-result-model"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Why is declarative binding a security control rather than a validation rule? Explain the difference between ordinary property binding, declarative binding without allowed fields, and declarative binding with an explicit allow-list.
    answer: >-
      Validation asks whether an accepted value is valid; binding security asks whether external input is allowed to write a property at all. Ordinary property binding can write writable properties by default. In Spring 6.1 declarative binding changes that posture: when no allowedFields are configured, property binding is skipped. When an allow-list such as displayName is configured, only that property is opened and a submitted role can be reported as suppressed. This prevents a validator from becoming a late substitute for controlling the writable input surface.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.SafeBinding/SafeBinding.md"
      anchor: "safe-binding-controls"
    apiRelated:
      controller: "SafeBindingExperimentController"
      methodSignature: "declarativeBinding()"

  - question: >-
      Compare DataBinder constructor binding with property binding. Why should allowedFields, requiredFields, and declarative binding not be treated as generic rules for every binding path?
    answer: >-
      Property binding starts with an existing target and applies named property values through writable properties. Constructor binding resolves the values needed to create the target through DataBinder.construct(...) and a ValueResolver. Field policies such as allowedFields, disallowedFields, requiredFields, and declarative property-binding restrictions govern property binding; they do not redefine which constructor arguments exist. The distinction matters for both security and debugging: first identify which binding path is active, then reason about the controls that actually apply to that path.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.DataBinder/DataBinder.md"
      anchor: "constructor-binding-model"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      How does LocalValidatorFactoryBean bridge Jakarta Bean Validation into Spring, and when might you still use a Spring Validator alongside it?
    answer: >-
      LocalValidatorFactoryBean bootstraps Bean Validation and exposes the resulting validator through Spring's validation infrastructure while also supporting Spring-managed configuration. That lets annotation-based constraints participate in places that consume Spring Validator contracts. A programmatic Spring Validator can still be useful for rules that are easier to express imperatively, depend on application-specific collaboration, or need composition that is clearer outside annotations. DataBinder can host multiple validators, so the two approaches are complementary rather than mutually exclusive.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.BeanValidation/BeanValidation.md"
      anchor: "local-validator-factory-bean"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      A service method has Bean Validation constraints but no validation occurs when it is called. How would you reason about MethodValidationPostProcessor, @Validated, validation groups, and the proxy boundary?
    answer: >-
      I would separate three questions. First, is proxy-based method validation activated for the bean? With MethodValidationPostProcessor, a type-level @Validated annotation or the configured equivalent is what makes the bean match the validation pointcut. Second, which groups are selected? Method-level @Validated can refine the groups for that invocation but does not by itself activate proxy validation for an otherwise unmatched bean. Third, did the invocation cross the proxy? A direct call that bypasses the Spring proxy cannot be fixed by changing constraint annotations alone. These checks separate validation metadata from proxy activation and invocation mechanics.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.BeanValidation/BeanValidation.md"
      anchor: "method-validation-post-processor"
