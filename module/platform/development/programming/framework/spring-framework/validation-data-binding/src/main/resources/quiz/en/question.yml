# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: validation-binding-phase-boundary
    question: 'An input contains age="not-a-number" for an int property, while age="15" converts successfully but violates an adult-age rule. Which classification is most accurate?'
    answers:
      - {id: A, answer: "Both are validation failures because both inputs are unacceptable to the application.", explanation: "Incorrect. The first failure occurs while converting/binding raw input; the second occurs only after typed state has been created."}
      - {id: B, answer: "Both are binding failures because DataBinder can collect both kinds of errors.", explanation: "Incorrect. A shared BindingResult can contain both kinds of errors, but that does not make their originating phases the same."}
      - {id: C, answer: "The non-numeric value is a binding/conversion failure; age 15 can bind successfully and then fail validation.", explanation: "Correct. Binding answers whether input can become typed object state; validation answers whether that state is acceptable."}
      - {id: D, answer: "The non-numeric value should be ignored, while age 15 should be rejected during conversion.", explanation: "Incorrect. Silently ignoring malformed input loses evidence, and a type-correct value such as 15 belongs to validation if the rule is semantic."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Foundation/Foundation.md", anchor: "validation-vs-binding"}
    apiRelated: {controller: "ValidationExperimentController", methodSignature: "bindingVsValidation()"}

  - id: conversion-formatting-selection
    question: "Which requirement is the strongest signal to prefer a Formatter over a plain Converter?"
    answers:
      - {id: A, answer: "The text representation must parse and print according to the current Locale.", explanation: "Correct. Formatter is presentation-oriented and its Parser/Printer contracts receive Locale."}
      - {id: B, answer: "The source and target are two stable Java types with one context-free transformation.", explanation: "Incorrect. That is a strong fit for a plain Converter."}
      - {id: C, answer: "The conversion must run only inside a Spring MVC controller.", explanation: "Incorrect. Formatter is reusable formatting infrastructure and is not owned only by MVC."}
      - {id: D, answer: "The target value must also satisfy a business invariant after conversion.", explanation: "Incorrect. Business acceptability belongs to validation rather than choosing Formatter instead of Converter."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Foundation/Foundation.md", anchor: "conversion-vs-formatting"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: binding-result-error-evidence
    question: "Why is BindingResult more useful than inspecting only the partially populated target after a bind?"
    answers:
      - {id: A, answer: "BindingResult guarantees that every writable property was assigned successfully.", explanation: "Incorrect. It records failures and other binding evidence precisely because assignment may be incomplete."}
      - {id: B, answer: "BindingResult automatically converts every validation error into an exception.", explanation: "Incorrect. Errors remain structured results unless the caller explicitly chooses an exception-producing path."}
      - {id: C, answer: "BindingResult replaces the target object, so target state no longer matters.", explanation: "Incorrect. BindingResult describes the binding outcome around the actual target rather than replacing it."}
      - {id: D, answer: "BindingResult preserves FieldError, rejected values, binding-failure status, and suppressed fields.", explanation: "Correct. Those details reveal why an input operation failed or was constrained instead of forcing inference from target state alone."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.PropertyAccess/PropertyAccess.md", anchor: "binding-result-model"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: type-descriptor-context
    question: "When is TypeDescriptor especially important in Spring conversion?"
    answers:
      - {id: A, answer: "When only the raw source Class and target Class matter and no metadata is relevant.", explanation: "Incorrect. In that case the simpler class-based conversion APIs may already be sufficient."}
      - {id: B, answer: "When conversion depends on richer type context such as generic element types or field annotations.", explanation: "Correct. TypeDescriptor carries contextual type and annotation metadata that a raw Class pair cannot express."}
      - {id: C, answer: "When a Validator needs to decide whether a domain object is acceptable.", explanation: "Incorrect. TypeDescriptor belongs to conversion context, not domain validation."}
      - {id: D, answer: "When a DataBinder needs to decide which external fields are allowed to be written.", explanation: "Incorrect. Allowed-field policy is a binding-surface concern, not the main role of TypeDescriptor."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.TypeConversion/TypeConversion.md", anchor: "type-descriptor-context"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: formatter-locale-boundary
    question: "A monetary text field must respect the caller's locale. Which design keeps that presentation concern explicit?"
    answers:
      - {id: A, answer: "Use a global Converter<String, BigDecimal> and read the JVM default locale inside it.", explanation: "Incorrect. Converter has no locale argument, and hidden reliance on the JVM default makes policy ambiguous."}
      - {id: B, answer: "Parse the text inside a Validator so conversion and validation happen together.", explanation: "Incorrect. A Validator should evaluate typed state rather than own locale-sensitive parsing."}
      - {id: C, answer: "Use a Formatter or Parser whose parse operation receives the Locale explicitly.", explanation: "Correct. Formatting is designed for presentation-sensitive text parsing and printing with Locale context."}
      - {id: D, answer: "Store the localized text in the domain object and postpone conversion indefinitely.", explanation: "Incorrect. That avoids typed state instead of modeling the conversion/formatting boundary clearly."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Formatting/Formatting.md", anchor: "formatting-locale-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: validator-validate-object-boundary
    question: "What is a key limitation to remember when using Spring 6.1 Validator.validateObject(Object)?"
    answers:
      - {id: A, answer: "Its simple Errors result does not support nested paths; nested-path validation needs a richer Errors implementation.", explanation: "Correct. validateObject is convenient for focused validation, but its SimpleErrors result intentionally has a smaller model."}
      - {id: B, answer: "It can validate only objects that were first populated by DataBinder.", explanation: "Incorrect. The convenience method is specifically useful without requiring a binding process."}
      - {id: C, answer: "It performs constructor binding before calling validate(Object, Errors).", explanation: "Incorrect. It is a validation convenience method, not a binding API."}
      - {id: D, answer: "It always throws an exception whenever any validation error is recorded.", explanation: "Incorrect. The caller may inspect the returned Errors and only chooses an exception explicitly, for example through failOnError."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.Validation/Validation.md", anchor: "validator-contract"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: declarative-binding-default-posture
    question: "With Spring 6.1 DataBinder, what happens when declarative binding is enabled but no allowedFields are configured for property binding?"
    answers:
      - {id: A, answer: "All writable properties are still bound, but validation is disabled.", explanation: "Incorrect. Declarative mode changes whether property binding is allowed; it does not disable validation."}
      - {id: B, answer: "Only properties whose current values are non-null are bound.", explanation: "Incorrect. Nullability of existing property values is not the declarative-binding rule."}
      - {id: C, answer: "Every submitted property is recorded as a suppressed field and then assigned.", explanation: "Incorrect. When no allowed-field surface is configured, property binding is skipped rather than assigning submitted properties."}
      - {id: D, answer: "Property binding is skipped; configuring allowedFields later opens only that explicit property surface.", explanation: "Correct. The module's runtime experiment contrasts ordinary binding, declarative binding with no allow-list, and declarative binding with an explicit allow-list."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.SafeBinding/SafeBinding.md", anchor: "safe-binding-controls"}
    apiRelated: {controller: "SafeBindingExperimentController", methodSignature: "declarativeBinding()"}

  - id: required-fields-vs-validation
    question: "A DataBinder field is configured through setRequiredFields(...). What does a resulting required error mean?"
    answers:
      - {id: A, answer: "The final domain object violates every business invariant involving that field.", explanation: "Incorrect. Required-field checking belongs to the binding operation, not the full domain rule set."}
      - {id: B, answer: "The submitted value is absent or considered empty by DataBinder's required-field check.", explanation: "Correct. Missing, null, or certain empty submitted values can produce the required binding error."}
      - {id: C, answer: "The Java property is non-nullable according to the JVM type system.", explanation: "Incorrect. Java nullability alone does not configure DataBinder required fields."}
      - {id: D, answer: "The Formatter failed to print the existing property value.", explanation: "Incorrect. Required-field policy is distinct from formatting output."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.DataBinder/DataBinder.md", anchor: "binding-field-policies"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: bean-validation-spring-adapter
    question: "What does LocalValidatorFactoryBean provide in Spring's Bean Validation integration?"
    answers:
      - {id: A, answer: "A replacement for every Spring Validator that prevents programmatic validation.", explanation: "Incorrect. Spring can combine Bean Validation integration with programmatic Validator implementations when appropriate."}
      - {id: B, answer: "A Web MVC-only binder that converts request parameters before validation.", explanation: "Incorrect. LocalValidatorFactoryBean is validation infrastructure and is not owned only by MVC request binding."}
      - {id: C, answer: "An adapter from Bean Validation's ValidatorFactory/Validator into Spring validation infrastructure.", explanation: "Correct. It adapts Jakarta Bean Validation into Spring infrastructure while supporting Spring-managed configuration."}
      - {id: D, answer: "A formatter registry dedicated to constraint messages.", explanation: "Incorrect. Formatting and Bean Validation integration are separate responsibilities."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.BeanValidation/BeanValidation.md", anchor: "local-validator-factory-bean"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: method-validation-activation-vs-groups
    question: "For proxy-based method validation through MethodValidationPostProcessor, which statement best separates activation from group selection?"
    answers:
      - {id: A, answer: "Type-level @Validated activates proxy validation; method-level @Validated may refine groups but does not activate the bean by itself.", explanation: "Correct. Activation and validation-group selection are related but distinct concerns."}
      - {id: B, answer: "Any method-level constraint automatically creates the Spring proxy, so @Validated is never relevant.", explanation: "Incorrect. Constraint presence and Spring proxy activation are not the same mechanism."}
      - {id: C, answer: "Only method-level @Validated activates the bean, while type-level @Validated is used only for field binding.", explanation: "Incorrect. This reverses the activation role described by Spring's proxy-based method validation infrastructure."}
      - {id: D, answer: "Validation groups are selected by DataBinder allowedFields, so @Validated affects only component scanning.", explanation: "Incorrect. Binding field policy and Bean Validation groups are separate mechanisms."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.BeanValidation/BeanValidation.md", anchor: "validation-groups-hints"}
    apiRelated: {controller: "", methodSignature: ""}
