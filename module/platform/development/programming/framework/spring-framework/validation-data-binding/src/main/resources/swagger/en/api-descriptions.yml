SafeBindingExperimentController:
  declarativeBinding():
    summary: Compare ordinary and declarative property binding
    description: Submit displayName and role through three fresh binders. Ordinary
      property binding writes both fields, declarative binding with no allowed fields
      writes neither, and declarative binding with only displayName allowed writes
      displayName while suppressing role.
