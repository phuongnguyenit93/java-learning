  - id: binding-result-error-evidence
    question: "Vì sao BindingResult hữu ích hơn việc chỉ nhìn object đích đã được điền một phần sau binding?"
    answers:
      - {id: A, answer: "BindingResult bảo đảm mọi writable property đều đã được gán thành công.", explanation: "Sai. Nó ghi lại lỗi và bằng chứng binding chính vì việc gán có thể không hoàn tất."}
      - {id: B, answer: "BindingResult tự động biến mọi lỗi validation thành exception.", explanation: "Sai. Lỗi vẫn là kết quả có cấu trúc trừ khi bên gọi chủ động chọn đường đi tạo exception."}
      - {id: C, answer: "BindingResult thay thế object đích nên trạng thái target không còn quan trọng.", explanation: "Sai. BindingResult mô tả kết quả binding quanh target thực tế chứ không thay thế target."}
      - {id: D, answer: "BindingResult giữ FieldError, rejected value, trạng thái binding failure và suppressed fields.", explanation: "Đúng. Các dữ kiện này cho biết input thất bại hoặc bị giới hạn vì sao thay vì buộc người đọc suy đoán từ target."}
