questions:
  - id: validation-binding-phase-boundary
    question: 'Input có age="not-a-number" cho property int, còn age="15" convert thành công nhưng vi phạm quy tắc tuổi trưởng thành. Cách phân loại nào chính xác nhất?'
    answers:
      - {id: A, answer: "Cả hai đều là lỗi validation vì cả hai input đều không được ứng dụng chấp nhận.", explanation: "Sai. Trường hợp đầu thất bại khi conversion/binding dữ liệu gốc; trường hợp sau chỉ thất bại sau khi đã tạo được trạng thái có kiểu."}
      - {id: B, answer: "Cả hai đều là lỗi binding vì DataBinder có thể thu thập cả hai loại lỗi.", explanation: "Sai. Cùng một BindingResult có thể chứa hai loại lỗi nhưng không làm cho giai đoạn phát sinh của chúng trở thành một."}
      - {id: C, answer: "Giá trị không phải số là lỗi binding/conversion; age 15 có thể bind thành công rồi mới thất bại ở validation.", explanation: "Đúng. Binding trả lời input có trở thành trạng thái object có kiểu được không; validation trả lời trạng thái đó có được chấp nhận không."}
      - {id: D, answer: "Giá trị không phải số nên bị bỏ qua, còn age 15 nên bị từ chối ngay trong conversion.", explanation: "Sai. Bỏ qua input sai định dạng làm mất bằng chứng lỗi, còn giá trị đúng kiểu như 15 thuộc validation nếu quy tắc là ngữ nghĩa nghiệp vụ."}
