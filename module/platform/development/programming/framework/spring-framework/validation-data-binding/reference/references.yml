    url: "https://docs.spring.io/spring-framework/docs/6.1.14/javadoc-api/org/springframework/validation/Validator.html"
    description: "Version-pinned Spring Framework 6.1.14 contract for the UI-agnostic Validator abstraction and Errors-based validation model."
  - title: "Spring Type Conversion"
    url: "https://docs.spring.io/spring-framework/docs/6.1.14/javadoc-api/org/springframework/core/convert/ConversionService.html"
    description: "Version-pinned Spring Framework 6.1.14 API contract for ConversionService and TypeDescriptor-aware conversion."
  - title: "Spring Field Formatting"
    url: "https://docs.spring.io/spring-framework/docs/6.1.14/javadoc-api/org/springframework/format/support/DefaultFormattingConversionService.html"
