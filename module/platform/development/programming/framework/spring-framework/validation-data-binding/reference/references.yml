    description: "Official Spring Framework reference chapter that explains the module-wide relationship among validation, data binding, JavaBeans property access, type conversion, formatting, and Bean Validation integration."
  - title: "Spring Framework 6.1.14 API"
    url: "https://docs.spring.io/spring-framework/docs/6.1.14/javadoc-api/index.html"
    description: "Version-pinned Spring Framework 6.1.14 API index used to verify module-level contracts without drifting to a newer Framework generation."
