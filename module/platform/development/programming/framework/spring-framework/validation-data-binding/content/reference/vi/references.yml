references:
  - title: "Spring Framework — Validation, Data Binding, and Type Conversion"
    url: "https://docs.spring.io/spring-framework/reference/core/validation.html"
    description: "Tổng quan cách Spring phối hợp Validator, DataBinder, BeanWrapper, chuyển đổi kiểu dữ liệu và Bean Validation."
  - title: "Spring Framework — Validation Using Spring's Validator Interface"
    url: "https://docs.spring.io/spring-framework/reference/core/validation/validator.html"
    description: "Định nghĩa hợp đồng Validator, hỗ trợ supports/validate, Errors, mã lỗi và việc viết bộ kiểm tra dữ liệu tùy chỉnh."
  - title: "Spring Framework — Data Binding"
    url: "https://docs.spring.io/spring-framework/reference/core/validation/data-binding.html"
    description: "Cách liên kết thuộc tính JavaBean, BeanWrapper, DataBinder và PropertyEditor; nền tảng xử lý dữ liệu đầu vào."
  - title: "Spring Framework — Spring Type Conversion"
    url: "https://docs.spring.io/spring-framework/reference/core/validation/convert.html"
    description: "Converter, ConverterFactory, GenericConverter, ConversionService và cấu hình chuyển kiểu dùng chung."
  - title: "Spring Framework — Spring Field Formatting"
    url: "https://docs.spring.io/spring-framework/reference/core/validation/format.html"
    description: "Formatter, parse/print theo Locale và tích hợp ConversionService để định dạng dữ liệu biểu mẫu."
  - title: "Spring Framework — Java Bean Validation"
    url: "https://docs.spring.io/spring-framework/reference/core/validation/beanvalidation.html"
    description: "Tích hợp Jakarta Bean Validation, LocalValidatorFactoryBean, cấu hình và kết hợp bộ kiểm tra với DataBinder."
  - title: "Spring MVC — @InitBinder"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-initbinder.html"
    description: "Tùy chỉnh WebDataBinder trong controller và ControllerAdvice; đăng ký editor, converter, formatter, validator."
  - title: "Spring MVC — @ModelAttribute Arguments"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/modelattrib-method-args.html"
    description: "Binding dữ liệu từ request vào model attribute, constructor/property binding, @Valid và BindingResult."
  - title: "Spring MVC — Validation"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-validation.html"
    description: "Phân biệt validation tham số và validation phương thức; hiểu MethodArgumentNotValidException và HandlerMethodValidationException."
  - title: "Spring MVC — @RequestBody"
    url: "https://docs.spring.io/spring-framework/reference/web/webmvc/mvc-controller/ann-methods/requestbody.html"
    description: "Chuyển request body thành đối tượng qua HttpMessageConverter, kiểm tra @Valid/@Validated và xử lý Errors."
  - title: "Spring WebFlux — Validation"
    url: "https://docs.spring.io/spring-framework/reference/web/webflux/controller/ann-validation.html"
    description: "Validation trong WebFlux, WebExchangeBindException, HandlerMethodValidationException và cấu hình validator."
