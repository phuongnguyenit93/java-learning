references:
  - title: "Spring Framework — Cache Abstraction"
    url: "https://docs.spring.io/spring-framework/reference/integration/cache.html"
    description: "Tổng quan cơ chế cache độc lập với cache provider, các thao tác truy xuất, cập nhật và vô hiệu hóa cache."
  - title: "Spring Framework — Understanding the Cache Abstraction"
    url: "https://docs.spring.io/spring-framework/reference/integration/cache/strategies.html"
    description: "Giải thích cache hit/miss, khai báo cache và cấu hình nơi lưu trữ; lưu ý vấn đề đồng thời và dữ liệu cũ."
  - title: "Spring Framework — Declarative Annotation-based Caching"
    url: "https://docs.spring.io/spring-framework/reference/integration/cache/annotations.html"
    description: "Sử dụng @EnableCaching, @Cacheable, @CachePut, @CacheEvict, @Caching, @CacheConfig, cache key, SpEL và proxy/self-invocation."
  - title: "Spring Framework — JCache (JSR-107) Annotations"
    url: "https://docs.spring.io/spring-framework/reference/integration/cache/jsr-107.html"
    description: "Tương tác với các annotation chuẩn JCache như @CacheResult, @CachePut và @CacheRemove."
  - title: "Spring Framework — Declarative XML-based Caching"
    url: "https://docs.spring.io/spring-framework/reference/integration/cache/declarative-xml.html"
    description: "Cấu hình cache advice bằng XML và Spring AOP khi không dùng annotation."
  - title: "Spring Framework — Configuring the Cache Storage"
    url: "https://docs.spring.io/spring-framework/reference/integration/cache/store-configuration.html"
    description: "Cấu hình CacheManager và các backend như ConcurrentMap, Caffeine hoặc JCache tùy môi trường."
  - title: "Spring Framework — Plugging-in Different Back-end Caches"
    url: "https://docs.spring.io/spring-framework/reference/integration/cache/plug.html"
    description: "Mở rộng abstraction bằng Cache và CacheManager tùy chỉnh để tích hợp cache provider khác."
  - title: "Spring Framework — Cache TTL, TTI and Eviction Policy"
    url: "https://docs.spring.io/spring-framework/reference/integration/cache/specific-config.html"
    description: "Phân biệt nhiệm vụ abstraction và cache provider khi đặt TTL, TTI, eviction hoặc chính sách lưu trữ."
  - title: "Spring Framework API — CacheManager"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/cache/CacheManager.html"
    description: "Hợp đồng SPI lấy cache theo tên, liệt kê cache và quản lý cache region."
  - title: "Spring Framework API — Cache"
    url: "https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/cache/Cache.html"
    description: "Hợp đồng thao tác cache trực tiếp: get, put, evict, invalidate, clear và retrieve bất đồng bộ."
