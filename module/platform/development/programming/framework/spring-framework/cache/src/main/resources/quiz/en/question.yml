# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>


questions:
  - id: cache-source-of-truth
    question: "A service keeps a database record and a cached copy. Which statement best describes the cache's role?"
    answers:
      - id: A
        answer: "The cached copy becomes authoritative once it is read more often than the database record."
        explanation: "Incorrect. Read frequency does not transfer source-of-truth ownership to the cache."
      - id: B
        answer: "The cached copy is derived state whose freshness and lifetime can differ from the authoritative record."
        explanation: "Correct. A cache is reusable derived state and can become stale unless its consistency policy keeps it aligned."
      - id: C
        answer: "The cached copy and database record are co-authoritative as long as they use the same key."
        explanation: "Incorrect. Matching identity does not create co-ownership of authoritative state."
      - id: D
        answer: "The cached copy is authoritative for reads, while the database is authoritative only for writes."
        explanation: "Incorrect. A read cache does not automatically become a second authoritative model."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.CachePurpose/CachePurpose.md"
      anchor: "cache-vs-source-of-truth"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: cacheable-vs-cacheput
    question: "A method must always execute its business logic and then write the returned value to the cache. Which operation best matches that requirement?"
    answers:
      - id: A
        answer: "Use `@Cacheable`, because it performs a lookup first and writes the result after every invocation."
        explanation: "Incorrect. A hit may skip method execution, so @Cacheable does not guarantee that the method always runs."
      - id: B
        answer: "Use `@CachePut`, because the method executes and its returned value is used to update the cache."
        explanation: "Correct. @CachePut models execute-then-update semantics."
      - id: C
        answer: "Use `@CacheEvict`, because eviction replaces the existing value with the method result."
        explanation: "Incorrect. @CacheEvict removes cache state rather than storing the returned value."
      - id: D
        answer: "Use `@CacheConfig`, because it changes cache hits into mandatory method executions."
        explanation: "Incorrect. @CacheConfig shares configuration; it does not redefine cache hit behavior."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.DeclarativeCaching/DeclarativeCaching.md"
      anchor: "cache-put"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: cache-condition-unless
    question: "Which statement correctly distinguishes `condition` from `unless` for a cacheable operation?"
    answers:
      - id: A
        answer: "`condition` decides participation before invocation; `unless` can veto caching after the result is available."
        explanation: "Correct. The two expressions operate at different phases and serve different decisions."
      - id: B
        answer: "`condition` and `unless` are both post-invocation vetoes, but `unless` also evicts an existing entry."
        explanation: "Incorrect. condition is not a post-invocation veto, and unless does not mean eviction."
      - id: C
        answer: "`condition` selects the cache manager before invocation; `unless` selects the cache manager after invocation."
        explanation: "Incorrect. CacheManager/CacheResolver selection is a different concern."
      - id: D
        answer: "`condition` controls whether the result is stored; `unless` controls whether the business method is invoked."
        explanation: "Incorrect. This reverses the relevant responsibilities."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.KeyAndResolution/KeyAndResolution.md"
      anchor: "condition-vs-unless"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: cache-key-result-dimension
    question: "A cached method accepts `isbn` and `includeReviews`, and `includeReviews` changes the returned representation. What is the main risk of keying only by `isbn`?"
    answers:
      - id: A
        answer: "Both result variants can collapse to one cache identity, so one request can reuse the other variant's value."
        explanation: "Correct. A result-shaping input omitted from the key can cause a semantically incorrect cache hit."
      - id: B
        answer: "Spring automatically appends `includeReviews` to an explicit key, so the risk is only a larger serialized key."
        explanation: "Incorrect. An explicit key expression defines the identity; omitted parameters are not appended automatically."
      - id: C
        answer: "The first variant is cached normally, but Spring forces every later variant to bypass caching altogether."
        explanation: "Incorrect. Spring does not infer that the omitted parameter should disable caching."
      - id: D
        answer: "The provider creates separate entries for each return shape even when both invocations resolve to the same explicit key."
        explanation: "Incorrect. The provider sees the resolved key, not the application's hidden notion of result variants."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.KeyAndResolution/KeyAndResolution.md"
      anchor: "cache-key-design-pitfalls"
    apiRelated:
      controller: "CacheKeyController"
      methodSignature: "keyAndHitMiss()"

  - id: cache-evict-before-invocation
    question: "A cache entry must be removed even when the annotated business method later throws. Which timing choice matches that requirement?"
    answers:
      - id: A
        answer: "Use the default after-success eviction so the entry is removed only when the method returns normally."
        explanation: "Incorrect. Default post-invocation eviction can be skipped when the method fails."
      - id: B
        answer: "Use `beforeInvocation=true` so eviction occurs before the business method runs."
        explanation: "Correct. Pre-invocation eviction is independent of whether the subsequent method invocation succeeds."
      - id: C
        answer: "Use `unless` so the entry is removed when the method throws an exception."
        explanation: "Incorrect. unless is a result-based caching veto, not an exception-triggered eviction mode."
      - id: D
        answer: "Use `sync=true` so the cache evicts the entry before entering the synchronized loader."
        explanation: "Incorrect. sync controls coordinated loading, not eviction timing."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.ConsistencyAndInvalidation/ConsistencyAndInvalidation.md"
      anchor: "evict-before-invocation"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: cache-self-invocation
    question: "In default proxy mode, why can `this.load()` bypass caching when `load()` is annotated with `@Cacheable`?"
    answers:
      - id: A
        answer: "The internal call stays on the target object and does not re-enter the Spring proxy carrying the cache interceptor."
        explanation: "Correct. Proxy-based advice is applied when the invocation crosses the proxy boundary."
      - id: B
        answer: "The internal call crosses the proxy twice, so Spring suppresses the second interception to avoid recursion."
        explanation: "Incorrect. The call does not re-enter the proxy in the first place."
      - id: C
        answer: "Spring intercepts the call but converts it to programmatic `Cache.get`, which disables annotation metadata."
        explanation: "Incorrect. The problem is bypassing interception, not conversion to a different API."
      - id: D
        answer: "The annotation is active only for controller-to-service calls, so service-to-service calls are never cacheable."
        explanation: "Incorrect. Any eligible external call through the proxy can be intercepted; controllers are not special."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.InterceptionBoundary/InterceptionBoundary.md"
      anchor: "self-invocation"
    apiRelated:
      controller: "CacheInterceptionController"
      methodSignature: "selfInvocation()"

  - id: cache-sync-scope
    question: "Four threads request the same missing key through `@Cacheable(sync=true)`, and the configured cache performs one loader invocation. Which conclusion is justified?"
    answers:
      - id: A
        answer: "For that cache implementation and key, synchronized loading coordinated the concurrent miss into one load."
        explanation: "Correct. This is the bounded conclusion supported by the observed provider behavior."
      - id: B
        answer: "Spring established a distributed lock that coordinates the same key across all application instances."
        explanation: "Incorrect. sync=true is not a general distributed-lock guarantee."
      - id: C
        answer: "Every provider must implement the feature with the same JVM locking primitive used in this experiment."
        explanation: "Incorrect. The synchronization mechanism and capabilities are provider-specific."
      - id: D
        answer: "The same configuration can freely combine `sync=true`, multiple cache names, `unless`, and put/evict operations."
        explanation: "Incorrect. Synchronized caching has explicit restrictions and should not be generalized beyond them."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.ConcurrencyAndAsync/ConcurrencyAndAsync.md"
      anchor: "cacheable-sync"
    apiRelated:
      controller: "CacheConcurrencyController"
      methodSignature: "synchronizedLoading()"

  - id: cache-async-provider-capability
    question: "A Spring Framework 6.1 cacheable method returns `CompletableFuture<Book>`. What must be checked before claiming the cache path is non-blocking?"
    answers:
      - id: A
        answer: "Whether the provider's retrieval/storage path is actually asynchronous rather than wrapping blocking work behind a future-shaped API."
        explanation: "Correct. Return-type adaptation does not erase the provider's actual I/O and concurrency model."
      - id: B
        answer: "Whether the future is created on the controller thread, because that alone guarantees non-blocking cache I/O."
        explanation: "Incorrect. Where the wrapper is created does not determine whether the backing cache blocks."
      - id: C
        answer: "Whether the provider stores the `CompletableFuture` object itself, because storing the completed value would make the lookup blocking."
        explanation: "Incorrect. Supported adaptation is about the produced value; wrapper storage is not the criterion for non-blocking behavior."
      - id: D
        answer: "Whether the cache name contains an `async` suffix, because Spring selects the asynchronous SPI from naming convention."
        explanation: "Incorrect. Async capability is not inferred from the cache name."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.ConcurrencyAndAsync/ConcurrencyAndAsync.md"
      anchor: "async-provider-capability"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: cache-transaction-aware-mutation
    question: "A database transaction schedules a normal cache put through `TransactionAwareCacheDecorator` and later rolls back. What behavior is intended?"
    answers:
      - id: A
        answer: "The put is deferred and is not published when the surrounding transaction fails to commit."
        explanation: "Correct. Deferring supported mutations helps avoid exposing cache state for data that never committed."
      - id: B
        answer: "The put happens immediately, and rollback automatically converts that put into a provider-specific eviction."
        explanation: "Incorrect. The decorator does not model rollback as an inverse cache operation."
      - id: C
        answer: "The cache becomes the transaction manager and rolls back the database resource together with the entry."
        explanation: "Incorrect. Cache synchronization does not replace the actual transaction manager."
      - id: D
        answer: "The put joins a portable two-phase commit with every cache provider selected by Spring Cache."
        explanation: "Incorrect. Transaction-aware decoration is not a universal XA guarantee."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.FailureAndTransaction/FailureAndTransaction.md"
      anchor: "after-commit-cache-mutation"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: cache-strategy-provider-selection
    question: "A multi-node application needs shared cache state and provider-supported expiration. Which design choice best follows the module's strategy guidance?"
    answers:
      - id: A
        answer: "Choose a provider whose topology and expiration capabilities meet the requirements, while keeping portable cache operations behind Spring Cache."
        explanation: "Correct. Provider choice should follow required capabilities rather than assuming the abstraction supplies them."
      - id: B
        answer: "Keep the in-process provider and assume Spring Cache will replicate entries and apply one expiration policy across every node."
        explanation: "Incorrect. The abstraction does not add distribution semantics to a local provider."
      - id: C
        answer: "Use `@CacheConfig` to convert the local provider into a distributed cache and define expiration independently of the provider."
        explanation: "Incorrect. @CacheConfig shares annotation configuration; it does not supply topology or portable TTL."
      - id: D
        answer: "Generate unique keys per request so each node keeps separate entries and Spring reconciles them into shared cache state."
        explanation: "Incorrect. Per-request uniqueness defeats reuse and does not create shared topology or consistency."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "10.CacheStrategy/CacheStrategy.md"
      anchor: "provider-selection"
    apiRelated:
      controller: ""
      methodSignature: ""
