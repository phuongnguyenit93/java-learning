questions:
  - question: >-
      Spring Cache trừu tượng hóa những gì, và những quyết định quan trọng nào vẫn thuộc về cache provider?
    answer: >-
      Spring Cache cung cấp cho mã ứng dụng một hợp đồng chung quanh named cache, lookup, population, eviction và các declarative annotation như @Cacheable. Nó không chuẩn hóa mọi đặc tính lưu trữ. TTL/TTI, maximum size, chính sách eviction riêng, serialization, topology phân tán và nhiều bảo đảm về xử lý đồng thời vẫn là trách nhiệm của provider. Thiết kế tốt giữ các thao tác cache ở tầng ứng dụng phía sau Spring abstraction ở nơi phù hợp, đồng thời chọn và cấu hình provider có khả năng gốc đáp ứng yêu cầu vận hành.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.CachePurpose/CachePurpose.md"
      anchor: "spring-cache-abstraction-boundary"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      `Cache` và `CacheManager` phân chia trách nhiệm như thế nào, và vì sao tên cache nên là khái niệm của ứng dụng thay vì tên gắn với một provider cụ thể?
    answer: >-
      `Cache` biểu diễn các thao tác trên một vùng cache logic: lookup, put, eviction, clear cùng các hợp đồng loading/retrieval liên quan. `CacheManager` resolve các vùng đó theo tên và đóng vai trò registry/factory ở ranh giới ứng dụng. Một tên ổn định như `productsById` nên mô tả dữ liệu ứng dụng đang lưu, không nên phụ thuộc provider hiện tại là Redis, Caffeine hay concurrent map. Sự tách biệt này giúp chính sách cache của ứng dụng giữ ổn định khi cấu hình provider thay đổi. Vẫn có thể truy cập native cache khi thực sự cần tính năng riêng của provider, nhưng bước qua ranh giới đó là quyết định có chủ đích vì nó làm giảm tính khả chuyển và không nên định nghĩa lại mô hình cache logic của ứng dụng.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.CacheAbstraction/CacheAbstraction.md"
      anchor: "cache-manager"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Hãy giải thích cách một cache key không đầy đủ có thể tạo lỗi về tính đúng đắn, và bạn sẽ chứng minh vấn đề đó thế nào thay vì chỉ nhìn key expression?
    answer: >-
      Định danh cache phải chứa mọi đầu vào định nghĩa giá trị có thể tái sử dụng. Nếu includeReviews làm thay đổi dạng biểu diễn nhưng key chỉ chứa ISBN, yêu cầu cho biến thể có reviews có thể hit entry được tạo cho biến thể không có reviews. Một thí nghiệm thuyết phục sẽ chạy hai yêu cầu với key thiếu chiều và cho thấy yêu cầu thứ hai tái sử dụng sai giá trị chỉ với một lần loader chạy, rồi lặp lại khi includeReviews có trong key và cho thấy hai lần load riêng trả đúng hai biến thể. Minh chứng cần cho thấy hành vi đã chuyển từ tái sử dụng sai sang định danh cache đúng, chứ không chỉ cho thấy chuỗi key thay đổi.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.KeyAndResolution/KeyAndResolution.md"
      anchor: "cache-key-design-pitfalls"
    apiRelated:
      controller: "CacheKeyController"
