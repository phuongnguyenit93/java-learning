  - question: >-
      Vì sao self-invocation bỏ qua @Cacheable trong proxy mode mặc định, và có thể thiết kế thế nào để không phụ thuộc vào hành vi đó?
    answer: >-
      Trong proxy mode, cache interceptor nằm trên Spring proxy. Một lời gọi đi vào qua tham chiếu của bean khác có thể đi qua proxy, nhưng this.load() bên trong target object vẫn ở trên target và không đi lại qua interceptor. Thiết kế phổ biến là đưa thao tác được cache sang Spring bean khác hoặc tái cấu trúc lời gọi để proxy boundary rõ ràng. AspectJ mode có thể intercept self-invocation nhờ weaving thay vì proxy entry, nhưng nó thay đổi mô hình vận hành và nên là lựa chọn có chủ đích chứ không phải giải pháp vá tùy tiện.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.InterceptionBoundary/InterceptionBoundary.md"
      anchor: "self-invocation"
    apiRelated:
      controller: "CacheInterceptionController"
      methodSignature: "selfInvocation()"

  - question: >-
      @Cacheable(sync=true) giải quyết vấn đề gì, thí nghiệm runtime thực sự chứng minh điều gì, và không nên suy diễn điều gì từ kết quả đó?
    answer: >-
      Concurrent miss cho cùng key có thể kích hoạt nhiều lần tính toán đắt đỏ. sync=true yêu cầu cách triển khai cache phối hợp việc load cho thao tác cache/key đó. Trong thí nghiệm của module, bốn bên gọi dùng ConcurrentMapCache chỉ tạo một lần loader chạy và một load sequence trả về, nên synchronized loading quan sát được trực tiếp với provider này. Kết quả không chứng minh distributed lock, phối hợp xuyên node hay một cơ chế khóa duy nhất cho mọi provider. Khả năng của provider và các ràng buộc chính xác của annotation vẫn rất quan trọng.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.ConcurrencyAndAsync/ConcurrencyAndAsync.md"
      anchor: "cacheable-sync"
    apiRelated:
      controller: "CacheConcurrencyController"
      methodSignature: "synchronizedLoading()"

  - question: >-
      Nên suy luận thế nào về CompletableFuture hoặc reactive return type trong Spring caching mà không mặc định toàn bộ đường cache là non-blocking?
    answer: >-
      Spring Framework 6.1 có thể thích nghi các asynchronous và reactive return type được hỗ trợ để giá trị được tạo ra tham gia caching, nhưng cache provider vẫn quyết định việc truy xuất và lưu trữ được triển khai thế nào. API có hình dạng future không biến backend chặn luồng thành non-blocking. Cần kiểm tra khả năng async retrieval của provider, thời điểm xác định miss, null semantics, error propagation, cancellation và hành vi của multiple caches. Hãy tách cơ chế thích nghi kiểu trả về của Spring khỏi mô hình I/O và xử lý đồng thời thực tế của provider.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.ConcurrencyAndAsync/ConcurrencyAndAsync.md"
      anchor: "async-provider-capability"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Transaction-aware cache mutation giải quyết vấn đề gì, và vì sao các thao tác cache cần hiệu lực tức thời phải được chú ý riêng?
    answer: >-
      Nếu database transaction về sau rollback, công bố cache put hoặc eviction thông thường quá sớm có thể làm trạng thái cache không khớp dữ liệu đã commit. TransactionAwareCacheDecorator hoặc TransactionAwareCacheManagerProxy có thể trì hoãn các put, evict và clear được hỗ trợ tới sau commit thành công. Những thao tác mà hợp đồng yêu cầu hiệu lực tức thời như putIfAbsent, evictIfPresent và invalidate không thể đơn giản bị coi như mutation trì hoãn thông thường. Module cache sở hữu ranh giới tương tác này; propagation, isolation, rollback rule và transaction-manager policy thuộc Spring Transaction Management.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.FailureAndTransaction/FailureAndTransaction.md"
      anchor: "immediate-cache-operations"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Bạn sẽ chọn giữa local cache đơn giản và distributed provider cho hệ thống production như thế nào?
    answer: >-
      Hãy bắt đầu từ hành vi cần thiết thay vì tên provider: quyền sở hữu dữ liệu, mức stale chấp nhận được, invalidation strategy, node topology, nhu cầu đồng thời, expiration/size policy, serialization, failure handling và observability. Local in-process cache rất phù hợp khi trạng thái theo từng node là chấp nhận được và ưu tiên sự đơn giản, nhưng nó không tự trở thành shared cache chỉ vì ứng dụng dùng Spring Cache. Nếu nhiều node cần trạng thái dùng chung hoặc expiry/coordination riêng của provider, hãy chọn provider có các khả năng đó và kiểm chứng ngữ nghĩa riêng của nó. Giữ Spring abstraction cho các thao tác ứng dụng có tính khả chuyển ở nơi phù hợp.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "10.CacheStrategy/CacheStrategy.md"
      anchor: "provider-selection"
    apiRelated:
      controller: ""
      methodSignature: ""
