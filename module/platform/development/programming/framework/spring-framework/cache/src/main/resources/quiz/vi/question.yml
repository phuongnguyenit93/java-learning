  - id: cache-evict-before-invocation
    question: "Một cache entry phải bị xóa ngay cả khi business method sau đó throw exception. Timing nào phù hợp với yêu cầu này?"
    answers:
      - id: A
        answer: "Dùng default after-success eviction để entry chỉ bị xóa khi phương thức trả về bình thường."
        explanation: "Sai. Post-invocation eviction mặc định có thể không xảy ra nếu phương thức thất bại."
      - id: B
        answer: "Dùng `beforeInvocation=true` để eviction xảy ra trước khi business method chạy."
        explanation: "Đúng. Pre-invocation eviction không phụ thuộc lời gọi sau đó thành công hay thất bại."
      - id: C
        answer: "Dùng `unless` để entry bị xóa khi phương thức throw exception."
        explanation: "Sai. unless là result-based caching veto, không phải exception-triggered eviction mode."
      - id: D
        answer: "Dùng `sync=true` để cache evict entry trước khi vào synchronized loader."
        explanation: "Sai. sync điều khiển việc phối hợp loading, không điều khiển thời điểm eviction."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.ConsistencyAndInvalidation/ConsistencyAndInvalidation.md"
      anchor: "evict-before-invocation"
