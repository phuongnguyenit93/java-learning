  - id: cache-async-provider-capability
    question: "Một cacheable method trong Spring Framework 6.1 trả `CompletableFuture<Book>`. Cần kiểm tra gì trước khi kết luận cache path là non-blocking?"
    answers:
      - id: A
        answer: "Đường truy xuất/lưu trữ của provider có thực sự asynchronous hay chỉ bọc công việc blocking phía sau API có hình dạng future."
        explanation: "Đúng. Cơ chế thích nghi kiểu trả về không xóa mô hình I/O và xử lý đồng thời thực tế của provider."
      - id: B
        answer: "Future có được tạo trên controller thread hay không, vì riêng điều đó đã bảo đảm non-blocking cache I/O."
