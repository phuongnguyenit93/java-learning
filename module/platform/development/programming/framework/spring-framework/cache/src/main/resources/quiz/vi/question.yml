  - id: cache-self-invocation
    question: "Trong proxy mode mặc định, vì sao `this.load()` có thể bypass caching khi `load()` được gắn `@Cacheable`?"
    answers:
      - id: A
        answer: "Lời gọi nội bộ ở lại trên target object và không đi lại qua Spring proxy đang mang cache interceptor."
        explanation: "Đúng. Proxy-based advice được áp dụng khi invocation đi qua proxy boundary."
      - id: B
        answer: "Lời gọi nội bộ đi qua proxy hai lần nên Spring bỏ lần interception thứ hai để tránh recursion."
        explanation: "Sai. Lời gọi này không đi lại qua proxy ngay từ đầu."
      - id: C
        answer: "Spring intercept lời gọi rồi chuyển nó thành programmatic `Cache.get`, làm annotation metadata bị tắt."
        explanation: "Sai. Vấn đề là bypass interception chứ không phải bị đổi sang API khác."
      - id: D
        answer: "Annotation chỉ hoạt động cho controller-to-service call, nên service-to-service call không bao giờ cache được."
        explanation: "Sai. Mọi external call đủ điều kiện đi qua proxy đều có thể được intercept; controller không đặc biệt."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.InterceptionBoundary/InterceptionBoundary.md"
