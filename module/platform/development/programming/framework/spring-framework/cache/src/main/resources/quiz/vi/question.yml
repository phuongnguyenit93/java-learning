  - id: cacheable-vs-cacheput
    question: "Một phương thức phải luôn thực thi business logic rồi ghi giá trị trả về vào cache. Thao tác nào phù hợp nhất?"
    answers:
      - id: A
        answer: "Dùng `@Cacheable`, vì nó lookup trước rồi ghi kết quả sau mọi lời gọi."
        explanation: "Sai. Cache hit có thể bỏ qua việc thực thi phương thức, nên @Cacheable không bảo đảm phương thức luôn chạy."
      - id: B
        answer: "Dùng `@CachePut`, vì phương thức vẫn thực thi và giá trị trả về được dùng để cập nhật cache."
        explanation: "Đúng. @CachePut mô hình hóa semantics execute-then-update."
      - id: C
        answer: "Dùng `@CacheEvict`, vì eviction thay thế giá trị hiện tại bằng kết quả phương thức."
        explanation: "Sai. @CacheEvict loại bỏ trạng thái cache chứ không lưu giá trị trả về."
      - id: D
        answer: "Dùng `@CacheConfig`, vì nó biến cache hit thành trường hợp bắt buộc phải thực thi phương thức."
        explanation: "Sai. @CacheConfig chia sẻ cấu hình; nó không định nghĩa lại hành vi khi cache hit."
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.DeclarativeCaching/DeclarativeCaching.md"
      anchor: "cache-put"
    apiRelated:
