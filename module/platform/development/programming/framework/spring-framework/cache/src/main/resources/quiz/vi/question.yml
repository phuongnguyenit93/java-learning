      methodSignature: ""

  - id: cache-condition-unless
    question: "Phát biểu nào phân biệt đúng `condition` và `unless` đối với một thao tác cacheable?"
    answers:
      - id: A
        answer: "`condition` quyết định thao tác có tham gia trước lời gọi; `unless` có thể từ chối lưu cache sau khi đã có kết quả."
        explanation: "Đúng. Hai expression hoạt động ở các giai đoạn khác nhau và phục vụ các quyết định khác nhau."
      - id: B
        answer: "`condition` và `unless` đều là post-invocation veto, nhưng `unless` còn evict entry hiện tại."
        explanation: "Sai. condition không phải post-invocation veto và unless không đồng nghĩa eviction."
      - id: C
        answer: "`condition` chọn cache manager trước invocation; `unless` chọn cache manager sau invocation."
        explanation: "Sai. Việc chọn CacheManager/CacheResolver là một mối quan tâm khác."
      - id: D
        answer: "`condition` quyết định kết quả có được lưu; `unless` quyết định business method có được gọi hay không."
        explanation: "Sai. Phát biểu này đảo ngược trách nhiệm liên quan."
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.KeyAndResolution/KeyAndResolution.md"
      anchor: "condition-vs-unless"
    apiRelated:
      controller: ""
      methodSignature: ""

  - id: cache-key-result-dimension
    question: "Một phương thức có cache nhận `isbn` và `includeReviews`, trong đó `includeReviews` làm thay đổi dạng biểu diễn trả về. Rủi ro chính khi chỉ key theo `isbn` là gì?"
    answers:
      - id: A
        answer: "Hai biến thể kết quả có thể bị gom vào cùng định danh cache, khiến một yêu cầu tái sử dụng giá trị của biến thể còn lại."
        explanation: "Đúng. Bỏ một result-shaping input khỏi key có thể tạo cache hit sai về mặt ngữ nghĩa."
      - id: B
        answer: "Spring tự động nối `includeReviews` vào explicit key, nên rủi ro chỉ là serialized key lớn hơn."
        explanation: "Sai. Key expression tường minh quyết định định danh; tham số bị bỏ không được tự động thêm vào."
      - id: C
        answer: "Biến thể đầu tiên được cache bình thường, nhưng Spring buộc mọi biến thể sau bỏ qua caching hoàn toàn."
        explanation: "Sai. Spring không suy luận rằng tham số bị bỏ khỏi key phải làm tắt caching."
      - id: D
        answer: "Provider tạo entry riêng theo dạng kết quả ngay cả khi cả hai lời gọi resolve thành cùng explicit key."
        explanation: "Sai. Provider nhìn thấy key đã resolve, không biết khái niệm biến thể kết quả ẩn của ứng dụng."
    correctAnswerId: A
    aiGenerated: true
