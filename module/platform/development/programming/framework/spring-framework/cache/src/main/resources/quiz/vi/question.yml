questions:
  - id: cache-source-of-truth
    question: "Một service giữ một bản ghi trong database và một bản sao trong cache. Phát biểu nào mô tả đúng nhất vai trò của cache?"
    answers:
      - id: A
        answer: "Bản cache trở thành dữ liệu có thẩm quyền khi nó được đọc thường xuyên hơn bản ghi trong database."
        explanation: "Sai. Tần suất đọc không chuyển quyền sở hữu source of truth sang cache."
      - id: B
        answer: "Bản cache là trạng thái dẫn xuất có độ mới và vòng đời có thể khác với dữ liệu có thẩm quyền."
        explanation: "Đúng. Cache là trạng thái dẫn xuất có thể tái sử dụng và có thể stale nếu consistency policy không giữ nó đồng bộ."
      - id: C
        answer: "Bản cache và bản ghi database cùng có thẩm quyền miễn là chúng dùng cùng một key."
        explanation: "Sai. Cùng identity không tạo ra đồng quyền sở hữu dữ liệu có thẩm quyền."
      - id: D
        answer: "Bản cache có thẩm quyền cho thao tác đọc, còn database chỉ có thẩm quyền cho thao tác ghi."
        explanation: "Sai. Read cache không tự động trở thành mô hình dữ liệu có thẩm quyền thứ hai."
    correctAnswerId: B
    aiGenerated: true
