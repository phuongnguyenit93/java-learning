  - id: cache-sync-scope
    question: "Bốn thread yêu cầu cùng một key đang miss qua `@Cacheable(sync=true)`, và cache đã cấu hình chỉ chạy loader một lần. Kết luận nào hợp lý?"
    answers:
      - id: A
        answer: "Với cache implementation và key đó, synchronized loading đã phối hợp concurrent miss thành một lần load."
        explanation: "Đúng. Đây là kết luận có giới hạn được hành vi runtime của provider hỗ trợ."
      - id: B
        answer: "Spring đã thiết lập distributed lock để phối hợp cùng key trên mọi application instance."
        explanation: "Sai. sync=true không phải distributed-lock guarantee tổng quát."
      - id: C
        answer: "Mọi provider bắt buộc triển khai feature này bằng cùng JVM locking primitive như thí nghiệm."
        explanation: "Sai. Cơ chế synchronization và khả năng hỗ trợ là đặc thù của provider."
      - id: D
        answer: "Cùng cấu hình có thể tùy ý kết hợp `sync=true`, nhiều cache name, `unless` và put/evict operation."
        explanation: "Sai. Synchronized caching có các ràng buộc rõ ràng và không nên bị suy rộng."
    correctAnswerId: A
