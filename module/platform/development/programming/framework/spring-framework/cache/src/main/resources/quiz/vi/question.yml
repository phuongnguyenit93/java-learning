  - id: cache-transaction-aware-mutation
    question: "Một database transaction lên lịch cache put thông thường qua `TransactionAwareCacheDecorator` rồi rollback. Hành vi nào được mong đợi?"
    answers:
      - id: A
        answer: "Put được trì hoãn và không công bố khi transaction bao quanh không commit thành công."
        explanation: "Đúng. Trì hoãn mutation giúp tránh công bố trạng thái cache cho dữ liệu chưa từng commit."
      - id: B
        answer: "Put xảy ra ngay, rồi rollback tự động chuyển put đó thành eviction riêng của provider."
        explanation: "Sai. Decorator không mô hình hóa rollback thành một thao tác cache ngược."
      - id: C
        answer: "Cache trở thành transaction manager và rollback database resource cùng với entry."
        explanation: "Sai. Cache synchronization không thay thế transaction manager thực sự."
      - id: D
        answer: "Put tham gia portable two-phase commit với mọi cache provider được Spring Cache chọn."
        explanation: "Sai. Transaction-aware decoration không phải universal XA guarantee."
    correctAnswerId: A
