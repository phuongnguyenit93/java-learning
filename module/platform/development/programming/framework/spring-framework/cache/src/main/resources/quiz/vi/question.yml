  - id: cache-strategy-provider-selection
    question: "Một ứng dụng nhiều node cần trạng thái cache dùng chung và expiration do provider hỗ trợ. Lựa chọn nào phù hợp nhất với chiến lược của module?"
    answers:
      - id: A
        answer: "Chọn provider có topology và khả năng expiration đáp ứng yêu cầu, đồng thời giữ các thao tác cache có tính khả chuyển phía sau Spring Cache."
        explanation: "Đúng. Việc chọn provider nên xuất phát từ khả năng cần thiết thay vì giả định lớp trừu tượng sẽ cung cấp chúng."
      - id: B
        answer: "Giữ in-process provider và giả định Spring Cache sẽ replicate entry rồi áp dụng một expiration policy chung trên mọi node."
        explanation: "Sai. Lớp trừu tượng không thêm ngữ nghĩa phân tán cho local provider."
      - id: C
        answer: "Dùng `@CacheConfig` để chuyển local provider thành distributed cache và định nghĩa expiration độc lập với provider."
        explanation: "Sai. @CacheConfig chia sẻ annotation configuration; nó không cung cấp topology hay portable TTL."
      - id: D
        answer: "Tạo unique key cho mỗi request để từng node giữ entry riêng rồi để Spring hợp nhất chúng thành shared cache state."
        explanation: "Sai. Per-request uniqueness phá reuse và không tạo shared topology hay consistency."
    correctAnswerId: A
