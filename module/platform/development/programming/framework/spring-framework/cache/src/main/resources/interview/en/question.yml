  - question: >-
      How do `Cache` and `CacheManager` divide responsibilities, and why should a named cache remain an application concept rather than a provider-specific name?
    answer: >-
      `Cache` represents operations on one logical cache region: lookup, put, eviction, clear and related loading/retrieval contracts. `CacheManager` resolves those regions by name and is the application-facing registry/factory boundary. A stable name such as `productsById` should describe what the application stores, not whether the current provider is Redis, Caffeine or a concurrent map. That separation lets business caching policy stay stable while provider configuration changes. Native-cache access is still available when a provider-specific feature is genuinely required, but crossing that boundary deliberately gives up portability and should not redefine the application's logical cache model.
    aiGenerated: true
    reviewed: false
