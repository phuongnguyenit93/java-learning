  - question: >-
      Explain how an incomplete cache key can create a correctness bug, and how you would prove the problem rather than only inspecting the key expression.
    answer: >-
      Cache identity must include every input that defines the reusable result. If includeReviews changes the returned representation but the key contains only ISBN, a request for the reviews variant can hit an entry created for the non-reviews variant. A convincing experiment performs the two requests against the incomplete key and shows that the second request reuses the wrong value with one loader invocation, then repeats the scenario with includeReviews in the key and shows two distinct loads returning the correct variants. The evidence should demonstrate a change from incorrect reuse to correct cache identity, not merely a different key string.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.KeyAndResolution/KeyAndResolution.md"
      anchor: "cache-key-design-pitfalls"
    apiRelated:
      controller: "CacheKeyController"
      methodSignature: "keyAndHitMiss()"

  - question: >-
      Why does self-invocation bypass @Cacheable in the default proxy mode, and what design choices can avoid depending on that behavior?
    answer: >-
      In proxy mode, the cache interceptor is attached to the Spring proxy. A call entering through another bean reference can cross that proxy, but this.load() inside the target object stays on the target and does not re-enter the interceptor. Common designs move the cached operation behind another Spring bean or restructure the call so the proxy boundary is explicit. AspectJ mode can intercept self-invocation because it uses weaving rather than proxy entry, but that changes the operational model and should be chosen deliberately rather than as a casual workaround.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.InterceptionBoundary/InterceptionBoundary.md"
      anchor: "self-invocation"
    apiRelated:
      controller: "CacheInterceptionController"
      methodSignature: "selfInvocation()"

  - question: >-
      What problem does @Cacheable(sync=true) address, what does the runtime experiment actually prove, and what should you avoid inferring from it?
    answer: >-
      Concurrent misses for the same key can trigger duplicate expensive computations. sync=true asks the cache implementation to coordinate loading for that cache/key operation. In the module experiment, four callers using ConcurrentMapCache produce one loader invocation and one returned load sequence, so synchronized loading is directly observable for that provider. The result does not prove a distributed lock, cross-node coordination or one universal locking mechanism for every provider. Provider capability and the exact annotation restrictions still matter.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.ConcurrencyAndAsync/ConcurrencyAndAsync.md"
      anchor: "cacheable-sync"
    apiRelated:
      controller: "CacheConcurrencyController"
      methodSignature: "synchronizedLoading()"

  - question: >-
      How should you reason about CompletableFuture or reactive return types in Spring caching without assuming the entire cache path is non-blocking?
    answer: >-
      Spring Framework 6.1 can adapt supported asynchronous and reactive return types so the produced value participates in caching, but the cache provider still determines how retrieval and storage are implemented. A future-shaped API does not make a blocking backend non-blocking. Check the provider's async retrieval capability, when a miss becomes known, null semantics, error propagation, cancellation and the behavior of multiple caches. Treat Spring's return-type adaptation and the provider's actual I/O/concurrency model as separate layers.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.ConcurrencyAndAsync/ConcurrencyAndAsync.md"
      anchor: "async-provider-capability"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      What problem does transaction-aware cache mutation solve, and why do immediate cache operations need special attention?
    answer: >-
      If a database transaction later rolls back, publishing a normal cache put or eviction too early can expose cache state that does not match committed data. TransactionAwareCacheDecorator or TransactionAwareCacheManagerProxy can defer supported put, evict and clear operations until after a successful commit. Operations whose contract requires immediate effect, such as putIfAbsent, evictIfPresent and invalidate, cannot simply be treated as ordinary deferred mutations. The cache module owns this interaction boundary; propagation, isolation, rollback rules and transaction-manager policy belong to Spring Transaction Management.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.FailureAndTransaction/FailureAndTransaction.md"
      anchor: "immediate-cache-operations"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      How would you choose between a simple local cache and a distributed provider for a production system?
    answer: >-
      Start from required behavior rather than a provider name: data ownership, acceptable staleness, invalidation strategy, node topology, concurrency needs, expiration and size policy, serialization, failure handling and observability. A local in-process cache can be ideal when per-node state is acceptable and simplicity matters, but it does not become shared merely because the application uses Spring Cache. If multiple nodes require shared state or provider-specific expiry and coordination, choose a provider with those capabilities and validate its native semantics. Keep the Spring abstraction for portable application operations where it remains useful.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "10.CacheStrategy/CacheStrategy.md"
      anchor: "provider-selection"
    apiRelated:
      controller: ""
      methodSignature: ""
