questions:
  - question: >-
      What does Spring Cache abstract, and which important decisions still belong to the cache provider?
    answer: >-
      Spring Cache gives application code a common contract around named caches, lookup, population, eviction and declarative annotations such as @Cacheable. It does not standardize every storage property. TTL/TTI, maximum size, native eviction policy, serialization, distribution topology and many concurrency guarantees remain provider concerns. A sound design keeps application-facing cache operations behind the Spring abstraction where useful, while selecting and configuring a provider whose native capabilities satisfy the operational requirements.
    aiGenerated: true
    reviewed: false
