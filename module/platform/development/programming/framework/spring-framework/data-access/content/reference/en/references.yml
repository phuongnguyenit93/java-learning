references:
  - title: "Spring Framework — Data Access"
    url: "https://docs.spring.io/spring/reference/data-access.html"
    description: "Tổng quan các tầng truy cập dữ liệu Spring: transaction management, DAO, JDBC, R2DBC và ORM."
  - title: "Spring Framework — DAO Support"
    url: "https://docs.spring.io/spring-framework/reference/data-access/dao.html"
    description: "Thiết kế DAO, @Repository và cơ chế dịch ngoại lệ công nghệ lưu trữ thành DataAccessException nhất quán."
  - title: "Spring Framework — Controlling Database Connections"
    url: "https://docs.spring.io/spring-framework/reference/data-access/jdbc/connections.html"
    description: "Cấu hình DataSource, lấy và giải phóng connection, liên kết connection với transaction và vai trò connection pool."
  - title: "Spring Framework — JDBC Core Classes"
    url: "https://docs.spring.io/spring-framework/reference/data-access/jdbc/core.html"
    description: "JdbcTemplate, NamedParameterJdbcTemplate, JdbcClient, RowMapper, truy vấn/cập nhật dữ liệu và xử lý lỗi."
  - title: "Spring Framework — JDBC Batch Operations"
    url: "https://docs.spring.io/spring-framework/reference/data-access/jdbc/advanced.html"
    description: "Thực hiện cập nhật hàng loạt bằng JdbcTemplate, NamedParameterJdbcTemplate và batch parameter source."
  - title: "Spring Framework — SimpleJdbc Classes"
    url: "https://docs.spring.io/spring-framework/reference/data-access/jdbc/simple.html"
    description: "SimpleJdbcInsert, SimpleJdbcCall, metadata database và xử lý khóa tự sinh hoặc stored procedure."
  - title: "Spring Framework — JDBC Parameter and Data Value Handling"
    url: "https://docs.spring.io/spring-framework/reference/data-access/jdbc/parameter-handling.html"
    description: "Xử lý kiểu SQL, tham số null, BLOB/CLOB và danh sách giá trị trong điều kiện IN."
  - title: "Spring Framework — Data Access with R2DBC"
    url: "https://docs.spring.io/spring-framework/reference/data-access/r2dbc.html"
    description: "Truy cập SQL non-blocking bằng DatabaseClient, ConnectionFactory, reactive query và R2dbcTransactionManager."
  - title: "Spring Framework — ORM Data Access"
    url: "https://docs.spring.io/spring-framework/reference/data-access/orm.html"
    description: "Tổng quan cách Spring tích hợp ORM, JPA, Hibernate, resource management và nhất quán ngoại lệ."
  - title: "Spring Framework — JPA Integration"
    url: "https://docs.spring.io/spring-framework/reference/data-access/orm/jpa.html"
    description: "Cấu hình EntityManagerFactory, @PersistenceContext, EntityManager và tương tác với JpaTransactionManager."
  - title: "Spring Framework — Transaction Management"
    url: "https://docs.spring.io/spring-framework/reference/data-access/transaction.html"
    description: "Khái niệm transaction abstraction, transaction manager và quản lý transaction khai báo hoặc lập trình."
