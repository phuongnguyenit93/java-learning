# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: data-access-q01-purpose
    question: "What is the main value Spring Framework Data Access adds when an application still wants to write explicit SQL?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/DataAccess.md"
      anchor: "data-access-purpose"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "It replaces explicit SQL with repository query derivation and aggregate mapping."
        explanation: "Incorrect. Repository query derivation and aggregate mapping belong to higher-level Spring Data abstractions."
      - id: B
        answer: "It standardizes resource workflow and failure translation while keeping SQL and mapping decisions visible."
        explanation: "Correct. Spring removes repetitive plumbing around intentional relational operations without hiding the SQL contract."
      - id: C
        answer: "It converts blocking JDBC drivers into non-blocking drivers without changing the database client."
        explanation: "Incorrect. Spring JDBC remains blocking because it is built on the blocking JDBC specification."
      - id: D
        answer: "It owns production schema-evolution history and rollout ordering alongside ordinary data-access operations."
        explanation: "Incorrect. Production migration history and rollout discipline belong to migration tools such as Flyway or Liquibase."
    correctAnswerId: B

  - id: data-access-q02-exception-translation
    question: "The same unique-constraint violation is triggered once through JdbcClient and once through DatabaseClient. Which shared Spring-level observation is most meaningful?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.DaoExceptionModel/DaoExceptionModel.md"
      anchor: "jdbc-r2dbc-exception-translation"
    apiRelated:
      controller: "DaoExceptionExperimentController"
      methodSignature: "observeCrossStackExceptionTranslation()"
    answers:
      - id: A
        answer: "Both calls must expose the exact same vendor exception class because Spring normalizes the driver implementation."
        explanation: "Incorrect. Translation normalizes data-access meaning, not the concrete vendor exception class."
      - id: B
        answer: "Both calls should expose only a generic RuntimeException so upper layers stay independent of persistence technology."
        explanation: "Incorrect. Spring preserves useful classification through the DataAccessException hierarchy instead of erasing it."
      - id: C
        answer: "Both calls can surface a meaningful DataAccessException subtype while the native database cause remains available for diagnosis."
        explanation: "Correct. Spring adds a portable classification and retains low-level cause information."
      - id: D
        answer: "Both calls become retry-safe because translating the exception marks the failed operation as transient."
        explanation: "Incorrect. Translation does not make an integrity violation transient or make retrying automatically safe."
    correctAnswerId: C

  - id: data-access-q03-repository-translation
    question: "What role does @Repository play in Spring persistence-exception translation?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.DaoExceptionModel/DaoExceptionModel.md"
      anchor: "repository-exception-translation"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The annotation itself installs translation around the bean and converts supported persistence failures into DataAccessException."
        explanation: "Incorrect. @Repository is a stereotype and eligibility marker; it does not perform translation by itself."
      - id: B
        answer: "It marks eligible persistence beans; registered translation infrastructure applies the translator-backed advisor."
        explanation: "Correct. PersistenceExceptionTranslationPostProcessor supplies the proxy/advisor mechanism when that infrastructure is registered."
      - id: C
        answer: "It is required for JdbcTemplate to translate SQLException during its normal query and update workflow."
        explanation: "Incorrect. JdbcTemplate already performs JDBC exception translation in its own workflow."
      - id: D
        answer: "It configures the persistence provider to emit DataAccessException directly instead of its native exception types."
        explanation: "Incorrect. Native exceptions still occur; Spring translates supported failures after they are raised."
    correctAnswerId: B

  - id: data-access-q04-parameter-binding
    question: "A request chooses a sort column dynamically. Why should the application not treat the column name as an ordinary JdbcClient bind value?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.SpringJdbcCore/SpringJdbcCore.md"
      anchor: "jdbc-parameter-binding"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Bind parameters represent runtime values; identifiers and SQL fragments should instead come from controlled application choices."
        explanation: "Correct. Parameter binding separates SQL structure from values but does not parameterize arbitrary identifiers."
      - id: B
        answer: "Named parameters can bind identifiers, but positional placeholders cannot, so the code only needs to switch placeholder style."
        explanation: "Incorrect. Spring named parameters are expanded to driver bind positions for values; they do not turn identifiers into bindable values."
      - id: C
        answer: "Identifiers may be bound only when JdbcTemplate is used directly because JdbcClient removes statement metadata."
        explanation: "Incorrect. This is a SQL/driver distinction, not a limitation unique to JdbcClient."
      - id: D
        answer: "Column names are safe to concatenate from request input because SQL injection applies only to literal values."
        explanation: "Incorrect. Untrusted identifiers or SQL fragments can still alter SQL structure and must be controlled."
    correctAnswerId: A

  - id: data-access-q05-cardinality
    question: "A query currently returns one row in test data, but neither its predicate nor a database constraint guarantees uniqueness. What is the best reason not to call JdbcClient single() yet?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.SpringJdbcCore/SpringJdbcCore.md"
      anchor: "jdbc-row-mapping-cardinality"
    apiRelated:
      controller: "JdbcCoreExperimentController"
      methodSignature: "observeJdbcCardinality()"
    answers:
      - id: A
        answer: "single() disables row mapping, so it should be used only for scalar database functions."
        explanation: "Incorrect. single() can return mapped objects; the issue here is the expected number of rows."
      - id: B
        answer: "single() silently keeps the first row, which can hide duplicate data unless ORDER BY is present."
        explanation: "Incorrect. A wrong single-result cardinality is reported rather than silently choosing one row."
      - id: C
        answer: "single() adds an internal count query to verify uniqueness, so its contract depends on that extra validation query."
        explanation: "Incorrect. The cardinality contract does not require a second connection or a separate uniqueness query."
      - id: D
        answer: "single() means exactly one row; the SQL predicate and constraints, not sample data, must justify that contract."
        explanation: "Correct. If multiple rows appear, Spring can report IncorrectResultSizeDataAccessException."
    correctAnswerId: D

  - id: data-access-q06-batch-vs-transaction
    question: "A DAO sends 500 similar inserts with JdbcTemplate batchUpdate(). What does batching itself guarantee?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.AdvancedJdbc/AdvancedJdbc.md"
      anchor: "jdbc-batch-operations"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "It guarantees all 500 writes commit or roll back together even when no transaction boundary was configured."
        explanation: "Incorrect. Atomic commit/rollback is a transaction concern, not an automatic property of batching."
      - id: B
        answer: "It groups parameter sets through JDBC batching; transaction boundaries and application chunking remain separate decisions."
        explanation: "Correct. Batch, transaction, and application chunking solve different concerns."
      - id: C
        answer: "It guarantees the database executes all 500 rows as one physical statement with one generated-key shape."
        explanation: "Incorrect. Driver and database behavior determine execution details and generated-key support."
      - id: D
        answer: "It standardizes partial-failure recovery across drivers so the caller can handle every failed parameter set the same way."
        explanation: "Incorrect. Batching does not define an automatic retry or recovery policy."
    correctAnswerId: B

  - id: data-access-q07-r2dbc-deferred
    question: "A DatabaseClient Mono has been assembled, but a counting ConnectionFactory still reports zero acquisitions. What best explains the observation?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.SpringR2dbcCore/SpringR2dbcCore.md"
      anchor: "r2dbc-reactive-sql-execution"
    apiRelated:
      controller: "R2dbcExperimentController"
      methodSignature: "observeR2dbcDeferredExecution()"
    answers:
      - id: A
        answer: "DatabaseClient has already executed the SQL and cached the rows without creating a driver connection."
        explanation: "Incorrect. Database I/O cannot occur without a connection; the pipeline has only been assembled."
      - id: B
        answer: "DatabaseClient postpones only row mapping, while connection acquisition and statement execution happen during sql(...)."
        explanation: "Incorrect. The core execution lifecycle, including acquisition, is deferred until subscription."
      - id: C
        answer: "The reactive pipeline is lazy; subscribing is what begins connection acquisition and SQL execution."
        explanation: "Correct. Building the fluent specification does not itself perform the database operation."
      - id: D
        answer: "DatabaseClient keeps an eager connection when the client is created, so the wrapped ConnectionFactory is bypassed for each operation."
        explanation: "Incorrect. R2DBC uses ConnectionFactory and Connection; the experiment specifically counts factory acquisitions."
    correctAnswerId: C

  - id: data-access-q08-r2dbc-null
    question: "A DatabaseClient row mapper sees SQL NULL for one column. Which mapping approach respects Reactive Streams semantics?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.SpringR2dbcCore/SpringR2dbcCore.md"
      anchor: "r2dbc-result-mapping-cardinality-null"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Return null from the mapper so the Publisher emits a null element for that row."
        explanation: "Incorrect. Reactive Streams does not permit null elements to be emitted."
      - id: B
        answer: "Drop the complete row whenever any SQL column is NULL because reactive mapping cannot represent partial nullability."
        explanation: "Incorrect. SQL NULL can be represented inside a non-null mapped object or another explicit application model."
      - id: C
        answer: "Switch to JDBC for any nullable column because only blocking APIs can represent SQL NULL safely."
        explanation: "Incorrect. R2DBC can represent nullable column values; the Publisher element itself must remain non-null."
      - id: D
        answer: "Return a non-null mapped value whose field or explicit domain representation models the SQL NULL."
        explanation: "Correct. Nullability belongs inside the mapped value rather than as a null Publisher element."
    correctAnswerId: D

  - id: data-access-q09-reactive-resource-context
    question: "Inside one Spring-managed reactive transaction, two DatabaseClient operations run on different threads after a scheduler hop, yet only one driver connection acquisition is observed. What explains the reuse?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.ResourceTransactionParticipation/ResourceTransactionParticipation.md"
      anchor: "thread-vs-subscriber-context-resources"
    apiRelated:
      controller: "ResourceParticipationExperimentController"
      methodSignature: "observeResourceBinding()"
    answers:
      - id: A
        answer: "Spring copies a ThreadLocal Connection from the first thread into every scheduler worker before the second query."
        explanation: "Incorrect. Reactive transaction state is not modeled as ordinary ThreadLocal state copied between workers."
      - id: B
        answer: "R2dbcTransactionManager uses one process-wide Connection for all requests until the application shuts down."
        explanation: "Incorrect. The reuse is scoped to the reactive transaction, not to the whole process."
      - id: C
        answer: "Reactor Context carries transaction state, so DatabaseClient can reuse the transaction-associated resource after a thread switch."
        explanation: "Correct. Thread identity does not define reactive transaction participation."
      - id: D
        answer: "boundedElastic workers inherit the request thread's transaction ThreadLocal, so ordinary thread-local propagation explains the reuse."
        explanation: "Incorrect. The experiment observes a real scheduler hop while the transaction-associated resource remains reusable."
    correctAnswerId: C

  - id: data-access-q10-blocking-jdbc-reactive
    question: "A WebFlux path wraps a JdbcClient call in Mono but executes that call on the event-loop thread. Which assessment is correct?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.AbstractionChoice/AbstractionChoice.md"
      anchor: "blocking-jdbc-in-reactive-paths"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The JDBC call becomes non-blocking because returning Mono changes how the underlying driver performs I/O."
        explanation: "Incorrect. A reactive wrapper does not change JDBC's blocking driver model."
      - id: B
        answer: "The event loop can still block; isolate required JDBC work on a bounded scheduler or use R2DBC when an end-to-end reactive path is justified."
        explanation: "Correct. Scheduler isolation can protect the event loop, but the JDBC work remains blocking."
      - id: C
        answer: "Increasing the JDBC connection pool is sufficient because pool size determines whether the event-loop thread blocks."
        explanation: "Incorrect. Pool sizing affects resource availability but does not make JDBC I/O non-blocking."
      - id: D
        answer: "Calling publishOn after the JdbcClient call has already completed retroactively moves the blocking database work off the event loop."
        explanation: "Incorrect. Scheduling must surround where blocking work is actually executed; it cannot move work that already ran."
    correctAnswerId: B
