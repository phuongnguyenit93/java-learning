questions:
  - question: >-
      Spring Framework Data Access giải quyết vấn đề gì mà không cố trở thành repository hoặc ORM layer, và bạn sẽ đặt boundary đó ở đâu trong ứng dụng thực tế?
    answer: >-
      Spring Framework Data Access loại bỏ phần lặp lại của resource acquisition/release, statement execution plumbing và technology-specific failure handling nhưng vẫn để SQL tường minh, parameter binding, mapping và result expectation hiển thị rõ. JdbcClient/JdbcTemplate nằm trực tiếp trên JDBC, còn DatabaseClient nằm trực tiếp trên R2DBC. Tôi giữ tầng này khi direct relational control có giá trị. Tôi chuyển lên Spring Data khi repository và aggregate mapping là bài toán chính, và dùng JPA/Hibernate khi cần persistence-context cùng ORM lifecycle semantics. Transaction propagation, isolation và rollback policy thuộc Spring Transaction Management chứ không được định nghĩa lại bởi data-access client.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/DataAccess.md"
      anchor: "data-access-responsibility-boundary"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Hãy giải thích Spring exception translation bổ sung điều gì trên native exception của JDBC và R2DBC. Application code nên dùng translated hierarchy thế nào mà không làm mất giá trị chẩn đoán?
    answer: >-
      JDBC và R2DBC lộ ra các native exception family khác nhau, còn Spring translate các failure được hỗ trợ thành hierarchy DataAccessException dạng unchecked để tầng trên reasoning theo ý nghĩa data-access như duplicate key, integrity violation, lock failure hoặc result-cardinality error. Native cause ban đầu vẫn được giữ để chẩn đoán theo vendor. Tôi chỉ catch Spring subtype hẹp nhất khi ứng dụng thực sự có policy tương ứng, ví dụ map duplicate business key thành domain conflict. Tôi không catch rồi wrap mọi DataAccessException thành lỗi chung, và cũng không giả định mọi transient category tự động retry-safe; retry vẫn cần idempotency, backoff và policy có giới hạn.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.DaoExceptionModel/DaoExceptionModel.md"
      anchor: "jdbc-r2dbc-exception-translation"
    apiRelated:
      controller: "DaoExceptionExperimentController"
      methodSignature: "observeCrossStackExceptionTranslation()"

  - question: >-
      Bạn sẽ chọn JdbcClient hay template API như thế nào, và vì sao result cardinality phải được xem là một phần của query contract thay vì chỉ là lựa chọn tiện lợi?
    answer: >-
      Tôi bắt đầu với JdbcClient cho query/update có parameter thông thường vì nó đặt SQL, binding, mapping và result resolution trong một fluent surface nhưng vẫn delegate xuống template infrastructure đã ổn định. Tôi dùng JdbcTemplate hoặc NamedParameterJdbcTemplate khi cần batch API, execute-style operation, statement-creation callback, template-specific configuration hoặc tích hợp code hiện có dựa trên template. Mapping và cardinality là hai quyết định riêng: list() nghĩa là zero-or-more, optional() là zero-or-one, còn single() là exactly one. SQL predicate và database constraint phải biện minh expectation đó; sample data hiện tại không phải contract. Vì vậy single-result method có thể phát sinh IncorrectResultSizeDataAccessException khi dữ liệu trái với expectation của caller.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.SpringJdbcCore/SpringJdbcCore.md"
      anchor: "jdbc-row-mapping-cardinality"
    apiRelated:
      controller: "JdbcCoreExperimentController"
      methodSignature: "observeJdbcCardinality()"

  - question: >-
      Team muốn tăng tốc nhiều JDBC insert, lấy generated identifier và đôi lúc dựng result có state xuyên nhiều row. Bạn sẽ cân nhắc cơ chế Spring JDBC nào, và sẽ từ chối những giả định nào?
    answer: >-
      Với nhiều write tương tự tôi sẽ cân nhắc JdbcTemplate batchUpdate cùng batch size đã đo và có giới hạn, nhưng tách batch submission khỏi transaction atomicity và application chunking. Với generated value tôi dùng JDBC generated-key support qua Spring helper như KeyHolder hoặc JdbcClient result API phù hợp, nhưng xem returned column và numeric type là contract của driver/database thay vì giả định mọi key là Long. Với mapping cần state của toàn ResultSet tôi dùng ResultSetExtractor; RowCallbackHandler phù hợp cho per-row side effect. Các callback này là escape hatch bên trong Spring-managed JDBC workflow, không phải lý do để tự đóng resource mà Spring cung cấp trừ khi callback contract giao ownership đó cho application.
    aiGenerated: true
    reviewed: false
