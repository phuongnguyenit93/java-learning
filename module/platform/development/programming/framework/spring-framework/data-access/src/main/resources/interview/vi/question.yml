  - question: >-
      Hãy đi qua DatabaseClient execution lifecycle từ lúc dựng SQL đến khi release connection. Vì sao subscription quan trọng, và lỗi tư duy nào xuất hiện khi coi DatabaseClient như eager imperative client?
    answer: >-
      Dựng fluent specification của DatabaseClient tạo execution plan theo Publisher; nó chưa thực hiện database I/O. Subscription mới bắt đầu connection acquisition, statement creation và binding, execution, result consumption rồi release resource. Error và transaction context vì vậy đi cùng reactive chain. Gọi block() chỉ để bắt chước JdbcTemplate bên trong reactive request path sẽ phá non-blocking model và có thể làm nghẽn event-loop thread. SQL NULL cũng không thể trở thành null Publisher element; nó phải được biểu diễn bên trong mapped value không null. Step 5 experiment làm subscription boundary quan sát được vì CountingConnectionFactory vẫn bằng 0 trước subscription và chỉ tăng khi query được subscribe.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "5.SpringR2dbcCore/SpringR2dbcCore.md"
      anchor: "r2dbc-reactive-sql-execution"
    apiRelated:
      controller: "R2dbcExperimentController"
      methodSignature: "observeR2dbcDeferredExecution()"

  - question: >-
      Hãy so sánh transaction-associated resource lookup của JDBC với R2DBC. Vì sao reactive transaction có thể sống qua thread switch trong khi ordinary ThreadLocal reasoning là không đủ?
    answer: >-
      Imperative Spring transaction synchronization thường gắn JDBC ConnectionHolder với thread hiện tại, và DataSourceUtils cho phép lower-level JDBC code lấy hoặc release transaction-aware connection đúng cách. Reactive execution có thể chuyển thread nhưng vẫn là một logical subscription, nên reactive transaction infrastructure của Spring mang transaction state trong Reactor subscriber Context thay vì dựa vào ordinary ThreadLocal affinity. DatabaseClient và ConnectionFactoryUtils tham gia lifecycle nhận biết context đó. Trong Step 5 experiment, hai DatabaseClient operation chạy trên hai thread khác nhau sau scheduler hop trong khi CountingConnectionFactory chỉ ghi nhận một physical acquisition, chứng minh transaction-associated resource được reuse chứ không phải process-wide connection hay ThreadLocal bị copy.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.ResourceTransactionParticipation/ResourceTransactionParticipation.md"
      anchor: "thread-vs-subscriber-context-resources"
    apiRelated:
      controller: "ResourceParticipationExperimentController"
      methodSignature: "observeResourceBinding()"

  - question: >-
      Một reactive HTTP application bắt buộc phải gọi library chỉ hỗ trợ JDBC. Bạn sẽ làm gì, và điều gì bạn sẽ không tuyên bố về kết quả?
    answer: >-
      JDBC vẫn blocking dù được bọc trong Mono. Nếu dependency JDBC-only phải được giữ lại, tôi cô lập blocking call trên bounded scheduler phù hợp, cân đối JDBC connection pool với thread capacity, đồng thời làm boundary này rõ trong observability và load test. Cách đó bảo vệ event-loop thread nhưng không biến driver thành non-blocking I/O. Nếu ứng dụng thực sự cần end-to-end reactive data path và database có production-quality R2DBC driver, chuyển path đó sang R2DBC có thể sạch hơn. Tôi cũng không ép R2DBC vào một ứng dụng vốn chủ yếu imperative chỉ vì framework có hỗ trợ.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.AbstractionChoice/AbstractionChoice.md"
      anchor: "blocking-jdbc-in-reactive-paths"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Hãy mô tả một quy trình quyết định end-to-end để chọn Spring JDBC, Spring R2DBC, Spring Data hoặc JPA/Hibernate cho một persistence use case mới.
    answer: >-
      Trước hết tôi chọn execution model của ứng dụng: imperative hay thực sự reactive. Sau đó tôi hỏi explicit SQL và thin framework workflow có phải điều mong muốn không. Với imperative explicit SQL, Spring JDBC bằng JdbcClient hoặc template API là lựa chọn tự nhiên; với reactive explicit SQL, DatabaseClient trên R2DBC phù hợp khi driver đủ trưởng thành cho production. Nếu aggregate mapping, repository convention và query abstraction là nhu cầu chính, Spring Data JDBC hoặc Spring Data R2DBC nâng abstraction lên. Nếu entity identity, persistence context, relationship, lazy loading và dirty checking là requirement cốt lõi, JPA/Hibernate giải một bài toán ORM khác. Quyết định còn phụ thuộc driver maturity, operational tooling, kinh nghiệm team, transaction model, database-specific feature và chi phí che SQL sau abstraction cao hơn. Tầng cao hơn không tự động tốt hơn; tầng đúng là tầng làm ownership, SQL intent, lifecycle và failure behavior dễ reasoning nhất.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: ""
      anchor: ""
    apiRelated:
      controller: ""
      methodSignature: ""
