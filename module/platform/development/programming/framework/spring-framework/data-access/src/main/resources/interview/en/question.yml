  - question: >-
      Describe an end-to-end decision process for choosing Spring JDBC, Spring R2DBC, Spring Data or JPA/Hibernate for a new persistence use case.
    answer: >-
      I first choose the application's execution model: imperative or genuinely reactive. Then I ask whether explicit SQL and thin framework workflow are desirable. For imperative explicit SQL, Spring JDBC with JdbcClient or template APIs is a natural fit; for reactive explicit SQL, DatabaseClient on R2DBC fits when driver support is production-ready. If aggregate mapping, repository conventions and query abstractions are the main need, Spring Data JDBC or Spring Data R2DBC moves the abstraction upward. If entity identity, persistence context, relationships, lazy loading and dirty checking are core requirements, JPA/Hibernate solves a different ORM problem. The decision also includes driver maturity, operational tooling, team expertise, transaction model, database-specific features and the cost of hiding SQL behind a higher abstraction. Higher level is not automatically better; the right level is the one that makes ownership, SQL intent, lifecycle and failure behavior easiest to reason about.
    aiGenerated: true
    reviewed: false
