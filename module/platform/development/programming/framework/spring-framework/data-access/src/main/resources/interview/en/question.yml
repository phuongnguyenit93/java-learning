  - question: >-
      A reactive HTTP application must call an existing JDBC-only library. What would you do, and what would you avoid claiming about the result?
    answer: >-
      JDBC remains blocking even when wrapped in Mono. If the JDBC-only dependency must stay, I would isolate the blocking call on an appropriate bounded scheduler, keep the JDBC connection pool and thread capacity aligned, and make the boundary explicit in observability and load testing. That protects event-loop threads but does not convert the driver into non-blocking I/O. If the application truly requires an end-to-end reactive data path and the target database has a production-quality R2DBC driver, moving that path to R2DBC may be cleaner. I would not force R2DBC into an otherwise imperative application merely because the framework supports it.
    aiGenerated: true
    reviewed: false
