  - question: >-
      A team wants to speed up many JDBC inserts, retrieve generated identifiers and occasionally build cross-row results. Which Spring JDBC mechanisms would you consider, and which assumptions would you refuse to make?
    answer: >-
      For many similar writes I would consider JdbcTemplate batchUpdate with a measured, bounded batch size, but I would keep batch submission separate from transaction atomicity and application chunking. For generated values I would use JDBC generated-key support through Spring helpers such as KeyHolder or suitable JdbcClient result APIs, while treating returned columns and numeric types as driver/database contracts rather than assuming every key is a Long. For mapping that needs whole-result-set state I would use ResultSetExtractor; for per-row side effects RowCallbackHandler may fit. These callbacks are escape hatches inside Spring's managed JDBC workflow, not permission to close resources supplied by Spring unless the callback contract explicitly assigns ownership.
