  - question: >-
      Explain what Spring exception translation adds on top of JDBC and R2DBC native exceptions. How should application code use the translated hierarchy without losing diagnostic value?
    answer: >-
      JDBC and R2DBC expose different native exception families, but Spring translates supported failures into the unchecked DataAccessException hierarchy so upper layers can reason about data-access meaning such as duplicate keys, integrity violations, lock failures or result-cardinality errors. The original native cause remains available for vendor-specific diagnosis. I catch only the narrowest Spring subtype for which the application has an actual policy, such as mapping a duplicate business key to a domain conflict. I do not broadly catch and wrap every DataAccessException, and I do not assume that every transient category is automatically safe to retry; retry still needs idempotency, backoff and a bounded policy.
    aiGenerated: true
    reviewed: false
    readmeRelated:
