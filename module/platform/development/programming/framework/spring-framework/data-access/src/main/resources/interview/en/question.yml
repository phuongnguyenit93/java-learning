  - question: >-
      How would you choose between JdbcClient and the template APIs, and why should result cardinality be treated as part of the query contract rather than a convenience choice?
    answer: >-
      I start with JdbcClient for ordinary parameterized query/update work because it keeps SQL, bindings, mapping and result resolution together while delegating to the established template infrastructure. I use JdbcTemplate or NamedParameterJdbcTemplate when I need batch APIs, execute-style operations, statement-creation callbacks, template-specific configuration or existing template-based integration. Mapping and cardinality are separate decisions: list() means zero-or-more, optional() means zero-or-one, and single() means exactly one. The SQL predicate and database constraints should justify that expectation; current sample data is not a contract. A single-result method can therefore surface IncorrectResultSizeDataAccessException when the data contradicts the caller's expectation.
    aiGenerated: true
    reviewed: false
