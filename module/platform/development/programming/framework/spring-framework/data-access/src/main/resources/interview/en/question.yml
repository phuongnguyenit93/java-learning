  - question: >-
      Walk through the DatabaseClient execution lifecycle from building SQL to releasing the connection. Why is subscription important, and what mistakes arise from treating DatabaseClient like an eager imperative client?
    answer: >-
      Building the DatabaseClient fluent specification creates a Publisher-oriented execution plan; it does not itself perform database I/O. Subscription begins connection acquisition, statement creation and binding, execution, result consumption and eventual release. Errors and transaction context therefore travel with the reactive chain. Calling block() merely to imitate JdbcTemplate inside a reactive request path defeats the non-blocking model and can starve event-loop threads. SQL NULL also cannot be represented as a null Publisher element; it must be modeled inside a non-null mapped value. The Step 5 experiment makes the subscription boundary observable because the counting ConnectionFactory remains at zero before subscription and increases only once the query is subscribed.
    aiGenerated: true
    reviewed: false
