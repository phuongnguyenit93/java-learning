  - question: >-
      Compare JDBC transaction-associated resource lookup with R2DBC resource lookup. Why can a reactive transaction survive a thread switch while ordinary ThreadLocal reasoning is insufficient?
    answer: >-
      Imperative Spring transaction synchronization commonly associates a JDBC ConnectionHolder with the current thread, and DataSourceUtils lets lower-level JDBC code obtain or release the transaction-aware connection correctly. Reactive execution can move between threads while remaining one logical subscription, so Spring's reactive transaction infrastructure carries transaction state in Reactor subscriber Context instead of relying on ordinary ThreadLocal affinity. DatabaseClient and ConnectionFactoryUtils participate in that context-aware lifecycle. In the Step 5 experiment, two DatabaseClient operations execute on different threads after a scheduler hop while the counting ConnectionFactory records one physical acquisition, demonstrating reuse of the transaction-associated resource rather than a process-wide connection or copied ThreadLocal.
    aiGenerated: true
    reviewed: false
