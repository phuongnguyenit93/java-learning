questions:
  - question: >-
      What problem does Spring Framework Data Access solve without trying to become a repository or ORM layer, and where would you draw that boundary in a real application?
    answer: >-
      Spring Framework Data Access removes repetitive resource acquisition/release, statement execution plumbing and technology-specific failure handling while leaving explicit SQL, parameter binding, mapping and result expectations visible. JdbcClient/JdbcTemplate sit directly on JDBC, while DatabaseClient sits directly on R2DBC. I keep this layer when direct relational control is valuable. I move to Spring Data when repository and aggregate mapping are the dominant problem, and to JPA/Hibernate when persistence-context and ORM lifecycle semantics are required. Transaction propagation, isolation and rollback policy belong to Spring Transaction Management rather than being redefined by the data-access client.
