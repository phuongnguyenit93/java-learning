references:
  - title: "Spring Framework Reference — Aspect Oriented Programming with Spring"
    url: "https://docs.spring.io/spring-framework/reference/core/aop.html"
    description: "Tổng quan Spring AOP và cơ chế tích hợp aspect vào Spring IoC, đặc biệt giới hạn join point ở lời gọi phương thức trên Spring bean."
  - title: "Spring Framework Reference — Enabling @AspectJ Support"
    url: "https://docs.spring.io/spring-framework/reference/core/aop/ataspectj/aspectj-support.html"
    description: "Cách kích hoạt @EnableAspectJAutoProxy hoặc cấu hình XML và yêu cầu classpath khi dùng cú pháp @AspectJ trong Spring AOP."
  - title: "Spring Framework Reference — Declaring an Aspect"
    url: "https://docs.spring.io/spring-framework/reference/core/aop/ataspectj/at-aspectj.html"
    description: "Đăng ký @Aspect như Spring bean, cơ chế phát hiện aspect và cấu trúc aspect với pointcut, advice, introduction."
  - title: "Spring Framework Reference — Declaring a Pointcut"
    url: "https://docs.spring.io/spring-framework/reference/core/aop/ataspectj/pointcuts.html"
    description: "Biểu thức @Pointcut hỗ trợ trong Spring AOP, bộ lọc execution/within/@annotation/bean và giới hạn khi chọn join point."
  - title: "Spring Framework Reference — Declaring Advice"
    url: "https://docs.spring.io/spring-framework/reference/core/aop/ataspectj/advice.html"
    description: "Các annotation @Before, @AfterReturning, @AfterThrowing, @After, @Around; binding tham số, ProceedingJoinPoint và thứ tự chạy."
  - title: "Spring Framework Reference — Proxying Mechanisms"
    url: "https://docs.spring.io/spring-framework/reference/core/aop/proxying.html"
    description: "Phân biệt proxy JDK/CGLIB, self-invocation bypass, final/private methods và hệ quả của proxy-based AOP."
  - title: "Spring Framework Reference — Spring AOP APIs"
    url: "https://docs.spring.io/spring-framework/reference/core/aop-api.html"
    description: "API Spring AOP cấp thấp: Pointcut, Advice, Advisor, ProxyFactory và auto-proxy; mở rộng aspect bằng cách cấu hình proxy."
  - title: "Spring Framework Reference — Using AspectJ with Spring Applications"
    url: "https://docs.spring.io/spring-framework/reference/core/aop/using-aspectj.html"
    description: "Tích hợp AspectJ compile-time/load-time weaving với Spring, phân biệt weaving của AspectJ và Spring AOP dựa trên proxy."
