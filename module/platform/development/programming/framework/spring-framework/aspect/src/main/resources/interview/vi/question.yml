  - question: >-
      Bạn sẽ chọn execution(...), args(...), this(...) và target(...) như thế nào khi thiết kế Spring AOP pointcut, và vì sao pointcut production thường nên hẹp?
    answer: >-
      execution(...) chủ yếu giới hạn declared method execution signature, còn args(...) có thể giới hạn hoặc bind runtime argument type. this(...) kiểm tra proxy reference, trong khi target(...) kiểm tra target object phía sau proxy. Trong proxy-based runtime hai object này có thể khác nhau, vì vậy module expose runtime class thực tế của cả hai. Pointcut production nên thu hẹp đúng architectural boundary bằng cách kết hợp package/type, method, annotation hoặc bean constraint. Expression quá rộng làm advice application khó dự đoán, dễ match nhầm và tăng rủi ro khi refactor.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Pointcut/Pointcut.md"
      anchor: "pointcut-designators-and-composition"
    apiRelated:
      controller: "PointcutController"
      methodSignature: "comparePointcuts()"

  - question: >-
      So sánh @Before, @AfterReturning, @AfterThrowing, @After và @Around. Vì sao thường nên chọn advice yếu nhất nhưng vẫn đủ yêu cầu thay vì mặc định dùng @Around?
    answer: >-
      @Before quan sát hoặc kiểm tra trước khi target chạy. @AfterReturning gắn với normal return, @AfterThrowing gắn với exceptional exit phù hợp, còn @After có semantics kiểu finally cho matched invocation. @Around mạnh hơn vì nó nắm proceed(): có thể tiếp tục, bỏ qua, lặp, thay argument, biến đổi result hoặc thay đổi exception behavior. Sức mạnh đó cũng làm control flow khó nhìn hơn. Nếu chỉ cần quan sát successful return hoặc ghi nhận exception thì advice chuyên biệt truyền đạt intent tốt hơn và giảm nguy cơ vô tình đổi invocation semantics. Chỉ nên dùng @Around khi concern thật sự cần điều khiển invocation chain.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Advice/Advice.md"
