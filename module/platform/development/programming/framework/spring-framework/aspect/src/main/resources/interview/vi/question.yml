questions:
  - question: >-
      Vì sao self-invocation có thể bypass Spring AOP advice dù inner method vẫn match pointcut, và trong thiết kế application bạn thường ưu tiên cách xử lý nào?
    answer: >-
      Spring AOP intercept khi caller đi qua proxy boundary. External call có thể được intercept trước khi tới target, nhưng target method gọi this.inner() thì vẫn ở trên cùng target object và không quay lại proxy. Vì vậy inner method có thể match pointcut hoàn toàn nhưng vẫn không nhận lần interception thứ hai. Cách xử lý rõ ràng nhất thường là chuyển advised boundary sang một Spring bean khác để lời gọi đi qua proxy mới. Self-injection hoặc AopContext.currentProxy() có thể dùng trong một số trường hợp nhưng làm business code coupling mạnh hơn với AOP infrastructure, nên thường chỉ nên xem là escape hatch.
    aiGenerated: true
    reviewed: false
    readmeRelated:
