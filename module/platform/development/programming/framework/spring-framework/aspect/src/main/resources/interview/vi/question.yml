  - question: >-
      Hai Aspect khác nhau cùng áp dụng lên một method. Hãy giải thích precedence ảnh hưởng nested call order như thế nào và vấn đề gì xuất hiện khi hệ thống phụ thuộc vào quá nhiều ordering rule tinh vi.
    answer: >-
      Giữa các Aspect đã được order, Aspect có precedence cao hơn đi vào trước và đi ra sau, hoạt động như outer wrapper quanh Aspect precedence thấp hơn. Trong Spring, precedence giữa các Aspect thường được biểu đạt bằng Ordered hoặc @Order thay vì đoán từ thứ tự khai báo source. Một vài quan hệ ordering rõ ràng có thể hợp lý, nhưng design phụ thuộc vào chuỗi dài hidden order sẽ rất mong manh: thêm Aspect hoặc đổi pointcut có thể làm behavior thay đổi mà service code không thể hiện. Nên ưu tiên các cross-cutting concern độc lập và document số ít ordering constraint thật sự cần thiết.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.Ordering/Ordering.md"
      anchor: "ordering-mental-model"
    apiRelated:
