  - question: >-
      Khi debug application, bạn phân biệt @AspectJ declaration syntax, proxy-based Spring AOP runtime behavior và full AspectJ weaving như thế nào?
    answer: >-
      @Aspect, @Pointcut, @Before và @Around mô tả @AspectJ-style declaration model; tự chúng không chứng minh behavior được thực thi bằng mechanism nào. Positive runtime evidence cho Spring AOP gồm Spring-managed target reference là AOP proxy, proxy-versus-target type khác nhau khi phù hợp và advisor/interceptor chain quanh method execution. Full AspectJ weaving là build/runtime mechanism khác với join point model rộng hơn. Vì vậy việc có hoặc không weaving phải được xác nhận từ build/runtime configuration, không suy ra chỉ từ annotation hay từ việc thấy Spring proxy. Spring Boot còn có thể auto-configure AOP và proxy strategy, nhưng các Boot property đó không phải semantic default của Spring Framework AOP.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "15.RuntimeBoundary/RuntimeBoundary.md"
      anchor: "spring-aop-vs-aspectj"
    apiRelated:
