    apiRelated:
      controller: "IntroductionController"
      methodSignature: "observeIntroduction()"

  - question: >-
      Khi nào một concern nên được giữ explicit trong service hoặc domain code thay vì chuyển sang Aspect?
    answer: >-
      Hãy giữ behavior explicit khi nó là quyết định nghiệp vụ cốt lõi, điều khiển workflow state, chỉ thuộc một use case, hoặc buộc người đọc phải dựng lại control flow thiết yếu từ hidden advice. AOP phù hợp nhất với policy thật sự cross-cutting có boundary ổn định và dễ giải thích như auditing, tracing, timing hoặc infrastructure-oriented interception. Ngay cả khi dùng AOP, pointcut nên hẹp, side effect phải dự đoán được, exception behavior phải có chủ đích và mutable Aspect state cần tránh hoặc thiết kế cẩn thận. Mục tiêu không phải làm service code ngắn bằng mọi giá mà là loại bỏ cross-cutting mechanics lặp lại mà không che khuất business model.
    aiGenerated: true
    reviewed: false
