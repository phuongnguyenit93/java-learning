      methodSignature: "observeOrdering()"

  - question: >-
      ProxyFactory, PointcutAdvisor, Pointcut và MethodInterceptor ghép với nhau như thế nào bên dưới annotation-style Spring AOP, và static-versus-dynamic MethodMatcher bổ sung gì vào mental model đó?
    answer: >-
      ProxyFactory làm lộ cấu trúc mức thấp: target được bọc bởi proxy và các pointcut-based Advisor như PointcutAdvisor đóng góp advice/interceptor khi Pointcut match. Generic Advisor là contract rộng hơn và không phải lúc nào cũng có thể mô hình hóa thành Pointcut + Advice. Pointcut kết hợp class filtering với method matching, còn MethodInterceptor cung cấp behavior kiểu around qua MethodInvocation.proceed(). Static MethodMatcher có thể quyết định từ method và target-class metadata; dynamic matcher trước hết phải pass static eligibility rồi mới thêm per-invocation argument check khi isRuntime() là true. Mental model này giải thích cách @AspectJ-style declaration cuối cùng trở thành runtime advisor/interceptor chain mà không nhầm annotation syntax với execution mechanism.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "11.Advisor/Advisor.md"
      anchor: "advisor-mental-model"
    apiRelated:
      controller: "AdvisorController"
      methodSignature: "observeAdvisor()"

  - question: >-
      AOP Introduction thay đổi điều gì, capability mới nằm ở đâu, và có concern production nào nếu introduced behavior giữ mutable state?
    answer: >-
      Introduction cho phép AOP proxy expose thêm interface dù target class gốc không implement interface đó. Capability vì vậy nằm trên proxy surface và introduced implementation; proxy-based mechanism này không rewrite target class bytecode. Nếu introduced implementation giữ mutable state thì lifecycle và sharing semantics quan trọng như với mọi stateful component khác. Singleton proxy có thể bị dùng đồng thời, nên không được giả định state tự nhiên là per-invocation trừ khi state được thiết kế cho concurrency hoặc experiment bounded được serialize rõ ràng. Vì interface mới cũng không xuất hiện trên target class, capability cần được document để caller không bất ngờ bởi runtime type contract ẩn.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.Introduction/Introduction.md"
