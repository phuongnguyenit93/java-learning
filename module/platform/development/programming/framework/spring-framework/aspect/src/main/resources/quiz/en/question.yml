# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: aop-cross-cutting-boundary
    question: "Which concern is the strongest candidate for Spring AOP?"
    answers:
      - {id: A, answer: "A pricing rule that decides the business value of every order.", explanation: "Incorrect. Core business decisions should remain explicit in the service/domain model."}
      - {id: B, answer: "A one-off formatter used by a single controller response.", explanation: "Incorrect. A local helper is simpler when the behavior is not genuinely cross-cutting."}
      - {id: C, answer: "An audit policy repeated across many service methods with a clear method boundary.", explanation: "Correct. Repeated cross-cutting behavior with a precise boundary is a strong AOP use case."}
      - {id: D, answer: "A workflow that chooses the next business step from mutable order state.", explanation: "Incorrect. Hiding core workflow decisions in an Aspect makes the business flow harder to reason about."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.CrossCutting/CrossCutting.md", anchor: "cross-cutting-concern"}
    apiRelated: {controller: "CrossCuttingController", methodSignature: "observeCrossCutting()"}

  - id: aop-self-invocation-boundary
    question: "A caller invokes outer() through a Spring AOP proxy, and outer() then calls this.inner() on the same target. What should you expect?"
    answers:
      - {id: A, answer: "Advice can run for outer(), while the direct this.inner() call does not cross the proxy again.", explanation: "Correct. Self-invocation stays on the target object and therefore bypasses a second proxy interception."}
      - {id: B, answer: "Both calls are intercepted because pointcut matching is evaluated for every matching method on the target class.", explanation: "Incorrect. Method membership alone does not create a second proxy boundary for this.inner()."}
      - {id: C, answer: "The outer call reaches the target without advice, while the inner call is intercepted when Spring sees the matching method.", explanation: "Incorrect. The original external call can still be intercepted when it enters through the proxy."}
      - {id: D, answer: "The outer call is advised, and Spring automatically routes this.inner() back through the current proxy for a second interception.", explanation: "Incorrect. The relevant distinction is whether the invocation crosses the proxy, not call depth."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "13.SelfInvocation/SelfInvocation.md", anchor: "self-invocation-demo"}
    apiRelated: {controller: "SelfInvocationController", methodSignature: "compareSelfInvocation()"}

  - id: aop-pointcut-this-target
    question: "In Spring AOP, what is the key difference between this(Type) and target(Type)?"
    answers:
      - {id: A, answer: "this(Type) checks the target class, while target(Type) checks the bean name.", explanation: "Incorrect. Bean-name matching is provided by the Spring-specific bean(...) designator."}
      - {id: B, answer: "this(Type) sees the proxy reference, while target(Type) sees the underlying target object.", explanation: "Correct. The distinction is directly observable when proxy and target runtime types differ."}
      - {id: C, answer: "this(Type) uses declared method parameters, while target(Type) uses runtime arguments.", explanation: "Incorrect. That distinction is closer to execution(...) versus args(...), not this versus target."}
      - {id: D, answer: "this(Type) requires AspectJ weaving, while target(Type) is the proxy-based equivalent.", explanation: "Incorrect. Spring AOP supports both designators in proxy-based pointcuts."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Pointcut/Pointcut.md", anchor: "pointcut-mental-model"}
    apiRelated: {controller: "PointcutController", methodSignature: "comparePointcuts()"}

  - id: aop-advice-failure-path
    question: "A matched target method exits by throwing an exception that also matches the @AfterThrowing binding. Which advice should not run on that invocation?"
    answers:
      - {id: A, answer: "@Before, because it runs before the target is invoked.", explanation: "Incorrect. @Before has already run before the target throws."}
      - {id: B, answer: "@AfterThrowing, because it is intended for a matching exceptional exit.", explanation: "Incorrect. Under the stated binding condition, @AfterThrowing is expected to run."}
      - {id: C, answer: "@After, because it has finally-like semantics around the matched invocation.", explanation: "Incorrect. @After still runs when the matched invocation exits exceptionally."}
      - {id: D, answer: "@AfterReturning, because the target did not complete with a normal return.", explanation: "Correct. @AfterReturning is specific to a normal return path."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.Advice/Advice.md", anchor: "advice-failure-demo"}
    apiRelated: {controller: "AdviceLifecycleController", methodSignature: "failure()"}

  - id: aop-around-skip-proceed
    question: "What happens if @Around advice returns its own value without calling proceed()?"
    answers:
      - {id: A, answer: "Spring automatically invokes the target after the advice returns so the chain still completes.", explanation: "Incorrect. The current advice controls whether the chain continues."}
      - {id: B, answer: "Spring rejects the advice because proceed() must be called exactly once.", explanation: "Incorrect. Around advice is allowed to short-circuit and not call proceed()."}
      - {id: C, answer: "The target is skipped and the caller receives the value returned by the advice.", explanation: "Correct. Omitting proceed() short-circuits the remaining invocation chain from that advice."}
      - {id: D, answer: "The target runs, but only @After advice is suppressed for that invocation.", explanation: "Incorrect. If the target is never reached, the consequence is broader than suppressing one advice type."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.Around/Around.md", anchor: "around-skip-demo"}
    apiRelated: {controller: "AroundAdviceController", methodSignature: "skip()"}

  - id: aop-ordering-precedence
    question: "Two different ordered Aspects wrap the same join point. What does higher precedence mean for nested execution?"
    answers:
      - {id: A, answer: "The higher-precedence Aspect runs later on entry and earlier on exit.", explanation: "Incorrect. That describes the opposite nesting relationship."}
      - {id: B, answer: "The higher-precedence Aspect runs earlier on entry and later on exit around the lower-precedence Aspect.", explanation: "Correct. Higher precedence behaves like the outer wrapper around the lower-precedence Aspect."}
      - {id: C, answer: "Precedence only affects @Before advice and has no effect on the return path.", explanation: "Incorrect. Ordering determines nesting across the invocation, including the way out."}
      - {id: D, answer: "Precedence is derived from source declaration order even when the advices are in different Aspects.", explanation: "Incorrect. Across Aspects, Spring ordering mechanisms such as @Order/Ordered are the intended control."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "8.Ordering/Ordering.md", anchor: "ordering-mental-model"}
    apiRelated: {controller: "OrderingController", methodSignature: "observeOrdering()"}

  - id: aop-introduction-proxy-surface
    question: "A target class does not implement UsageTracked, but its Spring AOP proxy does after an Introduction. Which conclusion is correct?"
    answers:
      - {id: A, answer: "The new interface is exposed by the proxy without requiring the target class itself to implement it.", explanation: "Correct. Introduction extends the proxy type surface while the original target class remains unchanged."}
      - {id: B, answer: "Spring rewrites the target class bytecode so UsageTracked appears in the target's declared interfaces.", explanation: "Incorrect. This proxy-based experiment does not modify the target class bytecode."}
      - {id: C, answer: "The interface is available only inside the Aspect and cannot be observed by a caller holding the proxy.", explanation: "Incorrect. The caller can observe and cast the proxy to the introduced interface."}
      - {id: D, answer: "The interface works only if the target already had methods with the same names before proxy creation.", explanation: "Incorrect. The introduced implementation supplies the behavior for the added interface."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.Introduction/Introduction.md", anchor: "introduction-demo"}
    apiRelated: {controller: "IntroductionController", methodSignature: "observeIntroduction()"}

  - id: aop-proxyfactory-jdk-cglib
    question: "With the same target instance and interceptor, what does the ProxyFactory experiment demonstrate about JDK and class-based proxies?"
    answers:
      - {id: A, answer: "Both strategies necessarily expose the same concrete methods and the same runtime type surface.", explanation: "Incorrect. Their type surfaces differ because one is interface-based and the other subclasses the target class."}
      - {id: B, answer: "JDK proxying rewrites the target class, whereas class-based proxying leaves the target implementation untouched.", explanation: "Incorrect. Neither strategy in this experiment rewrites the target class as the semantic mechanism."}
      - {id: C, answer: "Class-based proxying requires the target to implement an interface before any advice can run.", explanation: "Incorrect. Class-based proxying can advise suitable methods without an interface contract."}
      - {id: D, answer: "A JDK proxy exposes configured interfaces; a class-based proxy subclasses the target and exposes eligible concrete methods.", explanation: "Correct. The experiment changes proxy strategy while holding the target behavior and interceptor constant."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.ProxyFactory/ProxyFactory.md", anchor: "jdk-vs-cglib"}
    apiRelated: {controller: "ProgrammaticProxyController", methodSignature: "compareProxyFactoryStrategies()"}

  - id: aop-advisor-static-dynamic-matcher
    question: "When is a dynamic MethodMatcher meaningfully different from a static matcher in Spring AOP?"
    answers:
      - {id: A, answer: "It skips the static method/type phase and decides only from runtime arguments.", explanation: "Incorrect. Dynamic matching still has a static phase before its per-invocation runtime check."}
      - {id: B, answer: "It is evaluated once when the proxy is created and then cached for every argument value.", explanation: "Incorrect. A runtime matcher can evaluate invocation arguments on each call after static eligibility is established."}
      - {id: C, answer: "It can add a per-invocation argument check after the method/type has passed the static matching phase.", explanation: "Correct. That is the key reason isRuntime() exists on MethodMatcher."}
      - {id: D, answer: "It changes the proxy from JDK to CGLIB whenever the arguments differ between calls.", explanation: "Incorrect. Method matching and proxy strategy are separate concerns."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "11.Advisor/Advisor.md", anchor: "static-dynamic-pointcut"}
    apiRelated: {controller: "AdvisorController", methodSignature: "observeAdvisor()"}

  - id: aop-runtime-boundary
    question: "The module uses @AspectJ annotations and runtime evidence shows a Spring AOP proxy around the target. What can you conclude?"
    answers:
      - {id: A, answer: "The @AspectJ annotations identify AspectJ weaving as the runtime mechanism, while the proxy is only an implementation detail.", explanation: "Incorrect. @AspectJ declaration syntax does not establish the runtime mechanism."}
      - {id: B, answer: "The call demonstrably crosses a Spring AOP proxy; weaving status must be verified from build/runtime configuration.", explanation: "Correct. Runtime proxy facts prove the positive Spring AOP boundary, while absence of weaving is a configuration question."}
      - {id: C, answer: "The observed Spring AOP proxy also proves that AspectJ weaving is disabled for the application.", explanation: "Incorrect. The mechanisms are distinct, and the endpoint itself does not establish such a universal exclusion."}
      - {id: D, answer: "The proxy evidence means Spring AOP gets the same constructor and field-access join points as full AspectJ.", explanation: "Incorrect. Proxy-based Spring AOP is centered on method-execution join points for Spring-managed objects."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "15.RuntimeBoundary/RuntimeBoundary.md", anchor: "runtime-boundary-demo"}
    apiRelated: {controller: "RuntimeBoundaryController", methodSignature: "inspectRuntimeBoundary()"}