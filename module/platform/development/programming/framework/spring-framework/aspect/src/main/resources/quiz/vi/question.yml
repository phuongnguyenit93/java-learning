      - {id: D, answer: "JDK proxy expose interface được cấu hình; class-based proxy subclass target và expose concrete method phù hợp.", explanation: "Đúng. Experiment chỉ thay proxy strategy trong khi giữ target behavior và interceptor cố định."}
