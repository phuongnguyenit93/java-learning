      - {id: C, answer: "Chính sách audit lặp trên nhiều service method với method boundary rõ ràng.", explanation: "Đúng. Behavior lặp lại theo chiều cross-cutting và có boundary chính xác là use case AOP mạnh."}
      - {id: D, answer: "Workflow chọn bước nghiệp vụ tiếp theo từ mutable order state.", explanation: "Sai. Giấu quyết định workflow cốt lõi trong Aspect làm business flow khó reasoning hơn."}
