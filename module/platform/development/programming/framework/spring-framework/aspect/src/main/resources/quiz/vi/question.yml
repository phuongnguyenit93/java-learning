      - {id: C, answer: "Spring AOP proxy đang quan sát được cũng chứng minh AspectJ weaving đã bị tắt cho application.", explanation: "Sai. Hai mechanism khác nhau và endpoint không chứng minh một rule loại trừ phổ quát như vậy."}
      - {id: D, answer: "Proxy evidence cho thấy Spring AOP có cùng constructor và field-access join point như full AspectJ.", explanation: "Sai. Proxy-based Spring AOP tập trung vào method-execution join point trên Spring-managed object."}
