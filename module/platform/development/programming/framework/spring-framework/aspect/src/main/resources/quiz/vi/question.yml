  - id: aop-ordering-precedence
    question: "Hai Aspect khác nhau có ordering và cùng wrap một join point. Higher precedence thể hiện thế nào trong nested execution?"
    answers:
      - {id: A, answer: "Aspect có precedence cao chạy muộn hơn lúc vào và sớm hơn lúc ra.", explanation: "Sai. Đây là nesting theo chiều ngược lại."}
      - {id: B, answer: "Aspect có precedence cao chạy sớm hơn lúc vào và muộn hơn lúc ra, bao ngoài Aspect precedence thấp.", explanation: "Đúng. Higher precedence hoạt động như outer wrapper quanh Aspect precedence thấp hơn."}
      - {id: C, answer: "Precedence chỉ ảnh hưởng @Before advice và không ảnh hưởng return path.", explanation: "Sai. Ordering xác định nesting của toàn invocation, bao gồm cả đường đi ra."}
      - {id: D, answer: "Precedence được suy ra từ thứ tự khai báo source dù advice nằm ở hai Aspect khác nhau.", explanation: "Sai. Giữa các Aspect, cơ chế ordering như @Order/Ordered mới là cách điều khiển dự kiến."}
