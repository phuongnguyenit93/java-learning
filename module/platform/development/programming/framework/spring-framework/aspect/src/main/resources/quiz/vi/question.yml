  - id: aop-proxyfactory-jdk-cglib
    question: "Với cùng một target instance và interceptor, experiment ProxyFactory chứng minh gì về JDK proxy và class-based proxy?"
    answers:
      - {id: A, answer: "Hai strategy bắt buộc expose cùng concrete method và cùng runtime type surface.", explanation: "Sai. Type surface khác nhau vì một bên interface-based còn bên kia subclass target class."}
