  - id: aop-advisor-static-dynamic-matcher
    question: "Khi nào dynamic MethodMatcher khác static matcher theo cách có ý nghĩa trong Spring AOP?"
    answers:
      - {id: A, answer: "Nó bỏ qua static method/type phase và chỉ quyết định bằng runtime arguments.", explanation: "Sai. Dynamic matching vẫn có static phase trước per-invocation runtime check."}
      - {id: B, answer: "Nó được evaluate một lần lúc tạo proxy rồi cache cho mọi argument value.", explanation: "Sai. Runtime matcher có thể evaluate invocation arguments ở từng call sau khi static eligibility đã pass."}
      - {id: C, answer: "Nó có thể thêm per-invocation argument check sau khi method/type đã pass static matching phase.", explanation: "Đúng. Đây là lý do cốt lõi MethodMatcher có isRuntime()."}
      - {id: D, answer: "Nó đổi proxy từ JDK sang CGLIB mỗi khi argument giữa các call khác nhau.", explanation: "Sai. Method matching và proxy strategy là hai concern khác nhau."}
    correctAnswerId: C
