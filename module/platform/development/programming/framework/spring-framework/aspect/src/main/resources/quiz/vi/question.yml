  - id: aop-self-invocation-boundary
    question: "Caller gọi outer() qua Spring AOP proxy, sau đó outer() gọi this.inner() trên cùng target. Điều gì nên xảy ra?"
    answers:
      - {id: A, answer: "Advice có thể chạy cho outer(), còn lời gọi trực tiếp this.inner() không đi qua proxy lần nữa.", explanation: "Đúng. Self-invocation tiếp tục trên target object nên bypass lần proxy interception thứ hai."}
      - {id: B, answer: "Cả hai call đều được intercept vì pointcut matching được evaluate cho mọi matching method trên target class.", explanation: "Sai. Việc method nằm trên cùng class không tự tạo thêm proxy boundary cho this.inner()."}
      - {id: C, answer: "Outer call tới target mà không có advice, còn inner call được intercept khi Spring thấy matching method.", explanation: "Sai. External call ban đầu vẫn có thể được intercept khi nó đi vào qua proxy."}
      - {id: D, answer: "Outer call được advise, rồi Spring tự route this.inner() trở lại current proxy để intercept lần hai.", explanation: "Sai. Yếu tố quyết định là invocation có đi qua proxy hay không, không phải call depth."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "13.SelfInvocation/SelfInvocation.md", anchor: "self-invocation-demo"}
    apiRelated: {controller: "SelfInvocationController", methodSignature: "compareSelfInvocation()"}

  - id: aop-pointcut-this-target
    question: "Trong Spring AOP, khác biệt cốt lõi giữa this(Type) và target(Type) là gì?"
    answers:
      - {id: A, answer: "this(Type) kiểm tra target class, còn target(Type) kiểm tra bean name.", explanation: "Sai. Bean-name matching thuộc Spring-specific designator bean(...)."}
      - {id: B, answer: "this(Type) nhìn proxy reference, còn target(Type) nhìn target object phía sau proxy.", explanation: "Đúng. Khác biệt này quan sát được trực tiếp khi runtime type của proxy và target khác nhau."}
      - {id: C, answer: "this(Type) dùng declared method parameter, còn target(Type) dùng runtime argument.", explanation: "Sai. Khác biệt đó gần với execution(...) so với args(...), không phải this so với target."}
      - {id: D, answer: "this(Type) cần AspectJ weaving, còn target(Type) là phiên bản dành cho proxy-based AOP.", explanation: "Sai. Spring AOP hỗ trợ cả hai designator trong proxy-based pointcut."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Pointcut/Pointcut.md", anchor: "pointcut-mental-model"}
    apiRelated: {controller: "PointcutController", methodSignature: "comparePointcuts()"}

  - id: aop-advice-failure-path
    question: "Một target method đã match pointcut và thoát ra bằng exception cũng match kiểu/binding của @AfterThrowing. Advice nào không nên chạy trên invocation đó?"
    answers:
      - {id: A, answer: "@Before, vì nó chạy trước khi target được invoke.", explanation: "Sai. @Before đã chạy trước khi target ném exception."}
      - {id: B, answer: "@AfterThrowing, vì advice này dành cho exceptional exit phù hợp.", explanation: "Sai. Với điều kiện binding đã nêu, @AfterThrowing được kỳ vọng chạy."}
      - {id: C, answer: "@After, vì nó có semantics kiểu finally quanh matched invocation.", explanation: "Sai. @After vẫn chạy khi invocation kết thúc bằng exception."}
      - {id: D, answer: "@AfterReturning, vì target không hoàn thành bằng normal return.", explanation: "Đúng. @AfterReturning chỉ dành cho normal return path."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.Advice/Advice.md", anchor: "advice-failure-demo"}
    apiRelated: {controller: "AdviceLifecycleController", methodSignature: "failure()"}

  - id: aop-around-skip-proceed
    question: "Điều gì xảy ra nếu @Around advice tự return một value mà không gọi proceed()?"
    answers:
      - {id: A, answer: "Spring tự gọi target sau khi advice return để chain vẫn hoàn tất.", explanation: "Sai. Around advice hiện tại quyết định chain có tiếp tục hay không."}
      - {id: B, answer: "Spring từ chối advice vì proceed() bắt buộc phải được gọi đúng một lần.", explanation: "Sai. Around advice được phép short-circuit và không gọi proceed()."}
      - {id: C, answer: "Target bị bỏ qua và caller nhận value do advice trả về.", explanation: "Đúng. Không gọi proceed() sẽ short-circuit phần invocation chain còn lại từ advice đó."}
      - {id: D, answer: "Target vẫn chạy nhưng chỉ @After advice bị bỏ qua trên invocation đó.", explanation: "Sai. Khi target không được gọi, hệ quả rộng hơn việc bỏ qua một advice type."}
    correctAnswerId: C
