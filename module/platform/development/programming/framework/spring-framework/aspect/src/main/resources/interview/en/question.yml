  - question: >-
      What does an AOP Introduction change, where does the new capability live, and what production concerns arise if the introduced behavior keeps mutable state?
    answer: >-
      An Introduction lets the AOP proxy expose an additional interface even though the original target class does not implement it. The capability therefore belongs to the proxy surface and its introduced implementation; the target class bytecode is not rewritten by this proxy-based mechanism. If the introduced implementation has mutable state, its lifecycle and sharing semantics matter just like any other stateful component. A singleton proxy can be used concurrently, so per-invocation assumptions are unsafe unless the state is designed for concurrency or the experiment explicitly serializes a bounded scenario. Because the extra interface is not visible on the target class itself, the capability should also be documented so callers are not surprised by a hidden runtime type contract.
    aiGenerated: true
    reviewed: false
    readmeRelated:
