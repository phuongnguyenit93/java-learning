      methodSignature: "comparePointcuts()"

  - question: >-
      Compare @Before, @AfterReturning, @AfterThrowing, @After, and @Around. Why is choosing the weakest sufficient advice often a better design than defaulting to @Around?
    answer: >-
      @Before observes or checks before the target runs. @AfterReturning is tied to a normal return, @AfterThrowing to a matching exceptional exit, and @After has finally-like semantics for the matched invocation. @Around is more powerful because it owns proceed(): it can continue, skip, repeat, alter arguments, transform the result, or change exception behavior. That power also makes control flow less obvious. If the requirement is only to observe a successful return or record an exception, a more specific advice type communicates intent better and reduces the chance of accidentally changing invocation semantics. Use @Around when the concern genuinely needs control over the invocation chain.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "6.Advice/Advice.md"
      anchor: "advice-semantics"
