  - question: >-
      How do ProxyFactory, PointcutAdvisor, Pointcut, and MethodInterceptor fit together underneath annotation-style Spring AOP, and what does the static-versus-dynamic MethodMatcher distinction add to that model?
    answer: >-
      ProxyFactory makes the low-level structure explicit: a target is wrapped by a proxy and pointcut-based Advisors such as PointcutAdvisor contribute advice/interceptors when their Pointcuts match. Generic Advisor is the broader contract and is not always modeled as Pointcut + Advice. A Pointcut combines class filtering with method matching, while MethodInterceptor supplies around-style invocation behavior through MethodInvocation.proceed(). A static MethodMatcher can decide from method and target-class metadata; a dynamic matcher first passes static eligibility and then performs an additional per-invocation argument check when isRuntime() is true. This model explains how higher-level @AspectJ-style declarations ultimately become runtime advisor/interceptor chains without making the annotation syntax itself the execution mechanism.
    aiGenerated: true
    reviewed: false
    readmeRelated:
