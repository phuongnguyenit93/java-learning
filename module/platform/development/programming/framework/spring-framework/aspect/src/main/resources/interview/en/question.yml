  - question: >-
      How do you distinguish @AspectJ declaration syntax, proxy-based Spring AOP runtime behavior, and full AspectJ weaving when debugging an application?
    answer: >-
      @Aspect, @Pointcut, @Before, and @Around describe an @AspectJ-style declaration model; they do not by themselves prove how the behavior is executed. Positive runtime evidence for Spring AOP includes a Spring-managed target reference that is an AOP proxy, a distinct proxy-versus-target type when applicable, and an advisor/interceptor chain around method execution. Full AspectJ weaving is a different runtime/build mechanism with a broader join point model. The absence or presence of weaving must therefore be established from build and runtime configuration, not inferred merely from annotations or from seeing a Spring proxy. Spring Boot can additionally auto-configure AOP and proxy strategy, but those Boot properties are not the semantic defaults of Spring Framework AOP itself.
    aiGenerated: true
    reviewed: false
