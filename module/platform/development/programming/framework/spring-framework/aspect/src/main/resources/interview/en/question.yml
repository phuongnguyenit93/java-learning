  - question: >-
      When should a concern remain explicit in service or domain code instead of being moved into an Aspect?
    answer: >-
      Keep behavior explicit when it is a core business decision, drives workflow state, is specific to one use case, or would force readers to reconstruct essential control flow from hidden advice. AOP is strongest for genuinely cross-cutting policies with a stable and explainable boundary, such as auditing, tracing, timing, or other infrastructure-oriented interception. Even then, the pointcut should be narrow, side effects should be predictable, exception behavior should remain intentional, and mutable Aspect state should be avoided or designed carefully. The goal is not to minimize service code at all costs; it is to remove repeated cross-cutting mechanics without obscuring the business model.
    aiGenerated: true
    reviewed: false
    readmeRelated:
