  - question: >-
      How would you choose among execution(...), args(...), this(...), and target(...) when designing a Spring AOP pointcut, and why should production pointcuts usually be narrow?
    answer: >-
      execution(...) primarily constrains the declared method execution signature, while args(...) can constrain or bind runtime argument types. this(...) tests the proxy reference and target(...) tests the underlying target object. In a proxy-based runtime those two can differ, which is why the module exposes their actual runtime classes. Production pointcuts should narrow the search to the intended architectural boundary, for example by combining package/type, method, annotation, or bean constraints. Overly broad expressions make advice application harder to predict, increase accidental matches, and make refactoring riskier.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Pointcut/Pointcut.md"
