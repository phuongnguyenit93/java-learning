questions:
  - question: >-
      Explain why self-invocation can bypass Spring AOP advice even when the inner method matches the pointcut, and describe the remediation you would prefer in application design.
    answer: >-
      Spring AOP interception happens when a caller crosses the proxy boundary. An external call can therefore be intercepted before reaching the target, but a target method that invokes this.inner() stays on the same target object and does not re-enter the proxy. The inner method can match the pointcut perfectly and still receive no second interception. The clearest remediation is usually to move the advised boundary to another Spring bean so the call crosses a proxy again. Self-injection or AopContext.currentProxy() can work in specific cases but couple business code more tightly to AOP infrastructure and should normally be treated as escape hatches.
    aiGenerated: true
    reviewed: false
