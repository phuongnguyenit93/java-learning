  - question: >-
      Two different Aspects apply to the same method. Explain how precedence affects the nested call order and what design problems appear when a system depends on many subtle ordering rules.
    answer: >-
      Across different ordered Aspects, the Aspect with higher precedence enters first and exits last, behaving like an outer wrapper around lower-precedence Aspects. In Spring that precedence is normally expressed with Ordered or @Order rather than guessed from source declaration order. A few explicit ordering relationships can be reasonable, but a design that depends on a long chain of hidden relative orders becomes fragile: adding another Aspect or changing a pointcut can alter behavior that is difficult to see from the service code. Prefer independent cross-cutting concerns where possible and document the small number of ordering constraints that are truly required.
    aiGenerated: true
    reviewed: false
    readmeRelated:
