references:
  - title: "Spring Framework — Transaction Management"
    url: "https://docs.spring.io/spring-framework/reference/data-access/transaction.html"
    description: "Tổng quan mô hình transaction của Spring cho JDBC, JPA, Hibernate và JTA, gồm declarative, programmatic và tích hợp data access."
  - title: "Spring Framework 6.2 — Transaction Abstraction"
    url: "https://docs.spring.io/spring-framework/reference/6.2/data-access/transaction/strategies.html"
    description: "Vai trò PlatformTransactionManager, ReactiveTransactionManager, TransactionDefinition và TransactionStatus trong quản lý transaction."
  - title: "Spring Framework — Declarative Transaction Internals"
    url: "https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-decl-explained.html"
    description: "Cách AOP proxy, TransactionInterceptor và transaction manager phối hợp; giới hạn thread-bound, reactive context và proxy."
  - title: "Spring Framework — Using @Transactional"
    url: "https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/annotations.html"
    description: "Sử dụng @Transactional, propagation, isolation, timeout, readOnly, rollbackFor, transactionManager và mặc định."
  - title: "Spring Framework — Transaction Propagation"
    url: "https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/tx-propagation.html"
    description: "Phân biệt REQUIRED, REQUIRES_NEW và NESTED; logical/physical transaction, savepoint và UnexpectedRollbackException."
  - title: "Spring Framework — Rolling Back a Declarative Transaction"
    url: "https://docs.spring.io/spring-framework/reference/data-access/transaction/declarative/rolling-back.html"
    description: "Rollback rule với checked/unchecked exception, cách đánh dấu rollback và quy tắc tùy chỉnh khi kết thúc giao dịch."
  - title: "Spring Framework — Programmatic Transaction Management"
    url: "https://docs.spring.io/spring-framework/reference/data-access/transaction/programmatic.html"
    description: "Sử dụng TransactionTemplate, PlatformTransactionManager, TransactionDefinition và TransactionStatus để điều phối giao dịch bằng mã Java."
  - title: "Spring Framework — TestContext Transaction Management"
    url: "https://docs.spring.io/spring-framework/reference/testing/testcontext-framework/tx.html"
    description: "Kiểm thử tích hợp với @Transactional, TestTransaction, @Rollback và giới hạn transaction khi kiểm thử đa luồng."
