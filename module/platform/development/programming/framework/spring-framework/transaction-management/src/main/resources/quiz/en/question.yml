# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: transaction-service-boundary
    question: "An order use case must update an order row and reserve inventory atomically. Where is the clearest default place for the transaction boundary?"
    answers:
      - {id: A, answer: "Around each repository method separately, so every database call commits as soon as possible.", explanation: "Incorrect. Separate repository transactions can expose a partially completed business outcome when later work fails."}
      - {id: B, answer: "Around the service/application operation that owns the business invariant and coordinates both repository calls.", explanation: "Correct. The transaction should normally follow the business unit of work that must succeed or fail as one outcome."}
      - {id: C, answer: "Around the controller method because HTTP request scope and transaction scope are the same concept.", explanation: "Incorrect. A web request and a business unit of work are different boundaries; the transaction should be placed from the invariant, not from transport lifetime."}
      - {id: D, answer: "Around the entire application process so every later operation can reuse the same transaction.", explanation: "Incorrect. Overly broad transactions retain resources and locks and do not match a bounded unit of work."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "1.Purpose/Purpose.md", anchor: "transaction-service-boundary"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: transaction-manager-selection
    question: "An application has both an imperative JDBC transaction manager and a reactive transaction manager. What should determine which manager a transactional method uses?"
    answers:
      - {id: A, answer: "Use the default manager for every method; once any Spring transaction is active, all transactional resources will participate automatically.", explanation: "Incorrect. An active transaction from one manager does not automatically enlist resources owned by another manager or execution model."}
      - {id: B, answer: "Choose only from the Java return type; resource ownership is irrelevant as long as the method returns Mono, Flux, or a regular value.", explanation: "Incorrect. The method contract matters, but the selected manager must also own the resource and support the required transaction model."}
      - {id: C, answer: "The manager whose resource ownership and execution model match the method, selected by default configuration or an explicit qualifier when needed.", explanation: "Correct. Choosing the manager is semantic because it decides which resources and transaction model are actually coordinated."}
      - {id: D, answer: "Prefer the imperative manager whenever a database is involved, even when the work is a reactive pipeline backed by a reactive resource.", explanation: "Incorrect. Imperative versus reactive execution is part of the manager/resource contract and cannot be ignored just because both ultimately touch a database."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "2.Abstraction/Abstraction.md", anchor: "transaction-manager-selection"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: transaction-bound-resource-reuse
    question: "A service transaction performs two Spring-aware JDBC operations against the same DataSource. Why can both operations participate in the same local transaction without repository code manually passing a Connection?"
    answers:
      - {id: A, answer: "Spring-aware data access can look up the resource bound to that DataSource in the current transaction context and reuse it for participating work.", explanation: "Correct. Resource binding lets participating data-access operations reuse the transaction-associated resource instead of inventing independent transaction state."}
      - {id: B, answer: "Each repository opens an independent connection, and Spring reconciles those separate commits after both repository methods return successfully.", explanation: "Incorrect. Separate independently committed connections are not merged into one local transaction after the fact."}
      - {id: C, answer: "The HTTP request owns one JDBC connection automatically, and every repository invoked during that request inherits the same connection.", explanation: "Incorrect. HTTP request scope is not the transaction resource-binding model; participation comes from Spring transaction-aware infrastructure."}
      - {id: D, answer: "`@Transactional` changes the JDBC driver so any connections opened independently on the same thread are treated as one transaction.", explanation: "Incorrect. Spring coordinates transaction-aware resource lookup/binding; it does not rewrite JDBC driver semantics for arbitrary independent connections."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "3.ResourceSynchronization/ResourceSynchronization.md", anchor: "transaction-bound-resources"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: transaction-proxy-self-invocation
    question: "A public `@Transactional` method writes to the database and throws `RuntimeException`. Another method in the same bean calls it through `this`. In default proxy mode, what is the key risk?"
    answers:
      - {id: A, answer: "The inner call may bypass the transaction proxy, so the annotated method may execute without the transaction advice that would normally wrap the external call.", explanation: "Correct. Self-invocation stays on the target object and can bypass proxy interception in the default proxy model."}
      - {id: B, answer: "Because the inner method is public and annotated, Spring intercepts it even when the call never leaves the target object.", explanation: "Incorrect. Public visibility and metadata do not make a same-object call cross the proxy."}
      - {id: C, answer: "The inner method automatically joins a transaction even when the outer caller is non-transactional, because both methods belong to the same Spring bean.", explanation: "Incorrect. Same-bean membership does not create transaction participation when the annotated inner call is not intercepted."}
      - {id: D, answer: "Spring replaces the `this` reference with the proxy during bean creation, so self-invocation has the same semantics as an external bean call.", explanation: "Incorrect. The target's `this` reference is still the target object; ordinary self-invocation bypasses the surrounding proxy."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Declarative/Declarative.md", anchor: "transaction-proxy-boundary"}
    apiRelated: {controller: "TransactionExperimentController", methodSignature: "proxyBoundary()"}

  - id: transaction-default-rollback
    question: "Two otherwise identical `@Transactional` methods write one row. One throws `IllegalStateException`; the other throws an ordinary checked exception. No explicit rollback rule is configured. What is Spring Framework 6.1's default outcome?"
    answers:
      - {id: A, answer: "Both transactions roll back because every Exception subclass requests rollback by default.", explanation: "Incorrect. Checked exceptions do not request rollback by default under the standard declarative rule."}
      - {id: B, answer: "Both transactions commit because rollback requires an explicit `rollbackFor` rule in every case.", explanation: "Incorrect. RuntimeException and Error request rollback by default."}
      - {id: C, answer: "The checked exception rolls back, while the RuntimeException commits because unchecked failures are considered recoverable.", explanation: "Incorrect. This reverses Spring's default rollback behavior."}
      - {id: D, answer: "The RuntimeException transaction rolls back, while the checked-exception transaction commits unless another rollback rule matches.", explanation: "Correct. This is the default checked-versus-unchecked rollback distinction."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.Rollback/Rollback.md", anchor: "transaction-rollback-defaults"}
    apiRelated: {controller: "TransactionExperimentController", methodSignature: "rollbackDefaults()"}

  - id: transaction-required-rollback-only
    question: "An inner `REQUIRED` method throws a RuntimeException after joining an outer `REQUIRED` transaction. The outer method catches that exception and returns normally. What can happen at outer completion?"
    answers:
      - {id: A, answer: "The catch block automatically clears rollback-only state, so the shared transaction commits normally.", explanation: "Incorrect. Catching the application exception does not restore commitability after the inner interceptor marked the shared transaction rollback-only."}
      - {id: B, answer: "Spring can roll back the shared physical transaction and throw `UnexpectedRollbackException` when the outer scope attempts to commit.", explanation: "Correct. This prevents the caller from being told that a doomed shared transaction committed successfully."}
      - {id: C, answer: "Only the inner JDBC statements roll back while the outer statements always commit, because REQUIRED creates a savepoint automatically.", explanation: "Incorrect. REQUIRED normally shares the same physical transaction and is not NESTED savepoint semantics."}
      - {id: D, answer: "The outer method must fail at compile time because catching an exception from a transactional method is forbidden.", explanation: "Incorrect. The Java catch is valid; the important issue is the transaction's rollback-only state at completion."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.Propagation/Propagation.md", anchor: "transaction-propagation-rollback-only"}
    apiRelated: {controller: "TransactionExperimentController", methodSignature: "requiredRollbackOnly()"}

  - id: transaction-requires-new-vs-nested
    question: "Which statement best distinguishes `REQUIRES_NEW` from classic JDBC-backed `NESTED` propagation?"
    answers:
      - {id: A, answer: "Both modes keep one physical transaction; REQUIRES_NEW uses a savepoint while NESTED suspends and resumes the outer scope.", explanation: "Incorrect. This swaps the core models: savepoint semantics belong to classic NESTED behavior, while REQUIRES_NEW creates an independent transaction."}
      - {id: B, answer: "REQUIRES_NEW creates a separate physical transaction; NESTED normally uses a savepoint in one physical transaction when supported.", explanation: "Correct. This is the essential distinction between an independent transaction and savepoint-based partial rollback."}
      - {id: C, answer: "Both modes create a second physical transaction, but NESTED copies the outer transaction's isolation and timeout values.", explanation: "Incorrect. Classic NESTED semantics use savepoints in the existing physical transaction rather than another physical transaction."}
      - {id: D, answer: "Both modes use savepoints, but REQUIRES_NEW releases the savepoint at commit while NESTED keeps it until outer completion.", explanation: "Incorrect. REQUIRES_NEW is not a savepoint-based propagation mode."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "", anchor: ""}
    apiRelated: {controller: "", methodSignature: ""}

  - id: transaction-policy-existing-scope
    question: "An inner `REQUIRED` method declares a different isolation level while joining an already active outer transaction. Which mental model is safest?"
    answers:
      - {id: A, answer: "The inner declaration replaces the isolation of the existing physical transaction for the remainder of the outer scope.", explanation: "Incorrect. A participating logical scope cannot simply redefine the physical transaction it joined."}
      - {id: B, answer: "The existing physical transaction keeps its characteristics; supporting managers can reject incompatible declarations with strict validation.", explanation: "Correct. Joining an existing transaction does not create a second set of physical characteristics."}
      - {id: C, answer: "Spring automatically changes the inner propagation to REQUIRES_NEW whenever the requested isolation is different.", explanation: "Incorrect. Spring does not silently change propagation to manufacture a new physical transaction."}
      - {id: D, answer: "The inner isolation takes effect only for its SQL statements, then Spring restores the outer isolation before returning.", explanation: "Incorrect. A participating scope does not temporarily rewrite isolation around only its own statements."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "5.TransactionPolicy/TransactionPolicy.md", anchor: "transaction-isolation"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: transaction-reactive-context-cancel
    question: "Which statement correctly describes Spring reactive transaction participation and cancellation?"
    answers:
      - {id: A, answer: "Participation is carried only by ThreadLocal, so changing threads always loses the transaction and cancellation has no transaction meaning.", explanation: "Incorrect. Reactive transaction state is associated with Reactor/subscriber context rather than the imperative ThreadLocal model."}
      - {id: B, answer: "A reactive transaction exists as soon as a Mono or Flux object is constructed, even if nobody subscribes to it.", explanation: "Incorrect. Reactive transaction work occurs in subscription-time execution, not merely when the publisher object is created."}
      - {id: C, answer: "Work participates when it executes inside the transactional Reactor context, and cancellation of a transactional publisher can cause rollback rather than a successful commit.", explanation: "Correct. Pipeline membership and terminal signals matter to reactive transaction outcome."}
      - {id: D, answer: "Calling `subscribe()` manually inside a transactional method guarantees the new subscription inherits the same transaction context as the returned chain.", explanation: "Incorrect. Manual subscription creates separate execution and should not be assumed to share the transaction represented by the returned pipeline."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "9.Reactive/Reactive.md", anchor: "transaction-reactive-error-cancel"}
    apiRelated: {controller: "", methodSignature: ""}

  - id: transaction-event-phases
    question: "A transaction publishes an event and then rolls back. With listeners bound to `BEFORE_COMMIT`, `AFTER_COMMIT`, `AFTER_ROLLBACK`, and `AFTER_COMPLETION`, which phase pair should represent the completed rollback outcome?"
    answers:
      - {id: A, answer: "AFTER_COMMIT and AFTER_COMPLETION, because the event was published before the failure occurred.", explanation: "Incorrect. AFTER_COMMIT is tied to successful commit, not merely to event publication."}
      - {id: B, answer: "BEFORE_COMMIT and AFTER_COMMIT, because every published event executes all commit-related listeners.", explanation: "Incorrect. A rollback does not produce AFTER_COMMIT, and BEFORE_COMMIT is associated with commit processing rather than the completed rollback outcome."}
      - {id: C, answer: "AFTER_ROLLBACK and AFTER_COMPLETION, because the transaction completed by rollback rather than by commit.", explanation: "Correct. AFTER_COMPLETION observes either final outcome, while AFTER_ROLLBACK is specific to rollback."}
      - {id: D, answer: "No listener can run because TransactionalEventListener ignores all events that originate inside a transaction.", explanation: "Incorrect. Its purpose is to bind listener execution to transaction phases."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.EventsLifecycle/EventsLifecycle.md", anchor: "transaction-event-listener"}
    apiRelated: {controller: "TransactionExperimentController", methodSignature: "eventPhases()"}

  - id: transaction-local-remote-boundary
    question: "A service method updates a local database, calls a remote HTTP service, and publishes a message. Which statement best describes what `@Transactional` guarantees?"
    answers:
      - {id: A, answer: "The interceptor propagates the local database transaction through HTTP and broker headers, so all three effects share one commit decision.", explanation: "Incorrect. Ordinary HTTP/RPC propagation does not extend a local resource transaction into the remote process or unrelated broker."}
      - {id: B, answer: "Because the three calls occur inside one service method, Spring treats them as one physical transaction even when they use unrelated resource managers.", explanation: "Incorrect. Java call scope is not the same thing as a coordinated multi-resource transaction."}
      - {id: C, answer: "Only resources the selected transaction manager can actually coordinate participate; remote calls and unrelated messaging effects need their own reliability or coordination strategy.", explanation: "Correct. @Transactional defines a Spring transaction boundary, not automatic distributed atomicity across arbitrary systems."}
      - {id: D, answer: "If the local database rolls back, Spring automatically compensates a completed remote call and retracts a message already accepted by an unrelated broker.", explanation: "Incorrect. Compensation or durable messaging behavior must be designed explicitly; it is not implied by a local transaction."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "", anchor: ""}
    apiRelated: {controller: "", methodSignature: ""}
