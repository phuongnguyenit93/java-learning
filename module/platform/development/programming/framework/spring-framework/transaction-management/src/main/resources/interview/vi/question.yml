  - question: >-
      Một ứng dụng có nhiều transaction manager. Nên chọn manager sở hữu một boundary như thế nào, và điều gì có thể sai nếu chọn nhầm?
    answer: >-
      Hãy chọn manager dựa trên resource ownership thực tế, execution model imperative hay reactive và các capability mà backend phải cung cấp. Khi mặc định bị mơ hồ, hãy qualify boundary tường minh, ví dụ qua @Transactional(transactionManager = "..."). Một transaction đang active ở manager sai không tự động enlist DataSource, reactive resource hay remote system không thuộc manager đó. Abstraction TransactionManager cho Spring một vocabulary policy thống nhất, nhưng không tự tạo capability mà manager và resource đã chọn không hỗ trợ.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Abstraction/Abstraction.md"
      anchor: "transaction-manager-selection"
