questions:
  - question: >-
      Hãy giải thích cách business invariant quyết định ranh giới transaction trong Spring. Điều gì xảy ra khi ranh giới quá nhỏ hoặc quá lớn?
    answer: >-
      Hãy bắt đầu từ unit of work nhỏ nhất mà các thay đổi trạng thái bắt buộc phải cùng thành công hoặc cùng thất bại. Tầng application/service thường sở hữu invariant này vì nó điều phối nhiều thao tác data-access. Ranh giới quá nhỏ có thể commit trạng thái dở dang trước khi bước sau thất bại. Ranh giới quá lớn có thể giữ connection, lock, snapshot và trạng thái transaction manager trong lúc chạy công việc chậm hoặc không liên quan. Spring điều phối khả năng của các resource thực sự tham gia; nó không làm mọi công việc trong cùng Java method trở thành nguyên tử nếu resource đó nằm ngoài transaction.
    aiGenerated: true
    reviewed: false
    readmeRelated:
