  requiresNew():
    summary: Observe an independent REQUIRES_NEW commit
    description: The outer transaction writes, invokes an inner REQUIRES_NEW method
      that commits, then fails. The final table contains only the inner marker, proving
      the inner physical transaction completed independently of the outer rollback.
    enableVideoYoutube: false
    videoYoutubeId: ID of youtube video add to API description
