  rollbackDefaults():
    summary: Observe default rollback for checked and unchecked exceptions
    description: Run two otherwise identical transactional JDBC writes. One throws
      RuntimeException and rolls back; the other throws a checked exception and commits
      under Spring's default rollback rules. Final rows are the observable evidence.
