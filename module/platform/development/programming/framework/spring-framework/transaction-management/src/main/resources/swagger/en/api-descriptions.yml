  requiredRollbackOnly():
    summary: Observe rollback-only participation and UnexpectedRollbackException
    description: An outer REQUIRED transaction catches an inner REQUIRED failure and
      returns normally. The shared physical transaction is already rollback-only,
      so the outer completion throws UnexpectedRollbackException and none of the writes
      commit.
