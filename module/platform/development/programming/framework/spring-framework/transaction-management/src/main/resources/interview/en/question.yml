questions:
  - question: >-
      Explain how a business invariant should determine a Spring transaction boundary. What goes wrong when the boundary is too small or too large?
    answer: >-
      Start from the smallest business unit whose required state changes must succeed or fail together. The application/service layer often owns that invariant because it coordinates several data-access operations. A boundary that is too small can commit partial state before a later operation fails. A boundary that is too large can hold connections, locks, snapshots, and transaction-manager state while unrelated or slow work runs. Spring coordinates the capabilities of the resources that actually participate; it does not make work outside those resources atomic merely because it happens inside the same Java method.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Purpose/Purpose.md"
      anchor: "transaction-unit-of-work"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      An application has multiple transaction managers. How should you choose which manager owns a boundary, and what can fail if the wrong one is selected?
    answer: >-
      Choose the manager from the actual resource ownership, the imperative or reactive execution model, and the capabilities the backend must provide. When the default is ambiguous, qualify the boundary explicitly, for example through @Transactional(transactionManager = "..."). An active transaction from the wrong manager does not automatically enlist an unrelated DataSource, reactive resource, or remote system. The common TransactionManager abstraction gives Spring a uniform policy vocabulary, but it does not manufacture capabilities that the selected manager and resources do not support.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.Abstraction/Abstraction.md"
      anchor: "transaction-manager-selection"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Why can an @Transactional method behave non-transactionally when called from another method on the same bean in proxy mode, and how would you redesign or diagnose it?
    answer: >-
      @Transactional is metadata; in the default proxy mode, transaction advice runs when the invocation crosses the Spring proxy. A call through this stays on the target object and can bypass TransactionInterceptor, so the inner method does not receive an independent transactional boundary. Prefer moving the boundary to a separate Spring bean or otherwise structuring the call so it crosses the proxy. AspectJ is a different interception mode, not an automatic fallback. Diagnose the problem by verifying whether a transaction is active at the invocation and by observing the real resource outcome, such as whether a failing database write commits or rolls back.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "4.Declarative/Declarative.md"
      anchor: "transaction-proxy-boundary"
    apiRelated:
      controller: "TransactionExperimentController"
      methodSignature: "proxyBoundary()"

  - question: >-
      An outer REQUIRED method catches an exception from an inner REQUIRED method, returns normally, then receives UnexpectedRollbackException. Explain the complete state transition.
    answer: >-
      The outer and inner methods are separate logical scopes that participate in one physical transaction. When the RuntimeException escapes the inner transactional boundary, the inner interceptor can mark that shared transaction rollback-only. Catching the application exception in the outer method does not clear that marker, so Java execution can continue while the transaction is already doomed. At outer completion the caller appears to request commit, but Spring rolls the physical transaction back and throws UnexpectedRollbackException so success is not reported falsely. If the inner failure must not doom the outer work, reconsider the unit-of-work boundary or deliberately choose a separate transaction or savepoint-based model where appropriate.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.Propagation/Propagation.md"
      anchor: "transaction-propagation-rollback-only"
    apiRelated:
      controller: "TransactionExperimentController"
      methodSignature: "requiredRollbackOnly()"

  - question: >-
      When is REQUIRES_NEW the right semantic choice, and why can it become dangerous under concurrency even when its transaction behavior is correct?
    answer: >-
      REQUIRES_NEW is appropriate when the inner work truly needs an independent commit or rollback decision. When an outer transaction exists and the selected transaction manager supports the required suspension, Spring suspends the outer context/resources, starts a new physical transaction, completes it, and then resumes the outer context. With JDBC-style local transactions, the outer scope may continue holding one connection while the inner transaction needs another. Under concurrency that extra demand can exhaust the connection pool or contribute to threads waiting on resources. Use REQUIRES_NEW for intentionally independent work, size resources for the pattern, and do not treat it as a generic way to escape rollback semantics.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "7.Propagation/Propagation.md"
      anchor: "transaction-propagation-requires-new"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      When would you choose TransactionTemplate or TransactionalOperator instead of @Transactional, and why is direct PlatformTransactionManager control usually a lower-level choice?
    answer: >-
      Prefer @Transactional when the transaction boundary is a stable service-level contract because the policy stays separate from business code. Programmatic control is useful when the scope depends on runtime branching, only a small portion of a larger method should be transactional, or the code must react directly to transaction status. TransactionTemplate packages the imperative begin/commit/rollback workflow around a callback, while TransactionalOperator provides the corresponding composition model for reactive publishers. Direct PlatformTransactionManager control gives the most explicit lifecycle control but also makes application code responsible for correct completion, exception handling, rollback decisions, and nested participation, so it is usually reserved for cases where the template/operator abstraction is not sufficient. None of these APIs creates transaction capabilities that the selected manager and resource do not already support.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "8.Programmatic/Programmatic.md"
      anchor: "transaction-declarative-vs-programmatic"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      Why do reactive Spring transactions use Reactor Context instead of ThreadLocal, and why does a thread switch by itself not end transaction participation?
    answer: >-
      A reactive pipeline can move between threads while still representing one logical subscriber flow, so thread identity is not a reliable carrier for transaction state. Reactive transaction management binds transaction state and resources to Reactor subscriber context instead. Operators continue to participate while execution remains inside the composed publisher chain carrying that context. Escaping the chain, creating an unrelated manual subscription, or pairing a reactive manager with a non-reactive method contract breaks that model. The important question is pipeline/context membership, not whether every signal runs on the same thread.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "9.Reactive/Reactive.md"
      anchor: "transaction-reactive-context-model"
    apiRelated:
      controller: ""
      methodSignature: ""

  - question: >-
      What guarantee does an AFTER_COMMIT @TransactionalEventListener provide, and what guarantee does it not provide for an external side effect?
    answer: >-
      AFTER_COMMIT coordinates listener timing with a successful commit of the publishing transaction, so the listener is not the normal path for a transaction that rolled back. That timing guarantee does not make an HTTP call, message publication, email, or other external side effect atomically part of the database transaction. A process crash after the database commit but before the external action can still lose the side effect unless it has its own durable coordination strategy. Use transaction-bound events for lifecycle timing, and add retry, durable messaging, outbox-style persistence, or another reliability mechanism when the external effect must survive failures.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "10.EventsLifecycle/EventsLifecycle.md"
      anchor: "transaction-event-listener"
    apiRelated:
      controller: "TransactionExperimentController"
      methodSignature: "eventPhases()"

  - question: >-
      A use case updates a local database, calls a remote service, and publishes a message. Explain where the local Spring transaction guarantee stops and how you would reason about a production design.
    answer: >-
      A local Spring transaction coordinates only the resources that its selected transaction manager can actually own or enlist. An HTTP or RPC call does not inherit the caller's local database transaction, and a database update plus message publication are separate side effects unless a real coordinator and participating resources support a shared transaction. Choose reliability patterns from the failure model: idempotency and retry, compensation or saga, an outbox or durable messaging handoff, or XA/JTA only when the required resources genuinely support it and the coordination cost is justified. Keep the local transaction as short as possible and avoid holding database resources across slow remote work unless the invariant truly requires it.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: ""
      anchor: ""
    apiRelated:
      controller: ""
      methodSignature: ""
