  requiredRollbackOnly():
    summary: Quan sát rollback-only và UnexpectedRollbackException với REQUIRED
    description: Outer REQUIRED transaction bắt lỗi từ inner REQUIRED rồi return bình
      thường. Physical transaction dùng chung đã bị đánh dấu rollback-only, nên khi
      outer hoàn tất, Spring ném UnexpectedRollbackException và toàn bộ JDBC write
      đều bị rollback.
