  rollbackDefaults():
    summary: Quan sát rollback mặc định cho checked và unchecked exception
    description: Chạy hai JDBC write transactional giống nhau. Một nhánh ném RuntimeException
      nên rollback; nhánh còn lại ném checked exception nên mặc định vẫn commit. Row
      cuối cùng trong H2 là bằng chứng trực tiếp cho rollback rule.
