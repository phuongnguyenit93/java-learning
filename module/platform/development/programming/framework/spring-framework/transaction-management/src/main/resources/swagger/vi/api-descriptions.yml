  requiresNew():
    summary: Quan sát commit độc lập của REQUIRES_NEW
    description: Outer transaction ghi dữ liệu, gọi inner REQUIRES_NEW đã commit,
      rồi outer thất bại. Table cuối cùng chỉ còn marker của inner transaction, chứng
      minh physical transaction mới hoàn tất độc lập với rollback của outer transaction.
