  - id: transaction-event-phases
    question: "Một transaction publish event rồi rollback. Có listener cho `BEFORE_COMMIT`, `AFTER_COMMIT`, `AFTER_ROLLBACK` và `AFTER_COMPLETION`. Cặp phase nào biểu diễn đúng completed rollback outcome?"
    answers:
      - {id: A, answer: "AFTER_COMMIT và AFTER_COMPLETION vì event đã được publish trước khi lỗi xảy ra.", explanation: "Sai. AFTER_COMMIT gắn với commit thành công chứ không chỉ với việc event từng được publish."}
      - {id: B, answer: "BEFORE_COMMIT và AFTER_COMMIT vì mọi published event đều chạy toàn bộ commit-related listener.", explanation: "Sai. Rollback không tạo AFTER_COMMIT, và BEFORE_COMMIT thuộc quá trình commit chứ không phải completed rollback outcome."}
      - {id: C, answer: "AFTER_ROLLBACK và AFTER_COMPLETION vì transaction hoàn tất bằng rollback thay vì commit.", explanation: "Đúng. AFTER_COMPLETION quan sát cả hai kết quả cuối, còn AFTER_ROLLBACK chỉ dành cho rollback."}
      - {id: D, answer: "Không listener nào chạy vì TransactionalEventListener bỏ qua mọi event được publish bên trong transaction.", explanation: "Sai. Mục đích của annotation này chính là gắn listener execution vào transaction phase."}
    correctAnswerId: C
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "10.EventsLifecycle/EventsLifecycle.md", anchor: "transaction-event-listener"}
