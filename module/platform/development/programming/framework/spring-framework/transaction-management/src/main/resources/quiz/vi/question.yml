  - id: transaction-requires-new-vs-nested
    question: "Phát biểu nào phân biệt đúng nhất `REQUIRES_NEW` với semantics `NESTED` cổ điển trên JDBC?"
    answers:
      - {id: A, answer: "Cả hai mode giữ một physical transaction; REQUIRES_NEW dùng savepoint còn NESTED tạm ngưng rồi khôi phục outer scope.", explanation: "Sai. Phát biểu này đảo mô hình cốt lõi: savepoint thuộc semantics NESTED cổ điển, còn REQUIRES_NEW tạo transaction độc lập."}
      - {id: B, answer: "REQUIRES_NEW tạo physical transaction riêng; NESTED thường dùng savepoint trong một physical transaction khi được hỗ trợ.", explanation: "Đúng. Đây là khác biệt cốt lõi giữa independent transaction và partial rollback dựa trên savepoint."}
      - {id: C, answer: "Cả hai mode đều tạo physical transaction thứ hai, nhưng NESTED sao chép isolation và timeout của outer transaction.", explanation: "Sai. NESTED cổ điển dùng savepoint trong physical transaction hiện có thay vì mở physical transaction thứ hai."}
      - {id: D, answer: "Cả hai mode đều dùng savepoint, nhưng REQUIRES_NEW giải phóng savepoint khi commit còn NESTED giữ đến outer completion.", explanation: "Sai. REQUIRES_NEW không phải propagation mode dựa trên savepoint."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
