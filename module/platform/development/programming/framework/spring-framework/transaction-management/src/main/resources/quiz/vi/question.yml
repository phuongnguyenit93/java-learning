  - id: transaction-proxy-self-invocation
    question: "Một public `@Transactional` method ghi database rồi ném `RuntimeException`. Method khác trong cùng bean gọi nó qua `this`. Trong proxy mode mặc định, rủi ro chính là gì?"
    answers:
      - {id: A, answer: "Inner call có thể bỏ qua transaction proxy, nên annotated method có thể chạy mà không có transaction advice vốn sẽ bao lời gọi từ bên ngoài.", explanation: "Đúng. Self-invocation ở lại trên target object và có thể bỏ qua proxy interception trong mô hình mặc định."}
      - {id: B, answer: "Vì inner method là public và có annotation nên Spring vẫn intercept dù lời gọi không rời target object.", explanation: "Sai. Public visibility và metadata không làm same-object call tự đi qua proxy."}
      - {id: C, answer: "Inner method tự động join transaction dù outer caller không transactional vì hai method thuộc cùng một Spring bean.", explanation: "Sai. Cùng bean không tự tạo transaction participation khi annotated inner call không được intercept."}
      - {id: D, answer: "Spring thay `this` bằng proxy lúc tạo bean nên self-invocation có semantics giống external bean call.", explanation: "Sai. `this` bên trong target vẫn là target object; self-invocation thông thường bỏ qua proxy bao quanh nó."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "4.Declarative/Declarative.md", anchor: "transaction-proxy-boundary"}
