  - id: transaction-reactive-context-cancel
    question: "Phát biểu nào mô tả đúng transaction participation và cancellation trong reactive Spring transaction?"
    answers:
      - {id: A, answer: "Participation chỉ được mang bằng ThreadLocal nên đổi thread luôn mất transaction và cancellation không có ý nghĩa transaction.", explanation: "Sai. Reactive transaction state gắn với Reactor/subscriber context thay vì mô hình ThreadLocal imperative."}
      - {id: B, answer: "Reactive transaction tồn tại ngay khi object Mono hoặc Flux được tạo, kể cả chưa có subscription.", explanation: "Sai. Reactive transaction work diễn ra ở subscription-time execution, không phải chỉ lúc publisher object được dựng."}
      - {id: C, answer: "Work tham gia khi thực thi trong transactional Reactor context, và cancellation của transactional publisher có thể dẫn tới rollback thay vì commit thành công.", explanation: "Đúng. Pipeline membership và terminal signal đều ảnh hưởng transaction outcome."}
      - {id: D, answer: "Tự gọi `subscribe()` bên trong transactional method bảo đảm subscription mới thừa hưởng cùng transaction context với chain được return.", explanation: "Sai. Manual subscription tạo execution riêng và không nên được giả định dùng chung transaction của returned pipeline."}
    correctAnswerId: C
