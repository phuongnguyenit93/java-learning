  - id: transaction-bound-resource-reuse
    question: "Một service transaction thực hiện hai thao tác JDBC có nhận biết Spring trên cùng DataSource. Vì sao cả hai có thể tham gia cùng local transaction mà repository code không phải tự truyền Connection?"
    answers:
      - {id: A, answer: "Spring-aware data access có thể tìm resource đã bind cho DataSource đó trong transaction context hiện tại và tái sử dụng nó cho phần việc tham gia.", explanation: "Đúng. Resource binding cho phép các thao tác data-access tham gia dùng lại resource gắn với transaction thay vì tự tạo transaction state độc lập."}
      - {id: B, answer: "Mỗi repository mở một connection độc lập, sau đó Spring hợp nhất các commit riêng đó khi cả hai repository method return thành công.", explanation: "Sai. Các connection đã commit độc lập không được ghép lại thành một local transaction sau khi sự việc đã xảy ra."}
      - {id: C, answer: "HTTP request tự sở hữu một JDBC connection, và mọi repository chạy trong request đó mặc định thừa hưởng cùng connection.", explanation: "Sai. HTTP request scope không phải mô hình bind transaction resource; participation đến từ hạ tầng data-access nhận biết Spring transaction."}
      - {id: D, answer: "`@Transactional` thay đổi JDBC driver để mọi connection mở độc lập trên cùng thread được xem như cùng một transaction.", explanation: "Sai. Spring điều phối việc lookup/bind resource có nhận biết transaction; nó không viết lại JDBC semantics cho connection độc lập tùy ý."}
    correctAnswerId: A
    aiGenerated: true
    reviewed: false
