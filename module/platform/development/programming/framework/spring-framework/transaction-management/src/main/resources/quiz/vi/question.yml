  - id: transaction-manager-selection
    question: "Một ứng dụng có cả JDBC transaction manager imperative và reactive transaction manager. Điều gì nên quyết định transactional method dùng manager nào?"
    answers:
      - {id: A, answer: "Dùng default manager cho mọi method; một khi có Spring transaction active thì mọi transactional resource sẽ tự tham gia.", explanation: "Sai. Transaction active của một manager không tự enlist resource thuộc manager hoặc execution model khác."}
      - {id: B, answer: "Chỉ cần nhìn Java return type; resource ownership không quan trọng miễn method trả về Mono, Flux hoặc giá trị thông thường.", explanation: "Sai. Method contract có ý nghĩa, nhưng manager được chọn vẫn phải sở hữu resource và hỗ trợ transaction model cần thiết."}
      - {id: C, answer: "Manager có resource ownership và execution model khớp với method, được chọn bằng cấu hình mặc định hoặc qualifier tường minh khi cần.", explanation: "Đúng. Việc chọn manager mang ý nghĩa hành vi vì nó quyết định resource và mô hình transaction nào thực sự được điều phối."}
      - {id: D, answer: "Ưu tiên imperative manager bất cứ khi nào có database, kể cả khi công việc là reactive pipeline trên reactive resource.", explanation: "Sai. Imperative hay reactive là một phần của contract giữa execution model, manager và resource, không thể bỏ qua chỉ vì cả hai đều truy cập database."}
    correctAnswerId: C
