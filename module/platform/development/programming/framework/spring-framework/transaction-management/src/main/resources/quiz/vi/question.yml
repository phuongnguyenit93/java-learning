  - id: transaction-default-rollback
    question: "Hai `@Transactional` method giống nhau đều ghi một row. Một method ném `IllegalStateException`, method kia ném checked exception thông thường. Không có rollback rule tường minh. Kết quả mặc định của Spring Framework 6.1 là gì?"
    answers:
      - {id: A, answer: "Cả hai rollback vì mọi subclass của Exception đều yêu cầu rollback mặc định.", explanation: "Sai. Checked exception không yêu cầu rollback theo rule mặc định thông thường."}
      - {id: B, answer: "Cả hai commit vì rollback luôn cần cấu hình `rollbackFor` tường minh.", explanation: "Sai. RuntimeException và Error yêu cầu rollback theo mặc định."}
      - {id: C, answer: "Checked exception rollback còn RuntimeException commit vì unchecked failure được xem là có thể phục hồi.", explanation: "Sai. Phát biểu này đảo ngược rollback behavior mặc định của Spring."}
      - {id: D, answer: "Transaction ném RuntimeException rollback, còn transaction ném checked exception commit nếu không có rollback rule khác khớp.", explanation: "Đúng. Đây là khác biệt mặc định giữa checked và unchecked failure."}
    correctAnswerId: D
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "6.Rollback/Rollback.md", anchor: "transaction-rollback-defaults"}
