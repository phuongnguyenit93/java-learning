  - id: transaction-required-rollback-only
    question: "Inner `REQUIRED` method ném RuntimeException sau khi join outer `REQUIRED` transaction. Outer method bắt exception rồi return bình thường. Điều gì có thể xảy ra khi outer hoàn tất?"
    answers:
      - {id: A, answer: "Catch block tự động xóa rollback-only state nên shared transaction commit bình thường.", explanation: "Sai. Bắt application exception không làm transaction có thể commit trở lại sau khi inner interceptor đã đánh dấu rollback-only."}
      - {id: B, answer: "Spring có thể rollback shared physical transaction và ném `UnexpectedRollbackException` khi outer scope cố commit.", explanation: "Đúng. Điều này tránh báo sai cho caller rằng một transaction đã bị doom vẫn commit thành công."}
      - {id: C, answer: "Chỉ JDBC statement của inner rollback còn outer luôn commit vì REQUIRED tự tạo savepoint.", explanation: "Sai. REQUIRED thường dùng chung physical transaction và không phải semantics savepoint của NESTED."}
      - {id: D, answer: "Outer method lỗi ngay khi compile vì Java không cho bắt exception từ transactional method.", explanation: "Sai. Java catch hoàn toàn hợp lệ; vấn đề là rollback-only state tại thời điểm transaction completion."}
    correctAnswerId: B
    aiGenerated: true
    reviewed: false
    readmeRelated: {file: "7.Propagation/Propagation.md", anchor: "transaction-propagation-rollback-only"}
