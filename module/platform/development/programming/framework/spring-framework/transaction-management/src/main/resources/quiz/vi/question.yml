  - id: transaction-local-remote-boundary
    question: "Một service method cập nhật local database, gọi remote HTTP service và publish message. Phát biểu nào mô tả đúng nhất bảo đảm của `@Transactional`?"
    answers:
      - {id: A, answer: "Interceptor truyền local database transaction qua HTTP và broker header nên cả ba effect dùng chung một commit decision.", explanation: "Sai. HTTP/RPC thông thường không kéo local resource transaction sang remote process hoặc broker không liên quan."}
      - {id: B, answer: "Vì ba call nằm trong cùng một service method nên Spring xem chúng là một physical transaction dù dùng các resource manager khác nhau.", explanation: "Sai. Java call scope không đồng nghĩa với coordinated multi-resource transaction."}
      - {id: C, answer: "Chỉ resource mà transaction manager đã chọn thực sự điều phối được mới tham gia; remote call và messaging effect không liên quan cần reliability hoặc coordination strategy riêng.", explanation: "Đúng. @Transactional định nghĩa Spring transaction boundary chứ không tự tạo distributed atomicity xuyên qua các hệ thống tùy ý."}
      - {id: D, answer: "Nếu local database rollback thì Spring tự compensate remote call đã hoàn tất và thu hồi message đã được broker không liên quan nhận.", explanation: "Sai. Compensation hoặc durable messaging behavior phải được thiết kế tường minh, không được suy ra từ local transaction."}
    correctAnswerId: C
