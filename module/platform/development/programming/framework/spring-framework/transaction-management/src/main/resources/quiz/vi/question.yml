questions:
  - id: transaction-service-boundary
    question: "Một use case đặt hàng phải cập nhật order và giữ chỗ inventory theo một kết quả nguyên tử. Ranh giới transaction mặc định rõ ràng nhất nên đặt ở đâu?"
    answers:
      - {id: A, answer: "Bao quanh từng repository method riêng lẻ để mỗi database call commit càng sớm càng tốt.", explanation: "Sai. Các repository transaction tách rời có thể làm lộ trạng thái nghiệp vụ dở dang khi bước sau thất bại."}
      - {id: B, answer: "Bao quanh thao tác service/application sở hữu business invariant và điều phối cả hai repository call.", explanation: "Đúng. Transaction thường nên đi theo business unit of work phải cùng thành công hoặc cùng thất bại."}
      - {id: C, answer: "Bao quanh controller method vì HTTP request scope và transaction scope là cùng một khái niệm.", explanation: "Sai. Web request và business unit of work là hai ranh giới khác nhau; transaction nên xuất phát từ invariant chứ không từ vòng đời transport."}
      - {id: D, answer: "Bao quanh toàn bộ process của ứng dụng để mọi thao tác sau có thể dùng lại cùng transaction.", explanation: "Sai. Transaction quá rộng giữ resource và lock quá lâu và không còn khớp với một unit of work hữu hạn."}
    correctAnswerId: B
