  - id: transaction-policy-existing-scope
    question: "Một inner `REQUIRED` method khai báo isolation level khác khi đang join outer transaction đã active. Mô hình tư duy nào an toàn nhất?"
    answers:
      - {id: A, answer: "Inner declaration thay isolation của existing physical transaction cho toàn bộ phần còn lại của outer scope.", explanation: "Sai. Participating logical scope không thể đơn giản định nghĩa lại physical transaction mà nó đã join."}
      - {id: B, answer: "Existing physical transaction giữ nguyên đặc tính; manager hỗ trợ có thể dùng strict validation để từ chối khai báo không tương thích.", explanation: "Đúng. Join existing transaction không tạo bộ physical characteristic thứ hai."}
      - {id: C, answer: "Spring tự chuyển inner propagation thành REQUIRES_NEW mỗi khi isolation được yêu cầu khác outer transaction.", explanation: "Sai. Spring không âm thầm đổi propagation để tạo physical transaction mới."}
      - {id: D, answer: "Inner isolation chỉ có hiệu lực cho SQL statement của inner method rồi Spring khôi phục isolation của outer scope.", explanation: "Sai. Participating scope không tạm viết lại isolation chỉ quanh các statement của nó."}
