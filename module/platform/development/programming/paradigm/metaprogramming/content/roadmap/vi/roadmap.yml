# Curriculum roadmap for Siêu lập trình.
# Review scope before authoring Knowledge/Menu in subsequent workflow steps.
roadmap:
  - id: metaprogramming-foundations
    title: "Chương trình như dữ liệu"
    purpose: "Hiểu biểu diễn code và sự khác biệt giữa dữ liệu ứng dụng với cú pháp chương trình."
    objectives:
      - "Hiểu biểu diễn code và sự khác biệt giữa dữ liệu ứng dụng với cú pháp chương trình."
  - id: metaprogramming-representation
    title: "AST, cú pháp và ngữ nghĩa"
    purpose: "Phân biệt token/source/AST/bytecode, cú pháp bề mặt và semantic model."
    objectives:
      - "Phân biệt token/source/AST/bytecode, cú pháp bề mặt và semantic model."
  - id: metaprogramming-staging
    title: "Các giai đoạn compile-time và runtime"
    purpose: "Xác định khi nào code được tạo, kiểm tra kiểu, biên dịch hoặc thực thi."
    objectives:
      - "Xác định khi nào code được tạo, kiểm tra kiểu, biên dịch hoặc thực thi."
  - id: metaprogramming-macros
    title: "Macro, hygiene và biến đổi mã"
    purpose: "Hiểu macro expansion, capture sai tên và giới hạn an toàn của phép biến đổi."
    objectives:
      - "Hiểu macro expansion, capture sai tên và giới hạn an toàn của phép biến đổi."
  - id: metaprogramming-generation
    title: "Tạo source và xử lý metadata"
    purpose: "Định vị template, annotation processing và generated source; phân biệt tạo code với chỉ đọc metadata."
    objectives:
      - "Định vị template, annotation processing và generated source; phân biệt tạo code với chỉ đọc metadata."
  - id: metaprogramming-runtime
    title: "Reflection và hành vi tạo động"
    purpose: "So sánh introspection, dynamic proxies và runtime code/bytecode generation."
    objectives:
      - "So sánh introspection, dynamic proxies và runtime code/bytecode generation."
  - id: metaprogramming-tradeoffs
    title: "An toàn, kiểm thử và khả năng bảo trì"
    purpose: "Đánh giá nguồn gốc generated code, debugging, performance, trust boundaries và sử dụng thích hợp."
    objectives:
      - "Đánh giá nguồn gốc generated code, debugging, performance, trust boundaries và sử dụng thích hợp."
