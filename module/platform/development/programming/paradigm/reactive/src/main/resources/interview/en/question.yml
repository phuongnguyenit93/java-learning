  - question: "Why might you replace independent temperature, failure and disconnect callbacks with a composed flow, and when would that be needless complexity?"
    answer: "Callbacks are not inherently wrong. Once filtering invalid readings, ten-second windows, error propagation and cancellation interact, dispersed handlers make it harder to show that every exit releases its owned resources. Composition offers one traceable lifecycle with explicit stages and tests. For a small finite operation with clear callback ownership, the simpler callback design may be more maintainable."
