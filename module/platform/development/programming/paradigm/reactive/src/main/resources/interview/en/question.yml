  - question: "One Subscription has two outstanding requests, then receives request(3) and three onNext signals. Explain the accounting and the forbidden sixth item."
    answer: "Outstanding demand becomes 2+3=5; three onNext consume three allowances and two remain. A terminal onComplete/onError does not consume data demand and may arrive before all five if the source ends or fails; demand is permission, not a promise of five values. Once five onNext have been delivered without further requests, a sixth violates the contract. I would record counters per Subscription rather than aggregate unrelated subscribers."
