    answer: "A conventional call might return temperature 27 now; a reactive design describes what happens as 27, 29, and 33 arrive later, with unknown arrival times and possibly no natural end. I would draw source, transforms, consumer, subscription and exit paths. The paradigm itself does not grant threads, remove blocking I/O or establish a request(n) protocol; those require evidence about the chosen components."
