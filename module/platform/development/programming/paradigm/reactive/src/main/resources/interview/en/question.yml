  - question: "A Publisher delivers A and B after request(2). Describe a valid onSubscribe/onNext/terminal trace and two common violations."
    answer: "A valid trace is onSubscribe(s), the Subscriber calls s.request(2), the Publisher sends onNext(A), onNext(B), then a single onComplete when the source is exhausted; onError is an alternative terminal outcome, not a later second terminal. An extra onNext(C) without demand is invalid. So is onComplete followed by C, or onError followed by onComplete. I would verify serialization and the per-subscriber lifecycle, not just count the first two items."
