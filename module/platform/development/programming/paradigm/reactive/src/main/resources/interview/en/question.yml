  - question: "A developer uses request(0) to pause an empty source and expects normal completion. Explain rule 3.9 and the correct alternatives."
    answer: "Under Reactive Streams rule 3.9 a zero or negative request is invalid and must result in onError(IllegalArgumentException); it is not a pause or cancellation command. To withhold further allowance simply avoid another request, and to withdraw interest call Subscription.cancel(). Terminal signals generally need no data demand, but this invalid request must follow the protocol error path without a second terminal. I would test zero and negative requests and their cleanup behavior."
