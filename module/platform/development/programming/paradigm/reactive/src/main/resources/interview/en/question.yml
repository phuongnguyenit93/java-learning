  - question: "What changes in the contract when a function returning 27 now becomes an ongoing stream with 29 and 33 arriving unpredictably?"
    answer: "A scalar computation describes input and output. A stream of readings at 09:00, 09:01 and 09:02 additionally needs subscription initiation, unknown arrival times, completion or failure, and the viewer's ability to stop observing. The same pure filter predicate could be reused. Time and lifecycle create the extra obligations, not a different numeric type or an automatic thread."
