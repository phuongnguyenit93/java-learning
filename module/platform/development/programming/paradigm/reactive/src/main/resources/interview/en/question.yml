  - question: "A finite source contains only A,B,C, while a Subscriber calls request(2) and request(3). Must the Publisher fabricate D,E before completion?"
    answer: "No. The requests add to five permitted onNext values, but demand is a maximum allowance rather than a promise to manufacture values. The source may emit A,B,C and then onComplete with two unused allowances; completion consumes no allowance and need not wait for a further request. If a sixth actual item existed, it would need new demand after five emissions. I would test safe accumulation and not confuse request call count with requested item count."
