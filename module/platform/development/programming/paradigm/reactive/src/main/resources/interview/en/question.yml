    answer: "Assuming steady rates, no drops, no upstream throttling and an empty initial queue, 100−40=60 items accumulate per second, or roughly 600 after ten seconds. Real workloads fluctuate, so I would instrument arrival rate, processed throughput, queue depth, age of the oldest item and latency percentiles. The mismatch requires an explicit capacity and policy decision; naming the pipeline reactive does not solve it."
