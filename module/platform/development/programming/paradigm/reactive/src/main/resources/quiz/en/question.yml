    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "After three seconds due to an extra warm-up second."
        explanation: "No startup delay was specified."
      - id: B
        answer: "After about two seconds, followed by an overload policy."
        explanation: "120/60=2; a bounded queue needs an explicit overflow choice."
      - id: C
        answer: "Never, because a capacity-120 queue expands without bound."
        explanation: "Capacity 120 is explicitly bounded."
      - id: D
        answer: "After half a second because 120 should be divided by 240/s."
        explanation: "Queue growth is the difference, not a sum of rates."
