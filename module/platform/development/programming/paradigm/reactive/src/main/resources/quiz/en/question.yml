  - id: "reactive-quiz-18"
    question: "A Subscriber has outstanding demand=2, requests another 3, then receives three onNext items. How much allowance remains?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Backpressure/Backpressure.md"
      anchor: "reactive-demand-flow-control"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Two remain because 2+3−3=2 on the same Subscription."
        explanation: "Requests accumulate; onNext consumes the allowance."
      - id: B
        answer: "Zero because request(3) overwrites the earlier request(2)."
        explanation: "Reactive Streams demand accumulates rather than resetting."
      - id: C
        answer: "Five because onNext does not reduce outstanding allowance."
        explanation: "Each emitted onNext fulfills one unit of demand."
      - id: D
        answer: "Cannot tell because onComplete always consumes an allowance."
        explanation: "Terminal signals are not data and do not consume demand."
    correctAnswerId: A
  - id: "reactive-quiz-19"
    question: "A hot sensor cannot slow down and its 120-item queue is nearly full. Which response is honest about trade-offs?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "3.Backpressure/Backpressure.md"
      anchor: "reactive-overload-strategies"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Make the queue unbounded to eliminate memory limitations. assuming physical memory never runs out in the deployed application."
        explanation: "Unbounded queues risk memory exhaustion and stale readings."
      - id: B
        answer: "Add an onBackpressure method name and assume the source slows."
        explanation: "Operator names do not change source capabilities."
      - id: C
        answer: "Disable diagnostics since dropped readings are inherently unobservable."
        explanation: "Drop counts, queue depth and oldest age can be measured."
      - id: D
        answer: "Choose explicit drop/coalesce/latest or overload failure policies and measure loss/lag."
        explanation: "Without upstream demand cooperation, buffering and freshness need explicit policy."
    correctAnswerId: D
  - id: "reactive-quiz-20"
    question: "An API is called 'reactive' but exposes push callbacks only. What can be said about request(n) guarantees?"
