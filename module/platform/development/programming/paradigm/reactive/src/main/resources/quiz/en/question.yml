  - id: "reactive-quiz-13"
    question: "A Subscriber receives onSubscribe(subscription) but has not requested data. Which next control direction is valid?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.DataFlow/DataFlow.md"
      anchor: "reactive-subscribe-lifecycle"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Publisher invokes Subscriber.request(n) directly, granting a fixed batch of downstream items."
        explanation: "request belongs to Subscription and is initiated by the subscriber."
      - id: B
        answer: "Subscriber calls Subscription.request(n) for allowance or cancel() to withdraw."
        explanation: "onSubscribe provides the control handle; onNext needs demand."
      - id: C
        answer: "Subscriber calls Publisher.onNext(A) immediately after subscribing."
        explanation: "onNext travels from Publisher to Subscriber, not reverse."
      - id: D
        answer: "onSubscribe automatically grants unbounded demand without a request."
        explanation: "The handshake does not confer unlimited data demand."
    correctAnswerId: B
  - id: "reactive-quiz-14"
    question: "A subscribes to a cold source at 09:00, B at 09:02, while another sensor is hot. Which distinction is valid?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.DataFlow/DataFlow.md"
      anchor: "reactive-execution-timing"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Cold subscriptions commonly have separate production; B may miss earlier hot readings."
        explanation: "Cold/hot describe production timing, not a universal replay guarantee."
      - id: B
        answer: "Hot and cold sources both replay their entire history to each new subscriber by default."
        explanation: "Hot sources may produce without viewers and need not replay."
      - id: C
        answer: "A cold source can never produce values because demand is impossible."
        explanation: "Subscribers may request; actual start depends on the source."
      - id: D
        answer: "Hot sources always demonstrate conformance to RS request(n)."
        explanation: "Hot describes production activity, not demand conformance."
    correctAnswerId: A
  - id: "reactive-quiz-15"
    question: "Timeline: 27 at 09:00, -300 at 09:01, viewer cancels at 09:01:30, 33 at 09:02. What is defensible?"
    aiGenerated: true
