      - id: B
        answer: "Each new request resets demand, allowing at most three items."
        explanation: "Outstanding requests accumulate on the Subscription."
      - id: C
        answer: "Five granted, three used, two remain; the source may complete early."
        explanation: "Requests add; completion neither consumes allowance nor waits for exhaustion."
