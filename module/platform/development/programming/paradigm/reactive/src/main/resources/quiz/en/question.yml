# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: "reactive-quiz-01"
    question: "A dashboard receives 27°C at 09:00, 29°C at 09:01 and 33°C at 09:02. Which feature makes this a reactive problem?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ReactiveProgramming.md"
      anchor: "reactive-what"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Three distinct arrival times imply separate CPU workers processed the readings in parallel."
        explanation: "Arrivals at different times do not demonstrate simultaneous CPU execution."
      - id: B
        answer: "React to newly arriving values over time without assuming the stream's length is known."
        explanation: "The source continues after observation begins; behavior must cover each arrival."
      - id: C
        answer: "Moving readings into an HTTP endpoint automatically makes it reactive."
        explanation: "HTTP is a transport choice rather than evidence of event-flow lifecycle."
      - id: D
        answer: "One function returning 27 immediately describes the entire unknown stream."
        explanation: "An immediate value does not model future arrivals or subscription termination."
    correctAnswerId: B
  - id: "reactive-quiz-02"
    question: "A sensor feed needs filtering, error handling and cleanup after a viewer leaves. Why consider a composed flow?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ReactiveProgramming.md"
      anchor: "reactive-why"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Connect transformations, failure and lifecycle through visible contracts."
        explanation: "Callbacks can work, but coordination gets harder across many independent handlers."
      - id: B
        answer: "Because callbacks are inherently wrong and cannot handle exceptions."
        explanation: "Simple callbacks can be correct; the concern is coordination complexity."
      - id: C
        answer: "Because every reactive pipeline automatically closes the physical device on cancellation."
        explanation: "Resource cleanup depends on ownership and policy, not naming."
      - id: D
        answer: "Because filtering with pipeline operators guarantees all stages are pure."
        explanation: "A UI update or I/O stage remains effectful even in a pipeline."
    correctAnswerId: A
  - id: "reactive-quiz-03"
    question: "You already have the value 27, but the sensor may emit more at any time. What design distinction matters?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ReactiveProgramming.md"
      anchor: "reactive-values-vs-streams"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "A scalar value needs the same Subscription.request(n) lifecycle as an ongoing event feed."
        explanation: "Reactive Streams demand is not a rule for every scalar expression."
      - id: B
        answer: "Because future readings are guaranteed to arrive every 60 seconds."
        explanation: "An observed timeline does not establish a fixed delivery interval."
      - id: C
        answer: "Only records persisted in a database qualify as a legitimate stream."
        explanation: "Live sensor signals can form a stream without prior database storage."
      - id: D
        answer: "The event stream also needs subscription start, failure and stopping semantics beyond per-item math."
        explanation: "A ready value can be computed immediately; future arrival timing remains unknown."
    correctAnswerId: D
  - id: "reactive-quiz-04"
    question: "A filter→classify sensor pipeline is declared ahead of time. What has not been proven merely by declaring it?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ReactiveProgramming.md"
      anchor: "reactive-foundation-bridge"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "That constructing the composed processing stages has already activated a subscriber and worker."
        explanation: "That is what the declaration shows; actual execution remains unobserved."
      - id: B
        answer: "That classification functions can be tested using fixed inputs independently."
        explanation: "The local calculation can be tested without live subscription."
      - id: C
        answer: "That the pipeline ran, had a subscriber, or received dedicated threads and data."
        explanation: "Describing transformation does not establish execution timing or scheduling."
      - id: D
        answer: "That the data types required by the stages need to be compatible."
        explanation: "This is a design obligation, not evidence of runtime activity."
    correctAnswerId: C
  - id: "reactive-quiz-05"
    question: "Source [27,-300,33] passes validation then classification. Which trace correctly models filtering and display?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ReactiveProgramming.md"
      anchor: "reactive-solution"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Forward 27 and -300, dropping 33 for exceeding the alert threshold."
        explanation: "An alert classification retains 33; -300 is invalid data."
      - id: B
        answer: "Keep 27, drop -300, then forward 33 as an alert."
        explanation: "A filter may emit zero items for -300; the display sees validated outputs."
      - id: C
        answer: "All three reach display because pipelines preserve element counts."
        explanation: "Filtering can change cardinality and remove individual readings."
      - id: D
        answer: "Dropping -300 must terminate the subscription with onError."
        explanation: "Dropping an item is not necessarily a terminal protocol failure."
    correctAnswerId: B
  - id: "reactive-quiz-06"
    question: "A system pushes readings on arrival without a request(n) contract. Which conclusion is accurate?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ReactiveProgramming.md"
      anchor: "reactive-streams-boundary"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "It may be reactive in style but is not shown to satisfy Reactive Streams."
        explanation: "Reactive Streams has specific demand guarantees beyond the general paradigm."
      - id: B
        answer: "Each requested item must eventually be emitted before a finite stream may complete."
        explanation: "RS can emit fewer than requested, and generic reactive design may not use request."
      - id: C
        answer: "Providing an onError callback establishes full RS protocol compliance."
        explanation: "Signal sequencing, bounded demand and cancellation also matter."
      - id: D
        answer: "WebFlux automatically makes any arbitrary event source RS-compliant."
        explanation: "A framework cannot force an unrelated producer to honor unsupported demand."
    correctAnswerId: A
  - id: "reactive-quiz-07"
    question: "A team treats Reactor, RxJava and WebFlux as one framework with identical demand behavior. Which correction is right?"
    aiGenerated: true
    reviewed: false
