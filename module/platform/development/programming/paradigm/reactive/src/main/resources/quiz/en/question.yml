      anchor: "reactive-composition"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Using composed operators makes UI changes and logging observationally pure operations."
        explanation: "I/O and mutation remain effects inside operators."
      - id: B
        answer: "Changing an alert threshold necessarily requires rewriting the sensor adapter."
        explanation: "A clear boundary can isolate classification rule changes."
      - id: C
        answer: "The classification rule can be replaced independently, while UI updates remain effects."
        explanation: "Composition clarifies boundaries but does not erase effects or cancellation."
      - id: D
        answer: "Once there is a map operator, errors and cancellation need no design."
        explanation: "Lifecycle still needs explicit treatment beyond transformations."
