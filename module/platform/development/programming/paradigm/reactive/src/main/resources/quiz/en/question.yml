      file: "4.ReactiveStreams/ReactiveStreams.md"
      anchor: "reactive-signal-sequence"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Send a third onNext(C) beyond the requested allowance before signaling completion."
        explanation: "A third onNext would exceed requested demand."
      - id: B
        answer: "Signal onComplete first, then deliver queued onNext(C) as a final drain."
        explanation: "No data or alternative terminal may follow termination."
      - id: C
        answer: "Signal onError and then onComplete so the subscriber observes both possible terminal outcomes."
        explanation: "A subscription has at most one terminal outcome."
      - id: D
        answer: "A single onComplete or onError terminal, not both and no subsequent onNext."
        explanation: "Signals to one subscriber must be serialized; terminals end delivery."
