      anchor: "reactive-framework-boundary"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Reactor and RxJava provide the same HTTP framework features and demand guarantees as WebFlux."
        explanation: "Libraries, framework roles and blocking application calls are distinct."
      - id: B
        answer: "RxJava exposes one stream type with one uniform RS demand contract."
        explanation: "RxJava has multiple stream types, not all with request(n)."
      - id: C
        answer: "Using Flux guarantees real parallel execution on multiple CPUs."
        explanation: "Choosing a Flux type does not automatically grant parallel threads."
      - id: D
        answer: "Reactor/RxJava are libraries with differing types; WebFlux is a web framework; demand depends on API."
        explanation: "Observable and Flowable types do not expose identical demand semantics."
    correctAnswerId: D
  - id: "reactive-quiz-08"
    question: "For a 100/s sensor and 40/s display, what learning sequence is defensible before a specific library?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ReactiveProgramming.md"
      anchor: "reactive-learning-path"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Select a faster scheduler first and treat upstream demand and queue limits as implementation details."
        explanation: "Scheduler selection alone does not resolve an overload mismatch."
      - id: B
        answer: "Implement HTTP endpoints first to establish the delivery rate and buffering behavior of all sources."
        explanation: "HTTP does not establish demand compliance or absence of blocking."
      - id: C
        answer: "Trace data/lifecycle → measure backlog → learn demand/backpressure → distinguish completion,error,cancel."
        explanation: "Each step builds on prior observations instead of trusting labels to handle overload."
      - id: D
        answer: "Use an unbounded buffer as the initial solution and postpone completion and cancellation tests."
        explanation: "Finite memory and lifecycle behavior still require design."
    correctAnswerId: C

  - id: "reactive-quiz-09"
    question: "A physical sensor emits 33, an adapter publishes it, validation filters it, and a dashboard displays it. Who consumes and why does validation have two roles?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.DataFlow/DataFlow.md"
      anchor: "reactive-source-producer-consumer"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The physical sensor is always a protocol Subscriber and the dashboard a Publisher."
        explanation: "Roles depend on who actually provides and consumes signals."
      - id: B
        answer: "The dashboard is the final consumer; validation receives upstream and emits downstream."
        explanation: "A middle stage receives and forwards; four stages do not imply four threads."
      - id: C
        answer: "Validation can only be a final consumer and cannot forward readings."
        explanation: "Intermediate stages may both receive and emit values."
      - id: D
        answer: "Each box must run on a separate thread to qualify as reactive."
        explanation: "Stage count does not determine scheduling or parallelism."
    correctAnswerId: B
  - id: "reactive-quiz-10"
    question: "Inputs 27,-300,33 pass validation and 27°C is converted to Fahrenheit. What is true about values and counts?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.DataFlow/DataFlow.md"
      anchor: "reactive-transform-combine"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "-300 may disappear while 27°C becomes 80.6°F; cardinality need not be preserved."
        explanation: "Filtering may emit zero for an invalid item; mapping changes kept values."
      - id: B
        answer: "Rejecting -300 must terminate the stream with onError before 33 can be classified."
        explanation: "Dropping one value need not terminate the subscription."
      - id: C
        answer: "27°C must become 27°F because mapping cannot change magnitude."
        explanation: "Conversion is 27×9/5+32=80.6, not a label change."
      - id: D
        answer: "Every flow must output three values for three input readings."
        explanation: "Filters can reduce output cardinality."
    correctAnswerId: A
  - id: "reactive-quiz-11"
    question: "An adapter pushes every 100ms while a dashboard handles an item every 500ms. Which demand claim is correct?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.DataFlow/DataFlow.md"
      anchor: "reactive-push-pull"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Connecting a demand-aware dashboard converts the physical sensor itself into a pull-only source."
        explanation: "Push-only sources may not adapt to downstream demand."
      - id: B
        answer: "Push, pull and RS request(n) have identical semantics in all libraries."
        explanation: "RS has a specific demand contract, not a universal push synonym."
      - id: C
        answer: "Callbacks eliminate buffers even when the source is five times faster."
        explanation: "Excess rate still requires a buffer/drop/slowdown policy."
      - id: D
        answer: "Demand helps only where relevant boundaries and upstream honor requests."
        explanation: "The word reactive does not slow a physical source on its own."
    correctAnswerId: D
  - id: "reactive-quiz-12"
    question: "In sensor→validate→classify→dashboard, classification is pure while display updates the UI. Which assessment holds?"
    aiGenerated: true
