      anchor: "reactive-flow-trace"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Cancelling one subscription shuts down the shared physical sensor for all other viewers."
        explanation: "Other subscribers may continue sharing the hot source."
      - id: B
        answer: "-300 must produce onNext(-300) at the dashboard to preserve counts."
        explanation: "Validation may drop invalid source readings."
      - id: C
        answer: "33 emitted after cancellation is guaranteed to reach the cancelled viewer."
        explanation: "The protocol allows in-flight races, not guaranteed post-cancel delivery."
      - id: D
        answer: "27 may display, -300 is filtered; 33 is not guaranteed to reach a cancelled viewer."
        explanation: "After cancel, eventual stop applies, though previously in-flight items may arrive."
    correctAnswerId: D
  - id: "reactive-quiz-16"
    question: "Producer emits 100/s, consumer handles 40/s, no drops and empty initial backlog. Approximately how many accumulate after 10 seconds?"
    aiGenerated: true
