  - question: "Một người mới muốn tối ưu scheduler ngay khi sensor phát 100 mẫu/s và UI chỉ xử lý 40. Bạn hướng dẫn họ chứng minh vấn đề theo thứ tự nào?"
    answer: "Tôi cho vẽ timeline, đếm mẫu vào và mẫu ra, xác nhận backlog tăng 60/s trong giả thiết tốc độ đều; queue 120 rỗng sẽ đầy khoảng hai giây. Sau đó hỏi adapter có request(n) được nguồn tôn trọng không, hay phải có policy bounded buffer/drop/latest. Cuối cùng tách onComplete, onError, cancel, đo oldest item và in-flight. Scheduler có thể ảnh hưởng năng lực thực nhưng không tự sửa nguồn vật lý nhanh hơn consumer."
