  - question: "Một developer dùng request(0) làm lệnh pause rồi mong nhận onComplete nếu stream rỗng. Bạn giải thích rule 3.9 và đường sửa thế nào?"
    answer: "request(0) hoặc số âm là demand không hợp lệ theo Reactive Streams rule 3.9 và Publisher phải báo onError(IllegalArgumentException) theo quy tắc; đó không phải cách pause hoặc cancel. Trạng thái không yêu cầu thêm có thể duy trì bằng việc không gọi request mới; muốn rời đi dùng Subscription.cancel(). Terminal thường không cần demand, nhưng sau yêu cầu sai này phải tuân đường lỗi và không gửi thêm terminal thứ hai. Tôi test cả request0 lẫn request âm và việc cleanup."
