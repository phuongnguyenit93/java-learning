  - question: "Với nguồn [27,-300,33], hãy mô tả đường dữ liệu và cách chứng minh tại đâu -300 biến mất mà không báo lỗi terminal."
    answer: "Adapter phát ba mẫu, validate nhận từng giá trị, bỏ -300 theo predicate và chỉ chuyển 27,33 cho classify; 33 vượt ngưỡng tạo cảnh báo ở dashboard. Tôi gắn counter tại input, sau filter và consumer để phân biệt zero-output của filter với onError; đồng thời ghi terminal và cancel riêng. Producer, transformation và consumer là trách nhiệm, không tương ứng bắt buộc ba thread. Nếu việc bỏ mẫu cần audit thì lưu lý do có kiểm soát thay vì ép cả subscription thất bại."
