  - question: "Vì sao bạn thay ba callback xử lý nhiệt độ, lỗi và mất kết nối bằng một luồng ghép, và khi nào không đáng làm?"
    answer: "Callback onTemperature, onSensorError và onDisconnect vẫn có thể đúng. Khi cần lọc -300, gom cửa sổ mười giây, giữ trạng thái theo dõi và cleanup ở nhiều nhánh, logic rải rác khiến khó chứng minh mọi kết thúc đã thu tài nguyên. Luồng có thể đặt dữ liệu, lỗi, cancel trong một mô hình để test timeline và ownership. Nếu chỉ có một sự kiện hữu hạn và vài callback rõ ràng, thiết kế đơn giản có thể dễ bảo trì hơn."
    aiGenerated: true
