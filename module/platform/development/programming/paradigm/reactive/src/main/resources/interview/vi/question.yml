  - question: "Giải thích vì sao chỉ khai báo filter→classify→display chưa chứng minh nguồn đã chạy, không chặn hay xử lý song song."
    answer: "Khai báo operator mô tả quy tắc biến đổi; runtime có thể còn chờ subscribe và demand, hoặc chạy đồng bộ ngay trên thread người gọi tùy source/scheduler. Asynchronous nghĩa là kết quả có thể xuất hiện sau lời gọi, không đồng nghĩa hai CPU hoạt động cùng lúc. Một phép display vẫn có I/O, còn map có thể chứa Thread.sleep. Tôi yêu cầu trace onSubscribe/onNext cùng kiểm tra scheduler và nơi blocking thực tế thay vì suy từ tên API."
    aiGenerated: true
