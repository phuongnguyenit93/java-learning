  - question: "Trong một Flux có Thread.sleep ở map và nhiều request async. Bạn xác định nonblocking, asynchronous và parallelism bằng cách nào thay vì dựa tên Flux?"
    answer: "Flux là abstraction; map có Thread.sleep vẫn giữ một thread đang chờ. Async chỉ nói callback/kết quả có thể đến sau, nonblocking là không giữ thread khi chờ theo operation đang xét, parallelism là công việc thực sự đồng thời trên tài nguyên khác. Tôi kiểm scheduler được chọn, nơi thực thi operator và trace thread, đo blocked-thread count, CPU, queue-lag, đồng thời so với kết quả đúng. Thêm scheduler sai có thể chỉ dời bottleneck."
