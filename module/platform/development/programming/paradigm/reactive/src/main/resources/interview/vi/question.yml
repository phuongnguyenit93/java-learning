    answer: "Một cold source thường tạo phiên phát theo subscriber, chẳng hạn đọc lại một danh sách hữu hạn khi B đăng ký; tuy nhiên thời điểm thực thi, scheduling và replay vẫn phụ thuộc implementation. Sensor hot có thể phát trước khi B đăng ký, khiến B không thấy 27 cũ nếu không có replay buffer chủ động. Tôi không kết luận từ việc mô tả pipeline rằng nó đã chạy hoặc mọi subscriber thấy cùng lịch sử; test cụ thể subscription timing và chính sách chia sẻ."
