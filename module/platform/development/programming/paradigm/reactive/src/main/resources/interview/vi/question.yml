  - question: "Nếu bạn thiết kế adapter giữa cảm biến và dashboard, làm thế nào xác định vai producer/consumer khi validate vừa nhận vừa phát?"
    answer: "Tôi vẽ boundary riêng cho sensor→adapter, adapter→validate và validate→dashboard. Dashboard nhận cuối; validate là consumer đối với upstream và producer đối với downstream, hoặc Processor nếu tuân API chuẩn. Điều quan trọng là ai sở hữu Subscription từng cạnh, ai có thể request/cancel và nơi nào lọc -300. Không thể gán bốn stage bằng bốn thread hay giả consumer điều khiển trực tiếp cảm biến vật lý."
