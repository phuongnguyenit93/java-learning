  - question: "Processor validate lọc mất -300 giữa upstream và downstream. Vì sao request(3) từ dashboard không bắt buộc thành request(3) nguyên vẹn ở upstream?"
    answer: "Processor vừa Subscriber của Publisher trước vừa Publisher của người nhận sau, vì vậy hai Subscription và demand boundary có thể độc lập. Nếu upstream cho 27,-300,33 thì ba item chỉ thành hai item hợp lệ; để giao đủ ba cho dashboard có thể phải yêu cầu thêm upstream, miễn vẫn không đẩy onNext downstream quá lượt. Tôi kiểm đếm trước/sau filter, xử lý cancel/error ở cả hai phía và không giả một Subscription duy nhất có thể thay cho hai vai trò."
