  - question: "Một thư viện tự nhận 'reactive' nhưng chỉ expose push callback. Bạn xác định nó có tuân Reactive Streams hay không thế nào?"
    answer: "Tôi không suy luận từ nhãn reactive hoặc async. Phải kiểm xem Publisher/Subscriber có quan hệ onSubscribe với Subscription.request(n)/cancel, không gửi onNext vượt demand, tín hiệu serialized và terminal hợp lệ hay không. Với sensor vật lý push không có cách giảm tốc, adapter có thể cần buffer/drop/lỗi quá tải; nó không thể cam kết giảm phát ở nguồn chỉ vì gọi tên Flux. Dùng TCK hoặc test giao thức ở ranh giới thực thay vì HTTP demonstration."
    aiGenerated: true
    reviewed: false
