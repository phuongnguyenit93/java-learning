  - question: "Source chỉ có ba phần tử A,B,C, còn subscriber request(2) rồi request(3). Publisher có bắt buộc phát D,E trước onComplete không? Vì sao?"
    answer: "Không. Hai request tích thành allowance năm, nhưng đó là số onNext tối đa được phép gửi, không phải cam kết tạo thêm dữ liệu. Nguồn gửi A,B,C rồi có thể onComplete với demand còn hai; onComplete không chiếm allowance và không cần chờ request tiếp. Ngược lại nếu nguồn có sáu phần tử thì thứ sáu phải chờ demand mới. Tôi kiểm implementation cộng dồn số lượng an toàn và không nhầm số lần gọi request với tổng lượng yêu cầu."
