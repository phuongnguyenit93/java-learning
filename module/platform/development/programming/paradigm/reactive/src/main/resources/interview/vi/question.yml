    answer: "onError kết thúc vòng đời Subscription; onNext(33) sau đó là tín hiệu hậu terminal không hợp lệ, kể cả client đã từng request nhiều. Nếu cần retry, tôi đặt chính sách tạo phiên nguồn/subscription mới, có giới hạn lần thử, idempotency và lỗi được theo dõi; không che một lần thất bại bằng completion giả. Tôi phân biệt lỗi sensor, lỗi predicate và lỗi subscriber rồi bảo đảm original error không bị cleanup làm mất hoặc thay thế."
