  - question: "Bạn có giá trị 27 ngay bây giờ nhưng 29,33 có thể đến lúc không dự đoán được. Thay đổi nào cần có trong contract khi chuyển từ hàm trả giá trị sang luồng?"
    answer: "Một biểu thức trên 27 chỉ cần định nghĩa input và output. Với 27 lúc 09:00, 29 lúc 09:01, 33 lúc 09:02, còn phải xác định ai bắt đầu theo dõi, các mẫu không có lịch cố định ra sao, kết thúc thành công hay lỗi thế nào, viewer rời đi thì dừng nhận ra sao. Filter có thể là cùng một hàm thuần ở hai mô hình; chính thời gian và vòng đời phát sinh trách nhiệm mới, không phải bản thân kiểu số nguyên."
