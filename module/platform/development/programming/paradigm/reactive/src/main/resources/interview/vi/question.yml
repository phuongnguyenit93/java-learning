  - question: "Bạn thiết kế Publisher từ một danh sách rỗng. Có được gọi onComplete trước request(1) không, và có cần gửi onNext(null) để mở đường không?"
    answer: "Có thể onSubscribe(s) rồi onComplete ngay khi nguồn rỗng; terminal không phải phần tử dữ liệu và không bị khóa bởi demand. Không gửi onNext(null) vì đây không phải cách báo hết dữ liệu và còn vi phạm quy tắc payload. Sau onComplete không còn onNext/onError/onComplete thứ hai. Tôi kiểm một subscriber không request vẫn được completion, đồng thời cleanup resources. Nếu đã có request0 không hợp lệ trước đó thì phải xét lỗi rule 3.9 riêng."
