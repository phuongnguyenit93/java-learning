      methodSignature: ""
  - question: "Trình bày cách bạn giải thích mối quan hệ Reactive paradigm, Reactor, RxJava Observable/Flowable, WebFlux và Java Flow cho nhóm Java."
    answer: "Paradigm đặt câu hỏi về dữ liệu đến theo thời gian. Reactor có Flux/Mono xây trên Publisher, RxJava phân biệt Flowable có backpressure với Observable không cùng demand contract, Java Flow định nghĩa interfaces tương tự và WebFlux cung cấp web stack dựa reactive abstractions. Không có tên nào bảo đảm mã người dùng không gọi JDBC blocking hoặc Thread.sleep. Tôi sẽ kiểm từng kiểu, adapter và boundary trước khi hứa về backpressure hay tài nguyên."
    aiGenerated: true
