  - question: "Một publisher phát A,B sau request(2). Hãy mô tả vết onSubscribe/onNext/terminal hợp lệ và hai vết sai thường gặp."
    answer: "Một vết hợp lệ là onSubscribe(s), subscriber s.request(2), publisher onNext(A), onNext(B), rồi một onComplete khi hết nguồn; onError có thể thay thế onComplete nếu thất bại, không đi sau nó. Vết sai thứ nhất phát C như onNext thứ ba không có thêm demand. Vết sai thứ hai onComplete rồi onNext(C), hoặc onError rồi onComplete. Tôi kiểm serialized callbacks và contract của từng Subscriber thay vì chỉ nhìn log hai item đầu."
