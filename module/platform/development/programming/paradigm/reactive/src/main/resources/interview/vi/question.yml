  - question: "Một thành viên viện dẫn đặc tả Reactive Streams để bảo đảm mọi thao tác SQL và mạng là non-blocking. Bạn phản biện thế nào?"
    answer: "Reactive Streams đặt quy tắc giao tiếp giữa Publisher, Subscriber, Subscription và Processor: tín hiệu tuần tự, giới hạn onNext theo demand và đường kết thúc/hủy. Nó không chuẩn hóa mọi toán tử SQL, không chọn scheduler, không biến JDBC hay HTTP call đang blocking thành không chặn. Tôi chỉ khẳng định điều có thể kiểm với protocol/TCK trên boundary cụ thể; xử lý query và transport cần đo và kiểm riêng, tránh hứa thuộc tính ngoài đặc tả."
