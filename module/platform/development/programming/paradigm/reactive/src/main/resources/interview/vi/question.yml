questions:
  - question: "Bạn thiết kế bảng cảm biến liên tục. Hãy giải thích Reactive Programming cho đồng nghiệp chỉ quen gọi hàm trả một số, và chỉ ra điều gì nó KHÔNG bảo đảm."
    answer: "Với hàm thường ta có thể gọi getTemperature() và nhận 27 tại một thời điểm; luồng phản ứng mô tả cách xử lý những tín hiệu 27,29,33 tới sau đó, có thể không biết trước lịch đến hay điểm kết thúc. Tôi trình bày source, các phép lọc, consumer và ba lối dừng rồi chỉ ra thời điểm subscribe. Mô hình này tự nó không cấp thread, không loại I/O blocking và không chứng minh giao thức request(n); phải kiểm từng triển khai cụ thể."
