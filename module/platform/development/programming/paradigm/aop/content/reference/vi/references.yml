references:
  - title: "AspectJ — Getting Started with AOP"
    url: "https://eclipse.dev/aspectj/doc/latest/progguide/gettingstarted.html"
    description: "Giới thiệu lập trình hướng khía cạnh và crosscutting concerns, giải thích join point, pointcut, advice, aspect và inter-type declaration."
  - title: "AspectJ — Join Points and Pointcuts"
    url: "https://eclipse.dev/aspectj/doc/released/progguide/language-joinPoints.html"
    description: "Tập hợp join points, phân biệt call và execution, phối hợp pointcut qua &&, ||, ! và quy tắc chọn pointcut hiệu quả."
  - title: "AspectJ — Advice"
    url: "https://eclipse.dev/aspectj/doc/released/progguide/language-advice.html"
    description: "Before, after, after returning, after throwing và around/proceed; khai thác ngữ cảnh lúc chặn điểm thực thi."
  - title: "AspectJ — Inter-type Declarations"
    url: "https://eclipse.dev/aspectj/doc/released/progguide/language-interType.html"
    description: "Static crosscutting: bổ sung field/method/constructor và quan hệ kiểu để mô-đun hóa đặc tính dùng chung."
  - title: "AspectJ — Aspect Semantics and Instantiation"
    url: "https://eclipse.dev/aspectj/doc/released/progguide/semantics-aspects.html"
    description: "Định nghĩa aspect, cách tạo thể hiện, singleton, perthis/pertarget, phạm vi trạng thái và thứ tự ảnh hưởng giữa các aspect."
  - title: "AspectJ — Language Semantics"
    url: "https://eclipse.dev/aspectj/doc/latest/progguide/semantics.html"
    description: "Chi tiết ngữ nghĩa join points, pointcuts, advice, cflow, context binding và quan hệ giữa crosscutting động và tĩnh."
  - title: "AspectJ — Load-Time Weaving"
    url: "https://eclipse.dev/aspectj/doc/latest/devguide/ltw.html"
    description: "So sánh compile-time, post-compile và load-time weaving; class loader, weaving agent và cấu hình aop.xml."
  - title: "AspectJ — Implementation Notes"
    url: "https://eclipse.dev/aspectj/doc/latest/progguide/implementation.html"
    description: "Các giới hạn do bytecode và phạm vi weaving, đặc biệt khác biệt call/execution, quanh advice và hiệu năng/matching."
  - title: "AspectJ — Development Environment Guide"
    url: "https://eclipse.dev/aspectj/doc/latest/devguide/devguide.html"
    description: "Công cụ ajc, biên dịch, weaving class/JAR và triển khai/kiểm tra các aspect độc lập với framework."
  - title: "AspectJ — FAQ"
    url: "https://eclipse.dev/aspectj/doc/latest/faq/faq.html"
    description: "Các câu hỏi nền tảng và nâng cao về mục đích AOP, điểm cắt, advice, khía cạnh, inter-type declaration và weaving."
