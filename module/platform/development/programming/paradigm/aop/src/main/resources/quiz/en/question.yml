  apiRelated:
    controller: ''
    methodSignature: ''
  answers:
    - id: A
      answer: 'An explicit wrapper around the two calls'
      explanation: 'A wrapper makes the advised call sites visible without introducing pointcut indirection.'
    - id: B
      answer: 'An aspect matching every method in the application'
      explanation: 'Application-wide matching is broader than the requirement and harder to verify.'
    - id: C
      answer: 'An advice intercepting all normal returns'
      explanation: 'Intercepting all returns is overly broad and may ignore exception paths.'
    - id: D
      answer: 'A proxy with a pointcut covering every method in both services'
      explanation: 'Method interception is possible, but matching every method is broader than the two calls requiring timing.'
