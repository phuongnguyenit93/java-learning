  - question: >-
      Bạn có pointcut dựa theo tên save* nhưng đội nghiệp vụ đổi tên persistOrder và xuất hiện saveDraft không cần audit. Bạn xây chiến lược test và rule bền vững hơn thế nào?
    answer: >-
      Tôi coi rule chọn điểm như một predicate cần kiểm cả false negative và false positive: persistOrder phải được chọn nếu thuộc phạm vi, còn saveDraft phải loại nếu không thuộc. Chỉ thấy một lời gọi saveOrder có log là bằng chứng rất yếu. Chọn theo responsibility boundary ổn định hơn wildcard tên tuỳ tiện; khi đổi tên hay module phải chạy lại coverage matrix. Một rule đúng cú pháp vẫn có thể sai semantics, và đổi loại advice không chữa được lựa chọn sai.
    aiGenerated: true
    reviewed: false
