  - question: >-
      Một yêu cầu compliance nói phải audit mọi lần gán trực tiếp balance, kể cả khi không gọi setter. Nếu chỉ có Spring AOP, bạn đề xuất hướng xử lý nào và nói rõ giới hạn gì?
    answer: >-
      Spring AOP proxy chỉ quan sát method execution đủ điều kiện, nên không thể bắt trực tiếp mọi field assignment bằng cách mở rộng pointcut. Setter advice chỉ thấy đường gọi setter đi qua proxy; lệnh ghi field nội bộ không nhất thiết đi qua nó. Có thể thay đổi thiết kế để tập trung cập nhật qua một boundary được kiểm soát, hoặc dùng weaving có join point loại field-set phù hợp. Mỗi lựa chọn cần test đường bypass và đánh giá chi phí, không đưa ra lời hứa capture mọi phép ghi.
