  - question: >-
      Trace external→proxy.execute()→target.this.verify() không xuất hiện advice của verify. Vì sao đây không phải lỗi pointcut, và giải pháp đặt ở đâu?
    answer: >-
      External call đến proxy.execute có thể được advice, sau đó thân execute trên target gọi this.verify trực tiếp mà không quay qua proxy. Advice của verify thuộc lớp interceptor proxy nên không thấy self-invocation, dù rule có thể match một lần proxy.verify từ bên ngoài. Đây là đặc điểm call path chứ không nhất thiết lỗi tên pointcut. Tôi cân nhắc điều chỉnh đường đi qua boundary được quản lý, tách trách nhiệm đúng lớp hoặc dùng model weaving khác; cơ chế Spring chi tiết thuộc module framework.
