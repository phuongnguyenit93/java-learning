  - question: >-
      Một policy audit bị bỏ ở nhánh return sớm của một service, nhưng team muốn chỉ thêm aspect rồi coi như xong. Bạn sẽ lập test coverage và chỉ ra rủi ro mới thế nào?
    answer: >-
      Tôi lập ma trận các điểm thực thi dự kiến có audit, gồm success, early return và thrown error, rồi thêm các điểm ngoài phạm vi để kiểm overmatch. Một aspect có thể xử lý tập trung nhưng pointcut sai lại bỏ sót đồng loạt hoặc audit nhầm thao tác nhạy cảm. Nếu dùng before/after phải xác định loại advice nào bao đường lỗi; không giả định after-returning chạy khi ném ngoại lệ. Test cần đi qua interceptor/weaver thực, không chỉ gọi trực tiếp target.
