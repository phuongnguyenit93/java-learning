questions:
  - question: >-
      Bạn được yêu cầu đo độ trễ ở ba nghiệp vụ chuyển tiền, lập hóa đơn và kiểm kho. Hãy lập luận phần nào thuộc domain, phần nào là cross-cutting concern, và tại sao không chỉ đơn giản đặt mọi thứ vào một service chung?
    answer: >-
      Ba nghiệp vụ giữ các bất biến và kết quả riêng: chuyển tiền bảo vệ số dư, hóa đơn xác định giá và kiểm kho quản lý số lượng. Chính sách đo elapsed time, gắn correlation ID hay định dạng audit cần nhất quán ở nhiều đường thực thi nên là concern xuyên suốt. Một service khổng lồ gom cả ba nghiệp vụ sẽ trộn quyền sở hữu và tạo coupling. AOP cung cấp một trục ghép hành vi bổ sung tại các điểm chọn được; nó không sở hữu kết quả chuyển tiền và không thay thế việc kiểm tra đúng sai của domain.
