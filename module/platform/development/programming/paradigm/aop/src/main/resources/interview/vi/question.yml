  - question: >-
      Hai dự án cùng dùng cú pháp @Aspect nhưng một dự án chỉ bật Spring AOP proxy, dự án kia có AspectJ weaving. Bạn diễn giải khác biệt cho người review thế nào?
    answer: >-
      Cú pháp @Aspect mô tả aspect, không chứng minh class bytecode đã bị dệt. Với Spring proxy, caller phải đi qua proxy trên method đủ điều kiện; gọi trực tiếp target hoặc self-invocation có thể bỏ qua advice. Với AspectJ, weaving có thể sửa bytecode lúc build hoặc lúc load và hỗ trợ các join point khác như một số field access. Khi điều tra thiếu log, tôi kiểm cơ chế ghép thực tế, loại join point, eligibility và đường gọi; không chỉ nhìn annotation.
    aiGenerated: true
