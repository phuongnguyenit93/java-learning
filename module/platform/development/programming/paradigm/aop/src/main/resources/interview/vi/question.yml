  - question: >-
      Một reviewer đề xuất around advice gọi proceed hai lần để khắc phục lỗi tạm thời trong transferFunds. Bạn lập trace cho 0, 1 và 2 lần proceed và đánh giá rủi ro thực tế.
    answer: >-
      Với 0 proceed, target không chạy; nếu advice trả success, caller có thể tưởng tiền đã được chuyển. Với 1 proceed, target thực thi một lần và advice nên truyền nguyên result hoặc exception sau khi ghi timing. Với 2 proceed trong model cho phép, target có thể chuyển tiền hai lần, không chỉ sinh hai log; nếu lượt đầu thành công còn lượt sau lỗi, state càng khó suy luận. Retry nghiệp vụ cần hợp đồng idempotency và transaction riêng, không thể mặc định từ timing aspect.
