  - question: >-
      Bạn cần timer ghi đầy đủ trên cả success và exception. Phân tích vì sao after-returning khác after-throwing, và khi nào around/finally là lựa chọn phù hợp.
    answer: >-
      After-returning chỉ chạy khi hoàn thành bình thường, after-throwing xử lý đường ném lỗi, còn after-finally chạy ở cả hai đường nhưng bản thân nó chưa giữ được thời điểm bắt đầu. Around phù hợp khi cùng một advice cần lưu mốc bắt đầu và tính elapsed time: ghi thời điểm, gọi proceed đúng một lần, đo thời lượng trong finally rồi giữ nguyên return hoặc ném tiếp exception gốc. Nếu chính bước xuất metric có thể lỗi thì cũng phải cô lập nó khi chính sách không cho phép che kết quả nghiệp vụ. Before chạy trước target và vẫn có thể ngăn target nếu ném lỗi. Hãy chọn advice hẹp nhất đủ dùng vì bỏ hoặc lặp proceed thay đổi luôn thao tác chuyển tiền.
