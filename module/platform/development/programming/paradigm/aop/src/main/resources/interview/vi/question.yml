  - question: >-
      Production chạy thiếu advice dù môi trường phát triển có load-time weaving. Bạn phân tích nguyên nhân tiềm năng theo lifecycle mà không nhầm sang proxy ra sao?
    answer: >-
      Load-time weaving biến đổi bytecode lúc class được nạp, trước khi chạy bình thường; sự khác biệt về thời điểm class load, class loader và cấu hình instrumentation có thể khiến class chưa được weave như dự định. Tôi kiểm evidence class đã biến đổi, rule có match và agent có hiệu lực trước khi class cần xử lý được load. Đây là một ranh giới khác compile-time weaving ngay trong build và khác proxy cần caller đi qua đối tượng trung gian. Việc triển khai agent cụ thể thuộc module AspectJ.
