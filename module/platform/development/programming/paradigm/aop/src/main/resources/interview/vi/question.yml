  - question: >-
      Khi source của target không chứa lệnh audit nhưng bytecode chạy thật lại có audit từ AspectJ compile-time weaving, bạn chứng minh điều gì về ranh giới source và execution?
    answer: >-
      Compile-time weaving đưa behavior được chọn vào bytecode tạo khi build. Vì thế đọc riêng source target không đủ thấy mọi thao tác được thực thi; cần kiểm cấu hình build và output class đã weave. Đây không phải runtime proxy chỉ bọc lời gọi và cũng không phải load-time transformation khi class loader đang nạp. Để debug, tôi xác nhận artifact đang chạy chứa weaving mong đợi, cùng test matched/unmatched và đường exception, không khẳng định một annotation đơn lẻ đã kích hoạt trình dệt.
    aiGenerated: true
    reviewed: false
    readmeRelated:
