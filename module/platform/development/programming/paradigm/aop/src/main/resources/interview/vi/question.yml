  - question: >-
      Nếu nghiệp vụ muốn ghi nhận mỗi lần field balance bị ghi và mỗi lần transferFunds thực thi, bạn sẽ lựa chọn AOP model dựa trên join point ra sao?
    answer: >-
      Join point là loại sự kiện trong execution model mà cơ chế AOP có thể quan sát, không phải chuỗi tên phương thức. Spring AOP proxy chủ yếu intercept method execution trên managed bean, không có field-set join point; nới pointcut không mở thêm loại sự kiện. AspectJ weaving hỗ trợ mô hình rộng hơn, trong đó có một số field access và constructor join point. Tôi sẽ xác định bằng chứng runtime cần quan sát, rồi chọn module công nghệ sở hữu việc thiết lập weaving; không hứa Spring @Aspect tự bắt được phép gán.
    aiGenerated: true
    reviewed: false
    readmeRelated:
