  - question: >-
      Một thiết kế tách CHECK, DEBIT, CREDIT thành ba advice chạy quanh transferFunds. Vì sao đây có thể làm hỏng khả năng chứng minh tính đúng đắn dù mã service ngắn hơn?
    answer: >-
