  - question: >-
      Một timing advice vừa ghi thời lượng vừa gọi một dịch vụ ngoài dễ ném lỗi. Bạn đánh giá tính an toàn của advice so với nghiệp vụ gốc thế nào?
    answer: >-
      Advice thêm hành vi tại join point được chọn nhưng bản thân nó có thể ném exception, sửa return hoặc đổi đường thực thi. Tôi xác định chính sách: với timing thông thường, lỗi của dịch vụ metric không được thay đổi kết quả chuyển tiền. Tôi đo cả nhánh thành công và ném lỗi bằng cleanup kiểu finally, đồng thời phải bắt và cô lập lỗi khi gửi metric theo chính sách đó; nếu telemetry ném lỗi ngay trong finally, nó có thể che exception gốc hoặc khiến giao dịch đã thành công bị báo thất bại. Ghi nhận lỗi telemetry riêng, không lộ số tài khoản, giữ nguyên kết quả hoặc exception nghiệp vụ; kiểm đủ tổ hợp target thành công/thất bại, telemetry thành công/thất bại và điểm không khớp.
