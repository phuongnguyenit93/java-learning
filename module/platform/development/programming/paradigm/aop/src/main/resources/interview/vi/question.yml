  - question: >-
      Bạn phải triển khai timing cho transferFunds và createInvoice, bao cả lỗi nhưng không được lộ số tài khoản. Hãy đưa một ma trận kiểm chứng đủ để duyệt thiết kế.
    answer: >-
      Tôi liệt kê matched transfer và invoice success, matched thrown failure và các lời gọi unmatched như renderPage. Hai nhóm matched phải có elapsed timing ngay cả khi lỗi; unmatched không có timing; response và exception gốc giữ nguyên trừ khi contract nói khác. Log chỉ chứa correlation ID đã kiểm quyền và thông tin lỗi an toàn, không raw account number hoặc credential. Thêm ca around 0/1/2 proceed và nhiều advice overlap để phát hiện thay đổi tác động nghiệp vụ; dùng integration path đúng proxy/weaver, không giả lập HTTP response trong module paradigm.
