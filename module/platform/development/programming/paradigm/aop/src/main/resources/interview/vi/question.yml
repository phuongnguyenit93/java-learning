  - question: >-
      Giải thích cho đồng nghiệp tại sao nhìn source transferFunds không đủ dự đoán trace runtime khi aspect timing xuất hiện và khi nào around có thể đổi luôn ý nghĩa nghiệp vụ.
    answer: >-
      Target chịu trách nhiệm chuyển tiền, aspect định nghĩa đo thời gian, pointcut chọn join point đủ điều kiện và advice chèn hành vi vào execution. Trace qua boundary có thể là timing-start, target, result, timing-end; gọi renderPage ngoài rule không có timing. Một around advice có quyền không gọi proceed và tự trả kết quả; khi đó caller có thể thấy thành công giả dù transfer không xảy ra. Vì vậy review phải xét effective execution và hợp đồng trả về, không chỉ các dòng nằm trong target.
