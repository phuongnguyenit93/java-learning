  - question: >-
      Một team chuyển kiểm tra số dư từ TransferService sang aspect ghi log vì muốn giảm duplicate. Bạn phản biện bằng nguyên lý phân tách mối quan tâm và ranh giới trách nhiệm như thế nào?
    answer: >-
      Separation of concerns là nguyên lý rộng; AOP chỉ là một kỹ thuật tổ chức concern xuyên qua nhiều đối tượng. Kiểm tra đủ tiền quyết định tính hợp lệ của một chuyển khoản và invariant tài khoản, nên phải ở thành phần domain có quyền sở hữu quyết định đó. Timing, tracing và chuẩn hóa audit dùng chung có thể đặt ở aspect độc lập nếu selection rõ. Giấu balance validation vào timing aspect khiến lời gọi bypass aspect có thể sai nghiệp vụ và lỗi khó truy vết; giảm số dòng không bù được mất quyền sở hữu.
