  - question: >-
      Một nhóm muốn thay ba wrapper timing bằng một aspect vì nghĩ sẽ tự giảm mọi lỗi. Bạn lập điều kiện acceptance nào để lợi ích tập trung policy là có thật?
    answer: >-
      Lợi ích là một nơi giữ định dạng timing và rule chọn execution points thay vì ba bản cập nhật dễ lệch. Nhưng tôi yêu cầu tập matched gồm đúng các thao tác cần đo, unmatched không bị ảnh hưởng, success và failure đều ghi thời lượng, error/result không đổi và dữ liệu nhạy cảm được che. Nếu pointcut dựa tên dễ đổi hoặc cấu trúc quá rộng, centralization có thể tăng coupling thay vì giảm. So với wrapper, phải đánh giá chi phí truy vết hành vi ngoài source.
