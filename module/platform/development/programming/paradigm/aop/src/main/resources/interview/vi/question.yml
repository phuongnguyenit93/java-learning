  - question: >-
      Một service có phương thức verify hợp lệ để advice, nhưng gọi trực tiếp target không có log trong khi gọi proxy.verify lại có. Bạn giải thích và chọn test đúng thế nào?
    answer: >-
      Proxy là lớp trung gian nhận call từ caller, chạy advice khi method đủ điều kiện và delegate tới target. Lời gọi trực tiếp tới target đi vòng ngoài proxy nên không được chặn, dù method cùng tên và có annotation liên quan. Tôi kiểm đường external caller → proxy → target và so với direct target, không chỉ kiểm method declaration. Integration test phải đi qua bean proxy thực để chứng minh coverage của Spring AOP; kiểm target riêng vẫn hữu ích cho domain nhưng không đủ cho advice.
