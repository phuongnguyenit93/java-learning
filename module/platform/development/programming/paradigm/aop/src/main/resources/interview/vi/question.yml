  - question: >-
      Bạn review một class có các hàm logStart/logEnd được gọi thủ công từ service. Điều gì còn thiếu để gọi nó là một aspect hoàn chỉnh theo mental model AOP?
    answer: >-
      Hai helper chỉ cung cấp hành vi, caller còn phải biết lúc nào gọi chúng. Một aspect mô-đun hóa cùng concern và mô tả tiêu chí chọn những execution points nhận advice, qua cơ chế ghép mà implementation hỗ trợ. Tôi phải xem pointcut có chọn đúng phạm vi, advice có giữ nguyên outcome và cách các đường lỗi được xử lý không. Một class đặt tên Aspect hoặc gắn annotation không chứng minh đã có weaving/interception thật; bản chất nằm ở hành vi runtime được ghép.
