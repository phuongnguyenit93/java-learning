  - question: >-
      Năm nhóm đã tự chép mã startTimer và logElapsed vào năm service. Khi có yêu cầu che dữ liệu nhạy cảm và đo cả đường lỗi, bạn sẽ tìm rủi ro ở đâu trước khi quyết định dùng AOP?
    answer: >-
      Tôi kiểm từng bản sao ở đường thành công, return sớm và exception, tìm nơi thiếu finally và nơi log raw account number. Một thay đổi định dạng thực hiện ở bốn nơi nhưng quên nơi thứ năm chính là policy drift. Centralize có thể giảm các bản sao, nhưng rule chọn điểm quá rộng cũng gây rủi ro mới. Trước khi dùng aspect, tôi xác định rõ dịch vụ nào cần timing, yêu cầu redaction, failure semantics và cách test tập matched/unmatched; không lấy số dòng giảm làm bằng chứng duy nhất.
