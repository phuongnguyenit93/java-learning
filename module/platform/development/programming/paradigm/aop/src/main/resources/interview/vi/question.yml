      Giả sử tất cả timing advice bị tắt nhưng transferFunds vẫn chuyển được tiền. Hợp đồng nào phải tiếp tục đúng và tại sao?
    answer: >-
      Target vẫn phải kiểm điều kiện tài khoản, bảo toàn bất biến, phát hiện thiếu tiền và quản lý state chuyển khoản đúng như cam kết. Aspect đo thời gian hay correlation chỉ quan sát hoặc bổ sung concern dùng chung, không được là nơi duy nhất kiểm số dư. Nếu logic domain chỉ đúng khi advice có mặt, việc direct target call hay thay công nghệ interceptor sẽ khiến hệ thống sai. Tôi dùng test target để xác nhận bất biến và integration test qua aspect để xác nhận phần cross-cutting.
