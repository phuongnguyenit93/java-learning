  - question: >-
      Một hệ thống chỉ có hai đường gọi cần timing. Hãy thiết kế helper, wrapper hoặc decorator phù hợp, rồi nêu điều kiện thực sự khiến bạn đổi sang aspect.
    answer: >-
      Helper dễ dùng khi caller chủ động gọi đo trước và sau nhưng phải nhớ cả nhánh lỗi. Wrapper bao quanh lời gọi, giữ start và finally cùng một chỗ; decorator giữ nguyên hợp đồng interface rồi delegate sang target. Với hai call site, đường gọi tường minh dễ review hơn pointcut ẩn. Tôi chỉ cân nhắc aspect khi concern lan qua nhiều boundary ổn định, việc đăng ký wrapper thủ công dễ bỏ sót và có thể đo kiểm chính xác phạm vi được chọn.
