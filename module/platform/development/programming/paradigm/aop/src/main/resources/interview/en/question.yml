  - question: >-
      A team wants to replace three explicit timing wrappers with one aspect. Which acceptance checks justify claiming centralization was genuinely beneficial?
    answer: >-
      One shared policy can eliminate drift across three copies, but only if the pointcut selects precisely the intended methods and maintainers can discover its effect. I demand matched success and failure timing, unmatched calls left alone, original result and exception preservation, and appropriate redaction of private values. I also compare diagnosis and maintenance cost against the original visible wrappers. A broad wildcard or unexplained advice precedence may increase hidden coupling instead of reducing it.
