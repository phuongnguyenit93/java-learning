  - question: >-
      Two around advices match transferFunds and each logs exactly once, but sometimes the final result differs. Which evidence can identify their ordering defect?
    answer: >-
      Counting invocations or finding two annotations does not establish the nesting order. I trace each advice's entry and exit, every proceed call, actual target execution count and the return or exception observed by inner and outer layers. Changing precedence can cause one layer to translate or suppress a failure before the other sees it. I also check matched and unmatched cases to rule out unexpected selection. The design should document precedence instead of relying on incidental registration order.
