  - question: >-
      An audit helper is skipped by an early return. A developer proposes replacing all manual calls with one aspect and declaring coverage fixed. What test evidence would you demand?
    answer: >-
      I enumerate required success, early-exit and failure paths, plus unrelated paths that should not be audited. The test must show the expected records appear on matching events and never leak into nonmatching operations. Centralizing the concern merely changes the failure mode: a wrong pointcut might miss every renamed handler or include sensitive operations. I also verify advice kind and actual proxy or weaving boundary, because an after-returning hook cannot account for thrown exceptions.
