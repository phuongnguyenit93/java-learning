  - question: >-
      A save* pointcut includes saveDraft but misses a renamed persistOrder operation. How would you test and redesign the selection rule?
    answer: >-
      I treat a pointcut as a predicate with both false positives and false negatives. Tests explicitly exercise intended operations such as persistOrder and excluded ones such as saveDraft, with observable advice traces. A single successful saveOrder trace does not prove that coverage is correct. A selection based on stable responsibilities is usually safer than an arbitrary naming wildcard. Renames and package changes must trigger renewed coverage tests, and switching advice kind cannot repair an incorrect selection predicate.
