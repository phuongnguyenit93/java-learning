questions:
  - question: >-
      You must measure latency for transfers, invoices and inventory operations. Explain which responsibilities belong to the domains and which cut across them, without creating a giant shared service.
    answer: >-
      Transfers own balance rules, invoicing owns pricing and inventory owns stock changes. Consistent elapsed-time measurement, correlation and audit formats are policies needed at several unrelated execution boundaries. A giant service would mix these separate business responsibilities and increase coupling. AOP introduces another way to organize common behavior around selected execution points without owning the domain result. I would define the policy and interception scope independently, then confirm the original business invariants still hold.
    aiGenerated: true
