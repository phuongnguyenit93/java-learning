  - question: >-
      Two applications declare @Aspect, but one uses Spring proxies while the other weaves AspectJ bytecode. Which debugging assumptions would change?
    answer: >-
      @Aspect describes aspect syntax, not proof that bytecode has been woven. A Spring proxy intercepts eligible bean method executions only when the caller crosses the proxy boundary, leaving direct target and self calls as potential bypasses. AspectJ may weave at compile time or load time and expose other join points, such as certain field accesses. I inspect the actual integration mechanism, matching rules and call paths when a trace is missing instead of assuming annotations imply identical interception scope.
    aiGenerated: true
