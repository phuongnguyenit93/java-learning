  - question: >-
      Why is reading transferFunds source insufficient to predict runtime behavior once a timing aspect is installed, and how could around advice violate the transfer contract?
    answer: >-
      A target implements the transfer; a pointcut selects eligible execution join points; advice adds the timing behavior through the chosen composition mechanism. A matching call can execute timer-start, transfer, timer-end, while renderPage remains unaffected. But an around advice can skip proceed and invent a return value, so the caller may see success despite no transfer. I therefore inspect actual execution traces and invariants rather than assuming all effective behavior is visible inside the target's source.
