  - question: >-
      Every timing aspect is disabled, yet transferFunds remains callable. Which guarantees should continue to hold and how would you test the separation?
    answer: >-
      The target must continue checking sufficient funds, maintaining account invariants, rejecting invalid requests and handling its own domain state changes. Timing or correlation metadata does not inherit ownership of these rules. If correctness holds only when advice is present, direct target calls or a new interceptor setup can silently break the application. I test domain behavior without aspects and separately test instrumentation through the real proxy or weaving path so the two responsibilities remain explicit.
