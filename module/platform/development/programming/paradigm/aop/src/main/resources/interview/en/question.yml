  - question: >-
      A security policy demands observing every direct assignment to balance, including assignments that never call a setter. Why is Spring AOP method advice insufficient and what alternatives have limits?
    answer: >-
      Spring proxy AOP offers eligible method execution join points and cannot match arbitrary field-set operations by simply broadening its pointcut. Intercepting setters covers only calls to setters that traverse the proxy; internal field updates need not use them. A design can centralize mutations behind an auditable method boundary, or it can choose a weaving implementation that supports suitable field join points. Both require coverage tests for bypass paths and operational trade-off analysis, not a promise of universal interception.
    aiGenerated: true
    reviewed: false
