  - question: >-
      An engineer proposes calling proceed twice in an around advice to retry transferFunds. Explain the behavior when proceed is called zero, one and two times.
    answer: >-
      With zero calls the target is skipped, so returning a success-shaped value can falsely imply money moved. One call executes the target once while timing should preserve its success or failure result. In an implementation allowing two calls, the target may transfer money twice rather than merely emitting two timing lines; success followed by failure can leave complicated partial effects. Retries require explicit idempotency and transaction policies belonging to the business, not a default property of timing advice.
    aiGenerated: true
    reviewed: false
    readmeRelated:
