  - question: >-
      An external call reaches proxy.execute, after which target.execute calls this.verify. Why is verify advice missing and why is this not necessarily a pointcut bug?
    answer: >-
      The initial call crossed the proxy, but the internal this.verify invocation remains within the target and never goes back out through that proxy. An eligible external proxy.verify call might still be intercepted, proving that pointcut selection was not the root cause. I compare these two call paths and consider a proper managed boundary, responsibility extraction or bytecode weaving if the requirement truly needs interception there. The Spring implementation details belong to the framework module.
