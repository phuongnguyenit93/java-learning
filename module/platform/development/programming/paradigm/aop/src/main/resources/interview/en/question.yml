  - question: >-
      A team puts balance validation inside its timing aspect to shorten TransferService. Explain why this violates a useful responsibility boundary even though both are concerns.
    answer: >-
      Separation of concerns is broader than AOP; aspects are one technique to express behavior spanning independent business responsibilities. Balance validation decides whether this particular transfer is valid and protects a domain invariant. It belongs with the owner of the account operation, not an optional measurement boundary. Timing and common tracing can be aspects if selection is reliable. Otherwise a direct target call or different weaving configuration might bypass the only balance check, violating correctness for the sake of shorter source.
