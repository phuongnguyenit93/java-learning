  - question: >-
      A proposed design implements CHECK, DEBIT and CREDIT as three advices around transferFunds. How could this obscure an invalid partial transfer?
    answer: >-
      These operations change money-related state and their ordering is part of the business contract. Splitting them among advices with unclear precedence makes it harder to see whether debit occurred before a failed credit or who must recover. An aspect never guarantees transaction atomicity merely because it surrounds a method. I would keep the explicit transfer orchestration under a domain coordinator and use aspects only for well-bounded timing or auditing, testing both partial failure and state postconditions.
