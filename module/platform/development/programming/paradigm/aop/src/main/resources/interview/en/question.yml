  - question: >-
      You find a class with logStart and logEnd methods invoked manually in every service. What additional role would justify treating it as a timing aspect rather than a helper library?
    answer: >-
      The methods implement reusable behavior, but callers still choose when to invoke them. A full AOP design packages the cross-cutting policy together with a rule selecting execution join points, then composes advice through a mechanism that can actually observe those points. I review the rule, eligible targets, success and error handling, and whether returned results remain unchanged. Calling the class Aspect or adding annotations is not proof that weaving or proxy interception is actually active.
