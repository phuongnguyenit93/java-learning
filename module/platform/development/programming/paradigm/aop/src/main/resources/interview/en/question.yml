  - question: >-
      Five teams copied startTimer and logElapsed into services. New requirements demand exception timing and removal of sensitive identifiers. How would you assess policy drift before proposing aspects?
    answer: >-
      I compare all copies on successful return, early return and thrown failure, noting missing finally paths and any raw account values in logs. Four corrected copies and one outdated copy already demonstrate policy drift. Centralizing timing could reduce divergence, but a broad or fragile pointcut can introduce new mistakes. I first establish exact eligible calls, privacy requirements, failure handling and a matched/unmatched test matrix; saving lines of code alone is not enough justification.
