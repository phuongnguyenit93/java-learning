  - question: >-
      Choose between centralizing correlation-ID propagation and centralizing transfer approval in aspects. What makes one a better fit?
    answer: >-
      Correlation metadata or timing can recur across operations whose domain meanings differ, using a stable selection rule and relatively uniform behavior. Approval based on account balances is an invariant-driven business decision and should remain under clear domain ownership and visible control flow. I ask whether the concern spans independent boundaries, whether selection can be verified and whether its failure modes are controlled. Security requirements may also be cross-cutting but demand deliberate authority and failure contracts rather than an aspect applied indiscriminately.
