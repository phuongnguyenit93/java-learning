  - question: >-
      Only two clearly identified calls require timing. Compare an explicit helper, wrapper and decorator before deciding whether an aspect is appropriate.
    answer: >-
      A helper is straightforward but relies on each caller remembering both the start and the error-completion path. A wrapper places entry and finally-style completion around a delegated operation, while a decorator preserves the wrapped object's interface and adds behavior on a visible call path. For two calls this may be much clearer than an implicit pointcut. I consider an aspect when the concern genuinely spans many stable boundaries and I can verify both selection accuracy and actual interception behavior.
    aiGenerated: true
