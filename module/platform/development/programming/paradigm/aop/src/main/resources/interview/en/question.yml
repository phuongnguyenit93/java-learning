  - question: >-
      Timing must include successful completion and thrown failures without replacing the original error. Contrast advice kinds and explain when around is necessary.
    answer: >-
      After-returning covers normal completion and after-throwing covers exceptional exits; an after-finally advice runs on either exit but does not by itself retain a start timestamp. Around is useful when one advice must own both the start time and elapsed-time calculation: record the start, call proceed exactly once, and measure in finally while returning the original result or rethrowing the original exception. Measurement/export code must itself be guarded if telemetry failure is not allowed to mask the target outcome. Before runs ahead of the target and can prevent execution by throwing. Prefer the least powerful suitable advice, because skipping or repeating proceed changes the underlying business operation.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.Terminology/Terminology.md'
      anchor: 'aop-advice-kinds'
