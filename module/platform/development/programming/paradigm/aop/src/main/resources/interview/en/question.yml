  - question: >-
      A compliance rule wants to observe both executions of transferFunds and direct assignments to balance. How would you use join-point capabilities to choose an implementation honestly?
    answer: >-
      A join point is an event made available by a specific execution model, not just a matching method name. Spring AOP proxies mainly advise eligible method execution on managed beans, not arbitrary field-set events. Widening a pointcut cannot turn a direct field write into such a method event. AspectJ weaving supports a richer join-point model, including certain field operations and constructor-related events. I specify the evidence needed and select the implementation owner rather than pretending @Aspect alone intercepts everything.
