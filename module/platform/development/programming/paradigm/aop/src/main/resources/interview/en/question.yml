  - question: >-
      Design an acceptance matrix for timing transferFunds and createInvoice across success and error paths without exposing account data.
    answer: >-
      I include matching successful transfers and invoices, matching thrown failures, and nonmatching calls such as renderPage. Matching paths must record elapsed time on both normal and exceptional exit, while nonmatching paths remain uninstrumented. Timing should preserve the target's actual result or exception; logs must redact raw account numbers and credentials and carry only approved metadata. I add tests for around advice skipping or repeating proceed and for overlapping advice to detect hidden business effects, using the real chosen proxy or weaving path rather than invented HTTP output.
