  - question: >-
      A timing advice sends telemetry to a third-party service that sometimes fails. What behavioral contract should govern this cross-cutting code?
    answer: >-
      Advice is behavior added at selected join points and can itself throw, replace a value or influence target execution. I establish whether telemetry failure may ever fail a money transfer; for an ordinary timing requirement it should not replace the original domain outcome. I measure both normal and exceptional exits in finally-style cleanup, but also guard the telemetry write according to that policy: a metrics-client exception thrown from finally could otherwise mask the transfer's original exception or turn a successful transfer into an apparent failure. I record the telemetry failure separately without leaking account data, preserve the target result or original exception, and test target success/failure crossed with telemetry success/failure and unmatched calls.
