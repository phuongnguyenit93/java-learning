  - question: >-
      A load-time-woven advice works in development but disappears in production. How would you reason about lifecycle rather than incorrectly blaming a proxy?
    answer: >-
      Load-time weaving transforms class bytecode during class loading, before regular execution of that class. Class-loader differences, agent configuration or a class loaded before instrumentation becomes effective can change the result. I inspect evidence that the relevant class was actually transformed and the intended pointcut selected the execution. This is neither a compile-time transformation already stored in the build output nor a runtime proxy requiring callers to traverse an intermediary. Technology-specific agent setup belongs to the AspectJ implementation lesson.
