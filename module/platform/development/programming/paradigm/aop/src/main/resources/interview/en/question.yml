  - question: >-
      AspectJ compile-time weaving produces audit behavior absent from the target source. What evidence establishes that the deployed binary really implements it?
    answer: >-
      Compile-time weaving combines selected behavior into output bytecode during the build, so target source alone does not reveal every runtime action. I inspect the configured weaving build and the actual emitted class artifact, then run matched, unmatched and error-path checks. This is different from transforming classes during loading and different from merely routing calls through runtime proxies. An annotation without the configured weaving stage is not evidence that the final binary contains the audit behavior.
    aiGenerated: true
    reviewed: false
