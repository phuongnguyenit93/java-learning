  - question: >-
      A test of proxy.verify emits timing, while direct target.verify emits none. Describe the call paths and the appropriate evidence for Spring AOP.
    answer: >-
      A proxy receives an external invocation, runs matching advice and delegates to the actual target. A direct target call avoids this interception layer despite using the same method and parameters. I compare caller-to-proxy-to-target with caller-to-target traces instead of trusting the method declaration alone. A target unit test can validate domain invariants but is not sufficient proof that advice is active. An integration test should use the real managed proxy and verify eligible interception boundaries.
