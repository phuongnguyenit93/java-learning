OrderPreviewController:
  preview(Map<String,Object>,int):
    summary: Validate an untrusted order map and inspect an immutable data transformation
    description: Submit a JSON object with id, status=pending, and nested lines containing
      sku, qty, and price. An independent schema checks the shape at the HTTP trust
      boundary before any calculation. On success observe the original nested snapshot
      and the separately derived discounted order; on failure inspect field paths
      such as lines[1].qty. Duplicate JSON keys or malformed JSON return HTTP 400
      before schema validation; valid JSON with a wrong shape returns HTTP 422. No
      payment, storage, or external mutation occurs.
    enableVideoYoutube: false
    videoYoutubeId: ''
    videoYoutubeTitle: ''
    readmeRelated:
      file: 6.DataFlow/knowledge/DataFlow.md
      anchor: dop-flow-scenario
    methodName: preview
    params:
    - name: order
      summary: Generic nested order data
      description: JSON object with nonblank id and sku strings of at most 64 characters, status=pending, and 1..20 lines with positive integer qty and nonnegative integer price. Try a missing field or -3 quantity. Duplicate JSON object keys are rejected with HTTP 400 before shape validation; syntactically valid schema failures return 422.
    - name: discountPercent
      summary: Discount as whole percent from 0 to 100
      description: Optional query parameter, default 10. The preview computes a rounded two-decimal total in illustrative price units.
    path: com/example/learning/dop/OrderPreviewController.java
    mapping: '@PostMapping(path = "/preview", consumes = MediaType.APPLICATION_JSON_VALUE,
      produces = MediaType.APPLICATION_JSON_VALUE)'
    httpMethods:
    - POST
    mappingPaths:
    - /paradigm/data-oriented/orders/preview
    produces:
    - MediaType.APPLICATION_JSON_VALUE
    consumes:
    - MediaType.APPLICATION_JSON_VALUE
    usage: true
