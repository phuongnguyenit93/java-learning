      - id: A
        answer: "It removes every need to define valid account states."
        explanation: "Separating behavior moves invariant enforcement to explicit contracts, not nowhere."
      - id: B
        answer: "It guarantees export consumers never depend on field names."
        explanation: "Directly inspecting maps can increase coupling to field names."
      - id: C
        answer: "It lets an analytics client bypass authorization checks."
        explanation: "Visibility of representation never removes access-control obligations."
      - id: D
        answer: "It decouples independent readers while increasing responsibility for shape contracts."
        explanation: "The gain is reuse; the cost is validation and coupling management."
