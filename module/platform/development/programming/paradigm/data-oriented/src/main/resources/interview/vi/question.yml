  - question: "Giải thích cho đội kỹ thuật vì sao Sharvit DOP, Project Amber Java DOP và performance DOD không được dùng thay thế nhau trong một ADR."
    answer: "Sharvit nhấn dữ liệu phổ dụng, thao tác tách riêng, bất biến và schema độc lập; Java Amber nhấn giá trị có kiểu minh bạch, biến thể hợp lệ và pattern matching; DOD hiệu năng tối ưu layout dữ liệu, locality, cache hoặc SIMD. Map bất biến không tự tăng cache hit; record có kiểu không đồng nghĩa schema JSON runtime. ADR nên ghi vấn đề muốn giải quyết và bằng chứng benchmark hay contract tương ứng."
