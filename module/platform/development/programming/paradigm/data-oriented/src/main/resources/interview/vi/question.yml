  - question: "Hãy hướng dẫn người mới vẽ đơn A gồm id, status và hai dòng P/Q trước khi nói đến HTTP hay Java records. Vì sao thứ tự đó quan trọng?"
    answer: "Tôi dùng map `{id,status,lines}`, trong đó lines là list map `{sku,qty,price}` và chỉ rõ P(2,30), Q(1,40). Người học trước hết nhìn thấy 2×30+1×40=100 và phân biệt dữ liệu với hàm `subtotal`. Sau đó mới đặt hợp đồng kiểu, khoảng giá trị và cách kiểm tra JSON. Nếu chỉ xem tổng tiền hoặc phương thức ẩn, không thấy cấu trúc cần kiểm chứng."
