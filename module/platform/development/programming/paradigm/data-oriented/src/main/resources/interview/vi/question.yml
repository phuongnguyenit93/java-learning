  - question: "Hệ thống đã tách code và dùng map bất biến nhưng vẫn nhận qty='2' dạng chuỗi từ client. Theo bốn nguyên tắc Sharvit, thiếu ranh giới gì?"
    answer: "Cần schema độc lập mô tả kiểu/range ở lối vào và validator chạy trước hàm tính toán. Ba nguyên tắc còn lại là tách code khỏi data, biểu diễn bằng cấu trúc phổ dụng và giữ dữ liệu bất biến. JSON hợp lệ cú pháp không làm qty chuỗi thành integer; phải trả lỗi shape, không ép kiểu âm thầm rồi tạo số tiền sai. Một schema cũng phải theo phiên bản bên đọc."
