  - question: "Hai worker cùng tạo v5 từ v4 bất biến và đều muốn lưu. Vì sao chỉ dùng map immutable không chống lost update?"
    answer: "Immutable bảo vệ từng snapshot không bị sửa tại chỗ, nhưng quyền thay bản current vẫn là shared state. Nếu lưu đè không kiểm v4, bản ghi sau xóa thay đổi của worker trước. Tôi đặt compare-and-swap, optimistic version check hoặc lock tại kho dữ liệu và định nghĩa chiến lược conflict/retry. API preview không thực hiện phần phối hợp này và không nên tuyên bố có tính nguyên tử."
