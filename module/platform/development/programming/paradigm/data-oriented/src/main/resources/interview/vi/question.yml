  - question: "Một hàm nhận map và gửi email; một hàm khác có class bao quanh nhưng chỉ tính tổng thuần. Vì sao không thể suy ra purity chỉ từ map hay class?"
    answer: "DOP nói về cách biểu diễn dữ liệu và vị trí của thao tác; purity nói về việc hàm có phụ thuộc hoặc hiệu ứng quan sát ngoài kết quả hay không. Hàm gửi email vẫn làm I/O dù tham số là map. Method tính tổng có thể thuần nếu chỉ dùng snapshot và không ghi dữ liệu. Tôi kiểm tra thân hàm, tham chiếu mutable và nguồn thời gian/DB thay vì dựa vào tên kiểu."
