questions:
  - question: "Một nhóm cần thêm trình đọc báo cáo vào hệ thống Order hiện tại. Bạn sẽ giải thích nguyên tắc DOP theo Sharvit như thế nào và vì sao không nhất thiết bỏ mọi đối tượng?"
    answer: "Tôi tách biểu diễn order thành dữ liệu có hình dạng rõ và cung cấp các phép báo cáo/định giá đứng ngoài, để nhiều bên đọc cùng một snapshot mà không lệ thuộc phương thức entity. Dữ liệu phổ dụng không tự bảo vệ invariant; đối tượng vẫn hữu ích ở nơi cần sở hữu quyền ghi. Tối thiểu phải định nghĩa schema cho bên nhận, lọc trường nhạy cảm và đặt effect ở ranh giới."
