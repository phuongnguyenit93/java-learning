references:
  - title: "Dev.java — Objects, Classes, Interfaces, Packages, and Inheritance"
    url: "https://dev.java/learn/oop/"
    description: "Object-oriented concepts: object state and behavior, class, encapsulation, inheritance, interface, and package organization."
  - title: "JLS 21 — Types, Values, and Variables"
    url: "https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html"
    description: "Reference types, object identity, class/interface types, subtype, and the null value in Java."
  - title: "JLS 21 — Names and Access Control"
    url: "https://docs.oracle.com/javase/specs/jls/se21/html/jls-6.html"
    description: "Scope, shadowing, access modifiers, and access permissions for class, field, method, and constructor."
  - title: "JLS 21 — Classes"
    url: "https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html"
    description: "Class, field, method, constructor, inheritance, overriding, hiding, inner class, enum, record, abstract, and sealed classes."
  - title: "JLS 21 — Interfaces"
    url: "https://docs.oracle.com/javase/specs/jls/se21/html/jls-9.html"
    description: "Interface design, extends/implements, default/static methods, functional interface, and polymorphism through contracts."
  - title: "JLS 21 — Execution and Object Lifecycle"
    url: "https://docs.oracle.com/javase/specs/jls/se21/html/jls-12.html"
    description: "Class loading, linking, initialization, instance initialization order, and the object lifecycle in Java."
  - title: "JLS 21 — Expressions"
    url: "https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html"
    description: "Execution of new, this, super, instanceof, method invocation, overload resolution, and dynamic method dispatch."
  - title: "Oracle Java SE 21 — Object API"
    url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html"
    description: "The shared object contract: equals, hashCode, toString, getClass, and methods provided by java.lang.Object."
  - title: "Oracle Java SE 21 — Class API"
    url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Class.html"
    description: "The runtime representation of a class, metadata, reflective type checks, and type relationships."
  - title: "Oracle Java SE 21 — Objects API"
    url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Objects.html"
    description: "Comparison, hashing, and safe null checks when designing objects and value objects."
  - title: "Refactoring.Guru — Design Patterns"
    url: "https://refactoring.guru/design-patterns"
    description: "An overview of creational, structural, and behavioral patterns; identifying reusable solutions in object-oriented design."
  - title: "Refactoring.Guru — How to Refactor"
    url: "https://refactoring.guru/refactoring/how-to"
    description: "Steps to improve object design, reduce code smell through small changes, and preserve behavior through testing."
  - title: "Design Principles — SOLID Design Principles"
    url: "https://principles.design/examples/solid-design-principles"
    description: "The five SOLID principles: Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, Dependency Inversion."
