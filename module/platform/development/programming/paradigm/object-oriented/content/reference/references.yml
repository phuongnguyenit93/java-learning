# ============================================================
# MODULE REFERENCE STRUCTURE
# ============================================================
#
# This is the shared module-level reference catalog.
# It is intentionally not split by MODULE_LANGUAGE.
#
# Example structure:
#
# references:
#   - title: "Java Language Specification"
#     url: "https://docs.oracle.com/javase/specs/"
#     description: "Official Java language specification."
#
# Add only curated references that are useful for the module.
# The build system must not overwrite this file after authored content exists.

references:
  - title: "The Java Tutorials — Object-Oriented Programming Concepts"
    url: "https://docs.oracle.com/javase/tutorial/java/concepts/index.html"
    description: "Accessible first introduction to objects, state, behavior, classes, encapsulation, and collaboration. These classic tutorials use JDK 8 examples; this module focuses on language-independent ideas."
  - title: "The Python Tutorial — Classes"
    url: "https://docs.python.org/3/tutorial/classes.html"
    description: "Official second-language view of object identity, state, methods, and aliasing; useful for distinguishing the OOP model from Java-specific class syntax."
  - title: "The Java Tutorials — Polymorphism"
    url: "https://docs.oracle.com/javase/tutorial/java/IandI/polymorphism.html"
    description: "Beginner-friendly illustration of polymorphic method behavior through a shared declared type; language-specific mechanics belong to Java Core."
  - title: "On the Criteria To Be Used in Decomposing Systems into Modules"
    url: "https://doi.org/10.1145/361598.361623"
    description: "David Parnas's original information-hiding and modularization paper; explains why protecting changeable design decisions matters beyond private fields."
  - title: "I2E: Design by Contract and Assertions"
    url: "https://www.eiffel.org/doc/eiffel/I2E-_Design_by_Contract_and_Assertions"
    description: "Eiffel's official exposition of client obligations, supplier guarantees, and object invariants; supports reasoning about behavior contracts without requiring Eiffel syntax."
  - title: "A Behavioral Notion of Subtyping"
    url: "https://www.cs.cmu.edu/~svc/papers/view-publications-lw94.html"
    description: "Liskov and Wing's research publication on behavioral substitutability; advanced background for why type inheritance alone is not a sufficient behavior guarantee."
  - title: "Unified Modeling Language, Version 2.5.1"
    url: "https://www.omg.org/spec/UML/2.5.1/PDF"
    description: "OMG's authoritative specification for exact association and aggregation-kind terminology. Optional advanced reading; UML diagram syntax is outside this paradigm curriculum."
