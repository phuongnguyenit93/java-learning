references:
  - title: "Dev.java — Objects, Classes, Interfaces, Packages, and Inheritance"
    url: "https://dev.java/learn/oop/"
    description: "Khái niệm hướng đối tượng: object có trạng thái và hành vi, class, đóng gói, kế thừa, interface và tổ chức package."
  - title: "JLS 21 — Types, Values, and Variables"
    url: "https://docs.oracle.com/javase/specs/jls/se21/html/jls-4.html"
    description: "Kiểu tham chiếu, danh tính đối tượng, class/interface types, subtype và giá trị null trong Java."
  - title: "JLS 21 — Names and Access Control"
    url: "https://docs.oracle.com/javase/specs/jls/se21/html/jls-6.html"
    description: "Scope, shadowing, access modifiers và quyền truy cập đến class, field, method, constructor."
  - title: "JLS 21 — Classes"
    url: "https://docs.oracle.com/javase/specs/jls/se21/html/jls-8.html"
    description: "Class, field, method, constructor, inheritance, overriding, hiding, inner class, enum, record, abstract và sealed classes."
  - title: "JLS 21 — Interfaces"
    url: "https://docs.oracle.com/javase/specs/jls/se21/html/jls-9.html"
    description: "Thiết kế interface, extends/implements, default/static methods, functional interface và đa hình qua hợp đồng."
  - title: "JLS 21 — Execution and Object Lifecycle"
    url: "https://docs.oracle.com/javase/specs/jls/se21/html/jls-12.html"
    description: "Class loading, linking, initialization, thứ tự khởi tạo instance và vòng đời đối tượng trong Java."
  - title: "JLS 21 — Expressions"
    url: "https://docs.oracle.com/javase/specs/jls/se21/html/jls-15.html"
    description: "Cách thực thi new, this, super, instanceof, method invocation, overload resolution và dynamic method dispatch."
  - title: "Oracle Java SE 21 — Object API"
    url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Object.html"
    description: "Hợp đồng chung của đối tượng: equals, hashCode, toString, getClass và phương thức từ java.lang.Object."
  - title: "Oracle Java SE 21 — Class API"
    url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/Class.html"
    description: "Kiểu class tại runtime, thông tin metadata, reflective type checks và quan hệ kiểu."
  - title: "Oracle Java SE 21 — Objects API"
    url: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Objects.html"
    description: "So sánh, hashing và kiểm tra null an toàn khi thiết kế object và value object."
  - title: "Refactoring.Guru — Design Patterns"
    url: "https://refactoring.guru/design-patterns"
    description: "Tổng quan pattern khởi tạo, cấu trúc, hành vi; nhận diện giải pháp có thể tái sử dụng trong thiết kế hướng đối tượng."
  - title: "Refactoring.Guru — How to Refactor"
    url: "https://refactoring.guru/refactoring/how-to"
    description: "Các bước cải tiến thiết kế object, giảm code smell bằng thay đổi nhỏ và bảo đảm hành vi qua kiểm thử."
  - title: "Design Principles — SOLID Design Principles"
    url: "https://principles.design/examples/solid-design-principles"
    description: "Năm nguyên tắc SOLID: Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, Dependency Inversion."
