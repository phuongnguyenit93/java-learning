version: 1
type: LEARNING_ROADMAP
title: ĐA HÌNH — LIÊN KẾT BÀI HỌC
roadmapHeading: Mạch liên kết bài học
roadmap:
- id: polymorphism-001
  order: 1
  title: Đa hình và nhiều cách thực hiện cùng một thao tác
  description: Nhận diện một lời gọi ShippingPolicy.quote(Parcel) nhưng Economy, Standard, Express có công thức và thời gian
    báo giá riêng.
  transition:
    to: polymorphism-002
    description: '**Từ hiện tượng một lời gọi nhiều hành vi → xác định quan hệ subtype cho phép gọi chung**'
- id: polymorphism-002
  order: 2
  title: Đa hình kiểu con qua giao diện hoặc lớp cha
  description: So sánh implements interface với extends superclass; upcast và final Report.preview gọi hook content của lớp
    con.
  transition:
    to: polymorphism-003
    description: '**Từ subtype → tìm hiểu cách compiler và runtime quyết định phương thức**'
- id: polymorphism-003
  order: 3
  title: Phân giải phương thức tĩnh và phân giải động
  description: Compiler chọn overload dựa vào kiểu tĩnh receiver/đối số, JVM chọn implementation override theo object thực.
  transition:
    to: polymorphism-004
    description: '**Từ quy tắc chọn method → thực hành override đúng điều kiện và giới hạn**'
- id: polymorphism-004
  order: 4
  title: Ghi đè và lựa chọn phương thức khi chạy
  description: DeliveryPlan.quote final bảo vệ quy trình, còn distanceFee overridable tạo khác biệt; gọi super có mục đích.
  transition:
    to: polymorphism-005
    description: '**Từ override → phân biệt overload cùng tên khác tham số**'
- id: polymorphism-005
  order: 5
  title: Phân biệt ghi đè với nạp chồng
  description: Giải quyết cùng lúc overload và override trong DispatchDemo với cast, null và conversion.
  transition:
    to: polymorphism-006
    description: '**Từ hai cơ chế method cùng tên → tránh nhầm với hiding các thành viên khác**'
- id: polymorphism-006
  order: 6
  title: Phân biệt che khuất thành viên với ghi đè
  description: Field và static method cùng tên được chọn theo kiểu tĩnh, khác với instance describe dispatch động.
  transition:
    to: polymorphism-007
    description: '**Từ field/static hiding → tổng hợp giới hạn đa hình cho mọi loại member**'
- id: polymorphism-007
  order: 7
  title: Phạm vi đa hình của phương thức và thuộc tính
  description: Phân loại field/static/private/final/getter/abstract/default, chọn API qua method thay vì public field trùng
    tên.
  transition:
    to: polymorphism-008
    description: '**Từ ranh giới member của Java → mở góc nhìn trừu tượng hóa theo khả năng**'
- id: polymorphism-008
  order: 8
  title: Duck typing và đa hình theo khả năng
  description: Phân biệt Java nominal typing với duck typing; dùng capability interface và adapter/method reference.
  transition:
    to: polymorphism-009
    description: '**Từ khai báo đúng khả năng → tổ chức code nghiệp vụ để giảm kiểm tra loại lặp lại**'
- id: polymorphism-009
  order: 9
  title: Đa hình thay cho điều kiện kiểm tra từng loại
  description: Đưa thuật toán vào ShippingPolicy, giữ factory/switch chọn implementation ở ranh giới; kiểm thử bảo toàn hành
    vi.
  transition:
    to: polymorphism-010
    description: '**Từ refactor strategy → vận dụng cho nhiều phương thức thanh toán và trạng thái**'
- id: polymorphism-010
  order: 10
  title: Ví dụ nhiều phương thức thanh toán
  description: |-
    CheckoutService dùng một PaymentMethod.pay cho thẻ, ví, chuyển khoản; phân biệt PAID/DECLINED/PENDING và kiểm thử với fake.

    **Mối liên hệ:** Chương bắt đầu từ một lời gọi có nhiều cách thực hiện và quan hệ subtype, sau đó giải thích quy tắc compile-time và runtime chọn phương thức. Các bài ghi đè, nạp chồng, hiding và phạm vi thành viên giúp dự đoán chính xác hành vi Java; phần capability cùng refactor loại bỏ điều kiện trùng lặp; ví dụ thanh toán cuối đưa những kỹ thuật ấy vào bài toán nghiệp vụ có nhiều trạng thái.

    [↓ Xem bảng đối chiếu các bài học](#2-bảng-đối-chiếu-các-bài-học)
  transition: null
comparisonMarkdown: |-
  ## 2. Bảng đối chiếu các bài học

  | Tiêu chí | Bài 1 | Bài 2 | Bài 3 | Bài 4 | Bài 5 | Bài 6 | Bài 7 | Bài 8 | Bài 9 | Bài 10 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Tên | Đa hình và nhiều cách thực hiện cùng một thao tác | Đa hình kiểu con qua giao diện hoặc lớp cha | Phân giải phương thức tĩnh và phân giải động | Ghi đè và lựa chọn phương thức khi chạy | Phân biệt ghi đè với nạp chồng | Phân biệt che khuất thành viên với ghi đè | Phạm vi đa hình của phương thức và thuộc tính | Duck typing và đa hình theo khả năng | Đa hình thay cho điều kiện kiểm tra từng loại | Ví dụ nhiều phương thức thanh toán |
  | Vấn đề cần hiểu | Một lời gọi hoạt động khác nhau vì sao? | Subtype qua interface hoặc superclass là gì? | Compiler và JVM quyết định ở bước nào? | Làm sao override đúng và an toàn? | Cùng tên khi nào overload hay override? | Field/static cùng tên có override không? | Member nào thực sự được dynamic dispatch? | Cần hợp đồng kiểu hay chỉ method giống tên? | Khi nào đổi if/instanceof thành strategy? | Một pay có thể có trạng thái nào? |
  | Giá trị đối với OOP/module | Client không lặp công thức | Dùng subtype theo API chung | Debug lời gọi chính xác | Mở rộng hook và giữ invariant | Tránh gọi nhầm chữ ký | Tránh field/static lookup gây lỗi | Ưu tiên method cho hành vi biến thiên | Tích hợp theo năng lực qua adapter | Giảm coupling khi thêm loại mới | Thanh toán mô phỏng dễ mở rộng/test |
  | Tư duy hình thành | Hành vi đi theo runtime object | Một kiểu chung nhiều class | Chọn signature rồi chọn implementation | Giữ quy trình và mở hook | Tách tham số khỏi implementation | Phân biệt hiding với overriding | Định nghĩa rõ phạm vi polymorphism | Thiết kế từ capability | Chọn đối tượng một nơi, gọi contract mọi nơi | Phân biệt kết quả và giới hạn an toàn |
