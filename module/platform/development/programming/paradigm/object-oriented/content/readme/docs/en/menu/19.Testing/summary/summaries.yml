summaries:
- id: testing-001
  title: Testing Public Behavior and Object Contracts
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Testing Public Behavior and Object Contracts**

    Testing an object means verifying the promises its API makes to clients, rather than field names, synchronization techniques, or the number of private helpers. Using SeatInventory, the lesson establishes preconditions, success/failure postconditions, and invariants governing reserved seats.

    Learners apply the same contract suite to MonitorSeatInventory and AtomicSeatInventory; inspect snapshots, test reserve/cancel sequences, check SeatSnapshot value equality, and distinguish atomicity guarantees for one object within a JVM from database transactions.

    ## 2. Questions Learners Should Be Able to Answer

    ### Contracts from the Client's Perspective

    1. What promises about zero, negative values, insufficient seats, and exceptions are missing from a tryReserve(int) signature?
    2. How do SeatInventory preconditions, success postconditions, failure postconditions, and invariants differ?
    3. Why is asserting only that tryReserve(7) returns false insufficient without comparing snapshots before and after?
    4. When replacing MonitorSeatInventory with AtomicSeatInventory, what must remain unchanged, and what is merely an implementation detail?
    5. Why should the private reserved field not be exposed or a setter added just to construct test states?

    ### Operation Sequences, Values, and Concurrency

    1. What bugs might the sequence reserve(4) → rejected reserve(7) → cancel(2) → reserve(8) reveal that isolated method tests could miss?
    2. How should SeatSnapshot record equality and hashCode be tested for safe use in a HashSet?
    3. What guarantees can concurrent reserve tests on one instance establish, and what do they not prove about multiple JVMs or a DB?
    4. How do state-based assertions differ from interaction-based assertions for observable effects?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Specify contracts | State SeatInventory preconditions, postconditions, invariants, and failure semantics explicitly. |
    | Design tests from public APIs | Build Given–When–Then cases for reserve/cancel/snapshot without inspecting private fields. |
    | Protect failure paths | Compare snapshots before and after rejected reservations/cancellations and verify that capacity is never exceeded. |
    | Reuse contract suites | Run the same factory-based tests against MonitorSeatInventory and AtomicSeatInventory. |
    | Test sequences and value equality | Use state-sequence tables, boundary cases, and SeatSnapshot equals/hashCode checks. |
    | Define concurrency evidence | Explain the value and limitations of a single-JVM CountDownLatch test compared with DB integration tests. |
- id: testing-002
  title: Testing Constructors and Invalid States
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Testing Constructors and Invalid States**

    Constructors/factories are boundaries that ensure only valid domain objects are exposed. Through Invoice, LineItem, and Wallet, the lesson tests required parameters, cross-field constraints, customer-ID normalization, overflow-safe arithmetic, and failures that must not expose invalid state.

    JUnit Jupiter parameterized tests cover discount boundaries from 0 to subtotal, null/blank values, List.copyOf, and mutations of the source list. The lesson also warns about builders/records, virtual methods called in constructors, and side effects emitted before validation finishes.

    ## 2. Questions Learners Should Be Able to Answer

    ### Constructing Valid and Immutable Objects

    1. Why must an Invoice constructor validate the item list, discountVnd, and total instead of simply assigning fields?
    2. What different outcomes are required at discount=0, discount=subtotal, and discount=subtotal+1?
    3. How does List.copyOf protect against changes to the source ArrayList, and why is it not equivalent to a deep copy?
    4. Which arithmetic errors do Math.multiplyExact/Math.addExact catch that ordinary long arithmetic might miss?
    5. Why does a constructor throwing an exception not automatically roll back external side effects already produced before it completed?

    ### Alternative Construction Paths and Testing Strategies

    1. Which invariants must record compact constructors and build() preserve, even when builder setters accept fields individually?
    2. Why can calling an overridable method or letting this escape from a constructor expose a subclass before initialization finishes?
    3. In ONLINE/OFFLINE appointments, which start/end/link/location combinations must be rejected even if each individual field is valid?
    4. When errors originate from JSON or legacy database records, which boundary should be tested instead of using reflection to corrupt private state?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Build constructor test matrices | List valid/invalid/boundary cases and cross-field constraints for Invoice or Appointment. |
    | Verify postconditions | Check trimmed customerId, subtotal, discount, total, and line count after successful construction. |
    | Test rejection paths | Use correctly typed assertThrows checks for null, blank values, invalid quantities, excessive discounts, and overflow. |
    | Test aliasing | Modify the source list after construction and attempt mutation through an accessor to show that the Invoice snapshot remains unaffected. |
    | Test builders/records | Confirm that record compact constructors and Builder.build cannot create objects that violate invariants. |
    | Distinguish internal/external constructor failures | Identify pre-validation side effects, this-escape risks, and transaction/concurrency limitations. |
- id: testing-003
  title: Testing Invariants and State Transitions
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Testing Invariants and State Transitions**

    For objects with lifecycles, a test showing that one deposit succeeds does not prove that a wallet always remains valid. This lesson constructs an ACTIVE/FROZEN/CLOSED Wallet state machine, distinguishes snapshot invariants from rules that apply over time, and tests both valid transitions and prohibited operations.

    Learners verify that failures leave snapshots unchanged, test exact withdraw/close thresholds, detect overflow on deposit, and exercise freeze/resume/close sequences. The lesson also introduces reference models and property-based testing, explaining why invariants spanning two wallets or multithreaded operations need testing at a broader boundary.

    ## 2. Questions Learners Should Be Able to Answer

    ### State Machines and Invariants

    1. How does a state invariant such as balanceVnd >= 0 differ from the rule that withdrawals are prohibited while FROZEN?
    2. Which conditions permit ACTIVE → FROZEN, FROZEN → ACTIVE, and ACTIVE → CLOSED transitions in Wallet?
    3. Why must CLOSED always have balance=0 and reject resume/deposit under the example contract?
    4. What are state coverage, transition coverage, invalid-transition coverage, and sequence coverage?
    5. Why does checking only assertThrows on a rejected withdrawal fail to prove the invariant remains protected?

    ### Boundaries, Test Sequences, and Reference Models

    1. How should the boundary values 0, -1, balance, balance+1, and Long.MAX_VALUE be tested?
    2. How does an independent reference model enable comparison of command sequences against a real Wallet?
    3. What preconditions are needed for the property that depositing x and then withdrawing x restores the original balance?
    4. Why does individual validity of Accounts A and B not prove that transfers preserve their combined balance?
    5. What evidence about lost updates and transactions is still missing from sequential tests or a concurrency test that passes only once?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Model lifecycles | Diagram ACTIVE/FROZEN/CLOSED with guards, starting/ending states, and allowed commands. |
    | Connect invariants to tests | Express balance>=0, CLOSED=>balance=0, and unchanged state after failure as assertions. |
    | Test state transitions | Create cases for valid and forbidden transitions, boundaries, and multistep sequences. |
    | Protect failure paths | Compare Snapshots before/after operations that violate preconditions or cause overflow. |
    | Use reference models | Generate commands with a seed, compare expected statuses/balances/errors, and record sequences that cause regressions. |
    | Identify broader test boundaries | Explain when integration tests are needed for transfers, DB transactions, and concurrency. |
- id: testing-004
  title: Testing Multiple Implementations of One Interface
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Testing Multiple Implementations of One Interface**

    This lesson focuses on organizing one shared test suite when multiple classes implement the same interface instead of maintaining separate, inconsistent suites. The IntSet interface has HashIntSet and TreeIntSet implementations; both promise the same add/remove/contains/size behavior despite different storage mechanisms.

    Learners use JUnit 5 @ParameterizedTest, @MethodSource, and Supplier<IntSet> to create independent fixtures for each implementation; test duplicate additions, removal followed by re-addition, MIN/MAX values, and independence between instances. Implementation-specific and integration tests remain necessary when an implementation has DB or cache contracts.

    ## 2. Questions Learners Should Be Able to Answer

    ### Defining a Shared Contract

    1. Why must HashIntSet and TreeIntSet provide identical add/remove/contains/size semantics despite different internal structures?
    2. What two boolean values should consecutive IntSet.add(7) calls return, and how should size change?
    3. Are 0, negative numbers, Integer.MIN_VALUE, and Integer.MAX_VALUE included in the example's valid input domain?
    4. Why shouldn't iteration order or the HashSet/TreeSet implementation class be tested when the interface does not expose them?

    ### Reusing JUnit Tests and Testing Implementations

    1. How do @MethodSource variants(), Supplier<IntSet>, and @ParameterizedTest create independent test runs?
    2. Why must each test call factory.get() instead of sharing one mutable set?
    3. What bug can independentInstances detect if an implementation accidentally uses static storage?
    4. When LinkedHashIntSet is added, should the factory list change or should every test case be duplicated?
    5. When moving to JdbcRepository, what transaction, mapping, and real-resource checks are missing from the contract suite?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Specify the IntSet contract | Define duplicate-add, absent-element removal, non-mutating contains, and size based on distinct elements. |
    | Create parameterized suites | Declare an @MethodSource that supplies a name and Supplier<IntSet> for each implementation. |
    | Cover multiple implementations | Run the same tests on HashIntSet, TreeIntSet, and a new implementation. |
    | Test state and boundaries | Test add/remove/re-add, negative numbers, MIN/MAX values, and independent instances. |
    | Avoid coupling tests to storage | Do not assert HashSet/TreeSet iteration order unless the contract specifies it. |
    | Add implementation-specific tests | Distinguish shared contract checks from implementation-specific transaction/cache/TTL/integration tests. |
- id: testing-005
  title: Testing Subtype Substitutability
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Testing Subtype Substitutability**

    Correctly implementing or extending a type does not prove that a subtype can substitute for its supertype. This lesson turns the Liskov Substitution Principle into assertions about preconditions, postconditions, invariants, exceptions, side effects, and observable client expectations.

    In the example, DiscountPolicy accepts subtotal values from 0–1.000.000 and returns a valid discount: NoDiscount, TenPercentDiscount, and TieredDiscount pass the shared suite, but MinimumOnlyDiscount deliberately rejects subtotals below 50.000 and therefore violates the contract. Learners use boundary tests, seeded data, and the Checkout client to demonstrate the violation even though the Java code compiles.

    ## 2. Questions Learners Should Be Able to Answer

    ### Subtype Contracts

    1. What does LSP require when Checkout uses a new DiscountPolicy through the same interface?
    2. Why may a subtype not strengthen preconditions, even though it may accept a wider range of valid inputs?
    3. Over what input domain must the postconditions 0 <= discount <= subtotal and discount(0)=0 hold for every policy?
    4. Why can't all policies be required to return the same discount amount if the contract specifies only a range?
    5. How can a RuntimeException on a valid subtotal or an undisclosed side effect break substitutability?

    ### Test Design and Limitations

    1. On which inputs does MinimumOnlyDiscount fail, and which boundary tests detect the failure immediately?
    2. Why test 49.999/50.000/50.001 as well as seeded random samples instead of choosing only average values?
    3. How can a policy that depends on the number of prior calls violate the consistency clients rely on?
    4. When a read-only subtype cannot perform writes, how should interfaces be split by capability instead of throwing UnsupportedOperationException?
    5. Why doesn't a passing contract suite mathematically prove LSP for every input, state, and environment?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Specify abstraction contracts | Define DiscountPolicy's input domain, outputs, exceptions, determinism, and side effects explicitly. |
    | Diagnose LSP violations | Identify subtypes that strengthen preconditions or weaken postconditions despite matching method signatures. |
    | Build substitution tests | Invoke different policies through the shared interface from Checkout and a common assertion suite. |
    | Cover thresholds and seeded data | Test 0/1/max, values immediately below/above 50.000, and reproducible random samples. |
    | Distinguish shared behavior from concrete results | Allow policies to calculate different discounts while satisfying every promised invariant. |
    | Propose suitable abstractions | Detect interfaces that mix read/write capabilities and determine when to split their contracts. |
- id: testing-006
  title: Fakes, Stubs, Mocks, and Collaborators
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Fakes, Stubs, Mocks, and Collaborators**

    Unit tests for CheckoutService should not charge real money, modify actual inventory, or send real emails. This lesson distinguishes collaborators of the SUT from test doubles—dummies, stubs, fakes, mocks, and spies—each chosen according to the information a test must supply or observe.

    In CheckoutDemo, FakeInventory maintains state, StubPaymentGateway controls acceptance/decline, and MockReceiptSender records send counts. Learners verify outcomes, remaining inventory, and notification effects; Mockito tests add verifyNoInteractions without confusing verify(decrease) with proof that actual data was persisted.

    ## 2. Questions Learners Should Be Able to Answer

    ### Roles of Test Doubles

    1. How does a collaborator differ from a fake/stub/mock in the CheckoutService design?
    2. Which data and side effects can StubPaymentGateway, FakeInventory, and MockReceiptSender control or observe?
    3. How does a spy differ from a pure mock, and when is a dummy useful?
    4. Why can a single Mockito mock serve as a stub via when(...) and also verify interactions?

    ### Outcomes, Interactions, and Integration

    1. In a successful checkout, which assertions prove that stock decreases from 3 to 1 and a receipt is sent exactly once for 500.000 VND?
    2. When the gateway returns false or stock is insufficient, what must be verified as unchanged or not invoked?
    3. Why doesn't verify(inventory).decrease(...) prove that stock was actually deducted?
    4. When do ArgumentCaptor, verifyNoInteractions, times, or never protect contracts involving real side effects?
    5. Which limitations of FakeInventory mean unit tests cannot replace DB, concurrency, and payment integration tests?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Choose test doubles | Distinguish dummies, stubs, fakes, mocks, and spies by their role in a particular scenario. |
    | Construct a real CheckoutService | Inject replaceable collaborators through the constructor rather than mocking the SUT itself. |
    | Verify state | Use FakeInventory to check stock levels after success, decline, or out-of-stock outcomes. |
    | Verify side effects | Record email/orderId/amount and assert exactly one send or no send according to the outcome. |
    | Use Mockito selectively | Apply when, verify, times, never, and verifyNoInteractions at observable boundaries. |
    | Define unit-test scope | Explain how fakes differ from real DB/payment implementations and why separate integration tests are needed. |
- id: testing-007
  title: Designing for Replaceable Dependencies in Tests
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Designing for Replaceable Dependencies in Tests**

    Testability begins with class design: when CheckoutService creates its own gateway, reads the real clock, and sends email internally, tests are difficult to isolate and reproduce. This lesson introduces test seams using ports, constructor injection, a composition root, and a controllable Clock.

    JUnit tests the PaymentGateway, ReceiptSender, and CheckoutService example with Result(accepted, checkedAt) using StubGateway, RecordingSender, and Clock.fixed. Learners show that invalid inputs do not invoke dependencies, a declined payment does not send receipts, exceptions propagate, and constructors reject null dependencies.

    ## 2. Questions Learners Should Be Able to Answer

    ### Designing Dependency Substitution Points

    1. Why does constructing an HTTP client, payment adapter, and Clock.systemUTC inside CheckoutService make unit tests hard to run independently?
    2. How do PaymentGateway/ReceiptSender interfaces and constructor injection divide responsibilities between the service and composition root?
    3. Do DI and DIP require Spring, and when should an interface not be created for every class?
    4. How does Clock.fixed make assertions about Result.checkedAt more stable than Instant.now?
    5. Which dependency lifecycles suit constructor injection versus method injection?

    ### Verifying Behavior with Test Doubles

    1. What side effects must CheckoutService avoid before validating a blank orderId and amountVnd<=0?
    2. What can five unit tests establish using StubGateway responses of true/false/exception and RecordingSender?
    3. Why must a gateway error not cause a notification to be sent, while a declined result must retain checkedAt from the injected Clock?
    4. How should a fresh fake/spy for each test avoid shared static state?
    5. Why does a test seam not itself prove that real adapters handle timeouts, retries, transactions, or successful email delivery?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Identify hard-to-control dependencies | Find hidden network, clock, environment, database, or singleton dependencies in business logic. |
    | Design ports and a composition root | Define PaymentGateway/ReceiptSender and supply implementations at the creation boundary. |
    | Use constructor injection | Pass required dependencies, reject null values, and avoid constructing adapters within services. |
    | Fix time in tests | Use Clock.fixed to assert checkedAt and deadline logic independently of execution time. |
    | Test failure scenarios | Use stubs/spies to prove invalid inputs, declines, or gateway exceptions never send receipts. |
    | Separate unit and integration testing | Identify real network/DB behavior that must be checked at the adapter or system level. |
- id: testing-008
  title: Avoiding Tests Tightly Coupled to Internals
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Avoiding Tests Tightly Coupled to Internals**

    A brittle test fails when HashMap, a private helper, or the number of PriceCatalog calls changes even though client-visible results do not. This lesson helps distinguish promised behavior from algorithms that may be replaced during refactoring.

    In QuoteContractDemo, PerLineService and GroupedService produce the same prices, shipping fees, and free-shipping threshold of 500.000 despite different lookup counts. Learners distinguish lookup counts from meaningful side effects such as charging, sending, or publishing after commit; the contract's obligations determine when interactions warrant assertions.

    ## 2. Questions Learners Should Be Able to Answer

    ### Recognizing Brittle Tests

    1. Why do tests that reflect private fields or verify calculator call counts often fail after refactoring that preserves results?
    2. Despite different lookup counts in PerLineService and GroupedService, which Quote values must remain the same?
    3. At exactly 500.000 VND, what shipping charge and total are required by the contract?
    4. When does the number of price lookups per SKU become a testable API requirement rather than an implementation detail?
    5. Why does mocking every Money, OrderLine, or Address often lengthen tests while proving little about business rules?

    ### Identifying Interactions Worth Testing

    1. Why is not sending a receipt after a declined payment a meaningful side-effect assertion?
    2. When is InOrder useful for verifying validation before charging or publishing after commit?
    3. How do a fake Clock and Supplier<UUID> keep tests independent of real time and generated IDs?
    4. Why must Quote tests still cover quantities exceeding int, missing SKUs, and long overflow even when code is only being refactored?
    5. What real cache, network, or persistence issues remain untested by unit tests using FakeCatalog?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Classify assertions | Distinguish contract-based assertions from those that unnecessarily lock in implementation details. |
    | Write refactoring-resilient tests | Run the same Quote behavior suite on PerLineService and GroupedService despite different lookup counts. |
    | Protect boundary values | Verify subtotal, shipping, and total at the 500.000 threshold and reject invalid inputs/overflow. |
    | Verify only required side effects | Assert payment, receipt, or event interactions when they are genuine business commitments. |
    | Isolate nondeterministic data | Inject a Clock or ID generator in reproducible tests instead of asserting real time. |
    | Choose the right testing level | Identify network/cache/DB behavior that simple fakes cannot reproduce. |
- id: testing-009
  title: Regression Testing During Design Changes
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Regression Testing During Design Changes**

    OOP refactoring can change classes, Strategy, dependency injection, or algorithms without intending to change observable behavior. This lesson establishes a contract-based regression suite for before-and-after comparisons, with a baseline, independent specifications, and testing levels matched to risk.

    In the example, LegacyCheckout and RefactoredCheckout use ShippingRule: members receive free shipping, while nonmembers qualify at subtotal=100.000 cents; BrokenShippingRule uses > instead of >=, failing at the exact threshold. Learners combine requirement-derived example tests, differential testing with a fixed seed, and the invariant total=merchandise amount+shipping fee.

    ## 2. Questions Learners Should Be Able to Answer

    ### Contracts to Preserve After Refactoring

    1. Which changes to classes, DI, or Strategy are permitted without changing Invoice results or failure semantics?
    2. Why can tests that only compare before and after versions preserve an existing bug in the original?
    3. What different kinds of evidence do specification examples, differential tests, and invariant tests provide?
    4. How should nonmember shipping fees differ at 99.999, 100.000, and 100.001 cents?
    5. Which condition does BrokenShippingRule get wrong even though both classes still implement PriceQuoteService?

    ### Reproducible Regression Strategies

    1. Why are baselines, boundary tests, and no-side-effect guarantees needed before moving business logic into ShippingRule?
    2. Why are fixed random seeds and recorded failing inputs important in differential testing?
    3. What integration tests must supplement unit tests when interfaces/wiring, transactions, or serialization change?
    4. When a business rule genuinely changes, how should expected values and approvals be managed differently from a pure refactoring?
    5. Why must CI fail when a production implementation breaks its contract instead of swallowing AssertionError as an intentionally faulty demo might?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Establish regression contracts | Record inputs, Invoice outputs, errors, and side effects that may change or must be preserved. |
    | Build an independent oracle | Derive expectations from requirements for members, nonmembers, thresholds, and out-of-domain inputs. |
    | Compare two designs | Run old and new PriceQuoteService implementations against the same cases and fixed-seed sample data. |
    | Catch boundary defects | Detect > in place of >= at exactly subtotal 100.000 cents. |
    | Plan refactoring tests | Run the baseline, make small refactorings, then execute contract/unit tests, integration tests, and CI appropriate to the changes. |
    | Manage contract changes | Distinguish bugs/regressions from new requirements and update tests with review rather than arbitrarily changing expectations. |
- id: testing-010
  title: Testing Interactions Among Multiple Objects
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Testing Interactions Among Multiple Objects**

    Inventory, PaymentGateway, and ReceiptSender may each be correct independently while CheckoutService still coordinates them incorrectly: charging before reserving, failing to release on decline, sending a receipt before payment, or charging twice. This lesson tests interaction contracts across meaningful business branches and call ordering.

    Using JUnit 5 + Mockito and CheckoutCollaborationTest with InMemoryInventory, learners apply verify, never, InOrder, and verifyNoInteractions while asserting PAID/DECLINED/OUT_OF_STOCK outcomes and stock state. The lesson distinguishes gateway failures from email failures after charging and explains why real payment workflows need idempotency, reconciliation, and an outbox.

    ## 2. Questions Learners Should Be Able to Answer

    ### Collaboration Contracts and Ordering

    1. In which order must CheckoutService invoke reserve, charge, and send on success?
    2. Which collaborators must not be called when the outcome is OUT_OF_STOCK?
    3. How do a false return and a thrown RuntimeException from PaymentGateway differ in outcome, release, and exception behavior?
    4. Why must a sender failure after a successful charge not automatically trigger another charge or release inventory?
    5. Which call-order relationships are genuine contract requirements that warrant Mockito InOrder?

    ### Interaction Tests and State Verification

    1. What kinds of expectations do Mockito when, verify, never, verifyNoInteractions, and InOrder establish?
    2. Why should CheckoutService itself not be mocked, and why is verifying only gateway.charge without checking the final result insufficient?
    3. With 5 items in InMemoryInventory, what stock remains after a checkout for 2 items succeeds or is declined?
    4. Why does a mock recording a release call not prove that stock was restored, and what further evidence can a fake provide?
    5. What uncertain states can payment gateway timeouts and real email-delivery failures create that require reconciliation, idempotency, or an outbox?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Build workflow branch tables | Specify permitted interactions for PAID, DECLINED, OUT_OF_STOCK, and gateway/sender exceptions. |
    | Verify business ordering | Use InOrder to verify reserve → charge → send or reserve → charge → release as appropriate. |
    | Prevent invalid side effects | Use verifyNoInteractions/never for out-of-stock, failed charges, or sender failures. |
    | Verify outcomes and data | Assert enum outcomes, correctly typed exceptions, and each collaborator's arguments. |
    | Test real in-memory collaboration | Use InMemoryInventory/RecordingSender to verify stock changing from 5→3 or being restored to 5. |
    | Identify production limitations | Explain why a gateway exception does not prove that no money was charged and why safe retries are necessary. |
