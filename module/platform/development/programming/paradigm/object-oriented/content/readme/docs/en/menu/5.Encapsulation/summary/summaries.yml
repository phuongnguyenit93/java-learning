summaries:
- id: encapsulation-001
  title: Information Hiding and Object Boundaries
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Information Hiding and Object Boundaries**

    This lesson distinguishes the data and implementation decisions an object should keep private from the behaviors it should expose. Through ShoppingCart, learners see why private fields, meaningful APIs, and safe snapshots must work together to prevent callers from modifying the cart outside its rules.

    ## 2. Questions Learners Should Be Able to Answer

    ### Principles and Boundaries

    1. How do encapsulation, information hiding, and access control address different questions?
    2. Why is making a field private insufficient if its getter exposes a mutable list?
    3. Which parts of the public contract must remain stable when replacing List with Map?

    ### Designing and Verifying ShoppingCart

    1. Why do addItem and changeQuantity protect the cart better than returning the internal Map or allowing arbitrary totals to be set?
    2. Why does ShoppingCart calculate and check for overflow before put, and how does a rejected operation affect state?
    3. What kind of snapshot does List.copyOf(lines.values()) create, and what property of CartLine makes it safe?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Defining boundaries | Identify the state, public behaviors, and implementation details to hide in a shopping cart class. |
    | Distinguishing concepts | Use different examples to explain encapsulation, information hiding, and the four Java access modifiers. |
    | Designing APIs | Propose addItem, changeQuantity, and removeItem instead of collection modification rights and setTotal. |
    | Predicting behavior | Explain snapshot behavior before and after changeQuantity and the exception raised when modifying a snapshot. |
    | Testing invariant protection | Write tests for negative quantities, duplicate SKUs, and long overflow; verify that rejected operations leave the cart's state unchanged. |
- id: encapsulation-002
  title: Object Invariants
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Object Invariants**

    This lesson defines an invariant as a condition that must hold for a valid object state and explains how to show that it holds after initialization, after every successful operation, and when an operation is rejected. The StockItem example controls onHand, reserved, and available through reserve, release, ship, and restock.

    ## 2. Questions Learners Should Be Able to Answer

    ### The Nature of Invariants

    1. How does an invariant differ from a precondition, a postcondition, and immutability?
    2. Why is a nonnegative reserved value alone insufficient to ensure that reserved does not exceed onHand?
    3. How can a mutable object maintain its invariants throughout its lifecycle?

    ### Verifying Operations and Failure Cases

    1. With onHand at 10 and reserved at 4, why must reserve(7) fail, and what should the state be afterward?
    2. Why must ship update both reserved and onHand, and why should restock use Math.addExact?
    3. When multiple threads call reserve concurrently, why do individually valid checks no longer guarantee the invariant?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Expressing invariants | Write the condition 0 ≤ reserved ≤ onHand and derive available from the two fields. |
    | Distinguishing contracts | Classify a specific rule as an invariant, precondition, or postcondition. |
    | Analyzing state transitions | Calculate StockItem state after valid reserve, ship, release, and restock operations. |
    | Detecting defects | Identify the update-before-check problem in unsafeReserve and change it to check first, then write. |
    | Designing tests | Create boundary, exception, and overflow cases, verifying that state remains valid after failure. |
    | Understanding concurrency limits | Explain why the same lock must protect all read/write paths or why a transaction is needed at the data layer. |
- id: encapsulation-003
  title: Controlling Access and State Changes
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Controlling Access and State Changes**

    This lesson turns encapsulation principles into choices of Java access levels and validated update methods. With Wallet, learners practice protecting balances and transaction histories, handling insufficient funds, and understanding the distinction between language-level access control and user authorization.

    ## 2. Questions Learners Should Be Able to Answer

    ### Visibility in Java

    1. What scopes of access do private, package-private, protected, and public permit?
    2. Why does protected access from a subclass in another package depend on the reference type, and why can't a top-level class be private?
    3. How does the least-visibility principle help keep public contracts stable?

    ### Controlling Wallet and Defining Responsibilities

    1. How does Deposit use Math.addExact to handle overflow before assigning the balance?
    2. How does returning false for insufficient funds in Withdraw, instead of throwing an exception, affect the API contract?
    3. Why do a history snapshot and a private balance not automatically provide thread safety or user authorization checks?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Applying access levels | Choose and explain modifiers for fields, helpers, public APIs, and collaborating components in the same package. |
    | Analyzing Wallet | Trace deposit, withdraw, balanceCents, and history to identify paths that change state. |
    | Verifying failure paths | Predict the outcomes of overflowing deposits, withdrawals exceeding the balance, and attempts to modify history snapshots. |
    | Distinguishing protection layers | Explain the differences among Java access control, authentication/authorization, and multithreaded synchronization. |
    | Proposing alternative APIs | Replace unchecked setBalance with conditional deposit/withdraw methods. |
- id: encapsulation-004
  title: Getters, Setters, and Intention-Revealing Methods
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Getters, Setters, and Intention-Revealing Methods**

    This lesson helps learners decide when to use getters, validated setters, domain commands, or immutable value objects. Through BankAccount, Profile, Booking, and Money, they examine permission to observe, independent permission to modify, updating multiple fields together, and the boundary between DTOs and domain models.

    ## 2. Questions Learners Should Be Able to Answer

    ### Choosing APIs with the Right Semantics

    1. When is setDisplayName reasonable, while setBalance or setStatus risks undermining business rules?
    2. How does a computed getter such as getItemCount differ from a getter returning a field or mutable collection?
    3. Why does the reschedule(start, end) command protect a pair of times better than two independent setters?

    ### Contracts, Frameworks, and Immutability

    1. Distinguish queries from commands; why can't canWithdraw replace the final check inside withdraw under concurrency?
    2. Do JavaBeans conventions, records, and framework requirements always force domain objects to expose public setters?
    3. Why is Money.plus creating a new instance appropriate for an immutable value object?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Classifying methods | Explain the roles of getters, setters, commands, queries, and constructors in a class API. |
    | Designing BankAccount | Propose deposit, withdraw, renameOwner, and close with rules to check before changing state. |
    | Evaluating setters | Choose validated setters for independent properties and domain behaviors for linked state. |
    | Protecting getters | Choose computed values or snapshots and detect getters that expose mutable or confidential data. |
    | Performing atomic updates | Design reschedule to validate both start and end before assignment. |
    | Separating models | Distinguish DTOs/JavaBeans for binding from domain models that own rules; explain Money.plus. |
- id: encapsulation-005
  title: Input Validation at Object Boundaries
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Input Validation at Object Boundaries**

    This lesson identifies where data enters object-owned state and the validation responsibilities of constructors, factories, mutators, and domain behaviors. The CourseEnrollment, Reservation, Scores, and CourseCode examples illustrate normalization before validation, checking relationships among multiple fields, copying mutable data, and layering validation.

    ## 2. Questions Learners Should Be Able to Answer

    ### Input Rules and Consistency

    1. Why is validation only at the controller insufficient to protect CourseEnrollment when it is created by a batch job or another service?
    2. How do you distinguish an invalid argument from an action that is invalid in the current state, and choose the corresponding exception?
    3. Why must a code be normalized and then the exact value to be stored validated?

    ### Safe Updates and Data Ownership

    1. With reconfigure(1, 5), why can assigning capacity first corrupt Reservation even if an exception is thrown?
    2. Why does Scores clone the input array before validation and clone it again when a getter returns data?
    3. Which checks belong to DTOs, domain objects, services, and databases respectively, and which require transactions or locking?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Designing validation | Implement checks for courseCode and credits in the range 1..30 in the constructor and changeCredits. |
    | Distinguishing rules | Place null, format, range, cross-field, and current-state checks at appropriate boundaries. |
    | Updating safely | Fix reconfigure to validate the entire new state before assigning it. |
    | Controlled normalization | Explain and implement a CourseCode record using strip and format validation. |
    | Preventing validation bypasses | Detect aliasing in Scores and apply clone on input and output. |
    | Understanding validation limits | Explain when a DB uniqueness constraint or coordinated check-and-update under concurrency is needed. |
- id: encapsulation-006
  title: Preventing Exposure of Mutable Internal Data
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Preventing Exposure of Mutable Internal Data**

    This lesson focuses on two ways mutable references can leak: an object retaining the very data a caller supplied, and a getter returning internal data. With EnrollmentBook and Attachment, learners try modifying lists and arrays from both sides, then use appropriate copies or snapshots to keep control of updates within the class.

    ## 2. Questions Learners Should Be Able to Answer

    ### Recognizing Aliasing

    1. How does inbound aliasing differ from outbound aliasing in UnsafeClassroom?
    2. Why can callers still modify a private final List through input.add or getStudents().clear?
    3. What risk of state leakage remains when List.copyOf contains mutable elements?

    ### Choosing a Safe Read Contract

    1. Why does EnrollmentBook store a copy of its input and return List.copyOf from getStudents, while Attachment clones byte[] in both directions?
    2. How do an unmodifiable view, a structural snapshot, and an ArrayList copy differ in what callers can modify and what changes they can observe?
    3. What should be considered instead of blindly copying a very large or concurrently updated list?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Detecting leak paths | Draw or explain shared references among callers, private fields, and getters. |
    | Preventing inbound leaks | Copy the list in the constructor, enforcing capacity limits and preventing duplicate students. |
    | Preventing outbound leaks | Return a List.copyOf snapshot or clone an array and demonstrate that caller modifications do not affect internal data. |
    | Comparing return strategies | Predict the output of unmodifiableList and List.copyOf when the backing list changes. |
    | Checking limitations | Explain why shallow copies do not protect mutable elements and why snapshots need synchronization in the presence of races. |
- id: encapsulation-007
  title: Defensive Copying and Immutable Representations
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Defensive Copying and Immutable Representations**

    This lesson examines how to choose between defensive copying at boundaries and immutable representations. With SafeReminder, Instant, and EventSnapshot, learners copy Date values both on input and output, convert AttendeeDraft elements into immutable values, and understand why a read-only list is insufficient if its elements remain mutable.

    ## 2. Questions Learners Should Be Able to Answer

    ### Copying and Representation Strategies

    1. How does a final Date differ from immutable Instant, and why must SafeReminder copy in both its constructor and getter?
    2. How do shallow copies, deliberate deep copies, and List.copyOf differ in their handling of containers and elements?
    3. Why is creating a value snapshot of an account or invoice usually more appropriate than cloning an entire entity with an identity?

    ### Building Stable Snapshots

    1. How does EventSnapshot prevent a form from changing Date, renaming an AttendeeDraft, or adding attendees after confirmation?
    2. Why does combining List.copyOf with immutable Attendee elements allow getAttendees to return the list without copying it every time?
    3. Does the immutability of an existing snapshot automatically address copying during concurrent updates or safely publishing references?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Protecting Date values | Write constructors/getters that create new Date values from getTime and predict the outcome after a caller invokes setTime. |
    | Choosing immutable types | Explain why Instant can be shared and why reschedule should return a new Reminder. |
    | Analyzing copying depth | Identify mutable element references that remain shared when a list is shallow-copied. |
    | Designing snapshots | Convert EventSnapshot data from mutable AttendeeDraft elements to immutable Attendee values and finalize the list. |
    | Evaluating cost and concurrency | State when synchronization is required while capturing data and publishing new snapshots. |
- id: encapsulation-008
  title: Encapsulating Behavior Instead of Merely Wrapping Data
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Encapsulating Behavior Instead of Merely Wrapping Data**

    This lesson shifts the focus from classes containing only fields and setters to objects responsible for valid actions. EncapsulatedOrderDemo shows Order validating addLine, confirm, and cancel, deriving the total from OrderLine, and protecting its list, while distinguishing entity responsibilities from those of an application service.

    ## 2. Questions Learners Should Be Able to Answer

    ### Behavior-Rich Models

    1. Why does OrderData still allow confirmation of an empty order or a negative total even with private fields?
    2. What does Tell, Don't Ask suggest when external code repeatedly calls getStatus and then setStatus?
    3. Why should total be calculated from lines and state transitions be performed through confirm/cancel instead of setters?

    ### Lifecycle and Architecture

    1. With DRAFT, CONFIRMED, and CANCELLED, which operations are allowed or rejected in EncapsulatedOrderDemo?
    2. Why should Order not call a payment gateway or send notifications directly when an application service coordinates the use case?
    3. Which tests demonstrate that failed operations do not modify state or internal lists?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Recognizing behavior-poor models | Analyze get-if-set designs and identify scattered business rules. |
    | Designing state machines | List the DRAFT → CONFIRMED → CANCELLED transitions and prohibited transitions. |
    | Implementing behaviors | Propose addLine, confirm, cancel, and requireDraft with pre-mutation checks. |
    | Maintaining a single source of truth | Explain why getTotal derives its value from order lines and getLines returns a safe snapshot. |
    | Dividing responsibilities | Keep order rules in the entity and DB queries, payments, and event publishing in services/adapters. |
    | Testing behaviors | Describe tests for confirming an empty order, modifying a confirmed order, and changing a list through a getter. |
- id: encapsulation-009
  title: Examples of Protecting Balances and Order States
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Examples of Protecting Balances and Order States**

    This lesson combines encapsulation techniques in two practical cases: Account prevents negative balances, and Order allows state changes only according to the CREATED, PAID, SHIPPED, or CANCELLED workflow. Learners test success and failure paths, overflow, list snapshots, and the limitations of in-memory synchronized operations.

    ## 2. Questions Learners Should Be Able to Answer

    ### Protecting Account Balances

    1. Why does Account use private balanceCents and synchronized deposit/withdraw instead of a setter?
    2. What happens to the balance when withdraw exceeds the available funds or deposit overflows long?
    3. What does synchronized on the same instance protect against, and why can't it replace transactions between two accounts or at the database level?

    ### Protecting the Order Lifecycle

    1. Why does OrderStatus still need state-dependent markPaid, ship, and cancel methods even when it uses an enum?
    2. How must state be preserved when ship is called in CREATED, cancel in SHIPPED, or markPaid in CANCELLED?
    3. Which modification paths are blocked by List.copyOf(items) together with an OrderItem record, and what changes if OrderItem is mutable?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Tracking account state | Calculate balances after deposits/withdrawals and determine withdraw's true/false result. |
    | Handling edge cases | Explain exceptions for negative amounts and long overflow, and show that failed operations leave balances unchanged. |
    | Checking state machines | Draw the CREATED → PAID → SHIPPED and CREATED → CANCELLED edges with their corresponding behaviors. |
    | Protecting collections | Show that modifying the input list or calling clear on items cannot corrupt the constructed Order. |
    | Evaluating synchronization scope | Distinguish synchronized within one instance from multi-account transactions, persistence, and authorization. |
    | Extending with conditions | Propose a withdrawal limit or DELIVERED state, including rejection cases that leave fields unchanged. |
