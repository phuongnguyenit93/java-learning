version: 1
type: LEARNING_ROADMAP
title: ABSTRACTION — LESSON CONNECTIONS
roadmapHeading: Learning Path Through the Lessons
roadmap:
- id: abstraction-001
  order: 1
  title: Abstraction and Selecting Essential Characteristics
  description: Start from the use case to retain the data, behavior, and rules that need to be exposed. Shipping quotes and parcel tracking illustrate different design views of the same real-world object.
  transition:
    to: abstraction-002
    description: '**From selecting capabilities to expose → distinguish how internal state is protected**'
- id: abstraction-002
  order: 2
  title: Distinguishing Abstraction from Encapsulation
  description: Separate which API the caller needs from who may change state. SeatInventory illustrates a shared contract alongside private fields, validation, and collection copies that preserve invariants.
  transition:
    to: abstraction-003
    description: '**From exposure and control boundaries → identify promises clients can rely on**'
- id: abstraction-003
  order: 3
  title: Usage Contracts and Implementation Details
  description: Clarify inputs, results, errors, side effects, and implementation substitutability using LeavePolicy. Distinguish matching Java signatures from semantic compliance and contract testing.
  transition:
    to: abstraction-004
    description: '**From overall promises → specify verifiable preconditions, postconditions, and invariants**'
- id: abstraction-004
  order: 4
  title: Preconditions, Postconditions, and Behavioral Guarantees
  description: Express contracts through preconditions, postconditions, and invariants for seat reserve/release. Examine success and failure paths, LSP, and concurrency and asynchronous limitations.
  transition:
    to: abstraction-005
    description: '**From behavioral contracts → a Java mechanism for sharing a process while requiring subclasses to complete specific steps**'
- id: abstraction-005
  order: 5
  title: Abstract Classes and Abstract Methods
  description: Use abstract classes, constructors, abstract methods, final methods, and overrides to implement ShippingPlan's Template Method. Identify shared steps and variation points through dynamic polymorphism.
  transition:
    to: abstraction-006
    description: '**From defining a base class → identify which class is actually instantiated and fulfills the contract**'
- id: abstraction-006
  order: 6
  title: Distinguishing Concrete Classes from Abstract Classes
  description: 'Compare NotificationChannel with EmailChannel and SmsChannel: the declared type may be abstract, but the instantiated object has a concrete class. Reinforce compilation rules, constructor calls, and dynamic dispatch.'
  transition:
    to: abstraction-007
    description: '**From understanding language mechanisms → decide how many abstraction layers real requirements justify**'
- id: abstraction-007
  order: 7
  title: Choosing the Right Level of Abstraction
  description: Choose a simple ParkingFeeCalculator when there is only one formula; introduce ParkingFeePolicy when multiple policies share checkout. Analyze the cost of interfaces, inheritance, and composition, and verify that refactoring preserves results.
  transition:
    to: abstraction-008
    description: '**From choosing the right structure → evaluate whether the interface truly isolates changeable details**'
- id: abstraction-008
  order: 8
  title: Implementation Details Leaking Through a Public Interface
  description: Identify APIs that require callers to know about HashMap, SQL, sessions, or unspecified behavior. Move to BookCatalog with a clear search contract, distinguish not-found results from system errors, and control returned data.
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Abstraction and Selecting Essential Characteristics | Distinguishing Abstraction from Encapsulation | Usage Contracts and Implementation Details | Preconditions, Postconditions, and Behavioral Guarantees | Abstract Classes and Abstract Methods | Distinguishing Concrete Classes from Abstract Classes | Choosing the Right Level of Abstraction | Implementation Details Leaking Through a Public Interface |
  | Key question | Which characteristics and behaviors are essential for the use case? | How does exposing capabilities differ from protecting state? | Which promises can the caller rely on? | What must hold before and after a call? | How can a process be shared while requiring subclasses to provide specific steps? | Which classes can be instantiated, and how do reference types differ from object types? | When should an interface be added, or a simple class retained? | Which backend details must the caller know because of the API? |
  | Value for OOP/the module | Reduce unnecessary data and dependencies | Preserve API boundaries and invariants | Substitute implementations with semantic safety | Verify state and substitutability | Reuse base logic through intentional inheritance | Understand Java rules and runtime polymorphism | Reduce design costs and evolve according to real needs | Protect module boundaries when technology changes |
  | Mental model developed | Model for a purpose | Separate what is visible from who may modify it | Design around verifiable promises | Reason with conditions and invariants | Identify shared behavior and extension points | Compare declared types with runtime types | Decide based on actual variants and tests | View APIs from the caller's perspective and hide unnecessary details |
