version: 1
type: LEARNING_ROADMAP
title: ENCAPSULATION — LESSON CONNECTIONS
roadmapHeading: Learning Path Connections
roadmap:
- id: encapsulation-001
  order: 1
  title: Information Hiding and Object Boundaries
  description: This lesson distinguishes the data and implementation decisions an object should keep private from the behaviors it should expose. Through ShoppingCart, learners see why private fields, meaningful APIs, and safe snapshots must work together to prevent callers from modifying the cart outside its rules.
  transition:
    to: encapsulation-002
    description: '**From API boundaries → identifying the internal state that must be protected**'
- id: encapsulation-002
  order: 2
  title: Object Invariants
  description: This lesson defines an invariant as a condition that must hold for a valid object state and explains how to show that it holds after initialization, after every successful operation, and when an operation is rejected. The StockItem example controls onHand, reserved, and available through reserve, release, ship, and restock.
  transition:
    to: encapsulation-003
    description: '**From state rules → language mechanisms that restrict who can access and modify state**'
- id: encapsulation-003
  order: 3
  title: Controlling Access and State Changes
  description: This lesson turns encapsulation principles into choices of Java access levels and validated update methods. With Wallet, learners practice protecting balances and transaction histories, handling insufficient funds, and understanding the distinction between language-level access control and user authorization.
  transition:
    to: encapsulation-004
    description: '**From access scope → choosing getters, setters, and method names that express intent**'
- id: encapsulation-004
  order: 4
  title: Getters, Setters, and Intention-Revealing Methods
  description: This lesson helps learners decide when to use getters, validated setters, domain commands, or immutable value objects. Through BankAccount, Profile, Booking, and Money, they examine permission to observe, independent permission to modify, updating multiple fields together, and the boundary between DTOs and domain models.
  transition:
    to: encapsulation-005
    description: '**From API design → validating every value and request that passes through the API**'
- id: encapsulation-005
  order: 5
  title: Input Validation at Object Boundaries
  description: This lesson identifies where data enters object-owned state and the validation responsibilities of constructors, factories, mutators, and domain behaviors. The CourseEnrollment, Reservation, Scores, and CourseCode examples illustrate normalization before validation, checking relationships among multiple fields, copying mutable data, and layering validation.
  transition:
    to: encapsulation-006
    description: '**From input validation → preventing mutable references from silently bypassing validation**'
- id: encapsulation-006
  order: 6
  title: Preventing Exposure of Mutable Internal Data
  description: 'This lesson focuses on two ways mutable references can leak: an object retaining the very data a caller supplied, and a getter returning internal data. With EnrollmentBook and Attachment, learners try modifying lists and arrays from both sides, then use appropriate copies or snapshots to keep control of updates within the class.'
  transition:
    to: encapsulation-007
    description: '**From detecting leaks → choosing the appropriate depth of copying and immutable representations**'
- id: encapsulation-007
  order: 7
  title: Defensive Copying and Immutable Representations
  description: This lesson examines how to choose between defensive copying at boundaries and immutable representations. With SafeReminder, Instant, and EventSnapshot, learners copy Date values both on input and output, convert AttendeeDraft elements into immutable values, and understand why a read-only list is insufficient if its elements remain mutable.
  transition:
    to: encapsulation-008
    description: '**From protected data → placing state-transition rules in object behavior**'
- id: encapsulation-008
  order: 8
  title: Encapsulating Behavior Instead of Merely Wrapping Data
  description: This lesson shifts the focus from classes containing only fields and setters to objects responsible for valid actions. EncapsulatedOrderDemo shows Order validating addLine, confirm, and cancel, deriving the total from OrderLine, and protecting its list, while distinguishing entity responsibilities from those of an application service.
  transition:
    to: encapsulation-009
    description: '**From behavioral encapsulation principles → testing them with Account and Order**'
- id: encapsulation-009
  order: 9
  title: Examples of Protecting Balances and Order States
  description: 'This lesson combines encapsulation techniques in two practical cases: Account prevents negative balances, and Order allows state changes only according to the CREATED, PAID, SHIPPED, or CANCELLED workflow. Learners test success and failure paths, overflow, list snapshots, and the limitations of in-memory synchronized operations.'
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 | Lesson 9 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Information Hiding and Object Boundaries | Object Invariants | Controlling Access and State Changes | Getters, Setters, and Intention-Revealing Methods | Input Validation at Object Boundaries | Preventing Exposure of Mutable Internal Data | Defensive Copying and Immutable Representations | Encapsulating Behavior Instead of Merely Wrapping Data | Examples of Protecting Balances and Order States |
  | Key question | Who may observe or modify state, and through which contract? | Which states remain valid throughout an object's lifecycle? | Which Java code can access and manipulate state? | Should getters, setters, or behaviors be exposed? | What data may enter or change an object? | Which references let callers modify internal data? | What kind of copy keeps observed data unchanged? | Who is responsible for enforcing business rules? | How do these principles work in Account and Order? |
  | Value for OOP/the module | Hide Map details and restrict ways to change the cart. | Show that inventory rules hold across all operations. | Apply access modifiers alongside a validated Wallet API. | Design suitable APIs for Account, Booking, DTOs, and value objects. | Validate constructors, mutators, and relationships among fields. | Prevent inbound/outbound aliasing of lists and arrays. | Create EventSnapshot with genuinely immutable elements. | Design Order around its lifecycle, separating entity and service. | Verify balance invariants and state transitions with executable Java. |
  | Mindset developed | Identify ownership and public boundaries. | Model valid states before writing mutators. | Minimize access and centralize updates with the owner. | Treat each method call as a request governed by a contract. | Validate the actual value to be stored before committing. | Trace modification rights through every shared reference. | Copy owned data appropriately; avoid arbitrarily cloning entities. | Ask objects to perform actions instead of manipulating fields. | Compare success, failure, and the model's limitations. |
