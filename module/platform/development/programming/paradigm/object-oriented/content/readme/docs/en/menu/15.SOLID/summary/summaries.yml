summaries:
- id: solid-001
  title: Purpose and Scope of SOLID
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Purpose and Scope of SOLID**

    Understand SOLID as five OOP design principles intended to reduce the ripple effects of changes, improve testability, and preserve behavioral contracts. This lesson applies SRP, OCP, LSP, ISP, and DIP to one checkout scenario involving discount policies, order persistence, and receipt delivery. It also clarifies that SOLID does not automatically guarantee atomic transactions, security, or business correctness, nor does it require every class to have an interface.

    ## 2. Questions Learners Must Be Able to Answer

    ### Meaning, Scope, and Connections

    1. Why would a CheckoutService that calculates discounts, writes SQL, sends SMTP messages, and constructs JSON face multiple unrelated groups of change requests?
    2. Which design question does each letter S, O, L, I, and D address, and how does LSP support OCP's extensibility?
    3. Why do small interfaces support ISP and DIP without guaranteeing that a class has one responsibility or that implementations can safely substitute for one another?
    4. In SolidScopeDemo, which components protect invariants, which coordinate the flow, and which are merely adapters?

    ### Application Decisions and Risks

    1. For an Order containing BOOK at 15.000 cents and two PEN items at 2.500 cents each, why does a 10% discount equal 2.000 cents and leave a total of 18.000 cents?
    2. When does a Money value object or a simple CRUD implementation not yet need a separate policy interface?
    3. If saving the order succeeds but sending the receipt fails, why does SOLID not automatically address transactions, outboxes, and idempotency?
    4. How can SOLID's benefits be measured by the cost of change, testing, and clarity rather than the number of interfaces?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Explain the five principles | Match S/O/L/I/D to responsibility boundaries, variation, substitution contracts, client needs, and dependency direction. |
    | Read the checkout design | Identify the roles of Order/OrderLine, DiscountPolicy, CheckoutService, repository, and sender in SolidScopeDemo. |
    | Verify contracts | Explain the 0..subtotal discount limit, the 20.000/2.000/18.000 cent calculations, and checks for invalid policies. |
    | Choose an application scope | Compare simple designs with policies/ports that add value when rules or integrations change. |
    | Recognize concerns beyond SOLID | Explain why transactions, concurrency, security, and consistency need additional solutions. |
- id: solid-002
  title: 'Single Responsibility: One Group of Reasons to Change'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Single Responsibility: One Group of Reasons to Change**

    Understand SRP as one cohesive group of reasons to change, determined by responsibility and actor, rather than one method per class. The lesson uses Invoice for lifecycle invariants and totals; ReceiptFormatter, InvoiceRepository, and NotificationSender handle presentation, storage, and communication details; InvoiceWorkflow only coordinates the use case. Learners assess cohesion, coupling, and justified class separation based on real pressures for change.

    ## 2. Questions Learners Must Be Able to Answer

    ### Invoice Responsibilities and Invariants

    1. Why do Invoice.addLine(), totalCents(), and issue() belong to the same responsibility group despite being multiple methods?
    2. What different groups of changes are represented by updating a PDF logo, SQL schema, email provider, and invoice issuance conditions?
    3. Why can InvoiceWorkflow have three dependencies and still satisfy SRP if its responsibility is coordinating a single use case?
    4. In SrpDemo, why does INV-9 total 35.000 VND and reject a second issuance?

    ### Deliberate Separation and Testing

    1. If addLine, total, and issue are split into three separate services, what risks arise from weaker encapsulation and greater indirection?
    2. When persistence or notification delivery fails after invoice.issue(), how should the responsibilities of Invoice, Workflow, and infrastructure be maintained?
    3. How can entities, value objects, application services, formatters, and adapters be distinguished by the kinds of rules each owns?
    4. How can real change scenarios and domain tests independent of DB/SMTP be used to evaluate SRP boundaries?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Identify reasons for change | Group Invoice domain rules appropriately and separate PDF/DB/email changes into their respective adapters. |
    | Protect invariants | Explain why empty invoices cannot be issued, issued invoices cannot be modified, and totals must not overflow. |
    | Predict SrpDemo results | Reproduce the 35.000 total, one saved invoice, one sender invocation, and rejection of duplicate issuance. |
    | Distinguish coordinators from god classes | Explain why several dependencies can still satisfy SRP when they all support coordination of one use case. |
    | Propose justified refactoring | Identify change boundaries through cohesion/coupling and test domain, formatter, and integration concerns separately. |
- id: solid-003
  title: 'Open–Closed: Extending Behavior with Controlled Changes'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Open–Closed: Extending Behavior with Controlled Changes**

    Understand OCP as placing the variation point behind a stable contract so implementations can be added without changing the orchestration algorithm for each variant. OpenClosedDemo uses ShippingPolicy, ShippingService, and a Map registering Standard/Express/SameDay; the RemoteAreaSurcharge example uses composition/decorator. The lesson emphasizes a contract requiring nonnegative fees and non-null results, the changes needed at the composition root, and cases where a simple switch is still appropriate.

    ## 2. Questions Learners Must Be Able to Answer

    ### Extension Points and Stable Parts

    1. Why does adding SameDayShipping as a new ShippingPolicy not require changing ShippingService.quote, even though its code must still be registered in the Map?
    2. For an Order with a subtotal of 150.000 VND and weight of 1.200 g, why do Standard, Express, and SameDay quote 20.000, 51.000, and 70.000 VND?
    3. Which contract does ShippingService preserve by checking for missing policies, null results, and negative fees?
    4. Why is it incorrect to say that OCP forbids all code modifications when the underlying contract itself changes?

    ### Extension and Trade-offs

    1. How does RemoteAreaSurcharge wrap ExpressShipping through composition to produce a total fee of 56.000 VND?
    2. When should Strategy/Decorator be chosen over adding if/else branches to one function, and when is a switch easier to maintain?
    3. If a feeFor plugin modifies Order or uses the wrong currency unit, does adding a new class really provide a safe extension?
    4. Which refactoring steps and contract tests preserve existing fees, add a new policy, and detect missing registration configuration?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Find variation points | Distinguish independently changing shipping policies from stable validation and orchestration. |
    | Implement interchangeable policies | Write ShippingPolicy and a new implementation, register it at the composition root, and preserve ShippingService.quote. |
    | Verify example results | Calculate 20.000/51.000/70.000 VND and the decorator surcharge that raises Express to 56.000 VND. |
    | Preserve extension contracts | Check for non-null results, nonnegative fees in VND, errors for unsupported codes, and unchanged inputs. |
    | Evaluate abstraction costs | Choose interfaces, decorators, or switches based on variation frequency, wiring complexity, and testing costs. |
- id: solid-004
  title: 'Liskov Substitution: Preserving the Supertype Contract'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Liskov Substitution: Preserving the Supertype Contract**

    Understand LSP as the ability to substitute a subtype for a supertype while preserving the behavioral guarantees promised to callers, a stronger requirement than Java accepting extends/implements. The lesson specifies preconditions, postconditions, invariants, exceptions, and side effects for DiscountPolicy, comparing valid FixedDiscount and ThresholdDiscount implementations with BadVipDiscount, which strengthens a condition, and BadFixedDiscount, which discounts more than the subtotal. The same contract tests must apply to every implementation.

    ## 2. Questions Learners Must Be Able to Answer

    ### Contracts and Discount Examples

    1. Why is implementing DiscountPolicy insufficient to guarantee that CheckoutService.total calculates correctly with a new implementation?
    2. How does the precondition requiring a non-null, nonnegative subtotal for discountFor differ from the postcondition requiring the discount to lie within 0..subtotal?
    3. Given a subtotal of 25.00, why does FixedDiscount(10) yield a total of 15.00 while ThresholdDiscount yields 25.00?
    4. Why does BadVipDiscount throwing UnsupportedOperationException below the threshold of 100 strengthen the precondition?
    5. Why does BadFixedDiscount returning 50 for an order of 25 weaken the postcondition and produce a total of -25?

    ### Verification and Type Relationship Design

    1. If the shared contract does not promise independent setters, does the Rectangle/Square example still violate LSP for the same reason as before?
    2. Beyond results, which errors, invariants, ordering requirements, and side effects must be preserved when clients are entitled to rely on them?
    3. Why must the same test suite for all DiscountPolicy implementations include subtotals of 0, 25, 100, and 250, along with negative/null input?
    4. If a subtype does not support valid interface behavior, when should the contract be split or composition used instead?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | State practical LSP requirements | Correctly explain that preconditions must not be stronger, postconditions must not be weaker, and invariants, errors, and side effects must remain compatible. |
    | Analyze contrasting cases | Classify Fixed/Threshold as valid and BadVip/BadFixed as violations with a subtotal of 25.00. |
    | Build contract tests | Design one contract test suite for every policy, including boundary values and rejected inputs. |
    | Evaluate poorly designed subtypes | Explain the risks of Rectangle/Square with independent setters and propose immutable interfaces or composition. |
    | Protect clients through abstractions | Detect code that compiles but has incorrect semantics without patching it through subtype-specific instanceof checks. |
- id: solid-005
  title: 'Interface Segregation: Contracts Tailored to Each Client'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Interface Segregation: Contracts Tailored to Each Client**

    Understand ISP from the client's needs: DownloadService requires only DocumentReader, ImportService only DocumentWriter, and data cleanup requires DocumentDeleter. The lesson shows why ReadOnlyArchive should not implement write/delete contracts and then throw UnsupportedOperationException, while InMemoryStore can legitimately fulfill multiple interfaces. Learners choose API boundaries, test with lambdas/fakes, and distinguish Java type restrictions from actual access authorization.

    ## 2. Questions Learners Must Be Able to Answer

    ### Contracts Based on Needs

    1. Why is a DocumentStorage containing findById, save, and delete unsuitable for a read-only ReadOnlyArchive?
    2. Which interfaces should DownloadService and ImportService accept so the compiler exposes only the operations they actually need?
    3. Why does InMemoryStore implementing DocumentReader, DocumentWriter, and DocumentDeleter not violate ISP?
    4. When is a combined DocumentAdmin interface justified, and when does splitting out every method create excessive fragmentation?

    ### Effects and Testing

    1. In IspDemo, why can the same DownloadService read document D01 from mainStore and A01 from ReadOnlyArchive?
    2. How can a DocumentWriter lambda test ImportService without stubbing the entire read/delete API?
    3. Why does injecting DocumentReader not replace authorization checks at a REST/Spring endpoint?
    4. If a public interface is used by many modules, how can clients migrate gradually while preserving semantics and compatibility?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Detect fat interfaces | Identify obligations that force ReadOnlyArchive to throw errors for save/delete operations permitted by an overly broad contract. |
    | Segregate APIs by client | Design DocumentReader, DocumentWriter, and DocumentDeleter and inject the appropriate interfaces into services. |
    | Support multiple legitimate roles | Explain why InMemoryStore can implement multiple interfaces while an archive exposes only reading capabilities. |
    | Test clients simply | Write interface-specific fakes/lambdas to test document downloading or importing independently. |
    | Distinguish APIs from security | Explain the difference between compile-time restrictions and actual application permissions. |
- id: solid-006
  title: 'Dependency Inversion: Depending on Abstractions'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Dependency Inversion: Depending on Abstractions**

    Understand DIP as inverting source-code dependency direction: CustomerSpendingService uses PurchaseReader defined on the use-case side, while JdbcPurchaseReader and InMemoryPurchaseReader implement that port. The lesson distinguishes build-time dependencies from runtime call flow, avoids exposing ResultSet/SDK types in business APIs, and shows how to test the service with fakes, adapters with integration tests, and the application with wiring tests.

    ## 2. Questions Learners Must Be Able to Answer

    ### Dependency Direction and Ports

    1. Why does CustomerSpendingService constructing JdbcPurchaseReader itself make purchase-total rules depend on infrastructure?
    2. In the service → PurchaseReader ← adapter diagram, how does source-code dependency direction differ from runtime call direction?
    3. Why should the findByCustomer port return a domain List of Purchase rather than ResultSet or ResponseEntity?
    4. Why may the composition root know about concrete adapters while a use-case class should not import them?

    ### Contracts and Testing

    1. In DipDemo, why does KH01 have a total of 330.000 VND when a 100.000 transaction was refunded, while KH02 has a total of 0?
    2. How would PurchaseReader returning null, returning transactions for the wrong customerId, or swallowing DB errors as empty lists violate its contract?
    3. When replacing in-memory storage with JDBC, which tests verify the service's addition logic and which require a database to verify SQL?
    4. When is a port truly useful, and when does creating an interface for a simple helper merely increase complexity?
    5. Why is constructor injection with a parameter of type JdbcPurchaseReader still insufficient to achieve DIP?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Draw dependency directions correctly | Show service → port ← adapter and where bootstrap code creates the connection. |
    | Design domain-appropriate ports | Define PurchaseReader without exposing DataSource/ResultSet or technology-specific DTOs to the application. |
    | Trace DipDemo results | Calculate the correct total of 330.000 VND for KH01 and 0 for a customer without transactions. |
    | Classify and test risks | Use fakes for business tests, integration tests for JDBC adapters, and wiring tests for bean selection. |
    | Evaluate abstraction value | Identify genuine changing technology boundaries and avoid interfaces that simply mirror infrastructure. |
- id: solid-007
  title: Distinguishing Dependency Inversion from Dependency Injection
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Distinguishing Dependency Inversion from Dependency Injection**

    Distinguish DIP, a principle governing source-code dependency direction, from DI, a technique for supplying dependencies externally; IoC is broader, and Spring is only one wiring mechanism. Through CheckoutService/PaymentGateway/DemoBankAdapter, learners see that a constructor accepting a concrete adapter uses DI but remains coupled to that adapter. To achieve DIP, the service must depend on a business port, the adapter must implement the port, and the composition root must assemble them. The lesson illustrates fake gateways, input tests, and reply errors.

    ## 2. Questions Learners Must Be Able to Answer

    ### DIP, DI, IoC, and Ownership

    1. Why does CheckoutWithDiButWithoutDip passing DemoBankAdapter through a constructor count as DI without achieving DIP?
    2. How does CheckoutService → PaymentGateway ← DemoBankAdapter differ from CheckoutService → DemoBankAdapter in source-code dependencies?
    3. Why may the composition root and Spring @Bean know concrete implementations, and is Spring necessary to perform DI manually?
    4. Why does PaymentGateway exposing DTOs from a bank SDK still cause coupling even when its parameter type looks like an interface?

    ### Testing and Implementation

    1. In DipDiDemo, which transaction ID does PaymentGateway return for ORD-001 and 150.000 VND, and what fields does Receipt contain?
    2. How does a fake PaymentGateway help verify requests, invocation counts, and unexpected responses without contacting a bank?
    3. How do constructor, setter, and field injection differ in whether dependencies are required and in initialization state?
    4. Why do @Autowired or a service locator not automatically satisfy DIP or fix a payment contract lacking idempotency?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Distinguish the three concepts | Explain clearly that DIP concerns dependency direction, DI concerns wiring, and IoC is a broader control concept. |
    | Separate ports and adapters | Write CheckoutService to accept PaymentGateway, with DemoBankAdapter implementing the business-side interface. |
    | Configure components in the right place | Use main or Spring @Bean to select an implementation without having the service import an SDK. |
    | Test with fakes | Verify that the gateway receives the correct orderId/amount, returns a valid transactionId, and is not called for invalid input. |
    | Evaluate injection | Choose constructor injection for required dependencies and explain why DI does not itself guarantee DIP. |
- id: solid-008
  title: Balancing the Principles with Real-World Complexity
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Balancing the Principles with Real-World Complexity**

    Learn to balance SRP/OCP/LSP/ISP/DIP against real pressures for change and the cost of abstraction. The lesson moves from SimpleCheckout with Standard only (30.000 VND, free from 500.000) to DeliveryFeePolicy when Express appears with a formula of 50.000 plus 5.000 per kilogram rounded up. Learners weigh if/switch statements, policies, registries, KISS, and YAGNI, and evaluate change surface, tests, and readability rather than counting classes.

    ## 2. Questions Learners Must Be Able to Answer

    ### Applying Principles to Actual Needs

    1. Why can a single SimpleCheckout class with a fixed shipping formula be preferable to a policy/registry system when no variants exist?
    2. When Standard and Express change independently, what makes DeliveryFeePolicy valuable?
    3. For Order(600.000 VND, 1.500 g), why is the Standard total 600.000 while the Express total is 660.000 VND?
    4. In DeliveryDemo, how can the number of kilograms rounded up be calculated correctly without adding 999 and risking overflow?

    ### Design Costs and Verification

    1. When is retaining a clear if/switch more reasonable than Strategy, a factory, or a plugin loader?
    2. How can inherent business complexity be distinguished from implementation complexity and complexity added in anticipation of future needs?
    3. What do KISS, YAGNI, and DRY recommend, and why should two rules with similar syntax not necessarily be combined?
    4. Instead of counting interfaces, how should change surface, regression risk, operating costs, and tests be evaluated?
    5. Why might adding a new policy still require changing an enum/registration configuration without violating OCP for the total calculation?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Choose abstraction levels | Compare SimpleCheckout with DeliveryFeePolicy based on the emergence of independent rules. |
    | Verify shipping fees | Predict free Standard shipping and a 60.000 VND Express fee for an order worth 600.000 VND weighing 1.500 g. |
    | Recognize overengineering | Identify single-implementation interfaces, deep inheritance, and speculative plugins without a present need. |
    | Evaluate with evidence | Use change surface, readability, testability, and regression failures to choose useful boundaries. |
    | Preserve behavior when refactoring | Plan to capture existing behavior with tests, extract policies, and recheck results, exceptions, and side effects. |
