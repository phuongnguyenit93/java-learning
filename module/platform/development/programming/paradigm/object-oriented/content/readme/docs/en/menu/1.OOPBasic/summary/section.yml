version: 1
type: LEARNING_ROADMAP
title: OOP THINKING — CONNECTING THE LESSONS
roadmapHeading: How the lessons connect
roadmap:
- id: oop-basic-001
  order: 1
  title: What Is OOP, and How Does It Help Organize Programs?
  description: Identify system-organization problems as data, behavior, and rules grow; use BankAccount and the checkout flow to see the value of clear responsibility boundaries.
  transition:
    to: oop-basic-002
    description: '**From the need to organize a system → identify the smallest component responsible for maintaining valid state.**'
- id: oop-basic-002
  order: 2
  title: Objects, State, Behavior, and Responsibility
  description: 'Examine a specific Order in depth: its state, invariants, valid behaviors, and responsibility for protecting them throughout its lifecycle.'
  transition:
    to: oop-basic-003
    description: '**From the nature of an object → accurately identify classes, types, instances, and references in Java code.**'
- id: oop-basic-003
  order: 3
  title: 'Classes, Types, and Instances: Foundational Concepts'
  description: Distinguish a class definition, a type as seen by the compiler, a runtime instance, and a reference variable to predict which objects are actually created.
  transition:
    to: oop-basic-004
    description: '**From an individual object → examine how objects exchange calls to complete a business operation.**'
- id: oop-basic-004
  order: 4
  title: Object Interactions and Method Calls
  description: Trace the caller, receiver, arguments, results, and exceptions in a book-borrowing flow where multiple objects collaborate.
  transition:
    to: oop-basic-005
    description: '**From calls governed by a contract → learn mechanisms for protecting and extending how that contract is fulfilled.**'
- id: oop-basic-005
  order: 5
  title: Encapsulation, Abstraction, Inheritance, and Polymorphism
  description: Explore four design mechanisms through Cart and DiscountPolicy; analyze shared contracts, protected state, and behavior selected at runtime.
  transition:
    to: oop-basic-006
    description: '**From OOP mechanisms → compare function-based organization to understand the benefits for different requirements.**'
- id: oop-basic-006
  order: 6
  title: 'OOP and Procedural Programming: Decomposing a Problem'
  description: Compare two ways to organize the same cart calculation yielding 405.000 VND, evaluating responsibility, cohesion, coupling, and the need for change.
  transition:
    to: oop-basic-007
    description: '**From organizing responsibilities in Java → broaden the perspective to a prototype-based OOP model.**'
- id: oop-basic-007
  order: 7
  title: Class-Based OOP and Prototype-Based OOP
  description: Compare Java class/method dispatch with JavaScript objects and prototype chains, including shadowing and shared mutable data.
  transition:
    to: oop-basic-008
    description: '**From alternative OOP models → choose the appropriate level of design for real situations.**'
- id: oop-basic-008
  order: 8
  title: When to Use OOP and When to Avoid It
  description: Use state, invariants, behavioral variations, and complexity as criteria for choosing objects, functions, or a suitable combination for the problem.
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Title | What Is OOP, and How Does It Help Organize Programs? | Objects, State, Behavior, and Responsibility | Classes, Types, and Instances: Foundational Concepts | Object Interactions and Method Calls | Encapsulation, Abstraction, Inheritance, and Polymorphism | OOP and Procedural Programming: Decomposing a Problem | Class-Based OOP and Prototype-Based OOP | When to Use OOP and When to Avoid It |
  | Key question | Why use OOP to organize a system? | How does an object maintain its state and rules? | How do class, type, instance, and reference differ? | How do objects collaborate and pass results/errors? | How do the four mechanisms protect and extend behavior? | Should the problem be divided by functions or object responsibilities? | Is a method found through a class or a prototype chain? | When is OOP worth the design cost? |
  | Value for OOP/the module | Establish business responsibility boundaries | Build objects that maintain invariants | Read Java runtime models accurately | Design collaborations and method contracts | Apply encapsulation, abstraction, inheritance, and polymorphism | Evaluate cohesion and coupling across organizational approaches | Understand OOP models beyond Java | Avoid overengineering and choose useful abstractions |
  | Perspective gained | From isolated functions to responsibilities | From data to behavior that protects data | From variable names to identity and type | From individual calls to collaboration sequences | From language mechanisms to design contracts | From paradigm preferences to trade-offs | From fixed classes to dynamic delegation | From a model that can be used to a model that should be used |
