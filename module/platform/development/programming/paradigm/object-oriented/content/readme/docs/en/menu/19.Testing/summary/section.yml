version: 1
type: LEARNING_ROADMAP
title: TESTING — LESSON CONNECTIONS
roadmapHeading: How the Lessons Connect
roadmap:
- id: testing-001
  order: 1
  title: Testing Public Behavior and Object Contracts
  description: 'Test as a client of SeatInventory: start from its contract and observable results, including failure without mutation and snapshot semantics.'
  transition:
    to: testing-002
    description: '**From public contracts → checking when valid state is established**'
- id: testing-002
  order: 2
  title: Testing Constructors and Invalid States
  description: 'Examine object creation: constructors, records, and builders must not expose invalid state; check boundary values, cross-field constraints, overflow, and aliasing.'
  transition:
    to: testing-003
    description: '**From valid construction → protecting invariants during subsequent changes**'
- id: testing-003
  order: 3
  title: Testing Invariants and State Transitions
  description: 'Move from a newly valid object through the entire Wallet lifecycle: test ACTIVE/FROZEN/CLOSED transitions, post-failure state, and operation sequences.'
  transition:
    to: testing-004
    description: '**From stateful object behavior → applying a common contract across different implementations**'
- id: testing-004
  order: 4
  title: Testing Multiple Implementations of One Interface
  description: 'Address multiple IntSet implementations: encapsulate a parameterized contract suite using Supplier/factory to test different classes against the same standard.'
  transition:
    to: testing-005
    description: '**From shared contract tests → evaluating subtype substitutability under LSP**'
- id: testing-005
  order: 5
  title: Testing Subtype Substitutability
  description: 'Move from shared tests to LSP: verify that a subtype neither restricts valid inputs nor weakens postconditions; test DiscountPolicy through Checkout.'
  transition:
    to: testing-006
    description: '**From honoring subtype contracts → deliberately isolating collaborators outside the SUT**'
- id: testing-006
  order: 6
  title: Fakes, Stubs, Mocks, and Collaborators
  description: 'Extend SUT testing to collaborators: distinguish stateful fakes, stubs providing indirect inputs, and mocks/spies verifying external effects.'
  transition:
    to: testing-007
    description: '**From using test doubles → designing dependencies for safe substitution**'
- id: testing-007
  order: 7
  title: Designing for Replaceable Dependencies in Tests
  description: 'Design classes with replaceable collaborators: use ports, constructor DI, a composition root, and Clock.fixed to create test seams independent of networks and real time.'
  transition:
    to: testing-008
    description: '**From established test seams → choosing assertions that do not bind tests to internal algorithms**'
- id: testing-008
  order: 8
  title: Avoiding Tests Tightly Coupled to Internals
  description: 'Reassess assertion quality: test Quote results and meaningful side effects without fixing helper/PriceCatalog call counts that the contract does not promise.'
  transition:
    to: testing-009
    description: '**From refactoring-resilient tests → building regression suites as designs change**'
- id: testing-009
  order: 9
  title: Regression Testing During Design Changes
  description: When changing a design, use contracts and regression tests as a baseline, run both versions, and verify the 100.000-cent free-shipping threshold with an independent oracle.
  transition:
    to: testing-010
    description: '**From preserving a single API contract → verifying entire workflows across multiple objects**'
- id: testing-010
  order: 10
  title: Testing Interactions Among Multiple Objects
  description: 'Combine the concepts in a multi-object workflow: verify reserve/charge/release/send branches and ordering; pair interaction tests with stateful fakes.'
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 | Lesson 9 | Lesson 10 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Testing Public Behavior and Object Contracts | Testing Constructors and Invalid States | Testing Invariants and State Transitions | Testing Multiple Implementations of One Interface | Testing Subtype Substitutability | Fakes, Stubs, Mocks, and Collaborators | Designing for Replaceable Dependencies in Tests | Avoiding Tests Tightly Coupled to Internals | Regression Testing During Design Changes | Testing Interactions Among Multiple Objects |
  | Questions to Understand | What does an object promise its client, including on failure? | Under what conditions is an object initialized validly? | How are state/invariants and transitions preserved across commands? | Do interface implementations exhibit the same behavior? | Can the subtype truly substitute for its supertype? | Which kind of test double should replace a collaborator? | How can tests control I/O, time, and dependencies? | Which assertions express contracts versus implementation details? | Does refactoring preserve observable behavior? | Do multiple objects collaborate under the right conditions and in the right order? |
  | Value for OOP/the Module | Test public behavior without locking in implementations | Prevent invalid objects and aliasing from escaping | Preserve invariants of mutable entities | Test multiple adapters/implementations with one suite | Detect LSP violations beyond compiler checks | Test logic without real infrastructure calls | Isolate services for reproducible tests | Avoid false failures on valid refactorings | Prevent regressions at boundaries and wiring points | Prevent incorrect charging, emailing, or inventory release |
  | Mental Model Developed | Specify promises before writing tests | Test object-creation boundaries | Think in state machines and failure paths | Design reusable tests | Compare abstraction preconditions and postconditions | Choose fakes/stubs/mocks to match the goal | Design for replaceable dependencies | Distinguish real effects from details | Use independent oracles, baselines, and CI | Analyze workflow branches and consequences |
