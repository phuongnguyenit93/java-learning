summaries:
- id: polymorphism-001
  title: Polymorphism and Multiple Implementations of the Same Operation
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Polymorphism and Multiple Implementations of the Same Operation**

    Recognize polymorphism when the same ShippingPolicy.quote(Parcel) call executes different pricing formulas on EconomyShipping, StandardShipping, and ExpressShipping objects. This lesson explains the roles of reference types and runtime types, how CheckoutService depends only on the quotation contract, and why every implementation must honor the rules for inputs, results, and errors.

    ## 2. Questions Learners Should Be Able to Answer

    ### Shared Calls and Different Behaviors

    1. Why can all three shipping classes be stored as ShippingPolicy and receive the same quote(Parcel) call?
    2. How do the declared type of the policy variable and the object's runtime class affect the quote call differently?
    3. For an intra-city parcel weighing 1.500 g, why do Economy, Standard, and Express quote 20.000, 25.000, and 95.000 VND, respectively?

    ### Contracts and Strategy Selection

    1. Why isn't having a method named quote sufficient for Java to treat a class as a subtype if it does not declare implements ShippingPolicy?
    2. What happens if an implementation quotes a negative price or returns an invalid estimated time even though the code compiles?
    3. When is a Map or switch appropriate for package selection, and when do repeated conditionals across services undermine the benefits of polymorphism?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Recognize dynamic dispatch | Trace three quote calls from the same ShippingPolicy variable to their corresponding implementations. |
    | Verify pricing formulas | Recalculate the fees and delivery times of three packages for an intra-city parcel weighing 1.500 g. |
    | Design a shared client | Make CheckoutService accept ShippingPolicy without implementing each package's pricing formula. |
    | Evaluate contracts | Check that quote results are non-null, fees are nonnegative, estimated days are positive, and inputs are valid. |
    | Extend strategies | Identify where to register a new implementation and which contract tests must be added. |
- id: polymorphism-002
  title: Subtype Polymorphism Through Interfaces or Superclasses
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Subtype Polymorphism Through Interfaces or Superclasses**

    Clarify subtype polymorphism through interface implements and superclass extends. Using NotificationSender and Report, learners see how a supertype reference can refer to different objects, how a final superclass method can still call an overridden hook, and the limitations of upcasting, downcasting, and generic collection invariance.

    ## 2. Questions Learners Should Be Able to Answer

    ### Supertypes and Implementations

    1. Why can NotificationDispatcher use EmailSender or PushSender without branching on the channel type?
    2. Although Report.preview() is declared final, how does it invoke SalesReport.content() and AuditReport.content() differently?
    3. When a Device reference refers to a Printer, why does upcasting neither create a new object nor permit direct calls to printPage()?

    ### Casting and Subtype Contracts

    1. When does casting Device to Printer cause ClassCastException, and when is an instanceof check appropriate?
    2. Why can't a list of EmailSender elements be assigned directly to a List declared to hold NotificationSender elements in Java?
    3. When adding SmsSender, how must the guarantees regarding Notification inputs, DeliveryResult states, and errors be maintained?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Analyze subtypes | Distinguish implements and extends relationships and static/runtime types in calls through supertype variables. |
    | Trace overrides from a superclass | Explain why final Report.preview still executes content implementations supplied by subclasses. |
    | Cast safely | Diagnose compilation errors and ClassCastException, then use instanceof where subtype-specific functionality is required. |
    | Use polymorphic collections | Iterate through a List of NotificationSender objects and explain generic invariance versus extends wildcards. |
    | Preserve substitutability | State the shared behavioral constraints when multiple notification channels are used. |
- id: polymorphism-003
  title: Static Method Resolution and Dynamic Dispatch
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Static Method Resolution and Dynamic Dispatch**

    Analyze a Java method call in two stages: the compiler finds and selects an overload signature using the static types of the receiver and arguments; then the JVM selects the overridden instance-method body according to the runtime object. Dispatcher/SmartDispatcher demonstrates receiver casts, static hiding, field resolution, super, constructors, and the meaning of method-invocation opcodes.

    ## 2. Questions Learners Should Be Able to Answer

    ### Compile Time and Runtime

    1. Why does general.dispatch(sms) invoke SmartDispatcher.dispatch(Event) while specific.dispatch(sms) invokes the SmsEvent version?
    2. How does casting the receiver from SmartDispatcher to Dispatcher change the overload set visible to the compiler?
    3. Given choose(long), choose(Integer), and choose(int...), why does literal argument 5 select the long overload?
    4. Does overloading use an argument's runtime class to find a more specific signature after the program starts running?

    ### Special Members and JVM Observations

    1. At which decision stage do static method hiding and field lookup differ from instance-method overriding?
    2. How do this.run() and super.run() differ, particularly when a superclass method calls a subclass hook?
    3. Why should an overridable hook not be called from a superclass constructor?
    4. How does the purpose of invokedynamic differ from OOP dispatch using invokevirtual or invokeinterface?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Explain two-stage dispatch | Build an accurate table of compile-time signatures and runtime implementations for Dispatcher calls. |
    | Analyze receiver casts | Predict the output of specific.dispatch(sms) before and after casting the receiver. |
    | Diagnose overloads | Explain widening, boxing, varargs, and ambiguity involving null. |
    | Distinguish hiding | Predict static-method and field lookup using static types without confusing them with overriding. |
    | Relate behavior to bytecode | Identify invocation categories for invokestatic, invokevirtual, invokeinterface, and invokespecial, and distinguish invokedynamic. |
- id: polymorphism-004
  title: Overriding and Runtime Method Selection
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Overriding and Runtime Method Selection**

    Examine overriding with correct signatures and contracts. RuntimeDispatchDemo keeps distance validation and total-fee calculation in final DeliveryPlan.quote, while subclasses customize distanceFee through a hook that may reuse super.distanceFee. The lesson also explains covariant returns, visibility, checked exceptions, and the trap of dispatching to a subclass during superclass construction.

    ## 2. Questions Learners Should Be Able to Answer

    ### Overrides and Shared Processes

    1. Why does StandardPlan.quote(3) return 16.000 VND while ExpressPlan.quote(3) returns 26.000 VND even though both call quote?
    2. Why can a final quote() method still invoke ExpressPlan.distanceFee() even though quote() cannot be overridden?
    3. When are covariant returns valid, and why are reduced access or incompatible broader checked exceptions rejected?
    4. What role does super.distanceFee() play when ExpressPlan needs to add 5.000 VND?

    ### Protecting Invariants and Construction

    1. Why can a Parent constructor print null when it calls describe() overridden by Child?
    2. For a new subclass, which rules concerning distanceKm, nonnegative surcharges, and overflow must be preserved?
    3. If a subclass method changes its parameter type, why does it become an overload rather than an override?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Write valid overrides | Implement @Override with correct signatures, access levels, return types, and checked exceptions. |
    | Read Template Method | Trace the final quote method into the distanceFee hook to calculate Standard/Express fees. |
    | Use super appropriately | Combine superclass algorithms with subclass surcharges without duplicating validation or side effects. |
    | Detect constructor traps | Explain null output before subclass fields are initialized and suggest avoiding early hook calls. |
    | Preserve contracts when extending | Identify invariants protected by the base class and conditions that hooks must satisfy. |
- id: polymorphism-005
  title: Distinguishing Overriding from Overloading
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Distinguishing Overriding from Overloading**

    Distinguish overloading, which uses the same name with different parameters, from overriding, which uses a compatible signature in a supertype. DispatchDemo illustrates the compiler selecting an overload before the JVM selects an override; cases involving null, casts, widening/boxing/varargs, and @Override help learners debug code with multiple methods sharing a name.

    ## 2. Questions Learners Should Be Able to Answer

    ### Signatures and Two Stages

    1. Why doesn't changing only the return type or parameter names create a valid overload?
    2. In DispatchDemo, why does formatter.format(animalReference) execute SpecialFormatter: Animal while formatter.format(dog) executes Formatter: Dog?
    3. How does casting dog to (Animal) change overload selection even though the object remains a Dog?
    4. Why doesn't adding only handle(String) to ChildHandler cause calls through BaseHandler to select that overload automatically?

    ### Common Sources of Confusion

    1. When does show(null) select String over Object, and when is it ambiguous between String and Integer?
    2. Why does literal 10 select show(long) when the example also provides show(Integer) and show(int...)?
    3. Under what constraints can static, private, and final methods and constructors be overloaded or overridden?
    4. How do @Override and DispatchContractCheck confirm that a signature is actually overridden?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Classify same-named methods | Write two overloaded signatures and one valid override; explain why return types do not distinguish overloads. |
    | Predict results | Reproduce the five output lines of DispatchDemo using the static argument type and runtime receiver. |
    | Explain casts and null | Analyze most-specific selection, ambiguity, and changes to overload selection caused by casts. |
    | Distinguish conversions | Explain the widening, boxing, and varargs phases of overload resolution. |
    | Verify overrides | Use @Override and a short check to detect signatures that diverge from the contract. |
- id: polymorphism-006
  title: Distinguishing Member Hiding from Overriding
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Distinguishing Member Hiding from Overriding**

    Explain how a subclass declaring a member with the same name as its superclass may be hiding a field, hiding a static method, or overriding an instance method. The Parent/Child demo shows that fields are selected by static type, static members by class name, and describe by runtime dispatch. The lesson explains why two same-named fields have independent state and why data should be encapsulated behind behavior with a defined contract.

    ## 2. Questions Learners Should Be Able to Answer

    ### Same Names, Different Rules

    1. Why do parentView.label and childView.label access different fields when Parent parentView refers to a Child?
    2. Why does parentView.kind() avoid dynamic dispatch while parentView.describe() uses it?
    3. Does secretLabel() in SecureChild override a same-named private method in SecureBase, and why?
    4. In Child.inspect(), where do this.label, super.label, this.describe(), and super.describe() resolve their members?

    ### State and API Design

    1. Why do the values stay independent when CounterChild.count and CounterBase.count are assigned through two references?
    2. How can a final field be hidden in a subclass, while a final instance method prevents overriding?
    3. Why should an overridden environment() getter be used instead of same-named public environment fields?
    4. What ambiguities must be resolved when two interfaces both declare VERSION or default action()?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Recognize hiding | Correctly classify field hiding, static hiding, independent private methods, and overriding. |
    | Predict demo results | Explain the parentView.label, kind, describe, report, and inspect output lines. |
    | Track two independent fields | Simulate updates to Parent/Child count fields through casts without treating them as one variable. |
    | Use super legally | Distinguish super.field and super.method and respect private access restrictions. |
    | Improve state design | Propose private fields and overridable methods to express runtime-dependent behavior. |
- id: polymorphism-007
  title: The Scope of Polymorphism for Methods and Fields
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **The Scope of Polymorphism for Methods and Fields**

    Identify which Java members support dynamic polymorphism: overridable instance methods, abstract methods, and interface/default methods, as opposed to fields, static, private, and final members, constructors, and overloads. PolymorphismScopeDemo shows how the same VipTicket object exposes different field values when the reference type changes, while display/getDisplayName are overridden according to runtime type; DiscountPolicy turns data into contract-driven behavior.

    ## 2. Questions Learners Should Be Able to Answer

    ### Member Boundaries

    1. When Ticket ticket refers to VipTicket, why does ticket.display() produce VIP-method while ticket.label produces Ticket-field?
    2. Why does casting to VipTicket change the visible field without changing the runtime object?
    3. Why do ticket.showInternalNote() and showField() still use Ticket's private method or field?
    4. How can getDisplayName() be overridden even when Person.name remains a private superclass field?

    ### Designing Extension Points

    1. How can abstract methods, interface methods, and default methods dispatch to the actual class?
    2. Why don't final, static, and private methods or constructors provide runtime polymorphism like overridable instance methods?
    3. How does super.header() differ from calling header() within Report.render() on MonthlyReport?
    4. Why does moving from the Discount.percent field to DiscountPolicy.apply() let clients receive the correct discount rule?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Build a polymorphic-member matrix | Classify overridable methods and members that do not undergo runtime overriding. |
    | Explain Ticket/VipTicket | Correctly predict the output for display, label, code, category, showInternalNote, showField, and bothFields. |
    | Design getters | Write an overriding Employee getter that extends the displayed name using Person's private data. |
    | Choose behavior over fields | Use DiscountPolicy.apply to calculate 90.000 and 100.000 VND from the same original price. |
    | Analyze casts and super | Explain why casting changes only the static type and super does not create a second superclass object. |
- id: polymorphism-008
  title: Duck Typing and Capability-Based Polymorphism
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Duck Typing and Capability-Based Polymorphism**

    Broaden polymorphic design beyond noun-based inheritance trees to independent capabilities required by clients, while distinguishing Java's nominal typing from Python's dynamic duck typing. Using WildDuck, RobotDuck, SqueakyToy, the Quackable/Swimmable/Rechargeable interfaces, and method reference toy::quack, the lesson illustrates how adapters connect classes with matching behavior that do not yet implement an interface, and when instanceof is suitable for checking optional roles.

    ## 2. Questions Learners Should Be Able to Answer

    ### Structural and Nominal Typing

    1. Why can Python make_sound call quack on unrelated classes, while Java cannot automatically assign SqueakyToy to Quackable even with an identically named method?
    2. Does WildDuck implements Quackable, Swimmable automatically make it a subtype of AmphibiousVoice, which extends both interfaces?
    3. How does Quackable q = toy::quack differ from directly assigning q = toy in type relationships and adapter objects?
    4. How does Java reflection differ from dynamic duck typing and compile-time-checked structural typing?

    ### Capability-Based Design

    1. Why does runActivity call quack for all three participants while only WildDuck can swim and RobotDuck can recharge?
    2. When swimmingLesson always requires swimming capability, why should it accept Swimmable instead of Object and a cast?
    3. How does instanceof checking for optional activities differ from repeated type checks used only to substitute quack behavior?
    4. Why can classes with identical method signatures still differ in side effects, errors, and contracts?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Explain nominal typing | Show why Java requires an implements/extends relationship or an adapter rather than treating matching method names as a subtype relationship. |
    | Model capabilities | Separate Quackable, Swimmable, and Rechargeable according to each object's actual capabilities. |
    | Use method references | Use toy::quack as Quackable without modifying SqueakyToy. |
    | Select optional capabilities | Use instanceof at appropriate boundaries and accept an interface directly when the capability is mandatory. |
    | Evaluate integration | Explain reflection's limitations and why adapters require contract tests. |
- id: polymorphism-009
  title: Replacing Type Checks with Polymorphism
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Replacing Type Checks with Polymorphism**

    Apply polymorphism when refactoring multiple if/else or instanceof branches based on shipping-service names. ShippingPolicy and QuoteService separate pricing formulas from orchestration code, while a boundary-level factory/switch selects the implementation. The lesson also emphasizes regression and contract tests that preserve prices, errors, and units when changing the structure.

    ## 2. Questions Learners Should Be Able to Answer

    ### Identifying Refactoring Opportunities

    1. If the same STANDARD/EXPRESS/ECO branches appear in multiple services, what risks arise when SAME_DAY is added?
    2. Why does having QuoteService depend only on ShippingPolicy reduce coupling to concrete classes?
    3. For a Parcel weighing 1.500 g traveling 3 km, how do the three implementations calculate 18.000, 41.000, and 12.500 VND correctly?
    4. Why does every policy still need contract tests to ensure valid quotes even when the compiler guarantees the method signature?

    ### Boundaries of Polymorphism

    1. Why is a switch in selectPolicy still reasonable for mapping an input code to an implementation?
    2. When is a simple state-based if or instanceof for mixed data preferable to creating numerous subclasses?
    3. Which results and edge cases must a stepwise refactoring process compare before removing the old branches?
    4. Why can a policy that returns a negative value or independently converts VND to another unit violate LSP even when QuoteService is unchanged?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Detect type-based conditionals | Identify repeated branching across locations and the risk of missing handling when adding a package. |
    | Refactor to strategies | Move pricing formulas into ShippingPolicy implementations so QuoteService only calls quote. |
    | Place the type-selection boundary | Choose a factory, switch, or Map registry at the input boundary without duplicating pricing formulas. |
    | Run regression tests | Verify the three results 18.000/41.000/12.500 VND and the SameDay option at 58.000 VND. |
    | Evaluate tradeoffs | Justify when small conditionals, enum/sealed models, or instance checking remain appropriate. |
- id: polymorphism-010
  title: Example of Multiple Payment Methods
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Example of Multiple Payment Methods**

    Bring polymorphism techniques together in a simulated Java checkout. PaymentMethod defines name/pay, implemented separately by CardPayment, WalletPayment, and BankTransferPayment; the same CheckoutService calls pay but receives PAID, DECLINED, or PENDING with distinct meanings. Learners use RecordingPayment to verify call flow, extend the example with COD, and recognize the demo's limitations for real-money processing.

    ## 2. Questions Learners Should Be Able to Answer

    ### Runtime Polymorphism in Payments

    1. Why can CheckoutService call the correct pay implementation without instanceof checks for CardPayment or WalletPayment?
    2. If WalletPayment starts with 150.000 VND, why does paying 120.000 VND leave 30.000 VND, and why is a subsequent 40.000 VND payment declined?
    3. Why must BankTransferPayment return PENDING after generating instructions instead of defaulting to PAID?
    4. How does adding CashOnDeliveryPayment that returns PENDING affect CheckoutService and the available payment-method selection?

    ### Testing and Real-World Limitations

    1. What must RecordingPayment record to prove that CheckoutService invokes it exactly once and passes the original request unchanged?
    2. How does the example CheckoutService detect an implementation returning null?
    3. Why does synchronized on WalletPayment protect an instance only within one JVM rather than across multiple machines?
    4. In real payments, what risks arise from timeouts, transfers awaiting confirmation, and retries without idempotency or durable persistence?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Trace checkout polymorphism | Identify the runtime class executing pay and reproduce the three outcomes for cards, wallets, and bank transfers. |
    | Understand payment states | Distinguish PAID/DECLINED/PENDING and predict the 30.000 VND balance and subsequent declined payment. |
    | Extend payment methods | Create COD implements PaymentMethod and verify that the service still calls pay without an additional branch. |
    | Test with fakes | Use RecordingPayment to confirm the call count, request, and returned status in CheckoutService. |
    | Identify demo limitations | Explain the need for idempotency, persistence, handling uncertain states, and concurrency in real systems. |
