version: 1
type: LEARNING_ROADMAP
title: LANGUAGE MECHANICS — LESSON CONNECTIONS
roadmapHeading: Learning Path Connections
roadmap:
- id: language-mechanics-001
  order: 1
  title: Generic Types and Parameterized Classes
  description: Build generic classes and methods (`Box`, `Pair`, `Repository`) and understand how type arguments, inference, raw types, and erasure affect type safety.
  transition:
    to: language-mechanics-002
    description: '**From understanding generic types → adding an upper bound when an algorithm requires specific capabilities from T**'
- id: language-mechanics-002
  order: 2
  title: Type Parameter Bounds
  description: Constrain type parameters with class/interface bounds, `Comparable<? super T>`, and intersection bounds; require only the capabilities the algorithm actually needs.
  transition:
    to: language-mechanics-003
    description: '**From constraining the capabilities of T → examining subtypes, wildcards, and what generic APIs can read or write**'
- id: language-mechanics-003
  order: 3
  title: Type Relationships in Generic Constructs
  description: Understand subtype relationships among parameterized types; choose `?`, `? extends`, `? super`, and capture helpers according to producer/consumer roles.
  transition:
    to: language-mechanics-004
    description: '**From type relationships in APIs → distinguishing compiler checks from JVM dispatch and casts**'
- id: language-mechanics-004
  order: 4
  title: Static Types, Runtime Types, and Type Checking
  description: Distinguish static types from runtime classes and overloading from overriding; use `instanceof` and validation for data crossing boundaries with uncertain types.
  transition:
    to: language-mechanics-005
    description: '**From types and valid method calls → evaluating how expressions, fields, accessors, and Java conventions affect state**'
- id: language-mechanics-005
  order: 5
  title: Operators, Properties, and Language Conventions
  description: Apply operators, numeric promotion, short-circuit evaluation, and JavaBeans/record conventions to avoid calculation errors and protect fields.
  transition:
    to: language-mechanics-006
    description: '**From comparing expressions with `==`/`equals` → building complete equality/hash contracts for objects used as keys**'
- id: language-mechanics-006
  order: 6
  title: Equality and Hash Code Contracts
  description: Design consistent equality/hash behavior, keep keys stable, and apply the contracts correctly to HashMap, HashSet, records, arrays, and entities.
  transition:
    to: language-mechanics-007
    description: '**From identity and equality → deciding how to display objects for debugging without leaking data**'
- id: language-mechanics-007
  order: 7
  title: Object String Representations and Diagnostics
  description: Design concise `toString` output and logging without exposing secrets or causing side effects, using separate DTOs or structured logs when needed.
  transition:
    to: language-mechanics-008
    description: '**From diagnostic strings and exception messages → defining structured failure contracts and post-failure state**'
- id: language-mechanics-008
  order: 8
  title: Exceptions, Failure States, and Method Contracts
  description: Define preconditions and postconditions, returning Result/Optional versus throwing exceptions, post-failure state, and atomicity principles.
  transition:
    to: language-mechanics-009
    description: '**From Java language mechanics → distinguishing OOP design requirements from syntax/runtime details that may change when porting**'
- id: language-mechanics-009
  order: 9
  title: Language Differences When Implementing the Same OOP Design
  description: Compare the same ShippingPolicy design across five languages and verify behavioral parity through input constraints, currency units, and boundary tests.
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 | Lesson 9 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Generic Types and Parameterized Classes | Type Parameter Bounds | Type Relationships in Generic Constructs | Static Types, Runtime Types, and Type Checking | Operators, Properties, and Language Conventions | Equality and Hash Code Contracts | Object String Representations and Diagnostics | Exceptions, Failure States, and Method Contracts | Language Differences When Implementing the Same OOP Design |
  | Key question | How do generic classes and methods provide type safety? | Which capabilities does T require? | How do assignments and reads/writes work with List<T>? | What is decided by the compiler versus runtime? | How do expressions, fields, and properties behave? | What constitutes equal values and compatible hashes? | What data should be included when logging an object? | What does failure mean, and what state remains? | Which design aspects must remain consistent across languages? |
  | Value for OOP/the module | Reuse typed APIs and reduce casts | Specify precise bounds in algorithm signatures | Choose wildcards/PECS according to data flow | Handle dispatch, casts, and validation correctly | Calculate and encapsulate according to Java rules | Enable hash collections to recognize valid keys | Provide safe, traceable diagnostics without exposing secrets | Define method contracts, failure atomicity, and appropriate retries | Port OOP behavior with parity tests |
  | Mindset developed | Separate algorithms from concrete types without sacrificing type safety | Require only the capabilities generic T truly needs | Reason from source/destination and subtyping | Separate compile-time types from runtime objects | Analyze result types and permissions to update state | Define stable domain identity and value equality | Separate diagnostic text from public APIs and schemas | Design failure paths alongside successful paths | Prioritize responsibilities and invariants over syntax |
