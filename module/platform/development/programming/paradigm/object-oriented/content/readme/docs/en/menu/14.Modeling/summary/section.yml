version: 1
type: LEARNING_ROADMAP
title: MODELING — LESSON CONNECTIONS
roadmapHeading: Learning Path Connections
roadmap:
- id: modeling-001
  order: 1
  title: Gathering Use Cases and Business Rules
  description: Gather actors/use cases, rules with BR-IDs, and counterexamples to identify invariants before designing classes.
  transition:
    to: modeling-002
    description: '**From understanding goals and rules → identifying objects with appropriate identities, lifecycles, and responsibilities**'
- id: modeling-002
  order: 2
  title: Identifying Objects from Requirements
  description: Identify entities, value objects, policies, and services from a library description; distinguish objects by identity, responsibility, and lifecycle.
  transition:
    to: modeling-003
    description: '**From candidate objects → identifying the owner of each invariant and the required collaborators**'
- id: modeling-003
  order: 3
  title: Assigning Responsibilities and Collaborators
  description: Assign responsibilities and identify the messages exchanged among `Member`, `BookCopy`, `Loan`, and `LendingService`.
  transition:
    to: modeling-004
    description: '**From assigning responsibilities → rehearsing scenarios with CRC cards to identify missing obligations**'
- id: modeling-004
  order: 4
  title: 'CRC Cards: Classes, Responsibilities, and Collaborators'
  description: Role-play with CRC cards, detect missing or duplicated responsibilities, then translate them into APIs, UML, and tests.
  transition:
    to: modeling-005
    description: '**From responsibility cards → describing class structures, APIs, relationships, and multiplicities with clear notation**'
- id: modeling-005
  order: 5
  title: 'Class Diagrams: Members and Relationships'
  description: 'Represent static structures and ownership with UML class diagrams: members, relationships, multiplicities, and dependency directions.'
  transition:
    to: modeling-006
    description: '**From class-level structures → examining a graph of concrete instances at a specific moment**'
- id: modeling-006
  order: 6
  title: 'Object Diagrams: Instances at a Point in Time'
  description: Examine t0/t1 snapshots of concrete objects and links, recognize aliasing, and distinguish them from class diagrams.
  transition:
    to: modeling-007
    description: '**From object snapshots → tracing messages among objects within a scenario**'
- id: modeling-007
  order: 7
  title: 'Sequence Diagrams: Interaction Order'
  description: Use sequence diagrams to describe call order among participants, failure branches, and when side effects occur.
  transition:
    to: modeling-008
    description: '**From interaction order → clarifying which events are allowed to change an object’s state**'
- id: modeling-008
  order: 8
  title: 'State Diagrams: Valid State Transitions'
  description: Define valid events, guards, and transitions throughout an object's lifecycle, rejecting invalid transitions without changing state.
  transition:
    to: modeling-009
    description: '**From design diagrams → comparing implementations, tests, and real business behavior to detect discrepancies**'
- id: modeling-009
  order: 9
  title: Validating Models Against Code and Real-World Scenarios
  description: Compare requirements, models, Java code, tests, and runtime data; ensure business rules remain valid as code or environments change.
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 | Lesson 9 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Gathering Use Cases and Business Rules | Identifying Objects from Requirements | Assigning Responsibilities and Collaborators | CRC Cards: Classes, Responsibilities, and Collaborators | Class Diagrams: Members and Relationships | Object Diagrams: Instances at a Point in Time | Sequence Diagrams: Interaction Order | State Diagrams: Valid State Transitions | Validating Models Against Code and Real-World Scenarios |
  | Key question | Who achieves which goal under what conditions? | Which concepts deserve to become objects? | Which object owns a rule, and whose help does it need? | How can responsibilities be rehearsed with cards? | What members, relationships, and multiplicities does each class have? | Which instances and links exist at t0/t1? | Who calls whom, and in what order? | Which events permit a state change? | Do the model and code correctly enforce the business rules? |
  | Value for OOP/the module | Establish use cases, invariants, and acceptance criteria | Distinguish entities, value objects, services, and lifecycles | Keep logic with the right owner and clarify collaboration flows | Validate role assignments through role-play | Clarify structure and ownership | Illustrate aliasing and snapshots | Prevent side effects in the wrong order | Protect business state transitions | Trace rules through APIs, tests, and persistence |
  | Mindset developed | Interview stakeholders and turn ambiguous requirements into testable rules | Challenge candidate classes based on identity and responsibility | Assign work to those with the relevant information and reduce coupling | Rehearse flows and revise cards before coding | Read notation and multiplicities and choose the right relationships | Distinguish types, instances, and data at a specific moment | Consider message order and failure branches | Consider states, events, guards, and effects | Verify in both directions and keep artifacts synchronized as requirements change |
