summaries:
- id: design-pitfalls-001
  title: Classes with Too Many Responsibilities
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Classes with Too Many Responsibilities**

    A large class is not necessarily poorly designed; the God Class problem arises when one class has multiple unrelated reasons to change, such as pricing, data persistence, notifications, and validation. This lesson helps identify responsibility boundaries based on policies and side effects, separate use-case orchestration from calculators/repositories/notifiers, and use characterization tests to preserve business results during refactoring. Adding more classes helps only if it reduces coupling without making the process harder to understand.

    ## 2. Questions Learners Must Be Able to Answer

    ### Identifying Real Responsibilities

    1. Why are line counts or method counts insufficient to classify a class as a God Class?
    2. When OrderManager must change because of pricing rules, SQL, and email, which distinct reasons for change have been combined?
    3. What does SRP say about related reasons for change, and why is a multi-step use case not necessarily a God Class?
    4. What signs in code, git history, and unit tests reveal high coupling or low cohesion?

    ### Separating Classes While Preserving Behavior

    1. In the ordering process, which responsibilities belong in PlaceOrderUseCase, PriceCalculator, the repository, and the notifier?
    2. Why does splitting a God Class into many forwarding-only classes, or moving everything into Utils, fail to solve the problem?
    3. If order persistence succeeds but notification delivery fails, which transaction boundaries need consideration when separating classes?
    4. Which inputs, results, exceptions, and side effects should be recorded before refactoring to prevent regressions?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Analyze God Classes | Identify when OrderManager or UserManager needs separation based on responsibilities and reasons for change, rather than length alone. |
    | Redesign boundaries | Sketch how PlaceOrderUseCase coordinates PriceCalculator, the repository, and the notifier, each with specific responsibilities. |
    | Preserve business contracts | Create characterization tests for pricing results, persistence operations, and failure flows when moving code. |
    | Evaluate refactoring outcomes | Identify cases where wrappers, Utils, or too many small classes only change the structure without reducing coupling. |
- id: design-pitfalls-002
  title: Exposed State and Broken Invariants
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Exposed State and Broken Invariants**

    This lesson focuses on protecting object invariants throughout the entire lifecycle, not merely validating data at construction. The SeatInventory example requires reserved seats to stay between 0 and capacity and rejects invalid operations without changing existing state. Collection and record examples show how private/final fields or an unmodifiable view may still expose mutation paths through aliases. Learners examine state-changing paths, constructors, subclasses, and concurrent access to design behavior-oriented APIs and test invariants.

    ## 2. Questions Learners Must Be Able to Answer

    ### Invariants and Encapsulation

    1. How does the invariant requiring reserved to remain between 0 and capacity differ from the precondition requiring positive seats in reserve()?
    2. Why do private and final fields fail to protect state when a getter returns the mutable list itself or a constructor retains an external alias?
    3. How does Collections.unmodifiableList(view) differ from a defensive snapshot created with List.copyOf when the original list is later modified?
    4. How can independent start/end setters violate the requirement that start precede end?

    ### Update Paths and Testing

    1. Under concurrent access, what kind of single operation must SeatInventory.reserve use to check available seats and update the count?
    2. Why is a record containing a mutable List not deeply immutable, and how can a protected field allow validation to be bypassed?
    3. When a reservation or schedule update is rejected, which postconditions should tests verify?
    4. How do invariants, immutability, and thread safety differ, even though they often occur together?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Specify and verify invariants | Express 0 <= reserved <= capacity and predict state after valid and rejected reservation/cancellation cases. |
    | Close unauthorized mutation paths | Fix LeakyCart or BrokenTeam with business methods, defensive copies, and appropriate alias boundaries. |
    | Design atomic updates | Propose synchronized or another synchronization mechanism to make seat check-and-update operations race-free. |
    | Test failure cases | Write tests for invalid inputs, capacity violations, and unauthorized mutations through collections or independent setters. |
- id: design-pitfalls-003
  title: Excessive Getters and Setters Without Behavior
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Excessive Getters and Setters Without Behavior**

    This lesson distinguishes business objects consisting only of getters/setters from objects that enforce their own behavioral rules. For the Order lifecycle, replacing setStatus with confirm, ship, and cancel, and getLines().add with addLine, lets the state owner validate transitions, amounts, and line items. The lesson also notes that getters/setters can be appropriate for DTOs, transaction scripts, JPA entities, and simple data classes; the choice must reflect actual invariants and transaction boundaries.

    ## 2. Questions Learners Must Be Able to Answer

    ### From Data to Behavior

    1. Why does an Order class exposing only getStatus/setStatus while services perform every state check suggest an anemic domain model?
    2. Which rules governing the DRAFT → CONFIRMED → SHIPPED lifecycle and CANCELLED should live in Order methods?
    3. Does renaming setStatus to changeStatus solve the problem if any state can still be assigned?
    4. Where does Tell, Don't Ask place business decisions, and does it prohibit all queries/getters?

    ### Context and Verification

    1. Why can a DTO, report row, or simple transaction script legitimately retain a data-oriented design?
    2. Before removing setters from a JPA entity with many callers, which mappings, use cases, and persistence contracts must be checked?
    3. Which tests verify that confirm/ship/cancel reject invalid transitions and preserve state after an error?
    4. Why is encapsulating state inside Order insufficient to guarantee concurrency safety, transactions, or idempotency?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Build business-oriented APIs | Replace setStatus/setItems with confirm, ship, cancel, and addLine, with explicit preconditions and postconditions. |
    | Trace lifecycles | Predict valid and forbidden Order state transitions and why they are rejected. |
    | Distinguish object types | Analyze Entities, Value Objects, DTOs, and Application Services to decide where logic, getters, and setters belong. |
    | Refactor and test safely | Test success/failure paths and review callers/JPA mappings before restricting setters. |
- id: design-pitfalls-004
  title: Inheritance Used Only to Reuse a Few Methods
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Inheritance Used Only to Reuse a Few Methods**

    This lesson explains that `extends` is a commitment that a subtype can substitute for its parent, not merely a shortcut for borrowing a few methods. `Inventory extends HashMap` unintentionally exposes put, clear, and other operations that can violate inventory rules; a composition-based version keeps Map internal and permits only validated restock/reserve operations. Learners distinguish composition from delegation, assess the risks of protected hooks and constructor-time overriding, and use inheritance only when the superclass contract genuinely fits.

    ## 2. Questions Learners Must Be Able to Answer

    ### Valid Types and Contracts

    1. Why does extending a formatting utility merely to call its method create a false is-a relationship for PricingService?
    2. Which APIs inherited when Inventory extends HashMap can bypass stock-count invariants?
    3. What does the Liskov Substitution Principle require if every Inventory is treated as a Map?
    4. What risks arise if a base constructor calls an overridable method before subclass fields are initialized?

    ### Redesign and Verification

    1. How does keeping Map private inside Inventory and exposing restock/reserve change the responsibility boundary?
    2. In this example, how does composition describe the object structure, and which calls illustrate delegation?
    3. When a subclass truly is a subtype with documented extension points, why can inheritance still be appropriate?
    4. Which tests prove that reserve cannot make stock negative even if clients attempt to bypass validation?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Recognize misleading inheritance | Explain why Inventory extends HashMap or Service extends Utility creates incorrect APIs/contracts. |
    | Propose composition | Design Inventory with a private Map and invariant-preserving restock/reserve methods. |
    | Verify substitutability | Explain which LSP conditions must hold before using extends. |
    | Test exposed behavior | Test put/clear access paths, reserving more than available stock, and state protection after refactoring. |
- id: design-pitfalls-005
  title: Overusing Casts and Type Checks
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Overusing Casts and Type Checks**

    This lesson identifies code that repeatedly uses `instanceof`, downcasting, or getClass() to select different implementations of the same behavior, then moves those algorithms into implementations of a shared interface such as ShippingPolicy. Learners still recognize legitimate type checks at untrusted-data boundaries, for optional capabilities, or in closed subtype hierarchies. The lesson emphasizes that casting does not change an object's runtime type, generics help preserve type safety, and contract tests must verify behavior rather than class names.

    ## 2. Questions Learners Must Be Able to Answer

    ### Casting and Polymorphism

    1. How do static types, runtime types, and dynamic dispatch differ when an Animal reference holds a Dog?
    2. Why might the compiler accept a cast from an Animal reference holding a Cat to Dog, even though it throws ClassCastException at runtime?
    3. What problem with responsibility distribution is revealed when many services branch on shipping types using instanceof?
    4. How does moving fee calculation into ShippingPolicy and its implementations change Checkout's role?

    ### Legitimate Exceptions and Boundaries

    1. When receiving an Object from JSON, a plugin, or a legacy API, why is type checking a necessary safeguard?
    2. When a subtype has an additional scan capability, why might a capability check be appropriate?
    3. How do generics or Class<T>.cast make conversions safer than unchecked casts?
    4. Why should checking the PAID state be modeled as a state rule rather than overusing state-specific subclasses?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Explain casting and runtime behavior | Predict the results of upcasting, downcasting, and ClassCastException cases. |
    | Refactor type branching | Replace shipping-fee branches with multiple ShippingPolicy implementations. |
    | Choose appropriate type checks | Classify instanceof usage at data boundaries, in sealed hierarchies, for capabilities, and in repeated branching. |
    | Verify contracts | Propose a shared test suite for every ShippingPolicy to ensure consistent results and behavior. |
- id: design-pitfalls-006
  title: Oversized Interfaces or Too Many Abstraction Layers
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Oversized Interfaces or Too Many Abstraction Layers**

    This lesson contrasts two pitfalls: a fat interface that forces clients to depend on unused operations, and excessive abstraction layers that merely forward calls. In the document-management example, PreviewService needs only DocumentReader, while EditorialService needs editing operations; segregation by client means a read-only source need not throw UnsupportedOperationException for save. Learners apply ISP to meaningful contracts, distinguish it from SRP/LSP/DIP, audit layers of indirection, and retain concrete classes when no useful variation boundary exists.

    ## 2. Questions Learners Must Be Able to Answer

    ### Contracts Matched to Client Needs

    1. Why does a DocumentManager exposing read, save, delete, and email make PreviewService depend on too broad an API?
    2. How does forcing ReadOnlyDocumentSource to throw UnsupportedOperationException for save affect the contract and LSP?
    3. How does splitting DocumentReader/DocumentWriter according to client needs differ from creating one interface per method?
    4. Does a default method that throws an unsupported-operation error really solve the fat-interface problem?

    ### Avoiding Useless Abstraction Layers

    1. When PreviewFacade → Provider → Factory merely forwards methods, which readability and change costs increase?
    2. How do client–method and implementation–capability matrices reveal appropriate ISP boundaries?
    3. When is a DocumentRepository combining Reader and Writer justified for a client that needs consistent operations?
    4. Why does restricting methods through an interface not automatically enforce authorization at an API boundary?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Analyze fat interfaces | Build a client-usage matrix identifying operations not needed by PreviewService and EditorialService. |
    | Segregate contracts with justification | Propose DocumentReader/DocumentWriter and assign implementations according to their capabilities without fake stubs. |
    | Evaluate abstraction layers | Identify pure forwarding classes with no policy, validation, or change boundary and simplify the call flow. |
    | Preserve compatibility | List affected clients and plan migration when replacing DocumentManager's public contract with smaller interfaces. |
- id: design-pitfalls-007
  title: Circular Dependencies and Deep Object Navigation
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Circular Dependencies and Deep Object Navigation**

    This lesson distinguishes cycles in service/module dependency graphs from deep navigation through an object's internal structure. In the OrderService and ShippingService example, mutual calls complicate initialization and testing, while scattering `order.getCustomer().getAddress().getCity()` throughout business logic makes clients depend too heavily on internal representations. Learners use unidirectional dependencies, pass narrowly scoped ShipmentRequest/DTO data, move behavior to its proper owner, and introduce events/abstractions only when timing and consistency contracts can be preserved.

    ## 2. Questions Learners Must Be Able to Answer

    ### Recognizing Coupling in Graphs and Code

    1. By what criterion does the OrderService → ShippingService → OrderService graph form a dependency cycle?
    2. Why can constructor injection between two mutually dependent Spring beans cause initialization errors?
    3. How does deep object navigation differ from calling a fluent API or reading a DTO in a mapper?
    4. What limit does the Law of Demeter suggest for a service's knowledge of objects inside its collaborators?

    ### Breaking Cycles and Preserving Responsibilities

    1. Which reverse dependency is removed by passing ShipmentRequest and DeliveryAddress to ShippingService?
    2. How does moving behavior such as eligibleForShipping to the data-owning object differ from adding another getter that exposes the entire object graph?
    3. Why does merely extracting two interfaces while retaining A → BPort → B → APort → A fail to break the dependency cycle?
    4. If direct calls are replaced by an OrderPaid event, which timing, duplicate-delivery, and failure conditions need definition?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Draw and detect cycles | Diagram dependencies before and after changes among OrderService, ShippingService, and DeliveryGateway. |
    | Reduce deep navigation | Design ShipmentRequest or focused domain methods instead of getCustomer/getAddress/getCity chains in business logic. |
    | Plan cycle removal | Propose a unidirectional orchestration flow or extract a policy with clear ownership and evaluate its contract. |
    | Avoid superficial refactoring | Identify cycles that persist after introducing interfaces and risks of using events merely to avoid direct calls. |
- id: design-pitfalls-008
  title: Hard-to-Control Shared State
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Hard-to-Control Shared State**

    This lesson explains failures that arise when multiple references can modify the same state, both without parallel threads through aliasing and with concurrency through check-then-act operations. Using shared counters/quotas, learners distinguish volatile, synchronized, atomic operations, concurrent collections, transactions, and idempotency; no single keyword fixes every boundary. The lesson also warns about Spring static/singleton services retaining request data and distinguishes state within one JVM from state in a database/cluster.

    ## 2. Questions Learners Must Be Able to Answer

    ### Sources of Sharing and Observable Failures

    1. How does shared mutable state differ from shared immutable data or shared objects that cannot be modified?
    2. In the example where two threads check and decrease a quota, how does a race condition violate the invariant?
    3. Why is a mutable List aliased by multiple objects still risky even with only one thread?
    4. Why can a Spring singleton service storing userId/currentOrder in fields leak information between requests?

    ### Choosing Protection Mechanisms

    1. How does volatile guarantee visibility without making a check-then-update operation atomic?
    2. Which scenarios can synchronized and AtomicInteger handle, and what else is required for invariants spanning multiple fields?
    3. Why does ConcurrentHashMap not automatically turn a multi-operation read-modify-write sequence into one business transaction?
    4. What changes when state is stored in a database or across multiple nodes rather than within one JVM?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Identify owners and aliases | List reference paths that can mutate shared state through static fields, singletons, or collections. |
    | Analyze race conditions | Predict incorrect check-then-act outcomes and design an atomic quota-update path. |
    | Choose tools for the right scope | Explain the limitations of volatile, synchronized, AtomicInteger, ConcurrentHashMap, and transactions/optimistic locking. |
    | Test concurrency | Design tests with coordinated threads to verify invariants and check aliasing without relying on chance. |
- id: design-pitfalls-009
  title: Mutable Objects Breaking Equality or Hashing
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Mutable Objects Breaking Equality or Hashing**

    This lesson examines subtle failures when mutable attributes used by equals/hashCode or Comparator change while an object serves as a key/Set element. `HashMap.get()` may fail to find the very same key reference after its hash changes; `TreeSet` faces a similar risk when the sorting order changes. Learners distinguish mutable entities from stable identities, use immutable CustomerId values as keys, protect records containing Lists/arrays, and examine which fields ORM or Lombok includes in equality contracts.

    ## 2. Questions Learners Must Be Able to Answer

    ### Collection Behavior and Contracts

    1. Why might HashMap fail to find the same object after a field used by hashCode is changed?
    2. What compatibility requirement do equals and hashCode impose on two objects considered equal?
    3. Why can HashSet sometimes appear to contain two entries referring to the same object after a mutable key's hash changes?
    4. What different risks arise for TreeMap/TreeSet when a field used by Comparator changes?

    ### Designing Stable Keys

    1. Why is a CustomerId record containing an immutable String better suited as a key than a CustomerProfile with a mutable displayName?
    2. Is a record containing a List or byte[] automatically deeply immutable, and does it automatically compare arrays by contents? Why or why not?
    3. For a JPA entity whose ID is generated after persistence, what must be considered when designing equals/hashCode and deciding where to use the object as a key?
    4. Why can't ConcurrentHashMap, Lombok-generated hashes, or cached hash values automatically fix a mutable key with a broken contract?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Explain failure mechanisms | Trace hash buckets and predict lookup behavior when MutableCustomerKey's code changes. |
    | Design stable keys | Separate immutable CustomerId from mutable CustomerProfile so lookups still work after displayName changes. |
    | Verify value objects | Identify risks in records containing Lists/arrays and add suitable defensive copying/equality behavior. |
    | Evaluate collections and ORM | Test equals-hash contracts and HashMap/HashSet/TreeSet lookups, and review JPA IDs and Lombok-selected fields. |
- id: design-pitfalls-010
  title: Overusing Design Patterns and Premature Abstraction
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Overusing Design Patterns and Premature Abstraction**

    This lesson helps determine when an abstraction or Design Pattern genuinely reduces the cost of change and when it merely adds indirection. Starting with one simple shipping-fee rule and moving to two confirmed STANDARD/EXPRESS policies, learners observe when Strategy begins to offer value; KISS, YAGNI, DRY, and SOLID are interpreted in context rather than as slogans. The goal is to gather evidence of change, lock in existing behavior with tests, and then extract the appropriate stable boundary rather than creating a generic framework, factory, or interface for a need that does not yet exist.

    ## 2. Questions Learners Must Be Able to Answer

    ### Evaluating the Need for Abstraction

    1. Why might a simple delivery-fee rule need only one validated function instead of an interface/factory system?
    2. How does overusing a pattern at the wrong scale differ from abstracting prematurely around an incorrectly predicted variation point?
    3. How are KISS, YAGNI, and DRY misunderstood when only duplicate line counts or class counts are considered?
    4. Why should two formulas that both use 5% but serve independent business rules not necessarily be merged into one abstraction?

    ### When to Introduce Strategy

    1. When STANDARD and EXPRESS have independently changing algorithms, which boundary does FeePolicy address?
    2. Before extracting FeePolicy, which inputs, the 500000 VND threshold, exceptions, and boundary cases should be recorded to preserve existing behavior?
    3. What signs indicate that an interface/provider/factory chain merely forwards calls and creates maintenance friction?
    4. When can an early abstraction be justified by a public API or clearly established security/external-dependency boundary?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Recognize overengineering | Analyze multilayer designs and identify abstractions lacking a real contract or direction of change. |
    | Evaluate when Strategy is warranted | Compare SimpleCheckout with PolicyCheckout when there is only one policy and after EXPRESS is added. |
    | Preserve results during refactoring | Propose regression tests around fee thresholds and weight boundaries before/after extracting FeePolicy. |
    | Make design decisions | Present evidence of need, stable/variable boundaries, and operating costs before adding a pattern. |
