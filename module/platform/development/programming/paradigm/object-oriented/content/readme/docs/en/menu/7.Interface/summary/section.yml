version: 1
type: LEARNING_ROADMAP
title: INTERFACES — LESSON CONNECTIONS
roadmapHeading: Learning Path Connections
roadmap:
- id: interface-001
  order: 1
  title: Interfaces as Contracts and Roles
  description: Establishes an interface as a contract for capabilities and behavior, as well as a role an object can fulfill. The Java compiler checks only method signatures; inputs, results, and errors require additional conventions.
  transition:
    to: interface-002
    description: '**From the meaning of a promise → declaring and implementing interfaces with correct Java syntax**'
- id: interface-002
  order: 2
  title: Declaring and Implementing Interfaces
  description: Practice the interface and implements keywords, public override methods, static methods, and polymorphism through two shipping-fee policies. Verify compilation, calculated fees, and shared behavioral checks.
  transition:
    to: interface-003
    description: '**From an implements example → deliberately structuring service dependency direction**'
- id: interface-003
  order: 3
  title: Programming to Interfaces
  description: Have CheckoutService receive PaymentGateway through its constructor, select an adapter at the composition root, and substitute a fake for testing. Distinguish dependency injection from dependency inversion and specify the payment contract.
  transition:
    to: interface-004
    description: '**From an abstract dependency → exploring how one instance can fulfill multiple roles simultaneously**'
- id: interface-004
  order: 4
  title: One Object Implementing Multiple Interfaces
  description: One OfficeMachine fulfills three roles and shares a single state, while each reference type exposes only the API of its role. The lesson extends to interfaces that inherit multiple interfaces and default methods with conflicting names.
  transition:
    to: interface-005
    description: '**From combining roles → choosing an appropriate model for sharing behavior and state**'
- id: interface-005
  order: 5
  title: Choosing Between Interfaces and Abstract Classes
  description: Use an interface for the DeliveryFeePolicy contract and an abstract class for the WeightDistancePolicy family, which shares a constructor and algorithm; consider composition when classes do not belong to the same family.
  transition:
    to: interface-006
    description: '**From choosing abstractions → narrowing contracts to match client needs**'
- id: interface-006
  order: 6
  title: Small Interfaces and Role Segregation
  description: Apply ISP to separate DocumentReader, DocumentWriter, and DocumentPublisher, avoiding the need for a read-only repository to implement a write API. Services depend on the appropriate role, while a single class can still support multiple roles.
  transition:
    to: interface-007
    description: '**From contract size and responsibilities → examining which members Java actually permits**'
- id: interface-007
  order: 7
  title: Default Members and Language-Specific Limitations
  description: Distinguish public abstract, default, static, and private members from public static final fields, and examine the class-wins rule, default-method conflicts, Object restrictions, and differences between Java and other languages.
  transition:
    to: interface-008
    description: '**From understanding declaration and dispatch rules → verifying whether replacing an implementation preserves its promises**'
- id: interface-008
  order: 8
  title: Replacing Implementations While Preserving Contracts
  description: Replace HashMapPriceCatalog with TreeMapPriceCatalog while preserving semantics for SKUs, zero prices, ordering, snapshots, and errors. Contract tests and LSP distinguish behavioral compatibility from signature compatibility alone.
  transition:
    to: interface-009
    description: '**From substitution principles → applying them to two infrastructure boundaries and transaction risks**'
- id: interface-009
  order: 9
  title: Designing Payment or Persistence Interfaces
  description: Separate PaymentGateway, PaymentRepository, and CheckoutService using DTOs and constructor injection; use fakes to verify request flows. The lesson explains the limits of in-memory idempotency when a gateway succeeds but saving the result fails.
  transition: null
