version: 1
type: LEARNING_ROADMAP
title: CLASS DESIGN — LESSON CONNECTIONS
roadmapHeading: How the Lessons Connect
roadmap:
- id: class-design-001
  order: 1
  title: Identifying Each Class's Responsibilities
  description: Assign responsibilities using SRP, Information Expert, and a book-borrowing use case; determine where LoanPolicy, Loan, LoanService, and the repository belong, then examine collaboration using CRC Cards.
  transition:
    to: class-design-002
    description: '**From identifying the owner of each rule → evaluating whether behaviors within a class are cohesive**'
- id: class-design-002
  order: 2
  title: Cohesion Within a Class
  description: Analyze classes through cohesion, field/method groups, and reasons for change; separate Cart, repository, sender, and checkout coordinator when their responsibilities are genuinely independent.
  transition:
    to: class-design-003
    description: '**From internal responsibilities → examining dependencies among collaborating classes**'
- id: class-design-003
  order: 3
  title: Coupling Between Classes
  description: Evaluate source-code, runtime, and change dependencies; use PaymentGateway, ReceiptSender, and DI at boundaries of change while considering payment and receipt-delivery failures.
  transition:
    to: class-design-004
    description: '**From coupling among collaborators → placing the boundary between domain and infrastructure appropriately**'
- id: class-design-004
  order: 4
  title: Separating Data, Business Logic, and External Interactions
  description: Separate DTOs, OrderLine/Order, pricing, use cases, and repository/gateway; preserve invariants in the domain and handle side effects in adapters.
  transition:
    to: class-design-005
    description: '**From separating domain and I/O → expressing boundaries through clear class and API names**'
- id: class-design-005
  order: 5
  title: Naming Classes, Fields, and Methods
  description: Apply Java naming conventions, include units in names, and use method names that express queries or commands; consider compatibility when renaming framework-facing or public APIs.
  transition:
    to: class-design-006
    description: '**From API names that express responsibilities → classifying objects by identity, value, and coordinating behavior**'
- id: class-design-006
  order: 6
  title: Entities, Value Objects, and Services
  description: Identify Account by UUID, Money by value, and TransferService by its coordination of two accounts; distinguish domain roles from JPA/Spring annotations.
  transition:
    to: class-design-007
    description: '**From the three entity/value/service roles → deciding which behavior belongs near the data it must protect**'
- id: class-design-007
  order: 7
  title: Rich Domain Models and Data-Only Models
  description: Compare Order with addItem/confirm against OrderData with setters; choose DTOs/projections when complex state transitions are absent.
  transition:
    to: class-design-008
    description: '**From choosing a model and locating invariants → clearly expressing the intent to read or change state**'
- id: class-design-008
  order: 8
  title: Separating Queries from State-Changing Commands
  description: Separate queries from commands under CQS; still ensure atomic validation and writes, and consider idempotency when commands are retried.
  transition:
    to: class-design-009
    description: '**From clear read/write APIs → limiting callers’ dependence on other objects’ internal structure**'
- id: class-design-009
  order: 9
  title: Limiting Deep Object-Chain Access
  description: Apply the Law of Demeter and Tell, don't ask; have Loan request fee calculations through nearby collaborators instead of having a service navigate Member/Plan itself.
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 | Lesson 9 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Identifying Each Class's Responsibilities | Cohesion Within a Class | Coupling Between Classes | Separating Data, Business Logic, and External Interactions | Naming Classes, Fields, and Methods | Entities, Value Objects, and Services | Rich Domain Models and Data-Only Models | Separating Queries from State-Changing Commands | Limiting Deep Object-Chain Access |
  | Questions to Understand | Who owns each invariant, policy, and workflow? | Do the fields/methods serve the same responsibility? | How far do changes to details in other classes propagate? | How are the domain, use cases, and I/O separated? | Which names communicate meaning, units, and side effects? | Is an object distinguished by identity, value, or behavior? | Should rules live in an entity or a service/data class? | Is a method reading or updating state? | Does the caller know too much about an object's structure? |
  | Value for OOP/the Module | Keep one owner for each rule | Group related invariants and reasons for change | Change providers or tests without modifying business logic | Isolate HTTP/DB/email from the domain | Reduce API misunderstandings and rename/mapping errors | Place equality and domain rules in the right objects | Protect state transitions and avoid unrestricted setters | Prevent hidden side effects and race/retry issues | Reduce coupling when deep structures change |
  | Mental Model Developed | Move from use cases to responsibilities | Evaluate internal meaning rather than size | Depend on stable contracts | Design around boundaries of change | Treat names as commitments | Distinguish identity from value | Choose rich or anemic models based on evidence | Reading and writing express different intentions | Ask nearby collaborators to perform behavior |
