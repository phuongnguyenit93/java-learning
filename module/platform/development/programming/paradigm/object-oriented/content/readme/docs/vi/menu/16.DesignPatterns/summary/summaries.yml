summaries:
- id: design-patterns-001
  title: 'Mẫu thiết kế: vấn đề, bối cảnh và đánh đổi'
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Mẫu thiết kế: vấn đề, bối cảnh và đánh đổi**

    Nhận diện mẫu thiết kế như giải pháp có bối cảnh, không phải danh sách tên hay quy tắc bắt buộc. Qua module checkout với các chính sách chiết khấu, bài hướng dẫn so sánh switch với Strategy theo biến thể thực tế, hợp đồng, chi phí gián tiếp, kiểm thử và ghi quyết định thiết kế thay vì áp pattern theo khẩu hiệu.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Bài toán và điều kiện lựa chọn

    1. Design Pattern khác một thư viện hoặc đoạn mã sao chép được ở điểm nào, và vì sao phải mô tả vấn đề trước khi chọn tên mẫu?
    2. Những thay đổi, ràng buộc hợp đồng, tần suất biến thể và chi phí tổ chức nào quyết định pattern có phù hợp?
    3. Với ba chính sách giảm giá ổn định, điều kiện nào khiến switch tập trung đủ tốt và điều kiện nào khiến Strategy đáng dùng?

    ### So sánh giải pháp và xác minh

    1. Vì sao lựa chọn một pattern có thể giảm coupling nhưng tăng indirection, chi phí wiring và khó debug?
    2. Adapter khác Decorator và Factory Method khác static factory ở mục đích thực tế nào?
    3. Một ADR và bộ contract tests cho chiết khấu nên ghi quyết định, kết quả, giới hạn và dấu hiệu xem xét lại ra sao?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Phát biểu bài toán | Viết mô tả vấn đề chọn thuật toán chiết khấu theo thay đổi và điều kiện thành công, không mở đầu bằng tên pattern. |
    | Đối chiếu lựa chọn | So sánh switch và Strategy về điểm thay đổi, số abstraction, kiểm thử và tracing. |
    | Phân biệt ý định | Chọn đúng Adapter, Decorator, Strategy hoặc factory theo thay đổi cần giải quyết. |
    | Kiểm tra contract | Đề xuất test cho discount không âm, không vượt subtotal và xử lý biến thể không hợp lệ. |
    | Ghi quyết định | Soạn ADR ngắn nêu bối cảnh, phương án, đánh đổi và điều kiện xem xét lại. |
- id: design-patterns-002
  title: Factory Method và Abstract Factory
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Factory Method và Abstract Factory**

    Phân biệt hai hướng tách việc tạo sản phẩm khỏi code sử dụng. Factory Method đặt điểm tạo một loại sản phẩm trong Creator để subclass override; Abstract Factory cung cấp cả họ sản phẩm liên quan như Button và Checkbox của cùng theme. Bài còn chỉ rõ sự khác biệt với simple/static factory, dependency injection và việc kiểm soát vòng đời hoặc lỗi khởi tạo.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Hai cấu trúc tạo đối tượng

    1. Creator, Concrete Creator và Product phối hợp thế nào khi EmailCampaign hoặc SmsCampaign override createSender()?
    2. Abstract Factory tạo Button và Checkbox đồng bộ cho Light/Dark UI bằng các interface và factory cụ thể như thế nào?
    3. Factory Method khác Abstract Factory ở cơ chế thay đổi, số loại sản phẩm và quan hệ inheritance/composition ra sao?

    ### Áp dụng, hợp đồng và đánh đổi

    1. Vì sao static Sender create(Channel) chỉ là simple factory chứ chưa phải Factory Method theo GoF?
    2. Khi thêm một theme mới so với thêm một loại component UI mới, Abstract Factory cần thay đổi những phần nào?
    3. Lỗi tạo object, null, lifecycle và kiểm thử family consistency nên được kiểm soát tại ranh giới nào?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Nhận diện Factory Method | Chỉ ra Creator sở hữu quy trình gửi tin và subclass override điểm tạo Sender trong ví dụ campaign. |
    | Dựng Abstract Factory | Phác thảo UiFactory tạo hai product cùng theme, client không cần biết class cụ thể. |
    | Phân loại factory | So sánh simple factory, static factory, GoF Factory Method, Abstract Factory với DI. |
    | Phân tích mở rộng | Dự đoán chi phí khi thêm họ Light/Dark mới và khi thêm loại UI Product. |
    | Kiểm chứng contract | Nêu test Creator dùng fake product và test concrete factory tạo cả họ product nhất quán. |
- id: design-patterns-003
  title: Builder và việc tạo đối tượng phức tạp
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Builder và việc tạo đối tượng phức tạp**

    Làm chủ quy trình tạo Order có nhiều tùy chọn và ràng buộc bằng fluent Builder. Người học thấy cách khai báo trường bắt buộc, kiểm tra trước và tại build(), áp mặc định, dùng BigDecimal/List.copyOf để bảo vệ dữ liệu, và cân nhắc dùng constructor, record, static factory hoặc staged builder khi phù hợp.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Builder và trạng thái khởi tạo

    1. Vì sao constructor nhiều tham số và việc dùng setter liên tiếp khó biểu diễn ràng buộc cho một Order nhiều tùy chọn?
    2. Fluent Builder cho phép nhập trường bắt buộc, thêm line item và gọi build() theo luồng nào?
    3. Kiểm tra độc lập nên làm khi cấu hình, còn bất biến liên trường và tính hoàn chỉnh phải kiểm ở giai đoạn nào?

    ### Bất biến, lựa chọn và kiểm thử

    1. Vì sao Builder mutable vẫn có thể tạo Order immutable và List.copyOf giúp tránh aliasing sau build()?
    2. Fluent Builder, staged Builder và Director khác nhau về độ phức tạp và yêu cầu trình tự như thế nào?
    3. Một ReportConfig cho CSV/PDF với giới hạn biểu đồ và khoảng ngày nên được test những trường hợp mặc định/lỗi nào?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Thiết kế API tạo object | Viết luồng Order.builder(required...).addItem(...).build() đọc rõ ý nghĩa từng trường. |
    | Bảo vệ invariant | Phân loại validation từng bước và validation liên trường ở build() để không tạo product thiếu dữ liệu. |
    | Kiểm tra defensive copy | Chứng minh thay đổi builder/list gốc sau build không sửa danh sách item của Order đã tạo. |
    | Lựa chọn kỹ thuật | Giải thích trường hợp chỉ cần record/constructor và khi staged Builder hoặc Director thực sự có ích. |
    | Thiết kế test | Lập test cho required fields, defaults, BigDecimal, tổ hợp không hợp lệ và tái sử dụng Builder. |
- id: design-patterns-004
  title: Singleton và rủi ro trạng thái dùng chung
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Singleton và rủi ro trạng thái dùng chung**

    Hiểu Singleton chỉ kiểm soát số lượng và điểm truy cập instance trong một phạm vi nhất định, không tự làm object thread-safe. Qua static holder, enum counter, AtomicLong và bean Spring, bài phân biệt việc khởi tạo, đồng bộ thao tác, phạm vi request, dependency injection và vòng đời tài nguyên.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Phạm vi instance và an toàn đồng thời

    1. Một instance trong static Singleton, mỗi class loader, Spring singleton bean và toàn cụm ứng dụng khác nhau thế nào?
    2. Vì sao holder hoặc enum giúp khởi tạo an toàn nhưng không biến mutable currentOrder hay total++ thành thao tác thread-safe?
    3. Trong hai request đồng thời, việc lưu user/order/amount trong field singleton có thể tạo xen kẽ sai lệch ra sao?

    ### Thiết kế thay thế và bảo đảm

    1. Khi nào AtomicLong, ConcurrentHashMap hoặc lock phù hợp với dữ liệu chia sẻ, và tại sao vẫn không thay thế transaction?
    2. Constructor injection với MailClient fake giải quyết phụ thuộc ẩn getInstance() trong unit test như thế nào?
    3. Tại sao singleton bean inject một prototype ShoppingCart không tự tạo cart mới cho mỗi HTTP request?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Xác định scope | Nêu phạm vi instance Java class loader, IoC container, process và phân tán mà không khẳng định một object toàn cầu. |
    | Mô phỏng race | Chỉ ra trình tự hai request làm rò rỉ/sai trạng thái currentUser, currentOrder trong service dùng chung. |
    | Sửa quyền sở hữu trạng thái | Chuyển dữ liệu request sang tham số/biến cục bộ và chọn dependency đúng scope. |
    | Chọn đồng bộ | Phân biệt AtomicLong bảo vệ phép tăng với các bất biến nhiều bước cần khóa/transaction. |
    | Cải thiện kiểm thử | Thay global getInstance bằng constructor injection, test riêng và cơ chế quản lý lifecycle. |
- id: design-patterns-005
  title: Adapter và tích hợp giao diện khác nhau
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Adapter và tích hợp giao diện khác nhau**

    Hiểu Adapter như một ranh giới giữa PaymentGateway của ứng dụng và LegacyPaymentSdk không tương thích, không phải bộ đổi tên phương thức. Bài dùng BigDecimal USD → long cents chính xác, ánh xạ trạng thái approved/declined, phân biệt timeout chưa biết kết quả và cảnh báo retry thanh toán có thể gây giao dịch trùng.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Hợp đồng Target và ánh xạ SDK

    1. Target, Adapter, Adaptee và Client đảm nhận vai trò gì trong luồng CheckoutService → PaymentGateway → LegacyPaymentApi?
    2. Vì sao 12.34 USD đổi thành 1234 cents bằng movePointRight(2).longValueExact() an toàn hơn dùng double và phép ép long?
    3. Khi legacy trả mã "00" hoặc "05", Adapter cần chuyển thành PaymentReceipt có ý nghĩa nghiệp vụ như thế nào?

    ### Lỗi và thiết kế tích hợp

    1. Vì sao timeout thanh toán không được tự coi là DECLINED hay tự retry vô điều kiện?
    2. Object Adapter dùng composition khác Class Adapter kế thừa ở khả năng thay SDK và dùng fake cho test ra sao?
    3. Adapter khác Facade và Decorator ở ý định gì, và những trường hợp pending/response lỗi cần hợp đồng gì?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Vẽ luồng chuyển đổi | Mô tả Target PaymentGateway, Adaptee SDK và chuyển đổi dữ liệu/trạng thái trong LegacyPaymentAdapter. |
    | Kiểm tra tính chính xác tiền | Dự đoán kết quả 12.34 USD→1234 cents và từ chối số không biểu diễn nguyên cent. |
    | Phân biệt lỗi | Thiết kế kết quả approved/declined/unknown khi SDK trả mã hoặc timeout. |
    | Giảm phụ thuộc vendor | Xác định vì sao CheckoutService chỉ nên biết PaymentGateway chứ không nhận LegacyReply. |
    | Xác minh tích hợp | Thiết kế fake LegacyPaymentApi và test mapping, lỗi, timeout, idempotency/reconciliation. |
- id: design-patterns-006
  title: Decorator và bổ sung hành vi
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Decorator và bổ sung hành vi**

    Khám phá cách một MessageChannel bọc một MessageChannel khác cùng hợp đồng để thêm prefix, giới hạn chiều dài, đếm lời gọi mà không sửa ConsoleChannel. Bài nhấn mạnh thứ tự lớp bọc, định nghĩa lần gửi thành công, exception và lựa chọn decorator so với proxy, inheritance hoặc một helper đơn giản.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Cấu trúc và composition

    1. Component, Concrete Component, base Decorator và Concrete Decorator được xác định ra sao trong MessageChannel?
    2. Một PrefixDecorator hoặc CountingDecorator có thể giữ cùng interface và delegate thao tác send() như thế nào?
    3. Vì sao BufferedInputStream bọc InputStream là ví dụ rõ về bổ sung hành vi mà client vẫn dùng read()?

    ### Thứ tự, contract và giới hạn

    1. Khi đặt PrefixDecorator trước hay sau LengthLimitDecorator giới hạn 12 code points, vì sao có chuỗi được chấp nhận dù kết quả vượt giới hạn?
    2. CountingDecorator tăng bộ đếm sau khi delegate trả về bình thường thì đang đếm điều gì, và không chứng minh điều gì về giao hàng?
    3. Vì sao AtomicInteger không tự khiến toàn bộ decorator chain thread-safe, và khi nào không đáng tạo nhiều wrapper?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Đọc cấu trúc bọc | Chỉ ra delegate của từng MessageChannel và giữ nguyên contract send() qua các lớp wrapper. |
    | Dự đoán thứ tự | Mô phỏng hai thứ tự Prefix/LengthLimit để xác định độ dài thông điệp được kiểm tra. |
    | Kiểm thử riêng từng lớp | Tạo fake channel và quan sát delegate, prefix, lỗi giới hạn và số lần đếm sau success. |
    | Phân biệt pattern | Giải thích Decorator khác Adapter/Proxy/inheritance ở mục tiêu bổ sung hành vi cùng interface. |
    | Đánh giá chi phí | Chọn giữ helper hoặc ít wrapper khi chain làm call path khó theo dõi và phụ thuộc thứ tự. |
- id: design-patterns-007
  title: Facade và đơn giản hóa cách sử dụng
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Facade và đơn giản hóa cách sử dụng**

    Học cách tạo một điểm vào cấp cao cho use case báo giá, thay vì để nhiều client tự ghép Catalog, Inventory, Discount và Shipping. Bài giải thích Facade ẩn trình tự, không làm mất độ phức tạp bên dưới, không tự tạo transaction phân tán hay giảm latency, và cần test kết quả cùng nhánh lỗi.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Ranh giới Facade

    1. Tại sao controller tự gọi lần lượt Catalog, Inventory, Discount và Shipping dẫn đến coupling và lặp trình tự?
    2. Facade quote(sku, quantity, member) có thể ẩn bước nào mà vẫn giữ riêng trách nhiệm Catalog/Inventory?
    3. Nếu phí vận chuyển được miễn khi tiền hàng sau giảm đạt ngưỡng, vì sao thứ tự tính toán phải nằm trong hợp đồng?

    ### Giới hạn và kiểm chứng

    1. Vì sao quote kiểm tra tồn kho chưa phải reserve/order và không tự bảo đảm inventory lúc đặt hàng thật?
    2. Facade khác Adapter, Decorator và application service ở mục đích/boundary thế nào?
    3. Lợi ích đơn giản hóa API có thể đánh đổi bằng God Facade, latency và sai lệch transaction ra sao?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Thiết kế API use case | Đề xuất CheckoutFacade.quote nhận input đủ dùng và trả Quote thay vì lộ API subsystem. |
    | Phân tích chuỗi bước | Chỉ ra thứ tự tìm sản phẩm, xác minh tồn, giảm giá rồi tính shipping trong flow báo giá. |
    | Phân biệt ranh giới | Giải thích quote không cấp quyền giữ hàng hoặc giải quyết consistency khi nhiều request cạnh tranh. |
    | So sánh pattern | Đặt Facade cạnh Adapter/Decorator và nêu khác biệt về ý định đơn giản hóa API. |
    | Kiểm thử kết quả | Nêu test thành viên, nonmember, SKU sai, hết hàng, discount và phí giao đúng. |
- id: design-patterns-008
  title: Strategy và thay thế thuật toán
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Strategy và thay thế thuật toán**

    Thực hành thay thuật toán tính chiết khấu bằng đối tượng cùng hợp đồng DiscountStrategy được Checkout sử dụng qua composition. Bài đi từ nhánh điều kiện, interface, concrete strategies và lambda đến contract test, lựa chọn tại composition root, BigDecimal có giới hạn hai chữ số và kiểm soát lựa chọn strategy từ dữ liệu người dùng.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Vai trò và điểm thay đổi

    1. Context, Strategy interface và Concrete Strategies phối hợp thế nào để Checkout không phụ thuộc từng chính sách giảm giá?
    2. Vì sao composition giúp chọn DiscountStrategy khác nhau khi tạo Checkout hoặc chuyển đổi lúc chạy?
    3. Lambda có thể đóng vai trò Strategy khi nào, và trường hợp thuật toán phức tạp nào nên tạo class riêng?

    ### Hợp đồng và lựa chọn an toàn

    1. DiscountStrategy cần cam kết những điều kiện nào về subtotal, discount và BigDecimal scale?
    2. Vì sao đổi strategy qua setter trong singleton nhiều request có thể tạo race condition giữa đơn hàng?
    3. Khi policy key lấy từ HTTP, vì sao chỉ nên ánh xạ sang registry strategy đã đăng ký thay vì phản chiếu class tùy ý?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Dựng cấu trúc | Vẽ Checkout → DiscountStrategy → các concrete strategies và mô tả chiều dependency. |
    | Thay biến thể | Mô phỏng việc lắp policy khác vào Context không cần sửa thuật toán checkout. |
    | Kiểm tra contract | Thiết kế contract tests bảo đảm discount không âm, không vượt subtotal và biểu diễn đúng hai chữ số. |
    | Sử dụng lambda hợp lý | Giải thích một functional interface Strategy dùng lambda được khi xử lý ngắn. |
    | Đánh giá concurrency/config | Lựa chọn strategy bất biến theo request và registry hữu hạn khi đầu vào bên ngoài quyết định biến thể. |
- id: design-patterns-009
  title: State và hành vi theo trạng thái
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **State và hành vi theo trạng thái**

    Đưa vòng đời đơn hàng từ các nhánh kiểm tra rải rác vào State objects có quy tắc chuyển trạng thái rõ. Bài dạy Context Order, OrderState và các state CREATED/PAID/SHIPPED/CANCELLED, test ma trận trạng thái × thao tác, hạn chế public setStatus và ranh giới lưu trạng thái, transaction, xử lý đồng thời.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Trạng thái, lệnh và phép chuyển

    1. CREATED, PAID, SHIPPED, CANCELLED khác các thao tác confirmPayment(), markShipped(), cancel() và guard ở đâu?
    2. Context Order ủy quyền cho OrderState như thế nào và vì sao private state tốt hơn public setStatus()?
    3. Điều gì xảy ra khi gọi cancel() từ PAID hoặc markShipped() từ CREATED trong ví dụ OrderStateDemo?

    ### Chọn State và giữ đúng nghiệp vụ

    1. State khác Strategy ở nguồn quyết định đổi hành vi và việc chuyển trạng thái như thế nào?
    2. Khi nào enum + switch ngắn là đủ, khi nào nhiều quy tắc/transition khiến State Pattern đáng dùng?
    3. Hai request confirm/cancel đồng thời hoặc phát event trước DB commit có thể gây sai lệch nào; test matrix cần bao phủ gì?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Mô hình hóa state machine | Vẽ bảng CREATED/PAID/SHIPPED/CANCELLED với từng thao tác hợp lệ hay bị từ chối. |
    | Thiết kế ranh giới | Dùng command methods của Order và giấu việc chuyển state trong Context/State hợp lệ. |
    | Dự đoán kết quả | Theo dõi CREATED→PAID→SHIPPED và lỗi thao tác không hợp lệ mà không tự ý đổi trạng thái. |
    | Kiểm tra vòng đời | Thiết kế test các transition hợp lệ và tất cả nhánh invalid trong ma trận. |
    | Đánh giá tính nhất quán | Giải thích nhu cầu optimistic locking, transaction/outbox khi state gắn dữ liệu bền và event. |
- id: design-patterns-010
  title: Observer và thông báo thay đổi
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Observer và thông báo thay đổi**

    Bài học mô hình hóa quan hệ Publisher–Listener qua OrderStatusChanged bất biến, subscribe/unsubscribe và nhiều phản ứng phụ khi đơn đổi trạng thái. Người học nắm thời điểm phát, không phát khi không đổi, xử lý lỗi listener, memory leak, reentrancy, đồng bộ vs async và ranh giới transaction/outbox khi mở rộng sang message broker.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Luồng publish và quan hệ listener

    1. Subject, Listener, Event payload và Subscription đóng vai trò gì khi OrderService chuyển CREATED→PAID?
    2. Vì sao nên mô tả oldStatus/newStatus trong event và không phát khi trạng thái giữ nguyên?
    3. Push model khác Pull model ở coupling và nguy cơ đọc trạng thái đã thay đổi thêm lần nữa như thế nào?

    ### Lỗi, vòng đời và dữ liệu bền

    1. Vì sao quên unsubscribe listener được Subject giữ bằng strong reference có thể gây memory leak?
    2. Tại sao Observer callback không mặc định chạy async và thứ tự dispatch/reentrancy có thể khiến xử lý sự kiện sai?
    3. Vì sao phát event trước commit DB hoặc retry qua broker cần outbox, eventId và xử lý idempotent?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Thiết kế event contract | Đề xuất OrderStatusChanged chứa mã đơn, old/new status và data tối thiểu, không phát no-op. |
    | Quản lý đăng ký | Mô tả subscribe trả handle rồi close/unsubscribe để tránh callback trùng và giữ tham chiếu lâu. |
    | Dự đoán dispatch | Phân tích thứ tự callback, lỗi listener, reentrant emit và ảnh hưởng của handler chậm. |
    | Phân biệt event flow | So sánh Observer đồng bộ trong JVM, event bus và pub/sub qua broker. |
    | Kiểm tra consistency | Đề xuất contract test và giải thích thời điểm publish, outbox, duplicate eventId và idempotent consumer. |
- id: design-patterns-011
  title: Template Method và khung thuật toán
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Template Method và khung thuật toán**

    Phân tích khung generate() cố định ở SalesReportTemplate và các bước header(), row(), footer() biến thiên cho báo cáo Text/Markdown. Bài dạy phân biệt phương thức final, primitive operation, hook tùy chọn, kiểm tra thứ tự và rủi ro kế thừa khi gọi override trong constructor hoặc tạo quá nhiều điểm mở rộng.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Bước bất biến và bước có thể thay

    1. Template Method giữ thứ tự validate→calculateTotal→render như thế nào khi các subclass cung cấp định dạng riêng?
    2. Bước chung, protected abstract primitive operation và hook tùy chọn khác nhau về nhiệm vụ và cách override?
    3. Vì sao generate() có thể khai báo final để subclass không viết lại cả workflow?

    ### Giới hạn kế thừa và kiểm chứng

    1. Vì sao gọi configure() overridable trong constructor superclass có thể gặp field của subclass chưa được khởi tạo?
    2. Khi có nhiều trục thay đổi như format, ngôn ngữ, kênh xuất, vì sao Strategy/composition có thể giảm bùng nổ subclass?
    3. Contract tests nào chứng minh thứ tự bước, hook mặc định, tổng doanh thu và dữ liệu đầu vào không bị thay đổi?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Nhận diện khung thuật toán | Xác định method generate() và các bước cố định/abstract/hook của SalesReportTemplate. |
    | Dự đoán dispatch | Giải thích cách Text và Markdown subclass ghi đè format nhưng không thay thứ tự tổng thể. |
    | Bảo vệ invariant | Đề xuất final template, dữ liệu bất biến và tránh gọi hook từ constructor chưa hoàn tất. |
    | So sánh cơ chế | Đối chiếu Template Method inheritance với Strategy composition và Factory Method điểm tạo object. |
    | Kiểm thử workflow | Nêu test thứ tự các bước và kết quả của subclass có hoặc không có optional hook. |
- id: design-patterns-012
  title: Command và đóng gói yêu cầu
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Command và đóng gói yêu cầu**

    Hiểu cách biến một yêu cầu thành object để tách nguồn gọi (UI, phím tắt, scheduler) khỏi TaskBoard thực hiện. Ví dụ AddTaskCommand, CompleteTaskCommand và CommandManager làm rõ Receiver/Invoker, lưu trạng thái trước khi thay đổi, undo/redo stacks, xử lý thất bại và giới hạn lệnh có hiệu ứng ngoài tiến trình.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Vai trò và quản lý lệnh

    1. Command, Concrete Command, Receiver và Invoker khác nhau thế nào trong TaskBoard và CommandManager?
    2. Vì sao AddTaskCommand cần nhớ mã công việc đã thêm, còn CompleteTaskCommand phải lưu giá trị done trước đó?
    3. UndoStack và RedoStack cần thay đổi tại thời điểm nào để thao tác lỗi không làm mất lịch sử?

    ### Tính đúng đắn và ranh giới

    1. Undo một thao tác gửi email hay thanh toán thật khác với hoàn tác field trong bộ nhớ như thế nào?
    2. Command cần lưu tham số, trạng thái và version nào để replay/redo không gây tác dụng phụ sai khi Receiver đã đổi?
    3. Khi nào Runnable/lambda là đủ và khi nào command object có identity, history, queue hoặc retry thực sự tạo giá trị?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Phân biệt vai trò | Vẽ luồng Invoker→Command→Receiver và giải thích UI không giữ business logic. |
    | Mô phỏng undo/redo | Theo dõi AddTask và CompleteTask để khôi phục đúng trạng thái trước thao tác. |
    | Quản lý lịch sử | Phân tích khi nào push/pop undo/redo stack sau khi execute, undo hoặc redo thành công. |
    | Giới hạn hiệu ứng phụ | Giải thích vì sao network command cần idempotency, transaction hoặc compensation, không thể undo bằng cách đảo field. |
    | Đánh giá pattern | Chọn Command hay Runnable/lambda theo yêu cầu lịch sử, audit, xếp hàng và chi phí lớp. |
- id: design-patterns-013
  title: Khi mẫu thiết kế làm hệ thống phức tạp hơn cần thiết
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Khi mẫu thiết kế làm hệ thống phức tạp hơn cần thiết**

    Củng cố cách chống abstraction quá sớm qua ví dụ ba mức phí giao hàng cố định. Bài so sánh enum đơn giản với Strategy+Factory+Registry, chỉ rõ các chi phí nhận thức, kiểm thử, DI và debug, đồng thời nêu dấu hiệu nhu cầu thay đổi thật, YAGNI/KISS/DRY, giữ port hữu ích và quy trình giảm lớp an toàn theo test hành vi.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Đánh giá giá trị của abstraction

    1. Vì sao ba mức phí cố định STANDARD/EXPRESS/PRIORITY chưa cần Strategy, Factory và Facade chỉ chuyển tiếp?
    2. Những chi phí nhận thức, điều hướng, bảo trì và kiểm thử nào xuất hiện khi một request phải đi qua nhiều lớp bọc?
    3. YAGNI, KISS, DRY và Rule of Three gợi ý điều gì khi chưa có nhiều biến thể thực tế?

    ### Thay đổi yêu cầu và refactor an toàn

    1. Khi EXPRESS bắt đầu tính thêm 8000 VND/kg và nhiều đội làm thuật toán, những bằng chứng nào ủng hộ Strategy?
    2. Vì sao một interface chỉ có một implementation như PaymentGateway vẫn có thể là ranh giới hạ tầng cần giữ?
    3. Khi xóa God Factory hoặc các lớp chỉ forward, cần những contract tests/compatibility checks nào để không phá khách hàng?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Đánh giá overengineering | Chỉ ra lớp Factory/Strategy/Facade thừa trong sơ đồ báo giá có ba hằng phí. |
    | Thiết kế đủ nhu cầu | Đề xuất enum hoặc cấu hình đơn giản cho bảng phí ổn định, có validation và test. |
    | Nhận diện điểm tách | Giải thích khi biến thể trở thành thuật toán độc lập thì Strategy bắt đầu có lợi hơn chi phí. |
    | Giữ boundary hữu ích | Phân biệt adapter/port PaymentGateway bảo vệ miền nghiệp vụ với interface chỉ forward không có giá trị. |
    | Lập kế hoạch refactor | Thiết kế bước giảm indirection có test giữ output, lỗi, side effect, API và concurrency. |
