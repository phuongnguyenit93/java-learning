version: 1
type: LEARNING_ROADMAP
title: INHERITANCE — LESSON CONNECTIONS
roadmapHeading: How the Lessons Connect
roadmap:
- id: inheritance-001
  order: 1
  title: Superclasses, Subclasses, and Inheritance Relationships
  description: Understand the nature of the is-a relationship, distinguish superclass and subclass responsibilities and their shared contract, and recognize polymorphism through an employee scenario.
  transition:
    to: inheritance-002
    description: '**From identifying object types → examining the data and methods present in the subclass object itself.**'
- id: inheritance-002
  order: 2
  title: Inheriting State and Behavior
  description: Identify state and behavior defined in superclasses and subclasses; distinguish inheritance, additions, overriding, and field hiding.
  transition:
    to: inheritance-003
    description: '**From understanding inherited members → practicing behavior extensions for specific variants.**'
- id: inheritance-003
  order: 3
  title: Extending Superclass Behavior
  description: Use overriding together with super and Template Method to add functionality while preserving the shared process.
  transition:
    to: inheritance-004
    description: '**From extending behavior → carefully checking the rules for overriding, super, and dispatch.**'
- id: inheritance-004
  order: 4
  title: Method Overriding and Invoking Superclass Behavior
  description: Interpret dynamic dispatch, @Override rules, super.method(), and the boundaries of method contracts accurately.
  transition:
    to: inheritance-005
    description: '**From valid overrides → determining which members are visible and callable from each package.**'
- id: inheritance-005
  order: 5
  title: Access to Inherited Members
  description: Determine accessibility under public/protected/package-private/private, especially for subclasses in different packages.
  transition:
    to: inheritance-006
    description: '**From member access rules → tracing the initialization sequence before those behaviors are used.**'
- id: inheritance-006
  order: 6
  title: Subclass Initialization and Superclass Constructor Chaining
  description: Trace static/instance initialization and constructor chaining; avoid invoking overridden methods on incomplete state.
  transition:
    to: inheritance-007
    description: '**From initialization risks → deciding which parts must be locked down to preserve superclass rules.**'
- id: inheritance-007
  order: 7
  title: Non-Overridable Members and Non-Inheritable Classes
  description: Control extension points with final classes and final methods, considering sealed classes and valid hooks.
  transition:
    to: inheritance-008
    description: '**From restricting extension points in a class → combining multiple contracts through interfaces within Java’s constraints.**'
- id: inheritance-008
  order: 8
  title: Single Inheritance, Multiple Inheritance, and Behavior Conflicts
  description: Combine multiple interfaces with a single superclass, resolving default-method conflicts using Java's precedence rules.
  transition:
    to: inheritance-009
    description: '**From Java default methods and conflicts → exploring behavior sharing across unrelated class branches and comparing it with traits.**'
- id: inheritance-009
  order: 9
  title: Mixins, Traits, and Language-Specific Behavior Reuse
  description: Extend behavior reuse through interface default methods; distinguish mixins and traits across languages from composition.
  transition:
    to: inheritance-010
    description: '**From reuse techniques → evaluating the long-term costs of deep inheritance hierarchies.**'
- id: inheritance-010
  order: 10
  title: Limits and Costs of Deep Inheritance Hierarchies
  description: Identify fragile base classes and the testing costs of deep hierarchies; choose refactorings that preserve existing contracts.
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 | Lesson 9 | Lesson 10 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Superclasses, Subclasses, and Inheritance Relationships | Inheriting State and Behavior | Extending Superclass Behavior | Method Overriding and Invoking Superclass Behavior | Access to Inherited Members | Subclass Initialization and Superclass Constructor Chaining | Non-Overridable Members and Non-Inheritable Classes | Single Inheritance, Multiple Inheritance, and Behavior Conflicts | Mixins, Traits, and Language-Specific Behavior Reuse | Limits and Costs of Deep Inheritance Hierarchies |
  | Questions to Understand | Is the subtype really a kind of the supertype? | How does superclass state and behavior exist and get used? | How can functionality be extended while retaining common steps? | How do overrides and super determine which method executes? | Who can access which members from which packages? | In what order does new Child perform initialization? | When should extends or overriding be prohibited? | How are interfaces combined and default-method conflicts resolved? | How can classes without a common superclass share behavior? | What risks do deep hierarchies introduce, and how can their depth be reduced? |
  | Value for OOP/the Module | Establish a subtype relationship with a clear contract. | Keep shared data and invariants in the superclass. | Create extension points for business-specific variants. | Ensure correct dispatch and use of super. | Design APIs with appropriate access boundaries. | Initialize subclasses consistently and safely. | Preserve invariants, processes, and subtype boundaries. | Combine multiple capabilities without multiple inheritance of state. | Reuse behavior across class hierarchies when appropriate. | Reduce coupling and regression risks in larger designs. |
  | Mental Model Developed | Check the is-a relationship and substitutability. | Distinguish the presence of state from permission to access it. | Specialize behavior in a controlled way. | Trace runtime calls and contractual commitments. | Reason from modifiers, packages, and qualifier types. | Trace lifecycles and not-yet-ready state. | Deliberately choose what to leave open and what to lock down. | Resolve contract conflicts before combining them. | Separate capabilities from class lineage. | Assess change costs across the entire hierarchy. |
