version: 1
type: LEARNING_ROADMAP
title: RELATIONSHIPS — LESSON CONNECTIONS
roadmapHeading: Learning Path Through the Lessons
roadmap:
- id: relationships-001
  order: 1
  title: Associations Between Objects
  description: Identify links between objects and how associations change, while distinguishing navigability, multiplicity, and ownership.
  transition:
    to: relationships-002
    description: '**From links between objects → distinguish business associations from dependencies on collaborators**'
- id: relationships-002
  order: 2
  title: Temporary Dependencies and Persistent Associations
  description: Distinguish a collaborator used during an operation from an association stored as state; choose parameters, fields, or injection according to the need.
  transition:
    to: relationships-003
    description: '**From usage relationships → clarify ownership and lifecycle semantics of whole–part relationships**'
- id: relationships-003
  order: 3
  title: Aggregation and Composition
  description: Design whole–part relationships based on a part's independence and ownership; protect the lifecycles of Team–Employee and Order–LineItem.
  transition:
    to: relationships-004
    description: '**From ownership in whole–part relationships → define multiplicity constraints at both ends**'
- id: relationships-004
  order: 4
  title: 'Multiplicity: One-to-One, One-to-Many, and Many-to-Many'
  description: Read multiplicity at both ends and enforce 1–1, 1–N, and N–N constraints through APIs, registries, or Enrollment objects.
  transition:
    to: relationships-005
    description: '**From multiplicity at each end → decide which navigation directions the object graph truly needs**'
- id: relationships-005
  order: 5
  title: Association Direction and Navigability
  description: Store only the association directions that need to be traversed; use repositories where appropriate and manage the cost of bidirectional links.
  transition:
    to: relationships-006
    description: '**From choosing navigation directions → preserve invariants when both directions must be stored**'
- id: relationships-006
  order: 6
  title: Bidirectional Relationships and Data Consistency
  description: Maintain a single consistent relationship between `Employee.department` and `Department.employees` across all operations, both in memory and with JPA.
  transition:
    to: relationships-007
    description: '**From maintaining consistent links → recognize coupling and dependency cycles between components**'
- id: relationships-007
  order: 7
  title: Dependency Cycles and How to Break Them
  description: Distinguish valid reference cycles from problematic dependency cycles; move orchestration and dependencies to boundaries with clear responsibilities.
  transition:
    to: relationships-008
    description: '**From the designed relationship structure → read and verify it using UML notation**'
- id: relationships-008
  order: 8
  title: Reading Relationship Notation in Class Diagrams
  description: Combine six relationship symbols and UML labels to read diagrams and verify how associations, ownership, multiplicity, and contracts are represented in Java.
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Associations Between Objects | Temporary Dependencies and Persistent Associations | Aggregation and Composition | Multiplicity: One-to-One, One-to-Many, and Many-to-Many | Association Direction and Navigability | Bidirectional Relationships and Data Consistency | Dependency Cycles and How to Break Them | Reading Relationship Notation in Class Diagrams |
  | Key question | Which objects does an association connect, and how do links change? | How does a dependency within one operation differ from an association stored as state? | When does a part belong exclusively to a whole? | What cardinality constraints do 1–1, 1–N, and N–N impose? | In which direction can one object navigate to the other end? | How can both sides reflect the same relationship through changes and failures? | How do design, wiring, and runtime cycles arise and get broken? | What do UML line styles, arrowheads, diamonds, and multiplicities mean? |
  | Value for OOP/the module | Model instance relationships correctly, including assignment, transfer, and removal APIs. | Avoid confusing service dependencies with business state and lifecycles. | Protect ownership and avoid accidentally deleting shared parts. | Enforce cardinality, uniqueness, and association-object rules. | Reduce redundant stored state and unnecessary reverse links. | Prevent inconsistent object graphs/JPA data and partial updates. | Reduce coupling and initialization errors while keeping business flows testable. | Read and communicate class models accurately before coding. |
  | Mental model developed | Ask which objects are actually linked at runtime. | Ask whether a collaborator is needed for an operation or a relationship must be stored. | Ask who owns the part and whether it can exist independently. | Ask how many B instances each A can have, and how many A instances each B can have. | Ask which direction queries need and whether a reverse field is necessary. | Ask what invariant both sides must satisfy and where updates belong. | Draw directed dependency graphs, find misplaced responsibilities, and verify after refactoring. | Interpret line styles, endpoints, multiplicity, and role labels together, then compare them with Java. |
