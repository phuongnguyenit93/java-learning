summaries:
- id: inheritance-001
  title: Superclasses, Subclasses, and Inheritance Relationships
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Superclasses, Subclasses, and Inheritance Relationships**

    This lesson establishes how to recognize when one type of object is genuinely a specialization of another. Through employee and payslip examples, learners distinguish the shared contract in the superclass from data and calculation rules specific to each subclass, allowing polymorphism without violating client expectations. An is-a relationship must be validated through substitutable behavior, not merely similar code in two classes.

    ## 2. Questions Learners Should Be Able to Answer

    ### The Nature of Inheritance Relationships

    1. For a pair of classes, what indicates that the subclass satisfies an is-a relationship with the superclass?
    2. Does creating one subclass instance create two independent superclass and subclass objects, and why?
    3. Why can a subclass object be assigned to a superclass-typed variable without allowing arbitrary calls to methods that only the subclass defines?

    ### Design and Validation

    1. In the payroll example, which parts belong in Employee, and which belong to each specific employee type?
    2. When a payroll method is called through an Employee reference, what determines which implementation executes?
    3. How can you detect an inheritance model that violates its contract, and when should composition be considered?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Identify is-a relationships | Correctly explain superclass, subclass, and the direction of extends in a Vehicle/Car diagram or an Employee example with two employee types. |
    | Assign class responsibilities | Identify shared state, shared behavior, and distinct payroll formulas that belong in superclasses or subclasses. |
    | Predict polymorphism | Predict the method executed when an Employee-typed variable refers to a SalariedEmployee or HourlyEmployee. |
    | Evaluate inheritance contracts | Analyze a Bird/Penguin example or a false is-a relationship and propose composition when a subclass violates client expectations. |
- id: inheritance-002
  title: Inheriting State and Behavior
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Inheriting State and Behavior**

    This lesson explains how a subclass object contains state defined by its superclass even though subclass code cannot necessarily access every field directly. Learners distinguish reusing behavior unchanged, adding behavior, and overriding; they also learn why method dispatch is dynamic while field hiding depends on the expression's type. This provides a foundation for designing APIs that preserve invariants instead of exposing data for subclasses to modify arbitrarily.

    ## 2. Questions Learners Should Be Able to Answer

    ### State and Behavior

    1. Why is a superclass's private field still part of a subclass object's state even though subclass code cannot read it directly?
    2. In the Employee/SalesEmployee example, which methods are reused unchanged, which are overridden, and which are added?
    3. What is the difference between field hiding and method overriding when a Parent-typed variable refers to a Child object?

    ### Protecting Contracts and Implementations

    1. Why shouldn't all shared fields be made protected merely for subclass convenience?
    2. Under what conditions is an override valid while still honoring the superclass's behavioral contract?
    3. How should Account and its subclasses be designed so that state updates always undergo validation?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Explain object structure | Draw or accurately describe superclass fields and subclass-specific fields within a single object. |
    | Classify behaviors | Classify subclass methods as inherited unchanged, added, or overridden based on the code. |
    | Predict access and dispatch | Predict results in a Parent/Child example with same-named fields and methods. |
    | Preserve invariants | Propose a validating API instead of direct access to protected mutable fields. |
- id: inheritance-003
  title: Extending Superclass Behavior
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Extending Superclass Behavior**

    This lesson moves from recognizing inheritance to extending superclass behavior for a specific variant. A priority-shipping example illustrates when a subclass reuses base fee calculations through super, when it adds new rules, and when Template Method should preserve a fixed process. Learners also examine the risks of replacing superclass logic or extending an unsuitable is-a relationship.

    ## 2. Questions Learners Should Be Able to Answer

    ### Extension Mechanisms

    1. When ExpressShippingFee extends ShippingFee, which behavior is reused through super.calculate(distanceKm), and what surcharge does the subclass add?
    2. In the lesson's example, how do inheriting a method unchanged, overriding, overloading, and static hiding differ?
    3. How does super.method() help extend behavior, and what different purpose does super(...) serve?

    ### Safe Design

    1. When should super.method() be called, when is a complete replacement by an override appropriate, and which contracts must be preserved?
    2. Which extension points can a subclass customize when Template Method fixes the common sequence in the superclass?
    3. Why should superclass constructors avoid calling overridable methods?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Extend a behavior | Write or analyze an override that uses super to add a priority surcharge without losing the shared calculation. |
    | Distinguish mechanisms | Correctly identify overriding, overloading, static hiding, and super calls in sample code. |
    | Design extension points | Propose a Template Method process with invariant steps and subclass-specific hooks. |
    | Evaluate safety | Identify risks of breaking a contract or calling subclass methods too early during initialization. |
- id: inheritance-004
  title: Method Overriding and Invoking Superclass Behavior
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Method Overriding and Invoking Superclass Behavior**

    This lesson examines the rules for overriding instance methods, how Java selects an implementation based on the actual object type, and the precise meaning of super.method(). Multilevel fee-calculation examples let learners trace call chains and check access levels, return types, checked exceptions, and @Override. The practical goal is to extend superclass logic while preserving business contracts and avoiding recursion errors or incorrect constructor behavior.

    ## 2. Questions Learners Should Be Able to Answer

    ### Overriding and Dispatch Rules

    1. When does a newly declared method count as an override, and how does @Override help detect signature errors?
    2. Which method does Java select when a variable of type A actually refers to C in the A → B → C chain?
    3. Why don't static, private, and final methods follow ordinary instance-method overriding?

    ### super and Behavioral Contracts

    1. What happens when an override calls super.fee(...), and why is that different from super(...)?
    2. Why can calling method() instead of super.method() inside an override cause recursion?
    3. Which restrictions on accessibility, return types, and checked exceptions must an override respect?
    4. What uninitialized subclass state might be observed when a superclass constructor calls an overridden method?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Check valid overrides | Identify signature errors, reduced visibility, or invalid checked-exception declarations in Java examples. |
    | Trace calls | Predict the output of an A/B/C program when overrides at each level call super. |
    | Preserve business rules | Analyze overrides that call super and check boundary conditions that syntactically valid code alone cannot guarantee. |
    | Detect initialization risks | Explain failures caused when a superclass constructor dispatches to a subclass method before field initializers run. |
- id: inheritance-005
  title: Access to Inherited Members
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Access to Inherited Members**

    This lesson helps learners read and write inheritance code that follows Java's member-access rules, especially for subclasses in different packages. The focus is on distinguishing members that form part of an object's state from the legal right to access them at a particular code location; protected does not let a subclass in another package access members through every superclass-typed variable. Learners use these rules to choose appropriately narrow public/protected/private access and avoid violating superclass invariants.

    ## 2. Questions Learners Should Be Able to Answer

    ### Java Access Rules

    1. How do public, protected, package-private, and private differ when a subclass is in the same package versus a different package?
    2. Why are this.number and b.number valid in a subclass in another package, while a.number is invalid when a is superclass-typed?
    3. Is a superclass's private field still present in a subclass object, and why can't subclass code access it directly?

    ### Design and Compilation Errors

    1. Can a subclass widen or narrow visibility when overriding a method?
    2. Under what access conditions can a subclass invoke a constructor, and why are constructors not inherited members?
    3. Why can protected fields expose invariants to violations, and how should an alternative API for state changes be designed?
    4. How do subpackages and JPMS exports affect the usability of public APIs?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Determine access rights | Decide whether a member-access expression compiles based on modifiers, packages, subclass relationships, and qualifier types. |
    | Explain protected access across packages | Analyze a Document/ManagedDocument or A/B example and identify precisely which lines are valid or invalid. |
    | Check overriding contracts | Correct an example in which a subclass reduces visibility to an allowed access level. |
    | Protect state | Design private fields and validated public/protected operations in place of protected mutable fields. |
- id: inheritance-006
  title: Subclass Initialization and Superclass Constructor Chaining
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Subclass Initialization and Superclass Constructor Chaining**

    This lesson explains the full process of creating a subclass object: selecting constructors with this/super, performing static class initialization when needed, assigning default values, and executing initializers and constructors from superclass to subclass. By tracing a program that prints its execution order, learners distinguish constructor chaining from overriding and recognize when an overridden method is called before subclass state is complete. Understanding this order helps preserve invariants and handle initialization failures at the correct point.

    ## 2. Questions Learners Should Be Able to Answer

    ### Initialization Flow

    1. How do super(args), this(args), and the implicit super() call differ?
    2. If the superclass has only a parameterized constructor and the subclass does not call super(args), what error occurs?
    3. When Child is first instantiated in the Parent → Middle → Child chain, in what order do static initialization, instance field initializers, instance blocks, and constructors run?

    ### Scenarios to Verify

    1. What are Child's field values when a Parent constructor invokes an overridden method before Child's initializers execute?
    2. Does this(...) make Child's instance initializers run multiple times, and why?
    3. If a superclass constructor throws an exception, what happens to object creation and the remaining subclass initialization steps?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Trace constructors | Predict log order in a Parent/Middle/Child example when new Child() executes. |
    | Fix initialization errors | Add an appropriate super(args) call in a subclass when the superclass lacks a no-arg constructor. |
    | Analyze early state | Explain why an overridden method invoked by a superclass constructor may observe null or 0. |
    | Preserve invariants | Propose constructors that validate data according to each class's responsibilities and avoid calling overridable hooks too early. |
- id: inheritance-007
  title: Non-Overridable Members and Non-Inheritable Classes
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Non-Overridable Members and Non-Inheritable Classes**

    This lesson clarifies the three meanings of final when applied to classes, instance methods, and variables, with particular attention to how final classes and methods affect inheritance. A payment-processing example fixes the shared validation steps while exposing only a charge hook for subclasses, demonstrating how to lock down a process while still allowing specialization. Learners also consider when final is a necessary safeguard and when sealed or composition is more appropriate to avoid closing an API to extension prematurely.

    ## 2. Questions Learners Should Be Able to Answer

    ### Meaning of final

    1. Can a subclass use a final method, and why can't it override that method?
    2. What does a final class prevent while still allowing object creation or interface implementation?
    3. How does final differ when applied to a class, a method, and a reference variable?
    4. Why are private/static methods not override points even without an explicit final modifier?

    ### Design Decisions

    1. In PaymentProcessor, why should process() be locked down while charge() remains extensible for each payment channel?
    2. How do abstract and final conflict when applied to the same class or method?
    3. When is a sealed class with permits more appropriate than a final class, and what must be considered before restricting inheritance?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Identify compilation errors | Detect attempts to extend a final class or override a final method and explain why they are rejected. |
    | Distinguish uses of final | Explain the meanings of final classes, final methods, and final variables in code. |
    | Design fixed and extensible steps | Separate the unchangeable process() step from specialized charge() behavior in the PaymentProcessor flow. |
    | Choose an extension policy | Compare final classes, sealed classes, and composition according to the API's extension requirements. |
- id: inheritance-008
  title: Single Inheritance, Multiple Inheritance, and Behavior Conflicts
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Single Inheritance, Multiple Inheritance, and Behavior Conflicts**

    This lesson explains why a Java class can have only one direct superclass but can implement multiple interfaces. Learners distinguish inheriting state and implementation from a class from combining contracts and default methods from interfaces. Through conflicting default-method scenarios, the lesson presents the precedence rules of class → more specific interface → conflict-resolving override, while also warning that semantic contract conflicts can occur even when method signatures compile.

    ## 2. Questions Learners Should Be Able to Answer

    ### One Superclass, Multiple Interfaces

    1. Why doesn't Java allow a class to extend two superclasses, and what complications arise from shared state and constructors?
    2. How does implementing multiple interfaces differ from multiple class inheritance in terms of state and contracts?
    3. What behavior can an interface default method provide without turning the interface into a superclass that holds instance state?

    ### Resolving Conflicts

    1. When a class has a method with the same signature as an interface default method, which implementation takes precedence?
    2. When a subinterface provides a more specific default method than its parent interface, which version is selected?
    3. When two unrelated default methods share a signature, how must the implementing class resolve the conflict using an override or Interface.super.method()?
    4. Why can two interfaces with identical method signatures but different units for their returned values represent a flawed design even when Java reports no conflict?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Model Java's restrictions | Classify syntax that extends multiple classes or implements multiple interfaces as valid or erroneous. |
    | Predict default-method selection | Predict the results of class-wins and most-specific-interface examples. |
    | Resolve conflicts | Write an explicit override when two unrelated interfaces provide default methods with the same name. |
    | Evaluate API combinations | Analyze name, constant, and semantic-contract conflicts; propose composition where appropriate. |
- id: inheritance-009
  title: Mixins, Traits, and Language-Specific Behavior Reuse
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Mixins, Traits, and Language-Specific Behavior Reuse**

    This lesson broadens the view of behavior reuse to classes that do not belong to the same business inheritance branch. In Java, an example in which Article and SupportTicket both implement Taggable shows how a default method can reuse a process by calling a core operation implemented by each class. The lesson also compares mixin and trait concepts across languages, emphasizing that state-storage capabilities and conflict rules from other languages must not be assumed to apply to Java.

    ## 2. Questions Learners Should Be Able to Answer

    ### Sharing Behavior Through Interfaces

    1. Why can Article and SupportTicket both use Taggable.addTags() despite having no common business superclass?
    2. What kinds of state can an interface default method contain, and why doesn't it store instance fields for each object?
    3. Why can repeated calls to addTag() within addTags() lead to a partial update if an element partway through the input is invalid?

    ### Choices and Limitations

    1. When two unrelated interfaces provide default greet(), how does the implementing class resolve the conflict?
    2. Do mixins and traits in other languages always have the same capabilities for storing state, combining behavior, and resolving conflicts?
    3. When should Java use a default method, an abstract superclass, or composition/delegation to reuse behavior?
    4. How can a default method be designed to rely only on its declared contract without assuming the implementing class's internal state?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Design shared behavior | Explain and reproduce the Taggable.addTag/addTags pattern for two different business classes. |
    | Analyze atomicity | Predict the state after addTags() fails on the third element and propose validation or rollback in the implementing class. |
    | Resolve default-method conflicts | Write an override to resolve identical default-method signatures from two unrelated interfaces. |
    | Compare techniques | Choose a default method, abstract class, or composition and explain the associated limits on state and coupling. |
- id: inheritance-010
  title: Limits and Costs of Deep Inheritance Hierarchies
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Limits and Costs of Deep Inheritance Hierarchies**

    This lesson assesses the practical costs of multiple inheritance levels, from understanding chains of overrides to hidden dependencies when a superclass changes. A delivery-fee example shows how a small change in a base class can affect a deep branch. The lesson also distinguishes maintenance and testing costs from unsupported claims about runtime performance. Learners practice assessing impact, preserving observable contracts, and switching to composition/strategy when independent variants cause class hierarchies to expand excessively.

    ## 2. Questions Learners Should Be Able to Answer

    ### Dependencies Across Class Hierarchies

    1. In the StandardDelivery → CityDelivery → PriorityCityDelivery hierarchy, how can you trace the result of quote() through multiple overrides?
    2. How does the fragile base class problem arise when a superclass changes how it calls a protected hook?
    3. Why can an ancestor's constructor calling an overridden method in a leaf class observe uninitialized state?

    ### Costs and Refactoring

    1. Which maintenance, testing, and variant-combination costs typically increase with inheritance depth?
    2. Why is it unjustified to claim that more levels of extends automatically make the JVM run more slowly?
    3. When does an is-a/LSP model still justify inheritance, and what signs suggest switching to strategy or composition?
    4. To reduce hierarchy depth without changing observable behavior, which scenarios must be listed and verified?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Trace override chains | Draw call chains and calculate results for DepthCostDemo or the HolidayPriorityDelivery variant. |
    | Identify coupling | Explain which subclasses could regress after a base-class change and why. |
    | Assess costs accurately | Distinguish maintenance/testing risks from runtime-performance measurements that require benchmarks. |
    | Propose safe refactoring | List the behaviors, exceptions, and side effects that must be preserved, then propose composition/strategy in place of a deep variant hierarchy. |
