summaries:
- id: inheritance-001
  title: Lớp cha, lớp con và quan hệ kế thừa
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Lớp cha, lớp con và quan hệ kế thừa**

    Bài học đặt nền tảng để nhận biết khi nào một loại đối tượng thực sự là phiên bản chuyên biệt của loại khác. Qua ví dụ nhân viên và phiếu lương, người học học cách phân định hợp đồng chung ở superclass với dữ liệu, cách tính riêng ở subclass; từ đó dùng đa hình mà vẫn giữ đúng kỳ vọng của client. Quan hệ is-a phải được kiểm chứng bằng hành vi thay thế được, không chỉ bằng việc hai lớp có mã giống nhau.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Bản chất quan hệ kế thừa

    1. Trong một cặp lớp, dấu hiệu nào cho thấy lớp con thỏa quan hệ is-a với lớp cha?
    2. Một lần tạo đối tượng lớp con có tạo hai đối tượng độc lập cha và con hay không, và vì sao?
    3. Vì sao có thể gán đối tượng lớp con cho biến kiểu lớp cha nhưng không gọi tùy tiện phương thức chỉ riêng lớp con?

    ### Thiết kế và kiểm chứng

    1. Trong ví dụ tính lương, phần nào thuộc Employee và phần nào thuộc mỗi loại nhân viên cụ thể?
    2. Khi gọi phương thức tính lương qua tham chiếu Employee, điều gì quyết định implementation chạy?
    3. Làm sao phát hiện một mô hình kế thừa sai hợp đồng và nên cân nhắc composition trong trường hợp nào?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Nhận diện quan hệ is-a | Giải thích đúng lớp cha, lớp con và chiều extends trong sơ đồ Vehicle/Car hoặc Employee và hai loại nhân viên. |
    | Phân định trách nhiệm lớp | Chỉ ra trạng thái, hành vi chung và công thức tính lương riêng cần đặt tại superclass/subclass. |
    | Dự đoán đa hình | Dự đoán phương thức thực thi khi gọi qua biến kiểu Employee trỏ tới SalariedEmployee hoặc HourlyEmployee. |
    | Đánh giá hợp đồng kế thừa | Phân tích ví dụ Bird/Penguin hoặc trường hợp is-a giả và đề xuất composition khi subclass phá kỳ vọng của client. |
- id: inheritance-002
  title: Kế thừa trạng thái và hành vi
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Kế thừa trạng thái và hành vi**

    Bài học giải thích một đối tượng lớp con chứa phần trạng thái do superclass định nghĩa nhưng lớp con không nhất thiết được truy cập trực tiếp từng field. Người học phân biệt việc dùng nguyên hành vi, bổ sung hành vi và override; đồng thời hiểu vì sao method được phân phối động còn field hiding dựa theo kiểu biểu thức. Đây là cơ sở để thiết kế API giữ invariant thay vì phơi bày dữ liệu cho subclass sửa tùy ý.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Trạng thái và hành vi

    1. Vì sao field private của lớp cha vẫn là một phần trạng thái đối tượng lớp con dù mã lớp con không được đọc trực tiếp?
    2. Trong ví dụ Employee/SalesEmployee, phương thức nào được dùng nguyên, phương thức nào được override, và phương thức nào được bổ sung?
    3. Điểm khác nhau giữa field hiding và method overriding khi biến kiểu Parent tham chiếu object Child là gì?

    ### Bảo vệ hợp đồng và triển khai

    1. Vì sao không nên chuyển mọi field chung thành protected chỉ để subclass tiện sử dụng?
    2. Điều kiện nào cho phép override hợp lệ mà vẫn giữ hợp đồng hành vi lớp cha?
    3. Thiết kế Account và lớp con thế nào để phép cập nhật trạng thái luôn qua kiểm tra hợp lệ?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Giải thích cấu trúc object | Vẽ hoặc mô tả đúng phần field của lớp cha và phần field riêng lớp con trong một object duy nhất. |
    | Phân loại hành vi | Phân loại các method của subclass thành kế thừa nguyên, bổ sung, override dựa trên code. |
    | Dự đoán truy cập và dispatch | Dự đoán kết quả ví dụ Parent/Child có field trùng tên và phương thức cùng tên. |
    | Giữ invariant | Đề xuất API có kiểm tra thay cho truy cập trực tiếp protected mutable field. |
- id: inheritance-003
  title: Mở rộng hành vi của lớp cha
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Mở rộng hành vi của lớp cha**

    Bài học chuyển từ nhận biết kế thừa sang thực hành mở rộng hành vi lớp cha cho một biến thể cụ thể. Ví dụ giao hàng ưu tiên cho thấy khi nào subclass dùng lại phần tính phí nền qua super, khi nào bổ sung quy tắc và khi nào cần giữ một quy trình cố định bằng Template Method. Người học còn xem xét rủi ro khi thay thế logic cha hoặc mở rộng một quan hệ is-a không phù hợp.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Cơ chế mở rộng

    1. Khi ExpressShippingFee kế thừa ShippingFee, hành vi nào được tái sử dụng qua super.calculate(distanceKm) và phụ phí nào do lớp con bổ sung?
    2. Khác nhau giữa kế thừa nguyên method, override, overload và static hiding trong ví dụ của bài là gì?
    3. super.method() giúp mở rộng hành vi ra sao, và super(...) phục vụ mục đích nào khác?

    ### Thiết kế an toàn

    1. Khi nào nên gọi super.method(), khi nào override thay thế hoàn toàn hợp lý, và cần giữ hợp đồng nào?
    2. Template Method cố định trình tự chung trong lớp cha nhưng vẫn cho phép subclass tùy biến những điểm nào?
    3. Vì sao nên tránh gọi method có thể override từ constructor lớp cha?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Mở rộng một hành vi | Viết hoặc phân tích override dùng super để cộng thêm phí ưu tiên mà không làm mất tính toán chung. |
    | Phân biệt các cơ chế | Xác định đúng override, overload, static hiding và lời gọi super trong mã minh họa. |
    | Thiết kế điểm mở rộng | Đề xuất một quy trình Template Method có bước bất biến và hook chuyên biệt cho lớp con. |
    | Đánh giá an toàn | Chỉ ra nguy cơ phá hợp đồng hay gọi method của subclass quá sớm khi khởi tạo. |
- id: inheritance-004
  title: Ghi đè phương thức và gọi hành vi lớp cha
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Ghi đè phương thức và gọi hành vi lớp cha**

    Bài học đi sâu vào quy tắc ghi đè phương thức instance, cách Java chọn implementation theo kiểu đối tượng thực tế và ý nghĩa chính xác của super.method(). Các ví dụ tính phí nhiều tầng cho phép người học lần theo chuỗi gọi, kiểm tra mức truy cập, kiểu trả về, checked exception và @Override. Mục tiêu thực hành là mở rộng logic lớp cha nhưng vẫn giữ hợp đồng nghiệp vụ và tránh lỗi đệ quy hay hành vi sai trong constructor.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Quy tắc override và dispatch

    1. Một phương thức mới được coi là override khi nào, và @Override giúp phát hiện sai chữ ký như thế nào?
    2. Java lựa chọn phương thức nào khi biến kiểu A thực tế trỏ tới C trong chuỗi A → B → C?
    3. Vì sao method static, private và final không tuân theo overriding instance thông thường?

    ### super và hợp đồng hành vi

    1. Điều gì xảy ra khi gọi super.fee(...) trong override, và vì sao lời gọi này khác super(...)?
    2. Vì sao gọi method() thay cho super.method() từ chính override có thể gây đệ quy?
    3. Những giới hạn về quyền truy cập, kiểu trả về và checked exception nào phải giữ khi override?
    4. Constructor lớp cha gọi phương thức override có thể quan sát trạng thái subclass nào chưa sẵn sàng?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Kiểm tra override hợp lệ | Chỉ ra lỗi chữ ký, giảm visibility hoặc khai báo checked exception không hợp lệ trong ví dụ Java. |
    | Truy vết lời gọi | Dự đoán kết quả chương trình A/B/C khi override từng cấp gọi super. |
    | Bảo toàn quy tắc nghiệp vụ | Phân tích override có gọi super và kiểm tra các điều kiện biên mà chỉ đúng cú pháp chưa bảo đảm. |
    | Phát hiện rủi ro khởi tạo | Giải thích lỗi khi constructor superclass dispatch đến method của subclass trước khi field initializer chạy. |
- id: inheritance-005
  title: Khả năng truy cập thành viên được kế thừa
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Khả năng truy cập thành viên được kế thừa**

    Bài học giúp đọc và viết mã kế thừa đúng luật truy cập thành viên trong Java, đặc biệt với subclass nằm ở package khác. Trọng tâm là phân biệt thành viên thuộc trạng thái đối tượng với quyền truy cập hợp lệ từ từng vị trí mã; protected không cho phép subclass ngoài package truy cập member trên mọi biến kiểu superclass. Người học vận dụng quy tắc này để chọn public/protected/private vừa đủ và tránh phá invariant của lớp cha.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Quy tắc truy cập trong Java

    1. public, protected, package-private và private khác nhau thế nào khi lớp con ở cùng package hoặc khác package?
    2. Vì sao trong subclass khác package, this.number và b.number hợp lệ nhưng a.number với a kiểu superclass lại không hợp lệ?
    3. Field private của superclass có còn trong object subclass, và vì sao subclass không thể truy cập trực tiếp?

    ### Thiết kế và lỗi biên dịch

    1. Khi override, subclass có thể mở rộng visibility hoặc thu hẹp visibility được không?
    2. Constructor được gọi từ subclass theo điều kiện truy cập nào, và vì sao nó không phải member được kế thừa?
    3. Vì sao protected field dễ làm lộ invariant, và thiết kế API thao tác trạng thái thay thế ra sao?
    4. Package con và JPMS exports ảnh hưởng khả năng dùng public API như thế nào?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Xác định quyền truy cập | Đánh giá một biểu thức truy cập member có biên dịch không từ modifier, package, subclass và kiểu của qualifier. |
    | Giải thích protected qua package | Phân tích ví dụ Document/ManagedDocument hoặc A/B và chỉ ra chính xác dòng hợp lệ, không hợp lệ. |
    | Kiểm tra hợp đồng override | Sửa ví dụ subclass giảm visibility thành quyền truy cập cho phép. |
    | Bảo vệ trạng thái | Thiết kế private field và public/protected operation có validation thay cho protected mutable field. |
- id: inheritance-006
  title: Khởi tạo lớp con và chuỗi khởi tạo lớp cha
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Khởi tạo lớp con và chuỗi khởi tạo lớp cha**

    Bài học mô tả đầy đủ quá trình tạo một đối tượng lớp con: chọn constructor bằng this/super, khởi tạo class theo static khi cần, thiết lập giá trị mặc định và chạy initializer/constructor từ superclass đến subclass. Qua chương trình in thứ tự, người học phân biệt constructor chaining với overriding và nhận ra tình huống method override bị gọi trước khi trạng thái lớp con hoàn tất. Việc hiểu thứ tự này giúp duy trì invariant và xử lý lỗi khởi tạo đúng chỗ.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Luồng khởi tạo

    1. super(args), this(args) và lời gọi super() ngầm định khác nhau thế nào?
    2. Nếu lớp cha chỉ có constructor nhận tham số mà con không gọi super(args), chương trình mắc lỗi gì?
    3. Khi lần đầu tạo Child trong chuỗi Parent → Middle → Child, các bước static initialization, instance field initializer, instance block và constructor chạy theo thứ tự nào?

    ### Các tình huống cần kiểm chứng

    1. Giá trị field của Child là gì khi constructor Parent gọi một method override trước khi initializer Child chạy?
    2. this(...) có khiến instance initializer của Child chạy lại nhiều lần không, vì sao?
    3. Nếu constructor cha ném exception, quá trình tạo object và phần khởi tạo của con tiếp tục ra sao?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Truy vết constructor | Dự đoán thứ tự log của ví dụ Parent/Middle/Child khi new Child(). |
    | Sửa lỗi khởi tạo | Thêm lời gọi super(args) đúng trong subclass khi superclass không có constructor không tham số. |
    | Phân tích trạng thái sớm | Giải thích tại sao method override gọi từ constructor cha có thể thấy null hoặc 0. |
    | Bảo toàn invariant | Đề xuất constructor kiểm tra dữ liệu theo trách nhiệm từng lớp và tránh gọi hook override quá sớm. |
- id: inheritance-007
  title: Thành viên không thể ghi đè và lớp không thể kế thừa
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Thành viên không thể ghi đè và lớp không thể kế thừa**

    Bài học làm rõ ba nghĩa của final khi gắn lên class, instance method và biến, tập trung vào ảnh hưởng của class/method đối với kế thừa. Ví dụ xử lý thanh toán cố định phần kiểm tra chung và chỉ mở hook charge cho subclass chứng minh cách khóa quy trình nhưng vẫn cho phép chuyên biệt hóa. Người học cũng biết khi nào final là rào chắn cần thiết, khi nào sealed hay composition phù hợp hơn để không đóng API quá sớm.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Ngữ nghĩa final

    1. final method có được lớp con sử dụng không, và vì sao không thể override?
    2. final class ngăn hành động nào nhưng vẫn cho phép khởi tạo đối tượng hoặc implements interface ra sao?
    3. Khác nhau giữa final trên class, method và biến tham chiếu là gì?
    4. Vì sao private/static method không phải điểm override dù không viết final?

    ### Quyết định thiết kế

    1. Trong PaymentProcessor, vì sao nên khóa process() và mở charge() cho từng kênh thanh toán?
    2. abstract và final xung đột như thế nào khi áp vào cùng class hoặc method?
    3. Khi nào một sealed class với permits phù hợp hơn final class, và cần cân nhắc gì khi đóng khả năng kế thừa?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Xác định lỗi biên dịch | Nhận diện class extends final class hoặc override final method và nêu lý do bị từ chối. |
    | Phân biệt vị trí final | Giải thích đúng ý nghĩa của final class, final method và final variable trong code. |
    | Thiết kế điểm cố định/mở | Phân định process() bất biến và charge() chuyên biệt trong luồng PaymentProcessor. |
    | Lựa chọn mức mở rộng | So sánh final class với sealed và composition theo nhu cầu đóng/mở API. |
- id: inheritance-008
  title: Kế thừa đơn, kế thừa đa và xung đột hành vi
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Kế thừa đơn, kế thừa đa và xung đột hành vi**

    Bài học giải thích vì sao một Java class chỉ có một superclass trực tiếp nhưng có thể thực thi nhiều interface. Người học phân biệt việc kế thừa state/implementation từ class với việc ghép các hợp đồng và default method từ interface. Qua các tình huống trùng default method, bài cung cấp thứ tự ưu tiên class → interface cụ thể hơn → override giải quyết xung đột; đồng thời cảnh báo xung đột hợp đồng ngữ nghĩa dù chữ ký biên dịch được.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Một superclass, nhiều interface

    1. Vì sao Java không cho phép class extends hai superclass và chuyện state/constructor chung gây khó ở đâu?
    2. implements nhiều interface khác với đa kế thừa class ở khía cạnh trạng thái và hợp đồng ra sao?
    3. Default method trong interface cung cấp hành vi gì nhưng không làm interface thành superclass chứa state instance?

    ### Giải quyết xung đột

    1. Khi class có method cùng chữ ký với interface default method, implementation nào được ưu tiên?
    2. Khi interface con cung cấp default method cụ thể hơn interface cha, bản nào được chọn?
    3. Hai default method độc lập trùng chữ ký buộc lớp implement xử lý thế nào bằng override hoặc Interface.super.method()?
    4. Vì sao hai interface cùng chữ ký nhưng khác đơn vị trả về có thể sai thiết kế dù Java không báo xung đột?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Mô hình hóa giới hạn Java | Phân loại cú pháp extends nhiều class và implements nhiều interface thành hợp lệ hoặc lỗi. |
    | Dự đoán default method | Dự đoán kết quả các ví dụ class wins và most specific interface. |
    | Khắc phục xung đột | Viết override rõ ràng khi hai interface độc lập cung cấp default method trùng tên. |
    | Đánh giá kết hợp API | Phân tích xung đột tên, hằng số và ý nghĩa hợp đồng; đề xuất composition khi phù hợp. |
- id: inheritance-009
  title: Mixin, trait và tái sử dụng hành vi tùy ngôn ngữ
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Mixin, trait và tái sử dụng hành vi tùy ngôn ngữ**

    Bài học mở rộng góc nhìn tái sử dụng hành vi cho các lớp không cùng nhánh kế thừa nghiệp vụ. Trong Java, ví dụ Article và SupportTicket cùng implements Taggable cho thấy default method có thể tái sử dụng một quy trình bằng cách gọi thao tác cốt lõi do mỗi lớp tự thực hiện. Bài cũng so sánh khái niệm mixin và trait trong nhiều ngôn ngữ, nhấn mạnh không suy diễn tính năng lưu state hay quy tắc xung đột của ngôn ngữ khác sang Java.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Dùng chung hành vi bằng interface

    1. Vì sao Article và SupportTicket cùng dùng Taggable.addTags() dù không chung superclass nghiệp vụ?
    2. Một interface default method có thể chứa kiểu state nào và vì sao không tự lưu field instance cho từng object?
    3. Vì sao gọi addTag() lặp trong addTags() có nguy cơ cập nhật dở dang khi dữ liệu giữa chừng không hợp lệ?

    ### Lựa chọn và giới hạn

    1. Khi hai interface độc lập có default greet(), lớp implement giải quyết xung đột bằng cách nào?
    2. Mixin và trait trong các ngôn ngữ khác có phải lúc nào cũng có cùng khả năng lưu state, ghép hành vi và xử lý xung đột không?
    3. Khi nào Java nên chọn default method, abstract superclass hoặc composition/delegate để tái sử dụng hành vi?
    4. Làm sao thiết kế default method chỉ dựa vào hợp đồng đã khai báo, không giả định trạng thái nội bộ của lớp implement?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Thiết kế hành vi chia sẻ | Giải thích và tái hiện mô hình Taggable.addTag/addTags cho hai lớp nghiệp vụ khác nhau. |
    | Phân tích tính nguyên tử | Dự đoán trạng thái sau khi addTags() thất bại ở phần tử thứ ba và đề xuất validation hoặc rollback ở lớp thực thi. |
    | Xử lý va chạm default | Viết override giải quyết hai interface độc lập có default method cùng chữ ký. |
    | So sánh kỹ thuật | Chọn default method, abstract class hoặc composition và nêu giới hạn state, coupling tương ứng. |
- id: inheritance-010
  title: Giới hạn và chi phí của cây kế thừa sâu
  summary: |-
    # 0. Định hướng học tập

    ## 1. Mục đích của bài học

    **Giới hạn và chi phí của cây kế thừa sâu**

    Bài học đánh giá chi phí thực tế của nhiều tầng kế thừa, từ đọc hiểu chuỗi override đến sự phụ thuộc ngầm khi superclass thay đổi. Ví dụ tính phí giao hàng minh họa cách một đổi nhỏ ở base class ảnh hưởng nhánh sâu; bài đồng thời phân biệt chi phí bảo trì/kiểm thử với kết luận thiếu căn cứ về hiệu năng runtime. Người học luyện cách đo mức ảnh hưởng, giữ contract quan sát được và chuyển sang composition/strategy khi các biến thể độc lập làm cây lớp phình to.

    ## 2. Những câu hỏi người học phải tự trả lời được

    ### Phụ thuộc qua cây lớp

    1. Trong cây StandardDelivery → CityDelivery → PriorityCityDelivery, làm sao truy vết kết quả quote() qua các tầng override?
    2. Fragile base class phát sinh thế nào khi lớp cha thay đổi cách gọi một protected hook?
    3. Vì sao constructor lớp tổ tiên gọi method override ở lớp lá có thể nhìn thấy trạng thái chưa khởi tạo?

    ### Chi phí và tái cấu trúc

    1. Những chi phí bảo trì, kiểm thử và kết hợp biến thể nào thường tăng theo độ sâu cây kế thừa?
    2. Vì sao không thể khẳng định cứ nhiều tầng extends thì JVM tự động chạy chậm hơn?
    3. Khi nào mô hình is-a/LSP vẫn biện minh cho kế thừa, và dấu hiệu nào gợi ý chuyển sang strategy hoặc composition?
    4. Muốn giảm chiều sâu mà không làm đổi hành vi quan sát được, cần lập danh sách và kiểm tra những trường hợp nào?

    ## 3. Sau khi học xong, người học phải đạt được điều gì?

    | Năng lực | Kết quả mong đợi |
    | --- | --- |
    | Truy vết luồng override | Vẽ chuỗi lời gọi và tính kết quả cho DepthCostDemo hoặc biến thể HolidayPriorityDelivery. |
    | Nhận diện coupling | Giải thích một thay đổi base class có thể tạo hồi quy tại subclass nào và tại sao. |
    | Đánh giá chi phí chính xác | Phân biệt rủi ro bảo trì/kiểm thử với đo hiệu năng runtime cần benchmark. |
    | Đề xuất refactor an toàn | Lập danh sách hành vi, exception và side effect cần giữ rồi đề xuất composition/strategy thay cho cây biến thể sâu. |
