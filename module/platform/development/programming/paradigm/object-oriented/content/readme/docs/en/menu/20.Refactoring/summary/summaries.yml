summaries:
- id: refactoring-001
  title: Identifying Signs That Design Needs Improvement
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Identifying Signs That Design Needs Improvement**

    This lesson helps diagnose when an OOP design makes changes and testing costly. Using the smells Long Method, Large Class, Duplicate Code, Shotgun Surgery, Divergent Change, Feature Envy, and Speculative Generality, learners form hypotheses based on responsibilities, change history, and public contracts before deciding to refactor.

    ## 2. Questions Learners Should Be Able to Answer

    ### Identifying Smells and Change Costs

    1. How does Divergent Change differ from Shotgun Surgery when tracking one class and one reason for change across multiple classes?
    2. Why do Long Method and Duplicate Code not, by themselves, prove that code should be extracted or consolidated, and what evidence supports that decision?
    3. Which code smells might appear in a class responsible for pricing, formatting, and persistence?

    ### Choosing Evidence-Based Interventions

    1. How can change frequency, regression bugs, dependencies, and test setup costs help prioritize areas for review?
    2. In DesignSmellsDemo, which reasons for change are separated by extracting PricingRules and QuoteFormatter?
    3. When would a new abstraction make the code more complex, making it preferable to retain the current code?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Classifying code smells | Identify Long Method, Feature Envy, Primitive Obsession, and Speculative Generality in concrete examples. |
    | Distinguishing change patterns | Explain Divergent Change and Shotgun Surgery by identifying which locations must change for new requirements. |
    | Gathering evidence | Form hypotheses from diff history, bugs, and tests rather than line counts alone. |
    | Proposing refactorings | Choose appropriate extraction, type changes, or behavior moves based on demonstrated problems. |
    | Preserving behavior | Compare before-and-after outputs for six pricing cases and invalid inputs. |
- id: refactoring-002
  title: Renaming to Clarify Intent
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Renaming to Clarify Intent**

    This lesson teaches Rename for Intent as a refactoring that changes only identifiers while preserving results, exceptions, and calculation flow. In an order-calculation example, method, field, variable, and boolean names and VND units become clearer; learners also check impacts on public APIs, Jackson, JPA, reflection, and IDE Rename Symbol.

    ## 2. Questions Learners Should Be Able to Answer

    ### Choosing Names That Reflect Contracts

    1. Why is `Calc.f(items, true)` difficult to understand, and how does `calculatePayableAmountVnd` describe the result more clearly?
    2. How should booleans, monetary amounts, timeouts, and validation methods be named according to their actual semantics?
    3. When is a new name too long, inconsistent with the domain, or changing the meaning of a flag rather than merely renaming it?

    ### Renaming and Verifying Compatibility

    1. In RenameForIntentDemo, why must `Before.f` and `After.calculatePayableAmountVnd` preserve the exact amounts of 95.000 and 125.000 VND?
    2. What does IDE Rename Symbol offer over manual string replacement, and why is a diff review still necessary?
    3. When renaming JSON properties, JavaBean getters, JPA mappings, bean names, or public APIs, which external contracts must be checked?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Identifying ambiguous names | Evaluate class, method, field, boolean, and unit names against their actual roles. |
    | Performing renames | Use IDE Rename Symbol and review call sites and overrides. |
    | Predicting behavior | Prove that old and new calculations produce the same amounts and exceptions. |
    | Distinguishing change scope | Show why replacing a boolean with an enum or reversing a flag's meaning exceeds a rename. |
    | Verifying compatibility | Identify cases requiring serialization, JPA, reflection, or consumer tests. |
- id: refactoring-003
  title: Extracting Methods and Classes
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Extracting Methods and Classes**

    This lesson uses Extract Method to name meaningful processing steps and Extract Class to move data and behavior with distinct responsibilities into new objects. Through checkout, PricingPolicy, ReceiptFormatter, and CheckoutService, learners separate calculations from formatting while preserving totals, validation, exceptions, and side effects under the original contract.

    ## 2. Questions Learners Should Be Able to Answer

    ### Distinguishing Extraction Levels

    1. When should a block be extracted into calculateSubtotal rather than moving the entire pricing group into a new class?
    2. Why is method length insufficient to justify Extract Method or Extract Class?
    3. How do groups of fields and methods that frequently change together reveal cohesion and distinct responsibilities?

    ### Preserving Contracts

    1. When extracting a method, how must local variables, inputs/outputs, and side effects be handled to avoid changing results?
    2. How does the order of thrown exceptions change if validation is moved ahead of a calculation that overflows?
    3. Which tests verify that the new CheckoutService preserves the original subtotal, discount, shipping, total, and receipt?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Extracting methods | Turn subtotal, discount, and shipping calculations into methods with clear parameters and results. |
    | Extracting responsible classes | Separate PricingPolicy, ReceiptFormatter, and CheckoutService. |
    | Evaluating design | Identify where extraction increases cohesion and reduces dependencies. |
    | Detecting regressions | Check validation order, side effects, and exceptions before and after refactoring. |
    | Verifying equivalence | Examine the 570.000 VND VIP case, free shipping, and invalid inputs in both versions. |
- id: refactoring-004
  title: Moving Behavior to the Responsible Object
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Moving Behavior to the Responsible Object**

    This lesson explains Move Method when a service queries too many details of a domain object to perform calculations on its behalf. Through OrderLine.subtotalVnd, Order.subtotalVnd/payableVnd, and CheckoutService, learners move data-dependent behavior to the object that owns the data, retain payment I/O in the coordinating service, and consider when a domain service or policy is more appropriate.

    ## 2. Questions Learners Should Be Able to Answer

    ### Identifying the Owner of Behavior

    1. Why is CheckoutService repeatedly reading line.priceVnd and quantity a sign of Feature Envy?
    2. Why do line totals belong to OrderLine, order totals and VIP discounts belong to Order in this example, and PaymentGateway calls belong to the service?
    3. When discounts depend on multiple systems or coupons, why should not all logic necessarily be moved into Order?

    ### Moving Behavior and Testing It

    1. Which rules are protected by OrderLine using Math.multiplyExact and Order using Math.addExact?
    2. Why do List.copyOf(lines) and the OrderLine record protect state when calculations move into Order?
    3. Which tests prove that CheckoutService still sends exactly 207.000 VND once and preserves payment rejection behavior?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Detecting Feature Envy | Identify services that read excessive Order/OrderLine data to make decisions themselves. |
    | Choosing the responsible owner | Assign subtotalVnd to OrderLine, payableVnd to Order, and charge to the service/gateway. |
    | Designing behavior-rich APIs | Let callers request order.payableVnd rather than traverse the list structure. |
    | Rejecting invalid data | Apply record validation, list snapshots, and Exact arithmetic. |
    | Preserving external behavior | Read or write tests for amounts, rounding, overflow, gateway invocation counts, and invalid inputs. |
- id: refactoring-005
  title: Encapsulating Fields and Internal Structures
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Encapsulating Fields and Internal Structures**

    This lesson refactors classes exposing public fields or getters that return internal collections into APIs with validated operations. LeakyCart is replaced by ShoppingCart with putLine, changeQuantity, removeLine, lines snapshots, and totalCents; learners distinguish live views, structural copies, and immutable elements while considering public API migration.

    ## 2. Questions Learners Should Be Able to Answer

    ### Representation Exposure and Invariant Protection

    1. Why can a public final List still let clients violate invariants, and why does a private list with a getter returning the original collection not solve the problem?
    2. In ShoppingCart, why must quantity 0 remove a line and invalid prices or quantities be rejected before put?
    3. How do exposure paths through constructors, getters, and MutableLine elements differ?

    ### Snapshots and Contract-Preserving Refactoring

    1. Which mutations do List.copyOf and the LineSnapshot record prevent, and how does this differ from unmodifiableList?
    2. Which calculation errors do Math.multiplyExact and Math.addExact prevent in totalCents?
    3. When changing public fields to private or replacing LinkedHashMap with another Map, which compatibility and observable ordering guarantees must be checked?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Identifying representation leaks | Identify field/getter/element aliases that allow state changes outside validation. |
    | Designing safe APIs | Implement putLine, changeQuantity, and removeLine with SKU/price/quantity invariants. |
    | Returning contract-compliant snapshots | Compare List.copyOf, unmodifiable views, and copies of individual mutable elements. |
    | Verifying unchanged state after errors | Describe tests for exceptions, previous snapshots, and totalCents calculations. |
    | Evaluating migration | Explain changes to source compatibility, list ordering, serialization, and concurrency. |
- id: refactoring-006
  title: Replacing Type Conditionals with Polymorphism
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Replacing Type Conditionals with Polymorphism**

    This lesson applies Replace Conditional with Polymorphism when the same switch on delivery type recurs across business operations. DeliveryService moves to the DeliveryPolicy contract with StandardPolicy, ExpressPolicy, and PickupPolicy; a registry selects the policy, while dynamic dispatch runs the implementation's formula and preserves fees, ETAs, and input rules.

    ## 2. Questions Learners Should Be Able to Answer

    ### Evaluating Conditionals and Polymorphism

    1. When does switching on DeliveryType genuinely create conditional complexity that warrants refactoring?
    2. Why does having three classes selected only through if/else in the service fail to achieve the goal of polymorphism?
    3. How do DeliveryPolicy, the registry, and dynamic dispatch divide responsibility for selecting and executing formulas?

    ### Verification and Limits

    1. At the STANDARD thresholds of 499.999 and 500.000 VND, which fees and ETAs must remain unchanged after refactoring?
    2. When adding SAME_DAY, which code must register the new policy, and which DeliveryService fee calculations need no changes?
    3. When is a short switch or an enum-specific method clearer than a set of Strategy classes?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Identifying repeated conditionals | Find discriminators used in switches/if statements across multiple locations and describe the cost of adding a type. |
    | Extracting polymorphic contracts | Design DeliveryPolicy.quote and separate implementations for STANDARD/EXPRESS/PICKUP. |
    | Designing a registry | Map enum values to policies and fail fast when an implementation is missing. |
    | Explaining dispatch | Trace policy.quote calls to the correct runtime class. |
    | Verifying contracts | Compare old and new fees/ETAs across four scenarios and three invalid inputs. |
- id: refactoring-007
  title: Replacing Inheritance with Composition
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Replacing Inheritance with Composition**

    This lesson examines subclasses that extend a class merely to reuse a few methods, becoming coupled to the parent API. CriticalAlert is not an EmailSender; the design becomes an AlertService containing a MessageChannel, supporting Email/SMS and a RetryingChannel decorator. Learners examine interfaces, constructor DI, retry contracts, and compatibility when removing extends.

    ## 2. Questions Learners Should Be Able to Answer

    ### Relationships and Responsibilities

    1. Why is CriticalAlert extends EmailSender an inappropriate is-a relationship even though send works?
    2. How can a subclass override that throws UnsupportedOperationException violate LSP?
    3. How are Composition, Strategy, Decorator, and constructor injection related, and how do their responsibilities differ?

    ### Verified Migration

    1. How does AlertService receiving MessageChannel through its constructor enable email/SMS substitution and test fakes?
    2. With RetryingChannel maxAttempts set to 3, what is the maximum number of send attempts, and which exceptions are retried?
    3. If callers have used CriticalAlert as EmailSender, how does removing extends affect compatibility and what migration is needed?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Evaluating is-a/has-a | Explain why inheritance used only to borrow send is incorrect in domain terms. |
    | Refactoring with composition | Design AlertService to accept MessageChannel and delegate sending behavior. |
    | Choosing Strategy/Decorator | Replace email/SMS adapters and compose RetryingChannel without changing AlertService. |
    | Testing conditional retries | Predict send counts for DeliveryException and IllegalArgumentException failures. |
    | Reviewing compatibility | Identify callers depending on extends and propose appropriate adapters or migration. |
- id: refactoring-008
  title: Consolidating or Removing Unnecessary Abstractions
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Consolidating or Removing Unnecessary Abstractions**

    This lesson evaluates intermediate interfaces, classes, or methods that only forward calls without defining meaningful boundaries, contracts, or variations. Through PricingPort → PricingAdapter → PricingEngine and SimplifiedCheckout, learners choose Remove Middle Man, Inline Class/Method, or Collapse Hierarchy while preserving important interfaces such as PaymentGateway, Clock, Repository, and public APIs.

    ## 2. Questions Learners Should Be Able to Answer

    ### Detecting Redundant Abstractions

    1. When are OrderFacade, PricingAdapter, or GreetingPortImpl merely middlemen that add no contract?
    2. Why might an interface with only one implementation still be worth retaining if it represents a database, network, or clock boundary?
    3. Which different problems are addressed by Inline Method, Inline Class, Remove Middle Man, and Collapse Hierarchy?

    ### Evidence-Based, Safe Consolidation

    1. Why should a type used by DI, reflection, plugins, or library clients not be removed without considering compatibility?
    2. How do the boundary cases of 99.999, 100.000, and 100.001 cents safeguard checkout consolidation?
    3. Why do differential tests with 1.000 inputs still need an independent specification oracle to avoid preserving the same bug?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Assessing abstraction value | Examine distinct contracts, I/O boundaries, coupling, and actual client counts before removing abstractions. |
    | Choosing simplifications | Distinguish Inline Class/Method, Remove Middle Man, and Collapse Hierarchy. |
    | Simplifying call flows | Reduce forwarding chains to Checkout → SimplifiedCheckout without losing responsibilities. |
    | Preserving important interfaces | Explain why PaymentGateway, Clock, or Repository should remain when isolating external dependencies. |
    | Checking equivalence | Use contract cases and seeded differential tests to verify fees, totals, and exceptions. |
- id: refactoring-009
  title: Improving Design Incrementally with Safety-Net Tests
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Improving Design Incrementally with Safety-Net Tests**

    This lesson organizes refactoring into small iterations: identify public contracts, add characterization/specification tests, rename or extract methods/classes, run tests, and review diffs after each step. SafeRefactoringDemo compares LegacyCheckout and CheckoutService through pricing results, the VIP threshold of 500.000, shipping threshold of 700.000, exceptions, overflow, and receipts; it also distinguishes refactoring from bug fixes and features.

    ## 2. Questions Learners Should Be Able to Answer

    ### Contracts and Protective Tests

    1. How do refactoring, bug fixes, and feature changes differ in what may be changed?
    2. How do characterization tests help with undocumented legacy code, and why are expected results derived from old code insufficient?
    3. Why do tests asserting how many times a private helper was called often obstruct valid refactoring?

    ### Incremental Process and Boundaries

    1. Which boundary cases detect replacing >= with > at the VIP threshold of 500.000 or shipping threshold of 700.000?
    2. In the Rename → Extract Method → PricingPolicy → ReceiptFormatter → CheckoutService sequence, what must be verified at each step?
    3. When checkout involves a database, gateway, or email, which side effects, transactions, and integration failures must be protected beyond unit tests?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Classifying changes | Distinguish behavior-preserving refactoring from bug fixes and contract changes. |
    | Designing safety-net tests | Document requirements, independent expected results, normal cases, thresholds, invalid inputs, and overflow. |
    | Refactoring in short iterations | Apply each small rename/extract change, then compile, test, and review the diff. |
    | Detecting boundary defects | Use tests at 500.000 and 700.000 to catch differences between >= and >. |
    | Protecting external effects | Describe tests for gateways, repositories, notifications, and integrations involving transactions. |
    | Evaluating contract tests | Avoid coupling tests to private helpers and prioritize public outputs and side effects. |
