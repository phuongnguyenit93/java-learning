version: 1
type: LEARNING_ROADMAP
title: OBJECTS — LESSON CONNECTIONS
roadmapHeading: Learning Path Through the Lessons
roadmap:
- id: object-001
  order: 1
  title: Object Identity, State, and Behavior
  description: Identify an instance by its identity, state, and behavior; use Order to illustrate state changes that preserve identity.
  transition:
    to: object-002
    description: '**From the three aspects of an object → explore the values held by variables and arguments**'
- id: object-002
  order: 2
  title: References, Values, and Passing Objects
  description: Understand reference assignment and Java pass-by-value through state mutation, local reassignment, and swapping.
  transition:
    to: object-003
    description: '**From parameters receiving copies of references → recognize aliasing**'
- id: object-003
  order: 3
  title: Multiple References to the Same Object
  description: Trace aliases through variables, fields, collections, and methods that share a mutable instance.
  transition:
    to: object-004
    description: '**From a shared instance → consider how distinct instances can still be equal in value**'
- id: object-004
  order: 4
  title: Object Identity vs. Value Equality
  description: Compare identity with value equality, implement equals/hashCode correctly, and use hash-based collections safely.
  transition:
    to: object-005
    description: '**From the equality contract → examine whether an object’s state can change**'
- id: object-005
  order: 5
  title: Mutable and Immutable Objects
  description: Distinguish mutation from creating a new value, and design immutability even for nested components.
  transition:
    to: object-006
    description: '**From mutability → decide between shallow and deep copying**'
- id: object-006
  order: 6
  title: Shallow Copying and Deep Copying
  description: Choose the appropriate copy depth for Customer, collections, arrays, cyclic graphs, and identity-sensitive data.
  transition:
    to: object-007
    description: '**From independent copies → analyze intentional state sharing**'
- id: object-007
  order: 7
  title: Object Sharing and the Effects of State Changes
  description: Track how state changes propagate across components, snapshots, and stale references; clarify refresh and synchronization behavior.
  transition:
    to: object-008
    description: '**From shared references → handle references that currently point to no object**'
- id: object-008
  order: 8
  title: Null Values and Missing Objects
  description: Distinguish unassigned local variables, null, empty objects, and not-found results; use Optional with the correct semantics.
  transition:
    to: object-009
    description: '**From objects, aliases, and absence → connect them in a multi-object interaction flow**'
- id: object-009
  order: 9
  title: Tracing Object Interactions in a Scenario
  description: Bring together identity, references, and state in a checkout flow with a sequence diagram and failure branches.
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 | Lesson 9 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Object Identity, State, and Behavior | References, Values, and Passing Objects | Multiple References to the Same Object | Object Identity vs. Value Equality | Mutable and Immutable Objects | Shallow Copying and Deep Copying | Object Sharing and the Effects of State Changes | Null Values and Missing Objects | Tracing Object Interactions in a Scenario |
  | Key question | Which objects exist, and how can they change? | What does Java copy during assignment or when passing an object? | Who holds references to the same object? | Are two references to the same object, or are their objects equal by contract? | Can an instance's state change after initialization? | Which child objects are still shared by a copy? | Where and when do changes to a shared object become visible? | Is there no reference, an empty object, or a data lookup failure? | Who calls whom, and how does state change during checkout? |
  | Value for OOP/the module | Model identity, state, and behavior governed by conditions. | Predict mutation and reassignment accurately. | Recognize mutations propagated through aliases. | Choose suitable comparison and hashing techniques. | Design controlled mutability or safe immutability. | Apply shallow/deep copying according to ownership. | Distinguish live state, snapshots, and the owner responsible for updates. | Avoid NPEs and model absence explicitly. | Trace Cart, Inventory, PaymentGateway, Order, and Notifier. |
  | Mental model developed | View an object as an instance with a lifecycle. | Separate the value of a variable from its referenced object. | Draw a reference graph for each object. | Define equality semantics for entities and value objects. | Consider every path that can mutate an object graph. | Copy the mutable parts of a graph at the required depth. | Trace objects and when their state is read again. | Choose a representation that expresses why a value is absent. | Combine call graphs, logs, state, and exceptions. |
