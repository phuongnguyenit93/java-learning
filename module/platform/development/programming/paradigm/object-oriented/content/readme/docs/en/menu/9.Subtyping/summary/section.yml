version: 1
type: LEARNING_ROADMAP
title: SUBTYPING — LESSON CONNECTIONS
roadmapHeading: Learning Path Through the Lessons
roadmap:
- id: subtyping-001
  order: 1
  title: Distinguishing Code Inheritance from Subtyping
  description: Distinguish implementation reuse from subtype relationships; use NotificationSender, helpers, and AbstractReport to make informed choices among extends, implements, and composition.
  transition:
    to: subtyping-002
    description: '**From distinguishing code reuse and substitutability → examine the practical meaning of an is-a relationship.**'
- id: subtyping-002
  order: 2
  title: Is-A Relationships and Substitutability
  description: Analyze is-a relationships and behavioral substitutability through ShippingPolicy; fees may differ, but every implementation must honor the contract.
  transition:
    to: subtyping-003
    description: '**From substitutability contracts → examine how Java determines subtype relationships from names and type declarations.**'
- id: subtyping-003
  order: 3
  title: Nominal and Structural Type Compatibility
  description: Explain Java's nominal typing and the different rules of structural typing; adapters allow legacy SDKs to participate in explicit contracts.
  transition:
    to: subtyping-004
    description: '**From static type relationships → distinguish reference types from runtime classes that determine execution behavior.**'
- id: subtyping-004
  order: 4
  title: Declared Types and Runtime Object Types
  description: Examine declared types and runtime classes to understand which methods may be called, overriding, overloading, and field and static method hiding.
  transition:
    to: subtyping-005
    description: '**From declared/runtime types → use a subtype through its supertype while retaining the original object.**'
- id: subtyping-005
  order: 5
  title: Upcasting from Subtypes to Supertypes
  description: 'Trace upcasting with Customer/PremiumCustomer and interfaces: one object, multiple type views, and polymorphic use.'
  transition:
    to: subtyping-006
    description: '**From safe upcasting → examine the checks required to access subtype-specific capabilities.**'
- id: subtyping-006
  order: 6
  title: Downcasting and Type Checking
  description: Examine downcasting with instanceof, pattern matching, getClass(), null, and type-erasure limitations to avoid runtime errors.
  transition:
    to: subtyping-007
    description: '**From type conversions → evaluate whether an extended implementation satisfies its requirements.**'
- id: subtyping-007
  order: 7
  title: Preserving Contracts When Extending Types
  description: Apply LSP through the DiscountPolicy contract; verify input domains, results, exceptions, and behavior in extended implementations.
  transition:
    to: subtyping-008
    description: '**From shared contract rules → verify them using the rectangle–square counterexample.**'
- id: subtyping-008
  order: 8
  title: The Rectangle–Square Counterexample
  description: Demonstrate the incorrect behavior of Square extending a mutable Rectangle and redesign the Shape/resize contract to preserve invariants.
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Distinguishing Code Inheritance from Subtyping | Is-A Relationships and Substitutability | Nominal and Structural Type Compatibility | Declared Types and Runtime Object Types | Upcasting from Subtypes to Supertypes | Downcasting and Type Checking | Preserving Contracts When Extending Types | The Rectangle–Square Counterexample |
  | Key question | How does code reuse differ from subtyping? | Can the subtype fulfill the supertype's role? | Does Java require an implements declaration? | How does a variable's type differ from its object's type? | What API capabilities become unavailable when viewed through a supertype? | When is downcasting valid? | Which contract promises must a subtype preserve? | Why can't Square substitute for a mutable Rectangle? |
  | Value for OOP/the module | Choose inheritance or composition for the right reasons | Establish the foundations of LSP and behavioral substitutability | Ensure explicit type relationships and adapter integration | Understand compile-time versus runtime dispatch | Use polymorphism through supertype APIs | Avoid ClassCastException and apply type checks correctly | Extend implementations while preserving business correctness | Recognize violated postconditions in a concrete example |
  | Mental model developed | Move from duplicated code to role relationships | Move from a name-based is-a claim to a contract-based one | Move from matching signatures to type identity | View one variable through its declared type and runtime type | Move from concrete classes to shared contracts | Replace arbitrary casts with capability checks | Move from a valid @Override to verified correctness | Move from geometric intuition to contract tests |
