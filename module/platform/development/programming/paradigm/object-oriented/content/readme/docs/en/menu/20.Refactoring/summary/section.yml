version: 1
type: LEARNING_ROADMAP
title: REFACTORING — LESSON CONNECTIONS
roadmapHeading: Learning Path Connections
roadmap:
- id: refactoring-001
  order: 1
  title: Identifying Signs That Design Needs Improvement
  description: 'Determine when code makes changes costly: a code smell is a reason to investigate, and evidence from actual changes and tests is needed before choosing a technique.'
  transition:
    to: refactoring-002
    description: '**From diagnosing a problem → choosing the smallest transformation: renaming to express intent**'
- id: refactoring-002
  order: 2
  title: Renaming to Clarify Intent
  description: Good names convey actions and units at the point of use. Renaming must preserve monetary amounts and exceptions, while checking names used by frameworks or external APIs.
  transition:
    to: refactoring-003
    description: '**From clear names → extracting steps crowded into one method or class**'
- id: refactoring-003
  order: 3
  title: Extracting Methods and Classes
  description: Extract Method clarifies processing steps; Extract Class separates reasons to change. A checkout example shows that pricing and formatting can evolve independently.
  transition:
    to: refactoring-004
    description: '**From separating responsibilities → placing behavior on the object that owns the data**'
- id: refactoring-004
  order: 4
  title: Moving Behavior to the Responsible Object
  description: Move Method puts line-total calculations in OrderLine, order totals and discounts in Order, and the payment gateway in the service. Responsibility follows information and ownership rules.
  transition:
    to: refactoring-005
    description: '**From moving responsibilities → protecting the data inside the object that now owns them**'
- id: refactoring-005
  order: 5
  title: Encapsulating Fields and Internal Structures
  description: Encapsulate Field and Collection prevent clients from modifying storage structures directly, route all mutations through validated APIs, and protect read snapshots.
  transition:
    to: refactoring-006
    description: '**From encapsulated APIs → replacing type-specific branches with polymorphic behavior when justified**'
- id: refactoring-006
  order: 6
  title: Replacing Type Conditionals with Polymorphism
  description: When type-specific branches recur, DeliveryPolicy dispatches delivery behavior; the service selects a policy and calls a common contract without retaining each type's formula.
  transition:
    to: refactoring-007
    description: '**From selecting polymorphic behavior → reusing collaborators through composition rather than extends**'
- id: refactoring-007
  order: 7
  title: Replacing Inheritance with Composition
  description: Composition replaces inheritance used solely to borrow behavior with collaboration through MessageChannel, allowing Email/SMS substitution and retry wrappers without making AlertService inherit an adapter.
  transition:
    to: refactoring-008
    description: '**From introducing useful abstractions → considering the removal of forwarding layers that add no value**'
- id: refactoring-008
  order: 8
  title: Consolidating or Removing Unnecessary Abstractions
  description: Consolidate redundant middlemen or hierarchies that add no responsibility, while retaining interfaces at database, time, payment, or plugin boundaries with real contracts.
  transition:
    to: refactoring-009
    description: '**From choosing the right structure → safeguarding every refactoring with a protective testing loop**'
- id: refactoring-009
  order: 9
  title: Improving Design Incrementally with Safety-Net Tests
  description: The chapter concludes with small changes backed by safety-net tests that preserve public behavior, exceptions, and side effects; pricing thresholds expose specific regressions.
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 | Lesson 9 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Identifying Signs That Design Needs Improvement | Renaming to Clarify Intent | Extracting Methods and Classes | Moving Behavior to the Responsible Object | Encapsulating Fields and Internal Structures | Replacing Type Conditionals with Polymorphism | Replacing Inheritance with Composition | Consolidating or Removing Unnecessary Abstractions | Improving Design Incrementally with Safety-Net Tests |
  | Key question | Which signs actually indicate maintenance costs? | How should names express intent and contracts accurately? | When should a method or class be extracted to improve cohesion? | Which object should own a behavior? | Which access paths expose and corrupt internal state? | Which type-specific branches should be replaced with polymorphism? | Which relationships should change from extends to collaboration? | Which abstractions are redundant forwarding layers? | How can code be refactored incrementally without changing behavior? |
  | Value for OOP/the module | Classify smells using evidence from changes | Rename to express intent and verify compatibility | Extract pricing and formatting steps while preserving contracts | Assign responsibilities correctly across OrderLine, Order, and CheckoutService | Protect invariants through encapsulation and snapshots | Use DeliveryPolicy strategies and dynamic dispatch | Compose AlertService/MessageChannel with Decorator | Remove middlemen while retaining I/O boundaries | Provide safety-net tests for thresholds, failures, and effects |
  | Mindset developed | Measure costs before changing design | Express purpose at the point of use | Separate by genuine reasons to change | Move rules to the owner of the relevant information | Restrict permission to modify state | Replace repeated conditionals with contracts | Choose has-a when is-a is incorrect | Assess the value of abstractions rather than counting classes | Support every small change with evidence |
