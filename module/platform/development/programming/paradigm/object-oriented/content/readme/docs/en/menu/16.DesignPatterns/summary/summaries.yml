summaries:
- id: design-patterns-001
  title: 'Design Patterns: Problems, Context, and Trade-offs'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Design Patterns: Problems, Context, and Trade-offs**

    Recognize design patterns as context-dependent solutions, not a list of names or mandatory rules. Through a checkout module with discount policies, this lesson shows how to compare switch with Strategy based on actual variations, contracts, indirection costs, testing, and documented design decisions rather than adopting patterns by slogan.

    ## 2. Questions Learners Should Be Able to Answer

    ### Problems and Selection Criteria

    1. How does a Design Pattern differ from a library or reusable code snippet, and why should the problem be described before a pattern is chosen?
    2. Which changes, contract constraints, frequency of variation, and organizational costs determine whether a pattern is appropriate?
    3. Given three stable discount policies, when is a centralized switch sufficient, and when is Strategy worth using?

    ### Comparing Solutions and Verifying Them

    1. Why can choosing a pattern reduce coupling while increasing indirection, wiring costs, and debugging difficulty?
    2. How do Adapter and Decorator differ in practical intent, and how does Factory Method differ from a static factory?
    3. How should an ADR and a set of discount contract tests record decisions, outcomes, limitations, and conditions for reconsideration?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | State the problem | Describe the problem of selecting a discount algorithm based on expected changes and success conditions, without starting with a pattern name. |
    | Compare alternatives | Compare switch and Strategy in terms of change points, number of abstractions, tests, and tracing. |
    | Distinguish intentions | Choose Adapter, Decorator, Strategy, or a factory according to the change that needs to be addressed. |
    | Check contracts | Propose tests for nonnegative discounts, discounts that do not exceed the subtotal, and invalid variants. |
    | Record decisions | Write a brief ADR stating the context, options, trade-offs, and conditions for reconsideration. |
- id: design-patterns-002
  title: Factory Method and Abstract Factory
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Factory Method and Abstract Factory**

    Distinguish two approaches to separating product creation from the code that uses products. Factory Method places the creation point for one product type in a Creator for subclasses to override; Abstract Factory supplies a related product family, such as Button and Checkbox for the same theme. The lesson also clarifies differences from simple/static factories and dependency injection, and how to manage lifecycles and creation failures.

    ## 2. Questions Learners Should Be Able to Answer

    ### Two Object-Creation Structures

    1. How do Creator, Concrete Creator, and Product collaborate when EmailCampaign or SmsCampaign overrides createSender()?
    2. How does Abstract Factory produce matching Button and Checkbox components for Light/Dark UI through interfaces and concrete factories?
    3. How do Factory Method and Abstract Factory differ in their extension mechanisms, number of product types, and inheritance/composition relationships?

    ### Application, Contracts, and Trade-offs

    1. Why is static Sender create(Channel) a simple factory rather than the GoF Factory Method pattern?
    2. Which parts of Abstract Factory must change when adding a new theme versus a new UI component type?
    3. At which boundaries should object-creation failures, null, lifecycles, and product-family consistency tests be handled?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Recognize Factory Method | Identify how Creator owns the sending workflow and subclasses override the Sender creation point in the campaign example. |
    | Build an Abstract Factory | Sketch a UiFactory that creates two products for the same theme without exposing concrete classes to clients. |
    | Classify factories | Compare simple factories, static factories, GoF Factory Method, and Abstract Factory with DI. |
    | Analyze extension costs | Predict the cost of adding a new Light/Dark family and a new UI Product type. |
    | Verify contracts | Describe tests using fake products for Creator and tests ensuring concrete factories produce consistent product families. |
- id: design-patterns-003
  title: Builder and Complex Object Creation
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Builder and Complex Object Creation**

    Master the process of creating an Order with many options and constraints using a fluent Builder. Learners see how to declare required fields, validate before and at build(), apply defaults, protect data using BigDecimal/List.copyOf, and consider constructors, records, static factories, or staged builders when appropriate.

    ## 2. Questions Learners Should Be Able to Answer

    ### Builders and Initialization State

    1. Why do constructors with many parameters and sequences of setter calls make constraints difficult to express for an Order with many options?
    2. What sequence does a fluent Builder provide for supplying required fields, adding line items, and calling build()?
    3. When should individual values be validated during configuration, and when should cross-field invariants and completeness be checked?

    ### Invariants, Alternatives, and Testing

    1. Why can a mutable Builder still create an immutable Order, and how does List.copyOf prevent aliasing after build()?
    2. How do fluent Builders, staged Builders, and Directors differ in complexity and sequence requirements?
    3. Which default and error cases should be tested for a ReportConfig supporting CSV/PDF with chart-count limits and date ranges?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Design object-creation APIs | Write a clear Order.builder(required...).addItem(...).build() flow that communicates each field's meaning. |
    | Protect invariants | Distinguish per-step validation from cross-field validation at build() so incomplete products cannot be created. |
    | Verify defensive copies | Show that modifying the Builder or original list after build does not change the created Order's item list. |
    | Choose creation techniques | Explain when a record/constructor is sufficient and when a staged Builder or Director is genuinely useful. |
    | Design tests | Create tests for required fields, defaults, BigDecimal, invalid combinations, and Builder reuse. |
- id: design-patterns-004
  title: Singleton and the Risks of Shared State
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Singleton and the Risks of Shared State**

    Understand that Singleton controls instance count and access points within a particular scope; it does not automatically make an object thread-safe. Using a static holder, enum counter, AtomicLong, and Spring beans, the lesson distinguishes initialization, operation synchronization, request scopes, dependency injection, and resource lifecycles.

    ## 2. Questions Learners Should Be Able to Answer

    ### Instance Scope and Concurrency Safety

    1. How do the scopes of one instance in a static Singleton, per class loader, a Spring singleton bean, and an entire application cluster differ?
    2. Why do a holder or enum support safe initialization without making mutable currentOrder or total++ thread-safe?
    3. With two concurrent requests, how can storing user/order/amount in singleton fields cause incorrect interleaving?

    ### Alternative Designs and Guarantees

    1. When are AtomicLong, ConcurrentHashMap, or locks appropriate for shared data, and why do they still not replace transactions?
    2. How does constructor injection with a fake MailClient eliminate the hidden getInstance() dependency in unit tests?
    3. Why doesn't injecting a prototype ShoppingCart into a singleton bean automatically create a new cart for every HTTP request?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Identify scopes | Describe instance scope for Java class loaders, IoC containers, processes, and distributed systems without assuming a globally unique object. |
    | Simulate races | Trace two requests that leak or corrupt currentUser and currentOrder state in a shared service. |
    | Fix state ownership | Move request data into parameters/local variables and choose dependencies with the correct scope. |
    | Choose synchronization | Distinguish AtomicLong protecting an increment from multistep invariants requiring locks or transactions. |
    | Improve testability | Replace global getInstance access with constructor injection, isolated tests, and lifecycle management. |
- id: design-patterns-005
  title: Adapter and Integrating Different Interfaces
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Adapter and Integrating Different Interfaces**

    Understand Adapter as a boundary between the application's PaymentGateway and an incompatible LegacyPaymentSdk, not merely a method renamer. The lesson uses exact BigDecimal USD → long cents conversion, maps approved/declined statuses, distinguishes timeouts with unknown outcomes, and warns that retrying payments can create duplicate transactions.

    ## 2. Questions Learners Should Be Able to Answer

    ### Target Contracts and SDK Mapping

    1. What roles do Target, Adapter, Adaptee, and Client play in the CheckoutService → PaymentGateway → LegacyPaymentApi flow?
    2. Why is converting 12.34 USD to 1234 cents with movePointRight(2).longValueExact() safer than using double and casting to long?
    3. When the legacy system returns code "00" or "05", how should Adapter translate it into a PaymentReceipt with business meaning?

    ### Failures and Integration Design

    1. Why must a payment timeout not automatically be treated as DECLINED or retried unconditionally?
    2. How does an Object Adapter using composition differ from an inheritance-based Class Adapter in swapping SDKs and testing with fakes?
    3. How does Adapter differ in intent from Facade and Decorator, and what contracts are needed for pending outcomes and erroneous responses?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Diagram the conversion flow | Describe Target PaymentGateway, the SDK Adaptee, and data/status conversion in LegacyPaymentAdapter. |
    | Verify monetary accuracy | Predict the 12.34 USD→1234 cents conversion and reject amounts that cannot be represented as whole cents. |
    | Distinguish failures | Design approved/declined/unknown outcomes for SDK response codes and timeouts. |
    | Reduce vendor coupling | Explain why CheckoutService should depend on PaymentGateway rather than receiving LegacyReply. |
    | Verify integration | Design a fake LegacyPaymentApi and test mappings, failures, timeouts, idempotency, and reconciliation. |
- id: design-patterns-006
  title: Decorator and Adding Behavior
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Decorator and Adding Behavior**

    Explore how one MessageChannel can wrap another under the same contract to add prefixes, length limits, and call counts without modifying ConsoleChannel. The lesson emphasizes wrapper order, the definition of a successful send, exceptions, and choosing decorators versus proxies, inheritance, or simple helpers.

    ## 2. Questions Learners Should Be Able to Answer

    ### Structure and Composition

    1. How are Component, Concrete Component, base Decorator, and Concrete Decorator identified in the MessageChannel design?
    2. How can PrefixDecorator or CountingDecorator retain the same interface and delegate send()?
    3. Why is BufferedInputStream wrapping InputStream a clear example of adding behavior while clients still call read()?

    ### Order, Contracts, and Limitations

    1. When PrefixDecorator is placed before or after LengthLimitDecorator with a 12-code-point limit, why can some strings be accepted even when the result exceeds that limit?
    2. When CountingDecorator increments its counter only after the delegate returns normally, what does it count, and what does that not prove about delivery?
    3. Why doesn't AtomicInteger automatically make an entire decorator chain thread-safe, and when are multiple wrappers not worth creating?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Read wrapper structures | Identify each MessageChannel delegate and preserve the send() contract across wrappers. |
    | Predict ordering effects | Simulate both Prefix/LengthLimit orders to identify which message length is checked. |
    | Test each layer independently | Create a fake channel and observe delegation, prefixes, length-limit failures, and the count after success. |
    | Distinguish patterns | Explain how Decorator differs from Adapter, Proxy, and inheritance in adding behavior under the same interface. |
    | Evaluate costs | Prefer a helper or fewer wrappers when a chain makes call paths hard to trace and order-dependent. |
- id: design-patterns-007
  title: Facade and Simplifying Client Usage
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Facade and Simplifying Client Usage**

    Learn to create a high-level entry point for the quoting use case instead of having multiple clients combine Catalog, Inventory, Discount, and Shipping themselves. The lesson explains that Facade hides the sequence but does not eliminate underlying complexity, automatically provide distributed transactions, or reduce latency, and that both results and failure paths require testing.

    ## 2. Questions Learners Should Be Able to Answer

    ### Facade Boundaries

    1. Why does a controller calling Catalog, Inventory, Discount, and Shipping in sequence cause coupling and repeated orchestration?
    2. Which steps can Facade quote(sku, quantity, member) hide while keeping Catalog/Inventory responsibilities separate?
    3. If shipping is free when the post-discount merchandise total reaches a threshold, why must the calculation order be part of the contract?

    ### Limitations and Verification

    1. Why is a quote that checks inventory not the same as a reservation/order and unable to guarantee inventory availability at actual order placement?
    2. How does Facade differ from Adapter, Decorator, and an application service in purpose and boundaries?
    3. How can the benefits of a simplified API be offset by a God Facade, latency, and transaction inconsistencies?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Design use-case APIs | Propose CheckoutFacade.quote that accepts sufficient input and returns Quote without exposing subsystem APIs. |
    | Analyze step sequences | Trace product lookup, inventory verification, discounts, and shipping calculations in the quoting flow. |
    | Distinguish boundaries | Explain why quoting neither reserves stock nor resolves consistency issues among competing requests. |
    | Compare patterns | Compare Facade with Adapter/Decorator and explain its distinct intent to simplify APIs. |
    | Test results | Describe tests for members, nonmembers, invalid SKUs, out-of-stock products, discounts, and correct shipping fees. |
- id: design-patterns-008
  title: Strategy and Interchangeable Algorithms
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Strategy and Interchangeable Algorithms**

    Practice replacing discount-calculation algorithms with objects sharing the DiscountStrategy contract, used by Checkout through composition. The lesson progresses from conditional branches, interfaces, concrete strategies, and lambdas to contract tests, selection at the composition root, a two-decimal-place limit for BigDecimal, and controlled strategy selection from user input.

    ## 2. Questions Learners Should Be Able to Answer

    ### Roles and Variation Points

    1. How do Context, the Strategy interface, and Concrete Strategies collaborate so Checkout does not depend on each individual discount policy?
    2. Why does composition allow different DiscountStrategy implementations to be selected when Checkout is created or switched at runtime?
    3. When can a lambda serve as a Strategy, and which complex algorithms warrant a separate class?

    ### Contracts and Safe Selection

    1. Which conditions regarding subtotal, discount, and BigDecimal scale must DiscountStrategy guarantee?
    2. Why can switching strategies through a setter on a singleton serving many requests cause races between orders?
    3. When a policy key comes from HTTP, why should it be mapped only to a registry of registered strategies instead of using reflection on arbitrary classes?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Build the structure | Diagram Checkout → DiscountStrategy → concrete strategies and describe dependency direction. |
    | Swap variants | Demonstrate injecting a different policy into Context without changing checkout algorithms. |
    | Check contracts | Design contract tests ensuring discounts are nonnegative, do not exceed subtotals, and have the correct two-decimal-place representation. |
    | Use lambdas appropriately | Explain when a functional-interface Strategy can be implemented with a lambda for short operations. |
    | Evaluate concurrency and configuration | Choose immutable per-request strategies and a bounded registry when external input determines the variant. |
- id: design-patterns-009
  title: State and State-Dependent Behavior
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **State and State-Dependent Behavior**

    Move order lifecycle behavior from scattered conditional branches into State objects with explicit transition rules. The lesson covers Context Order, OrderState, CREATED/PAID/SHIPPED/CANCELLED states, testing a state × operation matrix, limiting public setStatus access, and the boundaries of state persistence, transactions, and concurrency.

    ## 2. Questions Learners Should Be Able to Answer

    ### States, Commands, and Transitions

    1. How do CREATED, PAID, SHIPPED, and CANCELLED states differ from confirmPayment(), markShipped(), cancel(), and guards?
    2. How does Context Order delegate to OrderState, and why is private state preferable to public setStatus()?
    3. What happens when cancel() is called from PAID or markShipped() from CREATED in OrderStateDemo?

    ### Choosing State and Preserving Business Rules

    1. How does State differ from Strategy in what drives behavior changes and in state transitions?
    2. When is a short enum + switch sufficient, and when do numerous rules/transitions make State Pattern worthwhile?
    3. What inconsistencies can concurrent confirm/cancel requests or publishing events before DB commit cause, and what must the test matrix cover?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Model state machines | Draw a CREATED/PAID/SHIPPED/CANCELLED table showing valid and rejected operations. |
    | Design boundaries | Use Order command methods and keep state transitions inside valid Context/State logic. |
    | Predict outcomes | Trace CREATED→PAID→SHIPPED and invalid-operation failures without changing state arbitrarily. |
    | Test lifecycles | Design tests for valid transitions and every invalid branch in the matrix. |
    | Evaluate consistency | Explain the need for optimistic locking and transaction/outbox mechanisms when states involve persistent data and events. |
- id: design-patterns-010
  title: Observer and Change Notifications
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Observer and Change Notifications**

    This lesson models Publisher–Listener relationships using immutable OrderStatusChanged events, subscribe/unsubscribe operations, and multiple secondary reactions to order-state changes. Learners examine publication timing, avoiding events when nothing changes, listener failures, memory leaks, reentrancy, synchronous versus asynchronous dispatch, and transaction/outbox boundaries when extending to a message broker.

    ## 2. Questions Learners Should Be Able to Answer

    ### Publication Flow and Listener Relationships

    1. What roles do Subject, Listener, Event payload, and Subscription play when OrderService transitions from CREATED→PAID?
    2. Why should an event include oldStatus/newStatus and not be published when the state remains unchanged?
    3. How do Push and Pull models differ in coupling and the risk of reading state that has since changed again?

    ### Failures, Lifecycles, and Persistent Data

    1. Why can failing to unsubscribe a listener retained by Subject through a strong reference cause a memory leak?
    2. Why aren't Observer callbacks asynchronous by default, and how can dispatch ordering and reentrancy cause incorrect event handling?
    3. Why do publishing before DB commit or retrying through a broker require an outbox, eventId, and idempotent handling?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Design event contracts | Propose OrderStatusChanged carrying order IDs, old/new statuses, and minimal data, with no publication for no-op changes. |
    | Manage subscriptions | Explain how subscribe returns a handle for close/unsubscribe to prevent duplicate callbacks and long-lived references. |
    | Predict dispatch | Analyze callback order, listener errors, reentrant emission, and the effects of slow handlers. |
    | Distinguish event flows | Compare synchronous in-JVM Observer, event buses, and broker-based pub/sub. |
    | Check consistency | Propose contract tests and explain publication timing, outbox, duplicate eventId values, and idempotent consumers. |
- id: design-patterns-011
  title: Template Method and Algorithm Skeletons
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Template Method and Algorithm Skeletons**

    Analyze the fixed generate() skeleton in SalesReportTemplate and the variable header(), row(), and footer() steps for Text/Markdown reports. The lesson distinguishes final methods, primitive operations, and optional hooks, and covers step-order checks and inheritance risks when calling overrides from constructors or introducing too many extension points.

    ## 2. Questions Learners Should Be Able to Answer

    ### Fixed and Customizable Steps

    1. How does Template Method preserve validate→calculateTotal→render ordering when subclasses supply different formats?
    2. How do shared steps, protected abstract primitive operations, and optional hooks differ in responsibilities and overriding?
    3. Why can generate() be declared final to prevent subclasses from rewriting the entire workflow?

    ### Inheritance Limitations and Verification

    1. Why can calling overridable configure() from a superclass constructor encounter uninitialized subclass fields?
    2. With multiple variation dimensions such as format, language, and output channel, why can Strategy/composition reduce subclass proliferation?
    3. Which contract tests verify step order, default hooks, total revenue, and unchanged input data?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Identify algorithm skeletons | Identify generate() and the fixed, abstract, and hook steps in SalesReportTemplate. |
    | Predict dispatch | Explain how Text and Markdown subclasses override formatting without changing the overall sequence. |
    | Protect invariants | Propose a final template, immutable data, and avoidance of hook calls from incomplete constructors. |
    | Compare mechanisms | Contrast Template Method inheritance with Strategy composition and Factory Method creation points. |
    | Test workflows | Describe tests for step order and outcomes of subclasses with and without optional hooks. |
- id: design-patterns-012
  title: Command and Encapsulating Requests
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Command and Encapsulating Requests**

    Understand how turning a request into an object decouples the caller (UI, keyboard shortcut, or scheduler) from the executing TaskBoard. Examples using AddTaskCommand, CompleteTaskCommand, and CommandManager clarify Receiver/Invoker roles, saving state before changes, undo/redo stacks, failure handling, and the limitations of commands with effects outside the process.

    ## 2. Questions Learners Should Be Able to Answer

    ### Roles and Command Management

    1. How do Command, Concrete Command, Receiver, and Invoker differ in TaskBoard and CommandManager?
    2. Why must AddTaskCommand remember the added task's ID while CompleteTaskCommand saves its previous done value?
    3. When must UndoStack and RedoStack change so a failed operation does not destroy history?

    ### Correctness and Boundaries

    1. How does undoing a real email or payment operation differ from reverting an in-memory field?
    2. Which parameters, state, and versions must a Command store so replay/redo does not cause incorrect side effects after its Receiver changes?
    3. When is Runnable/lambda sufficient, and when do command objects with identity, history, queues, or retries add real value?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Distinguish roles | Diagram the Invoker→Command→Receiver flow and explain why UI code does not own business logic. |
    | Simulate undo/redo | Trace AddTask and CompleteTask to restore the exact state preceding an operation. |
    | Manage history | Analyze when to push/pop undo/redo stacks after successful execute, undo, or redo operations. |
    | Limit side effects | Explain why network commands need idempotency, transactions, or compensation and cannot be undone merely by reversing fields. |
    | Evaluate patterns | Choose Command or Runnable/lambda based on history, auditing, queueing, and class-cost requirements. |
- id: design-patterns-013
  title: When Design Patterns Add Unnecessary Complexity
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **When Design Patterns Add Unnecessary Complexity**

    Reinforce how to avoid premature abstraction through an example with three fixed shipping fees. The lesson compares a simple enum with Strategy+Factory+Registry, identifies cognitive, testing, DI, and debugging costs, and describes evidence of genuine change requirements, YAGNI/KISS/DRY, preserving useful ports, and safely reducing classes through behavior-based tests.

    ## 2. Questions Learners Should Be Able to Answer

    ### Evaluating the Value of Abstractions

    1. Why don't three fixed STANDARD/EXPRESS/PRIORITY fees yet justify Strategy, Factory, and a pass-through Facade?
    2. What cognitive, navigation, maintenance, and testing costs arise when one request must pass through many wrapper layers?
    3. What do YAGNI, KISS, DRY, and the Rule of Three suggest when there are not yet many real variants?

    ### Requirement Changes and Safe Refactoring

    1. When EXPRESS starts charging an additional 8000 VND/kg and multiple teams work on algorithms, what evidence supports using Strategy?
    2. Why can an interface with just one implementation, such as PaymentGateway, still be a necessary infrastructure boundary?
    3. When removing a God Factory or pass-through classes, which contract tests and compatibility checks are needed to avoid breaking clients?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Evaluate overengineering | Identify unnecessary Factory/Strategy/Facade classes in a quoting design with three fixed fees. |
    | Design only what is needed | Propose an enum or simple configuration for a stable fee table, with validation and tests. |
    | Recognize when to separate behavior | Explain when variants become independent algorithms so Strategy's benefits outweigh its costs. |
    | Preserve useful boundaries | Distinguish a PaymentGateway adapter/port that protects the business domain from a valueless pass-through interface. |
    | Plan refactoring | Design steps to reduce indirection with tests preserving outputs, errors, side effects, APIs, and concurrency. |
