summaries:
- id: modeling-001
  title: Gathering Use Cases and Business Rules
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Gathering Use Cases and Business Rules**

    Turn a user story about course enrollment into a **use case** with an actor, trigger, main and exception flows, preconditions, and postconditions; express **business rules** with BR-IDs and verifiable scenarios. Then identify invariants and rule owners before designing Java APIs, while distinguishing illustrative assumptions from actual policies approved by stakeholders.

    ## 2. Questions Learners Should Be Able to Answer

    ### Discovering and Validating Requirements

    1. Why is the requirement “students enroll in courses” insufficient to determine classes and methods, and what additional business conditions must be clarified?
    2. How do use cases, business rules, non-functional requirements, and technical constraints differ in the questions they answer?
    3. Why must actors, system boundaries, rule owners, and authoritative data sources be identified before sketching a domain model?

    ### Flows, Invariants, and Verification

    1. For UC-01, how is each rule from BR-01 through BR-06 reflected in rejection flows that leave state unchanged?
    2. Why might duplicate enrollment and retrying the same request require two different policies?
    3. When two requests compete for capacity, how does `synchronized` within one JVM differ from transactions and unique constraints across multiple nodes?
    4. How do a BR → class/API → acceptance test matrix and Given–When–Then scenarios reveal requirements that lack verification?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Specifying use cases | Write a course-enrollment use case with an actor, preconditions, a happy path, at least three exception paths, and postconditions for failure. |
    | Formalizing business rules | Assign BR-IDs, owners, conditions, and concrete counterexamples for active/prerequisite/duplicate/capacity rules. |
    | Tracing rules | Map every BR to the `Course.enroll` method, persistence, and Given–When–Then scenarios or JUnit tests. |
    | Evaluating consistency boundaries | Explain why a single `if` check cannot prove atomicity when requests compete for the same capacity. |
- id: modeling-002
  title: Identifying Objects from Requirements
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Identifying Objects from Requirements**

    Derive **candidate objects** from a book-borrowing description by examining nouns, verbs, and constraints, then evaluate them by identity, responsibility, and lifecycle. The lesson explains why `BookTitle`, `BookCopy`, and `Loan` must be distinguished, while assigning the appropriate roles to entities, value objects, domain policies, coordinating services, repositories, and DTOs.

    ## 2. Questions Learners Should Be Able to Answer

    ### Deriving Objects from Requirements

    1. Why does each noun such as “book” or “borrow date,” or verb such as “check,” not automatically warrant its own class?
    2. For a book title, physical copy, and loan, which identity, lifecycle, and history considerations justify keeping them separate?
    3. How can entities be distinguished from value objects, policies from application services, and actors from domain objects?

    ### Defining Relationships and Testing the Model

    1. How does the historical multiplicity between `BookCopy` and `Loan` differ from the invariant allowing at most one active Loan?
    2. Why does `LoanPolicy` calculate due dates, `BorrowingService` coordinate the process, and `LoanRepository` store and load data?
    3. When adding reservations, renewals, or repair histories, what conditions indicate the need for a new class rather than another field?
    4. Which concurrency risks cannot be handled automatically by an in-memory demo?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Building a justified candidate list | Extract concepts, attributes, behaviors, and constraints and explain why each candidate is retained or rejected. |
    | Classifying domain roles | Select entities, value objects, policies, services, and repositories/ports for the library scenario. |
    | Drawing meaningful relationships | Distinguish `BookTitle`, `BookCopy`, and `Loan`, documenting historical multiplicity separately from the active-loan invariant. |
    | Testing requirement changes | Simulate borrowing and returning flows, analyze the addition of Reservation or Renewal, and update the model accordingly. |
- id: modeling-003
  title: Assigning Responsibilities and Collaborators
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Assigning Responsibilities and Collaborators**

    Assign **knowing/doing responsibilities** to the objects that own the relevant information or invariants and identify the collaborators they need. Through `Member`, `BookCopy`, `Loan`, and `LendingService`, learners distinguish local entity rules from multi-object processes coordinated by services, while understanding low coupling, high cohesion, and transaction boundaries.

    ## 2. Questions Learners Should Be Able to Answer

    ### Assigning Responsibilities to the Right Objects

    1. Why is the borrowing limit the responsibility of `Member`, availability the responsibility of `BookCopy`, and closing a loan the responsibility of `Loan`?
    2. What is wrong with a service reading fields and modifying `Member` through setters instead of calling `recordBorrow()`?
    3. What design decisions follow from the questions raised by Information Expert, Controller, Low Coupling, and High Cohesion?

    ### Collaboration and Consistency

    1. Which calls must `LendingService.lend` coordinate, and in what order, to avoid changing state when input is invalid?
    2. When a rule spans multiple aggregates, should it be placed in a domain policy/service or forced into one entity, and on what basis?
    3. Why do separate methods changing Member and BookCopy state not guarantee atomicity, and which risks do DB transactions and idempotency address?
    4. Should replacing the notification tool or storage system require changing a domain class, and which collaboration points prevent that?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Assigning responsibilities | Identify the owners of borrowing quotas, availability, loan records, and orchestration without duplicating rules. |
    | Designing meaningful messages | Propose APIs such as `ensureCanBorrow`, `recordBorrow`, `markBorrowed`, and `close` instead of direct setters. |
    | Evaluating coupling and cohesion | Detect God Objects, `get...get...set` chains, and infrastructure dependencies leaking into the domain. |
    | Analyzing transactions | Identify inconsistency risks when updating multiple entities and choose an appropriate transaction boundary. |
- id: modeling-004
  title: 'CRC Cards: Classes, Responsibilities, and Collaborators'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **CRC Cards: Classes, Responsibilities, and Collaborators**

    Use **CRC cards (Class–Responsibilities–Collaborators)** to role-play workshop registration scenarios and determine each class's business responsibilities and collaborators. The lesson focuses on card templates, rehearsing success and failure flows, translating obligations into APIs/UML/tests, and updating cards when waitlists or payments are introduced.

    ## 2. Questions Learners Should Be Able to Answer

    ### Writing Cards and Rehearsing Scenarios

    1. What do the three sections of a CRC card express, and why should responsibilities describe obligations rather than merely list getters and setters?
    2. Why do `Student`, `Workshop`, `Enrollment`, `RegistrationService`, `WorkshopRepository`, and `RegistrationNotifier` have different collaborators?
    3. When role-playing duplicate registration or a full workshop, which card makes the final decision, and which calls must be skipped?

    ### From Cards to Design and Change

    1. How can CRC cards be translated into class diagrams, `Workshop.enroll`, `withdraw`, and responsibility-based tests?
    2. Where do time-ordered waitlists, payments, or scheduling conflicts require additional responsibilities or collaborators?
    3. Why do CRC cards alone not prove transaction correctness, concurrency safety, idempotency, or caller authorization?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Creating meaningful CRC cards | Create separate Class/Responsibilities/Collaborators cards for at least four workshop-registration roles. |
    | Rehearsing scenarios | Explain call sequences for success, duplicates, full capacity, and withdrawal, including where execution stops after failure. |
    | Detecting misplaced responsibilities | Identify rules duplicated between services and entities or domain logic depending on SQL/SMTP. |
    | Connecting to implementation | Map responsibilities to Java methods and tests that verify remaining capacity or the absence of notifications after rejection. |
- id: modeling-005
  title: 'Class Diagrams: Members and Relationships'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Class Diagrams: Members and Relationships**

    Read, design, and validate **UML class diagrams** at the domain or implementation level: class names, fields, operations, visibility, multiplicities, association directions, associations, aggregations, compositions, inheritance, realizations, and dependencies. Through `Order`–`OrderLine`–`Customer`–`Product`, learners connect UML notation to Java and explain where invariants must be enforced through code and tests.

    ## 2. Questions Learners Should Be Able to Answer

    ### Member and Relationship Notation

    1. How do the UML symbols `+`, `-`, `#`, and `~`, attribute and operation types, and static notation differ from Java declarations?
    2. How do association, aggregation, composition, generalization, realization, and dependency differ in ownership, lifecycle, and usage?
    3. Why does `Order` own `OrderLine` through composition but merely associate with `Customer` and `Product`?
    4. On which ends should diamonds, hollow triangles, and dependency arrows appear, and what do they mean?

    ### Multiplicity, Code, and Diagram Limitations

    1. How are the multiplicities `0..*`, `1`, and `0..1` read from the opposite end, and does a Java `List` enforce multiplicity automatically?
    2. Why is `new B()` or a field referencing B insufficient to conclude that A composes B?
    3. How do realization/dependency lines connect the `PaymentGateway` interface to its implementation and `CheckoutService`?
    4. When a diagram promises valid order states, what must code and tests enforce that UML cannot enforce by itself?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Interpreting UML | Read visibility, attributes, operations, association roles/multiplicities, and relationship line types accurately. |
    | Translating UML to Java | Sketch `Order`/`OrderLine` and add/confirm APIs according to the correct ownership relationships. |
    | Distinguishing relationships | Justify composition for OrderLine and association for Product/Customer based on lifecycle. |
    | Reviewing model invariants | Identify incorrect multiplicities or ownership and explain how to verify them with constructors, APIs, tests, and constraints. |
- id: modeling-006
  title: 'Object Diagrams: Instances at a Point in Time'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Object Diagrams: Instances at a Point in Time**

    Understand a **UML Object Diagram** as a snapshot of instances, slot values, and links at a specific moment, unlike a class diagram describing types and relationships across many objects. Through `Order`–`OrderItem`–`Product`–`Customer`, learners describe t0/t1, aliasing, and multiple links to the same instance.

    ## 2. Questions Learners Should Be Able to Answer

    ### Reading a Concrete Snapshot

    1. How do `o01:Order` and `code = "O-001"` differ in meaning from `Order` and `code: String`?
    2. Why does a t0 snapshot containing one item not mean that the Order class can have only one item?
    3. What data do links among `o01`, `i01`, `p01`, and `c01` represent, and are the illustrative Mermaid arrows method calls?

    ### Comparing Moments and Identities

    1. After adding `i02`, which object and link are new, and which objects remain unchanged at t1?
    2. Why do two orders referencing the same `c01` require one Customer box and two links, while two objects both named Lan require separate boxes?
    3. To verify that a snapshot satisfies multiplicities and invariants, how can we determine which links were omitted from the diagram and check the model in code/tests?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Reading object graphs | Correctly identify object identities, slot values, and links in t0/t1 snapshots. |
    | Drawing evidence-based snapshots | Draw the same order before and after addItem with the correct number of instances and reference links. |
    | Detecting aliases | Explain how `==` for two references to one instance differs from two objects with equal values. |
    | Verifying snapshots | Identify states that may violate a fully specified multiplicity and write corresponding assertions. |
- id: modeling-007
  title: 'Sequence Diagrams: Interaction Order'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Sequence Diagrams: Interaction Order**

    Use **UML Sequence Diagrams** to describe message ordering among actors, endpoints, services, repositories, policies, and domain objects in a book-borrowing use case. The lesson covers lifelines, activations, calls/returns, `alt`/`opt`/`loop`/`par`, failure branches, and side effects such as `save()` that must occur after validation.

    ## 2. Questions Learners Should Be Able to Answer

    ### Reading and Drawing Interactions

    1. What do the horizontal and vertical axes, lifelines, activations, call messages, and return messages represent; does vertical spacing indicate actual elapsed time?
    2. What distinguishes the `alt` alternative, `opt` optional, `loop` repetition, and `par` parallel fragments?
    3. In the book-borrowing use case, which responsibilities are addressed by the sequence `isOnLoan`, `countActive`, `ensureEligible`, `dueDate`, creating `Loan`, and `save`?

    ### Failure Branches and Synchronization

    1. When a book copy is already on loan or a member has reached the borrowing limit, which messages must no longer be sent?
    2. Why does an asynchronous arrow or a `critical` fragment on a diagram not create a queue or DB transaction by itself?
    3. If `save` occurs before `ensureEligible` or `notifySuccess` before `charge`, which consequences must be investigated?
    4. Which contractually significant call orders can a spy repository verify without depending on the entire implementation?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Reading sequence diagrams | Identify actors, participants, messages, returns, activations, and control fragments. |
    | Drawing both flows | Describe a success branch and at least two rejection branches that never call `save()`. |
    | Comparing with Java | Match the order of calls in `BorrowService.borrow()` to the order of arrows. |
    | Checking side effects | Design spies/assertions to verify that persistence and notifications do not occur before the rules are satisfied. |
- id: modeling-008
  title: 'State Diagrams: Valid State Transitions'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **State Diagrams: Valid State Transitions**

    Model an object's lifecycle using **state**, **event**, **guard**, **transition**, and **effect** rather than allowing callers to assign `status` arbitrarily. The lesson uses an order progressing from `DRAFT` to `DELIVERED` or `CANCELLED`, a transition table, Java enums + RULES, guards on payment amounts and tracking numbers, and checks that failures leave state unchanged.

    ## 2. Questions Learners Should Be Able to Answer

    ### State Machines and State Transitions

    1. How do state, event, guard, effect, and transition play different roles in the `PACKING --SHIP--> SHIPPED` edge?
    2. Why can `DRAFT` be canceled while `PAID` cannot be canceled by the same event in this example?
    3. What do initial/final state symbols mean, and why does a final state not mean deleting the object from RAM or a database?
    4. When no transition exists or a guard fails, how should the API respond without changing state or history?

    ### Implementation and Verification

    1. Why should `Order.submit`, `confirmPayment`, and `ship` be named methods instead of exposing a `setStatus` setter?
    2. Where do duplicate payment callbacks, two competing SHIP requests, and post-commit emails require idempotency, optimistic locking, or an outbox?
    3. When payment and shipping states are relatively independent, why can a combined enum grow excessively, and which cross-dimensional constraints must be considered?
    4. Which valid transitions, failing guards, and forbidden events should state-transition tests cover?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Building state machines | Draw initial/final states, events, guards, and effects for the Order workflow. |
    | Defining transition tables | List valid edges and reject state/event pairs absent from the table. |
    | Designing safe updates | Validate payment/tracking information before changing state and preserve history after failures. |
    | Verifying lifecycles | Propose positive/negative transition tests and explain concurrency/idempotency safeguards needed in persistence. |
- id: modeling-009
  title: Validating Models Against Code and Real-World Scenarios
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Validating Models Against Code and Real-World Scenarios**

    Verify **in both directions** from use cases/business rules to UML, Java APIs, tests, and operational data, and from code/tests back to detect model drift. Using a `BookCopy` lending/returning library scenario, the lesson traces BR-01…BR-07, distinguishes historical Loans from active Loans, and verifies the limits of 3 loans, 14 days, one-time returns, and concurrent contention.

    ## 2. Questions Learners Should Be Able to Answer

    ### Validating Models Against Business Requirements

    1. Why does the `BookCopy 1 -- 0..* Loan` association represent history without guaranteeing at most one active Loan?
    2. What mismatches arise from using ISBN instead of copy ID, counting all Loans instead of active Loans, or deleting loan records upon return?
    3. Which preconditions, postconditions, and BR-01…BR-07 invariants do UC-BORROW and UC-RETURN require?

    ### Verifying Implementations and Changes

    1. Which APIs—`Library.borrow`, `Loan.returnOn`, `isAvailable`, and `Clock`—and which tests enforce each BR?
    2. Why does a `synchronized` lock on the same `Library` protect only one JVM, while multiple nodes require a transaction/unique active-copy index?
    3. How is the limit of 3 active Loans per member enforced when a unique index protects only individual copies?
    4. If policy changes to allow teachers to borrow 6 copies, in what order should changes to rules, models, Java, tests, and existing data be considered?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Establishing traceability | Create a justified UC/BR → class, API, constraint, and test matrix. |
    | Detecting model drift | Explain discrepancies in identity, multiplicity, active-versus-historical loans, due dates, and responsibilities. |
    | Verifying in both directions | Specify tests for success, rejection, return history, and contention for the last available copy. |
    | Choosing where to enforce rules | Distinguish model-level validation from transactions/unique constraints in shared storage. |
    | Managing business changes | Identify which models, code, tests, and policies must be updated when business rules change after deployment. |
