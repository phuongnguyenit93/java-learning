version: 1
type: LEARNING_ROADMAP
title: CƠ CHẾ NGÔN NGỮ — LIÊN KẾT BÀI HỌC
roadmapHeading: Mạch liên kết bài học
roadmap:
- id: language-mechanics-001
  order: 1
  title: Kiểu tổng quát và lớp có tham số kiểu
  description: Xây lớp/phương thức tổng quát (`Box`, `Pair`, `Repository`) và hiểu cách type argument, inference, raw type và erasure quyết định mức an toàn kiểu.
  transition:
    to: language-mechanics-002
    description: '**Từ biết generic type → thêm upper bound khi thuật toán cần khả năng cụ thể từ T**'
- id: language-mechanics-002
  order: 2
  title: Ràng buộc tham số kiểu
  description: Giới hạn type parameter bằng class/interface bounds, `Comparable<? super T>` và intersection; chọn điều kiện mà thuật toán thật sự cần.
  transition:
    to: language-mechanics-003
    description: '**Từ giới hạn năng lực T → kiểm tra subtype, wildcard và dữ liệu có thể đọc hoặc ghi qua generic API**'
- id: language-mechanics-003
  order: 3
  title: Quan hệ kiểu của các cấu trúc tổng quát
  description: Đọc quan hệ subtype giữa parameterized types; chọn `?`, `? extends`, `? super` và helper capture theo vai trò producer/consumer.
  transition:
    to: language-mechanics-004
    description: '**Từ quan hệ kiểu trong API → phân biệt lúc compiler kiểm tra và khi JVM dispatch hay cast**'
- id: language-mechanics-004
  order: 4
  title: Kiểu tĩnh, kiểu động và kiểm tra kiểu
  description: Phân biệt kiểu tĩnh với runtime class, overload với override; dùng `instanceof`/validation khi dữ liệu đến từ boundary không chắc kiểu.
  transition:
    to: language-mechanics-005
    description: '**Từ kiểu và lời gọi hợp lệ → đánh giá biểu thức, field, accessor và quy ước Java tác động lên trạng thái**'
- id: language-mechanics-005
  order: 5
  title: Toán tử, thuộc tính và quy ước của ngôn ngữ
  description: Vận dụng toán tử, numeric promotion, short-circuit và JavaBeans/record conventions để tránh sai số và bảo vệ field.
  transition:
    to: language-mechanics-006
    description: '**Từ so sánh biểu thức bằng `==`/`equals` → xây hợp đồng equality/hash đầy đủ để dùng object làm key**'
- id: language-mechanics-006
  order: 6
  title: Hợp đồng so sánh bằng và mã băm
  description: Thiết kế equality/hash nhất quán, giữ key ổn định và áp dụng đúng cho HashMap, HashSet, record, array và entity.
  transition:
    to: language-mechanics-007
    description: '**Từ danh tính và equality → quyết định cách hiển thị object cho debug mà không rò rỉ dữ liệu**'
- id: language-mechanics-007
  order: 7
  title: Biểu diễn chuỗi và thông tin chẩn đoán của đối tượng
  description: Thiết kế `toString` và logging gọn, không lộ secret hoặc tạo side effect, với DTO/structured log riêng khi cần.
  transition:
    to: language-mechanics-008
    description: '**Từ chuỗi chẩn đoán và exception message → xác định hợp đồng lỗi có cấu trúc và trạng thái sau thất bại**'
- id: language-mechanics-008
  order: 8
  title: Ngoại lệ, trạng thái lỗi và hợp đồng phương thức
  description: Quy định tiền/hậu điều kiện, cách trả Result/Optional hoặc ném exception và trạng thái sau lỗi, cùng nguyên tắc atomicity.
  transition:
    to: language-mechanics-009
    description: '**Từ các cơ chế ngôn ngữ Java → phân biệt phần thiết kế OOP phải giữ với cú pháp/runtime có thể thay đổi khi port**'
- id: language-mechanics-009
  order: 9
  title: Khác biệt ngôn ngữ khi hiện thực cùng một thiết kế OOP
  description: Đối chiếu cùng thiết kế ShippingPolicy trên năm ngôn ngữ và xác nhận parity bằng ràng buộc input, đơn vị tiền và test biên.
  transition: null
comparisonMarkdown: |-
  ## 2. Bảng đối chiếu các bài học

  | Tiêu chí | Bài 1 | Bài 2 | Bài 3 | Bài 4 | Bài 5 | Bài 6 | Bài 7 | Bài 8 | Bài 9 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Tên | Kiểu tổng quát và lớp có tham số kiểu | Ràng buộc tham số kiểu | Quan hệ kiểu của các cấu trúc tổng quát | Kiểu tĩnh, kiểu động và kiểm tra kiểu | Toán tử, thuộc tính và quy ước của ngôn ngữ | Hợp đồng so sánh bằng và mã băm | Biểu diễn chuỗi và thông tin chẩn đoán của đối tượng | Ngoại lệ, trạng thái lỗi và hợp đồng phương thức | Khác biệt ngôn ngữ khi hiện thực cùng một thiết kế OOP |
  | Vấn đề cần hiểu | Generic class/method giúp an toàn kiểu ra sao? | T cần những năng lực nào? | List<T> gán và đọc/ghi thế nào? | Compiler và runtime quyết định điều gì? | Biểu thức, field/property hoạt động ra sao? | Thế nào là cùng giá trị và hash phù hợp? | Object nên được ghi log bằng dữ liệu nào? | Failure có ý nghĩa gì và state ra sao? | Thiết kế nào phải giữ giữa các ngôn ngữ? |
  | Giá trị đối với OOP/module | Tái sử dụng typed API, giảm cast | Chữ ký thuật toán có bound chính xác | Chọn wildcard/PECS đúng dữ liệu | Dispatch/cast/validation chính xác | Tính toán và đóng gói đúng quy tắc Java | Hash collection nhận diện key hợp lệ | Chẩn đoán an toàn, có trace và không lộ secret | Method contract, failure atomicity và retry đúng | Chuyển hành vi OOP với test parity |
  | Tư duy hình thành | Tách thuật toán khỏi kiểu cụ thể nhưng giữ type safety | Chỉ đòi năng lực thực sự cần cho generic T | Suy luận từ nguồn/đích và subtype | Tách kiểu compile time khỏi object runtime | Phân tích kiểu kết quả và quyền cập nhật trạng thái | Định nghĩa domain identity/value equality ổn định | Tách diagnostic text với public API/schema | Thiết kế đường lỗi ngay cùng đường thành công | Ưu tiên trách nhiệm và invariant trước cú pháp |
