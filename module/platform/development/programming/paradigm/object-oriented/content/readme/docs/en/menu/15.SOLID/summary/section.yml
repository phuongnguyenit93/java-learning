version: 1
type: LEARNING_ROADMAP
title: SOLID — LESSON CONNECTIONS
roadmapHeading: Learning Path Through the Lessons
roadmap:
- id: solid-001
  order: 1
  title: Purpose and Scope of SOLID
  description: Use SolidScopeDemo to frame SOLID as a way to reduce the impact of changes and improve testability; distinguish the five principles from issues such as transactions and security, which they do not automatically solve.
  transition:
    to: solid-002
    description: '**From SOLID’s goals → explore how to identify a group of responsibilities and reasons for change**'
- id: solid-002
  order: 2
  title: 'Single Responsibility: One Group of Reasons to Change'
  description: SRP groups lifecycle and total-calculation rules within Invoice, while formatters, repositories, and senders handle separate reasons for change; InvoiceWorkflow coordinates the use case.
  transition:
    to: solid-003
    description: '**From clearly defined responsibilities → establish extension points for variants without repeatedly changing the core**'
- id: solid-003
  order: 3
  title: 'Open–Closed: Extending Behavior with Controlled Changes'
  description: 'OCP places the variation point in ShippingPolicy: add Standard, Express, SameDay, and surcharge decorators while ShippingService keeps its feeFor call, with registration at the composition root.'
  transition:
    to: solid-004
    description: '**From extending with multiple implementations → ensure each one honors the contract**'
- id: solid-004
  order: 4
  title: 'Liskov Substitution: Preserving the Supertype Contract'
  description: LSP requires every DiscountPolicy to preserve preconditions, postconditions, invariants, and error behavior; BadVipDiscount and BadFixedDiscount violate the contract in different ways despite valid implements declarations.
  transition:
    to: solid-005
    description: '**From substitution contracts → narrow obligations to each client’s needs**'
- id: solid-005
  order: 5
  title: 'Interface Segregation: Contracts Tailored to Each Client'
  description: ISP separates DocumentReader, DocumentWriter, and DocumentDeleter according to client needs; a read-only archive need not pretend to support writing/deletion, while one implementation may fulfill multiple roles.
  transition:
    to: solid-006
    description: '**From giving clients suitable contracts → adjust dependency direction between business logic and infrastructure**'
- id: solid-006
  order: 6
  title: 'Dependency Inversion: Depending on Abstractions'
  description: DIP keeps CustomerSpendingService dependent on PurchaseReader while in-memory/JDBC adapters implement the port; the service retains purchase-total rules independently of SQL details.
  transition:
    to: solid-007
    description: '**From inverting dependency direction → distinguish the architectural principle from object wiring techniques**'
- id: solid-007
  order: 7
  title: Distinguishing Dependency Inversion from Dependency Injection
  description: Compare DIP (source dependency direction), DI (providing dependencies), and IoC (broader inversion of control) using PaymentGateway, CheckoutService, and a composition root/Spring.
  transition:
    to: solid-008
    description: '**From understanding the five principles and DI → weigh abstraction costs in real-world situations**'
- id: solid-008
  order: 8
  title: Balancing the Principles with Real-World Complexity
  description: 'Evaluate KISS/YAGNI/DRY and change surface: move from SimpleCheckout with one rule to DeliveryFeePolicy when Standard/Express vary independently, preserving tests and avoiding overengineering.'
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Purpose and Scope of SOLID | Single Responsibility: One Group of Reasons to Change | Open–Closed: Extending Behavior with Controlled Changes | Liskov Substitution: Preserving the Supertype Contract | Interface Segregation: Contracts Tailored to Each Client | Dependency Inversion: Depending on Abstractions | Distinguishing Dependency Inversion from Dependency Injection | Balancing the Principles with Real-World Complexity |
  | Key question | What problems should SOLID solve, and within what scope? | What defines one group of responsibilities and the actors driving change? | How much core code must change when adding a variant? | Does the subtype still honor the supertype's promises? | Must a client see APIs it does not use? | Does business logic import a technology or depend on a port? | What exactly distinguishes DIP from DI? | When does an abstraction offer more value than simple code? |
  | Value for OOP/the module | Provide a framework for evaluating all five principles | Improve cohesion and separate I/O from Invoice | Add policies with less regression risk in ShippingService | Preserve behavioral compatibility across policies | Avoid forcing ReadOnlyArchive to pretend it can write/delete | Replace JDBC/REST without changing the use case | Enable composition and testing with correct module dependency direction | Reduce complexity that adds no value |
  | Mental model developed | Consider changes and contracts | Group by reasons for change | Identify stable and variable parts | Specify preconditions/postconditions and share contract tests | Design around client needs | Place abstractions on the consuming side | Separate dependency graphs from wiring | Verify trade-offs using real scenarios |
