version: 1
type: LEARNING_ROADMAP
title: OBJECT LIFECYCLE — LESSON CONNECTIONS
roadmapHeading: How the Lessons Connect
roadmap:
- id: lifecycle-001
  order: 1
  title: Object Creation and Resource Allocation
  description: Distinguish instances, references, and resources outside the JVM; trace what happens during `new`, then close resources explicitly instead of waiting for GC.
  transition:
    to: lifecycle-002
    description: '**From creating an instance → defining what constitutes a valid initialized state**'
- id: lifecycle-002
  order: 2
  title: Constructors and Establishing Valid State
  description: Define invariants and organize validation, defensive copying, and `final` fields so every constructor that completes produces a valid state.
  transition:
    to: lifecycle-003
    description: '**From protecting invariants → choosing constructor paths that preserve those invariants**'
- id: lifecycle-003
  order: 3
  title: Default, Parameterized, and Overloaded Constructors
  description: Distinguish default, no-arg, and parameterized constructors; design overloads and `this(...)`/`super(...)` chains that uphold the same rules.
  transition:
    to: lifecycle-004
    description: '**From this/super chains → tracing the full initialization order in inheritance**'
- id: lifecycle-004
  order: 4
  title: Initialization Order in Inheritance
  description: Trace static initializers, instance initializers, and constructors from superclass to subclass; detect overridden methods invoked too early.
  transition:
    to: lifecycle-005
    description: '**From constructor mechanics → exploring named and configurable object-creation APIs**'
- id: lifecycle-005
  order: 5
  title: Static Factory Methods, Factories, and Builders
  description: Choose a constructor, static factory, Factory that selects an implementation, or Builder to express the object-creation approach best suited to the API.
  transition:
    to: lifecycle-006
    description: '**From creating objects → examining how long they remain alive and who retains their references**'
- id: lifecycle-006
  order: 6
  title: Object Lifetime, Reachability, and Memory Reclamation
  description: Read GC-root graphs and determine lifetime through reachability; identify aliases, caches, listeners, or ThreadLocal values that retain objects.
  transition:
    to: lifecycle-007
    description: '**From reachability graphs → understanding what GC actually reclaims and how to measure memory use**'
- id: lifecycle-007
  order: 7
  title: Garbage Collection and Manual Memory Management
  description: Explain GC's responsibility for heap memory and its limits regarding native resources; measure different types of memory pressure.
  transition:
    to: lifecycle-008
    description: '**From heap-management mechanisms → defining when to release resources outside the heap**'
- id: lifecycle-008
  order: 8
  title: Resource Cleanup and the Limits of Finalizers
  description: Define ownership and timely `close()` calls using try-with-resources, including cases with multiple resources and failures during closing.
  transition:
    to: lifecycle-009
    description: '**From closing resources at the right point in their lifecycle → ensuring objects are not published before they are ready**'
- id: lifecycle-009
  order: 9
  title: Preventing Use of Partially Initialized Objects
  description: Ensure objects are fully initialized before publishing them to callbacks, threads, or registries; use appropriate safe-publication techniques.
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 | Lesson 9 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Object Creation and Resource Allocation | Constructors and Establishing Valid State | Default, Parameterized, and Overloaded Constructors | Initialization Order in Inheritance | Static Factory Methods, Factories, and Builders | Object Lifetime, Reachability, and Memory Reclamation | Garbage Collection and Manual Memory Management | Resource Cleanup and the Limits of Finalizers | Preventing Use of Partially Initialized Objects |
  | Questions to Understand | How is creating an instance with `new` different from assigning a reference, and how should files/sockets be closed? | How do constructors protect invariants and mutable data? | How are default/no-arg constructors, overloads, and `this`/`super` selected? | In what order do static and instance initializers and superclass/subclass constructors execute? | When should you use a static factory, Factory, or Builder? | How are scope, GC roots, weak references, and object retention related? | What heap memory can GC manage, and when is native memory management necessary? | How do you close resources according to ownership and handle exceptions during closing? | How do you prevent `this escape`, early callbacks, and premature publication across threads? |
  | Value for OOP/the Module | Understand the boundary between instances and resources at the start of their lifecycles. | Create valid objects while protecting state and preconditions. | Build clear constructor APIs without chaining errors. | Correctly interpret inheritance behavior and avoid unexpected initialization results. | Design flexible object-creation mechanisms and implementation selection. | Avoid retaining objects indefinitely by actively limiting caches/listeners. | Distinguish monitoring of heap and native memory from practical GC policies. | Release files, JDBC connections, and sockets at the right time and by the responsible owner. | Prevent the use of incomplete objects and reduce hard-to-reproduce concurrency bugs. |
  | Mental Model Developed | Analyze two lifecycles: memory and resources. | Start with the state contract before assigning fields. | Treat each overload as a path to the same invariant. | Predict behavior by tracing execution rather than relying only on declaration order. | Choose the level of object-creation abstraction that fits the problem. | Trace paths from roots to objects and examine retention policies. | Rely on measurements and API contracts without assuming deterministic GC. | Manage ownership, cleanup, and failures proactively. | Complete initialization before activation and safely synchronized publication. |
