summaries:
- id: class-001
  title: 'Class Structure: Fields and Methods'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Class Structure: Fields and Methods**

    Understand that a class consists of fields, constructors, and methods, and distinguish state from behavior. Through `InventoryItem`, learners see why fields must be protected by the `restock()`/`sell()` API, how a constructor establishes a valid initial state, and how the total inventory value is calculated from current data.

    ## 2. Questions Learners Must Be Able to Answer

    ### Identifying Class Structure

    1. How do instance fields, static fields, parameters, and local variables differ in where they are declared, who owns them, and their lifetimes?
    2. In `InventoryItem`, what roles do the constructor, `this.sku`, `getQuantity()`, `restock()`, and `sell()` play, respectively?
    3. Why are `sku` and `unitPriceVnd` declared `final`, while `quantity` needs to be updated?

    ### Designing and Protecting State

    1. Why is calling `restock()`/`sell()` safer and clearer than exposing a setter for `quantity`?
    2. When `sell(20)` is called with only 12 items remaining, which exception is thrown, and what should happen to `quantity`?
    3. Why is the total inventory value calculated by a method, and why is `Math.multiplyExact` needed?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Identify components | Correctly identify fields, constructors, methods, parameters, return types, modifiers, and `this` in the `InventoryItem` code. |
    | Design behavior | Propose `private` fields, a validating constructor, and restocking/selling methods that prevent negative quantities. |
    | Distinguish individual/shared state | Explain why two instances have independent quantities while `MAX_QUANTITY` is a shared rule. |
    | Predict execution and errors | Calculate inventory before and after calls and demonstrate that state remains unchanged when validation fails. |
- id: class-002
  title: Declaring Classes and Creating Instances
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Declaring Classes and Creating Instances**

    Distinguish a class declaration from instances created with `new`, and understand reference variables and constructors. The `Workshop` example helps learners reason about independent objects, aliases that share an object, `null`, `==` comparisons, and the causes of initialization errors.

    ## 2. Questions Learners Must Be Able to Answer

    ### Declaration and Initialization

    1. Why does `class Workshop` only define a type, while `new Workshop(...)` actually creates an instance?
    2. Where does the constructor validate the name and capacity, and when does Java provide a default no-argument constructor?
    3. How do an unassigned local variable and a reference field that defaults to `null` differ when used?

    ### References and Identity

    1. Why does `Workshop alias = spring` not create a new instance, while `new Workshop("Spring Boot", 1)` creates a separate one?
    2. When `alias.register()` is called, how do the available seats for `spring` and `java` change?
    3. What do `alias == spring` and `separate == spring` check, and how does that differ from comparing content with `equals()`?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Declare a valid class | Write a `Workshop` with a constructor and a `Main.java` that follow the rules for public classes and filenames. |
    | Ensure a valid initial state | Validate the name and capacity in the constructor and identify constructor calls with missing arguments. |
    | Diagram reference relationships | Correctly represent `java`, `spring`, `alias`, and `separate` in a variable-and-object diagram. |
    | Predict results | Explain the results of `register()`, `remainingSeats()`, and `==` across object creation and assignment steps. |
- id: class-003
  title: Instance Members and Shared Members
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Instance Members and Shared Members**

    Choose instance members when data belongs to an individual object and `static` members when data or behavior truly belongs to the class. The `TicketWallet` example shows how a shared counter differs from individual state, along with the limitations involving class loaders, concurrency, persistence, and static method hiding.

    ## 2. Questions Learners Must Be Able to Answer

    ### Instance and Static Members

    1. Why do two `TicketWallet` instances have different `ownedTickets` values but see the same `totalSold`?
    2. How can a static method access an instance field when it has no `this`?
    3. How do `static`, `final`, and `public` differ, and why can a `static final List` still contain mutable data?

    ### Lifecycle, Polymorphism, and Concurrency

    1. Why are static fields not automatically synchronized across JVMs, class loaders, or application restarts?
    2. In `Animal pet = new Dog()`, why do `pet.sound()` and `pet.group()` select different implementations?
    3. How does a race condition arise in `totalSold += quantity`, and what part of the problem does `AtomicInteger` address?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Choose ownership | Decide which fields and methods in the ticket wallet problem should be instance, static, or static final members. |
    | Predict data | Correctly calculate the tickets in each wallet and the total tickets sold after multiple calls. |
    | Explain dispatch | Distinguish instance method overriding from static method hiding using the `Animal`/`Dog` example. |
    | Recognize shared-state risks | Identify JVM/class loader boundaries, data persistence limitations, and non-atomic updates. |
- id: class-004
  title: Member Access Levels
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Member Access Levels**

    Design access boundaries for fields, methods, and constructors using the four levels: `private`, package-private, `protected`, and `public`. The focus is on preserving business invariants through public APIs and correctly applying `protected` rules when a subclass is in a different package.

    ## 2. Questions Learners Must Be Able to Answer

    ### The Four Access Levels

    1. What do the four access levels permit within the same class, the same package, a subclass in another package, and a non-subclass in another package?
    2. Why can `ExchangeStudent` call `this.addCredits()` but not `other.addCredits()` when other has type `Student`?
    3. Why is `vn.edu.school.domain.audit` not automatically in the same package as `vn.edu.school.domain`?

    ### API Design and Language Restrictions

    1. Why must `credits` be protected while `getCredits()` may be public?
    2. Which access modifiers can a top-level class use, and why can an override not reduce visibility?
    3. When should you choose a private constructor, a package-private helper, or a protected extension point?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Interpret access permissions | Analyze whether statements in `StudentAudit`, `ExchangeStudent`, and `StudentViewer` are valid. |
    | Apply protected access correctly | Explain which receivers are valid for a protected method when inheriting across packages. |
    | Design a minimal interface | Keep data private, expose only necessary getters and operations, and choose the narrowest access level. |
    | Identify compilation errors | Fix invalid modifiers on top-level classes or overrides that reduce access. |
- id: class-005
  title: Method Parameters, Return Values, and Side Effects
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Method Parameters, Return Values, and Side Effects**

    Interpret method contracts in terms of parameters, arguments, return types, side effects, and errors. Learners must explain Java pass-by-value, including copying a reference value that points to a mutable object, and design APIs that do not expose internal state.

    ## 2. Questions Learners Must Be Able to Answer

    ### Inputs, Outputs, and Passing Values

    1. How does a parameter differ from an argument, and how does `return result` differ from `System.out.println(result)`?
    2. Why does `update(int, StringBuilder)` not change the caller's `score` variable, why can it change the contents of `note`, and why does reassigning `note` not change the caller's reference?
    3. Why does Java not allow overloading based only on the return type, and what positional restriction applies to varargs?

    ### Side Effects and Safe Contracts

    1. Why can a `void` method still have side effects, and why is a getter that does not modify fields not necessarily a pure function?
    2. In `JobCounter`, what are the results and states after `addJobs(-1)`, an overflow, or `completeOne()` when no jobs remain?
    3. Why can a getter that returns a mutable `List` break encapsulation, and what does `List.copyOf` protect?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Analyze methods | Identify inputs, return values, side effects, exceptions, and validity conditions for specific signatures and logic. |
    | Predict pass-by-value behavior | Explain results involving primitives, `StringBuilder`, List, and parameter reassignment. |
    | Design contracts | Write update operations that validate before modifying state and return meaningful `boolean`/`void` results. |
    | Protect internal data | Choose defensive copies or read-only APIs when returning mutable collections. |
- id: class-006
  title: Read-Only and Mutable Members
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Read-Only and Mutable Members**

    Distinguish data that is read-only to external code, `final` fields that cannot be reassigned, and truly immutable objects. Through `Product`, `Course`, and `Inventory`, choose getters, validating setters, business operations, and defensive copies according to the rules for changing data.

    ## 2. Questions Learners Must Be Able to Answer

    ### What Read-Only and Final Mean

    1. How does `private final String sku` differ from `private int available` when external code can only read the latter through a getter?
    2. Why does `final List` not make the list immutable, and why can `getItems().clear()` still change its contents?
    3. How do a read-only API, a `static final` constant, a mutable object, and an immutable object differ?

    ### Designing Mutable Data

    1. When is a validating setter appropriate, and when should operations such as `reserve()`/`restock()` be used instead?
    2. How do `Collections.unmodifiableList`, `List.copyOf`, and an `ArrayList` copy differ?
    3. Why might a record containing a List component still need a defensive copy to protect its data?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Choose mutation permissions | Propose fields, getters, setters, or operations for SKUs, names, prices, and inventory. |
    | Identify vulnerabilities | Explain how a getter returning a mutable List can allow internal state to be modified. |
    | Create APIs that return safe data | Apply `List.copyOf` or an appropriate copy and explain the limitations of shallow copying. |
    | Validate constraints | Predict responses to negative prices and orders exceeding available stock. |
- id: class-007
  title: Referencing the Current Object
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Referencing the Current Object**

    Use `this` to refer to the object receiving a call, distinguish fields from shadowing parameters, delegate between constructors, and return an instance for method chaining. The lesson also explains the limitations of static contexts, inner classes, and the risk of exposing an object too early from its constructor.

    ## 2. Questions Learners Must Be Able to Answer

    ### Referencing the Current Object

    1. In `this.username = username`, what does each side refer to, and why can `username = username` leave the field as `null`?
    2. Why do `lan.completeLesson()` and `minh.completeLesson()` yield different values of `this`?
    3. What do `return this`, `this == other`, and alias assignment reveal about object identity?

    ### Constructors and Special Contexts

    1. How does `this(...)` differ from `this.field` and `super(...)`, and what do Java 17/21 require about the position of a constructor call?
    2. Why is `this` unavailable inside a static method even though a static method can process an object passed to it?
    3. What risks arise when `this` is passed to a listener inside the constructor, and which object does `OuterClass.this` refer to?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Fix shadowing | Change `value = value` to `this.value = value` and predict the field's value. |
    | Chain constructors | Write overloaded constructors using `this(...)` according to Java 17/21 rules. |
    | Track the same instance | Explain method chaining, `return this`, and the results of reference comparisons. |
    | Distinguish contexts | Recognize static contexts, `OuterClass.this`, and the risk of this-escape in constructors. |
- id: class-008
  title: Designing a Class with a Bank Account Example
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Designing a Class with a Bank Account Example**

    Combine class structure, constructors, encapsulation, method contracts, and invariants in a single-threaded `BankAccount` model. Learners design deposits, withdrawals, and transfers with validation before updates, and distinguish an in-memory simulation from safe, secure, and auditable transactions in a real banking system.

    ## 2. Questions Learners Must Be Able to Answer

    ### Model and Invariants

    1. Why are accountNumber/holderName declared `private final` while `balanceVnd` is `private long`?
    2. Which conditions must the constructor, `deposit()`, `withdraw()`, and `transferTo()` check before changing a balance?
    3. Why can `transferTo()` read the `private` field of a destination belonging to the same class, and why must it calculate the destination balance before subtracting from the source balance?

    ### Edge Cases and Limitations

    1. What should the result and state be when `withdraw` exceeds the balance, a transfer targets `this`, or a `long` addition overflows?
    2. Why does the example use `long` for VND, while fractional amounts or multiple currencies often require BigDecimal and rounding rules?
    3. Why are two in-memory field assignments insufficient to guarantee atomic transactions, thread safety, authorization, and audit trails?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Map requirements to a class | Design fields, a constructor, getters, and `deposit`, `withdraw`, and `transferTo` operations with clear responsibilities. |
    | Protect balances | Check for positive amounts, sufficient funds, a valid destination, and overflow before updating. |
    | Simulate transactions | Calculate two account balances after each step and verify that internal transfers preserve the total amount. |
    | Verify edge cases | Identify expected exceptions and confirm balances remain unchanged when validation fails. |
    | Recognize architectural limitations | Explain when database transactions, concurrency control, authorization, and transaction logging are needed. |
