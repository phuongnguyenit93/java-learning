version: 1
type: LEARNING_ROADMAP
title: QUAN HỆ — LIÊN KẾT BÀI HỌC
roadmapHeading: Mạch liên kết bài học
roadmap:
- id: relationships-001
  order: 1
  title: Liên kết giữa các đối tượng
  description: Xác định link giữa các object và cách thay đổi association, đồng thời phân biệt hướng truy cập, bội số với
    ownership.
  transition:
    to: relationships-002
    description: '**Từ link giữa object → phân biệt liên kết nghiệp vụ với quan hệ sử dụng cộng tác viên**'
- id: relationships-002
  order: 2
  title: Sự phụ thuộc tạm thời và liên kết lâu dài
  description: Phân biệt cộng tác viên được dùng trong một thao tác với liên kết được lưu thành trạng thái; chọn tham số,
    field hoặc injection theo nhu cầu.
  transition:
    to: relationships-003
    description: '**Từ kiểu quan hệ sử dụng → làm rõ nghĩa sở hữu và vòng đời của toàn thể–bộ phận**'
- id: relationships-003
  order: 3
  title: Tập hợp và hợp thành
  description: Thiết kế whole–part dựa vào tính độc lập và chủ sở hữu của phần tử; bảo vệ vòng đời Team–Employee và Order–LineItem.
  transition:
    to: relationships-004
    description: '**Từ ownership của whole–part → xác định ràng buộc số lượng giữa các đầu**'
- id: relationships-004
  order: 4
  title: 'Số lượng: một-một, một-nhiều và nhiều-nhiều'
  description: Đọc multiplicity ở cả hai đầu và áp ràng buộc 1–1, 1–N, N–N qua API, registry hoặc đối tượng Enrollment.
  transition:
    to: relationships-005
    description: '**Từ bội số mỗi đầu → quyết định chiều truy cập nào thật sự cần trong object graph**'
- id: relationships-005
  order: 5
  title: Hướng liên kết và khả năng điều hướng
  description: Chỉ lưu chiều liên kết thực sự cần truy cập; dùng repository khi thích hợp và quản lý chi phí của liên kết
    hai chiều.
  transition:
    to: relationships-006
    description: '**Từ lựa chọn hướng truy cập → bảo vệ invariant khi phải lưu cả hai hướng**'
- id: relationships-006
  order: 6
  title: Quan hệ hai chiều và giữ dữ liệu nhất quán
  description: Duy trì một sự thật nhất quán giữa `Employee.department` và `Department.employees` qua mọi thao tác, cả trong
    bộ nhớ lẫn JPA.
  transition:
    to: relationships-007
    description: '**Từ giữ nhất quán từng liên kết → nhận diện coupling và vòng phụ thuộc giữa các thành phần**'
- id: relationships-007
  order: 7
  title: Vòng phụ thuộc và cách phá vòng
  description: Phân biệt vòng tham chiếu hợp lệ với chu trình phụ thuộc gây lỗi; chuyển orchestration và dependency sang các
    ranh giới có trách nhiệm rõ.
  transition:
    to: relationships-008
    description: '**Từ cấu trúc quan hệ đã thiết kế → đọc và kiểm tra lại bằng ký hiệu UML**'
- id: relationships-008
  order: 8
  title: Đọc ký hiệu quan hệ trong sơ đồ lớp
  description: |-
    Tổng hợp sáu ký hiệu quan hệ và các nhãn UML để đọc sơ đồ, kiểm tra việc biểu diễn association, ownership, multiplicity và contract trong Java.
  transition: null
comparisonMarkdown: |-
  ## 2. Bảng đối chiếu các bài học

  | Tiêu chí | Bài 1 | Bài 2 | Bài 3 | Bài 4 | Bài 5 | Bài 6 | Bài 7 | Bài 8 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Tên | Liên kết giữa các đối tượng | Sự phụ thuộc tạm thời và liên kết lâu dài | Tập hợp và hợp thành | Số lượng: một-một, một-nhiều và nhiều-nhiều | Hướng liên kết và khả năng điều hướng | Quan hệ hai chiều và giữ dữ liệu nhất quán | Vòng phụ thuộc và cách phá vòng | Đọc ký hiệu quan hệ trong sơ đồ lớp |
  | Vấn đề cần hiểu | Association nối object nào, đổi link ra sao? | Phụ thuộc trong một thao tác khác association lưu trạng thái thế nào? | Khi nào part thuộc riêng một whole? | 1–1, 1–N, N–N ràng buộc số lượng nào? | Đứng ở một object có thể đi tới đầu kia theo chiều nào? | Làm sao giữ hai chiều cùng phản ánh một quan hệ khi có thay đổi/lỗi? | Vòng thiết kế, wiring, runtime xuất hiện và được phá thế nào? | Mỗi loại nét, đầu mũi tên, hình thoi, bội số trong UML nghĩa là gì? |
  | Giá trị đối với OOP/module | Mô hình đúng quan hệ instance, API phân công/chuyển/gỡ. | Tránh nhầm dependency dịch vụ với trạng thái và vòng đời nghiệp vụ. | Bảo vệ ownership và tránh xóa nhầm phần tử chia sẻ. | Cưỡng chế số lượng, duy nhất và luật của liên kết trung gian. | Giảm trạng thái lưu dư và tránh thêm chiều liên kết vô cớ. | Ngăn object graph/JPA lệch dữ liệu hoặc cập nhật nửa chừng. | Giảm coupling và lỗi khởi tạo, giữ luồng nghiệp vụ kiểm thử được. | Đọc và truyền đạt mô hình lớp chính xác trước khi viết code. |
  | Tư duy hình thành | Hỏi object nào thực sự liên kết tại thời điểm chạy. | Hỏi cần một công cụ để làm việc hay một quan hệ phải được lưu. | Hỏi ai là chủ và part có tồn tại độc lập không. | Hỏi mỗi A có bao nhiêu B và mỗi B có bao nhiêu A. | Hỏi truy vấn cần đi từ phía nào và có cần field ngược không. | Hỏi invariant hai phía và ranh giới cập nhật là gì. | Vẽ đồ thị cạnh có hướng, tìm trách nhiệm sai và kiểm tra sau refactor. | Đọc kết hợp nét, đầu đường, bội số, role và đối chiếu với Java. |
