summaries:
- id: composition-001
  title: Composing Objects to Build Behavior
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Composing Objects to Build Behavior**

    This lesson explains how to build complete functionality from objects with focused responsibilities and clear contracts. In the order-notification example, `OrderNotifier` coordinates `MessageFormatter` and `Transport`; replacing components changes the formatting or delivery channel or adds an audit layer without changing the coordination algorithm. Learners also distinguish object composition from exclusive ownership and verify interactions with fakes instead of a real delivery service.

    ## 2. Questions Learners Should Be Able to Answer

    ### Structure and Collaboration Flow

    1. Why is a class that formats, sends, and checks every notification channel itself difficult to extend and test?
    2. What are the responsibilities of OrderNotifier, MessageFormatter, and Transport, and in what order does data pass through them?
    3. How does composition differ from inheritance in terms of has-a/uses-a versus is-a relationships?
    4. Which code merely holds a component reference, and which code actually performs delegation?

    ### Substitution, Testing, and Limitations

    1. Does replacing PlainFormatter with CompactFormatter or EmailTransport with SmsTransport require changing OrderNotifier, and why?
    2. What roles do Strategy and Decorator play in the Formatter and AuditedTransport examples?
    3. Why does sharing one Transport between two notifiers not mean both have exclusive ownership of it?
    4. If Transport throws an error after a partial send, does composition automatically roll back or guarantee exactly-once delivery?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Separating responsibilities | Draw the relationships among OrderNotifier, MessageFormatter, and Transport, and identify where validation, formatting, and notification delivery belong. |
    | Composing behavior | Combine different formatters and transports to explain email or SMS output or a decorator component that adds auditing. |
    | Testing across boundaries | Use RecordingTransport/a fake to verify recipient, content, send count, and failure paths. |
    | Evaluating component lifecycles | Analyze two notifiers sharing a transport and determine who manages resources and concurrency. |
- id: composition-002
  title: Has-A and Is-A Relationships
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Has-A and Is-A Relationships**

    This lesson provides criteria for choosing subtype relationships and component-use relationships in object models. The example of `Car extends Vehicle` while holding a `PowerSource` shows that is-a expresses classification, while has-a describes a dependency used to coordinate functionality. Learners must assess substitutability against contracts, distinguish association, aggregation, and strongly owned composition, and avoid inferring ownership or automatic resource closure merely from a reference field.

    ## 2. Questions Learners Should Be Able to Answer

    ### Classifying Relationships in a Model

    1. When does the statement “X is a Y” justify extends or implements, and why must the behavioral contract still be verified?
    2. Why can Car be a Vehicle but have or use PowerSource instead of declaring extends PowerSource?
    3. How do association, aggregation, and composition in UML differ in sharing and lifecycle semantics?
    4. In what sense does the Payable interface express a subtype relationship and a contract?

    ### Preserving the Model and Resources

    1. Why does a private final field or collection not, by itself, prove that a component has only one owner?
    2. In the Order and OrderLine example, what does List.copyOf protect, and when do mutable elements still require attention?
    3. When the same Engine is supplied to multiple owners, does the garbage collector automatically close or destroy Engine as soon as one owner disappears?
    4. How can incorrect designs such as Order extends Customer or PaymentService extends DatabaseClient be identified?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Analyzing type and component relationships | Identify extends/implements and has-a arrows in examples involving Vehicle, Car, Bicycle, and PowerSource. |
    | Verifying LSP | Evaluate subtype behavior through calls using Vehicle or Payable types and identify contract violations. |
    | Distinguishing ownership levels | Propose association, aggregation, or composition relationships for orders, team members, and shared services. |
    | Protecting state | Explain the limitations of final/List.copyOf and how to isolate mutable data or have the proper owner manage close. |
- id: composition-003
  title: Delegating Work to Other Objects
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Delegating Work to Other Objects**

    This lesson focuses on the actual flow of delegated work rather than merely diagrams showing reference fields. `TicketRouter` receives requests, validates data, asks `TicketClassifier` to choose a queue, and uses `AssignmentPort` to record an assignment; the router remains responsible for the sequence and returned result. Learners assess delegate contracts, avoid meaningless forwarding layers, distinguish Strategy/Adapter/Decorator/Proxy/Facade, and test both successful and failed paths.

    ## 2. Questions Learners Should Be Able to Answer

    ### Roles and Responsibilities in Delegation

    1. In the TicketRouter.route flow, who is the delegator, who classifies, and who records the Assignment?
    2. Why are the classifier and assignments fields a has-a structure, while the classify/assign calls demonstrate delegation?
    3. Which responsibilities must Router retain when specialized work is delegated to a collaborator?
    4. How do delegation and simple forwarding differ in the value added by an intermediate class?

    ### Contracts, Substitution, and Errors

    1. Why must a classifier returning null or a port reporting an error not be turned into a falsely successful assignment result?
    2. What does replacing SeverityClassifier with BillingKeywordClassifier verify about contracts and coupling?
    3. How can Strategy, Adapter, Decorator, and Proxy use delegation for different purposes?
    4. When two routers share MemoryAssignmentPort backed by ArrayList, what are the risks of concurrent writes and lifecycle management?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Tracing the delegation process | Describe the sequence validate → classify → assign → return Assignment from a sequence diagram or TicketRouter code. |
    | Defining delegate contracts | List valid inputs/outputs, null behavior, failures, and required durability guarantees for AssignmentPort. |
    | Testing interactions | Use RecordingAssignments to verify that the router calls the correct delegate in the right order and does not call assign when the classifier fails. |
    | Evaluating intermediate classes | Compare TicketRouter with BareRouter and explain when a forwarding layer adds real value. |
- id: composition-004
  title: Reuse Through Composition and Inheritance
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Reuse Through Composition and Inheritance**

    This lesson compares two reuse strategies in the same report-generation and distribution scenario. `AbstractReport` provides a rendering framework and a buildBody hook for subtypes with a genuine is-a relationship; `ReportPublisher` composes `Formatter` and `Destination` when formatting and output destinations vary independently. Learners avoid bloated class hierarchies, apply LSP, use Strategy/Decorator appropriately, and test with fakes while considering shared state, exceptions, and concurrency.

    ## 2. Questions Learners Should Be Able to Answer

    ### Comparing Two Reuse Mechanisms

    1. In the AbstractReport/SalesReport approach, which parts are inherited and which hook is overridden?
    2. In the ReportPublisher approach, which combinations arise when Formatter and Destination vary independently?
    3. Why does inheritance suit is-a relationships and stable contracts yet risk coupling when multiple dimensions of variation intersect?
    4. Does the principle of composition over inheritance prohibit extends in every case?

    ### Extension and Verification

    1. How does the Bird/Penguin relationship violate the fly contract, and how does this relate to LSP?
    2. How does Strategy selecting an algorithm differ from Decorator wrapping additional behavior in the reporting system?
    3. Why does ReportPublisher holding final Formatter/Destination references not automatically ensure that its collaborators can be shared safely across threads?
    4. If Formatter throws an exception or Destination writes only part of the output before failing, what can Publisher guarantee on its own, and what can it not guarantee?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Choosing a reuse approach | Compare AbstractReport and ReportPublisher designs by is-a relationships, variation dimensions, code-change costs, and substitutability. |
    | Detecting incorrect hierarchies | Explain why a hierarchy combining formatting classes × output channels can grow excessively, and propose separate Formatter/Destination components. |
    | Designing Strategy/Decorator | Combine MarkdownFormatter with MemoryArchive or LoggingDestination without changing ReportPublisher. |
    | Verifying boundaries | Write or analyze fake Formatter/Destination components to verify the format → deliver order and the effects of a failed step. |
- id: composition-005
  title: Replacing Collaborators at Runtime
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Replacing Collaborators at Runtime**

    This lesson examines replacing a collaborator while the program continues running. `CheckoutService` uses the `DiscountPolicy` contract to switch among no discount, VIP discounts, and promotions without recreating the service; this differs from mutating a policy's own state. Learners distinguish selecting a policy once in the constructor, replacing it through a method, and passing one with each request while preserving the contract, consistent results within each checkout, and safety when multiple threads share the service.

    ## 2. Questions Learners Should Be Able to Answer

    ### Replacing References and Choosing Scope

    1. Why does a field of type DiscountPolicy allow the same CheckoutService to use NoDiscount and PercentageDiscount?
    2. How does replacing a collaborator with a new object differ from changing properties on the same shared collaborator?
    3. When are the three approaches of a fixed constructor dependency, runtime setter replacement, and per-request policy parameters appropriate?
    4. Why might a singleton with a shared setter for customer-specific policies apply another customer's discount?

    ### Correctness During Hot Swaps

    1. How does capturing DiscountPolicy in a local variable at the start of checkout keep discount() and code() consistent?
    2. Which reference-replacement and visibility issues do AtomicReference.get/set address, and which business coordination responsibilities do they not replace?
    3. Why must the old Gateway not be closed immediately after a swap if earlier requests are still using it?
    4. Which conditions for discount values, VND units, and error behavior must every new implementation satisfy?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Swapping policies | Predict the amount and policy code on Receipt before and after calls to setDiscountPolicy. |
    | Choosing collaborator scope | Analyze global configuration, user-session, and per-request cases to recommend a constructor, setter, or parameter. |
    | Maintaining consistent snapshots | Explain capturing one DiscountPolicy per checkout and AtomicReference's role during concurrent updates. |
    | Checking contracts and lifecycles | Identify faulty policies that return negative discounts or discounts exceeding the subtotal, and the risk of closing a collaborator still in flight. |
- id: composition-006
  title: Constructor or Method Dependency Injection
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Constructor or Method Dependency Injection**

    This lesson demonstrates dependency injection in plain Java: supplying collaborators externally instead of hard-coding `new` inside a domain class. `OrderNotifier` receives the required `NotificationSender` through its constructor; `AlertService` receives a sender through a method so it can change on each call. Learners compare constructor, method-parameter, and setter injection; distinguish DI, DIP, and IoC; use interfaces appropriately; and avoid null, hidden dependency creation, or closing resources they do not own.

    ## 2. Questions Learners Should Be Able to Answer

    ### Ways to Supply Dependencies

    1. Why does OrderNotifier creating EmailSender with new make it harder to replace the implementation and write fakes?
    2. When should NotificationSender be passed to the constructor and held in a final field throughout the service lifecycle?
    3. When is a method parameter the appropriate place to supply a request-specific dependency?
    4. How does setter injection differ from method-parameter injection in storing state and when readiness is checked?

    ### Designing Abstractions and Understanding Limits

    1. How does Dependency Injection differ from the Dependency Inversion Principle and Inversion of Control?
    2. Why can accepting the NotificationSender interface reduce coupling to implementations without requiring an interface for every class?
    3. Why does supplying a sender through the constructor and then creating another with new inside notifyPaid defeat the intent of DI?
    4. Does constructor injection automatically guarantee thread safety or transfer resource ownership to the service?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Implementing constructor injection | Analyze or create OrderNotifier with a required sender, Objects.requireNonNull, and correct use of the supplied dependency. |
    | Choosing method injection | Design AlertService to send email/SMS with a sender parameter on each call. |
    | Substituting fakes in tests | Use RecordingSender to verify content, recipient, and call counts without sending real notifications. |
    | Distinguishing principles | Explain DI, DIP, and IoC through the relationships among the notifier, abstraction, and composition root. |
- id: composition-007
  title: Ownership and Lifecycle of Contained Objects
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Ownership and Lifecycle of Contained Objects**

    This lesson clarifies three often-confused concepts: ownership in a domain model, access paths through Java references, and responsibility for closing system resources. `Order` manages `Line` through a line-adding API and a read-only list to protect invariants; the example of `CsvExporter` opening its own `BufferedWriter` shows that the owner must close the resource using AutoCloseable/try-with-resources. Learners understand why GC does not replace cleanup and why `private final` or List.copyOf may be insufficient when elements remain mutable.

    ## 2. Questions Learners Should Be Able to Answer

    ### Ownership and Data Protection

    1. How does ownership of a component in the Order/Line model differ from multiple variables holding references to one instance?
    2. Why must Order expose addLine for adding lines instead of directly returning its internal mutable List?
    3. What does List.copyOf protect about a list, and what risks remain if its Line elements or objects supplied by callers are still mutable?
    4. When should a component be shared, and when should it be created or controlled by its owner?

    ### Domain and Resource Lifecycles

    1. When an object is removed from Order, does the JVM immediately reclaim its memory, and why?
    2. In the example where CsvExporter opens BufferedWriter itself, who must call close, and why should try-with-resources be used?
    3. If a caller injects a writer into a service as a shared resource, may that service close it on its own?
    4. Why do final fields and the garbage collector not replace a strategy for managing aliases and cleanup?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Designing ownership | Define who creates, modifies, shares, removes, and closes Order/Line components or collaborators. |
    | Preserving aggregate invariants | Analyze a getter that exposes a mutable List and fix it with immutable value objects, copies, or a restricted API. |
    | Distinguishing lifecycles | Explain the difference between removing a component relationship in the domain and the conditions for GC of an object on the heap. |
    | Cleaning up resources responsibly | Design an AutoCloseable owner using try-with-resources and compare owned resources with borrowed ones. |
- id: composition-008
  title: Refactoring Inheritance to Composition
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Refactoring Inheritance to Composition**

    This lesson guides a controlled architectural refactoring when the domain class `OrderService` extends the storage class `OrderStore` solely to reuse save/find. In the new design, `OrderRepository`, supplied through the constructor, handles storage, while the service retains its domain API and delegates to the repository. Learners must do more than replace extends with a field: they need to inventory callers and subtype assignments, document behavior and errors, migrate incrementally, write fake/integration tests, and handle API changes before removing inheritance.

    ## 2. Questions Learners Should Be Able to Answer

    ### Evaluating the Current Inheritance Relationship

    1. Why is OrderService extends OrderStore an incorrect is-a relationship, and which infrastructure methods does it expose?
    2. How does the new design separate responsibilities among OrderService, OrderRepository, and InMemoryOrderRepository?
    3. Which call replaces super.save through composition + delegation while preserving domain responsibilities?
    4. When should inheritance be retained because a subclass is a valid subtype or a framework provides clear inheritance hooks?

    ### Migration Planning and Testing

    1. Before removing extends, which assignments of OrderService to OrderStore variables and which callers using inherited methods must be reviewed?
    2. Which inputs, exceptions, call ordering, transactions, and side effects must be recorded to preserve behavior?
    3. Why can a fake repository demonstrate service interactions without proving the transactions and persistence of the real adapter?
    4. When replacing protected hooks or inherited state, how should responsibilities be moved and invariants preserved?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Detecting inheritance used for code reuse | Identify signs of coupling and misplaced API responsibilities in OrderService extends OrderStore. |
    | Designing the composition version | Sketch OrderRepository, its in-memory implementation, and OrderService receiving the repository through its constructor. |
    | Planning migration | List caller/subtype uses, contracts, and incremental migration steps before removing extends. |
    | Verifying behavior | Design tests for valid/invalid orders, save call counts, stored data, and required integration cases. |
