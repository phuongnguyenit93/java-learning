version: 1
type: LEARNING_ROADMAP
title: COMPOSITION — LESSON CONNECTIONS
roadmapHeading: Learning Path Connections
roadmap:
- id: composition-001
  order: 1
  title: Composing Objects to Build Behavior
  description: Design a larger behavior by assembling a formatter, a transport, and a coordinating object; observe delegation and test boundaries.
  transition:
    to: composition-002
    description: '**From building behavior with components → choosing the right relationship types and levels of component ownership.**'
- id: composition-002
  order: 2
  title: Has-A and Is-A Relationships
  description: Identify is-a and has-a relationships and levels of ownership in the associations among Car, Vehicle, and PowerSource, or between Order and OrderLine.
  transition:
    to: composition-003
    description: '**From has-a/is-a relationships → examining exactly what work crosses each boundary and who is responsible for errors.**'
- id: composition-003
  order: 3
  title: Delegating Work to Other Objects
  description: Trace the contracts and call path TicketRouter → TicketClassifier → AssignmentPort, preserving responsibility for results and errors.
  transition:
    to: composition-004
    description: '**From delegation call paths → comparing reuse through subclasses with assembling multiple collaborators.**'
- id: composition-004
  order: 4
  title: Reuse Through Composition and Inheritance
  description: Compare the AbstractReport inheritance framework with ReportPublisher composed of Formatter/Destination to choose based on independent dimensions of change.
  transition:
    to: composition-005
    description: '**From reuse choices → examining cases where a collaborator must change while a service is running.**'
- id: composition-005
  order: 5
  title: Replacing Collaborators at Runtime
  description: Practice replacing DiscountPolicy at runtime and evaluate per-call consistency, visibility across threads, and collaborator lifecycles.
  transition:
    to: composition-006
    description: '**From replacing collaborators → designing how dependencies are supplied and scoped in Java.**'
- id: composition-006
  order: 6
  title: Constructor or Method Dependency Injection
  description: Supply dependencies through constructors or method parameters to avoid hard-coding implementations and make it easy to inject test fakes.
  transition:
    to: composition-007
    description: '**From dependency injection approaches → clarifying who actually owns state and resources and who is responsible for cleanup.**'
- id: composition-007
  order: 7
  title: Ownership and Lifecycle of Contained Objects
  description: Establish ownership of state and resources, prevent mutable aliasing, and close writers/sockets according to AutoCloseable.
  transition:
    to: composition-008
    description: '**From defined contracts and lifecycles → practicing a verified conversion of an incorrect hierarchy to composition.**'
- id: composition-008
  order: 8
  title: Refactoring Inheritance to Composition
  description: Refactor OrderService from inheriting OrderStore to using OrderRepository, inventory callers, and preserve contracts through tests.
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Composing Objects to Build Behavior | Has-A and Is-A Relationships | Delegating Work to Other Objects | Reuse Through Composition and Inheritance | Replacing Collaborators at Runtime | Constructor or Method Dependency Injection | Ownership and Lifecycle of Contained Objects | Refactoring Inheritance to Composition |
  | Key question | How do collaborating objects produce larger behaviors? | Which relationships are is-a, has-a, associations, or strong ownership? | Who delegates, who performs the work, and who is responsible for the result? | Should reuse rely on extends or assembling roles? | How can a collaborator change at runtime while preserving consistency? | At what scope should an external collaborator be supplied? | Who manages state and closes contained resources? | How can extends be removed without breaking clients or contracts? |
  | Value for OOP/the module | Separate responsibilities and easily replace the formatter/transport. | Model relationships correctly and preserve subtype contracts. | Give collaboration APIs clear control and error flows. | Avoid class hierarchy explosion when variants change independently. | Switch policies and control concurrent requests. | Reduce coupling and test without sending real notifications. | Preserve invariants and avoid file/connection leaks. | Improve the separation of domain logic and persistence and make testing easier. |
  | Mindset developed | Coordinate objects through interfaces/fields. | Choose relationships based on contracts and lifecycles. | Think in terms of call flow and responsibility. | Evaluate dimensions of change before choosing reuse. | Distinguish per-call snapshots from mutable global state. | Determine whether a dependency is mandatory or task-specific. | Define owners and access rights before coding. | Refactor incrementally based on observable behavior. |
