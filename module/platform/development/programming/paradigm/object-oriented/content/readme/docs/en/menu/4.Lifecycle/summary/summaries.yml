summaries:
- id: lifecycle-001
  title: Object Creation and Resource Allocation
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Object Creation and Resource Allocation**

    Recognize that Java objects, reference variables, and resources outside the JVM are created, used, and disposed of in different ways. This lesson helps you predict the consequences of `new`, alias assignments, opening files, and transferring resource ownership before designing classes with safe lifecycles.

    ## 2. Questions Learners Should Be Able to Answer

    ### Object Creation and Initial State

    1. Given the variables `first`, `alias`, and `second`, how can you determine how many objects are created and which assignments merely copy references?
    2. When `new` executes, how do instance fields receive default values and then initialization through initializers and constructors? Why can't the heap/stack model establish absolute physical memory locations?

    ### Resource Lifecycles and Error Prevention

    1. Why is `reader = null` or a call to `System.gc()` insufficient to close a file, even if the object becomes eligible for GC?
    2. If `try-with-resources` encounters failures both in the `try` body and during `close()`, how are the primary exception, suppressed exceptions, and closing order determined?
    3. If a constructor opens a resource and then throws an exception, or a `static` registry retains a listener, how should ownership and references be handled?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Analyze references and instances | Predict `==` results, aliases, and state changes in a `Customer` example with two instances and three reference variables. |
    | Explain initialization steps | Distinguish object allocation, default field values, initializers, and constructors from unassigned local variables. |
    | Distinguish heap and non-heap resources | Identify which parts of a file-reading scenario are handled by GC and which require timely calls to `close()`. |
    | Use try-with-resources | Write file-reading code that closes the stream automatically and handles temporary-file deletion separately; explain suppressed exceptions. |
    | Analyze reachable objects | Identify why aliases, caches, or long-lived registries can retain objects and how to remove references that are no longer needed. |
- id: lifecycle-002
  title: Constructors and Establishing Valid State
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Constructors and Establishing Valid State**

    Design constructors that preserve class invariants as soon as initialization succeeds instead of leaving objects in a temporarily invalid state. This lesson uses capacity constraints, unique email addresses, defensive copying, `final`, and compact constructors for `record` types to validate data consistency.

    ## 2. Questions Learners Should Be Able to Answer

    ### Invariants and Input Validation

    1. How can you derive invariants for `CourseEnrollment` from the course code, capacity, and email list, then organize validation before assigning fields?
    2. Why must every constructor overload and object-creation method enforce the same invariant-protection rules?

    ### State Protection and Initialization Failures

    1. If a caller modifies a `List` passed to a constructor, how does retaining that list differ from using `List.copyOf()`, and where do the limits of shallow copying arise?
    2. When a constructor throws `IllegalArgumentException`, what happens to the caller's assignment and any earlier side effects outside the JVM?
    3. Why do `final`, `record`, and data validation still not make it safe to publish `this` before initialization finishes?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Define invariants | List valid and invalid course-enrollment states and design appropriate validation. |
    | Check multiple initialization paths | Explain how two-argument and three-argument constructors and `withStudent()` all reject excess capacity or duplicate email addresses. |
    | Protect mutable data | Analyze or fix a class that retains an input list by using defensive copies and avoiding exposure of mutable collections. |
    | Evaluate immutability | Distinguish `private final`, immutable collections, and the possibility that their contained elements remain mutable. |
    | Predict constructor failures | Explain successful and failed object creation and identify side effects or `this` escape that are not automatically rolled back. |
- id: lifecycle-003
  title: Default, Parameterized, and Overloaded Constructors
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Default, Parameterized, and Overloaded Constructors**

    Distinguish compiler-generated default constructors, explicitly written no-arg constructors, parameterized constructors, and overloads. This lesson helps you choose readable creation APIs, ensure `final` fields and invariants through `this(...)`/`super(...)`, and resolve compilation errors caused by incompatible constructor signatures.

    ## 2. Questions Learners Should Be Able to Answer

    ### Constructor Types and Overloading

    1. Under what conditions does the compiler generate a default constructor, and why does declaring `Ticket(int)` make `new Ticket()` invalid unless a no-arg constructor is written?
    2. How does Java resolve overloads from argument lists, and when can `null` or multiple reference-type signatures make a call ambiguous?

    ### Constructor Chaining and API Design

    1. How does `this(...)` differ from `super(...)`? Why must a subclass constructor be able to invoke a suitable superclass constructor, and why are circular `this(...)` chains forbidden?
    2. When do overloads become hard to read, making a named static factory or Builder preferable to multiple parameters of the same type?
    3. Why is calling a setter after creation not equivalent to rerunning the constructor, and how must `final` fields be assigned on every initialization path?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Diagnose default/no-arg behavior | Predict which `new` expressions compile or fail after a parameterized constructor is added. |
    | Design valid overloads | Write clear overloads and detect ambiguous signature pairs when `null` is passed. |
    | Coordinate constructor chaining | Trace `this(...)` and `super(...)` calls and identify where shared invariants are checked. |
    | Ensure field initialization | Fix examples that accidentally assign a parameter to itself or omit an assignment to a `final` field. |
    | Choose an appropriate creation API | Explain, through scenarios, when a constructor, named static factory, or Builder makes a call clearer. |
- id: lifecycle-004
  title: Initialization Order in Inheritance
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Initialization Order in Inheritance**

    Predict the actual initialization order when a subclass extends a superclass, including `static` initializers, instance fields, initialization blocks, and constructors. This lesson helps you trace output, fix `super(...)` errors, and avoid calling overridden methods while subclass state still holds default values.

    ## 2. Questions Learners Should Be Able to Answer

    ### Superclass and Subclass Initialization Sequence

    1. On the first and second executions of `new Child()`, which `static` parts of Parent/Child and which instance parts run, and in what source-code order?
    2. Why does `new Child()` create one Child object containing inherited state rather than a separate additional Parent instance?

    ### Constructor Chaining and Initialization Failures

    1. What happens when a superclass has only a parameterized constructor, but the subclass does not call `super(argument)`?
    2. Why can an override in a subclass, invoked from a superclass constructor, observe `0`/`null` even though the subclass declares a different field initializer?
    3. If initialization fails partway through a constructor chain, which code has already run, and why must the object not be considered successfully initialized?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Trace initialization | Produce a correctly ordered log of `static` initialization, instance initializers, and constructors across two creations of an inherited object. |
    | Distinguish class/instance initialization | Explain why `static` initialization normally runs once per class initialization, while instance initialization runs on every `new`. |
    | Fix superclass constructor calls | Choose a valid `super(...)` when the superclass has no accessible no-arg constructor, and explain the compilation error. |
    | Analyze early dynamic dispatch | Predict subclass field values when an override runs from a superclass constructor, and fix the design with a non-overridable helper. |
    | Evaluate multilevel chains | Trace initialization from the ancestor to the concrete class without assuming multiple separate instances are created. |
- id: lifecycle-005
  title: Static Factory Methods, Factories, and Builders
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Static Factory Methods, Factories, and Builders**

    Choose an object-creation mechanism based on API requirements: a direct constructor, a named static factory, a Factory that selects an implementation, or a Builder that configures many options. This lesson distinguishes Simple Factory from the Factory Method pattern and covers returning an existing object, a Spring-managed bean, or a protected copy.

    ## 2. Questions Learners Should Be Able to Answer

    ### Object-Creation Mechanisms

    1. Why do `Temperature.celsius(...)` and `fahrenheit(...)` convey meaning more clearly than two constructors with the same parameter-type list?
    2. Must a static factory create a new instance, and how does it differ from a separate Factory and an overridable Factory Method pattern?

    ### Builder Design and Integration

    1. At which steps does a mutable Builder collect values? When `build()` is called, how should lists be validated and copied so later Builder changes do not modify the resulting object?
    2. In which scenarios would you choose a constructor, a factory that selects a `Notifier` by channel, or a Builder for `SearchRequest`, and what are the design costs of each?
    3. Why should a Spring application avoid indiscriminately using `new` for services that require injection/proxies, and how does a factory that selects an existing bean differ from creating a new object?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Choose a creation pattern | Match scenarios involving two temperature units, notification-channel selection, and many optional parameters to suitable creation methods. |
    | Distinguish Factory terminology | Explain in code the roles of a static factory, Simple Factory, and a subclass-based Factory Method. |
    | Design a validated Builder | Build a fluent `builder(...).page(...).addTag(...).build()` flow with validation and a copy of the collection in the result. |
    | Control identity and sharing | Analyze factory APIs that return cached versus new instances without misusing `==` for value comparisons. |
    | Identify integration limitations | Recognize that Builders are not inherently thread-safe and that factories can select managed Spring beans rather than recreate services. |
- id: lifecycle-006
  title: Object Lifetime, Reachability, and Memory Reclamation
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Object Lifetime, Reachability, and Memory Reclamation**

    Understand object lifetime through reference paths from GC roots rather than confusing variable scope with the moment of garbage collection. This lesson shows how to analyze strong/weak/soft/phantom references, caches, listeners, `ThreadLocal`, reference cycles, and heap dumps to identify objects retained too long.

    ## 2. Questions Learners Should Be Able to Answer

    ### Reachability and Lifetime

    1. Why are `a = null`, leaving scope, and GC reclaiming memory three separate events, and how does an alias or `static` registry affect the object?
    2. How do GC roots and the object graph determine reachability, and why can two objects referencing only each other still be collected when no root path reaches them?

    ### Special References and Diagnostics

    1. What is the difference between strong, soft, weak, and phantom references, and why does `WeakReference.get()` have no predetermined result after a strong reference is removed?
    2. Through what reference paths can an unbounded cache, a listener that was never unregistered, or a `ThreadLocal` in a thread pool cause retention?
    3. When heap usage grows over time, how can you use a heap dump, retained-object graph, and GC roots to find what retains objects instead of relying on `System.gc()`?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Draw reference graphs | Identify which objects remain reachable through aliases, collections, or static fields after each assignment/removal. |
    | Distinguish lifecycle stages | Explain why being eligible for GC, having memory reclaimed, and having a resource closed are independent states. |
    | Analyze weak references | Predict possible `WeakReference` outcomes without assuming a fixed GC schedule. |
    | Detect excessive retention | Identify and propose ways to eliminate retention through caches, listeners, or `ThreadLocal` values associated with long-lived threads. |
    | Investigate memory leaks | Propose a process using heap dumps and GC-root paths to verify what is retaining objects. |
- id: lifecycle-007
  title: Garbage Collection and Manual Memory Management
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Garbage Collection and Manual Memory Management**

    Distinguish GC's automatic reclamation of Java object memory from the application's responsibility for managing native memory and OS resources. This lesson introduces reachability, GC phases at a conceptual level, misconceptions about `System.gc()`/`finalize()`, FFM `Arena` in JDK 22+, and tools for observing heap, metaspace, and off-heap memory.

    ## 2. Questions Learners Should Be Able to Answer

    ### Memory-Management Mechanisms

    1. Why can GC reclaim a cycle of unreachable objects but not a cache that remains referenced even after its data is no longer useful?
    2. At a conceptual level, how does GC find live objects, reclaim memory, and potentially move objects? Why should you not infer GC scheduling from `System.gc()`?

    ### Heap, Native Memory, and Investigation

    1. How do the management mechanisms differ for the Java heap, stack, metaspace, direct/native memory, and file descriptors?
    2. In JDK 22+, how does the lifetime of memory allocated through `Arena.ofConfined()` and `Arena.close()` differ from that of ordinary heap objects?
    3. When you encounter `Java heap space`, `Metaspace`, direct-buffer errors, or growing process RSS, which metrics and tools should you use to narrow down the cause instead of assuming a heap leak?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Explain the scope of GC | Identify which memory GC can reclaim and which resources must be closed or released according to API contracts. |
    | Analyze retained memory | Use a cache or root graph to explain why retained heap memory may not shrink despite frequent GC. |
    | Recognize API limitations | Distinguish `System.gc()` as a hint, `finalize()` as unreliable, and `Arena` as requiring JDK 22 or later. |
    | Classify memory problems | Distinguish heap pressure, class-loader/metaspace problems, direct-buffer issues, and native thread/resource issues from their symptoms. |
    | Design diagnostic steps | Choose GC logs, `jcmd`, JFR, NMT, or heap dumps based on what needs to be demonstrated. |
- id: lifecycle-008
  title: Resource Cleanup and the Limits of Finalizers
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Resource Cleanup and the Limits of Finalizers**

    Close clearly owned resources such as streams, JDBC connections, and sockets at the right time. This lesson explains `AutoCloseable`/`Closeable`, try-with-resources, reverse closing order, suppressed exceptions, and why `finalize()` or `Cleaner` cannot replace `close()`.

    ## 2. Questions Learners Should Be Able to Answer

    ### Resource Closing and Exceptions

    1. Why can an unreachable Java object still leave a file descriptor or JDBC connection open, even when GC runs?
    2. With `try (A a = ...; B b = ...)`, in what order are resources closed if the `try` body throws an exception or initialization of B fails?
    3. If both the main operation and `close()` fail, when is an exception suppressed, and how should `getSuppressed()` be examined?

    ### Ownership Contracts and Limitations

    1. How do `AutoCloseable` and `Closeable` differ in their exception contracts and guarantees about repeated closing?
    2. When given a borrowed reader or a pooled `Connection`, who is allowed to close it, and what does `close()` mean?
    3. Why can't `finalize()`, `Cleaner`, and `System.gc()` guarantee timely cleanup, and what state and thread-safety concerns must a custom `AutoCloseable` class address?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Write safe resource scopes | Organize `try-with-resources` for files or nested JDBC resources according to ownership. |
    | Predict cleanup order | Determine reverse closing order and how already-open resources are closed if a later declaration throws an exception. |
    | Analyze simultaneous failures | Identify the primary and suppressed exceptions in an example where both processing and closing fail. |
    | Design closing contracts | Distinguish `AutoCloseable`, `Closeable`, and idempotence, and prevent use of resources after closing. |
    | Evaluate ownership responsibilities | Determine when to close, merely borrow, or return a connection to a pool without confusing these actions with GC/finalization. |
- id: lifecycle-009
  title: Preventing Use of Partially Initialized Objects
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Preventing Use of Partially Initialized Objects**

    Detect and prevent `this` references from escaping constructors before object state is ready, including through synchronous callbacks and overridden methods invoked by superclasses. This lesson connects constructor exceptions, thread starts, the Java Memory Model, final-field semantics, and safe publication to the design of factories that register or activate objects only after creation is complete.

    ## 2. Questions Learners Should Be Able to Answer

    ### Detecting Premature Object Use

    1. Which actions, such as registering listeners, storing `this` in a registry, passing a lambda, or starting a thread in a constructor, can expose an object before initialization is complete?
    2. Why can an immediately invoked registration callback or subclass override called by a superclass constructor read `null`/`0` field values despite declared field initializers or `final`?

    ### Safe Publication and Error Handling

    1. Why can a constructor that throws after storing `this` in a registry leave behind a partially initialized object, and how should post-construction registration handle failures?
    2. What happens-before relationships are established by `Thread.start()` and `volatile` writes/reads, and why do later mutable changes still require synchronization?
    3. What do final-field semantics support, and what do they not guarantee when objects or nested collections are mutable?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Identify this escape | Locate places where constructors publish `this` through listeners, static collections, callbacks, or tasks. |
    | Trace early initialization failures | Predict `null`, `0`, or exceptions when a callback/override executes before subclass initializers. |
    | Design safe factories | Move register/start operations until after the constructor returns successfully, and describe cleanup if registration fails. |
    | Explain safe publication | Analyze happens-before relationships established by `Thread.start()` or volatile operations and their limits for mutable state. |
    | Verify final-field contracts | Explain why `final` fields cannot prevent `this escape` or guarantee deep immutability. |
