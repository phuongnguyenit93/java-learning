version: 1
type: LEARNING_ROADMAP
title: MÔ HÌNH HÓA — LIÊN KẾT BÀI HỌC
roadmapHeading: Mạch liên kết bài học
roadmap:
- id: modeling-001
  order: 1
  title: Thu thập tình huống sử dụng và quy tắc nghiệp vụ
  description: Thu thập actor/use case, rule có BR-ID và phản ví dụ để tìm invariant trước khi thiết kế lớp.
  transition:
    to: modeling-002
    description: '**Từ biết mục tiêu và quy tắc → nhận diện các đối tượng có danh tính, vòng đời và trách nhiệm phù hợp**'
- id: modeling-002
  order: 2
  title: Nhận diện đối tượng từ yêu cầu
  description: Từ mô tả thư viện nhận diện entity, value object, policy và service; tách đối tượng theo danh tính, trách nhiệm, vòng đời.
  transition:
    to: modeling-003
    description: '**Từ danh sách đối tượng ứng viên → xác định chủ sở hữu của mỗi invariant và những người cộng tác**'
- id: modeling-003
  order: 3
  title: Phân chia trách nhiệm và đối tượng cộng tác
  description: Phân công trách nhiệm và xác định thông điệp cộng tác giữa `Member`, `BookCopy`, `Loan` và `LendingService`.
  transition:
    to: modeling-004
    description: '**Từ phân công trách nhiệm → diễn tập qua các thẻ CRC để kiểm tra các kịch bản và chỗ thiếu nghĩa vụ**'
- id: modeling-004
  order: 4
  title: 'Thẻ CRC: lớp, trách nhiệm và cộng tác'
  description: Role-play bằng thẻ CRC, phát hiện thiếu hoặc trùng trách nhiệm, rồi chuyển sang API/UML/test.
  transition:
    to: modeling-005
    description: '**Từ thẻ trách nhiệm → mô tả cấu trúc class, API, quan hệ và bội số bằng ký pháp rõ ràng**'
- id: modeling-005
  order: 5
  title: 'Sơ đồ lớp: thành viên và quan hệ'
  description: 'Biểu diễn cấu trúc tĩnh và ownership bằng UML class diagram: thành viên, quan hệ, bội số và hướng phụ thuộc.'
  transition:
    to: modeling-006
    description: '**Từ cấu trúc ở mức lớp → kiểm tra đồ thị các instance cụ thể tại một thời điểm**'
- id: modeling-006
  order: 6
  title: 'Sơ đồ đối tượng: các thể hiện tại một thời điểm'
  description: Xem snapshot t0/t1 của các object và link cụ thể, nhận ra aliasing và khác biệt với class diagram.
  transition:
    to: modeling-007
    description: '**Từ snapshot các object → theo dõi thông điệp giữa chúng trong một scenario**'
- id: modeling-007
  order: 7
  title: 'Sơ đồ tuần tự: thứ tự tương tác'
  description: Mô tả thứ tự lời gọi giữa các participant, các nhánh lỗi và thời điểm có side effect bằng sequence diagram.
  transition:
    to: modeling-008
    description: '**Từ thứ tự tương tác → làm rõ sự kiện nào được phép đổi trạng thái của một đối tượng**'
- id: modeling-008
  order: 8
  title: 'Sơ đồ trạng thái: chuyển trạng thái hợp lệ'
  description: Định nghĩa event, guard và transition hợp lệ cho một object theo vòng đời, từ chối cạnh sai mà không đổi state.
  transition:
    to: modeling-009
    description: '**Từ các sơ đồ thiết kế → đối chiếu implementation, test và nghiệp vụ thực tế để phát hiện sai lệch**'
- id: modeling-009
  order: 9
  title: Đối chiếu mô hình với mã và tình huống thực tế
  description: Đối chiếu yêu cầu, mô hình, Java, test và dữ liệu chạy; bảo đảm business rule tiếp tục đúng khi đổi mã hoặc môi trường.
  transition: null
comparisonMarkdown: |-
  ## 2. Bảng đối chiếu các bài học

  | Tiêu chí | Bài 1 | Bài 2 | Bài 3 | Bài 4 | Bài 5 | Bài 6 | Bài 7 | Bài 8 | Bài 9 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Tên | Thu thập tình huống sử dụng và quy tắc nghiệp vụ | Nhận diện đối tượng từ yêu cầu | Phân chia trách nhiệm và đối tượng cộng tác | Thẻ CRC: lớp, trách nhiệm và cộng tác | Sơ đồ lớp: thành viên và quan hệ | Sơ đồ đối tượng: các thể hiện tại một thời điểm | Sơ đồ tuần tự: thứ tự tương tác | Sơ đồ trạng thái: chuyển trạng thái hợp lệ | Đối chiếu mô hình với mã và tình huống thực tế |
  | Vấn đề cần hiểu | Ai đạt mục tiêu gì theo điều kiện nào? | Khái niệm nào xứng đáng thành object? | Đối tượng nào sở hữu rule và nhờ ai? | Diễn tập trách nhiệm qua thẻ thế nào? | Lớp có thành viên/quan hệ/bội số gì? | Instance/link nào đang tồn tại tại t0/t1? | Ai gọi ai, theo thứ tự nào? | Event nào cho phép đổi state? | Mô hình và code có thực thi đúng BR? |
  | Giá trị đối với OOP/module | Xác lập use case, invariant, acceptance criteria | Phân biệt entity/VO/service và vòng đời | Giữ logic đúng owner và luồng cộng tác | Kiểm tra phân vai bằng role-play | Làm rõ cấu trúc và quyền sở hữu | Minh họa aliasing và snapshot | Ngăn side effect sai thứ tự | Bảo vệ chuyển trạng thái nghiệp vụ | Truy vết rule qua API, test và persistence |
  | Tư duy hình thành | Phỏng vấn và biến yêu cầu mơ hồ thành luật kiểm chứng được | Phản biện class ứng viên bằng danh tính và trách nhiệm | Giao việc nơi có thông tin, giảm coupling | Thử các luồng và sửa thẻ trước khi code | Đọc ký pháp, bội số và chọn đúng quan hệ | Phân biệt loại, instance và dữ liệu tại một thời điểm | Xét thứ tự message và nhánh thất bại | Xét trạng thái, event, guard, effect | Kiểm chứng hai chiều và cập nhật đồng bộ theo thay đổi |
