version: 1
type: LEARNING_ROADMAP
title: DESIGN PATTERNS — LESSON CONNECTIONS
roadmapHeading: How the Lessons Connect
roadmap:
- id: design-patterns-001
  order: 1
  title: 'Design Patterns: Problems, Context, and Trade-offs'
  description: Describe a pattern through its problem, context, constraints, and trade-offs; compare switch and Strategy in checkout before choosing an abstraction.
  transition:
    to: design-patterns-002
    description: '**From weighing problems and trade-offs → choosing an object-creation technique based on actual variation.**'
- id: design-patterns-002
  order: 2
  title: Factory Method and Abstract Factory
  description: Separate Product creation decisions through Creator subclasses or an Abstract Factory for a consistent family of Light/Dark UI products.
  transition:
    to: design-patterns-003
    description: '**From factories selecting classes or product families → examining how to configure complex objects and preserve initialization invariants.**'
- id: design-patterns-003
  order: 3
  title: Builder and Complex Object Creation
  description: Organize the creation of an Order with many fields using a fluent Builder, validating invariants at build() and taking data snapshots.
  transition:
    to: design-patterns-004
    description: '**From robust object initialization → evaluating shared-instance lifecycles and mutable-state risks.**'
- id: design-patterns-004
  order: 4
  title: Singleton and the Risks of Shared State
  description: Manage a single instance within a defined scope; distinguish initialization from thread safety, Spring scopes, and dependency injection.
  transition:
    to: design-patterns-005
    description: '**From object ownership and lifecycles → moving to SDK integration boundaries with different contracts.**'
- id: design-patterns-005
  order: 5
  title: Adapter and Integrating Different Interfaces
  description: Translate signatures, currency data, statuses, and errors from a legacy SDK into the application's own PaymentGateway contract.
  transition:
    to: design-patterns-006
    description: '**From adapting contracts with Adapter → preserving an interface while wrapping it with additional behavior.**'
- id: design-patterns-006
  order: 6
  title: Decorator and Adding Behavior
  description: Add prefixes, length limits, and metrics to MessageChannel through wrappers that retain the same interface, while accounting for ordering and errors.
  transition:
    to: design-patterns-007
    description: '**From chains of wrappers around a component → simplifying multiple subsystems with a high-level entry point.**'
- id: design-patterns-007
  order: 7
  title: Facade and Simplifying Client Usage
  description: Combine quoting steps across Catalog, Inventory, Discount, and Shipping into a clear, testable quote API.
  transition:
    to: design-patterns-008
    description: '**From a stable high-level API → encapsulating interchangeable algorithms within a workflow.**'
- id: design-patterns-008
  order: 8
  title: Strategy and Interchangeable Algorithms
  description: Swap discount policies using DiscountStrategy implementations through composition, preserving contracts and controlling selection.
  transition:
    to: design-patterns-009
    description: '**From selecting algorithms → exploring behavior changes driven by lifecycle states and valid transitions.**'
- id: design-patterns-009
  order: 9
  title: State and State-Dependent Behavior
  description: Encapsulate behavior according to Order states, enforce the transition matrix, and maintain consistency.
  transition:
    to: design-patterns-010
    description: '**From internal state transitions → notifying multiple interested components without tightly coupling them.**'
- id: design-patterns-010
  order: 10
  title: Observer and Change Notifications
  description: Notify multiple listeners of state changes while managing subscription lifecycles, event order, and transaction boundaries.
  transition:
    to: design-patterns-011
    description: '**From event-driven reactions → examining another kind of coordination: a fixed algorithm skeleton with customizable steps.**'
- id: design-patterns-011
  order: 11
  title: Template Method and Algorithm Skeletons
  description: Keep the report-generation skeleton in final generate(), leaving primitive operations and hooks for subclasses to customize.
  transition:
    to: design-patterns-012
    description: '**From shared algorithm skeletons → encapsulating an individual request as an executable object with recorded history.**'
- id: design-patterns-012
  order: 12
  title: Command and Encapsulating Requests
  description: Turn AddTask/CompleteTask requests into objects with Receiver, Invoker, and history-backed undo/redo.
  transition:
    to: design-patterns-013
    description: '**From flexible ways of organizing behavior → reassessing pattern costs and keeping designs simple when variation is unnecessary.**'
- id: design-patterns-013
  order: 13
  title: When Design Patterns Add Unnecessary Complexity
  description: Weigh extensibility benefits against abstraction costs, avoid God Factories/Facades, and refactor based on observable behavior.
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 | Lesson 9 | Lesson 10 | Lesson 11 | Lesson 12 | Lesson 13 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Design Patterns: Problems, Context, and Trade-offs | Factory Method and Abstract Factory | Builder and Complex Object Creation | Singleton and the Risks of Shared State | Adapter and Integrating Different Interfaces | Decorator and Adding Behavior | Facade and Simplifying Client Usage | Strategy and Interchangeable Algorithms | State and State-Dependent Behavior | Observer and Change Notifications | Template Method and Algorithm Skeletons | Command and Encapsulating Requests | When Design Patterns Add Unnecessary Complexity |
  | Questions to Understand | Why use a pattern? | Create one Product or a whole family? | Create an object with many constraints? | Is one instance safe? | How does the SDK differ from the contract? | Does wrapping behavior depend on order? | Does the client know too many subsystems? | Which algorithm should be interchangeable? | Which state changes are valid? | Who receives events, and when? | Which workflow steps must remain fixed? | Who executes and undoes a command? | Which abstractions are truly worthwhile? |
  | Value for OOP/the Module | Make context-driven decisions | Reduce dependence on concrete object types | Ensure valid, readable initialization | Prevent request-state leaks and races | Protect the domain from vendor APIs | Compose behavior without changing the core | Keep module boundaries concise | Provide contract-driven algorithm polymorphism | Preserve lifecycle invariants | Reduce coupling between publishers and listeners | Reuse a stable algorithm skeleton | Decouple callers from execution | Reduce needless indirection |
  | Mental Model Developed | Understand the problem before naming a pattern | Create the right product or family | Build a complete, valid state | Scope differs from thread safety | Map both meaning and errors | Wrapping order affects behavior | Simplify the client without hiding risks | Give each variation a clear owner | Follow valid transition rules | Publish after changes; manage lifecycles | Stabilize the whole, extend small points | Treat each request as an executable unit | Keep it simple while preserving contracts |
