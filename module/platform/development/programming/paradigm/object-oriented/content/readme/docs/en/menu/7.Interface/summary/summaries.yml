summaries:
- id: interface-001
  title: Interfaces as Contracts and Roles
  summary: |-
    # 0. Learning Orientation
    ## 1. Lesson Purpose
    **Interfaces as Contracts and Roles**

    Treat a Java interface as a promise that clients can rely on and as a role an object can fulfill. Using DeliveryChannel, EmailChannel, and SmsChannel, the lesson demonstrates the benefits of interface reference types while distinguishing compiler checks of method signatures from the behavioral contracts the system itself must uphold. This forms the basis for substituting, testing, and evolving implementations without surprising clients.
    ## 2. Questions Learners Should Be Able to Answer
    ### The Nature of Contracts and Roles
    1. Why can an interface describe the capabilities of classes from different families rather than the identity of each class?
    2. What does DeliveryChannel.deliver(Notice) guarantee at the signature level, and which preconditions, postconditions, errors, or side effects must be specified separately?
    3. If SmsChannel implements both DeliveryChannel and HealthCheck, how many objects do two interface-typed variables refer to, and which methods may each variable call?
    ### Substitutable Behavior and Limitations
    1. Why does BrokenChannel still compile when it returns null, despite violating the contract, and how can that violation be tested?
    2. Why shouldn't a channel without revocation capability be required, through implements, to provide revoke(), and when should roles be separated?
    3. When the meaning of DeliveryReceipt changes or a method is added to a public interface, which clients and implementations might be affected?
    ## 3. Expected Learning Outcomes
    | Competency | Expected outcome |
    | --- | --- |
    | Defining behavioral contracts | Specify input conditions, non-null results, errors, and side effects for DeliveryChannel beyond its Java signature. |
    | Analyzing roles and static types | Explain why one SmsChannel fulfills two roles while channel.isHealthy() is not callable through a DeliveryChannel variable. |
    | Evaluating substitutability | Show that BrokenChannel violates a postcondition despite implementing the correct signature, and propose behavioral tests. |
    | Designing abstractions around needs | Distinguish Sender from Revocable, identifying the API a client actually needs without forcing a class to support unavailable behavior. |
    | Explaining contract evolution | Analyze the risks of changing a receipt's signature or semantics even when code may still compile. |
- id: interface-002
  title: Declaring and Implementing Interfaces
  summary: |-
    # 0. Learning Orientation
    ## 1. Lesson Purpose
    **Declaring and Implementing Interfaces**

    Practice writing valid interfaces and classes that use implements, using ShippingFeePolicy with two shipping-fee policies. The lesson connects syntax rules (public abstract, @Override, signatures, static) with polymorphic execution and verification of implementation obligations, enabling learners to create a new implementation that the shipping-quote service can still use.
    ## 2. Questions Learners Should Be Able to Answer
    ### Declarations and Compile-Time Compatibility
    1. In the Greeter interface, which modifiers are implicit on the bodyless greet method, and why must VietnameseGreeter declare its override public?
    2. What happens when a concrete class omits an abstract method, changes its parameter list, or narrows its access?
    3. Why is new ShippingFeePolicy() invalid, and which name is used to call the static validateInputs method?
    ### Polymorphism and Verifying Shipping-Fee Examples
    1. When ShippingQuoteService receives ShippingFeePolicy through its constructor, how does the JVM choose between EconomyShipping and ExpressShipping for a calculate call?
    2. For a 10 km distance and a 300.000 VND order, explain the Economy fee of 35.000 VND and Express fee of 70.000 VND; what changes when Economy handles a 600.000 VND order?
    3. How can SameDayShipping be added without modifying ShippingQuoteService while retaining negative-input checks and overflow-safe calculations?
    4. Why are shared tests still needed even though both implementations compile successfully?
    ## 3. Expected Learning Outcomes
    | Competency | Expected outcome |
    | --- | --- |
    | Declaring and implementing correct syntax | Write interfaces and concrete classes using implements and @Override with correct signatures and visibility; diagnose the illustrated compilation errors. |
    | Applying polymorphism | Run ShippingQuoteService with two policies and explain calculate dispatch based on the actual instance. |
    | Enforcing contract conditions | Use validateInputs, Math.multiplyExact, and Math.addExact to reject negative inputs and overflow. |
    | Extending with a new implementation | Add SameDayShipping and calculate the correct 63.000 VND fee for 4 km without changing service code. |
    | Testing multiple implementations | Write shared tests for nonnegative fees and rejection of negative distances, distinguishing syntax from behavior. |
- id: interface-003
  title: Programming to Interfaces
  summary: |-
    # 0. Learning Orientation
    ## 1. Lesson Purpose
    **Programming to Interfaces**

    Understand how to express dependencies through the PaymentGateway contract so CheckoutService does not instantiate or branch on a specific payment gateway. Using SimulatedCardGateway, PrepaidWalletGateway, constructor injection, a composition root, and RecordingGateway, learners observe implementation substitution, independent service testing, and the boundaries of the payment contract.
    ## 2. Questions Learners Should Be Able to Answer
    ### Dependency Direction and Assembly
    1. Why does putting new CardGateway directly inside CheckoutService make provider substitution and testing harder?
    2. How do constructor injection, the composition root, and the Dependency Inversion Principle relate, and why is DI not synonymous with interfaces?
    3. Which operations does the PaymentGateway declared type allow, and how does the JVM determine dispatch to the card or wallet gateway?
    ### Checkout Practice and Reliability
    1. For a wallet containing 50.000 cents, why does the first 30.000-cent payment succeed, the second payment of the same amount fail, and the remaining balance equal 20.000?
    2. How does RecordingGateway verify orderId, amountCents, and the number of calls without connecting to a real gateway?
    3. When designing the charge contract, why is a timeout insufficient to conclude that a transaction failed, and how can uncontrolled retries charge twice?
    4. When is a small abstraction such as Iterable/List preferable to a concrete class, and when does adding an interface merely create unnecessary structure?
    ## 3. Expected Learning Outcomes
    | Competency | Expected outcome |
    | --- | --- |
    | Inverting dependency direction | Refactor the CheckoutService example from using new with a concrete gateway to accepting PaymentGateway through its constructor, with implementation selection outside the service. |
    | Predicting runtime polymorphism | Explain card/wallet results and which object executes charge without using instanceof in the service. |
    | Designing fakes to test clients | Create RecordingGateway and confirm requests are forwarded unchanged and invoked exactly once. |
    | Stating payment-contract limitations | Describe preconditions, success/failure, timeouts, side effects, idempotency, and the demo's limitations compared with real systems. |
    | Choosing minimal abstractions | Justify accepting PaymentGateway or Iterable/List based on client needs and avoid unnecessary interfaces. |
- id: interface-004
  title: One Object Implementing Multiple Interfaces
  summary: |-
    # 0. Learning Orientation
    ## 1. Lesson Purpose
    **One Object Implementing Multiple Interfaces**

    Explain how Java allows one class to implement multiple independent interfaces while creating just one instance with shared state. OfficeMachine fulfills Printable, Scannable, and StatusReadable; learners then distinguish static types from runtime types, choose appropriate client roles, and handle duplicate method declarations, composition, or combined interfaces.
    ## 2. Questions Learners Should Be Able to Answer
    ### Multiple References, One Object
    1. When printPort, scanPort, and monitorPort all refer to one OfficeMachine, how many objects are created, and why does the status output show both counters?
    2. Why does printer.scan() fail to compile even though the underlying object supports Scannable?
    3. When should Printable and Scannable be passed separately, and when is a MultiFunctionDevice that extends both needed?
    ### Multiple-Interface Syntax and Conflicts
    1. How do two interfaces declaring the same abstract log(String) differ from overloaded methods or two independent default label() methods?
    2. How does Java resolve two conflicting default label() methods, and what role does the LocalLabel.super.label() syntax play?
    3. Why does using implements with multiple interfaces not provide multiple inheritance of fields and constructors, and when is composition using PrintEngine and ScanEngine appropriate?
    4. What error can an unchecked cast cause when a Printable does not also implement Scannable?
    ## 3. Expected Learning Outcomes
    | Competency | Expected outcome |
    | --- | --- |
    | Modeling aliases and shared state | Track one OfficeMachine through three references and explain printed=1 and scanned=1 after operations. |
    | Designing role-based APIs | Choose Printable, Scannable, or MultiFunctionDevice according to whether the same or different devices are required. |
    | Resolving method conflicts | Distinguish identical abstract signatures, overloads with different parameters, and default collisions; write a resolving override when needed. |
    | Evaluating inheritance and composition | Explain single direct superclass inheritance, multiple interfaces, and delegating functionality to composed engines. |
    | Identifying unsafe casts | Predict compilation errors when calling methods outside an interface and ClassCastException when the object does not support a cast. |
- id: interface-005
  title: Choosing Between Interfaces and Abstract Classes
  summary: |-
    # 0. Learning Orientation
    ## 1. Lesson Purpose
    **Choosing Between Interfaces and Abstract Classes**

    Learn to choose among interfaces, abstract classes, and composition based on domain responsibilities rather than a habit of adding classes. In the example, DeliveryFeePolicy is a shared contract, WeightDistancePolicy shares state and an algorithm across a family of weight-based fee policies, and StorePickupPolicy uses implements for the interface directly. This reveals extension points, invariants, and the risks of forced inheritance.
    ## 2. Questions Learners Should Be Able to Answer
    ### Contracts Versus Shared Implementations
    1. How do differences in constructors, instance fields, default methods, and the ability to use implements/extends with multiple types affect the choice?
    2. Why should StorePickupPolicy declare implements DeliveryFeePolicy directly rather than inherit from WeightDistancePolicy?
    3. Within WeightDistancePolicy, how do final quoteVnd() and protected abstract feePerChargedKgVnd() divide responsibilities for protecting the algorithm and customizing behavior?
    ### Situation-Based Decisions
    1. For Parcel(1200 grams, 5 km), how do the kilogram-rounding rule and formula produce fees of 19.000, 33.500, and 0 VND?
    2. When two classes share only code-validation logic without belonging to the same domain family, why is composition with CodeValidator more appropriate than an abstract superclass?
    3. When is an interface default method sufficient to share behavior, and when are state or constructors in an abstract class still needed?
    4. Why should an interface not be declared for every class, or an abstract class used solely to reuse a few lines of code?
    ## 3. Expected Learning Outcomes
    | Competency | Expected outcome |
    | --- | --- |
    | Comparing abstraction mechanisms | Create a table to choose interfaces, abstract classes, or composition based on contracts, fields, constructors, combination capabilities, and variation. |
    | Designing a suitable policy family | Explain the structure of DeliveryFeePolicy, WeightDistancePolicy, Standard/Express, and StorePickup without forcing inappropriate inheritance. |
    | Protecting shared algorithms | Identify final methods, constructor validation, and protected extension points; calculate the correct fees for the example Parcel. |
    | Choosing composition where appropriate | Design two unrelated classes that use CodeValidator without forcing an artificial base class into an extends clause. |
    | Evaluating maintenance risks | Identify inheritance that consumes the available superclass, default methods that assume state, and overly broad base classes. |
- id: interface-006
  title: Small Interfaces and Role Segregation
  summary: |-
    # 0. Learning Orientation
    ## 1. Lesson Purpose
    **Small Interfaces and Role Segregation**

    Apply the Interface Segregation Principle to replace an overly broad DocumentManager with read, write, and publish contracts aligned with client needs. The examples use SearchService, EditorService, PublicationService, SnapshotCatalog, and InMemoryDocuments, emphasizing separation by actual responsibilities to reduce dependencies and avoid unsupported methods.
    ## 2. Questions Learners Should Be Able to Answer
    ### Identifying and Segregating Contracts
    1. Why is ReadOnlyArchive throwing UnsupportedOperationException for save/delete/publish a sign of an overly broad contract?
    2. What does ISP say about client responsibilities, and why can interface size not be judged solely by the number of methods?
    3. Based on the needs of SearchService, EditorService, and PublicationService, which interfaces should be defined and injected?
    4. Why does a class that implements DocumentReader and DocumentWriter not automatically implement DocumentEditor, even when DocumentEditor extends both?
    ### Impact and Verification
    1. How can SnapshotCatalog replace InMemoryDocuments in SearchService without providing a write API?
    2. Why does supplying a DocumentReader reference restrict only the Java API rather than replacing real authorization?
    3. How can clients be migrated from a large DocumentManager to smaller roles while maintaining compatibility in a project with many consumers?
    4. What are the benefits and limitations of creating a lambda fake for DocumentReader when a new abstract method is added?
    ## 3. Expected Learning Outcomes
    | Competency | Expected outcome |
    | --- | --- |
    | Detecting ISP violations | Identify methods clients do not use and implementations forced to throw UnsupportedOperationException within DocumentManager. |
    | Segregating APIs by need | Design DocumentReader, DocumentWriter, and DocumentPublisher and assign the correct dependency to each of the three services. |
    | Keeping implementations flexible | Explain why InMemoryDocuments can still use implements for multiple roles while SnapshotCatalog supports only reading. |
    | Planning migration | Identify client groups, create smaller contracts, migrate dependencies step by step, and test semantics. |
    | Evaluating safety and testability | Create a fake DocumentReader to test searching while distinguishing type-level restrictions from actual security permissions. |
- id: interface-007
  title: Default Members and Language-Specific Limitations
  summary: |-
    # 0. Learning Orientation
    ## 1. Lesson Purpose
    **Default Members and Language-Specific Limitations**

    Understand which members Java interfaces permit in different versions and how the JVM and Java compiler handle default, static, and private methods and public static final fields. Through Named, User, Invoice, and cases involving class precedence, more specific interfaces, and conflicting defaults, learners avoid syntax errors, understand Object restrictions, and avoid applying Java's rules indiscriminately to TypeScript, Kotlin, or C#.
    ## 2. Questions Learners Should Be Able to Answer
    ### Modifiers, Data, and Java Limitations
    1. How does Java interpret signature-only methods, directly declared fields, default methods, static methods, and private helpers in an interface?
    2. Why can't User invoke Named.isValidName as an inherited static method, and why does private normalize not become part of an implementation's API?
    3. Why does a final List in an interface not guarantee immutable contents, and where should instance state be stored?
    4. Why can't an interface define a default toString() that overrides Object's public method?
    ### Dispatch, Evolution, and Languages
    1. How does Java resolve cases where a class has an applicable method, a subinterface overrides a parent interface's default, or two independent interfaces declare the same default method?
    2. In Demo.java, why must Invoice override label() while User can inherit the default, and how is each output line produced?
    3. Which interface capabilities were added in Java 8, Java 9, and Java 17, and what prevents the examples from running on older versions?
    4. Why don't TypeScript interfaces provide runtime default implementations like Java interfaces do?
    ## 3. Expected Learning Outcomes
    | Competency | Expected outcome |
    | --- | --- |
    | Identifying valid members | Classify abstract, default, static, private, and field members; identify invalid constructors, instance fields, and protected methods in interfaces. |
    | Predicting method dispatch | Explain class-wins precedence, more specific interfaces, and two independent defaults, and write an override using InterfaceName.super where valid. |
    | Distinguishing static/final from state | Call Named.isValidName correctly and recognize that a public static final List can still contain mutable elements. |
    | Checking version compatibility | Identify Java 8/9/17 requirements for default/static methods, private helpers, and sealed interfaces. |
    | Comparing cross-language boundaries | Accurately distinguish runtime implementations in Java interfaces from TypeScript type contracts and the limitations of other languages. |
- id: interface-008
  title: Replacing Implementations While Preserving Contracts
  summary: |-
    # 0. Learning Orientation
    ## 1. Lesson Purpose
    **Replacing Implementations While Preserving Contracts**

    Distinguish successful substitution at the type level from safe substitution at the behavioral level. Two PriceCatalog implementations using HashMap and TreeMap have different algorithms and complexity but must agree on SKU inputs, zero prices, listSkus ordering, snapshots, errors, and updates; shared contract tests verify the promises on which CheckoutQuoteService relies.
    ## 2. Questions Learners Should Be Able to Answer
    ### Observable Contracts
    1. Why might two classes that both use implements PriceCatalog still fail to substitute for each other in business behavior?
    2. Which guarantees for putPrice, findPrice, remove, and listSkus must remain identical between HashMapPriceCatalog and TreeMapPriceCatalog?
    3. Why does OptionalLong.empty() differ from OptionalLong.of(0), and why must HashMap sort entries when listSkus promises ascending order?
    4. When priceVnd × quantity exceeds long, how should CheckoutQuoteService handle it to avoid an incorrect quote?
    ### Testing and Infrastructure Substitution
    1. Which cases should a shared verify(PriceCatalog) function test to detect ordering, overwriting, snapshot, and invalid-input errors?
    2. Under LSP, in what ways must an implementation avoid strengthening preconditions or weakening postconditions?
    3. When replacing an in-memory catalog with a database, cache, or HTTP service, which promises about commits, consistency, network errors, and concurrency must be maintained or redefined?
    4. Why does switching implementations at startup neither migrate existing data automatically nor replace all dependencies already created while the program runs?
    ## 3. Expected Learning Outcomes
    | Competency | Expected outcome |
    | --- | --- |
    | Writing concrete behavioral contracts | Specify valid SKUs, nonnegative prices, OptionalLong, ascending order, and immutable snapshots. |
    | Comparing two storage approaches | Explain how HashMap sorts its keys while TreeMap maintains order, and predict identical output in Main.java. |
    | Building shared contract tests | Create a verify function usable with multiple PriceCatalog implementations, covering absent SKUs/zero prices, updates, removals, snapshots, and errors. |
    | Detecting LSP violations | Show that BrokenCatalog or a reversed list can still compile while violating behavioral guarantees. |
    | Evaluating infrastructure substitution | Describe consistency, transaction, state-migration, and thread-safety risks and their impact on client contracts. |
- id: interface-009
  title: Designing Payment or Persistence Interfaces
  summary: |-
    # 0. Learning Orientation
    ## 1. Lesson Purpose
    **Designing Payment or Persistence Interfaces**

    Bring interface principles together in a simulated checkout flow: PaymentGateway handles charging, PaymentRepository finds and stores results, and CheckoutService coordinates them through constructor injection. The lesson provides PaymentCommand/PaymentResult, fake tests, and a simulation of repeated requestId values, while demonstrating the limitations of synchronized and in-memory storage and the risk of duplicate charges when a real transaction fails between steps.
    ## 2. Questions Learners Should Be Able to Answer
    ### Defining Domain Boundaries
    1. Why should PaymentGateway and PaymentRepository be separate rather than combining payments, persistence, and email in one large interface?
    2. How do PaymentCommand and PaymentResult govern requestId, orderId, amountCents, status, and providerReference data?
    3. How does CheckoutService receive two dependencies through its constructor, and where are real or fake adapters selected instead of creating SQL or provider clients itself?
    ### Processing Flow and Failure Scenarios
    1. Why do three pay calls with two requestId values in the demo call DemoGateway only twice, and what is the scope of the guarantee for repeated requests?
    2. What does CheckoutService do when a requestId is reused with a different orderId or amount, and why must it check before returning the old result?
    3. If the gateway has already charged but repository.save fails, why can a retry charge twice despite synchronized and ConcurrentHashMap?
    4. In a real system, why are gateway-side idempotency, a durable unique constraint, UNKNOWN/PENDING states, and reconciliation needed?
    5. Which checkout logic can FakeGateway test, and which real provider/integration aspects still need independent testing?
    ## 3. Expected Learning Outcomes
    | Competency | Expected outcome |
    | --- | --- |
    | Separating contracts by responsibility | Design distinct PaymentGateway and PaymentRepository interfaces with valid DTOs/records, leaving CheckoutService responsible only for orchestration. |
    | Tracing checkout flow | Predict APPROVED, DECLINED, repeated requestId calls, and the demo's number of gateway invocations. |
    | Testing logic with fakes | Create FakeGateway and verify that repeated commands do not call the gateway again, while requests with changed contents are rejected. |
    | Analyzing failure windows | Describe the path where a gateway charge succeeds but saving fails, and explain the double-charge risk. |
    | Outlining production improvements | Propose combining provider idempotency keys, durable storage, uniqueness constraints, recovery, and indeterminate states. |
