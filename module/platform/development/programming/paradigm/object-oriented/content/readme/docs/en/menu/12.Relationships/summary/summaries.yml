summaries:
- id: relationships-001
  title: Associations Between Objects
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Associations Between Objects**

    Understand associations as relationships between specific objects and how to represent those links in Java. Through the Ticket–Agent example, learners distinguish references, navigability, multiplicity, and lifecycle ownership so they can change links while preserving business rules.

    ## 2. Questions Learners Must Be Able to Answer

    ### Associations and Actual Object Links

    1. How does a relationship between two classes differ from the current link between a Ticket and an Agent, and what changes when the assignee changes?
    2. Why is the `Ticket.assignee` field only a reference, rather than proof that Agent owns Ticket's lifecycle?
    3. In the Ticket–Agent diagram, how should the `0..1` and `0..*` multiplicities near each end be interpreted?

    ### Implementing and Maintaining Links

    1. When transferring a ticket from Lan to Minh in a bidirectional model, which sides must `changeAssignee()` update, and why?
    2. When is storing only `Ticket → Agent` and using a repository for reverse queries preferable to storing both directions?
    3. If a Student–Course link has its own enrollment date or status, why should an `Enrollment` object be considered instead of two separate Sets?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Recognize associations | Identify class-level relationships and links between specific instances in a Ticket assignment scenario. |
    | Read cardinality and navigability | Correctly interpret `0..1`/`0..*` constraints and which end can navigate to the other. |
    | Maintain link consistency | Analyze the steps for removing the old link, changing the reference, and adding the new link when transferring an assignee. |
    | Choose storage directions | Explain when a single association field suffices and when a reverse link or repository query is needed. |
    | Protect relationship APIs | Recognize exposed mutable Sets, unstable equals/hashCode rules, and missing association objects when links have attributes. |
- id: relationships-002
  title: Temporary Dependencies and Persistent Associations
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Temporary Dependencies and Persistent Associations**

    Distinguish using a collaborator during an operation from an association retained as part of business state. This lesson helps learners choose method parameters, fields, constructor injection, and appropriate UML notation without inferring object lifetimes from variable scope or dependency names.

    ## 2. Questions Learners Must Be Able to Answer

    ### Dependencies and Associations in Models

    1. Between `Ticket.assignee` and the `MessageSender sender` parameter of a notification operation, which represents business state and which supports behavior during the call?
    2. What different information do a dashed dependency line and a solid association line convey in UML?
    3. After `notifyAssignee()` finishes, why can't we conclude that `ConsoleSender` has been garbage-collected?

    ### Choosing Collaborators and Testing

    1. When `NotificationService` receives `MessageSender` through constructor injection and stores it in a field, why does a design dependency still exist even though the reference is retained?
    2. Which questions about later queries, business-domain state, and parameter-passing costs help determine whether to use a parameter, field, or repository?
    3. How does testing a dependency used during one operation differ from testing an assignee association across multiple operations?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Classify relationships from code | Distinguish a sender's method-level dependency from the association between a ticket and its assignee. |
    | Read UML representations | Identify the dependency arrow's direction and the solid line denoting a stateful association. |
    | Evaluate constructor injection | Explain why an injected field can represent a service dependency without implying business ownership. |
    | Choose where to hold references | Design collaborator passing through parameters or stored associations based on needs across calls. |
    | Write focused tests | Specify different assertions for correct calls to a fake sender and for Ticket correctly retaining/removing an association after an operation. |
- id: relationships-003
  title: Aggregation and Composition
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Aggregation and Composition**

    Interpret whole–part relationships correctly: aggregation groups parts that can exist independently, while composition ties a part to one owner under the domain contract. Through Team–Employee and Order–LineItem, learners identify ownership, sharing restrictions, removal/transfer operations, and the distinction from garbage collection or JPA cascading.

    ## 2. Questions Learners Must Be Able to Answer

    ### Ownership and Lifecycle Semantics

    1. Why is a `List` field or a `new` expression insufficient to establish aggregation or composition, and which business question must be answered first?
    2. How does deleting a team or removing a member in Team–Employee differ from deleting an Order containing its own LineItem instances?
    3. Which end of a UML relationship holds the hollow or filled diamond, and how many composites may own a part at the same time?

    ### Implementation and Persistence

    1. How can Order's API prevent a LineItem from being attached to two orders simultaneously without exposing a directly mutable collection?
    2. Why are `CascadeType.REMOVE` or `orphanRemoval` appropriate only when domain rules require deleting the part, especially for employees shared by multiple teams?
    3. Which behaviors should tests verify to distinguish an Employee's independent existence from a LineItem's lifecycle under an Order?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Analyze whole–part relationships | Choose aggregation, composition, or ordinary association based on independent existence, sharing, and ownership transfer. |
    | Read UML notation | Place hollow/filled diamonds at the whole end and describe restrictions on part ownership. |
    | Design composition | Describe an Order API that creates, updates, and removes LineItem through its owner and rejects invalid states. |
    | Avoid deleting shared entities | Evaluate the risks of cascade REMOVE and orphanRemoval for Team–Employee versus Order–LineItem. |
    | Verify lifecycle contracts | Propose tests showing that removing a member does not delete Employee, that LineItem is exclusive to one owner, and that deleting Order handles data according to policy. |
- id: relationships-004
  title: 'Multiplicity: One-to-One, One-to-Many, and Many-to-Many'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Multiplicity: One-to-One, One-to-Many, and Many-to-Many**

    Determine valid multiplicities at both ends of a relationship instead of inferring them from field or collection types. This lesson covers 1–1, 1–N, and N–N models, choosing an association object/registry when enrollments have their own data, and enforcing constraints on null, cardinality, identity, and link transfers.

    ## 2. Questions Learners Must Be Able to Answer

    ### Reading Multiplicities and Constraints

    1. In UML `Department "1" -- "0..*" Employee`, what does each end's notation say about the number of objects at that end for one object at the opposite end?
    2. How does mandatory 1–1 differ from `0..1`, and why does declaring `Profile profile` not enforce system-wide uniqueness?
    3. Why does `List<Task>` not establish whether a relationship is 1–N or N–N without considering the Task → Project end?

    ### Choosing Structures and Protecting Invariants

    1. In a Student–Course N–N model, how does `EnrollmentRegistry` prevent duplicate enrollment ID pairs, and what are its limitations when the demonstration runs only in memory?
    2. When an enrollment has its own `status`, `grade`, and `enrolledOn`, why does an Enrollment class represent it more clearly than two mirrored Sets?
    3. For a Team requiring 1 to 5 members with distinct IDs, which cases must add, remove, and initialization operations reject?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Translate requirements into multiplicities | Correctly label `1`, `0..1`, `0..*`, `1..*`, and min..max ranges at both ends of a diagram. |
    | Distinguish relationship types | Describe valid cardinalities for 1–1, 1–N, and N–N separately from ownership/navigability. |
    | Design N–N representations | Choose a registry or Enrollment association class when a relationship has its own identity and attributes. |
    | Enforce cardinality limits | Propose invariants and add/remove/transfer operations that preserve uniqueness, minima/maxima, and null constraints. |
    | Test business scenarios | Analyze duplicate enrollment, a Team exceeding capacity, or removal of its last member according to the defined policy. |
- id: relationships-005
  title: Association Direction and Navigability
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Association Direction and Navigability**

    Determine which objects must be directly accessible from each side of an association, and store only the navigation paths required by business queries. Through Order–Customer and Team–Member, this lesson explains that navigability is independent of multiplicity/ownership, the cost of maintaining bidirectional links, and how repositories can support reverse lookups.

    ## 2. Questions Learners Must Be Able to Answer

    ### Navigability and UML

    1. How do association, multiplicity, and navigability differ in the Order–Customer relationship?
    2. Why does an association arrow from Order to Customer not mean that data flows only in one direction or that Customer is created after Order?
    3. Why shouldn't an association without an arrow in a UML diagram automatically be interpreted as bidirectional?

    ### Designing Object Graphs

    1. If Order knows its Customer but Customer does not retain its Orders, how can a purchase-history screen find the orders?
    2. When Team and Member must both navigate to each other, which changes must occur during a team transfer to keep both sides consistent?
    3. Why does adding a reverse link increase maintenance costs, reference-cycle risks, and serialization errors without necessarily changing multiplicity?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Read navigation paths | Analyze association arrow directions, multiplicity labels, and direct accessibility from each object. |
    | Choose a minimal reference graph | Explain when `Order.customer` suffices and reverse access belongs in a repository/query service. |
    | Design bidirectional links when needed | Identify the Team–Member update entry point and synchronization steps for adding, removing, and transferring members. |
    | Distinguish UML dependencies | Explain how a dashed dependency arrow differs from a navigability arrow on a solid association line. |
    | Detect redundant-storage problems | Recognize mutable collections, mutually calling setters, JSON recursion, and the mistaken assumption that JPA mappedBy synchronizes both sides automatically. |
- id: relationships-006
  title: Bidirectional Relationships and Data Consistency
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Bidirectional Relationships and Data Consistency**

    Protect invariants when two objects store information about the same link, including during addition, transfer, and unassignment. This lesson uses Employee–Department to establish a single update entry point, validate before mutation, preserve the previous state on failure, and distinguish the JPA owning side from business-domain ownership.

    ## 2. Questions Learners Must Be Able to Answer

    ### Invariants and Change Operations

    1. For `Employee.department` and `Department.employees`, which invariant must hold on both sides after every operation?
    2. When transferring an employee from A to B, why must B's capacity be checked before removing the link to A, changing the reference, and adding the link to B?
    3. Why can independent setters, getters exposing mutable Sets, or helpers calling each other unconditionally lead to inconsistent data or infinite recursion?

    ### JPA, Failures, and Testing

    1. In JPA/Hibernate, how does the foreign-key owning side differ from the domain owner responsible for invariants, and does `mappedBy` automatically update both sides of the object graph?
    2. When changing a link encounters a business error or two competing requests, how should the original state be preserved and transactions/synchronization considered?
    3. Why must tests check both sides after success/failure and use `flush`, `clear`, and reload before concluding that the database persisted the correct data?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | State bidirectional invariants | Write an equivalence condition between the `Employee.department` reference and membership in `Department.employees`. |
    | Design a single update entry point | Simulate an idempotent `moveTo` operation with validation before mutation, then removal of the old link, reassignment, and addition of the new link in order. |
    | Encapsulate collections | Distinguish live immutable views from snapshots and prevent callers from corrupting state through getters. |
    | Analyze the JPA owning side | Identify the side writing the foreign key, the side using `mappedBy`, and the need to synchronize the whole object graph within a transaction. |
    | Test consistency | Specify assertions for adding/transferring/removing links, full-department errors, data after flush/reload, and the limits of single-threaded tests. |
    | Recognize hazards | Detect hashCode depending on mutable fields, JSON recursion, incorrect cascading deletes, or concurrent updates without locking. |
- id: relationships-007
  title: Dependency Cycles and How to Break Them
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Dependency Cycles and How to Break Them**

    Analyze dependency graphs at the class, call-flow, Spring bean, package, and module levels to find cycles that actually cause coupling or initialization errors. This lesson shows how to break cycles by assigning responsibilities to a coordinator, shared policy, Dependency Inversion, or clearly bounded events, then verify changes to behavior and the graph.

    ## 2. Questions Learners Must Be Able to Answer

    ### Identifying the Type of Cycle

    1. What distinct risks can the `OrderService → ShippingService → OrderService` cycle cause for constructor wiring, runtime calls, tests, and transactions?
    2. Why is `Parent ↔ Child` in an object graph not inherently a design flaw or memory leak, unlike potentially problematic module/build cycles and recursive call cycles?

    ### Refactoring Around Responsibilities

    1. How does designing `CheckoutCoordinator` to use `OrderRepository` and `ShippingGateway` in one direction move orchestration responsibility out of the service pair?
    2. When should a shared `DiscountPolicy` be extracted, an interface moved to the domain layer, or `OrderPlaced` emitted instead of making a direct call?
    3. Why might `@Lazy`, `ObjectProvider`, or setter injection merely postpone a bean-cycle problem, and how can tests confirm that the runtime cycle has actually been broken?

    ### Verifying Operational Limitations

    1. If saving an order succeeds but calling shipping or publishing an event fails, which problems do transactions, retry/idempotency, and a transactional outbox address?
    2. How can build/import graphs, Spring wiring, and business interaction order all be checked instead of only verifying that the application starts?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Classify cycle types | Distinguish directed dependency cycles, constructor cycles, runtime recursion, object reference cycles, and project/module cycles. |
    | Redraw collaboration flows | Replace the Order–Shipping cycle with a coordinator and independent ports that do not call back into one another. |
    | Choose cycle-breaking techniques | Explain when extracting a policy, applying dependency inversion, or using a domain event is more appropriate. |
    | Analyze operational consequences | Identify transaction boundaries, retries, outboxes, and idempotency needs when splitting a processing flow. |
    | Test after refactoring | Propose checks for save/request-shipment order, application-context wiring, and cycles reappearing at different levels. |
    | Evaluate temporary workarounds | Explain why deferring bean creation with `@Lazy` does not fix an existing logical call cycle. |
- id: relationships-008
  title: Reading Relationship Notation in Class Diagrams
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Reading Relationship Notation in Class Diagrams**

    Read UML class diagrams as descriptions of contracts between types rather than guessing from a single arrow. This lesson combines six relationship notations—association, dependency, aggregation, composition, generalization, and realization—with multiplicity, navigability, role names, and their corresponding Java implementations.

    ## 2. Questions Learners Must Be Able to Answer

    ### Recognizing Relationship Symbols

    1. How do solid lines, dashed lines, open arrowheads, hollow triangles, hollow diamonds, and filled diamonds distinguish the six UML relationships?
    2. Why does a hollow triangle on a solid line pointing to a superclass differ from a hollow triangle on a dashed line pointing to an interface?
    3. How should `0..1`, `0..*`, and `1..*` at both ends of a diagram be read without reversing the quantities?

    ### Reading Complete Diagrams and Comparing with Java

    1. In the Order–Customer, Order–OrderLine, and CheckoutService–PaymentGateway models, what fields, ownership relationships, dependencies, or `implements` declarations does each relationship suggest?
    2. Why can't Java ownership or deletion behavior be inferred from `List<Child>` alone, and why must the diamond be placed at the whole end?
    3. What do `+`, `-`, `#`, `~`, underlined static members, italic abstract members, and the `{ordered}`/`{unique}` constraints mean when comparing the diagram with Java?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Classify UML symbols | Name and explain all six connector types based on line styles, arrowheads, and diamonds. |
    | Read multiplicity placement correctly | Interpret cardinality labels from the perspective of an object at the opposite end. |
    | Map UML to Java | Sketch fields, parameters, extends, implements, or owner APIs suggested by each relationship in the example diagram. |
    | Explain constraints | Distinguish role names, visibility, static/abstract, ordered/unique, and conditions that code must enforce. |
    | Detect incorrect inferences | Explain why an association line without an arrow may leave navigability unspecified and why composition does not mean the JVM automatically deletes a part. |
