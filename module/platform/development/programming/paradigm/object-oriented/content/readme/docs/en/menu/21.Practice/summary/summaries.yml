- id: practice-001
  title: Class and Object Exercise Using Bank Accounts
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Class and Object Exercise Using Bank Accounts**

    Practice turning account-management requirements into a `BankAccount` class with private state, a constructor, deposit/withdraw/transfer operations, and contracts that reject invalid transactions. This exercise tests encapsulation through nonnegative balance rules, `long` overflow, and failed transfers that must leave both balances unchanged in a single-threaded model.

    ## 2. Questions Learners Must Be Able to Answer

    ### Classes, Objects, and Account Contracts

    1. With two different `BankAccount` objects and an alias variable, why does changing the balance through the alias affect only the account it references?
    2. Which rules must the constructor and `deposit`, `withdraw`, and `transferTo` methods validate to protect balances and identifying data?
    3. Why must `balanceVnd` be a `private` instance field, and why would `static` or a public `setBalanceVnd` undermine the model?

    ### Verifying Transactions and Their Limits

    1. In `transferTo`, which values must be computed beforehand so overflow in the receiving account does not leave the sending account partially debited?
    2. Which JUnit cases demonstrate that invalid transactions are rejected and neither account balance changes?
    3. Why does single-threaded, in-memory transfer code not guarantee atomicity under concurrency, process failures, or database operations?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Model BankAccount | Create two instances with independent IDs, owners, and balances, and explain aliasing and identity correctly. |
    | Protect balances through behavior | Implement deposits/withdrawals with positive amounts, sufficient funds, and `Math.addExact` to detect overflow. |
    | Design failure-safe transfers | Compute prospective source/destination balances before updating and determine the outcome if the receiver overflows. |
    | Test invariants | Write tests for valid transactions, invalid data, zero amounts, self-transfers, and unchanged state after exceptions. |
    | Identify safety boundaries | Explain why a real-world version of the simulation needs locking or database transactions. |
- id: practice-002
  title: Exercise in Encapsulating Order Rules
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Exercise in Encapsulating Order Rules**

    Practice making `Order` responsible for protecting its line items, total, and DRAFT/PLACED/CANCELLED states instead of allowing external code to change collections or state arbitrarily. Learners design behavioral APIs, validate amounts and quantities before committing changes, and use tests to verify order invariants.

    ## 2. Questions Learners Must Be Able to Answer

    ### Encapsulation and the Order Lifecycle

    1. Why can a `public List` or a getter returning a mutable Map/collection allow external code to violate order invariants?
    2. Which transitions between DRAFT, PLACED, and CANCELLED are allowed, and why must `place()` reject an empty order?
    3. How should Order and OrderLine divide responsibility for data validation, line-item ownership, and total calculation?

    ### Calculating Totals and Handling Failures

    1. Why should `setLine()` validate a candidate map and total before updating the actual map?
    2. How should tests verify error results and remaining state when quantities change, totals exceed limits, overflow occurs, or operations are attempted after `place()`?
    3. Why does a `List.copyOf(...)` snapshot of records with String/primitive components protect this example, while records containing mutable elements may still lack deep immutability?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Design business APIs | Build setLine/changeQuantity/removeLine/place/cancel methods rather than arbitrary state and total setters. |
    | Enforce Order states | Analyze operations allowed in DRAFT and operations blocked in PLACED or CANCELLED. |
    | Protect line-item values | Validate SKU, price, and quantity in OrderLine without exposing internal collections. |
    | Prevent partial updates | Check prospective totals for overflow before modifying actual line items. |
    | Test lifecycles | List or write tests for empty orders, modifications after placement, repeated cancellation, price limits, and getter-returned data. |
- id: practice-003
  title: Interface and Payment Polymorphism Exercise
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Interface and Payment Polymorphism Exercise**

    Practice the `PaymentMethod` interface and runtime polymorphism with card, bank-transfer, and e-wallet payments. The lesson focuses on transaction contracts, how `PaymentProcessor` calls implementations according to runtime types, the distinction between orchestration and payment logic, and tests for rejection without losing wallet balance.

    ## 2. Questions Learners Must Be Able to Answer

    ### Shared Contracts and Polymorphism

    1. Why does `PaymentProcessor` only need to call `PaymentMethod.pay(request)`, without using `if` or `instanceof` to distinguish three payment methods?
    2. For `method.pay(request)`, how do the declared interface type and the runtime object type determine behavior?
    3. Why can CardPayment, BankTransferPayment, and EWalletPayment retain their own fields and approval conditions while honoring one interface?

    ### Correctness and Extensibility

    1. When the wallet has insufficient funds, how must PaymentResult represent status, fees, the total paid, and the remaining balance?
    2. When adding QRPayment with its own fees and limits, which component must be added, and why can PaymentProcessor remain unchanged?
    3. Why are `Math.addExact`, integer VND amounts, and failure tests necessary, even though this demo is not yet a real transactional, idempotent payment system?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Build interface-based polymorphism | Define PaymentMethod and pass implementations to PaymentProcessor through a constructor. |
    | Predict dynamic dispatch | Explain which concrete class executes pay when a reference has type PaymentMethod. |
    | Verify payment results | Predict PaymentResult for approval/rejection, fees, and amounts paid without incorrectly changing balances. |
    | Extend implementations | Add a QRPayment design and tests without adding fee-calculation branches to the processor. |
    | Recognize simulation limits | Distinguish in-memory tests from real-system transactions, security, webhooks, and reconciliation. |
- id: practice-004
  title: Exercise in Choosing Inheritance or Composition
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Exercise in Choosing Inheritance or Composition**

    Practice choosing inheritance based on is-a relationships and substitutability contracts, or composition when an object uses collaborators with separate responsibilities. The Shape/Circle/Rectangle and ReportPublisher/ReportFormatter/ReportSink examples help evaluate Liskov Substitution, avoid bloated hierarchies, and demonstrate substitutability through tests.

    ## 2. Questions Learners Must Be Able to Answer

    ### Choosing Inheritance or Composition

    1. Why can Circle and Rectangle be used through Shape.area(), while ReportPublisher is not a kind of CsvFormatter?
    2. What is the difference between `implements ReportFormatter` and ReportPublisher holding a `ReportFormatter` field?
    3. How is the parent's substitution contract affected when SavingsAccount strengthens withdrawal restrictions or Square violates Rectangle's setter rules?

    ### Replacing Components and Testing

    1. In ReportPublisher, how can CsvFormatter be replaced with TextFormatter and ReportSink changed without modifying orchestration logic?
    2. Why can subclass combinations based on report type, format, and storage destination cause a proliferation of subclasses?
    3. Which contract tests show that Shape subtypes return valid areas and that the publisher works with fake formatters/sinks?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Distinguish is-a/has-a relationships | Choose inheritance for Shape and composition for the publisher, justifying each choice with responsibilities and contracts. |
    | Evaluate substitutability | Identify overrides that strengthen preconditions or weaken postconditions and thus violate LSP. |
    | Organize collaborators | Design constructor injection for ReportFormatter and ReportSink, replacing implementations at the composition root. |
    | Reduce coupling | Explain why inheriting merely to reuse a few methods is inappropriate. |
    | Verify design choices | Propose shared tests for Shape subtypes and publisher tests that replace the formatter without changing callers. |
- id: practice-005
  title: Value Objects and Equality Exercise
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Value Objects and Equality Exercise**

    Design `Sku` and `Money` as value objects with canonical representations, immutability, and correct comparison semantics. This exercise focuses on identity versus value equality, normalizing `BigDecimal` by scale, the contracts of `equals`/`hashCode`/`compareTo`, mutable-key risks, and the limits of default record equality for array components.

    ## 2. Questions Learners Must Be Able to Answer

    ### Canonicalization and Equality

    1. Why must `new Sku(" ab-01 ")` equal `new Sku("AB-01")`, and when should normalization with `Locale.ROOT` occur?
    2. Why can `BigDecimal("12.3")` and `BigDecimal("12.30")` differ under `equals` even though `compareTo` returns 0, and how does Money resolve this by using scale 2?
    3. Why is USD 12.30 not equal to EUR 12.30, and why can't amounts in different currencies be added without a conversion policy?

    ### Collections and Mutable Data

    1. If two objects are equal according to `equals` but have different hashes, what failures can occur in `HashSet` and `HashMap`?
    2. In `TreeSet`, what happens if `compareTo == 0` is inconsistent with `equals`?
    3. Why doesn't a record with an array component, or a key with mutable fields, automatically make a safe value object, and where are defensive copies necessary?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Design canonical values | Implement Sku normalization with uppercase/trim and Money normalization with BigDecimal scale 2 at construction. |
    | Analyze equality contracts | Explain the roles of `==`, `equals`, and `hashCode`, and the rule that equal objects must have equal hashes. |
    | Use collections correctly | Predict HashSet/TreeSet element counts for equivalent monetary values expressed in different forms. |
    | Prevent mutable keys | Identify failures when a key object is mutated after insertion into HashMap and choose immutable fields or replacement objects. |
    | Test boundary values | Propose tests for negative amounts, scale 3 values that cannot be preserved, different currencies, invalid SKUs, and collections containing arrays. |
- id: practice-006
  title: Design Flaw Identification Exercise
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Design Flaw Identification Exercise**

    Practice reviewing Java code: distinguish behavioral bugs, code smells, contract violations, and intentional design decisions. Starting with checkout code that mixes Order, payment, and sales totals, the lesson requires concrete evidence, proposed responsibility boundaries, protection of money flows, and tests demonstrating improvement.

    ## 2. Questions Learners Must Be Able to Answer

    ### Detecting Problems Through Evidence

    1. Why does a program working for a few inputs not prove it is free from bugs or code smells?
    2. In checkout code containing `List<long[]>`, VIP logic, payments, and a shared sales total, what signs reveal leaked rules, poorly defined data, and coupling?
    3. Which questions about state ownership, hidden dependencies, long overflow, and if/instanceof help distinguish genuine problems from acceptable design choices?

    ### Separating Responsibilities and Preserving Contracts

    1. Why do Order/OrderLine, PaymentGateway, SalesLedger, and CheckoutService need distinct roles in the refactoring proposal?
    2. When refactoring adds validation and overflow checks, why must these be documented as contract changes rather than claiming all prior and subsequent behavior is identical?
    3. Which tests verify payment results and ledger-recording side effects while ensuring no sales are recorded when payment is rejected?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Review code using evidence | Describe specific scenarios, observable consequences, and problem categories rather than merely calling code 'bad'. |
    | Separate responsibilities | Propose Order for totals, CheckoutService for orchestration, PaymentGateway for results, and SalesLedger for recording sales. |
    | Identify arithmetic/business flaws | Detect missing validation, overflow, and incorrect sales updates after rejected transactions. |
    | Protect behavior through tests | Create tests for regular/VIP customers, acceptance/rejection, invalid data, and ledger interactions. |
    | Distinguish refactoring from rule changes | Explain when new validation/exception behavior is observable and must be disclosed and tested. |
- id: practice-007
  title: Exercise in Refactoring Procedural Code into an Object Model
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Exercise in Refactoring Procedural Code into an Object Model**

    Transform a procedural pricing function into a model containing Order, DiscountPolicy, ShippingPolicy, CheckoutService, and Receipt while preserving results for valid inputs. This exercise practices regression-tested refactoring, polymorphic VIP policies, and clear boundaries between data, discounts, shipping fees, and orchestration.

    ## 2. Questions Learners Must Be Able to Answer

    ### Decomposing Procedural Logic

    1. Why should Order, DiscountPolicy, ShippingPolicy, CheckoutService, and Receipt be separated from a function that uses magic strings for customer and shipping types?
    2. Why should CheckoutService select policies through interfaces/constructor injection instead of scattering VIP conditions across calculations?
    3. Which rules define a 10% VIP discount, rounding down to whole VND, and calculating shipping fees after the discount?

    ### Ensuring Equivalence and Managing Changes

    1. Why must the VIP case with a subtotal of 1.100.000 VND evaluate the free-shipping threshold against the discounted amount rather than the original subtotal?
    2. When refactoring introduces an enum, `Math.multiplyExact`, or input validation, which cases preserve prior results and which change the error contract?
    3. When adding a PREMIUM tier with a 15% discount, which components should be added or modified and which regression tests must remain unchanged?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Redesign responsibilities | Diagram relationships among Order, DiscountPolicy, ShippingPolicy, CheckoutService, and Receipt based on the procedural code. |
    | Preserve calculation consistency | Predict subtotals, discounts, free-shipping thresholds, and payable totals for REGULAR/VIP data. |
    | Apply Strategy | Replace discount algorithms with implementations registered outside CheckoutService. |
    | Refactor safely | Perform or explain the Extract Class, Encapsulate Field, and Introduce Strategy steps with before/after tests. |
    | Test changes | Create a matrix of near-threshold cases, invalid data, and overflow, distinguishing regressions from contract changes. |
- id: practice-008
  title: 'Capstone Project: Requirements and Use-Case Analysis'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Capstone Project: Requirements and Use-Case Analysis**

    Begin the library project by analyzing requirements and use cases before designing classes. The exercise defines MVP scope, actors, assumed borrowing/return rules, main and exceptional flows, Given–When–Then scenarios, and traceability from FR/BR/NFR to design and tests so that business policies are not invented without confirmation.

    ## 2. Questions Learners Must Be Able to Answer

    ### Clarifying Requirements and Scope

    1. What should library staff be asked to confirm that 'at most 3 loans' means currently open loan records rather than an assumed monthly borrowing limit?
    2. How can user needs, FR, BR, NFR, assumptions requiring confirmation, and use cases be distinguished in the scenario of a book copy already on loan?
    3. Why is the librarian a direct actor in the MVP while Member may be a beneficiary who does not yet use the interface?

    ### Use Cases and Acceptance

    1. Which actor, trigger, preconditions, main flow, failure flows, and postconditions must a book-borrowing use case specify?
    2. Which invariants must be defined for book copies, members, loan records, and the three-open-loan/14-day limits before writing code?
    3. How can requirement IDs be linked to use cases, responsible classes, and Given–When–Then tests to detect gaps in change coverage?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Analyze MVP scope | Document in-scope/out-of-scope features, actor roles, and business assumptions needing confirmation. |
    | Structure verifiable requirements | Classify FR/BR/NFR with IDs and example acceptance criteria. |
    | Specify borrowing/return use cases | Define success flows, rejection paths, and before/after states for the librarian actor. |
    | Define test scenarios | Write Given–When–Then cases for open loans, overdue loans, checked-out copies, and invalid return dates. |
    | Establish traceability | Connect requirements, use cases, proposed classes/contracts, and tests to assess the impact of policy changes. |
- id: practice-009
  title: 'Capstone Project: Class and Relationship Design'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Capstone Project: Class and Relationship Design**

    Starting from established library requirements, design `Book`, `BookCopy`, `Member`, `Loan`, `LibraryService`, and `LoanPolicy` with appropriate responsibilities and relationships. The lesson distinguishes an ISBN-defined book title from each physical copy, manages loan records by state, and protects cross-object invariants before choosing the Java implementation model.

    ## 2. Questions Learners Must Be Able to Answer

    ### Identifying Entities and Responsibilities

    1. Why is a book title identified by an ISBN not the same as a physical BookCopy with its own `copyId` and borrowing status?
    2. Why create a `Loan` that records the member, book copy, borrowing date, dueOn, and return date instead of merely storing memberId on BookCopy?
    3. Which rules belong inside `Loan`/`BookCopy`, and which must `LibraryService` check across multiple objects?

    ### Relationships and Invariants

    1. Which relationships among Loan–Member–BookCopy are associations, and why must their lifecycle ownership not be misinterpreted?
    2. How can the three-open-loan limit be enforced while preventing a second loan for the same BookCopy and blocking members with overdue loans?
    3. Why should changing the loan period from 14 to 21 days affect `LoanPolicy` instead of requiring scattered class changes, and what must be tested?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Separate Book from BookCopy | Sketch classes and identity keys for a title and physical copies sharing an ISBN but having distinct states. |
    | Model Loan | Design loan fields, states, and behavior that preserve history across repeated borrowings. |
    | Assign responsibilities | Identify internal rules and cross-object invariants belonging in services/policies. |
    | Read and draw relationships | Explain association and aggregation/composition in diagrams according to the stated domain constraints. |
    | Evaluate behavior | Propose tests for duplicate loans of one copy, exceeding member limits, overdue loans, and double returns. |
- id: practice-010
  title: 'Capstone Project: Implementation and Behavioral Testing'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Capstone Project: Implementation and Behavioral Testing**

    Implement the library design in Java 17 and test borrowing/return use cases with JUnit Jupiter. The lesson emphasizes borrowing by `copyId`, the policy of at most three open loans and a 14-day term, an injected Clock for testing time boundaries, and state invariants when transactions are rejected or involve multiple objects.

    ## 2. Questions Learners Must Be Able to Answer

    ### Implementing Borrowing and Return Flows

    1. Why must borrowing use `copyId` rather than ISBN when two copies of the same title have different states?
    2. In `borrow`, which conditions involving Member, BookCopy, open loans, overdue loans, and `BorrowingPolicy` must be checked before creating a Loan?
    3. Why must dueOn be calculated and fixed when a loan is opened, while Loan and BookCopy prevent callers from setting states arbitrarily?

    ### Testing and Concurrency Limits

    1. What must JUnit check after a return with an invalid date or a second return to prove that neither Loan nor BookCopy is partially modified?
    2. How does injecting `Clock` support precise tests of return dates, overdue status, and the 14-day policy?
    3. Why does `synchronized` on a BorrowingService handle competition only within one JVM instance and not replace transactions or unique constraints across databases/multiple JVMs?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Implement library business logic | Organize Book, BookCopy, Member, Loan, and BorrowingService according to the designed classes/contracts. |
    | Protect borrowing/return conditions | Validate member activity, open-loan counts, overdue status, AVAILABLE, and Loan state. |
    | Test deterministic dates | Use Clock/test clocks to verify 14-day due dates, return dates, and overdue behavior. |
    | Test failures without state changes | Write assertions for Loan/BookCopy after rejected borrowing/returns and repeated returns. |
    | Recognize atomicity boundaries | Explain the limits of `synchronized` in RAM compared with transactions and uniqueness constraints in a DB. |
- id: practice-011
  title: 'Capstone Project: Requirements Changes and Design Evaluation'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Capstone Project: Requirements Changes and Design Evaluation**

    Continue the same library project with CR-01 increasing the limit from 3 to 5 open loans, CR-02 setting a 7-day period for reference books, and CR-03 preserving the established due dates of existing loans. This exercise requires policy changes based on book type, a before/after acceptance matrix, and evidence-based design evaluation using code/tests.

    ## 2. Questions Learners Must Be Able to Answer

    ### Changing Policies While Preserving History

    1. Why must `BorrowingPolicy.termsFor(Member, BookCopy)` consider the book-copy type when NORMAL and REFERENCE have different loan periods?
    2. When the limit changes from 3 to 5 and reference-book loans become 7 days long, which rules apply only to new Loans?
    3. Why would recalculating `Loan.dueOn()` using the current policy on every query corrupt historical loan records?

    ### Evaluating Changes and Testing

    1. In the CH-01 through CH-10 matrix, how can tests verify that existing loans retain their due dates, reference books have a 7-day period, and overdue loans still prevent new borrowing?
    2. Why must a change to the policy API contract be distinguished from changes to a concrete implementation and related callers/tests?
    3. If management adds 'reference books cannot be renewed; normal books may be renewed once for at most 7 days', which cases need clarification without exposing a public `setDueOn`?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Analyze change requests and impacts | Identify changes to policies, book types, use cases, stored data, and tests without arbitrarily altering historical state. |
    | Preserve contractual snapshots | Explain and verify that existing `dueOn` values remain unchanged when RevisedPolicy applies to new Loans. |
    | Adjust policy algorithms | Describe termsFor for Member/BookCopy with 5 open loans, 14 days for NORMAL, and 7 days for REFERENCE. |
    | Write an acceptance matrix | Propose tests by effective date, new limits, overdue status, existing loans, and book-copy types. |
    | Evaluate design using evidence | Assess criteria with specific references to classes, tests, and contracts instead of counting classes/patterns. |
    | Analyze new renewal requirements | Clarify renewal-count limits, due dates, Loan states, and policy checks before designing an API. |
