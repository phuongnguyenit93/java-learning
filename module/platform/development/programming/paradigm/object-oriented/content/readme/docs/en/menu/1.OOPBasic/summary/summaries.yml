summaries:
- id: oop-basic-001
  title: What Is OOP, and How Does It Help Organize Programs?
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **What Is OOP, and How Does It Help Organize Programs?**

    This lesson explains why systems with many business operations need clear responsibility boundaries and how OOP organizes collaborating objects. Through BankAccount and an order-placement flow, learners develop a basis for identifying where rules belong, the limits of encapsulation, and the value of designs that accommodate change.

    ## 2. Questions Learners Should Be Able to Answer

    ### The Problem of Program Organization

    1. Why do scattered business rules become a risk as a program grows?
    2. How does OOP organize data, behavior, and responsibility into collaborating objects?
    3. How do the business identity, state, and behavior of BankAccount differ?

    ### Evaluating Design and Its Limits

    1. Why does a BankAccount with withdraw() still fail to protect its balance if external code can modify balance?
    2. Why should Order, InventoryService, PaymentGateway, and CheckoutService have distinct responsibilities in an order-placement process?
    3. When is a simple sequence of functions more appropriate than creating many objects, and why does private alone not resolve concurrency conflicts?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Recognize organizational problems | Identify scattered rules, tangled dependencies, or difficult-to-test logic in an account or ordering scenario. |
    | Model objects | Identify the identity, state, behavior, and responsibility of BankAccount or Order from concrete requirements. |
    | Trace invariants | Correctly predict successful and failed withdrawals and explain why the balance remains unchanged when a withdrawal is rejected. |
    | Assign responsibilities | Outline the roles of Order, inventory, payment, and orchestration components in a use case. |
    | Recognize limitations | Explain why encapsulation does not replace transactions, locking, idempotency, or security. |
- id: oop-basic-002
  title: Objects, State, Behavior, and Responsibility
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Objects, State, Behavior, and Responsibility**

    This lesson clarifies four interconnected aspects of an object with a business lifecycle. The Order example helps learners determine who owns state, which behaviors may change it, and why mandatory rules must be enforced at the appropriate boundary.

    ## 2. Questions Learners Should Be Able to Answer

    ### The Nature of Objects and State

    1. How are object identity, state, behavior, and responsibility related within an Order?
    2. Why can two Order instances both be in DRAFT with the same total and still be different objects?
    3. What is the difference between stored state and the value calculated by total() from order lines?

    ### Rules and Responsibility Assignment

    1. Why is calling confirm() more appropriate than freely allowing setStatus(CONFIRMED) in an order model?
    2. How and why should state be preserved when confirm() is called on an empty order or addLine() is called after confirmation?
    3. If state-transition rules belong in Order, who should handle persistence, notifications, and orchestration?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Analyze the model | Identify identity, state, behavior, and responsibility in the Order example; distinguish them using concrete data. |
    | Define rules | List invariants for quantities, unit prices, and DRAFT/CONFIRMED/CANCELLED states before writing methods. |
    | Predict the lifecycle | Create a before/after state table for addLine(), confirm(), cancel(), and rejected operations. |
    | Design a behavioral API | Propose methods that express business intent while limiting exposed setters and mutable collections. |
    | Assign collaboration roles | Explain the roles of Order, OrderService, Repository, and NotificationService in order confirmation. |
- id: oop-basic-003
  title: 'Classes, Types, and Instances: Foundational Concepts'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Classes, Types, and Instances: Foundational Concepts**

    This lesson teaches learners to read an object-creation statement accurately and predict which variables refer to the same instance. Through ClickCounter, learners distinguish declared types from runtime classes, understand reference assignment, compare identity, and distinguish instance members from static members.

    ## 2. Questions Learners Should Be Able to Answer

    ### Classes, Types, Instances, and References

    1. In CounterView view = new ClickCounter(...), which parts are the declared type, implementation class, new instance, and reference variable?
    2. Why can view, first, and general all refer to one object yet directly invoke different sets of methods?
    3. What is the difference between new ClickCounter(...), assigning y = x, and calling y.click()?

    ### Interpreting Results and Type Restrictions

    1. How can you predict the results of == and equals() for two ClickCounter objects containing identical data?
    2. Why does view.click() fail to compile while view.value() is valid, even though the runtime object has click()?
    3. How do null, instance fields, and static fields affect object counts, method invocation, and shared state?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Read Java declarations | Correctly identify the class, declared type, runtime instance, and reference in object-creation and assignment expressions. |
    | Model references | Diagram multiple variables pointing to one instance or multiple instances, then predict values after click() or reference reassignment. |
    | Check callable methods | Identify which statements compile and which do not when using CounterView, ClickCounter, and Object, and explain why. |
    | Compare identity | Correctly predict ==, default equals(), and null cases, distinguishing identity from business value. |
    | Distinguish data scope | Explain how per-instance state in instance fields differs from static members belonging to the class. |
- id: oop-basic-004
  title: Object Interactions and Method Calls
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Object Interactions and Method Calls**

    This lesson moves from identifying objects to tracing a real interaction. Through LendingService, Member, Book, and Loan, learners analyze the caller, receiver, parameters, before/after state, return values, and error paths to design safe method contracts.

    ## 2. Questions Learners Should Be Able to Answer

    ### Interaction and Call Mechanics

    1. In service.borrow(an, javaBook), who are the caller and receiver, and which objects receive subsequent calls?
    2. What does Java's pass-by-value copying of references mean for reassign(localBook) and lendTo(member)?
    3. How is this determined when executing LendingService.borrow(), Member.ensureActive(), and Book.lendTo()?

    ### Contracts, Results, and Errors

    1. How do return values, side effects, and void methods differ in the book-borrowing example?
    2. Why can an IllegalStateException prevent creation of a Loan without automatically rolling back every earlier side effect?
    3. Which preconditions, postconditions, and invariants must a lendTo() contract specify, and why must the business call path be protected?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Trace the sequence | Correctly diagram the main → LendingService → Member → Book → Loan flow and its return values. |
    | Identify the receiver | Identify the object referenced by this, which methods read or modify state, and where exceptions arise. |
    | Predict parameter passing | Explain why reassigning a reference parameter does not change the caller's variable but can mutate a shared object. |
    | Analyze errors | Describe the call stack and exception propagation when a book has already been borrowed, including effects on state. |
    | Specify contracts | Write preconditions, postconditions, and error responses for lendTo() or returnBy(), then propose test cases. |
- id: oop-basic-005
  title: Encapsulation, Abstraction, Inheritance, and Polymorphism
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Encapsulation, Abstraction, Inheritance, and Polymorphism**

    This lesson applies four OOP concepts to the same shopping-cart and discount-policy problem. Learners distinguish the design problem each mechanism solves and trace how DiscountPolicy maintains a shared contract while selecting different calculations at runtime.

    ## 2. Questions Learners Should Be Able to Answer

    ### Distinguishing the Four Mechanisms

    1. How does encapsulation differ from abstraction when Cart protects items while CheckoutService uses DiscountPolicy?
    2. Why might private/final and getters/setters still fail to protect cart invariants?
    3. When does an extends relationship represent a valid subtype, and when is composition more appropriate?

    ### Polymorphism and Execution Contracts

    1. How does dispatch select the PercentageDiscount or FixedDiscount formula through the common discountFor() call?
    2. Why does combining final discountFor() with protected calculateDiscount() preserve a shared validation step, and what happens if a policy violates discount limits?
    3. How do overloading, overriding, static hiding, and private methods differ in how Java selects an implementation?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Protect data | Design Cart with a valid item-addition path and a returned list that prevents direct modification of internal state. |
    | Design abstraction | Define the DiscountPolicy contract, including inputs, outputs, and valid discount-amount rules. |
    | Evaluate inheritance | Explain is-a relationships, substitutability, and why an abstract class or interface is appropriate for a given need. |
    | Predict polymorphism | Correctly calculate the 450000/420000 amounts from the same checkout flow and identify the overridden method invoked. |
    | Recognize misuse | Recommend composition instead of an inappropriate extends relationship and detect subclass contract violations. |
- id: oop-basic-006
  title: 'OOP and Procedural Programming: Decomposing a Problem'
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **OOP and Procedural Programming: Decomposing a Problem**

    This lesson compares two solutions to the same shopping-cart problem, both yielding 405.000 VND. Learners see how the placement of data, rules, and behavior differs, then assess cohesion, coupling, invariants, and testing costs instead of merely counting classes.

    ## 2. Questions Learners Should Be Able to Answer

    ### Two Ways to Decompose the Same Business Operation

    1. Given the same requirement for a 10% cart discount, which steps/functions would procedural thinking start with, and which objects/responsibilities would OOP thinking start with?
    2. Why do CartProcedures.calculateTotal(data) and cart.total() both return 405000 while organizing code differently?
    3. Can procedural design protect data and invariants, and what boundaries does it need to do so?

    ### Evaluating Changes and Trade-offs

    1. How does adding DiscountPolicy or a new payment type affect the structure of each approach?
    2. How do cohesion, coupling, testability, and code comprehension costs help compare the two ways of decomposing the problem?
    3. Why are CSV/pipeline tasks often suited to simple functions while an order lifecycle often suits a state-owning object?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Decompose requirements | Specify inputs, outputs, and rules, and propose both procedural and OOP code organizations for the same cart. |
    | Compare implementations | Trace both code samples and demonstrate the same result of 405000 from an initial 450000 with a 10% discount. |
    | Evaluate boundaries | Identify who may modify state and propose where to enforce rules to prevent unchecked updates. |
    | Analyze changes | Compare the impact of adding discount variants, changing persistence, or generating invoices in each design. |
    | Choose a suitable structure | Justify using functions, objects, or a hybrid model based on cohesion, coupling, and testing. |
- id: oop-basic-007
  title: Class-Based OOP and Prototype-Based OOP
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Class-Based OOP and Prototype-Based OOP**

    This lesson extends the familiar Java OOP model with JavaScript's prototype mechanism. Learners analyze two approaches to behavior lookup, how methods and state are shared, and the risks of changes to the prototype chain, while distinguishing prototype-based OOP from the design pattern for creating copies.

    ## 2. Questions Learners Should Be Able to Answer

    ### Class Models and Prototype Chains

    1. How does Java's method selection through class relationships, declared types, and runtime overrides differ from JavaScript's property lookup through a prototype chain?
    2. What relationship does Object.create(proto) establish, and why does it not automatically copy all properties from proto?
    3. Why does express.quote(2) find the method on deliveryBehavior while this still refers to express?

    ### Shared State and Easily Confused Terms

    1. Why does changing standard.feePerKg change economy's result but not express's result?
    2. What happens when a mutable tags array is placed on a prototype and shared by multiple objects?
    3. How do JavaScript class/extends and Constructor.prototype relate to [[Prototype]], and how does the Prototype Design Pattern differ from prototype-based OOP?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Analyze class-based OOP | Trace quote()/variableFee() in Java and explain dispatch in StandardDelivery/ExpressDelivery. |
    | Trace prototype chains | Identify the express → standard → deliveryBehavior lookup path and predict this, baseFee, and feePerKg. |
    | Explain shadowing | Predict economy's change from 25000 → 27000 and express's unchanged 64000 after updating the prototype. |
    | Fix shared-data bugs | Detect the mutable tags bug on the prototype and implement a separate array for each instance. |
    | Distinguish mechanisms | Distinguish Object.create, JavaScript class, [[Prototype]], constructor.prototype, and the Prototype Design Pattern. |
- id: oop-basic-008
  title: When to Use OOP and When to Avoid It
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **When to Use OOP and When to Avoid It**

    This lesson helps learners choose a suitable structure for each type of requirement based on state with a lifecycle, invariants, collaboration responsibilities, and behavioral variations. Through Order, shipping policies, and a total-revenue calculation, learners evaluate both the benefits and costs of OOP while avoiding unnecessary classes/interfaces and forwarding layers.

    ## 2. Questions Learners Should Be Able to Answer

    ### When OOP Adds Real Value

    1. Which signs of state spanning multiple operations, invariants, and collaboration make Order a good fit for OOP?
    2. When are the ShippingPolicy contract and its different implementations more valuable than a fixed fee-calculation function?
    3. Why might a pure function express the calculation of total revenue from a list of Sale objects more clearly?

    ### Costs, Risks, and Evaluation

    1. What forms of overengineering appear as multiple forwarding layers, an interface with one implementation, or a deep inheritance chain?
    2. Why do private and business classes alone not solve concurrency, transactions, idempotency, or payment correctness?
    3. How can you distinguish maintainability benefits from performance and validate performance claims with a profiler or benchmark?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Classify requirements | Analyze an Order with a lifecycle and a one-pass revenue report to choose an appropriate object or function. |
    | Design state | Identify invariants and predict the DRAFT → SUBMITTED → PAID state transitions in the order example. |
    | Evaluate variations | Explain when ShippingPolicy/polymorphism is useful and when a lambda/simple function suffices. |
    | Recognize costs | Detect forwarding layers, behaviorless models, or inappropriate extends relationships and suggest ways to reduce complexity. |
    | Validate decisions | Justify choices based on expected change, testing, correctness, and performance measurements rather than class counts. |
