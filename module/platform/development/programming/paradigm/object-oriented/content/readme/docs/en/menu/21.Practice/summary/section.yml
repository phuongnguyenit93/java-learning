version: 1
type: LEARNING_ROADMAP
title: PRACTICE — LESSON CONNECTIONS
roadmapHeading: Learning Path Through the Lessons
roadmap:
- id: practice-001
  order: 1
  title: Class and Object Exercise Using Bank Accounts
  description: Design BankAccount with private state and deposit/withdraw/transfer APIs, and test balance invariants, overflow, and transaction failures.
  transition:
    to: practice-002
    description: '**From creating stateful objects → protecting every state-mutation path through encapsulation**'
- id: practice-002
  order: 2
  title: Exercise in Encapsulating Order Rules
  description: 'Apply encapsulation to Order: control line items, totals, DRAFT/PLACED/CANCELLED states, and failed changes.'
  transition:
    to: practice-003
    description: '**From aggregate invariants → applying interfaces and polymorphism to multiple payment behaviors**'
- id: practice-003
  order: 3
  title: Interface and Payment Polymorphism Exercise
  description: Use PaymentMethod and dynamic dispatch to handle multiple payment types through one contract without adding branches to the processor.
  transition:
    to: practice-004
    description: '**From interface contracts → deciding between inheritance and composition when extending a design**'
- id: practice-004
  order: 4
  title: Exercise in Choosing Inheritance or Composition
  description: Choose inheritance based on is-a relationships and the Shape contract; choose composition for interchangeable formatters/sinks in ReportPublisher.
  transition:
    to: practice-005
    description: '**From class and collaborator relationships → building value objects and stable equality rules**'
- id: practice-005
  order: 5
  title: Value Objects and Equality Exercise
  description: Canonicalize Sku/Money, preserve equals/hashCode/compareTo contracts, use immutable collections, and examine the risks of mutable aliases.
  transition:
    to: practice-006
    description: '**From designing contract-compliant objects → recognizing design flaws in real code**'
- id: practice-006
  order: 6
  title: Design Flaw Identification Exercise
  description: 'Review checkout code with design smells: identify evidence, separate Order, payment, and ledger responsibilities, and protect behavior with tests.'
  transition:
    to: practice-007
    description: '**From identifying design flaws → applying a refactoring process backed by regression tests**'
- id: practice-007
  order: 7
  title: Exercise in Refactoring Procedural Code into an Object Model
  description: Refactor a procedural pricing function into Order, DiscountPolicy, ShippingPolicy, CheckoutService, and Receipt, backed by regression tests.
  transition:
    to: practice-008
    description: '**From improving a small problem → starting a multi-use-case project through requirements analysis**'
- id: practice-008
  order: 8
  title: 'Capstone Project: Requirements and Use-Case Analysis'
  description: Gather library requirements, actors, BR/FR/NFR, use cases, failure flows, and a traceability matrix linking requirements to tests.
  transition:
    to: practice-009
    description: '**From requirements and acceptance cases → designing classes, relationships, and invariants for the library system**'
- id: practice-009
  order: 9
  title: 'Capstone Project: Class and Relationship Design'
  description: Translate requirements into Book, BookCopy, Member, Loan, and service/policy components; control relationships, identities, and invariants.
  transition:
    to: practice-010
    description: '**From object design → implementing use cases and verifying behavior with Java/JUnit**'
- id: practice-010
  order: 10
  title: 'Capstone Project: Implementation and Behavioral Testing'
  description: Implement borrowing/returns by copyId using Clock and JUnit; verify state on success/failure and concurrency limitations.
  transition:
    to: practice-011
    description: '**From a tested application → accommodating rule changes while preserving historical data**'
- id: practice-011
  order: 11
  title: 'Capstone Project: Requirements Changes and Design Evaluation'
  description: Adapt the system to a five-loan limit and a seven-day term for reference books; preserve historical dueOn values and evaluate changes with a test matrix.
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 | Lesson 9 | Lesson 10 | Lesson 11 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Class and Object Exercise Using Bank Accounts | Exercise in Encapsulating Order Rules | Interface and Payment Polymorphism Exercise | Exercise in Choosing Inheritance or Composition | Value Objects and Equality Exercise | Design Flaw Identification Exercise | Exercise in Refactoring Procedural Code into an Object Model | Capstone Project: Requirements and Use-Case Analysis | Capstone Project: Class and Relationship Design | Capstone Project: Implementation and Behavioral Testing | Capstone Project: Requirements Changes and Design Evaluation |
  | Key question | How do classes, instances, and safe transfers work in RAM? | How does Order protect its state and totals? | How do different PaymentMethod implementations work through one API? | When is is-a appropriate, and when should a collaborator be used? | How do value equality and collection keys work correctly? | What constitutes a bug, a code smell, or misplaced responsibility? | How can calculations be preserved when extracting policies? | Who needs what, within which scope, and how will it be accepted? | Which classes manage titles, physical copies, loans, and invariants? | How can borrowing/returns be correct across failures and date boundaries? | How can policies change without invalidating existing dueOn values? |
  | Value for OOP/the module | Reinforce classes, objects, encapsulation, invariants, and tests. | Design an Order aggregate with safe APIs. | Apply runtime polymorphism and separate the processor. | Preserve substitution contracts and reduce rigid hierarchies. | Use immutable value objects with correct equals/hash/ordering behavior. | Develop an evidence-based review and responsibility-assignment method. | Refactor with tests and reduce dependence on magic strings. | Ground design in requirements and tests. | Turn requirements into an object model with clear relationships. | Test business flows involving multiple entities. | Evaluate OOP designs as policies and contracts evolve. |
  | Mental model developed | Keep data within classes and validate before changing it. | Change state through behavior rather than exposing arbitrary fields. | Program to contracts and replace implementations. | Choose relationships by semantics and preconditions/postconditions. | Canonicalize values before comparison and collection storage. | Review based on evidence, consequences, and tests. | Change incrementally, checking equivalence and boundary failures. | Clarify assumptions, failure flows, and measurable criteria. | Identify identities and owners of invariants. | Observe state after every success and failure branch. | Preserve historical contracts and demonstrate impacts with tests. |
