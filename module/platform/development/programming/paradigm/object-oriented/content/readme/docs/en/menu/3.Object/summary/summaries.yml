summaries:
- id: object-001
  title: Object Identity, State, and Behavior
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Object Identity, State, and Behavior**

    This lesson characterizes a Java object by its identity, observable state, and contract-governed behavior. Examples involving two separately created Order instances, aliases to the same instance, and transitions DRAFT → CONFIRMED → CANCELLED distinguish Java identity from a business ID and explain why an object must enforce invariants through its methods.

    ## 2. Questions Learners Must Be Able to Answer

    ### Identifying Objects

    1. What three different questions do identity, state, and behavior answer about an Order?
    2. Why do two uses of new Order create distinct instances even when customer and state are identical?
    3. Does the same orderId in the database prove that two Java references point to the same instance?

    ### Behavior and Boundaries

    1. Why does alias.addItem change first while second retains its old data?
    2. When are confirm and cancel rejected, and how are Order invariants preserved?
    3. What different aspects do private fields, final classes, and List.copyOf protect?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Identify instances | Diagram first, second, and alias, and predict the result of ==. |
    | Trace state | Describe state changes in the same Order through addItem, confirm, and cancel. |
    | Distinguish identities | Explain the difference between JVM identity and an order ID. |
    | Analyze contracts | Identify the preconditions and postconditions of confirm/cancel. |
    | Protect state | Evaluate a list getter and explain why a snapshot with immutable String values is used. |
- id: object-002
  title: References, Values, and Passing Objects
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **References, Values, and Passing Objects**

    This lesson distinguishes primitive variables that directly hold values from reference variables that hold references to objects. Using Student, Wallet, Account, and Box, learners see that Java always passes arguments by value: a method can mutate a shared object, but reassigning a local parameter does not change the caller's variable.

    ## 2. Questions Learners Must Be Able to Answer

    ### Assignment and References

    1. What values are actually copied when assigning b = a for int and for Student?
    2. Why does b.deposit affect the object referenced by a, while b = new Wallet does not change a?
    3. Does final prevent StringBuilder.append from modifying an object's contents?

    ### Java Parameters

    1. Why does calling depositTo change an Account even though Java uses pass-by-value?
    2. Why can replaceLocally and swap not swap the caller's reference variables?
    3. Why does cloning a two-dimensional array still share its inner int[] rows?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Predict assignment effects | Distinguish results for int and Student when changing a variable or a field. |
    | Explain pass-by-value | Diagram caller and parameter variables holding the same reference value. |
    | Analyze methods | Trace depositTo, replaceLocally, swap, and Box.modify. |
    | Design safely | Return a new instance or clone an array when necessary to avoid modifying the caller's data. |
    | Recognize shallow copies | Identify the inner arrays still shared after matrix.clone. |
- id: object-003
  title: Multiple References to the Same Object
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Multiple References to the Same Object**

    This lesson explains aliasing when multiple variables, fields, collections, or parameters refer to the same instance. Using Student, Employee/Address, Box, and List, learners trace the effects of setters, variable reassignment, container copying, and the limits of sharing mutable objects across threads.

    ## 2. Questions Learners Must Be Able to Answer

    ### Aliasing Paths

    1. Why does second = first not create another Student, and why does a setter called through second change what first observes?
    2. After b = new Student or b = null, does a still reference the original object?
    3. Why does incrementBoth(box, box) increment the same Box twice?

    ### Aliasing Through Other Objects

    1. How can two separately created Employee instances still share the same Address?
    2. How does new ArrayList<>(original) create an independent list while still sharing its Student elements?
    3. How does aliasing itself differ from a race condition across threads?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Draw reference graphs | Count instances and the variables pointing to them after each statement. |
    | Trace aliases | Predict fields of Student and Address when mutated through another reference path. |
    | Distinguish reassignment | Explain b = null, b = new Student, and group.set(0,s). |
    | Recognize nested sharing | Inspect container and element references after a shallow copy. |
    | Propose ownership | Use immutable DTOs/snapshots when mutation rights must be restricted. |
- id: object-004
  title: Object Identity vs. Value Equality
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Object Identity vs. Value Equality**

    This lesson distinguishes ==, which compares reference identity, from equals, which follows a class's equality contract. Through Point, Book, String, arrays, BigDecimal, and records, learners implement consistent equals/hashCode methods, compare entities with value objects, and recognize the risks of changing a mutable key's fields inside a HashMap.

    ## 2. Questions Learners Must Be Able to Answer

    ### Identity and Equality

    1. Why do two Book instances with the same ISBN still yield equals false if they only inherit Object.equals?
    2. How do the results of == and equals differ for new String instances, String literals, and record Point?
    3. Which APIs should be used to compare multidimensional arrays or BigDecimal values with different scales?

    ### Hashing Contract

    1. What do the reflexivity, symmetry, transitivity, and consistency properties of equals require?
    2. Why must equal objects have the same hashCode, while matching hashCode values do not prove equality?
    3. Why can changing a field used in hashing after inserting MutableKey into a map cause lookups to fail?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Predict equality | Explain ==/equals behavior for Book, Point, String, and records. |
    | Implement equals | Write equals(Object) correctly with @Override and null/type checks. |
    | Implement hashCode | Use the same fields as equality and test HashSet/HashMap behavior. |
    | Choose specialized comparisons | Apply Objects.equals, Arrays.deepEquals, and BigDecimal.compareTo appropriately. |
    | Keep keys stable | Identify and fix the bug caused by changing MutableKey's hash while it is in a HashMap. |
- id: object-005
  title: Mutable and Immutable Objects
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Mutable and Immutable Objects**

    This lesson contrasts mutable StringBuilder/ArrayList with immutable String/LocalDate, then explores MutableCart and ImmutableCart. Learners see that reassigning a reference variable does not change an immutable object; neither final nor record automatically guarantees deep immutability, and snapshots must also protect mutable elements.

    ## 2. Questions Learners Must Be Able to Answer

    ### Mutable and Immutable Objects

    1. Which instances are changed by String.concat and StringBuilder.append?
    2. Why do a final List, a final class, and a record not automatically guarantee deep immutability?
    3. How do MutableCart.addProduct and ImmutableCart.withAddedProduct differ in the instances and item counts involved?

    ### Designing for Sharing

    1. List.copyOf makes the list structure stable, but can its MutableTask elements still change?
    2. How do Collections.unmodifiableList and List.copyOf reflect changes to the source list?
    3. Why is safe publication necessary when sharing immutable configuration across threads?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Classify objects | Compare String with StringBuilder in terms of in-place changes. |
    | Trace Cart | Explain empty, one, and two for ImmutableCart and aliases to MutableCart. |
    | Protect elements | Determine when to copy a list and use immutable elements. |
    | Distinguish modifiers | Explain the limitations of final and record. |
    | Choose a strategy | Weigh controlled mutability against immutability that returns new instances. |
- id: object-006
  title: Shallow Copying and Deep Copying
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Shallow Copying and Deep Copying**

    This lesson distinguishes alias assignment from shallow copying, which creates only an outer object, and deep copying, which duplicates the components that need to be independent. Through Customer/Address, List<Item>, multidimensional arrays, and cyclic Node graphs, learners choose copy constructors, clone, or IdentityHashMap to prevent unintended sharing of mutable state while preserving shared references.

    ## 2. Questions Learners Must Be Able to Answer

    ### Copy Depth

    1. How many objects result from alias assignment, shallowCopy(Customer), and deepCopy(Customer)?
    2. How do Object.clone, int[].clone, and Product[].clone differ in which elements or references they retain?
    3. Why can copying List<Item> and then modifying an Item cause changes visible through the source list?

    ### Graphs and Ownership

    1. Why does int[][].clone still share the inner row arrays?
    2. For a cycle A → B → A, why is a seen map using IdentityHashMap needed, with copies registered before recursion?
    3. Why can deep copying an entire entity, socket, or ORM object be semantically incorrect?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Distinguish copy depths | Use == and mutation to demonstrate aliasing, shallow copying, and deep copying with Customer. |
    | Copy collections | Create a new list and copy each mutable Item when needed. |
    | Copy nested arrays | Clone each int[] row and predict the output after mutation. |
    | Preserve graphs | Explain how a visited mapping preserves cycles and shared references. |
    | Design defensive copies | Protect ScoreReport by cloning arrays on input and output. |
- id: object-007
  title: Object Sharing and the Effects of State Changes
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Object Sharing and the Effects of State Changes**

    This lesson traces a TemperaturePolicy shared by MobileControl and WallDisplay, clarifying the difference between live state and a previously captured snapshot. Learners explain why assigning a new controller does not change the wall's reference, why a UI needs a new render/event, and why concurrent updates may require AtomicInteger or an immutable range published through volatile.

    ## 2. Questions Learners Must Be Able to Answer

    ### Tracing Effects

    1. Why does MobileControl.changeTarget(24) make WallDisplay show 24 on its next render?
    2. Why do oldRenderedText and oldHistory not update automatically when the policy changes?
    3. After mobile receives a new replacement, why does wall still target 24 while replacement becomes 19?

    ### Designing Sharing Contracts

    1. How do a live object, a snapshot, and an independent copy differ in the ability to observe or make updates?
    2. Does replacing an object in a registry or modifying a policy automatically trigger every UI render?
    3. Why does volatile count not make count++ atomic, and when is AtomicInteger needed?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Draw reference relationships | Identify which controllers/views hold Policy #1 and #2. |
    | Trace state | Tabulate state before/after changeTarget and WallDisplay renders. |
    | Distinguish snapshots | Explain the old data retained by String and List.copyOf(history). |
    | Design sharing APIs | Propose a mutation owner along with queries, snapshots, and refresh notifications. |
    | Evaluate concurrency | Choose atomic operations for Counter or replace a volatile immutable TemperatureRange. |
- id: object-008
  title: Null Values and Missing Objects
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Null Values and Missing Objects**

    This lesson clarifies unassigned local variables, null references, real objects containing empty strings or collections, and entities that cannot be found. With CustomerRepository/Optional, learners choose validation for required inputs, optional lookup APIs, empty collections, and data-source error handling without confusing different forms of absence.

    ## 2. Questions Learners Must Be Able to Answer

    ### Null and Existing Objects

    1. How does Customer c; differ from Customer c = null at compile time and runtime?
    2. What different states are represented by null, an empty string, a blank string, and List.of()?
    3. If first = null but alias still holds a Box, has the object disappeared or been garbage-collected yet?

    ### Designing APIs for Absence

    1. How does findById returning Optional.empty for an unknown ID differ semantically from a database error?
    2. When are Objects.requireNonNull, Objects.equals, Optional, and an empty collection appropriate?
    3. Why do unboxing a null Integer, dereferencing null, and calling Optional.empty().get produce different error types?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Distinguish forms of absence | Separate unassigned local variables, null references, and objects with null fields. |
    | Predict errors | Identify compile errors, NullPointerException, and NoSuchElementException. |
    | Write safe checks | Apply short-circuit evaluation, Objects.equals, and requireNonNull. |
    | Design lookup APIs | Return Optional.empty for not found, an empty collection for zero elements, and report DB errors separately. |
    | Explain lifetimes | Explain why assigning null to a variable does not delete objects that are still reachable. |
- id: object-009
  title: Tracing Object Interactions in a Scenario
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Tracing Object Interactions in a Scenario**

    This lesson brings concepts together through a checkout flow involving Cart, Inventory, PaymentGateway, OrderService, Order, and Notifier. Learners use state tables, call stacks, logs, and UML sequence diagrams to explain which objects receive calls, which references are passed, where inventory changes, how PaymentDeclinedException is handled, and the limits of compensation in a single-threaded model.

    ## 2. Questions Learners Must Be Able to Answer

    ### Successful Flow

    1. Which instance does Main call checkout on, and does Cart.total modify Inventory by itself?
    2. In what order do reserve, pay, Order creation, notifier.send, and return order occur?
    3. Why does inventory in main show a stock level of 3 after OrderService calls reserve?

    ### Failure Branches and Observability

    1. With PaymentGateway(false), why does release restore stock from 3 to 5 without creating an Order or sending a notification?
    2. What additional information do sequence diagrams, call stacks, and state tables provide beyond logs?
    3. Why is in-memory compensation insufficient when a payment times out or checkouts run concurrently?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Identify responsibilities | List the six objects, their states, and their methods in the checkout flow. |
    | Trace calls | Tabulate callers/callees, arguments, results, and inventory deltas. |
    | Draw sequence diagrams | Depict the successful branch and the exception path leading to release. |
    | Calculate final state | Explain why final stock is 3 on success and 5 when payment is declined. |
    | Debug with evidence | Set breakpoints and compare call stacks with traces; explain transaction/idempotency limitations. |
