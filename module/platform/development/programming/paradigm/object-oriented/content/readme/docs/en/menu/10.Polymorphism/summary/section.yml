version: 1
type: LEARNING_ROADMAP
title: POLYMORPHISM — LESSON CONNECTIONS
roadmapHeading: How the Lessons Connect
roadmap:
- id: polymorphism-001
  order: 1
  title: Polymorphism and Multiple Implementations of the Same Operation
  description: Recognize how a single call to ShippingPolicy.quote(Parcel) produces different pricing formulas and estimated delivery times for Economy, Standard, and Express.
  transition:
    to: polymorphism-002
    description: '**From one call producing multiple behaviors → identifying the subtype relationships that enable a shared call**'
- id: polymorphism-002
  order: 2
  title: Subtype Polymorphism Through Interfaces or Superclasses
  description: Compare implements interface with extends superclass; examine upcasting and how final Report.preview invokes a subclass's content hook.
  transition:
    to: polymorphism-003
    description: '**From subtypes → exploring how the compiler and runtime select methods**'
- id: polymorphism-003
  order: 3
  title: Static Method Resolution and Dynamic Dispatch
  description: The compiler selects overloads using the static types of the receiver and arguments; the JVM selects overridden implementations based on the actual object.
  transition:
    to: polymorphism-004
    description: '**From method-selection rules → practicing overrides that respect their requirements and constraints**'
- id: polymorphism-004
  order: 4
  title: Overriding and Runtime Method Selection
  description: The final DeliveryPlan.quote protects the overall process, while overridable distanceFee enables variation; invoke super deliberately.
  transition:
    to: polymorphism-005
    description: '**From overriding → distinguishing overloads with the same name but different parameters**'
- id: polymorphism-005
  order: 5
  title: Distinguishing Overriding from Overloading
  description: Resolve the interaction between overloading and overriding in DispatchDemo with casts, null, and conversions.
  transition:
    to: polymorphism-006
    description: '**From two mechanisms involving same-named methods → avoiding confusion with the hiding of other members**'
- id: polymorphism-006
  order: 6
  title: Distinguishing Member Hiding from Overriding
  description: Same-named fields and static methods are resolved by static type, unlike dynamically dispatched instance describe methods.
  transition:
    to: polymorphism-007
    description: '**From field/static hiding → consolidating the limits of polymorphism across member types**'
- id: polymorphism-007
  order: 7
  title: The Scope of Polymorphism for Methods and Fields
  description: Classify fields, static/private/final members, getters, abstract methods, and default methods; prefer method-based APIs over same-named public fields.
  transition:
    to: polymorphism-008
    description: '**From Java member boundaries → broadening the view toward capability-based abstractions**'
- id: polymorphism-008
  order: 8
  title: Duck Typing and Capability-Based Polymorphism
  description: Distinguish Java's nominal typing from duck typing; use capability interfaces and adapters/method references.
  transition:
    to: polymorphism-009
    description: '**From declaring capabilities accurately → organizing business code to reduce repeated type checks**'
- id: polymorphism-009
  order: 9
  title: Replacing Type Checks with Polymorphism
  description: Move algorithms into ShippingPolicy, keep factory/switch implementation selection at the boundary, and test that behavior is preserved.
  transition:
    to: polymorphism-010
    description: '**From strategy refactoring → applying it to multiple payment methods and states**'
- id: polymorphism-010
  order: 10
  title: Example of Multiple Payment Methods
  description: CheckoutService uses one PaymentMethod.pay operation for cards, wallets, and bank transfers; distinguish PAID/DECLINED/PENDING and test with a fake.
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 | Lesson 9 | Lesson 10 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Polymorphism and Multiple Implementations of the Same Operation | Subtype Polymorphism Through Interfaces or Superclasses | Static Method Resolution and Dynamic Dispatch | Overriding and Runtime Method Selection | Distinguishing Overriding from Overloading | Distinguishing Member Hiding from Overriding | The Scope of Polymorphism for Methods and Fields | Duck Typing and Capability-Based Polymorphism | Replacing Type Checks with Polymorphism | Example of Multiple Payment Methods |
  | Questions to Understand | Why can one call produce different behavior? | What is a subtype through an interface or superclass? | At which stage do the compiler and JVM make their decisions? | How do you override correctly and safely? | When are same-named methods overloads versus overrides? | Do same-named fields/static methods override? | Which members actually use dynamic dispatch? | Is a type contract required, or are same-named methods enough? | When should if/instanceof checks become a strategy? | What states can a pay operation return? |
  | Value for OOP/the Module | Clients avoid duplicating pricing formulas | Use subtypes through a common API | Debug method calls accurately | Extend hooks while preserving invariants | Avoid calling the wrong signature | Avoid errors from field/static lookup | Prefer methods for variable behavior | Integrate by capability through adapters | Reduce coupling when adding new types | Make simulated payments easy to extend and test |
  | Mental Model Developed | Behavior follows the runtime object | One common type, many classes | Select the signature, then the implementation | Preserve the process while extending hooks | Separate parameter selection from implementation selection | Distinguish hiding from overriding | Define the scope of polymorphism clearly | Design around capabilities | Select an object in one place, invoke its contract everywhere | Distinguish outcomes and safety limitations |
