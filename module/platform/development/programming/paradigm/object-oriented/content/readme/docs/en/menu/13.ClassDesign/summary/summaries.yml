summaries:
- id: class-design-001
  title: Identifying Each Class's Responsibilities
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Identifying Each Class's Responsibilities**

    OOP design begins by determining what each class must know, what it must do, and which kinds of changes affect it. This lesson helps learners turn a use case into a clear responsibility map and avoid putting SQL, business rules, user interfaces, and notifications into one class.

    A book-borrowing example distinguishes BookCopy, Loan, LoanPolicy, LoanRepository, and LoanService. Learners identify which component has enough data to protect invariants, how to use CRC Cards to examine collaborators, and why correctly assigned responsibilities still require transactions when books are borrowed concurrently.

    ## 2. Questions Learners Should Be Able to Answer

    ### Defining Responsibilities and Boundaries

    1. How do knowing and doing responsibilities differ from a class's list of methods?
    2. In the book-copy borrowing use case, who owns the due-date conditions, borrowing limits, loan status, and data storage?
    3. Why is SRP evaluated by the reasons a group of responsibilities might change rather than the number of methods?
    4. When creating CRC Cards for LoanService and LoanPolicy, what indicates that both classes own the same rule?

    ### Coordination, Testing, and Change

    1. Why does LoanService consult the repository and policy before creating a Loan instead of running SQL, calculating due dates, or modifying internal state itself?
    2. If storage changes from LinkedHashMap to SQL, which components must change and which should remain unchanged?
    3. How can the due-date policy be tested with a fixed Clock without accessing a database?
    4. Why does checking the number of loans and then saving, as in the example, fail to guarantee atomicity when multiple requests run concurrently?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Map responsibilities | Correctly identify who owns data, invariants, rules, orchestration, and persistence in a book-borrowing request. |
    | Apply SRP and Information Expert | Explain why Loan, LoanPolicy, and LoanService belong where they do based on reasons for change and availability of information. |
    | Describe collaboration using CRC | Write Class–Responsibilities–Collaborators cards for the main classes and identify classes taking on out-of-scope work. |
    | Design class contracts | Propose constructors and book-borrowing APIs with validation, protected state, and only the necessary exposed behaviors. |
    | Test responsibilities independently | Create scenarios for unavailable book copies, exceeded limits, and invalid due dates, and identify the appropriate test for each owner. |
    | Evaluate concurrency boundaries | Explain the non-atomic check-then-write step and the locking/transaction boundaries needed in a real implementation. |
- id: class-design-002
  title: Cohesion Within a Class
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Cohesion Within a Class**

    This lesson develops the ability to recognize cohesion among fields, methods, and invariants within a class. When one class calculates totals, writes to storage, and sends receipts, unrelated requirements still force changes to the same class and make even simple calculations difficult to test.

    Using LegacyCheckoutService and CohesionDemo, learners separate Cart, OrderRepository, ReceiptSender, and CheckoutService by responsibility. The lesson also explains the limitations of LCOM and method–field matrices, and why a coordinator with many collaborators can still be cohesive.

    ## 2. Questions Learners Should Be Able to Answer

    ### Analyzing a Class Internally

    1. How does high cohesion differ from having few methods or having every method read the same field?
    2. Why is LegacyCheckoutService considered to have low cohesion when it calculates totals, saves orders, and sends emails in one class?
    3. What independent responsibility groups can a method × field matrix reveal, and why is that insufficient to draw conclusions about business responsibilities?
    4. Why must the LCOM variant or measurement tool be specified when using metrics to evaluate a class?

    ### Controlled Refactoring

    1. In CohesionDemo, why does Cart keep addLine, total, isEmpty, and snapshot in the same class?
    2. Does a CheckoutService that invokes a repository and sender in one workflow necessarily lack cohesion?
    3. When splitting a class, how can Cart's invariants be preserved without exposing mutable lists to callers?
    4. What issues involving concurrent snapshot/total operations, receipt-delivery failures, and transactions still need attention after responsibilities are separated correctly?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Diagnose cohesion | Evaluate a class by its purpose, invariants, and groups of reasons for change rather than line count. |
    | Analyze methods and fields | Build a method–field matrix, detect independent clusters, and compare them against business responsibilities. |
    | Reorganize a multi-responsibility class | Propose Cart, repository, sender, and coordinator classes with concise, clear APIs and appropriate separation of change. |
    | Test behavior after refactoring | Test Cart.total, validation, snapshot, and save → send ordering using fakes without starting real I/O. |
    | Balance cohesion and coupling | Identify when splitting into too many pass-through classes needlessly increases dependencies. |
    | Identify risks beyond cohesion | Point out transaction, notification atomicity, and thread-safety issues that require separate solutions. |
- id: class-design-003
  title: Coupling Between Classes
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Coupling Between Classes**

    This lesson helps learners recognize dependencies at the source-code, runtime, and business-change levels. A CheckoutService that instantiates CardProcessor and SmtpMailer itself and knows external endpoints and formats is difficult to adapt to a new provider and difficult to test safely.

    Using PaymentGateway, ReceiptSender, and constructor injection, learners reduce dependencies on frequently changing details while preserving necessary business contracts. The examples also distinguish DIP from DI, a useful interface from a facade that exposes its SDK, event-based coupling, and the cost of handling distributed failures.

    ## 2. Questions Learners Should Be Able to Answer

    ### The Nature and Types of Coupling

    1. How can source-code, runtime, and change coupling differ for CheckoutService?
    2. Why do few imports or the mere presence of an interface fail to prove low coupling?
    3. What risks do data coupling, control coupling, stamp coupling, and external coupling introduce when contracts are designed too broadly?
    4. How do fan-in, fan-out, CBO, and package cycles help identify areas for review, and what are their limitations?

    ### Isolating Change and Testing

    1. Why does passing PaymentGateway and ReceiptSender through a constructor make checkout testable with fakes?
    2. How does DIP differ from DI, and does a constructor accepting a concrete class necessarily comply with DIP?
    3. How can tests prove that no receipt is sent if the gateway throws an exception before payment succeeds?
    4. Why do successful payment followed by failed receipt delivery still require state tracking and retry/idempotency despite reduced coupling?
    5. What dependencies remain in messages passed through an event broker even when two modules do not import each other?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Identify actual coupling | Diagram CheckoutService dependencies on providers/SMTP and identify where details are known and where provider changes have an impact. |
    | Design stable contracts | Define PaymentGateway.charge and ReceiptSender.send around behavior instead of copying SDK steps directly into interfaces. |
    | Apply DI and DIP appropriately | Move dependency creation outside the service and distinguish injection mechanisms from dependency direction toward abstractions. |
    | Test interchangeable collaborators | Use fakes that record orderId, amountCents, email, and paymentId to verify correct checkout behavior. |
    | Evaluate module coupling | Identify import cycles and event-schema dependencies, and propose appropriate contract boundaries. |
    | Analyze failure side effects | Explain the risks of successful payment followed by failed notification and the need for retry/idempotency. |
- id: class-design-004
  title: Separating Data, Business Logic, and External Interactions
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Separating Data, Business Logic, and External Interactions**

    A checkout flow may receive data, calculate prices, save orders, and send notifications. This lesson separates request DTOs, domain entities/value objects, policies, application services, ports, and adapters so that each component has a verifiable responsibility.

    In SeparationOfConcernsDemo, OrderLine performs validation, Order protects the total amount, StandardPricingPolicy applies SAVE10, CheckoutService coordinates the flow, and the repository/gateway provides I/O. Learners also recognize the risk of saving an order successfully but failing to send a receipt, and the actual scope of transactions and outbox patterns.

    ## 2. Questions Learners Should Be Able to Answer

    ### Assigning Component Responsibilities

    1. What distinct responsibilities belong to the request DTO, OrderLine, Order, PricingPolicy, CheckoutService, repository port, and adapter?
    2. Why does separating data from I/O not mean moving all entity behavior into a service?
    3. Which components should reject empty SKUs, nonpositive quantities, and overflow in the total amount?
    4. Why does a domain class that directly calls JDBC or SMTP violate the dependency boundaries?

    ### Testing and Integration Consistency

    1. How is SAVE10 applied and rounded to cents in the example that reduces 315.00 to 283.50?
    2. Why must an unsupported promotion code be rejected before calling repository.save or sending a receipt?
    3. If saving succeeds and the gateway subsequently fails, why can't @Transactional on the DB undo SMTP operations?
    4. What guarantees do outbox, retry, and idempotency support, and why do they still result in eventual consistency?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Group responsibilities | Classify each checkout type as an input DTO, domain component, policy, application component, port, or I/O adapter. |
    | Protect domain invariants | Identify where to validate order lines, compute subtotals with Math.addExact, and reject policies returning invalid amounts. |
    | Design dependency flow | Diagram controller → command → service → domain/port → adapter and show the direction of source-code dependencies. |
    | Verify prices | Calculate totals and SAVE10 discounts in cents by hand and compare them with the Java 17 example. |
    | Test workflows without I/O | Use fake repositories/gateways to prove that nothing is saved or sent when data or promotions are invalid. |
    | Design handling for post-save failures | Propose outbox-based notifications after commit, retry handling, and correctly persisted order states. |
- id: class-design-005
  title: Naming Classes, Fields, and Methods
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Naming Classes, Fields, and Methods**

    Naming is part of an OOP contract. Readers should be able to tell what a class is responsible for, what data and units a field represents, and whether a method queries data or produces side effects without first opening its implementation.

    This lesson uses ShoppingCart, CartSnapshot, CheckoutService, and OrderRepository to illustrate Java conventions, accurate insert/findById semantics, readable boolean names, and explicitly named units. Learners also examine JavaBeans/record/JSON/JPA constraints when renaming public APIs to avoid breaking clients, mappings, or binary compatibility.

    ## 2. Questions Learners Should Be Able to Answer

    ### Names That Reflect Responsibilities and Meaning

    1. Why do DataManager.process(x) and flag force users to guess the responsibilities and state involved?
    2. Which Java elements use UpperCamelCase, lowerCamelCase, and UPPER_SNAKE_CASE conventions?
    3. Why are remainingSeats, balanceCents, and retryDelayMillis safer than number, balance, or delay without units?
    4. What distinct semantics should findById, requireById, insert, createOrder, and placeOrder convey?
    5. Why shouldn't a getter with side effects or network calls be treated as a cheap query merely because its name starts with get?

    ### API Design and Renaming

    1. What do ShoppingCart.snapshot() and OrderRepository.insert() in NamingDemo communicate about data immutability and duplicate orderId values?
    2. Why is a record accessor named customerId() rather than the default JavaBeans-style getter getCustomerId()?
    3. Why can renaming a getter, field, or public API affect JSON, JPA, reflection, Spring, and binary clients?
    4. When renaming createOrder to placeOrder, which usages, contracts, migrations, and tests must be checked?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Choose names following Java conventions | Name classes/interfaces/records, methods, fields, parameters, enums, and constants according to suitable conventions. |
    | Clarify data meaning | Replace ambiguous names with names expressing the domain, units, and state, such as balanceCents or registrationClosed. |
    | Communicate API effects | Distinguish find/require, insert/upsert, get/fetch, and create/enqueue by their promised results or side effects. |
    | Design consistently named models | Read and revise the ShoppingCart–CartSnapshot–CheckoutService APIs so callers understand responsibilities, snapshots, and duplicate IDs. |
    | Review framework boundaries | Distinguish record accessors from JavaBeans conventions and identify renaming risks for JSON/JPA/reflection. |
    | Plan safe renames | List callers, contracts, IDE renames, deprecated wrappers, tests, and source/binary compatibility issues. |
- id: class-design-006
  title: Entities, Value Objects, and Services
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Entities, Value Objects, and Services**

    This lesson helps learners choose classes by business meaning: an Entity has an identity that persists through changes, Value Objects are equal by value and are generally immutable, and a Service contains coordination rules that do not naturally belong to a single object.

    The Account, Money, and TransferService example clarifies Account's UUID, Money's Currency and minorUnits, and transfers between two entities. The lesson also distinguishes Domain Services from Application Services and warns against equating framework @Entity/@Service annotations with domain roles or treating in-memory operations as atomic banking transactions.

    ## 2. Questions Learners Should Be Able to Answer

    ### Identity, Equality, and Immutability

    1. Why aren't two Account objects with the same balance necessarily the same Entity, while two Money objects with equal minorUnits/currency can be equal?
    2. When an Account's balance changes but its UUID remains the same, what makes it the same entity?
    3. Why can a hashCode based on mutable attributes break object lookup in a HashSet?
    4. Why does a record's component-based equals not automatically guarantee deep immutability?
    5. How must Money.plus and Money.minus check currencies, amount signs, and numeric overflow?

    ### Assigning Behavior and Transactions

    1. Which rules should Account.withdraw and Money.plus enforce, and how should TransferService coordinate two Account objects?
    2. How do Domain Services differ from Application Services in their rules, repositories, permissions, and transactions?
    3. Why do two separate saves of Account objects not automatically form one atomic transaction?
    4. Do @Entity in JPA and @Service in Spring automatically determine whether a class is a Domain Entity or Domain Service?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Distinguish three roles | Classify Account, Money, TransferService, and DTOs by identity, value, or coordination behavior. |
    | Design entity equality | Establish UUID-based identity rules and discuss exceptions for database-assigned IDs or JPA proxies. |
    | Create immutable Value Objects | Design Money using minorUnits/Currency, component-based equals, and overflow-detecting operations. |
    | Protect balances within Entities | Explain how Account.deposit/withdraw check positive amounts, matching currencies, and nonnegative balances. |
    | Place services in the appropriate layer | Separate transfer rules involving two accounts from loading, saving, and opening transactions in an application service. |
    | Identify demo limitations | Explain why in-memory preflight checks do not prevent race conditions, lost updates, or one-sided commit failures. |
- id: class-design-007
  title: Rich Domain Models and Data-Only Models
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Rich Domain Models and Data-Only Models**

    This lesson guides the placement of business rules: keep state transitions within the entity whose data must be protected, or use data-only DTOs/projections when the task only requires carrying data. The focus is how well invariants are protected, not the number of getters and setters.

    In RichVsAnemicDemo, Order owns addItem, confirm, cancel, and total calculations from OrderLine; the application service only loads, saves, and sends notifications. Learners understand why rich models still need bounded responsibilities, when simple records/CRUD suffice, and why ORM transactions and concurrency must still be designed separately.

    ## 2. Questions Learners Should Be Able to Answer

    ### Choosing Models Based on Invariants

    1. Why can OrderData with public setters for status and total amounts violate order invariants?
    2. How do Rich Domain Models differ from Anemic Domain Models in rule placement, permission to modify state, and the risk of duplicated validation?
    3. Which operations must Order.addItem and Order.confirm reject after an order reaches CONFIRMED?
    4. Why isn't a Quantity record with a validating constructor and a plus method necessarily an anemic model?
    5. When are DTOs, projections, reports, or simple CRUD operations a good fit for data-only models?

    ### Separating Orchestration and System Guarantees

    1. What roles do OrderLine, Order, repository, notifier, and application service play in RichVsAnemicDemo?
    2. Why shouldn't an entity open JDBC connections or send SMTP messages merely to qualify as rich?
    3. When Order state is persisted with JPA, where should transactions, optimistic locking, and lost updates be checked?
    4. What steps help replace public setters with addItem/confirm while maintaining compatibility and the ability to test existing behavior?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Compare two models | Identify where rules are implemented and the consequences for invariants when multiple callers update Order. |
    | Build rich entities | Design addItem, confirm, cancel, and totalCents on Order with explicit DRAFT/CONFIRMED/CANCELLED states. |
    | Protect data and totals | Prevent nonpositive quantities, negative prices, incorrect SKU aggregation, arithmetic overflow, and exposure of mutable collections. |
    | Keep services focused | Separate domain behavior from repositories, notifiers, transactions, and use-case orchestration. |
    | Choose data-only models deliberately | Distinguish rich entities from request DTOs, report projections, or CRUD models without complex invariants. |
    | Plan refactoring | Define a state machine, add tests, migrate callers, restrict setters, and check ORM/concurrency behavior. |
- id: class-design-008
  title: Separating Queries from State-Changing Commands
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Separating Queries from State-Changing Commands**

    This lesson helps learners write APIs in which reading data does not silently change business state, while write commands explicitly communicate their intent, validity conditions, and side effects. The getAvailableQuantity example, which both checks and deducts stock, shows how a getter can introduce bugs from a mere UI refresh.

    Through Stock and AccountDemo, learners distinguish canReserve/balance/snapshot from reserve/deposit/withdraw; they also learn how CQS differs from CQRS architecture, why atomicity matters with competing requests, and why retried commands need idempotency.

    ## 2. Questions Learners Should Be Able to Answer

    ### Classifying Queries and Commands

    1. Why does getAvailableQuantity(requested) violate query expectations when it also deducts stock?
    2. How do canReserve, availableUnits, and snapshot differ from reserve, deposit, and withdraw in observable behavior?
    3. Why is createOrder still a command when it returns OrderId, and why doesn't CQS require every command to return void?
    4. How does method-level CQS differ from architectural CQRS and its read models?
    5. How do logging, memoization, lazy loading, and remote queries make the boundary around queries conditional?

    ### Concurrency and Retries

    1. Why doesn't canReserve(2) returning true guarantee that reserve(2) will succeed if another request intervenes?
    2. What does synchronized in AccountDemo guarantee within one JVM, and what does it not guarantee when data spans multiple machines?
    3. When deposit(100) or sendEmail is retried, how do duplicate side effects differ from repeating a query?
    4. Where must an idempotency key be checked and recorded atomically to prevent duplicate processing across multiple instances?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Identify API effects | Classify methods as queries or commands by actual state changes, regardless of name prefixes or return types. |
    | Design clear queries | Propose balance, snapshot, and canReserve methods that return data without modifying domain state or exposing mutable collections. |
    | Design valid commands | Write reserve/withdraw methods that validate at write time and preserve invariants on both success and failure paths. |
    | Distinguish CQS/CQRS | Explain when method-level separation is sufficient and the costs of separate read/write models. |
    | Analyze TOCTOU | Identify races between queries and commands and propose atomic updates or locks/transactions at the owner. |
    | Check idempotency | Compare setStatus with deposit and design a retry scenario using request IDs without duplicate effects. |
- id: class-design-009
  title: Limiting Deep Object-Chain Access
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Limiting Deep Object-Chain Access**

    A chain such as loan.getMember().getMembershipPlan().getDailyLateFeeCents() forces calling code to know the details of multiple objects and calculate late fees itself. This lesson helps learners assess actual coupling, move behavior to the appropriate owner, or pass data through a Value Object instead of traversing deep object graphs.

    DemeterDemo uses Loan.calculateLateFeeCents, Member.lateFeeFor, and MembershipPlan.feeFor to keep responsibilities with nearby collaborators at each level. Learners also distinguish chains that expose internals from DTOs, fluent APIs, and Streams, and recognize that changing Java call chains alone does not resolve N+1 queries, lazy loading, or transactions.

    ## 2. Questions Learners Should Be Able to Answer

    ### Law of Demeter and Behavior Ownership

    1. Which internal decisions does the Loan → Member → MembershipPlan chain force LoanReturnService to depend on?
    2. Under the Law of Demeter, which kinds of direct objects should a method exchange messages with?
    3. Why does calling loan.calculateLateFeeCents(days) reduce the service's knowledge of the underlying structure?
    4. When is an independent policy that receives a loan snapshot better than placing every algorithm inside Loan?
    5. Why might adding many forwarding getters to Order merely conceal a navigation chain without assigning responsibility correctly?

    ### Design Boundaries and Validation

    1. Why are chains involving String.trim().toLowerCase(), builders, or Streams not automatically violations of LoD?
    2. Does Optional.map across multiple objects reduce coupling, or does it merely reduce null checks?
    3. If MembershipPlan changes its fee calculation to account for free days and a fee cap, what should services outside Loan need to change?
    4. If a getter uses a lazy JPA relationship that causes N+1 queries or LazyInitializationException, is moving the chain inside one method enough to fix the issue?
    5. Why can fees based on the current membership plan differ from fees based on the plan at borrowing time, and which interpretation must the model commit to?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Recognize harmful message chains | Find caller chains that navigate deep into multiple entities to calculate rules and identify coupling to internal structure. |
    | Apply Tell, don't ask | Propose Loan.calculateLateFeeCents and nearby collaborating methods instead of scattering formulas across services. |
    | Place rules or Value Objects appropriately | Choose MembershipPlan.feeFor, a domain policy, or ShippingAddress based on who owns the information. |
    | Analyze exceptions to LoD | Distinguish chains of business objects from DTOs, Money value objects, Streams, and fluent builders with clear contracts. |
    | Preserve behavior | Test Basic/Premium daily fees, errors from returning a loan twice, and the effects of changing membership plans. |
    | Recognize persistence risks | Explain how projection/fetch strategies address N+1 queries and lazy loading beyond shortening Java call chains. |
