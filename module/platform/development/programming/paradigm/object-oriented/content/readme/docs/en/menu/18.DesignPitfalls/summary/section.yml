version: 1
type: LEARNING_ROADMAP
title: DESIGN PITFALLS — LESSON CONNECTIONS
roadmapHeading: Learning Path Through the Lessons
roadmap:
- id: design-pitfalls-001
  order: 1
  title: Classes with Too Many Responsibilities
  description: Identify a God Class through reasons for change and cohesion/coupling; separate use-case orchestration from pricing, persistence, and notification responsibilities.
  transition:
    to: design-pitfalls-002
    description: '**From class responsibilities → the responsibility to protect data and invariants within the class.**'
- id: design-pitfalls-002
  order: 2
  title: Exposed State and Broken Invariants
  description: Protect invariants through business APIs, prevent mutable aliases from bypassing controls, and test atomic updates, including concurrent access by multiple threads.
  transition:
    to: design-pitfalls-003
    description: '**From encapsulation that protects state → business APIs that replace field-by-field updates through setters.**'
- id: design-pitfalls-003
  order: 3
  title: Excessive Getters and Setters Without Behavior
  description: Replace unrestricted getters/setters with confirm/ship/cancel behaviors that protect the Order lifecycle, while recognizing legitimate DTOs and transaction scripts.
  transition:
    to: design-pitfalls-004
    description: '**Another perspective: from overly permissive domain APIs → inheritance exposing APIs outside an object’s responsibilities.**'
- id: design-pitfalls-004
  order: 4
  title: Inheritance Used Only to Reuse a Few Methods
  description: Avoid extending a class merely to borrow methods, which can inadvertently expose the Map API through Inventory; keep Map private and delegate safe operations.
  transition:
    to: design-pitfalls-005
    description: '**From evaluating subtype contracts → use polymorphism instead of calls scattered across concrete types.**'
- id: design-pitfalls-005
  order: 5
  title: Overusing Casts and Type Checks
  description: Replace repeated instanceof/cast branching with ShippingPolicy polymorphism; reserve type checks for appropriate boundaries and capability checks.
  transition:
    to: design-pitfalls-006
    description: '**From using polymorphism correctly → design interfaces narrow enough for implementations to fulfill every promise.**'
- id: design-pitfalls-006
  order: 6
  title: Oversized Interfaces or Too Many Abstraction Layers
  description: Apply ISP according to DocumentReader/Writer needs, remove unsupported methods, and eliminate forwarding layers that add no value.
  transition:
    to: design-pitfalls-007
    description: '**From interface boundaries → dependency direction and data exchange boundaries between objects.**'
- id: design-pitfalls-007
  order: 7
  title: Circular Dependencies and Deep Object Navigation
  description: Break OrderService–ShippingService cycles, pass narrowly scoped request data, and reduce deep navigation following the Law of Demeter.
  transition:
    to: design-pitfalls-008
    description: '**From dependency structures → control shared state and coordinate safe changes.**'
- id: design-pitfalls-008
  order: 8
  title: Hard-to-Control Shared State
  description: Assign ownership of shared mutable state, prevent race conditions, and choose atomic operations, locks, or transactions according to scope.
  transition:
    to: design-pitfalls-009
    description: '**From shared mutable state → the special case where changing fields affects a key’s equality/hash.**'
- id: design-pitfalls-009
  order: 9
  title: Mutable Objects Breaking Equality or Hashing
  description: Keep equals/hashCode/comparator behavior stable for keys and Set elements; separate CustomerId from mutable profiles and examine records/ORM mappings.
  transition:
    to: design-pitfalls-010
    description: '**A broader perspective: from specific pitfalls → decide when patterns or abstractions are warranted.**'
- id: design-pitfalls-010
  order: 10
  title: Overusing Design Patterns and Premature Abstraction
  description: Look for evidence of variation before introducing Strategy/Factory; use regression tests to evolve from a single policy.
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 | Lesson 9 | Lesson 10 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Classes with Too Many Responsibilities | Exposed State and Broken Invariants | Excessive Getters and Setters Without Behavior | Inheritance Used Only to Reuse a Few Methods | Overusing Casts and Type Checks | Oversized Interfaces or Too Many Abstraction Layers | Circular Dependencies and Deep Object Navigation | Hard-to-Control Shared State | Mutable Objects Breaking Equality or Hashing | Overusing Design Patterns and Premature Abstraction |
  | Key question | Which classes have too many reasons to change? | Who controls invariants and aliases? | Who owns the state-transition rules? | Does the subtype honor the parent contract? | How can shared behavior replace type branching? | Which contract does a client actually need? | Are there cycles or excessive knowledge of the object graph? | Who modifies shared state, and through what mechanism? | How do mutable keys affect lookup and sorting? | When do patterns start adding value? |
  | Value for OOP/the module | Separate modules along verifiable responsibilities. | Keep data valid through all operations and failures. | Make domain APIs harder to misuse. | Preserve LSP and eliminate unwanted inherited methods. | Extend implementations without modifying callers. | Reduce API coupling and stub implementations. | Keep dependencies unidirectional and reduce ripple effects. | Avoid races, cross-request leaks, and lost updates. | Keep Map/Set/cache behavior correct. | Reduce change costs and unnecessary intermediary classes. |
  | Mental model developed | Evaluate cohesion through reasons for change. | State invariants, then trace every mutation path. | Tell an object to perform the right behavior. | Choose is-a by meaning, not code reuse. | Ask which behavior belongs to each subtype. | Design around client capabilities. | Draw dependency and ownership graphs. | Separate visibility, atomicity, and transactions. | Keep identities stable across mutations. | Demand evidence before extracting an abstraction. |
