summaries:
- id: language-mechanics-001
  title: Generic Types and Parameterized Classes
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Generic Types and Parameterized Classes**

    Understand the role of **Java generics** in type contracts and class/method reuse. Using `Box<T>`, `Pair<K,V>`, and `InMemoryRepository<ID,T>`, distinguish generic declarations, type parameters, type arguments, inference, and generic methods; recognize the limitations of invariance, wildcards, type erasure, and the risks of raw types.

    ## 2. Questions Learners Should Be Able to Answer

    ### Structure and Use of Generic Types

    1. In `Box<T>`, `Box<String>`, and `new Box<>("Java")`, which is a type parameter declaration, which is a type argument, and what does the compiler infer?
    2. Why does `Pair<K,V>` represent two independent types, while `InMemoryRepository<ID,T>.findById(ID)` preserves the `Optional<T>` result type?
    3. How does the method `<R> Box<R> map(...)` differ from the class's `T`, and why must a static method declare its own type parameter?

    ### Type Safety and Limitations

    1. Why can't `List<Integer>` be assigned to `List<Number>`, and why is `Box<Integer>` not a `Box<Number>`?
    2. What types can be read or written through `List<? extends Number>` and `List<? super Integer>`, and how does PECS guide the design of `copyAll`?
    3. How does type erasure affect `new T()`, `instanceof List<String>`, overloading, and `static T`?
    4. How can a raw `List` add an `Integer` to a `List<String>`, and where could this cause heap pollution and a `ClassCastException`?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Declaring generic structures | Write `Box<T>`, `Pair<K,V>`, and typed repositories whose getters, setters, and queries preserve type arguments. |
    | Organizing generic methods | Use `<R>`, static `<T>`, and diamond inference without manual casts. |
    | Choosing type-safe APIs | Identify where bounds or wildcards are needed and explain assignments rejected due to invariance. |
    | Recognizing erasure boundaries | Explain generic operations that cannot compile and replace `new T()` with a suitable factory/Supplier. |
    | Verifying contracts | Identify compile-time errors, unchecked warnings, null policies, and runtime behavior in the examples. |
- id: language-mechanics-002
  title: Type Parameter Bounds
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Type Parameter Bounds**

    Declare **bounded type parameters** so algorithms accept only types with the required capabilities. The lesson examines `<T extends Number>`, intersection `&`, `Comparable<? super T>`, the recursive bound `<E extends Enum<E>>`, and the effects of erasure while distinguishing bounds on `T` from use-site wildcards.

    ## 2. Questions Learners Should Be Able to Answer

    ### Upper Bounds and Generic Algorithms

    1. Why can `NumberBox<T extends Number>` call `doubleValue()` while `Box<T>` cannot?
    2. Why must a class bound precede interfaces in `<T extends Number & Comparable<? super T>>`, while commas separate distinct type parameters?
    3. Why does `Comparable<? super T>` allow `Employee`, which inherits `Comparable<Person>`, to be used with the `max` function?
    4. Why does a `Number` bound not automatically provide the `+` operator for `T` or guarantee exact monetary calculations and non-null values?

    ### Wildcards, Recursive Bounds, and Runtime

    1. When the result must preserve `T`, should a bounded generic method or the wildcard `? extends Number` be used, and why?
    2. When is `? super Integer` appropriate for a write destination, and why does Java disallow `<T super Integer>`?
    3. What does `<E extends Enum<E>>` express, and is an incorrect enum constant name detected at compile time or runtime?
    4. Which bound does erasure select from an intersection bound, and why are `new T()` and `instanceof T` restricted?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Designing valid bounds | Declare `<T extends Number & Comparable<? super T>>` for `NumericRange` and validate it. |
    | Supporting valid subtypes | Explain and run `max(List<Employee>)` when Employee compares through Person. |
    | Choosing between T and wildcards | Write appropriate signatures for a function returning the exact element type and one that only reads numbers. |
    | Recognizing type-system errors | Distinguish compile-time errors, erasure, null data, and runtime invariant checks. |
- id: language-mechanics-003
  title: Type Relationships in Generic Constructs
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Type Relationships in Generic Constructs**

    Understand **type relationships between generic declarations and parameterized types**: Java uses invariance for concrete type arguments but supports use-site variance through `?`, `? extends`, and `? super`. Through `GenericTypeRelationsDemo`, determine valid assignments, read/write capabilities, PECS, wildcard capture, generic inheritance, and the differences from array covariance.

    ## 2. Questions Learners Should Be Able to Answer

    ### Subtypes, Invariance, and Wildcards

    1. Why is `ArrayList<Integer>` a `List<Integer>`, while `List<Integer>` is not a `List<Number>`?
    2. When a reference has type `List<?>`, `List<? extends Number>`, or `List<? super Integer>`, which read types and `add` operations does the compiler guarantee?
    3. Why is `List<?>` not equivalent to `List<Object>`, and why does a wildcard not make a collection immutable?

    ### Designing and Verifying Type Relationships

    1. Why does `<T> copy(List<? super T> dst, List<? extends T> src)` allow copying from `Integer` to `Number`?
    2. Why does `StringStore extends MemoryStore<String>` implement `Store<String>` but not become a `Store<Object>`?
    3. In `swapFirstTwo(List<?>)`, how does the `<T>` helper solve wildcard capture?
    4. Array covariance can cause an `ArrayStoreException` at runtime; at what stage does generic invariance reject the analogous assignment?
    5. How can type erasure and raw types cause name clashes or heap pollution?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Predicting type validity | Correctly classify assignments involving `List<Integer>`, `List<Number>`, wildcards, and `Store<T>`. |
    | Choosing producer/consumer signatures | Refine sum/copy/seed APIs according to their data-reading and data-writing roles. |
    | Handling wildcard capture | Use a generic helper to swap values of the same element type without unchecked casts. |
    | Explaining type errors | Distinguish compile-time errors, `ArrayStoreException`, heap pollution, and list mutability. |
- id: language-mechanics-004
  title: Static Types, Runtime Types, and Type Checking
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Static Types, Runtime Types, and Type Checking**

    Distinguish a **statically typed language** from runtime polymorphism in Java. Through `Notification`, learners distinguish a variable's static type from the object's actual class, explain how overloads are selected by static types and overrides dispatched by runtime objects, recognize `var` as type inference, and apply runtime validation at data/JSON/reflection boundaries instead of unchecked casts.

    ## 2. Questions Learners Should Be Able to Answer

    ### Static Types and Dynamic Behavior

    1. With `Notification n = new EmailNotification()`, what type does the compiler see, and which `format()` implementation does the JVM invoke?
    2. Why is `describe(Object)` selected when a variable has type `Object` despite holding a `String`, while `describe((String)value)` selects a different overload?
    3. Can a string later be assigned to `var count = 10`, and how does this differ from dynamic typing?
    4. How does static method hiding differ from runtime dispatch of overridden instance methods?

    ### Runtime Checks and API Design

    1. Why can `(String) Integer.valueOf(42)` lead to a `ClassCastException`, while pattern matching with `instanceof` handles inputs of unknown type more safely?
    2. Generics check type arguments at compile time, so why can't `instanceof List<String>` be used when receiving JSON?
    3. What does Class<T>.isInstance/cast validate, and why must empty emails, negative amounts, and business authorization still be checked?
    4. When is `instanceof` appropriate for classification at a boundary, and when should interfaces and polymorphism be used instead?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Distinguishing type systems | Explain how statically typed Java supports dynamic dispatch and how it differs from Python/JavaScript. |
    | Predicting dispatch | Interpret overload(Object/String) results, overridden `format()`, and static method hiding correctly. |
    | Using safe type checks | Classify `Object` with pattern matching via `instanceof`/`Class.cast`, without unchecked downcasts. |
    | Validating external data | Convert `List<?>` to `List<String>` with per-element checks while still validating business rules. |
- id: language-mechanics-005
  title: Operators, Properties, and Language Conventions
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Operators, Properties, and Language Conventions**

    Use operators, numeric promotion, short-circuit evaluation, fields/accessors, and Java conventions to build meaningful OOP APIs while avoiding calculation errors, overflow, and state leaks. The lesson distinguishes `==` from value equality, JavaBeans properties from fields, `record` accessors from getters, and `final`, `static`, and `var` from genuine immutability.

    ## 2. Questions Learners Should Be Able to Answer

    ### Operators and Expression Evaluation

    1. Why does `5 / 2` evaluate to 2 before assignment to a double, while `(double)5/2` yields 2.5?
    2. How do precedence, associativity, and evaluation order differ in `"Tổng: " + 1 + 2` and `x = y = z`?
    3. Why can `byte value = 127; value += 1` become negative, while `Math.addExact` throws on overflow when it matters?
    4. Why does `&&` preserve a null guard while `&` still evaluates the right operand, and how do `>>` and `>>>` differ when shifting negative numbers?

    ### Fields, Properties, and Behavior

    1. For String, arrays, and records, when should `==`, `equals`, `Arrays.equals`, or BigDecimal's `compareTo` be used?
    2. How do fields, JavaBeans properties (`getX/isX`), local variables, and record component accessors `x()` differ?
    3. Why does a `final List` remain mutable, and when are `List.copyOf` or domain behaviors needed instead of setters?
    4. How do the `Product` record and `CartLine.increaseQuantity()` control unit prices and quantities?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Evaluating expressions correctly | Predict integer division, numeric promotion, short-circuiting, bit shifts, `?:`, and narrowing with `+=`. |
    | Protecting calculations | Apply Math.addExact/multiplyExact, VND currency units, and appropriate decimal representations. |
    | Designing encapsulation | Distinguish fields, getters/setters, record accessors, `final`, and mutable data. |
    | Verifying effects | Write a quantity-increase API with validation and test that failures leave state unchanged. |
- id: language-mechanics-006
  title: Equality and Hash Code Contracts
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Equality and Hash Code Contracts**

    Define **value equality** or identity deliberately through `equals(Object)` and `hashCode()` so `HashSet`/`HashMap` recognize keys correctly. The lesson covers reflexivity, symmetry, transitivity, hash collisions, immutable keys, fields participating in equality, arrays/records/BigDecimal, and pitfalls involving inheritance or JPA entities with generated IDs.

    ## 2. Questions Learners Should Be Able to Answer

    ### Equals and Hash Contracts

    1. How does `==` between references differ from `equals` on `CustomerId` and a `Comparable` comparison returning 0?
    2. What are the five properties of `equals(Object)`, and why does `equals(a,b)` being true require equal hash codes while equal hash codes do not prove equality?
    3. Why do `HashSet.add` and `HashMap.get` need both `hashCode` and `equals` to handle collisions?
    4. Why must equality based on `tenantId` + `customerId` have a hash consistent with the same identity semantics?

    ### Lifecycle and Data Structure Pitfalls

    1. What happens if a key's `username` changes after `Map.put`, even when equals/hashCode use the same field?
    2. Why can `Point.equals(ColoredPoint)` violate symmetry, and how can `final`/composition help avoid the problem?
    3. Does a record containing an array automatically use `deepEquals`, and when are `Arrays.equals` + `Arrays.hashCode` and defensive copying needed?
    4. Why do `BigDecimal("1.0")` and `BigDecimal("1.00")` differ in a HashSet but potentially count as one value in a TreeSet?
    5. For a JPA entity with a database-generated ID and proxy, why is there no single equals/hashCode formula for every lifecycle?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Writing safe value objects | Implement immutable `CustomerId`/`ProductKey` values with equals/hashCode based on a consistent set of identity fields. |
    | Verifying hash collections | Show that an equal-valued new key can retrieve an entry from `HashMap` and adding it to `HashSet` does not increase the element count. |
    | Detecting risks | Identify mutable keys, hash collisions, symmetry violations caused by inheritance, and comparator differences. |
    | Handling special types | Choose appropriate equality/hash behavior for arrays, records, and BigDecimal, and evaluate ORM entities across their lifecycles. |
    | Testing contracts | Design tests for reflexivity, symmetry, transitivity, null handling, hash consistency, and key stability. |
- id: language-mechanics-007
  title: Object String Representations and Diagnostics
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Object String Representations and Diagnostics**

    Design **`toString()` as a diagnostic representation** to help developers track IDs and state without exposing secrets or incurring I/O costs. Through `Order` and `OrderDiagnostic`, the lesson distinguishes developer-facing strings from DTOs, APIs, and customer messages, and examines `Object.toString`, records/arrays/collections, logging, stack traces, and recursion errors caused by bidirectional relationships.

    ## 2. Questions Learners Should Be Able to Answer

    ### Object Representations and Safe Data

    1. Why is Object's `ClassName@hexHash` neither a reliable memory address nor a business ID?
    2. How do `println(order)` and `String.valueOf(order)` use `toString`, and how does that differ from directly calling `nullRef.toString()`?
    3. Why should `Order.toString` include `orderId`, `status`, `itemCount`, and `traceId` but omit email addresses and tokens?
    4. Why might the automatically generated toString of `record Credentials` expose passwords, and why do arrays need `Arrays.toString/deepToString`?

    ### Diagnostics and Side Effects

    1. Why can `Parent`/`Child` objects printing each other cause `StackOverflowError`, and how does representing relationships by ID help?
    2. Why shouldn't `toString` query a repository, traverse a large graph, or become an API's JSON/schema format?
    3. How does logging with levels, suppliers/placeholders, and a passed Throwable differ from simply concatenating message strings?
    4. Which tests confirm that diagnostics include useful fields without exposing secrets, even as formatting changes?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Overriding toString deliberately | Create concise, non-null, side-effect-free diagnostics with an appropriate allowlist of fields. |
    | Controlling sensitive data | Distinguish fields safe to log from email addresses/tokens that must be omitted and write leak-prevention tests. |
    | Recognizing recursion and performance costs | Identify reference cycles, lazy loading, large lists, and shallow-snapshot mitigations. |
    | Separating representation purposes | Design separate DTOs, public views, and structured logs instead of parsing or serializing `toString`. |
- id: language-mechanics-008
  title: Exceptions, Failure States, and Method Contracts
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Exceptions, Failure States, and Method Contracts**

    Design **method contracts** covering preconditions, postconditions, invariants, side effects, and failure semantics. Through `StockService.reserve`, distinguish `Reserved/Rejected` for expected business outcomes, `IllegalArgumentException` for invalid inputs, and infrastructure exceptions for failures; understand checked/unchecked exceptions, propagation/causes, try-with-resources, and state protection during failures and concurrent operations.

    ## 2. Questions Learners Should Be Able to Answer

    ### Results, Exceptions, and Contracts

    1. Why do OUT_OF_STOCK, negative quantities, and unavailable databases require results or exceptions with different meanings?
    2. What do preconditions, postconditions, invariants, failure contracts, and atomicity say about the state after `reserve`?
    3. When should `boolean`, `Optional`, a sealed `ReserveResult`, or a domain exception be chosen?
    4. Which compile-time rules distinguish checked from unchecked exceptions, and how do `throw` and `throws` differ?

    ### Propagation, Atomicity, and Substitution

    1. Why does `new RuntimeException(e.getMessage())` lose the cause, and at which layer should exceptions be translated?
    2. How does try-with-resources preserve primary and suppressed exceptions, and why is cleanup not the same as rollback?
    3. If a balance has already been debited before sending email throws an exception, does catching the exception undo the debit, and what must transactions/outboxes/idempotency address?
    4. Under LSP, how can adding a checked exception or changing the meaning of Optional.empty in an override break a contract?
    5. Why is retrying after a timeout not always safe, and how should `InterruptedException` be handled or the interrupt status restored?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Writing clear contracts | Describe inputs, results, rejection behavior, and state that remains unchanged after failure. |
    | Classifying failures at the right layer | Design meaningful Result/Optional values or exceptions without masking database failures as missing data. |
    | Preserving causes and resources | Wrap exceptions with their causes, use try-with-resources, and distinguish suppressed exceptions. |
    | Preserving state | Test success, rejection, and invalid arguments, verifying that no unintended state changes occur. |
    | Evaluating distributed-system risks | Explain transactions, optimistic locking, retries, and idempotency when side effects are involved. |
- id: language-mechanics-009
  title: Language Differences When Implementing the Same OOP Design
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Language Differences When Implementing the Same OOP Design**

    Compare how **the same `ShippingPolicy` model** is represented in Java, Kotlin, Python, TypeScript, and C#, identifying differences in nominal/structural typing, records/data classes/protocols/interfaces, equality/nullability semantics, integers/decimals, and runtime validation. The focus is on preserving the shipping-fee contract when porting code rather than copying classes one by one.

    ## 2. Questions Learners Should Be Able to Answer

    ### The Same Requirements Across Five Languages

    1. Which shared roles represent the rules `standard = 20.000 VND` and `express = 35.000 + 8.000 × ceil(grams/1000)`?
    2. How do Java/Kotlin/C# declare nominal interface contracts, and how does this differ from Python Protocol and TypeScript structural typing?
    3. How do Java records, Kotlin data classes, Python frozen dataclasses, TypeScript Readonly, and C# readonly record structs differ in reference/value behavior and deep immutability?
    4. Why does Python `bool` require a separate check despite inheriting from int, while TypeScript JSON/number values require runtime validation?

    ### Porting Designs While Preserving Correctness

    1. Why do Java/Kotlin/C# use integer division, Python use `//`, and TypeScript use `Math.ceil` when calculating fees for positive weights?
    2. Why should Java record `equals`, Kotlin `==`/`===`, Python `==`/`is`, JS `===`, and C# record equality not be translated mechanically?
    3. Which tests ensure that 1, 1000, 1001, 1200, and 100000 grams and error cases behave consistently across implementations?
    4. When can a single-method interface be replaced with a function type/callable while preserving the policy/service boundary?

    ## 3. Expected Learning Outcomes

    | Competency | Expected outcome |
    | --- | --- |
    | Comparing language mechanisms | Explain nominal/structural typing, nullability, and runtime checks across all five languages. |
    | Preserving shipping-fee contracts | Implement/test the standard/express formulas and reject weights outside 1–100000 grams. |
    | Distinguishing equality and mutability | Identify differences in reference/value semantics, readonly/final, and mutable collections when porting code. |
    | Porting with verification | Build a parity-test matrix for boundary weights, unsupported codes, and JSON data with incorrect types. |
