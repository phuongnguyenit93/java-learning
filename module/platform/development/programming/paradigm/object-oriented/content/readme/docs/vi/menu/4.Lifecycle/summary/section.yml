version: 1
type: LEARNING_ROADMAP
title: VÒNG ĐỜI — LIÊN KẾT BÀI HỌC
roadmapHeading: Mạch liên kết bài học
roadmap:
- id: lifecycle-001
  order: 1
  title: Tạo đối tượng và cấp phát tài nguyên
  description: Phân biệt instance, tham chiếu và tài nguyên ngoài JVM, theo dõi quá trình `new`, rồi chủ động đóng resource
    thay vì chờ GC.
  transition:
    to: lifecycle-002
    description: '**Từ tạo instance → xác định thế nào là trạng thái khởi tạo hợp lệ**'
- id: lifecycle-002
  order: 2
  title: Hàm khởi tạo và thiết lập trạng thái hợp lệ
  description: Định nghĩa invariant và tổ chức validation, defensive copy, `final` để một constructor hoàn tất luôn tạo trạng
    thái hợp lệ.
  transition:
    to: lifecycle-003
    description: '**Từ bảo vệ invariant → lựa chọn những đường gọi constructor duy trì invariant đó**'
- id: lifecycle-003
  order: 3
  title: Khởi tạo mặc định, tham số và nhiều cách khởi tạo
  description: Phân biệt default/no-arg/parameterized constructors, thiết kế overload và nối chuỗi `this(...)`/`super(...)`
    bảo vệ cùng quy tắc.
  transition:
    to: lifecycle-004
    description: '**Từ chuỗi this/super → truy vết toàn bộ thứ tự khởi tạo trong kế thừa**'
- id: lifecycle-004
  order: 4
  title: Thứ tự khởi tạo trong quan hệ kế thừa
  description: Truy vết static initializer, instance initializer và constructor theo chiều lớp cha đến lớp con; phát hiện
    override chạy quá sớm.
  transition:
    to: lifecycle-005
    description: '**Từ cơ chế constructor → mở rộng sang API tạo đối tượng có tên và cấu hình**'
- id: lifecycle-005
  order: 5
  title: Hàm tạo tĩnh, Factory và Builder
  description: Lựa chọn constructor, static factory, Factory chọn implementation hoặc Builder để diễn đạt cách tạo object
    phù hợp API.
  transition:
    to: lifecycle-006
    description: '**Từ cách tạo object → xem object còn tồn tại bao lâu và ai đang giữ tham chiếu**'
- id: lifecycle-006
  order: 6
  title: Thời gian tồn tại, khả năng truy cập và giải phóng bộ nhớ
  description: Đọc đồ thị GC roots và lifetime theo reachability, phát hiện alias, cache, listener hay ThreadLocal làm đối
    tượng bị giữ lại.
  transition:
    to: lifecycle-007
    description: '**Từ đồ thị reachability → hiểu GC thực sự thu hồi gì và đo bộ nhớ thế nào**'
- id: lifecycle-007
  order: 7
  title: Thu gom rác và quản lý bộ nhớ thủ công
  description: Giải thích trách nhiệm của GC đối với heap và giới hạn với native resource, đo đạc các dạng memory pressure
    khác nhau.
  transition:
    to: lifecycle-008
    description: '**Từ cơ chế quản lý heap → quy định thời điểm hoàn trả tài nguyên ngoài heap**'
- id: lifecycle-008
  order: 8
  title: Đóng tài nguyên và giới hạn của hàm hủy
  description: Thiết kế quyền sở hữu và `close()` có thời điểm rõ ràng bằng try-with-resources, kể cả khi có nhiều tài nguyên
    và lỗi khi đóng.
  transition:
    to: lifecycle-009
    description: '**Từ đóng đúng vòng đời sử dụng → bảo đảm không công bố object trước khi sẵn sàng**'
- id: lifecycle-009
  order: 9
  title: Tránh để đối tượng chưa khởi tạo xong bị sử dụng
  description: |-
    Bảo đảm object được khởi tạo hoàn tất trước khi công bố cho callback, thread hay registry; sử dụng safe publication phù hợp.
  transition: null
comparisonMarkdown: |-
  ## 2. Bảng đối chiếu các bài học

  | Tiêu chí | Bài 1 | Bài 2 | Bài 3 | Bài 4 | Bài 5 | Bài 6 | Bài 7 | Bài 8 | Bài 9 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Tên | Tạo đối tượng và cấp phát tài nguyên | Hàm khởi tạo và thiết lập trạng thái hợp lệ | Khởi tạo mặc định, tham số và nhiều cách khởi tạo | Thứ tự khởi tạo trong quan hệ kế thừa | Hàm tạo tĩnh, Factory và Builder | Thời gian tồn tại, khả năng truy cập và giải phóng bộ nhớ | Thu gom rác và quản lý bộ nhớ thủ công | Đóng tài nguyên và giới hạn của hàm hủy | Tránh để đối tượng chưa khởi tạo xong bị sử dụng |
  | Vấn đề cần hiểu | `new` tạo instance khác gì gán tham chiếu, còn file/socket phải đóng thế nào? | Constructor bảo vệ invariant và dữ liệu mutable ra sao? | Default/no-arg/overload và `this`/`super` được chọn thế nào? | Static, instance initializer và constructor cha/con chạy theo thứ tự nào? | Khi nào dùng static factory, Factory hoặc Builder? | Scope, GC roots, weak reference và object retention có quan hệ gì? | GC xử lý heap đến đâu, khi nào cần quản lý native memory? | Đóng resource theo ownership và xử lý exception khi close thế nào? | Làm sao ngăn `this escape`, callback sớm và công bố giữa các thread? |
  | Giá trị đối với OOP/module | Hiểu ranh giới instance và resource khi bắt đầu vòng đời. | Tạo object hợp lệ, bảo vệ trạng thái và các tiền điều kiện. | Xây dựng API constructor rõ nghĩa, không lỗi chuỗi khởi tạo. | Đọc đúng hành vi kế thừa và tránh kết quả khởi tạo bất ngờ. | Thiết kế cách tạo object và lựa chọn implementation linh hoạt. | Tránh giữ object vô hạn, chủ động giới hạn cache/listener. | Tách giám sát heap, native memory và chính sách GC thực tế. | Hoàn trả file, JDBC, socket đúng lúc và đúng người sở hữu. | Ngăn dùng object dở dang, giảm lỗi đồng thời khó tái hiện. |
  | Tư duy hình thành | Phân tích hai vòng đời: bộ nhớ và tài nguyên. | Bắt đầu từ hợp đồng trạng thái trước khi gán field. | Xem mọi overload như một đường tới invariant chung. | Dự đoán bằng trace thực thi thay vì chỉ nhìn thứ tự khai báo. | Chọn mức trừu tượng tạo đối tượng theo bài toán. | Lần theo đường từ roots đến object và chính sách retention. | Dựa trên số liệu và hợp đồng API, không kỳ vọng GC tất định. | Chủ động quản lý quyền sở hữu, cleanup và lỗi. | Khởi tạo xong, rồi kích hoạt và công bố có đồng bộ. |
