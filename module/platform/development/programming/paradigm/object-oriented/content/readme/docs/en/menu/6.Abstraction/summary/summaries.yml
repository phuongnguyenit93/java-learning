summaries:
- id: abstraction-001
  title: Abstraction and Selecting Essential Characteristics
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Abstraction and Selecting Essential Characteristics**

    A real-world object has many characteristics, but each software feature needs only some of them. This lesson helps learners start from business questions to select appropriate data, behavior, and rules, avoiding a model so large that every caller must carry it around or understand its internal formulas.

    Through the shipping-fee quotation problem, learners see why QuoteInput contains only weight and distance, ShippingPricing exposes the quoting behavior, and standard and express pricing policies keep their own algorithms. Tracking the same parcel may require a different view.

    ## 2. Questions Learners Must Be Able to Answer

    ### Identifying Essentials in Context

    1. Why can't a single fixed set of essential attributes serve every problem involving a parcel?
    2. If the use case changes from fee quotation to shipment tracking, how must the exposed data and behavior change?
    3. When does information previously omitted become a required input because business rules have changed?

    ### Designing and Verifying Contracts

    1. Why does QuoteInput need only weightGrams and distanceKm in the example formula, while ShippingPricing should expose the quoteFee behavior?
    2. What guarantees about units, valid values, rounding, and errors must callers of ShippingPricing know?
    3. Compared with an EverythingShipment containing many unrelated fields, which dependencies does use-case-specific input design reduce?
    4. Why can a concrete class or record embody abstraction without requiring an abstract class or interface?
    5. For 1.001 grams (one thousand and one grams) and 0 km, how can the standard fee be derived from the lesson's weight-rounding contract?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Analyze requirements by use case | Tabulate which parcel attributes to retain or omit and justify each choice using specific business rules. |
    | Design minimal input data | Sketch a record or class for quoting or tracking, with appropriate field names, units, and validation. |
    | Build behavioral contracts | Propose an API whose methods and result types express business intent instead of making callers implement the algorithm. |
    | Separate contracts from implementation policies | Identify the roles of ShippingPricing, StandardPricing, ExpressPricing, and composition in the example. |
    | Evaluate abstraction levels | Identify an overly broad model or vague Object contract and propose a more specific API boundary. |
    | Verify results against rules | Calculate fees for weight-rounding boundary cases and compare them with the example outputs. |
- id: abstraction-002
  title: Distinguishing Abstraction from Encapsulation
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Distinguishing Abstraction from Encapsulation**

    This lesson helps learners recognize two distinct design questions: which capabilities an object should expose to users, and which paths for changing its state it must control. Having an interface does not necessarily protect data; having private fields does not necessarily make an API express the right responsibilities.

    With SeatInventory and InMemorySeatInventory, learners distinguish the seat-booking contract used by BookingService from capacity checks, private fields, and history copies that protect invariants. Examples involving SafeAccount and mutable collections show why getters/setters or access modifiers alone are insufficient.

    ## 2. Questions Learners Must Be Able to Answer

    ### Distinct Roles of the Two Principles

    1. In the seat-booking example, where does SeatInventory express abstraction, and where does InMemorySeatInventory implement encapsulation?
    2. Why can BookingService switch from InMemorySeatInventory to SoldOutInventory without knowing how seats are stored?
    3. Under what conditions can a class without a separate interface still provide good abstraction?

    ### Protecting State and Identifying Flaws

    1. Why is encapsulation still weak if balance is declared private but setBalance accepts negative amounts?
    2. Why can directly returning a mutable List break invariants even if the field holding it is private final?
    3. When should List.copyOf be used, and why does copying a collection not automatically make its mutable elements deeply immutable?
    4. How do the private, package-private, protected, and public access levels affect control boundaries?
    5. Why is checking and then decrementing the seat count in reserve not automatically thread-safe?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Distinguish design goals | Classify scenarios as abstraction, encapsulation, or both, with explanations based on responsibilities and invariants. |
    | Analyze client dependencies | Explain why BookingService uses only the SeatInventory contract and predict the effect of replacing its implementation. |
    | Protect invariants | Write or fix constructors and reserve, deposit, and withdraw methods to reject invalid values. |
    | Detect exposed mutable state | Identify paths for modifying internal data through a List getter and propose suitable snapshots or read-only APIs. |
    | Evaluate access control | Choose access levels for state and public operations, explaining how these choices protect the contract. |
    | Recognize technical limitations | Explain why interfaces/private fields cannot replace synchronization or transactions when updates contend. |
- id: abstraction-003
  title: Usage Contracts and Implementation Details
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Usage Contracts and Implementation Details**

    This lesson helps learners distinguish the promises callers may rely on from algorithms, storage, or external services that may change. Matching Java signatures is insufficient: return values, errors, units, side effects, and evaluation timing all form part of a behavioral contract.

    The LeavePolicy example uses regular and probationary leave policies to show how two implementations may return different decisions while respecting shared guarantees: never approve more days than remain, never return null, and never silently deduct leave quota. Learners also practice verifying contracts and isolating clients when providers change.

    ## 2. Questions Learners Must Be Able to Answer

    ### Defining Contracts from the Caller's Perspective

    1. For LeavePolicy.evaluate, which input conditions, results, errors, and side effects belong to the shared contract?
    2. Why are @Override and a LeaveDecision return type insufficient to ensure semantic compliance by an implementation?
    3. Why does APPROVED in the example represent only an evaluation of a snapshot, rather than proof that the leave request was saved or leave days deducted?

    ### Substitutability and Testing

    1. Why can a regular policy approve 3 of 5 days while a probationary policy rejects 3 of 5 days, with both remaining valid?
    2. Which specific guarantees are violated by an implementation that returns null, approves 6 of 5 days, or deducts leave days itself?
    3. How does a shared contract test differ from testing LeaveReviewService with a fake policy?
    4. When moving an implementation to REST/HTTP, what additional limits concerning timeouts, system errors, data freshness, and retries might callers need to know?
    5. Which changes break the contract even when the evaluate signature stays the same?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Specify behavioral contracts | Define the valid range of LeaveRequest values, the non-null guarantee for LeaveDecision, shared rules, and the no-side-effect guarantee. |
    | Separate client/provider roles | Draw the LeaveReviewService → LeavePolicy dependency and identify the policies as substitutable implementations. |
    | Analyze substitutability | Classify APPROVED, EXCEEDS_TRIAL_LIMIT, null, and changes to quota as compliant or noncompliant with the contract. |
    | Build contract tests | Propose tests for non-null results, no approval beyond available leave, rejection of null, and no data modification. |
    | Test clients independently | Choose a contract-compliant fake policy to test the path for passing requests and receiving decisions. |
    | Evaluate implementation changes | List observable properties when moving from in-memory to HTTP and identify guarantees that need updating. |
- id: abstraction-004
  title: Preconditions, Postconditions, and Behavioral Guarantees
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Preconditions, Postconditions, and Behavioral Guarantees**

    An API is trustworthy only when it clearly defines the state required before a call, the result after success, and what must remain true throughout the object's lifetime. This lesson uses SeatInventory to turn seat reservation/release rules into guarantees that can be calculated, implemented, and tested.

    Learners distinguish invalid-input errors from insufficient seats, verify that state is preserved on failure, detect implementations that improperly strengthen preconditions, and recognize limitations in multithreaded or asynchronous execution.

    ## 2. Questions Learners Must Be Able to Answer

    ### Expressing Verifiable Guarantees

    1. How do preconditions, postconditions, and invariants differ for reserve(n) and release(n)?
    2. Starting with capacity = 10 and available = 10, what values must be guaranteed after reserve(3) followed by release(1)?
    3. Why is the postcondition “the seat count is updated” weaker than the formula available_after = available_before - n?
    4. When reserve(9) is called with only 8 seats available, what error must the example API report, and how must it preserve state?

    ### Substitution, Errors, and Execution Conditions

    1. Why does an implementation accepting reserve(n) only when n is at least 2 violate a contract that permits reserve(1)?
    2. How can contract tests verify state before and after calls, including exception paths?
    3. Why is Java's assert unsuitable as the sole guard for public API parameters?
    4. How do the guarantees change if reserve executes asynchronously or multiple threads reserve seats concurrently?
    5. Why is checking available() and then calling reserve(1) in separate calls insufficient to guarantee atomicity?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Specify preconditions and postconditions | Write success rules, exceptions, and before/after state formulas for reserve and release. |
    | Prove invariants | Analyze constructors, updates, and failure branches to verify 0 ≤ available ≤ capacity. |
    | Implement to the contract | Validate before changing state and explain why an error must not partially deduct seats. |
    | Analyze LSP compatibility | Detect subclasses that strengthen preconditions or weaken postconditions and propose correct designs. |
    | Create behavioral tests | Design boundary tests for sufficient seats, insufficient seats, nonpositive n, excessive releases, and unchanged state on errors. |
    | State the scope of guarantees | Distinguish synchronous and asynchronous results, multithreaded updates, and the system-level limits of transactions or synchronized. |
- id: abstraction-005
  title: Abstract Classes and Abstract Methods
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Abstract Classes and Abstract Methods**

    This lesson shows how to use an abstract class to share state, constructors, and a stable process among related classes, while abstract methods specify steps that subclasses must implement. This is a concrete Java mechanism for establishing inheritance contracts and polymorphism without duplicating shared validation code.

    With ShippingPlan, learners trace how final quote() validates data, calls extraFee() as overridden by EconomyShipping or ExpressShipping, and then calculates the total fee. The lesson also clarifies abstract-class constructors, compilation errors, overriding restrictions, and when to choose an interface instead of inheritance.

    ## 2. Questions Learners Must Be Able to Answer

    ### Syntax and Object Lifecycles

    1. Why can't ShippingPlan be instantiated directly with new, while a ShippingPlan variable can refer to EconomyShipping?
    2. Can an abstract class have constructors, fields, methods with bodies, and no abstract methods?
    3. When is shared state handled by the parent constructor during subclass instantiation?
    4. Why should a parent constructor avoid calling overridable methods?

    ### Shared Processes and Overriding

    1. Why is quote() marked final while extraFee() is declared abstract in the pricing example?
    2. When a ShippingPlan variable refers to ExpressShipping, how does Java determine which extraFee() runs?
    3. Which compilation errors arise if a concrete class fails to implement an abstract method, reduces visibility, or uses an incorrect overriding signature?
    4. When is an abstract class more useful than an interface, and when does composition express the intent more clearly?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Identify valid syntax | Distinguish valid abstract class/method declarations from abstract methods with bodies, abstract final combinations, or direct instantiation of abstract classes. |
    | Create a shared base class | Design an abstract class with a constructor, protected state, and shared methods for a family with a genuine inheritance relationship. |
    | Implement variation points | Override extraFee and label correctly with appropriate signatures, visibility, and return types. |
    | Explain Template Method | Simulate quote → validation → runtime extraFee → fee summation, and explain why final fixes the process. |
    | Verify initialization lifecycles | Analyze the risk of calling overridden methods before subclass fields are fully initialized. |
    | Choose abstraction mechanisms | Compare abstract classes, interfaces, and composition based on shared state/process requirements and single-inheritance limits. |
- id: abstraction-006
  title: Distinguishing Concrete Classes from Abstract Classes
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Distinguishing Concrete Classes from Abstract Classes**

    This lesson clarifies the roles of reference types and the actual instantiated class in an inheritance hierarchy. An abstract class describes shared behavior and unfinished parts; a concrete class implements all remaining methods so that objects can be created, provided constructors and access levels permit it.

    The NotificationChannel example with EmailChannel and SmsChannel shows how shared final send() invokes each subclass's own deliver(). Learners thereby distinguish abstract classes from abstract methods, interpret polymorphic behavior, and detect compilation errors caused by incomplete implementations.

    ## 2. Questions Learners Must Be Able to Answer

    ### Distinguishing Class Types from Objects

    1. In NotificationChannel channel = new SmsChannel(), what are the declared type and the actual object type?
    2. How do abstract and concrete classes differ in direct instantiation and the obligation to implement abstract methods?
    3. Why can an abstract class with no abstract methods still not be instantiated directly?
    4. Must a concrete class define new methods itself if all required method implementations are inherited?

    ### Tracing Behavior and Choosing Structures

    1. Why can final send() still lead to different ways of sending email or SMS?
    2. How does NotificationChannel's constructor run when creating new EmailChannel, and why should constructors avoid calling overridable hooks?
    3. When is the Trackable interface preferable to forcing unrelated types to inherit from one abstract class?
    4. What errors occur if a subclass fails to override deliver(), overrides the wrong name, or declares an abstract method private?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Determine instantiability | Classify abstract, concrete, and final classes, and explain when new expressions are valid. |
    | Interpret reference and runtime types | Explain that the object is created as SmsChannel while the NotificationChannel variable exposes a shared API surface. |
    | Trace dynamic polymorphism | Simulate send() validating data and then dispatching deliver() according to each concrete object. |
    | Complete subclasses | Write subclasses that correctly implement abstract methods and use @Override to verify signatures. |
    | Evaluate parent constructors | Predict initialization order and identify risks of invoking overridden methods too early. |
    | Choose OOP relationships | Propose abstract classes, interfaces, concrete classes, or composition based on actual shared-behavior needs. |
- id: abstraction-007
  title: Choosing the Right Level of Abstraction
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Choosing the Right Level of Abstraction**

    Abstraction is useful only when it makes business behavior clear and keeps the cost of change reasonable. This lesson helps learners recognize that too little abstraction forces callers to duplicate logic, while excessive abstraction makes a simple feature pass through many confusing layers of classes, factories, and generics.

    Through parking-fee policies, learners start with a concrete ParkingFeeCalculator for one formula, then extract ParkingFeePolicy when two pricing policies must be used by ParkingCheckout. The 15-, 16-, 75-, and 76-minute cases demonstrate that raising the abstraction level must preserve behavior.

    ## 2. Questions Learners Must Be Able to Answer

    ### Assessing Design Levels

    1. Why is it too little abstraction to let the UI, REST controller, and batch job each calculate parking fees themselves?
    2. When there is only one fixed formula, why might a ParkingFeeCalculator class with a clear API be sufficient?
    3. What signs indicate that a system of factories, registries, and AbstractRateEngine is too general for current requirements?

    ### Evolving with Actual Needs

    1. When do HourlyPolicy and FlatPerVisitPolicy provide a genuine reason to introduce ParkingFeePolicy?
    2. What can change without modifying checkout logic when ParkingCheckout receives its policy through a constructor?
    3. Why can using Object or Map for input make a contract ambiguous despite appearing highly reusable?
    4. How can the design move from one calculator to multiple policies while preserving fees at 15, 16, 75, and 76 minutes?
    5. When is composition more suitable than multilevel inheritance for multiple policies?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Diagnose under- or over-abstraction | Identify scattered formulas or intermediate layers with unclear responsibilities and explain their concrete consequences. |
    | Choose a sufficient starting API | Propose a concrete class with a calculateVnd method, explicit parameter constraints, and transparent results. |
    | Recognize genuine variation points | Explain when ParkingFeePolicy should be extracted because checkout must support two different formulas. |
    | Design composition | Describe ParkingCheckout containing a ParkingFeePolicy and how the corresponding implementation is supplied. |
    | Preserve behavior when refactoring | Tabulate fees at 0, 15, 16, 75, and 76 minutes and error values for negative input. |
    | Evaluate design costs | Compare readability, dependency counts, contract stability, and the cost of adding variants before creating another abstraction. |
- id: abstraction-008
  title: Implementation Details Leaking Through a Public Interface
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Implementation Details Leaking Through a Public Interface**

    An API may look abstract yet still force callers to understand HashMap, SQLException, transactions, or an implementation's incidental data ordering. This lesson helps learners detect implementation details that leak through a usage contract, making external code harder to adapt to another backend and more likely to break invariants.

    Through LeakyBookStore and BookCatalog, learners move from getInternalBooks().get(isbn) to findByIsbn and searchByTitle with clear semantics, distinguish not-found results from system errors, and consider behavioral properties that must be exposed, such as result ordering, data freshness, and Stream lifetimes.

    ## 2. Questions Learners Must Be Able to Answer

    ### Recognizing Leaked Details

    1. Why does getInternalBooks() returning a HashMap make callers depend on implementation details and potentially modify internal state?
    2. If a mutable HashMap is replaced with an unmodifiableMap, to what extent are the encapsulation and leaky-abstraction problems resolved?
    3. When are Path or IOException reasonable parts of a contract rather than signs of a leaky abstraction?

    ### Redesigning APIs and Preserving Semantics

    1. Which search behaviors should BookCatalog expose so LibraryService remains independent of HashMap, SQL, or HTTP?
    2. Why must Optional.empty for a missing book be distinguished from a database-query failure?
    3. Which search properties must remain consistent across implementations, such as case matching, ISBN ordering, and result limits?
    4. What lifecycle responsibilities does a Stream tied to an open connection impose on callers and adapters?
    5. When are Spring's Page/Pageable types a reasonable boundary, and when do they introduce unnecessary framework dependencies?
    6. What steps allow clients to migrate away from a leaky API without breaking usage compatibility?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Detect leaky APIs | Identify where the example exposes HashMap, ResultSet, SQLException, or session dependencies outside the caller's scope. |
    | Distinguish implementation leaks from poor encapsulation | Analyze exposed data structures separately from permission to mutate collections. |
    | Design business-oriented contracts | Sketch findByIsbn and searchByTitle with clear result types, input conditions, and meaningful errors. |
    | Protect returned data | Use List.copyOf where appropriate and explain the limits of shallow copies and mutable elements. |
    | Preserve substitutable behavior | Build tests for ISBN search, case matching, ordering, limits, and distinguishing no data from backend errors. |
    | Manage errors and resources | Describe how adapters map SQLException while preserving its cause and close connection-dependent Streams. |
    | Plan API migration | Identify caller needs, add business APIs, migrate calling code, remove old access paths, and test the contract. |
