summaries:
- id: subtyping-001
  title: Distinguishing Code Inheritance from Subtyping
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Distinguishing Code Inheritance from Subtyping**

    This lesson examines two design decisions side by side: reusing existing processing and allowing one type to substitute for another. Through NotificationSender, MessagePreparation, and AbstractReport, learners identify when implements/extends should express a role and when composition/delegation should share algorithms without introducing a misleading subtype relationship.

    ## 2. Questions Learners Must Be Able to Answer

    ### Two Goals and Java Mechanisms

    1. What need does code inheritance address, and what need does subtyping address in a notification system?
    2. Why do EmailSender and SmsSender both use MessagePreparation but are subtypes only of NotificationSender, not of the helper?
    3. In AbstractReport/SalesReport, which relationships does extends establish at the same time, and what role does the final render() method play?

    ### Substitutability and Design Choices

    1. Why can a subclass that compiles successfully still violate preconditions, postconditions, or side-effect expectations of supertype clients?
    2. What happens when Square extends Rectangle with two independent setters, and why is this more than a code-reuse problem?
    3. When does an interface default method provide reusable code, and when should a helper/composition be preferred over a superclass?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Distinguish goals | Separately identify code reuse, nominal subtype relationships, and behavioral substitutability requirements in a design. |
    | Analyze relationships | Interpret implements, extends, and has-a links in the NotificationSender–Sender–MessagePreparation diagram. |
    | Evaluate extends | Explain why SalesReport reasonably inherits render(), while CsvExporter should not extend TextEscaper merely to use escape(). |
    | Check contracts | Identify a case where a subtype violates input, output, or state guarantees despite matching signatures. |
    | Choose mechanisms | Recommend an interface, abstract class, default method, or composition based on roles and coupling. |
- id: subtyping-002
  title: Is-A Relationships and Substitutability
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Is-A Relationships and Substitutability**

    This lesson moves from Java type relationships to substitutability in real programs. With ShippingPolicy, StandardShipping, and ExpressShipping, learners distinguish permissible algorithmic differences from contract violations, while examining preconditions, postconditions, invariants, and signs of an incorrectly chosen is-a relationship.

    ## 2. Questions Learners Must Be Able to Answer

    ### Subtyping and Shared Contracts

    1. When Dog extends Animal, what does the compiler guarantee, and which behavioral promises must developers still verify?
    2. Why can StandardShipping quote 40000 VND and ExpressShipping quote 66000 VND for the same Parcel while both satisfy ShippingPolicy?
    3. What does ShippingPolicy guarantee about valid Parcels, nonnegative fees, null, overflow, and side effects?

    ### Substitutability in Practice

    1. Why might VeryLocalShipping rejecting a valid 10 km route violate LSP, while quoting a different fee does not?
    2. How may preconditions, postconditions, and invariants change when a subtype truly honors its supertype's contract?
    3. When should a Car having an Engine be modeled with composition, and when should clients check contract tests rather than relying on an is-a label?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Recognize subtypes | Distinguish compiler-validated extends/implements relationships from contract-based substitutability. |
    | Interpret pricing examples | Explain where the 40000/66000 VND quotes come from and show how both implementations satisfy the shared ShippingPolicy contract. |
    | Detect violations | Identify strengthened preconditions, weakened postconditions, or unpromised side effects in implementations. |
    | Analyze is-a/has-a | Recommend is-a relationships or composition based on public obligations rather than similar class names alone. |
    | Test substitutability | Propose verifyContract(ShippingPolicy) cases covering null, nonnegative results, unchanged inputs, and the valid input range. |
- id: subtyping-003
  title: Nominal and Structural Type Compatibility
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Nominal and Structural Type Compatibility**

    This lesson explains why Java does not treat two classes as compatible merely because their method names and signatures match. Through MessageSender and LegacySmsSdk, learners see the need for the appropriate extends/implements relationship and how adapters or method references integrate legacy SDKs, while distinguishing Java's nominal typing from TypeScript's structural typing.

    ## 2. Questions Learners Must Be Able to Answer

    ### Nominal and Structural Relationships

    1. Why can an EmailSender be assigned to MessageSender, while LegacySmsSdk cannot, despite having the same send(String,String) signature?
    2. How does structural typing differ from nominal typing, and why does the same send(...) signature not prove equivalent business semantics?
    3. How does Java recognize indirect extends/implements relationships when a class implements an inherited interface?

    ### Integration and Type Conversion Limits

    1. How does SmsSenderAdapter enable NotificationService to use LegacySmsSdk without making the SDK a subtype of MessageSender?
    2. Why can legacy::prefix be assigned to a functional interface while legacy itself does not become a subtype of that interface?
    3. When does a cast through Object cause ClassCastException, and why can't List<EmailSender> be assigned directly to List<MessageSender>?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Diagnose type errors | Explain incompatible types errors when two classes have similar APIs but lack a nominal subtype relationship. |
    | Design adapters | Sketch SmsSenderAdapter implements MessageSender and delegate send(...) to LegacySmsSdk. |
    | Compare typing systems | Briefly analyze a structurally compatible TypeScript example versus Java's requirement for an explicit type relationship. |
    | Use functional interfaces | Recognize valid lambda/method-reference conversions without confusing them with structural subtyping of the original object. |
    | Analyze limitations | Predict failed runtime casts, distinct types for records with identical fields, and generic List invariance. |
- id: subtyping-004
  title: Declared Types and Runtime Object Types
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Declared Types and Runtime Object Types**

    This lesson helps learners predict results when a reference variable has an interface as its declared type but points to different runtime implementations. Through CardPayment/EWalletPayment and overload/override examples, learners distinguish which operations the compiler permits, which method bodies are dispatched at runtime, and why fields and static methods do not follow dynamic dispatch.

    ## 2. Questions Learners Must Be Able to Answer

    ### Two Types for One Reference

    1. In PaymentMethod method = new CardPayment("1234"), what are the declared and runtime types, and what does each determine?
    2. Why does assigning method = new EWalletPayment(...) leave the declared type unchanged but change the results of description()/pay()?
    3. Why can't lastFourDigits() be called directly through PaymentMethod even when the runtime object is CardPayment?

    ### Call Resolution and Limitations

    1. Why does a.sound() call Dog's override after Animal a = new Dog(), while inspect(a) selects the Animal overload?
    2. How do field hiding and static method hiding differ from instance method overriding?
    3. What happens with instanceof, getClass(), and method calls when a reference is null or a collection contains multiple subtypes?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Identify both types | Correctly record each variable's declared type and runtime class during CardPayment/EWalletPayment assignments. |
    | Predict polymorphism | Identify which implementation's overridden method is called through PaymentMethod at each point. |
    | Distinguish overloading and overriding | Predict and explain the output Woof/Overload: Animal/Overload: Dog in DispatchRulesDemo. |
    | Diagnose member access | Detect methods missing from the declared type's API and explain how field/static hiding differs from dynamic dispatch. |
    | Design dependencies | Recommend an interface-typed parameter for CheckoutService when the code only needs shared payment behavior. |
- id: subtyping-005
  title: Upcasting from Subtypes to Supertypes
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Upcasting from Subtypes to Supertypes**

    This lesson focuses on converting a reference from a subtype to a supertype in Java. Through PremiumCustomer, Customer, Auditable, and payment interfaces, learners demonstrate that upcasting does not create a copy or change the runtime object, but narrows the API visible at compile time so clients depend on only the capabilities they need.

    ## 2. Questions Learners Must Be Able to Answer

    ### How Upcasting Works

    1. Given PremiumCustomer premium and Customer asCustomer = premium, how many objects does Java create, and which type view does asCustomer provide?
    2. Why does asCustomer.tier() invoke the override returning PREMIUM, while asCustomer.points() does not compile?
    3. To which supertypes can a Taxi be upcast through extends and implements, and why is an explicit cast usually unnecessary?

    ### Applications and Misconceptions

    1. How can List<Customer> hold both Customer and PremiumCustomer instances while still dispatching tier() according to runtime type?
    2. Why does upcasting to PaymentProcessor/RefundProcessor limit the API by capability without creating a security authorization mechanism?
    3. Why does List<PremiumCustomer> not automatically become List<Customer>, and when should List<? extends Customer> be used?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Trace references | Diagram premium/asCustomer/asAuditable/asObject all referencing the same PremiumCustomer. |
    | Predict results | Explain the tier, greeting, and auditLabel outputs and identity comparisons in the Customer example. |
    | Check static APIs | Classify valid and invalid calls through Customer and Auditable without mistaking restricted visibility for deletion of subclass data. |
    | Apply supertypes | Design functions accepting Customer or the PaymentProcessor interface to use polymorphism without requiring a concrete class. |
    | Compare generic types | Explain List invariance and select an appropriate wildcard for reading subtype instances without invalid list casts. |
- id: subtyping-006
  title: Downcasting and Type Checking
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Downcasting and Type Checking**

    This lesson addresses the risky direction of type conversion: a supertype reference does not guarantee that the actual object belongs to the desired subtype. Through Vehicle, ElectricCar, and Bicycle, learners use instanceof, pattern matching, and getClass() appropriately and predict ClassCastException, null behavior, and the limits of generic type checks caused by type erasure.

    ## 2. Questions Learners Must Be Able to Answer

    ### Casting and Verifying Subtypes

    1. When does (Dog) animal succeed or throw ClassCastException if animal refers to a Dog or a Cat?
    2. How does instanceof Car differ from v.getClass() == Car.class when v is an ElectricCar?
    3. How does Java 17 use instanceof Car car and flow scoping to permit subtype API calls only after a successful check?

    ### Errors and Design Choices

    1. What is the result of casting null to Dog, and which error occurs when calling a method on that value?
    2. Why can't instanceof List<String> be used, while List<?> can be used under type erasure?
    3. When move() is shared behavior for Vehicle, why should overriding be preferred over a chain of instanceof checks for each type?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Predict casts | Distinguish compile-time errors from runtime ClassCastException and predict the result of casting null in Animal/Dog/Cat scenarios. |
    | Use instanceof | Write pattern-matching branches to safely call Car.openTrunk() or Bicycle.ringBell() from Vehicle. |
    | Check classes | Accurately predict instanceof Car, instanceof ElectricCar, and getClass()==Car.class results for ElectricCar. |
    | Explain runtime generics | Describe the limits of instanceof List<String> and the risks of unchecked casts in Java. |
    | Propose abstractions | Replace a chain of vehicle-type checks used only to call move() with a polymorphic method on Vehicle. |
- id: subtyping-007
  title: Preserving Contracts When Extending Types
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **Preserving Contracts When Extending Types**

    This lesson turns LSP into verifiable criteria when adding implementations of DiscountPolicy. Examples using NoDiscount, PercentageDiscount, and deliberately incorrect policies clarify how to preserve the input domain, payable-amount bounds, side effects, and exceptions, and how to test the same contract across all subtypes.

    ## 2. Questions Learners Must Be Able to Answer

    ### Contract Conditions

    1. Why must DiscountPolicy accept every nonnegative subtotalVnd, including 0, and return a result within [0, subtotalVnd]?
    2. How can a subtype change the algorithm, as PercentageDiscount does, while preserving preconditions, postconditions, and invariants?
    3. In DiscountDemo, why does a 20% discount on 105 VND leave 84 VND payable, and which calculation avoids long overflow?

    ### Detecting and Verifying Violations

    1. Which parts of the contract are violated when WrongMinimumDiscount rejects small bills and WrongSurcharge increases the payable amount?
    2. Why does a subtype that unexpectedly throws UnsupportedOperationException or produces unpromised side effects remain invalid even if the compiler accepts it?
    3. Which boundary inputs, error cases, and result checks must verifyContract include to detect noncompliant implementations?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Specify contracts | Define the preconditions, postconditions, invariants, exceptions, and side effects of payableVnd(). |
    | Trace calculations | Predict the results of no-discount and 20% discount policies for 1000, 105, and a subtotal of 0. |
    | Detect LSP violations | Identify violations in WrongMinimumDiscount, WrongSurcharge, and the ReadOnlyAccount example that pretends to support withdraw(). |
    | Fix implementations | Propose a promotion policy that returns the original subtotal below a threshold rather than rejecting valid inputs. |
    | Design shared tests | Develop contract tests covering 0, small values, Long.MAX_VALUE, negative inputs, and result bounds. |
- id: subtyping-008
  title: The Rectangle–Square Counterexample
  summary: |-
    # 0. Learning Orientation

    ## 1. Lesson Purpose

    **The Rectangle–Square Counterexample**

    This lesson uses the Rectangle–Square counterexample to show that a relationship valid in geometry may not suit a mutable API. Through DemoBad and DemoGood, learners see how independent setters are broken, identify conflicting invariants, run contract tests, and choose small interfaces or immutable value objects for a redesign.

    ## 2. Questions Learners Must Be Able to Answer

    ### Analyzing the Rectangle–Square Violation

    1. What do the setWidth() and setHeight() contracts of a mutable Rectangle guarantee about the other dimension?
    2. Why does calling setWidth(5) and then setHeight(3) produce area 15 for Rectangle but 9 for its Square subclass?
    3. Why does Square changing both sides violate a postcondition, while throwing an error for unequal sides strengthens a precondition?

    ### Redesign and Testing

    1. Why is the geometric is-a claim alone insufficient to justify extends for an API with independent setters?
    2. How do Shape exposing only name()/area() and immutable RectShape/SquareShape records avoid this conflict?
    3. Which contract tests detect setters changing an unrelated dimension, and why does a chain of instanceof checks in clients fail to fix the broken contract?

    ## 3. Expected Learning Outcomes

    | Competency | Expected Outcome |
    | --- | --- |
    | Trace execution | Simulate setWidth(5) followed by setHeight(3) and explain the area difference between 15 and 9. |
    | Identify violations | Identify the broken setter postcondition and the strengthened precondition when Square rejects valid dimensions. |
    | Test substitutability | Write checks that the other dimension remains unchanged after each setter and observe Rectangle PASS/Square FAIL. |
    | Redesign abstractions | Propose a read-only Shape and two immutable shape types with separate dimension-changing methods. |
    | Choose boundaries | Explain when a shared Scalable contract is appropriate or when to separate RectangleResizer/SquareResizer by capability. |
