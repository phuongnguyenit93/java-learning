version: 1
type: LEARNING_ROADMAP
title: CLASS — LESSON CONNECTIONS
roadmapHeading: How the Lessons Connect
roadmap:
- id: class-001
  order: 1
  title: 'Class Structure: Fields and Methods'
  description: Identify fields, constructors, and methods in the `InventoryItem` class; see how validated APIs change its state.
  transition:
    to: class-002
    description: '**From class structure → see how class declarations lead to concrete instances and references**'
- id: class-002
  order: 2
  title: Declaring Classes and Creating Instances
  description: Distinguish a class from instances created with `new`, and trace aliases and independent state through `Workshop`.
  transition:
    to: class-003
    description: '**From each instance’s state → distinguish individual data from members shared by the class**'
- id: class-003
  order: 3
  title: Instance Members and Shared Members
  description: Choose instance or `static` members according to whether data belongs to each object or the class; recognize the limits of shared state.
  transition:
    to: class-004
    description: '**From data ownership → choose the access level for each member**'
- id: class-004
  order: 4
  title: Member Access Levels
  description: Determine where fields and methods can be accessed using the four access levels, and design APIs that protect data.
  transition:
    to: class-005
    description: '**From permission to call members → clarify method inputs, outputs, and effects**'
- id: class-005
  order: 5
  title: Method Parameters, Return Values, and Side Effects
  description: Define method contracts for parameters, returns, side effects, and errors; correctly explain Java pass-by-value.
  transition:
    to: class-006
    description: '**From the effects of a method call → determine which state may change and how to protect it**'
- id: class-006
  order: 6
  title: Read-Only and Mutable Members
  description: Choose how state may be changed and its degree of immutability; avoid exposing mutable collections through APIs.
  transition:
    to: class-007
    description: '**From protected state → understand which instance `this` operates on**'
- id: class-007
  order: 7
  title: Referencing the Current Object
  description: Identify the current object using `this` in constructors, methods, chaining, and inner classes.
  transition:
    to: class-008
    description: '**From individual mechanisms → combine them in a bank account design with business rules**'
- id: class-008
  order: 8
  title: Designing a Class with a Bank Account Example
  description: Apply these principles to a `BankAccount` with a balance invariant and validated transactions.
  transition: null
comparisonMarkdown: |-
  ## 2. Lesson Comparison Table

  | Criterion | Lesson 1 | Lesson 2 | Lesson 3 | Lesson 4 | Lesson 5 | Lesson 6 | Lesson 7 | Lesson 8 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | Name | Class Structure: Fields and Methods | Declaring Classes and Creating Instances | Instance Members and Shared Members | Member Access Levels | Method Parameters, Return Values, and Side Effects | Read-Only and Mutable Members | Referencing the Current Object | Designing a Class with a Bank Account Example |
  | Key question | How do fields and methods work together? | How do `new` and aliases create or reference instances? | Who owns instance and static members? | Where can members be accessed from? | What does a method receive, return, and modify? | Who can change data, and how? | Which object does `this` refer to? | How can transactions preserve the balance invariant? |
  | Value for OOP/the module | Understand class structure and maintain valid state | Distinguish definitions, objects, and references | Choose the right ownership for individual and shared state | Keep APIs minimal and protect data | Define method contracts and side effects | Use `final`, getters, copies, and business operations | Initialize and call methods on the correct receiver, with valid chaining | Combine encapsulation, invariants, and error checks |
  | Mental model developed | Identify class components and responsibilities | Trace aliases and instance state | Determine state ownership and lifecycle | Design access boundaries | Predict state before and after calls | Distinguish reading, reassignment, and mutation | Always identify the current instance | Assess correctness and the limits of the model |
