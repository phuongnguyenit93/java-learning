interviewQuestion:
- groupID: 1
  groupName: OOP Fundamentals and Design Thinking
  questions:
  - question: What design problems does OOP address in systems with many business rules and constantly changing requirements?
    readmeRelated:
      anchorList:
      - oop-basic-001
      - oop-basic-006
      - class-design-001
      - class-design-003
      - modeling-003
      - solid-002
      - refactoring-001
      - practice-011
    knowledge: Design around responsibilities, state, and behavior; reduce coupling among business rules and limit the impact of
      changing requirements.
    answer: |-
      **The role of OOP:** organize components around objects with clear state, behavior, and responsibilities; objects interact through contracts instead of modifying shared data. When business requirements change, a good design confines those changes to the owners of the affected rules.

      For example, Order manages state and pay()/ship(); PricingPolicy calculates fees; CheckoutService coordinates the repository and payment gateway. Changing a fee policy should require modifying PricingPolicy, not formulas scattered across controllers, invoices, and emails.

      Mechanisms:
      - **Encapsulation** protects invariants: an order must not ship before payment.
      - **Abstraction** lets callers depend on contracts rather than a specific SDK.
      - **Polymorphism** allows valid policies to substitute for one another through a shared interface.
      - **Cohesion/coupling** place related rules with the same owner and reduce dependencies on other components' details.

      OOP does not automatically eliminate complexity: God Classes, excessively deep hierarchies, shared mutable state, and too many meaningless interfaces still make code difficult to change. Evaluate change impact, correctness, and practical unit-testability rather than counting classes.
  - question: How can you distinguish class, object, state, behavior, and identity?
    readmeRelated:
      anchorList:
      - oop-basic-002
      - oop-basic-003
      - class-001
      - object-001
      - modeling-006
    knowledge: A class defines structure and behavior; an object is an instance with state and identity; distinguish behavior
      from the data held by each instance.
    answer: |-
      A **Class** defines a type with fields, constructors, and methods. An **Object** is an instance created at runtime. Multiple objects of one class share a structure but have their own state and identity.

      - **State:** an object's current values, such as balance=100.
      - **Behavior:** a public operation such as deposit(amount), which validates amount before updating balance.
      - **Identity:** the particular object instance; two references point to the same instance when == returns true.

      Example:
          Account a = new Account(100);
          Account b = new Account(100);
          // a == b là false: hai instance
          a.deposit(20);
          // a.balance() = 120, b.balance() = 100

      The example assumes balance is an instance field, not static. Each object owns its instance fields; static fields belong to the class and are shared across instances. Do not confuse state with identity: two objects with balance=100 are still separate instances. Nor should identity be confused with equality as defined by equals. A well-designed domain object does more than hold fields: it owns behavior that protects invariants.
  - question: Why can two objects containing identical data still have different identities?
    readmeRelated:
      anchorList:
      - oop-basic-003
      - object-001
      - object-004
      - class-design-006
      - language-mechanics-006
      - practice-005
    knowledge: Distinguish reference identity (`==`) from equality (`equals`); entities retain stable identifiers even when
      their attributes match.
    answer: |-
      **Reference identity** differs from **value equality**. For Java references, a == b is true only if both variables refer to the same object (or both are null). a.equals(b) uses the class's equals contract; Object compares identities by default, but value objects can override it to compare values.

      For example, two Money records with amount=100 and currency="VND" are separate instances, so == is usually false, whereas equals returns true based on their record components. Conversely, two Customer objects named "An" with different customerId values represent different entities; comparing names alone would confuse their identities.

      An **Entity** should have a stable ID representing business identity; a **value object** is generally immutable and compared by its components. An equals override must satisfy reflexivity, symmetry, transitivity, and consistency, and equal objects must have the same hashCode. Including mutable fields in hashes can make keys unfindable in HashMap/HashSet after modification.

      In short, identical data does not imply the same object. Choose equality rules based on whether an object is an entity or value object; do not use == to compare values.
  - question: How do encapsulation, abstraction, inheritance, and polymorphism support software maintainability?
    readmeRelated:
      anchorList:
      - oop-basic-005
      - encapsulation-001
      - abstraction-002
      - inheritance-001
      - subtyping-002
      - polymorphism-001
      - solid-004
      - design-pitfalls-004
    knowledge: Understand information hiding, contracts, valid subtypes, and dynamic dispatch; assess inheritance trade-offs
      instead of applying it mechanically.
    answer: |-
      The four OOP properties serve different purposes:
      1. **Encapsulation:** hide representation and allow state changes through validated behavior. A private balance with an unrestricted public setBalance does not protect the invariant; withdraw must reject negative amounts and amounts exceeding the balance.
      2. **Abstraction:** expose necessary contracts while hiding implementations. Checkout depends on PaymentGateway rather than a vendor SDK.
      3. **Inheritance:** model is-a subtype relationships and potentially reuse code; under LSP, subclasses must preserve superclass contracts rather than merely sharing names or methods.
      4. **Polymorphism:** when fee() is called through PaymentMethod, runtime dispatch selects the appropriate CardPayment/QRPayment implementation without type-based switches in the caller.

      Encapsulation prevents invalid state, abstraction facilitates adapter replacement, and polymorphism supports new valid variants. Inheritance is useful when subtypes are genuinely substitutable, but deep hierarchies or extends used just to reuse a few methods often produce fragile base classes.

      **Trade-off:** every interface/subclass introduces configuration and indirection costs. Each class does not need all four properties; a simple concrete class or composition may be preferable. Validate the decision through requirement changes and concrete tests.
  - question: When is placing procedural functions inside a class still not good object-oriented design?
    readmeRelated:
      anchorList:
      - oop-basic-006
      - encapsulation-008
      - class-design-007
      - design-pitfalls-003
      - refactoring-004
      - practice-007
    knowledge: Distinguish procedural code wrapped in classes from objects that own invariants and behavior; recognize anemic domain models.
    answer: |-
      Procedural code does not become good OOP design simply by being placed in a class. A common symptom is an **anemic object** with only getters/setters, while a controller or God Service reads its fields, makes all decisions, and assigns state. Business rules become scattered and can be bypassed by new clients.

      For example, Order exposes only getStatus/setStatus; a controller checks whether it is paid before calling setStatus(SHIPPED). Another batch job can call the setter directly and ship an unpaid order.

      A better design keeps status private and exposes Order.pay() and Order.ship(); ship() requires PAID and otherwise throws IllegalStateException. The application service coordinates transactions, repositories, and gateways; Order owns the invariant so all clients follow the same rule. This demonstrates **information hiding, ownership, and Tell Don't Ask**.

      Not every data holder is a design flaw. DTOs, records used solely to transfer data, and simple CRUD models may intentionally lack domain behavior. Move behavior into an object when it genuinely protects state/invariants; do not put all infrastructure operations inside entities or introduce classes merely to increase their number.
  - question: How do you determine a class's responsibilities from use cases and business behavior?
    readmeRelated:
      anchorList:
      - oop-basic-002
      - class-design-001
      - class-design-007
      - modeling-001
      - modeling-002
      - modeling-003
      - modeling-004
      - solid-002
      - refactoring-004
    knowledge: Analyze use cases, reasons for change, and invariant ownership to place behavior in classes with sufficient
      information and appropriate responsibilities.
    answer: |-
      Start assigning responsibilities from **use cases and invariants**, not by mechanically turning every noun into a class.

      1. Describe inputs, business outcomes, valid states, and rejected scenarios.
      2. Identify state to maintain and invariants such as Order shipping only after payment or Cart never having a negative quantity.
      3. Place mutations in the object that owns the state and has enough information to validate it: Order.ship(), Cart.addItem().
      4. Separate reasons for change: pricing rules belong in PricingPolicy, persistence and notifications belong in adapters, and CheckoutService coordinates them.
      5. Design minimal APIs/contracts for object collaboration; add ports/interfaces only where implementations genuinely need replacing or tests need isolation.
      6. Test success and rejection paths and try a real requirement-change scenario.

      Use a **domain service** when a rule spans several entities without a natural owner; use DTOs when transferring data between layers; use value objects for values with validation/equality semantics. A well-designed class has cohesive responsibilities and controls invariants rather than merely mirroring a database table.
  - question: How do cohesion and coupling affect the scope of changes and testability?
    readmeRelated:
      anchorList:
      - class-design-002
      - class-design-003
      - solid-002
      - design-pitfalls-001
      - testing-007
      - refactoring-001
    knowledge: High cohesion and low coupling; assess affected change locations, dependency relationships, and the ease of isolating objects in tests.
    answer: |-
      **Cohesion** measures how closely a class's fields and methods support one responsibility; **coupling** measures dependencies between components. High cohesion and low coupling generally confine changes and simplify testing.

      For example, an Order that manages only state/transitions is more cohesive than one that also calls SMTP, SQL, pricing, and report generation. A CheckoutService that constructs SmtpClient/MySqlRepository depends on infrastructure details; receiving EmailSender/Repository through a constructor allows fake substitution in unit tests or adapter replacement without modifying business code.

      Practical checks:
      - Does changing a fee rule require modifying multiple controllers, invoices, and notifications?
      - Do domain unit tests require real databases/networks?
      - Does adding a provider require changing otherwise stable logic?
      - Does one class serve multiple actors or have multiple independent reasons to change?

      Import counts alone cannot establish coupling levels. Excessive fragmentation also increases coupling through forwarding classes; even a God Class with few imports can have many responsibilities. The goal is one clear owner per related set of invariants/behaviors, dependencies through stable contracts, and change impact observed in actual modifications.
  - question: When does OOP introduce unnecessary complexity compared with pure functions or sequential processing?
    readmeRelated:
      anchorList:
      - oop-basic-008
      - abstraction-007
      - solid-008
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-008
    knowledge: Weigh KISS/YAGNI, number of variants, state lifecycles, and abstraction costs when a pure function is
      sufficient.
    answer: |-
      OOP has costs: extra types, contracts, state/lifecycle management, and intermediate layers. Under **KISS/YAGNI**, incur those costs only when they address real problems.

      A fixed job that reads CSV, replaces delimiters, and writes output can use a pure transform(line) function plus try-with-resources for file cleanup. Introducing ConverterFactory, AbstractConverter, Strategy, and three layers for one fixed conversion makes the code harder to trace/test despite its numerous patterns.

      Prefer pure functions or sequential flows for simple data transformations with no long-lived invariants or independent variants. Use stateful objects with behavior when transitions, ownership, or collaborators with distinct contracts need protection. Both approaches can coexist in Java: domain objects may still use pure functions for calculations.

      Test a change scenario: if a new policy requires edits in many places, an abstraction may help. If one clear method meets the requirement, keep it simple. Avoid predicting nonexistent variants or confusing simplicity with omitting validation or resource safety.
  - question: In an OOP system, should objects collaborate through behavior or directly exchange internal state?
    readmeRelated:
      anchorList:
      - oop-basic-004
      - encapsulation-001
      - encapsulation-008
      - composition-003
      - class-design-009
      - refactoring-005
      - refactoring-004
    knowledge: Objects communicate through public contracts/behavior while hiding representation; avoid directly modifying collaborators' internal fields.
    answer: |-
      Objects should **collaborate through public behavior/contracts** and hide internal representation instead of letting callers read and modify fields deep in the object graph.

      A poor example is a controller calling order.getShipment().setStatus(SHIPPED). The controller must know Shipment's structure, enforce payment conditions itself, and may bypass rules. Changing the model then requires editing many callers.

      A better design has the controller call order.ship(); Order keeps status private and checks payment/current status before transitioning, rejecting invariant violations. Collections can be exposed through List.copyOf rather than the original List, but nested elements may still be mutable. For vendor APIs, the domain calls a port rather than manipulating vendor fields/SDKs directly.

      **Tell Don't Ask** emphasizes keeping state-dependent decisions with the owner; the **Law of Demeter** encourages avoiding getter chains that expose internal structure. Getters are not forbidden: UIs, reports, and serialization still require read access. Application services should continue coordinating transactions and external calls rather than pushing all orchestration into entities.
  - question: How can you assess OOP design quality without relying on the number of classes or interfaces?
    readmeRelated:
      anchorList:
      - oop-basic-008
      - class-design-001
      - class-design-002
      - solid-008
      - design-pitfalls-010
      - refactoring-001
      - practice-011
    knowledge: Evaluate support for real changes, invariants, testability, coupling, and clarity rather than counting classes.
    answer: |-
      Good design cannot be judged by class/interface counts; use **change scenarios and verifiable behavior** instead.

      1. **Change impact:** which modules must change when switching payment providers, adding a fee rule, or replacing an SDK? Does the change spread into unrelated code?
      2. **Correctness/invariants:** can the public API produce invalid states? Are both success and rejection paths tested?
      3. **Testability:** can domain logic be tested without a DB/network/global static state? Can adapters be replaced by fakes and verified with contract tests?
      4. **Cohesion/coupling:** are rule owners clear, does one class have too many reasons to change, or do callers know too much about fields/SDKs?
      5. **Complexity:** do forwarding layers/interfaces serve real variants or merely introduce indirection?

      For example, before refactoring, Checkout both switches on paymentType and calls an SDK; afterward, Checkout receives PaymentGateway through DI. Run regression tests to preserve previous outcomes, test the new adapter, and measure the number of changes required to add a provider. An interface may be unnecessary if it improves neither changeability nor testability.

      Performance requires profilers and benchmarks with warmup and representative workloads; do not assume OOP is slow or fast based on object count. Draw conclusions from behavioral evidence and actual change costs.
- groupID: 2
  groupName: Classes, Objects, and Lifecycles
  questions:
  - question: How do instance fields, static fields, instance methods, and static methods differ in ownership of state?
    readmeRelated:
      anchorList:
      - oop-basic-003
      - class-003
      - design-pitfalls-008
    knowledge: Instance members belong to individual instances; static members belong to the class; shared mutable static
      state risks races and state contamination.
    answer: |-
      **Distinguishing ownership scopes:** instance fields are part of each object's state; two instances have separate fields, though reference fields may still point to the same dependency. Instance methods run with a receiver (this), access instance state, and select overrides through dynamic dispatch. Static fields/methods belong to a class declaration (under its class loader), with no this; a subclass static method sharing a superclass signature hides that method rather than overriding it polymorphically.

      ~~~java
      final class Counter {
          private int perObject;
          private static int shared;

          void increment() {
              perObject++;
              shared++;
          }

          int ownCount() { return perObject; }
          static int totalCount() { return shared; }
      }
      ~~~

      Newly created Counter instances a and b have independent perObject fields. If only a.increment() runs, a.ownCount() increases while b.ownCount() remains unchanged; the class's totalCount() reflects the shared update. A static field is not a singleton object; it exists for the corresponding class/class loader identity.

      **Risks:** shared++ is a read–increment–write operation, neither atomic nor automatically visible across threads. Updates can be lost even when Counter instances differ. Use AtomicInteger/LongAdder for independent counters, or locks/transactions when multiple fields must satisfy a shared invariant. Static final on a mutable collection prevents reassignment of the reference, not modification of its contents. Do not store user/request state in static or singleton shared fields; prefer state owned by a well-defined instance/scope. Static methods suit pure utilities, factories, and logic that requires no object-specific state.
  - question: How do constructors, static factory methods, and Builders differ when creating objects with complex validity constraints?
    readmeRelated:
      anchorList:
      - lifecycle-002
      - lifecycle-005
      - design-patterns-002
      - design-patterns-003
    knowledge: Constructors validate invariants, named factories can select subtypes or cached instances, and Builders suit
      numerous options; weigh compile-time versus runtime validation.
    answer: |-
      **Constructors, static factories, and Builders address different needs.** A constructor requires arguments specified by its signature, creates a concrete instance, and can reject invalid data. A static factory such as Money.of(...) or User.from(...) has a meaningful name and may choose an implementation/subtype or return a cached instance if its contract permits. A Builder supplies optional arguments through named calls, avoiding confusion among same-typed parameters, then validates the complete object at build().

      ~~~java
      record Endpoint(String host, int port, boolean tls) {
          Endpoint {
              if (host == null || host.isBlank()) throw new IllegalArgumentException("host");
              if (port < 1 || port > 65535) throw new IllegalArgumentException("port");
          }
          static Endpoint secure(String host) {
              return new Endpoint(host, 443, true);
          }
      }

      final class EndpointBuilder {
          private String host;
          private int port = 443;
          private boolean tls = true;
          EndpointBuilder host(String s) { host = s; return this; }
          EndpointBuilder port(int p) { port = p; return this; }
          EndpointBuilder tls(boolean v) { tls = v; return this; }
          Endpoint build() { return new Endpoint(host, port, tls); }
      }
      ~~~

      Both the direct constructor and Builder rely on Endpoint's validation; missing hosts or invalid ports throw IllegalArgumentException. The static factory secure() communicates a default policy.

      **Trade-offs:** the compiler checks parameter types and required argument counts, but the port range 1..65535 still requires runtime validation. Builders typically permit omitting host until build(), unless a staged builder uses interfaces to enforce required steps; staged builders eliminate some invalid states at compile time but introduce more types. Factories returning cached objects are safe only if identity/ownership semantics allow it; unintentionally caching mutable objects can let callers interfere with each other. An elaborate Builder for an object with only 1–2 arguments introduces unnecessary complexity.
  - question: How do you ensure that an object satisfies its invariants immediately after creation?
    readmeRelated:
      anchorList:
      - lifecycle-002
      - lifecycle-009
      - encapsulation-002
      - encapsulation-005
      - testing-002
    knowledge: Validate in constructors/factories, avoid `this` escape and partially initialized states, and preserve invariants
      across every construction path.
    answer: |-
      **Invariants must hold when construction/factory creation completes and after every public operation.** For example, a date range requires non-null start and end dates, with start no later than end. Validate before assigning state; throw an exception for invalid data without publishing an invalid instance.

      ~~~java
      public final class DateRange {
          private final java.time.LocalDate start;
          private final java.time.LocalDate end;

          public DateRange(java.time.LocalDate start, java.time.LocalDate end) {
              if (start == null || end == null || start.isAfter(end)) {
                  throw new IllegalArgumentException("Invalid range");
              }
              this.start = start;
              this.end = end;
          }

          public boolean contains(java.time.LocalDate d) {
              return d != null && !d.isBefore(start) && !d.isAfter(end);
          }
      }
      ~~~

      Immutable LocalDate values and final fields prevent external aliases from mutating DateRange. When storing a mutable List, make defensive copies and avoid exposing references that can modify the internal list. For mutable objects, consolidate multi-field updates in business operations that validate and maintain invariants before and after changes; avoid sequences of public setters that permit invalid intermediate states.

      **Prevent this escape:** do not register this with listeners/static registries, invoke overridable callbacks, or start threads in a constructor; external code could observe a partially initialized object and violate invariants or safe-publication guarantees. A factory can construct the complete object before publishing it or run a controlled initialization step. ORMs/deserializers may instantiate objects through paths other than normal constructors; state restoration boundaries must validate invariants separately. If multiple requests modify an object/DB, constructor validation does not replace transactions, optimistic locking, or synchronization.
  - question: In what order does Java initialize static fields, instance initializers, superclass constructors, and subclass constructors?
    readmeRelated:
      anchorList:
      - class-003
      - lifecycle-004
      - inheritance-006
    knowledge: Java loading/initialization rules, execution of `super` before subclass logic, default field values, and initializer order.
    answer: |-
      **There are two processes:** static class initialization and instance initialization. When a class is first actively used under the Java Language Specification, required superclasses are initialized before subclasses; each class's static field initializers and static blocks then execute in source order. Class loading/linking can happen earlier; reading a compile-time constant static final from another class does not necessarily initialize that class. Initialization normally happens once per class/class-loader identity.

      For new Child(), the JVM allocates instance memory with default values (null, 0, false), then invokes the constructor chain through the superclass. At each level, after super(...), that class's field initializers and instance initializer blocks run in textual order, followed by its constructor body. Child's instance field/block initializers and constructor body execute only after the parent constructor returns. With constructor chaining via this(...), a class's initializers do not run again for every delegated constructor.

      ~~~java
      class Parent {
          static { System.out.println("P static"); }
          int a = log("P field");
          { log("P block"); }
          Parent() { log("P ctor"); }
          static int log(String s) { System.out.println(s); return 1; }
      }
      class Child extends Parent {
          static { System.out.println("C static"); }
          int b = log("C field");
          { log("C block"); }
          Child() { log("C ctor"); }
      }
      class Demo {
          public static void main(String[] args) { new Child(); }
      }
      ~~~

      If Parent and Child have not been actively initialized, the expected sequence is P static → C static → P field → P block → P ctor → C field → C block → C ctor. A subsequent new Child() repeats the instance steps but not the static blocks. This is a deduction from language rules, not an observed execution log.

      **Important edge case:** the Parent constructor can execute code while Child fields still contain default values. If a superclass constructor invokes an overridden method, the subclass method may see null/0 instead of values expected from initializers. Understanding allocation, default values, super, and initializer ordering matters more than memorizing a rigid list of statements.
  - question: Why can calling an overridable method from a constructor expose uninitialized state?
    readmeRelated:
      anchorList:
      - lifecycle-004
      - lifecycle-009
      - inheritance-006
      - polymorphism-004
    knowledge: Dynamic dispatch can occur in a superclass constructor while subclass fields still have default values; avoid
      virtual calls and `this` escape.
    answer: |-
      **The cause is dynamic dispatch during object construction.** The Parent constructor runs before Child's field initializers. When Parent invokes an overridable instance method, Java still selects the Child override based on runtime type, although Child's state has not yet been initialized.

      ~~~java
      class Parent {
          Parent() { show(); }
          void show() { System.out.println("parent"); }
      }
      class Child extends Parent {
          private String label = "READY";
          @Override void show() {
              System.out.println(label.length());
          }
      }
      class Demo {
          public static void main(String[] args) { new Child(); }
      }
      ~~~

      Parent() invokes Child.show() while label still has its default null value. Therefore label.length() throws NullPointerException; initializing label at its declaration does not help because Child's initializer runs after super(). Similar failures occur when int fields are still 0 or collections have not yet been created.

      **Prevention:** constructors should not invoke overridable instance methods or publish this to an event bus or thread; use private/final helpers that access only ready state. If a parent needs configuration to validate, pass it through super(...) and retain it in parent fields. If polymorphic behavior is necessary, a factory should construct the full object before invoking the method, with a clear initialization boundary; avoid unguarded two-phase initialization because callers might observe a partially ready object. This is a lifecycle and invariant issue, not merely a style concern.
  - question: How does the lifecycle of Java objects differ from that of files, sockets, and database connections?
    readmeRelated:
      anchorList:
      - lifecycle-006
      - lifecycle-008
      - composition-007
    knowledge: GC reclaims heap objects based on reachability, while files/sockets/connections require explicit ownership and timely closing.
    answer: |-
      **A heap object's lifecycle is not the same as an external resource's lifecycle.** A Java object remains alive while reachable from GC roots; when unreachable, it *may* be collected, but there is no guaranteed deadline. File descriptors, native sockets, JDBC connections, and library handles occupy limited OS/driver/pool resources; their owners must close them at the appropriate usage boundary rather than waiting for GC.

      ~~~java
      try (java.io.InputStream stream =
               java.nio.file.Files.newInputStream(path)) {
          byte[] firstBytes = stream.readNBytes(4);
          // Xử lý firstBytes.
      } // Stream được close kể cả khi khối try ném lỗi.
      ~~~

      With a JDBC pool, close() on a proxy/handle usually returns the connection to the pool rather than immediately closing the physical TCP connection. The pool owns physical connection lifecycles; borrowing code must return connections promptly. Socket.close() releases the endpoint/descriptor according to its contract regardless of object reachability.

      **Ownership:** distinguish the owner responsible for closing a resource, a borrower that only uses it without closing rights, and a manager/pool coordinating reuse. For a long-lived client shared by many requests, the owner may close it on application shutdown rather than after every request; conversely, request-borrowed connections should return to the pool after use. Setting a reference to null, leaving scope, or calling System.gc() does not ensure timely external-resource release. Finalizers are deprecated for removal and must not underpin correctness.
  - question: When should you use AutoCloseable and try-with-resources instead of relying on the garbage collector?
    readmeRelated:
      anchorList:
      - lifecycle-008
      - composition-007
      - language-mechanics-008
      - lifecycle-007
    knowledge: AutoCloseable, try-with-resources, reverse closing order, and suppressed exceptions; GC cannot guarantee timely
      cleanup.
    answer: |-
      **Use AutoCloseable with try-with-resources (TWR)** when a resource requires deterministic cleanup and operations may throw exceptions: streams, sockets, JDBC Connection/Statement/ResultSet, or resource guards. GC manages memory/reachability but cannot promise when a close occurs. Resources close automatically on leaving the block, even on failure; TWR closes them in reverse declaration order.

      ~~~java
      final class Tracked implements AutoCloseable {
          private final String name;
          Tracked(String n) { name = n; }
          @Override public void close() {
              System.out.println("close " + name);
          }
      }
      class Demo {
          static void work() {
              try (Tracked first = new Tracked("first");
                   Tracked second = new Tracked("second")) {
                  System.out.println("body");
              }
          }
      }
      ~~~

      The logical order is body → close second → close first. If initialization of the second resource fails, the first successfully created resource is still closed. AutoCloseable.close() may throw a checked Exception; callers must follow the API's exception contract.

      **Suppressed exceptions:** if the try body throws and close() also throws, the body exception remains primary; the close exception appears in getSuppressed() without replacing the original failure.

      ~~~java
      try (AutoCloseable r = () -> {
              throw new IllegalStateException("close failed");
           }) {
          throw new IllegalArgumentException("work failed");
      } catch (IllegalArgumentException ex) {
          // ex.getSuppressed()[0] là lỗi close failed.
      }
      ~~~

      If only close() fails, its exception may become primary. With multiple resources, several closing failures may be suppressed. Apply TWR at the boundary that actually owns the resource; do not close dependencies owned by other callers or shared clients still in use. Nor should close() be assumed idempotent unless the resource contract guarantees it.
  - question: How does a final reference differ from an immutable object, especially when a field references a mutable collection?
    readmeRelated:
      anchorList:
      - class-006
      - object-005
      - encapsulation-007
      - refactoring-005
    knowledge: '`final` prevents reference reassignment, not mutation of nested data; use defensive copies, immutable elements,
      and avoid exposing mutable collections.'
    answer: |-
      **A final reference differs from an immutable object.** A final field prevents reassignment after initialization but does not prevent mutation of the referenced object. If a final List<String> references an ArrayList, add/clear can still mutate its contents through aliases. Collections.unmodifiableList(source) creates an unmodifiable view, but it may reflect mutations to the underlying source. List.copyOf(source) creates a structurally immutable list snapshot (rejecting null elements) but does not deep-copy mutable elements.

      ~~~java
      import java.util.*;
      final class Basket {
          private final List<String> items;
          Basket(List<String> source) {
              items = List.copyOf(source);
          }
          List<String> items() { return items; }
      }
      ~~~

      If source is an ArrayList and source.add("A") is called later, the existing Basket does not gain the new item. Basket.items().add("B") throws UnsupportedOperationException. Strings are immutable in this example, so elements are safe; if the List contained a MutableAddress, another alias could still modify that address even though items cannot be added to or removed from the snapshot. For deep immutability, copy elements or use immutable value objects.

      **Thread safety:** immutable state supports safe sharing, stable equality/hashes, caching, and easier reasoning. However, final provides only certain Java Memory Model guarantees when objects are constructed correctly without this escape; a final field holding a mutable object does not make the entire graph thread-safe. One object's immutability does not make multi-object/DB transactions atomic. For large, frequently changing data, consider copying costs and workload rather than copying everything indiscriminately.
  - question: What are the consequences of object identity, value equality, and aliasing when references are passed to multiple places?
    readmeRelated:
      anchorList:
      - object-002
      - object-003
      - object-004
      - class-design-006
      - language-mechanics-006
    knowledge: Distinguish `==`, `equals`, and aliases of one object; mutations through one reference are visible through other references.
    answer: |-
      **Identity, equality, and aliasing answer three different questions.** The == operator on references checks whether they refer to the same instance or are both null. equals(Object) defines an equality contract; with a valid override, different instances can be value-equal. Aliasing occurs when two variables/fields refer to the same object: a mutation through one reference is visible through the other.

      ~~~java
      import java.util.*;
      List<String> a = new ArrayList<>(List.of("A"));
      List<String> b = a;
      List<String> c = new ArrayList<>(List.of("A"));
      if (a != b || a == c || !a.equals(c)) {
          throw new AssertionError("Identity/equality incorrect");
      }
      b.add("B");
      if (a.size() != 2 || c.size() != 1) {
          throw new AssertionError("Alias/copy behavior incorrect");
      }
      ~~~

      These checks demonstrate that a and b have the same identity, while c has a different identity but initially equal values; mutating b also changes a but not c. Java passes object arguments as **values of references**: a method can mutate the referenced object, but reassigning its parameter does not change the caller's reference.

      **Practical failure:** using a mutable object as a HashMap key or HashSet member and then changing fields involved in equals/hashCode can break lookup because the hash bucket was selected at add/put time. An equals override must preserve the hashCode contract and symmetry/transitivity/consistency. Value objects typically compare meaningful values; entities need a stable business identity rule (especially for IDs assigned by the DB after persistence). Defensive copies, immutable value objects, and business methods help prevent unintended aliases from violating invariants.
  - question: Which business and performance factors guide your choice between immutable and mutable objects?
    readmeRelated:
      anchorList:
      - class-006
      - object-005
      - encapsulation-007
      - practice-005
    knowledge: Prefer immutability for sharing, caching, and value semantics; choose mutability for state transitions while
      considering snapshots/copies and thread safety.
    answer: |-
      **Choose based on semantics before optimizing.** Immutable objects suit Money, DateRange, configurations, cache keys, snapshots, and data shared across threads: they are easier to reason about, resist unexpected alias mutations, and better support value equality/hashes. Mutable objects suit lifecycle-based entities such as Order or frequently updated aggregates, but state must be encapsulated in business methods rather than exposed through unrestricted setters.

      ~~~java
      record Money(long cents, String currency) {
          Money {
              if (cents < 0 || currency == null || currency.isBlank()) {
                  throw new IllegalArgumentException("Invalid money");
              }
          }
          Money plus(Money other) {
              if (!currency.equals(other.currency())) {
                  throw new IllegalArgumentException("Currency mismatch");
              }
              return new Money(Math.addExact(cents, other.cents()), currency);
          }
      }

      final class Order {
          enum Status { DRAFT, PAID }
          private Status status = Status.DRAFT;
          void pay() {
              if (status != Status.DRAFT) {
                  throw new IllegalStateException("Already paid");
              }
              status = Status.PAID;
          }
      }
      ~~~

      Money.plus() returns a new object, rejecting mismatched currencies or overflow; Order changes state through a guarded operation. The example is not automatically thread-safe when multiple threads call pay() concurrently; use appropriate synchronized/atomic state or transactions and optimistic locking at the DB.

      **Performance trade-offs:** immutability may require extra snapshots/copies for large, frequent updates; mutability can avoid copies but increases locking, aliasing, and coupling costs. The JVM can sometimes eliminate allocations through escape analysis/scalar replacement, but not for every object. Do not assume mutable is always faster: measure allocation rates, GC, throughput, and latency with JFR/profilers and JMH benchmarks representative of the workload. When building large datasets, mutate an internal buffer/builder and then publish an immutable snapshot; persistent structures/copy-on-write can help when read/write frequencies justify them.
- groupID: 3
  groupName: Encapsulation and Invariants
  questions:
  - question: How does encapsulation differ from merely declaring private fields and providing public getters/setters?
    readmeRelated:
      anchorList:
      - encapsulation-001
      - encapsulation-002
      - encapsulation-004
      - encapsulation-008
      - class-design-007
      - design-pitfalls-003
      - refactoring-005
    knowledge: Encapsulation protects invariants through business-intent APIs and information hiding; private fields with unrestricted
      setters still expose mutation rights.
    answer: |-
      **Encapsulation** protects state and invariants through meaningful APIs, rather than merely marking fields private. Callers should neither depend on internal representation nor have unrestricted rights to modify every attribute.

      An Account with a private balance but an unchecked public setBalance(long x) can still have a negative balance. Better APIs expose deposit(amount) and withdraw(amount), require amount > 0, and reject withdrawals exceeding the balance. Such commands express business intent and centralize validation/mutation in the state owner.

      Key differences:
      - Private fields plus unconditional getters/setters only restrict access syntax; they do not enforce rules.
      - True encapsulation specifies **valid state transitions** and hides data representation.
      - Getters for display are reasonable, but should not expose mutable references that let callers modify internal fields/lists.

      For example, Order should expose ship() requiring PAID instead of setStatus(SHIPPED). If a caller attempts to ship a DRAFT order, the object rejects the operation and keeps its previous state. For simple data like displayName, a validated setter may be appropriate. Judge designs by invariants and ownership of changes, not the presence of getter/setter names.

      Test encapsulation through every public API, including invalid inputs, to demonstrate that invariant-violating states cannot be created.
  - question: Why can public setters for every property break an object's business rules?
    readmeRelated:
      anchorList:
      - encapsulation-003
      - encapsulation-004
      - encapsulation-008
      - class-design-007
      - design-pitfalls-002
      - refactoring-005
      - practice-002
    knowledge: Identify mutation paths that bypass validation and replace unrestricted setters with guarded commands such as
      `pay`, `ship`, and `withdraw`.
    answer: |-
      A public setter for every property turns each field into a **mutation path** that may bypass rules involving other fields. Validation in the UI/controller is insufficient because batches, mobile APIs, tests, or other modules may invoke setters directly.

      For example, if Order exposes setPaid(false) and setStatus(SHIPPED), callers can create a shipped-but-unpaid order. Likewise, BankAccount.setBalance(-100) violates a nonnegative-balance invariant. Type-correct state can still be business-invalid.

      Replace setters with commands:
      - pay() performs the appropriate transition only after payment is confirmed.
      - ship() runs only if the order is PAID, not already SHIPPED, and shipping conditions are satisfied.
      - cancel() uses guards derived from cancellation policy.
      - withdraw(amount) requires a positive amount and sufficient balance before debiting.

      Keep status/balance fields private without unconditional setters. Commands validate, commit state, and establish clear postconditions; failure paths leave state unchanged. Services coordinate gateways, repositories, and transactions without duplicating entity invariants.

      Not all setters are bad: a validated setDisplayName for an independent property may be suitable. The problem is arbitrary mutation of workflow state or interdependent fields. Test both successful and failed operations.
  - question: How does an object invariant differ from input validation at an API or user interface?
    readmeRelated:
      anchorList:
      - lifecycle-002
      - encapsulation-002
      - encapsulation-005
      - abstraction-004
      - class-design-004
    knowledge: Boundary input validation checks syntax/formats; object invariants must hold throughout the lifecycle, even for
      other batches/APIs.
    answer: |-
      **Boundary validation** checks data entering through UIs, REST, messages, or batches: required fields, syntax, formats, access rights, and request errors. An **object invariant** is a condition that must hold for a valid object throughout its lifecycle, regardless of who creates or modifies it.

      For example, a booking UI checks that checkOut follows checkIn, but an import job may call the constructor directly, bypassing the UI. Booking itself must enforce checkOut.isAfter(checkIn) in construction/factories and date-change methods. If checkOut <= checkIn, reject the operation without creating or modifying an invalid object.

      Layered validation:
      1. Boundaries check requests early to return helpful errors.
      2. The domain enforces invariants where state is owned; new APIs must satisfy the same contract.
      3. Database constraints provide extra defense with multiple writers but do not replace domain validation.

      Other invariants include nonnegative balances, positive quantities, totals consistent with discounts, and no SHIPPED order before PAID. Rules spanning entities or external data may need domain services/transactions rather than being forced into one object.

      Test constructors/domain methods directly outside HTTP, exercise adapters, and check that failures do not change state. A draft may legitimately lack information if the **draft state** is explicitly modeled; do not treat it as a fully completed valid object.
  - question: How do you design order state-transition behavior to prevent invalid transitions?
    readmeRelated:
      anchorList:
      - encapsulation-009
      - class-design-008
      - modeling-008
      - design-patterns-009
      - testing-003
      - practice-002
    knowledge: Build a state machine with transition guards; keep status private and check payment conditions before entering
      SHIPPED.
    answer: |-
      Model Order as a **state machine** with valid states and transitions: DRAFT → PAID → SHIPPED; DRAFT may become CANCELLED, while SHIPPED cannot simply revert to DRAFT. Refunds/returns require distinct transitions based on business rules.

      Simplified Java example:

          enum Status { DRAFT, PAID, SHIPPED, CANCELLED }
          class Order {
            private Status status = Status.DRAFT;
            Status status() { return status; }
            void markPaid() {
              if (status != Status.DRAFT) throw new IllegalStateException();
              status = Status.PAID;
            }
            void ship() {
              if (status != Status.PAID) throw new IllegalStateException();
              status = Status.SHIPPED;
            }
          }

      There is no public setStatus. markPaid runs after payment confirmation in the appropriate use case. ship checks the PAID precondition before committing SHIPPED; invalid transitions throw exceptions and retain the previous state.

      Tests: shipping a new Order must fail while status remains DRAFT; markPaid followed by ship must reach SHIPPED; a second ship must be rejected. Additional rules, such as available inventory, can extend the guards.

      When multiple requests change one Order, a Java check-then-set does not ensure consistency of persisted data. Transactions/optimistic locking (version) or suitable synchronization are required. The state machine governs transitions; concurrency control prevents conflicting updates.
  - question: Why can updating two related fields through separate setters leave an object partially updated?
    readmeRelated:
      anchorList:
      - encapsulation-002
      - encapsulation-004
      - class-design-008
      - testing-003
      - refactoring-005
    knowledge: Cross-field invariants such as total = base - discount; use atomic behavior or derive values instead of using two setters.
    answer: |-
      Related fields share a **cross-field invariant**, so modifying them through separate setters may create an invalid intermediate state or leave a partial update if the second operation throws.

      For example, Invoice has base=100, discount=20, total=80. If setDiscount(30) succeeds but setTotal(70) never runs, the old total 80 no longer equals base-discount. Every field is individually a valid number, yet the object is invalid as a whole.

      Preferred solutions:
      - **Derived values:** store only base and discount; let total() calculate base-discount and remove public setTotal. Avoid storing the same fact twice.
      - **One mutation operation:** changePrice(base,discount) validates base >= 0 and 0 <= discount <= base, computes the new total, and updates state through a controlled API.
      - **Immutable objects:** construct a validated PriceBreakdown and replace the entire value as one unit at the appropriate boundary.

      Test that discounts above base are rejected while all fields remain unchanged, and valid discounts produce correct totals. If other callers/threads can observe intermediate assignments or a DB persists multiple rows, use appropriate synchronization/transactions/versions. A Java method with multiple assignments is not automatically atomic under concurrency or persistence.
  - question: How do you prevent a failed operation from leaving an object partially updated?
    readmeRelated:
      anchorList:
      - encapsulation-002
      - encapsulation-005
      - abstraction-004
      - language-mechanics-008
      - testing-003
    knowledge: Validate and compute before committing; preserve the old state on exceptions, provide strong exception safety,
      and use transactions when needed.
    answer: |-
      The goal of **strong exception safety** is that failed operations leave no partially updated object. Catching an exception differs from actually preserving invariants and rolling back mutations that already occurred.

      Steps:
      1. Check preconditions/invariants and prepare inputs before changing state.
      2. Compute candidate state in local variables or an immutable value; perform exception-prone work before committing where possible.
      3. Commit briefly through a controlled API, avoiding external callbacks between assignments.
      4. When updating multiple objects/database rows, use transactions or suitable rollback mechanisms and control concurrent updates.
      5. Inject failures at each step in tests and compare post-failure state against the previous state.

      For withdraw(100), validate amount > 0 and balance >= amount before balance -= amount. For a transfer between two accounts, do not debit the sender and then treat the transfer as complete if an exception occurs before crediting the recipient; transactions/locking may be necessary.

      External side effects such as payment-gateway calls or emails are not undone merely because a DB transaction rolls back. Design outboxes, idempotency, retries, or sagas according to consistency requirements.

      State the **atomicity boundary** explicitly: exception safety within one object is not a distributed transaction. Sound reasoning must cover success, failure, and observable effects.
  - question: Why can returning a mutable List from a getter let callers modify internal state without authorization?
    readmeRelated:
      anchorList:
      - class-006
      - encapsulation-006
      - refactoring-005
      - practice-002
    knowledge: 'Representation exposure: callers can mutate the shared List through a getter; return appropriate snapshots/read-only
      views and expose guarded mutation APIs.'
    answer: |-
      A getter returning an **internal mutable List** exposes representation: callers receive the same container reference and can add/remove/clear without passing through validated behavior.

      For example, Cart forbids changes after checkout and accepts only positive quantities. If getItems() returns the actual ArrayList, callers can clear() it after checkout, corrupt totals, or bypass auditing. Cart's rules are violated externally.

      A simple safeguard:

          class Cart {
            private final List<String> items = new ArrayList<>();
            List<String> items() { return List.copyOf(items); }
            void add(String value) {
              if (value == null || value.isBlank())
                throw new IllegalArgumentException();
              items.add(value);
            }
          }

      List.copyOf returns an unmodifiable container with the contents present when the snapshot is taken. A caller's clear() on the result is rejected; modifications must go through guarded Cart.add or Cart.remove operations. The example requires imports for java.util.List and java.util.ArrayList.

      **Important limitation:** a List snapshot does not make its elements immutable. If an item is mutable, callers may change it through an alias; use immutable items, DTOs, or appropriate defensive copies. Collections.unmodifiableList(items) is only a read-only live view and may reflect mutations to the original List.

      Test both container and contained-item mutation to establish the exact protection offered.
  - question: How do unmodifiable views, immutable snapshots, shallow copies, and deep copies differ in protecting representation?
    readmeRelated:
      anchorList:
      - object-006
      - encapsulation-006
      - encapsulation-007
      - refactoring-005
    knowledge: Unmodifiable views may reflect source changes; snapshots separate containers; shallow copies do not copy
      mutable elements.
    answer: |-
      Distinguish four levels of representation protection:

      - **Unmodifiable view:** Collections.unmodifiableList(source) blocks mutations through the view, but source changes may remain visible. It does not make elements immutable.
      - **Immutable snapshot container:** List.copyOf(source) returns an unmodifiable List whose structure does not reflect subsequent source changes. References to mutable items remain shared.
      - **Shallow copy:** new ArrayList<>(source) copies List structure while retaining the same references to items. The new List can be edited, but mutating an item can affect both lists.
      - **Deep copy:** duplicate mutable components within the ownership scope to be separated, including nested objects. Handle shared identities, cycles, and noncopyable components rather than merely calling clone().

      For example, source contains MutableItem("A"), with view=unmodifiableList(source) and snap=List.copyOf(source). After source.add(item2), view sees item2 but snap does not. After item1.setName("B"), both view and snap see "B" because they share the item1 reference.

      Choose based on the contract: a live view for continually updated state, a snapshot for a list at a particular time, or deep copies/immutable value objects when nested state must also be separated. Test **container** and **element** mutations separately; do not incorrectly claim List.copyOf is a deep copy.
  - question: When should an object expose business behavior instead of returning data for a service to make decisions?
    readmeRelated:
      anchorList:
      - encapsulation-008
      - class-design-007
      - class-design-009
      - design-pitfalls-003
      - refactoring-004
    knowledge: Move rules associated with state/data into the owning object; let services coordinate transactions/infrastructure as needed.
    answer: |-
      When a business decision mostly depends on an object's own state, keep it in the **state-owning object** to protect invariants in one place. This is the idea behind Tell, Don't Ask: ask the object to perform behavior rather than having a service extract data, calculate decisions, and assign state.

      For example, multiple controllers may read Order.paid and Order.status before calling setStatus(SHIPPED). When an inventory requirement is added, any controller not updated can ship incorrectly. With Order.ship(), the precondition and transition have one owner, and all callers obey the same rule.

      However, do not put all logic in the entity:
      - **Entity/value object** owns behavior protecting its own state/invariants.
      - **Application service** coordinates use cases, authorization, transactions, repositories, gateways, and external effects.
      - **Domain service** owns business rules spanning several entities or lacking a natural single owner.
      - **Query/DTO** provides read-only data for UIs/reports and need not contain domain behavior.

      Ask who owns the data, who must always enforce the invariant, and whether changes to a rule would force many callers to duplicate validation. Place behavior with a clear owner. If the rule spans aggregates or needs infrastructure, let a service coordinate it while invoking domain commands that control mutation.
  - question: How should validation and mutation be organized to preserve invariants across multiple entry points using the same object?
    readmeRelated:
      anchorList:
      - lifecycle-002
      - encapsulation-002
      - encapsulation-005
      - class-design-007
      - testing-003
      - practice-002
    knowledge: Enforce invariants in domain public methods/constructors, consolidate mutation paths, and test valid, failure,
      and entry-point scenarios.
    answer: |-
      Web, mobile, batch, and message consumers can easily implement inconsistent validation when each entry point owns its rules. Establish **one consistent mutation path**:

      1. Constructors/factories validate initial state and never publish objects missing required invariants.
      2. Keep mutable fields private; expose commands such as pay(), ship(), cancel(), or changeAddress() instead of unconditional setters.
      3. Each command checks preconditions before commit, guarantees postconditions, and preserves state if rejected.
      4. Boundaries still validate requests for friendly errors but invoke the same domain behavior rather than copying rules into controllers/jobs.
      5. Repositories/ORMs must ensure persisted state does not bypass invariants; DB constraints provide additional defense.
      6. Cross-aggregate mutation and concurrent requests require appropriate transactions, optimistic locking, synchronization, or consistency mechanisms.
      7. Test the domain directly and through every entry point: valid paths, invalid inputs, forbidden transitions, concurrent updates, and rollback on failure.

      For example, Booking.cancel() called from web/mobile/batch flows through the same domain method and rejects cancellation after a ticket has been used; services handle authorization, persistence, and notifications. The invariant does not depend on which UI submitted the request.

      Do not confuse **input validation** with a **domain invariant**: boundaries may report errors differently but cannot create business states that violate the same contract.
- groupID: 4
  groupName: Abstraction and Contracts
  questions:
  - question: How does abstraction separate a business contract from concrete implementations?
    readmeRelated:
      anchorList:
      - abstraction-003
      - abstraction-008
      - interface-001
      - interface-003
      - class-design-004
      - solid-006
    knowledge: Stabilize contracts around business goals; interchangeable implementations sit behind interfaces/ports, limiting
      vendor-detail leakage.
    answer: |-
      **Abstraction** describes what a system must do and the guarantees it offers without exposing execution mechanisms to clients. Good business contracts use domain-language names, parameters, results, and errors; infrastructure-dependent implementations remain behind adapters.

      For example, CheckoutService needs to collect payments, so it depends on a PaymentGateway port whose charge(payment) returns Receipt. StripeAdapter and BankAdapter translate SDK requests, errors, and responses into that shared contract. On a provider change, the service need not import SDK classes or inspect subtypes; the application composition root selects the appropriate adapter.

      The separation has three parts:
      1. **Contract:** define preconditions (positive amounts, valid currencies), postconditions (Receipt represents successful outcomes), and meaningful errors.
      2. **Implementation:** call REST/SDK, map DTOs, handle retries appropriately, log, and protect secrets inside adapters.
      3. **Dependency direction:** business logic depends on the port, and adapters depend on the port; a composition root/DI connects them.

      Do not put vendor-specific responses, access tokens, or SDK exception types directly into port signatures; doing so leaves clients dependent on technical details. Switching providers does not automatically mean changing only one file: the contract must be reviewed if the new provider's behavior differs. Abstraction helps when boundaries need replacement or independent testing, not because every concrete class needs an interface.
  - question: When should you use an interface, abstract class, or concrete class in Java?
    readmeRelated:
      anchorList:
      - abstraction-005
      - abstraction-006
      - abstraction-007
      - interface-005
      - composition-004
    knowledge: Use interfaces for roles/multiple implementations, abstract classes for shared state/behavior, and concrete classes when extension is unnecessary.
    answer: |-
      In Java, choose based on **contracts that need extension** and **state/logic that needs sharing**, not a rule that "every class must have an interface."

      - **Interface:** appropriate for roles/capabilities such as PaymentGateway, Runnable, and Comparable. A class can implement multiple interfaces; clients depend on contracts without knowing concrete types. Interfaces support abstract, default, static, and private helper methods within Java rules, but not independent instance fields as abstract classes do.
      - **Abstract class:** suitable when subtypes form a real family requiring shared protected state, constructors, or stable algorithm skeletons. It can have constructors, instance fields, and concrete/abstract instance methods. Java permits extending only one class, so inheritance creates stronger coupling.
      - **Concrete class:** simple and direct when replacement/extension is not yet needed, or the implementation itself provides a sufficiently stable contract.

      For example, an immutable domain Money does not need IMoney and AbstractMoney. In contrast, PaymentGateway is a useful port because it may have a SQL-free fake and adapters for banks A and B. A parser hierarchy sharing resource-reading/closing rules might justify an abstract base if it truly shares a lifecycle; composition is another option.

      Trade-offs: interfaces do not automatically ensure LSP; abstract classes can become fragile bases when subclasses depend on hooks and initialization order; concrete classes do not impair testability if responsibilities are clear. Prefer small contracts, clear ownership, and evidence of actual variation over speculative intermediate layers.
  - question: What advantages does an interface representing one capability or role have over an interface containing too many methods?
    readmeRelated:
      anchorList:
      - interface-006
      - polymorphism-008
      - solid-005
      - design-pitfalls-006
    knowledge: 'Interface Segregation: split contracts by client/capability, rather than forcing classes to implement unsupported
      operations.'
    answer: |-
      A **capability/role interface** clearly specifies what clients may request. An overly broad interface forces implementors to provide unsuitable methods, resulting in no-ops, null, or UnsupportedOperationException and forcing callers to know subtypes to avoid failures.

      For example, MultiFunctionDevice defines print(), scan(), and fax(). A printer that supports only print() must still declare scan()/fax(), although Printer clients never need them. Splitting into Printable, Scannable, and Faxable lets a simple printer implement Printable and a multifunction device implement all three. PrinterService accepts only Printable and is unaffected by scan/fax changes.

      This is the **Interface Segregation Principle (ISP)**: clients should not depend on capabilities they do not use. Benefits include honest contracts, straightforward role-specific mocks/fakes, reduced coupling, and avoiding subtypes that violate postconditions by throwing unsupported for promised operations.

      But excessively small interfaces also incur costs: more types, complex APIs, and cumbersome role coordination. Do not create an interface per method regardless of meaning. Group behaviors that change together and serve one meaningful role; split them when clients truly need different capabilities or implementations cannot honor the same contract. A capability requires consistent semantics, not merely a technical method signature.
  - question: How do abstract, concrete, and default methods differ in implementation and overriding?
    readmeRelated:
      anchorList:
      - abstraction-005
      - interface-007
      - polymorphism-007
    knowledge: Abstract methods require implementations; concrete/default methods have bodies; interface defaults have distinct
      precedence and overriding rules.
    answer: |-
      An **abstract method** declares a contract without a body; a concrete subclass or interface implementation must implement it unless it remains abstract itself. A **concrete method** has a body and can be inherited and overridden unless restricted by final/private/static. A **default method** is an interface instance method with a body that supports default behavior and API evolution but follows specific resolution rules.

      Example:
          interface Greeting {
            String name(); // abstract
            default String greet() { return "Hello " + name(); }
          }
          class UserGreeting implements Greeting {
            public String name() { return "An"; }
            // thừa kế greet(), hoặc override để thay hành vi
          }

      An abstract class can have instance fields/constructors alongside abstract and concrete methods. Concrete subclasses must implement all remaining abstract methods. Interface abstract methods are public by default; implementations must preserve public visibility.

      **Important rules:** class instance methods take precedence over interface defaults; a more specific interface's default can beat a superinterface default; two unrelated defaults with the same signature generally require the class to override. Static/private interface methods do not follow ordinary overriding rules; private interface helpers are not public APIs. Default methods cannot override public Object instance methods such as equals/hashCode/toString.

      Choose default methods when they have safe semantics across all implementations; do not use them to smuggle in state or presume every subtype has an identical capability.
  - question: What source-compatibility issues or conflicts can adding a default method to an interface cause?
    readmeRelated:
      anchorList:
      - interface-007
      - inheritance-008
      - polymorphism-006
    knowledge: Source/binary compatibility during interface extension, conflicting defaults from superinterfaces, and semantic changes.
    answer: |-
      Adding a default method helps **existing implementations retain their source without declaring a new method** and often improves binary compatibility. However, it **does not guarantee source compatibility, binary compatibility, or unchanged behavior in every case**.

      Specific risks:
      1. **Inheritance conflicts:** a class implements two independent interfaces; after both introduce the same-signature default, recompilation may fail unless the class resolves the conflict by overriding. Already compiled classes can encounter linkage failures such as IncompatibleClassChangeError for conflicting method calls.
      2. **Method-resolution changes:** class methods take precedence and more specific superinterface defaults may win; code relying on overloaded/inherited methods needs rechecking.
      3. **Semantic changes:** a syntactically valid default may be inappropriate for some implementors, such as automatic retries that duplicate payment side effects.
      4. **Unclear API contracts:** defaults returning null, fake values, or UnsupportedOperationException for a promised operation mislead clients.

      Mitigate these risks by designing defaults with shared meaning and documented pre/postconditions, recompiling implementations, running regression/contract tests across subtypes, reviewing important call sites, and allowing overrides for differing variants. Do not claim adding a default method is absolutely nonbreaking.
  - question: What rules does Java use to resolve conflicting default methods from two interfaces?
    readmeRelated:
      anchorList:
      - interface-007
      - inheritance-008
      - polymorphism-006
    knowledge: Class methods take precedence over defaults; more specific interfaces win; competing unrelated defaults require an override.
    answer: |-
      Java resolves default methods using precedence rules based on **inheritance relationships**:

      1. **Class wins:** a matching instance method inherited from a class/superclass takes precedence over an interface default. A default cannot silently replace a class method.
      2. **More specific interface wins:** if interface Child extends Parent and overrides a default, its implementation inherits Child's method rather than Parent's when no class method takes precedence.
      3. **Competing defaults:** if a class implements two unrelated interfaces offering the same-signature default, it must override to resolve the conflict (unless a class or more specific interface already resolves it).

      Example:
          interface A { default String label() { return "A"; } }
          interface B { default String label() { return "B"; } }
          class Both implements A, B {
            @Override public String label() {
              return A.super.label() + "/" + B.super.label();
            }
          }

      Both decides its own contract: choose one default, combine both, or provide a new implementation. The A.super.label() syntax is valid for calling an appropriate direct superinterface from the implementing class, but cannot be used arbitrarily across hierarchy levels.

      An abstract class method may prevent inheriting a corresponding default; a concrete class may need to supply an implementation to meet its contract. Conflict-resolution rules tell the compiler which method to call but do not replace checking whether default **semantics** meet business requirements.
  - question: How do you define a method contract covering preconditions, postconditions, null, and exceptions?
    readmeRelated:
      anchorList:
      - class-005
      - object-008
      - abstraction-003
      - abstraction-004
      - interface-008
      - subtyping-007
      - language-mechanics-008
      - testing-001
      - solid-004
    knowledge: Define pre/postconditions, nullability, side effects, and exception contracts; preserve subtype substitutability.
    answer: |-
      A reliable method contract defines **preconditions**, **postconditions**, and **failure cases**, not just a Java signature.

      - **Preconditions:** parameters, valid ranges, and object state before the call. For example, withdraw(amount) requires amount > 0 and balance >= amount; otherwise it is rejected.
      - **Postconditions:** on success, balance decreases by exactly amount, the invariant balance >= 0 holds, and the return value has clear meaning.
      - **Nullability:** specify whether inputs permit null and whether outputs may be null; use Optional for "not found" when appropriate, without using it indiscriminately for every field.
      - **Exceptions:** distinguish invalid inputs, rejected business operations, and infrastructure failures; define their types/semantics and whether state can change before throwing.
      - **Side effects/concurrency:** document data changes, transaction scope, idempotency, and consistency guarantees where relevant.

      For example, PaymentGateway.charge(amount) needs a clear contract for currency, duplicate requests, receipt states, and timeout outcomes. A timeout does not necessarily mean "payment failed"; checking the outcome by idempotency key may be necessary.

      Under the **Liskov Substitution Principle**, implementations/subclasses must not silently strengthen preconditions, weaken postconditions, or violate the contract's invariants. Contract tests covering happy paths and invalid/failure paths help adapters preserve meaning despite differing underlying SDKs.
  - question: Why does having the same method signature not guarantee that two implementations honor the same semantic contract?
    readmeRelated:
      anchorList:
      - abstraction-004
      - interface-008
      - subtyping-007
      - solid-004
      - testing-004
      - testing-005
    knowledge: Behavioral contracts go beyond signatures; require consistent postconditions, invariants, and errors, verified through shared contract tests.
    answer: |-
      **Identical names, parameters, and return types** establish type compatibility but do not guarantee matching **behavioral contracts**. Clients can truly substitute interface implementations only when results and side effects have consistent meaning.

      Suppose Repository.findById(id) returns User. Implementation A returns null when missing, B throws NotFoundException, and C returns an empty User. Despite identical signatures, clients need three handling strategies, so the abstraction leaks implementation details and can lead to business errors.

      A clearer contract might be Optional<User> findById(Id id): a valid but missing ID returns Optional.empty(); null/invalid IDs are rejected consistently; DB/network connection failures do not become empty results. Read-your-writes, side effects, and exception safety must also agree when the application relies on them.

      **How to verify:** create a reusable test suite for each adapter (in-memory, SQL, remote). Use the same valid ID, missing ID, invalid input, and simulated storage failure cases; assert postconditions, error contracts, nullability, and post-failure state. If an implementation fails, fix its adapter/mapping or split interfaces with genuinely different contracts instead of making callers cast/type-check.

      This distinguishes structural/nominal typing from **LSP**. Signatures are necessary but insufficient; semantic contracts enable substitutable implementations.
  - question: When is an interface with just one implementation still useful as a module or testing boundary?
    readmeRelated:
      anchorList:
      - abstraction-003
      - interface-009
      - composition-006
      - solid-006
      - design-pitfalls-006
      - testing-007
    knowledge: Interfaces can serve module/port boundaries, test fakes, or evidence-based extensions even when only one adapter
      currently exists.
    answer: |-
      Having only one concrete implementation **does not automatically make an interface useless**. An interface may be an **architectural boundary** where high-level policies should not depend on concrete infrastructure, or a necessary substitution point for tests.

      For example, BillingService creates and stores invoices. It depends on an InvoiceRepository port in the domain/application module; ProductionInvoiceRepository uses JPA or JDBC. In unit tests, an in-memory fake repository lets invoice rules be checked without opening a DB. Even with one production adapter, dependency direction stays stable and persistence frameworks remain outside the domain.

      A Clock/TimeProvider port is also useful when deadlines depend on time: a fake clock enables deterministic date/time boundary tests. For an external PaymentGateway, the test seam avoids network calls and real transactions.

      **Reasonable criteria:** a meaningful boundary, real backend replaceability or concrete test-isolation benefits, and an interface expressing a stable business capability. A Money value object, pure mapper, or class without hard-to-replace collaborators does not need a fake interface. Fakes also need contract tests so they do not misrepresent production. Place abstractions with the domain client that needs them, not automatically in the vendor adapter's package.
  - question: What signs indicate that an abstraction was introduced too early and makes code harder to understand?
    readmeRelated:
      anchorList:
      - abstraction-007
      - solid-008
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-008
    knowledge: Recognize speculative generality, valueless one-to-one factory/interfaces, excessive delegation, and YAGNI violations.
    answer: |-
      **Premature abstraction/speculative generality** arises when classes, interfaces, and factories are built for imagined variations instead of real points of change.

      Warning signs:
      - An interface always pairs with exactly one class without isolating a useful boundary/test seam.
      - A factory merely instantiates one concrete class through several forwarding layers without adding invariants or behavior.
      - Type names such as GenericProcessor, BaseManager, or AbstractHandler cannot be explained in terms of business responsibilities.
      - A tiny feature requires changes to many registries/configuration/wiring points, while reading the execution path involves jumping through valueless layers.
      - Implementations must cast back or throw UnsupportedOperationException because contracts are too generic, violating ISP/LSP.

      **How to evaluate:** choose a change that has occurred or is likely, measure the places requiring edits, and identify contracts that genuinely matter. If one concrete function and test solve the problem, three Strategy/Factory layers are unnecessary. When variations recur and boundaries become clear, refactor toward interfaces with characterization tests preserving behavior.

      KISS/YAGNI do not mean "never abstract": boundaries between domains and external SDKs/DBs may merit early introduction when dependency risks are real. Nor is there a rigid "wait for exactly three implementations" rule; decide using cohesion, change impact, semantic contracts, and operational costs.
- groupID: 5
  groupName: Inheritance and Subtypes
  questions:
  - question: How do is-a and has-a relationships differ when choosing inheritance or composition?
    readmeRelated:
      anchorList:
      - inheritance-001
      - subtyping-002
      - composition-002
      - composition-004
      - solid-004
      - practice-004
    knowledge: '`is-a` requires behavioral substitutability; `has-a` describes collaboration/delegation and generally imposes
      fewer constraints.'
    answer: |-
      **is-a vs has-a.** Inheritance (extends) represents substitutability: every subclass object must support the operations expected by superclass clients while preserving declared preconditions, postconditions, invariants, and failures. Composition means an object **has** a collaborator and delegates to it, without claiming to be that collaborator's subtype. For example, Car has an Engine but is not an Engine; Checkout has a PricingPolicy for pricing but is not a PricingPolicy.

      ~~~java
      interface ShippingPolicy { long fee(long cents); }
      final class FixedShipping implements ShippingPolicy {
          public long fee(long cents) {
              if (cents < 0) throw new IllegalArgumentException();
              return 2500;
          }
      }
      final class Checkout {
          private final ShippingPolicy shipping;
          Checkout(ShippingPolicy shipping) {
              this.shipping = java.util.Objects.requireNonNull(shipping);
          }
          long total(long cents) {
              if (cents < 0) throw new IllegalArgumentException();
              return Math.addExact(cents, shipping.fee(cents));
          }
      }
      ~~~

      FixedShipping can substitute wherever a client requires ShippingPolicy under that contract; Checkout merely collaborates with the policy. This is a design example, not a compiled/tested program.

      **Trade-offs:** inheritance supports genuine is-a hierarchies, inherited state/implementations, and dynamic dispatch, but subclasses become coupled to base-class design and lifecycle. Composition adds collaborators/wiring yet permits independent policy replacement and less dependence on protected state. Do not equate has-a with strong UML composition ownership: a reference to an injected service may be just an association; Checkout need not own its lifecycle. Choose based on business meaning and substitutability, not to avoid writing a few lines via extends.
  - question: Why can inheritance used solely for code reuse produce an invalid subtype?
    readmeRelated:
      anchorList:
      - subtyping-001
      - subtyping-007
      - composition-004
      - composition-008
      - design-pitfalls-004
    knowledge: Code reuse does not prove a subtype relationship; subclasses must preserve behavioral contracts, so avoid
      inheritance merely to obtain methods.
    answer: |-
      **Code reuse alone does not establish a valid subtype.** The Java compiler verifies extends/override syntax, not whether subclass behavior satisfies superclass contracts. If a base promises write() support but a subclass rejects it, base-class clients break.

      ~~~java
      class WritableStore {
          public void save(String value) {
              if (value == null) throw new IllegalArgumentException();
              // Persist value theo contract.
          }
      }
      final class ReadOnlyStore extends WritableStore {
          @Override public void save(String value) {
              throw new UnsupportedOperationException("Read-only");
          }
      }
      ~~~

      A client receiving WritableStore and calling save("A") with valid input fails if the runtime object is ReadOnlyStore. Their method signatures are compatible, but they violate the **Liskov Substitution Principle**. This is a conceptual demonstration; the persistence comments do not imply a working persistence implementation.

      **Alternatives:** split ReadableStore and WritableStore interfaces by capability so a read-only store implements only reading. If the objective is reusing a formatting function, contain a Formatter collaborator and delegate rather than making Report extends Formatter when Report is not a Formatter. An abstract superclass is suitable only for a real is-a relationship with stable invariants and extension points.

      **Review approach:** write shared contract tests for all implementations covering success, invalid inputs, exceptions, state transitions, side effects, and boundaries. If subtypes strengthen input requirements or throw UnsupportedOperationException for operations promised by the base, redesign the hierarchy rather than adding catches to every client.
  - question: What does the Liskov Substitution Principle require of subclass preconditions, postconditions, and invariants?
    readmeRelated:
      anchorList:
      - abstraction-004
      - subtyping-007
      - solid-004
      - testing-005
    knowledge: 'LSP: do not strengthen preconditions or weaken postconditions; preserve invariants and exception semantics for
      every call through the supertype.'
    answer: |-
      **LSP preserves the assumptions that clients of a base type may make.** Subtypes must not strengthen preconditions (reject inputs accepted by the base), weaken postconditions (provide fewer guarantees), violate invariants, or change errors/side effects contrary to the contract. A subtype may offer stronger postconditions or accept a wider input domain while honoring base guarantees.

      ~~~java
      interface Discount {
          // Pre: subtotal >= 0.
          // Post: 0 <= discount <= subtotal.
          long amount(long subtotal);
      }
      final class BrokenDiscount implements Discount {
          @Override public long amount(long subtotal) {
              if (subtotal < 1000) {
                  throw new IllegalArgumentException("Too small");
              }
              return subtotal + 1;
          }
      }
      ~~~

      BrokenDiscount restricts accepted input from every nonnegative subtotal to only values at least 1000, while returning discounts greater than subtotal. The class compiles but cannot substitute for Discount under its contract. For very large long values, the addition may also overflow.

      **Exception semantics:** Java prevents overrides from widening checked exceptions beyond those allowed by the superclass method, but unchecked RuntimeException can still be thrown. Therefore satisfying compiler throws rules does not establish LSP. An operation promised to return a result for valid input changes its behavior if it unexpectedly throws UnsupportedOperationException.

      **QA:** document pre/postconditions, nullability, side effects, ordering, and failure paths; run shared contract tests across subtypes using 0, 1, lower/upper bounds, failures, and operation sequences. Subtypes need not produce identical numerical results; different outcomes are valid when all remain within the guarantees declared by the base.
  - question: How do you explain the Rectangle–Square problem when both types are mutable?
    readmeRelated:
      anchorList:
      - subtyping-008
      - solid-004
      - testing-005
      - practice-004
    knowledge: A mutable Square changes both width and height on setWidth, violating Rectangle's contract; consider a Shape
      abstraction or immutable model.
    answer: |-
      **Rectangle–Square is a counterexample arising from mutable API contracts.** Assume Rectangle exposes independent setters: setWidth changes only width while preserving height, and setHeight changes only height while preserving width. A Square preserving width == height must change both dimensions when either setter runs, thereby violating Rectangle's postconditions.

      ~~~java
      class Rectangle {
          protected int width, height;
          Rectangle(int w, int h) { width = w; height = h; }
          public void setWidth(int w) { width = w; }
          public void setHeight(int h) { height = h; }
          public int area() { return width * height; }
      }
      final class Square extends Rectangle {
          Square(int side) { super(side, side); }
          @Override public void setWidth(int side) {
              width = side;
              height = side;
          }
          @Override public void setHeight(int side) {
              width = side;
              height = side;
          }
      }
      ~~~

      A valid Rectangle client can call setHeight(5), then setWidth(4), and expect area() == 20. With Square, setWidth(4) also changes height to 4, yielding area() == 16. This breaks the behavioral contract even though a square is mathematically a rectangle.

      **Redesign:** both classes may implement Shape exposing area() and other operations with consistent semantics; use immutable Rectangle and Square value objects that return new instances instead of forcing Square to support independent setters. There is no need for Square extends mutable Rectangle. Production code should add nonnegative-dimension validation and overflow protection; this example focuses on LSP without implementing those checks. LSP depends on the API contract used by clients, not just geometric definitions.
  - question: In Java, how does method overriding differ from overloading in when a method is selected?
    readmeRelated:
      anchorList:
      - inheritance-004
      - polymorphism-003
      - polymorphism-005
    knowledge: Overloads are selected at compile time from argument/reference types; overridden instance methods are selected using runtime classes.
    answer: |-
      **Overloading is resolved at compile time; overriding dispatches at runtime.** Overloads are same-named methods with different parameters; the compiler chooses a signature using the arguments' *static types* and applicability, specificity, widening, boxing, and varargs rules. An override supplies a subclass implementation of the selected instance method; Java chooses its body based on the receiver's runtime class.

      ~~~java
      class Parent {
          String show(Object o) { return "Parent-Object"; }
          String show(String s) { return "Parent-String"; }
      }
      class Child extends Parent {
          @Override String show(Object o) { return "Child-Object"; }
      }
      class Example {
          static void demo() {
              Parent receiver = new Child();
              Object x = "text";
              System.out.println(receiver.show(x));      // Child-Object.
              System.out.println(receiver.show("text")); // Parent-String.
          }
      }
      ~~~

      Because x is declared Object, the compiler selects show(Object), and runtime dispatch invokes the Child override. For the String literal, the compiler selects show(String); Child does not override that signature, so Parent's implementation is inherited. x having runtime type String does not make Java switch to the String overload.

      **Edge case:** f(null) may be ambiguous when both f(String) and f(Integer) exist; a cast can express the intended overload. Static methods are hidden rather than virtually overridden; field access uses reference type; private methods and constructors are not overridden. Use @Override to let the compiler catch unintended signature changes. Identical signatures still require separate behavioral contract tests.
  - question: To what extent can a subclass change an overridden method's visibility, return type, and checked exceptions?
    readmeRelated:
      anchorList:
      - class-004
      - inheritance-004
      - polymorphism-005
      - language-mechanics-008
    knowledge: Overrides cannot reduce visibility, may use covariant return types, and cannot add or broaden checked exceptions.
    answer: |-
      **Java overriding rules.** (1) **Visibility cannot be reduced:** a base protected method may remain protected or become public; public must remain public. (2) **Return types** may be covariant for references, such as Number to Integer; primitives must obey compatible type rules and cannot arbitrarily change int to long. (3) **Checked exceptions** cannot be added or broadened beyond the base method contract; narrower checked exceptions or no throws are allowed. (4) Final instance methods cannot be overridden, static methods are hidden, and private methods/constructors are not overridden.

      ~~~java
      import java.io.*;
      class Base {
          protected Number load() throws IOException { return 1; }
      }
      final class Derived extends Base {
          @Override public Integer load() throws FileNotFoundException {
              return 2;
          }
      }
      ~~~

      Derived is valid because it widens visibility, returns a reference subtype, and narrows the checked exception. Returning String instead of Number is invalid; replacing IOException with a broader Exception in throws is also rejected by the compiler.

      **What the compiler does not protect:** unchecked exceptions may change behavior for inputs promised by the base; subtypes can still violate postconditions, nullability, side effects, or invariants despite compiling. Generic hierarchy overrides also involve erasure and bridge methods; for name clashes, examine types after erasure. Use @Override, API documentation, and shared contract tests to protect both syntax and substitution semantics.
  - question: When does the fragile base class problem occur, and why can changing a superclass break a subclass?
    readmeRelated:
      anchorList:
      - inheritance-010
      - polymorphism-004
      - composition-008
      - design-patterns-011
      - refactoring-007
    knowledge: 'Fragile base: subclasses depend on superclass internal hooks/order/state, so changes to the base cause unexpected
      failures.'
    answer: |-
      **Fragile base class** occurs when subclasses inadvertently depend on internal call order or superclass implementation details instead of a stable extension contract. The superclass can change internally while preserving public signatures, yet subclasses begin miscounting, duplicating side effects, or violating invariants.

      ~~~java
      import java.util.*;
      class BaseBag<E> {
          private final List<E> data = new ArrayList<>();
          public void add(E item) { data.add(item); }
          public void addAll(Collection<? extends E> xs) {
              for (E item : xs) add(item);
          }
      }
      final class CountingBag<E> extends BaseBag<E> {
          private int count;
          @Override public void add(E item) {
              count++;
              super.add(item);
          }
          @Override public void addAll(Collection<? extends E> xs) {
              count += xs.size();
              super.addAll(xs);
          }
          int count() { return count; }
      }
      ~~~

      Calling addAll with two elements on CountingBag increments count by 4: its addAll override adds 2; BaseBag.addAll virtually invokes add twice; the add override adds 2 more. If BaseBag switches to direct bulk insertion, the count changes despite the same public contract. The defect comes from depending on the superclass's internal *self-use*.

      **Risk reduction:** prefer composition/decorators for feature extension: CountingBag holds BaseBag as a collaborator and counts at one contract-defined point, independent of whether the base calls add in addAll. If inheritance is necessary, document overridable hooks, ordering, side effects, state, and constructor lifecycles; avoid virtual calls in constructors. Write regression/contract tests for subclasses before changing the base. A non-final class should not automatically be treated as an extension framework if it was never designed for inheritance.
  - question: When does using protected fields increase coupling between a superclass and its subclasses?
    readmeRelated:
      anchorList:
      - class-004
      - inheritance-005
      - inheritance-010
      - class-design-003
    knowledge: Protected fields expose superclass representation/invariants to subclasses; prefer private state with protected/public
      behavior.
    answer: |-
      **Protected fields expose superclass representation to subclasses.** If BaseOrder has protected List items, a subclass can call items.clear() or replace the structure without respecting invariants such as "confirmed orders must not change." If the base changes List to Map or changes caching, many subclasses must be edited although public APIs remain unchanged. Coupling to base internals is harder to control than an interface method contract.

      ~~~java
      abstract class OrderBase {
          private final java.util.List<String> items = new java.util.ArrayList<>();
          private boolean confirmed;

          public final void add(String item) {
              if (confirmed || item == null || item.isBlank()) {
                  throw new IllegalStateException("Cannot add");
              }
              items.add(item);
          }
          protected final int itemCount() { return items.size(); }
          public final void confirm() {
              if (items.isEmpty()) throw new IllegalStateException("Empty order");
              confirmed = true;
          }
      }
      ~~~

      Keep fields private and expose protected/public **contract-governed behavior** instead of direct field mutation. Mark important methods final when subclasses must not bypass invariants. Where extension is required, offer protected hooks with documented preconditions, postconditions, and invocation timing; do not expose protected mutable references merely for convenience.

      **Trade-offs:** protected state may be acceptable in frameworks with documented extension APIs, but it creates a long-term representation-compatibility commitment. Composition through collaborator interfaces is often less coupled without a genuine is-a relationship. Likewise, non-final protected methods can be incorrectly overridden when called from base constructors, so visibility does not replace lifecycle and LSP analysis.
  - question: What problems does Java avoid by allowing multiple implemented interfaces but only one extended class?
    readmeRelated:
      anchorList:
      - interface-004
      - interface-007
      - inheritance-008
      - polymorphism-006
    knowledge: Avoiding multiple class inheritance reduces state/implementation conflicts; multiple interface roles still require
      default-method conflict resolution.
    answer: |-
      **Java extends only one class** to avoid automatically merging potentially conflicting instance states, constructor chains, and inherited implementations. If two superclasses both define a field name, reset method, and initializer logic, multiple class inheritance raises ambiguous state/behavior choices. Java permits implementing several interfaces so one object can fulfill multiple *roles* without inheriting several classes' state.

      ~~~java
      interface Printable { void print(); }
      interface Auditable { void audit(); }
      final class Report implements Printable, Auditable {
          @Override public void print() { /* render */ }
          @Override public void audit() { /* record */ }
      }
      ~~~

      Report can satisfy both contracts. When interfaces have default methods, diamond/conflicts still require resolution: class methods generally win over defaults, more specific interfaces outrank parent interfaces, and unrelated same-signature defaults require an override. Multiple interfaces are not always conflict-free; Java simply provides resolution rules without inheriting multiple class states.

      **Trade-offs:** multiple interfaces improve role composition/ISP, but implementing too many unrelated capabilities can signal poor responsibility grouping. To reuse implementations of multiple features, keep Printer and Auditor as collaborators and delegate rather than trying to extend two classes. Choose composition for coordinated state, lifecycles, and explicit ownership; role interfaces do not define ownership by themselves.
  - question: How would you migrate a deep inheritance hierarchy toward delegation or composition?
    readmeRelated:
      anchorList:
      - inheritance-010
      - composition-008
      - testing-009
      - refactoring-007
      - refactoring-009
    knowledge: Start with characterization tests, then extract collaborators and delegate incrementally while preserving public contracts.
    answer: |-
      **Migrating deep inheritance requires locking down behavior first, then gradually replacing extension points with collaborators.** Map the hierarchy and public/protected APIs: invariant ownership, subclass super calls, overridden hooks, constructors, base self-use, and signatures external clients rely on. Write characterization tests for success/failure, exceptions, side effects, and callback order; migrate incrementally instead of deleting the hierarchy abruptly.

      For example, replace BaseNotifier → RetryNotifier → AuditedNotifier with components:

      ~~~java
      interface Notifier { void send(String to, String body); }
      final class AuditedNotifier implements Notifier {
          private final Notifier delegate;
          AuditedNotifier(Notifier delegate) { this.delegate = delegate; }
          @Override public void send(String to, String body) {
              // audit theo contract trước/sau
              delegate.send(to, body);
          }
      }
      final class RetryingNotifier implements Notifier {
          private final Notifier delegate;
          RetryingNotifier(Notifier delegate) { this.delegate = delegate; }
          @Override public void send(String to, String body) {
              // retry có giới hạn và idempotency thích hợp
              delegate.send(to, body);
          }
      }
      ~~~

      This skeleton illustrates architecture without implementing real auditing/retries. AuditedNotifier(new RetryingNotifier(realAdapter)) is one composition; **wrapper order matters**: logging each attempt differs from logging one operation. Retrying non-idempotent notifications can send duplicates; define retryable errors, backoff, and idempotency/reconciliation before production use.

      **Migration plan:** (1) establish baseline tests and external contracts; (2) extract policies/collaborators for one branch, leaving the old class delegating; (3) migrate callers gradually and use adapters/deprecation for source/binary compatibility when necessary; (4) centralize invariants with the proper owners rather than scattering them across wrappers; (5) run unit/integration/contract tests and check concurrency, transactions, and exceptions. Delete the base only when no consumers/subclasses still depend on its contract. Composition increases wiring but reduces fragile-base coupling.
- groupID: 6
  groupName: Polymorphism and Dispatch
  questions:
  - question: How does runtime polymorphism eliminate repeated subtype-checking branches?
    readmeRelated:
      anchorList:
      - polymorphism-009
      - solid-003
      - design-patterns-008
      - design-pitfalls-005
      - refactoring-006
    knowledge: Place variable behavior behind interfaces; dispatch to runtime implementations rather than repeating switch/instanceof checks.
    answer: |-
      **Runtime polymorphism** lets callers invoke a shared contract while the actual implementation depends on the object's runtime type. For example, `PaymentMethod.pay(amount)` may have `CardPayment` and `BankTransferPayment` implementations; `CheckoutService` simply calls `method.pay(amount)` without repeating `if (method instanceof CardPayment)` or `switch(type)` in multiple places.

      The mechanism is **method overriding + virtual dispatch**: a variable declared `PaymentMethod` can hold a reference to a concrete instance; the JVM invokes that instance's implementation when executing the virtual method. Each subtype encapsulates its own rule in a contract method. Adding a payment type means adding an implementation and configuring object creation/registration rather than editing every caller of a stable contract.

      Every implementation must preserve contractual postconditions, errors, and invariants. Polymorphism does not eliminate all branching: selecting an implementation from HTTP requests, configuration, or discriminators may still require a factory/switch. If variation is fixed, simple, and localized, a clear conditional can be easier to maintain than a hierarchy.
  - question: How do compile-time overload resolution and runtime virtual dispatch work differently in Java?
    readmeRelated:
      anchorList:
      - inheritance-004
      - polymorphism-003
      - polymorphism-005
    knowledge: Overloads are bound at compile time; overridden virtual instance methods are selected using the object's runtime type.
    answer: |-
      **Overload resolution** happens at compile time: the compiler selects a method signature from the receiver's and argument expressions' static types, considering applicable methods, conversions, widening, boxing, and varargs. An argument object's runtime type **does not cause overload selection to be revisited** while the program runs.

      For example, `log(Object)` and `log(String)` are overloads. For `Object x = "abc"; log(x)`, the compiler selects `log(Object)` because the static type of `x` is `Object`, even though its runtime value is a String.

      **Virtual dispatch** only chooses the implementation of an instance method whose signature has already been determined. For `Parent p = new Child(); p.draw()` when Child overrides `draw()`, the compiler validates `draw()` against Parent, while the JVM calls `Child.draw()` at runtime. If Child overloads `draw(String)` but Parent does not declare it, the runtime subtype alone cannot make `p.draw("x")` compile.

      Thus overloading depends on **static types and parameters**, whereas overriding depends on the **receiver's runtime type**. Static/private methods and fields do not participate in virtual dispatch like overridden instance methods.
  - question: How do field hiding and static method hiding differ from overriding instance methods?
    readmeRelated:
      anchorList:
      - class-003
      - polymorphism-006
      - polymorphism-007
    knowledge: Field access and static methods follow declared/reference types; only overridden instance methods use virtual dispatch.
    answer: |-
      **Field hiding:** a same-named subclass field does not override its superclass field; each is a separate member. Accessing `ref.value` is bound to the **reference's declared type**, not the runtime object. For example, `Parent p = new Child(); System.out.println(p.name)` reads `Parent.name` when Parent declares it, even if Child has a same-named field.

      **Static method hiding:** if a subclass declares an accessible same-signature static method, selection follows the call site's static type. `Parent p = new Child(); p.info()` (legal but confusing Java syntax) calls `Parent.info()`, not `Child.info()`; prefer the explicit `Parent.info()` form.

      **Instance method overriding:** `Child` overrides `Parent.info()` when the method is not static/private/final and the override satisfies its contract; `Parent p = new Child(); p.info()` calls `Child.info()` through virtual dispatch. Distinguish hiding from overriding when debugging surprising behavior; use `@Override` for instance methods and avoid needless same-named fields/static methods across hierarchy levels.
  - question: How does Java determine which method to call when a supertype reference points to a subtype object?
    readmeRelated:
      anchorList:
      - subtyping-004
      - polymorphism-002
      - polymorphism-004
    knowledge: Instance methods dispatch by runtime subtype except for static/private/final methods or special calls such as
      `super`.
    answer: |-
      With `Parent p = new Child()`, **compile time** first checks which methods are applicable on type `Parent` and selects an overload using the static types of `p` and its arguments. If the selected method is an **overridable instance method**, runtime finds the appropriate override for the receiver's actual class, `Child`. Hence `p.execute()` calls `Child.execute()` if Child validly overrides it, or inherits the superclass implementation otherwise.

      Important exceptions:
      - **Static methods** are bound by expression/declared type; subclasses can hide but not override them.
      - **Private methods** cannot be overridden; a same-named subclass method is separate. **Final instance methods** also cannot be overridden, so Child cannot provide a different implementation.
      - `super.execute()` within Child invokes the specified superclass implementation using `invokespecial` rules, bypassing Child's override for that call.
      - Field access also follows static types, not virtual dispatch.

      Do not assume `new Child()` means every call uses a Child method. Consider the compile-time-selected signature and whether it is an overridable instance method.
  - question: When are instanceof and pattern matching appropriate, and when do they indicate missing behavior in the design?
    readmeRelated:
      anchorList:
      - subtyping-006
      - polymorphism-009
      - design-pitfalls-005
      - refactoring-006
    knowledge: Pattern matching/instanceof suit boundaries, serialization, or type-specific data; repeated manual dispatch by
      callers is a warning sign.
    answer: |-
      **`instanceof`/pattern matching** is appropriate at a genuine **data-type processing boundary**: adapters parsing external payloads, event serialization, known record/variant sets, or checks before type-specific operations absent from the public contract. For example, `if (obj instanceof PaymentEvent e)` allows safe access after type validation; pattern matching with `switch` can suit controlled sealed data hierarchies.

      It signals missing behavior when many services repeat `if (animal instanceof Dog)...else if (Cat)...` to choose `makeSound()`. When each subtype owns distinct behavior, put it behind `animal.makeSound()` so callers share a contract and adding a subtype does not require widespread edits.

      Do not mechanically replace every type check with polymorphism. If an operation belongs to **an external consumer**, such as export to a specific format, adding export methods to domain objects solely for the adapter may create infrastructure coupling. A visitor, mapper, or centralized boundary pattern matching may be preferable. Decide from behavior ownership, repeated branching frequency, whether subtype sets are open, and inter-module coupling.
  - question: How does Strategy use polymorphism differently from writing multiple switch branches in a service?
    readmeRelated:
      anchorList:
      - polymorphism-009
      - composition-005
      - design-patterns-008
      - refactoring-006
    knowledge: Strategy uses an interface and concrete policies selected at the composition root; a Map of types to formulas alone
      does not encapsulate behavior.
    answer: |-
      **Strategy** represents interchangeable policies/algorithms through a contract such as `DiscountPolicy.calculate(cart)`. `CheckoutService` receives a `DiscountPolicy` and invokes `calculate` without knowing whether it is `LoyaltyDiscount`, `SeasonalDiscount`, or `NoDiscount`. Each implementation owns its rules; change the policy at the **composition root** or factory when selection is allowed.

      If a service repeats `switch(customerType)` across use cases, adding a customer type requires editing many branches and regression tests for a large class. Strategy localizes changes, supports unit testing each policy, and permits testing consumers with fake policies. When runtime selection is needed, a registry/factory can map codes to Strategy instances; **a Map alone does not replace behavior encapsulation** if logic remains scattered across hard-to-test `switch` branches/lambdas.

      Costs include additional classes, configuration, and indirect calls. With only two fixed cases, a single clear `switch` and no expected expansion, a direct approach can be simpler. Even with Strategy, every policy must obey a shared contract for currencies, input constraints, exceptions, and side effects.
  - question: Why should callers not repeatedly cast an interface reference to a concrete implementation for business operations?
    readmeRelated:
      anchorList:
      - interface-003
      - subtyping-006
      - polymorphism-008
      - design-pitfalls-005
    knowledge: Callers need an abstraction with sufficient behavior; repeated casts undermine information hiding and subtype extensibility.
    answer: |-
      When callers repeatedly invoke `((SqlOrderRepository) repository).specialQuery()` after receiving an `OrderRepository`, they depend on a concrete implementation; switching to `InMemoryOrderRepository` or another adapter causes failed casts, and the abstract contract no longer supports the use case.

      This usually indicates one of two problems: **the interface lacks a required capability**, or the caller performs work belonging only to an infrastructure adapter. If many clients require the same behavior, add a business-meaningful port method (such as `findOverdueOrders()`) that all implementations honor; if only one client role needs it, consider a separate narrow interface rather than forcing all implementations to support it.

      Casting at boundaries after type checks may be reasonable for deserialization or APIs accepting union types. But casts scattered through business code violate **information hiding** and reduce substitutability. Do not fix this with a giant interface: design appropriate roles/capabilities at boundaries and add adapter contract tests.
  - question: How do you handle implementations of one interface that use different exception or null rules?
    readmeRelated:
      anchorList:
      - abstraction-004
      - interface-008
      - subtyping-007
      - solid-004
      - language-mechanics-008
      - testing-004
    knowledge: Unify exception, nullability, and postcondition contracts; test every implementation against a shared LSP-based suite.
    answer: |-
      Implementations of one interface must satisfy **the same observable contract** for null, errors, state, and side effects. For example, if `UserRepository.findById(id)` returns `Optional.empty()` on absence, an adapter returning `null` and another throwing `NoSuchElementException` make caller behavior inconsistent even when signatures match.

      First define preconditions (can IDs be null?), postconditions (non-null result? ordering/uniqueness?), business versus infrastructure errors, whether failure changes object state, and whether calls are idempotent. Apply nullability annotations or `Optional`/`Result` types where useful; normalize infrastructure failures into the exceptions/results declared by the interface. Under the **Liskov Substitution Principle**, an implementation cannot add preconditions or weaken supertype guarantees.

      Write a **shared contract test suite** for every implementation covering valid inputs, boundaries, null, missing values, exceptions, invariants, and failure side effects. Contracts involving external systems additionally need integration tests. If semantics genuinely differ, split the interfaces or clarify options rather than hiding differences behind identical signatures.
  - question: How do covariant return types support overriding in Java?
    readmeRelated:
      anchorList:
      - inheritance-004
      - polymorphism-005
    knowledge: 'Covariant returns: overrides may return the same reference type or its subtype; this does not freely apply to
      primitives.'
    answer: |-
      **Covariant return types** let overriding instance methods return a **subtype of the reference return type** declared by a superclass/interface. For example, `class Parent { Number value() {...} }` and `class Child extends Parent { @Override Integer value() {...} }` are valid because `Integer` is a subtype of `Number`.

      A client typed `Parent` still sees the `Number value()` contract; a client aware of `Child` can receive `Integer` without casting. This makes APIs more convenient when subclasses provide more specific results, while preserving supertype postconditions and exception semantics.

      You cannot arbitrarily replace `int` with `long`, `boolean`, or an unrelated reference type because primitives have no covariance subtype relationship. During compilation, Java may generate **bridge methods** to preserve polymorphism/binary compatibility when JVM signatures differ due to return types or generic erasure; these are compiler implementation details, not programmer-written overloads. Covariant returns apply to overriding; overloading is distinguished by parameters, not return type alone.
  - question: When does using polymorphism make a system more complicated than a direct solution?
    readmeRelated:
      anchorList:
      - oop-basic-008
      - abstraction-007
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-008
    knowledge: Recognize fixed single variants, speculative extension, or valueless delegation layers; prefer simpler solutions
      when appropriate.
    answer: |-
      Polymorphism incurs costs when introducing **abstractions and multiple implementations** with little actual variation: one fixed policy, one simple operation used in one place, or a class/interface/factory merely wrapping a short `if`. Execution paths spread across files, becoming harder to follow, debug, and configure relative to their value.

      Ask: Are there multiple real implementations? Do they share a stable contract? Which callers need replaceability? Do rules change independently, need separate testing, or require extension without editing consumers? If most answers are no, a pure function, concrete class, or centralized `switch` is often sufficient under **KISS/YAGNI**.

      When genuine variation emerges, refactor deliberately: write characterization tests for existing behavior, extract interfaces by capability, isolate strategies, inject through constructors, and run contract tests. Evaluate clarity and change scope for real use cases; **do not use class/interface counts** as a quality metric.
- groupID: 7
  groupName: Composition and Object Relationships
  questions:
  - question: How does composition enable collaborator replacement and reduce dependence on inheritance hierarchies?
    readmeRelated:
      anchorList:
      - inheritance-010
      - composition-001
      - composition-004
      - composition-005
      - refactoring-007
      - practice-004
    knowledge: Composition delegates through injectable/replaceable collaborators, avoiding coupling to superclass internals and
      hook ordering.
    answer: |-
      **Composition** means an object holds a collaborator reference and delegates work through a contract instead of inheriting an implementation solely for code reuse. It expresses has-a/uses-a relationships, enabling component replacement without tying subclasses to superclass internal hooks or state.

      For example, CheckoutService receives PaymentGateway and PricingPolicy in its constructor and invokes gateway.charge(...) and pricing.quote(...). When changing providers, the composition root injects a different adapter; changing policies requires injecting another policy. The service need not extend StripeGateway or modify an inheritance hierarchy.

      **Comparison:** inheritance suits is-a relationships and must obey LSP; changing superclass hooks can affect many subclasses (fragile base class). Composition uses delegation, permits fake collaborators in tests, and combines capabilities without multiple class inheritance. Its costs include additional indirection/wiring and the need to manage collaborator ownership, lifecycles, and thread safety.

      Illustrative Java example:
          interface FeePolicy { long fee(long amount); }
          final class Checkout {
            private final FeePolicy policy;
            Checkout(FeePolicy p) { policy = java.util.Objects.requireNonNull(p); }
            long total(long a) { return a + policy.fee(a); }
          }

      Checkout can be tested with a fake FeePolicy returning a deterministic value without constructing a real SDK. For a pure calculation without variants/boundaries, a concrete class or ordinary function may be simpler. Composition is not always superior.
  - question: How do association, aggregation, and composition differ in object ownership and lifecycles?
    readmeRelated:
      anchorList:
      - composition-007
      - relationships-001
      - relationships-003
      - relationships-008
      - modeling-005
    knowledge: Association represents links, aggregation shared parts, and composition stronger ownership/lifecycle constraints
      governing deletion and transfer.
    answer: |-
      Association, aggregation, and composition can all be implemented with Java references/collections, but differ in **meaning, ownership, and lifecycles**; the final/List keywords alone cannot classify them.

      - **Association:** a general link between objects, such as Customer placing many Orders or Teacher teaching Course; each side generally exists independently.
      - **Aggregation (shared aggregation UML):** a weak whole–part relation where parts can be shared or exist independently, such as Team–Member. UML does not specify every deletion/ownership semantic for hollow-diamond aggregation, so domain contracts must clarify them.
      - **Composition (composite aggregation):** the whole has stronger ownership of parts; a part belongs to at most one composite at a time and its lifecycle is tied to that owner, such as Order–OrderLine. UML uses a filled diamond at the whole end.

      Design questions include who creates/modifies parts, whether they may be reparented/shared, what happens to parts when the whole is deleted, and where transaction boundaries lie. A Customer referenced by multiple Orders should not be cascade-deleted when an Order is removed; OrderLine may be deleted with its Order depending on auditing requirements.

      ORM cascade/orphanRemoval settings implement behavior but do not define business ownership by themselves. Test deletion, transfers, and surviving references. Avoid strong composition if parts need their own identities and lifecycles. A bidirectionally referenced object graph may still represent association rather than composition.
  - question: What invariants must a bidirectional parent–child relationship preserve to prevent inconsistent data?
    readmeRelated:
      anchorList:
      - composition-007
      - relationships-004
      - relationships-006
      - testing-003
    knowledge: Reparenting must update both sides and prevent duplicate children, cycles, self-parenting, and orphaned old links.
    answer: |-
      A bidirectional parent–child relationship must synchronize **two representations of one link**: if parent.children contains child, child.parent must reference that parent. Updating only one side creates inconsistencies in traversal, serialization, and ORM persistence.

      Explicit invariants include: at most one parent per child where required, no duplicate collection entries, removing old links and establishing new ones on reparent, and updating both directions on detach. In trees, prevent self-parenting and ancestor cycles; general domain graphs may permit cycles.

      Centralize mutation in owning APIs such as attachChild(), removeChild(), and moveToParent(); do not let callers freely edit List and child.parent. Before commit, validate conditions, calculate effects, and ensure exceptions do not leave half-updated links. Pseudocode:
          attach(child):
            validate(child != null && child != self && noCycle)
            if child.parent == self: return
            old = child.parent
            if old != null: old.children.remove(child)
            children.add(child)
            child.parent = self

      This is business pseudocode, **not claimed to be compiled**; implementations must avoid arbitrary overridable callbacks between steps and enforce uniqueness according to the chosen equals/identity semantics. With multiple threads or DB writers, transactions, locking, or optimistic versions are needed to prevent lost updates during concurrent reparenting.

      Test attaching, detaching, reparenting, duplicates, self-parenting, cycles, pre-commit failures, and bidirectional consistency. ORM owning-side updates must also remain consistent with in-memory collections.
  - question: How does constructor dependency injection improve testability and implementation replaceability?
    readmeRelated:
      anchorList:
      - interface-003
      - composition-006
      - solid-007
      - testing-007
    knowledge: Constructor injection makes dependencies explicit, avoids null/hidden lookups, and supports fakes/mocks or alternate
      implementations in tests.
    answer: |-
      **Constructor injection** moves collaborator selection and creation outside the business class. The class declares required dependencies in its constructor, usually stores them in private final fields and rejects null, instead of instantiating SDK clients or looking up hidden service locators/singletons.

      Example:
          interface Clock { java.time.Instant now(); }
          final class BookingService {
            private final Clock clock;
            BookingService(Clock c) {
              clock = java.util.Objects.requireNonNull(c);
            }
            boolean expired(java.time.Instant d) { return !clock.now().isBefore(d); }
          }

      In production, inject a Clock using system time; in unit tests, inject a fake Clock returning a fixed instant to test deadline boundaries without waiting in real time. InvoiceService can receive a fake Repository to verify business logic without a database. Switching implementations changes composition-root configuration, not the service.

      Benefits include visible dependencies, fully initialized objects, easy fakes/tests, and scope/lifecycle management at creation time. **Trade-offs:** injection does not guarantee thread safety for mutable collaborators; fakes must honor semantic contracts; overly long constructors often signal overloaded responsibilities. Setter injection may work for optional dependencies, but required dependencies should never be missing from otherwise valid constructed objects.

      DI frameworks merely wire dependencies; they do not replace good ownership and interface design decisions.
  - question: Why should objects receive collaborators through interfaces instead of instantiating concrete dependencies themselves?
    readmeRelated:
      anchorList:
      - interface-003
      - interface-009
      - composition-006
      - class-design-004
      - solid-006
      - testing-007
    knowledge: Boundary ports/interfaces enable replacement; use `new` at composition roots rather than deep within business services.
    answer: |-
      Business objects that instantiate StripeClient, MySqlRepository, or SystemClock inside methods become dependent on concrete infrastructure classes, configuration, and lifecycles. Changing providers or unit-testing failure paths becomes difficult because dependencies cannot easily be replaced and unintended side effects may occur.

      At boundaries requiring variation, define **ports/interfaces in domain language**: PaymentGateway.charge(PaymentRequest) returns Receipt; StripeGateway adapts domain requests to SDK calls and maps responses/errors back to the contract. CheckoutService receives PaymentGateway in its constructor; the **composition root** creates and injects StripeGateway/BankGateway based on configuration. The domain does not know tokens, HTTP responses, or connections.

      In tests, fake gateways return successful, rejected, or timed-out Receipt outcomes according to the contract so CheckoutService can be exercised without network calls. Vendor changes mainly affect adapters, mappings, and wiring; contracts still require compatibility, null, exception, and idempotency checks.

      Not every newly constructed object needs an interface. Creating immutable Money, internal Lists, or pure helpers inside objects may be entirely appropriate. An abstraction that improves neither boundary coupling nor testability only adds an unnecessary layer. Place ports on the business-client side and ensure adapters honor the same behavioral contract.
  - question: How does the Law of Demeter reveal coupling through long getter chains?
    readmeRelated:
      anchorList:
      - class-design-009
      - design-pitfalls-007
      - refactoring-004
    knowledge: The Law of Demeter discourages chains such as `a.getB().getC().set...`, reducing dependence on other objects' internals.
    answer: |-
      The **Law of Demeter** encourages objects to know little about collaborators' deep structure. A chain such as order.getCustomer().getAddress().getCountry().getTaxRate() couples callers to several intermediate layers, makes model changes breaking, and increases risks of null handling or enforcing rules outside their proper owner.

      Poor example:
          order.getCustomer().getLoyalty().setPoints(100);
      The caller traverses an object graph and modifies Loyalty state without validated behavior. A better design uses loyalty.credit(points), with the point-owning object enforcing invariants; if the operation spans aggregates, an application/domain service coordinates explicit ports. For taxes, TaxPolicy.rateFor(destination) may be preferable to adding forwarding getters throughout Order.

      **Benefits:** less coupling to representation, behavior close to its data, and fewer duplicated navigation chains. Do not interpret the principle as banning every dot: fluent builders, Streams, and immutable read models/DTOs for reports often support appropriate navigation. A wrapper order.getCountryTaxRate() is not automatically better if it merely moves dependencies to another method.

      Ask whether callers truly need collaborator internals, modify state owned elsewhere, or propagate graph changes across modules. Fix the **responsibility boundary**, not just the syntax.
  - question: How does Tell, Don't Ask influence whether behavior belongs in an object or a service?
    readmeRelated:
      anchorList:
      - encapsulation-008
      - class-design-007
      - class-design-009
      - modeling-003
      - refactoring-004
    knowledge: Tell Don't Ask places behavior with state owners; services should not extract data and decide on an object's behalf.
    answer: |-
      **Tell, Don't Ask:** when an object owns state and invariants, clients should ask it to perform behavior instead of extracting fields, deciding, and assigning results. Keeping rules with the owner ensures every entry point follows the same validation.

      For example, OrderService reads order.status and order.paid before calling setStatus(SHIPPED); another batch service may forget a condition. Better to have Order.ship() verify PAID and not already SHIPPED before transitioning, throwing on invalid state while preserving the old state. Controllers/services just invoke the command.

      Division of roles:
      - **Entity/aggregate:** behavior that validates and updates its own state/invariants.
      - **Application service:** coordination of authorization, transactions, repositories, gateways, retries, and multiple aggregates.
      - **Domain service:** cross-entity rules with no natural single owner.
      - **Query/DTO:** readable data for UIs/analytics; getters are not inherently bad.

      If behavior requires payment-gateway results, an application service obtains confirmation and passes the necessary information to a domain command rather than making entities instantiate SDKs. Nor should pure calculations unrelated to invariants be forced into entities.

      Determine who owns state, who must enforce the rule, and how many callers would duplicate logic if behavior were not near its owner. These criteria matter more than counting getters.
  - question: When should you retain a reference to another entity versus taking a data snapshot?
    readmeRelated:
      anchorList:
      - object-006
      - object-007
      - class-design-006
    knowledge: References share access to an entity owned elsewhere; snapshots preserve historical values at a specific time;
      choose based on required consistency.
    answer: |-
      An **entity reference** suits situations needing identity and current state managed by an owner; a **snapshot** suits preserving event-time data for history, records, or consistency isolation.

      For example, Order stores customerId to reference Customer. On confirmation, Order records ShippingAddress and UnitPrice snapshots; if a customer updates their profile address or prices change, the confirmed invoice and shipping destination must not silently change. Audit events should capture facts when they occur instead of looking up current profiles and treating them as history.

      **Trade-offs:**
      1. References reduce duplication and provide current data but require lookups, can trigger lazy loading, and must respect transaction boundaries.
      2. Snapshots are stable and independently readable but can become stale; they require schema/versioning and explicit refresh decisions.
      3. For revoked permissions or current inventory, old snapshots cannot replace verification of up-to-date state.

      In DDD, aggregates commonly reference one another by ID rather than retaining mutable graphs across consistency boundaries. Immutable value objects suit snapshots. Choose based on semantics: **latest state**, **historical truth**, or **isolation**; indiscriminate snapshots introduce duplication and confusion over stale data.
  - question: What must be considered when serializing, logging, and releasing resources for object graphs containing reference cycles?
    readmeRelated:
      anchorList:
      - lifecycle-006
      - lifecycle-008
      - relationships-005
      - relationships-006
      - language-mechanics-007
    knowledge: Cycles can cause recursion during JSON/toString; manage identity, reference cycles, sensitive logs, and
      AutoCloseable resources separately.
    answer: |-
      An object graph with **reference cycles** such as Parent.children → Child.parent → Parent may be perfectly valid in the domain, but serialization, logging, equality, and resource lifecycles require care.

      - **JSON:** serializing full entity graphs can recurse indefinitely or produce huge payloads. Prefer DTOs with IDs/references, controlled traversal, or serializer graph-identity mechanisms.
      - **toString/equals/hashCode:** generated methods traversing both directions can cause StackOverflowError, trigger lazy loads, or leak sensitive data. Entity equality should follow identity stable for its lifecycle; toString should include only safe fields.
      - **Logging:** avoid tokens/PII, limit depth and size, and do not log every field by default.
      - **Resources:** Java tracing GC collects even cyclic objects **when no longer reachable**. Cycles alone do not cause memory leaks. But static caches, event listeners, and threads may keep graphs reachable; unsubscribe subscriptions and close sockets/streams/connections with AutoCloseable/try-with-resources under the correct owner.

      For example, serialize Order into OrderDto with orderId, customerId, and LineDto entries rather than recursively serializing Customer.orders back into Order. If an actual API needs cyclic graphs, define and test its serialization policy.

      Test object depth, cycles, lazy loads, and cleanup at lifecycle end; do not assume removing one reference closes external resources.
  - question: How do you design communication between domain objects and infrastructure adapters without leaking technical details?
    readmeRelated:
      anchorList:
      - abstraction-008
      - interface-009
      - class-design-004
      - solid-006
    knowledge: Domains depend on business ports implemented by external adapters; keep DTO/persistence concerns out of domain
      APIs.
    answer: |-
      Domain objects should express **business terminology and necessary ports**, not depend directly on JDBC, JPA entities, HttpResponse, SDK DTOs, or external tokens. Infrastructure adapters implement ports and translate data/exceptions between external models and the domain.

      Examples:
      - InvoiceRepository domain ports expose save(Invoice) and findById(InvoiceId); PaymentGateway exposes charge(PaymentRequest) → Receipt.
      - JpaInvoiceRepository maps Invoice to persistence objects; BankGateway maps domain requests to HTTP/SDK and responses to Receipt or domain/application errors.
      - The composition root injects required implementations into application services.

      **Dependency direction:** high-level policies depend on abstractions, and infrastructure adapters depend on those abstractions. Use anti-corruption layers when external systems have different terminology, states, or lifecycles. Keep SQLException, HTTP statuses, and connections out of public domain APIs.

      Good ports define nullability, pre/postconditions, error semantics, idempotency, consistency, and ownership. A payment-gateway timeout does not mean the transaction definitively failed; contracts may require status lookups/idempotency keys. Entities should not retry network calls or manage connection pools.

      Apply KISS: pure calculations and simple value objects do not require adapters; ports are valuable at genuine vendor-replacement/testing boundaries or to prevent technical domain dependencies. Use contract and integration tests to verify consistent adapter behavior.
- groupID: 8
  groupName: SOLID and Dependencies
  questions:
  - question: Why should the Single Responsibility Principle be understood through reasons for change rather than method counts?
    readmeRelated:
      anchorList:
      - class-design-001
      - class-design-002
      - solid-002
      - design-pitfalls-001
      - refactoring-003
    knowledge: SRP concerns one coherent group of actors/reasons for change, not one method per class; draw boundaries by cohesion.
    answer: |-
      **SRP means one cohesive reason for change, not one method per class.** One responsibility serves a group of policies/actors driving related changes. A class with 8 methods protecting Order's lifecycle can be cohesive; a class with 3 methods for tuition calculation, SMS sending, and SQL reporting may have three unrelated responsibilities.

      **Example analysis:** SchoolManager records grades under academic rules, calculates fees under financial policies, and sends email through a provider. Three independent changes affect one class: a God Class warning. Extract GradeBook for grade constraints, TuitionPolicy for fee formulas, and NotificationGateway for infrastructure delegation; the application service merely coordinates the use case.

      ~~~java
      final class GradeBook {
          void recordGrade(String studentId, int score) {
              if (studentId == null || studentId.isBlank()
                      || score < 0 || score > 100) {
                  throw new IllegalArgumentException("Invalid grade");
              }
              // Persist through an injected repository.
          }
      }
      interface NotificationGateway {
          void send(String studentId, String message);
      }
      ~~~

      **Trade-offs:** Splitting validateGrade, addGrade, and confirmGrade into three classes without one owner can let other entry points bypass invariants; keep state-protecting operations under the same owner. SRP does not require controllers to have one method; split by reasons for change, cohesion, and ownership. At runtime, recording grades and sending notifications are separate side effects: straightforward orchestration does not guarantee atomicity; delivery after commit may require transactions/outboxes and explicit retries. Before refactoring, regression/contract tests should capture successful flows, invalid data, and notification failures.
  - question: How does the Open/Closed Principle support behavior extension, and when does overapplying it waste effort?
    readmeRelated:
      anchorList:
      - solid-003
      - solid-008
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-006
      - refactoring-008
    knowledge: OCP extends behavior through contracts when real variation exists; consider speculative generality and interface-change costs.
    answer: |-
      **OCP supports extending existing variation by adding implementations behind a contract, minimizing edits to stable code.** For multiple independent shipping policies, extracting ShippingPolicy lets Checkout know only the fee-calculation contract.

      ~~~java
      interface ShippingPolicy {
          long fee(long subtotalCents);
      }
      final class FlatFee implements ShippingPolicy {
          @Override public long fee(long subtotalCents) {
              if (subtotalCents < 0) throw new IllegalArgumentException();
              return 2500;
          }
      }
      final class FreeAfterThreshold implements ShippingPolicy {
          @Override public long fee(long subtotalCents) {
              if (subtotalCents < 0) throw new IllegalArgumentException();
              return subtotalCents >= 100_000 ? 0 : 2500;
          }
      }
      final class Checkout {
          private final ShippingPolicy policy;
          Checkout(ShippingPolicy policy) { this.policy = policy; }
          long total(long subtotal) {
              if (subtotal < 0) throw new IllegalArgumentException();
              return Math.addExact(subtotal, policy.fee(subtotal));
          }
      }
      ~~~

      Clients can supply a suitable implementation without switches throughout Checkout. Math.addExact rejects overflow; the policy contract must ensure nonnegative fees. The composition root/configuration may still change when adding a policy: OCP does not mean never modifying any part of the system.

      **Overapplication:** if the business has only one fixed formula and no variants, AbstractFactory → Provider → Strategy → Registry adds indirection, boilerplate, testing costs, and APIs to maintain. This is speculative generality. Start with a clear concrete FeePolicy; extract an interface when there are real variants, plugin/module boundaries, or roadmap evidence. Every new implementation needs contract tests for negative values, thresholds, overflow, rounding, and error semantics.
  - question: How does the Interface Segregation Principle avoid forcing clients to depend on unsupported methods?
    readmeRelated:
      anchorList:
      - interface-006
      - solid-005
      - design-pitfalls-006
    knowledge: ISP splits role interfaces by client needs to avoid no-ops/UnsupportedOperationException and unnecessary privileges.
    answer: |-
      The **Interface Segregation Principle (ISP) requires clients to depend only on operations they actually use**, rather than a broad interface that many implementations cannot fully support. A read-only report viewer needing only invoice access should not depend on refund(), deleteInvoice(), and changeCredential(), which increase coupling, permissions, and test setup.

      ~~~java
      interface InvoiceReader {
          Invoice read(String invoiceId);
      }
      interface RefundService {
          RefundResult refund(String invoiceId, long amountCents);
      }
      final class InvoicePage {
          private final InvoiceReader reader;
          InvoicePage(InvoiceReader reader) { this.reader = reader; }
          Invoice display(String id) { return reader.read(id); }
      }
      ~~~

      Invoice and RefundResult are illustrative domain types; the code specifies contracts, not a claimed complete application. An adapter can implement both interfaces when it has both capabilities, while a read-only adapter implements only InvoiceReader. No fake methods throwing UnsupportedOperationException are needed, so clients receiving readers can trust valid read() operations.

      **Segregation criteria:** split by roles and client needs (read, write, refund), not by an absolute method count. If several operations jointly preserve one invariant/transaction, an interface per method adds dozens of types and loses cohesion. ISP works with LSP: substitutable implementations must support every operation promised by their interface, including error and nullability semantics. Use contract tests and do not disguise contract violations as no-ops.
  - question: How does the Dependency Inversion Principle differ from the mechanical rule that every class needs an interface?
    readmeRelated:
      anchorList:
      - abstraction-003
      - class-design-004
      - solid-006
      - design-pitfalls-006
    knowledge: DIP keeps high-level policies independent of low-level details; introduce abstractions at meaningful boundaries
      rather than mechanically wrapping classes.
    answer: |-
      **The Dependency Inversion Principle does not require an interface for every class.** DIP requires high-level policies not to depend directly on low-level details; both depend on abstractions matching policy needs. An interface at a module boundary is useful when it prevents application/domain imports of SQL, HTTP SDKs, or concrete frameworks.

      ~~~java
      interface OrderStore {
          Order load(String id);
          void save(Order order);
      }
      final class ConfirmOrder {
          private final OrderStore store;
          ConfirmOrder(OrderStore store) { this.store = store; }
          void execute(String id) {
              Order order = store.load(id);
              order.confirm();
              store.save(order);
          }
      }
      ~~~

      This is an architectural skeleton: Order and persistence implementations must be defined in the actual system. The application owns the OrderStore contract; infrastructure JdbcOrderStore implements it and the composition root supplies its instance. The policy does not instantiate JdbcOrderStore or know SQLException/table structure. Tests use fake repositories to verify invariants and use-case flows; integration tests check real transactions/persistence.

      **Counterexample:** FooImpl + IFoo in one package, only forwarding through another name, while callers still depend on vendor JdbcFoo or FooDTO: introducing IFoo has not inverted dependencies meaningfully. A class merely transforming integers or constructing value objects without variation can remain concrete. DI is a collaborator-supply technique; DI containers do not automatically fix module dependency direction, semantic leakage, or business rules misplaced in adapters. Adapter failure/retry differences must be expressed in contracts, not just matched by signatures.
  - question: How do you distinguish dependency injection, service locators, and hard-coded dependencies?
    readmeRelated:
      anchorList:
      - composition-006
      - class-design-003
      - solid-007
    knowledge: DI receives dependencies externally; service locators hide them; hard-coded `new` ties implementations to code
      and tests.
    answer: |-
      **Hard-coded dependency:** a service instantiates SmtpClient or JdbcRepository inside its logic, embedding infrastructure choices in policies; unit tests struggle to replace them and vendor changes propagate into use cases. Constructing local value objects with new Money(...) is not necessarily wrong because they are not side-effectful collaborators or implementations requiring replacement.

      **Dependency Injection (DI):** external code constructs/provides dependencies through constructors, factories, or methods; constructor injection suits mandatory collaborators. It exposes dependencies in signatures, supports fake tests, and centralizes lifecycle management at the composition root.

      ~~~java
      interface MailGateway { void send(String recipient, String text); }
      final class SignupService {
          private final MailGateway mail;
          SignupService(MailGateway mail) {
              this.mail = java.util.Objects.requireNonNull(mail);
          }
          void welcome(String email) {
              if (email == null || email.isBlank()) {
                  throw new IllegalArgumentException("Email required");
              }
              mail.send(email, "Welcome");
          }
      }
      ~~~

      **Service Locator:** a service looks up Services.get(MailGateway.class) at runtime. The constructor hides dependencies, registry misconfiguration fails late, and global test state becomes easy to contaminate. Service locators can occasionally help at plugin registries or framework composition boundaries but should not be scattered through domain/application logic.

      **Trade-offs:** DI adds wiring and may reveal excessively long constructors; review SRP rather than hiding many collaborators in a locator. DI does not guarantee transaction consistency: saving a user then failing to send email requires explicit rollback, retry, idempotency, or outbox policies. Do not close injected clients/connections owned elsewhere. Containers such as Spring manage object graphs/lifecycles according to configuration but do not automatically satisfy DIP or solve shared mutable state.
  - question: What signs indicate that a class is becoming a God Object?
    readmeRelated:
      anchorList:
      - class-design-002
      - design-pitfalls-001
      - refactoring-001
      - refactoring-003
    knowledge: God Objects combine many actors/infrastructure concerns, fields/methods, and change points; separate by domain responsibilities.
    answer: |-
      A **God Object** signals that dispersed responsibilities and too many reasons for change have accumulated in one place. No line, field, or method count alone proves a class is a God Object. Examine who requests changes and which invariants are being grouped.

      **Concrete signs:** SchoolManager manages Students, records Grades, calculates Tuition, sends SMS, writes PDFs, and updates Payroll; it depends on repositories, SMTP, HTTP, DB transactions, formatters, and security contexts. Changing notification providers changes the class even when tuition rules stay the same; testing one calculation requires many infrastructure mocks; teams repeatedly edit the same file and conflict. State also leaks when controllers mutate fields without validation.

      **Refactoring:** (1) write characterization tests capturing business results, exceptions, and side effects; (2) group fields/methods by cohesion and reasons for change; (3) Extract Class/Move Method into GradeBook, TuitionPolicy, StudentRegistry, and NotificationGateway; (4) let application services orchestrate use cases instead of owning every policy; (5) temporarily preserve an adapter/facade if consumers depend on the old public API; (6) check contracts, transactions, retries, and regression after each step.

      **Counterexample:** an Order aggregate with addItem, removeItem, confirm, cancel, and changeAddress may still be cohesive because all protect Order invariants. Splitting each method into its own service can obscure state ownership. Conversely, a class with only three methods for independent actors may need splitting. Assess dependencies, separate responsibility testability, and change points rather than changes in file count.
  - question: How do you organize packages to avoid circular dependencies and unclear module boundaries?
    readmeRelated:
      anchorList:
      - relationships-007
      - class-design-003
      - solid-006
      - design-pitfalls-007
    knowledge: Design a one-way dependency graph with ports on the correct side; break cycles through clear boundaries and dependency inversion.
    answer: |-
      **Organize modules by business boundaries and a one-way dependency graph.** Split top-level code by features/bounded contexts such as order, billing, and customer; within each module, keep domain models, application policies, ports, and relevant adapters rather than putting every system Service into one giant package. Domains should not import controllers, persistence models, JDBC, or vendor SDKs.

      Example dependency paths in hexagonal architecture:

      ~~~text
      order-api ----------> order-application ----------> order-domain
      order-infrastructure -------> order-application/OrderRepository
      composition-root wires application and infrastructure at runtime
      ~~~

      The OrderRepository port belongs with the policy that needs it, and a SQL adapter implements the port; use cases call that adapter at runtime through the port without an application compile-time dependency pointing toward infrastructure. Conversely, if OrderService imports PaymentService and PaymentService imports OrderService, a module cycle complicates unit tests, DI initialization, and independent changes.

      **Breaking cycles:** identify a workflow owner (such as CheckoutCoordinator) to coordinate policies without reciprocal calls; or extract a shared domain policy with one-way dependencies. Use events when eventual consistency is acceptable and contracts clearly define idempotency, retries, duplicates, and ordering; do not introduce events merely to hide cycles. Moving both classes into a shared package or adding two empty interfaces does not resolve import/semantic cycles.

      **Controls:** dependency graphs, module-level builds, architecture tests (e.g., ArchUnit when used), prohibited domain → infra imports, and CI cycle checks. Bidirectional Parent–Child object references may be valid and are different from compile-time module cycles; do not conflate them.
  - question: How do you balance SOLID, KISS, and YAGNI in a small system?
    readmeRelated:
      anchorList:
      - oop-basic-008
      - solid-008
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-008
    knowledge: KISS/YAGNI favor simplicity; apply SOLID at demonstrated change hotspots and seams needed for testing.
    answer: |-
      **Balance SOLID, KISS, and YAGNI through correctness, evidence-based changeability, and comprehension costs.** SOLID helps assign responsibilities and dependency direction, KISS favors the simplest clear solution, and YAGNI discourages building extension points without a need. Do not use interface/class counts as quality measures.

      **Decision process:**
      1. Identify use cases, invariants, failure paths, and ownership first; write regression/characterization tests when changing existing code.
      2. Look for real variation: frequently changing price tables, third-party email APIs, multiple shipping policies, or tests needing fake clocks. These may justify extraction seams.
      3. For simple CSV-line parsing or one stable formula, use a clear function/concrete class with a defined contract rather than creating multilayer registries/factories/strategies.
      4. When variations are confirmed or module boundaries justify it, extract client-driven abstractions and test all implementations with a shared suite.
      5. Measure change/comprehension impact: how many locations must change, how many collaborators require configuration for tests, and whether invariants are owned correctly.

      One concrete FeePolicy may initially suffice. Once genuine member-based and region-based pricing appears, ShippingPolicy/Strategy becomes useful. **KISS does not mean putting everything in controllers**; few classes with scattered business rules create coupling. **SOLID does not mean one method per class**; forwarding layers increase cognitive load and the risk of bypassing invariants.

      Conclusions must be contextual: small systems should favor simple code while preserving resource ownership, transactions, and API contracts. Optimize performance only with workloads and measurements; do not claim an architecture is faster without benchmarks.
  - question: Why can splitting responsibilities into too many tiny classes reduce cohesion within a use case?
    readmeRelated:
      anchorList:
      - class-design-001
      - class-design-002
      - solid-002
      - design-pitfalls-010
      - refactoring-008
    knowledge: Overfragmentation increases orchestration/indirection and obscures invariant ownership; group tightly related behavior.
    answer: |-
      **Overfragmentation can reduce use-case cohesion despite tiny individual classes.** If Order cannot be confirmed without items, but validation, status updates, and total calculation live in three independently callable services, the invariant becomes scattered. Use cases must coordinate multiple calls and implicitly preserve order; missing one step can corrupt data.

      ~~~java
      final class Order {
          private final java.util.List<Long> items = new java.util.ArrayList<>();
          private boolean confirmed;

          void addItem(long cents) {
              if (confirmed) throw new IllegalStateException("Confirmed");
              if (cents <= 0) throw new IllegalArgumentException("Price must be positive");
              items.add(cents);
          }

          long confirm() {
              if (confirmed || items.isEmpty()) {
                  throw new IllegalStateException("Cannot confirm");
              }
              long sum = 0;
              for (long price : items) sum = Math.addExact(sum, price);
              confirmed = true;
              return sum;
          }
      }
      ~~~

      This illustrates encapsulating an aggregate invariant in behavioral methods. On confirmation, item-list validation, total overflow, and transitions have one owner. In multithreaded or persistent systems, the method alone does not guarantee atomicity between requests/processes; use transactions, optimistic locking, or synchronization as appropriate.

      **When to split:** extract policies/services for tax, shipping, or payment rules with independently changing strategies; let application services coordinate aggregates and infrastructure. Keep operations sharing invariants inside one aggregate. One-method classes do not guarantee cohesion: many pass-through layers complicate traces, obscure transaction boundaries, and increase coupling. Do not put everything in Order merely to reduce collaborators either, because HTTP/DB adapters have distinct responsibilities.
  - question: How do you evaluate a SOLID-based refactoring through real code changes and testability?
    readmeRelated:
      anchorList:
      - class-design-003
      - solid-008
      - testing-009
      - refactoring-001
      - refactoring-009
      - practice-011
    knowledge: Measure before/after change impact, coverage, mock seams, complexity, and regression risk, not class counts.
    answer: |-
      **Evaluate SOLID refactoring by before/after behavior, changeability, and testability.** First record baselines for API behavior, exception contracts, invariants, side effects, module dependencies, and duplicated business rules. Write characterization/regression tests to capture existing flows before moving ownership. Apply the same contract suite across implementations to detect breaking behavior.

      **Testable example:** a service fee formula is duplicated in Order, Invoice, and Report. Before refactoring, rounding changes require editing three formulas with a risk of divergence. After moving to FeePolicy (single source of truth), all three use FeeQuote; tests cover 0, 1, 111 cents, rounding, negative inputs, overflow, and consistent results. This illustrates change points, **not measurements from the repository**.

      **Specific criteria:**
      - SRP/cohesion: does the class still serve many actors/reasons for change, and is invariant ownership clear?
      - OCP: does adding a variant require changes to core logic and numerous clients?
      - LSP/ISP: do implementations pass common contract suites, and do any throw UnsupportedOperationException for promised operations?
      - DIP: do domain/application modules still import vendor SDKs, ORM models, or HTTP controllers; can policies be tested without real databases?
      - KISS: have forwarding layers, call chains, and difficulty tracing business flows increased or decreased?
      - Regression: are source/binary compatibility, transactions, authorization, idempotency, and concurrent-update failure semantics still correct?

      **Verification:** run unit/integration/contract tests, review diffs and dependency graphs, and try a real or representative change to measure affected files. High coverage does not guarantee good tests; few classes do not guarantee simplicity. When performance matters, measure allocation/latency with JFR, profilers, or appropriate benchmarks rather than inventing figures. A good refactor preserves correct behavior and simplifies known changes without increasing risk.
- groupID: 9
  groupName: Design patterns
  questions:
  - question: How do Factory Method, Abstract Factory, and static factory methods differ in object creation?
    readmeRelated:
      anchorList:
      - lifecycle-005
      - design-patterns-002
    knowledge: Factory Method lets subclasses select products; Abstract Factory creates related product families; a static factory
      is a named static creation method.
    answer: |-
      **Factory Method** is a *creation method* inside a Creator: a superclass defines the workflow and invokes a factory method, which subclasses override to select an appropriate Product. For instance, `DocumentExporter.export()` calls `createWriter()`, while `PdfExporter` and `HtmlExporter` create their respective writers. The extension point lies in Creator inheritance.

      **Abstract Factory** is an *object factory* with multiple creation methods for **an entire compatible product family**. For example, `UiFactory` creates `Button` and `Dialog`; `WindowsUiFactory` produces Windows versions of both, while `MacUiFactory` produces macOS versions. Clients replace the whole family by injecting a different factory, preventing incompatible product mixtures. Its creation methods may internally use Factory Method, but the two patterns address different scopes.

      A **static factory method** is a `static` method returning an object, such as `Money.of(amount, currency)` or `List.of(...)`. It communicates intent, can validate, cache, or return subtypes, and **does not require** a Creator class or subclass overriding. A hard-coded static creation dependency may be difficult to subclass or inject.

      Choose based on need: static factories for clearly named construction; Factory Method for subclass-selected products within an established algorithm; Abstract Factory for configuration-selectable families of compatible products. Avoid many factory classes when a constructor or simple static method suffices.
  - question: When is Builder preferable to constructors with many arguments or factory methods?
    readmeRelated:
      anchorList:
      - lifecycle-005
      - design-patterns-003
    knowledge: Builders suit many optional arguments/combinations; protect required fields with staged APIs or build-time validation.
    answer: |-
      **Builder** is especially useful when an object has many optional arguments, distinct valid combinations, a need for readable parameter names, or multistep construction with final invariant validation. For example, `ReportOptions.builder().title("...").locale(...).includeCharts(true).build()` is clearer than constructors with many `boolean` arguments or overloads.

      Builders avoid telescoping constructors, centralize defaults, and can validate **complete combinations** at `build()`: start dates not after end dates, at least one delivery channel, and nonnegative totals. Supply required fields to the builder constructor, use staged builders when compile-time guarantees are truly needed, or validate at `build()` with meaningful errors. After building, create immutable objects and defensively copy mutable collections; subsequent builder changes must not mutate already created objects.

      **Constructors** are generally better with a few required arguments in an obvious order when all values are available. **Named/static factory methods** suit a few purposeful creation options (`of`, `from`, `parse`) without configuration chains. Builders add code, allocations, and APIs to maintain; for simple objects this can be unnecessary complexity.
  - question: How are Strategy and State similar in polymorphism but different in business meaning?
    readmeRelated:
      anchorList:
      - modeling-008
      - design-patterns-008
      - design-patterns-009
    knowledge: Strategy swaps selectable algorithms/policies; State governs behavior by current state and valid transitions.
    answer: |-
      Strategy and State both use **composition + polymorphism**: a context holds an interface reference and delegates calls to the current implementation. Their difference lies in **meaning and the lifecycle of changes**.

      **Strategy** represents *interchangeable algorithms/policies* selected by clients, configuration, or business logic, such as `DiscountPolicy.calculate(cart)` for standard/VIP customers. Changing Strategy changes the calculation, not necessarily the domain object's state; strategies can be stateless and reusable.

      **State** represents an object's *current state* and **transition** rules: `OrderState.pay(order)` and `OrderState.ship(order)` behave differently when an order is `NEW`, `PAID`, or `SHIPPED`. A State implementation can move the context to the next state after validating invariants. State is valuable when behavior and transitions depend on state; a simple enum + state machine can also be a good design.

      Not every group of implementations is a Strategy, and State should not be used merely because algorithms vary. Use State to control transitions and prohibit invalid operations; use Strategy to select an independent policy at runtime. Both need clear contracts, errors, and context thread-safety decisions when shared across threads.
  - question: How does Decorator differ from inheritance when extending behavior without modifying the original implementation?
    readmeRelated:
      anchorList:
      - composition-004
      - design-patterns-006
      - refactoring-007
    knowledge: Decorator composes same-interface wrappers to add responsibilities; inheritance fixes extensions into a class hierarchy.
    answer: |-
      **Decorator** wraps an object implementing the same interface, delegates calls to it, and adds behavior before, after, or during calls. For example, `CachingRepository(delegate)` and `LoggingRepository(delegate)` both implement `Repository` and can be combined as `new LoggingRepository(new CachingRepository(realRepository))` without editing the original class. Decorator order matters: logging outside the cache differs from logging only backend-bound requests.

      **Inheritance** adds behavior through subclass overrides. It fixes class relationships and risks fragile bases and combinatorial subclass growth such as `CachedLoggedRepository` and `TimedCachedLoggedRepository` when cross-cutting features combine. Decorator uses composition so independent features can be selected/stacked and each layer tested or mocked separately.

      Decorators must still honor the **interface contract** for exceptions, null, returned data, and side effects. Caching changes observable freshness, retries can multiply side effects, and logging may expose sensitive information; preserving signatures does not guarantee unchanged semantics. Many wrappers complicate debugging and ordering, so use them for genuinely independent, composable concerns.
  - question: How do Adapter and Facade differ in adapting interfaces versus simplifying subsystems?
    readmeRelated:
      anchorList:
      - design-patterns-005
      - design-patterns-007
    knowledge: Adapter translates incompatible interfaces/semantics; Facade provides a simple API for a complex subsystem.
    answer: |-
      **Adapter** addresses a **dependency interface or semantics that do not match** the client-required contract. For example, the domain uses `PaymentPort.authorize(PaymentIntent)` while an external SDK exposes `VendorClient.requestCharge(Map)`. `VendorPaymentAdapter` implements `PaymentPort`, converting vendor data types, monetary units, states, and errors into an internal contract. This keeps the domain SDK-independent and permits vendor replacement.

      **Facade** offers a **simple entry point** into a complex subsystem. For example, `CheckoutFacade.placeOrder(request)` coordinates inventory, pricing, payment, and shipping for one use case so callers need not invoke every service in the right order. Facade mainly reduces client knowledge of subsystem structure; it need not translate incompatible interfaces.

      Adapters usually sit at **integration boundaries** to provide compatibility; Facades bound **groups of functionality** to make APIs easier to use. Adapters can call Facades, and Facades can use many adapters, but simplification must not conceal failures or alter semantics: transactions, rollback, timeouts, and orchestration responsibilities still require explicit design.
  - question: How should Observer handle subscription, unsubscription, event ordering, and subscriber exceptions?
    readmeRelated:
      anchorList:
      - lifecycle-006
      - design-patterns-010
    knowledge: Observer subscription lifecycles, unsubscription to prevent leaks, callback order, exception isolation, and concurrency.
    answer: |-
      **Observer** allows a subject to publish events to registered subscribers. Design must specify whether subscriptions use tokens/`Subscription` or `unsubscribe(listener)`, who owns them, when to close them, and whether listeners may unsubscribe from within callbacks. If subjects outlive subscribers, strong references in listener lists can prevent GC → leaks; unsubscribe on component shutdown or use weak-reference mechanisms with explicit semantics.

      For **ordering**, document whether callbacks run synchronously in registration order, nondeterministically, or asynchronously through queues. With synchronous callbacks, slow subscribers block producers; asynchronously, define per-key ordering, queue limits/backpressure, duplicate delivery, and retries. Clients must not assume exactly-once or ordered delivery without such guarantees.

      **Exception isolation:** decide whether a failing subscriber aborts publication or is recorded while other subscribers continue; notification events often isolate failures so one observer cannot block the rest, but this is a business decision. Snapshot subscriber lists or use appropriate collections/locking to avoid concurrent modification during subscribe/unsubscribe. Test throwing listeners, self-unsubscription, registrations during callbacks, reentrancy, and races; important business events may need transactional outboxes/message brokers instead of in-memory callbacks.
  - question: What benefits and risks does Template Method have when using subclass hooks?
    readmeRelated:
      anchorList:
      - inheritance-010
      - composition-008
      - design-patterns-011
    knowledge: Template Method fixes an algorithm skeleton with subclass hooks; consider fragile bases and composition/Strategy
      when hooks become difficult to control.
    answer: |-
      **Template Method** places an algorithm skeleton in a superclass, often as a `final` method invoking fixed steps and selected `protected` hooks for subclass customization. For example, `ImportJob.execute()` validates, parses, persists, and cleans up in order, while subclasses override `parse()` for different formats. Strengths include centralized step ordering and common invariants, less duplicated code, and subclasses providing only defined variation.

      Risks arise when subclasses depend on implicit hook contracts: when hooks run, how often, and which state is ready. Superclasses that alter call order, add hooks, or invoke overridable methods in constructors can break subclasses without public API changes (**fragile base class**). Throwing hooks also require correct finally/cleanup and post-failure state.

      Document hook pre/postconditions, prevent overrides of fixed steps, keep state `private`, avoid `this` escape, and run subclass contract tests. For multiple independent variants or runtime behavior replacement, a concrete coordinator holding the skeleton and injected `ParserStrategy`, `Validator`, or suitable callbacks may be easier to maintain; that is composition rather than inheritance.
  - question: What problems can Singleton cause for shared mutable state, concurrency, and test isolation?
    readmeRelated:
      anchorList:
      - class-003
      - design-patterns-004
      - design-pitfalls-008
    knowledge: Singleton/global mutable state creates hidden coupling, races, and test-order dependencies; consider DI and immutable
      configuration.
    answer: |-
      **Singleton** only governs access to one instance within a classloader/initialization scope; it does not make that instance **thread-safe** or immutable. If it stores a `HashMap`, counter, or shared mutable current-user state, requests may observe each other's data and suffer lost updates, visibility bugs, or races. Use appropriate synchronization, concurrent collections, atomic operations, or remove shared mutable state; adding `volatile` alone does not make every sequence atomic.

      Global singletons also create **hidden dependencies**: methods calling `ConfigManager.getInstance()` internally are hard to substitute in tests and depend on test order. A test modifying singleton state/configuration can make subsequent tests fail, especially in parallel; resetting state often requires touching implementation details.

      Prefer **constructor injection** for services whose lifecycles are managed by application containers and immutable configurations/stateless adapters where possible; select the correct DI container scope. When a true singleton is necessary, Java enums or holder idioms provide safe initialization but still require mutable-state management, resource cleanup, and test isolation. Do not use Singleton merely to avoid passing explicit constructor dependencies.
  - question: When is Chain of Responsibility more appropriate than a centralized chain of conditionals?
    readmeRelated:
      anchorList:
      - design-patterns-006
    knowledge: Chain of Responsibility suits independent handler pipelines that can stop/forward requests and need explicit
      ordering and error policies.
    answer: |-
      **Chain of Responsibility (CoR)** is useful when requests flow through independent handlers, each of which may **handle and stop** or **forward** to the next handler. Examples include authentication, rate limiting, auditing, and business handlers in a request pipeline, or document handlers where the responsible handler processes each document type. Each handler follows a contract such as `handle(request, next)` and knows only its successor, allowing steps to be added, removed, or reordered at the composition root.

      Compared with centralized `if/else`, CoR reduces coupling when steps evolve independently, plugins are involved, or pipelines are reused across use cases. But define **ordering** (authentication before business work), forwarding conditions, how often handlers may invoke `next`, what happens if none handles the request, and exception/rollback policies. Retrying side-effectful handlers requires idempotency; asynchronous chains also need timeouts and cancellation.

      With two fixed branches in one method and no real extension, a simple `if/else` is clearer. CoR requires tests for combinations, short-circuiting, exception propagation, order, and unmatched requests. A validation pipeline that always runs **all** steps may need a separate contract; do not assume the same semantics as CoR stopping at the first handler.
  - question: What signs tell you a design pattern no longer adds value and should be removed?
    readmeRelated:
      anchorList:
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-008
    knowledge: Assess actual variation, valueless layers, and debugging/testing difficulty; inline/remove patterns when complexity
      can be reduced safely.
    answer: |-
      A design pattern no longer adds value when **the anticipated variation never materializes**, interfaces have one implementation without meaningful boundaries, factories merely `new` one class, hierarchies contain valueless forwarding layers, or understanding one use case requires navigating excessive delegation. Signs include tiny changes affecting many files, difficult call-stack debugging, tests verifying only mock calls instead of behavior, and pattern-named classes that protect no invariants.

      Before removing it, verify **contracts and extension requirements**: are integration/test seams still needed, does a framework rely on proxies/subtypes, or do other modules use the interface? Capture behavior with characterization/contract tests, documenting boundary values, nulls, exceptions, transactions, and side effects.

      Simplify incrementally: inline unnecessary factories, use concrete classes with constructor injection, merge forwarding-only layers, replace false is-a inheritance with collaborators, or remove obsolete decorators. Test public behavior and inspect real dependencies/call paths; avoid overly broad one-shot refactorings.

      Judge success by **clarity, change points for real requirements, testability, and regression risk**. KISS/YAGNI do not imply removing useful abstractions; a stable port before an external system may deserve to exist even with only one adapter.
- groupID: 10
  groupName: Domain Modeling and Workflows
  questions:
  - question: How do entities, value objects, domain services, and aggregates differ in object-oriented modeling?
    readmeRelated:
      anchorList:
      - object-004
      - class-design-006
      - class-design-007
      - practice-005
    knowledge: Entities have identities; value objects use value equality; domain services handle rules beyond one entity; aggregates
      enforce consistency.
    answer: |-
      **Entities, value objects, domain services, and aggregates** differ in identity, behavior, and consistency boundaries.

      - **Entity:** has identity persisting through its lifecycle, such as Order identified by orderId. Its state can change while it remains the same order; entity behavior protects its invariants.
      - **Value object:** identified by its values, such as Money(amount,currency) or DateRange(start,end). Generally immutable, with component-based equality and constructor-enforced validity.
      - **Domain service:** business rules not naturally belonging to one entity, such as pricing policies spanning several account types. It is not the default home for all controller/SQL logic.
      - **Aggregate:** a group of entities/value objects managed as a **consistency boundary**. The aggregate root controls mutation, such as Order governing OrderLine and total-calculation rules.

      Order.changeQuantity(lineId,qty) checks for positive qty, updates the line, and preserves the total. Money is a value object without separate identity. Application services coordinate repositories/transactions; domain services handle independent policies when needed.

      Do not map every database table to an aggregate. Oversized aggregates create contention; undersized ones can scatter invariants requiring immediate consistency. Choose boundaries by business rules and actual consistency requirements, not ORM diagrams.
  - question: How do you establish entity identity when two customers share a name but have different identifiers?
    readmeRelated:
      anchorList:
      - object-004
      - class-design-006
      - language-mechanics-006
    knowledge: Identity depends on stable IDs, not mutable or nonunique names/emails; distinguish identity from display
      attributes.
    answer: |-
      Two Customers both named "An" are still **different entities** if their customerId values differ. Identity identifies *which business object* persists through state changes; names, emails, and phone numbers can duplicate or change and are not automatically identity keys.

      Customer(101,"An") and Customer(202,"An") represent different customers. If a repository loads Customer 101 twice into separate Java instances, == can be false although both represent id=101 in **business entity identity**.

      IDs should be stable and unique within their scope, including tenants in multitenant systems. Natural keys work only with guaranteed uniqueness and immutability; emails change easily and are often unsuitable. If IDs exist only after persistence, define equality for transient entities without IDs; do not treat all id=null entities as equal.

      Java == compares references; equals/hashCode follow entity contracts, often identity-based, with care for ORM proxies, lifecycles, and stable hashes when entities serve as HashMap keys. Renaming a Customer does not create a new entity, and two same-named customers must not be merged automatically.

      **Entity identity differs from value equality:** check identity by ID; detecting duplicate names/emails is a separate domain rule.
  - question: Why should value objects be compared by value rather than reference identity?
    readmeRelated:
      anchorList:
      - object-004
      - class-design-006
      - language-mechanics-006
      - practice-005
    knowledge: Value objects represent values such as Money/Address, use component-based `equals/hashCode`, and favor immutability.
    answer: |-
      A **value object** represents a *value* rather than an *instance*. Two Money values with amount=100 and currency="VND" mean the same thing even when constructed as separate objects; reference == cannot express these semantics. Equality should use meaningful business components.

      Java record example:
          record Money(long amount, String currency) {
            Money {
              if (amount < 0) throw new IllegalArgumentException();
              if (currency == null || currency.isBlank()) throw new IllegalArgumentException();
            }
          }
          Money a = new Money(100, "VND");
          Money b = new Money(100, "VND");
          // a.equals(b) là true; a == b là false với hai instance riêng

      Value objects are generally **immutable**: addition creates a new Money rather than mutating a shared object, supporting safe keys/caches and multithreaded sharing. Equality/hashCode consistently use components; Money(100,"USD") differs from Money(100,"VND"). Operations must check compatible currencies and suitable precision/rounding rules.

      Records provide shallow immutability; collection or mutable-object fields still require defensive copies. Some value objects require more than a simple record when normalization/invariants are complex.

      Trade-offs include extra types, mapping/serialization, and allocation, justified when values have their own rules. Do not wrap every primitive just for the sake of OOP.
  - question: Which invariants must an aggregate root protect for objects within its aggregate?
    readmeRelated:
      anchorList:
      - encapsulation-002
      - composition-007
      - relationships-003
      - class-design-007
      - testing-003
      - practice-002
    knowledge: An aggregate root controls mutation and enforces invariants across its entities/value objects within a transaction boundary.
    answer: |-
      The **aggregate root** is responsible for invariants spanning objects within one consistency boundary. External callers must not directly mutate child entities/collections in ways the root cannot validate.

      For an Order containing OrderLines:
      - Every line belongs to the correct Order, has a valid quantity (usually >0), and obeys unit-price/currency contracts.
      - Lines are not duplicated according to the defined business key.
      - Total remains consistent with lines, discounts, and taxes under Order rules.
      - After Order is PAID/SHIPPED, line changes are forbidden or require a separate workflow.
      - DRAFT→PAID→SHIPPED transitions respect root guards.

      Expose Order.addLine(), changeQuantity(), pay(), and ship() rather than unrestricted public getLines().add(...) or setStatus(). The root checks conditions before committing, with transactions and optimistic locking/versions as needed for concurrent updates.

      **Scope is limited:** Order is not directly responsible for every invariant of Customer, Inventory, or Payment aggregates. Cross-aggregate constraints need appropriate orchestration/transactions. Oversized aggregates increase contention; undersized ones cannot guarantee invariants requiring atomicity. Boundaries follow business consistency, not just foreign-key relationships.
  - question: How do rich and anemic domain models differ in where business rules are implemented?
    readmeRelated:
      anchorList:
      - encapsulation-008
      - class-design-007
      - design-pitfalls-003
      - refactoring-004
    knowledge: Rich models keep behavior/invariants in domain objects; anemic models push rules into services/controllers.
    answer: |-
      A **rich domain model** places rules and transitions inside objects that own the state. An **anemic domain model** often contains only data/getters/setters; services/controllers extract fields, decide, and update via setters, scattering business rules.

      Anemic example: Order exposes getStatus()/setStatus(); OrderService checks payment before setStatus(SHIPPED). Another consumer can skip the check. In a rich model, Order.ship() permits only PAID→SHIPPED, rejects invalid states, and preserves prior state; every entry point invokes that command.

      Rich-model benefits include information hiding, single-owner invariants, HTTP/DB-free domain unit tests, fewer duplicated rules, and localized change impact. **It does not mean entities must connect to databases, send emails, or call SDKs**: application services handle authorization, transactions, repositories, and external calls; domain services handle rules without a natural entity owner.

      Trade-offs: simple CRUD applications, DTO/read models, and straightforward data processing may intentionally use anemic data holders. Do not add artificial business logic to every record just to increase method counts.

      The criterion is placement of invariants and responsibility under changing requirements, not getters or class counts.
  - question: When should a business operation belong to an entity rather than a domain service?
    readmeRelated:
      anchorList:
      - class-design-006
      - class-design-004
      - modeling-003
      - refactoring-004
    knowledge: Entities enforce rules tied to their own state; domain services handle operations spanning multiple entities or
      lacking a natural owner.
    answer: |-
      Place behavior in an **entity** when a decision primarily concerns that entity's state/invariants: Account.withdraw(amount) checks the balance; Order.ship() checks status and transitions. This gives every caller the same contract without duplicating rules.

      Use a **domain service** when a business rule has no natural entity owner or requires coordinating several entities/value objects. For example, TransferFeePolicy calculates transfer fees using account types, regions, and independent policies; it does not necessarily belong to either the sending or receiving Account.

      A transfer flow may include:
      1. The application service loads Accounts, validates permissions, and establishes transaction boundaries.
      2. A domain service/policy determines fees or conditions spanning the entities.
      3. Accounts debit/credit through methods that preserve their invariants.
      4. The application service commits and coordinates post-transaction events/notifications.

      A domain service should not become a God Service containing every setter, SQL query, and HTTP call; infrastructure belongs in application/infrastructure layers. If a service repeatedly reads an entity's state and modifies its fields, consider moving that behavior into the entity.

      **Design questions:** Who owns the data that must stay valid? Does the rule concern only this state owner? If it depends on several independent owners, which service/policy is the natural home? Consider cohesion, transactions, and coupling.
  - question: How do you design guarded state-transition workflows such as loan approval or ticket cancellation?
    readmeRelated:
      anchorList:
      - encapsulation-009
      - class-design-008
      - modeling-008
      - design-patterns-009
      - testing-003
    knowledge: Use state machines with guarded and forbidden transitions plus tests; avoid public status setters for workflows.
    answer: |-
      Model workflows as **state machines** defining states, valid transitions, preconditions, postconditions, and forbidden transitions. An unrestricted public setStatus(String) allows callers to bypass validation.

      For LoanApplication, DRAFT→SUBMITTED→APPROVED or REJECTED; only APPROVED can become DISBURSED. approve(reviewer, decision) checks application completeness, current state, and verified reviewer authorization; arbitrary APPROVED→DRAFT changes are forbidden. Booking may transition RESERVED→CANCELLED within an allowed period, but a USED booking cannot be cancelled under the same rule.

      Design:
      - Keep status private and expose commands submit(), approve(), reject(), cancel().
      - Validate all conditions before committing; failures must leave state unchanged.
      - Record the actor, timestamp, and reason/audit data when required by the domain.
      - Test the matrix of all allowed/forbidden transitions and verify failed commands preserve state.
      - For concurrent requests, use optimistic versions/transactions/locks to prevent double approval or cancel/approve races.

      External operations such as payouts and emails do not automatically roll back when a status update fails; consider events/outboxes or sagas for distributed workflows.

      Not every status requires its own State-pattern class; an enum with guards can be sufficient. The goal is a single definition of transition rules, not using a pattern for decoration.
  - question: How do domain events decouple reactions to state changes, and what consistency risks can they introduce?
    readmeRelated:
      anchorList:
      - class-design-004
      - modeling-008
      - design-patterns-010
      - relationships-007
    knowledge: Domain events decouple subscribers but require attention to transaction timing, duplicate events, retries, and idempotency.
    answer: |-
      A **domain event** records a business fact that has occurred, such as OrderPaid(orderId,paymentId). After the root completes its transition, the event can trigger emails, read-model updates, loyalty actions, or other integrations without making the aggregate call each adapter directly.

      Consistency risks:
      - Publishing **before DB commit**: the DB rolls back after a subscriber has already acted.
      - Publishing after DB commit: the process may crash before publishing, losing the event.
      - Brokers/handlers often provide at-least-once processing, making duplicates, retries, and out-of-order delivery possible.
      - Asynchronously updated read models or side effects lag behind and are not automatically strongly consistent.

      A **transactional outbox** stores domain changes and an outbox record in the same local DB transaction; a publisher emits events from the outbox after commit. Idempotent consumers use eventId/business IDs and check versions/order when needed, with retries, dead-letter handling, and monitoring. An outbox does not automatically provide end-to-end exactly-once delivery.

      Payloads should include IDs, versions, and required data rather than large mutable entity graphs or secrets. Contract-test duplicates/retries, rollback, and failure handling. Domain events decouple reactions, but mandatory invariants within one consistency boundary still require synchronous enforcement.
  - question: How do you choose transaction boundaries and eventual consistency when an operation updates multiple aggregates?
    readmeRelated:
      anchorList:
      - modeling-003
      - class-design-004
      - design-patterns-007
      - design-pitfalls-008
    knowledge: Define consistency boundaries; avoid unnecessary distributed transactions and consider outboxes/sagas and eventual consistency.
    answer: |-
      When a use case updates **multiple aggregates**, determine which invariants must hold immediately and which may be **eventually consistent**. Aggregates are natural consistency boundaries, but there is no absolute ban on transactions spanning multiple aggregates in one database when the business requires it.

      An order flow involving Order, Inventory, and Payment:
      1. Order is created PENDING; Inventory reserves stock using an idempotent reservation ID.
      2. Payment is processed through a gateway; after confirmation, Order moves to the appropriate state.
      3. On payment failure, release the reservation as compensation; on timeout, check status before retrying to avoid duplicate charges.
      4. An application service/saga orchestrates the process while each aggregate preserves its invariants.

      A local transaction within one DB can make updates across several rows atomic if contention is acceptable. Across services/databases, distributed transactions/2PC are costly and limited; sagas, outboxes, and idempotent messages with eventual consistency are often considered.

      **Risks:** duplicate/out-of-order events, failed compensation, cancel/confirm races, long-lived PENDING states, and reconciliation needs. Use versions, retries/backoff, dead-letter queues, monitoring, and manual recovery when failures cannot self-heal.

      To prevent overselling or exceeding credit limits, use reservations/locking or transaction boundaries strong enough to enforce those constraints; eventual consistency cannot justify dropping critical invariants.
  - question: Why might Money, Address, DateRange, or Email work better as value objects than primitive fields?
    readmeRelated:
      anchorList:
      - encapsulation-005
      - class-design-006
      - practice-005
    knowledge: Value objects encapsulate validation, units, equality, and Money/Address/DateRange/Email behavior instead of
      primitive obsession.
    answer: |-
      **Money, Address, DateRange, and Email** are useful value objects because they encode domain semantics, validation, and behavior that primitive fields alone cannot guarantee. A long has no inherent currency unit; an arbitrary String is not necessarily a valid email; two LocalDate values do not automatically form a valid date range.

      - **Money:** amount+currency and precision/rounding policies. Adding Money values requires currency checks; do not combine 100 USD with 100 VND.
      - **Address:** meaningful components, formatting, and validation; a shipping address may be a snapshot that does not change with the customer's profile.
      - **DateRange:** start/end, an invariant of end>start or >=start as required by policy; contains()/overlaps() centralize related logic.
      - **Email:** suitable normalization and syntax validation; a valid format does not prove that a mailbox exists.

      Value objects are generally immutable with component-based equality. Constructors/factories enforce invariants, and operations return new objects rather than mutating shared values. Java records are convenient but only shallowly immutable; nested collections or mutable objects require copying.

      **Trade-offs:** more types and JSON/DB mappings, and explicit choices of time zones, currency scales, and localization. Do not wrap every String that lacks special rules. But when services duplicate validation and unit conventions, value objects turn conventions into type-level contracts that are easy to unit-test and hard to misuse.
- groupID: 11
  groupName: Java Object Contracts and Equality
  questions:
  - question: What contracts must equals and hashCode satisfy for safe use in HashMap or HashSet?
    readmeRelated:
      anchorList:
      - object-004
      - language-mechanics-006
      - design-pitfalls-009
      - practice-005
    knowledge: '`equals` must be reflexive, symmetric, transitive, and consistent; equal objects ⇒ equal hashCode; mutable keys can break hash-based lookups.'
    answer: |-
      **The equals and hashCode contracts.** equals(Object) must be reflexive (x.equals(x)), symmetric (x.equals(y) agrees with y.equals(x)), transitive, and consistent while the state used for comparison remains unchanged; x.equals(null) must be false. hashCode must remain consistent while equality-relevant state is unchanged, and objects equal under equals must share the same hashCode. The reverse is not required: collisions are valid.

      ~~~java
      import java.util.Objects;
      final class ProductKey {
          private final String store, sku;
          ProductKey(String store, String sku) {
              this.store = Objects.requireNonNull(store);
              this.sku = Objects.requireNonNull(sku);
          }
          @Override public boolean equals(Object o) {
              if (this == o) return true;
              return o instanceof ProductKey p &&
                     store.equals(p.store) && sku.equals(p.sku);
          }
          @Override public int hashCode() {
              return Objects.hash(store, sku);
          }
      }
      ~~~

      Different ProductKey instances with the same store/sku must be equal and have identical hashCode values, so HashMap can look up entries with equivalent keys. Overriding equals without hashCode can put equal keys in different buckets. A constant hashCode does not violate the contract but increases collisions and hurts performance.

      **Safe usage:** avoid mutating equality-relevant fields while an object is in HashMap/HashSet; hash collections do not relocate entries automatically. Test identical references, distinct objects with matching/different values, null, transitivity, symmetry, and get/contains with equivalent keys. Avoid inheritance-based equality that breaks symmetry between superclasses/subclasses. Entities whose IDs appear after persistence need lifecycle-aware identity policies rather than mechanical value equality.
  - question: Why can changing a field used by hashCode break lookups when an object is a HashMap key?
    readmeRelated:
      anchorList:
      - object-005
      - language-mechanics-006
      - design-pitfalls-009
      - practice-005
    knowledge: Changing a hash-contributing field may change the bucket computed for a key; use immutable keys or avoid mutation while keyed.
    answer: |-
      **HashMap searches using hashes derived from keys.** On put, it selects a bucket/entry using the hash and equality; on get/containsKey, it recomputes the supplied key's hash. If a hashCode field changes while the entry remains in the map, the new hash may point to another bucket, causing lookup failure even with the original reference. The map does not track field mutations.

      ~~~java
      import java.util.*;
      final class MutableKey {
          String code;
          MutableKey(String value) { code = value; }
          @Override public boolean equals(Object o) {
              return o instanceof MutableKey k &&
                     Objects.equals(code, k.code);
          }
          @Override public int hashCode() {
              return Objects.hashCode(code);
          }
      }
      Map<MutableKey, String> data = new HashMap<>();
      MutableKey key = new MutableKey("A");
      data.put(key, "value");
      key.code = "B";
      // data.get(key) có thể không tìm thấy entry đã put.
      ~~~

      Not every mutation necessarily causes a failure: hashes may collide or map to the same bucket, and implementation details matter. remove(key) may also fail after mutation. ConcurrentHashMap synchronizes map operations but **does not** make mutable keys safe.

      **Prevention:** use String, UUID, or immutable value objects as keys. To change a key, remove the old key and put the new one through a consistent process, handling concurrency/transactions if shared. For entities assigned IDs after insertion into a Set, avoid hashes that change with mutable IDs and move entries between buckets. Test mutation and lookup behavior to detect these issues.
  - question: How does a Comparator inconsistent with equals affect TreeSet and TreeMap?
    readmeRelated:
      anchorList:
      - language-mechanics-006
      - practice-005
    knowledge: TreeSet/TreeMap treat comparator `compare==0` as equal keys; define total ordering consistent with intended equality/identity.
    answer: |-
      **TreeMap and TreeSet determine duplicate keys using comparators or natural ordering.** If compare(a,b) == 0, an ordered collection treats keys as equivalent for addition/lookup even if equals returns false. HashMap/HashSet instead use hashCode/equals.

      ~~~java
      import java.util.*;
      record Employee(String id, String name) {}
      Comparator<Employee> byName =
          Comparator.comparing(Employee::name);
      Set<Employee> set = new TreeSet<>(byName);
      set.add(new Employee("E1", "An"));
      set.add(new Employee("E2", "An"));
      // set chỉ giữ một phần tử do comparator theo tên.
      ~~~

      Employees with different IDs are unequal under record-generated equals, but this comparator returns 0. If the business key is id, compare IDs or sort by name with ID as a tie-breaker. The reverse is also problematic: a comparator may distinguish equals-equal objects, letting both appear in TreeSet under its ordering contract.

      **Java example:** BigDecimal("1.0").compareTo(BigDecimal("1.00")) is 0, but equals is generally false because of scale; TreeSet and HashSet may have different sizes for that pair. Comparators must define stable, transitive ordering, ideally consistent with equals when clients expect Set/Map identity under equals. If ordering equivalence intentionally differs, document contains/add/remove semantics rather than treating the behavior as inexplicable.
  - question: How should equals be designed differently for identity-based entities and value objects?
    readmeRelated:
      anchorList:
      - object-004
      - class-design-006
      - language-mechanics-006
      - practice-005
    knowledge: Entities use identity-based equality stable across their lifecycle; value objects compare components, with
      matching hashCode semantics.
    answer: |-
      **Entities and value objects follow different equality principles.** Value objects are identified by meaningful values; Money instances with matching amounts and currencies may be equal despite being distinct instances. Immutable fields give stable hashes suitable for Map/cache keys. Entities are identified by durable business identity; changing email/address does not change a Customer's identity.

      ~~~java
      import java.util.Objects;
      final class Customer {
          private final String businessId;
          private String email;
          Customer(String id, String email) {
              businessId = Objects.requireNonNull(id);
              this.email = Objects.requireNonNull(email);
          }
          @Override public boolean equals(Object o) {
              return o instanceof Customer c &&
                     businessId.equals(c.businessId);
          }
          @Override public int hashCode() {
              return businessId.hashCode();
          }
          void changeEmail(String value) {
              email = Objects.requireNonNull(value);
          }
      }
      ~~~

      This example uses a businessId available and stable at creation, not an auto-generated ID assigned after persistence. If equals only compares nullable IDs, two transient entities with null IDs may be incorrectly considered equal. If hashCode depends on an ID changing from null to a generated value, HashSet lookups can break.

      **ORM nuances:** proxies, detached entities, inheritance, and lazy loading affect getClass/instanceof decisions, so follow framework semantics and domain contracts. Object identity may be used before persistence, but lifecycle handling must be consistent. Test unchanged identity across field edits, different entity IDs, transient/persisted/detached entities, and proxies if using an ORM. For value objects, test each component and avoid nested mutable values.
  - question: What risks arise when toString traverses bidirectional object relationships or exposes sensitive information?
    readmeRelated:
      anchorList:
      - relationships-006
      - language-mechanics-007
    knowledge: Avoid toString recursion through parent–child links, sensitive data, lazy loading, and oversized logs; expose only safe fields.
    answer: |-
      **toString should not traverse the entire object graph.** If Parent.toString prints its Child list and Child.toString prints Parent again, bidirectional links can recurse until StackOverflowError. Lombok or libraries auto-generating toString across all fields can cause the same issue, especially with bidirectional JPA entities.

      ~~~java
      final class Parent {
          private final String id;
          private final java.util.List<Child> children = new java.util.ArrayList<>();
          Parent(String id) { this.id = id; }
          @Override public String toString() {
              return "Parent{id=" + id + ", children=" + children.size() + "}";
          }
      }
      final class Child {
          private final String id;
          private Parent parent;
          Child(String id, Parent parent) {
              this.id = id;
              this.parent = parent;
          }
          @Override public String toString() {
              return "Child{id=" + id + "}";
          }
      }
      ~~~

      Print only simple fields, identifiers, and counts; avoid following parent–child links recursively. Keep toString from invoking lazy-loaded associations because this can cause N+1 queries or failures after ORM sessions close; avoid large objects that add log noise and CPU/memory costs.

      **Security:** never include passwords, access tokens, cookies, sensitive PII, payment data, or secrets in toString/logs. Logging frameworks may implicitly invoke toString when formatting objects. Use structured logs with allowlisted fields and redaction. toString is for brief debugging, not a stable serialization or audit-event contract; it should not have side effects.
  - question: How do clone, copy constructors, and copy factories differ in controlling aliasing?
    readmeRelated:
      anchorList:
      - class-006
      - object-006
      - encapsulation-007
    knowledge: Clone involves shallow-copy/Cloneable pitfalls; copy constructors/factories allow explicit ownership and
      per-component deep-copy choices.
    answer: |-
      **Clone, copy constructors, and copy factories all require explicit copying-depth decisions.** Object.clone with Cloneable usually creates a shallow field-by-field copy; the new instance has a different identity but may share List references or mutable elements. Cloneable is a marker without a public clone API; protected access, checked CloneNotSupportedException, inheritance, and final-field behavior create pitfalls.

      Copy constructors such as Snapshot(Snapshot other) and copy factories such as Snapshot.copyOf(other) make contracts explicit: validation, possible instance reuse, immutable components that may be shared, and components requiring copies. Neither approach **automatically performs a deep copy**.

      ~~~java
      import java.util.*;
      final class InvoiceSnapshot {
          private final List<String> items;
          InvoiceSnapshot(Collection<String> source) {
              items = List.copyOf(source);
          }
          InvoiceSnapshot(InvoiceSnapshot other) {
              items = List.copyOf(other.items);
          }
          List<String> items() { return items; }
      }
      ~~~

      For List<String>, List.copyOf snapshots structure and String is immutable, so source additions/removals cannot change InvoiceSnapshot. If elements are MutableLine, however, both lists may still reference the same elements; copy each element or use value objects.

      **Aliasing and cycles:** deeply copying object graphs is not simple recursion; it must preserve intended sharing and avoid infinite loops in cyclic graphs, often using an identity map. Prefer constructors/factories with explicit ownership contracts; use clone when APIs/libraries require it and thoroughly test shallow/deep semantics. Test source and copy mutations at both collection and nested-element levels.
  - question: How do Java records support value-based objects, and what limitations arise with nested mutable fields?
    readmeRelated:
      anchorList:
      - class-006
      - object-005
      - encapsulation-007
      - design-pitfalls-009
      - practice-005
    knowledge: Records generate equals/hashCode/accessors, but final component references provide only shallow immutability;
      nested collections may remain mutable.
    answer: |-
      **Java records support component-level value semantics but only fix references, not deep immutability.** Records generate private final component fields, canonical constructors, accessors, and equals/hashCode/toString. If a component is an ArrayList, callers with an alias may still add/remove entries, while generated accessors can return that same mutable reference.

      ~~~java
      import java.util.*;
      record Basket(List<String> items) {
          Basket {
              items = List.copyOf(items);
          }
      }
      ~~~

      The compact constructor creates a structurally immutable snapshot; with immutable Strings, the list has reasonably safe value semantics. With List<MutableProduct>, products may still change through other aliases: copy elements or use immutable DTOs. List.copyOf rejects null elements.

      **Common misconception:** a record containing an array does not automatically compare elements like Arrays.equals; arrays use reference equality. Two records containing distinct int[] arrays with identical values may be unequal, and accessors still expose mutable arrays. Similarly, mutable Date, AtomicInteger, and StringBuilder components may change record equality/hash behavior or lack expected value equality.

      **Usage:** records suit data carriers/value objects with validated components, defensive copies, and clear equality; they are not automatically suitable for identity-based lifecycle entities. Records are implicitly final, cannot extend arbitrary classes, but can implement interfaces and define methods. As keys, all equality-participating components must have stable semantics.
  - question: Why can caching mutable objects in shared caches violate invariants or leak data between requests?
    readmeRelated:
      anchorList:
      - object-007
      - encapsulation-007
      - design-pitfalls-008
    knowledge: Shared caches of mutable objects create cross-request aliases/data races; consider immutable snapshots, copy-on-write,
      or clear ownership.
    answer: |-
      **Shared caches often return the same object reference to multiple requests.** If a cache holds a mutable UserProfile with a role list, request A can modify the list and request B may observe those unauthorized changes; a cache key missing tenant/user dimensions can even return data from another tenant. This is an ownership, authorization, and thread-safety problem, not merely a caching performance issue.

      ~~~java
      import java.util.*;
      record UserKey(String tenantId, String userId) {}
      record UserProfile(String displayName, List<String> roles) {
          UserProfile {
              roles = List.copyOf(roles);
          }
      }
      ~~~

      With immutable String roles, the record does not permit structural list mutation; the example's key includes tenantId and userId to partition by identity. However, cache keys must cover any required permission, locale, or version dimensions in the business contract; an immutable snapshot cannot repair incorrect authorization-based keying.

      **Races and stale data:** multiple threads mutating an ArrayList can cause lost updates, visibility bugs, or inconsistent invariants. ConcurrentHashMap synchronizes map operations but does not make mutable values thread-safe. Use immutable snapshots, copy-on-write, atomic replacement, or locks/transactions based on ownership. Configure TTL/invalidation appropriately; do not cache attached JPA entities/lazy state while assuming connections/sessions stay open. Test tenant isolation, mutation attempts, update visibility, and eviction/invalidation; do not invent race outcomes without running tests.
  - question: When should a collection-returning API use null, an empty collection, a read-only view, or a snapshot?
    readmeRelated:
      anchorList:
      - object-008
      - encapsulation-006
      - encapsulation-007
      - refactoring-005
    knowledge: Return empty collections for no elements rather than null; distinguish live read-only views from immutable
      snapshots and copies.
    answer: |-
      **Returning an empty collection is the appropriate default when there are no elements**, because clients can iterate/check size without null handling. If null means not loaded, unknown, or failed operation, define that separately through Optional/result types or documentation; do not use null and empty interchangeably.

      **Distinguishing options:**
      - Mutable copy: new ArrayList<>(items) separates the container so callers may modify their copy; mutable elements remain shared in this shallow copy.
      - Read-only live view: Collections.unmodifiableList(items) prevents add/remove through the view but reflects mutations to its underlying source. It does not guarantee thread safety.
      - Immutable snapshot: List.copyOf(items) gives an unmodifiable structure that does not observe subsequent source-structure changes; it requires non-null elements, may reuse an already immutable instance, and does not deep-copy elements.

      ~~~java
      import java.util.*;
      final class Order {
          private final List<String> items = new ArrayList<>();
          List<String> snapshot() { return List.copyOf(items); }
          List<String> writableCopy() { return new ArrayList<>(items); }
          List<String> liveView() {
              return Collections.unmodifiableList(items);
          }
      }
      ~~~

      **Trade-offs:** copying/snapshotting a container can cost O(n) structure copying and allocations, while live views are lighter but expose clients to unexpected changes. Returning List.of() for empty collections is usually clear. Never expose internal mutable lists directly when the domain requires guarded add/remove. Concurrent APIs must define snapshot timing and read consistency because copying a concurrently mutated list is not automatically safe.
  - question: How do generics and bounded wildcards express relationships between objects in Java contracts?
    readmeRelated:
      anchorList:
      - language-mechanics-001
      - language-mechanics-002
      - language-mechanics-003
    knowledge: PECS uses `? extends T` for producers and `? super T` for consumers; consider generic invariance and API substitutability.
    answer: |-
      **Java generic type arguments are invariant:** List<Dog> is not a subtype of List<Animal> even though Dog extends Animal. If it were assignable, callers could add(new Cat()) to a Dog list and break type safety. Wildcards express producer/consumer roles according to **PECS: Producer Extends, Consumer Super**.

      ~~~java
      import java.util.*;
      class Animal {}
      class Dog extends Animal {}
      class Cat extends Animal {}

      static void readAnimals(List<? extends Animal> source) {
          Animal a = source.get(0); // Hợp lệ: đọc tối thiểu như Animal.
          // source.add(new Dog()) là lỗi compile.
      }
      static void addDog(List<? super Dog> target) {
          target.add(new Dog());    // Hợp lệ cho List<Dog/Animal/Object>.
          Object first = target.get(0);
      }
      static <T> void copy(List<? super T> dst, List<? extends T> src) {
          for (T value : src) dst.add(value);
      }
      ~~~

      With extends, the actual source could be List<Cat>, so adding Dog or Animal is unsafe (except null). With super, the destination may be List<Object>, allowing Dog insertion while reads are guaranteed only as Object. The generic copy method expresses the same T flowing from producer to consumer.

      **Limitations:** generics generally undergo runtime type erasure; instanceof List<String> cannot be used as though type arguments always survive. Wildcards do not replace validation, nullability, ownership, or business rules. When an API must read and write one known type, a type parameter T may communicate the contract better than a wildcard. Use wildcards where boundaries genuinely need flexibility; excessive wildcard use makes contracts harder to read.
- groupID: 12
  groupName: Testing, Refactoring, and Performance
  questions:
  - question: How should unit tests verify public behavior and invariants of domain objects rather than internal helper-call ordering?
    readmeRelated:
      anchorList:
      - encapsulation-002
      - testing-001
      - testing-008
      - refactoring-009
    knowledge: Test observable behavior, outcomes, invariants, and rejection paths; avoid verifying calls to internal private
      helpers.
    answer: |-
      Unit tests for domain objects should specify the **public contract**: the result and state of valid commands, how invalid commands are rejected, and which invariants always hold. For `Account.withdraw(amount)`, test the balance after a valid withdrawal, reject overdrawn withdrawals with the documented exception and unchanged balance, and check negative/zero amounts against business rules. For `Order.ship()`, verify that only paid orders transition and relevant properties remain consistent.

      Use **Arrange–Act–Assert** through constructors/factories and public methods. For transitions, test valid command sequences, repeated actions, intermediate failures, and post-failure state rather than isolated getters alone. Property-based tests can additionally check invariants across varied inputs.

      Do not assert the order of `private validate()`, `private recomputeTotal()`, or helper-call counts; these are implementation details that may change without changing results. If testing an entity requires deep mocks, business logic may have been separated from its state owner. Test collaborator ordering only when it is genuinely an **observable contract**, such as auditing before an irreversible side effect.
  - question: Which null, exception, and state-transition cases should interface contract tests cover?
    readmeRelated:
      anchorList:
      - abstraction-004
      - interface-008
      - testing-004
      - testing-005
    knowledge: Apply the same boundary-input, null, exception, state-transition, and side-effect tests to every implementation.
    answer: |-
      A **contract test** is a shared suite for an interface, run in full against **every implementation** to verify substitutability under the Liskov Substitution Principle (LSP). First specify preconditions, postconditions, nullability, exceptions, state changes, and side effects; identical Java signatures do not guarantee identical semantics.

      For `Inventory.reserve(sku, qty)`, test valid input, `qty = 0`, negative amounts, unknown SKUs, insufficient stock, and null when permitted/forbidden by contract; success must reduce stock exactly once, while failure must not leave partial reservations. For stateful APIs, test `CREATED → RESERVED → RELEASED`, forbidden transitions, and repeated-operation/idempotency behavior. For `Repository.findById`, specify whether missing items produce `Optional.empty()` or exceptions; do not let adapter A return null while B returns empty.

      Run the suite through a test factory supplying each implementation or an abstract test class. Combine contract tests with integration tests for persistence, networks, transactions, and timeouts because in-memory fakes cannot catch all real adapter failures. Do not assert ordering, timing, or callback counts unless specified by contract; for side effects, verify post-failure behavior and retry/duplicate policies. A shared suite must not legitimize implementations with conflicting semantics.
  - question: How do you write characterization tests before refactoring a large class without existing tests?
    readmeRelated:
      anchorList:
      - testing-009
      - refactoring-009
      - practice-006
    knowledge: Characterization tests capture existing behavior and edge cases before changes; refactor incrementally with
      regression checks.
    answer: |-
      A **characterization test** records the **existing** behavior of a large class before refactoring, including undocumented edge cases. Select real use cases through the public API, construct representative inputs, and observe outputs, post-call state, exceptions, and boundary side effects. Sanitized production data or logs can identify common paths; for tightly coupled systems, test safely using fake/recorded external dependencies.

      For `PricingService.calculate(order)` with many promotion conditions, create golden cases for no promotions, overlapping promotions, empty orders, boundary values, rounding, null, and exceptions. Assert actual results from the current version; clearly flag suspected bugs to distinguish **behavior preservation** from intentional requirement changes. Do not assume every existing behavior is correct business behavior.

      With a baseline in place, refactor in small steps such as extract method/class and move method. Rerun tests after each step, compare output diffs, and expand coverage for untested branches. Avoid giant snapshots or mocks of internal helper ordering, which couple tests to the structure being changed. For confirmed bugs, add a test of desired behavior and fix it as a separate, explicit change.
  - question: When are Extract Class, Move Method, and Replace Inheritance with Delegation appropriate refactorings?
    readmeRelated:
      anchorList:
      - inheritance-010
      - composition-008
      - design-pitfalls-001
      - design-pitfalls-004
      - refactoring-003
      - refactoring-004
      - refactoring-007
    knowledge: Extract Class for multiple responsibilities, Move Method toward state owners, and Replace Inheritance with Delegation
      for invalid is-a relationships.
    answer: |-
      These refactorings address three kinds of **misplaced responsibility**:

      - **Extract Class:** a class contains cohesive groups of fields/methods that change for unrelated reasons. For example, `Invoice` calculates amounts, renders PDFs, and emails them; extract `PdfInvoiceRenderer` and `InvoiceMailer` while domain code retains invoice calculations/invariants. Clarify state ownership and avoid creating pointless delegate chains.
      - **Move Method:** a method repeatedly reads another object's data and applies rules belonging to that object, such as a service inspecting `Order` fields for `canShip`; place behavior in `Order` or the invariant owner. Check dependency direction to prevent cycles and preserve public contracts.
      - **Replace Inheritance with Delegation:** a subclass uses `extends` solely for reuse despite violating is-a/LSP, or a deep hierarchy depends on hooks. Move shared logic into a collaborator, inject or instantiate it in a wrapper, and delegate the required methods. Callers no longer depend on superclass implementation details.

      Beforehand, use characterization/contract tests to capture existing outcomes, exceptions, state transitions, and side effects. Migrate one use case at a time, update callers, run tests, and only then delete unused code. Check framework mappings/serialization and public subtype APIs used by external systems to maintain appropriate backward compatibility.
  - question: How do you identify and improve an anemic domain model without changing business results?
    readmeRelated:
      anchorList:
      - class-design-007
      - design-pitfalls-003
      - testing-009
      - refactoring-004
      - refactoring-009
    knowledge: Move logic from services/controllers into invariant-owning domain objects, using regression/characterization tests
      to preserve behavior.
    answer: |-
      An **anemic domain model** appears when entities mainly expose getters/setters while services/controllers read fields, compute rules, and modify state. Signs include repeated `if (order.getStatus()==PAID) order.setStatus(SHIPPED)`, arbitrary setter sequences, and possible invalid states. Do not judge by method count: DTOs used to transport data may intentionally be anemic and entirely appropriate.

      To improve it, identify **invariants and state owners** from use cases: orders must be paid before shipping, totals must match line items, and balances must not go negative. Move checks and mutations into `Order.ship()`, `Order.addItem(...)`, and `Account.withdraw(...)`. Keep state `private`, restrict all-fields setters, and leave transaction/repository/infrastructure coordination to application services. Cross-aggregate or external-source rules may belong in a separate domain service rather than being forced into entities.

      Before refactoring, write characterization tests through existing APIs for data, errors, and business outcomes; then migrate behavior incrementally, retaining boundary interfaces or transitional adapters as needed. Retest controllers, batches, and message consumers so every entry point preserves invariants. A successful refactor retains expected behavior and removes unchecked state-mutation paths.
  - question: Why can mutable objects shared across threads cause lost updates or visibility problems?
    readmeRelated:
      anchorList:
      - class-003
      - object-007
      - design-pitfalls-008
    knowledge: Shared mutable state involves non-atomic read-modify-write and missing happens-before relationships; understand
      races, visibility, and lost updates.
    answer: |-
      When two threads reference the same **mutable** object, seemingly simple operations may comprise several non-atomic steps. With `count++`, both threads may read 10, compute 11, and write 11 even though two increments should produce 12: a **lost update** caused by a read–modify–write race.

      A **visibility problem** occurs when one thread writes state without a *happens-before* relationship ensuring another observes it: a loop `while (!stopped) {}` using an ordinary `stopped` field may fail to terminate as expected. Threads do not necessarily read directly from RAM; the Java Memory Model permits compiler/JIT/CPU optimizations and reordering within its rules. `volatile` or atomic variables can provide visibility and required ordering, but `volatile int count` still does not make `count++` atomic.

      To address this, avoid sharing mutable state when possible or protect the **entire invariant and critical section** using synchronized/Lock; use `AtomicInteger.incrementAndGet()` for suitable single-variable updates. For related fields (balance, reserved), individual atomic variables do not preserve cross-field invariants automatically. Synchronize concurrency-test start points to make races easier to reproduce, but passing a few runs does not prove race freedom; consider stress tests, code review, and analysis tools.
  - question: How do immutability, synchronization, and atomic classes differ when designing thread-safe objects?
    readmeRelated:
      anchorList:
      - class-006
      - object-005
      - object-007
      - encapsulation-007
      - design-pitfalls-008
    knowledge: Immutability reduces shared writes; synchronization protects critical sections/visibility; atomic types support
      simple atomic operations.
    answer: |-
      **Immutability** means object state does not change after construction. Once constructed and safely shared, many threads can read immutable state without locking that state; this suits value objects, configurations, and snapshots. **Defensive copies** are required for mutable collections/elements because `final List` fixes a reference, not its contents; safe publication still matters.

      **Synchronization** (`synchronized`, `ReentrantLock`, etc.) protects groups of related operations. Locks provide mutual exclusion and establish happens-before relationships between corresponding unlock/lock operations. They suit in-memory multivariable transitions preserving invariants such as debits with transaction history. Costs include contention, deadlocks from poor lock management, and lock-order complexity.

      **Atomic classes** such as `AtomicInteger` and `AtomicReference` provide atomic/compare-and-set operations for **one variable** or an immutable snapshot replaced through a reference. For example, `incrementAndGet` avoids lost updates, while `compareAndSet` supports optimistic updates. For multi-field state, construct an immutable aggregate state and CAS its reference, or use a lock; updating separate atomic variables does not automatically preserve cross-field invariants. Choose based on state structure, contention, and observation consistency after first minimizing data sharing.
  - question: How do you test interactions among multiple objects without excessive reliance on mocks?
    readmeRelated:
      anchorList:
      - testing-006
      - testing-010
      - practice-010
      - testing-008
    knowledge: Test public collaboration among real objects with fakes at external boundaries; avoid deep mocks and verifying
      nonessential method ordering.
    answer: |-
      Test collaboration among domain objects from **a use case and its public behavior**. For example, `CheckoutService.placeOrder()` coordinates `Cart`, `Order`, `PricingPolicy`, and `InventoryPort`: construct real domain objects or simple boundary fakes, execute the use case, then assert order results, amounts, reserved stock, and state after failure. Real objects reveal invariant violations that sequences of mock verifications may miss.

      Use **fakes** such as in-memory repositories and fake payment adapters honoring external contracts; use **stubs** for predetermined data and mocks only for observable interactions (one payment request, no email on failed transactions). Avoid deep mocks such as `when(order.getCustomer().getWallet()...)` and `verify(helper).validate()` because they couple tests to internals and cause false failures after valid refactoring.

      When order is a business requirement (e.g., never charge before a successful reservation), assert **boundary side-effect ordering** or persisted state rather than internal helper order. Also test cross-object failures, retries, and idempotency; add integration tests for real DB/broker connections to verify transaction semantics and contracts that fakes cannot fully represent.
  - question: Why should object-oriented design not be called slow based solely on the number of objects created?
    readmeRelated:
      anchorList:
      - oop-basic-008
      - lifecycle-007
    knowledge: Performance depends on JIT/escape analysis, allocation, GC, and memory access; object count alone does not establish latency.
    answer: |-
      **OOP cannot be declared slow** merely from the number of objects created. Actual costs depend on size, lifetime, cache locality, synchronization, allocation rates, garbage collection, and workload. JVM optimizations include JIT inlining, devirtualization at stable call sites, escape analysis, and sometimes scalar replacement: temporary nonescaping objects may be optimized to reduce or eliminate allocations. The JVM does not necessarily apply all these optimizations to every program.

      Allocating short-lived objects in the young heap is often relatively cheap, but many long-lived objects, scattered reference graphs, boxing, multiple pointer indirections, or GC pressure can affect latency, memory bandwidth, and throughput. A design with few objects may still be slow due to I/O, lock contention, inefficient algorithms, or poor data locality.

      Ask **what the real bottleneck is**. Use profilers and allocation/GC metrics to identify hot paths, measure end-to-end latency, throughput, tail latency, and memory under realistic loads. If OOP refactoring improves clarity/maintainability without harming relevant metrics, object count alone is no reason to reject it. Optimization must also preserve correctness and business invariants.
  - question: How do you measure and compare performance before and after OOP refactoring without drawing misleading microbenchmark conclusions?
    readmeRelated:
      anchorList:
      - oop-basic-008
      - lifecycle-007
    knowledge: Benchmark representative workloads with warmup/forks, measure latency/throughput/allocations/GC, profile hot paths,
      and verify correctness.
    answer: |-
      To compare performance before/after OOP refactoring, first establish **measurement goals and a baseline**: p50/p95/p99 latency for important use cases, throughput, allocation rate, GC pauses, CPU, and memory footprint; avoid optimizing solely for one tiny method's execution time. Choose representative workloads (input sizes, distributions, read/write ratios, concurrency, JIT warmup), keeping environments, JVM flags, heaps, and system dependencies comparable.

      For JVM microbenchmarks, prefer **JMH** for warmup, measurement iterations, and forks; prevent dead-code elimination using `Blackhole` or result consumption and avoid constant folding/invalid benchmark setup. Do not extrapolate from one `System.nanoTime()` measurement: JIT may not be warmed up, GC/background noise may dominate, and unused code may be optimized away. Benchmark DB/network access at the appropriate level with realistic environments/data rather than treating JMH as a replacement for load testing.

      Add **CPU/allocation/GC profiling** to explain changes; do not conclude from a few faster runs. Evaluate variation, multiple independent runs, tail latency, and regressions in other cases. Finally, rerun functional/contract tests to ensure behavior and invariants match before and after: a performance optimization that breaks business rules is unacceptable.
