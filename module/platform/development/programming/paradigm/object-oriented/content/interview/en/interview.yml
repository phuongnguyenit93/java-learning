interviewQuestion:
- groupID: 1
  groupName: Nền tảng và tư duy thiết kế OOP
  questions:
  - question: OOP giải quyết những vấn đề thiết kế nào khi hệ thống có nhiều quy tắc nghiệp vụ và liên tục thay đổi?
    readmeRelated:
      anchorList:
      - oop-basic-001
      - oop-basic-006
      - class-design-001
      - class-design-003
      - modeling-003
      - solid-002
      - refactoring-001
      - practice-011
    knowledge: Thiết kế quanh trách nhiệm, state và hành vi; giảm coupling giữa quy tắc nghiệp vụ, giới hạn tác động khi yêu
      cầu thay đổi.
    answer: |-
      **Vai trò của OOP:** tổ chức các thành phần quanh object có state, behavior và trách nhiệm rõ; object tương tác qua hợp đồng thay vì cùng chỉnh dữ liệu. Khi nghiệp vụ đổi, thiết kế tốt cô lập thay đổi tại owner của quy tắc.

      Ví dụ Order quản lý trạng thái và pay()/ship(); PricingPolicy tính phí; CheckoutService điều phối repository và payment gateway. Thay chính sách phí thì sửa PricingPolicy, không sửa công thức rải ở controller, invoice và email.

      Các cơ chế:
      - **Encapsulation** bảo vệ invariant: không được ship trước khi pay.
      - **Abstraction** cho caller phụ thuộc contract thay vì SDK cụ thể.
      - **Polymorphism** cho nhiều policy hợp lệ thay thế qua interface chung.
      - **Cohesion/coupling** đặt quy tắc liên quan cùng owner, giảm phụ thuộc vào chi tiết của thành phần khác.

      Không phải OOP tự động giải quyết độ phức tạp: God Class, hierarchy quá sâu, shared mutable state và quá nhiều interface vô nghĩa vẫn khiến sửa code khó khăn. Đánh giá bằng change impact, tính đúng và khả năng unit test thực tế, không đo bằng số lượng class.
  - question: Phân biệt class, object, state, behavior và identity bằng những tiêu chí nào?
    readmeRelated:
      anchorList:
      - oop-basic-002
      - oop-basic-003
      - class-001
      - object-001
      - modeling-006
    knowledge: Class mô tả cấu trúc/hành vi; object là instance có state, identity; phân biệt hành vi với dữ liệu của từng
      instance.
    answer: |-
      **Class** là định nghĩa kiểu gồm field, constructor và method. **Object** là một instance tạo tại runtime. Nhiều object được tạo từ một class có cấu trúc giống nhau nhưng state/identity riêng.

      - **State:** các giá trị hiện thời của object, như balance=100.
      - **Behavior:** thao tác public như deposit(amount), kiểm tra amount hợp lệ rồi cập nhật balance.
      - **Identity:** một object chính là instance đó; hai reference cùng trỏ một instance khi toán tử == trả true.

      Ví dụ:
          Account a = new Account(100);
          Account b = new Account(100);
          // a == b là false: hai instance
          a.deposit(20);
          // a.balance() = 120, b.balance() = 100

      Ví dụ giả định balance là instance field, không static. Instance field được mỗi object sở hữu; static field thuộc class và bị các instance chia sẻ. Không đồng nhất state với identity: hai object đều balance=100 vẫn khác instance. Cũng không đồng nhất identity với equality do equals định nghĩa. Một domain object tốt không chỉ chứa field mà còn sở hữu behavior bảo vệ invariant.
  - question: Vì sao hai object chứa cùng dữ liệu vẫn có thể có identity khác nhau?
    readmeRelated:
      anchorList:
      - oop-basic-003
      - object-001
      - object-004
      - class-design-006
      - language-mechanics-006
      - practice-005
    knowledge: Phân biệt reference identity (`==`) với equality (`equals`); entity có định danh ổn định dù các thuộc tính
      trùng nhau.
    answer: |-
      **Reference identity** khác **value equality**. Với reference Java, a == b chỉ true nếu hai biến trỏ cùng object (hoặc đều null). a.equals(b) dùng hợp đồng equals của class; Object mặc định so theo identity nhưng value object có thể override để so giá trị.

      Ví dụ hai Money record cùng amount=100 và currency="VND" là hai instance riêng, nên == thường false, trong khi equals trả true theo thành phần của record. Ngược lại hai Customer có tên "An" giống nhau nhưng customerId khác là hai entity khác; so sánh chỉ dựa tên sẽ nhầm danh tính.

      **Entity** nên có ID ổn định để thể hiện identity nghiệp vụ; **value object** thường immutable và so theo thành phần. Khi override equals, phải bảo đảm phản xạ, đối xứng, bắc cầu và nhất quán, đồng thời equal objects phải có cùng hashCode. Mutable fields tham gia hash dễ làm HashMap/HashSet không tìm lại được key sau khi bị thay đổi.

      Kết luận: giống dữ liệu không có nghĩa cùng object. Chọn quy tắc equality theo bản chất entity/value object, không dùng == để hỏi bằng nhau về giá trị.
  - question: Đóng gói, trừu tượng, kế thừa và đa hình hỗ trợ bảo trì phần mềm như thế nào?
    readmeRelated:
      anchorList:
      - oop-basic-005
      - encapsulation-001
      - abstraction-002
      - inheritance-001
      - subtyping-002
      - polymorphism-001
      - solid-004
      - design-pitfalls-004
    knowledge: Hiểu information hiding, contract, subtype hợp lệ và dynamic dispatch; xác định trade-off của kế thừa, không
      áp dụng máy móc.
    answer: |-
      Bốn đặc tính OOP có mục đích khác nhau:
      1. **Encapsulation:** che representation, cho sửa state qua hành vi có validation. Private balance cùng public setBalance tự do chưa bảo vệ invariant; withdraw phải chặn số tiền âm/vượt số dư.
      2. **Abstraction:** công bố contract cần thiết và giấu implementation. Checkout phụ thuộc PaymentGateway thay vì vendor SDK.
      3. **Inheritance:** mô hình hóa quan hệ subtype is-a và có thể tái sử dụng code; subclass phải giữ hợp đồng của superclass theo LSP, không chỉ giống tên hoặc có chung method.
      4. **Polymorphism:** khi gọi fee() qua PaymentMethod, runtime dispatch sang CardPayment/QRPayment phù hợp mà caller không phải switch theo type.

      Encapsulation giúp chống trạng thái sai, abstraction giúp thay adapter, polymorphism giúp mở rộng biến thể hợp lệ. Inheritance có thể hữu ích khi subtype thật sự thay thế được, nhưng hierarchy sâu hay extends chỉ để dùng lại vài method thường gây fragile base class.

      **Trade-off:** mọi interface/subclass đều có chi phí cấu hình và indirection. Không cần đủ bốn đặc tính trong từng class; một concrete class hay composition đơn giản đôi khi tốt hơn. Kiểm chứng bằng thay đổi yêu cầu và các test cụ thể.
  - question: Khi nào việc đưa nhiều hàm thủ tục vào class chưa thể coi là thiết kế hướng đối tượng tốt?
    readmeRelated:
      anchorList:
      - oop-basic-006
      - encapsulation-008
      - class-design-007
      - design-pitfalls-003
      - refactoring-004
      - practice-007
    knowledge: Phân biệt procedural code bọc trong class với object sở hữu invariant và hành vi; nhận diện anemic domain model.
    answer: |-
      Không thể coi procedural code đã trở thành thiết kế OOP tốt chỉ vì đặt nó trong class. Dấu hiệu thường gặp là **anemic object** chỉ có getter/setter, còn một controller hoặc God Service lấy các field, ra mọi quyết định và gán trạng thái. Quy tắc nghiệp vụ vì thế bị phân tán và có thể bị client mới bỏ qua.

      Ví dụ Order chỉ có getStatus/setStatus; controller kiểm tra paid rồi gọi setStatus(SHIPPED). Một batch job khác có thể gọi thẳng setter và giao đơn chưa thanh toán.

      Thiết kế tốt hơn: status private; Order cung cấp pay() và ship(); ship() xác nhận trạng thái PAID, nếu không thì ném IllegalStateException. Application service chỉ điều phối giao dịch/repository/gateway; invariant nằm ở Order nên client nào cũng chịu cùng quy tắc. Điều này thể hiện **information hiding, ownership và Tell Don't Ask**.

      Không phải mọi data holder đều sai. DTO, record chỉ chuyển dữ liệu hoặc CRUD đơn giản có thể chủ đích không có domain behavior. Nên đưa hành vi về object khi nó bảo vệ state/invariant thực sự, không nhồi mọi thao tác hạ tầng vào entity hoặc tạo class chỉ để tăng số lượng.
  - question: Bạn xác định trách nhiệm của một class dựa trên use case và hành vi nghiệp vụ như thế nào?
    readmeRelated:
      anchorList:
      - oop-basic-002
      - class-design-001
      - class-design-007
      - modeling-001
      - modeling-002
      - modeling-003
      - modeling-004
      - solid-002
      - refactoring-004
    knowledge: Phân tích use case, quy tắc thay đổi và owner của invariant để đặt hành vi tại class có đủ dữ liệu và trách
      nhiệm.
    answer: |-
      Bắt đầu thiết kế trách nhiệm bằng **use case và invariant**, không phải liệt kê danh từ rồi tạo class máy móc.

      1. Mô tả đầu vào, kết quả nghiệp vụ, trạng thái hợp lệ và những trường hợp bị từ chối.
      2. Xác định state cần duy trì và invariant như Order chỉ được ship sau khi paid hoặc Cart không được có quantity âm.
      3. Đặt mutation ở object sở hữu state và có đủ dữ liệu kiểm tra: Order.ship(), Cart.addItem().
      4. Tách các lý do thay đổi: chính sách tính phí nên thuộc PricingPolicy; persistence và notification thuộc adapter; CheckoutService điều phối chúng.
      5. Thiết kế API/contract tối thiểu để các object cộng tác; chỉ thêm port/interface nơi thực sự cần thay implementation hoặc cô lập kiểm thử.
      6. Viết test cho đường thành công, bị từ chối và thử một yêu cầu thay đổi thật.

      Khi quy tắc đụng nhiều entity mà không có owner tự nhiên, dùng **domain service**; khi chỉ mang dữ liệu giữa các tầng, dùng DTO; giá trị với validation/equality có thể dùng value object. Một class tốt có trách nhiệm gắn kết và kiểm soát invariant, không chỉ phản chiếu một bảng database.
  - question: Cohesion và coupling ảnh hưởng ra sao đến phạm vi thay đổi và khả năng kiểm thử?
    readmeRelated:
      anchorList:
      - class-design-002
      - class-design-003
      - solid-002
      - design-pitfalls-001
      - testing-007
      - refactoring-001
    knowledge: High cohesion, low coupling; đo số nơi phải sửa, quan hệ dependency và độ dễ cô lập đối tượng khi kiểm thử.
    answer: |-
      **Cohesion** là mức độ field và method của một class cùng phục vụ một trách nhiệm; **coupling** là mức phụ thuộc giữa thành phần với nhau. High cohesion và low coupling thường giúp khoanh vùng thay đổi và test dễ hơn.

      Ví dụ Order chỉ quản lý state/transition sẽ cohesive hơn Order vừa gọi SMTP, SQL, định giá và in báo cáo. CheckoutService tự new SmtpClient/MySqlRepository phụ thuộc chi tiết hạ tầng; nhận EmailSender/Repository qua constructor giúp thay fake khi unit test hoặc đổi adapter mà không sửa business code.

      Kiểm tra thực tế:
      - Thay luật phí có phải sửa nhiều controller, invoice và notification không?
      - Unit test domain có cần database/network thật không?
      - Thêm provider có cần sửa logic đang ổn định không?
      - Một class có nhiều actor/lý do thay đổi không?

      Độ thấp/cao không thể kết luận chỉ bằng đếm import. Tách quá vụn cũng tăng coupling qua lớp forwarding; một God Class ít import vẫn có thể rất nhiều trách nhiệm. Điều cần là một nhóm invariant/behavior cùng owner, dependency qua hợp đồng ổn định, và change impact được quan sát qua các ca sửa thật.
  - question: Khi nào mô hình OOP mang lại độ phức tạp không cần thiết so với hàm thuần hoặc xử lý tuần tự?
    readmeRelated:
      anchorList:
      - oop-basic-008
      - abstraction-007
      - solid-008
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-008
    knowledge: Cân nhắc KISS/YAGNI, số biến thể, vòng đời trạng thái và chi phí abstraction khi một hàm thuần đã giải quyết
      đủ.
    answer: |-
      OOP có chi phí: nhiều kiểu, hợp đồng, quản lý state/vòng đời và các lớp trung gian. Theo **KISS/YAGNI**, chỉ trả chi phí này khi nó giải quyết vấn đề thực tế.

      Một job cố định đọc CSV, thay dấu phân cách và ghi kết quả có thể dùng hàm transform(line) thuần, cộng try-with-resources để đóng file. Nếu dựng ConverterFactory, AbstractConverter, Strategy và ba layer chỉ cho một phép đổi cố định thì code khó trace/test hơn dù nhìn có nhiều pattern.

      Ưu tiên hàm thuần hoặc luồng tuần tự khi nghiệp vụ là biến đổi dữ liệu đơn giản, không có invariant sống lâu, và chưa có biến thể độc lập. Dùng object có trạng thái và hành vi khi cần bảo vệ transition, ownership hoặc các collaborator có hợp đồng khác nhau. Hai cách có thể cùng tồn tại trong Java: một domain object vẫn có thể dùng các hàm thuần để tính toán.

      Hãy thử một change scenario: nếu thêm chính sách mới phải sửa nhiều nơi, abstraction có thể có ích. Nếu một method rõ đã xử lý được yêu cầu, giữ nó đơn giản. Tránh dự báo các biến thể chưa có và tránh nhầm đơn giản với việc bỏ validation hoặc resource safety.
  - question: Trong một hệ thống OOP, object nên cộng tác với nhau qua hành vi hay trao đổi trực tiếp trạng thái nội bộ?
    readmeRelated:
      anchorList:
      - oop-basic-004
      - encapsulation-001
      - encapsulation-008
      - composition-003
      - class-design-009
      - refactoring-005
      - refactoring-004
    knowledge: Object giao tiếp qua public contract/hành vi, che representation; tránh tự ý sửa field nội bộ của collaborator.
    answer: |-
      Các object nên **cộng tác qua public behavior/contract** và che representation nội bộ thay vì caller trực tiếp đọc rồi sửa field sâu trong object graph.

      Ví dụ không tốt: controller gọi order.getShipment().setStatus(SHIPPED). Controller phải biết cấu trúc Shipment, tự chịu điều kiện thanh toán và có thể bỏ qua rule. Nếu đổi model, nhiều caller phải sửa.

      Thiết kế tốt hơn: controller gọi order.ship(); Order bảo vệ status private và kiểm paid/current status trước khi chuyển trạng thái, nếu trái invariant thì từ chối. Với collection, có thể trả List.copyOf để không lộ List gốc; cần nhớ các phần tử lồng bên trong vẫn có thể mutable. Với vendor API, phần domain gọi port thay vì thao tác trực tiếp field/SDK.

      **Tell Don't Ask** nhấn mạnh đưa quyết định dựa state về owner; **Law of Demeter** khuyến khích giảm chuỗi getter làm lộ cấu trúc nội bộ. Không cấm getter: màn hình, báo cáo và serialization vẫn cần dữ liệu đọc. Application service vẫn nên điều phối transaction và external calls, không đẩy toàn bộ orchestration vào entity.
  - question: Làm thế nào đánh giá chất lượng thiết kế OOP mà không dựa vào số lượng class hoặc interface?
    readmeRelated:
      anchorList:
      - oop-basic-008
      - class-design-001
      - class-design-002
      - solid-008
      - design-pitfalls-010
      - refactoring-001
      - practice-011
    knowledge: Đánh giá khả năng đáp ứng thay đổi thật, invariant, độ dễ test, coupling và độ rõ ràng thay vì đếm class.
    answer: |-
      Không thể đánh giá thiết kế tốt theo số class/interface; cần dùng các **kịch bản thay đổi và hành vi kiểm chứng**.

      1. **Change impact:** đổi payment provider, thêm luật phí hoặc thay SDK phải sửa những module nào? Có lan sang code không liên quan không?
      2. **Correctness/invariant:** public API có cho trạng thái sai không? Có test cả nhánh thành công và nhánh bị từ chối không?
      3. **Testability:** domain có test mà không cần DB/network/global static state không? Có thể thay adapter bằng fake và dùng contract test không?
      4. **Cohesion/coupling:** owner quy tắc rõ không, một class có quá nhiều lý do thay đổi hoặc caller biết quá nhiều field/SDK không?
      5. **Complexity:** các tầng forwarding/interface có phục vụ biến thể thật hay chỉ tạo indirection?

      Ví dụ trước refactor, Checkout vừa switch theo paymentType vừa gọi SDK; sau refactor, Checkout nhận PaymentGateway qua DI. Chạy regression tests để bảo đảm kết quả cũ, test adapter mới và đo số nơi phải sửa khi thêm provider. Nếu một interface không cải thiện khả năng thay đổi hoặc test thì có thể chưa cần.

      Hiệu năng cần profiler, benchmark có warmup và workload đại diện; không mặc định OOP chậm/nhanh từ số object. Dùng bằng chứng hành vi và chi phí thay đổi thực để kết luận.
- groupID: 2
  groupName: Class, object và vòng đời
  questions:
  - question: Instance field, static field, instance method và static method khác nhau về quyền sở hữu trạng thái như thế
      nào?
    readmeRelated:
      anchorList:
      - oop-basic-003
      - class-003
      - design-pitfalls-008
    knowledge: Instance member thuộc từng instance; static thuộc class; shared static mutable state mang rủi ro race và nhiễm
      trạng thái.
    answer: |-
      **Phân biệt phạm vi sở hữu:** instance field thuộc trạng thái của mỗi object; hai instance có vùng field riêng, nhưng field kiểu tham chiếu vẫn có thể cùng trỏ tới một dependency. Instance method chạy với receiver (this), truy cập instance state, và method override được chọn qua dynamic dispatch. Static field/method gắn với khai báo class (trong class loader tương ứng), không có this; static method ở subclass trùng chữ ký với superclass là method hiding, không phải override đa hình.

      ~~~java
      final class Counter {
          private int perObject;
          private static int shared;

          void increment() {
              perObject++;
              shared++;
          }

          int ownCount() { return perObject; }
          static int totalCount() { return shared; }
      }
      ~~~

      Hai Counter a, b mới tạo có perObject độc lập. Nếu chỉ a.increment(), a.ownCount() tăng, còn b.ownCount() không đổi; totalCount() của class phản ánh cập nhật chung. Static field không phải singleton object; nó tồn tại theo định danh class/class loader.

      **Rủi ro:** shared++ là thao tác đọc–tăng–ghi, không atomic và không tự đảm bảo visibility giữa thread. Có thể mất cập nhật dù các instance Counter khác nhau. Dùng AtomicInteger/LongAdder khi chỉ cần đếm độc lập; dùng lock hoặc transaction nếu nhiều field phải thỏa invariant chung. Static final với collection mutable chỉ chặn gán lại tham chiếu, không chặn thay phần tử. Không lưu user/request state trong static hoặc singleton shared field; ưu tiên state theo instance/scope được định nghĩa rõ. Static method phù hợp utility thuần, factory hoặc logic không cần state của một object.
  - question: Constructor, static factory method và Builder khác nhau khi tạo object có điều kiện hợp lệ phức tạp ra sao?
    readmeRelated:
      anchorList:
      - lifecycle-002
      - lifecycle-005
      - design-patterns-002
      - design-patterns-003
    knowledge: Constructor kiểm invariant, factory có tên và có thể chọn subtype/cache, Builder phù hợp nhiều tùy chọn; đánh
      đổi compile/runtime validation.
    answer: |-
      **Constructor, static factory, Builder giải quyết các nhu cầu khác nhau.** Constructor buộc caller cung cấp tham số theo chữ ký, tạo instance cụ thể và có thể từ chối dữ liệu sai. Static factory như Money.of(...) hoặc User.from(...) có tên rõ ý nghĩa, có thể chọn implementation/subtype hoặc trả instance cached nếu hợp đồng cho phép. Builder đặt các tham số tùy chọn bằng lời gọi có tên, giảm lỗi đảo thứ tự các tham số cùng kiểu, rồi kiểm tra tổng thể tại build().

      ~~~java
      record Endpoint(String host, int port, boolean tls) {
          Endpoint {
              if (host == null || host.isBlank()) throw new IllegalArgumentException("host");
              if (port < 1 || port > 65535) throw new IllegalArgumentException("port");
          }
          static Endpoint secure(String host) {
              return new Endpoint(host, 443, true);
          }
      }

      final class EndpointBuilder {
          private String host;
          private int port = 443;
          private boolean tls = true;
          EndpointBuilder host(String s) { host = s; return this; }
          EndpointBuilder port(int p) { port = p; return this; }
          EndpointBuilder tls(boolean v) { tls = v; return this; }
          Endpoint build() { return new Endpoint(host, port, tls); }
      }
      ~~~

      Cả constructor trực tiếp và Builder đều dựa vào cùng validation của Endpoint; thiếu host hoặc port sai sẽ ném IllegalArgumentException. Static factory secure() diễn đạt chính sách mặc định.

      **Trade-off:** kiểu tham số và số lượng tham số bắt buộc được compiler kiểm tra, nhưng điều kiện port 1..65535 vẫn là runtime validation. Builder thường cho phép bỏ qua host tới build(), trừ khi dùng staged builder với các interface biểu thị thứ tự bắt buộc; staged builder giảm một số trạng thái sai ở compile time nhưng tăng số type. Factory trả object cached chỉ an toàn nếu identity/ownership phù hợp; cache mutable object ngoài ý muốn có thể làm caller ảnh hưởng lẫn nhau. Builder quá mức cho object chỉ có 1–2 tham số sẽ làm tăng độ phức tạp không đáng.
  - question: Làm sao bảo đảm một object thỏa mãn invariant ngay khi được tạo?
    readmeRelated:
      anchorList:
      - lifecycle-002
      - lifecycle-009
      - encapsulation-002
      - encapsulation-005
      - testing-002
    knowledge: Validation tại constructor/factory, tránh `this` escape và trạng thái tạo dở dang; mọi đường khởi tạo đều giữ
      invariant.
    answer: |-
      **Invariant phải đúng ngay khi constructor/factory hoàn thành và sau mọi operation công khai.** Ví dụ khoảng ngày phải có start và end khác null, start không sau end. Validate trước khi gán state; nếu không hợp lệ, ném exception và không công bố instance sai.

      ~~~java
      public final class DateRange {
          private final java.time.LocalDate start;
          private final java.time.LocalDate end;

          public DateRange(java.time.LocalDate start, java.time.LocalDate end) {
              if (start == null || end == null || start.isAfter(end)) {
                  throw new IllegalArgumentException("Invalid range");
              }
              this.start = start;
              this.end = end;
          }

          public boolean contains(java.time.LocalDate d) {
              return d != null && !d.isBefore(start) && !d.isAfter(end);
          }
      }
      ~~~

      LocalDate immutable cùng final fields giúp DateRange không bị thay đổi bởi alias bên ngoài. Nếu chứa List mutable, phải sao chép phòng vệ và không trả reference cho phép sửa list nội bộ. Với object mutable, gom việc cập nhật nhiều field vào operation nghiệp vụ để validate và giữ invariant trước/sau thay đổi; tránh dãy public setter có thể tạo trạng thái sai.

      **Không cho this escape:** không đăng ký this vào listener/static registry, không gọi overridable callback hoặc khởi chạy thread trong constructor; code bên ngoài có thể quan sát object chưa hoàn tất khởi tạo, làm sai invariant hoặc publication. Factory có thể tạo object đầy đủ rồi mới công bố hoặc gọi bước init được kiểm soát. ORM/deserializer có thể tạo object qua đường khác constructor; ranh giới khôi phục state phải kiểm tra invariant riêng. Nếu nhiều request cùng sửa object/DB, constructor validation không thay thế transaction, optimistic locking hay synchronization.
  - question: Java khởi tạo static field, instance initializer, constructor lớp cha và constructor lớp con theo thứ tự nào?
    readmeRelated:
      anchorList:
      - class-003
      - lifecycle-004
      - inheritance-006
    knowledge: Quy tắc load/initialization của Java, chạy `super` trước logic con, default field values và thứ tự initializer.
    answer: |-
      **Có hai tiến trình:** static class initialization và instance initialization. Lúc class được sử dụng chủ động lần đầu theo Java Language Specification, superclass cần thiết được khởi tạo trước subclass; sau đó static field initializers và static blocks của mỗi class chạy theo thứ tự xuất hiện trong source. Class loading/linking có thể sớm hơn; đọc compile-time constant static final từ class khác không nhất thiết kích hoạt class initialization. Với class/class loader tương ứng, class initialization thường chỉ diễn ra một lần.

      Với new Child(), JVM cấp phát bộ nhớ instance với default values (null, 0, false), rồi chạy chuỗi constructor lên superclass. Ở mỗi cấp: sau lời gọi super(...), field initializers và instance initializer blocks của cấp đó chạy theo thứ tự văn bản, cuối cùng là thân constructor cấp đó. Sau khi parent constructor trả về mới đến instance field/block của Child và thân constructor Child. Với constructor chaining this(...), initializer của một cấp không chạy lặp qua mỗi constructor gọi nối tiếp.

      ~~~java
      class Parent {
          static { System.out.println("P static"); }
          int a = log("P field");
          { log("P block"); }
          Parent() { log("P ctor"); }
          static int log(String s) { System.out.println(s); return 1; }
      }
      class Child extends Parent {
          static { System.out.println("C static"); }
          int b = log("C field");
          { log("C block"); }
          Child() { log("C ctor"); }
      }
      class Demo {
          public static void main(String[] args) { new Child(); }
      }
      ~~~

      Nếu Parent và Child chưa được chủ động khởi tạo trước đó, thứ tự mong đợi: P static → C static → P field → P block → P ctor → C field → C block → C ctor. Lần new Child() kế tiếp chạy lại các bước instance, không chạy lại static blocks. Đây là suy luận theo quy tắc ngôn ngữ, không phải log chạy thử.

      **Edge case quan trọng:** constructor Parent đã có thể thực thi code khi field Child còn default values. Nếu constructor lớp cha gọi method override, method lớp con có thể quan sát null/0 thay vì giá trị initializer mong đợi. Thứ tự cấp phát, default value, super và initializer quan trọng hơn việc nhớ một danh sách lệnh cứng.
  - question: Vì sao việc gọi overridable method trong constructor có thể quan sát trạng thái chưa khởi tạo?
    readmeRelated:
      anchorList:
      - lifecycle-004
      - lifecycle-009
      - inheritance-006
      - polymorphism-004
    knowledge: Dynamic dispatch xảy ra từ superclass constructor khi field lớp con vẫn giá trị mặc định; tránh virtual call/`this`
      escape.
    answer: |-
      **Nguyên nhân là dynamic dispatch trong lúc object mới được tạo.** Parent constructor được gọi trước khi Child chạy field initializer. Khi Parent gọi một instance method có thể override, Java vẫn chọn Child override theo runtime type; nhưng state Child chưa được thiết lập.

      ~~~java
      class Parent {
          Parent() { show(); }
          void show() { System.out.println("parent"); }
      }
      class Child extends Parent {
          private String label = "READY";
          @Override void show() {
              System.out.println(label.length());
          }
      }
      class Demo {
          public static void main(String[] args) { new Child(); }
      }
      ~~~

      Child.show() được gọi từ Parent(), trong khi label vẫn null theo default value. Do đó label.length() ném NullPointerException; khởi tạo label tại khai báo không cứu được, vì initializer Child chạy sau super(). Các lỗi tương tự có thể xuất hiện với field int đang là 0 hoặc collection chưa tạo.

      **Cách phòng:** constructor không gọi overridable instance method, không publish this tới event bus hoặc thread; dùng private/final helper chỉ đụng state đã sẵn sàng. Nếu parent cần dữ liệu cấu hình để kiểm tra, nhận nó qua tham số super(...) và giữ tại field parent. Nếu cần hành vi đa hình, factory tạo object hoàn tất rồi mới gọi method, với ranh giới init rõ; tránh thiết kế two-phase init không được bảo vệ, vì caller có thể thấy object ở trạng thái nửa sẵn sàng. Lỗi này liên quan cả lifecycle lẫn invariant chứ không chỉ style.
  - question: Bạn phân biệt object lifecycle trong Java với vòng đời của file, socket và database connection thế nào?
    readmeRelated:
      anchorList:
      - lifecycle-006
      - lifecycle-008
      - composition-007
    knowledge: GC thu hồi heap theo reachability, còn file/socket/connection phải có ownership và thời điểm close chủ động.
    answer: |-
      **Vòng đời heap object không đồng nhất với vòng đời external resource.** Object Java còn sống nếu reachable từ GC roots; khi unreachable nó *có thể* được GC thu gom nhưng không có deadline đảm bảo. File descriptor, native socket, JDBC connection và handle của thư viện giữ tài nguyên OS/driver/pool có giới hạn; owner phải close đúng ranh giới sử dụng, không đợi GC.

      ~~~java
      try (java.io.InputStream stream =
               java.nio.file.Files.newInputStream(path)) {
          byte[] firstBytes = stream.readNBytes(4);
          // Xử lý firstBytes.
      } // Stream được close kể cả khi khối try ném lỗi.
      ~~~

      Với JDBC pool, close() của proxy/handle thường trả connection về pool, không đồng nghĩa đóng ngay kết nối TCP vật lý. Pool sở hữu vòng đời physical connection; code mượn connection cần trả lại sớm. Socket.close() giải phóng endpoint/descriptor theo hợp đồng, cũng không phụ thuộc object còn reachable hay không.

      **Ownership:** phân biệt owner tạo/nhận trách nhiệm close, borrower chỉ sử dụng không có quyền đóng, và manager/pool điều phối tái sử dụng. Nếu một service có client dài hạn chia sẻ cho nhiều request, owner có thể đóng khi application shutdown thay vì mỗi request; ngược lại connection mượn theo request nên trả về pool sau thao tác. Việc gán biến tham chiếu null, hết scope, hay gọi System.gc() không đảm bảo kịp giải phóng external resource. Finalizer đã bị deprecated for removal, không được dùng làm nền tảng correctness.
  - question: Khi nào cần dùng AutoCloseable và try-with-resources thay vì trông chờ garbage collector?
    readmeRelated:
      anchorList:
      - lifecycle-008
      - composition-007
      - language-mechanics-008
      - lifecycle-007
    knowledge: AutoCloseable, try-with-resources, thứ tự đóng ngược và suppressed exceptions; GC không đảm bảo cleanup đúng
      hạn.
    answer: |-
      **Dùng AutoCloseable với try-with-resources (TWR)** khi resource phải giải phóng xác định và operation có thể ném exception: stream, socket, JDBC Connection/Statement/ResultSet hoặc một resource guard. GC chỉ quản lý bộ nhớ/reachability và không hứa thời điểm close. Resource đóng tự động khi rời block, kể cả ở nhánh lỗi; TWR đóng theo thứ tự ngược lúc khai báo.

      ~~~java
      final class Tracked implements AutoCloseable {
          private final String name;
          Tracked(String n) { name = n; }
          @Override public void close() {
              System.out.println("close " + name);
          }
      }
      class Demo {
          static void work() {
              try (Tracked first = new Tracked("first");
                   Tracked second = new Tracked("second")) {
                  System.out.println("body");
              }
          }
      }
      ~~~

      Thứ tự theo logic là body → close second → close first. Nếu khởi tạo resource thứ hai lỗi, resource đầu đã tạo thành công vẫn được đóng. AutoCloseable.close() có thể ném checked Exception; caller cần xử lý hợp đồng exception theo API.

      **Suppressed exceptions:** nếu thân try ném một lỗi và close() cũng ném lỗi, lỗi thân try vẫn là primary exception; lỗi close nằm trong getSuppressed(), không làm mất lỗi gốc.

      ~~~java
      try (AutoCloseable r = () -> {
              throw new IllegalStateException("close failed");
           }) {
          throw new IllegalArgumentException("work failed");
      } catch (IllegalArgumentException ex) {
          // ex.getSuppressed()[0] là lỗi close failed.
      }
      ~~~

      Nếu chỉ close() thất bại, lỗi close có thể trở thành primary exception. Với nhiều resource, nhiều lỗi đóng có thể được lưu suppressed. TWR phải áp dụng ở boundary thực sự sở hữu resource; không tự close dependency do caller khác sở hữu hoặc client chia sẻ đang sử dụng. Cũng không giả định close() luôn idempotent trừ khi contract resource bảo đảm.
  - question: Final reference có khác immutable object không, đặc biệt khi field tham chiếu đến collection mutable?
    readmeRelated:
      anchorList:
      - class-006
      - object-005
      - encapsulation-007
      - refactoring-005
    knowledge: '`final` chỉ khóa tham chiếu, không khóa dữ liệu lồng nhau; defensive copy, immutable elements và tránh lộ
      collection mutable.'
    answer: |-
      **Final reference khác immutable object.** Field final ngăn gán lại reference sau khởi tạo; nó không chặn mutate object được trỏ đến. Nếu final List<String> trỏ tới ArrayList, các thao tác add/clear vẫn có thể làm dữ liệu thay đổi qua mọi alias. Collections.unmodifiableList(source) tạo view không cho mutate qua view nhưng có thể phản ánh thay đổi của source gốc. List.copyOf(source) tạo snapshot cấu trúc immutable theo API list (không cho phần tử null), nhưng không tự deep copy từng phần tử mutable.

      ~~~java
      import java.util.*;
      final class Basket {
          private final List<String> items;
          Basket(List<String> source) {
              items = List.copyOf(source);
          }
          List<String> items() { return items; }
      }
      ~~~

      Nếu source là ArrayList rồi source.add("A"), Basket đã tạo không tự nhận thêm phần tử. Basket.items().add("B") ném UnsupportedOperationException. Trong ví dụ, String immutable nên các phần tử an toàn; nếu List chứa một MutableAddress, alias khác vẫn có thể sửa address dù list snapshot không thêm/xóa được. Khi cần deep immutability, tạo bản sao phần tử hoặc dùng value object immutable.

      **Thread safety:** immutable state hỗ trợ chia sẻ an toàn, equality/hash ổn định, caching và suy luận dễ. Tuy nhiên final chỉ bảo đảm một phần semantics của Java Memory Model nếu object được xây dựng đúng, không để this escape; final field chứa object mutable không khiến toàn bộ graph thread-safe. Bất biến một object không tự làm giao dịch nhiều object/DB trở nên atomic. Với dữ liệu lớn thay đổi liên tục, cần cân nhắc chi phí copy và workload thay vì copy mọi thứ máy móc.
  - question: Object identity, value equality và aliasing gây ra những hệ quả nào khi truyền tham chiếu cho nhiều nơi?
    readmeRelated:
      anchorList:
      - object-002
      - object-003
      - object-004
      - class-design-006
      - language-mechanics-006
    knowledge: Phân biệt `==`, `equals`, alias cùng object; thay đổi qua một reference được các reference khác quan sát.
    answer: |-
      **Identity, equality, aliasing giải quyết ba câu hỏi khác nhau.** Toán tử == trên reference kiểm tra có cùng instance hay cùng null. equals(Object) là hợp đồng equality; nếu override hợp lệ, hai instance khác nhau có thể bằng nhau về giá trị. Aliasing xảy ra khi hai biến/field cùng trỏ một object: mutate qua biến này được quan sát qua biến còn lại.

      ~~~java
      import java.util.*;
      List<String> a = new ArrayList<>(List.of("A"));
      List<String> b = a;
      List<String> c = new ArrayList<>(List.of("A"));
      if (a != b || a == c || !a.equals(c)) {
          throw new AssertionError("Identity/equality incorrect");
      }
      b.add("B");
      if (a.size() != 2 || c.size() != 1) {
          throw new AssertionError("Alias/copy behavior incorrect");
      }
      ~~~

      Các check trên minh họa: a và b cùng identity; c khác identity nhưng bằng giá trị ban đầu; sửa b làm a đổi nhưng không làm c đổi. Trong Java, tham số object truyền **giá trị của reference**: method có thể mutate object được trỏ đến, nhưng gán lại biến tham số không thay tham chiếu của caller.

      **Lỗi thực tế:** dùng object mutable làm HashMap key hoặc HashSet member rồi đổi field liên quan equals/hashCode có thể làm tra cứu thất bại vì hash bucket được chọn tại lúc add/put. Nếu override equals phải giữ hợp đồng hashCode, symmetry/transitivity/consistency. Value object thường dùng equality theo các giá trị có ý nghĩa; entity có business identity cần quy định ổn định (đặc biệt ID do DB cấp sau khi persist). Defensive copy, immutable value object và method nghiệp vụ giúp tránh alias ngoài ý muốn làm hỏng invariant.
  - question: Bạn sẽ chọn immutable object hay mutable object dựa trên những yếu tố nghiệp vụ và hiệu năng nào?
    readmeRelated:
      anchorList:
      - class-006
      - object-005
      - encapsulation-007
      - practice-005
    knowledge: Chọn immutable khi chia sẻ, caching và value semantics; mutable khi cần transition, cân nhắc snapshot/copy,
      thread safety.
    answer: |-
      **Chọn theo ngữ nghĩa trước khi tối ưu.** Immutable object phù hợp Money, DateRange, cấu hình, cache key, snapshot và dữ liệu chia sẻ giữa thread: dễ suy luận, không bị alias làm đổi state bất ngờ, an toàn hơn cho value equality/hash. Mutable object hợp lý với entity có trạng thái theo vòng đời như Order hoặc aggregate cập nhật liên tục, nhưng phải encapsulate state bằng method nghiệp vụ, không mở setter tùy ý.

      ~~~java
      record Money(long cents, String currency) {
          Money {
              if (cents < 0 || currency == null || currency.isBlank()) {
                  throw new IllegalArgumentException("Invalid money");
              }
          }
          Money plus(Money other) {
              if (!currency.equals(other.currency())) {
                  throw new IllegalArgumentException("Currency mismatch");
              }
              return new Money(Math.addExact(cents, other.cents()), currency);
          }
      }

      final class Order {
          enum Status { DRAFT, PAID }
          private Status status = Status.DRAFT;
          void pay() {
              if (status != Status.DRAFT) {
                  throw new IllegalStateException("Already paid");
              }
              status = Status.PAID;
          }
      }
      ~~~

      Money.plus() trả object mới, từ chối currency khác hoặc overflow; Order thay trạng thái bằng operation có điều kiện. Nếu nhiều thread đồng thời gọi pay(), ví dụ chưa tự thread-safe; cần synchronized/atomic state hoặc transaction và optimistic locking tại DB phù hợp.

      **Trade-off hiệu năng:** immutable có thể tạo thêm snapshot/copy nếu cập nhật lớn và thường xuyên; mutable có thể tránh copy nhưng tăng chi phí lock, alias và coupling. JVM đôi khi loại được allocation qua escape analysis/scalar replacement, không bảo đảm với mọi object. Đừng khẳng định mutable luôn nhanh hơn: đo allocation rate, GC, throughput, latency bằng JFR/profiler và benchmark JMH phù hợp workload trước khi quyết định. Với luồng xây dựng dữ liệu lớn, có thể mutate buffer/builder nội bộ rồi publish immutable snapshot; persistent structures/copy-on-write hữu ích khi phù hợp tần suất đọc/ghi.
- groupID: 3
  groupName: Encapsulation và invariant
  questions:
  - question: Encapsulation khác với việc chỉ khai báo private field và cung cấp public getter/setter ở đâu?
    readmeRelated:
      anchorList:
      - encapsulation-001
      - encapsulation-002
      - encapsulation-004
      - encapsulation-008
      - class-design-007
      - design-pitfalls-003
      - refactoring-005
    knowledge: Encapsulation bảo vệ invariant bằng API có ý định nghiệp vụ và information hiding; private + setter tự do vẫn
      lộ quyền sửa.
    answer: |-
      **Encapsulation** là bảo vệ trạng thái và các invariant thông qua API có ý nghĩa, không chỉ đánh dấu field private. Caller không nên biết representation hoặc có quyền sửa mọi thuộc tính tùy ý.

      Account có private balance nhưng public setBalance(long x) không kiểm tra vẫn cho balance âm. Thiết kế tốt hơn là cung cấp deposit(amount), withdraw(amount), yêu cầu amount > 0 và không cho withdraw vượt số dư. Các lệnh thể hiện ý định nghiệp vụ, tập trung validation và mutation tại object sở hữu state.

      Sự khác biệt:
      - Private field + getter/setter vô điều kiện chỉ hạn chế cú pháp truy cập, không bảo vệ quy tắc.
      - Encapsulation đúng nghĩa quy định các **chuyển trạng thái hợp lệ** và giấu chi tiết dữ liệu.
      - Getter cho hiển thị vẫn hợp lý, nhưng không nên trả reference mutable để caller sửa field/list bên trong.

      Ví dụ Order phải có hành vi ship() kiểm đã PAID, thay vì setStatus(SHIPPED). Nếu một caller thử giao đơn ở DRAFT, object từ chối và giữ trạng thái cũ. Với dữ liệu đơn giản như displayName, setter có validation có thể chấp nhận được. Phán đoán đúng dựa invariant và quyền sở hữu thay đổi chứ không dựa tên getter/setter.

      Test encapsulation bằng cách thử mọi public API, gồm lỗi đầu vào, để chứng minh không thể tạo state trái invariant.
  - question: Vì sao public setter cho mọi thuộc tính có thể phá hỏng quy tắc nghiệp vụ của object?
    readmeRelated:
      anchorList:
      - encapsulation-003
      - encapsulation-004
      - encapsulation-008
      - class-design-007
      - design-pitfalls-002
      - refactoring-005
      - practice-002
    knowledge: Nhận diện đường mutation bỏ qua validation, thay setter bằng command như `pay`, `ship`, `withdraw` có điều
      kiện.
    answer: |-
      Public setter cho mọi thuộc tính biến mỗi field thành một **đường mutation** có thể bỏ qua quy tắc liên quan đến field khác. Việc UI/controller kiểm điều kiện chưa đủ vì batch, mobile API, test hoặc module khác có thể gọi setter trực tiếp.

      Ví dụ Order có setPaid(false) và setStatus(SHIPPED); caller gán tùy ý sẽ tạo trạng thái giao hàng chưa thanh toán. Tương tự BankAccount.setBalance(-100) phá invariant số dư không âm. Một state đúng type vẫn có thể sai nghiệp vụ.

      Thay bằng command:
      - pay() chỉ thực hiện transition thích hợp khi thanh toán được xác nhận.
      - ship() chỉ thực hiện nếu đã PAID, chưa SHIPPED và điều kiện giao hàng đạt.
      - cancel() dùng guard theo chính sách hủy.
      - withdraw(amount) kiểm amount dương và đủ balance trước khi trừ.

      Field status/balance private, không có setter vô điều kiện. Những command thực hiện validation, commit state và có postcondition rõ; nhánh lỗi giữ state cũ. Service điều phối gateway, repository, transaction, nhưng không lặp lại invariant của entity.

      Không phải mọi setter đều xấu: thuộc tính độc lập, ví dụ setDisplayName có kiểm tra, có thể phù hợp. Vấn đề là mutation tùy ý đối với trạng thái có workflow và quan hệ liên field. Kiểm tra cả đường thành công và thất bại.
  - question: Object invariant khác validation đầu vào ở API hoặc giao diện người dùng như thế nào?
    readmeRelated:
      anchorList:
      - lifecycle-002
      - encapsulation-002
      - encapsulation-005
      - abstraction-004
      - class-design-004
    knowledge: Input validation ở boundary kiểm cú pháp/định dạng; object invariant phải đúng suốt vòng đời, kể cả từ batch/API
      khác.
    answer: |-
      **Boundary validation** kiểm dữ liệu đi vào từ UI, REST, message hay batch: trường bắt buộc, cú pháp, format, quyền truy cập, lỗi request. **Object invariant** là điều kiện phải đúng với object hợp lệ trong suốt vòng đời, bất kể ai tạo hoặc sửa object.

      Ví dụ giao diện đặt phòng đã kiểm checkOut sau checkIn, nhưng job import có thể gọi constructor trực tiếp và bỏ qua UI. Booking phải tự đảm bảo checkOut.isAfter(checkIn) tại constructor/factory và trong hành vi sửa ngày. Nếu checkOut <= checkIn, từ chối và không tạo/sửa object trái invariant.

      Mô hình nhiều lớp:
      1. Boundary kiểm request sớm để trả lỗi thân thiện.
      2. Domain kiểm invariant ở nơi sở hữu state; API mới cũng phải tuân cùng contract.
      3. Database constraint bổ sung phòng vệ nếu có nhiều writers, nhưng không thay domain validation.

      Các invariant khác: balance không âm, quantity dương, total nhất quán với discount, order không SHIPPED trước PAID. Các quy tắc phụ thuộc nhiều entity hoặc dữ liệu ngoài có thể cần domain service/transaction; không nhất thiết gom hết vào một object.

      Test trực tiếp constructor/domain methods ngoài HTTP, test qua các adapter, và test lỗi không làm state đổi. Một draft được phép thiếu thông tin nếu **trạng thái draft** được mô hình hóa rõ ràng; không gọi nó là object hoàn tất hợp lệ.
  - question: Bạn thiết kế hành vi chuyển trạng thái đơn hàng như thế nào để ngăn những chuyển đổi không hợp lệ?
    readmeRelated:
      anchorList:
      - encapsulation-009
      - class-design-008
      - modeling-008
      - design-patterns-009
      - testing-003
      - practice-002
    knowledge: Xây dựng state machine và transition guards; status private, kiểm điều kiện thanh toán trước khi chuyển sang
      SHIPPED.
    answer: |-
      Thiết kế Order thành **state machine** với tập trạng thái và transition hợp lệ: DRAFT → PAID → SHIPPED; DRAFT có thể CANCELLED, còn SHIPPED không tự quay về DRAFT. Những tình huống refund/return cần transition riêng theo nghiệp vụ.

      Ví dụ Java giản lược:

          enum Status { DRAFT, PAID, SHIPPED, CANCELLED }
          class Order {
            private Status status = Status.DRAFT;
            Status status() { return status; }
            void markPaid() {
              if (status != Status.DRAFT) throw new IllegalStateException();
              status = Status.PAID;
            }
            void ship() {
              if (status != Status.PAID) throw new IllegalStateException();
              status = Status.SHIPPED;
            }
          }

      Không có public setStatus. markPaid được gọi sau xác nhận thanh toán trong use case thích hợp. ship kiểm precondition PAID và chỉ sau đó commit SHIPPED; transition sai ném exception và giữ nguyên trạng thái.

      Test: ship một Order mới phải thất bại, status vẫn DRAFT; markPaid rồi ship phải thành SHIPPED; ship lần hai bị từ chối. Quy tắc khác như có hàng tồn kho có thể mở rộng guard.

      Khi nhiều request cùng sửa một Order, check-then-set trong Java chưa bảo vệ consistency của dữ liệu đã persist. Cần transaction/optimistic locking (version) hoặc cơ chế đồng bộ phù hợp. State machine giải quyết logic transition, còn concurrency control giải quyết ghi đè đồng thời.
  - question: Vì sao cập nhật hai field có quan hệ qua hai setter độc lập có thể tạo trạng thái dở dang?
    readmeRelated:
      anchorList:
      - encapsulation-002
      - encapsulation-004
      - class-design-008
      - testing-003
      - refactoring-005
    knowledge: Invariant liên field như total = base - discount; dùng hành vi atomic hoặc tính giá trị dẫn xuất thay hai setter.
    answer: |-
      Hai field liên quan có một **invariant liên field**, nên cập nhật bằng hai setter rời rạc có thể tạo trạng thái trung gian sai hoặc cập nhật một nửa nếu thao tác sau ném exception.

      Ví dụ Invoice có base=100, discount=20, total=80. Nếu setDiscount(30) thành công nhưng setTotal(70) không chạy, total cũ 80 không còn bằng base-discount. Mọi field tự nó đều là số hợp lệ, nhưng toàn bộ object sai.

      Giải pháp ưu tiên:
      - **Giá trị dẫn xuất:** chỉ lưu base và discount; total() tính base-discount, bỏ public setTotal. Tránh lưu cùng một sự thật ở hai nơi.
      - **Một hành vi thay đổi:** changePrice(base,discount) kiểm base >= 0, 0 <= discount <= base, tính tổng mới rồi cập nhật state qua API được kiểm soát.
      - **Immutable object:** tạo PriceBreakdown đã validate và thay cả giá trị như một đơn vị tại boundary thích hợp.

      Test discount vượt base bị từ chối, mọi field vẫn như trước; discount hợp lệ dẫn tới total đúng. Nếu caller/thread khác có thể quan sát giữa các lần gán hoặc DB lưu trên nhiều row, cần synchronization/transaction/version tương ứng. Một method Java có nhiều assignment chưa đương nhiên là atomic trước concurrency hay persistence.
  - question: Bạn làm thế nào để một thao tác thất bại không làm object bị cập nhật một phần?
    readmeRelated:
      anchorList:
      - encapsulation-002
      - encapsulation-005
      - abstraction-004
      - language-mechanics-008
      - testing-003
    knowledge: Validate và tính trước commit; đảm bảo trạng thái cũ khi exception, strong exception safety, transaction nếu
      cần.
    answer: |-
      Mục tiêu **strong exception safety**: thao tác thất bại không được để object ở trạng thái dở dang. Phân biệt việc catch lỗi với việc thực sự giữ invariant và rollback các mutation đã xảy ra.

      Cách làm:
      1. Kiểm precondition/invariant và chuẩn bị input trước khi sửa state.
      2. Tính trạng thái mới vào local variables hoặc immutable candidate; những bước dễ ném lỗi được thực hiện trước commit khi khả thi.
      3. Commit ngắn gọn qua một API có kiểm soát, tránh callback bên ngoài giữa nhiều assignment.
      4. Nếu cập nhật nhiều object/database rows, dùng transaction hoặc cơ chế rollback phù hợp; kiểm soát concurrent updates.
      5. Test lỗi chèn tại từng bước và xác nhận state sau lỗi bằng state trước lỗi.

      Ví dụ withdraw(100): kiểm amount > 0 và balance >= amount trước khi balance -= amount. Đối với transfer giữa hai tài khoản, không được trừ bên gửi rồi gặp exception trước cộng bên nhận mà coi thao tác xong; transaction/locking có thể cần thiết.

      External side effect như gọi payment gateway hoặc gửi email không được rollback chỉ vì DB transaction rollback. Thiết kế outbox, idempotency, retry hoặc saga tùy yêu cầu consistency.

      Cần nói rõ **ranh giới atomicity**: an toàn exception nội bộ object không bằng transaction phân tán. Lập luận đúng phải bao phủ nhánh thất bại, thành công và tác động quan sát được.
  - question: Vì sao trả về List mutable qua getter có thể khiến caller sửa trái phép trạng thái nội bộ?
    readmeRelated:
      anchorList:
      - class-006
      - encapsulation-006
      - refactoring-005
      - practice-002
    knowledge: 'Representation exposure: caller chỉnh cùng List qua getter; trả snapshot/read-only phù hợp và có API mutation
      có guard.'
    answer: |-
      Getter trả **List mutable nội bộ** gây representation exposure: caller có cùng reference tới container và có thể add/remove/clear mà không qua các hành vi có validation.

      Ví dụ Cart không cho sửa sau checkout và chỉ chấp nhận quantity dương. Nếu getItems() trả thẳng ArrayList, caller có thể clear() sau checkout, làm sai total hoặc bỏ qua audit. Quy tắc giỏ hàng bị phá từ ngoài.

      Cách bảo vệ đơn giản:

          class Cart {
            private final List<String> items = new ArrayList<>();
            List<String> items() { return List.copyOf(items); }
            void add(String value) {
              if (value == null || value.isBlank())
                throw new IllegalArgumentException();
              items.add(value);
            }
          }

      List.copyOf trả một container không cho sửa và có nội dung tại thời điểm tạo snapshot. Caller gọi clear() trên kết quả sẽ bị từ chối; muốn sửa phải gọi Cart.add hoặc Cart.remove có guard. Cần import java.util.List và java.util.ArrayList trong ví dụ.

      **Giới hạn quan trọng:** snapshot của List không có nghĩa các phần tử bên trong bất biến. Nếu item là mutable object, caller có thể sửa nó qua reference; dùng immutable item, DTO hoặc defensive copy thích hợp. Collections.unmodifiableList(items) chỉ là read-only live view và có thể phản ánh sửa đổi của List nguồn.

      Test việc thay đổi container và item bên trong để chứng minh mức độ bảo vệ cụ thể.
  - question: Unmodifiable view, immutable snapshot, shallow copy và deep copy khác nhau khi bảo vệ representation ra sao?
    readmeRelated:
      anchorList:
      - object-006
      - encapsulation-006
      - encapsulation-007
      - refactoring-005
    knowledge: Unmodifiable view có thể phản chiếu thay đổi nguồn; snapshot tách container; shallow copy không copy phần tử
      mutable.
    answer: |-
      Cần phân biệt bốn mức bảo vệ representation:

      - **Unmodifiable view:** Collections.unmodifiableList(source) chặn sửa qua view, nhưng source thay đổi thì view có thể thấy thay đổi. Nó không làm các phần tử immutable.
      - **Immutable snapshot container:** List.copyOf(source) cho List không chỉnh sửa được, không phản ánh thay đổi cấu trúc source sau thời điểm copy. Các reference tới item mutable vẫn được chia sẻ.
      - **Shallow copy:** new ArrayList<>(source) sao chép cấu trúc List nhưng giữ cùng reference tới từng item. Có thể sửa List mới, nhưng sửa nội dung item có thể tác động cả hai danh sách.
      - **Deep copy:** nhân bản những thành phần mutable thuộc phạm vi ownership cần tách, gồm nested objects. Phải xử lý shared identity, cycles và các thành phần không thể copy, chứ không chỉ gọi clone().

      Ví dụ source chứa MutableItem("A"), view=unmodifiableList(source), snap=List.copyOf(source). Sau source.add(item2), view thấy item2 còn snap không. Sau item1.setName("B"), cả view và snap đều thấy "B" vì cùng reference item1.

      Lựa chọn dựa vào contract: live view cho trạng thái luôn cập nhật, snapshot cho danh sách tại thời điểm, deep copy/immutable value objects khi cần tách luôn nested state. Test thay đổi **container** và **element** riêng, tránh khẳng định nhầm List.copyOf là deep copy.
  - question: Trong trường hợp nào object nên cung cấp hành vi nghiệp vụ thay vì trả dữ liệu cho service quyết định?
    readmeRelated:
      anchorList:
      - encapsulation-008
      - class-design-007
      - class-design-009
      - design-pitfalls-003
      - refactoring-004
    knowledge: Đưa quy tắc gắn với state và dữ liệu về object owner; service chỉ điều phối giao dịch/hạ tầng khi cần.
    answer: |-
      Khi quyết định nghiệp vụ dựa chủ yếu trên state của một object, đặt nó tại **object sở hữu state** để bảo vệ invariant ở một nơi. Đây là tinh thần Tell, Don't Ask: yêu cầu object thực hiện hành vi thay vì service kéo dữ liệu ra, tự tính toán rồi gán lại.

      Ví dụ nhiều controller đều đọc Order.paid, Order.status, rồi tự gọi setStatus(SHIPPED). Khi thêm điều kiện tồn kho, controller nào quên cập nhật sẽ cho phép ship sai. Với Order.ship(), precondition và state transition nằm ở một owner và mọi caller chịu cùng quy tắc.

      Tuy nhiên không nên dồn hết logic vào entity:
      - **Entity/value object** nắm hành vi bảo vệ state/invariant của chính nó.
      - **Application service** điều phối use case, authorization, transaction, repository, gateway và external effect.
      - **Domain service** dành cho business rule liên quan nhiều entity hoặc không gắn tự nhiên với một owner.
      - **Query/DTO** trả dữ liệu read-only cho UI/report, không nhất thiết có hành vi domain.

      Đặt câu hỏi: ai sở hữu dữ liệu? ai phải luôn đảm bảo invariant? việc sửa quy tắc này có khiến nhiều caller lặp kiểm tra? Nếu owner rõ, đưa hành vi về owner. Nếu rule vượt aggregate hay yêu cầu hạ tầng, để service điều phối nhưng vẫn gọi những command domain đã kiểm soát mutation.
  - question: Làm sao tổ chức validation và mutation để giữ invariant khi có nhiều entry point cùng sử dụng một object?
    readmeRelated:
      anchorList:
      - lifecycle-002
      - encapsulation-002
      - encapsulation-005
      - class-design-007
      - testing-003
      - practice-002
    knowledge: Đặt invariant tại domain public methods/constructor, gom mutation paths; test cả đường hợp lệ, lỗi và các entry
      point.
    answer: |-
      Web, mobile, batch và message consumer dễ triển khai validation khác nhau nếu mỗi entry point tự giữ quy tắc. Cần một **đường mutation thống nhất**:

      1. Constructor/factory validate trạng thái ban đầu, không publish object thiếu required invariant.
      2. Field mutable là private; expose command như pay(), ship(), cancel() hoặc changeAddress() thay vì setter vô điều kiện.
      3. Mỗi command kiểm precondition trước commit, bảo đảm postcondition và giữ nguyên state nếu từ chối.
      4. Boundary vẫn validate request để có lỗi thân thiện nhưng gọi cùng domain behavior, không copy quy tắc vào từng controller/job.
      5. Repository/ORM phải bảo đảm persisted state không bỏ qua invariant; DB constraint hữu ích như lớp phòng vệ.
      6. Cross-aggregate mutation và xử lý nhiều request đồng thời cần transaction, optimistic locking, synchronization hoặc cơ chế consistency thích hợp.
      7. Test trực tiếp domain và qua mỗi entry point: đường hợp lệ, input bất hợp lệ, transition sai, concurrent update, rollback khi failure.

      Ví dụ Booking.cancel() từ web/mobile/batch đều đi qua cùng domain method, từ chối nếu vé đã sử dụng; service phụ trách authorization, lưu và thông báo. Invariant không bị phụ thuộc vào việc request đến từ UI nào.

      Đừng lẫn **input validation** với **domain invariant**: boundary có thể khác cách báo lỗi, nhưng không được tạo ra state nghiệp vụ trái cùng một hợp đồng.
- groupID: 4
  groupName: Abstraction và hợp đồng
  questions:
  - question: Abstraction giúp tách một hợp đồng nghiệp vụ khỏi implementation cụ thể như thế nào?
    readmeRelated:
      anchorList:
      - abstraction-003
      - abstraction-008
      - interface-001
      - interface-003
      - class-design-004
      - solid-006
    knowledge: Ổn định contract theo mục tiêu nghiệp vụ; implementation được thay thế sau interface/port, giảm rò rỉ chi tiết
      vendor.
    answer: |-
      **Abstraction** mô tả điều hệ thống cần làm và những bảo đảm nó cung cấp, không bắt client biết cơ chế thực hiện. Một hợp đồng nghiệp vụ tốt dùng tên, tham số, kết quả và lỗi thuộc ngôn ngữ domain; implementation phụ thuộc hạ tầng nằm phía sau adapter.

      Ví dụ CheckoutService cần thu tiền, nên phụ thuộc một port PaymentGateway với hành vi charge(payment) trả Receipt. StripeAdapter và BankAdapter tự chuyển request, lỗi và response của từng SDK về contract chung. Khi đổi provider, service không cần import class SDK hay kiểm tra subtype; điểm khởi tạo ứng dụng chọn adapter phù hợp.

      Sự tách biệt có ba phần:
      1. **Contract:** định nghĩa precondition (số tiền dương, đơn vị tiền hợp lệ), postcondition (Receipt biểu diễn kết quả thành công) và lỗi có ý nghĩa.
      2. **Implementation:** gọi REST/SDK, mapping DTO, retry phù hợp, logging và bảo vệ secret bên trong adapter.
      3. **Dependency direction:** phần nghiệp vụ phụ thuộc port, adapter phụ thuộc port; việc nối chúng do composition root/DI làm.

      Không nên đưa vendor-specific response, access token hoặc kiểu exception SDK trực tiếp vào chữ ký port, vì như thế client vẫn phụ thuộc chi tiết kỹ thuật. Đổi nhà cung cấp không mặc nhiên chỉ sửa một file: contract vẫn phải được rà soát nếu nghiệp vụ của provider mới khác. Abstraction có ích khi boundary cần thay thế hoặc kiểm thử độc lập, chứ không phải mọi concrete class đều phải có interface.
  - question: Khi nào nên dùng interface, abstract class hoặc concrete class trong Java?
    readmeRelated:
      anchorList:
      - abstraction-005
      - abstraction-006
      - abstraction-007
      - interface-005
      - composition-004
    knowledge: Interface cho role/đa implementation, abstract class cho state/hành vi chung, concrete class khi chưa cần extension.
    answer: |-
      Trong Java, lựa chọn dựa trên **hợp đồng cần mở rộng** và **state/logic cần chia sẻ**, không theo quy tắc “mỗi class phải có interface”.

      - **Interface:** thích hợp mô tả role/capability như PaymentGateway, Runnable, Comparable. Một class implement nhiều interface; client có thể phụ thuộc contract mà không biết concrete type. Interface có abstract, default, static và private helper methods theo giới hạn Java, nhưng không có instance fields riêng như abstract class.
      - **Abstract class:** thích hợp khi các subtype thực sự thuộc cùng family, cần chia sẻ protected state, constructor, hoặc thuật toán skeleton ổn định. Nó có constructor, instance fields và concrete/abstract instance methods. Java chỉ extends một class nên quan hệ kế thừa tạo coupling mạnh hơn.
      - **Concrete class:** đơn giản và trực tiếp khi chưa có nhu cầu thay thế/extension, hoặc implementation chính là contract đủ ổn định.

      Ví dụ một domain Money immutable không cần IMoney và AbstractMoney. Ngược lại, PaymentGateway là port tốt vì có thể có SQL-free fake, ngân hàng A và ngân hàng B. Một hierarchy các parser chung quy tắc đọc/đóng tài nguyên có thể có abstract base nếu thật sự chia sẻ lifecycle; composition cũng là lựa chọn.

      Trade-off: interface không tự bảo đảm LSP; abstract class dễ thành fragile base khi subclass phụ thuộc hook và thứ tự khởi tạo; concrete class không làm code kém testable nếu trách nhiệm rõ. Ưu tiên contract nhỏ, ownership rõ và bằng chứng về biến thể thực, thay vì tạo tầng trung gian vì dự đoán.
  - question: Interface thể hiện một capability hay role có lợi gì so với interface chứa quá nhiều method?
    readmeRelated:
      anchorList:
      - interface-006
      - polymorphism-008
      - solid-005
      - design-pitfalls-006
    knowledge: 'Interface Segregation: chia contract theo capability/client, không buộc class implement phương thức không
      hỗ trợ.'
    answer: |-
      Một **capability/role interface** nói rõ client được quyền yêu cầu điều gì. Interface quá rộng bắt implementor thực hiện những method không phù hợp, tạo no-op, null hoặc UnsupportedOperationException, khiến caller phải biết subtype để tránh lỗi.

      Ví dụ MultiFunctionDevice định nghĩa print(), scan(), fax(). Một máy in đơn năng chỉ hỗ trợ print() nhưng vẫn bị buộc khai báo scan()/fax(); client kiểu Printer không hề cần các phương thức dư đó. Tách Printable, Scannable, Faxable cho phép máy in implement Printable, máy đa chức năng implement cả ba. Một PrinterService chỉ nhận Printable, nên không phụ thuộc thay đổi ở scan/fax.

      Đây là **Interface Segregation Principle (ISP)**: client không bị ép phụ thuộc vào khả năng không sử dụng. Lợi ích là contract trung thực, dễ mock/fake theo role, giảm coupling và tránh subtype vi phạm hậu điều kiện bằng cách ném unsupported cho thao tác được interface hứa hẹn.

      Tuy nhiên, interface quá nhỏ cũng có chi phí: số type tăng, API phức tạp và việc phối hợp role có thể rườm rà. Không cần một interface cho từng method bất kể ngữ nghĩa. Nên nhóm những hành vi luôn cùng thay đổi, phục vụ một vai trò có nghĩa; chia khi tập client thực sự có nhu cầu khác nhau hoặc implementation không cùng hỗ trợ hợp đồng. Capability không chỉ là phương thức kỹ thuật mà còn phải có semantics nhất quán.
  - question: Abstract method, concrete method và default method khác nhau ở khả năng thực thi và ghi đè thế nào?
    readmeRelated:
      anchorList:
      - abstraction-005
      - interface-007
      - polymorphism-007
    knowledge: Abstract yêu cầu triển khai; concrete/default có body; default interface method có quy tắc ưu tiên và override
      riêng.
    answer: |-
      **Abstract method** chỉ khai báo hợp đồng mà chưa có thân hàm; subclass concrete hoặc class implement interface phải cung cấp implementation, trừ khi bản thân lớp vẫn abstract. **Concrete method** có thân hàm, có thể được thừa kế và override khi không bị final/private/static hạn chế. **Default method** là instance method có thân hàm trong interface, hỗ trợ hành vi mặc định và tiến hóa API nhưng có quy tắc phân giải riêng.

      Ví dụ:
          interface Greeting {
            String name(); // abstract
            default String greet() { return "Hello " + name(); }
          }
          class UserGreeting implements Greeting {
            public String name() { return "An"; }
            // thừa kế greet(), hoặc override để thay hành vi
          }

      Đối với abstract class, có thể vừa có instance fields/constructor vừa chứa abstract method và concrete method. Một concrete subclass phải triển khai các abstract methods còn lại. Với interface, abstract methods mặc định là public; implementation phải giữ public visibility.

      **Quy tắc cần nhớ:** instance method của class có ưu tiên so với interface default; default từ interface cụ thể hơn có thể thắng default ở superinterface; hai default không liên quan và cùng chữ ký thường buộc class override. Các method static/private của interface không được override theo cùng cơ chế; private interface helper không phải API public. Không thể định nghĩa default method thay thế public instance method của Object như equals/hashCode/toString.

      Chọn default method khi có ngữ nghĩa an toàn áp dụng cho mọi implementation; không lợi dụng nó để chèn state hoặc giả định tất cả subtype có cùng capability.
  - question: Thêm default method vào interface có thể gây những vấn đề source compatibility hoặc xung đột nào?
    readmeRelated:
      anchorList:
      - interface-007
      - inheritance-008
      - polymorphism-006
    knowledge: Source/binary compatibility khi mở rộng interface, xung đột default từ nhiều superinterface và thay đổi semantics.
    answer: |-
      Thêm default method vào interface giúp **giữ source của nhiều implementation cũ không phải khai báo method mới** và thường có lợi về tương thích nhị phân. Tuy nhiên nó **không bảo đảm mọi trường hợp đều source-compatible, binary-compatible hoặc giữ nguyên hành vi**.

      Các rủi ro cụ thể:
      1. **Xung đột inheritance:** một class implement hai interface độc lập; sau khi cả hai có default cùng chữ ký, việc biên dịch lại có thể lỗi nếu không override để phân giải. Với class đã biên dịch, một lời gọi method liên quan có thể gặp lỗi linkage như IncompatibleClassChangeError trong trường hợp conflict.
      2. **Thay đổi method resolution:** method của class có ưu tiên, default từ superinterface cụ thể hơn có thể thắng; code vốn dựa vào overload/inherited method cần được kiểm tra.
      3. **Thay đổi semantics:** thêm một hành vi mặc định hợp lệ cú pháp nhưng không đúng cho mọi implementor, ví dụ retry tự động có thể gây side effect lặp ở hệ thống thanh toán.
      4. **API contract chưa rõ:** default return null, trả giá trị giả hoặc ném UnsupportedOperationException khi interface đã hứa hành vi thật sẽ làm client hiểu sai.

      Biện pháp: thiết kế default có nghĩa chung và pre/postcondition được mô tả; kiểm compile source đối với các implementation, chạy regression/contract tests cho nhiều subtype, kiểm tra call sites quan trọng và hỗ trợ override khi biến thể khác nhau. Đừng gọi thêm default method là “không phá tương thích” theo nghĩa tuyệt đối.
  - question: Java giải quyết xung đột default method từ hai interface theo quy tắc nào?
    readmeRelated:
      anchorList:
      - interface-007
      - inheritance-008
      - polymorphism-006
    knowledge: Class method thắng default; interface cụ thể hơn ưu tiên; hai default ngang hàng phải override để phân giải.
    answer: |-
      Java giải quyết các default methods bằng thứ tự ưu tiên về **quan hệ kế thừa**:

      1. **Class wins:** một instance method phù hợp thừa kế từ class/superclass có ưu tiên trước interface default. Không sử dụng default để âm thầm thay method của class.
      2. **More specific interface wins:** nếu interface Child extends Parent và cung cấp override của default method, implementation nhận method ở Child thay vì Parent khi không có method class ưu tiên.
      3. **Hai default ngang hàng:** nếu một class implement hai interface độc lập, cả hai cung cấp default cùng signature, class phải override để phân giải (trừ những tình huống đã được class hoặc interface cụ thể hơn xử lý).

      Ví dụ:
          interface A { default String label() { return "A"; } }
          interface B { default String label() { return "B"; } }
          class Both implements A, B {
            @Override public String label() {
              return A.super.label() + "/" + B.super.label();
            }
          }

      Both tự quyết định contract: chọn một default, kết hợp chúng hoặc viết implementation mới. Cú pháp A.super.label() hợp lệ khi gọi một superinterface thích hợp từ lớp đang implement; không thể dùng tùy tiện qua mọi mức hierarchy.

      Chú ý abstract class method có thể chặn việc dựa vào default tương ứng; một concrete class có thể phải cung cấp implementation để thỏa hợp đồng. Quy tắc giải quyết xung đột giúp compiler biết gọi method nào, nhưng không thay việc kiểm tra **ngữ nghĩa** của các default có nhất quán với yêu cầu nghiệp vụ hay không.
  - question: Bạn định nghĩa hợp đồng method như thế nào về precondition, postcondition, null và exception?
    readmeRelated:
      anchorList:
      - class-005
      - object-008
      - abstraction-003
      - abstraction-004
      - interface-008
      - subtyping-007
      - language-mechanics-008
      - testing-001
      - solid-004
    knowledge: Định nghĩa pre/postconditions, nullability, side effects và exception contract; bảo đảm tính thay thế của subtype.
    answer: |-
      Một hợp đồng method đáng tin cậy mô tả **điều kiện trước**, **bảo đảm sau** và **tình huống lỗi**, không chỉ Java signature.

      - **Precondition:** tham số, miền giá trị, trạng thái object trước lời gọi. Ví dụ withdraw(amount) yêu cầu amount > 0 và balance >= amount; nếu không đúng thì thao tác bị từ chối.
      - **Postcondition:** sau thành công, balance giảm đúng amount, invariant balance >= 0 vẫn giữ, kết quả trả về có ý nghĩa rõ.
      - **Nullability:** quy định input có cho null hay không, output có thể null không; dùng Optional cho “không tìm thấy” nếu phù hợp nhưng không lạm dụng cho mọi field.
      - **Exceptions:** phân biệt input sai, nghiệp vụ bị từ chối và lỗi hạ tầng; định nghĩa type/semantics, liệu state có thay đổi trước khi throw hay không.
      - **Side effects/concurrency:** ghi nhận thay đổi dữ liệu, transaction scope, idempotency và tính nhất quán nếu có.

      Ví dụ PaymentGateway.charge(amount) nên có contract rõ về tiền tệ, duplicate request, trạng thái receipt và outcome khi timeout. Timeout không thể mặc nhiên hiểu “thanh toán thất bại”; có thể phải tra trạng thái qua idempotency key.

      Theo **Liskov Substitution Principle**, implementation/subclass không được âm thầm tăng precondition, làm yếu postcondition hoặc phá invariant so với contract. Contract tests với cả happy path và invalid/failure paths bảo đảm mọi adapter giữ cùng ý nghĩa, kể cả khi SDK bên dưới khác nhau.
  - question: Vì sao cùng chữ ký method chưa bảo đảm hai implementation tuân thủ cùng một hợp đồng ngữ nghĩa?
    readmeRelated:
      anchorList:
      - abstraction-004
      - interface-008
      - subtyping-007
      - solid-004
      - testing-004
      - testing-005
    knowledge: Behavioral contract khác chữ ký; hậu điều kiện, invariants và lỗi thống nhất, dùng contract test cho các implementation.
    answer: |-
      **Cùng tên, tham số và return type** chỉ bảo đảm các implementation tương thích ở mức kiểu, không bảo đảm chúng có **behavioral contract** giống nhau. Client dùng interface chỉ thật sự được thay implementation nếu kết quả và tác động có ý nghĩa thống nhất.

      Ví dụ interface Repository.findById(id) trả User. Implementation A trả null khi không tìm thấy, B ném NotFoundException, C trả User rỗng. Cùng chữ ký nhưng các client cần ba cách xử lý, nên abstraction không che được implementation và có thể gây sai nghiệp vụ.

      Một hợp đồng rõ hơn có thể là Optional<User> findById(Id id): ID hợp lệ nhưng vắng mặt trả Optional.empty(); ID null/invalid bị từ chối theo quy tắc thống nhất; lỗi kết nối DB/network không biến thành empty. Cũng phải thống nhất read-your-writes, side effects và exception safety khi ứng dụng phụ thuộc những điều đó.

      **Cách chứng minh:** tạo test suite dùng lại cho từng adapter (in-memory, SQL, remote). Các test dùng cùng valid ID, missing ID, invalid input, simulated storage failure; kiểm tra postcondition, error contract, nullability và trạng thái sau failure. Nếu một implementation không đạt, sửa adapter/mapping hoặc xem xét tách interface có hợp đồng khác, thay vì để caller cast/type-check.

      Đây là khác biệt giữa structural/nominal typing và **LSP**. Chữ ký cần nhưng chưa đủ; contract ngữ nghĩa mới là cơ sở thay thế implementation.
  - question: Khi nào interface chỉ có một implementation vẫn hữu ích để tách module hoặc test boundary?
    readmeRelated:
      anchorList:
      - abstraction-003
      - interface-009
      - composition-006
      - solid-006
      - design-pitfalls-006
      - testing-007
    knowledge: Interface hữu ích tại ranh giới module/port, fake test hoặc extension dự kiến có căn cứ, dù chỉ một adapter
      hiện tại.
    answer: |-
      Chỉ có một concrete implementation **không tự động khiến interface vô dụng**. Interface có thể là **boundary của kiến trúc**, nơi policy cấp cao không muốn phụ thuộc hạ tầng cụ thể, hoặc là điểm thay thế cần thiết khi kiểm thử.

      Ví dụ BillingService phải tạo hóa đơn và lưu lại. BillingService phụ thuộc InvoiceRepository port trong domain/application module; ProductionInvoiceRepository dùng JPA hoặc JDBC. Trong unit test, một fake repository lưu dữ liệu trong bộ nhớ cho phép kiểm invoice rules mà không mở DB. Dù hiện production chỉ có một adapter, dependency direction được giữ ổn định và không lộ framework persistence vào domain.

      Một Clock/TimeProvider port cũng có giá trị nếu bài toán tính deadline phụ thuộc thời gian: fake clock giúp test biên ngày giờ một cách xác định. Với external PaymentGateway, test seam còn giúp tránh gọi mạng và phát sinh giao dịch thật.

      **Điều kiện hợp lý:** boundary có khác biệt rõ, khả năng thay backend thực hoặc test isolation mang lợi ích cụ thể, interface thể hiện capability nghiệp vụ ổn định. Không cần interface giả cho một Money value object, lớp mapper thuần hay một class không có collaborator khó thay. Các fake cũng phải chạy contract tests để không mô phỏng sai production. Abstraction nên nằm phía domain client cần nó, không phải luôn nằm trong package của vendor adapter.
  - question: Những dấu hiệu nào cho thấy một abstraction được tạo quá sớm và làm code khó hiểu hơn?
    readmeRelated:
      anchorList:
      - abstraction-007
      - solid-008
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-008
    knowledge: Nhận diện speculative generality, factory/interface một-một không có giá trị, quá nhiều delegation và YAGNI.
    answer: |-
      Dấu hiệu **premature abstraction/speculative generality** là dựng nhiều lớp, interface và factory cho các biến thể chỉ đang được tưởng tượng, thay vì giải quyết điểm thay đổi thực.

      Một số dấu hiệu:
      - Một interface luôn đi kèm đúng một class và không cô lập boundary/test seam hữu ích.
      - Factory chỉ new một concrete class, qua nhiều layer forwarding không mang thêm invariant hoặc behavior.
      - Những type name như GenericProcessor, BaseManager, AbstractHandler không thể giải thích bằng trách nhiệm nghiệp vụ.
      - Cứ thêm chức năng nhỏ là phải sửa một loạt registry/config/wiring; đọc luồng xử lý phải nhảy qua nhiều lớp không cung cấp giá trị.
      - Các implementation phải cast ngược hoặc ném UnsupportedOperationException vì contract quá chung, trái ISP/LSP.

      **Cách đánh giá:** chọn một yêu cầu thay đổi đã xảy ra hoặc có xác suất cao, đo nơi phải sửa và các contract thật sự cần giữ. Nếu một hàm cụ thể và một test đủ giải quyết vấn đề, chưa cần ba tầng Strategy/Factory. Khi variation lặp lại và ranh giới trở nên rõ, có thể refactor sang interface với characterization tests giữ nguyên behavior.

      KISS/YAGNI không có nghĩa “không bao giờ trừu tượng hóa”: boundary giữa domain và external SDK/DB đáng tạo sớm khi rủi ro phụ thuộc thật. Cũng không có quy tắc cứng “phải đợi đúng ba implementation”; quyết định dựa vào cohesion, change impact, semantic contract và chi phí vận hành.
- groupID: 5
  groupName: Inheritance và subtype
  questions:
  - question: Quan hệ is-a và has-a khác nhau như thế nào khi chọn inheritance hay composition?
    readmeRelated:
      anchorList:
      - inheritance-001
      - subtyping-002
      - composition-002
      - composition-004
      - solid-004
      - practice-004
    knowledge: '`is-a` yêu cầu substitutability theo hành vi; `has-a` là quan hệ cộng tác/delegation, thường ít ràng buộc
      hơn.'
    answer: |-
      **is-a vs has-a.** Inheritance (extends) biểu diễn quan hệ thay thế: mọi object của subclass phải thực hiện được những operation mà client của superclass trông đợi, giữ precondition, postcondition, invariant và lỗi đã công bố. Composition biểu diễn một object **có** collaborator và ủy quyền, không khẳng định object đó là một subtype của collaborator. Ví dụ Car có Engine, không phải Engine; Checkout có một PricingPolicy để tính phí, không phải một PricingPolicy.

      ~~~java
      interface ShippingPolicy { long fee(long cents); }
      final class FixedShipping implements ShippingPolicy {
          public long fee(long cents) {
              if (cents < 0) throw new IllegalArgumentException();
              return 2500;
          }
      }
      final class Checkout {
          private final ShippingPolicy shipping;
          Checkout(ShippingPolicy shipping) {
              this.shipping = java.util.Objects.requireNonNull(shipping);
          }
          long total(long cents) {
              if (cents < 0) throw new IllegalArgumentException();
              return Math.addExact(cents, shipping.fee(cents));
          }
      }
      ~~~

      FixedShipping có thể thay vào client cần ShippingPolicy theo đúng contract; Checkout chỉ cộng tác với policy. Đây là ví dụ thiết kế, chưa phải chương trình được compile/test.

      **Trade-off:** kế thừa tiện cho hierarchy đúng về is-a, kế thừa state/implementation và dynamic dispatch, nhưng subclass bị ràng buộc vào cách base thiết kế và vòng đời của nó. Composition tạo thêm collaborator/wiring nhưng cho phép hoán đổi chính sách độc lập và ít phụ thuộc protected state. Không nhầm has-a với UML composition ownership mạnh: một reference tới service được inject có thể chỉ là association; lifecycle của service không nhất thiết do Checkout sở hữu. Chọn dựa trên ý nghĩa nghiệp vụ và khả năng thay thế, không vì extends giúp tránh viết vài dòng.
  - question: Vì sao kế thừa chỉ để tái sử dụng code có thể dẫn tới subtype không hợp lệ?
    readmeRelated:
      anchorList:
      - subtyping-001
      - subtyping-007
      - composition-004
      - composition-008
      - design-pitfalls-004
    knowledge: Code reuse không chứng minh subtype; subclass phải bảo toàn behavior contract, tránh inheritance chỉ để lấy
      method.
    answer: |-
      **Code reuse không đủ chứng minh subtype.** Java compiler kiểm tra extends/override theo cú pháp, không chứng minh hành vi của subclass thỏa hợp đồng superclass. Nếu base cam kết hỗ trợ write() nhưng subclass từ chối, caller dùng base bị phá vỡ.

      ~~~java
      class WritableStore {
          public void save(String value) {
              if (value == null) throw new IllegalArgumentException();
              // Persist value theo contract.
          }
      }
      final class ReadOnlyStore extends WritableStore {
          @Override public void save(String value) {
              throw new UnsupportedOperationException("Read-only");
          }
      }
      ~~~

      Một client nhận WritableStore và gọi save("A") trên input hợp lệ sẽ thất bại nếu object thực tế là ReadOnlyStore. Cả hai vẫn tương thích method signature, nhưng không tương thích **Liskov Substitution Principle**. Ví dụ này là minh họa logic, không khẳng định các comment persist đã được triển khai.

      **Phương án:** tách interface ReadableStore và WritableStore theo capability; read-only chỉ implement đọc. Nếu mục tiêu chỉ dùng lại hàm format, hãy chứa một Formatter collaborator và delegate, thay vì cho Report extends Formatter khi Report không phải một Formatter. Abstract superclass chỉ thích hợp nếu is-a thật, có invariant và extension point được thiết kế ổn định.

      **Cách rà soát:** viết contract tests chung áp dụng cho mọi implementation để kiểm success, invalid input, exception, state transition, side effects và các ca biên. Nếu subtype phải siết điều kiện đầu vào hoặc ném UnsupportedOperationException ở operation base hứa hỗ trợ, hierarchy cần thiết kế lại; không giải quyết bằng việc thêm catch ở mọi client.
  - question: Liskov Substitution Principle yêu cầu điều gì ở precondition, postcondition và invariant của subclass?
    readmeRelated:
      anchorList:
      - abstraction-004
      - subtyping-007
      - solid-004
      - testing-005
    knowledge: 'LSP: không tăng precondition, không giảm postcondition, giữ invariant/exception semantics cho mọi lời gọi
      qua supertype.'
    answer: |-
      **LSP bảo toàn những điều client của base được phép giả định.** Subtype không được siết precondition (từ chối input base chấp nhận), không được làm yếu postcondition (trả kết quả ít bảo đảm hơn), không được phá invariant hay đổi lỗi/side effect một cách trái contract. Subtype được phép bổ sung hậu điều kiện mạnh hơn hoặc nhận phạm vi input rộng hơn nếu vẫn giữ quy tắc của base.

      ~~~java
      interface Discount {
          // Pre: subtotal >= 0.
          // Post: 0 <= discount <= subtotal.
          long amount(long subtotal);
      }
      final class BrokenDiscount implements Discount {
          @Override public long amount(long subtotal) {
              if (subtotal < 1000) {
                  throw new IllegalArgumentException("Too small");
              }
              return subtotal + 1;
          }
      }
      ~~~

      BrokenDiscount siết input từ mọi subtotal không âm thành chỉ từ 1000, đồng thời trả discount lớn hơn subtotal. Class compile được nhưng không thể thay thế Discount theo contract. Với số long cực lớn, phép cộng còn có thể overflow.

      **Exception semantics:** Java không cho override mở rộng checked exception ngoài giới hạn kiểu checked của method cha, nhưng một unchecked RuntimeException vẫn có thể bị ném. Vì thế đáp ứng quy tắc throws của compiler chưa đủ chứng minh LSP. Một method vốn hứa trả kết quả trên input hợp lệ mà bất ngờ ném UnsupportedOperationException là thay đổi behavior.

      **QA:** ghi rõ pre/postcondition, nullable contract, side effects, order và failure paths; chạy chung contract tests cho các subtype với giá trị 0, 1, biên nhỏ/lớn, lỗi và chuỗi thao tác. Không cần mọi subtype cho cùng kết quả tuyệt đối; các kết quả khác nhau đều hợp lệ nếu nằm trong những bảo đảm mà base công bố.
  - question: Bạn giải thích vấn đề Rectangle và Square khi cả hai đều mutable như thế nào?
    readmeRelated:
      anchorList:
      - subtyping-008
      - solid-004
      - testing-005
      - practice-004
    knowledge: Mutable Square đổi cả width/height khi setWidth vi phạm contract Rectangle; cân nhắc Shape abstraction hoặc
      immutable model.
    answer: |-
      **Rectangle–Square là phản ví dụ phụ thuộc tính mutable của API.** Giả sử Rectangle có hai setter độc lập: setWidth chỉ đổi width, giữ nguyên height; setHeight chỉ đổi height, giữ width. Một Square muốn giữ width == height phải đổi cả hai chiều khi setter một chiều được gọi, từ đó vi phạm postcondition Rectangle.

      ~~~java
      class Rectangle {
          protected int width, height;
          Rectangle(int w, int h) { width = w; height = h; }
          public void setWidth(int w) { width = w; }
          public void setHeight(int h) { height = h; }
          public int area() { return width * height; }
      }
      final class Square extends Rectangle {
          Square(int side) { super(side, side); }
          @Override public void setWidth(int side) {
              width = side;
              height = side;
          }
          @Override public void setHeight(int side) {
              width = side;
              height = side;
          }
      }
      ~~~

      Client hợp lệ dùng Rectangle có thể gọi setHeight(5), setWidth(4) rồi kỳ vọng area() == 20. Với Square, lần setWidth(4) thay luôn height thành 4 nên area() == 16. Điều này phá contract hành vi dù Square là Rectangle theo toán hình học.

      **Thiết kế lại:** hai class có thể cùng implement Shape chỉ cung cấp area() và bất kỳ operation chung nào giữ được semantics; dùng immutable Rectangle và Square value objects, trả instance mới qua thao tác tạo thay vì bắt Square nhận setter độc lập. Không cần ép Square extends mutable Rectangle. Với code production, bổ sung validation độ dài không âm và chống overflow; ví dụ tập trung vào LSP chứ chưa triển khai các kiểm tra đó. LSP dựa trên contract người dùng của API, không chỉ định nghĩa hình học.
  - question: Trong Java, method overriding khác method overloading về thời điểm lựa chọn method ra sao?
    readmeRelated:
      anchorList:
      - inheritance-004
      - polymorphism-003
      - polymorphism-005
    knowledge: Overload chọn compile-time theo kiểu tham số/tham chiếu; overridden instance method chọn theo runtime class.
    answer: |-
      **Overloading chọn tại compile time; overriding dispatch ở runtime.** Overload là nhiều method cùng tên nhưng tham số khác nhau; compiler chọn chữ ký dựa trên *kiểu tĩnh* của đối số và quy tắc applicability, specificity, widening, boxing, varargs. Override là subclass cung cấp implementation của instance method đã chọn; Java chọn phần thân dựa trên class thực tế của receiver khi gọi.

      ~~~java
      class Parent {
          String show(Object o) { return "Parent-Object"; }
          String show(String s) { return "Parent-String"; }
      }
      class Child extends Parent {
          @Override String show(Object o) { return "Child-Object"; }
      }
      class Example {
          static void demo() {
              Parent receiver = new Child();
              Object x = "text";
              System.out.println(receiver.show(x));      // Child-Object.
              System.out.println(receiver.show("text")); // Parent-String.
          }
      }
      ~~~

      Với x có kiểu khai báo Object, compiler chọn show(Object); runtime dispatch tới Child override. Với literal String, compiler chọn show(String); Child không override chữ ký này nên kế thừa Parent implementation. String là kiểu runtime của x không khiến Java tự chọn overload String.

      **Edge case:** gọi f(null) khi có overload f(String) và f(Integer) có thể mơ hồ; cần cast để chọn ý định. Static method bị hiding chứ không virtual override; field access dựa trên kiểu tham chiếu; private method và constructor không override. Dùng @Override để compiler phát hiện method không thực sự override, nhất là khi tham số bị thay đổi vô tình. Cùng chữ ký vẫn cần test behavior contract riêng.
  - question: Subclass có thể thay đổi visibility, kiểu trả về và checked exception của method override đến mức nào?
    readmeRelated:
      anchorList:
      - class-004
      - inheritance-004
      - polymorphism-005
      - language-mechanics-008
    knowledge: Không giảm visibility khi override, return type covariant hợp lệ, không thêm/bổ rộng checked exceptions.
    answer: |-
      **Quy tắc override của Java.** (1) **Visibility không được giảm**: protected của base có thể giữ protected hoặc tăng public; public bắt buộc giữ public. (2) **Return type** với reference có thể covariant, ví dụ Number thành Integer; primitive phải phù hợp quy tắc kiểu, không tùy ý đổi int sang long. (3) **Checked exceptions** không được thêm hay mở rộng ngoài contract của method base; có thể dùng checked exception hẹp hơn hoặc không throws. (4) Final instance method không override; static method bị hiding; private method và constructors không override.

      ~~~java
      import java.io.*;
      class Base {
          protected Number load() throws IOException { return 1; }
      }
      final class Derived extends Base {
          @Override public Integer load() throws FileNotFoundException {
              return 2;
          }
      }
      ~~~

      Derived hợp lệ vì visibility rộng hơn, reference return subtype và checked exception hẹp hơn. Một method trả String thay Number không hợp lệ; đổi throws thành Exception rộng hơn IOException cũng bị compiler từ chối.

      **Điều compiler chưa bảo vệ:** unchecked exceptions có thể đổi hành vi trên input base vốn cam kết chấp nhận; subtype vẫn có thể phá postcondition, nullability, side effects hoặc invariant dù code compile. Overriding trong generic hierarchy còn liên quan erasure và bridge methods; nếu thấy name clash, phải xét kiểu sau erasure. Dùng @Override, API docs và contract tests chung để bảo vệ cả cú pháp lẫn semantics thay thế.
  - question: Fragile base class xảy ra khi nào và vì sao việc thay đổi superclass có thể phá vỡ subclass?
    readmeRelated:
      anchorList:
      - inheritance-010
      - polymorphism-004
      - composition-008
      - design-patterns-011
      - refactoring-007
    knowledge: 'Fragile base: subclass phụ thuộc internal hook/order/state của superclass; chỉnh lớp cha gây lỗi không mong
      muốn.'
    answer: |-
      **Fragile base class** xảy ra khi subclass vô tình phụ thuộc internal call order hoặc implementation detail của superclass thay vì extension contract ổn định. Superclass đổi cấu trúc nội bộ nhưng vẫn giữ public signature, subclass bỗng đếm sai, lặp side effect hoặc mất invariant.

      ~~~java
      import java.util.*;
      class BaseBag<E> {
          private final List<E> data = new ArrayList<>();
          public void add(E item) { data.add(item); }
          public void addAll(Collection<? extends E> xs) {
              for (E item : xs) add(item);
          }
      }
      final class CountingBag<E> extends BaseBag<E> {
          private int count;
          @Override public void add(E item) {
              count++;
              super.add(item);
          }
          @Override public void addAll(Collection<? extends E> xs) {
              count += xs.size();
              super.addAll(xs);
          }
          int count() { return count; }
      }
      ~~~

      Gọi addAll với hai phần tử trên CountingBag tăng count lên 4: override addAll tăng 2; BaseBag.addAll gọi virtual add hai lần; override add tăng thêm 2. Nếu BaseBag thay implementation bulk insertion trực tiếp, số đếm thay đổi dù public contract giống. Lỗi nằm ở dependency vào *self-use* internal của superclass.

      **Giảm rủi ro:** ưu tiên composition/decorator khi chỉ mở rộng tính năng: CountingBag giữ BaseBag như collaborator và đếm tại một điểm có contract; không phụ thuộc việc base gọi add trong addAll. Nếu cần inheritance, tài liệu hóa hook được phép override, order, side effects, state và constructor lifecycle, tránh virtual calls từ constructor. Viết regression/contract tests cho subclass trước khi thay base. Một class không thiết kế để kế thừa không nên được xem là extension framework chỉ vì không final.
  - question: Khi nào việc dùng protected field làm tăng coupling giữa superclass và subclass?
    readmeRelated:
      anchorList:
      - class-004
      - inheritance-005
      - inheritance-010
      - class-design-003
    knowledge: Protected field để lộ representation và invariant lớp cha cho subclass; ưu tiên private state + protected/public
      behavior.
    answer: |-
      **Protected field mở representation của superclass cho subclass.** Nếu BaseOrder có protected List items, lớp con có thể items.clear() hoặc thay cấu trúc mà không đi qua invariant như "đơn hàng đã confirm không được sửa". Khi base đổi List thành Map hoặc thay cách cache, nhiều subclass phải sửa dù API public không đổi. Coupling này là giữa subclass và nội bộ base, khó kiểm soát hơn interface method contract.

      ~~~java
      abstract class OrderBase {
          private final java.util.List<String> items = new java.util.ArrayList<>();
          private boolean confirmed;

          public final void add(String item) {
              if (confirmed || item == null || item.isBlank()) {
                  throw new IllegalStateException("Cannot add");
              }
              items.add(item);
          }
          protected final int itemCount() { return items.size(); }
          public final void confirm() {
              if (items.isEmpty()) throw new IllegalStateException("Empty order");
              confirmed = true;
          }
      }
      ~~~

      Giữ field private, cung cấp protected/public **hành vi có hợp đồng** thay vì cho sửa field. Mark final các method quan trọng khi subclass không được thay đường đi qua invariant. Nếu cần subclass mở rộng, cung cấp protected hook được tài liệu hóa rõ precondition, postcondition và thời điểm gọi; không mở protected mutable reference chỉ để tiện tái dùng.

      **Trade-off:** protected state đôi khi chấp nhận được trong framework có extension API công khai, nhưng đó là cam kết tương thích representation dài hạn. Composition với collaborator interface thường ít coupling hơn khi không có is-a thật. Tương tự, protected method không final vẫn có thể bị override sai nếu base gọi trong constructor, nên visibility không thay thế kiểm tra lifecycle và LSP.
  - question: Java cho phép implements nhiều interface nhưng không extends nhiều class nhằm tránh những vấn đề gì?
    readmeRelated:
      anchorList:
      - interface-004
      - interface-007
      - inheritance-008
      - polymorphism-006
    knowledge: Không có multiple class inheritance giảm xung đột state/implementation; nhiều interface role vẫn cần xử lý
      default conflict.
    answer: |-
      **Java chỉ extends một class** để tránh việc một object phải tự động hợp nhất nhiều tập instance state, constructor chain và implementation kế thừa có thể xung đột. Ví dụ nếu hai superclass cùng có field name, method reset và logic initializer, nhiều kế thừa class tạo câu hỏi chọn state/behavior nào. Java hỗ trợ implements nhiều interface để một object đóng nhiều *vai trò* mà không phải đa kế thừa state của các implementation class.

      ~~~java
      interface Printable { void print(); }
      interface Auditable { void audit(); }
      final class Report implements Printable, Auditable {
          @Override public void print() { /* render */ }
          @Override public void audit() { /* record */ }
      }
      ~~~

      Report có thể tham gia cả hai contract. Khi interface có default methods, vẫn có diamond/conflict cần giải quyết: method của class thường thắng default; interface cụ thể hơn ưu tiên interface cha; hai default ngang hàng cùng chữ ký phải được class override. Không phải đa interface luôn không xung đột, chỉ là Java có quy tắc phân giải method thay vì nhận multiple class state.

      **Đánh đổi:** nhiều interface nâng khả năng ghép role/ISP, nhưng một class implements quá nhiều khả năng không liên quan có thể đang gom sai trách nhiệm. Khi muốn dùng lại implementation của nhiều tính năng, giữ Printer và Auditor dưới dạng collaborator rồi delegate, thay vì mong extends hai class. Chọn composition khi cần phối hợp trạng thái, lifecycle và quyền sở hữu rõ ràng; role interface không tự quy định ownership.
  - question: Bạn sẽ chuyển một hierarchy kế thừa sâu sang delegation hoặc composition theo cách nào?
    readmeRelated:
      anchorList:
      - inheritance-010
      - composition-008
      - testing-009
      - refactoring-007
      - refactoring-009
    knowledge: Characterization tests rồi extract collaborator và delegate từng bước; giữ contract public khi làm phẳng hierarchy.
    answer: |-
      **Migrating deep inheritance cần khóa behavior trước, rồi thay dần điểm mở rộng bằng collaborator.** Đầu tiên lập bản đồ hierarchy và public/protected API: invariant thuộc cấp nào, nơi subclass gọi super, override hook, constructor và self-use của base, class ngoài phụ thuộc chữ ký nào. Viết characterization tests cho success/failure, exceptions, side effects, callback order, rồi chuyển từng bước, không xóa hierarchy đột ngột.

      Ví dụ thay BaseNotifier → RetryNotifier → AuditedNotifier bằng component:

      ~~~java
      interface Notifier { void send(String to, String body); }
      final class AuditedNotifier implements Notifier {
          private final Notifier delegate;
          AuditedNotifier(Notifier delegate) { this.delegate = delegate; }
          @Override public void send(String to, String body) {
              // audit theo contract trước/sau
              delegate.send(to, body);
          }
      }
      final class RetryingNotifier implements Notifier {
          private final Notifier delegate;
          RetryingNotifier(Notifier delegate) { this.delegate = delegate; }
          @Override public void send(String to, String body) {
              // retry có giới hạn và idempotency thích hợp
              delegate.send(to, body);
          }
      }
      ~~~

      Đây là skeleton minh họa kiến trúc, chưa triển khai audit/retry thực. Có thể ghép AuditedNotifier(new RetryingNotifier(realAdapter)); **thứ tự bọc quan trọng**: log mỗi attempt hay log một operation sẽ khác. Retry notification không idempotent có thể gửi trùng; phải định nghĩa retryable errors, backoff và idempotency/đối soát trước khi dùng production.

      **Lộ trình:** (1) baseline tests và xác định contract external; (2) extract policy/collaborator cho một nhánh, để class cũ delegate; (3) chuyển caller dần và dùng adapter/deprecation bảo vệ source/binary compatibility khi cần; (4) gom invariant về đúng owner, không rải giữa wrappers; (5) chạy unit/integration/contract tests, kiểm concurrency, transaction và exception. Chỉ xóa base khi không còn consumer/subclass cần contract cũ. Composition tăng wiring nhưng giảm fragile base coupling.
- groupID: 6
  groupName: Polymorphism và dispatch
  questions:
  - question: Runtime polymorphism giúp loại bỏ các nhánh kiểm tra subtype lặp lại như thế nào?
    readmeRelated:
      anchorList:
      - polymorphism-009
      - solid-003
      - design-patterns-008
      - design-pitfalls-005
      - refactoring-006
    knowledge: Đặt hành vi biến thiên sau interface; dispatch theo runtime implementation thay switch/instanceof trùng lặp.
    answer: |-
      **Runtime polymorphism** cho phép caller gọi một hợp đồng chung, còn implementation thực tế được chọn theo kiểu runtime của object. Ví dụ, `PaymentMethod.pay(amount)` có thể có `CardPayment` và `BankTransferPayment`; `CheckoutService` chỉ gọi `method.pay(amount)`, không cần lặp `if (method instanceof CardPayment)` hay `switch(type)` tại nhiều nơi.

      Cơ chế là **method overriding + virtual dispatch**: biến có kiểu khai báo `PaymentMethod` vẫn chứa reference tới instance cụ thể; JVM gọi implementation tương ứng của instance đó khi thực thi method ảo. Mỗi subtype đóng gói quy tắc riêng trong một method của contract. Khi thêm loại thanh toán, ta bổ sung implementation rồi cấu hình chỗ tạo/đăng ký object, hạn chế phải sửa tất cả caller đang sử dụng hợp đồng ổn định.

      Phải bảo đảm mọi implementation giữ postcondition, lỗi, invariant theo contract. Polymorphism không tự loại hết branching: nơi chọn implementation từ HTTP request, config hoặc discriminator vẫn có thể cần factory/switch. Nếu variation cố định, đơn giản và chỉ xuất hiện một nơi, một nhánh rõ ràng đôi khi dễ bảo trì hơn cả hierarchy.
  - question: Compile-time overload resolution và runtime virtual dispatch trong Java hoạt động khác nhau ra sao?
    readmeRelated:
      anchorList:
      - inheritance-004
      - polymorphism-003
      - polymorphism-005
    knowledge: Overload được ràng buộc ở compile-time; virtual instance method override được chọn theo kiểu object lúc runtime.
    answer: |-
      **Overload resolution** xảy ra ở compile-time: compiler xác định chữ ký method dựa vào kiểu tĩnh của receiver và biểu thức argument, xét method khả dụng, chuyển đổi kiểu, widening, boxing và varargs. Kiểu runtime thực tế của object argument **không làm compiler chọn lại overload** khi chương trình chạy.

      Ví dụ, `log(Object)` và `log(String)` là hai overload. Với `Object x = "abc"; log(x)`, compiler chọn `log(Object)` vì kiểu tĩnh của `x` là `Object`, dù giá trị runtime là String.

      **Virtual dispatch** chỉ quyết định implementation cho instance method đã được xác định theo chữ ký. Ví dụ `Parent p = new Child(); p.draw()` khi Child override `draw()`: chữ ký `draw()` được kiểm tra khi biên dịch theo Parent, nhưng JVM gọi `Child.draw()` lúc chạy. Nếu Child overload `draw(String)` mà Parent không khai báo, không thể gọi `p.draw("x")` chỉ nhờ runtime subtype.

      Vì thế overloading phụ thuộc **kiểu tĩnh và tham số**, còn overriding phụ thuộc **kiểu runtime của receiver**. Static/private method và field không tham gia virtual dispatch theo cách của overridden instance method.
  - question: Field hiding và static method hiding khác overriding instance method ở những điểm nào?
    readmeRelated:
      anchorList:
      - class-003
      - polymorphism-006
      - polymorphism-007
    knowledge: Field access và static method theo declared/reference type; chỉ overridden instance methods được virtual dispatch.
    answer: |-
      **Field hiding:** field cùng tên ở subclass không override field của superclass; mỗi field là thành viên riêng. Truy cập `ref.value` được ràng buộc theo **kiểu khai báo của reference**, không theo runtime object. Ví dụ `Parent p = new Child(); System.out.println(p.name)` truy cập `Parent.name` nếu Parent khai báo field đó, dù Child có field trùng tên.

      **Static method hiding:** subclass khai báo static method cùng chữ ký với static method có thể truy cập ở superclass thì tên method được chọn theo kiểu tĩnh tại call site. `Parent p = new Child(); p.info()` (cú pháp được Java cho phép nhưng khó đọc) gọi `Parent.info()`, không dispatch đến `Child.info()`; nên gọi rõ `Parent.info()`.

      **Instance method overriding:** `Child` override `Parent.info()` khi method không static/private/final và thỏa hợp đồng; `Parent p = new Child(); p.info()` gọi `Child.info()` qua virtual dispatch. Cần phân biệt hiding với overriding khi đọc kết quả bất ngờ của code; dùng `@Override` cho instance method, và tránh trùng tên field/static method giữa các tầng hierarchy nếu không cần.
  - question: Khi một reference kiểu cha trỏ đến object kiểu con, Java xác định method nào được gọi?
    readmeRelated:
      anchorList:
      - subtyping-004
      - polymorphism-002
      - polymorphism-004
    knowledge: Instance method dispatch theo runtime subtype trừ trường hợp static/private/final hoặc lời gọi đặc biệt như
      `super`.
    answer: |-
      Với `Parent p = new Child()`, **compile-time** trước tiên kiểm tra xem kiểu `Parent` có method áp dụng cho lời gọi hay không và chọn overload theo kiểu tĩnh của `p` và argument. Nếu method được chọn là **overridable instance method**, runtime sẽ tìm implementation override phù hợp với lớp thật của receiver là `Child`. Vì vậy `p.execute()` gọi `Child.execute()` nếu Child override hợp lệ, còn nếu không thì kế thừa implementation từ lớp cha.

      Có những ngoại lệ cần hiểu:
      - **Static method** được ràng buộc theo kiểu của biểu thức/kiểu khai báo; subclass chỉ có thể hide, không override.
      - **Private method** không được override; method cùng tên ở subclass là phương thức khác. **Final instance method** không thể override, nên không có implementation khác ở Child.
      - `super.execute()` trong Child gọi implementation superclass được chỉ rõ theo quy tắc `invokespecial`, bỏ qua lựa chọn override của Child cho lời gọi này.
      - Field access cũng dùng kiểu tĩnh, không virtual dispatch.

      Đừng kết luận từ `new Child()` rằng mọi lời gọi đều sử dụng method Child. Cần xét chữ ký chọn ở compile-time và liệu đó có phải instance method có thể override hay không.
  - question: Khi nào dùng instanceof hoặc pattern matching là hợp lý, và khi nào nó báo hiệu thiết kế đang thiếu hành vi?
    readmeRelated:
      anchorList:
      - subtyping-006
      - polymorphism-009
      - design-pitfalls-005
      - refactoring-006
    knowledge: Pattern matching/instanceof phù hợp boundary, serialization hoặc type-specific data; cảnh báo khi mọi caller
      tự dispatch.
    answer: |-
      **`instanceof`/pattern matching** hợp lý khi caller thật sự ở **ranh giới xử lý kiểu dữ liệu**: adapter parse payload ngoài, serialize event, xử lý một tập record/variant đã biết, hoặc cần kiểm tra trước khi thao tác đặc thù mà public contract không hứa. Ví dụ `if (obj instanceof PaymentEvent e)` giúp cast an toàn sau khi xác minh kiểu; pattern matching với `switch` có thể phù hợp cho sealed hierarchy dữ liệu khi tập variant được kiểm soát.

      Đó là tín hiệu thiết kế thiếu hành vi khi nhiều service cùng lặp `if (animal instanceof Dog)...else if (Cat)...` để tự quyết định `makeSound()`. Khi mỗi subtype có hành vi riêng, chuyển nó vào method `animal.makeSound()` để mọi caller dùng một contract, giảm sửa đồng loạt khi thêm subtype.

      Không thay mọi type check bằng polymorphism một cách máy móc. Nếu thao tác thuộc **một consumer ngoại vi** như export sang định dạng cụ thể, thêm method export vào domain chỉ để phục vụ adapter có thể làm domain phụ thuộc hạ tầng. Có thể dùng visitor, mapper hoặc pattern matching tập trung tại boundary. Quyết định dựa trên nơi sở hữu hành vi, tần suất type branching, độ mở của tập subtype và mức phụ thuộc giữa các module.
  - question: Strategy pattern sử dụng polymorphism khác gì với việc viết nhiều nhánh switch trong một service?
    readmeRelated:
      anchorList:
      - polymorphism-009
      - composition-005
      - design-patterns-008
      - refactoring-006
    knowledge: Strategy dùng interface + concrete policy, dependency được chọn ở composition root; tránh Map chỉ ánh xạ loại
      sang công thức.
    answer: |-
      **Strategy** biểu diễn một nhóm chính sách/thuật toán thay thế qua contract như `DiscountPolicy.calculate(cart)`. `CheckoutService` được inject một `DiscountPolicy`, gọi `calculate` mà không biết đó là `LoyaltyDiscount`, `SeasonalDiscount` hay `NoDiscount`. Mỗi implementation chứa quy tắc riêng; thay policy ở **composition root** hoặc factory khi có lựa chọn hợp lệ.

      Với một service chứa `switch(customerType)` lặp ở nhiều use case, mỗi lần thêm loại khách hàng phải sửa nhiều nhánh và regression test của class lớn. Strategy giảm phạm vi thay đổi, giúp unit test từng policy và thử consumer bằng fake policy. Khi runtime cần chọn policy, một registry/factory có thể ánh xạ mã đến instance của Strategy; **Map bản thân nó không thay thế việc đóng gói hành vi** nếu logic vẫn nằm trong các `switch`/lambda rời rạc khó kiểm thử.

      Đánh đổi là nhiều class, cấu hình và đường gọi gián tiếp. Nếu chỉ có hai case cố định, một `switch` duy nhất, rõ ràng và không có dấu hiệu mở rộng, cách trực tiếp có thể đơn giản hơn. Dù dùng Strategy, tất cả policy phải tuân thủ hợp đồng thống nhất về tiền tệ, điều kiện đầu vào, exception và side effect.
  - question: Vì sao caller không nên phải cast liên tục từ interface về concrete implementation để thực hiện nghiệp vụ?
    readmeRelated:
      anchorList:
      - interface-003
      - subtyping-006
      - polymorphism-008
      - design-pitfalls-005
    knowledge: Caller phụ thuộc abstraction có hành vi đầy đủ; cast lặp lại phá information hiding và tính mở rộng subtype.
    answer: |-
      Khi caller liên tục làm `((SqlOrderRepository) repository).specialQuery()` sau khi nhận một `OrderRepository`, caller đã phụ thuộc vào implementation cụ thể; đổi sang `InMemoryOrderRepository` hoặc adapter khác sẽ lỗi cast, đồng thời contract trừu tượng không còn đủ để thực hiện use case.

      Điều đó thường cho thấy một trong hai vấn đề: **interface thiếu capability cần thiết** cho nghiệp vụ, hoặc caller đang làm công việc chỉ thuộc infrastructure adapter. Nếu nhiều client cần cùng hành vi, bổ sung method mang ý nghĩa nghiệp vụ vào port (ví dụ `findOverdueOrders()`) và yêu cầu mọi implementation thực hiện đúng; nếu chỉ một loại client cần năng lực riêng, cân nhắc interface hẹp riêng thay vì ép toàn bộ implementation làm điều không hỗ trợ.

      Cast ở boundary sau khi kiểm tra kiểu có thể hợp lý trong những trường hợp như deserialization hoặc API nhận union type. Nhưng cast rải khắp business code là tín hiệu vi phạm **information hiding** và giảm khả năng substitutability. Đừng giải quyết chỉ bằng interface khổng lồ: thiết kế role/capability đúng ranh giới và contract tests cho các adapter.
  - question: Bạn xử lý thế nào khi các implementation có cùng interface nhưng có quy tắc exception hoặc null khác nhau?
    readmeRelated:
      anchorList:
      - abstraction-004
      - interface-008
      - subtyping-007
      - solid-004
      - language-mechanics-008
      - testing-004
    knowledge: Thống nhất exception/null/postcondition contract, kiểm tra mọi implementation bằng test chung theo LSP.
    answer: |-
      Các implementation có cùng interface phải bảo đảm **cùng hợp đồng quan sát được** về null, lỗi, trạng thái và side effect. Ví dụ, nếu `UserRepository.findById(id)` trả `Optional.empty()` khi không tìm thấy, một adapter trả `null` còn adapter khác ném `NoSuchElementException` sẽ khiến caller hành xử không nhất quán dù chữ ký có thể giống nhau.

      Trước tiên xác định precondition (ID được phép null không?), postcondition (kết quả không null? có thứ tự/độc nhất không?), những lỗi nghiệp vụ vs lỗi hạ tầng, object có bị thay đổi khi thất bại không và phép gọi có idempotent không. Áp dụng nullability annotation hoặc kiểu `Optional`/`Result` khi thích hợp; chuẩn hóa lỗi hạ tầng thành loại exception/result mà interface công bố. Một implementation không nên thêm precondition hoặc giảm bảo đảm của supertype theo **Liskov Substitution Principle**.

      Viết **contract test suite dùng chung** chạy với mọi implementation: input hợp lệ, biên, null, không tìm thấy, exception, invariant và side effect sau lỗi. Riêng những contract phụ thuộc hệ thống ngoài cần integration tests. Nếu thực sự có semantics khác nhau, đó có thể là hai contract khác biệt cần tách interface hoặc làm rõ tùy chọn, không che sự khác nhau dưới cùng chữ ký.
  - question: Covariant return type hỗ trợ override trong Java như thế nào?
    readmeRelated:
      anchorList:
      - inheritance-004
      - polymorphism-005
    knowledge: 'Covariant return: override trả cùng subtype hoặc subtype của return reference type; không áp dụng tùy ý cho
      primitive.'
    answer: |-
      **Covariant return type** cho phép overriding instance method trả về **subtype của kiểu trả về tham chiếu** trong superclass/interface. Ví dụ `class Parent { Number value() {...} }` và `class Child extends Parent { @Override Integer value() {...} }` là hợp lệ vì `Integer` là subtype của `Number`.

      Client có kiểu `Parent` vẫn nhìn thấy contract `Number value()`; client biết `Child` có thể nhận `Integer` mà không cần cast. Quy tắc này làm API thuận tiện hơn khi subclass có thông tin kết quả cụ thể hơn, nhưng phải giữ postcondition và exception semantics của supertype.

      Không thể tùy ý thay `int` bằng `long`, `boolean` hay một kiểu tham chiếu không liên quan, vì primitive không có quan hệ subtype cho covariant return. Khi biên dịch, Java có thể tạo **bridge method** để duy trì polymorphism/binary compatibility khi chữ ký JVM khác do return type hoặc generic erasure; đó là chi tiết triển khai của compiler, không phải một overload do programmer viết. Covariant return áp dụng cho override, còn overload được phân biệt bằng tham số chứ không chỉ bằng return type.
  - question: Trong trường hợp nào sử dụng polymorphism khiến hệ thống phức tạp hơn một giải pháp trực tiếp?
    readmeRelated:
      anchorList:
      - oop-basic-008
      - abstraction-007
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-008
    knowledge: Nhận diện chỉ một biến thể cố định, extension giả định hoặc nhiều lớp ủy quyền vô ích; ưu tiên cách đơn giản
      hơn.
    answer: |-
      Polymorphism có chi phí khi tạo ra **abstraction và nhiều implementation** nhưng hệ thống hầu như không có variation thực: một policy cố định, một thao tác đơn giản chỉ được gọi ở một nơi hoặc thêm class/interface/factory chỉ để bọc một `if` ngắn. Khi đó luồng điều khiển bị phân tán qua nhiều file, khó theo dõi hơn, việc debug và cấu hình dependency có thể phức tạp không tương xứng.

      Hãy hỏi: có nhiều implementation thực tế không? Chúng có cùng hợp đồng ổn định không? Những caller nào cần thay thế implementation? Quy tắc có nhiều thay đổi độc lập, cần test riêng hoặc mở rộng mà không sửa consumer không? Nếu câu trả lời chủ yếu là không, một hàm thuần, concrete class hoặc `switch` tập trung thường đủ theo **KISS/YAGNI**.

      Khi nhu cầu biến thể xuất hiện thật, refactor có kiểm soát: viết characterization tests cho behavior hiện tại, trích interface theo capability, tách chiến lược, inject qua constructor và chạy contract tests. Đánh giá dựa trên độ rõ ràng và phạm vi sửa khi thay đổi use case, **không đếm số class/interface** như một chỉ số chất lượng.
- groupID: 7
  groupName: Composition và quan hệ object
  questions:
  - question: Composition giúp thay thế collaborator và giảm phụ thuộc vào hierarchy kế thừa như thế nào?
    readmeRelated:
      anchorList:
      - inheritance-010
      - composition-001
      - composition-004
      - composition-005
      - refactoring-007
      - practice-004
    knowledge: Composition ủy quyền qua collaborator có thể inject/thay thế, tránh coupling vào implementation và thứ tự hook
      superclass.
    answer: |-
      **Composition** là object giữ tham chiếu đến collaborator và ủy quyền công việc qua hợp đồng, thay vì kế thừa implementation chỉ để tái sử dụng code. Nó thể hiện quan hệ has-a/uses-a, giúp thay thế thành phần mà không ràng buộc subclass vào internal hooks và state của superclass.

      Ví dụ CheckoutService nhận PaymentGateway và PricingPolicy qua constructor, gọi gateway.charge(...) và pricing.quote(...). Khi đổi provider, composition root inject adapter khác; khi thay chính sách, inject policy khác. Service không phải extends StripeGateway hoặc sửa một hierarchy kế thừa.

      **So sánh:** Inheritance phù hợp is-a và phải tuân LSP; sửa superclass/hook có thể tác động nhiều subclass (fragile base class). Composition dùng delegation, cho phép fake collaborator để test, ghép nhiều capability mà không cần multiple class inheritance. Đổi lại, có thêm indirection/wiring và cần quản lý ownership, lifecycle, thread safety của collaborator.

      Ví dụ Java minh họa:
          interface FeePolicy { long fee(long amount); }
          final class Checkout {
            private final FeePolicy policy;
            Checkout(FeePolicy p) { policy = java.util.Objects.requireNonNull(p); }
            long total(long a) { return a + policy.fee(a); }
          }

      Có thể test Checkout với fake FeePolicy trả giá trị xác định mà không phải khởi tạo SDK thật. Nếu chỉ có một phép tính thuần không có biến thể/ranh giới, class concrete hoặc hàm thường có thể đơn giản hơn. Không khẳng định composition luôn vượt trội mọi trường hợp.
  - question: Association, aggregation và composition khác nhau ra sao về ownership và vòng đời object?
    readmeRelated:
      anchorList:
      - composition-007
      - relationships-001
      - relationships-003
      - relationships-008
      - modeling-005
    knowledge: Association là liên kết; aggregation biểu thị shared part; composition có ownership/vòng đời mạnh và invariant
      xóa/chuyển.
    answer: |-
      Association, aggregation và composition đều có thể được cài bằng reference/collection trong Java, nhưng khác nhau về **ý nghĩa, ownership và vòng đời**, không thể phân loại chỉ từ từ khóa final/List.

      - **Association:** liên kết chung giữa object, ví dụ Customer đặt nhiều Order hoặc Teacher dạy Course; mỗi bên thường tồn tại độc lập.
      - **Aggregation (shared aggregation UML):** whole-part yếu, phần tử có thể chia sẻ hoặc sống độc lập, như Team–Member. UML không ấn định mọi ngữ nghĩa xóa/ownership của aggregation rỗng, nên cần contract domain rõ.
      - **Composition (composite aggregation):** whole sở hữu part mạnh hơn; một part thuộc tối đa một composite ở cùng thời điểm và vòng đời gắn với owner, ví dụ Order–OrderLine. UML biểu thị bằng kim cương đặc ở phía whole.

      Khi thiết kế, phải trả lời ai tạo part, ai sửa, có được reparent/share không, xóa whole sẽ xóa/giữ/chuyển part, và có transaction boundary nào. Customer tham chiếu từ nhiều Order không nên bị cascade delete khi xóa Order; OrderLine có thể được xóa cùng Order tùy yêu cầu audit.

      ORM cascade/orphanRemoval là cài đặt, không tự định nghĩa business ownership. Test xóa, chuyển và tham chiếu còn tồn tại. Không lạm dụng composition mạnh khi part cần có identity và lifecycle riêng. Một object graph có reference hai chiều vẫn có thể là association, không bắt buộc composition.
  - question: Thiết kế quan hệ parent-child hai chiều cần bảo vệ các invariant nào để tránh dữ liệu lệch nhau?
    readmeRelated:
      anchorList:
      - composition-007
      - relationships-004
      - relationships-006
      - testing-003
    knowledge: Khi reparent phải cập nhật hai phía, tránh duplicate child, cycle, self-parent và mất liên kết cũ.
    answer: |-
      Quan hệ parent-child hai chiều phải đồng bộ **hai biểu diễn của cùng một liên kết**: nếu parent.children chứa child thì child.parent phải trỏ đúng parent. Nếu chỉ cập nhật một phía, traversal, serialization và ORM persistence có thể lệch nhau.

      Các invariant nên rõ: child thuộc tối đa một parent khi domain yêu cầu, không duplicate trong collection, reparent phải bỏ liên kết cũ và thiết lập liên kết mới, detach phải sửa cả hai chiều. Với cấu trúc cây, chặn self-parent và ancestor cycle; một đồ thị domain tổng quát thì cycle có thể được phép.

      Đưa mutation vào một API owner như attachChild(), removeChild(), moveToParent(); không để caller sửa List và child.parent tùy ý. Trước commit, kiểm đủ điều kiện, tính tác động và đảm bảo exception không để lại nửa quan hệ. Pseudocode:
          attach(child):
            validate(child != null && child != self && noCycle)
            if child.parent == self: return
            old = child.parent
            if old != null: old.children.remove(child)
            children.add(child)
            child.parent = self

      Đây là pseudocode nghiệp vụ, **không khẳng định đã biên dịch**; implementation phải tránh gọi override tùy ý giữa các bước và xử lý uniqueness theo equals/identity đã chọn. Với nhiều thread hoặc DB, cần transaction, locking hoặc optimistic version để reparent đồng thời không tạo lost update.

      Test attach, detach, reparent, duplicate, self-parent, cycle, lỗi trước commit và tính nhất quán hai phía. ORM owning side cũng cần được duy trì tương thích với collection trong bộ nhớ.
  - question: Dependency injection qua constructor cải thiện testability và tính thay thế implementation thế nào?
    readmeRelated:
      anchorList:
      - interface-003
      - composition-006
      - solid-007
      - testing-007
    knowledge: Constructor injection rõ dependencies, tránh null/hidden lookup và cho phép fake/mock hoặc implementation khác
      khi test.
    answer: |-
      **Constructor injection** đưa việc chọn và tạo collaborator ra khỏi business class. Class khai báo dependency bắt buộc ở constructor, thường giữ private final field và kiểm null, thay vì tự new SDK hoặc tra service locator/singleton ẩn.

      Ví dụ:
          interface Clock { java.time.Instant now(); }
          final class BookingService {
            private final Clock clock;
            BookingService(Clock c) {
              clock = java.util.Objects.requireNonNull(c);
            }
            boolean expired(java.time.Instant d) { return !clock.now().isBefore(d); }
          }

      Trong production inject Clock dùng thời gian hệ thống; unit test inject fake Clock trả thời điểm cố định để test deadline biên mà không chờ thời gian thật. InvoiceService có thể nhận fake Repository để kiểm nghiệp vụ không cần database. Khi đổi implementation, sửa cấu hình composition root, không sửa service.

      Lợi ích: dependencies hiển thị rõ, object hoàn chỉnh sau khởi tạo, dễ fake/test, quản lý scope/lifecycle ở nơi tạo object. **Trade-off:** việc inject không tự bảo đảm thread-safety nếu collaborator mutable; fake phải tuân semantic contract; constructor có quá nhiều tham số thường biểu hiện trách nhiệm bị dồn. Setter injection có thể hợp lý cho tùy chọn, nhưng không nên để dependency bắt buộc thiếu trong trạng thái khởi tạo hợp lệ.

      DI framework chỉ là công cụ nối dependency, không thay thế quyết định đúng về ownership và interface.
  - question: Vì sao object nên nhận collaborator qua interface thay vì tự new dependency cụ thể?
    readmeRelated:
      anchorList:
      - interface-003
      - interface-009
      - composition-006
      - class-design-004
      - solid-006
      - testing-007
    knowledge: Port/interface ở boundary cho khả năng thay thế; `new` ở composition root thay vì nằm sâu trong business service.
    answer: |-
      Business object tự new StripeClient, MySqlRepository hay SystemClock trong method sẽ phụ thuộc concrete class, cấu hình và lifecycle của hạ tầng. Khi đổi provider hoặc muốn unit test nhánh thất bại, caller khó thay thế dependency và có nguy cơ phát sinh side effect ngoài ý muốn.

      Tại boundary cần biến thể, định nghĩa **port/interface bằng ngôn ngữ domain**: PaymentGateway.charge(PaymentRequest) trả Receipt; adapter StripeGateway chuyển domain request thành SDK call và map response/error về contract. CheckoutService nhận PaymentGateway qua constructor; **composition root** tạo và inject StripeGateway/BankGateway tùy cấu hình. Domain không biết token, HTTP response hoặc connection.

      Khi test, dùng fake gateway trả Receipt thành công, từ chối hoặc timeout theo contract để quan sát CheckoutService mà không gọi mạng. Thay vendor chủ yếu ảnh hưởng adapter, mapping và wiring; contract còn phải kiểm compatibility, null, exception và idempotency.

      Không cần một interface cho từng object được new. Tạo immutable Money, List nội bộ hoặc helper thuần trong object có thể hoàn toàn hợp lý. Khi abstraction không giảm coupling ở boundary hay testability, nó chỉ thêm lớp không cần thiết. Cần đặt port ở phía client nghiệp vụ và bảo đảm adapter thực sự tuân cùng behavioral contract.
  - question: Law of Demeter giúp phát hiện coupling qua những chuỗi getter dài như thế nào?
    readmeRelated:
      anchorList:
      - class-design-009
      - design-pitfalls-007
      - refactoring-004
    knowledge: Law of Demeter hạn chế chuỗi `a.getB().getC().set...`, tránh lệ thuộc vào cấu trúc nội bộ nhiều object.
    answer: |-
      **Law of Demeter** khuyến khích object biết ít về cấu trúc sâu của collaborator. Chuỗi như order.getCustomer().getAddress().getCountry().getTaxRate() khiến caller phụ thuộc vào nhiều lớp trung gian, dễ break khi model đổi và dễ gặp null hoặc tự xử lý quy tắc sai owner.

      Ví dụ xấu:
          order.getCustomer().getLoyalty().setPoints(100);
      Caller đi xuyên đồ thị rồi sửa state Loyalty không qua hành vi có kiểm tra. Thiết kế có thể dùng loyalty.credit(points) do object sở hữu điểm kiểm invariant; nếu operation liên nhiều aggregate, application/domain service điều phối qua port rõ ràng. Với thuế, TaxPolicy.rateFor(destination) có thể thích hợp hơn việc nhồi mọi getter forwarding vào Order.

      **Lợi ích:** giảm coupling vào representation, gom behavior gần dữ liệu, tránh nhiều nơi lặp chuỗi navigational logic. Tuy nhiên không biến nguyên tắc thành cấm mọi dấu chấm: fluent builders, Streams và immutable read models/DTO phục vụ báo cáo thường cho phép navigation rõ ràng. Một wrapper order.getCountryTaxRate() không tự tốt nếu chỉ dời dependency sang method khác.

      Hãy hỏi caller có cần biết cấu trúc nội bộ của collaborator không, có đang sửa state thuộc owner khác không, và thay đổi đồ thị có lan ra các module không. Sửa tại **ranh giới trách nhiệm**, không chỉ viết lại cú pháp.
  - question: Tell Don't Ask ảnh hưởng thế nào đến quyết định đặt hành vi tại object hay service?
    readmeRelated:
      anchorList:
      - encapsulation-008
      - class-design-007
      - class-design-009
      - modeling-003
      - refactoring-004
    knowledge: Tell Don't Ask đặt behavior ở owner của state; service không nên lấy dữ liệu rồi quyết định thay object.
    answer: |-
      **Tell, Don't Ask**: khi object nắm state và invariant, client nên yêu cầu nó thực hiện hành vi thay vì lấy field rồi tự quyết định và gán kết quả. Quy tắc nằm ở owner nên mọi entry point đều chịu cùng kiểm tra.

      Ví dụ OrderService đọc order.status và order.paid rồi gọi setStatus(SHIPPED). Một batch service khác có thể quên điều kiện. Tốt hơn là Order.ship() xác minh trạng thái PAID, không đã SHIPPED, rồi chuyển trạng thái; nếu sai, ném lỗi và giữ state cũ. Controller/service chỉ gọi command.

      Phân vai:
      - **Entity/aggregate:** behavior kiểm và cập nhật state/invariant nội bộ.
      - **Application service:** phối hợp authorization, transaction, repository, gateway, retry, nhiều aggregate.
      - **Domain service:** quy tắc liên entity khi không có owner tự nhiên.
      - **Query/DTO:** cung cấp dữ liệu đọc cho UI, thống kê; getter không tự động xấu.

      Nếu hành vi cần kết quả từ cổng thanh toán, application service lấy xác nhận và đưa thông tin cần thiết vào command domain, không bắt entity tự new SDK. Cũng không ép mọi phép tính thuần vào entity nếu không gắn invariant.

      Xác định ai sở hữu state, ai bắt buộc duy trì quy tắc và có bao nhiêu caller sẽ lặp logic nếu không đặt behavior gần owner. Đây là tiêu chí quan trọng hơn việc đếm getter.
  - question: Bạn chọn giữ reference đến entity khác hay tạo snapshot dữ liệu trong tình huống nào?
    readmeRelated:
      anchorList:
      - object-006
      - object-007
      - class-design-006
    knowledge: Reference giúp dùng chung một entity owner; snapshot lưu lịch sử/giá trị tại thời điểm; xác định consistency
      yêu cầu.
    answer: |-
      **Reference tới entity** phù hợp khi cần đối tượng có identity và trạng thái hiện tại do một owner quản lý; **snapshot** phù hợp khi phải giữ dữ liệu tại thời điểm một sự kiện để phục vụ lịch sử, chứng từ hoặc tách consistency.

      Ví dụ Order giữ customerId để tham chiếu Customer. Khi xác nhận đặt hàng, Order lưu ShippingAddress và UnitPrice dưới dạng snapshot; nếu khách hàng đổi địa chỉ hồ sơ hoặc bảng giá thay đổi, hóa đơn và đích giao đã xác nhận không được tự đổi. Audit event cũng nên ghi sự thật tại thời điểm phát sinh, không lookup lại profile và coi là lịch sử.

      **Trade-off:**
      1. Reference giảm duplication và cho biết dữ liệu mới nhất, nhưng đòi lookup, có thể tạo lazy-loading và phải tôn trọng transaction boundary.
      2. Snapshot ổn định, đọc độc lập, nhưng có thể stale; cần schema/versioning và quyết định thời điểm refresh.
      3. Đối với kiểm quyền vừa thu hồi hoặc tồn kho hiện tại, snapshot cũ không thay thế việc xác minh state mới nhất.

      Trong DDD, liên aggregate thường tham chiếu bằng ID thay vì giữ graph mutable qua nhiều consistency boundary. Value object immutable phù hợp với snapshot. Chọn theo semantics: **latest state**, **historical truth** hay **isolation**; không snapshot tùy ý mọi dữ liệu vì vừa tăng duplication vừa dễ hiểu sai dữ liệu cũ.
  - question: Trong một object graph có chu trình tham chiếu, cần cân nhắc gì khi serialize, log và giải phóng tài nguyên?
    readmeRelated:
      anchorList:
      - lifecycle-006
      - lifecycle-008
      - relationships-005
      - relationships-006
      - language-mechanics-007
    knowledge: Quan hệ vòng gây recursion khi JSON/toString; quản lý identity, reference cycle, bí mật log và AutoCloseable
      riêng.
    answer: |-
      Một object graph có **chu trình tham chiếu** như Parent.children → Child.parent → Parent có thể hoàn toàn hợp lệ về nghiệp vụ, nhưng cần kiểm soát serialization, logging, equality và resource lifecycle.

      - **JSON:** serialize toàn bộ entity graph có thể đệ quy vô hạn hoặc xuất payload rất lớn. Ưu tiên DTO có ID/reference, kiểm soát hướng duyệt hoặc cơ chế graph identity của serializer.
      - **toString/equals/hashCode:** tự sinh method duyệt cả hai chiều có thể StackOverflowError, kích hoạt lazy loads hoặc leak dữ liệu nhạy cảm. Entity equality nên dựa identity ổn định phù hợp lifecycle; toString chỉ liệt kê field an toàn.
      - **Logging:** tránh token/PII, giới hạn depth và kích thước; không tự log mọi field.
      - **Tài nguyên:** Java tracing GC thu hồi cả cycle object **khi không còn reachable**. Cycle tự nó không gây memory leak. Nhưng static cache, event listener, thread vẫn giữ graph reachable; subscription nên unsubscribe, socket/stream/connection nên đóng bằng AutoCloseable/try-with-resources đúng owner.

      Ví dụ serialize Order thành OrderDto gồm orderId, customerId và danh sách LineDto; không tự serialize Customer.orders rồi quay về Order. Nếu API thật cần graph có cycle, xác định serialization policy và test.

      Test cả chiều sâu object, vòng lặp, lazy-load và cleanup khi lifecycle kết thúc; đừng giả định chỉ xóa một reference là đã đóng external resource.
  - question: Bạn thiết kế giao tiếp giữa domain object và infrastructure adapter ra sao để tránh rò rỉ chi tiết kỹ thuật?
    readmeRelated:
      anchorList:
      - abstraction-008
      - interface-009
      - class-design-004
      - solid-006
    knowledge: Domain phụ thuộc port nghiệp vụ, adapter triển khai kết nối ngoài; tách DTO/persistence concern khỏi domain
      API.
    answer: |-
      Domain object nên nói bằng **thuật ngữ nghiệp vụ và các port cần thiết**, không phụ thuộc trực tiếp JDBC, JPA entity, HttpResponse, SDK DTO hoặc token của bên ngoài. Infrastructure adapter triển khai port và chuyển đổi dữ liệu/exception giữa mô hình ngoài và domain.

      Ví dụ:
      - InvoiceRepository domain port có save(Invoice) và findById(InvoiceId), PaymentGateway port có charge(PaymentRequest) → Receipt.
      - JpaInvoiceRepository adapter map Invoice sang persistence object; BankGateway adapter map domain request sang HTTP/SDK và phản hồi về Receipt hoặc lỗi domain/application.
      - Composition root inject implementation cần thiết vào application service.

      **Dependency direction:** phần policy cấp cao phụ thuộc abstraction, adapter hạ tầng phụ thuộc abstraction đó. Dùng anti-corruption layer khi bên ngoài có ngôn ngữ, trạng thái hoặc vòng đời khác. Không đưa SQLException, HTTP status hay connection vào public API domain.

      Một port tốt phải xác định nullability, pre/postcondition, error semantics, idempotency, consistency và ownership. Timeout khi gọi payment gateway không đồng nghĩa giao dịch thất bại chắc chắn; cần status lookup/idempotency key theo contract. Không để entity tự retry network hoặc quản lý connection pool.

      Cân nhắc KISS: phép tính thuần và value object đơn giản không cần adapter; port có giá trị ở boundary thật sự phải thay vendor, cô lập kiểm thử hoặc ngăn domain lệ thuộc kỹ thuật. Dùng contract tests và integration tests để kiểm adapter tuân cùng hành vi.
- groupID: 8
  groupName: SOLID và dependency
  questions:
  - question: Single Responsibility Principle nên được hiểu theo lý do thay đổi thay vì số lượng method như thế nào?
    readmeRelated:
      anchorList:
      - class-design-001
      - class-design-002
      - solid-002
      - design-pitfalls-001
      - refactoring-003
    knowledge: SRP xét một nhóm actor/lý do thay đổi, không phải mỗi method một class; phân ranh theo cohesion.
    answer: |-
      **SRP là một lý do thay đổi thống nhất, không phải một method cho mỗi class.** Một trách nhiệm tương ứng một nhóm chính sách/actor cùng thúc đẩy thay đổi. Class có 8 method cùng bảo vệ vòng đời Order vẫn có thể cohesion tốt; class có 3 method nhưng một method tính học phí, một gửi SMS, một truy vấn báo cáo SQL có thể có nhiều trách nhiệm khác nhau.

      **Phân tích ví dụ:** SchoolManager vừa ghi điểm theo quy chế giáo vụ, tính phí theo chính sách tài chính, vừa gửi email qua nhà cung cấp. Ba thay đổi độc lập có thể làm hỏng một class: đây là dấu hiệu God Class. Tách GradeBook giữ giới hạn điểm, TuitionPolicy giữ công thức học phí và NotificationGateway chuyển tiếp hạ tầng; application service chỉ phối hợp use case.

      ~~~java
      final class GradeBook {
          void recordGrade(String studentId, int score) {
              if (studentId == null || studentId.isBlank()
                      || score < 0 || score > 100) {
                  throw new IllegalArgumentException("Invalid grade");
              }
              // Persist through an injected repository.
          }
      }
      interface NotificationGateway {
          void send(String studentId, String message);
      }
      ~~~

      **Trade-off:** Nếu chia mỗi thao tác validateGrade, addGrade, confirmGrade thành ba class không chung chủ sở hữu, invariant có thể bị bỏ qua ở entry point khác; cần giữ các thao tác cùng bảo vệ state ở một owner. SRP không đồng nghĩa controller chỉ được một method; tách theo lý do thay đổi, cohesion và ownership. Tại runtime, ghi điểm và gửi thông báo là hai side effect: đoạn điều phối thuần không đảm bảo atomicity; nếu bắt buộc giao tin sau commit cần transaction/outbox và retry rõ. Regression/contract tests nên khóa luồng thành công, dữ liệu sai và lỗi gửi tin trước refactor.
  - question: Open/Closed Principle giúp mở rộng hành vi ra sao và khi nào việc áp dụng quá mức gây lãng phí?
    readmeRelated:
      anchorList:
      - solid-003
      - solid-008
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-006
      - refactoring-008
    knowledge: OCP dùng extension qua contract khi variation thật; cân nhắc speculative generality và chi phí thay đổi interface.
    answer: |-
      **OCP cho phép mở rộng các biến thể đã có bằng cách bổ sung implementation sau một contract, hạn chế sửa code ổn định.** Khi có nhiều chính sách vận chuyển độc lập, chuyển điểm biến thiên thành ShippingPolicy có thể khiến Checkout chỉ biết hợp đồng tính phí.

      ~~~java
      interface ShippingPolicy {
          long fee(long subtotalCents);
      }
      final class FlatFee implements ShippingPolicy {
          @Override public long fee(long subtotalCents) {
              if (subtotalCents < 0) throw new IllegalArgumentException();
              return 2500;
          }
      }
      final class FreeAfterThreshold implements ShippingPolicy {
          @Override public long fee(long subtotalCents) {
              if (subtotalCents < 0) throw new IllegalArgumentException();
              return subtotalCents >= 100_000 ? 0 : 2500;
          }
      }
      final class Checkout {
          private final ShippingPolicy policy;
          Checkout(ShippingPolicy policy) { this.policy = policy; }
          long total(long subtotal) {
              if (subtotal < 0) throw new IllegalArgumentException();
              return Math.addExact(subtotal, policy.fee(subtotal));
          }
      }
      ~~~

      Client có thể cung cấp implementation phù hợp, Checkout không cần switch ở nhiều nơi. Math.addExact từ chối tràn số; contract của policy cần đảm bảo fee không âm. Composition root hoặc cấu hình vẫn phải thay đổi khi thêm policy mới: OCP không có nghĩa toàn bộ hệ thống không bao giờ sửa.

      **Quá mức:** Nếu nghiệp vụ chỉ có một công thức cố định chưa có biến thể, AbstractFactory → Provider → Strategy → Registry làm tăng indirection, boilerplate, chi phí test và API phải duy trì. Đây là speculative generality. Trước hết có thể dùng concrete FeePolicy rõ ràng; extract interface khi có hai biến thể thật, plugin/module boundary hoặc bằng chứng từ roadmap. Mỗi implementation mới phải qua contract tests cho giá trị âm, ngưỡng, tràn số, rounding và semantics lỗi.
  - question: Interface Segregation Principle giúp tránh việc client phải implement những method không hỗ trợ thế nào?
    readmeRelated:
      anchorList:
      - interface-006
      - solid-005
      - design-pitfalls-006
    knowledge: ISP tách role interfaces theo client để tránh no-op/UnsupportedOperationException và giảm quyền không cần thiết.
    answer: |-
      **Interface Segregation Principle (ISP) yêu cầu client chỉ biết những operation nó thực sự dùng**, thay vì bị ép sử dụng một interface lớn gồm hành vi mà nhiều implementation không hỗ trợ. Nếu một readonly report viewer chỉ cần đọc hóa đơn, buộc nó phụ thuộc refund(), deleteInvoice() và changeCredential() làm tăng coupling, quyền hạn và test setup.

      ~~~java
      interface InvoiceReader {
          Invoice read(String invoiceId);
      }
      interface RefundService {
          RefundResult refund(String invoiceId, long amountCents);
      }
      final class InvoicePage {
          private final InvoiceReader reader;
          InvoicePage(InvoiceReader reader) { this.reader = reader; }
          Invoice display(String id) { return reader.read(id); }
      }
      ~~~

      Invoice và RefundResult là domain types minh họa; code trên biểu thị hợp đồng chứ không được tuyên bố là ứng dụng hoàn chỉnh. Một adapter có thể implement cả hai interface khi có đủ capability, còn readonly adapter chỉ implement InvoiceReader. Không cần method giả ném UnsupportedOperationException, nên client chấp nhận reader có thể tin vào read() hợp lệ.

      **Tiêu chí tách:** Chia theo vai trò và nhu cầu client (read, write, refund), không theo số lượng method tuyệt đối. Nếu nhiều operation luôn cùng giữ một invariant/transaction, việc tạo một interface cho mỗi method sẽ gây thêm hàng chục type và mất cohesiveness. ISP thường đi với LSP: interface hứa operation nào thì implementation thay thế được phải hỗ trợ operation đó theo contract, kể cả lỗi và nullability. Dùng contract tests cho các implementation, tránh no-op như một cách né hợp đồng.
  - question: Dependency Inversion Principle khác với quy tắc máy móc rằng mọi class đều cần interface ở đâu?
    readmeRelated:
      anchorList:
      - abstraction-003
      - class-design-004
      - solid-006
      - design-pitfalls-006
    knowledge: DIP nói high-level policy không lệ thuộc low-level detail; abstraction đặt tại boundary cần thay đổi, không
      bọc máy móc.
    answer: |-
      **Dependency Inversion Principle không yêu cầu mọi class phải có một interface.** DIP yêu cầu phần chính sách cấp cao không phụ thuộc trực tiếp chi tiết cấp thấp; cả hai dựa trên abstraction phù hợp với nhu cầu policy. Một interface được đặt tại module boundary có ý nghĩa nếu nó ngăn application/domain import SQL, HTTP SDK hay framework cụ thể.

      ~~~java
      interface OrderStore {
          Order load(String id);
          void save(Order order);
      }
      final class ConfirmOrder {
          private final OrderStore store;
          ConfirmOrder(OrderStore store) { this.store = store; }
          void execute(String id) {
              Order order = store.load(id);
              order.confirm();
              store.save(order);
          }
      }
      ~~~

      Đây là khung kiến trúc: Order và implementation persistence cần được định nghĩa ở hệ thống thực. Application sở hữu contract OrderStore; JdbcOrderStore ở infrastructure triển khai nó và composition root cung cấp instance. Policy không gọi new JdbcOrderStore và không biết SQLException hoặc cấu trúc bảng. Test dùng fake repository để xác minh invariant và luồng use case; integration test kiểm transaction/persistence thật.

      **Phản ví dụ:** FooImpl + IFoo nằm cùng package, chỉ một lớp forwarding tên khác, mọi caller vẫn phụ thuộc JdbcFoo hoặc FooDTO của vendor: thêm IFoo chưa đảo dependency đúng. Nếu class chỉ biến đổi số nguyên hoặc tạo value object không có điểm biến thiên, concrete class/hàm là đủ. DI là kỹ thuật cấp collaborator; DI container không tự chữa sai hướng module, rò rỉ semantics hay business rule đặt trong adapter. Nếu adapter có failure/retry semantics khác, chúng phải được mô tả trong contract chứ không chỉ có cùng chữ ký method.
  - question: Bạn phân biệt dependency injection, service locator và hard-coded dependency như thế nào?
    readmeRelated:
      anchorList:
      - composition-006
      - class-design-003
      - solid-007
    knowledge: DI nhận dependency từ ngoài; service locator giấu dependency; hard-coded `new` ràng buộc implementation và
      test.
    answer: |-
      **Hard-coded dependency:** một service tự new SmtpClient hoặc JdbcRepository bên trong logic, nên quyết định hạ tầng nằm trong policy; unit test khó thay thế và việc sửa vendor lan vào use case. Tạo value object cục bộ bằng new Money(...) thì không nhất thiết sai, vì không phải collaborator có side effect hoặc nhiều triển khai.

      **Dependency Injection (DI):** bên ngoài tạo/cung cấp dependency qua constructor, factory hoặc method; constructor injection thích hợp khi collaborator bắt buộc. Điều này phơi bày dependency trong chữ ký, cho phép fake test và quản lý vòng đời ở composition root.

      ~~~java
      interface MailGateway { void send(String recipient, String text); }
      final class SignupService {
          private final MailGateway mail;
          SignupService(MailGateway mail) {
              this.mail = java.util.Objects.requireNonNull(mail);
          }
          void welcome(String email) {
              if (email == null || email.isBlank()) {
                  throw new IllegalArgumentException("Email required");
              }
              mail.send(email, "Welcome");
          }
      }
      ~~~

      **Service Locator:** service tự hỏi Services.get(MailGateway.class) ở runtime. Dependency bị giấu khỏi constructor, gây lỗi trễ khi registry chưa cấu hình và dễ nhiễm global test state. Service locator đôi khi có ích tại plugin registry hoặc framework composition boundary, nhưng không nên rải trong domain/application logic.

      **Trade-off:** DI thêm wiring, có thể lộ constructor quá dài; thay vì giấu bằng locator, nên xem lại SRP nếu một service cần quá nhiều collaborator. DI không đảm bảo transactional consistency: nếu lưu user rồi gửi mail lỗi, phải có yêu cầu rõ về rollback, retry, idempotency hoặc outbox. Không tự đóng injected client/connection do nơi khác sở hữu. Container như Spring chỉ quản lý graph/lifecycle theo config, không mặc nhiên tuân thủ DIP hoặc giải quyết shared mutable state.
  - question: Những dấu hiệu nào cho thấy một class đang trở thành God Object?
    readmeRelated:
      anchorList:
      - class-design-002
      - design-pitfalls-001
      - refactoring-001
      - refactoring-003
    knowledge: God Object ôm nhiều actor/hạ tầng, quá nhiều field/method/điểm thay đổi; tách theo domain responsibilities.
    answer: |-
      **God Object là dấu hiệu trách nhiệm phân tán và quá nhiều lý do thay đổi bị gom ở cùng nơi.** Không có ngưỡng số dòng, số field hay số method đủ để kết luận một class là God Object. Cần xem ai yêu cầu thay đổi code và những invariant nào bị giữ chung.

      **Tín hiệu cụ thể:** một SchoolManager vừa quản lý Student, ghi Grade, tính Tuition, gửi SMS, viết PDF và cập nhật Payroll; nó phụ thuộc repository, SMTP, HTTP, DB transaction, formatter và security context. Thay provider thông báo làm class thay đổi dù rule học phí không đổi; test một phép tính cần mock rất nhiều hạ tầng; nhiều team thường sửa chung một file và conflict. Trạng thái cũng dễ bị rò: controller sửa field không đi qua validation.

      **Cách refactor:** (1) chụp characterization tests cho business result, exception, side effect; (2) nhóm field/method theo cohesion và lý do thay đổi; (3) Extract Class/Move Method sang GradeBook, TuitionPolicy, StudentRegistry và NotificationGateway; (4) application service điều phối use case thay vì gom tất cả policy; (5) giữ adapter/facade tạm thời khi public API cũ có consumer; (6) kiểm contract, transaction, retry và regression sau từng bước.

      **Phản ví dụ:** một aggregate Order có nhiều method addItem, removeItem, confirm, cancel và changeAddress nhưng cùng bảo vệ invariant của Order, chưa chắc là God Object. Tách từng method thành service riêng có thể làm mất chủ thể sở hữu trạng thái. Ngược lại class chỉ ba method nhưng phụ trách ba actor độc lập vẫn đáng tách. Đánh giá theo mức phụ thuộc, khả năng kiểm thử từng trách nhiệm và điểm thay đổi, không theo số lượng file tăng/giảm.
  - question: Bạn tổ chức các package như thế nào để hạn chế circular dependency và ranh giới module không rõ ràng?
    readmeRelated:
      anchorList:
      - relationships-007
      - class-design-003
      - solid-006
      - design-pitfalls-007
    knowledge: Thiết kế dependency graph một chiều, đặt port ở chiều phù hợp; phá cycles bằng boundary rõ và đảo phụ thuộc.
    answer: |-
      **Tổ chức module theo ranh giới nghiệp vụ và đồ thị dependency một chiều.** Có thể chia top-level theo feature/bounded context như order, billing, customer; trong từng module giữ domain model, application policy, các port và adapter phù hợp thay vì đặt mọi Service của toàn hệ thống vào một package khổng lồ. Domain không import controller, persistence model, JDBC hay vendor SDK.

      Ví dụ đường phụ thuộc trong hexagonal architecture:

      ~~~text
      order-api ----------> order-application ----------> order-domain
      order-infrastructure -------> order-application/OrderRepository
      composition-root wires application and infrastructure at runtime
      ~~~

      Port OrderRepository nằm ở phần policy cần dùng, adapter SQL implements port; một use case runtime gọi adapter qua port nhưng compile-time dependency của application không hướng sang infrastructure. Ngược lại, nếu OrderService import PaymentService và PaymentService import OrderService, xuất hiện chu trình module làm unit test, khởi tạo DI và thay đổi độc lập phức tạp hơn.

      **Phá cycle:** tìm owner của workflow (ví dụ CheckoutCoordinator) để điều phối hai policy không gọi ngược nhau; hoặc tách một domain policy dùng chung mà dependency chỉ hướng xuống. Dùng event khi chấp nhận eventual consistency và có contract rõ về idempotency, retry, duplicate, ordering; không chuyển sang event chỉ để giấu cycle. Đặt cả hai class trong shared package hoặc thêm hai interface trống không sửa được vòng import/ngữ nghĩa.

      **Kiểm soát:** dependency graph, module-level build, architecture tests (chẳng hạn ArchUnit nếu dự án dùng), cấm import domain → infra và CI checks cho cycles. Object references Parent–Child có thể là đồ thị hai chiều hợp lệ nhưng khác compile-time module cycle; không đánh đồng hai khái niệm.
  - question: Trong một hệ thống nhỏ, bạn cân bằng SOLID, KISS và YAGNI theo tiêu chí gì?
    readmeRelated:
      anchorList:
      - oop-basic-008
      - solid-008
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-008
    knowledge: KISS/YAGNI ưu tiên đơn giản; áp dụng SOLID ở hot spots thay đổi và seam cần kiểm thử với bằng chứng cụ thể.
    answer: |-
      **SOLID, KISS và YAGNI cần cân bằng theo correctness, khả năng thay đổi có bằng chứng và chi phí đọc hiểu.** SOLID giúp định trách nhiệm và hướng phụ thuộc, KISS ưu tiên lời giải rõ ràng tối thiểu, YAGNI hạn chế xây extension chưa có nhu cầu. Không dùng số interface/class làm thước đo chất lượng.

      **Quy trình ra quyết định:**
      1. Xác định use case, invariant, failure paths và ownership trước, viết regression/characterization tests nếu đang sửa code cũ.
      2. Xem điểm thay đổi có thật: bảng giá sửa liên tục, email gateway có API bên thứ ba, chính sách vận chuyển có ít nhất hai implementation, test cần clock giả. Đây là các seam có thể đáng để extract.
      3. Nếu chỉ parse một dòng CSV đơn giản hoặc tính một công thức ổn định, dùng function/concrete class rõ hợp đồng, không tự tạo registry/factory/strategy nhiều tầng.
      4. Khi biến thể xác nhận hoặc module boundary có lý do, trích xuất abstraction theo nhu cầu client; test chung cho mọi implementation.
      5. Đo tác động của thay đổi và sức đọc hiểu: bao nhiêu nơi phải sửa, bao nhiêu collaborator phải cấu hình để test, invariant có ở đúng owner không.

      Ví dụ ban đầu FeePolicy đơn lẻ có thể đủ. Sau khi thêm hình thức phí theo thành viên và theo khu vực thực sự, ShippingPolicy/Strategy sẽ có lợi. **KISS không đồng nghĩa dồn hết vào controller**; ít class nhưng business rule rải rác làm tăng coupling. **SOLID không đồng nghĩa mỗi method một class**; nhiều tầng forwarding tăng cognitive load và nguy cơ bỏ qua invariant.

      Kết luận phải đặt theo bối cảnh: hệ nhỏ ưu tiên code đơn giản nhưng vẫn giữ resource ownership, transaction và API contract. Chỉ tối ưu performance sau khi có workload và số liệu; chưa chạy benchmark thì không khẳng định kiến trúc nào nhanh hơn.
  - question: Vì sao việc tách mỗi trách nhiệm thành quá nhiều class nhỏ vẫn có thể làm giảm cohesion của một use case?
    readmeRelated:
      anchorList:
      - class-design-001
      - class-design-002
      - solid-002
      - design-pitfalls-010
      - refactoring-008
    knowledge: Tách vụn làm tăng orchestration/indirection, mất ownership invariant; phân nhóm theo hành vi liên kết chặt.
    answer: |-
      **Over-fragmentation có thể làm cohesion ở cấp use case giảm dù từng class rất nhỏ.** Nếu một Order cần đảm bảo không thể confirm khi chưa có item, nhưng validation, update status và tính total nằm ở ba service độc lập mà bất kỳ caller nào cũng có thể gọi riêng, invariant trở nên phân tán. Use case phải phối hợp nhiều lần gọi và giữ ngầm thứ tự thực thi; bỏ sót một bước có thể tạo dữ liệu sai.

      ~~~java
      final class Order {
          private final java.util.List<Long> items = new java.util.ArrayList<>();
          private boolean confirmed;

          void addItem(long cents) {
              if (confirmed) throw new IllegalStateException("Confirmed");
              if (cents <= 0) throw new IllegalArgumentException("Price must be positive");
              items.add(cents);
          }

          long confirm() {
              if (confirmed || items.isEmpty()) {
                  throw new IllegalStateException("Cannot confirm");
              }
              long sum = 0;
              for (long price : items) sum = Math.addExact(sum, price);
              confirmed = true;
              return sum;
          }
      }
      ~~~

      Đây là minh họa gói invariant của một aggregate trong các method hành vi. Khi xác nhận, check item list, total overflow và transition ở một owner. Nếu dùng đa thread hoặc persistent store, method này chưa tự đảm bảo atomicity giữa request/process; cần transaction/optimistic locking hoặc synchronization theo trường hợp.

      **Khi nên tách:** rule thuế, vận chuyển hoặc thanh toán có nhiều chiến lược thay đổi độc lập thì extract policy/service; application service điều phối giữa aggregate và hạ tầng. Giữ những operation cần cùng invariant trong cùng aggregate. Không phải mỗi class một method là cohesion cao: quá nhiều pass-through lớp làm khó trace, làm mờ transaction boundary và tăng coupling. Cũng không nhồi hết vào Order chỉ để giảm số collaborator, vì HTTP/DB adapter là trách nhiệm khác.
  - question: Bạn đánh giá một refactor theo SOLID bằng thay đổi thực tế trong code và khả năng kiểm thử ra sao?
    readmeRelated:
      anchorList:
      - class-design-003
      - solid-008
      - testing-009
      - refactoring-001
      - refactoring-009
      - practice-011
    knowledge: Đo impact của thay đổi, coverage, mock seam, complexity và regression risk trước/sau, không chấm theo số lớp.
    answer: |-
      **Đánh giá refactor SOLID qua hành vi, khả năng thay đổi và kiểm thử trước/sau.** Bước đầu ghi baseline: API behavior, exception contract, invariant, side effects, module dependencies và những nơi một business rule đang bị nhân bản. Viết characterization/regression tests để khóa luồng hiện tại trước khi chuyển ownership. Cùng một bộ contract tests áp dụng cho nhiều implementation để phát hiện breaking behavior.

      **Ví dụ có thể kiểm:** một công thức phí dịch vụ bị copy vào Order, Invoice, Report. Trước refactor, đổi cách làm tròn buộc sửa ba định nghĩa công thức và có nguy cơ lệch. Sau khi đưa vào FeePolicy (single source of truth), ba nơi sử dụng cùng FeeQuote; test kiểm giá trị 0, 1, 111 cents, rounding, input âm, overflow, kết quả đồng nhất. Đây là minh họa về điểm phải sửa, **không phải số liệu đã đo từ repository**.

      **Các tiêu chí cụ thể:**
      - SRP/cohesion: class có còn nhiều actor/lý do thay đổi không, owner của invariant rõ chưa?
      - OCP: thêm một biến thể có cần sửa core logic và hàng loạt client không?
      - LSP/ISP: các implementation qua cùng bộ contract tests chưa, có UnsupportedOperationException cho operation được hứa không?
      - DIP: domain/application còn import vendor SDK, ORM model, HTTP controller không; có thể test policy không dùng database thật không?
      - KISS: số tầng chuyển tiếp, call chain và độ khó truy vết nghiệp vụ tăng hay giảm?
      - Regression: source/binary compatibility, transaction, authorization, idempotency, lỗi concurrent update có còn đúng không?

      **Cách xác minh:** unit/integration/contract tests và review diff, dependency graph; kiểm một thay đổi thật hoặc giả định để xem số file phải sửa. Coverage cao không tự chứng minh test tốt, số class ít không tự chứng minh đơn giản. Nếu performance quan trọng thì đo allocation/latency bằng JFR, profiler hoặc benchmark phù hợp; không bịa số liệu. Refactor tốt khi đúng hành vi và làm các thay đổi đã biết dễ hơn mà không tăng rủi ro.
- groupID: 9
  groupName: Design patterns
  questions:
  - question: Factory Method, Abstract Factory và static factory method khác nhau về cơ chế tạo object như thế nào?
    readmeRelated:
      anchorList:
      - lifecycle-005
      - design-patterns-002
    knowledge: Factory Method dùng subclass chọn sản phẩm; Abstract Factory tạo family liên quan; static factory là named
      static creation.
    answer: |-
      **Factory Method** là một *phương thức tạo* trong Creator: lớp cha định nghĩa luồng xử lý và gọi một factory method; subclass override method đó để chọn loại Product phù hợp. Chẳng hạn `DocumentExporter.export()` gọi `createWriter()`, còn `PdfExporter` và `HtmlExporter` tạo writer tương ứng. Điểm mở rộng nằm ở quan hệ kế thừa Creator.

      **Abstract Factory** là một *object factory* cung cấp nhiều phương thức tạo **cả họ sản phẩm tương thích**. Ví dụ `UiFactory` tạo `Button` và `Dialog`; `WindowsUiFactory` tạo cả hai phiên bản Windows, còn `MacUiFactory` tạo các phiên bản macOS. Client đổi cả family bằng cách đổi factory được inject, tránh trộn sản phẩm không tương thích. Có thể hiện thực một phương thức factory trong đó bằng Factory Method nhưng hai pattern giải quyết phạm vi khác nhau.

      **Static factory method** là phương thức `static` trả về object, ví dụ `Money.of(amount, currency)` hoặc `List.of(...)`. Nó đặt tên rõ ý định, có thể validate, cache hoặc trả subtype, và **không bắt buộc** có class Creator hay subclass override. Nhược điểm có thể là khó subclass hoặc inject trực tiếp cách khởi tạo nếu thiết kế khóa cứng static dependency.

      Chọn theo nhu cầu: một cách tạo có tên thì static factory; để subclass chọn sản phẩm trong một thuật toán có sẵn thì Factory Method; cần một bộ sản phẩm nhất quán có thể thay đổi theo cấu hình thì Abstract Factory. Không nên tạo nhiều lớp factory nếu constructor hoặc static method đơn giản đã đủ.
  - question: Khi nào Builder phù hợp hơn constructor nhiều tham số hoặc factory method?
    readmeRelated:
      anchorList:
      - lifecycle-005
      - design-patterns-003
    knowledge: Builder hữu ích nhiều tham số tùy chọn/combination; bảo vệ required fields bằng staged API hoặc build validation.
    answer: |-
      **Builder** đặc biệt hữu ích khi object có nhiều tham số tùy chọn, các tổ hợp hợp lệ khác nhau, tên tham số cần dễ đọc, hoặc quá trình khởi tạo gồm nhiều bước rồi mới kiểm tra invariant. Ví dụ `ReportOptions.builder().title("...").locale(...).includeCharts(true).build()` rõ ràng hơn constructor có nhiều `boolean` hoặc nhiều overload.

      Builder giúp tránh telescoping constructors, gom giá trị mặc định và có thể validate **toàn bộ tổ hợp** ở `build()`: ngày bắt đầu không sau ngày kết thúc, ít nhất một kênh gửi, tổng tiền không âm. Với required fields, truyền chúng ở constructor của builder, dùng staged builder khi thật sự cần compile-time guarantees, hoặc kiểm tra ở `build()` và ném lỗi có ý nghĩa. Sau khi build nên tạo immutable object và defensive copy với collection mutable; tránh để builder tiếp tục thay đổi object đã tạo.

      **Constructor** thường tốt hơn khi chỉ có vài tham số bắt buộc, thứ tự dễ hiểu và mọi giá trị đã sẵn sàng. **Named/static factory method** phù hợp với một vài cách tạo rõ mục đích (`of`, `from`, `parse`) và không cần chuỗi cấu hình. Builder thêm code, allocation và một API cần duy trì; nếu object đơn giản thì đây có thể là phức tạp không cần thiết.
  - question: Strategy và State pattern giống nhau ở polymorphism nhưng khác nhau về ý nghĩa nghiệp vụ nào?
    readmeRelated:
      anchorList:
      - modeling-008
      - design-patterns-008
      - design-patterns-009
    knowledge: Strategy thay thuật toán/chính sách có thể chọn; State quản lý hành vi theo trạng thái và transition hợp lệ.
    answer: |-
      Strategy và State đều dùng **composition + polymorphism**: một context giữ reference tới interface, ủy quyền lời gọi cho implementation hiện tại. Điều khác biệt nằm ở **ý nghĩa và vòng đời thay đổi**.

      **Strategy** biểu diễn *thuật toán/chính sách thay thế* được chọn bởi client, cấu hình hoặc nghiệp vụ, ví dụ `DiscountPolicy.calculate(cart)` cho khách thường/VIP. Chuyển Strategy là chuyển cách tính, thông thường không đồng nghĩa với việc domain object chuyển trạng thái; mỗi Strategy có thể stateless và được dùng lại.

      **State** biểu diễn *trạng thái hiện tại* của một object và quy tắc **transition**: `OrderState.pay(order)`, `OrderState.ship(order)` phản ứng khác nhau khi order đang `NEW`, `PAID` hoặc `SHIPPED`. State implementation có thể chuyển context sang state kế tiếp sau khi kiểm tra invariant. State pattern có giá trị khi hành vi và transition thay đổi theo trạng thái; một enum + state machine đơn giản cũng có thể là thiết kế tốt.

      Vì thế không gọi mọi tập implementation là Strategy, cũng không dùng State chỉ vì có vài biến thể thuật toán. Dùng State khi cần kiểm soát chuyển trạng thái và cấm hành vi không hợp lệ; dùng Strategy khi muốn thay một policy độc lập theo runtime. Với cả hai, phải định nghĩa rõ contract, lỗi và cách quản lý thread safety của context nếu bị nhiều luồng cùng sử dụng.
  - question: Decorator khác inheritance khi mở rộng hành vi mà không sửa implementation gốc thế nào?
    readmeRelated:
      anchorList:
      - composition-004
      - design-patterns-006
      - refactoring-007
    knowledge: Decorator bọc cùng interface bổ sung trách nhiệm theo composition; inheritance cố định mở rộng theo hierarchy.
    answer: |-
      **Decorator** bao bọc một object đang thực thi cùng interface, ủy quyền lời gọi cho object đó rồi bổ sung hành vi trước/sau/trong lúc gọi. Ví dụ `CachingRepository(delegate)`, `LoggingRepository(delegate)` đều implement `Repository`, nên có thể kết hợp `new LoggingRepository(new CachingRepository(realRepository))` mà không sửa class gốc. Thứ tự decorator có ý nghĩa: log ngoài cache khác với log chỉ các request đi tới backend.

      **Inheritance** bổ sung hành vi bằng override ở subclass. Nó cố định quan hệ class, có nguy cơ fragile base class và bùng nổ tổ hợp như `CachedLoggedRepository`, `TimedCachedLoggedRepository` khi nhiều chức năng phụ kết hợp. Decorator dùng composition nên có thể chọn và lắp các chức năng độc lập, dễ mock/test từng lớp.

      Decorator vẫn phải giữ **hợp đồng của interface**: exception, null, dữ liệu trả về, side effect. Đặc biệt caching thay đổi quan sát về tính mới của dữ liệu, retry có thể nhân số lần side effect, logging có thể lộ dữ liệu nhạy cảm; không phải cứ giữ chữ ký là không thay đổi semantics. Càng nhiều lớp bọc càng khó debug và theo dõi thứ tự; chỉ dùng khi behavior thực sự là concern độc lập có thể ghép.
  - question: Adapter và Facade khác nhau về mục tiêu chuyển đổi interface và đơn giản hóa subsystem ra sao?
    readmeRelated:
      anchorList:
      - design-patterns-005
      - design-patterns-007
    knowledge: Adapter chuyển interface/semantics không tương thích; Facade cung cấp API đơn giản cho subsystem phức tạp.
    answer: |-
      **Adapter** giải quyết vấn đề **interface hoặc semantics của một dependency không phù hợp** với contract client cần. Ví dụ domain dùng `PaymentPort.authorize(PaymentIntent)`, còn SDK bên ngoài dùng `VendorClient.requestCharge(Map)`. `VendorPaymentAdapter` implements `PaymentPort`, chuyển kiểu dữ liệu, đơn vị tiền, trạng thái và lỗi vendor thành contract nội bộ. Adapter giúp giữ domain độc lập với SDK và có thể thay vendor.

      **Facade** đưa ra một **điểm vào đơn giản** cho cả subsystem phức tạp. Ví dụ `CheckoutFacade.placeOrder(request)` phối hợp inventory, pricing, payment và shipping theo một use case, để caller không cần tự gọi đúng thứ tự từng service. Facade chủ yếu giảm kiến thức mà client phải có về cấu trúc subsystem; không nhất thiết chuyển một interface sang interface khác không tương thích.

      Adapter thường nằm ở **ranh giới tích hợp** và hướng đến tương thích; Facade nằm ở ranh giới một **tập chức năng** và hướng đến API dễ dùng. Một adapter có thể gọi Facade, hoặc Facade dùng nhiều adapter, nhưng đừng che lỗi/mất semantics khi giản lược: transaction, rollback, timeout và trách nhiệm orchestration vẫn phải thiết kế rõ.
  - question: Observer cần xử lý đăng ký, hủy đăng ký, thứ tự sự kiện và exception của subscriber như thế nào?
    readmeRelated:
      anchorList:
      - lifecycle-006
      - design-patterns-010
    knowledge: Observer subscription lifecycle, unsubscribe tránh leak, thứ tự callback, exception isolation và concurrency.
    answer: |-
      **Observer** cho subject phát sự kiện tới các subscriber đã đăng ký. Thiết kế cần nêu rõ subscription được giữ bằng token/`Subscription` hay `unsubscribe(listener)`, ai sở hữu nó, khi nào đóng, và listener có thể tự unsubscribe trong callback không. Nếu subject sống lâu còn subscriber sống ngắn, reference mạnh trong danh sách listener có thể giữ subscriber không được GC → leak; nên hủy đăng ký khi component đóng hoặc dùng cơ chế weak reference với semantics rõ ràng.

      Về **thứ tự**, phải công bố callback chạy đồng bộ theo thứ tự đăng ký, bất định, hay bất đồng bộ qua queue. Nếu callback đồng bộ, một subscriber chậm sẽ giữ producer; nếu bất đồng bộ, cần chính sách ordering theo key, giới hạn queue/backpressure, duplicate delivery và retry. Không nên để caller mặc định tin rằng event đến đúng một lần hoặc luôn theo thứ tự nếu hệ thống không cam kết.

      **Exception isolation:** quyết định subscriber lỗi sẽ làm dừng cả lần publish hay được ghi nhận rồi tiếp tục với subscriber khác; đa số event thông báo nên tách lỗi để một observer không chặn những observer còn lại, nhưng đây là lựa chọn nghiệp vụ. Chụp snapshot danh sách subscriber hoặc dùng collection/locking phù hợp để tránh concurrent modification khi subscribe/unsubscribe. Test tình huống listener throw, tự hủy, đăng ký mới giữa callback, reentrancy và race; với event nghiệp vụ quan trọng cần cân nhắc transactional outbox/message broker thay callback trong bộ nhớ.
  - question: Template Method có ưu điểm gì và rủi ro nào khi dùng subclass hook?
    readmeRelated:
      anchorList:
      - inheritance-010
      - composition-008
      - design-patterns-011
    knowledge: Template Method cố định skeleton với hook subclass; cân nhắc fragile base, composition/Strategy khi hook khó
      kiểm soát.
    answer: |-
      **Template Method** đặt skeleton thuật toán trong superclass, thường là method `final` gọi các bước cố định và một số hook `protected` để subclass tùy biến. Ví dụ một `ImportJob.execute()` lần lượt validate, parse, persist và cleanup, trong khi từng subclass override `parse()` cho định dạng riêng. Điểm mạnh là thứ tự bước và invariant chung nằm tại một chỗ, giảm lặp code, và subclass chỉ cung cấp phần biến thiên đã định nghĩa.

      Rủi ro là subclass phải hiểu contract ngầm của hook: khi nào được gọi, lần nào, state nào đã sẵn sàng; superclass đổi call order, thêm hook hoặc gọi overridable method trong constructor có thể phá subclass dù API nhìn ngoài không đổi (**fragile base class**). Nếu hook có thể throw, cũng cần bảo đảm finally/cleanup và trạng thái sau lỗi.

      Nên công bố precondition/postcondition của hook, khóa những bước không cho override, giữ state `private`, tránh `this` escape, và có contract tests cho các subclass. Nếu có nhiều biến thể độc lập hoặc cần thay behavior runtime, thường dễ bảo trì hơn khi giữ skeleton trong một concrete coordinator và inject các `ParserStrategy`, `Validator` hoặc callback phù hợp; đó là composition thay inheritance.
  - question: Singleton có thể gây những vấn đề nào với shared mutable state, concurrency và test isolation?
    readmeRelated:
      anchorList:
      - class-003
      - design-patterns-004
      - design-pitfalls-008
    knowledge: Singleton/global mutable state dẫn đến hidden coupling, race, test order dependence; cân nhắc DI và immutable
      config.
    answer: |-
      **Singleton** chỉ bảo đảm cách truy cập một instance trong phạm vi classloader/thiết kế khởi tạo nhất định; nó không tự làm instance **thread-safe** hay immutable. Nếu singleton chứa `HashMap`, bộ đếm hoặc current user mutable dùng chung, các request có thể quan sát state của nhau, xảy ra lost update, visibility bug hoặc race. Cần thiết kế synchronization, concurrent collection, atomic operation hoặc loại bỏ shared mutable state; chỉ thêm `volatile` không làm mọi tổ hợp thao tác atomic.

      Global singleton cũng làm **dependency ẩn**: method tự gọi `ConfigManager.getInstance()` khiến test khó thay thế và phụ thuộc thứ tự chạy. Một test sửa state hoặc cấu hình singleton có thể làm test kế tiếp fail, nhất là khi chạy song song; unit test khó reset mà không chọc vào implementation detail.

      Ưu tiên **constructor injection** cho service có lifecycle do application container quản lý và immutable configuration/adapter stateless khi có thể; scope của DI container phải phù hợp. Khi cần singleton thật, Java enum hoặc holder idiom có thể khởi tạo thread-safe nhưng vẫn phải quản lý mutable state, resource cleanup và test isolation. Không sử dụng pattern chỉ để tránh truyền dependency rõ ràng qua constructor.
  - question: Khi nào Chain of Responsibility phù hợp hơn một chuỗi điều kiện xử lý tập trung?
    readmeRelated:
      anchorList:
      - design-patterns-006
    knowledge: Chain of Responsibility phù hợp pipeline handler độc lập có thể dừng/chuyển tiếp, cần chính sách thứ tự và
      xử lý lỗi.
    answer: |-
      **Chain of Responsibility (CoR)** hữu ích khi một request lần lượt đi qua các handler độc lập, mỗi handler có thể **xử lý và dừng** hoặc **chuyển tiếp** cho handler kế tiếp. Ví dụ chuỗi xử lý request gồm xác thực, giới hạn tốc độ, audit, rồi business handler; hoặc hệ thống hỗ trợ nhiều loại chứng từ, handler nào nhận trách nhiệm thì xử lý. Mỗi handler tuân cùng contract như `handle(request, next)` và chỉ biết successor, cho phép thêm/bớt/sắp xếp bước tại composition root.

      So với chuỗi `if/else` tập trung, CoR giảm coupling khi nhiều step thay đổi độc lập, có plugin hoặc cần tái sử dụng pipeline giữa use case. Nhưng phải xác định rõ **thứ tự** (auth trước business), điều kiện chuyển tiếp, handler có thể gọi `next` bao nhiêu lần, hành vi nếu không handler nào xử lý, và policy exception/rollback. Retry trong handler có side effect cần idempotency; async chain còn cần timeout và cancellation.

      Nếu chỉ có hai nhánh cố định ở một method và không có extension thực, `if/else` rõ ràng dễ đọc hơn. CoR cần test sự kết hợp, short-circuit, exception propagation, thứ tự và trường hợp không có handler phù hợp. Một validation pipeline luôn chạy **tất cả** các bước có thể cần contract riêng, đừng giả định nó có cùng semantics với CoR dừng tại bước đầu tiên xử lý.
  - question: Bạn quyết định bỏ một design pattern không còn mang lại giá trị bằng những dấu hiệu nào?
    readmeRelated:
      anchorList:
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-008
    knowledge: Đánh giá variation thực, lớp trung gian vô ích, khó debug/test; inline/remove pattern khi giảm complexity an
      toàn.
    answer: |-
      Một design pattern không còn mang lại giá trị khi **biến thể mà nó dự đoán không tồn tại**, các interface chỉ có một implementation không tạo boundary cần thay, factory chỉ `new` một class, hierarchy có nhiều tầng chuyển tiếp vô nghĩa, hoặc để hiểu một use case phải đi qua quá nhiều lớp delegation. Tín hiệu thực tế gồm thay đổi nhỏ cần sửa nhiều file, debug call stack khó, test chỉ xác nhận mock được gọi chứ không kiểm tra hành vi, và các lớp mang tên pattern nhưng không bảo vệ invariant nào.

      Trước khi bỏ pattern, xác minh **contract và nhu cầu mở rộng**: có integration/test seam cần giữ, framework nào dựa vào proxy/subtype, hay một module khác dùng interface đó không? Khóa behavior bằng characterization/contract tests; ghi rõ các case biên, null, exception, transaction và side effect.

      Sau đó đơn giản hóa từng bước: inline factory không cần thiết, dùng concrete class với constructor injection, hợp nhất lớp chỉ forwarding, thay inheritance sai is-a bằng collaborator hoặc gỡ decorator không còn áp dụng. Chạy test trên public behavior và kiểm tra dependency/đường gọi thực tế; tránh refactor một lần quá rộng.

      Đánh giá thành công bằng **độ rõ ràng, số điểm phải sửa cho một thay đổi thật, độ dễ kiểm thử và rủi ro regression**. KISS/YAGNI không có nghĩa xóa abstraction hữu ích; một port ổn định trước hệ thống ngoài có thể có đúng một adapter nhưng vẫn xứng đáng tồn tại.
- groupID: 10
  groupName: Domain modeling và workflow
  questions:
  - question: Phân biệt entity, value object, domain service và aggregate trong mô hình hướng đối tượng như thế nào?
    readmeRelated:
      anchorList:
      - object-004
      - class-design-006
      - class-design-007
      - practice-005
    knowledge: Entity có identity; value object equality theo value; domain service xử lý quy tắc ngoài một entity; aggregate
      giữ consistency.
    answer: |-
      **Entity, value object, domain service và aggregate** khác nhau về identity, behavior và consistency boundary.

      - **Entity:** có identity bền vững xuyên vòng đời, ví dụ Order với orderId. State có thể thay đổi nhưng vẫn là cùng một đơn hàng; behavior của entity bảo vệ invariant của nó.
      - **Value object:** được nhận diện bởi nội dung giá trị, chẳng hạn Money(amount,currency), DateRange(start,end). Thường immutable, equality dựa các thành phần và constructor bảo đảm giá trị hợp lệ.
      - **Domain service:** quy tắc nghiệp vụ không gắn tự nhiên với một entity, ví dụ một chính sách tính phí liên nhiều loại account. Không phải nơi chứa mặc định toàn bộ logic controller/SQL.
      - **Aggregate:** tập entity/value object được quản lý như một **consistency boundary**. Aggregate root là cửa ngõ mutation, ví dụ Order quản lý OrderLine và điều kiện tính tổng.

      Order.changeQuantity(lineId,qty) kiểm qty dương, cập nhật line và bảo đảm tổng đúng. Money làm value object không chứa identity riêng. Application service phối hợp repository/transaction; domain service xử lý chính sách độc lập khi cần.

      Không nên đồng nhất mỗi bảng database với một aggregate. Aggregate quá lớn gây contention; quá nhỏ có thể để invariant cần nhất quán ngay bị phân tán. Chọn boundary theo quy tắc nghiệp vụ và độ nhất quán thực sự cần có, không theo sơ đồ ORM.
  - question: Bạn xác định entity identity khi hai khách hàng có cùng tên nhưng mã định danh khác nhau ra sao?
    readmeRelated:
      anchorList:
      - object-004
      - class-design-006
      - language-mechanics-006
    knowledge: Identity dựa ID ổn định, không dựa name/email mutable hoặc không unique; phân biệt identity với thuộc tính
      hiển thị.
    answer: |-
      Hai Customer có cùng tên "An" vẫn là **hai entity khác nhau** nếu customerId của họ khác nhau. Identity là đặc tính xác định *đối tượng nghiệp vụ nào* qua các lần thay đổi state; name, email, phone là thuộc tính có thể trùng hoặc thay đổi và không mặc nhiên là khóa nhận diện.

      Ví dụ Customer(101,"An") và Customer(202,"An") là hai khách hàng. Nếu repository load Customer 101 hai lần vào hai Java instance khác nhau, == có thể false nhưng về **entity identity nghiệp vụ** cả hai đại diện cho id=101.

      ID nên ổn định và unique đúng scope, kể cả tenant khi hệ thống multi-tenant. Natural key chỉ phù hợp nếu được bảo đảm duy nhất và bất biến; email dễ đổi nên thường không thích hợp. Nếu id chỉ xuất hiện sau persist, phải quyết định chính sách equality cho transient entities chưa có ID; không được coi mọi entity có id=null là bằng nhau.

      Java == so reference; equals/hashCode do contract của entity quy định, thường gắn identity nhưng cần cân nhắc ORM proxy, lifecycle và consistency của hash nếu dùng entity làm HashMap key. Một Customer đổi tên không trở thành entity mới, và hai khách hàng cùng tên không được tự động gộp.

      **Entity identity khác value equality**: kiểm trùng danh tính bằng ID, còn phát hiện dữ liệu trùng lặp theo tên/email là quy tắc riêng của domain.
  - question: Vì sao value object nên được so sánh theo giá trị thay vì reference identity?
    readmeRelated:
      anchorList:
      - object-004
      - class-design-006
      - language-mechanics-006
      - practice-005
    knowledge: Value object biểu thị giá trị như Money/Address, `equals/hashCode` theo thành phần và ưu tiên immutability.
    answer: |-
      **Value object** biểu thị *giá trị* thay vì *instance*. Hai Money có amount=100, currency="VND" có cùng ý nghĩa dù tạo ra hai object khác nhau; so bằng == trên reference không phản ánh semantics này. Equality nên dựa các thành phần mang ý nghĩa nghiệp vụ.

      Ví dụ Java record:
          record Money(long amount, String currency) {
            Money {
              if (amount < 0) throw new IllegalArgumentException();
              if (currency == null || currency.isBlank()) throw new IllegalArgumentException();
            }
          }
          Money a = new Money(100, "VND");
          Money b = new Money(100, "VND");
          // a.equals(b) là true; a == b là false với hai instance riêng

      Value object thường **immutable**: phép cộng tạo Money mới thay vì sửa shared object, giúp an toàn khi làm key/cache và chia sẻ đa luồng. Equality/hashCode nhất quán với thành phần; Money(100,"USD") không bằng Money(100,"VND"). Phép toán phải kiểm đơn vị tiền tệ tương thích và quy tắc precision/rounding thích hợp.

      Record cung cấp shallow immutability; nếu field là collection hoặc object mutable, vẫn cần defensive copy. Không phải value object nào cũng có thể dùng record đơn giản nếu có normalization/invariant phức tạp.

      Trade-off là thêm type, mapping/serialization và allocation, nhưng có lợi khi giá trị có quy tắc riêng. Đừng tạo wrapper cho mọi primitive chỉ vì thích OOP.
  - question: Aggregate root chịu trách nhiệm bảo vệ những invariant nào của các object bên trong aggregate?
    readmeRelated:
      anchorList:
      - encapsulation-002
      - composition-007
      - relationships-003
      - class-design-007
      - testing-003
      - practice-002
    knowledge: Aggregate root là cửa ngõ mutation, bảo vệ invariant xuyên các entity/value object trong transaction boundary.
    answer: |-
      **Aggregate root** là đầu mối bảo vệ invariant giữa các object bên trong cùng consistency boundary. Caller bên ngoài không nên trực tiếp sửa child entity/collection theo cách root không thể kiểm tra.

      Ví dụ Order có OrderLine:
      - Mỗi line thuộc đúng Order và có quantity hợp lệ (thường >0), đơn giá/tiền tệ đúng contract.
      - Không duplicate line theo khóa business xác định.
      - Total phải nhất quán với các line, discount và tax theo quy tắc Order.
      - Khi Order đã PAID/SHIPPED, những thay đổi line bị cấm hoặc phải qua một workflow riêng.
      - Chuyển trạng thái DRAFT→PAID→SHIPPED phải tuân guard của root.

      Cho phép Order.addLine(), changeQuantity(), pay(), ship() thay vì public getLines().add(...) hoặc setStatus() tự do. Root kiểm điều kiện trước khi commit; một transaction cùng cơ chế optimistic locking/version khi cần bảo vệ updates đồng thời.

      **Phạm vi không vô hạn:** Order không chịu trách nhiệm trực tiếp giữ mọi invariant của Customer, Inventory, Payment thuộc aggregate khác. Những ràng buộc xuyên aggregate cần orchestration/transaction/điều phối phù hợp. Một aggregate quá rộng tăng contention, nhưng quá hẹp lại làm mất khả năng bảo đảm invariant cần atomicity. Boundary phải theo tính nhất quán nghiệp vụ, không chỉ quan hệ foreign key.
  - question: Rich domain model khác anemic domain model ở nơi đặt các quy tắc nghiệp vụ thế nào?
    readmeRelated:
      anchorList:
      - encapsulation-008
      - class-design-007
      - design-pitfalls-003
      - refactoring-004
    knowledge: Rich model giữ hành vi/invariant trong domain object; anemic model đẩy quy tắc sang service/controller.
    answer: |-
      **Rich domain model** đặt quy tắc và chuyển trạng thái vào object sở hữu state. **Anemic domain model** thường chỉ chứa data/getter/setter; service hoặc controller lấy từng field, tự quyết định rồi cập nhật qua setter, làm quy tắc bị rải rác.

      Ví dụ anemic: Order có getStatus()/setStatus(); OrderService kiểm paid trước khi setStatus(SHIPPED). Một consumer khác có thể bỏ qua kiểm tra. Rich model đưa logic vào Order.ship(): chỉ cho phép trạng thái PAID chuyển sang SHIPPED, từ chối trạng thái sai và giữ state cũ. Mọi entry point đều gọi command này.

      Lợi ích của rich model: information hiding, invariant một owner, unit test domain không cần HTTP/DB, giảm trùng quy tắc và change impact. **Không có nghĩa entity phải tự kết nối DB, gọi email hay SDK**: application service lo authorization, transaction, repository, external calls; domain service lo quy tắc không thuộc tự nhiên về một entity.

      Trade-off: một ứng dụng CRUD thuần, DTO/read model hoặc xử lý dữ liệu đơn giản có thể dùng anemic data holder có chủ ý. Không ép business logic giả vào mọi record chỉ để trông có nhiều method.

      Thước đo là nơi đặt invariant và trách nhiệm khi yêu cầu thay đổi, không phải số getter hay số class.
  - question: Khi nào một nghiệp vụ nên được thực hiện bởi entity và khi nào bởi domain service?
    readmeRelated:
      anchorList:
      - class-design-006
      - class-design-004
      - modeling-003
      - refactoring-004
    knowledge: Entity xử lý quy tắc thuộc state của mình; domain service cho operation liên nhiều entity/không có owner tự
      nhiên.
    answer: |-
      Đặt hành vi ở **entity** khi quyết định liên quan chủ yếu đến state/invariant của entity đó: Account.withdraw(amount) kiểm số dư; Order.ship() kiểm trạng thái và transition. Điều này giúp mọi caller chịu một contract và không lặp quy tắc.

      Dùng **domain service** khi quy tắc có ý nghĩa domain nhưng không có owner entity tự nhiên hoặc cần phối hợp nhiều entity/value object. Ví dụ TransferFeePolicy tính phí chuyển tiền dựa loại account, vùng và chính sách độc lập; không nhất thiết gắn với riêng Account gửi hoặc nhận.

      Một luồng chuyển tiền có thể gồm:
      1. Application service load các Account, xác thực quyền và transaction boundary.
      2. Domain service/policy xác định phí hoặc điều kiện liên các chủ thể.
      3. Account thực hiện debit/credit qua method giữ invariant.
      4. Application service commit và điều phối event/notification sau giao dịch.

      Domain service không nên trở thành God Service nhét hết setter, SQL và HTTP; hạ tầng thuộc application/infrastructure. Nếu một service liên tục đọc state của một entity rồi sửa field của entity đó, cân nhắc chuyển behavior về entity.

      **Câu hỏi thiết kế:** Ai sở hữu dữ liệu phải luôn hợp lệ? Quy tắc có chỉ liên tới state owner này không? Nếu phụ thuộc nhiều owner độc lập, service/policy nào mới là nơi tự nhiên? Cân nhắc cohesion, transaction và coupling khi quyết định.
  - question: Bạn thiết kế workflow chuyển trạng thái có ràng buộc như duyệt vay hoặc hủy đặt vé thế nào?
    readmeRelated:
      anchorList:
      - encapsulation-009
      - class-design-008
      - modeling-008
      - design-patterns-009
      - testing-003
    knowledge: State machine với guarded transitions, forbidden transitions và tests; tránh public status setter cho workflow.
    answer: |-
      Workflow cần được mô hình hóa như **state machine**, gồm tập trạng thái, transition hợp lệ, preconditions, postconditions và chuyển đổi bị cấm. Public setStatus(String) cho mọi caller là đường bypass validation.

      Ví dụ LoanApplication: DRAFT→SUBMITTED→APPROVED hoặc REJECTED; chỉ APPROVED mới được DISBURSED. approve(reviewer, decision) kiểm hồ sơ đầy đủ, trạng thái hiện tại và dữ liệu quyền duyệt đã được xác minh; không cho APPROVED→DRAFT tùy tiện. Booking có RESERVED→CANCELLED trong thời hạn cho phép nhưng USED không thể cancel theo cùng quy tắc.

      Thiết kế:
      - Status private, cung cấp commands submit(), approve(), reject(), cancel().
      - Kiểm hết điều kiện trước khi commit; sau lỗi state phải giữ nguyên.
      - Lưu actor, timestamp, reason/audit nếu domain cần.
      - Test ma trận mọi transition hợp lệ/bị cấm, kiểm failed command không thay state.
      - Với request đồng thời, dùng optimistic version/transaction/locking để chặn double approve hoặc cancel/approve race.

      Các bước ngoài process như payout, email không tự rollback khi gán status thất bại; cân nhắc event/outbox hoặc saga nếu workflow phân tán.

      Không nhất thiết mọi status phải có một class State pattern riêng; enum với guard cũng tốt khi đủ rõ. Mục tiêu là một nơi định nghĩa luật chuyển trạng thái, không phải pattern cho đẹp.
  - question: Domain event giúp tách các phản ứng sau thay đổi trạng thái nhưng có thể tạo những rủi ro consistency nào?
    readmeRelated:
      anchorList:
      - class-design-004
      - modeling-008
      - design-patterns-010
      - relationships-007
    knowledge: Domain events tách subscribers, nhưng phải cân nhắc transaction timing, duplicate events, retries, idempotency.
    answer: |-
      **Domain event** ghi nhận một điều nghiệp vụ đã xảy ra, ví dụ OrderPaid(orderId,paymentId). Khi root hoàn thành transition, event có thể kích hoạt email, cập nhật read model, loyalty hoặc tích hợp hệ thống khác, giúp aggregate không gọi trực tiếp từng adapter.

      Rủi ro nhất quán:
      - Publish event **trước DB commit**: DB rollback nhưng subscriber đã xử lý.
      - DB commit xong rồi publish: process có thể crash trước publish, mất event.
      - Broker/handler thường xử lý at-least-once: duplicate events, retry và out-of-order delivery là khả năng có thật.
      - Read model hoặc side effect xử lý bất đồng bộ có độ trễ, không mặc nhiên strongly consistent.

      **Transactional outbox** ghi domain change và outbox record trong cùng local DB transaction; một publisher phát event từ outbox sau commit. Consumer idempotent dựa eventId/business ID, kiểm version/order khi cần; dùng retry, dead-letter và monitoring. Outbox không tự cho exactly-once end-to-end.

      Payload nên có ID, version và dữ liệu cần thiết, tránh gửi graph entity mutable lớn hoặc secret. Contract test duplicate/retry, rollback và failure handling. Domain event tốt để tách phản ứng, nhưng invariant bắt buộc trong cùng consistency boundary vẫn phải kiểm đồng bộ.
  - question: Khi một hành vi cần cập nhật nhiều aggregate, bạn cân nhắc transaction boundary và eventual consistency ra sao?
    readmeRelated:
      anchorList:
      - modeling-003
      - class-design-004
      - design-patterns-007
      - design-pitfalls-008
    knowledge: Phân định consistency boundary; tránh transaction phân tán tùy tiện, cân nhắc outbox/saga và eventual consistency.
    answer: |-
      Khi một use case cập nhật **nhiều aggregate**, xác định invariant nào bắt buộc đúng ngay và invariant nào có thể **eventually consistent**. Aggregate là consistency boundary tự nhiên nhưng không có luật tuyệt đối cấm một transaction chứa nhiều aggregate trong cùng database nếu business yêu cầu.

      Ví dụ đặt hàng cần Order, Inventory, Payment:
      1. Order tạo PENDING, Inventory giữ chỗ bằng reservation ID có tính idempotent.
      2. Payment được xử lý qua gateway, sau xác nhận Order cập nhật state phù hợp.
      3. Nếu payment thất bại, release reservation bằng compensation; nếu timeout thì tra trạng thái trước retry để tránh charge lặp.
      4. Application service/saga điều phối hành trình; từng aggregate vẫn giữ invariant của mình.

      Một local transaction cùng DB có thể bảo đảm update atomic giữa vài row nếu contention chấp nhận được. Khi vượt service/database, distributed transaction/2PC đắt và có hạn chế; thường cân nhắc saga, outbox và idempotent messages với eventual consistency.

      **Các rủi ro:** duplicate/out-of-order event, compensation thất bại, race cancel/confirm, trạng thái PENDING tồn tại lâu, yêu cầu reconciliation. Cần version, retry/backoff, dead-letter, quan sát và xử lý thủ công nếu thất bại không tự phục hồi.

      Nếu không được oversell hoặc vượt giới hạn tín dụng, phải có reservation/locking hoặc transaction boundary đủ mạnh cho ràng buộc đó; không viện eventual consistency để bỏ invariant quan trọng.
  - question: Vì sao Money, Address, DateRange hoặc Email có thể phù hợp dưới dạng value object hơn primitive field?
    readmeRelated:
      anchorList:
      - encapsulation-005
      - class-design-006
      - practice-005
    knowledge: Value object đóng gói validation, units, equality và hành vi của Money/Address/DateRange/Email thay primitive
      obsession.
    answer: |-
      **Money, Address, DateRange và Email** là ví dụ value object hữu ích vì chúng có domain semantics, validation và behavior mà primitive field không tự bảo đảm. Một long không biết đơn vị tiền; String bất kỳ không chứng tỏ email hợp lệ; hai LocalDate không tự bảo đảm khoảng ngày hợp lệ.

      - **Money:** amount+currency và chính sách precision/rounding. Cộng hai Money phải kiểm currency, tránh 100 USD + 100 VND.
      - **Address:** thành phần có nghĩa và định dạng/validation; shipping address có thể là snapshot, không tự đổi theo hồ sơ khách hàng.
      - **DateRange:** start/end, invariant end>start hoặc >=start theo chính sách; contains()/overlaps() gom cùng công thức.
      - **Email:** normalizing và syntactic validation thích hợp; kiểm cú pháp không chứng minh mailbox tồn tại.

      Value object thường immutable và equality theo thành phần. Constructor/factory giữ invariant, behavior trả object mới thay vì sửa giá trị đang chia sẻ. Java record tiện lợi nhưng chỉ shallow immutable; nested collections hoặc object mutable cần copy.

      **Trade-off:** tăng số type và mapping JSON/DB, phải chọn time zone, currency scale và localization chính xác. Không tạo wrapper cho mọi String không có quy tắc riêng. Nhưng nếu logic validation và đơn vị đang bị lặp ở nhiều service, value object giúp biến quy ước thành type-level contract dễ unit test và khó dùng sai.
- groupID: 11
  groupName: Java object contract và equality
  questions:
  - question: equals và hashCode phải tuân thủ hợp đồng nào để object dùng an toàn trong HashMap hoặc HashSet?
    readmeRelated:
      anchorList:
      - object-004
      - language-mechanics-006
      - design-pitfalls-009
      - practice-005
    knowledge: '`equals` phản xạ/đối xứng/bắc cầu/nhất quán; equal ⇒ cùng hashCode; mutable keys làm hash-based lookup lỗi.'
    answer: |-
      **Hợp đồng equals và hashCode.** equals(Object) phải phản xạ (x.equals(x)), đối xứng (x.equals(y) tương đương y.equals(x)), bắc cầu, nhất quán khi state dùng so sánh không đổi, và x.equals(null) là false. hashCode phải nhất quán trong thời gian object không đổi về equality; nếu equals true thì hashCode bằng nhau. Chiều ngược lại không bắt buộc: collision là hợp lệ.

      ~~~java
      import java.util.Objects;
      final class ProductKey {
          private final String store, sku;
          ProductKey(String store, String sku) {
              this.store = Objects.requireNonNull(store);
              this.sku = Objects.requireNonNull(sku);
          }
          @Override public boolean equals(Object o) {
              if (this == o) return true;
              return o instanceof ProductKey p &&
                     store.equals(p.store) && sku.equals(p.sku);
          }
          @Override public int hashCode() {
              return Objects.hash(store, sku);
          }
      }
      ~~~

      Hai ProductKey khác instance nhưng cùng store/sku phải có equals true và hashCode bằng nhau, nên HashMap có thể lookup bằng một key tương đương. Nếu chỉ override equals mà không override hashCode, hai key bằng nhau có thể nằm ở bucket khác. Một hashCode hằng số không sai hợp đồng nhưng làm tăng collision và giảm hiệu năng.

      **Vận hành an toàn:** tránh mutate field ảnh hưởng equality khi object nằm trong HashMap/HashSet; hash collection không tự di chuyển entry. Test cùng object, hai object cùng giá trị, khác giá trị, null, transitivity, symmetry và get/contains với key tương đương. Tránh inheritance equals làm mất symmetry giữa superclass/subclass. Với entity ID có thể sinh sau persist, cần chiến lược identity theo lifecycle riêng, không áp dụng value equality máy móc.
  - question: Vì sao sửa field tham gia hashCode khi object đang là key của HashMap có thể làm lỗi tra cứu?
    readmeRelated:
      anchorList:
      - object-005
      - language-mechanics-006
      - design-pitfalls-009
      - practice-005
    knowledge: Thay field góp phần hash thay đổi bucket tính theo hash mới; chọn immutable key hoặc không mutate khi làm key.
    answer: |-
      **HashMap tra cứu theo hash đã tính từ key.** Khi put, map xác định bucket/entry dựa trên hash và equality; khi get/containsKey, map tính lại hash của key được cung cấp. Nếu một field tham gia hashCode bị đổi khi entry còn trong map, hash mới có thể dẫn đến bucket khác, khiến lookup thất bại dù dùng lại đúng reference ban đầu. Bản thân map không theo dõi mutation của field.

      ~~~java
      import java.util.*;
      final class MutableKey {
          String code;
          MutableKey(String value) { code = value; }
          @Override public boolean equals(Object o) {
              return o instanceof MutableKey k &&
                     Objects.equals(code, k.code);
          }
          @Override public int hashCode() {
              return Objects.hashCode(code);
          }
      }
      Map<MutableKey, String> data = new HashMap<>();
      MutableKey key = new MutableKey("A");
      data.put(key, "value");
      key.code = "B";
      // data.get(key) có thể không tìm thấy entry đã put.
      ~~~

      Không khẳng định mọi thay đổi luôn tạo lỗi: hash có thể collision/trùng bucket, chi tiết cấu trúc cũng ảnh hưởng. remove(key) sau mutation cũng có thể không thành công. ConcurrentHashMap đồng bộ thao tác map, **không** bảo đảm key mutable an toàn.

      **Phòng tránh:** dùng String, UUID hoặc value object immutable cho key. Nếu giá trị khóa cần đổi, thực hiện remove bằng khóa cũ và put bằng khóa mới trong một quy trình nhất quán, xử lý concurrency/transaction nếu chia sẻ. Với entity có ID được cấp sau khi đã put vào Set, không dùng hash phụ thuộc mutable ID theo cách có thể thay đổi bucket. Viết test mutation/lookup để phát hiện các vấn đề này.
  - question: Comparator không nhất quán với equals ảnh hưởng thế nào đến TreeSet và TreeMap?
    readmeRelated:
      anchorList:
      - language-mechanics-006
      - practice-005
    knowledge: TreeSet/TreeMap xem comparator `compare==0` là trùng key; cần total ordering phù hợp equality/identity.
    answer: |-
      **TreeMap và TreeSet xác định trùng khóa qua comparator hoặc natural ordering.** Nếu compare(a,b) == 0, ordered collection coi hai key tương đương để thêm/tra cứu, dù equals của chúng trả false. Điều này khác HashMap/HashSet, vốn dựa trên hashCode/equals.

      ~~~java
      import java.util.*;
      record Employee(String id, String name) {}
      Comparator<Employee> byName =
          Comparator.comparing(Employee::name);
      Set<Employee> set = new TreeSet<>(byName);
      set.add(new Employee("E1", "An"));
      set.add(new Employee("E2", "An"));
      // set chỉ giữ một phần tử do comparator theo tên.
      ~~~

      Hai Employee khác id không equals theo record-generated equals nhưng comparator trả 0. Nếu business key là id, comparator nên xét id hoặc sắp theo name rồi thêm id làm tie-breaker. Chiều ngược cũng nguy hiểm: comparator phân biệt hai object equals true làm chúng cùng xuất hiện trong TreeSet theo ordering contract.

      **Ví dụ Java:** BigDecimal("1.0").compareTo(BigDecimal("1.00")) bằng 0 nhưng equals thường false vì scale; TreeSet và HashSet có thể có size khác nhau cho cùng cặp. Comparator phải tuân thủ ordering transitive, ổn định, và tốt nhất nhất quán với equals nếu client mong Set/Map có identity theo equals. Nếu chủ ý dùng order-equivalence khác equals, ghi rõ semantics contains/add/remove, không coi đó là bug không thể hiểu.
  - question: Bạn thiết kế equals cho entity có identity và cho value object khác nhau ra sao?
    readmeRelated:
      anchorList:
      - object-004
      - class-design-006
      - language-mechanics-006
      - practice-005
    knowledge: Entity equals theo identity ổn định đúng lifecycle; value object equals theo thành phần giá trị, hashCode đồng
      bộ.
    answer: |-
      **Entity và value object không dùng cùng nguyên tắc equality.** Value object được nhận diện theo các giá trị có ý nghĩa; Money có amount và currency giống nhau có thể equals true dù hai instance khác nhau. Nếu field bất biến, hashCode ổn định, tiện làm Map key/cache key. Entity được nhận diện bởi identity nghiệp vụ bền vững trong vòng đời; đổi email/địa chỉ không đổi danh tính của Customer.

      ~~~java
      import java.util.Objects;
      final class Customer {
          private final String businessId;
          private String email;
          Customer(String id, String email) {
              businessId = Objects.requireNonNull(id);
              this.email = Objects.requireNonNull(email);
          }
          @Override public boolean equals(Object o) {
              return o instanceof Customer c &&
                     businessId.equals(c.businessId);
          }
          @Override public int hashCode() {
              return businessId.hashCode();
          }
          void changeEmail(String value) {
              email = Objects.requireNonNull(value);
          }
      }
      ~~~

      Ví dụ dùng businessId ổn định ngay khi tạo; không đại diện trực tiếp cho entity có ID auto-generated sau persist. Nếu equals chỉ so ID nullable, hai transient entity id null có thể nhầm là bằng nhau. Nếu hashCode phụ thuộc ID chuyển từ null sang số mới, HashSet có thể mất khả năng lookup.

      **Nuance ORM:** proxy class, detached entities, inheritance và lazy loading có thể ảnh hưởng getClass/instanceof, nên phải tuân theo semantics framework và contract miền. Có thể dùng object identity trước persist, nhưng cần xử lý lifecycle nhất quán. Test cùng entity ID qua thay đổi field, hai entity khác ID, transient/persisted/detached và proxy nếu thực sự dùng ORM. Value object test từng component và tránh nested mutable values.
  - question: Những rủi ro nào có thể xuất hiện khi toString duyệt quan hệ object hai chiều hoặc chứa thông tin nhạy cảm?
    readmeRelated:
      anchorList:
      - relationships-006
      - language-mechanics-007
    knowledge: toString tránh recursion qua parent-child, dữ liệu nhạy cảm, lazy-load và log quá lớn; giới hạn field an toàn.
    answer: |-
      **toString không nên duyệt toàn bộ object graph.** Nếu Parent.toString in danh sách Child và Child.toString lại in Parent, quan hệ hai chiều tạo vòng đệ quy có thể dẫn đến StackOverflowError. Lombok hoặc thư viện tự sinh toString cho mọi field cũng có thể làm điều này, đặc biệt với entity JPA hai chiều.

      ~~~java
      final class Parent {
          private final String id;
          private final java.util.List<Child> children = new java.util.ArrayList<>();
          Parent(String id) { this.id = id; }
          @Override public String toString() {
              return "Parent{id=" + id + ", children=" + children.size() + "}";
          }
      }
      final class Child {
          private final String id;
          private Parent parent;
          Child(String id, Parent parent) {
              this.id = id;
              this.parent = parent;
          }
          @Override public String toString() {
              return "Child{id=" + id + "}";
          }
      }
      ~~~

      Chỉ xuất các field đơn giản, định danh và count; không mở rộng ngược parent-child. Tránh để toString gọi lazy-loaded association vì có thể gây N+1 query hoặc lỗi khi session ORM đóng; không in object lớn vì gây log noise và chi phí CPU/bộ nhớ.

      **Bảo mật:** không đưa password, access token, cookie, PII nhạy cảm, payment data hoặc secret vào toString/log. Framework logging có thể gọi toString ngầm khi format đối tượng. Dùng logging có cấu trúc với danh sách field cho phép và redaction. toString dành cho debugging ngắn, không phải hợp đồng serialization hay audit event có định dạng bền vững; không nên có side effect.
  - question: Clone, copy constructor và copy factory khác nhau như thế nào trong việc kiểm soát aliasing?
    readmeRelated:
      anchorList:
      - class-006
      - object-006
      - encapsulation-007
    knowledge: Clone có bẫy shallow copy/Cloneable; copy constructor/factory cho kiểm soát ownership và deep copy từng thành
      phần.
    answer: |-
      **Clone, copy constructor và copy factory đều cần xác định mức sao chép.** Object.clone gắn với Cloneable thường tạo shallow field-by-field copy; object mới có identity khác nhưng reference tới List hoặc phần tử mutable có thể vẫn cùng object. Cloneable là marker, không cung cấp public clone API; có thêm quy tắc access protected, checked CloneNotSupportedException và inheritance/final-field dễ xử lý sai.

      Copy constructor như Snapshot(Snapshot other) và copy factory như Snapshot.copyOf(other) cho phép đặt contract rõ: validate dữ liệu, chọn có reuse instance không, thành phần nào immutable có thể chia sẻ, thành phần nào phải sao chép. Bản thân các cơ chế này **không tự deep copy**.

      ~~~java
      import java.util.*;
      final class InvoiceSnapshot {
          private final List<String> items;
          InvoiceSnapshot(Collection<String> source) {
              items = List.copyOf(source);
          }
          InvoiceSnapshot(InvoiceSnapshot other) {
              items = List.copyOf(other.items);
          }
          List<String> items() { return items; }
      }
      ~~~

      Với List<String>, List.copyOf snapshot cấu trúc và String immutable, nên source add/remove không sửa InvoiceSnapshot. Nhưng nếu phần tử là MutableLine, hai list vẫn có thể cùng trỏ vào phần tử đó; cần copy từng element hoặc chuyển sang value object.

      **Aliasing và cycle:** deep copy object graph không chỉ đệ quy đơn giản; cần giữ quan hệ chia sẻ đúng và tránh infinite loop trong graph có vòng, thường nhờ identity map. Ưu tiên constructor/factory có ownership contract rõ ràng, clone chỉ khi API/library yêu cầu và test kỹ shallow/deep semantics. Test mutate source/copy ở cả collection và nested elements.
  - question: Java record hỗ trợ value-based object nhưng có những hạn chế gì với nested mutable fields?
    readmeRelated:
      anchorList:
      - class-006
      - object-005
      - encapsulation-007
      - design-pitfalls-009
      - practice-005
    knowledge: Record auto equals/hashCode/accessors nhưng chỉ shallow immutable của field refs; nested collections vẫn có
      thể mutable.
    answer: |-
      **Java record hỗ trợ value semantics ở cấp component nhưng chỉ cố định tham chiếu, không tự deep immutable.** Record sinh private final component fields, canonical constructor, accessors, equals/hashCode/toString. Nếu component là ArrayList, caller giữ alias có thể tiếp tục add/remove; accessor sinh mặc định có thể trả lại reference mutable.

      ~~~java
      import java.util.*;
      record Basket(List<String> items) {
          Basket {
              items = List.copyOf(items);
          }
      }
      ~~~

      Compact constructor tạo snapshot cấu trúc không sửa được; với String immutable, list thành phần có value semantics khá an toàn. Với List<MutableProduct> thì product vẫn có thể đổi qua alias khác: cần clone/copy phần tử hoặc chuyển sang immutable DTO. List.copyOf không chấp nhận null elements.

      **Điểm dễ nhầm:** record chứa array không có equality theo từng phần tử như Arrays.equals chỉ vì là record; array có equals theo reference. Hai record với int[] khác reference nhưng cùng số có thể không equals, và mảng nội bộ vẫn sửa được qua accessor. Tương tự, Date mutable, AtomicInteger hay StringBuilder có thể làm equals/hashCode của record thay đổi theo state hoặc không có value equality mong đợi.

      **Sử dụng:** record phù hợp carrier/value object với component được validate, defensive copy và rõ equality; không mặc nhiên phù hợp entity có identity/lifecycle. Record implicitly final, không extends class tùy ý, nhưng có thể implements interface và thêm method. Khi dùng làm key, bảo đảm toàn bộ component tham gia equality có semantics ổn định.
  - question: Vì sao việc đưa mutable object vào shared cache có thể làm vi phạm invariant hoặc gây dữ liệu chéo giữa request?
    readmeRelated:
      anchorList:
      - object-007
      - encapsulation-007
      - design-pitfalls-008
    knowledge: Cache shared object mutable tạo cross-request alias/data races; cân nhắc immutable snapshots, copy-on-write
      hoặc ownership.
    answer: |-
      **Shared cache thường trả lại cùng object reference cho nhiều request.** Khi cache chứa một mutable UserProfile với role list, request A sửa list có thể làm request B thấy trạng thái thay đổi, dù B không có quyền; nếu cache key thiếu tenant/user, còn có nguy cơ trả dữ liệu của tenant khác. Đây là lỗi ownership, authorization và thread safety, không chỉ hiệu năng cache.

      ~~~java
      import java.util.*;
      record UserKey(String tenantId, String userId) {}
      record UserProfile(String displayName, List<String> roles) {
          UserProfile {
              roles = List.copyOf(roles);
          }
      }
      ~~~

      Nếu roles chứa String immutable, record trên không lộ quyền thay đổi list cấu trúc; key gồm tenantId và userId giúp phân vùng theo danh tính trong ví dụ. Tuy nhiên thiết kế cache key phải bao quát mọi chiều permission, locale/version theo business contract; immutable snapshot không sửa được key phân quyền sai.

      **Race và stale data:** nhiều thread mutate cùng ArrayList có thể gây lost update, visibility hoặc invariant bất nhất. ConcurrentHashMap chỉ đồng bộ thao tác map, không làm value mutable tự thread-safe. Dùng immutable snapshots, copy-on-write, atomic replacement hoặc khóa/transaction theo ownership. Đặt TTL/invalidation phù hợp, không cache JPA entity attached/lazy state rồi giả định connection/session còn sống. Test tenant isolation, mutation attempt, update visibility và eviction/invalidation; không bịa kết quả race nếu chưa chạy thực tế.
  - question: Trong API trả collection, bạn nên dùng null, empty collection, read-only view hay snapshot ở những trường hợp
      nào?
    readmeRelated:
      anchorList:
      - object-008
      - encapsulation-006
      - encapsulation-007
      - refactoring-005
    knowledge: Empty collection thay null cho trạng thái không có phần tử; phân biệt live read-only view với immutable snapshot
      và copy.
    answer: |-
      **Trả empty collection là mặc định phù hợp khi không có phần tử**, vì client có thể duyệt/size mà không xử lý null. Nếu null biểu thị chưa tải, unknown hay operation failed, cần định nghĩa riêng bằng Optional/result type hoặc documentation, không dùng null và empty lẫn lộn.

      **Phân biệt các lựa chọn:**
      - Mutable copy: new ArrayList<>(items) tách cấu trúc để caller có quyền sửa bản sao; vẫn shallow với các element mutable.
      - Read-only live view: Collections.unmodifiableList(items) chặn add/remove qua view nhưng nguồn mutable thay đổi thì view phản ánh thay đổi đó. Không bảo đảm thread safety.
      - Immutable snapshot: List.copyOf(items) tạo cấu trúc không cho sửa và không quan sát thay đổi cấu trúc nguồn sau snapshot; yêu cầu phần tử khác null, có thể tái sử dụng instance đã immutable, không deep-copy element.

      ~~~java
      import java.util.*;
      final class Order {
          private final List<String> items = new ArrayList<>();
          List<String> snapshot() { return List.copyOf(items); }
          List<String> writableCopy() { return new ArrayList<>(items); }
          List<String> liveView() {
              return Collections.unmodifiableList(items);
          }
      }
      ~~~

      **Trade-off:** copy/snapshot có chi phí O(n) về cấu trúc và allocation khi cần bản sao; live view có thể nhẹ hơn nhưng khiến client quan sát thay đổi bất ngờ. Trả List.of() cho empty thường rõ ràng. Không trả thẳng mutable list nội bộ nếu domain yêu cầu add/remove đi qua invariant. Trong API concurrent, phải mô tả snapshot được chụp tại thời điểm nào và việc đọc nhất quán, vì snapshot copy từ list đang bị mutate không tự bảo đảm an toàn.
  - question: Generics và bounded wildcard giúp biểu diễn mối quan hệ giữa các object trong hợp đồng Java thế nào?
    readmeRelated:
      anchorList:
      - language-mechanics-001
      - language-mechanics-002
      - language-mechanics-003
    knowledge: PECS `? extends T` cho producer, `? super T` cho consumer; invariant generic types và API substitutability.
    answer: |-
      **Java generic type arguments là invariant:** List<Dog> không phải subtype của List<Animal> dù Dog extends Animal. Nếu cho phép gán như thế, caller có thể add(new Cat()) vào danh sách Dog và phá type safety. Wildcard giúp hợp đồng mô tả vai trò producer/consumer theo **PECS: Producer Extends, Consumer Super**.

      ~~~java
      import java.util.*;
      class Animal {}
      class Dog extends Animal {}
      class Cat extends Animal {}

      static void readAnimals(List<? extends Animal> source) {
          Animal a = source.get(0); // Hợp lệ: đọc tối thiểu như Animal.
          // source.add(new Dog()) là lỗi compile.
      }
      static void addDog(List<? super Dog> target) {
          target.add(new Dog());    // Hợp lệ cho List<Dog/Animal/Object>.
          Object first = target.get(0);
      }
      static <T> void copy(List<? super T> dst, List<? extends T> src) {
          for (T value : src) dst.add(value);
      }
      ~~~

      Với extends, thực tế source có thể là List<Cat>, nên không thể add Dog hoặc Animal tùy ý (ngoại trừ null). Với super, đích có thể là List<Object>, do đó có thể thêm Dog nhưng chỉ chắc đọc như Object. Generic method copy diễn tả cùng kiểu T cho phần tử từ producer sang consumer.

      **Giới hạn:** generics thường bị type erasure khi runtime, không thể dùng instanceof List<String> như thể type argument luôn được giữ. Wildcard không thay validation, nullability, ownership hay nghiệp vụ. Khi một API cần vừa đọc vừa ghi cùng kiểu xác định, một type parameter T có thể rõ ràng hơn wildcard. Chỉ dùng wildcard tại ranh giới thật sự cần flexibility; lạm dụng làm hợp đồng khó đọc.
- groupID: 12
  groupName: Testing, refactoring và hiệu năng
  questions:
  - question: Unit test cho domain object nên kiểm tra public behavior và invariant thay vì thứ tự gọi helper nội bộ như thế
      nào?
    readmeRelated:
      anchorList:
      - encapsulation-002
      - testing-001
      - testing-008
      - refactoring-009
    knowledge: Unit test observable behavior, kết quả và invariant/nhánh từ chối; tránh verify calls đến private helper nội
      bộ.
    answer: |-
      Unit test cho domain object cần mô tả **hợp đồng công khai**: một lệnh hợp lệ tạo kết quả và trạng thái gì, lệnh không hợp lệ bị từ chối như thế nào, và invariant nào luôn đúng. Ví dụ với `Account.withdraw(amount)`, test số dư sau khi rút hợp lệ, thử rút vượt số dư và xác nhận exception được công bố cùng số dư không thay đổi; test số tiền âm hoặc bằng không theo quy tắc nghiệp vụ. Với `Order.ship()`, kiểm tra chỉ đơn đã thanh toán mới được chuyển trạng thái và các thuộc tính liên quan vẫn nhất quán.

      Nên thực hiện theo mẫu **Arrange–Act–Assert** qua constructor/factory và method public. Đối với các chuyển trạng thái, test chuỗi hành động hợp lệ, hành động lặp, lỗi giữa chừng và trạng thái sau lỗi, không chỉ test từng getter đơn lẻ. Bên cạnh ví dụ cụ thể, property-based tests có thể kiểm tra invariant xuyên nhiều dữ liệu đầu vào.

      Tránh assert thứ tự gọi `private validate()`, `private recomputeTotal()` hay số lần gọi helper; cách sắp xếp những helper đó là implementation detail và có thể thay đổi mà kết quả không đổi. Nếu phải mock quá sâu mới test được entity, có thể business logic đang bị tách khỏi object sở hữu state. Test internal collaborator chỉ khi thứ tự thực sự là **hợp đồng có thể quan sát**, chẳng hạn ghi log audit trước khi phát side effect bất hồi phục.
  - question: Contract test cho interface cần bao phủ những trường hợp null, exception và state transition nào?
    readmeRelated:
      anchorList:
      - abstraction-004
      - interface-008
      - testing-004
      - testing-005
    knowledge: Contract tests áp cùng input biên, null, exception, state transitions, side effects cho mọi implementation.
    answer: |-
      **Contract test** là bộ kiểm thử chung cho một interface, chạy nguyên bộ với **mọi implementation** để chứng minh khả năng thay thế theo Liskov Substitution Principle (LSP). Đầu tiên ghi rõ precondition, postcondition, nullability, exception, state change và side effect của contract; cùng chữ ký Java chưa bảo đảm cùng semantics.

      Ví dụ `Inventory.reserve(sku, qty)`: test input hợp lệ, `qty = 0`, âm, mã không tồn tại, thiếu hàng, null nếu contract cho phép/cấm; kết quả thành công phải giảm số lượng đúng một lần, thất bại không tạo reservation dở dang. Nếu API có trạng thái, kiểm tra `CREATED → RESERVED → RELEASED`, cấm transition không hợp lệ và xử lý thao tác lặp/idempotency theo quy ước. Đối với interface `Repository.findById`, chốt rõ không tìm thấy trả `Optional.empty()` hay ném exception; không để adapter A trả null còn adapter B trả empty.

      Chạy suite bằng test factory cung cấp mỗi implementation hoặc abstract test class. Kết hợp contract tests với integration tests cho persistence, network, transaction, timeout vì fake có thể giữ contract ở bộ nhớ nhưng không phát hiện lỗi adapter thật. Khi contract chưa quy định thứ tự, thời gian hay số lần callback, đừng assert những điều đó; khi có side effect, cần kiểm tra hành vi sau lỗi và chính sách retry/duplicate. Không dùng một bộ test chung để hợp thức hóa các implementation có semantics mâu thuẫn.
  - question: Bạn viết characterization tests như thế nào trước khi refactor một class lớn chưa có test?
    readmeRelated:
      anchorList:
      - testing-009
      - refactoring-009
      - practice-006
    knowledge: Characterization tests khóa behavior hiện hữu và edge cases trước thay đổi; refactor từng bước có regression
      checks.
    answer: |-
      **Characterization test** ghi nhận hành vi **đang tồn tại** của một class lớn trước khi refactor, kể cả các góc cạnh chưa được tài liệu mô tả. Trước tiên chọn những use case thật qua public API, tạo input đại diện và quan sát output, trạng thái sau gọi, exception, side effect ở boundary. Có thể dùng dữ liệu production đã ẩn thông tin nhạy cảm hoặc log để nhận diện đường đi thường gặp; với hệ thống khó cô lập, thử nghiệm trong môi trường an toàn với fake/recorded external dependencies.

      Ví dụ `PricingService.calculate(order)` có nhiều điều kiện khuyến mãi: tạo golden cases cho đơn không ưu đãi, nhiều ưu đãi đồng thời, đơn trống, giá trị biên, rounding, null và exception. Assert kết quả mà phiên bản hiện tại tạo ra; ghi chú rõ trường hợp nghi là bug để phân biệt **bảo toàn hành vi** với thay đổi yêu cầu có chủ đích. Không mặc nhiên coi mọi hành vi hiện tại đều đúng về nghiệp vụ.

      Sau khi có baseline, refactor từng bước nhỏ như extract method/class và move method. Chạy lại test ở mỗi bước, xem diff kết quả và mở rộng coverage khi gặp branch chưa được kiểm tra. Tránh snapshot khổng lồ hoặc mock thứ tự helper nội bộ, vì test dễ phụ thuộc cấu trúc cần thay đổi. Khi cần sửa bug được xác nhận, bổ sung test thể hiện behavior mong muốn rồi sửa trong một thay đổi riêng, rõ ràng.
  - question: Khi nào Extract Class, Move Method hoặc Replace Inheritance with Delegation là lựa chọn refactoring thích hợp?
    readmeRelated:
      anchorList:
      - inheritance-010
      - composition-008
      - design-pitfalls-001
      - design-pitfalls-004
      - refactoring-003
      - refactoring-004
      - refactoring-007
    knowledge: Extract Class khi nhiều trách nhiệm; Move Method về owner state; Replace Inheritance with Delegation khi sai
      is-a.
    answer: |-
      Ba refactoring giải quyết ba loại **trách nhiệm đặt sai chỗ**:

      - **Extract Class:** một class chứa nhiều nhóm field/method có cohesion riêng, thay đổi vì nhiều lý do khác nhau. Ví dụ `Invoice` vừa tính số tiền, render PDF, gửi email; tách `PdfInvoiceRenderer` và `InvoiceMailer`, để domain giữ phần tính toán và invariant hóa đơn. Phải xác định owner state, tránh chuyển thành một chuỗi delegate vô ích.
      - **Move Method:** một method liên tục đọc dữ liệu và áp quy tắc thuộc object khác, ví dụ service đọc các field của `Order` để kiểm điều kiện `canShip`; đưa behavior vào `Order` hoặc object sở hữu invariant. Kiểm tra dependency direction để không tạo vòng phụ thuộc và bảo vệ public contract.
      - **Replace Inheritance with Delegation:** subclass chỉ `extends` để tái sử dụng code, không đáp ứng is-a/LSP, hoặc hierarchy sâu lệ thuộc hook. Chuyển logic chung sang collaborator, inject hoặc tạo instance bên trong wrapper rồi chuyển tiếp những method cần thiết. Caller không còn bị ràng buộc vào chi tiết superclass.

      Trước khi làm, dùng characterization/contract tests khóa kết quả, exception, state transition và side effect hiện tại. Migrate dần một use case, cập nhật caller, chạy test, rồi mới xóa code không còn dùng. Cần kiểm tra framework mapping/serialization hoặc public subtype API nếu hệ thống bên ngoài còn phụ thuộc, để giữ backward compatibility hợp lý.
  - question: Bạn phát hiện và cải thiện anemic domain model mà không làm thay đổi kết quả nghiệp vụ ra sao?
    readmeRelated:
      anchorList:
      - class-design-007
      - design-pitfalls-003
      - testing-009
      - refactoring-004
      - refactoring-009
    knowledge: Chuyển logic từ service/controller về domain owner có invariant; giữ regression/characterization tests để bảo
      toàn behavior.
    answer: |-
      **Anemic domain model** xuất hiện khi entity chủ yếu là getter/setter, còn service/controller đọc field, tự tính quy tắc và sửa trạng thái. Dấu hiệu: nhiều nơi lặp `if (order.getStatus()==PAID) order.setStatus(SHIPPED)`, có thể gọi các setter ở thứ tự bất kỳ hoặc tạo trạng thái không hợp lệ. Không nên kết luận dựa vào số method; DTO dùng để vận chuyển dữ liệu có thể chủ ý anemic và hoàn toàn đúng.

      Để cải thiện, xác định **invariant và object sở hữu state** từ use case: đơn hàng phải thanh toán trước khi gửi; tổng tiền phản ánh line items; không được trừ số dư xuống âm. Chuyển kiểm tra và mutation vào hành vi `Order.ship()`, `Order.addItem(...)`, `Account.withdraw(...)`. Giữ state `private`, hạn chế setter mở toàn bộ field; application service vẫn điều phối transaction, repository và adapter hạ tầng. Nếu quy tắc phối hợp nhiều aggregate/nguồn bên ngoài, một domain service riêng có thể thích hợp hơn nhét tất cả vào entity.

      Trước refactor, viết characterization tests qua API hiện tại cho dữ liệu, lỗi và kết quả nghiệp vụ; sau đó di chuyển behavior từng phần, giữ interface ở boundary hoặc dùng adapter chuyển tiếp nếu cần. Test lại đường gọi từ controller, batch và message consumer để chắc mọi entry point cùng giữ invariant. Một refactor đạt yêu cầu nếu behavior mong đợi không đổi và không còn đường sửa state bỏ qua validation.
  - question: Vì sao shared mutable object giữa nhiều thread có thể gây lost update hoặc visibility problem?
    readmeRelated:
      anchorList:
      - class-003
      - object-007
      - design-pitfalls-008
    knowledge: Shared mutable state có non-atomic read-modify-write và thiếu happens-before; hiểu race, visibility và lost
      updates.
    answer: |-
      Khi hai thread cùng giữ reference tới một object **mutable**, từng thao tác tưởng đơn giản có thể gồm nhiều bước không atomic. Với `count++`, cả hai có thể đọc cùng giá trị 10, tính 11 rồi ghi 11, trong khi kết quả đúng sau hai increment phải là 12: đây là **lost update** do race trong read–modify–write.

      **Visibility problem** xảy ra khi một thread ghi state còn thread khác không có quan hệ *happens-before* bảo đảm quan sát giá trị mới: ví dụ vòng lặp `while (!stopped) {}` với `stopped` là field thường có thể không kết thúc đúng kỳ vọng. Không nên suy luận rằng thread luôn đọc trực tiếp từ RAM; Java Memory Model cho phép compiler/JIT/CPU tối ưu và sắp xếp trong giới hạn của mô hình bộ nhớ. `volatile` hoặc atomic variable có thể bảo đảm visibility và một số thứ tự cần thiết, nhưng `volatile int count` vẫn không làm `count++` atomic.

      Để xử lý, tránh chia sẻ mutable state khi có thể, hoặc bảo vệ **toàn bộ invariant và critical section** bằng synchronized/Lock; dùng `AtomicInteger.incrementAndGet()` cho một cập nhật đơn phù hợp. Nếu gồm nhiều field có quan hệ (balance, reserved), một atomic riêng lẻ cho mỗi field không tự giữ invariant xuyên các field. Viết concurrency tests có đồng bộ điểm bắt đầu để tăng khả năng tái hiện, nhưng không xem vài lượt test chạy qua là bằng chứng hết race; cân nhắc stress testing, code review và công cụ phân tích.
  - question: Immutable object, synchronization và atomic class khác nhau khi thiết kế object thread-safe như thế nào?
    readmeRelated:
      anchorList:
      - class-006
      - object-005
      - object-007
      - encapsulation-007
      - design-pitfalls-008
    knowledge: Immutability giảm shared writes; synchronization bảo vệ critical section/visibility; atomic types cho thao
      tác đơn giản.
    answer: |-
      **Immutability** làm state của object không thay đổi sau khi khởi tạo. Nếu object được khởi tạo và chia sẻ an toàn, nhiều thread có thể đọc mà không cần lock cho chính state bất biến đó; thích hợp cho value object, cấu hình và snapshot. Cần **defensive copy** các collection hoặc phần tử mutable, vì `final List` chỉ cố định reference chứ không làm nội dung bất biến; khái niệm safe publication vẫn quan trọng.

      **Synchronization** (`synchronized`, `ReentrantLock`, v.v.) bảo vệ vùng thao tác liên quan nhau. Lock vừa tạo mutual exclusion, vừa thiết lập happens-before giữa các unlock/lock tương ứng. Nó phù hợp khi cần đổi nhiều field thành một transaction in-memory để giữ invariant như debit và lịch sử giao dịch. Đánh đổi là contention, deadlock nếu quản lý lock sai và phức tạp về thứ tự lock.

      **Atomic classes** như `AtomicInteger`, `AtomicReference` thực hiện các thao tác nguyên tử/compare-and-set cho **một biến** hoặc một immutable snapshot được thay qua một reference. Ví dụ `incrementAndGet` tránh lost update, `compareAndSet` hỗ trợ cập nhật lạc quan. Với state nhiều field, có thể xây immutable state aggregate rồi CAS cả reference, hoặc dùng lock; các phép cập nhật riêng từng atomic không tự duy trì invariant liên field. Chọn theo cấu trúc state, contention và yêu cầu quan sát nhất quán, sau khi ưu tiên đơn giản hóa việc chia sẻ dữ liệu.
  - question: Bạn kiểm thử sự tương tác giữa nhiều object mà không phụ thuộc quá mức vào mock như thế nào?
    readmeRelated:
      anchorList:
      - testing-006
      - testing-010
      - practice-010
      - testing-008
    knowledge: Test public interaction giữa objects với fake ở external boundaries; tránh mock sâu/kiểm tra thứ tự method
      không thiết yếu.
    answer: |-
      Kiểm thử cộng tác giữa domain objects nên xuất phát từ **một use case và hành vi công khai**. Ví dụ `CheckoutService.placeOrder()` phối hợp `Cart`, `Order`, `PricingPolicy` và `InventoryPort`: tạo các domain object thật hoặc fake đơn giản cho các boundary bên ngoài, chạy use case rồi assert kết quả đơn hàng, số tiền, số lượng hàng giữ chỗ và trạng thái sau lỗi. Khi dùng object thật, test bắt được sai invariant mà chuỗi mock verification thường không phát hiện.

      Dùng **fake** như in-memory repository và fake payment adapter có cùng hợp đồng với hệ thống ngoài; dùng **stub** cho dữ liệu đã biết hoặc mock khi thật sự cần assert tương tác quan sát được (chỉ gửi một payment request, không gửi email khi giao dịch thất bại). Tránh mock sâu kiểu `when(order.getCustomer().getWallet()...)` và `verify(helper).validate()`, vì chúng ràng buộc test vào cấu trúc nội bộ và dễ báo lỗi khi refactor đúng.

      Khi thứ tự là quy tắc quan trọng (ví dụ không được charge trước khi reserve thành công), assert thứ tự **side effect ở boundary** hoặc trạng thái lưu, chứ không kiểm tra các helper không công khai. Hãy test thêm lỗi giữa nhiều object, retry và idempotency; với kết nối DB/broker thực, thêm integration tests để xác minh transaction semantics và contract mà fake không phản ánh đầy đủ.
  - question: Tại sao không nên khẳng định object-oriented design chậm chỉ dựa trên số lượng object được tạo?
    readmeRelated:
      anchorList:
      - oop-basic-008
      - lifecycle-007
    knowledge: Hiệu năng phụ thuộc JIT/escape analysis, allocation, GC và truy cập bộ nhớ; số object không tự chứng minh latency.
    answer: |-
      Không thể khẳng định **OOP chậm** chỉ từ số object được khởi tạo. Chi phí thực tế còn phụ thuộc size, lifetime, cache locality, synchronization, allocation rate, garbage collector và đặc điểm workload. JVM có các tối ưu hóa như JIT inlining, devirtualization khi call site đủ ổn định, escape analysis và một số trường hợp scalar replacement: object tạm không escape có thể được tối ưu để giảm hoặc bỏ allocation thực tế. Không nên khẳng định JVM luôn thực hiện những tối ưu đó cho mọi code.

      Allocation của object ngắn hạn trong heap trẻ thường tương đối rẻ; nhưng nhiều object sống lâu, reference graph rải rác, boxing, nhiều pointer indirection hoặc tạo áp lực GC có thể ảnh hưởng latency, memory bandwidth và throughput. Một kiểu thiết kế ít object vẫn có thể chậm vì I/O, lock contention, thuật toán kém hoặc truy cập dữ liệu thiếu locality.

      Do đó phải hỏi **bottleneck thực sự là gì**. Dùng profiler và allocation/GC metrics để xác định hot path, đo end-to-end latency, throughput, tail latency và memory under realistic load. Nếu refactor OOP tăng clarity và maintainability mà không làm xấu chỉ số quan trọng, số object riêng lẻ không phải lý do đủ để bác bỏ. Cũng cần giữ correctness và business invariants khi tối ưu.
  - question: Bạn đo và so sánh hiệu năng trước/sau refactor OOP như thế nào để tránh kết luận từ microbenchmark sai lệch?
    readmeRelated:
      anchorList:
      - oop-basic-008
      - lifecycle-007
    knowledge: Benchmark workload đại diện, warmup/forks, đo latency/throughput/allocations/GC, profile hot path và so correctness.
    answer: |-
      Để so sánh hiệu năng trước/sau một refactor OOP, trước tiên xác định **mục tiêu đo và baseline**: p50/p95/p99 latency cho use case quan trọng, throughput, allocation rate, GC pause, CPU và memory footprint; không tối ưu theo duy nhất thời gian chạy của một method nhỏ. Chọn workload đại diện (kích thước input, phân phối dữ liệu, tỷ lệ đọc/ghi, concurrency, JIT warmup) và giữ môi trường, JVM flags, heap và phụ thuộc hệ thống tương đương giữa hai phiên bản.

      Với microbenchmark JVM, ưu tiên **JMH** để xử lý warmup, measurement iterations, forks, tránh dead-code elimination qua `Blackhole` hoặc consume kết quả và tránh constant folding/benchmark setup sai. Không đo một lần bằng `System.nanoTime()` rồi suy diễn: JIT có thể chưa warm, GC/background noise có thể chi phối, và code có thể bị compiler tối ưu bỏ nếu kết quả không được dùng. Nếu benchmark truy cập DB/network, hãy đo ở layer phù hợp với môi trường và dữ liệu thực, thay vì xem JMH như thay thế load test.

      Kèm **profiling** CPU/allocations/GC để giải thích cơ chế thay đổi; không kết luận chỉ vì một kết quả nhanh hơn trong ít lượt. Đánh giá kết quả qua độ biến thiên, nhiều lần chạy độc lập, tail latency và regression ở các case khác. Sau cùng chạy test chức năng/contract tests để xác nhận trước và sau vẫn cùng behavior và invariant: tối ưu hiệu năng không hợp lệ nếu làm sai nghiệp vụ.
