- question: Vì sao List<Dog> không gán được vào List<Animal> dù Dog extends Animal? Dùng generic type thế nào khi chỉ cần
    đọc?
  answer: |-
    Java generics là **invariant**: List<Dog> không phải subtype của List<Animal>. Nếu cho phép gán, client có thể thêm Cat vào List<Animal> vốn thực sự là List<Dog>, làm sai sự an toàn kiểu.

    Nếu chỉ cần **đọc như supertype**, nhận List<? extends Animal>: có thể đọc phần tử thành Animal nhưng không thể tùy ý add một Animal mới (trừ null theo giới hạn thích hợp). Nếu API **chỉ ghi Dog hoặc subtype Dog**, List<? super Dog> có thể phù hợp: add Dog được nhưng đọc thường chỉ bảo đảm Object. Nguyên tắc PECS (producer extends, consumer super) hỗ trợ chọn đúng variance ở ranh giới API.

    Không dùng cast unchecked để che lỗi; điều đó có thể chuyển lỗi sang runtime.
