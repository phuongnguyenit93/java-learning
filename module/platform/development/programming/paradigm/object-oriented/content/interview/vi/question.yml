- question: Phân biệt b.updateState() và b = new Box(...) khi a và b ban đầu cùng trỏ một Box; nếu a = null thì Box có bị
    huỷ không?
  answer: |-
    **b.updateState()** thao tác trên Box được a và b cùng tham chiếu, nên a có thể quan sát state mới. **b = new Box(...)** chỉ đổi tham chiếu trong biến b, a vẫn trỏ Box cũ. Vì thế số biến không tương đương số object: ba biến có thể trỏ hai instance hoặc chỉ một instance.

    **a = null** chỉ xoá liên kết từ một biến. Box vẫn có thể được truy cập qua biến/collection khác; ngay cả khi không còn reachable, thời điểm garbage collector thu hồi cũng không được bảo đảm. Không nên suy ra vòng đời object từ một phép gán cục bộ.
