- question: Cách đọc bội số của Customer '1' -- '0..*' Order và điều kiện đặt đơn không rỗng?
  answer: |-
    Bội số nằm **gần đầu được đếm**. `Customer "1" -- "0..*" Order` nghĩa là một Customer có thể có 0 hoặc nhiều Order, và mỗi Order có **đúng một** Customer theo mô hình. Nếu `Order` có thể tạo trong trạng thái DRAFT với 0 dòng, `OrderLine 0..*` là hợp lý ở level cấu trúc tổng quát.

    Ràng buộc `confirm()` phải có ít nhất một dòng là **state-specific invariant** riêng, không cần ghi `1..*` cho mọi trạng thái nếu draft vẫn hợp lệ. Java reference có thể null và `List` có thể rỗng; constructor/method và DB constraints mới thực thi bội số mong đợi.
