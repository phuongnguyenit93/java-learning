- question: Một transaction nhiều bước ném exception ở bước cuối có tự hoàn tác mọi side effect trước đó không? try-with-resources
    xử lý exception thế nào?
  answer: |-
    **Không.** Ném exception chỉ chuyển luồng điều khiển và unwinds stack; nó không rollback memory mutation, HTTP request, email hoặc DB transaction nếu chưa có **cơ chế giao dịch/compensation** phù hợp. Nếu trừ tài khoản A rồi lỗi trước khi cộng B, tiền có thể bị mất trong mô hình đơn giản.

    Với tài nguyên implement AutoCloseable, **try-with-resources** gọi close() khi rời scope, kể cả body ném lỗi. Nếu cả body và close() ném exception, lỗi từ body thường là **primary exception**, lỗi close được lưu trong suppressed exceptions (có thể đọc qua getSuppressed()).

    Phân biệt dọn tài nguyên với rollback nghiệp vụ. Với retry, cần đánh giá idempotency và unknown outcome, không dựa vào catch-all rồi chạy lại vô điều kiện.
