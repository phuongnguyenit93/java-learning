- question: Ở ranh giới object, nên chuẩn hóa dữ liệu trước hay sau validation? Có rủi ro gì khi chuẩn hóa quá mức?
  answer: |-
    Phân biệt **normalize** (ví dụ `strip()` mã SKU) và **validate** (không rỗng, độ dài, mẫu ký tự, quy tắc nghiệp vụ). Chọn biểu diễn chuẩn rồi kiểm tra theo hợp đồng, nếu quy tắc domain cho phép normalize. Với ID phân biệt hoa/thường, tự động lowercase có thể gộp hai định danh vốn khác nhau và làm hỏng nghĩa dữ liệu.

    Kiểm tra format/syntax ở DTO/controller giúp lỗi thân thiện; invariant của domain vẫn phải được bảo vệ tại constructor/method. Dữ liệu mutable đã validate rồi nhưng còn reference cho caller sửa tiếp có thể trở thành dữ liệu sai, vì thế phải sao chép hoặc giữ quyền sở hữu rõ ràng.
