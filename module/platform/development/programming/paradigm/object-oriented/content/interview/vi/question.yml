- question: Read-only với caller khác immutable object hoàn toàn ra sao?
  answer: |-
    Một field có thể có getter nhưng không có setter công khai, trong khi vẫn thay đổi bên trong class thông qua thao tác nghiệp vụ. Ví dụ `BankAccount.balanceVnd` đọc được từ ngoài nhưng được chỉnh chỉ khi nạp/rút hợp lệ.

    Immutable object là object không đổi state quan sát được sau khi tạo; phù hợp với value/snapshot. Mutable entity có vòng đời, như tài khoản, có thể hợp lý nếu cập nhật được kiểm soát. `private final String accountNumber` giữ identity ổn định không đồng nghĩa balance cũng bất biến.
