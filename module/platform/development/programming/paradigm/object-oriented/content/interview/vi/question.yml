- question: instanceof, getClass() và null khác nhau thế nào khi kiểm tra runtime type?
  answer: |-
    **instanceof** hỏi object có tương thích với một kiểu (class/interface) không, gồm cả subclass/implementation. **getClass() == SomeClass.class** so đúng runtime class, không nhận subclass. Với reference null, **null instanceof Dog** là false; gọi null.getClass() ném NullPointerException.

    Ví dụ Dog extends Animal: một Dog instance có instanceof Animal == true và instanceof Dog == true, nhưng dog.getClass() == Animal.class là false. Khi cần capability, nên kiểm tra instanceof Interface; kiểm tra exact class bằng getClass thường gắn code vào hierarchy cụ thể, dễ làm hỏng polymorphism.

    Không dùng check exact class để thay thế hợp đồng hành vi mà instance có thể cung cấp qua interface.
