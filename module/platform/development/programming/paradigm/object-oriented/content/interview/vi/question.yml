- question: Java lambda và method reference có làm Java chuyển thành structural subtyping không?
  answer: |-
    **Không.** Lambda và method reference được kiểm tra **theo target type** là functional interface phù hợp (*SAM*, một abstract method có hiệu lực). Chúng cung cấp implementation để tạo giá trị theo một kiểu functional interface đã được xác định, chứ không biến mọi class “có method giống nhau” thành subtype tự động.

    Ví dụ Runnable r = () -> System.out.println("run"); hợp lệ vì compiler có target Runnable. Nhưng class LegacyTask có run() cùng chữ ký mà không implements Runnable vẫn không tự động là Runnable.

    Cũng cần phân biệt **nominal subtyping** với khả năng chuyển đổi lambda dựa trên target: Java hỗ trợ cú pháp linh hoạt cho functional interfaces nhưng quan hệ class/interface vẫn được xác định bằng khai báo hệ kiểu.
