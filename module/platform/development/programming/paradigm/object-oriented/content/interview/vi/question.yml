- question: Nếu implementation mới implements đúng PaymentGateway nhưng trả SUCCESS khi nhà cung cấp mới chỉ nhận request,
    nguyên tắc SOLID nào quan trọng nhất?
  answer: |-
    **LSP** là vấn đề trực tiếp: dù đúng chữ ký và OCP cho phép thay implementation, **hợp đồng hành vi bị phá** nếu SUCCESS đã được định nghĩa là thu tiền hoàn tất nhưng implementation mới chỉ báo accepted/pending. Checkout có thể đánh dấu đơn đã thanh toán quá sớm.

    Cần định nghĩa rõ các trạng thái PENDING, SUCCEEDED, FAILED hoặc unknown outcome, idempotency key, thời điểm settled, khả năng retry và semantics của timeout. Contract tests dùng chung phải kiểm tra cả đường thành công, pending, thất bại, request trùng và side effect.

    Trường hợp này cũng cho thấy **OCP/DIP không thay thế LSP**: có điểm mở rộng và phụ thuộc abstraction chỉ hữu ích khi mọi adapter tuân thủ lời hứa chung.
  aiGenerated: true
