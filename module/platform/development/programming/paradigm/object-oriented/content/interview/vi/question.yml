- question: Những dữ liệu nào không nên đưa vào toString(), và vì sao ghi toàn bộ object vào log có thể gây rủi ro?
  answer: |-
    Tránh in **password, access token, số thẻ, dữ liệu cá nhân nhạy cảm**, secret hoặc toàn bộ request/response chưa được redaction. Một record hoặc Lombok-generated toString có thể vô tình tự in mọi component, kể cả secret mới thêm về sau.

    toString nên **rẻ, không side effect, không truy vấn database/HTTP, không ném exception bất ngờ** và tránh duyệt object graph vô hạn. Tham chiếu vòng có thể gây StackOverflowError; collection toString thường gọi toString của phần tử, array mặc định không hiển thị cấu trúc phần tử như List.

    Với hệ production, dùng structured logging có schema và masking, correlation/trace IDs, hạn chế kích thước log. Test log redaction trên case có secret để tránh regression khi field thay đổi.
