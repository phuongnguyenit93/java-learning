- question: Constructor ném exception sau khi gọi collaborator, liệu chỉ assertThrows đã đủ chứng minh không có tác dụng phụ?
  answer: |-
    **Chưa đủ.** Constructor thất bại không trả về object thành công, nhưng side effect đã xảy ra ở database, callback, file hoặc collaborator **không tự rollback**. Nếu constructor gửi notification rồi mới phát hiện input âm, một test chỉ assertThrows không thấy thiệt hại.

    Dùng recording fake/spy để xác nhận với input sai có **zero calls** tới bên ngoài; validate trước khi thực hiện I/O. Với resource đã mở giữa chừng, test cleanup và tình huống close thất bại; cân nhắc factory hoặc application service điều phối I/O thay vì constructor chứa quy trình dài.

    Phân biệt object **không được công bố thành công** với việc **mọi side effect trước exception đã hoàn tác**; hai cam kết này khác nhau.
