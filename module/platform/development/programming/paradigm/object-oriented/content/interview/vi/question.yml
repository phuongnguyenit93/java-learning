- question: Vì sao static method cùng chữ ký trong lớp con không phải overriding?
  answer: |-
    Static method thuộc class và không có receiver instance để dynamic dispatch; method static cùng chữ ký ở subclass thực hiện **method hiding**. Phiên bản được chọn theo kiểu/class tại compile time. Nên gọi `Parent.utility()` hoặc `Child.utility()` thay vì qua biến instance.

    Ngược lại, instance method có thể override được chọn theo runtime class. Hai kỹ thuật không thể trộn cho cùng chữ ký ở hai cấp: superclass khai báo static mà subclass cố khai báo instance method tương ứng (hoặc ngược lại) sẽ lỗi biên dịch.
