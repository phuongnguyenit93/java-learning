    Nếu class nội bộ chỉ được dùng ở một nơi và chưa có ranh giới thay thế có ý nghĩa, sinh thêm interface tương ứng có thể chỉ làm code dài và khó điều hướng. Hãy thiết kế interface từ **điều client cần** và lợi ích của abstraction; không áp dụng máy móc một interface cho mỗi class. Các abstraction hữu ích vẫn có thể được trích xuất về sau khi xuất hiện nhu cầu rõ.
