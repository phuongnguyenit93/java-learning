- question: Adapter tích hợp SDK thanh toán cần xử lý những gì?
  answer: '**Adapter** chuyển contract nội bộ sang API đối tác: cấu trúc DTO, đơn vị tiền, mã lỗi, exception và timeout. Với
    tiền tệ cần quy tắc exact conversion; đừng âm thầm làm tròn. Timeout có thể là **kết quả chưa biết**, không chắc giao
    dịch thất bại. Retry cần idempotency key và xác minh kết quả để tránh trùng thanh toán. Test cả overflow, lỗi lạ và thay
    đổi phiên bản SDK.'
