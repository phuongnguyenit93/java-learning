- question: super(...) và super.method(...) khác nhau như thế nào? Constructor của cha có được kế thừa không?
  answer: |-
    `super(args)` là lời gọi **constructor superclass trực tiếp** trong quá trình dựng object; nó khởi tạo phần state của cha. `super.method(args)` gọi một method superclass từ ngữ cảnh instance lớp con. Constructor **không được kế thừa** và không thể override.

    Nếu subclass constructor không chỉ định constructor khác, Java dùng implicit `super()` theo quy tắc. Khi superclass chỉ có `Parent(String)`, subclass phải gọi constructor phù hợp như `super(code)`; thiếu constructor không tham số sẽ gây lỗi biên dịch. `this(args)` nối tới constructor khác **cùng class** mà không tạo instance thứ hai.
