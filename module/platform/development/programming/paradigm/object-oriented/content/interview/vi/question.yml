- question: So sánh final và sealed cho lớp cha ở Java 17+. Khi nào sealed hữu ích?
  answer: |-
    `final class` **đóng hoàn toàn** khả năng có subclass. `sealed class` hoặc `sealed interface` **giới hạn danh sách subtype trực tiếp** bằng permits theo quy tắc của Java; các subtype trực tiếp phải khai báo `final`, `sealed` hoặc `non-sealed` khi phù hợp.

    `sealed` có ích cho mô hình domain có tập biến thể được kiểm soát, ví dụ các loại sự kiện hoặc kết quả. `non-sealed` có thể mở lại nhánh kế thừa. Không nên dùng sealed chỉ để trang trí nếu hợp đồng cần cho plugin bên ngoài mở rộng tự do.
