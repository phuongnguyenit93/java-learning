- question: Vì sao để SQLException hoặc chi tiết HTTP của nhà cung cấp thoát thẳng qua domain API có thể là leaky abstraction?
  answer: |-
    Nếu `BookCatalog.findByIsbn` buộc client bắt `SQLException`, client phải biết persistence dùng SQL, dù ý định chỉ là tìm sách. Đổi sang bộ nhớ hoặc NoSQL sẽ lan sửa đổi sang nơi gọi.

    Ở **ranh giới adapter**, ánh xạ lỗi hạ tầng sang lỗi/hợp đồng có ý nghĩa với domain hoặc application, nhưng giữ nguyên thông tin cần cho retry, logging và giám sát. Không nên bắt mọi exception rồi trả `null`: điều đó che giấu lỗi thật và biến lỗi hệ thống thành “không tìm thấy”. Nếu API cố ý là lớp truy cập SQL thấp, `SQLException` lại có thể thuộc hợp đồng phù hợp.
