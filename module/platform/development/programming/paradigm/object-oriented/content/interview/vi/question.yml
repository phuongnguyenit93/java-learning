- question: Upcasting Dog sang Animal hoặc implementation sang interface có cấp phát/copy object mới không? Ứng dụng kiến
    trúc của nó là gì?
  answer: |-
    **Không.** Dog dog = new Dog(); Animal animal = dog; tạo hai biến cùng giữ giá trị tham chiếu tới **một Dog instance**. Upcast hợp lệ ngầm định nếu có subtype relationship; nó thay đổi **góc nhìn kiểu** mà compiler dùng để kiểm tra method, không biến Dog thành Animal mới.

    Upcasting cho phép viết API nhận Animal hoặc một interface, truyền nhiều implementation khác nhau mà không phải overload theo mọi concrete class. Với interface PaymentMethod, client chỉ gọi hợp đồng pay/cancel được công bố; các thao tác riêng của CardPayment phải nằm ở capability thích hợp hoặc chỉ được dùng sau kiểm tra type khi thực sự cần.

    Phép upcast từ null vẫn có giá trị null, không tạo object.
