- question: final field, final class và immutable object khác nhau như thế nào?
  answer: |-
    `final` trên field chỉ ngăn **gán lại field** sau khởi tạo, không chặn mutate object mà reference giữ. `final class` chặn kế thừa, không tự làm toàn bộ state bất biến.

    ```java
    final class Box {
        private final StringBuilder text = new StringBuilder("A");
        void update() { text.append("B"); }
    }
    ```

    Sau `update()`, nội dung là AB dù cả class và field đều final. Immutable object thực sự đòi hỏi không có đường thay đổi state quan sát được: kiểm soát method, alias, collection và các thành phần mutable.
