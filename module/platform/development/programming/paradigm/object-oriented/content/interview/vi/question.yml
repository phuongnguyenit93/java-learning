- question: Khi review sơ đồ quan hệ, bộ câu hỏi tối thiểu nào giúp bạn quyết định Java model và constraints?
  answer: |-
    Hỏi lần lượt: (1) A và B liên quan **về nghiệp vụ** ra sao, có phải is-a không? (2) Mỗi phía có bội số nào, **0 có hợp lệ** không? (3) Cần điều hướng một hay hai hướng? (4) Part tồn tại độc lập hay thuộc ownership của whole? (5) Ai là **cổng cập nhật duy nhất**? (6) Chuyển/xóa/thất bại có giữ invariant không?

    Sau đó xem implementation: reference, `Set`/`Map`, entity liên kết như Enrollment, constructor/method validation, unique/FK constraints và transaction khi có database. Đừng dùng riêng một ký hiệu UML hay kiểu collection để suy ra tất cả hành vi. Viết test theo hợp đồng, kể cả lỗi, đồng thời và reload persistence khi liên quan.
