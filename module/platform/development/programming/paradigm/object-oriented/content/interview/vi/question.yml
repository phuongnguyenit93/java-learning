- question: Có phải mọi getter nên trả trực tiếp field và mọi setter nên chỉ gán field? Nêu ví dụ phản biện.
  answer: |-
    Không. Getter có thể tính `availableSeats()` từ `capacity - reserved`, hoặc trả snapshot thay vì tham chiếu nội bộ. Một getter tiết lộ dữ liệu nhạy cảm hoặc cấu trúc triển khai cũng có thể cần loại bỏ.

    Setter chỉ hợp lý khi việc thay đổi độc lập là hành vi được cho phép và có validation, ví dụ `setDisplayName(name)`. Với số dư và trạng thái đơn hàng, các method như `deposit(amount)`, `withdraw(amount)`, `pay()`, `ship()` thể hiện **ý định** và kiểm tra điều kiện trước khi cập nhật. Public getter/setter đầy đủ không tự làm domain object được đóng gói tốt.
