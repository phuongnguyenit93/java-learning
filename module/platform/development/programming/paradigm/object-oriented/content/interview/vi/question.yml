    Tách theo vai trò có ý nghĩa, ví dụ DocumentReader, DocumentWriter, DocumentPublisher. SearchService nhận DocumentReader; người cần lưu nhận Writer; class có đủ năng lực có thể implements nhiều interface. ISP không có quy tắc máy móc **mỗi interface chỉ một method**: nhóm phương thức theo capability và nhu cầu client.

    Nếu đã phát hành public API, lên kế hoạch migration/adapter trước khi bỏ hợp đồng cũ.
