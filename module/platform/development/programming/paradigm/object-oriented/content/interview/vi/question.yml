- question: Hai giao diện cùng đọc một TemperaturePolicy mutable. Chọn live state hay snapshot thế nào để tránh tác động ngoài
    ý muốn?
  answer: |-
    **Live state** cho phép hai nơi giữ đường tham chiếu tới cùng object và đọc trạng thái mới khi object thay đổi, với điều kiện visibility thích hợp trong môi trường đa luồng. **Snapshot** là bản biểu diễn độc lập của một thời điểm; cập nhật sau đó không tự sửa snapshot.

    Nên chỉ định **owner của mutation**, cung cấp API đọc an toàn hoặc snapshot bất biến, và nói rõ lúc nào phía client nhận cập nhật. Thay đổi field trong object không tự phát sự kiện cho UI; cần notification, observer, polling hoặc cơ chế refresh phù hợp. Đừng phát tán tham chiếu mutable nếu caller không được quyền cập nhật trạng thái.
