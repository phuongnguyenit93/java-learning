- question: Strategy khác Decorator trong composition thế nào? AuditedTransport bọc EmailTransport có chứng minh email đã
    phát tới máy khách chưa?
  answer: |-
    **Strategy** thay một thuật toán, ví dụ formatter thông báo loại dài/ngắn cùng implements MessageFormatter. **Decorator** implements cùng interface Transport và **bọc một Transport khác** để bổ sung hành vi trước/sau khi ủy quyền.

    ~~~java
    interface Transport { void send(String recipient, String text); }
    final class AuditedTransport implements Transport {
        private final Transport delegate;
        AuditedTransport(Transport delegate) { this.delegate = delegate; }
        public void send(String recipient, String text) {
            delegate.send(recipient, text);
            System.out.println("Call returned normally");
        }
    }
    ~~~

    Log chứng minh delegate.send kết thúc không ném lỗi trong ví dụ, **không** chứng minh email thực sự tới người nhận. Nếu provider xử lý bất đồng bộ, cần hợp đồng về trạng thái accepted/delivered và audit bền vững riêng.
