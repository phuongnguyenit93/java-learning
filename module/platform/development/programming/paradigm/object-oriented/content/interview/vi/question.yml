- question: volatile, AtomicInteger và synchronized khác nhau thế nào khi giữ ghế có capacity?
  answer: |-
    `volatile` hỗ trợ visibility, không biến `count++` thành atomic. `AtomicInteger.incrementAndGet` cập nhật một counter nguyên tử **trong một JVM**, nhưng không tự buộc việc kiểm tra capacity và ghi receipt thành một bước nghiệp vụ.

    `reserve(n)` cần một critical section/atomic operation bảo vệ toàn invariant `0 <= reserved <= capacity`. Khóa trong JVM không bảo vệ nhiều node/DB; dùng transaction hoặc conditional update phù hợp.
