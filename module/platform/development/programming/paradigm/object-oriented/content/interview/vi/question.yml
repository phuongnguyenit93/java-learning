- question: Nếu controller, service và entity cùng thay một field, bạn refactor trách nhiệm thế nào?
  answer: |-
    Đó có thể là dấu hiệu **logic bị phân tán**. Trước hết liệt kê các đường cập nhật và rule đang bị sao chép, viết test cho thành công, từ chối, và state sau thất bại.

    Chọn một boundary sở hữu quy tắc: `Order` kiểm soát state và line, controller chuyển đổi HTTP/DTO, application service điều phối use case, transaction và collaborator. Rule xuyên aggregate hoặc policy độc lập có thể thuộc domain service/policy — không nhất thiết nhét tất cả vào entity.

    Di chuyển logic dần, thu hẹp setter, dùng API mang ý nghĩa nghiệp vụ và so sánh behavior trước/sau. Tránh refactor thành hàng loạt wrapper chỉ chuyển tiếp lời gọi nhưng không đưa ra quyết định.
