- question: Một PaymentGateway mới trả SUCCESS khi HTTP request được chấp nhận nhưng tiền chưa được thu; dù implements đúng
    thì vi phạm điều gì?
  answer: |-
    Nếu contract định nghĩa SUCCESS là **thu tiền đã xác nhận**, thì trả SUCCESS khi provider mới chỉ **accepted/pending** đã thay đổi nghĩa kết quả. CheckoutService có thể đánh dấu order đã thanh toán hoặc gửi hàng quá sớm.

    Cần mô hình trạng thái như PENDING, SUCCEEDED, FAILED, và quy tắc timeout/unknown outcome; mô tả idempotency key, retry và reconciliation. Nếu đã có thao tác ở provider bên ngoài, transaction database cục bộ không thể tự rollback tất cả side effect đó.

    Bộ contract tests dùng chung cần kiểm tra cả success, failure, pending/timeout và request trùng. Thay provider phải bảo toàn cam kết quan sát được, không chỉ giữ cùng chữ ký method.
