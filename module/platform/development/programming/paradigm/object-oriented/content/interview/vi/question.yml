- question: Vì sao tái sử dụng Builder có thể phá trạng thái object đã build?
  answer: Nếu build() truyền thẳng List nội bộ của Builder cho object, sửa Builder lần sau làm object trước thay đổi. List.copyOf
    tạo collection snapshot bất biến nhưng **không deep-copy element mutable**. Test bằng cách build A, thêm phần tử vào Builder,
    build B rồi kiểm tra A giữ nguyên. Builder bản thân thường không thread-safe nếu nhiều thread cùng chỉnh một instance.
