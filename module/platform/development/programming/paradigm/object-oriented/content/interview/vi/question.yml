- question: Làm thế nào tránh đệ quy vô hạn khi hai method Department.addEmployee và Employee.setDepartment gọi qua lại?
  answer: |-
    Nếu `Department.add(e)` gọi `e.setDepartment(this)`, còn `Employee.setDepartment(d)` lại gọi `d.add(this)`, hai method có thể đệ quy đến `StackOverflowError` nếu không có đường dừng được thiết kế đúng.

    Nên quy định **một API public làm cổng cập nhật duy nhất**, còn các helper cập nhật phía còn lại có quyền truy cập hạn chế, không gọi vòng lại API public. Kiểm tra trạng thái đã liên kết và thay đổi thực sự trước khi cập nhật. Đừng sửa bằng boolean flag tràn lan; thiết kế rõ vai trò điều phối và invariant dễ test hơn.
