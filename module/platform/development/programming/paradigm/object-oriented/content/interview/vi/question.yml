- question: Một Car nhận PowerSource từ constructor có phải Car sở hữu độc quyền và được tự close() PowerSource không?
  answer: |-
    **Không.** Cùng một instance PowerSource có thể được truyền cho nhiều object; caller cũng có thể giữ reference. final không quy định ai là owner hay được đóng.

    API nên mô tả rõ collaborator là **borrowed, shared hay ownership transferred**. Nếu Car chỉ được cho mượn PowerSource thì không tự đóng khi hoàn tất nhiệm vụ; nếu Car tự mở/tạo resource và công bố sở hữu nó, Car có trách nhiệm cleanup theo hợp đồng.

    Với dependency do container quản lý, lifecycle thường do container điều phối. Việc chỉ chứa một field tham chiếu không trao quyền phá tài nguyên được quản lý nơi khác.
