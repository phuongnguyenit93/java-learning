- question: DI qua constructor và setter có trade-off gì khi một dependency bắt buộc trong toàn bộ vòng đời service?
  answer: |-
    Với dependency **bắt buộc và ổn định**, ưu tiên constructor injection: validate non-null ngay khi tạo, giúp object không có trạng thái “chưa sẵn sàng” và có thể giữ field final. Trong test có thể cấp fake trực tiếp.

    Setter injection phù hợp khi dependency thật sự tùy chọn hoặc cần tái cấu hình, nhưng phải quản lý call trước setter, reconfiguration và concurrency. Method parameter injection phù hợp nếu collaborator được chọn riêng cho từng request.

    **Final chỉ cố định tham chiếu**, không khiến collaborator mutable thành immutable hoặc thread-safe. Constructor với quá nhiều dependency thường là lý do rà soát SRP/cấu trúc use case, không phải chuyển tất cả sang setter để che vấn đề.
