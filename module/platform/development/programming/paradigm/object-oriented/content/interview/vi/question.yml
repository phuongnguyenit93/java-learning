    Nếu cần mở tài nguyên trong quá trình khởi tạo, hãy chủ động đóng tài nguyên đã mở khi bước sau thất bại. Nếu this đã bị lưu vào registry trước khi constructor kết thúc, một thành phần khác có thể vẫn giữ reference tới object dở dang. Tránh this escape và trì hoãn đăng ký/activation đến sau khi khởi tạo thành công.
