- question: Type erasure ảnh hưởng gì tới new T(), instanceof List<String>, overload hai List khác type argument và generic
    array?
  answer: |-
    Sau khi biên dịch, thông tin type argument của parameterized type thường bị **erased** trong biểu diễn runtime; compiler thêm cast/bridge method khi cần để giữ type safety trong các điều kiện phù hợp.

    Hệ quả thường gặp:
    - Không thể viết new T() vì không biết constructor tương ứng; có thể nhận Supplier<? extends T> hoặc factory rõ.
    - Không thể kiểm tra instanceof List<String> vì kiểu tham số hóa ấy không reifiable; instanceof List<?> có thể kiểm tra đây là List nhưng **không chứng minh phần tử String**.
    - Không thể overload method(List<String>) và method(List<Integer>) trong cùng class vì cùng erasure.
    - Không thể trực tiếp tạo new T[10] hoặc new List<String>[10] theo cách thông thường.

    Erasure không có nghĩa compiler bỏ kiểm tra generics: phần lớn lỗi vẫn được phát hiện **khi compile**, trừ khi có raw/unchecked hoặc ranh giới dữ liệu không an toàn.
