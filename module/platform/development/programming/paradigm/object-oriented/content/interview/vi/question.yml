- question: Design Pattern là gì và làm sao biết có nên dùng?
  answer: Pattern là **cách tổ chức vai trò và quan hệ** để giải quyết một vấn đề lặp lại trong bối cảnh cụ thể, không phải
    đoạn mã bắt buộc sao chép. Hãy xác định điểm đau, trục thay đổi thực tế, phạm vi và chi phí bổ sung abstraction. Nếu một
    hàm hoặc switch ngắn đã rõ, dễ test và ít đổi, dùng pattern có thể là overengineering. Quyết định tốt phải nêu cả phương
    án đơn giản và điều kiện xem xét lại.
