- question: Nếu Auditable và Loggable cùng khai báo void log(String), class có cần hai method? Nếu hai interface độc lập có
    default label() thì sao?
  answer: |-
    Với hai **abstract methods cùng chữ ký và kiểu trả về tương thích**, một public log(String) có thể đáp ứng cả hai hợp đồng. Nếu tham số khác nhau như write(String) và write(int), đó là **overload** và có thể viết hai method tương ứng.

    Nếu hai interface độc lập cùng cung cấp **default label()** trùng chữ ký, Java không tự chọn bất kỳ implementation nào: class phải **override** và định nghĩa rõ cách giải quyết, có thể gọi A.super.label() hoặc B.super.label() khi hợp lệ.

    Một class implements nhiều interface vẫn chỉ extends tối đa một superclass. Interface không chứa instance fields hay constructors nên đây không phải multiple inheritance của state.
