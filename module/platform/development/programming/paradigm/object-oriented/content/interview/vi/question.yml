- question: 'Account giữ balance không âm: deposit, withdraw nên thiết kế điều kiện, exception và trạng thái thế nào?'
  answer: |-
    Ví dụ Account lưu `private long balanceCents` với invariant `balanceCents >= 0`; constructor từ chối số dư đầu kỳ âm. `deposit(amount)` yêu cầu amount dương và dùng `Math.addExact` để phát hiện tràn **trước khi gán**. `withdraw(amount)` yêu cầu amount dương, nếu thiếu tiền có thể trả `false` và giữ state; nếu đủ tiền thì trừ và trả `true`.

    Không mở `setBalanceCents()` tùy ý. Nếu có lịch sử, chỉ ghi bản ghi thành công, để caller đọc snapshot. Đơn vị cent dưới dạng `long` tránh sai số `double`, nhưng không tự giải quyết concurrent withdrawals hay transaction của ngân hàng thật.
