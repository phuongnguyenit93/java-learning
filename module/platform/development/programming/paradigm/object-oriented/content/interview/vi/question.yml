- question: Vì sao cast một raw List sang List<String> chưa kiểm chứng từng phần tử?
  answer: |-
    Do Java **type erasure**, runtime chủ yếu kiểm tra object là List, không chứng minh mọi phần tử là String. Cast có unchecked warning và lỗi có thể xuất hiện lúc đọc phần tử.

    Với nguồn legacy/không tin cậy, hãy kiểm tra từng element bằng `instanceof String`, sao chép sang list đã validate. `Class<T>.cast` chỉ kiểm tra được một runtime class cụ thể, không tự xác nhận generic lồng nhau.
