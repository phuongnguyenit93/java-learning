- question: Tại sao thứ tự và owner quan trọng khi đóng ResultSet, PreparedStatement, Connection trong JDBC?
  answer: |-
    Một luồng JDBC thường mở Connection, tiếp theo PreparedStatement và ResultSet. Nếu tất cả do cùng scope tạo và sở hữu, khai báo theo thứ tự đó trong try-with-resources sẽ khiến **ResultSet được đóng trước Statement và Connection**, giảm rủi ro dùng đối tượng phụ thuộc sau khi đóng chủ.

    Với **connection pool**, gọi Connection.close() thường trả logical connection về pool theo hợp đồng, không nhất thiết huỷ kết nối vật lý. Với kết nối do framework/transaction scope quản lý, cần tuân thủ ownership của framework. Không giao việc đóng resource có số lượng giới hạn cho GC và cũng không đóng một dependency mà caller còn sở hữu.
