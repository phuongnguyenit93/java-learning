- question: Làm thế nào quyết định interaction verification trong Mockito là hợp đồng thật hay chỉ chi tiết triển khai?
  answer: |-
    Hỏi liệu client hoặc hệ thống bên ngoài **quan sát được/hưởng hậu quả từ tương tác** hay không. ReceiptSender không được gọi nếu charge thất bại; Inventory.release phải xảy ra sau một lần giữ hàng bị từ chối; việc không gọi charge hai lần là cam kết nghiệp vụ. Những assertion verify/never/InOrder tương ứng có giá trị.

    Trái lại verify số lần gọi private helper, thứ tự đọc các biến hay số lần price lookup chưa được hứa thường làm test phụ thuộc implementation. Dùng Mockito InOrder **chỉ cho thứ tự có ý nghĩa** như reserve trước charge và send sau xác nhận.

    Kết hợp interaction assertions với **state/result assertions**. Một mock nhận đủ lời gọi không chứng minh dữ liệu cuối đúng hoặc adapter thật đã làm thành công.
