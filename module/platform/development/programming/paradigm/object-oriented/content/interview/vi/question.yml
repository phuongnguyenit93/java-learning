- question: Vòng phụ thuộc A → B → C → A nguy hiểm vì sao và khác vòng tham chiếu object hợp lệ thế nào?
  answer: |-
    **Circular dependency** là chu trình trong đồ thị **một thành phần cần thành phần khác để hoàn thành nhiệm vụ/khởi tạo**. Ví dụ `OrderService` cần `ShippingService`, trong khi ShippingService gọi ngược OrderService. Nó làm rối trách nhiệm, khó test riêng, dễ sinh gọi qua lại vô hạn và có thể chặn constructor injection.

    Một **bidirectional association** giữa hai domain object có thể là mô hình hợp lệ vì cần điều hướng hai phía; không nhất thiết là chu trình service dependency cần phá. Hãy phân biệt theo lớp cấu trúc đang xét (object graph, service, package/module, bean) và hậu quả thực tế; không thấy chữ 'cycle' rồi xóa mọi liên hệ ngược.
