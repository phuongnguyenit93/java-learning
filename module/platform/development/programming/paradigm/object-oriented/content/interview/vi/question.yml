- question: Một quan hệ hai chiều có thể đúng trong memory mà sai sau reload DB không? Bạn test điều gì?
  answer: |-
    Có. Ví dụ chỉ thêm Employee vào `department.employees` (phía `mappedBy`) mà quên `employee.department` là phía sở hữu FK; object trong memory có thể có vẻ đúng một phía nhưng khi `flush` rồi `clear` persistence context và `reload`, DB vẫn lưu FK cũ.

    Test nên dựng thao tác qua API domain, kiểm tra hai phía, sau đó **flush/clear/reload**, xác minh FK và cả hai hướng. Thêm test chuyển thất bại, constraints, trạng thái `null`, behavior của cascade/orphanRemoval và concurrent transaction khi cần. Không chỉ assert collection trước khi flush.
