- question: Private field có bảo đảm encapsulation không? Bạn sửa thiết kế chỉ dùng setter ra sao?
  answer: |-
    Không. `private` là cơ chế hạn chế truy cập, nhưng **encapsulation** đòi hỏi kiểm soát mọi đường chuyển trạng thái. Một public setter cho phép đặt giá trị không hợp lệ vẫn làm lộ khả năng phá invariant.

    Thay `setStatus` bằng `place()`, `cancel()`; thay `setBalance` bằng `deposit(amount)`, `withdraw(amount)`. Các method này kiểm tra tiền điều kiện, chuyển đổi hợp lệ và không commit thay đổi một phần.

    Cẩn thận cả **representation exposure**: trả trực tiếp `List` mutable nội bộ khiến caller thêm/xóa phần tử mà không qua rule. `List.copyOf` có thể tạo snapshot bất biến của collection, nhưng đây là bản sao nông; nếu element mutable, vẫn cần xét cách bảo vệ phần tử.
