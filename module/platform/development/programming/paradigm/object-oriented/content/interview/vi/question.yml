- question: Đọc multiplicity của Department "1" -- "0..*" Employee thế nào? Nếu Employee có thể chưa có phòng thì sửa gì?
  answer: |-
    Bội số ghi **gần một đầu** cho biết *một instance ở đầu đối diện* có thể liên hệ với bao nhiêu instance của đầu đó.

    Với `Department "1" -- "0..*" Employee`, một Department có 0 hoặc nhiều Employee; mỗi Employee thuộc **đúng một** Department. Nếu cho phép nhân viên chưa được phân công, đổi bội số **gần Department** thành `0..1`. Kiểm tra đồng thời nullability, quy tắc tạo mới/chuyển phòng và constraints khi persistence; sơ đồ mô tả mong muốn chứ không tự thực thi invariant.
