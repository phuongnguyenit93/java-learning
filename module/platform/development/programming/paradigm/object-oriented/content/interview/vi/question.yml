- question: Fragile Base Class là gì khi superclass thay đổi cách gọi overridable hook?
  answer: |-
    Subclass có thể dựa vào hook `afterSave()` được gọi đúng một lần, sau validation. Khi superclass đổi thứ tự, gọi hook trong constructor hoặc hai lần, subclass có thể xử lý state chưa khởi tạo hoặc side effect lặp.

    Cần hạn chế điểm extension, ghi rõ contract, bảo vệ quy trình chung bằng final template khi thích hợp và chạy contract tests. Nếu chỉ tái dùng hành vi, composition thường ít phụ thuộc nội bộ superclass hơn.
