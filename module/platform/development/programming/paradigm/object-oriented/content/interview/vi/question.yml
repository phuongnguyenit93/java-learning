- question: Kỹ thuật 'tìm danh từ để tạo class' có ích và dễ sai ở đâu?
  answer: |-
    Danh từ gợi ra **candidate objects** như Member, BookCopy, Loan, nhưng không phải danh từ nào cũng xứng đáng thành class. "Nút Mượn", "màn hình", "trạng thái", "ngày trả" có thể chỉ là UI, thuộc tính hoặc value, chứ không phải entity độc lập.

    Sau khi tìm ứng viên, hỏi: nó có identity/vòng đời riêng không, **sở hữu quy tắc nào**, cần hành vi nào, và có tình huống chứng minh sự tồn tại không? Động từ gợi hành vi; business rule xác định nơi phải giữ invariant. Kiểm chứng bằng việc diễn tập use case thay vì chốt mô hình từ từ khóa văn bản.
