- question: Một record chứa List hoặc byte[] có deep immutable không và ảnh hưởng gì khi dùng làm HashMap key?
  answer: |-
    Record có component field final nhưng không tự clone dữ liệu tham chiếu. Với `record Key(List<String> tags)`, thay đổi list nguồn có thể đổi kết quả equals/hashCode sau khi key đã nằm trong HashMap.

    Nếu tag là String immutable, compact constructor có thể dùng `tags = List.copyOf(tags);`. Với byte[], cần clone khi nhận và khi trả; equality của component array mặc định là **reference equality**, không phải so nội dung sâu. Stable ID đơn giản hơn khi identity cần giữ cố định.
