- question: Tell, Don't Ask giúp tránh thiết kế anemic model trong tính toán số lượt mượn như thế nào?
  answer: |-
    Thiết kế yếu để service tự làm:

    ```java
    if (member.getActiveLoanCount() < member.getMaxLoans()) {
        member.setActiveLoanCount(member.getActiveLoanCount() + 1);
    }
    ```

    Caller biết hết luật và có thể bỏ sót validation. Thiết kế tốt hơn yêu cầu `member.recordBorrow()`, method tự kiểm tra active/limit và cập nhật hợp lệ. **Tell, Don't Ask** không cấm getter cho đọc/báo cáo, mà khuyến khích object sở hữu hành vi thay đổi state. Nếu có concurrent requests, cả method đúng trong memory vẫn cần transaction/version khi persistence.
