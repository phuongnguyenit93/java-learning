- question: Aggregation và composition đều là quan hệ whole–part. Làm sao phân biệt Team–Employee và Order–OrderLine?
  answer: |-
    **Aggregation** (hình thoi rỗng ở đầu whole) biểu diễn liên kết toàn thể–bộ phận lỏng: Employee tồn tại độc lập với Team và có thể rời/chuyển team mà không bị xóa. **Composition** (hình thoi đặc) biểu diễn quyền sở hữu mạnh, độc quyền ở một thời điểm và vòng đời part gắn với whole theo chính sách domain: Order tạo/quản lý OrderLine riêng.

    Không được kết luận từ `List<T>`, field `private` hay việc gọi `new`: cùng cấu trúc Java có thể biểu diễn hai nghĩa khác nhau. Cần hỏi **ai tạo/xóa part, part có thể tồn tại riêng không, có chuyển chủ hay dùng chung không, xóa whole thì làm gì**.
