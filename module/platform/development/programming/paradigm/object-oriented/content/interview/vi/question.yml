- question: Inline Method, Inline Class, Remove Middle Man và Collapse Hierarchy khác nhau thế nào?
  answer: |-
    `Inline Method` đưa nội dung method chỉ forwarding vào nơi gọi khi tên không thêm ý nghĩa. `Inline Class` chuyển trách nhiệm của class quá nhỏ về owner thích hợp. `Remove Middle Man` loại một tầng ủy quyền dư; `Collapse Hierarchy` gộp cấp kế thừa không còn khác biệt.

    Trước khi làm cần kiểm tra API public, dependency injection, annotations, validation, exception timing và test. Đôi khi một lớp adapter tưởng chỉ forward thực sự giữ **boundary contract** và không nên xóa.
