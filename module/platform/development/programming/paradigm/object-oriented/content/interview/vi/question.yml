    Khi debug aliasing, hãy lần theo biến → collection → object phần tử; xem code sửa chính object hay chỉ gán lại biến/list entry. Để có dữ liệu độc lập, cần copy các phần tử mutable theo hợp đồng, hoặc dùng value object immutable có thể chia sẻ an toàn.
