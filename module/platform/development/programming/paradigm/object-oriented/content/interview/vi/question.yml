- question: Factory, DI và Strategy có giải quyết cùng vấn đề không?
  answer: 'Không. **Factory** quyết định object nào được tạo và cách tạo; **DI** cung cấp dependency và wiring/lifetime; **Strategy**
    đóng gói thuật toán được sử dụng. DI container có thể gọi factory. Với object chứa resource, cần làm rõ ai sở hữu và đóng
    resource. Không nên nhầm Spring singleton bean với singleton toàn JVM: mặc định một bean singleton theo mỗi ApplicationContext.'
