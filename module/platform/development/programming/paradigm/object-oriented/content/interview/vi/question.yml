- question: Vì sao nên tính tổng đơn hàng dự kiến trước khi cập nhật dòng hàng? Bạn sẽ kiểm tra phí và giảm giá như thế nào?
  answer: |-
    Trong bài thực hành, mỗi dòng có giá 1..1.000.000 cent, số lượng 1..100, subtotal không vượt 10.000.000 cent. Nếu setLine đẩy tổng vượt trần, phải phát hiện bằng phép tính dự kiến (và Math.multiplyExact/addExact nếu cần), từ chối **trước khi ghi** để Order luôn hợp lệ.

    Phí giao hàng là 0 khi đơn rỗng hoặc subtotal từ 100.000 cent, còn lại 15.000 cent. Giảm giá là subtotal/20 (5%, chia nguyên) khi subtotal từ 200.000 cent; payable = subtotal - discount + shipping. Các ngưỡng tính theo **subtotal**, không dùng payable để tự quyết định.

    Một snapshot như List.copyOf(lines.values()) tránh lộ cấu trúc Map; điều kiện là các OrderLine cũng bất biến. Test subtotal quanh 100.000/200.000 cent, thay thế SKU trùng, overflow và thao tác sau place.
