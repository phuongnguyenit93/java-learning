- question: CQS là gì, và vì sao một method getAvailableQuantity(requested) lại tự trừ kho là API nguy hiểm?
  answer: |-
    **Command–Query Separation (CQS)** khuyến nghị method đọc thông tin (*query*) và method thay đổi trạng thái (*command*) có hợp đồng tách biệt. Tên getAvailableQuantity làm người gọi nghĩ chỉ đọc; UI refresh hoặc logging gọi lại có thể vô tình trừ hàng tồn.

    Thiết kế rõ hơn:
    - availableQuantity() hoặc canReserve(qty): **query**, không đổi business state.
    - reserve(qty): **command**, kiểm tra và cập nhật invariant.

    Command có thể trả kết quả nghiệp vụ khi phù hợp; CQS không phải luật Java cấm mọi command có return value. Cần giữ semantics rõ, không trộn side effect bất ngờ vào một truy vấn có vẻ vô hại.
