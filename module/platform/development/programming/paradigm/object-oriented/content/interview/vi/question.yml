- question: Tại sao overengineering bằng interface và inheritance sâu có thể phản tác dụng?
  answer: |-
    Một interface cho mỗi class, nhiều base class chỉ để tái sử dụng vài dòng hoặc factory cho biến thể chưa từng xuất hiện sẽ tăng số file và đường gọi phải đọc, trong khi không tạo boundary thật.

    Interface đáng giá khi có hợp đồng có thể thay thế, phụ thuộc ngoài, hoặc nhiều implementation/chiến lược kiểm thử có căn cứ. Inheritance đáng giá khi subtype giữ được contract của base; nếu chỉ thay chính sách hay gắn logging, **composition** thường giảm coupling.

    Theo **YAGNI**, nên bắt đầu với thiết kế đơn giản, có test hành vi, rồi refactor khi yêu cầu mới cho thấy trục thay đổi thật. Mục tiêu là dễ thay đổi, không phải đạt số lượng pattern tối đa.
