    Nên tách hợp đồng read/write để implementation chỉ hứa điều có thể làm. Nếu method được thiết kế là tùy chọn ngay từ đầu, lỗi không hỗ trợ phải được nêu rõ trong contract; không dùng default method throw chỉ để vá interface quá lớn.
