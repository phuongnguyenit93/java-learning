- question: Tại sao Dog[] có thể gán sang Animal[] nhưng List<Dog> không gán sang List<Animal>? Lỗi nào xảy ra ở runtime?
  answer: |-
    Java arrays là **covariant** và lưu component type để kiểm tra lúc chạy. Vì vậy Dog[] dogs = new Dog[1]; Animal[] animals = dogs; hợp lệ về kiểu khai báo, nhưng animals[0] = new Cat() sẽ ném **ArrayStoreException** nếu Cat không phải Dog. Điều này giúp phát hiện thao tác store sai ở runtime.

    ~~~java
    class Animal {}
    class Dog extends Animal {}
    class Cat extends Animal {}
    Dog[] dogs = new Dog[1];
    Animal[] animals = dogs;
    // animals[0] = new Cat(); // ArrayStoreException.
    ~~~

    Generics như List<Dog> giữ invariance ngay compile time để tránh trường hợp tương tự. Vì type erasure, một số kiểm tra tham số generic không thể làm ở runtime giống array store check.
