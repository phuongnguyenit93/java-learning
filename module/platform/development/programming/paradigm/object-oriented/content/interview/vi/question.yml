- question: Kiểm thử một IntSet bằng HashSet và TreeSet nên dùng chung contract tests như thế nào, và điều gì không nên kiểm
    tra?
  answer: |-
    Định nghĩa contract IntSet: tập rỗng có size=0; add(x) trả true khi mới, false khi trùng; contains không làm thay đổi state; remove trả đúng boolean và cập nhật size; mọi int kể cả âm, 0, MIN_VALUE/MAX_VALUE đều hợp lệ.

    Viết cùng **bộ test qua Supplier<IntSet>** hay abstract contract test rồi chạy với HashIntSet và TreeIntSet. Mỗi fixture phải là instance mới để test độc lập.

    Không assert thứ tự duyệt hoặc loại cấu trúc lưu trữ nếu interface không hứa. TreeSet có thể duyệt tăng còn HashSet không, nhưng hai implementation vẫn tương thích ở các thao tác được hợp đồng công bố. Kiểm thử riêng hiệu năng/đặc tính đặc biệt ngoài contract trong test của từng implementation.
