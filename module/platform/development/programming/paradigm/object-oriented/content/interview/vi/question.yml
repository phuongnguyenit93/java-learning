- question: Vì sao static counter++ có thể mất lần tăng khi đa luồng? AtomicInteger có giới hạn nào?
  answer: |-
    `counter++` gồm đọc, cộng, ghi, nên hai luồng đọc cùng giá trị có thể ghi đè kết quả nhau.

    ```java
    import java.util.concurrent.atomic.AtomicInteger;
    class Stats {
        static final AtomicInteger total = new AtomicInteger();
        static void sold() { total.incrementAndGet(); }
    }
    ```

    `AtomicInteger` bảo đảm tăng nguyên tử trong một JVM. Nó không đồng bộ giữa các server, không bền vững sau restart và không thay thế transaction cho nhiều thay đổi liên quan. Static mutable state còn dễ làm test ảnh hưởng lẫn nhau.
