- question: Constructor injection và Clock.fixed giúp tạo test seam nào mà không cần Spring hay network?
  answer: |-
    Service nhận **các dependency cần thiết qua constructor**, ví dụ PaymentGateway, ReceiptSender và java.time.Clock. Production lắp adapter thật, test lắp stub/fake và Clock.fixed(Instant.parse(...), ZoneOffset.UTC) để thời gian ổn định.

    ~~~java
    java.time.Clock clock = java.time.Clock.fixed(
        java.time.Instant.parse("2026-01-01T00:00:00Z"),
        java.time.ZoneOffset.UTC);
    java.time.Instant observed = java.time.Instant.now(clock);
    org.junit.jupiter.api.Assertions.assertEquals(
        java.time.Instant.parse("2026-01-01T00:00:00Z"), observed);
    ~~~

    Đoạn trên cần JUnit Jupiter trên classpath. Unit test có thể kiểm tra ngay trước/bằng/sau deadline một cách lặp lại, không dựa vào giờ máy.

    DI **không bắt buộc có Spring**, và không tự bảo đảm kiến trúc theo DIP nếu service vẫn phụ thuộc concrete vendor adapter ở source.
