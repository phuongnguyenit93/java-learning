- question: Class declaration, new và phép gán reference khác nhau như thế nào?
  answer: |-
    Khai báo `class Workshop` định nghĩa một kiểu, chưa tạo instance. Mỗi lời gọi `new Workshop(...)` thành công tạo một object mới được khởi tạo bằng constructor.

    ```java
    Workshop a = new Workshop("Java", 3);
    Workshop b = new Workshop("OOP", 3);
    Workshop alias = a;
    ```

    `a != b` vì hai object độc lập; `alias == a` vì cùng reference. Gọi `alias.register()` có thể đổi state của `a`, không tự đổi `b`. Phép gán reference không sao chép object hay gọi lại constructor.
