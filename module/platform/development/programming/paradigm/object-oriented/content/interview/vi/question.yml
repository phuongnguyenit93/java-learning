- question: Vì sao transfer hoặc withdraw vẫn có thể sai khi chạy đồng thời dù đã kiểm tra đủ balance?
  answer: |-
    Hai luồng có thể cùng đọc balance cũ, đều vượt tiền điều kiện rồi ghi đè trạng thái nhau, gây lost update hoặc rút vượt thực tế. Kiểm tra đúng riêng lẻ không làm chuỗi đọc–kiểm tra–ghi trở nên **atomic**.

    Hệ thống cần locking/versioning hoặc transaction tùy phạm vi triển khai. Đồng bộ một object/JVM không giải quyết nhiều instance trên các server. Ngân hàng thực còn cần persistence, audit, idempotency, retry và xử lý lỗi liên hệ thống; `Math.addExact` chỉ kiểm tra số học.
