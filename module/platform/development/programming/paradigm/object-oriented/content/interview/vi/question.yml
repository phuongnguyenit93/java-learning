- question: Trong review một hệ thống Java áp dụng SOLID, nên đo chất lượng theo câu hỏi và kiểm thử gì thay vì đếm interface?
  answer: |-
    Nên kiểm tra **hậu quả thay đổi**: đổi SMTP có làm sửa domain? Thêm shipping policy có cần thêm nhánh trong service? ReadOnlyAdapter có phải throw UnsupportedOperationException? Một payment adapter có tuân thủ semantics thành công/thất bại không? Có thể unit test business không cần DB/network không?

    Kết hợp **unit tests cho invariant và workflow**, **contract tests chung cho mọi implementation**, và **integration tests** cho JDBC/HTTP/Spring wiring. Review module dependencies (DIP), kích thước client-facing APIs (ISP), lý do thay đổi (SRP) và rủi ro mở rộng (OCP).

    SOLID không thay thế kiểm tra transaction, concurrency, bảo mật, resource lifecycle, tracing hay dữ liệu thật. Thành công là **logic đúng, dễ hiểu, sửa có phạm vi nhỏ và kiểm chứng được**, không phải có thật nhiều abstraction.
