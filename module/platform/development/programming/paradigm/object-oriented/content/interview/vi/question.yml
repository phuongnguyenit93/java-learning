- question: Tam giác rỗng trong UML khác nhau ra sao giữa generalization và realization? Nêu ví dụ Java.
  answer: |-
    **Nét liền + tam giác rỗng** hướng về supertype là **generalization**, điển hình cho `class Child extends Parent`. **Nét đứt + tam giác rỗng** hướng về interface là **realization**, điển hình cho `class CardPayment implements PaymentMethod`.

    Một interface `extends` interface khác cũng biểu diễn một dạng generalization ở mô hình kiểu. Đừng nhầm tam giác rỗng với mũi tên navigability của association: nét đường, kiểu đầu mũi tên và quan hệ kiểu đều cần xét cùng lúc. `implements` chỉ tạo quan hệ type; không tự tạo quyền sở hữu object.
