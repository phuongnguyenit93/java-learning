- question: Một rule mới 'không cho mượn quá 2 bản' nên nằm ở Member hay BorrowService? Vì sao?
  answer: |-
    Giới hạn số lượt mượn là invariant gắn với **Member** nên Member có thể cung cấp `ensureCanBorrow()` hoặc `recordBorrow()` kiểm soát state của nó. `BookCopy` chịu trách nhiệm về tình trạng bản sách, còn `Loan` lưu thông tin lượt mượn.

    `BorrowService` điều phối: load Member/BookCopy, yêu cầu mỗi object kiểm tra điều kiện, tạo Loan và lưu trong transaction phù hợp. Không nên để service đọc `member.getActiveLoanCount()` rồi `setActiveLoanCount(count + 1)` vì caller vượt qua bảo vệ invariant. Đảm bảo tính đúng trên nhiều transaction còn cần lock/version/constraint thích hợp.
