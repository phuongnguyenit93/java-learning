- question: Constructor injection mang lại lợi ích gì khi một Notifier cần Transport bắt buộc?
  answer: |-
    Cho Notifier **nhận Transport từ ngoài** thay vì tự new EmailTransport. Constructor kiểm tra null và giữ field private final, nên instance tạo xong có dependency cần thiết; production cấp implementation thật, test cấp fake recording transport.

    ~~~java
    final class Notifier {
        private final Transport transport;
        Notifier(Transport transport) {
            this.transport = java.util.Objects.requireNonNull(transport);
        }
        void send(String to, String text) { transport.send(to, text); }
    }
    ~~~

    Điều này giảm coupling, dễ kiểm thử đường lỗi, nhưng **final chỉ cố định reference**, không khiến Transport bên trong immutable/thread-safe hoặc thay cho quy định resource ownership.
