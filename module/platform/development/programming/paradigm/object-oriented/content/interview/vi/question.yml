- question: Nếu overload và override xuất hiện đồng thời, quy trình hai bước để dự đoán output là gì?
  answer: |-
    Bước 1: từ **kiểu compile-time** của receiver và đối số, compiler xác định tập method nhìn thấy và **chữ ký overload** phù hợp nhất, hoặc báo lỗi mơ hồ/không tồn tại. Runtime class của đối số không làm tự đổi chữ ký.

    Bước 2: nếu chữ ký đã chọn là instance method có thể override, JVM dispatch implementation theo **runtime class của receiver**. Với static/private/constructor/field và lời gọi `super`, áp dụng quy tắc riêng. Cách giải từng bước tránh suy luận nhầm kiểu `new Dog()` luôn gọi overload Dog trong khi đối số thực tế được lưu ở biến Animal.
