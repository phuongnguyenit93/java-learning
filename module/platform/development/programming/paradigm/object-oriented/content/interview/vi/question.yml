- question: Overloading và overriding khác nhau về chữ ký và thời điểm lựa chọn như thế nào?
  answer: |-
    **Overloading** là nhiều method cùng tên nhưng khác danh sách tham số. Compiler chọn overload từ kiểu biểu thức, số lượng đối số và quy tắc chuyển đổi; runtime class của **đối số** không tự làm chọn overload khác.

    **Overriding** là subclass cung cấp implementation mới cho một instance method có thể override với chữ ký tương thích; sau khi compiler chọn chữ ký, runtime receiver quyết định implementation của nó. Chỉ thay return type không tạo overload. `@Override` giúp phát hiện sai chữ ký, nhưng code biên dịch đúng vẫn phải giữ hợp đồng ngữ nghĩa của cha.
