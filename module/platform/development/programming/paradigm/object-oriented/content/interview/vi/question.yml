- question: Phân tách domain model, application service và infrastructure adapter khi đặt hàng mang lại điều gì? Pure core/imperative
    shell dùng thế nào?
  answer: |-
    **Domain model** giữ các trạng thái, quy tắc và invariant: Order.addItem, Order.confirm, Money, PricingPolicy. **Application service** điều phối load–validate–execute–save và phát sinh yêu cầu thông báo. **Infrastructure** kết nối DB, HTTP, email và mapping.

    **Pure core / imperative shell** gợi ý đặt tính toán dễ kiểm tra ở trung tâm, I/O và các side effect không ổn định ở rìa. Nó không cấm entity thay trạng thái qua command hợp lệ. Nếu thời gian hoặc ID ảnh hưởng logic, có thể đưa Clock hoặc ID generator vào ranh giới thay vì tự đọc môi trường trong mọi method.

    Chia package nhiều không tự bảo đảm architecture đúng: domain không nên phải gọi vendor SDK chỉ vì nó nằm trong package domain.
