- question: Một Builder hoặc Java record có được phép bỏ qua invariant đã áp trong constructor chính của class không? Nên
    test ra sao?
  answer: |-
    Không. **Mọi con đường tạo object thành công** đều phải bảo đảm invariant đã công bố. Builder có thể gom cấu hình nhưng build() phải validate hoặc gọi constructor/factory có cùng điều kiện; record compact constructor cũng phải chặn input sai theo contract.

    Test cùng ma trận input từ **constructor, static factory, Builder và đường deserialize/mapping nếu có**. Các giá trị biên và dữ liệu mutable cần được kiểm tra ở mọi đường. Nếu builder cho phép bỏ qua trường bắt buộc hoặc lắp state bất hợp lệ thì không thể chỉ test constructor gốc rồi kết luận toàn bộ object an toàn.

    Ở class có kế thừa, còn phải tránh gọi instance method overridable từ constructor khi subclass chưa khởi tạo xong; test có thể phát hiện behavior bất ngờ khi tạo subtype.
