- question: Một BookCatalog trả HashMap<String, Book> nội bộ có rủi ro gì và bạn sẽ thiết kế lại API ra sao?
  answer: |-
    Getter trả thẳng `HashMap` làm lộ **cấu trúc lưu trữ**, buộc caller biết key và cho phép `clear()`, `put()` bỏ qua validation. Việc đổi từ in-memory sang database sau này cũng làm thay đổi client.

    Nên công bố hợp đồng nghiệp vụ như `Optional<Book> findByIsbn(String isbn)` và `List<Book> searchByTitle(String keyword, int limit)`. Result nên là immutable value/snapshot khi phù hợp. Hợp đồng còn cần chỉ rõ input, thứ tự kết quả, limit, hành vi không tìm thấy và đồng thời; chỉ đổi tên getter mà vẫn trả mutable map không giải quyết rò rỉ.
