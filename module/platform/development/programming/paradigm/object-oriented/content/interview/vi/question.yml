- question: Quan hệ is-a và has-a khác nhau thế nào? Vì sao Car extends Engine để mượn ignite() là sai thiết kế?
  answer: |-
    **Is-a** diễn đạt subtype: Car là một Vehicle khi mọi lời hứa của Vehicle có thể được Car thực hiện. **Has-a/uses-a** diễn đạt việc Car sử dụng PowerSource/Engine để vận hành.

    Car không phải Engine; việc kế thừa Engine chỉ để dùng ignite() làm Car lộ API của động cơ, kết dính vào implementation, gây khó thay cách cung cấp năng lượng. Hợp lý hơn là Car giữ một field PowerSource rồi ủy quyền activate(), trong khi Car vẫn có thể extends Vehicle nếu quan hệ subtype đúng.

    Chọn quan hệ dựa trên **ngữ nghĩa nghiệp vụ và khả năng thay thế**, không chỉ vì hai lớp chia sẻ vài dòng code.
