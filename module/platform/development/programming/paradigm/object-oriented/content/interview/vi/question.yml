- question: Callback thanh toán gửi hai lần hoặc hai worker đổi state đồng thời ảnh hưởng mô hình trạng thái thế nào?
  answer: |-
    Callback trùng có thể khiến xử lý **cùng một payment** hai lần, gửi thông báo trùng hoặc cập nhật sai. Cần policy idempotency dựa trên event/payment ID, xác thực nguồn callback và quy tắc ứng xử nếu trạng thái đã ở PAID.

    Hai worker có thể đọc cùng state cũ rồi ghi đè chuyển đổi; cần transaction với optimistic version/locking hoặc conditional update trong DB. Nếu DB commit rồi gửi email thất bại, không được âm thầm coi toàn bộ transaction chưa xảy ra: có thể dùng outbox + retry idempotent để giữ nghĩa state/event. **Enum** tự nó không giải quyết bất kỳ điều nào trong số này.
