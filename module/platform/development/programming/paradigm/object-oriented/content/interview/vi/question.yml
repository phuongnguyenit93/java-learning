- question: Static method và instance method khác gì về this, override và method hiding?
  answer: |-
    Instance method chạy với receiver object nên dùng được `this` và hỗ trợ dynamic dispatch theo runtime class khi override. Static method gắn với class, không có receiver `this`.

    Nếu lớp con khai báo static method cùng chữ ký, đó là **method hiding**, không phải overriding đa hình; method tĩnh được chọn theo kiểu/class tại compile time. Nên gọi `ClassName.staticMethod()` để rõ ý. Khi hành vi cần thay theo runtime object, dùng instance method qua hợp đồng thích hợp.
