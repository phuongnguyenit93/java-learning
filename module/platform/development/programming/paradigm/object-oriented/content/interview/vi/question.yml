- question: this.field, this(...) và return this khác nhau thế nào?
  answer: |-
    `this` trỏ đến instance receiver hiện tại; `this.field` truy cập field khi bị tham số che tên; `this(...)` ủy quyền cho constructor khác của **cùng object**; `return this` trả lại cùng reference để tạo fluent API.

    ```java
    class Config {
        private final int retries;
        Config() { this(3); }
        Config(int retries) {
            if (retries < 0) throw new IllegalArgumentException();
            this.retries = retries;
        }
    }
    ```

    Không dùng `this` trong static method. Fluent API trên object mutable vẫn thay đổi state mà các alias khác có thể quan sát.
