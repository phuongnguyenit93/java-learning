- question: Nếu gửi receipt thất bại sau khi charge thành công, tại sao test không nên tự động kỳ vọng charge lần nữa hoặc
    trả kho như khi charge thất bại?
  answer: |-
    Đây là **hai giai đoạn khác nhau**. Charge đã thành công theo contract nhưng email gửi thất bại; retry toàn bộ checkout có thể thu tiền trùng, còn release kho như trường hợp thanh toán bị từ chối có thể làm mất nhất quán giữa tiền và hàng.

    Unit test cần xác nhận không gọi lại charge chỉ vì sender ném exception, và làm rõ checkout trả trạng thái/exception nào. Hệ thống thật có thể ghi thanh toán thành công, lưu notification outbox rồi gửi lại theo idempotency/retry riêng, kiểm chứng bằng integration test.

    Không nhầm **exception từ bước cuối** với rollback các side effects trước đó; exception chỉ điều khiển luồng Java, không tự rollback cổng thanh toán hay SMTP.
