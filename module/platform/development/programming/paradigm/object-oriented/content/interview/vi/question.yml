- question: Cùng một cuốn sách, vì sao mô hình cho tra cứu và mô hình cho mượn không nhất thiết có chung API?
  answer: |-
    Use case **tra cứu** cần dữ liệu như ISBN, tên sách, tác giả và hành vi tìm kiếm/lọc. Use case **cho mượn** quan tâm số bản khả dụng, trạng thái mượn, điều kiện đủ tư cách và hành vi `borrow`/`return`.

    Không có một tập đặc điểm thiết yếu cho mọi mục đích. Nếu gộp hai use case thành một class công khai hàng chục field, caller phải hiểu quá nhiều chi tiết và quy tắc dễ phân tán. Có thể chia các model/read view theo trách nhiệm, giữ liên hệ qua định danh phù hợp, và chỉ chia sẻ hợp đồng thật sự chung.
