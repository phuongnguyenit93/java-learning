- question: Làm sao biến một quy tắc nghiệp vụ thành tiêu chí Given–When–Then và test truy vết được?
  answer: |-
    Ví dụ BR-COURSE-03: **mỗi sinh viên chỉ có một đăng ký đang hoạt động cho một khóa**. Acceptance scenario:

    ```text
    Given student S đã có enrollment ACTIVE ở course C
    When S yêu cầu đăng ký C lần nữa
    Then hệ thống trả DUPLICATE_ENROLLMENT
    And không tạo enrollment hoặc trừ ghế thêm
    ```

    Gắn ID rule với API/domain method, test name và dữ liệu. Test kiểm tra **cả output lẫn hậu điều kiện**; chỉ test HTTP code là chưa đủ. Khi chính sách thay đổi, ma trận truy vết cho biết cần rà soát những phần nào.
