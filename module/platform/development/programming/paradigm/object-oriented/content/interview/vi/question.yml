- question: Tại sao test chạy đúng trên một JVM chưa đủ chứng minh hệ thống giữ được invariant tồn kho khi chạy nhiều node?
  answer: |-
    Synchronized hoặc lock trong một JVM có thể bảo vệ đối tượng **chỉ trong process đó**, nhưng nhiều node có các process, memory và lock khác nhau. Hai request đến hai node vẫn có thể cùng nhìn thấy đủ kho rồi cùng trừ vượt nếu cơ sở dữ liệu không bảo vệ.

    Unit tests chuỗi tuần tự và fake in-memory không mô phỏng transaction isolation, optimistic locking, conditional update và retry khi xung đột. Cần kiểm thử tích hợp/concurrency đúng nơi dữ liệu được sở hữu: DB transaction hoặc atomic conditional update kiểm tra số rows, versioning và tác động khi hai request đua nhau.

    Đánh giá cuối là invariant toàn hệ thống **không bán quá số lượng**, không chỉ thread safety của một class Java.
