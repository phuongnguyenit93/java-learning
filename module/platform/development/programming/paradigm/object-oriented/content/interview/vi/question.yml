- question: Vì sao Square extends Rectangle có thể sai về hành vi dù trong hình học hình vuông là hình chữ nhật?
  answer: |-
    Giả sử Rectangle **mutable** cam kết setWidth(w) đổi chiều rộng và **giữ nguyên chiều cao**, setHeight(h) làm điều ngược lại. Square phải duy trì invariant width == height. Nếu Square.setWidth(w) đồng thời đổi height, nó vi phạm **postcondition** của Rectangle; nếu ném exception với w khác height, nó tự **thắt chặt precondition** của Rectangle.

    ~~~java
    // Hợp đồng Rectangle: setWidth không đổi height.
    Rectangle shape = new Square(3);
    shape.setWidth(5);
    // Client kỳ vọng height == 3, nhưng Square có thể chuyển thành 5.
    ~~~

    Mã giả lập nhấn mạnh hợp đồng đang được thảo luận, không phải API Java chuẩn. Quan hệ **is-a trong hình học** không tự động bảo đảm quan hệ subtype đúng cho API có mutation độc lập. Đây là phản ví dụ kinh điển của LSP.
