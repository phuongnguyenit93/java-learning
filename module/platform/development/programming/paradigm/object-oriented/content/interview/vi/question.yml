- question: Làm sao thiết kế state transition Order để không thể giao hàng trước khi thanh toán?
  answer: |-
    Mô hình hóa state bằng `enum` và method nghiệp vụ, ví dụ `NEW -> PAID -> SHIPPED`. `pay()` chỉ hợp lệ với `NEW`, `ship()` chỉ hợp lệ khi `PAID`. Nếu cho hủy, phải xác định chính xác trạng thái nào có thể hủy và hậu quả liên quan.

    ```java
    void ship() {
        if (status != Status.PAID)
            throw new IllegalStateException("Order not paid");
        status = Status.SHIPPED;
    }
    ```

    Không để caller tự gọi `setStatus(SHIPPED)`; test chuyển đổi hợp lệ và bị từ chối, đảm bảo state giữ nguyên khi throw. Trạng thái thanh toán từ hệ thống ngoài còn phải được xác thực qua service đáng tin cậy.
