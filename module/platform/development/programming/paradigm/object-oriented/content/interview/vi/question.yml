- question: Static method cùng tên ở subclass và superclass được gọi theo kiểu nào?
  answer: |-
    Đó là **static method hiding**, không phải runtime overriding. Một lời gọi như `Parent p = new Child(); p.label()` khi `label()` là static được ràng buộc theo kiểu tĩnh Parent; nên viết `Parent.label()` để tránh hiểu nhầm.

