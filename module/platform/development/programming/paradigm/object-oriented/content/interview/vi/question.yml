- question: Ưu tiên composition hơn inheritance là quy tắc bắt buộc? Khi nào abstract class vẫn có lợi?
  answer: |-
    Đây là **heuristic**, không phải luật cấm extends. Composition phù hợp khi cần lắp nhiều capability và thay implementation độc lập; inheritance phù hợp khi có quan hệ **is-a hợp lệ**, một họ lớp có invariant, constructor hoặc khung thuật toán chung ổn định.

    Ví dụ ReportService không phải loại Formatter: nên giữ Formatter làm collaborator. Nhưng các subclass thực sự cùng một họ ReportTemplate có thể kế thừa một abstract class cung cấp template method và state chung, nếu vẫn đáp ứng hợp đồng cha.

    Cân nhắc độ coupling, số tầng delegation, khả năng mở rộng, compatibility và chi phí thay đổi thay vì áp dụng một kỹ thuật cho tất cả.
