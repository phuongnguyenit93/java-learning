- question: Khi nào nên chọn constructor, static factory method, Factory hoặc Builder?
  answer: |-
    **Constructor** phù hợp với ít tham số, ý nghĩa rõ ràng và kiểm tra đầu vào đơn giản. **Static factory method** có tên diễn đạt ý nghĩa như Temperature.celsius(30) hoặc Temperature.fahrenheit(86), có thể giấu class cụ thể hoặc trả instance có sẵn. **Factory** thường gom logic chọn implementation theo tham số, môi trường hay cấu hình. **Builder** thuận lợi khi có nhiều tuỳ chọn dễ nhầm hoặc cần thiết lập dần trước bước build().

    Một Builder mutable cần validate ở build() và sao chép phòng vệ dữ liệu mutable trước khi công bố kết quả. Các setter của Builder thường sửa chính Builder, chưa phải object thành phẩm. Với immutable object chỉ có id/name bắt buộc, constructor thông thường thường là đủ.
