- question: this(...) và super(...) trong constructor giải quyết việc gì? Nếu Parent chỉ có Parent(String id) thì Child phải
    làm thế nào?
  answer: |-
    **this(...)** chuyển việc khởi tạo sang constructor overload khác trong cùng class, giúp gom validation và gán field về một đường duy nhất. **super(...)** gọi constructor superclass để khởi tạo trạng thái của phần cha. Trong Java 21, explicit constructor invocation là lệnh đầu tiên trong thân constructor; tại một constructor chỉ có một đường gọi this hoặc super. Constructor chaining không tạo thêm object.

    Nếu Parent không có constructor no-arg mà chỉ có Parent(String id), constructor Child cần gọi super(id) với dữ liệu phù hợp (hoặc chain tới overload của Child làm việc đó); mặc định super() sẽ lỗi biên dịch. Đường chain this(...) không được tạo vòng lặp đệ quy.
