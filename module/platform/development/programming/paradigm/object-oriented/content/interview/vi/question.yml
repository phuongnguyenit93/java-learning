- question: Constructor injection với PaymentGateway giúp test CheckoutService như thế nào? DI có bắt buộc dùng interface
    không?
  answer: |-
    CheckoutService nhận PaymentGateway qua constructor, kiểm tra non-null rồi chỉ biết hợp đồng charge(request). Composition root quyết định implementation thật; trong test, truyền **fake PaymentGateway** mô phỏng thành công, thất bại và ghi lại request mà không dùng mạng thật.

    ~~~java
    interface PaymentGateway { boolean charge(long cents); }
    final class CheckoutService {
        private final PaymentGateway gateway;
        CheckoutService(PaymentGateway gateway) {
            this.gateway = java.util.Objects.requireNonNull(gateway);
        }
        boolean pay(long cents) {
            if (cents <= 0) throw new IllegalArgumentException();
            return gateway.charge(cents);
        }
    }
    ~~~

    DI là **cách cấp dependency từ bên ngoài**, vẫn làm được với concrete class. Interface có thêm giá trị khi việc thay implementation, giả lập hoặc tách boundary giúp giảm phụ thuộc.
