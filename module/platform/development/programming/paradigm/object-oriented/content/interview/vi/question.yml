- question: Default constructor do compiler sinh khác constructor không tham số tự viết thế nào? Đã khai báo constructor có
    tham số thì còn default no-arg không?
  answer: |-
    Java chỉ sinh **default constructor** khi class **không khai báo bất kỳ constructor nào**. Default constructor không nhận tham số và gọi constructor superclass thích hợp. Constructor không tham số **tự viết** là một constructor bình thường, có thể tự validate và gán field.

    Nếu class khai báo User(String name) mà không khai báo User(), lời gọi new User() **lỗi compile-time**. Đừng thêm no-arg constructor chỉ để cho phép khởi tạo với dữ liệu thiếu; nếu framework cần nó thì phải thiết kế invariant và cách sử dụng đúng hợp đồng.
