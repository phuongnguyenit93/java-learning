- question: Có phải JPA cascade=ALL và orphanRemoval=true tự biến bất kỳ quan hệ nào thành composition về mặt domain?
  answer: |-
    Không. `cascade` và `orphanRemoval` là **cơ chế persistence**, không phải bằng chứng một quan hệ là composition. Nếu một Order sở hữu các OrderLine, orphan removal có thể phù hợp khi loại bỏ dòng cần xóa record. Với Team–Employee, cấu hình xóa Employee khi rời team có thể làm mất dữ liệu không thuộc quyền sở hữu của team.

    Quyết định **ownership/lifetime trước**, sau đó chọn mapping JPA và kiểm tra transaction, khóa ngoại, cascade và hành vi khi cập nhật. Phải test sau flush/reload database, không chỉ kiểm tra collection trước khi lưu.
