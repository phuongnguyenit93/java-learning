    Khi hai bộ xung đột, không giả vờ bug cũ là hợp đồng vĩnh viễn: ghi issue/decision, sửa ở một thay đổi nghiệp vụ riêng và cập nhật test phù hợp. Chỉ so sánh old-vs-new mà không có đặc tả độc lập không chứng minh logic là đúng.
