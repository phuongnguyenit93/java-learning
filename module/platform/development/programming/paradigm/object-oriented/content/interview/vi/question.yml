- question: Vì sao static List<Request> và ThreadLocal trong thread pool có thể làm leak memory dù Java có GC? Debug từ đâu?
  answer: |-
    Object vẫn **reachable** thì GC phải giữ, dù ứng dụng không còn cần nó. Static List tăng mãi, listener không unregister, cache không giới hạn và ThreadLocal không remove trên worker thread sống lâu đều là nguồn giữ reference phổ biến.

    Phân tích heap usage sau GC, số object, heap dump và **retaining path từ GC roots**. Cân nhắc giới hạn/expiry cache, xoá entry sau request, huỷ đăng ký listener, và ThreadLocal.remove() đúng scope. Không xem System.gc() là cách sửa leak khi object vẫn reachable; cần sửa quan hệ sở hữu và vòng đời giữ tham chiếu.
