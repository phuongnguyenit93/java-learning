- question: Java pass-by-value nghĩa là gì khi tham số là object reference? Ví dụ sau in gì?
  answer: |-
    Java luôn truyền **giá trị**. Với object, giá trị được sao chép là reference, không phải toàn bộ object.

    ```java
    class Demo {
        static void change(StringBuilder b) {
            b.append("B");
            b = new StringBuilder("X");
        }
        public static void main(String[] args) {
            StringBuilder s = new StringBuilder("A");
            change(s);
            System.out.println(s); // AB
        }
    }
    ```

    `append` sửa object đang được chia sẻ nên caller thấy AB; gán lại biến `b` chỉ đổi tham số cục bộ. Tương tự, với `int`, chỉ một bản sao giá trị số được đưa vào method.
