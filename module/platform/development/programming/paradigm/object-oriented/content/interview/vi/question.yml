- question: Invariant khác precondition và postcondition như thế nào? Hãy áp dụng cho đối tượng SeatInventory.
  answer: |-
    **Invariant** là điều kiện cần đúng ở mọi thời điểm object hợp lệ có thể được quan sát: `0 <= reserved <= capacity`. **Precondition** của `reserve(n)` gồm `n > 0` và `n <= capacity - reserved`. **Postcondition** sau thành công: `reserved` tăng chính xác `n` và invariant vẫn đúng.

    Constructor phải kiểm tra `capacity > 0`; `cancel(n)` chỉ được giảm số đã đặt. Khi precondition thất bại, thao tác cần có hợp đồng rõ (exception hoặc kết quả từ chối) và tránh sửa state trước khi phát hiện lỗi. Invariant không có nghĩa trạng thái bất biến; nó giới hạn **những trạng thái có thể chấp nhận**.
  aiGenerated: true
