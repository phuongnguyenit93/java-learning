- question: Abstraction khác encapsulation thế nào khi thiết kế SeatInventory?
  answer: |-
    **Abstraction** trả lời caller được yêu cầu *khả năng nào*: `remaining()`, `reserve(n)`, `release(n)`. **Encapsulation** trả lời state bên trong được bảo vệ *bằng cách nào*: `capacity`, `available` private và chỉ thay sau kiểm tra hợp lệ.

    Một interface `SeatInventory` có thể định nghĩa hợp đồng giữ ghế; một class `InMemorySeatInventory` dùng field private và kiểm tra `0 <= available <= capacity`. Hai nguyên lý bổ trợ nhau nhưng không đồng nhất: interface sai hợp đồng vẫn là abstraction kém; field private mà getter làm lộ collection mutable vẫn là encapsulation kém.
