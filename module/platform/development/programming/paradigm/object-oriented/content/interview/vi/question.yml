- question: Khi nào một lớp dài thật sự trở thành God Class thay vì chỉ là class có nhiều dòng mã?
  answer: |-
    Một class dài chưa đủ chứng minh God Class. Hãy xem nó có nhiều **lý do thay đổi độc lập** không: công thức thuế, SQL, email, xuất PDF và giao thức HTTP đều nằm trong OrderManager là dấu hiệu rõ hơn số dòng.

