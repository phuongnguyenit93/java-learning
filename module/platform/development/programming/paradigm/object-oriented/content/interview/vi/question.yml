- question: Invariant của Wallet khác precondition và postcondition thế nào? Viết test trường hợp withdraw thất bại ra sao?
  answer: |-
    **Invariant** là điều phải đúng trong những trạng thái ổn định hợp lệ, ví dụ balance>=0, trạng thái CLOSED không còn cho phép giao dịch. **Precondition** là điều kiện người gọi phải đáp ứng, ví dụ amount>0. **Postcondition** là kết quả sau thành công, ví dụ balance giảm đúng amount.

    Ví dụ ví còn 50.000, gọi withdraw(70.000) bị từ chối: test ghi snapshot trước, assert exception/result theo contract, rồi **assert balance/status/lịch sử giao dịch không đổi**. Với withdraw(50.000), assert số dư bằng 0 được chấp nhận nếu domain cho phép.

    Một test chỉ assert exception không chứng minh invariant được giữ sau thất bại. Nếu method cập nhật nhiều field, phải test tính nhất quán giữa các field ở cả đường thành công và thất bại.
  aiGenerated: true
