- question: Một thao tác thay đổi nhiều field có thể bảo đảm all-or-nothing chỉ nhờ private và một Java method không?
  answer: |-
    Trong một object đơn luồng, ta có thể tính state mới, kiểm tra toàn bộ rồi mới gán, tránh lỗi validation/overflow sau khi đã mutate. Nhưng `private` và ranh giới method **không phải transaction**: exception bất ngờ sau một side effect, I/O thất bại hay thread khác can thiệp vẫn có thể tạo trạng thái dở dang.

    Nếu chuyển cả hai account, ghi database và phát message, cần transaction/storage coordination, locking hoặc optimistic versioning và cách xử lý side effect như outbox/idempotency. Điều này giúp chọn đúng ranh giới: domain bảo vệ invariant cục bộ, application service điều phối tài nguyên bên ngoài.
