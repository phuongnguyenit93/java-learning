- question: DRY, YAGNI, KISS có mâu thuẫn không? Có nên đưa mọi đoạn code giống nhau vào base class?
  answer: |-
    DRY tránh lặp lại **tri thức nghiệp vụ**, không nhất thiết mọi dòng mã giống nhau. Hai quy tắc tình cờ giống hiện tại có thể thay đổi độc lập, nên ép chung superclass có thể làm coupling tệ hơn.

    YAGNI tránh tính năng chưa có nhu cầu; KISS ưu tiên đơn giản đủ đúng. Chọn abstraction khi đã thấy cùng lý do thay đổi và hiểu hợp đồng thật; Rule of Three là heuristic chứ không phải ngưỡng bắt buộc.
