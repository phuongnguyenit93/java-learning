- question: Vì sao Square extends mutable Rectangle có thể vi phạm LSP dù trong hình học Square là Rectangle?
  answer: |-
    Giả sử mutable Rectangle công bố hợp đồng: setWidth(w) **chỉ đổi chiều rộng, giữ nguyên chiều cao**; setHeight(h) làm điều ngược lại. Square phải duy trì width == height.

    Nếu Square.setWidth(5) đồng thời đổi height thành 5, nó **phá postcondition** của Rectangle. Nếu Square ném lỗi khi width khác height, nó lại **siết precondition** mà Rectangle vốn chấp nhận.

    Có thể thiết kế hợp đồng chung chỉ công bố area() hoặc dimensions() ở các shape, còn API resize độc lập và resize cạnh vuông tách riêng; một immutable geometry abstraction cũng có thể phù hợp với các bảo đảm khác. Điểm quyết định là **hành vi client quan sát**, không chỉ tên quan hệ is-a hay phép kế thừa biên dịch được.
