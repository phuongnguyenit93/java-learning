- question: Use case khác business rule và yêu cầu phi chức năng như thế nào trong bài toán sinh viên đăng ký khóa học?
  answer: |-
    **Use case** mô tả actor muốn đạt mục tiêu gì và hệ thống phản hồi qua luồng chính/luồng thay thế: sinh viên yêu cầu đăng ký khóa. **Business rule** quyết định điều kiện thành công: tài khoản active, đã hoàn thành môn tiên quyết, lớp còn chỗ, không đăng ký trùng. **Yêu cầu phi chức năng** mô tả phẩm chất cần bảo đảm như hiệu năng, audit, bảo mật hoặc độ sẵn sàng.

    Đừng đưa mọi rule vào một dòng "hệ thống kiểm tra hợp lệ". Hãy đặt ID và ví dụ đúng/sai cho từng rule, liên kết tới method/domain invariant và acceptance test. Các quy tắc trong ví dụ học tập cần được stakeholder xác nhận, không xem là chính sách chung của mọi nền tảng.
