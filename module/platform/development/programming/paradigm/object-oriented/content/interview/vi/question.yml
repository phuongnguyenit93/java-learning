questions:
- question: Vì sao OOP giải quyết bài toán tổ chức chương trình chứ không chỉ là viết nhiều class?
  answer: |-
    OOP tổ chức hệ thống theo **đối tượng có trạng thái, hành vi và trách nhiệm**. Quy tắc liên quan đến trạng thái của một đối tượng được đặt gần nơi sở hữu trạng thái ấy, thay vì rải rác trong nhiều hàm thao tác trực tiếp lên dữ liệu.

    Ví dụ `Order.place()` kiểm tra đơn có dòng hàng và trạng thái cho phép rồi mới chuyển sang PLACED. Nếu controller, service và UI đều tự đổi `status`, một đường xử lý mới có thể bỏ qua quy tắc.

    Lợi ích không nằm ở số class mà ở **invariant được bảo vệ, độ gắn kết trách nhiệm và chi phí thay đổi yêu cầu**. Class chỉ chứa getter/setter, còn mọi quy tắc nằm ở service, chưa chắc đạt mục đích của OOP.
