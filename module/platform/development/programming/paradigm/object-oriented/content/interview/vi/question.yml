- question: Trong Animal a = new Dog(), compiler và JVM mỗi bên quyết định điều gì khi gọi a.sound()?
  answer: |-
    Compiler nhìn thấy kiểu khai báo `Animal`: kiểm tra `sound()` có trong API của Animal, có truy cập được hay không và chọn chữ ký method hợp lệ. Nếu Dog là runtime class của object và override `sound()`, JVM dùng **dynamic dispatch** để chạy `Dog.sound()`.

    ```java
    interface Animal { String sound(); }
    class Dog implements Animal {
        @Override public String sound() { return "gâu"; }
    }
    Animal a = new Dog();
    System.out.println(a.sound()); // gâu
    ```

    Kiểu khai báo quyết định **có thể gọi gì**; loại object lúc chạy quyết định **implementation nào** của một instance method được override.
