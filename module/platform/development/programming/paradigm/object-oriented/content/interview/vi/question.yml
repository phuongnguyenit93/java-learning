- question: 'Hai interface không liên quan cùng định nghĩa default method có chữ ký giống nhau: class implement cả hai có
    biên dịch không?'
  answer: |-
    Nếu hai default implementation **độc lập và xung đột**, class phải giải quyết bằng cách override. Có thể tự chọn một implementation hoặc gọi tường minh `A.super.method()` / `B.super.method()` nếu đúng hợp đồng.

    ```java
    interface A { default String label() { return "A"; } }
    interface B { default String label() { return "B"; } }
    class C implements A, B {
        @Override public String label() { return A.super.label(); }
    }
    ```

    Không override `label()` ở C sẽ báo lỗi compile. Cần cân nhắc ngữ nghĩa: hai method cùng tên nhưng mang nghĩa nghiệp vụ khác nhau có thể nên đổi hợp đồng hoặc tách adapter thay vì ghép chuỗi kết quả.
