- question: Bạn quyết định kế thừa hay composition cho Shape, ReportPublisher và Car như thế nào?
  answer: |-
    Circle và Rectangle có thể tuân thủ một hợp đồng Shape.area() chung: quan hệ **is-a** có ý nghĩa, miễn mọi kiểu con giữ đúng điều kiện của Shape. Ngược lại, ReportPublisher **dùng** formatter và sink; Car **có** engine. Những quan hệ has-a/uses-a phù hợp với composition, thường thông qua interface nhỏ.

    Ví dụ ReportPublisher nhận ReportFormatter (CSV/Text) và ReportSink qua constructor. Muốn thêm JSON hoặc nơi xuất mới, có thể thay collaborator mà ít sửa logic điều phối. Không tạo ReportPublisher extends CsvFormatter chỉ vì muốn tái sử dụng vài dòng.

    Đừng dùng quy tắc 'luôn composition': inheritance có ích khi hợp đồng phân loại bền vững, còn composition cũng có chi phí nhiều abstraction/ủy quyền nếu thiết kế quá mức.
