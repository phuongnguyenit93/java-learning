- question: Một Money được biểu diễn bằng số tiền và currency nên thiết kế equality/hash như thế nào? Khi nào record đủ và
    khi nào không?
  answer: |-
    Value object Money nên xác định **các field tham gia equality** theo nghĩa nghiệp vụ, thường là amount và currency. Hai Money cùng lượng tiền **nhưng khác currency** không được coi là bằng nhau. Nếu Money immutable, equality và hashCode có thể ổn định khi làm HashMap key.

    Java record tự tạo equals/hashCode dựa trên components và accessor, hữu ích nếu các component đúng hoàn toàn theo semantics mong muốn. Tuy nhiên record chỉ giữ reference **shallowly immutable**; mutable List/array component cần defensive copies và equality thích hợp.

    Không tùy tiện dùng hashCode làm ID hoặc mã bảo mật. Domain entity có identity theo ID có thể chọn nghĩa equality khác Value Object; khi JPA ID chưa được cấp/proxy tồn tại thì cần chiến lược riêng, không sao chép công thức từ record.
