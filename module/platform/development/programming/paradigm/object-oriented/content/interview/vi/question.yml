- question: Builder khác telescoping constructor và setter ở giá trị nào?
  answer: Builder đặt tên cho các tùy chọn, giúp tránh nhầm nhiều tham số cùng kiểu và kiểm tra invariant tổng thể trước khi
    công bố object. Có thể validate từng bước, nhưng **build() phải kiểm tra các ràng buộc kết hợp**. Nếu Builder lưu collection
    mutable, object kết quả nên có snapshot và defensive copying thích hợp. Với record chỉ có ít trường rõ nghĩa, constructor
    hoặc static factory có thể đơn giản hơn.
