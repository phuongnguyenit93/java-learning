- question: Vì sao interface nằm trong package infrastructure hoặc chứa SQLException và vendor SDK types có thể khiến DIP
    thất bại?
  answer: |-
    DIP cần abstraction được thiết kế theo **điều client nghiệp vụ cần**, không theo chi tiết. Nếu core phải import package chứa JDBC, nhận ResultSet, trả vendor-specific response hay xử lý SQLException ở mọi nơi, việc tạo interface chưa thực sự cắt coupling với hạ tầng.

    Một domain/application port như PurchaseReader nên trả data/domain value hoặc DTO phù hợp, định nghĩa semantics của thiếu dữ liệu, input, ordering, đơn vị tiền và cách báo lỗi. Adapter chịu trách nhiệm **mapping SQL/HTTP errors** sang hợp đồng phù hợp.

    Đặt interface ở module core/application sở hữu contract để infrastructure phụ thuộc ngược vào đó; composition root được phép tham chiếu hai bên. Tránh trừu tượng hóa quá mức nếu đây là một helper nội bộ không có boundary cần che.
