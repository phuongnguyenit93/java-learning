- question: Trong mô hình thư viện, trách nhiệm của BookCopy, Loan, LoanPolicy và LibraryService khác nhau ở đâu?
  answer: |-
    BookCopy sở hữu định danh bản sách và trạng thái cho mượn; Loan giữ lịch sử của **một lần mượn** cùng ngày mượn, hạn trả và ngày đóng; Member giữ danh tính/trạng thái thành viên. LoanPolicy quyết định hạn mức và thời hạn; LibraryService phối hợp các object và kiểm tra quy tắc cần **quan sát nhiều aggregate**, chẳng hạn số loan mở của thành viên hoặc copy có loan mở chưa.

    Nếu hạn mượn đổi 14 thành 21 ngày, thay cấu hình/implementation policy; không cần sửa Book hay Member. Nếu cố đặt tất cả vào Loan, Loan sẽ phải biết toàn bộ thư viện; nếu chỉ cho BookCopy tự mượn, nó không biết member có quá hạn.

    Service không nên trộn SQL/HTTP/UI với bất biến miền trong ví dụ. Kết hợp trách nhiệm giúp test riêng policy và test luồng phối hợp qua public API.
