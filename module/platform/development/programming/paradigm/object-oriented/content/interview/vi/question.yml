- question: Nếu PaymentGateway ném lỗi sau khi đã thu tiền nhưng trước khi trả kết quả, test unit có thể kết luận rollback
    được không?
  answer: |-
    **Không.** Exception hay timeout không chứng minh thanh toán chưa xảy ra. Nếu network trả lỗi sau khi provider đã charge, trạng thái thực có thể là **unknown outcome**. Một unit test với stub chỉ chứng minh CheckoutService phản ứng thế nào theo dữ liệu giả; không xác nhận trạng thái thật ở provider.

    Không retry charge vô điều kiện hoặc release kho như thể chắc chắn không thu tiền. Trong hệ thống thật cần request/idempotency key, truy vấn trạng thái và reconciliation; thiết kế các trạng thái pending/unknown và quy trình compensation hợp lệ.

    Test phải ghi rõ **contract đang giả định**. Mẫu unit test đơn giản có thể coi exception là thất bại để luyện orchestration, nhưng production phải có integration/contract tests và handling riêng cho side effects không thể rollback bằng DB transaction.
