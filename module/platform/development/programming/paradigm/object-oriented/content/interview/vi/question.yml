- question: Refactor một hàm calculateShipping có nhiều if theo channel sang Strategy cần xác định và kiểm thử điều gì?
  answer: |-
    Trước tiên tách **trục biến thiên** thực sự: thuật toán tính cước theo hãng, không phải mọi thứ đều đưa vào policy. Chốt contract về tiền, trọng lượng, vùng, kết quả hợp lệ, exception và rounding. Tạo interface ShippingPolicy và implementation cho từng thuật toán; dịch vụ nhận policy qua constructor hoặc chọn từ registry cấu hình ở boundary.

    Sau đó chạy **contract tests dùng chung** cho mọi policy: input không hợp lệ, biên trọng lượng, kết quả không âm, đơn vị/rounding, các tình huống được hỗ trợ. Test ShippingService bằng fake để xác nhận delegation, không cần vendor thật.

    Đăng ký policy mới phải có cách xử lý cấu hình sai và tên policy không tồn tại. OCP tốt giảm phần lõi cần sửa, nhưng không có nghĩa **không sửa composition root hoặc config**.
