- question: 'HashMapPriceCatalog và TreeMapPriceCatalog cùng implements PriceCatalog nhưng trả list SKU khác thứ tự: có thay
    thế an toàn không?'
  answer: |-
    Phụ thuộc vào **contract**. Nếu listSkus() không hứa thứ tự thì client không được dựa vào cách duyệt của HashMap hoặc TreeMap. Nếu contract hứa sắp tăng dần, mọi implementation phải đảm bảo đúng thứ tự, bất kể cấu trúc lưu trữ bên dưới.

    Bộ **contract tests dùng chung** cần kiểm tra lookup, SKU không tồn tại, giá bằng 0, update, delete, null input, snapshot và semantics thứ tự. Khác biệt độ phức tạp/hiệu năng thường có thể chấp nhận nếu không phá các bảo đảm đã công bố.

    Thay HashMap bằng TreeMap compile thành công chưa chứng minh behavior đúng; chính nghĩa vụ quan sát được theo LSP mới là tiêu chuẩn.
