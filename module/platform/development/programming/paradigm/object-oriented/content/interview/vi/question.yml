    Điểm phân biệt: workflow nên quyết định **khi nào gọi và xử lý kết quả**, không ôm chi tiết SQL, cấu trúc PDF, SMTP hay công thức thuế thuộc trách nhiệm khác. Nếu nó liên tục thay đổi vì thêm phương thức tính thuế hoặc sửa HTML email, đã có dấu hiệu thiếu phân tách.

