- question: Alt, opt, loop và par trong sequence diagram dùng khi nào? Khi thiết kế luồng lỗi nên thể hiện gì?
  answer: |-
    `alt` thể hiện **các nhánh thay thế có guard** như [book available] và [already borrowed]; `opt` là đoạn có điều kiện; `loop` là tương tác lặp; `par` mô tả những phần có thể diễn ra song song theo semantics của mô hình.

    Với use case borrow, nhánh sách đã mượn nên trả `COPY_NOT_AVAILABLE` **trước khi gọi save**; nhánh member vượt limit cũng không tạo Loan. Nếu vẽ `par` cho hai bước sửa cùng invariant, cần kiểm tra race/transaction thực tế; dấu `par` không tự bảo đảm thread-safe hay kết quả có thứ tự.
