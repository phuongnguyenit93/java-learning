- question: Quan hệ is-a được Java xác nhận qua extends hoặc implements có đủ để thỏa Liskov Substitution Principle (LSP)
    không?
  answer: |-
    **Chưa đủ.** Hệ kiểu xác nhận **tương thích khai báo**; LSP còn đòi **thay thế về hành vi**: mọi lời gọi hợp lệ mà supertype hứa chấp nhận vẫn phải được subtype xử lý hợp lệ và tạo ra kết quả/side effect nằm trong cam kết.

    Ví dụ ShippingPolicy cho phép quãng đường từ 0, nhưng ExpressShippingPolicy tự ý ném exception khi quãng đường bằng 0. Nó implement đúng method signature, song **thắt chặt precondition**, khiến client đúng theo contract chung bị lỗi.

    Tương tự, subtype không được làm yếu postcondition hoặc phá invariant đã hứa. Các thuật toán và kết quả cụ thể có thể khác nếu contract cho phép; LSP không yêu cầu mọi implementation trả cùng con số.
