- question: Invariant của SeatInventory là gì và field public có thể làm nó sai ra sao?
  answer: |-
    Giả sử capacity dương, phải luôn có **0 ≤ reserved ≤ capacity** khi object được quan sát ở trạng thái hợp lệ. Nếu caller ghi trực tiếp `reserved = 12` với capacity=10, `available()` trở thành -2 dù mã Java biên dịch bình thường.

    Giữ field private; constructor xác thực capacity; thay đổi chỉ qua `reserve(n)`, `cancel(n)` có kiểm tra và không sửa state khi thao tác bị từ chối.
