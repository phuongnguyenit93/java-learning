- question: Static factory of(...) có luôn tạo instance mới không? Hệ quả đối với == và trạng thái dùng chung là gì?
  answer: |-
    **Không.** Factory có thể new mỗi lần hoặc trả singleton, instance cache, instance thuộc subtype; phải đọc **hợp đồng factory cụ thể**. Tên of/create không chứng minh lúc gọi có new. Vì thế đừng dựa vào == để kiểm tra giá trị của hai kết quả được tạo từ cùng input; dùng equals theo hợp đồng giá trị của kiểu đó.

    Nếu factory trả một mutable singleton dùng chung, mutation qua một caller có thể ảnh hưởng các caller khác. Cần xác định lifecycle, owner và thread-safety. Với immutable value object, chia sẻ instance thường phù hợp nếu API không hứa phải luôn tạo mới.
