- question: Thiết kế OtpService chỉ cần SMS theo ISP khác với việc truyền một NotificationService hỗ trợ email, SMS và push
    thế nào?
  answer: |-
    Một OtpService chỉ cần **gửi SMS theo nghĩa hợp đồng**, nên phụ thuộc SmsSender.sendSms(...) thay vì nhận NotificationService chứa cả sendEmail, sendPush và sendSms. Nhờ vậy fake trong unit test chỉ cần hỗ trợ đúng capability; provider chỉ có SMS không phải tạo method email/push giả.

    Nếu một nhà cung cấp thực sự cung cấp cả SMS và email, một class có thể implements hai interface mà không cần copy implementation thành hai object. Điều quan trọng là **client phụ thuộc nhóm thao tác có lý do sử dụng**, không bị thay đổi khi chức năng push/email được bổ sung.

    Đừng đánh đồng ISP với yêu cầu bảo mật: kiểu tham chiếu nhỏ **không thay thế authorization** ở tầng HTTP/DB, và cũng không ngăn thành phần khác có quyền gửi loại thông báo khác.
