- question: Tại sao một bộ kiểm thử cho từng method riêng lẻ vẫn có thể bỏ sót lỗi trạng thái xảy ra sau nhiều lời gọi?
  answer: |-
    Object có **trạng thái và vòng đời**. Một operation có thể đúng nếu gọi từ trạng thái ban đầu nhưng sai sau chuỗi thao tác. Ví dụ Wallet mở, nạp, rút, khóa rồi vẫn cho nạp tiếp; test chỉ deposit trên ví mới sẽ không phát hiện.

    Hãy lập **bảng trạng thái và cạnh chuyển**: OPEN → LOCKED → CLOSED; đối chiếu operation hợp lệ ở từng trạng thái, operation bị từ chối và giá trị bất biến sau lỗi. Dùng test sequence dài ngắn đại diện: nạp–rút–khóa; đóng–mở lại (nếu không cho phép); rút vượt số dư sau một lần nạp.

    State coverage chỉ đi qua từng trạng thái, chưa chắc bao phủ từng **transition và invalid transition**. Có thể bổ sung model-based/property-based test với seed để tạo chuỗi có thể tái hiện khi lỗi.
