- question: Hợp đồng equals(Object) và hashCode() gồm những điều kiện nào, và tại sao cùng hash chưa có nghĩa hai object bằng
    nhau?
  answer: |-
    equals phải có tính **phản xạ**, **đối xứng**, **bắc cầu**, **nhất quán** khi trạng thái dùng để so sánh không đổi, và x.equals(null) luôn false với x non-null.

    hashCode phải nhất quán theo trạng thái tham gia equality và thỏa **x.equals(y) == true ⇒ x.hashCode() == y.hashCode()**. Chiều ngược không bắt buộc: **collision** giữa object khác nhau là hợp lệ. Không cần, và không thể đòi mỗi object khác nhau có mã băm riêng duy nhất.

    HashMap/HashSet dùng hash để chọn bucket rồi dùng equals để phân biệt key phù hợp. Override equals mà quên hashCode dễ khiến hai key bằng nhau nằm ở bucket khác hoặc không thể tra lại theo một key tương đương.
