- question: Pageable, lazy loading và thời điểm hoàn thành là chi tiết triển khai hay phần hợp đồng cần công bố?
  answer: |-
    Tùy **ai là caller và cam kết sử dụng**. API đọc danh sách có thể hợp lý khi công bố pagination ở mức ứng dụng vì client thực sự cần điều khiển kích thước trang và thứ tự. Nhưng buộc domain phụ thuộc trực tiếp vào `Pageable` của framework có thể làm hẹp khả năng thay thế; có thể dùng request/result do chính module định nghĩa.

    Lazy loading cũng là rò rỉ nếu caller không được báo phải giữ persistence session mở. Tương tự, method trả về trước khi tác vụ async hoàn thành phải mô tả **lúc nào** dữ liệu có hiệu lực. Abstraction tốt che cấu trúc nội bộ chứ không giấu tính chất quan sát được mà caller cần dựa vào.
