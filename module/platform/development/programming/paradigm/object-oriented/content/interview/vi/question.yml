- question: Record Java có mặc nhiên deep immutable không? Thiết kế EventSnapshot gồm danh sách thế nào?
  answer: |-
    Record tự cung cấp các component field `private final`, constructor và accessor, nhưng **không tự deep-copy** dữ liệu tham chiếu. `record EventSnapshot(List<Event> events)` vẫn có thể nhận hoặc trả list chứa các `Event` mutable.

    Nếu `Event` là immutable value, dùng compact constructor:

    ```java
    record EventView(String name, long startEpochSeconds) {}
    record EventSnapshot(java.util.List<EventView> events) {
        EventSnapshot { events = java.util.List.copyOf(events); }
    }
    ```

    List được phòng vệ ở đầu vào, accessor trả cấu trúc unmodifiable; các `EventView` chỉ chứa `String` và primitive nên an toàn ở mức biểu diễn này.
