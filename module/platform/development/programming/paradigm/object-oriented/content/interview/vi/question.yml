- question: Decorator tốt hơn inheritance trong trường hợp nào, và có hạn chế gì?
  answer: Decorator cho ghép nhiều tính năng tùy chọn theo runtime mà không phải tạo subclass cho mọi tổ hợp. Nó dựa trên
    composition, nhưng có thể làm call stack dài, thứ tự bọc khó nhận biết và quyền close resource mơ hồ. Nếu chỉ thêm một
    hành vi nhỏ cố định, cách trực tiếp có thể rõ hơn. Không nên coi chuỗi Decorator là giải pháp tự động cho transaction
    hoặc side effect.
