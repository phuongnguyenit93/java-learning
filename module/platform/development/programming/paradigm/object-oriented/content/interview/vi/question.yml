- question: Singleton có bảo đảm thread-safe và duy nhất toàn JVM không?
  answer: 'Không. Holder idiom tạo an toàn một instance trong phạm vi **class loader**, nhưng nhiều class loader có thể có
    nhiều instance. Khởi tạo thread-safe không khiến mutable fields thread-safe: count++ không nguyên tử. Dùng AtomicLong
    hoặc lock nếu cần, và đừng lưu userId/currentOrder của request trong singleton dùng chung. Phải chỉ rõ scope, lifetime
    và khả năng thay thế khi test.'
