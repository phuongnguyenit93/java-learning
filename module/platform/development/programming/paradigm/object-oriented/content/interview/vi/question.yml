- question: OOP có tự giải quyết thread-safety, transaction, hiệu năng và microservices không?
  answer: |-
    Không. Encapsulation có thể đặt rule đúng nơi nhưng **không tự cung cấp synchronization, atomic transaction xuyên hệ thống hoặc consistency giữa request/process**. Object mutable được nhiều thread sử dụng vẫn có thể race; ghi database và gọi API ngoài đòi cơ chế riêng.

    Object allocation và dynamic dispatch có chi phí, nhưng JVM/JIT cũng có tối ưu. Khi hiệu năng quan trọng, đo bằng profiler/benchmark thực tế; I/O, data layout, caching và thuật toán thường có ảnh hưởng lớn hơn suy đoán “OOP chậm”.

    Microservice là cách phân ranh giới triển khai và giao tiếp hệ thống, không phải hệ quả tất yếu của interface/class. OOP là công cụ tổ chức code, không phải phương án mặc định giải quyết mọi vấn đề kiến trúc.
