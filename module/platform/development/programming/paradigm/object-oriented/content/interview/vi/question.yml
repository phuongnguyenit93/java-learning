- question: Tách canReserve() và reserve() theo CQS có ngăn được lỗi hai luồng cùng giữ một mặt hàng không?
  answer: |-
    Không. Code if (inventory.canReserve(qty)) inventory.reserve(qty) gặp lỗi **TOCTOU**: giữa lần hỏi và lần ghi, thread/process khác có thể thay đổi số lượng.

    Command reserve phải **kiểm tra lại điều kiện tại chính điểm thay đổi** trong một vùng nguyên tử phù hợp. Với một JVM có thể dùng lock/synchronized; với database phải dùng transaction, optimistic version, conditional update và kiểm tra số row cập nhật. synchronized trong một instance app không bảo vệ nhiều instance khác nhau.

    Query canReserve chỉ hỗ trợ UI hiển thị trạng thái gần đúng, không cam kết command sau đó chắc chắn thành công.
