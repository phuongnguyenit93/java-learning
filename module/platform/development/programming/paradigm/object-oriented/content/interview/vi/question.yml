- question: GC có tự hủy object con cùng parent theo quan hệ composition hoặc đóng BufferedWriter khi CsvExporter hết tham
    chiếu không?
  answer: |-
    Garbage collector hoạt động theo **reachability từ GC roots**, không theo sơ đồ UML ownership. Object con còn reference từ nơi khác có thể vẫn reachable sau khi parent không còn sử dụng; không có cam kết hai object được thu gom cùng lúc.

    GC thu hồi Java heap **không đảm bảo** đóng file handle/socket đúng hạn. Nếu CsvExporter tự tạo BufferedWriter và sở hữu nó, thiết kế close() rõ ràng, implements AutoCloseable và sử dụng try-with-resources ở scope tạo CsvExporter. Nếu method chỉ **mượn Writer** từ caller, không tự close trừ khi có hợp đồng chuyển giao quyền sở hữu.
