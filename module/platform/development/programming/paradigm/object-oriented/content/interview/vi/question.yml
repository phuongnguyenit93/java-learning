- question: Getter trả snapshot có đủ làm kết quả nhất quán khi thread khác đang cập nhật object không?
  answer: |-
    Chưa chắc. `List.copyOf(items)` bảo vệ **sửa đổi sau khi copy** ở cấp cấu trúc, nhưng quá trình tạo snapshot có thể đụng một thread đang mutate list, gây exception hoặc thu được ảnh chụp không nhất quán.

    Muốn bảo đảm một snapshot logic tại cùng thời điểm, cần đồng bộ đọc/ghi cùng một khóa, snapshot bất biến được publish an toàn hoặc cơ chế version/transaction phù hợp. `final`, `private`, unmodifiable collection hay defensive copy **không tự cung cấp atomicity và memory visibility** cho toàn bộ một thao tác nhiều field.
