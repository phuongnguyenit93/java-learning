- question: Order chứa danh sách dòng hàng và trạng thái DRAFT, PLACED, CANCELLED. Bạn đặt các hành vi và bất biến ở đâu?
  answer: |-
    Đặt trách nhiệm sửa dòng hàng và chuyển trạng thái trong **Order**, không cho client tự thay status hoặc Map nội bộ. OrderLine kiểm tra dữ liệu của một dòng (SKU, đơn giá, số lượng); OrderStatus là enum. Các method như setLine, changeQuantity, removeLine, place và cancel thực thi điều kiện của vòng đời.

    Trong DRAFT cho phép sửa hợp lệ; sau khi PLACED/CANCELLED, các lệnh thay đổi trái hợp đồng phải bị từ chối. SKU được chuẩn hóa để một sản phẩm không tạo hai dòng khác chữ hoa/thường. changeQuantity(sku, 0) có thể xóa dòng theo hợp đồng; SKU không tồn tại ở thao tác đổi số lượng báo lỗi rõ nghĩa.

    Test riêng từng trạng thái và từng lệnh; khi lệnh lỗi, kiểm tra trạng thái lẫn danh sách dòng và tổng tiền không đổi. Việc chỉ có field private chưa đủ nếu getter trả nguyên collection có thể sửa.
