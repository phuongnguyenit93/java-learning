- question: Khi nào dùng ==, equals() hoặc business ID? Vì sao override equals() cần override hashCode()?
  answer: |-
    Với hai reference, **==** kiểm tra cùng instance; **equals()** thể hiện quan hệ bằng nhau do class định nghĩa. Value object như tọa độ thường so theo dữ liệu; entity như Order cần lựa chọn rõ yếu tố định danh nghiệp vụ.

    Hợp đồng equals gồm phản xạ, đối xứng, bắc cầu, nhất quán và false với null. Nếu a.equals(b) true thì **a.hashCode() == b.hashCode()** phải true. HashSet/HashMap dựa vào hash trước khi kiểm tra equals; override equals mà không override hashCode khiến object tương đương có thể nằm ở bucket khác và gây lỗi truy xuất.
