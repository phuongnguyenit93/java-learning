  answer: |-
    Contract test dùng nhiều implementation thông qua cùng interface để kiểm tra: input sai bị từ chối theo hợp đồng, result có orderId và status hợp lệ, không báo thanh toán thành công giả, ngoại lệ và side effect dự kiến nhất quán. Có thể dùng factory dữ liệu test cho từng provider để chạy cùng tập điều kiện.

