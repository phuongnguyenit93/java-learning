- question: Khi nào lớp forwarding chỉ làm code phình to, và khi nào TicketRouter có lý do tồn tại?
  answer: |-
    Lớp forwarding chỉ chuyển mọi method của delegate mà không thêm hợp đồng, validation, orchestration, boundary hay trách nhiệm rõ ràng có thể tạo **boilerplate** và kéo dài call graph. Không cần adapter/interface mới cho mọi helper.

    TicketRouter có ý nghĩa nếu nó kiểm tra ticket, chọn thứ tự gọi classifier và assignment port, xác thực kết quả, che đi chi tiết hạ tầng và định nghĩa cách báo thành công/lỗi. Client chỉ cần biết use case route(ticket).

    Hãy đánh giá từ **điều client thực sự cần** và mức thay đổi độc lập, không từ số lượng file hoặc số layer. Composition tốt là ghép các trách nhiệm có lý do tồn tại.
