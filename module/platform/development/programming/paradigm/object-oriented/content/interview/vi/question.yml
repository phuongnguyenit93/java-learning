- question: Từ yêu cầu nạp, rút, chuyển tiền, bạn thiết kế BankAccount như thế nào để số dư không thể âm hoặc bị sửa tùy ý?
  answer: |-
    BankAccount là lớp mô tả **quy tắc chung**; mỗi lần khởi tạo tạo một đối tượng có accountNumber, ownerName và balanceVnd độc lập. Giữ số dư private, thông tin định danh có thể là private final, và chỉ mở các hành vi deposit, withdraw, transferTo cùng accessor chỉ đọc. Constructor từ chối mã/tên rỗng và số dư âm.

    Quy định tiền nạp/rút phải dương, rút không vượt số dư; thao tác lỗi ném ngoại lệ **trước khi thay đổi trạng thái**. Dùng long cho VND nguyên trong mô phỏng và Math.addExact khi cộng để phát hiện overflow. Không dùng getter trả ra đối tượng mutable đại diện cho số dư.

    Kiểm thử tối thiểu: hai tài khoản tách biệt; nạp/rút thành công; nạp 0, rút quá số dư và cộng tràn số đều bị từ chối, số dư trước/sau lỗi bằng nhau. Với tiền tệ có phần thập phân, nên chuyển sang kiểu Money/BigDecimal và mã tiền tệ rõ ràng.
