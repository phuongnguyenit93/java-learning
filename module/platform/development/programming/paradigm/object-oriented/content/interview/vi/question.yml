- question: Khi kiểm thử một đối tượng OOP, tại sao nên bắt đầu từ hành vi công khai thay vì private fields và thuật toán
    bên trong?
  answer: |-
    Client chỉ được quyền dựa trên **public contract**: input hợp lệ, kết quả, thay đổi trạng thái, exception và tác dụng phụ có ý nghĩa. Test theo contract sống được qua refactor từ ArrayList sang HashMap hoặc từ thuật toán tuyến tính sang cache, miễn lời hứa không đổi.

    Ví dụ kho vé có sức chứa 10: tryReserve(4) thành công và remaining() là 6; tryReserve(7) bị từ chối, remaining() vẫn là 6; cancel(2) làm remaining() thành 8 theo hợp đồng. Test không cần biết biến nội bộ là reserved, AtomicInteger hay cơ sở dữ liệu.

    **Không test bằng cách sửa private field qua reflection** để tạo trạng thái hỏng nếu trạng thái ấy không thể xuất hiện qua API hợp lệ. Nên dùng public methods và fixture riêng cho từng test; ngoại lệ là các kiểm thử kỹ thuật đặc biệt có mục tiêu được ghi rõ.
  aiGenerated: true
  reviewed: false
