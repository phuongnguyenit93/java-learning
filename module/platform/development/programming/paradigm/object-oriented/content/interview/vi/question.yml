- question: Nếu superclass có instance method cụ thể và interface có default method cùng chữ ký, Java chọn gì?
  answer: |-
    **Phương thức instance cụ thể kế thừa từ class** được ưu tiên so với default method cùng chữ ký từ interface (trong tình huống override tương thích). Ví dụ `Parent.code()` trả `P` còn `Code` có default `code()` trả `I`; `Child extends Parent implements Code` dùng `Parent.code()` và in `P`.

