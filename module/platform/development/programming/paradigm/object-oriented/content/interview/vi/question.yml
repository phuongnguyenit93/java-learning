- question: Navigability và dependency trên sơ đồ UML khác nhau về ý nghĩa gì?
  answer: |-
    **Navigability** gắn với association: đứng tại object A có thể **đi theo mối liên hệ** để truy cập object B hay không; có thể biểu diễn bằng mũi tên ở một đầu quan hệ nét liền theo ký pháp/quy ước cụ thể.

    **Dependency** cho biết client A **cần định nghĩa/khả năng** của B để thực hiện việc gì đó, thường biểu diễn bằng đường đứt và mũi tên mở từ client tới supplier. A dùng B làm tham số phương thức tạo dependency ngay cả khi không lưu field để điều hướng sau đó. Không đồng nhất hướng của mũi tên với ownership, vòng đời hoặc việc tạo object.
  aiGenerated: true
  reviewed: false
  readmeRelated:
