- question: Làm sao phân biệt heap memory leak, native memory leak và file descriptor leak khi service Java dùng ngày càng
    nhiều RAM?
  answer: |-
    Nếu heap usage sau GC tăng liên tục, kiểm tra heap dump, object histogram, retaining paths từ GC roots, cache và danh sách giữ reference. Nếu **RSS tăng nhưng heap sau GC tương đối ổn định**, đừng khẳng định có heap leak; cần xem native allocation, direct buffers, metaspace, thread count và tài nguyên hệ điều hành.

    Có thể dùng Native Memory Tracking nếu đã bật, metrics OS cho file descriptor/socket và theo dõi số connection đang mượn từ pool. Một JVM có GC vẫn có thể rò rỉ resource ngoài heap hoặc giữ object không còn giá trị nghiệp vụ. Trước khi tăng heap hay gọi System.gc(), hãy xác định chính xác loại tài nguyên chưa được giải phóng.
