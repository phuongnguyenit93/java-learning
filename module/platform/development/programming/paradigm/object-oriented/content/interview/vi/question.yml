- question: Tại sao tên Manager.process(x, flag) kém hơn các method theo nghiệp vụ, và tên field về tiền hoặc boolean cần
    chú ý gì?
  answer: |-
    Tên tốt thể hiện **vai trò, nghĩa dữ liệu, đơn vị và side effect**. Với nghiệp vụ ghi danh, ClassEnrollment.enrollStudent(id) và cancelEnrollment(id) rõ hơn process(id, true/false). Field remainingSeats và registrationClosed biểu diễn ý nghĩa thay vì n và flag.

    Với tiền, ghi rõ totalCents hoặc totalVnd nếu đó là hợp đồng thật. Với boolean, ưu tiên câu khẳng định như isActive() hoặc hasItems(). Với thao tác, phân biệt findById() (có thể không có kết quả) và requireById() (thiếu dữ liệu có thể ném lỗi) theo contract được chọn.

    Tên chỉ là một phần thiết kế: method findById không nên bí mật xóa dữ liệu; tên phải **trung thực với hành vi**.
