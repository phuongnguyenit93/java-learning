- question: Vì sao Student–Course nhiều–nhiều thường cần lớp Enrollment trung gian thay vì chỉ hai Set?
  answer: |-
    Khi mối liên hệ mang **thông tin riêng** như ngày đăng ký, trạng thái `PENDING/ACTIVE/CANCELLED`, điểm hoặc chính sách học lại, nó nên được mô hình hóa thành một entity `Enrollment(studentId, courseId, status, ...)`. Quan hệ N–N khi ấy trở thành hai liên kết tới Enrollment.

    Phải quyết định uniqueness: chỉ một enrollment đang hoạt động cho mỗi cặp hay có thể có nhiều lần đăng ký trong lịch sử. `Set<Student>`/ `Set<Course>` không chứa đủ thông tin lần ghi danh hoặc quy tắc trạng thái. Entity trung gian giúp gắn validation, audit và hành vi vào đúng nơi.
