- question: Trong composition, trả thẳng mutable List<OrderLine> từ Order hoặc giữ list caller truyền vào gây rủi ro gì?
  answer: |-
    Nếu Order trả danh sách nội bộ mutable, caller có thể xóa/thêm dòng mà không đi qua validation, phá **invariant** về số lượng, đơn giá, tổng tiền hoặc trạng thái. Nếu constructor giữ alias tới mutable List của caller, caller có thể sửa list bên ngoài sau khi Order tạo xong.

    Nên validate input và tạo defensive snapshot, ví dụ List.copyOf(lines) khi phù hợp, chỉ công bố view/snapshot không cho sửa, và để mutation nghiệp vụ đi qua method của Order. Nếu từng OrderLine mutable, danh sách immutable **không tự làm phần tử immutable**: cần bản sao phần tử hoặc value object bất biến.

    Field final chặn gán lại reference chứ không chặn mutation của object được tham chiếu.
