- question: Một class Java không triển khai interface hay kế thừa abstract class có thể thể hiện abstraction không?
  answer: |-
    **Có.** Một `Thermostat` concrete với `increaseTarget()`, `decreaseTarget()` và `currentTarget()` là trừu tượng hợp lệ nếu API công khai đúng những thao tác caller cần, che cách tính và cấu trúc lưu bên trong.

    `interface` và `abstract class` là công cụ **biểu đạt hoặc tái sử dụng hợp đồng**, không phải điều kiện bắt buộc để có abstraction. Chỉ đưa thêm tầng này khi có nhu cầu thật: nhiều implementation, dependency cần thay thế, hoặc quy trình chung cần các điểm mở rộng.
