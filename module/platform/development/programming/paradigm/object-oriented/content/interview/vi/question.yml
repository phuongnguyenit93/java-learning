- question: Làm sao đánh giá một refactor OOP khi xuất hiện yêu cầu mới mà không lấy số lượng class làm thước đo?
  answer: |-
    Kiểm tra **phạm vi ảnh hưởng và hành vi**: thay hạn mức/loanDays chỉ tác động policy, thêm BookKind không buộc Loan tự tra cứu phân loại sách; BorrowingService vẫn điều phối chung. Nếu chỉ thêm vài lớp nhưng mỗi lần sửa policy vẫn phải sửa nhiều switch rải rác, thiết kế chưa thực sự tốt.

    Dùng cùng bộ test hồi quy cho các BR cũ (active, không trùng copy, overdue, ngày trả, returned loan) và thêm test cho CR mới. Quan sát diff: test mới nào cần thiết, hợp đồng nào phải đổi có chủ đích (ví dụ terms() thành termsFor(Member, BookCopy)), coupling nào được giảm và giá phải trả cho abstraction.

    Đưa các giới hạn triển khai ra khỏi mô phỏng: persistence, migration dữ liệu lịch sử, đồng bộ cạnh tranh và audit cần cơ chế rõ ràng khi phát triển thành dịch vụ thật. Thiết kế tốt phải chịu được thay đổi dự báo được với rủi ro hợp lý, không phải càng nhiều lớp càng 'chuẩn OOP'.
