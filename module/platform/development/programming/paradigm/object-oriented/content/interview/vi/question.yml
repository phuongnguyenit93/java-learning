- question: Class-based OOP trong Java khác prototype-based OOP trong JavaScript thế nào?
  answer: |-
    Với Java, class mô tả cấu trúc/hành vi chung và object là instance; class hierarchy tham gia xác định method implementation. Các type/contract cho phép kiểm tra nhiều vấn đề lúc biên dịch.

    Trong JavaScript, object có thể liên kết với một **prototype object**; khi không có property riêng, lookup đi theo prototype chain. Method được tìm ở prototype vẫn có thể được gọi với receiver là object hiện tại.

    Prototype là object được **liên kết**, không mặc nhiên là bản sao. Instance có thể shadow property trên prototype. Cả hai mô hình hỗ trợ cách dùng đa hình, nhưng prototype chain của object không nên đồng nhất hoàn toàn với `extends` giữa các class Java.
