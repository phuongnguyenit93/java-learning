- question: So sánh cách chia bài toán giỏ hàng theo thủ tục với theo OOP.
  answer: |-
    Cách thủ tục có thể truyền một cấu trúc dữ liệu qua `validate(data)`, `calculate(data)`, `checkout(data)`. Nó đơn giản với pipeline nhỏ, ít state và biến đổi thuần.

    Cách OOP đặt `lines`, `status` và luật sửa đơn trong `Order`; application service phối hợp với pricing policy hoặc repository. Rule “không sửa đơn PLACED” có một chủ thể kiểm soát, thay vì mọi procedure tự nhớ check.

    **Cùng yêu cầu có thể cho output giống nhau trong cả hai cách.** So sánh dựa trên số nơi phải sửa khi đổi yêu cầu, độ gắn kết, khả năng test và nguy cơ bypass rule; không nên cho rằng mọi hàm đặt trong class thì mặc định tốt hơn.
