- question: Khi nào Abstract Factory thích hợp hơn Factory Method?
  answer: '**Abstract Factory** tạo **một họ sản phẩm tương thích**, ví dụ LightButton và LightDialog hoặc DarkButton và DarkDialog,
    tránh client trộn hai họ. Factory Method chủ yếu mở việc tạo một sản phẩm qua subclass Creator. Abstract Factory giúp
    thêm một họ mới nhưng thêm một loại product mới vào interface có thể buộc sửa tất cả factory. Nếu chỉ chọn một sản phẩm
    đơn lẻ, factory đơn giản thường đủ.'
