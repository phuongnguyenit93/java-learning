- question: Constructor, method parameter và setter injection nên dùng trong hoàn cảnh nào?
  answer: |-
    **Constructor injection** phù hợp dependency bắt buộc, ổn định trong toàn bộ lifetime của service như OrderRepository. **Method parameter injection** phù hợp collaborator được chọn theo mỗi request như Formatter trong export(report, formatter); thường không cần lưu thành field.

    **Setter injection** phù hợp option có thể cấu hình sau hoặc thay thế lúc chạy, nhưng làm xuất hiện trạng thái chưa cấu hình và rủi ro concurrent reconfiguration. Có tài liệu gọi setter là method injection, nên cần nói rõ đang dùng dạng nào.

    Nếu object không thể hoạt động đúng khi thiếu dependency, ưu tiên fail-fast tại constructor. Nếu một constructor có quá nhiều dependency, xem lại trách nhiệm class thay vì chỉ chuyển tất cả sang setter.
