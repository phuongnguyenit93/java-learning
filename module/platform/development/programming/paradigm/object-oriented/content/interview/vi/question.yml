- question: Tạo Money dưới dạng record Java có tự động ngăn tất cả mutation và sai currency khi cộng hai số tiền không?
  answer: |-
    Record tạo accessor, constructor và equality theo components, nhưng **shallow immutability**: field component final, object mutable nằm bên trong vẫn có thể bị thay đổi. Với Money nên dùng thành phần phù hợp như amount ở minor units cùng currency và validation.

    Hành vi cộng nên kiểm tra currency tương thích, tránh overflow khi dùng long bằng Math.addExact nếu thích hợp; không cộng USD và VND chỉ vì cùng là long. Với collection component, cần defensive copy; List.copyOf chỉ chặn sửa cấu trúc list chứ không deep-copy phần tử mutable.

    Một record có constructor validation và method nghiệp vụ có thể là **rich Value Object**, không phải anemic chỉ vì cú pháp ngắn.
