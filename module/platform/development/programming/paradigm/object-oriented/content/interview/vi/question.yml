    methodSignature: ''
- question: Vì sao UML association vẽ không mũi tên chưa đủ để khẳng định Java object graph chắc chắn là hai chiều?
  answer: |-
    Một association **không có mũi tên navigability tường minh** có thể có ý nghĩa chưa chỉ định khả năng điều hướng tùy ký pháp và quy ước của tài liệu, không mặc nhiên khẳng định cả hai object giữ reference tới nhau.

    Nếu điều hướng có vai trò quan trọng, nên **ghi rõ mũi tên hoặc chú giải** và kiểm tra với mã/nhu cầu nghiệp vụ. Cũng không thể từ một field `Order.customer` suy ra `Customer.orders` đã tồn tại. Tránh thiết kế thêm hai chiều chỉ vì nhìn một đường liên kết chung trên sơ đồ.
