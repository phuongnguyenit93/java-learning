- question: Đổi tên public API createOrder thành placeOrder có thể làm hỏng những nơi nào ngoài compile-time caller?
  answer: |-
    Đổi tên public method có thể ảnh hưởng **source/binary compatibility**, method reference, reflection, JSON/ORM mapping, Spring bean names, script, serialization protocol, documentation và log parsing. IDE Rename Symbol không tìm hết các chỗ dùng tên bằng chuỗi.

    Trước khi đổi, xác định method cũ thực sự chỉ tạo object hay hoàn tất use case lưu đơn; tên mới phải phù hợp semantics. Nếu có external consumers, có thể giữ wrapper cũ đánh dấu Deprecated trong thời gian migration rồi mới xóa ở phiên bản thích hợp.

    Record accessor mặc định là customerId(), còn JavaBeans convention thường dùng getCustomerId(); framework có thể cần hỗ trợ/annotation tương ứng. Chạy cả integration/contract tests, không chỉ build source.
