- question: Tại sao BankAccount.transferTo cần kiểm tra overflow ở đích trước khi trừ nguồn?
  answer: |-
    Trước tiên kiểm tra destination khác null, không phải cùng tài khoản theo hợp đồng identity, amount dương và source có đủ balance. Tính `nextTarget = Math.addExact(destination.balanceVnd, amount)` trước, vì overflow ở đích phải ném lỗi **khi source vẫn chưa bị đổi**.

    Sau khi mọi kiểm tra qua mới trừ source rồi gán destination bằng nextTarget. Method trong `BankAccount` có thể đọc private field của instance BankAccount khác, vì private theo class. Thứ tự kiểm tra giảm nguy cơ cập nhật nửa chừng do overflow trong kịch bản đơn luồng, nhưng không thay transaction đồng thời.
