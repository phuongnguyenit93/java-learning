- question: Vì sao hai setter setCapacity/setReserved có thể phá invariant dù từng setter tự kiểm tra input?
  answer: |-
    Hai trường có **ràng buộc liên quan**: một capacity hợp lệ riêng lẻ vẫn có thể nhỏ hơn reserved hiện tại. Các setter cũng có thể để lộ trạng thái trung gian sai cho thread khác.

    Đưa chuyển trạng thái về method nghiệp vụ như `resizeCapacity(next)` kiểm tra `next >= reserved`, và `reserve`/ `cancel`. Nếu thao tác nhiều field cần đồng thời, kiểm tra–ghi phải được bảo vệ bằng cùng đơn vị nhất quán.
