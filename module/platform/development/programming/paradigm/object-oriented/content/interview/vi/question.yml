- question: Trong Java, cast và instanceof bảo đảm gì ở runtime? Vì sao cast List<?> sang List<String> không xác thực toàn
    bộ phần tử?
  answer: |-
    Java compiler cho phép downcast khi có quan hệ chuyển đổi kiểu có thể xảy ra; JVM kiểm tra runtime object khi cast sang class/interface reifiable. Nếu Animal reference đang trỏ Dog, cast sang Dog thành công; nếu trỏ Cat không liên quan Dog, **ClassCastException**.

    ~~~java
    if (animal instanceof Dog dog) {
        dog.bark();
    }
    ~~~

    Pattern matching chỉ chạy nhánh khi object thật tương thích Dog. Null instanceof Dog là false.

    Với parameterized types, runtime không biết toàn bộ type arguments do **erasure**. Cast từ một List<?> sang List<String> là unchecked; cast không duyệt tất cả phần tử để kiểm tra chúng có phải String. Nếu chứa Integer, việc đọc dưới dạng String có thể gây ClassCastException về sau. Giữ cảnh báo unchecked như tín hiệu an toàn quan trọng.
