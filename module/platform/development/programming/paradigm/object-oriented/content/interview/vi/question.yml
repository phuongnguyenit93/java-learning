- question: Factory Method và Simple Factory khác nhau thế nào?
  answer: Theo GoF, **Factory Method** cho một Creator định nghĩa điểm tạo Product rồi Creator subclass quyết định ConcreteProduct.
    **Simple Factory** thường chỉ có một hàm chọn class qua if/switch mà không cần hierarchy Creator. Static factory như Product.of()
    là phương thức khởi tạo có tên, không mặc nhiên là Factory Method của GoF. Chọn mô hình theo nơi thực sự cần mở rộng cách
    khởi tạo.
