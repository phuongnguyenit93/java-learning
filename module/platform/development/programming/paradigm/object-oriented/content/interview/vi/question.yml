- question: Law of Demeter/Tell, Don't Ask gợi ý sửa chuỗi loan.getMember().getPlan().getDailyFee() như thế nào?
  answer: |-
    Chuỗi tham chiếu sâu khiến caller biết cả cấu trúc Loan → Member → Plan và tự tính công thức phí. Khi thay model hoặc policy, nhiều call site bị ảnh hưởng.

    Có thể cho Loan công bố capability calculateLateFeeCents(days) nếu quy tắc thuộc Loan, hoặc đưa snapshot qua một LateFeePolicy nếu đây là chính sách độc lập. Caller **yêu cầu hành vi có nghĩa** thay vì điều hướng qua nội bộ của nhiều object.

    Law of Demeter không phải thuật toán đếm dấu chấm: fluent builder, stream và DTO công bố cấu trúc dữ liệu có thể hợp lý. Không cấm getter; mục tiêu là giảm phụ thuộc vào nội tạng của object khác.
