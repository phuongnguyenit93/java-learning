    Mỗi reference chỉ nhìn thấy những thao tác được kiểu khai báo cho phép. Nếu print() cập nhật printedPages và status() truy vấn field đó trên cùng instance, kết quả status đọc lại sẽ phản ánh cập nhật (theo luồng thực thi đơn luồng). Trong chương trình nhiều thread, chia sẻ mutable state còn đòi cơ chế đồng bộ/visibility phù hợp.
