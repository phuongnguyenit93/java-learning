- question: Bạn chọn IllegalArgumentException, IllegalStateException hay kết quả nghiệp vụ khi thao tác bị từ chối như thế
    nào?
  answer: |-
    `IllegalArgumentException` thường phù hợp với dữ liệu gọi không đúng hợp đồng (quantity âm, định dạng ID sai). `IllegalStateException` có thể mô tả thao tác không cho phép ở state hiện tại (ví dụ ship trước pay).

    Một tình huống **dự kiến trong nghiệp vụ**, chẳng hạn `withdraw(amount)` không đủ tiền, có thể trả `false` hoặc result `INSUFFICIENT_FUNDS` thay vì exception, miễn nhất quán và ghi rõ API. Dù chọn cách nào, khi thất bại cần giữ invariant và không vô tình thực hiện một phần side effect. Đừng đồng nhất mọi ngoại lệ domain với HTTP status trong tầng model.
