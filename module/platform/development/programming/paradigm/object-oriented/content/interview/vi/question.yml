- question: Action action = new Job() cho phép gọi method nào và JVM chọn implementation bằng cách nào?
  answer: |-
    **Kiểu biến khai báo Action** quyết định những phương thức compiler cho gọi, còn **kiểu instance Job tại runtime** quyết định implementation của các instance method được override.

    ~~~java
    interface Action { void run(); }
    class Job implements Action {
        public void run() { System.out.println("run"); }
        public void reset() { System.out.println("reset"); }
    }
    Action action = new Job();
    action.run(); // in run
    // action.reset(); // Lỗi: Action không có reset().
    ~~~

    Object vẫn là Job. Nếu client cần reset, nên phụ thuộc thêm capability thích hợp. Ép kiểu xuống Job có thể thất bại khi đổi sang implementation khác và khiến code phụ thuộc chi tiết.
