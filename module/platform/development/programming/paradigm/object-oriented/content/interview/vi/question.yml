- question: Refactor OrderService extends OrderStore sang composition cần làm gì ngoài bỏ extends và thêm field repository?
  answer: |-
    Bắt đầu bằng kiểm kê các call site đang coi OrderService là OrderStore, inherited public API, protected hooks, super.method(), constructor, state và transaction. **Ghi lại hợp đồng quan sát được** bằng test trước refactor.

    Tiếp theo tách collaborator có trách nhiệm thực như OrderRepository; cấp qua constructor; chuyển các lời gọi lưu/truy xuất thành delegation; chỉ công bố các method thuộc nghiệp vụ service. Di chuyển caller đang dựa trên subtype và gỡ extends sau khi đã xử lý compatibility.

    Cuối cùng chạy unit, contract và integration tests cho validation, result, failure, transaction, concurrency và lifecycle. Bỏ extends là thay đổi quan hệ kiểu: source/binary compatibility **có thể bị phá** dù các method thường chạy giống trước.
