- question: So sánh List.copyOf(input), Collections.unmodifiableList(input) và new ArrayList<>(input) khi thiết kế API đọc
    trạng thái.
  answer: |-
    **List.copyOf(input)** trả danh sách không cho sửa và tách khỏi các thay đổi cấu trúc tiếp theo của input (có thể tái sử dụng container phù hợp). **Collections.unmodifiableList(input)** là view không sửa được qua view; nếu nơi khác sửa input, view có thể thấy thay đổi. **new ArrayList<>(input)** tạo container mutable riêng.

    Cả ba đều **không tự động deep copy các object phần tử**. Khi cần snapshot bất biến, hãy xem từng phần tử có mutable không và xác định ownership trước khi chọn. Không chỉ nhìn thấy một getter trả kiểu List là đủ để kết luận caller không thay đổi được trạng thái nội bộ.
