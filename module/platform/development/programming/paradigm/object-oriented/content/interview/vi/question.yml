- question: PaymentMethod.pay() nên trả boolean hay kết quả có trạng thái? Tại sao PENDING không thể coi là PAID?
  answer: |-
    Boolean không đủ diễn đạt đầy đủ quy trình. Một `PaymentResult` có thể chứa `status` gồm `PAID`, `DECLINED`, `PENDING`, cùng orderId, reference, thông điệp cần thiết cho đối soát. Card có thể được thanh toán hoặc từ chối ngay; chuyển khoản có thể chờ xác nhận từ hệ thống ngoài.

    `PENDING` nghĩa là **chưa có bằng chứng hoàn tất**, nên không giao hàng/ghi doanh thu như `PAID` chỉ vì API trả kết quả. Cần webhook, truy vấn trạng thái hoặc đối soát đáng tin cậy trước khi chốt. Đây là hợp đồng nghiệp vụ, không phải tính năng đa hình tự cung cấp.
