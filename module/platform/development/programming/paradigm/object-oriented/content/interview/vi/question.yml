- question: Generics giải quyết vấn đề gì so với raw type, và vì sao List<String> vẫn có thể gặp ClassCastException do dữ
    liệu bẩn?
  answer: |-
    **Generics** đưa quan hệ kiểu vào API để compiler kiểm tra khi biên dịch, giảm ép kiểu thủ công. Với List<String>, add(42) không hợp lệ trong mã được kiểm tra đúng kiểu. Raw List bỏ qua type argument nên có thể trộn String và Integer.

    ~~~java
    java.util.List raw = new java.util.ArrayList();
    raw.add(42);
    java.util.List<String> names = raw; // Unchecked conversion warning.
    String first = names.get(0);        // ClassCastException tại runtime.
    ~~~

    **Type erasure** làm type argument không được giữ đầy đủ để JVM luôn xác minh mọi phần tử tại lúc gán. Vì vậy raw/unchecked API, reflection hoặc heap pollution có thể làm lọt dữ liệu sai rồi nổ khi compiler-inserted cast chạy.

    Giải pháp: tránh raw types, không che unchecked warning, kiểm tra dữ liệu ở ranh giới không tin cậy và viết contract tests cho cấu trúc generic.
  aiGenerated: true
  reviewed: false
