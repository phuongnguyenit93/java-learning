- question: Field và method trong class có trách nhiệm gì? Vì sao InventoryItem không nên public quantity?
  answer: |-
    Field lưu trạng thái, method mô tả hành vi hoặc truy vấn trên trạng thái. Nếu `quantity` public, bất kỳ caller nào cũng có thể gán âm, bán quá tồn hoặc bỏ qua quy tắc nhập hàng.

    Một `InventoryItem` nên giữ `quantity` private và cung cấp `restock(units)`, `sell(units)` có tiền điều kiện rõ: units dương, không bán vượt số đang có và không để phép cộng tràn. **Encapsulation** là bảo vệ invariant bằng hành vi, không đơn thuần đổi field thành private rồi tạo mọi setter.
