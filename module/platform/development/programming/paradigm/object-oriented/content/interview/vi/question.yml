- question: Một thao tác cập nhật giỏ hàng gồm tạo CartLine, tính tổng mới và thay thế Map entry. Thứ tự thực hiện nào giúp
    tránh cập nhật nửa chừng?
  answer: |-
    Hãy **tính và kiểm tra trước khi ghi**:

    1. Chuẩn hóa SKU và xác nhận dòng hiện tại tồn tại.
    2. Tạo `CartLine` mới; constructor từ chối quantity không dương và đơn giá âm.
    3. Dùng `Math.multiplyExact`, `Math.subtractExact`, `Math.addExact` để xác minh thành tiền/tổng mới không tràn.
    4. Chỉ khi tất cả thành công mới thay entry trong `Map`.

    Vì kiểm tra có thể ném exception đều ở trước bước commit, các lỗi validation/số học thông thường không làm giỏ đổi dở. Đây là bảo đảm trong ví dụ **đơn luồng**; nếu nhiều thread cùng sửa thì chuỗi đọc–kiểm tra–ghi vẫn cần đồng bộ.
