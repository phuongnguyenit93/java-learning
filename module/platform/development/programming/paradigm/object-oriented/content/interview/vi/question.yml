    Không mặc nhiên coi mọi output cũ là yêu cầu đúng: đối chiếu với business rule khi phát hiện lỗi, ghi bug riêng. Dùng fake adapter để bảo vệ hợp đồng phụ thuộc; chạy test ổn định rồi mới đổi cấu trúc.
