- question: 'Vehicle v = new Car(): v có thể gọi method nào và phương thức override được chọn theo kiểu nào?'
  answer: |-
    Compiler quyết định **method nào được phép gọi** từ kiểu khai báo `Vehicle`. Do đó `v.start()` hợp lệ nếu Vehicle có method này, nhưng `v.openTrunk()` không biên dịch nếu method chỉ có trong Car.

    Khi gọi một **instance method có thể override**, Java dispatch tới implementation theo class runtime của object, tức Car nếu Car override. Upcasting không thay object. Chỉ downcast khi thật sự cần capability riêng và đã kiểm tra loại thực tế; nên ưu tiên API chung để tránh nhiều `instanceof`/cast.
