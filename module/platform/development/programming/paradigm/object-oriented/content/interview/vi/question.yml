- question: Vì sao có thể nói domain object có toàn getter/setter là anemic model? Khi nào data carrier đơn giản vẫn phù hợp?
  answer: |-
    Anemic model là khi object chỉ chứa dữ liệu và mọi quy tắc nghiệp vụ bị dàn ra service/caller: mã ngoài tự `if (order.getStatus()==NEW) order.setStatus(PAID)`. Dễ quên validation và tạo nhiều đường cập nhật.

    Với **domain entity**, các hành vi `order.pay()`, `order.ship()` thường thích hợp vì chính entity sở hữu trạng thái và quy tắc chuyển đổi. Tuy vậy, DTO, API request, projection hoặc value đơn giản có thể chỉ cần dữ liệu mà không thành vấn đề. Không biến mọi class thành “rich model” cho có; đặt logic ở nơi thực sự chịu trách nhiệm.
