- question: Dependency Inversion Principle, Dependency Injection và Inversion of Control khác nhau ở câu hỏi mà chúng giải
    quyết như thế nào?
  answer: |-
    **DIP** là nguyên lý về **hướng phụ thuộc mã nguồn và hợp đồng**: chính sách không gắn cứng với chi tiết. **Dependency Injection (DI)** là kỹ thuật **cung cấp collaborator từ bên ngoài** qua constructor, setter hoặc method. **Inversion of Control (IoC)** là ý tưởng rộng hơn về việc chuyển quyền quyết định lắp ghép/điều khiển cho thành phần hoặc framework khác.

    Có thể thực hiện DIP và DI bằng Java thuần mà không dùng Spring: main tạo concrete gateway, gán cho biến theo PaymentGateway rồi truyền vào CheckoutService constructor. Main là **composition root**.

    DI **không tự đồng nghĩa** với DIP: CheckoutService nhận thẳng JdbcPurchaseReader trong constructor vẫn là DI nhưng source core vẫn biết concrete infrastructure.
