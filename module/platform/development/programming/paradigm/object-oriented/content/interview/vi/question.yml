- question: Object.toString() mặc định tạo chuỗi gì? Có phải hex đằng sau dấu @ luôn là địa chỉ vùng nhớ?
  answer: |-
    Object.toString() thông thường tạo **tên class + @ + hashCode biểu diễn hex** (giá trị từ hashCode tại thời điểm gọi). Nó **không cam kết** phần hex là địa chỉ memory, cũng không phải định danh toàn hệ thống hay bảo đảm không trùng.

    Override toString để hiển thị thông tin chẩn đoán ngắn, ổn định trong phạm vi hữu ích: mã đối tượng, trạng thái quan trọng, số mục. Khi println(object) hoặc nối chuỗi với object, Java sử dụng biểu diễn chuỗi thích hợp; object null thường được biểu diễn bằng chuỗi "null" trong String.valueOf.

    toString không nên là format JSON/API/serialization được client parse như hợp đồng chính thức. Dùng DTO, serializer hoặc structured logging riêng khi cần format ổn định.
