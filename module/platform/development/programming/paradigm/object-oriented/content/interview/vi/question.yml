- question: Có nên dùng Strategy nếu mới có ba nhánh tính phí cố định?
  answer: Chưa chắc. Một switch ngắn, exhaustive và dễ test có thể tốt hơn nhiều Strategy, registry và factory. Strategy đáng
    giá khi các biến thể đổi độc lập, xuất hiện tại nhiều nơi hoặc cần thay runtime. Hãy đo số chỗ sửa khi thêm biến thể và
    test cost, không chỉ đếm số if. Có thể refactor sau khi trục thay đổi thật xuất hiện và bộ test hiện tại đủ mạnh.
