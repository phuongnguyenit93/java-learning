- question: Khi nào nên ưu tiên OOP, và khi nào dùng hàm thuần hoặc pipeline sẽ rõ hơn?
  answer: |-
    OOP phù hợp khi hệ thống có **vòng đời state**, invariant nghiệp vụ, nhiều object phối hợp và nhiều biến thể đáp ứng một hợp đồng ổn định — ví dụ đơn hàng DRAFT/PLACED/CANCELLED.

    Một phép chuẩn hóa dữ liệu, lọc danh sách, tính toán thuần hay ETL ngắn thường rõ hơn dưới dạng hàm độc lập và collection pipeline. Java hoàn toàn có thể phối hợp hai cách: entity có state, pure function cho transformation.

    Hãy chọn theo **độ rõ ràng, khả năng kiểm thử và chi phí đổi yêu cầu**. Không phải mọi danh từ cần class, không phải mọi action cần interface. Nếu OOP làm tăng lớp trung gian mà không bảo vệ thêm rule hay boundary, nó có thể phản tác dụng.
