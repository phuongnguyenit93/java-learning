- question: Vì sao matrix.clone() chưa sao chép sâu int[][]? Với object graph có vòng tham chiếu, deep copy cần lưu ý gì?
  answer: |-
    int[][] là **mảng chứa tham chiếu đến các hàng int[]**. matrix.clone() chỉ tạo mảng ngoài; các hàng vẫn được chia sẻ, vì thế copy[0][0] = 99 có thể thay đổi matrix[0][0]. Cần clone từng hàng để tách các số nguyên bên trong.

    Với graph A → B → A, đệ quy copy ngây thơ có thể lặp vô hạn hoặc tạo thừa object, làm mất aliasing cần giữ. Một kỹ thuật là giữ **IdentityHashMap<Original, Copy>**, ghi bản copy ngay khi tạo rồi dùng lại nếu gặp original cũ. Định nghĩa ranh giới copy theo domain, đặc biệt với tài nguyên, cache hoặc đối tượng chia sẻ có chủ đích.
