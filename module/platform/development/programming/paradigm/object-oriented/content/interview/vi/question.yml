- question: Sơ đồ trạng thái thể hiện khác gì với class diagram và sequence diagram cho một Order?
  answer: |-
    Class diagram mô tả Order có những field/method nào và quan hệ với OrderLine/Payment; sequence diagram mô tả **một luồng thông điệp** qua các object; state machine mô tả **vòng đời một Order** và những hành động được phép ở từng trạng thái.

    Một state machine có **state**, **event/trigger**, **guard**, **transition** và **effect**. Ví dụ `PAID --SHIP [trackingCode hợp lệ] / saveTracking--> SHIPPED`. Guard phải được kiểm tra trước khi effect; quyền người gọi là một yếu tố riêng ở application/security boundary. Không thay các luật đó bằng setter status tự do.
