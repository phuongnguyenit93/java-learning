- question: Tại sao kiểm thử giá trị biên và tổ hợp điều kiện quan trọng hơn chỉ chạy happy path cho domain object?
  answer: |-
    Rất nhiều bug xuất hiện tại **ngưỡng**: số lượng bằng 0, bằng sức chứa, vượt sức chứa đúng một đơn vị; tiền gần Long.MAX_VALUE; discount bằng subtotal; trạng thái chỉ vừa CLOSED.

    Bảng test nên ghi **input, state trước, kết quả/exception, state sau**. Kết hợp các trạng thái có ý nghĩa thay vì thử vô hạn mọi tổ hợp: ví OPEN với balance=0, balance>0, CLOSED với balance>0; rút âm; overflow deposit.

    Property-based tests có thể tạo nhiều mẫu theo quy luật, ví dụ balance luôn không âm và tổng nạp–rút hợp lệ được bảo toàn; seed giúp tái hiện. Test case biên cần kỳ vọng dựa vào **đặc tả** thay vì sao chép phép tính đang kiểm thử.
