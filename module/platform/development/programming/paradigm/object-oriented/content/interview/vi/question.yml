- question: Khi chuyển cây subclass tính phí vận chuyển sang composition, cần làm gì để không đổi hành vi?
  answer: |-
    Bước đầu tiên là ghi lại **hợp đồng quan sát được** của mỗi biến thể: input, đơn vị, làm tròn, kết quả, exception và side effect. Dùng test bảo vệ cả trường hợp biên rồi tách những chiều thay đổi độc lập thành các strategy/decorator hoặc object phối hợp.

    Giữ một API chung, ví dụ `quoteVnd(input)`, và so sánh kết quả trước/sau cho từng tình huống. Composition không tự bảo đảm đúng: thứ tự áp phụ phí/giảm giá, overflow và đồng thời vẫn phải được định nghĩa. Đừng thay cây kế thừa nông hợp lý bằng quá nhiều abstraction chỉ để tránh extends.
