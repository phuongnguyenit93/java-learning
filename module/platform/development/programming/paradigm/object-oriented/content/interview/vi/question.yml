- question: Điểm khác giữa interface Java với TypeScript/Kotlin khiến ta không thể chuyển thẳng design theo cú pháp là gì?
  answer: |-
    Java interface có những method abstract/default/static/private theo phiên bản, field là public static final và **không có constructor, instance fields**. TypeScript interface chủ yếu mô tả kiểu trong quá trình type-checking, bị xóa khi biên dịch sang JavaScript, không chứa default behavior tại runtime. Kotlin interface có thể có method body và property accessor nhưng không có backing field kiểu instance của interface.

    Khi mô tả kiến trúc đa ngôn ngữ, trước tiên định nghĩa **hợp đồng nghiệp vụ**, sau đó ánh xạ sang ngôn ngữ đích và kiểm tra quy tắc runtime/default conflict/type compatibility cụ thể. Không sao chép giới hạn của Java như một quy luật chung cho mọi interface.
