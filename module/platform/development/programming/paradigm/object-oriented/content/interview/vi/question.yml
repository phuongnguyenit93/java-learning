- question: Từ yêu cầu mượn sách, bạn nhận diện đối tượng và giao trách nhiệm bằng cách nào?
  answer: |-
    Đừng máy móc biến mọi danh từ thành class. Hãy bắt đầu từ use case, **danh tính và vòng đời**, quy tắc nào cần được giữ, và object nào có đủ dữ liệu để ra quyết định.

    Trong thư viện, `BookTitle` là đầu sách, `BookCopy` là bản vật lý; `Loan` đại diện một lần mượn; `Member` có trạng thái thành viên. Đối tượng điều phối kết hợp chúng để kiểm tra điều kiện trước khi ghi nhận giao dịch.

    Hãy thử thay đổi yêu cầu “mỗi thành viên được mượn tối đa ba bản”: nếu phải sửa ở nhiều controller hoặc thao tác được bằng setter trực tiếp, boundary trách nhiệm đang có vấn đề. Object không nhất thiết mô phỏng y nguyên mọi vật ngoài đời; nó phục vụ quy tắc phần mềm.
