- question: Constructor nên làm gì để ngăn object bắt đầu ở trạng thái không hợp lệ?
  answer: |-
    Constructor là nơi thiết lập state và kiểm tra các invariant ban đầu: tên workshop không rỗng, capacity dương, số đăng ký không vượt capacity. Constructor **cùng tên lớp, không có kiểu trả về**, kể cả void.

    Khi tham số không hợp lệ, hãy ném `IllegalArgumentException` trước khi khởi tạo thành công; tránh tạo object hỏng rồi đợi caller sửa. Cũng không nên để `this` thoát ra listener hoặc thread khác trước khi constructor hoàn tất. Một object đã tạo thành công phải có thể sử dụng theo hợp đồng của lớp.
