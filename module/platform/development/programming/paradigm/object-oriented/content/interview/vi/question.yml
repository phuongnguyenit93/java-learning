- question: Khi refactor CheckoutManager, cách nào chứng minh giữ đúng hành vi và khi nào phải ghi nhận thay đổi hợp đồng?
  answer: |-
    Trước khi thay cấu trúc, viết characterization/acceptance tests cho đơn thường/VIP, cổng thanh toán chấp nhận/từ chối và số tiền ghi ledger. Di chuyển trách nhiệm từng bước; inject fake gateway và fake ledger để kiểm tra lời gọi lẫn side effect.

    Chuyển phép tính từ CheckoutManager sang Order có thể là refactor nếu kết quả và hành vi quan sát được vẫn giữ. Nhưng đổi giảm giá từ 10% sang 15%, thay public API, siết validation hay thay phép toán thường bằng Math.addExact khi overflow **có thể làm thay đổi hành vi**; phải công bố và kiểm thử theo hợp đồng mới.

    Test không chỉ assert giá trị trả về: phải xác minh số lần gọi gateway/ledger, dữ liệu truyền đi, và không sinh tác dụng phụ trong nhánh lỗi. Refactor được đánh giá theo bằng chứng, không dựa vào số lớp tăng hay giảm.
