- question: Vì sao không start thread từ constructor dù field final? Safe publication có giải quyết được mọi vấn đề không?
  answer: |-
    Nếu constructor start thread dùng this, thread mới có thể chạy lúc instance chưa khởi tạo xong; field chưa được gán có thể mang default value. **final fields** có quy tắc visibility hữu ích khi object được xây dựng đúng, nhưng không biến this escape thành an toàn và không tự khiến tất cả mutation thread-safe.

    Tạo xong object mới start/register; khi chuyển object sang thread khác phải có **happens-before/safe publication** phù hợp (ví dụ qua lock, volatile reference hay concurrent collection có hợp đồng tương ứng). Safe publication xử lý khả năng các thread thấy **trạng thái đã khởi tạo**, còn việc một callback sử dụng object quá sớm là lỗi vòng đời riêng. Các mutation sau khởi tạo vẫn cần thiết kế đồng bộ.
