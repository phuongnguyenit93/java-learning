- question: DIP nói gì về hướng phụ thuộc khi CustomerSpendingService cần đọc Purchase từ JDBC?
  answer: |-
    **Dependency Inversion Principle (DIP)** yêu cầu policy cấp cao và chi tiết cấp thấp cùng phụ thuộc một **abstraction phù hợp với nhu cầu nghiệp vụ**, thay vì business trực tiếp phụ thuộc JDBC. Service tính tổng mua hàng chưa hoàn có thể nhận PurchaseReader.findByCustomer(customerId), cùng dữ liệu Purchase thuộc domain/application.

    JdbcPurchaseReader implements PurchaseReader và tự xử lý SQL/driver/schema; InMemoryPurchaseReader đáp ứng cùng contract khi test. **Mã nguồn** của core không import adapter, còn bootstrap/composition root được quyền biết cả hai để lắp ghép.

    Ở **runtime**, service vẫn gọi vào JDBC qua interface. Luồng thực thi đi từ high-level sang adapter không mâu thuẫn với hướng phụ thuộc **ở source/module**. Hãy kiểm tra cả sơ đồ Gradle/Maven dependencies, không chỉ khai báo type trong một class.
