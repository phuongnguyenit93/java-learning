- question: Bạn sẽ đánh giá Strategy cho hệ thống checkout như thế nào?
  answer: Nếu chính sách giảm giá thực sự thay đổi độc lập theo kênh hay tenant, **Strategy** tách DiscountPolicy khỏi checkout
    và cho test từng thuật toán. Nếu chỉ vài nhánh cố định, switch có thể đơn giản hơn. Chọn implementation từ registry/allowlist,
    không để dữ liệu client quyết định tên class qua reflection. Đo số nơi phải sửa, coupling, lỗi cấu hình và chi phí wiring
    trước khi chọn.
