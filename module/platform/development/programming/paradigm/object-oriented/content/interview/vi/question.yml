- question: Vì sao equals() dùng instanceof theo kế thừa có thể phá tính đối xứng? Có cách nào thiết kế tốt hơn?
  answer: |-
    Giả sử Point.equals cho phép bất cứ instanceof Point có cùng x,y; subclass ColoredPoint thêm color vào equality. Point có thể coi ColoredPoint bằng nó, trong khi ColoredPoint từ chối Point ⇒ **mất đối xứng**.

    Cách xử lý tùy domain: dùng **final value object** để không có subclass thay semantics equality, hoặc thiết kế một chiến lược equality thống nhất cho toàn bộ hierarchy. Một số thiết kế chọn kiểm tra class chính xác, nhưng điều này không luôn phù hợp entity ORM có proxy/subclass; không áp máy móc getClass() cho mọi entity.

    Viết test đối xứng, bắc cầu qua cả base/subclass, và bảo đảm hashCode dựa cùng semantics. Đừng hy sinh hợp đồng equality chỉ để hỗ trợ kế thừa dữ liệu tiện tay.
