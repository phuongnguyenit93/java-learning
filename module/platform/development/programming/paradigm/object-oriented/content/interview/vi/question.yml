- question: Khi nào áp dụng SOLID quá mức sẽ tạo “architecture astronaut” với nhiều lớp mà không tạo giá trị?
  answer: |-
    Ví dụ chỉ có một cách xuất CSV cố định nhưng tạo WriterFactory, WriterProvider, WriterStrategy, PluginRegistry và hàng loạt wrapper mỗi lớp một method để “dự phòng” các định dạng chưa từng được yêu cầu. Luồng chạy dài hơn, DI phức tạp hơn, trong khi thêm một yêu cầu thật vẫn phải sửa nhiều nơi.

    Phân biệt **phức tạp vốn có của nghiệp vụ** (quy tắc phí, hoàn tiền), **phức tạp do triển khai** (quy tắc sao chép ở nhiều tầng) và **phức tạp dự phòng tương lai** (plugin chưa dùng). Dùng KISS/YAGNI để trì hoãn những abstraction có thể bổ sung an toàn sau.

    Tuy vậy ranh giới thanh toán, quyền truy cập hoặc tích hợp ngoài nhiều rủi ro có thể đáng tách **ngay cả khi mới một implementation**. Không có số lượng implementation cố định làm ngưỡng tuyệt đối.
  aiGenerated: true
