- question: Contract test chung khác gì với unit test của từng implementation và unit test của client?
  answer: |-
    **Contract test** chạy cùng bộ điều kiện trên mọi implementation: cùng input hợp lệ, output hợp lệ, lỗi và side effect theo hợp đồng. Nó phát hiện một policy siết tiền điều kiện hoặc một inventory trả `true` nhưng không trừ ghế.

    **Unit test riêng** kiểm tra logic đặc thù của implementation (ví dụ cách làm tròn của phí EXPRESS). **Client test** dùng fake/mock implementation để xác minh client chỉ dựa vào hợp đồng và tương tác đúng. Cả ba bổ sung nhau; nếu liên quan database/mạng thì còn cần integration test cho các bảo đảm thực tế.
