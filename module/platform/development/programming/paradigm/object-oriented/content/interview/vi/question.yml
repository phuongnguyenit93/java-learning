- question: try-with-resources bảo đảm gì khi body ném exception và close cũng ném exception? Thứ tự đóng nhiều resource là
    gì?
  answer: |-
    **try-with-resources** tự gọi close khi rời scope đối với resource đã được khởi tạo thành công trong khai báo resource; nếu khai báo nhiều resource thì **đóng theo thứ tự ngược**.

    Khi thân try ném một exception và close cũng ném, exception của thân try thường giữ vai trò **primary**, còn exception của close nằm trong **suppressed exceptions** (truy xuất qua getSuppressed()). Điều này giúp không che khuất lỗi gốc.

    ~~~java
    try (var in = java.nio.file.Files.newInputStream(path)) {
        // Đọc dữ liệu, có thể phát sinh IOException.
    }
    // in đã được đóng khi rời khối.
    ~~~

    Đoạn minh họa giả định biến path là Path hợp lệ trong scope. Nếu trả một resource cho caller tiếp tục dùng, phải bàn giao ownership rõ ràng; đừng đóng trong scope trước khi caller kịp dùng.
