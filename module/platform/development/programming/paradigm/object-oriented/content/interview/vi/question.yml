- question: Khi chính sách thư viện đổi từ 3 lên 5 loan và sách REFERENCE chỉ được mượn 7 ngày, thiết kế nào hạn chế sửa lan
    truyền?
  answer: |-
    Đưa quy tắc biến đổi vào BorrowingPolicy với hợp đồng như termsFor(Member, BookCopy) trả LoanTerms(maxActive, loanDays). LegacyPolicy xử lý hạn mức 3 và thời hạn 14; RevisedPolicy xử lý hạn mức 5, NORMAL 14 ngày, REFERENCE 7 ngày. BorrowingService nhận policy qua composition và vẫn đảm bảo member active, quá hạn, một copy một loan mở.

    Thay policy chỉ áp dụng khi **tạo Loan mới**: tính dueOn = borrowedOn.plusDays(loanDays) và lưu ngày này trong Loan. Không tính lại dueOn mỗi lần hiển thị, nên lịch sử cũ giữ hạn trả đã cam kết. Cần làm rõ ngày hiệu lực, dữ liệu BookKind cũ và ngoại lệ sách tham khảo với stakeholder.

    Ma trận test nên có NORMAL/REFERENCE dưới policy mới, loan cũ không đổi hạn, từ chối loan thứ sáu, chặn thành viên khóa/quá hạn và chống trả hai lần.
