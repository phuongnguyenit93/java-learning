    Các implementation có thể trả phí **khác nhau có chủ đích**; thay thế an toàn nghĩa là cùng tuân thủ contract, không đòi ra cùng con số. Test chung nên bao quát giá trị âm, đơn vị, input sai và kết quả hợp lệ.
