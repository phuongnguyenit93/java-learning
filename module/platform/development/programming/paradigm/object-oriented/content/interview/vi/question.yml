- question: Encapsulation, abstraction, inheritance và polymorphism có cùng mục tiêu không?
  answer: |-
    Không; bốn khái niệm giải quyết những câu hỏi khác nhau:

    - **Encapsulation:** ai được sửa state và bảo vệ invariant?
    - **Abstraction:** caller cần biết hợp đồng gì, chi tiết nào có thể giấu?
    - **Inheritance:** subtype có thực sự thay thế superclass một cách hợp lệ?
    - **Polymorphism:** một lời gọi qua kiểu chung chọn cách thực thi nào tại runtime?

    Ví dụ `PaymentMethod` là abstraction, `CardPayment` và `WalletPayment` có thể thực hiện interface và được gọi đa hình; **không cần** cùng kế thừa một concrete superclass. Một `Order` tự kiểm tra việc `place()` lại là encapsulation.

    Đừng coi bốn tính chất là checklist bắt buộc mọi dự án phải dùng đầy đủ inheritance.
