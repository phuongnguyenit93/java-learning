    Ví dụ `Derived extends Base` ở package khác có thể truy cập `this.status` hoặc `super.status` (nếu protected), nhưng không thể tự ý truy cập `new Base().status`; với instance field/method được bảo vệ, receiver trong ngữ cảnh đó cần thuộc kiểu Derived hoặc subtype thích hợp. Đừng xem protected như public dành cho mọi Base instance.
