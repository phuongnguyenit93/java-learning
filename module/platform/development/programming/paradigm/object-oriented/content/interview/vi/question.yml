- question: Interface khác một class cụ thể như thế nào? Vì sao nói interface là hợp đồng hành vi chứ không chỉ danh sách
    method?
  answer: |-
    Interface quy định **vai trò/capability** để client gọi các thao tác qua một kiểu trừu tượng; class cung cấp cách thực hiện và có thể giữ state. Ví dụ DeliveryChannel.deliver(Notice) cho phép EmailChannel và SmsChannel phục vụ cùng client.

    Compiler kiểm tra tên, kiểu tham số, return type và visibility, nhưng không chứng minh hành vi nghiệp vụ. Contract còn cần **input hợp lệ, kết quả, side effect, semantics lỗi và bảo đảm thời gian/consistency nếu đã công bố**. Một implementation báo DELIVERED khi chưa gửi là vi phạm hợp đồng dù implement đúng signature. Dùng contract tests kiểm tra các cam kết quan sát được trước khi đổi implementation.
