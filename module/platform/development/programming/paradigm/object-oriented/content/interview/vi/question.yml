- question: Trừu tượng hóa trong OOP là gì? Với hệ thống báo phí vận chuyển, bạn chọn dữ liệu và hành vi thiết yếu như thế
    nào?
  answer: |-
    **Abstraction** là chọn những thuộc tính và hành vi cần thiết cho **một use case**, bỏ qua chi tiết không ảnh hưởng đến mục đích đó. Bộ phận báo phí có thể chỉ cần `weightGrams`, `distanceKm` và `quoteVnd(...)`, không cần màu hộp, tên tài xế hay biển số xe.

    Hãy xác định đầu vào, đơn vị, các trường hợp biên và quy tắc tính phí trước khi tạo kiểu dữ liệu. Ví dụ `record QuoteInput(int weightGrams, int distanceKm)` kiểm tra khối lượng dương, khoảng cách không âm. Trừu tượng tốt đủ diễn đạt nghiệp vụ, không sao chép mọi thuộc tính của đối tượng ngoài đời.
