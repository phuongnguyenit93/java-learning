- question: Phân biệt overriding, overloading và field hiding bằng ví dụ ngắn.
  answer: |-
    **Overriding**: subclass cung cấp implementation mới của một instance method kế thừa đúng chữ ký, có thể dispatch động. **Overloading**: cùng tên nhưng **khác danh sách tham số**, compiler chọn phiên bản theo kiểu biểu thức và quy tắc overload. **Field hiding**: subclass khai báo field cùng tên, việc đọc field phụ thuộc kiểu tham chiếu/ngữ cảnh chứ không dispatch động.

    ```java
    class Parent {
        String name = "parent";
        String say() { return "P"; }
        String show(int x) { return "int"; }
    }
    class Child extends Parent {
        String name = "child";
        @Override String say() { return "C"; }
        String show(String s) { return "text"; }
    }
    ```

    Với `Parent p = new Child()`, `p.say()` trả `C`, `p.name` đọc `parent`, còn `p.show("a")` không biên dịch do kiểu tĩnh Parent không có overload đó. Tránh field hiding vì khó đọc và dễ lỗi.
