- question: Vì sao nên inject Clock trong BorrowingService và cách xác định quá hạn đúng tại ngày đến hạn?
  answer: |-
    Clock được inject giúp service lấy ngày hiện tại nhất quán và test có thể điều khiển thời gian. Một loan mở chỉ quá hạn nếu **today.isAfter(dueOn)**; vào chính dueOn thì chưa quá hạn. Ngày mượn 01/03/2026 và thời hạn 14 ngày tạo dueOn 15/03/2026 theo quy ước bài.

    Test với Clock.fixed tại thời điểm xác định và ZoneId phù hợp: ngày 15/03 được mượn tiếp nếu không vi phạm hạn mức; ngày 16/03 bị chặn nếu loan vẫn mở. Nếu chỉ gọi LocalDate.now() trong code, test sẽ phụ thuộc ngày chạy và khó lặp lại.

    Lưu ý một loan đã trả không còn được coi là quá hạn hoạt động, dù ngày trả sau hạn; vẫn giữ returnedOn để phục vụ lịch sử và báo cáo theo chính sách.
