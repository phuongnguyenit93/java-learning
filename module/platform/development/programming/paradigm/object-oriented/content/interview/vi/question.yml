- question: obj = null hoặc biến local hết scope có buộc object được GC ngay không? GC roots và reachability có ý nghĩa gì?
  answer: |-
    **Không.** obj = null thay đổi một biến tham chiếu; object có thể vẫn được giữ bởi List, field, static cache hoặc một reference khác. Scope của tên biến không phải thời điểm GC buộc thu hồi object.

    Garbage collector xác định **reachability** bằng cách xét các đường tham chiếu từ **GC roots** do JVM xác định, như tham chiếu liên quan đến các thread đang thực thi và những root nội bộ. Khi không còn strong reachability tương ứng, object có thể **đủ điều kiện thu gom**, nhưng thời điểm chạy GC không được bảo đảm. Tối ưu JIT có thể tác động liveness của local; không nên khẳng định mọi local đang ở lexical scope đều còn là root sống.
