- question: this escape qua listener hoặc callback ngay trong constructor gây lỗi gì, kể cả chương trình đơn luồng?
  answer: |-
    Khi constructor đăng ký this vào registry, một callback được kích hoạt ngay lúc đăng ký có thể gọi method của instance **trước khi constructor hoàn tất**. Một field đáng lẽ được gán sau đó có thể còn null/0; invariant chưa đúng. Đây là **this escape**, có thể xảy ra ngay cùng thread, không chỉ do data race.

    Nên tạo/validate object hoàn chỉnh trước; sau khi constructor trả về mới register/activate. Có thể dùng static factory làm bước tạo và đăng ký tách bạch, đồng thời xử lý lỗi nếu đăng ký không thành công. Tránh publish this qua static registry, listener, lambda hoặc khởi chạy thread trong constructor.
