- question: Identity, equality và aliasing liên quan thế nào đến bug trạng thái?
  answer: |-
    Với reference type thông thường, `a == b` kiểm tra hai biến có cùng tham chiếu hay không; `equals` kiểm tra tiêu chí bằng nhau mà type định nghĩa. Hai tài khoản có cùng balance không có nghĩa là cùng danh tính tài khoản.

    Khi `a` và `b` cùng tham chiếu một object mutable, sửa qua `a` được quan sát qua `b` (*aliasing*). Vấn đề phát sinh nếu module khác không biết state đã đổi.

    Với value object dùng làm key trong `HashMap`, nên giữ state tham gia equality bất biến và bảo đảm `equals` nhất quán với `hashCode`. Nếu key mutable bị đổi sau khi lưu, việc tra cứu hash có thể thất bại.
