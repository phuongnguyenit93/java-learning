- question: Khi nào nên chọn interface, abstract class và composition trong một họ chính sách tính phí?
  answer: |-
    **Interface** phù hợp với hợp đồng/role được nhiều loại class độc lập thực hiện, như DeliveryFeePolicy.quote(Parcel). **Abstract class** phù hợp khi các subclass thực sự cùng một họ và cần chia sẻ constructor, protected/internal state, invariant và thuật toán nền.

    **Composition** phù hợp khi cần tái sử dụng một thành phần có thể thay thế mà quan hệ is-a giữa các class không rõ, ví dụ Policy dùng PriceCalculator được truyền vào. Tránh dựng superclass chỉ để mượn vài method.

    Java cho một class extends trực tiếp một superclass nhưng implements nhiều interface. Interface có default method không có nghĩa nó mang theo instance field hay constructor như abstract class.
