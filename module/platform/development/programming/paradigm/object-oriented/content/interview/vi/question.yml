- question: Một TicketRouter giao việc cho AssignmentPort và gặp timeout sau khi ghi dữ liệu. Có thể an tâm retry không?
  answer: |-
    **Không.** Delegation không cung cấp atomic transaction hoặc rollback. AssignmentPort có thể đã ghi assignment rồi mới mất phản hồi, làm kết quả ở router **không chắc chắn**. Retry vô điều kiện có thể tạo assignment trùng.

    Cần định nghĩa rõ hợp đồng về thành công, timeout, trạng thái không xác định, idempotency key, kiểm tra lại kết quả và chính sách retry. Trong test có thể tạo fake giả lập lỗi sau side effect để xác nhận router xử lý đúng.

    Router vẫn sở hữu trách nhiệm điều phối và báo kết quả; không thể phó mặc tính đúng đắn tổng thể cho mỗi delegate.
