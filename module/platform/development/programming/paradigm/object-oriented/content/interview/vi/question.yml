    Với thay đổi gói trong một key, `compute` hoặc operation atomic tương ứng có thể phù hợp nếu function an toàn; với nhiều key/bất biến phức tạp, cần lock/transaction theo phạm vi thực. Không xem tên collection là bảo đảm nghiệp vụ.
