- question: Trong kiểm thử phối hợp nhiều object, thứ tự reserve–charge–send có quan trọng không, và nên kiểm tra bằng cách
    nào?
  answer: |-
    Nếu nghiệp vụ hứa **không charge trước khi giữ được hàng**, và **không gửi biên nhận trước khi xác nhận thanh toán**, thứ tự là một phần của contract. Mockito InOrder hoặc recording fake có thể xác nhận chuỗi tương tác và tham số, kết hợp assert trạng thái kho và trạng thái đơn.

    Tuy nhiên không cần verify mọi lời gọi nội bộ; chỉ ghi những cạnh quan trọng. Khi refactor thành thực thi bất đồng bộ, phải **định nghĩa lại quan hệ nhân quả** (ví dụ event chỉ phát sau DB commit) thay vì yêu cầu thread execution order tùy ý.

    Test phối hợp bằng in-memory object thật giúp kiểm tra logic cộng tác nhiều bước; integration test với DB/provider thật hoặc môi trường mô phỏng còn cần để kiểm chứng transaction, network và trạng thái bền vững.
