- question: Trong JPA bidirectional OneToMany/ManyToOne, owning side và mappedBy khác gì với 'owner' của UML composition?
  answer: |-
    Trong mapping JPA điển hình `Employee.department @ManyToOne` nắm **foreign key**, là **owning side của association về persistence**; `Department.employees @OneToMany(mappedBy="department")` là phía inverse. Chỉ đổi collection phía inverse chưa chắc thay foreign key khi flush.

    Đây là khái niệm **owning side của ORM**, khác với **ownership vòng đời** của UML composition. Domain vẫn cần method cập nhật cả hai phía cho object graph nhất quán; transaction, flush/reload và constraint DB quyết định dữ liệu bền vững. `cascade`/`orphanRemoval` phải theo business ownership, không được cấu hình tùy ý.
