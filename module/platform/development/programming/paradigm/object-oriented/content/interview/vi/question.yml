    Với ví dụ đơn luồng, prevalidate giúp lỗi nghiệp vụ không làm thay đổi số dư nửa chừng. Nhưng hai đối tượng trong RAM không tạo giao dịch ACID: khi có nhiều luồng, storage thất bại hoặc nhiều tiến trình, cần đồng bộ/lock, transaction, cơ chế idempotency, kiểm toán và xử lý rollback phù hợp. Test lỗi phía người nhận phải xác minh **cả hai số dư giữ nguyên**.
