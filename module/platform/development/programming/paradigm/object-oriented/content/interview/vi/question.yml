- question: Declared type, runtime type, overload và override chi phối kết quả gọi method như thế nào?
  answer: |-
    **Declared/static type** của biến quyết định các member có thể gọi và **overload resolution** tại compile time. **Runtime type** của object quyết định instance method override nào được dispatch.

    ~~~java
    class Parent {
        String call(Object o) { return "Object"; }
        String label() { return "Parent"; }
    }
    class Child extends Parent {
        String call(String s) { return "String"; }
        @Override String label() { return "Child"; }
    }
    Parent p = new Child();
    System.out.println(p.call("hello")); // Object
    System.out.println(p.label());       // Child
    ~~~

    p.call("hello") chọn overload thấy được qua Parent; Child.call(String) là **overload mới**, không override Parent.call(Object). Method label() lại bị override nên chạy Child.label(). Field hiding/static method hiding không dynamic dispatch giống instance overriding.

    Kiểu tĩnh không đồng nghĩa Java không có hành vi động; Java dùng kết hợp kiểm tra compile-time và runtime dispatch.
