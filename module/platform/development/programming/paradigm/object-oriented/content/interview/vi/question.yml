- question: So sánh interface và abstract class khi thiết kế nhiều chính sách tính giá. Khi nào chọn cái nào?
  answer: |-
    Chọn **interface** khi trọng tâm là một **năng lực/hợp đồng** và các implementation có thể thuộc các class khác nhau, cần cho phép một class thực hiện nhiều hợp đồng. Interface Java có thể có default/static/private methods nhưng không có instance fields tùy biến như abstract class.

    Chọn **abstract class** khi các biến thể có thật sự một phần **state/quy trình chung**, cần constructor hoặc Template Method được kiểm soát. Java chỉ cho class kế thừa một superclass, nên đây là ràng buộc thiết kế. Nếu mới chỉ có một phép tính cụ thể, một concrete class với API nhỏ có thể dễ đọc hơn cả hai.
