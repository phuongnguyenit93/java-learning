- question: Một concrete class implements Action nhưng viết void run() thay vì public void run() sẽ ra sao? Khi nào class
    được phép chưa viết method?
  answer: |-
    Trong Java, phương thức interface thông thường không có thân được hiểu là **public abstract**. Class triển khai không được giảm access xuống package-private; nếu viết void run() không có public thì **compile-time error**.

    ~~~java
    interface Action { void run(); }
    final class Job implements Action {
        @Override
        public void run() {
            System.out.println("Run");
        }
    }
    ~~~

    Một concrete class phải cung cấp mọi abstract method cần thiết, hoặc kế thừa implementation hợp lệ. Nếu class còn thiếu nghĩa vụ, nó phải khai báo **abstract**. Annotation @Override giúp compiler phát hiện sai chữ ký khi định override/implement.
