- question: Interface có mô tả trọn vẹn hợp đồng không, hay còn cần các điều kiện khác?
  answer: |-
    Chữ ký trong interface xác định method/type, nhưng hợp đồng còn gồm **tiền điều kiện, hậu điều kiện, ngoại lệ, side effect, tính nhất quán và giới hạn**.

    Ví dụ `PaymentMethod.pay(amount)` cần thống nhất amount hợp lệ, ý nghĩa kết quả, trường hợp lỗi, việc retry có an toàn hay có thể thu tiền hai lần. Nếu hai implementation trả cùng type nhưng có ngữ nghĩa trái ngược, polymorphism ở mức cú pháp vẫn gây lỗi.

    Tài liệu hóa contract, có test dùng chung cho implementation và chỉ giấu những chi tiết client không cần biết. Tạo interface cho mỗi class đơn lẻ không tự động tăng tính linh hoạt; nó có chi phí điều hướng và bảo trì.
