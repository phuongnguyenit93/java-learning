- question: 'Thiết kế Order có trạng thái DRAFT, PAID, SHIPPED: ngăn chuyển sai và test ra sao?'
  answer: |-
    Định nghĩa các cạnh hợp lệ theo nghiệp vụ như `DRAFT --CONFIRM_PAYMENT--> PAID` (sau khi đã xác thực kết quả thu tiền) và `PAID --SHIP--> SHIPPED` khi mã vận đơn hợp lệ. `ship()` gọi trên DRAFT phải từ chối và **giữ nguyên state**, không cho `setStatus(SHIPPED)` tự do.

    ```java
    void ship(String tracking) {
        if (status != Status.PAID || tracking == null || tracking.isBlank())
            throw new IllegalStateException("Cannot ship");
        status = Status.SHIPPED;
    }
    ```

    Test ma trận event × state: cạnh hợp lệ, cạnh bị cấm, guard sai và hậu điều kiện; thêm test cùng event lặp lại theo chính sách idempotency.
