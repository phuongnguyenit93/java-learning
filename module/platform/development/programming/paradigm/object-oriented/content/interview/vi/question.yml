- question: Vì sao abstract class vẫn có constructor, và tại sao không nên gọi method có thể override từ constructor?
  answer: |-
    Constructor của abstract superclass **vẫn chạy khi tạo instance subclass** để khởi tạo phần state chung. Nó có thể kiểm tra field chung hoặc gọi `super(...)` theo quy tắc.

    Nhưng gọi method có thể override trong constructor rất rủi ro: **dynamic dispatch** có thể chạy override ở subclass trước khi field của subclass được khởi tạo xong, dẫn tới null/giá trị mặc định và phá invariant. Tốt hơn là không dispatch tới overridable method khi đang dựng object; chỉ hoàn thiện object rồi mới dùng extension hook.
