- question: Một abstract method có thể private, static hoặc final không? Tại sao?
  answer: |-
    Không thể khai báo `abstract` cùng `private`, `static` hay `final` cho cùng một method. Abstract yêu cầu subclass **hoàn thiện bằng override**; private không kế thừa theo nghĩa cho phép override, static chỉ hiding thay vì override động, final lại cấm override.

    Trong abstract class vẫn có thể có các method **concrete** là private/static/final và field `final`. Một abstract method có thể có mức truy cập cho phép subclass triển khai hợp lệ. Tương tự, một `final class` không thể là abstract vì subclass sẽ không được phép hoàn thiện nó.
