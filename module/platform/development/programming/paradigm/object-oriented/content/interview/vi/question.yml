- question: Có nhất thiết deep-copy mọi collection hay object graph ở mọi getter không? Đánh đổi cần đánh giá?
  answer: |-
    Không. Sao chép toàn bộ đồ thị ở mọi lần đọc có thể tốn CPU, cấp phát bộ nhớ, mất chia sẻ tham chiếu cần thiết và xử lý khó với graph có chu trình.

    Chọn theo ownership và hợp đồng: ưu tiên value/element immutable để chia sẻ an toàn; snapshot một lần tại ranh giới cần ổn định; trả query/số liệu tổng hợp nếu caller không cần cả collection. Nếu có mutable element hoặc concurrency, xác định chiến lược lock/snapshot nhất quán. Không được hy sinh bảo vệ invariant chỉ vì muốn giảm chi phí copy, nhưng cũng đừng deep-copy thiếu mục đích.
