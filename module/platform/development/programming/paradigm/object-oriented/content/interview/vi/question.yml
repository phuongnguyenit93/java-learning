- question: Khi chuyển Java BigDecimal/long sang JavaScript number hoặc Python, những rủi ro type/number/runtime validation
    nào cần kiểm soát?
  answer: |-
    Nếu phí được tính bằng **số nguyên VND**, Java long có miền giá trị nguyên hữu hạn với overflow, còn JavaScript Number là IEEE-754 double chỉ biểu diễn chính xác số nguyên trong phạm vi **Number.isSafeInteger**. Với TypeScript, annotation number **không tự chạy để kiểm tra dữ liệu JSON tại runtime**. JavaScript còn có coercion nếu gọi API sai kiểu.

    Trong Python, int có độ chính xác tùy ý nhưng bool là subtype của int khi isinstance, nên validation cần nói rõ có chấp nhận bool hay không; runtime type hints cũng không mặc định enforce. C# decimal phù hợp tiền có phần lẻ nhưng vẫn cần quy tắc scale/rounding, overflow và currency.

    Port thiết kế phải giữ validation, rounding, miền input/output, trạng thái lỗi và contract tests; không mặc định các ngôn ngữ có cùng behavior của số và exception.
