- question: Bạn đánh giá cohesion và coupling của mô hình đối tượng bằng dấu hiệu gì?
  answer: |-
    **Cohesion** cao khi state và method cùng phục vụ một trách nhiệm. **Coupling** thấp khi thay chi tiết nội bộ không buộc nhiều nơi khác biết và sửa theo.

    Các dấu hiệu đáng xem: class vừa tính giá, gửi mail, truy vấn DB và render UI; controller đọc sâu `a.getB().getC().setD()`; một quy tắc giá bị duplicate tại nhiều service; một thay đổi phải sửa hàng loạt file không liên quan.

    Không nên đánh giá chỉ theo số class, dòng code hay pattern. Một hệ thống quá nhiều forwarder interface/class có thể kém rõ hơn một hàm trực tiếp. Hãy đặt câu hỏi **có bao nhiêu lý do để class thay đổi** và boundary nào thực sự che được chi tiết.
