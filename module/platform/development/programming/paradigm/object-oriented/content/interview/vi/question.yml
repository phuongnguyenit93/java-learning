- question: Một method nhận Account(100), gọi deposit(20) rồi gán tham số sang new Account(999). Caller nhìn thấy số dư bao
    nhiêu và tại sao?
  answer: |-
    Caller vẫn nhìn thấy **120**, vì Java luôn **pass-by-value**: tham số nhận bản sao *giá trị tham chiếu*. deposit(20) sửa object mà caller và method cùng tham chiếu; phép gán tham số sang new Account chỉ thay đổi biến cục bộ trong method.

    ~~~java
    static void change(Account a) {
        a.deposit(20);
        a = new Account(999);
    }
    Account original = new Account(100);
    change(original);
    System.out.println(original.getBalance()); // 120
    ~~~

    Đoạn mã giả định Account.deposit tăng số dư và getBalance đọc số dư. Có thể sửa object qua tham số không có nghĩa Java truyền chính biến tham chiếu của caller theo reference.
