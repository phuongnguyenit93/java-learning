- question: Liskov Substitution Principle đòi kiểu con bảo toàn những phần nào của hợp đồng kiểu cha?
  answer: |-
    **LSP** yêu cầu mọi object subtype dùng thay supertype mà **client đúng theo contract vẫn hoạt động đúng**. Quan trọng hơn cú pháp extends/implements là:

    - **Precondition:** subtype không được tự siết đầu vào mà supertype đã cho phép.
    - **Postcondition:** subtype không được làm yếu kết quả đã hứa.
    - **Invariant và lỗi:** không phá quy tắc trạng thái, ý nghĩa ngoại lệ, side effect hoặc bảo đảm quan sát được đã công bố.

    Ví dụ DiscountPolicy.apply(subtotal) nhận subtotal không âm và trả khoản chiết khấu trong [0, subtotal]. VipPolicy từ chối subtotal bằng 0 hoặc trả chiết khấu lớn hơn subtotal đều vi phạm, dù Java compile.

    Subtype **được phép cho mức giảm khác** nếu vẫn nằm trong contract; LSP không yêu cầu mọi implementation có cùng thuật toán hay cùng kết quả cụ thể.
