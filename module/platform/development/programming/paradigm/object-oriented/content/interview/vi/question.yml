- question: Anemic Domain Model khác một DTO nhiều getter/setter hợp lệ ở đâu?
  answer: |-
    Anemic model là **entity giữ data nhưng luật thay đổi data nằm rải ở caller**: service tự `setBalance`, `setStatus`. Entity khó tự bảo vệ invariant. Với Order, `pay()`, `cancel()` có validation thường rõ nghĩa hơn setter trần.

    DTO hoặc request/response record có chức năng **vận chuyển dữ liệu**, không cần chứa toàn bộ nghiệp vụ. Transaction Script cho CRUD đơn giản cũng có thể hợp lý. Hãy hỏi ai sở hữu luật, không kết án mọi getter/setter.
