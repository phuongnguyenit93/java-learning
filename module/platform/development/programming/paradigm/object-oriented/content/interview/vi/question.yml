- question: Khi nào inheritance có thể vi phạm nguyên tắc thay thế Liskov?
  answer: |-
    Subtyping tốt nghĩa là code dùng superclass theo contract có thể nhận subtype mà không phải thay logic. Subtype không nên đòi **tiền điều kiện mạnh hơn**, hứa **hậu điều kiện yếu hơn** hay phá invariant của base class.

    Ví dụ nếu API của hình chữ nhật hứa `resize(width,height)` có thể thay riêng hai chiều, subclass hình vuông buộc chiều cao bằng chiều rộng sẽ không giữ cùng hợp đồng.

    Quan hệ “is-a” ngoài đời chưa đủ; dùng inheritance chỉ để lấy vài dòng code còn tạo coupling vào class cha và hành vi override. **Composition** hoặc interface có thể phù hợp hơn khi cần biến thể/chính sách thay thế mà không có subtype thực sự.
