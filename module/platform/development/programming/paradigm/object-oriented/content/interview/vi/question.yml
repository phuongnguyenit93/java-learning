- question: Trước khi refactor Checkout từ if/switch sang Strategy, cần thiết kế ma trận regression gồm những gì?
  answer: |-
    Ghi **hợp đồng quan sát được trước refactor**: danh sách input hợp lệ, kết quả, exceptions, state và external effects. Với phí vận chuyển, kiểm tra đơn ngay dưới, đúng bằng và trên ngưỡng miễn phí; số lượng 0/âm; SKU không tồn tại; overflow; nhiều dòng trùng SKU; mọi shipping option hiện có.

    Dùng ba lớp bằng chứng:
    1. **Specification examples** có expected tính từ yêu cầu.
    2. **Differential testing** chạy cùng input với old/new implementation.
    3. **Invariant/contract tests** như total=subtotal+shipping và total không âm theo miền hợp lệ.

    Nếu code cũ có bug, so sánh old/new có thể vẫn xanh với cùng kết quả sai; **đặc tả phải là oracle cuối cùng**. Mở rộng integration tests khi refactor tác động bean wiring, DB, JSON API hoặc transaction.
