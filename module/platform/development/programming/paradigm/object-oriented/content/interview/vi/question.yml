- question: Vì sao refactor inheritance sang composition trong Spring/JPA không thể chỉ kiểm tra unit test xanh là xong?
  answer: |-
    Framework có thể phụ thuộc **metadata kiểu**, proxy/AOP interception, vị trí @Transactional, JPA inheritance mapping, serialization và lifecycle. Khi chuyển method sang collaborator khác, một call có thể không còn đi qua Spring proxy như trước; transaction boundary hoặc mapping schema có thể thay đổi.

    Unit test gọi thẳng method không phát hiện được tất cả. Cần kiểm tra tích hợp với container/DB, đường caller, phương thức cũ công bố qua lớp cha, migration, lỗi/rollback, threading và chính sách đóng resource.

    Không refactor máy móc quan hệ extends đang thực sự đại diện cho inheritance của entity hoặc API công khai chỉ để thỏa khẩu hiệu “composition over inheritance”.
