- question: Một phương thức lớp cha gọi một phương thức overridable khác. Kết quả được dispatch theo lớp nào?
  answer: |-
    Ngay cả khi đoạn code nằm trong superclass, lời gọi instance method thông thường vẫn dùng **runtime receiver**. Nếu `Animal.describe()` gọi `sound()`, và object thực là Cat override `sound()`, thì `Animal.describe()` dùng `Cat.sound()`.

    ```java
    class Animal {
        String sound() { return "unknown"; }
        String describe() { return "Sound: " + sound(); }
    }
    class Cat extends Animal {
        @Override String sound() { return "meow"; }
    }
    ```

    `new Cat().describe()` trả `Sound: meow`. Đây là polymorphism, đồng thời là lý do cần thận trọng khi constructor superclass gọi method có thể bị override.
