- question: Vì sao List<Integer> không thể gán cho List<Number>, dù Integer extends Number? Điều gì sẽ xảy ra nếu Java cho
    phép?
  answer: |-
    Java generic types mặc định **invariant**. Nếu List<Integer> được coi là List<Number>, code có thể thêm Double vào danh sách thực tế chỉ chứa Integer, phá an toàn kiểu.

    ~~~java
    java.util.List<Integer> ints = new java.util.ArrayList<>();
    // java.util.List<Number> nums = ints; // Lỗi biên dịch.
    java.util.List<? extends Number> nums = ints;
    Number n = nums.get(0); // Hợp lệ nếu danh sách có phần tử.
    ~~~

    Đoạn minh họa nums.get(0) chỉ chạy khi ints đã có phần tử; ví dụ trên là minh họa kiểu, nếu chạy nguyên văn sẽ gặp IndexOutOfBoundsException ở get(0). Wildcard **? extends Number** cho phép đọc dưới kiểu Number nhưng không add một Number mới tùy ý, vì kiểu phần tử thực tế có thể là Integer hoặc Double.

    Đừng nhầm tính bất biến của **generic type relationships** với bất biến trạng thái collection.
