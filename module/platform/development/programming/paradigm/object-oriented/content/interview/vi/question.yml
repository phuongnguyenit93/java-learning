    `equals` cần phản xạ, đối xứng, bắc cầu và nhất quán khi dữ liệu so sánh không đổi; không bằng null. Khi `a.equals(b)` là true thì **bắt buộc** `a.hashCode()==b.hashCode()`.

    Chiều ngược không đúng: hash collision hợp lệ. Khi field tham gia equals/hash thay đổi lúc object nằm trong HashMap/HashSet, tra cứu có thể sai dù cặp method vẫn hợp đồng tại mỗi thời điểm.
