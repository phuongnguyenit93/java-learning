- question: Divergent Change và Shotgun Surgery khác nhau ra sao qua ví dụ chính sách phí vận chuyển?
  answer: |-
    **Divergent Change**: một OrderManager phải sửa vì nhiều lý do độc lập như SQL, phí vận chuyển và email. **Shotgun Surgery**: một thay đổi *duy nhất* về ngưỡng miễn phí vận chuyển buộc sửa cùng điều kiện ở controller, checkout, batch và báo cáo.

    Với dạng thứ nhất, tách trách nhiệm trong class. Với dạng thứ hai, tìm nơi chứa tri thức chung như ShippingPolicy và chuyển các caller dùng hợp đồng đó. Có thể đồng thời tồn tại hai smell; chọn giải pháp theo nguyên nhân.
