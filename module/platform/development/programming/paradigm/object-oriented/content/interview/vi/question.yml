- question: Encapsulation, information hiding và access control khác nhau ở điểm nào? Vì sao chỉ đặt field private là chưa
    đủ?
  answer: |-
    **Encapsulation** gom trạng thái với hành vi chịu trách nhiệm bảo vệ trạng thái đó. **Information hiding** che các quyết định triển khai mà caller không cần biết (ví dụ giỏ dùng `Map` hay `List`). **Access control** là cơ chế của ngôn ngữ (`private`, package-private, `protected`, `public`) quyết định mã nào truy cập được thành viên.

    `private List<Item> items` chưa bảo vệ được gì nếu `getItems()` trả thẳng danh sách mutable cho caller gọi `clear()`. API tốt phải kiểm soát **mọi đường đọc/ghi**, cung cấp hành vi như `addItem()` và dữ liệu đọc dưới dạng an toàn. Access modifier cũng không thay xác thực/phân quyền cho người dùng hệ thống.
