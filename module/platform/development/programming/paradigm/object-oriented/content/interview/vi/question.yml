- question: List.copyOf khác Collections.unmodifiableList về snapshot và phần tử mutable?
  answer: |-
    `Collections.unmodifiableList(source)` là **read-only view**: không sửa được qua view nhưng vẫn thấy source mutate. `List.copyOf(source)` cho snapshot cấu trúc unmodifiable từ list mutable thông thường và không nhận null element.

    Cả hai đều **shallow**: phần tử kiểu `MutableItem` có thể sửa qua alias. Để trả một snapshot bất biến theo hợp đồng, chuyển phần tử sang immutable value/DTO hoặc defensive-copy sâu nơi cần thiết. Khi refactor phải test sự khác biệt giữa live view và snapshot.
