- question: Tại sao phương thức tính phí chung có thể khai báo final và chỉ để bước giá riêng là abstract?
  answer: |-
    Đó là **Template Method**. Superclass quản lý trình tự ổn định: validate đầu vào, xác định khối lượng tính cước, cộng phí cơ bản, kiểm tra overflow. Subclass chỉ định nghĩa phần thay đổi, chẳng hạn `distanceFee()` hoặc `weightSurcharge()`.

    Khai báo `final quote(...)` ngăn subclass bỏ qua các bước kiểm tra chung hoặc thay đổi thứ tự, còn method abstract tạo điểm mở rộng đúng chỗ. Tuy nhiên template method vẫn buộc các triển khai vào một cây kế thừa; nếu chính sách cần tổ hợp tự do hoặc thay đổi lúc chạy, composition/strategy có thể hợp hơn.
