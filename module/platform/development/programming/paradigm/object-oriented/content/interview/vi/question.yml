- question: Outer.this là gì, và tại sao không nên làm lộ this khi constructor đang chạy?
  answer: |-
    Trong non-static inner class, `this` là instance inner, còn `Outer.this` chỉ instance lớp bao ngoài. Static nested class không có enclosing instance ngầm định.

    Nếu constructor đăng ký listener hoặc truyền `this` cho thread khác quá sớm, mã bên ngoài có thể thấy object đang **khởi tạo dở**, làm hỏng invariant hoặc gây lỗi đồng thời. Nên kiểm tra và thiết lập đầy đủ state trước khi công bố reference; không coi `this` như cơ chế tự đồng bộ.
