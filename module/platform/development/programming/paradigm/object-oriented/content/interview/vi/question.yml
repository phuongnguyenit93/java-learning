  answer: |-
    Trước khi tạo instance, JVM bảo đảm các class cần thiết được **class-initialized** theo quy tắc Java; trong đường kế thừa thông thường static initializer superclass chạy trước subclass khi chúng được khởi tạo lần đầu. Đây không phải công việc lặp lại ở mỗi lần `new`.

