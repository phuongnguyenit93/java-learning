- question: Collections.unmodifiableList(list) và List.copyOf(list) có giống nhau không? Chọn cách nào cho API snapshot?
  answer: |-
    `Collections.unmodifiableList(list)` tạo **view không cho sửa qua view**, nhưng nếu list gốc thay đổi thì view vẫn phản ánh thay đổi. `List.copyOf(list)` tạo danh sách unmodifiable có nội dung được cố định ở thời điểm sao chép đối với một nguồn mutable thông thường.

    Cả hai đều không deep-copy phần tử mutable. `List.copyOf` từ chối phần tử null và với nguồn đã là unmodifiable có thể tái sử dụng object thay vì luôn cấp phát list mới. Với API cam kết snapshot cấu trúc, ưu tiên copy tại ranh giới (và phần tử bất biến); nếu cố ý trả live view, phải tài liệu hóa tính sống và vấn đề đồng thời.
