- question: Một quan hệ nhiều–nhiều có nhất thiết lưu reference hai chiều trong cả Student và Course không?
  answer: |-
    Không. **Multiplicity N–N** nói về số lượng quan hệ, còn **navigability** nói về đường truy cập từ object. Có thể giữ một `EnrollmentRegistry` hoặc repository sở hữu các cặp, rồi cung cấp `findCoursesByStudentId` và `findStudentsByCourseId` mà Student/Course không giữ collection của nhau.

    Giữ dữ liệu hai chiều có thể thuận tiện truy vấn trong memory nhưng tạo nhiều state cần đồng bộ và nguy cơ lỗi ở thêm/gỡ liên kết. Hãy chọn nơi chứa sự thật chuẩn và đo nhu cầu truy vấn thực tế; không suy ra hai chiều chỉ vì N–N.
