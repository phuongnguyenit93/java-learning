- question: Field hiding có khác gì method overriding? Dự đoán kết quả khi Parent obj = new Child().
  answer: |-
    Field **không dispatch động** như instance method; subclass khai báo field cùng tên là **hiding**, tạo hai khai báo độc lập. Với `Parent obj = new Child()`, `obj.title` truy cập field theo kiểu Parent, trong khi `obj.getTitle()` có thể chạy override từ Child.

    ```java
    class Parent {
        String title = "Parent-field";
        String getTitle() { return "Parent-method"; }
    }
    class Child extends Parent {
        String title = "Child-field";
        @Override String getTitle() { return "Child-method"; }
    }
    ```

    Kết quả: `obj.title` là `Parent-field`, `obj.getTitle()` là `Child-method`. Hãy tránh public field trong API cần đa hình; dùng method biểu đạt hành vi hoặc getter phù hợp.
