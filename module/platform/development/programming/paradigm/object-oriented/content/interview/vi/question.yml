- question: Getter public trả trực tiếp Department.members dưới dạng Set mutable tạo ra rủi ro gì? equals/hashCode của entity
    còn liên quan thế nào?
  answer: |-
    Caller có thể `department.getMembers().clear()` hay `add(e)` mà không cập nhật `e.department`, lập tức phá invariant hai chiều. Nên trả **snapshot không sửa được** hoặc read-only view có hợp đồng rõ, giữ hành vi thêm/chuyển/xóa trong một API kiểm soát.

    Nếu đặt entity trong `HashSet`, `equals/hashCode` dựa vào một field mutable như department hoặc tên có thể đổi khiến lookup/remove không tìm ra element sau khi đổi field. Dùng identity ổn định theo mô hình và hiểu tác động của JPA proxies/persistence; đừng coi chỉ bọc collection unmodifiable là đủ bảo toàn quan hệ.
