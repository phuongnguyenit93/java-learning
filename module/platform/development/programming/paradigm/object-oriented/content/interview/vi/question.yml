- question: Khi nào instanceof và downcast hợp lệ thay vì một design smell?
  answer: |-
    Cast `(CardPayment) method` có thể ném `ClassCastException` nếu runtime object không đúng subtype. Pattern `instanceof CardPayment card` giúp kiểm tra trước khi dùng capability.

    Nó hợp lý ở boundary JSON/legacy, serializer, capability thật sự tùy chọn hoặc `sealed` hierarchy đóng cần xử lý tập loại hữu hạn. Không dùng cast rải rác để thay một hợp đồng đa hình đáng ra là chung.
