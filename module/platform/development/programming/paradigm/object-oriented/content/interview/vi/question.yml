- question: Vì sao đổi getter chain thành một wrapper method không tự sửa N+1 queries hoặc LazyInitializationException của
    JPA?
  answer: |-
    Nếu order.getCustomer().getAddress() gọi quan hệ **lazy**, nó có thể kích hoạt SQL; trong vòng lặp còn có thể dẫn tới **N+1 queries** hoặc LazyInitializationException khi persistence context đã đóng, tùy mapping và trạng thái.

    Đưa chuỗi đó vào order.shippingCountryCode() chỉ **chuyển vị trí gọi**, không tự thay fetch strategy. Cần chủ động dùng projection/DTO, entity graph, batch fetching, query phù hợp, ranh giới transaction và tránh serialize toàn bộ object graph JPA.

    Đồng thời phải xem wrapper có thật sự bộc lộ **hợp đồng nghiệp vụ** hay chỉ giấu chuỗi getter bằng method chuyển tiếp vô nghĩa. Thiết kế OOP và performance I/O là hai vấn đề liên quan nhưng cần xử lý riêng.
