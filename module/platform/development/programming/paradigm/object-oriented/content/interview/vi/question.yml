- question: Trong Animal animal = new Dog(), declared type và runtime type chi phối lời gọi method thế nào?
  answer: |-
    **Declared type** của biến animal là Animal: compiler dựa vào đó để xác định method có thể gọi và overload hợp lệ. **Runtime type** của object là Dog: với **instance method được override**, Java dispatch tới implementation Dog ở runtime.

    ~~~java
    class Animal {
        String speak() { return "animal"; }
    }
    class Dog extends Animal {
        @Override String speak() { return "dog"; }
        void bark() {}
    }
    Animal animal = new Dog();
    System.out.println(animal.speak()); // dog
    // animal.bark(); // Compile-time error.
    ~~~

    Upcasting không đổi object hay loại bỏ behavior Dog. Nếu phải liên tục cast để gọi bark, cân nhắc abstraction riêng biểu diễn capability thực sự cần.
