- question: Một class implements A nhưng A và B là hai interface độc lập có cùng method run(). Có thể gán biến A cho B không?
  answer: |-
    **Không chỉ vì chữ ký giống nhau.** A và B là **hai kiểu danh nghĩa khác nhau**. Class chỉ implements A không vì thế tự động implements B. Nếu muốn object dùng được qua cả hai, class cần khai báo implements A, B hoặc theo một quan hệ kế thừa interface phù hợp.

    ~~~java
    interface A { void run(); }
    interface B { void run(); }
    final class Task implements A {
        public void run() {}
    }
    A a = new Task();
    // B b = a; // Không tương thích chỉ vì cùng run().
    ~~~

    Nếu có một object thực tế implements cả hai nhưng reference khai báo là A, phép chuyển sang B cần kiểm tra kiểu thực tế và có thể cast; thiết kế client phụ thuộc interface phù hợp ngay từ đầu thường tốt hơn.
