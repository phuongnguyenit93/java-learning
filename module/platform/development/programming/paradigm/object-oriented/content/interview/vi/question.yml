- question: Tại sao thiết kế API nhận Swimmable tốt hơn Object rồi dùng instanceof nhiều lần?
  answer: |-
    Tham số `Swimmable` tuyên bố ngay **năng lực bắt buộc** và để compiler ngăn truyền object không hỗ trợ `swim()`. `Object` cộng `instanceof` dời lỗi từ compile time sang runtime và khiến business method biết các class cụ thể.

    Không nên ép mọi `Quackable` phải implements `Swimmable`: robot vịt có thể kêu nhưng không bơi, và ép nó `swim()` rồi ném lỗi phá hợp đồng. Chia interface theo khả năng thật sự phù hợp với ISP. Nếu một object được đưa tới boundary dữ liệu không định kiểu, kiểm tra type ở đó vẫn có thể hợp lý.
