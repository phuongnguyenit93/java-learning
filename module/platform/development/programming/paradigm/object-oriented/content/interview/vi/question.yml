- question: Strategy, Decorator và DI liên hệ gì khi refactor kênh gửi cảnh báo?
  answer: |-
    Composition là nền tảng: AlertService giữ reference tới MessageChannel. **Strategy** cho phép thay Email/SMS theo cùng contract; **Decorator** bọc channel khác để thêm logging/retry mà không phải tạo lớp con cho mỗi tổ hợp; **DI** cung cấp channel khi khởi tạo.

    Decorator phải giữ hợp đồng: retry không được gây duplicate side effects vô tội vạ. Với gửi mạng thật cần giới hạn retry, timeout và chính sách idempotency. Không lạm dụng nhiều wrapper khi một kênh duy nhất không có nhu cầu thêm hành vi.
