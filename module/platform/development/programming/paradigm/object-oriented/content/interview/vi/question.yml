- question: LSP liên quan gì đến contract testing và tại sao implements đúng chữ ký chưa bảo đảm thay thế được?
  answer: |-
    **Liskov Substitution Principle** yêu cầu subtype không phá lời hứa của supertype khi client chỉ biết kiểu chung. Java compile chỉ kiểm tra signature và một phần luật override; không chứng minh semantics của dữ liệu, exception hay side effect.

    Ví dụ DiscountPolicy.discountCents(subtotal) chấp nhận mọi subtotal>=0, trả chiết khấu nằm trong 0..subtotal. Một implementation MinimumOnlyDiscount từ chối subtotal dưới 50.000 là **siết precondition**; một implementation trả -1 hoặc lớn hơn subtotal **làm yếu postcondition**.

    Dùng bộ **contract tests chạy cho toàn bộ subtype** với 0, 1, dưới ngưỡng, đúng ngưỡng, cao hơn ngưỡng, số rất lớn và lỗi. Chú ý error semantics/idempotency nếu hợp đồng đề cập. Một bộ test hữu hạn **tìm được lỗi nhưng không chứng minh đúng với mọi input**.
  aiGenerated: true
  reviewed: false
  readmeRelated:
    file: 19.Testing/knowledge/Testing.md
    anchor: ''
  apiRelated:
    controller: ''
    methodSignature: ''
- question: Vì sao hợp đồng được test bằng dữ liệu sinh ngẫu nhiên vẫn cần seed và oracle độc lập?
  answer: |-
    Dữ liệu ngẫu nhiên giúp khám phá kết hợp hiếm: chuỗi lệnh nạp–rút, số lượng lớn, giá trị ở biên. Nhưng mỗi test vẫn cần **oracle**, ví dụ mô hình tham chiếu đơn giản hoặc invariant được viết độc lập với implementation đang kiểm thử.

    Nếu test tự tính expected bằng cùng hàm production, cùng bug có thể xuất hiện cả hai phía và test vẫn xanh. Dùng seed cố định hoặc ghi lại seed khi thất bại để tái hiện, thêm các case biên được đặc tả rõ và shrink dữ liệu khi framework hỗ trợ.

    Cũng cần kiểm tra state sau exception, không chỉ output. Random tests không thay thế integration/concurrency tests nếu giả định thực tế phụ thuộc nhiều tiến trình, transaction và mạng.
