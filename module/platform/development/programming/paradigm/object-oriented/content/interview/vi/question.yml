- question: Tại sao không thể kiểm tra if (x instanceof List<String>) trong Java, nhưng instanceof List<?> có thể hợp lệ?
  answer: |-
    Do **type erasure**, runtime không giữ đầy đủ type argument của một List<T>. Java không thể kiểm tra trực tiếp một list có chính xác phần tử kiểu String bằng **instanceof List<String>**, vì đó là kiểu không reifiable. **List<?>** có thể dùng trong instanceof để kiểm tra object có phải một List hay không.

    ~~~java
    Object value = java.util.List.of("a");
    System.out.println(value instanceof java.util.List<?>); // true
    // if (value instanceof java.util.List<String>) {} // Lỗi.
    ~~~

    Kiểm tra List<?> không chứng minh các phần tử đều String. Nếu dữ liệu không tin cậy, phải xác thực element khi đọc, tránh unchecked cast hoặc heap pollution. Type erasure không thay đổi quan hệ subtype của class/interface.
