- question: Thiết kế quan hệ một–nhiều giữa Department và Employee cần bảo vệ điều gì ngoài collection không rỗng?
  answer: |-
    Xác định quy tắc cụ thể: một Employee có tối đa một Department, Department có số lượng thành viên giới hạn, không trùng employee ID, được chuyển phòng hay không và chuyện gì xảy ra khi phòng đầy. Nếu giữ hai chiều, invariant cần đồng nhất `employee.department` với membership của `department.employees`.

    Nếu phòng đích đầy, **từ chối trước khi gỡ nhân viên khỏi phòng nguồn**. Đừng trả collection mutable cho caller tự sửa. Nếu dữ liệu sống trong DB/đa luồng, cần transaction và cơ chế kiểm soát đồng thời; `Set` chỉ giúp xử lý trùng trong một cấu trúc Java, không tự đảm bảo constraints liên tiến trình.
