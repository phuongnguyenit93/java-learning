- question: Trong `order.place()`, receiver, method call và call stack hoạt động thế nào?
  answer: |-
    `order` là **receiver**. Java đánh giá receiver và các argument, chọn chữ ký hợp lệ ở compile time, sau đó thực thi phương thức. Mỗi lời gọi có stack frame cho biến cục bộ và tham số; các lời gọi lồng nhau tạo frame mới, rồi trả về hoặc thoát bằng exception.

    Với instance method được override, JVM thực hiện **dynamic dispatch** theo runtime class của receiver. Khả năng gọi method nào trước hết vẫn bị giới hạn bởi declared type của biểu thức.

    Nếu receiver null, gọi instance method phát sinh `NullPointerException`. Khi debug, stack trace cho biết đường đi của lời gọi; xác định method nào nắm trách nhiệm kiểm tra state sẽ hữu ích hơn việc chỉ tìm dòng ném exception.
