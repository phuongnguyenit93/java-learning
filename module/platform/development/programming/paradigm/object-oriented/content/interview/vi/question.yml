- question: Làm sao nhận diện thiết kế thiếu abstraction và thiết kế quá nhiều abstraction?
  answer: |-
    **Thiếu abstraction**: cùng một quy tắc tính giá bị chép vào controller, UI, batch; mỗi nơi tự xử lý làm tròn và input sai khác nhau. Hướng sửa: đưa quy tắc thành một API/đối tượng có trách nhiệm rõ.

    **Thừa abstraction**: lớp đơn giản phải qua `IManager`, `AbstractManagerFactory`, `GenericExecutor` nhưng vẫn chỉ có một implementation và client phải ép kiểu hoặc truyền chuỗi lệnh. Hướng sửa: loại tầng không tạo giá trị, giữ hợp đồng nhỏ, tên miền nghiệp vụ và số chiều mở rộng tương ứng với yêu cầu thực tế.
