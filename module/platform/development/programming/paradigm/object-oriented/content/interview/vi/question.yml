- question: Một use case specification đủ hữu ích cho lập trình và kiểm thử cần có những phần nào?
  answer: |-
    Tối thiểu có mã/tên, actor và mục tiêu, trigger, **preconditions**, luồng thành công, các luồng thay thế/thất bại, **postconditions** và business rules liên quan. Ví dụ UC-ENROLL-01: chọn khóa, kiểm tra student active/prerequisite/capacity, tạo enrollment, giảm ghế còn, trả receipt.

    Nêu các lỗi như tài khoản khóa, môn tiên quyết thiếu, lớp đầy và đăng ký trùng; ghi rõ state có đổi không. Use case không nhất thiết quy định cấu trúc database hay tên framework. Các tình huống biên giúp nhóm thiết kế nhận ra những trách nhiệm mà một luồng happy path đơn giản thường bỏ qua.
