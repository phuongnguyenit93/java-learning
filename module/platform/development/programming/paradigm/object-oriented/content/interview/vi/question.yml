- question: Vì sao nên tách PaymentGateway và PaymentRepository trong CheckoutService? Fake kiểm thử những điều gì?
  answer: |-
    PaymentGateway mô tả việc **yêu cầu thu tiền và nhận kết quả** từ provider; PaymentRepository mô tả **lưu/tìm giao dịch** theo request ID. CheckoutService điều phối hai khả năng qua constructor injection. Ranh giới dựa trên **trách nhiệm** nên có thể thay API provider hay database mà business service vẫn dùng hợp đồng thích hợp.

    Fake gateway có thể trả success/failure/timeout mô phỏng; fake repository có thể ghi request đã save và trả kết quả đã lưu. Test kiểm tra số lần charge, cách xử lý lỗi và trạng thái lưu, không chạm dịch vụ thanh toán thật.

    DTO cần nêu rõ số tiền/đơn vị, request ID, trạng thái và ý nghĩa lỗi. Tách interface không tự bảo đảm persistence, transaction hay tính đúng của retry.
