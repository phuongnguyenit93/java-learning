- question: Vì sao verify rằng catalog.priceOf được gọi đúng hai lần có thể làm test giòn khi tối ưu QuoteService?
  answer: |-
    Nếu hợp đồng chỉ hứa **tổng tiền đúng**, một QuoteService tra SKU trùng hai lần và implementation mới gom SKU rồi tra một lần đều hợp lệ. Test verify priceOf("BOOK") times(2) sẽ đỏ sau tối ưu dù invoice vẫn đúng.

    Thay bằng assertion trên subtotal, shipping, total và exception/state khi SKU thiếu, số lượng âm, overflow, trùng dòng. Không assert cấu trúc HashMap hay số lần gọi helper nếu không thuộc contract.

    **Ngoại lệ:** nếu chi phí hoặc một side effect được công bố, ví dụ cổng thanh toán **không được charge hai lần** hoặc catalog có hợp đồng mỗi SKU tối đa một lần, số lần gọi trở thành yêu cầu thực và verify interaction là đúng.
