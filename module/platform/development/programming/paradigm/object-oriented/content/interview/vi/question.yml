- question: private final List và getter trả List có tự bảo vệ trạng thái nội bộ không?
  answer: |-
    Không. `final` chỉ ngăn gán lại reference; caller có thể sửa `ArrayList` nhận từ getter hoặc list đầu vào đã được constructor giữ alias.

    `Collections.unmodifiableList(source)` tạo **view** phản ánh thay đổi ở source; `List.copyOf(source)` thường tạo **snapshot cấu trúc unmodifiable**, không nhận null. Cả hai đều **shallow**, không tự làm phần tử mutable trở nên bất biến.
