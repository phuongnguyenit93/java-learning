- question: Khi nào Anemic Model, DTO hoặc projection vẫn là lựa chọn hợp lý thay vì Rich Model?
  answer: |-
    DTO nhận/trả API, projection đọc báo cáo và một record MonthlySalesReport có mục đích **chuyển dữ liệu**, nên không cần nhét thêm domain behavior giả tạo. Ứng dụng CRUD rất đơn giản ít invariant có thể dùng data model và service minh bạch với chi phí nhỏ hơn nhiều abstraction.

    Rich entity đem lại lợi ích khi có **trạng thái, chuyển trạng thái và invariant phức tạp** phải được giữ nhất quán qua nhiều use case. Một hệ thống có thể dùng rich Order aggregate cùng DTO chỉ để render màn hình.

    POJO/record/JPA entity là loại cấu trúc và công nghệ; rich/anemic là đánh giá nơi **đặt logic nghiệp vụ**, không chỉ số getter/setter.
