- question: Trạng thái, hành vi, trách nhiệm và invariant khác nhau thế nào?
  answer: |-
    **State** là dữ liệu hiện có; **behavior** là thao tác; **responsibility** giải thích đối tượng chịu trách nhiệm về quy tắc gì; **invariant** là điều kiện luôn phải đúng sau mỗi thao tác công khai thành công hoặc thất bại.

    Ví dụ `BankAccount` có số dư là state, `withdraw` là behavior, trách nhiệm là kiểm soát tiền, invariant `balance >= 0`. Constructor và mọi phương thức có thể đổi số dư đều phải kiểm tra điều kiện thích hợp.

    Một object có thể có nhiều method nhưng trách nhiệm vẫn nên gắn kết. Đừng nhầm hành vi với setter tùy ý: `setBalance(-100)` không bảo vệ invariant. Test cần kiểm tra cả **state sau trường hợp bị từ chối**, không chỉ exception.
