- question: Làm sao bảo đảm thanh toán bị từ chối không làm thay đổi số dư ví hoặc ghi nhận phí sai?
  answer: |-
    Với ví dụ mô phỏng: thẻ phải active và không vượt hạn mức, phí khi thành công là 2% làm tròn xuống; chuyển khoản phải trong hạn mức, phí 5.000 VND; ví cần đủ số dư, phí 0. Khi DECLINED, feeVnd và totalPaidVnd đều là 0, không trừ ví; dữ liệu request không hợp lệ bị chặn trước khi gọi pay.

    Kiểm thử bằng PaymentResult và **trạng thái sau lời gọi**: ví đủ tiền giảm đúng amountVnd, ví thiếu tiền giữ nguyên, thẻ khóa và vượt hạn mức tạo DECLINED, các số tiền của giao dịch từ chối bằng 0. Quy tắc phí là giả lập, không tương đương giao dịch ngân hàng thật.

    Trong môi trường production, cần tách ý nghĩa attempt, authorization, capture và settlement; tránh xem một boolean SUCCESS của demo là bằng chứng tiền đã thực sự được thanh toán.
