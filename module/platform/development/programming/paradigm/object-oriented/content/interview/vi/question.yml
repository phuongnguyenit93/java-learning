- question: 'Chuyển Employee từ phòng A sang B nhưng B đã đầy: vì sao phải validate trước khi sửa liên kết ở A?'
  answer: |-
    Nếu xóa e khỏi `A.members` và đặt `e.department = null` trước khi biết B không còn capacity, lỗi ở B khiến liên kết cũ bị mất hoặc hai phía sai lệch. Hãy xác thực phòng đích tồn tại, capacity còn đủ và các điều kiện khác **trước khi commit** các thay đổi trong memory.

    Với môi trường nhiều luồng, precheck tách rời update vẫn có race: hai luồng cùng thấy một ghế trống. Cần lock/transaction hoặc conditional update tại ranh giới nhất quán, kèm test concurrency. Không suy luận một chuỗi lệnh Java đơn luồng tự biến thành transaction DB.
