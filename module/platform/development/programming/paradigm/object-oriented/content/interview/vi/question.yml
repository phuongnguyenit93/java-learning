- question: Một subtype nhận ít loại input hơn supertype hoặc trả kết quả yếu hơn cam kết; LSP bị vi phạm thế nào?
  answer: |-
    Theo **Liskov Substitution Principle**, subtype không được **thắt chặt precondition** của method so với supertype (từ chối input mà contract cha cho phép), và không được **làm yếu postcondition** (trả ít bảo đảm hơn sau thành công). Nó cũng phải duy trì invariant và tác động/semantics lỗi mà client được hứa.

    Ví dụ DiscountPolicy.apply(amount) cho phép amount >= 0, kết quả nằm trong khoảng 0..amount. Một subtype tự ý không nhận amount = 0, trả số âm hoặc số lớn hơn amount là sai contract dù return type vẫn là long.

    Một subtype được phép **xử lý thêm input** hoặc cho kết quả có bảo đảm mạnh hơn, miễn vẫn tương thích nghĩa chung. Hãy viết contract tests chạy trên mọi implementation với đầu vào biên và trường hợp lỗi.
