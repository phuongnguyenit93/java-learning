- question: 'Hai implementation cùng interface nhưng một bên đòi input chặt hơn: tại sao đó là rủi ro LSP?'
  answer: |-
    Theo **Liskov Substitution Principle**, nơi đang dùng supertype theo hợp đồng phải dùng được subtype mà không phá giả định hợp lệ. Implementation không nên **tăng tiền điều kiện** so với interface, vì nó có thể từ chối một input vốn hợp lệ cho caller.

    Ví dụ `DiscountPolicy.netCents(price)` cho phép mọi `price >= 0`, nhưng `StrictMinimumDiscount` chỉ nhận `price >= 50`: caller dùng interface truyền giá 0 bị lỗi. Tương tự, subtype không được nới lỏng hậu điều kiện quan trọng hoặc phá invariant mà client dựa vào. Hợp lệ cú pháp `implements` chưa đủ để thay thế về hành vi.
  aiGenerated: true
  reviewed: false
  readmeRelated:
