- question: 'Dự đoán kết quả: overload chọn theo kiểu Animal nhưng override chạy ở SpecialHandler ra sao?'
  answer: |-
    Cho `Dog extends Animal`; `Handler` định nghĩa `process(Animal)` và `process(Dog)`; `SpecialHandler extends Handler` chỉ override `process(Animal)`.

    ```java
    Handler h = new SpecialHandler();
    Animal a = new Dog();
    System.out.println(h.process(a));           // SpecialHandler/Animal
    System.out.println(h.process(new Dog()));   // Handler/Dog
    ```

    Dòng một: `a` có **kiểu tĩnh Animal** nên chọn `process(Animal)`, rồi dispatch tới override của SpecialHandler. Dòng hai: biểu thức `new Dog()` có kiểu Dog nên chọn overload `process(Dog)`, không bị override; dùng bản Handler. Đây là hai giai đoạn độc lập, không phải JVM đổi overload theo runtime argument.
