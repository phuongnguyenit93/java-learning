- question: PaymentProcessor nhận PaymentMethod qua constructor thay vì switch theo loại thanh toán. Cơ chế OOP nào được sử
    dụng?
  answer: |-
    PaymentMethod định nghĩa hợp đồng pay(request); CardPayment, BankTransferPayment và EWalletPayment triển khai theo các quy tắc riêng. PaymentProcessor giữ một tham chiếu kiểu interface và gọi method.pay(request). JVM thực hiện **dynamic dispatch** dựa vào implementation thực tế của đối tượng; processor không cần instanceof hay switch.

    Đây là **đa hình qua interface kết hợp composition và constructor injection**. Khi thêm cách thanh toán mới, chủ yếu tạo implementation và lắp tại composition root; processor giữ hợp đồng ổn định. Test có thể truyền fake PaymentMethod để xác minh processor điều phối đúng mà không chạy logic thẻ/ví thật.

    Đa hình không thay thế việc định nghĩa chung hợp đồng kết quả: mọi implementation phải trả PaymentResult nhất quán về SUCCESS/DECLINED, phí, số tiền đã trả và tác dụng phụ.
