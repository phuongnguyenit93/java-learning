- question: Khi review CheckoutManager dùng List<long[]>, static totalPaidVnd và new ConsoleGateway(), bạn chỉ ra vấn đề nào
    bằng bằng chứng?
  answer: |-
    List<long[]> buộc người đọc nhớ item[0] là giá và item[1] là số lượng, không bảo vệ đầu vào; multiplication/addition của long có thể overflow nếu không kiểm tra. static mutable totalPaidVnd gom trạng thái toàn cục giữa các instance và tiềm ẩn race; tự new ConsoleGateway khiến test không thể điều khiển nhánh từ chối.

    Đề xuất OrderLine/Order sở hữu dữ liệu và phép tính; CheckoutService điều phối; PaymentGateway là dependency được inject; SalesLedger ghi nhận khoản chấp nhận. Dùng Math.multiplyExact/addExact cho số học nguy hiểm, validate đầu vào, không ghi ledger nếu cổng từ chối.

    Review tốt phải chỉ ra **dòng gây rủi ro → hậu quả cụ thể → thay đổi đề xuất → test tái hiện**, thay vì chỉ tuyên bố 'vi phạm SRP/SOLID'. Phân biệt lỗi đã tái hiện, code smell và trade-off chấp nhận được.
