- question: Điều gì xảy ra khi constructor superclass gọi một instance method được subclass override?
  answer: |-
    **Dynamic dispatch vẫn diễn ra**, ngay cả khi object subclass **chưa chạy field initializer và constructor body của nó**. Override của subclass có thể đọc field còn giá trị mặc định (`null`, `0`, `false`) và gặp lỗi.

    ```java
    class Parent {
        Parent() { print(); }
        void print() {}
    }
    class Child extends Parent {
        String name = "ready";
        @Override void print() { System.out.println(name); }
    }
    ```

    `new Child()` in `null`, không phải `ready`, do initializer của Child chưa chạy tại thời điểm Parent gọi `print()`. Tránh gọi overridable method từ constructor; dựng object hợp lệ trước khi gọi extension hook.
