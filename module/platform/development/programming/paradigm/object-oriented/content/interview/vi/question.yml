- question: Một class implements hai interface Quackable và Swimmable có tự là subtype của interface AmphibiousVoice extends
    cả hai không?
  answer: |-
    **Không.** Java không suy ra một quan hệ nominal kiểu mới chỉ vì class thỏa đầy đủ cấu trúc method. Nếu `interface AmphibiousVoice extends Quackable, Swimmable {}`, một class implements riêng Quackable và Swimmable không tự implements AmphibiousVoice.

