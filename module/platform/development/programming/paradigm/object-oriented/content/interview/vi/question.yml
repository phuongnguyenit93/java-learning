- question: Hai biến alias cùng instance khác gì hai instance có dữ liệu giống nhau?
  answer: |-
    Hai biến alias trỏ đến cùng object: sửa qua một biến thì biến kia thấy kết quả. Hai lần `new` tạo state độc lập ngay cả khi constructor nhận giá trị giống hệt.

