- question: Tại sao record ArrayKey(byte[]) chưa phải value object bất biến và List.copyOf khác Collections.unmodifiableList
    ra sao?
  answer: |-
    Record tạo accessor, constructor và equals/hashCode theo **component**, nhưng component byte[] vẫn mutable; equals của mảng mặc định so sánh tham chiếu, nên hai mảng khác nhau có nội dung giống nhau chưa chắc bằng nhau. Caller còn có thể sửa mảng sau khi truyền vào record.

    Cách khắc phục là defensive copy ở đầu vào/đầu ra và định nghĩa equals/hashCode theo Arrays.equals/Arrays.hashCode, hoặc dùng biểu diễn giá trị bất biến phù hợp. Nếu dùng List chứa phần tử mutable, copy list chỉ bảo vệ cấu trúc, không làm phần tử thành bất biến.

    Collections.unmodifiableList(original) là view không sửa được qua wrapper nhưng có thể phản ánh thay đổi của original; List.copyOf tạo snapshot cấu trúc (và từ chối phần tử null). Test nên thử sửa collection gốc sau khi tạo object rồi xác minh invariant/hash vẫn giữ.
