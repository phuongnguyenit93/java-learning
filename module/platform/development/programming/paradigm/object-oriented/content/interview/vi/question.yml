- question: Khi stakeholder chỉ nói 'độc giả mượn sách còn sẵn', bạn cần hỏi thêm gì trước khi thiết kế class?
  answer: |-
    Hỏi về **bản sách** hay đầu sách, tình trạng tài khoản, giới hạn số bản đang mượn, có đặt trước không, thời hạn trả, trễ hạn và trường hợp chưa có bản nào. Hỏi tiếp liệu hai độc giả cùng chọn **bản cuối**, retry cùng request và thao tác trả bị lặp phải xử lý ra sao.

    Để tránh tự suy đoán, dùng phỏng vấn theo tình huống, quan sát quy trình, workshop ví dụ/phản ví dụ và xác nhận quy tắc với người có thẩm quyền. Chuyển câu trả lời thành use case, rule có ID và acceptance criteria; điều chưa xác nhận phải được ghi là **giả định/câu hỏi mở**, không âm thầm code thành chính sách.
