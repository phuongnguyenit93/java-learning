- question: Tại sao new Child() lần đầu chạy static Parent/Child theo thứ tự khác với lần thứ hai? Thứ tự instance initialization
    thế nào?
  answer: |-
    Trong tình huống new Child kích hoạt việc **class initialization lần đầu**, các static field initializer và static block của Parent chạy trước các phần static tương ứng của Child; trong từng class, chạy theo thứ tự văn bản nguồn. Với lần tạo tiếp theo, các class đã được khởi tạo thì không thực hiện lại phần static.

    Đối với **mỗi instance Child**, các field bắt đầu có giá trị mặc định; chuỗi constructor đi về phía superclass. Phần instance field initializer/block của Parent chạy trước thân constructor Parent; sau đó phần tương ứng của Child mới chạy, rồi thân constructor Child. Nếu có nhiều cấp thì khởi tạo từ tổ tiên xuống lớp cụ thể. Phân biệt class loading với class initialization; static không đồng nghĩa chạy một lần trong toàn bộ JVM bất kể class loader.
