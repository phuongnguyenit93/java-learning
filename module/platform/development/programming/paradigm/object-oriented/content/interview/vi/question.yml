- question: WeakReference và WeakHashMap có bảo đảm không bao giờ leak không?
  answer: |-
    **WeakReference** không giữ referent sống nhờ strong reachability. Nếu không còn strong reference từ nơi khác, referent có thể được GC thu gom; thời điểm weak.get() trả null không xác định. API dùng weak reference phải chịu được việc object biến mất giữa những thời điểm sử dụng.

    **WeakHashMap** giữ key theo weak reference nhưng value được map giữ mạnh. Nếu value tham chiếu ngược đến key, key có thể vẫn reachable qua map → value → key; việc weak key không tự giải phóng toàn bộ graph. Còn phải xét concurrency, eviction semantics và resource ownership; weak reference không có hợp đồng close file/socket.
  aiGenerated: true
