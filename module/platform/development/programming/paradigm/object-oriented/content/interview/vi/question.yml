- question: Cách thiết kế một method thay đổi nhiều state để tránh cập nhật dở dang khi thất bại?
  answer: |-
    Hợp đồng method cần rõ tiền điều kiện, hậu điều kiện, side effect và lỗi. Ví dụ chuyển tiền phải kiểm tra số tiền dương, tài khoản tồn tại, không tự chuyển, nguồn đủ tiền và số dư đích không tràn.

    Dùng `Math.addExact` kiểm tra số dư đích **trước** khi trừ nguồn; nếu có lỗi thì cả hai balance giữ nguyên. Hoặc dựng state mới ở cấu trúc tạm, kiểm tra invariant rồi mới commit.

    Cách này chỉ giải quyết phần trong bộ nhớ và scope đồng bộ thích hợp. Nếu đã gửi API thanh toán hoặc ghi database bên ngoài, cần transaction/idempotency/compensation; không thể chỉ dựa vào class để bảo đảm atomicity xuyên hệ thống. Test nên so sánh state trước/sau lần lỗi.
