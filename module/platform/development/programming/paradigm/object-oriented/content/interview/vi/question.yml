- question: Single Responsibility Principle nói một class chỉ được có một method có đúng không? Hãy phân tích Invoice có addLine,
    totalCents và issue.
  answer: |-
    **Không.** SRP nói class/module nên có **một nhóm lý do thay đổi nhất quán**, thường nhìn theo nhóm tác nhân đưa ra yêu cầu. Invoice.addLine(), totalCents() và issue() cùng bảo vệ **vòng đời và invariant hóa đơn**: dòng hợp lệ, tổng đúng, không phát hành hóa đơn rỗng/lặp. Chúng là nhiều method nhưng một trách nhiệm miền mạch lạc.

    Nếu Invoice còn tự render PDF, mở SQL và gửi SMTP, lớp sẽ thay đổi khi thiết kế báo cáo, công nghệ lưu trữ hoặc email đổi dù luật hóa đơn không đổi. Khi đó nên tách InvoiceFormatter, repository và delivery adapter, giữ một application service điều phối.

    Tách từng method thành một service chỉ để đạt tỷ lệ một method/lớp còn có thể làm **thất lạc invariant** và tăng coupling.
