- question: Dùng JUnit 5 parameterized test chạy cùng một hợp đồng cho nhiều implementation có lợi gì so với chép test sang
    hai class?
  answer: |-
    Một **nguồn đặc tả chung** tránh trường hợp implementation A được kiểm tra biên, còn B bỏ sót, hoặc test giữa hai lớp âm thầm chọn những semantics khác nhau. Với nguồn fixture cho mỗi implementation, mọi input và các assertion giống nhau được chạy lặp.

    Ví dụ giả định có interface IntSet và hai class hợp lệ:

    ~~~java
    @org.junit.jupiter.params.ParameterizedTest
    @org.junit.jupiter.params.provider.MethodSource("factories")
    void duplicateValueDoesNotChangeSize(java.util.function.Supplier<IntSet> maker) {
        IntSet set = maker.get();
        org.junit.jupiter.api.Assertions.assertTrue(set.add(5));
        org.junit.jupiter.api.Assertions.assertFalse(set.add(5));
        org.junit.jupiter.api.Assertions.assertEquals(1, set.size());
    }
    ~~~

    MethodSource factories phải được định nghĩa trong test class để trả Stream<Arguments> tương ứng; đoạn mã là method trích riêng, không phải file hoàn chỉnh. Ngoài contract tests, vẫn cần **implementation-specific tests** cho persistence adapter, caching, performance hoặc cấu hình riêng.
  aiGenerated: true
  reviewed: false
  readmeRelated:
    file: 19.Testing/knowledge/Testing.md
