- question: Một cây kế thừa có độ sâu A→B→C→D→E gây những chi phí bảo trì nào?
  answer: |-
    Độ sâu buộc người đọc theo dõi **constructor chain, field chung, nhiều tầng override và super.method()** mới hiểu kết quả. Thay đổi hành vi ở A có thể ảnh hưởng D/E mà không sửa code ở lá, tạo **fragile base class**. Test và xác định phạm vi ảnh hưởng trở nên khó hơn.

    Nhiều chiều biến thể độc lập (khu vực, tốc độ, thời điểm, loại khách) còn có thể khiến số subclass tăng theo tổ hợp. Nhưng không nên kết luận cứ kế thừa sâu là chậm runtime: JIT, inlining và code thực tế mới quyết định hiệu năng; chi phí thiết kế/bảo trì là vấn đề nổi bật hơn.
