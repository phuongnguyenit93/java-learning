- question: Entity khác value object như thế nào khi thiết kế Order và Sku?
  answer: |-
    Order thường mang **identity** nghiệp vụ qua orderId; hai Order có cùng tổng tiền vẫn là hai đơn khác nhau. Sku đại diện **giá trị** đã chuẩn hóa; ' ab-01 ' và 'AB-01' được coi là cùng mã nếu constructor chuẩn hóa trim, uppercase bằng Locale.ROOT và validate quy tắc hợp lệ.

    Với tham chiếu object, == kiểm tra cùng đối tượng; equals có thể biểu diễn cùng giá trị nghiệp vụ. Value object nên bất biến, validate ngay lúc tạo và có equals/hashCode nhất quán. Record tiện khi các component tự có ngữ nghĩa giá trị phù hợp, nhưng không tự làm deep immutable.

    Không dùng toàn bộ field mutable của entity làm hash key: khi trạng thái Order đổi, hash/equality có thể đổi và gây lỗi trong HashMap/HashSet.
