- question: Kiểm thử constructor của Invoice có thể bắt những lỗi nào ngoài null input?
  answer: |-
    Constructor là **ranh giới tạo object hợp lệ**. Với Invoice, kiểm thử customerId nonblank, dòng hàng không rỗng, số lượng dương, đơn giá không âm, discount trong miền 0..subtotal và tính toán không overflow.

    Các case nên bao gồm cả **giá trị biên** như discount=0, discount=subtotal, một dòng hợp lệ, discount>subtotal và subtotal overflow. Sau khi tạo thành công, thay đổi List đầu vào không được âm thầm sửa invoice nếu contract yêu cầu snapshot.

    Kiểm tra đường từ chối bằng assertThrows với đúng loại exception; **không chỉ so nguyên văn message** khi message không thuộc contract. Constructor không nên công bố reference this trước khi hoàn thành hoặc gây side effect ngoài như gửi thư trước validation nếu nó có thể thất bại.
