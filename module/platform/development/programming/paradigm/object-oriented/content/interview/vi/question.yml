- question: Phân biệt multiplicity 1, 0..1, 1..* và 0..*. Một reference đơn có tự bảo đảm đúng một không?
  answer: |-
    `1` là chính xác một; `0..1` là tùy chọn và tối đa một; `1..*` là ít nhất một; `0..*` là không giới hạn số lượng tối thiểu hoặc tối đa hữu hạn. Một field `Department department` trong Java có thể bằng `null`, nên **không tự bảo đảm** multiplicity `1`.

    Để duy trì `1`, constructor/method phải từ chối null và cấm chuyển sang trạng thái không có liên kết, kể cả khi tái dựng từ DB. Với `1..*`, collection không được rỗng trong các trạng thái hợp lệ và việc xóa phần tử cuối cần được định nghĩa. Multiplicity khác quyền sở hữu.
