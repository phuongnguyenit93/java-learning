- question: Nếu API discount đảm bảo số tiền sau giảm nằm trong [0, price], implementation trả số âm hoặc lớn hơn price có
    hợp đồng đúng không?
  answer: |-
    Không. Với input hợp lệ `price >= 0`, hậu điều kiện là `0 <= netCents <= price`. Trả âm hay tăng tiền lên lớn hơn giá gốc phá cam kết dù method có return type `long` và code biên dịch được.

    Nên kiểm tra tại implementation hoặc tầng điều phối có trách nhiệm và dùng **contract tests** chạy với tất cả policy. Nếu một sản phẩm thực sự có phụ phí, hợp đồng ban đầu phải được thiết kế lại hoặc tách hành vi; không thể âm thầm đổi nghĩa `netCents` ở một subtype.
