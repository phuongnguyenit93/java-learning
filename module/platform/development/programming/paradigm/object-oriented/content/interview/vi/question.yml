  answer: |-
    Hãy **thiết kế abstraction theo capability ổn định** của client. Ví dụ Shape/Measurable có area() hoặc perimeter() mà cả Rectangle và Square đều đáp ứng. Mỗi concrete type giữ invariant riêng; client đo diện tích không cần giả định setter chiều rộng/chiều cao độc lập.

