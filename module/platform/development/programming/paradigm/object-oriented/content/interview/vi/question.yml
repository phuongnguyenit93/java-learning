- question: Nên phân biệt business rejection, invalid input và lỗi hạ tầng trong một method reserveStock như thế nào?
  answer: |-
    Hợp đồng phải định nghĩa **preconditions, success result, rejection, exceptions và invariant sau failure**. Với reserveStock: yêu cầu qty < 0 là input sai (có thể IllegalArgumentException); đủ hàng trả Reserved; hết hàng là **từ chối nghiệp vụ dự kiến** (ví dụ Result.Rejected(OUT_OF_STOCK)); database timeout là lỗi hạ tầng, không được đánh tráo thành OUT_OF_STOCK.

    Một Result type có trạng thái rõ thường phù hợp các kết quả nghiệp vụ bình thường; exception phù hợp vi phạm hợp đồng hoặc lỗi bất thường. Không dựa vào parsing getMessage() như error code, vì message có thể thay đổi hoặc được bản địa hóa.

    Test success, quantity không hợp lệ, không đủ hàng và DB failure; kiểm tra **state sau từng thất bại**, tránh đặt hết hàng thành lỗi hệ thống hoặc che lỗi mạng.
