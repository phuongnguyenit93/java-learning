- question: final class, final List<Item> và record Event(List<Item>) có đủ bảo đảm deep immutability không?
  answer: |-
    **Không.** final class chỉ ngăn kế thừa; final field chỉ ngăn gán lại tham chiếu; record tạo thành phần final nhưng có thể vẫn tham chiếu tới object mutable. Sửa List hoặc Item ở nơi khác vẫn có thể thay đổi trạng thái quan sát được.

    Muốn object immutable, cần khởi tạo đầy đủ, không có đường mutation, dùng defensive copy với đầu vào/đầu ra mutable và đánh giá cả graph đối tượng lồng nhau. Ví dụ List.copyOf(input) phù hợp với List<String> bởi String bất biến; còn List<MutableItem> vẫn có thể đổi trạng thái phần tử được chia sẻ.
