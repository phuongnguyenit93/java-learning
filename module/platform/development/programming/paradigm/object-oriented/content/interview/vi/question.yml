    Khi cần bảo đảm ghi đơn và lưu ý định phát event cùng nhau, cân nhắc transactional outbox, consumer idempotent và giám sát. Nếu nghiệp vụ cần phản hồi đồng bộ, orchestrator gọi rõ các bước có thể phù hợp hơn.
