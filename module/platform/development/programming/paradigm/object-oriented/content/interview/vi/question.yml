- question: Precondition, postcondition và invariant khác nhau về thời điểm và trách nhiệm?
  answer: |-
    **Precondition** mô tả yêu cầu trước lời gọi, thường là trách nhiệm của caller (implementation vẫn có thể validate). **Postcondition** mô tả kết quả khi phương thức hoàn tất thành công. **Invariant** phải được duy trì tại các thời điểm object có thể được quan sát ở trạng thái hợp lệ.

    Có thể diễn đạt dạng `{P} operation {Q}`; ví dụ với ghế, P gồm `n > 0` và đủ ghế, Q gồm số ghế giảm đúng n. Trạng thái sau lỗi cũng cần hợp đồng riêng: phương thức có giữ nguyên state không? Đây không phải điều đương nhiên với mọi exception hoặc side effect bên ngoài.
