- question: 'Một lớp giữ Date hoặc byte[] từ constructor: vì sao chỉ clone trong getter vẫn có thể bị sửa từ ngoài?'
  answer: |-
    Nếu constructor giữ trực tiếp object đầu vào, caller vẫn có reference gốc và có thể sửa **sau khi khởi tạo**, làm thay đổi nội bộ mà không qua API. Getter có clone chỉ chặn được đường rò rỉ **đầu ra**, không chặn đường đầu vào.

    Ví dụ với mảng:

    ```java
    final class Token {
        private final byte[] bytes;
        Token(byte[] source) { this.bytes = source.clone(); }
        byte[] copyBytes() { return bytes.clone(); }
    }
    ```

    Cần quyết định liệu nội dung mảng có nhạy cảm hay không (trường hợp bí mật còn cần chính sách bảo mật/xóa bộ nhớ); nếu dữ liệu là thời gian, có thể chọn `Instant` bất biến thay vì `Date` mutable.
