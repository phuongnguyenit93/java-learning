- question: Overload được phân biệt bằng yếu tố nào? Chỉ đổi return type hoặc thêm default argument có được không?
  answer: |-
    Java phân biệt overload bằng **danh sách tham số** (số lượng, kiểu hoặc thứ tự kiểu). Chỉ đổi return type không tạo overload hợp lệ. Compiler chọn overload dựa trên kiểu biểu thức và quy tắc chuyển đổi/varargs; khác với override được dispatch theo runtime receiver.

    Java không hỗ trợ cú pháp tham số mặc định `f(int n = 10)`. Có thể khai báo overload `f()` gọi `f(10)` hoặc dùng varargs khi ngữ cảnh phù hợp. Tránh overload mơ hồ với null hay nhiều quy tắc ép kiểu.
