- question: abstract class và abstract method trong Java dùng để giải quyết điều gì? Nêu khả năng và giới hạn chính.
  answer: |-
    `abstract class` định nghĩa một kiểu **không thể tạo instance trực tiếp**, có thể lưu state chung, constructor, phương thức có thân, và điểm mở rộng abstract. `abstract method` chỉ khai báo hành vi; một subclass concrete phải cung cấp implementation phù hợp (trực tiếp hoặc kế thừa).

    ```java
    abstract class Shape {
        abstract double area();
    }
    final class Circle extends Shape {
        private final double r;
        Circle(double r) { this.r = r; }
        @Override double area() { return Math.PI * r * r; }
    }
    ```

    Có thể giữ biến `Shape x = new Circle(2)`; nhưng `new Shape()` là lỗi biên dịch. Abstract class không bắt buộc phải có abstract method.
