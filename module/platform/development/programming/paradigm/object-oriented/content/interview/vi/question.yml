- question: Sơ đồ đối tượng khác sơ đồ lớp về cách thể hiện danh tính, giá trị và liên kết như thế nào?
  answer: |-
    Class diagram mô tả **kiểu và ràng buộc có thể có**; object diagram là **snapshot của instance cụ thể tại thời điểm đã chọn**. Thay vì hộp `Order` hoặc thuộc tính `status: Status`, một object diagram ghi `o01:Order`, `status = DRAFT`, và link tới `c01:Customer`.

    Hai order cùng tham chiếu `c01` thì sơ đồ chỉ có **một hộp customer**, không vẽ hai object khác nhau vì cùng xuất hiện hai lần trong association. Nếu hai customer có cùng tên nhưng identity khác, cần hai hộp. Snapshot có thể thiếu link vì cố ý lược bỏ; phải ghi rõ phạm vi đầy đủ trước khi coi đó là lỗi.
