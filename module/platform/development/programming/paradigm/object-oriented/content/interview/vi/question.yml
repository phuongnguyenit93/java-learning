- question: Association, aggregation, composition sở hữu mạnh và dependency tạm thời được phân biệt bởi điều gì?
  answer: |-
    - **Association:** Order biết Customer; không đồng nghĩa Order sở hữu vòng đời Customer.
    - **Aggregation:** Team có các Player, thành viên thường tồn tại độc lập và có thể được chia sẻ.
    - **Composition theo mô hình sở hữu mạnh:** Order sở hữu các OrderLine đã được chốt; Order kiểm soát việc thêm/sửa và vòng đời nghiệp vụ của dòng hàng.
    - **Dependency tạm thời:** hàm export nhận Formatter bằng tham số, chỉ cần collaborator trong lời gọi.

    Trong Java cả association lẫn composition có thể hiện ra dưới dạng field reference, nên **không thể suy quyền sở hữu chỉ từ cú pháp**. Một field private final cũng không làm object con bất biến, không loại bỏ alias ở nơi khác và không buộc GC thu gom object con cùng object cha.
