- question: Spring singleton bean với mutable state có nguy cơ gì?
  answer: Một singleton bean mặc định tồn tại theo **ApplicationContext** và có thể phục vụ nhiều request đồng thời. Field
    lưu token hoặc currentUser có thể bị request khác ghi đè. Ưu tiên stateless service, đưa state qua tham số hoặc object
    cục bộ; nếu có shared state thì cần concurrency policy. Test nhiều request đồng thời và xác nhận không lẫn dữ liệu, thay
    vì chỉ test bean identity.
