- question: Association, aggregation, composition, generalization, realization và dependency khác nhau như thế nào?
  answer: |-
    Đường liền giữa hai class thường biểu diễn **association**. Hình thoi rỗng ở đầu whole là **aggregation** lỏng (part tồn tại độc lập), hình thoi đặc ở đầu whole là **composition** với ownership vòng đời mạnh. Nét liền + tam giác rỗng hướng tới superclass là **generalization**; nét đứt + tam giác rỗng tới interface là **realization**.

    Dependency thường là **đường đứt có mũi tên mở** từ client tới supplier. Chọn kiểu quan hệ theo hợp đồng nghiệp vụ, không kết luận chỉ từ việc Java có `List<T>`, `new`, `@OneToMany` hay injection. Ví dụ OrderLine thuộc Order có thể composition; Product độc lập được dòng tham chiếu thường chỉ association.
  aiGenerated: true
