- question: Entity, value object, actor và service khác nhau ở vai trò nào? Cho ví dụ trong thư viện.
  answer: |-
    **Entity** có danh tính ổn định và vòng đời: Member, BookCopy, Loan. **Value object** thường so sánh theo giá trị và tránh state mutable không cần thiết: Money, DateRange, ISBN được validate. **Actor** là vai trò tương tác với hệ thống (độc giả, thủ thư), không bắt buộc tương ứng một class cùng tên.

    **Application service/use case** điều phối các entity/repository/adapter để hoàn thành hành động như `BorrowCopy`; không nên giữ tất cả invariant nội tại thay cho entity. Phân loại theo hành vi và trách nhiệm thực tế, không chỉ dựa vào suffix Entity/DTO/Service hoặc bảng database.
