- question: CheckoutService tự tạo CardGateway, truy vấn SQL và gửi email. Thiết kế lại để giảm coupling mà không tạo abstraction
    giả ra sao?
  answer: |-
    Tách **hợp đồng nghiệp vụ** khỏi adapter chi tiết. Domain giữ các quy tắc như số tiền hợp lệ và chuyển trạng thái đơn. Application CheckoutService điều phối giao dịch qua các port thích hợp như PaymentGateway, OrderRepository, ReceiptSender. Infra adapter thực hiện HTTP, SQL và SMTP. Dependency có thể được cấp bằng constructor.

    Điều quan trọng là **hướng phụ thuộc và semantics**. Một interface chỉ là bản sao API vendor, lộ HTTP status hoặc exception riêng của SDK, vẫn làm business bị gắn chặt. Test service với fake để kiểm tra success/failure, còn contract/integration test bảo đảm adapter đúng lời hứa.

    Không bắt buộc tạo interface cho mọi utility hoặc lớp ổn định; hãy đặt abstraction tại nơi cần thay đổi độc lập hoặc che công nghệ bên ngoài.
