- question: Java có pass-by-reference khi truyền object vào method không?
  answer: |-
    Java **luôn pass-by-value**: đối với reference type, thứ được sao chép là **giá trị tham chiếu**, không phải toàn bộ object. Method có thể sửa state của object chung, nhưng gán lại tham số không làm biến của caller trỏ tới object mới.

    Đoạn mã chạy được sau đây in `2`:

    ```java
    class Demo {
        static class Box { int n = 1; }
        static void change(Box b) {
            b.n = 2;
            b = new Box();
            b.n = 99;
        }
        public static void main(String[] args) {
            Box box = new Box();
            change(box);
            System.out.println(box.n); // 2
        }
    }
    ```

    Nên phân biệt **alias cùng object** với **reassign biến tham chiếu cục bộ**. Điều này cũng lý giải vì sao thay object của tham số không thay tham chiếu bên ngoài.
