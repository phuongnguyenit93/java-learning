- question: Kế thừa private field có nghĩa gì? Vì sao subclass không đọc được field đó trực tiếp?
  answer: |-
    Trạng thái `private` của superclass **vẫn nằm trong object subclass**, nhưng quyền truy cập trực tiếp bằng tên chỉ dành cho mã được phép của class khai báo theo các quy tắc Java. Đây là khác biệt giữa **được khởi tạo trong object** và **được nhìn thấy như API kế thừa**.

