- question: SOLID giải quyết vấn đề thiết kế nào và điều gì khiến việc tăng số class/interface chưa chắc cải thiện dự án?
  answer: |-
    **SOLID** là năm nguyên tắc định hướng để quản lý trách nhiệm, điểm mở rộng, khả năng thay thế, kích thước hợp đồng và hướng phụ thuộc. Mục tiêu thực tế là **giảm tác động dây chuyền khi yêu cầu thay đổi**, giữ logic dễ kiểm thử và các implementation tuân thủ hợp đồng.

    Ví dụ CheckoutService vừa tính giảm giá, mở JDBC, gọi payment API và gửi email dễ bị sửa vì nhiều nguồn thay đổi. Có thể tách domain policy, application orchestration và các adapter đúng ranh giới.

    Tuy nhiên SOLID không tự giải quyết bảo mật, transaction, concurrency hay bài toán dữ liệu sai. Nếu một use case đơn giản bị chia thành hàng chục wrapper/interface không có nhu cầu biến đổi, chi phí điều hướng và kiểm thử có thể lớn hơn lợi ích. Đánh giá theo **thay đổi có thật, độ ổn định hợp đồng và chi phí abstraction**, không theo số lượng file.
