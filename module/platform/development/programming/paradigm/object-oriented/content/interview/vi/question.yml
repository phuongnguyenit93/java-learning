- question: Facade khác Controller và Service Layer ở đâu?
  answer: 'Facade có **điểm vào nhỏ, cấp cao**, che sự phối hợp phức tạp: quoteOrder gọi validate, pricing, tax và formatter.
    Controller xử lý ranh giới HTTP; Service Layer tổ chức use case và transaction. Một service có thể đồng thời là Facade
    nhưng không mặc nhiên. Facade giảm coupling client nhưng dễ thành god object; nó không tự tạo distributed transaction
    khi giữ kho và thu tiền ở các hệ khác nhau.'
