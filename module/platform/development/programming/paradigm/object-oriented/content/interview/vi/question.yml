- question: Khi nào downcasting và instanceof có thể chấp nhận, và rủi ro gì nếu cast trực tiếp?
  answer: |-
    Downcast cần dùng khi yêu cầu một capability **không nằm trong kiểu tham chiếu** mà caller đã nhận. Cast trực tiếp `CardPayment card = (CardPayment) m;` gây `ClassCastException` khi runtime object không phải CardPayment hoặc subtype của nó. Với `null`, cast cho ra null và lỗi có thể chỉ xảy ra khi dùng tiếp.

    Có thể dùng `if (m instanceof CardPayment card) { ... }` để bảo vệ nhánh. Nhưng nếu business service liên tục kiểm tra Card/Wallet/Bank chỉ để thực hiện `pay`, đó là dấu hiệu thiếu hợp đồng đa hình; hãy đưa `pay` vào interface. `instanceof` vẫn hữu ích ở boundary xử lý dữ liệu không đồng nhất hoặc capability thật sự tùy chọn.
