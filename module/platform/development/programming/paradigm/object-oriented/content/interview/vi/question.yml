- question: Vì sao System.gc(), finalize() và Cleaner không phải cách chính để đóng file hay kết nối?
  answer: |-
    System.gc() chỉ là yêu cầu/hint, không cam kết thời gian thu gom object. finalize() đã **deprecated for removal**, thiếu tính xác định về thời điểm thực thi và có vấn đề an toàn/hiệu năng. Cleaner có thể hữu ích như **biện pháp dự phòng** trong một số lớp quản lý native resource nhưng không bảo đảm cleanup đúng hạn.

    Với đối tượng giữ file, socket, database connection hay resource tương tự, hãy xác định **ai sở hữu** và gọi close theo hợp đồng API, thường qua try-with-resources. Thu hồi heap memory và đóng external resource là hai vòng đời khác nhau: object đã close vẫn có thể reachable và object hết reference chưa chắc được cleanup kịp thời.
