- question: Observer đồng bộ có nguy cơ exception và reentrancy gì?
  answer: Listener chậm làm publisher chậm; exception không quản lý có thể chặn listener khác. Callback tự gọi lại publisher
    gây reentrancy hoặc vòng lặp sự kiện. Có thể snapshot listener list, định nghĩa error policy và tránh giữ lock khi gọi
    callback ngoài kiểm soát. Test unsubscribe trong callback, callback lồng nhau, listener ném lỗi và concurrent access.
