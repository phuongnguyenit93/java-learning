- question: Phân biệt Adapter, Decorator, Facade và Proxy thế nào?
  answer: '**Adapter** thay giao diện; **Decorator** giữ cùng giao diện và bọc để thêm chức năng; **Facade** cung cấp API
    cấp cao cho một subsystem; **Proxy** đại diện và kiểm soát truy cập/lazy load/remote call. Ví dụ chuyển SDK.sendSms sang
    MessageChannel là Adapter; bọc MessageChannel để retry là Decorator; notifyOrderPaid phối hợp nhiều thành phần là Facade.
    Nhìn mục tiêu và hợp đồng, không chỉ tên class.'
