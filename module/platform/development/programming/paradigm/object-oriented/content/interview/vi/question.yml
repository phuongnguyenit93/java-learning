- question: Vì sao unit test mô phỏng thư viện dùng synchronized không đủ xác nhận invariant cho nhiều server?
  answer: |-
    Một test với hai thread cùng **một object** có thể chứng minh cơ chế synchronized bảo vệ instance đó trong JVM. Nhưng khi hai node có các object cache riêng, cùng yêu cầu mượn `BookCopy` có thể vượt qua kiểm tra rồi ghi hai Loan ACTIVE nếu DB không có khóa/ràng buộc.

    Cần integration test với **transaction thực, DB thật hoặc môi trường tương đương**: chạy hai giao dịch cạnh tranh, kiểm tra chỉ một lượt mượn ACTIVE, số dư/available count và trạng thái sau reload. Unique constraint/index, versioning hoặc row lock là những cách bổ sung tùy mô hình, không chỉ tăng số thread test.
