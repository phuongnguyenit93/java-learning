- question: CQS khác CQRS ở cấp độ nào? Cần hai database khi áp dụng CQRS không?
  answer: |-
    **CQS** là nguyên tắc ở cấp **method/object API**. **CQRS** tổ chức **đường đọc và ghi** ở cấp application/hệ thống, có thể dùng handler/model hoặc nơi lưu trữ riêng theo yêu cầu.

    CQRS **không bắt buộc có hai database**. Nếu read model được cập nhật bất đồng bộ từ write model, query ngay sau command thành công có thể thấy dữ liệu cũ (**eventual consistency**). Khi ấy contract và UI cần xử lý độ trễ đồng bộ.

    Một ứng dụng dùng CQS hiệu quả vẫn không cần CQRS. Chọn CQRS khi yêu cầu hiệu năng/quy mô/mô hình đọc-ghi khác nhau thật sự đủ để bù chi phí.
