- question: Với Enrollment, cách chống đăng ký trùng và hủy một cặp chưa tồn tại nên được thiết kế như thế nào?
  answer: |-
    Có thể dùng key `(studentId, courseId)` để quản lý **active enrollment**; `ENROLL` khi cặp đã tồn tại trả `DUPLICATE_ENROLLMENT` mà không thêm dòng hay gửi thông báo lần nữa. `CANCEL` cho cặp không có active link có thể trả `NOT_ENROLLED` và giữ state.

    Sau khi hủy rồi đăng ký lại, cần quyết định tạo enrollment ID/sequence mới hay kích hoạt lại record cũ theo chính sách lịch sử. Nếu cần bảo vệ concurrency nhiều request, check trong bộ nhớ là chưa đủ: thường cần unique constraint/index và giao dịch phù hợp. Idempotency và error semantics là phần của hợp đồng.
