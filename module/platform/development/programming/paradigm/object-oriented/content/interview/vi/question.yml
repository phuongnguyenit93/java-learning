- question: Wrapper sở hữu nhiều AutoCloseable collaborator cần quản lý close, exception và quyền sở hữu thế nào?
  answer: |-
    Chỉ đóng resource wrapper **thực sự sở hữu**; không đóng dependency mượn hoặc container-managed nếu chưa được giao quyền. Với nhiều resource sở hữu, đóng theo thứ tự phụ thuộc và cố gắng cleanup những resource còn lại dù một close thất bại; xử lý/suppressed exceptions có chủ đích.

    ~~~java
    try (java.io.BufferedWriter writer =
            java.nio.file.Files.newBufferedWriter(path)) {
        writer.write("content");
    }
    ~~~

    Ví dụ giả định path là Path hợp lệ, và nơi gọi xử lý IOException. Try-with-resources đóng writer ngay cả khi body throw. close() và GC là hai sự kiện riêng; nếu cần close idempotent/thread-safe, phải bảo đảm trong implementation thay vì mặc định suy ra từ AutoCloseable.
