- question: Vì sao Animal a = new Dog(); Dog d = (Dog) a hợp lệ, nhưng ép một Cat thành Dog có thể compile được rồi ClassCastException?
  answer: |-
    **Downcasting** biểu thị kỳ vọng reference kiểu rộng đang trỏ object tương thích kiểu hẹp. Cast không cấp phát object hay đổi runtime type. Với Animal a = new Dog(), (Dog) a hợp lệ ở runtime; với Animal a = new Cat(), (Dog) a có thể được compiler cho phép thử cast do quan hệ kiểu, nhưng ném **ClassCastException** khi chạy.

    Sử dụng kiểm tra kiểu trước:

    ~~~java
    if (animal instanceof Dog dog) {
        dog.bark();
    }
    ~~~

    Pattern matching instanceof còn bind biến dog trong scope an toàn. Lạm dụng downcast tại mọi call site thường báo hiệu interface/supertype thiếu capability phù hợp hoặc client đang phụ thuộc concrete implementation.
