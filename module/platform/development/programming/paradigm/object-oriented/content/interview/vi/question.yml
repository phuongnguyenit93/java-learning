- question: Cohesion cao và coupling thấp khác nhau thế nào? Một class ít field và method đã là thiết kế tốt chưa?
  answer: |-
    **Cohesion** xét mức độ state, method và invariant **bên trong một class** cùng phục vụ một trách nhiệm. Cart nắm dòng hàng, validate số lượng và tính tổng thường cohesive; UserManager vừa export CSV, gửi newsletter, xác thực mật khẩu và tính doanh thu có nhiều lý do thay đổi.

    **Coupling** xét việc class phụ thuộc class khác, đặc biệt là phụ thuộc chi tiết, trạng thái và giả định dễ thay đổi. CheckoutService dựa vào hợp đồng PaymentGateway thường giảm ràng buộc với vendor SDK hơn việc tự gọi HTTP bên trong.

    Một class nhỏ vẫn có thể chứa trách nhiệm không liên quan; một coordinator nhiều method vẫn cohesive nếu cùng phục vụ use case. Đánh giá **change impact, contract, invariant và khả năng test**, không đếm dòng code.
