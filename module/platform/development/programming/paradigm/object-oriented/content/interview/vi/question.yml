- question: Khi đọc UML, phân biệt nét liền association, hình thoi rỗng, hình thoi đặc và mũi tên dependency như thế nào?
  answer: |-
    Association là **đường liền** giữa các lớp, có thể có vai trò, multiplicity và thông tin navigability. **Hình thoi rỗng** ở phía whole biểu thị aggregation lỏng; **hình thoi đặc** ở phía whole biểu thị composition với ownership vòng đời mạnh. Đường **đứt có mũi tên mở** từ client tới supplier thường biểu thị dependency.

    Đọc **đầu chứa hình thoi** để biết whole là bên nào, không đọc hình thoi như mũi tên. Sơ đồ cần được đối chiếu với nghiệp vụ: một `List<T>` trong source không quyết định loại hình thoi. Khi ký hiệu thiếu thông tin ownership, hỏi thêm quy tắc xóa/chia sẻ.
