- question: Checked và unchecked exceptions khác nhau ở Java, và override method có thể tuyên bố checked exception rộng hơn
    supertype không?
  answer: |-
    **Checked exceptions** (ngoại trừ RuntimeException và Error) được Java compiler buộc catch hoặc declare bằng throws theo quy tắc. Unchecked RuntimeException/Error không có nghĩa Java bảo đảm không xảy ra, mà không bắt caller declare.

    Khi **override**, method mới không được khai báo checked exception **rộng hơn hoặc mới** ngoài những gì method được override cho phép. Có thể khai báo tập checked exception hẹp hơn, hoặc không khai báo. Unchecked exceptions không bị giới hạn cùng cách này nhưng **semantics lỗi của hợp đồng** vẫn cần giữ.

    Chọn checked/unchecked theo API, khả năng phục hồi và convention dự án; không tạo checked exception cho mọi rejection dự kiến một cách máy móc. Giữ exception cause khi dịch lỗi giữa adapter và application để stack trace còn thông tin gốc.
