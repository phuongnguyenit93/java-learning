- question: Các điều kiện quan trọng để override hợp lệ là gì, và @Override bảo vệ được tới đâu?
  answer: |-
    Override instance method phải dùng chữ ký phù hợp, return type tương thích (có thể **covariant** với reference type), không giảm mức truy cập, và không khai báo **checked exception** rộng hơn những gì hợp đồng cha cho phép. Không override được method `final`; `private` không bị override theo nghĩa method kế thừa.

    `@Override` yêu cầu compiler xác thực đang override/implement một method hợp lệ, giúp bắt lỗi đánh máy và overload ngoài ý muốn. Nó **không** chứng minh rằng implementation giữ tiền điều kiện, hậu điều kiện, invariant hay side effect chung. Những điều này cần contract tests và review thiết kế.
