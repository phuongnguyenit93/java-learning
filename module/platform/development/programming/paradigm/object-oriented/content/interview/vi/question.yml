- question: Trong dịch vụ đa luồng, volatile hoặc AtomicReference<Policy> giúp gì khi thay collaborator, và không tự giải
    quyết điều gì?
  answer: |-
    volatile hoặc AtomicReference giúp **công bố và đọc reference mới** với visibility tương ứng; nếu mỗi request lấy một snapshot thì nó có thể dùng một implementation nhất quán.

    ~~~java
    interface Policy { long apply(long amount); }
    final class Calculator {
        private final java.util.concurrent.atomic.AtomicReference<Policy> policy;
        Calculator(Policy p) {
            policy = new java.util.concurrent.atomic.AtomicReference<>(
                java.util.Objects.requireNonNull(p));
        }
        long total(long amount) {
            Policy current = policy.get();
            return current.apply(amount);
        }
        void replace(Policy next) {
            policy.set(java.util.Objects.requireNonNull(next));
        }
    }
    ~~~

    AtomicReference **không tự làm Policy mutable thành thread-safe**, không bảo đảm mọi call đang chạy chuyển sang version mới và không tự close collaborator cũ. Nếu config gồm nhiều field phụ thuộc nhau, cân nhắc publish một immutable snapshot thống nhất.
