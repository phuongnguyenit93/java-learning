- question: Association khác dependency tạm thời như thế nào qua Ticket, Agent và NotificationGateway?
  answer: |-
    Association thường mô tả một **mối liên hệ là thành phần của trạng thái nghiệp vụ**: `Ticket` giữ `assignee` để những lần truy vấn sau biết người phụ trách. Dependency thể hiện một lớp **cần khả năng của lớp khác để thực hiện thao tác**: `notifyAssignee(NotificationGateway gateway)` dùng gateway trong một lời gọi.

    Đừng chỉ dựa vào độ dài vòng đời của object: service được **constructor-inject** gateway và giữ một field vẫn có dependency thiết kế vào abstraction, đồng thời có tham chiếu cấu trúc dài hạn. Quan trọng là *đối tượng cần làm việc gì, tham chiếu đại diện sự thật nghiệp vụ hay cộng tác kỹ thuật, ai chịu trách nhiệm trạng thái*.
