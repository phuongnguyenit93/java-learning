- question: Class, type, instance, object và biến tham chiếu trong Java là gì?
  answer: |-
    **Class** định nghĩa cấu trúc và cách khởi tạo; **instance/object** là thực thể tồn tại lúc chạy, có identity và state; **type** xác định những phép toán một biến có thể sử dụng. Interface cũng là type dù không thể khởi tạo trực tiếp bằng `new Interface()`.

    Với `Readable reader = new FileReader(...)`, `Readable` là declared type, `FileReader` là runtime class, còn `reader` là biến giữ **giá trị tham chiếu** đến object. Compiler cho phép gọi theo contract của `Readable`; runtime chọn phương thức override của object phù hợp.

    Thêm một biến trỏ đến object đó không tự tạo instance mới. Đừng nhầm giá trị tham chiếu, kiểu của biến và danh tính object.
