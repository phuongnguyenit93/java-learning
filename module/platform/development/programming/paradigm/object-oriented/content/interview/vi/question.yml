- question: Xác định trách nhiệm của từng class từ use case như thế nào, và vì sao SRP không có nghĩa mỗi class chỉ được có
    một method?
  answer: |-
    Bắt đầu từ **use case và invariant** thay vì tạo ngay các lớp tên Manager. Với nghiệp vụ mượn sách, liệt kê các trách nhiệm: kiểm tra điều kiện mượn, quản lý trạng thái bản sách, ghi nhận giao dịch mượn, lưu DB và thông báo. Tìm object có đủ thông tin để đưa ra từng quyết định và định nghĩa các collaborator.

    **Single Responsibility Principle (SRP)** hướng tới một lý do/nhóm tác nhân thay đổi rõ ràng, không đếm số method. Một BookCopy có thể có borrow(), returnCopy() và isAvailable() vì tất cả bảo vệ trạng thái bản sách; một LibraryManager tính chính sách, gửi SMTP, viết SQL và xuất CSV thì gánh nhiều nguồn thay đổi.

    Nên xem ai sở hữu invariant, quy tắc đang bị sao chép ở đâu và yêu cầu thay đổi có lan sang lớp không liên quan hay không.
