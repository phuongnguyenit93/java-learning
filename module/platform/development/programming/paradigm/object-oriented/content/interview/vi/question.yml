- question: Phân biệt parameter, return value, side effect và hợp đồng lỗi của method.
  answer: |-
    Parameter mô tả đầu vào và tiền điều kiện; return value là kết quả trực tiếp; side effect là thay đổi có thể quan sát như sửa field, collection, tệp, database hoặc mạng.

    `canSell(units)` có thể chỉ truy vấn và trả boolean; `sell(units)` làm giảm quantity nên có side effect. Cần nói rõ units không hợp lệ xử lý bằng exception hay kết quả nghiệp vụ, trạng thái có giữ nguyên sau lỗi không và hậu điều kiện sau thành công. Method trả void vẫn có thể gây side effect lớn; return một object mutable cũng có thể làm lộ state.
