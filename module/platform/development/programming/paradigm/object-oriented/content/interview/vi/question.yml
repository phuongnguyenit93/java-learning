- question: Java interface default method giống mixin/trait ở những điểm nào và khác gì với đa kế thừa class?
  answer: |-
    Default method cho phép các class **không cùng cha nghiệp vụ** chia sẻ hành vi nhỏ, ví dụ `Taggable.addTags()` gọi các lần `addTag()` mà mỗi class tự implement. Nó giống một dạng tái sử dụng hành vi kiểu mixin, nhưng Java interface **không có instance fields mutable riêng của mỗi object** như class.

    Trait/mixin trong các ngôn ngữ khác có quy tắc ghép state, method resolution và conflict riêng, không nên đồng nhất với Java default method. Nếu hành vi cần state/phụ thuộc có vòng đời, cân nhắc composition; nếu cần quy trình chung và state superclass thật, cân nhắc abstract class.
