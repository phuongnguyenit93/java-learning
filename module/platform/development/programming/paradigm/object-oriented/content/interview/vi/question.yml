- question: Có thể dùng LCOM và số lượng import như bằng chứng quyết định tách lớp không?
  answer: |-
    LCOM (*Lack of Cohesion in Methods*) và các metric coupling chỉ là **tín hiệu ban đầu**. Chúng có nhiều cách tính và không nắm hết ngữ nghĩa miền. Một policy stateless có ít field dùng chung vẫn có thể cohesive; một class chỉ import một SDK nhưng phụ thuộc sâu vào mọi chi tiết SDK có thể bị coupling mạnh.

    Cần bổ sung **thực tế thay đổi**: đổi nhà cung cấp email có làm sửa chính sách giá không? Test báo cáo có phải khởi động database không? Các method có chung lý do thay đổi và bảo vệ cùng invariant không?

    Không nên chia lớp chỉ để đạt điểm metric hoặc gom lớp để giảm số dependency. Mục tiêu là trách nhiệm dễ hiểu và thay đổi được khoanh vùng.
