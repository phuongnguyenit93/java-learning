- question: Vì sao gọi remaining() rồi reserve() có thể sai khi nhiều luồng cùng chạy dù mỗi method đúng hợp đồng riêng?
  answer: |-
    Đây là lỗi **check-then-act**. Luồng A và B đều có thể đọc `remaining() == 1` rồi cùng thử đặt một ghế. Nếu thao tác reserve không atomic, invariant có thể bị phá hoặc mất cập nhật.

    Thay vì để caller tự phối hợp hai lời gọi, nên đưa hành vi `tryReserve(n)` với **kiểm tra và cập nhật trong cùng đơn vị nhất quán**. Trong một JVM có thể dùng lock/synchronization đúng phạm vi; qua nhiều server cần điều kiện cập nhật ở storage hoặc transaction phù hợp. Interface không mặc nhiên thread-safe.
