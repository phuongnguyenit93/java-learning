- question: Vì sao Money dùng BigDecimal cần canonical representation? Tình huống nào khiến HashSet và TreeSet xử lý khác
    nhau?
  answer: |-
    BigDecimal('12.3').compareTo(BigDecimal('12.30')) bằng 0, nhưng equals trả false vì scale khác. Nếu Money.equals coi hai số này bằng nhau mà hashCode dựa trên BigDecimal chưa chuẩn hóa, sẽ vi phạm quy tắc hai object equals thì hashCode phải bằng nhau.

    Trong bài, Money chỉ cho USD/EUR và chuẩn hóa amount về scale 2 bằng setScale(2, RoundingMode.UNNECESSARY), từ chối số có chữ số thập phân thứ ba khác 0. USD 12.3 bằng USD 12.30, nhưng khác EUR 12.30. Dùng BigDecimal được tạo từ String/giá trị chính xác, tránh new BigDecimal(0.1).

    HashSet xét hashCode + equals; TreeSet xét comparator/compareTo. Nếu compareTo trả 0 cho hai object mà equals nói khác, TreeSet có thể gộp chúng. Vì vậy Money.compareTo trong bài xếp mã tiền tệ rồi số tiền để nhất quán với equals; greaterThan trong nghiệp vụ chỉ cho phép cùng tiền tệ.
