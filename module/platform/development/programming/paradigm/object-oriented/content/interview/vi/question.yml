    Nếu implementation gửi thông báo hoặc ghi database trước khi ném lỗi, không thể mặc định “exception nghĩa là chưa có side effect”. Với I/O, async và transaction, tài liệu nên nêu thời điểm cam kết có hiệu lực, khả năng retry/idempotency và độ bền; chỉ gắn nhãn interface không tự cung cấp các bảo đảm này.
