    Hãy ghi yêu cầu FR/BR kiểm chứng được: member hoạt động, copy còn AVAILABLE, không có loan mở quá hạn, tối đa ba loan mở và hạn mượn 14 ngày theo chính sách ban đầu. Use case mượn phải ghi precondition, luồng thành công, các nhánh từ chối và postcondition không thay đổi dữ liệu khi lỗi.

    Trong phỏng vấn stakeholder cần làm rõ '3 cuốn' là 3 bản đang mượn, 'quá hạn' dựa ngày nào/múi giờ nào, và lịch sử có phải giữ sau trả hay không. Ghi các giả định chưa được xác nhận thay vì tự biến chúng thành code.
