- question: Vì sao cần <T extends Number> và khác gì với <T extends Comparable<? super T>> trong thuật toán so sánh?
  answer: |-
    Bound mô tả **năng lực tối thiểu** mà thuật toán cần. Không bound thì T có thể là Object bất kỳ; compiler không cho gọi doubleValue(). Với T extends Number, có thể gọi các instance methods do Number công bố nhưng **không có nghĩa mọi phép toán số học + giữa T đều hợp lệ**.

    Muốn tìm giá trị lớn nhất dựa vào compareTo, dùng dạng tổng quát:

    ~~~java
    static <T extends Comparable<? super T>> T max(T a, T b) {
        return a.compareTo(b) >= 0 ? a : b;
    }
    ~~~

    Comparable<? super T> cho phép kiểu T được so sánh qua hợp đồng Comparable của chính T **hoặc một supertype phù hợp**, linh hoạt hơn Comparable<T> khi class kế thừa khả năng so sánh. Bound chỉ bảo đảm tương thích phương thức, không chứng minh compareTo tuân thủ thứ tự hợp lệ; cần test semantics.
  aiGenerated: true
  reviewed: false
  readmeRelated:
    file: 17.LanguageMechanics/knowledge/LanguageMechanics.md
    anchor: ''
  apiRelated:
    controller: ''
    methodSignature: ''
- question: Một type parameter có nhiều bound viết thế nào? Vì sao class bound phải đứng trước interface bound?
  answer: |-
    Java hỗ trợ **intersection bounds**: <T extends Base & Runnable & AutoCloseable>, nghĩa là type argument phải là subtype của Base và triển khai các interface còn lại. Nếu có class bound, nó phải đứng **đầu tiên**, sau đó mới tới các interface; Java không cho extends nhiều class.

    Ví dụ method <T extends Number & Comparable<T>> có thể gọi doubleValue() và compareTo() trên T khi type argument thực sự đáp ứng cả hai; Integer là một ví dụ. Với generic algorithm, chọn **bound nhỏ nhất đủ dùng** để không loại vô cớ những kiểu phù hợp.

    Không viết <T super Number>; từ khóa super chỉ xuất hiện trong **lower-bounded wildcard** kiểu ? super Number, chứ không dùng để khai báo lower bound cho type parameter có tên.
