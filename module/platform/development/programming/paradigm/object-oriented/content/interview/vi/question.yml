- question: Bốn mức truy cập Java giúp giới hạn bề mặt API thế nào? protected ở package khác có bẫy gì?
  answer: |-
    `private` cho logic/trạng thái nội bộ; không modifier nghĩa là **package-private**; `protected` cho cùng package hoặc subclass theo quy tắc Java; `public` mở API tới mã nhìn thấy class. Nên bắt đầu từ phạm vi nhỏ nhất đáp ứng nhu cầu.

    Subclass ở package khác có thể dùng `this.protectedField`, nhưng không mặc nhiên được dùng `new Base().protectedField` qua receiver có kiểu Base. Top-level class chỉ được là public hoặc package-private. Quy tắc truy cập Java kiểm soát mã, **không** kiểm tra người dùng đã được phép xem dữ liệu hay chưa.
