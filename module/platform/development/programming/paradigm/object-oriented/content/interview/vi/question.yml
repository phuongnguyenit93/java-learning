- question: Tại sao không thể dựa vào số tầng extends để kết luận chương trình chạy chậm hơn? Đo hiệu năng thế nào cho có
    ý nghĩa?
  answer: |-
    Chi phí runtime phụ thuộc vào các lời gọi, cấp phát, truy cập bộ nhớ, khả năng JIT inline/devirtualize và workload. JVM có thể tối ưu nhiều lời gọi ảo; ngược lại một số pattern đa hình khó tối ưu hơn. **Độ sâu class hierarchy tự nó không đủ để kết luận**.

    Muốn đánh giá, dùng profiler và benchmark phù hợp như JMH với warm-up, trạng thái dữ liệu thực tế và phép đo có kiểm soát; tránh microbenchmark bị JVM loại bỏ toàn bộ phép tính. Phân biệt rõ chi phí chạy máy với chi phí hiểu/sửa/test khi ra quyết định thiết kế.
