- question: Static member khác instance member thế nào và nên tránh điều gì?
  answer: |-
    **Instance field** thuộc từng object; **static field** thuộc class và được dùng chung trong class loader tương ứng. Instance method có receiver, còn static method không có `this`.

    Static phù hợp với hằng số, hàm thuần hoặc factory; nhưng static mutable state chứa “giỏ hàng hiện tại” có thể làm dữ liệu request này ảnh hưởng request khác và khó viết test độc lập.

    Một subclass khai báo static method trùng chữ ký của superclass có thể *hide* method, không phải **override** theo dynamic dispatch như instance method. Chọn static theo ownership/lifecycle và contract, không chỉ vì gọi thuận tiện.
