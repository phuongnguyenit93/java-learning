- question: Java compiler hỗ trợ phần nào của tính thay thế khi override và không kiểm tra được những gì?
  answer: |-
    Compiler kiểm tra những quy tắc tĩnh như method signature, mức truy cập (không được giảm visibility khi override), return type tương thích/covariant trong trường hợp hợp lệ, và giới hạn **checked exceptions** mới/rộng hơn khi override. @Override hữu ích để bắt lỗi sai tên/chữ ký.

    Nhưng compiler **không chứng minh** precondition nghiệp vụ, postcondition, invariant, idempotency, điều kiện thiếu dữ liệu hay thứ tự side effect. Unchecked exception và thay đổi semantics có thể vẫn compile bình thường.

    Ví dụ subtype implement DiscountPolicy.apply(long) trả -1 cho mọi input vẫn hợp lệ về Java type nếu contract trả long, nhưng vi phạm cam kết tiền không âm. Cần review và contract tests, không chỉ dựa vào compile.
