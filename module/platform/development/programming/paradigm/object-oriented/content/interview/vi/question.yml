- question: Để chẩn đoán chu trình Spring bean, nên sửa constructor injection cycle bằng những bước nào?
  answer: |-
    Bắt đầu từ đường dependency Spring báo lỗi, vẽ `A → B → ... → A` và xem **tại sao** từng service cần phía kia. Xác định dữ liệu/hành vi nào đang quay ngược trách nhiệm; refactor thành orchestrator hoặc tách port/read service nhỏ. Viết test tạo context và kiểm thử use case sau thay đổi.

    `@Lazy`, `ObjectProvider` hoặc setter injection có thể giải quyết cách khởi tạo trong một số tình huống, nhưng chỉ là **kỹ thuật trì hoãn tra cứu**, không tự sửa thiết kế vòng. Tránh chỉ bật cơ chế cho phép circular references để che một coupling chưa hiểu rõ. Chu trình package/module còn phải xem đồ thị build và import, không chỉ bean.
