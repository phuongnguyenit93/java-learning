- question: Fake, stub, mock, spy và dummy khác nhau ra sao, và chọn loại nào cho checkout?
  answer: |-
    Đây là các **test doubles**, tức collaborator thay thế để kiểm soát/quan sát kiểm thử:

    - **Dummy:** chỉ chiếm vị trí tham số, nhánh test không dùng.
    - **Stub:** trả dữ liệu định trước, ví dụ PaymentGateway luôn trả false.
    - **Fake:** implementation đơn giản có logic thật, ví dụ Inventory dùng Map trong bộ nhớ.
    - **Mock:** hỗ trợ xác minh các lời gọi có ý nghĩa, ví dụ ReceiptSender được gọi một lần sau khi charge thành công.
    - **Spy:** ghi lại tương tác, có thể dựa trên object thật hoặc recording implementation.

    Chọn theo câu hỏi cần chứng minh. Nếu cần assert số lượng hàng còn lại, fake inventory hữu ích. Nếu cần cấm gửi thư khi lỗi, mock/spy sender thích hợp. Không mock chính **SUT** vì sẽ chỉ test hành vi giả lập của object muốn kiểm chứng.
