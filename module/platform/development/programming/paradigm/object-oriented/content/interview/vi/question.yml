- question: Một switch hai trường hợp có vi phạm OCP và phải thay ngay bằng Strategy không?
  answer: |-
    **Không tự động.** Nếu các lựa chọn ít, tương đối cố định, đơn giản và dùng ở một điểm duy nhất, switch có thể là **thiết kế dễ hiểu nhất**. OCP quan tâm việc mỗi biến thể mới có khiến ta sửa một lõi đã ổn định và tạo rủi ro hồi quy hay không.

    Khi có bằng chứng nhu cầu liên tục thêm hãng giao hàng, nhiều nhóm cùng sửa switch, hoặc cần test từng thuật toán độc lập, Strategy/registry có thể giảm chi phí thay đổi. Trước khi chuyển, xác định contract chung, exception, input, output và cách chọn implementation.

    Không dùng inheritance/interface vì khẩu hiệu. Nếu yêu cầu nền tảng thay đổi, cả interface và call site vẫn có thể cần sửa; OCP không tạo sự bất biến tuyệt đối.
