- question: AutoCloseable khác Closeable ra sao và có nên mặc định cho rằng close() luôn gọi lặp an toàn?
  answer: |-
    Hai interface đều được hỗ trợ bởi try-with-resources. **AutoCloseable.close()** có thể khai báo ném Exception; **Closeable.close()** khai báo IOException, gắn với I/O và có hợp đồng gọi close nhiều lần không phát sinh tác động.

    AutoCloseable nói chung **không bắt buộc idempotent**; cách close lần thứ hai hoạt động ra sao phải đọc hợp đồng implementation. Một class tự viết cần quyết định trạng thái CLOSED, cách xử lý exception, logic đóng khi có lỗi và phương thức nào được dùng sau close. Không chủ động đóng resource được truyền từ ngoài nếu không được chuyển giao quyền sở hữu.
