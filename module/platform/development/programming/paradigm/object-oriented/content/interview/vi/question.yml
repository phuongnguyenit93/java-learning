- question: Overload, override, field access và static method hiding khác nhau thế nào?
  answer: |-
    **Overload resolution** chọn chữ ký ở compile time theo kiểu biểu thức và argument. **Override** áp dụng cho instance method hợp lệ; runtime dispatch chọn implementation theo class thực tế của receiver.

    Ví dụ khi biến được khai báo `Animal a = new Dog()`, lời gọi `a.sound()` dùng `Dog.sound()` nếu method được override, dù compiler chỉ biết các method của `Animal`.

    Ngược lại static method không dùng dynamic dispatch tương tự; method trùng tên có thể bị hide. Field access cũng không polymorphic như instance method; private/final method và constructor không override theo cơ chế này. Cần xem cả **declared type lẫn runtime class** khi debug.
