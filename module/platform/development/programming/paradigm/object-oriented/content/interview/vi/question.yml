- question: Khi ghi đè một phương thức tính phí, lúc nào cần super.method() và lúc nào không?
  answer: |-
    `super.method(args)` chọn implementation phù hợp từ superclass trên **cùng object hiện tại**, hữu ích khi subclass chỉ bổ sung phí ưu tiên sau logic kiểm tra/phí nền. Ví dụ `return Math.addExact(super.calculate(km), priorityFee);` giữ validation từ lớp cha nếu hợp đồng cho phép cộng phụ phí.

    Java **không bắt buộc** override phải gọi super. Có thể thay hoàn toàn thuật toán khi vẫn giữ hợp đồng. Nhưng cần kiểm tra mã cha có side effect hoặc giả định bất biến nào; gọi super hai lần có thể lặp side effect, còn bỏ nó có thể vô tình bỏ validation. `super.method()` không tạo object cha mới.
