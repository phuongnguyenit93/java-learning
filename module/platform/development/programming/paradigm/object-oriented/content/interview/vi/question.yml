- question: 'Sơ đồ lớp UML biểu diễn điều gì? Đọc dấu +, -, #, ~ cạnh member ra sao?'
  answer: |-
    **Class diagram** là góc nhìn cấu trúc tĩnh: class/interface, thuộc tính, operation và quan hệ kiểu/đối tượng. Trong UML, `+` là public, `-` là private, `#` là protected và `~` là package visibility.

    Ví dụ `-status: OrderStatus` mô tả thuộc tính; `+pay(): void` mô tả operation. Có thể ghi multiplicity, role, navigability, generalization, realization, dependency và composition. Một hình vẽ **không tự kiểm tra** các luật như "chỉ được ship sau khi pay": code và test phải bảo vệ các luật đó. Đừng biến sơ đồ thành bản copy mọi getter hoặc bảng SQL.
