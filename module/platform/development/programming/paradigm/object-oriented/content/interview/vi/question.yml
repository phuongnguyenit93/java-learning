- question: Đánh giá abstraction có 'trả được tiền thuê' bằng bằng chứng gì?
  answer: |-
    Hỏi: client nào cần nó, thay đổi thật nào được cô lập, có implementation hợp lệ khác không, có giảm số nơi cần sửa và có dễ debug/test hơn không. Tầng chỉ forwarding cần lý do cụ thể để tồn tại.

    Khi refactor, khóa output, exception và side effect bằng tests; tách **điểm ổn định** và **chiều biến thiên** nhỏ nhất, đo lại chi phí hiểu/đổi mã. Boundary hạ tầng đáng đầu tư sớm, nhưng không xây framework tổng quát cho biến thể chưa được xác nhận.
