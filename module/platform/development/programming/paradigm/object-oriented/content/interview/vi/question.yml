- question: Một DocumentStorage có read/save/delete nhưng ReadOnlyArchive phải throw UnsupportedOperationException ở save/delete.
    Đây là vấn đề gì?
  answer: |-
    Đây là dấu hiệu **vi phạm Interface Segregation Principle (ISP)**, vì kho chỉ đọc bị bắt implement những capability nó không có; và có thể là **vi phạm LSP** nếu contract DocumentStorage vốn hứa save/delete hoạt động cho mọi implementation.

    Tách theo nhu cầu của client: DocumentReader.findById, DocumentWriter.save, DocumentDeleter.delete. ReadOnlyArchive chỉ implements DocumentReader; ImportJob nhận Writer, SearchService chỉ nhận Reader. Một adapter đầy đủ có thể implements nhiều interface.

    ISP **không yêu cầu một method cho mỗi interface**: nhóm hành vi có mục đích rõ cho cùng client vẫn nên ở cùng contract. Với public API cũ, cần adapter/migration và regression tests trước khi bỏ DocumentStorage.
