- question: Vì sao equals/hashCode của entity JPA chưa có ID khác với Money value object? Có nên luôn override theo ID?
  answer: |-
    Với Value Object như Money, equality thường dựa trên **các thành phần giá trị** và object nên tránh mutation làm đổi hash. Entity dựa vào **danh tính miền**, nhưng ID có thể chỉ được database cấp sau persist.

    Nếu hai entity mới đều có ID null mà equals() chỉ so ID, chúng có thể bị coi bằng nhau sai. Nếu hashCode thay đổi sau persist trong lúc entity nằm trong HashSet, việc tìm phần tử có thể hỏng. Proxy JPA, inheritance và lifecycle còn làm lựa chọn instanceof/getClass phức tạp hơn.

    Không có một công thức áp dụng cho mọi entity: cần thống nhất ID lifecycle, proxy semantics và contract của tập hợp; đôi khi so sánh ID tường minh tốt hơn override equality một cách máy móc.
