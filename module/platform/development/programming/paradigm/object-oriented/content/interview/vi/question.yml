- question: Lớp concrete và abstract khác nhau thế nào về new, kế thừa và đa hình?
  answer: |-
    **Concrete class** có đủ implementation cho các abstract method kế thừa, nên có thể dùng `new` nếu constructor/quyền truy cập hợp lệ. **Abstract class** không thể được khởi tạo trực tiếp nhưng hoàn toàn có thể làm kiểu của biến, tham số hoặc return.

    ```java
    ShippingPlan plan = new EconomyShippingPlan();
    long fee = plan.quote(5, 1500);
    ```

    Lời gọi instance method được dispatch theo runtime object khi phù hợp. Không phải cứ dùng đa hình là bắt buộc tạo một abstract class: interface cũng đủ cho nhiều trường hợp; concrete class đơn giản tốt hơn nếu chưa có lý do phân cấp.
