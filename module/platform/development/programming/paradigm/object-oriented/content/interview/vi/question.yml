- question: 'Parent constructor gọi method override trong Child, còn Child có int count = 7: vì sao có thể in 0?'
  answer: |-
    Java vẫn thực hiện **dynamic dispatch** khi constructor cha gọi một instance method có thể override. Lúc đó instance initializer của Child thường chưa chạy, nên field count mới là giá trị mặc định 0.

    ~~~java
    class Parent {
        Parent() { print(); }
        void print() { System.out.println("Parent"); }
    }
    class Child extends Parent {
        int count = 7;
        @Override void print() { System.out.println(count); }
    }
    // new Child() in ra 0 trong quá trình Parent().
    ~~~

    Điều tương tự với field tham chiếu có thể dẫn tới null và NullPointerException. **Không gọi method có thể override trong constructor** nếu method dựa vào trạng thái subclass. Chỉ kích hoạt hành vi sau khi object xây dựng hoàn chỉnh hoặc dùng logic khởi tạo không phụ thuộc override.
