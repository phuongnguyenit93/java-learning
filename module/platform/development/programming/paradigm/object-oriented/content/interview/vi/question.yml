- question: Vì sao kế thừa mã bằng extends không đồng nghĩa với việc lớp con có thể thay thế lớp cha đúng về hành vi?
  answer: |-
    **Code reuse** trả lời câu hỏi “dùng lại thuật toán/trạng thái thế nào”; **subtyping** trả lời “có thể dùng object này ở vị trí đòi một contract rộng hơn không?”. Trong Java, extends một class tạo quan hệ subtype danh nghĩa và thường thừa hưởng implementation, nhưng compiler không chứng minh mọi precondition, postcondition và invariant nghiệp vụ được bảo toàn.

    Một CachedRepository extends Repository có thể tái sử dụng logic truy vấn nhưng nếu contract hứa read-after-write mà cache giữ giá trị cũ, client sử dụng Repository sẽ sai kỳ vọng. Nếu chỉ muốn chia sẻ thuật toán mà không muốn nhận toàn bộ lời hứa của superclass, dùng **composition/delegation**: lớp giữ một collaborator chung và tự công bố interface phù hợp.

    Hãy quyết định từ hợp đồng client, không từ số dòng code có thể chia sẻ.
