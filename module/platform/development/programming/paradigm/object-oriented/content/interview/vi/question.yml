- question: So sánh private, package-private, protected, public; trường hợp protected ở package khác?
  answer: |-
    `private` giới hạn trực tiếp trong class khai báo theo quy tắc nest access; không ghi modifier là **package-private**; `protected` cho mã cùng package hoặc subclass ở package khác với ràng buộc receiver; `public` cho mã có thể nhìn thấy type.

    Subclass khác package dùng `this.protectedField` được, nhưng không thể tùy tiện truy cập `new Base().protectedField` qua receiver kiểu Base. Top-level class chỉ có thể public hoặc package-private. Quyền của member không tự vượt qua visibility của chính class chứa nó.
