- question: volatile int count có đủ làm count++ thread-safe khi nhiều object cùng truy cập một bộ đếm không?
  answer: |-
    **Không.** volatile giúp visibility và một số quan hệ ordering trong Java Memory Model, nhưng count++ gồm các bước đọc, cộng rồi ghi tách rời. Hai thread có thể cùng đọc giá trị cũ rồi ghi đè nhau, gây **lost update**. Dùng AtomicInteger.incrementAndGet() hoặc synchronized/lock khi cần tính nguyên tử.

    Bất biến của một object có thể giảm rủi ro mutation, nhưng công bố object giữa các thread vẫn phải an toàn theo ngữ cảnh. Khi trao đổi snapshot mới, việc thay tham chiếu chia sẻ cũng cần thiết kế visibility, consistency và thứ tự update.
