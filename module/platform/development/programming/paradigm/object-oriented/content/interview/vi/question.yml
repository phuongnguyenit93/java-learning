- question: Vì sao các setter độc lập thường nguy hiểm khi nhiều field có quan hệ ràng buộc? Bạn sẽ sửa API ra sao?
  answer: |-
    Giả sử `SeatInventory` có `capacity` và `reserved`. Nếu caller lần lượt gọi `setCapacity(3)`, `setReserved(5)`, đối tượng có thể tạm hoặc vĩnh viễn vi phạm `reserved <= capacity`. Setter riêng lẻ không diễn đạt một chuyển trạng thái nhất quán.

    Thay bằng `reserve(n)`, `cancel(n)`, hoặc `resizeCapacity(newCapacity)` kiểm tra `newCapacity >= reserved`. Nếu cần thay đồng thời hai field, dùng **một method nghiệp vụ** kiểm tra tất cả điều kiện rồi cập nhật như một đơn vị. Không phải mọi setter đều sai: `setDisplayName()` hợp lý khi tên thực sự độc lập và được validate.
