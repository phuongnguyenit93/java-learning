- question: Vì sao BookTitle, BookCopy và Loan cần tách thành các khái niệm khi mô hình hóa thư viện?
  answer: |-
    `BookTitle` đại diện đầu sách/ấn bản và metadata như ISBN, nhan đề; nhiều **BookCopy** vật lý có barcode riêng thuộc cùng đầu sách. `Loan` là **lượt mượn cụ thể**, có identity, borrower, copy, ngày mượn/hạn trả và trạng thái/vòng đời trả sách.

    Nếu gộp đầu sách với bản sách, hệ thống khó nói **bản nào** đang bị mượn. Nếu chỉ để flag borrowed trong BookCopy, khó lưu lịch sử nhiều lần mượn và ai mượn khi nào. Mô hình còn phải xác định mỗi bản có tối đa một Loan ACTIVE; trong DB cần constraint/transaction tương ứng.
