- question: private, final, static, constructor và super.method() liên quan thế nào đến runtime dispatch?
  answer: |-
    Đa hình động thông thường tác động tới **instance method có thể override**. Method `private` không được subclass override như API kế thừa; `final` cấm override; `static` có hiding; constructor không được override; field truy cập theo kiểu tĩnh.

    `super.method()` ở subclass là lời gọi chọn implementation superclass phù hợp, không gọi lại override trên chính subclass cho method đó. Tuy vậy, nếu implementation superclass gọi một hook khác có thể override trên `this`, hook đó vẫn có thể dispatch động. Cần phân biệt bước chọn implementation đang gọi với các lời gọi tiếp theo bên trong nó.
