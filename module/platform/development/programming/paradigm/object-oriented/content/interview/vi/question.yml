- question: Phân biệt field, tham số và biến cục bộ khi cùng tên. this.quantity có ý nghĩa gì?
  answer: |-
    Field được khai báo trong class, sống theo instance hoặc class nếu static. Tham số và local variable thuộc phạm vi lời gọi method.

    ```java
    class Item {
        private int quantity;
        void restock(int quantity) {
            if (quantity <= 0) throw new IllegalArgumentException();
            this.quantity += quantity;
        }
    }
    ```

    `this.quantity` chỉ field trên receiver object; `quantity` là tham số. Nếu dùng `quantity = quantity`, chỉ gán lại tham số, không đổi trạng thái. Cần kiểm tra phép cộng khi số lượng có thể rất lớn.
