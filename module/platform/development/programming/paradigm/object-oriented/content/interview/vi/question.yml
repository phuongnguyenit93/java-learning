- question: Vì sao Java không phải duck typing động chỉ vì hai class đều có method quack()?
  answer: |-
    Java dùng **nominal type relationships**: hai class đều có `quack()` cùng chữ ký không tự trở thành subtype của `Quackable`. Để gán `Quackable q = new ToyDuck();`, ToyDuck cần `implements Quackable` hoặc quan hệ kiểu hợp lệ được khai báo.

    Trong Python, duck typing có thể thực hiện lời gọi dựa trên khả năng object ở runtime. Trong Java, hãy dùng interface nhỏ theo capability (`Quackable`, `Swimmable`) hoặc adapter cho class bên thứ ba. Reflection có thể gọi method theo tên nhưng bỏ kiểm tra hợp đồng compile time, thêm lỗi runtime và chi phí, không biến kiểu Java thành structural subtyping tự động.
