- question: Làm sao xác định “một nhóm lý do thay đổi” khi refactor God Class mà không tách vụn quá mức?
  answer: |-
    Đầu tiên **liệt kê các thay đổi đã xảy ra hoặc có xác suất cao**: đội kế toán thay quy tắc phát hành, đội vận hành đổi cơ sở dữ liệu, nhóm giao tiếp đổi email template. Với mỗi thay đổi, xem class nào phải sửa và invariant nào phải giữ.

    Nhóm các method/state cùng **quy tắc miền và nguồn thay đổi** về một chủ thể, ví dụ Invoice quản lý các dòng và trạng thái; PDF renderer chỉ định dạng; InvoiceRepository lưu; InvoiceWorkflow điều phối. Viết contract/characterization tests trước khi di chuyển.

    Không tách các phép tính liên quan chỉ vì class có nhiều method. Sau refactor, kiểm tra yêu cầu đổi template PDF có làm sửa Invoice không, và việc thêm quy tắc phát hành có phải sửa SMTP adapter không. Nếu có, boundary chưa tốt.
