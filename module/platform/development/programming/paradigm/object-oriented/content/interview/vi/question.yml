- question: Vì sao mutable key có thể không truy xuất được từ HashMap sau khi sửa field? Nêu khác biệt String và BigDecimal
    khi so sánh.
  answer: |-
    HashMap chọn bucket bằng hashCode lúc put. Nếu field tham gia equals/hashCode của key bị sửa, hashCode có thể thay đổi, khiến get(key) tìm sai bucket. Nên dùng **key immutable** hoặc bảo đảm không đổi field tham gia equality khi key còn trong map.

    Hai String khác instance có thể == false nhưng equals true vì cùng nội dung. Với BigDecimal, new BigDecimal("1.0").equals(new BigDecimal("1.00")) false do **scale** khác, còn compareTo(...) == 0 vì bằng giá trị số học. Chọn phép so sánh theo hợp đồng thực sự cần.
