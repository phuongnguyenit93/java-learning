- question: Middle Man, Speculative Generality và Collapse Hierarchy là gì trong đánh giá over-abstraction?
  answer: |-
    **Middle Man** là lớp chủ yếu forward lời gọi mà không thêm contract/chính sách. **Speculative Generality** là interface/factory tổng quát cho biến thể chưa có. **Hierarchy thừa** là lớp cha/con không còn khác biệt hữu ích; có thể cân nhắc **Collapse Hierarchy**.

    Đừng xóa dựa vào số dòng hoặc số implementation. Clock, Repository hay PaymentGateway tuy nhỏ vẫn bảo vệ boundary và khả năng test, đặc biệt với I/O. Đánh giá vì sao abstraction tồn tại và client nào phụ thuộc.
