- question: Entity, Value Object và Domain Service trong nghiệp vụ chuyển tiền khác nhau dựa trên tiêu chí gì?
  answer: |-
    **Entity** có danh tính ổn định xuyên vòng đời: Account với ID không đổi dù balance thay đổi. **Value Object** có identity theo giá trị, thường immutable: Money(amountMinorUnits, currency) tương đương object khác cùng hai thành phần. **Domain Service** thể hiện quy tắc không thuộc tự nhiên về một entity đơn lẻ, chẳng hạn chuyển tiền giữa hai account.

    Account nên tự bảo vệ balance qua withdraw(), Money kiểm tra currency và thực hiện phép tính đúng; TransferService phối hợp các object và policy của miền. Application service lo repository, transaction và I/O.

    Đây là **vai trò thiết kế**, không đồng nghĩa tự động với Java record, JPA @Entity hoặc Spring @Service.
