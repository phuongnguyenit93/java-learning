    Extract Method cải thiện **đọc và chia bước trong cùng trách nhiệm**; Extract Class chuyển nhóm quyết định **có lý do thay đổi độc lập** sang owner phù hợp. Nếu đổi thuế và đổi định dạng receipt độc lập, `PricingPolicy` và `ReceiptFormatter` là ranh giới có ích.

    `CheckoutService` vẫn làm orchestration. Không đặt tất cả vào một `Utils` static, cũng không tự tạo interface cho mỗi helper. Chốt output/exception của cả hai phiên bản trước khi tách.
