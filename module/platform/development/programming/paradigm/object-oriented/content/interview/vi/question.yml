- question: Port cùng thiết kế ShippingPolicy giữa Java, Kotlin, Python, TypeScript, C# cần giữ bất biến nào thay vì sao chép
    cú pháp interface?
  answer: |-
    Giữ **hợp đồng nghiệp vụ**: request có gram nguyên từ 1 đến 100000, standard = 20000 VND, express = 35000 + 8000 × số kg làm tròn lên; invalid input và code dịch vụ không hỗ trợ bị từ chối đúng nghĩa. Express với 1200 gram tính 2 kg, trả **51000 VND**.

    Ngôn ngữ khác nhau về cơ chế:
    - Java/C# interface thường là **nominal typing**; Java có generics erasure, C# có khác biệt runtime/generics.
    - TypeScript interface mang **structural typing** khi type-check, bị xóa ở runtime JavaScript; input ngoài phải validate runtime.
    - Python hỗ trợ duck typing và typing.Protocol cho structural contracts khi static type checking; code vẫn cần runtime validation.
    - Kotlin dùng interface và cơ chế nullability/data class riêng.

    Bộ contract tests chạy ở từng phiên bản quan trọng hơn cố dịch từng dòng Java thành cú pháp giống hệt.
