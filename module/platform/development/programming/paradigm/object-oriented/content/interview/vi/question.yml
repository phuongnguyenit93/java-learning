- question: Chuyển vòng gọi đồng bộ sang domain event có thật sự loại bỏ mọi rủi ro consistency và retry không?
  answer: |-
    Domain event có thể thay `EnrollmentService → NotificationService → EnrollmentService` bằng một luồng một chiều: ghi enrollment xong phát `StudentEnrolled(enrollmentId)`, handler thông báo đọc thông tin cần thiết và gửi đi.

    Nhưng async tạo **eventual consistency** và lỗi vận hành khác: DB commit thành công nhưng publish thất bại, duplicate delivery, handler retry hoặc out-of-order. Khi tích hợp DB với broker, cần cân nhắc **transactional outbox**, consumer idempotency và quan sát lỗi. Nếu cần kết quả đồng bộ tức thì, orchestrator có thứ tự gọi rõ vẫn có thể phù hợp hơn. Event không tự là transaction hay bảo đảm exactly-once.
