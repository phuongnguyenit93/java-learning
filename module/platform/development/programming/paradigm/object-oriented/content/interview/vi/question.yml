- question: Quackable q = toy::quack khác Quackable q = toy ở điểm nào?
  answer: |-
    Nếu `Quackable` là **functional interface** có đúng một abstract method tương thích với `toy.quack`, biểu thức `toy::quack` có thể được chuyển thành một giá trị thực hiện `Quackable` bằng method reference. Nó là **adapter hành vi** thông qua target functional interface.

    Trái lại `Quackable q = toy;` chỉ hợp lệ nếu kiểu Toy thực sự là subtype của Quackable theo quan hệ khai báo. Method reference không làm Toy tự động implements interface. Cần lưu ý signature, checked exceptions và khả năng receiver `toy` là null khi tạo bound method reference; không chỉ nhìn vào tên method.
