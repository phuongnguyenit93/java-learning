- question: Ở luồng borrow/return, cần kiểm tra và cập nhật thứ tự nào để không sinh Loan và BookCopy trái trạng thái?
  answer: |-
    BorrowingService cần tìm member và copy hợp lệ, kiểm tra active, AVAILABLE, số loan mở, overdue theo ngày hiện tại, hạn trả từ policy rồi mới thay trạng thái và lưu Loan. Return cần kiểm tra loan còn mở, ngày trả không trước ngày mượn, sau đó đóng loan và trả copy về AVAILABLE. Loan đã đóng không thể trả lần hai; lỗi phải giữ nguyên loan và copy.

    Trong mô phỏng một tiến trình, kiểm tra trước cập nhật giảm rủi ro 'half update'. Nhưng NFR có hai yêu cầu riêng: hai tác vụ cùng mượn một bản chỉ được một thành công và storage lỗi không được để dữ liệu lệch. Để bảo đảm khi triển khai thật cần transaction/locking hoặc optimistic concurrency cùng persistence thích hợp, không suy từ đoạn Java in-memory rằng đã giải quyết mọi race.

    Test trạng thái trước/sau cả hai phía trong từng nhánh: copy bận, member khóa, vượt hạn mức, trả sai ngày, trả lặp và lỗi lưu trữ được mô phỏng.
