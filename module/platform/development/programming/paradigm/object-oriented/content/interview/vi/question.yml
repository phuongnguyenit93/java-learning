- question: Khi nào nên có application service thay vì dồn tất cả nghiệp vụ vào một entity?
  answer: |-
    Khi use case cần **phối hợp nhiều đối tượng và hệ thống bên ngoài**: lấy Member/BookCopy từ repository, kiểm tra trạng thái, lập Loan, persist, gửi thông báo hoặc quản lý transaction. Application service làm orchestration, còn entity/value object vẫn giữ validation và invariant nội tại.

    Ví dụ `Money.plus(other)` tự kiểm tra currency là trách nhiệm tự nhiên của Money; không cần `MoneyAdditionService` riêng chỉ để cộng. Ngược lại, thanh toán hoặc mượn sách cần transaction/retry/notification nên có use case boundary. Mục tiêu là **high cohesion, low coupling**, không phải tối đa số lớp.
