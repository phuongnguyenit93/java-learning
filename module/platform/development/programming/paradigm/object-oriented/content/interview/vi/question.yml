- question: Tại sao kết quả unit test dùng FakeInventory in-memory không chứng minh adapter DB thật tuân thủ cùng contract?
  answer: |-
    Fake giúp chạy nhanh và cô lập business logic, nhưng có thể **đơn giản hóa quá mức**: map trong RAM không mô phỏng unique constraint, transaction, isolation, locking, null handling, network timeout và retry của database.

    Nên chạy bộ **contract tests trên cả fake và adapter thực** theo các lời hứa quan trọng. Với DB adapter còn cần **integration tests** có database phù hợp và dữ liệu độc lập để xác minh mapping, transaction, lỗi truy vấn, race conditions và consistency.

    Một test fake xanh chứng minh hành vi của **fake + SUT** trong kịch bản giả lập; không tự chứng minh code SQL, provider API hoặc Spring wiring đúng. Phân rõ mức bằng chứng để không đánh giá quá mức độ bảo đảm.
