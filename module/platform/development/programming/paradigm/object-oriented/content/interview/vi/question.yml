- question: Hãy thiết kế hợp đồng reserve(n) cho kho ghế theo tiền điều kiện, hậu điều kiện và bất biến.
  answer: |-
    Giả sử `capacity > 0`, `0 <= available <= capacity`. Với `reserve(n)`, **tiền điều kiện** là `n > 0`; nếu `n > available` thì hợp đồng phải nói rõ ném lỗi hay trả trạng thái từ chối.

    Nếu reserve thành công, hậu điều kiện: `newAvailable = oldAvailable - n` và invariant vẫn đúng. Nếu yêu cầu vượt chỗ nhưng API trả `false`, phải bảo đảm available **không đổi**. Với `release(n)`, cần tránh trả quá số đã giữ. Đặc biệt, không hứa atomicity/thread-safe nếu implementation chưa bảo đảm.
