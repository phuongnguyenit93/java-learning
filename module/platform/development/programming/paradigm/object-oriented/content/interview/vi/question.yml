- question: Code smell có đồng nghĩa với bug cần sửa ngay không? Bạn ưu tiên refactor theo dữ liệu nào?
  answer: |-
    **Code smell là tín hiệu** chứ không là bằng chứng lỗi hay mệnh lệnh sửa ngay. Một class dài nhưng ít thay đổi có thể ít rủi ro hơn method ngắn được sửa hàng tuần và thường gây regression.

    Hãy xem thay đổi thực tế, lịch sử bug, coupling, độ khó viết test, số caller và ảnh hưởng dữ liệu. Đặt giả thuyết thiết kế, chọn refactor nhỏ nhất có bằng chứng cải thiện, rồi đo lại độ dễ sửa và test.
