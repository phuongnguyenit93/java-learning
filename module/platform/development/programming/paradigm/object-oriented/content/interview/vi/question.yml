- question: Unit test của CheckoutService nên xác minh gì khi inventory không đủ hàng, khi charge bị từ chối, và khi charge
    thành công?
  answer: |-
    Với hợp đồng reserve–charge–send–release được xác định trước:

    - **Không đủ hàng:** reserve trả false, Checkout trả OUT_OF_STOCK, không charge, không gửi và kho không thay đổi ngoài điều contract cho phép.
    - **Charge bị từ chối:** đã reserve thì charge đúng một lần, cần release phần đã giữ theo contract, không gửi receipt; trả DECLINED.
    - **Charge thành công:** reserve rồi charge rồi gửi receipt theo thứ tự business quy định, không charge lặp, trạng thái đúng PAID.

    Dùng fake inventory kiểm tra số lượng cuối và mock/spy để xác nhận không xảy ra các side effect bị cấm. Không chỉ assert verify(method) mà bỏ qua kết quả nghiệp vụ. Test nên có đầu vào null/invalid và exception từ mỗi bước.
