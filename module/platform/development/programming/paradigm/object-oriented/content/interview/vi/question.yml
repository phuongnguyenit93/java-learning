- question: Hai object A và B tham chiếu lẫn nhau nhưng không còn GC root trỏ đến chúng. Có bị giữ mãi vì vòng tham chiếu
    không?
  answer: |-
    Java GC theo mô hình **tracing reachability**, không chỉ đếm số tham chiếu nội bộ. Một graph A ↔ B không có đường strong reference từ GC roots thường có thể được thu hồi **cả graph**, dù A và B tham chiếu lẫn nhau.

    Ngược lại, nếu static List còn giữ A thì A và B tiếp tục reachable và có thể tồn tại lâu hơn nhu cầu nghiệp vụ. Vòng tham chiếu không tự động là memory leak; phải tìm đường giữ từ root. Không có bảo đảm GC thu gom ngay khi đường từ root biến mất.
