- question: CRC Card giúp thiết kế mối quan hệ class, responsibility và collaborator trong một tính năng mượn sách như thế
    nào?
  answer: |-
    CRC là cách mô tả **Class–Responsibility–Collaborator** ngắn gọn. Với BorrowBookService, responsibility là điều phối use case; collaborator là Policy, BookCopy và LoanRepository. BookCopy chịu trách nhiệm quản lý trạng thái bản sách; Policy xét điều kiện nghiệp vụ; repository chịu trách nhiệm truy xuất/lưu.

    Khi phác CRC, hỏi **ai biết dữ liệu cần để quyết định**, **ai thực thi**, **ai chịu trách nhiệm nếu thất bại**. Nếu service phải chọc vào field của nhiều class để tự đổi trạng thái, có thể đang đặt hành vi sai chỗ.

    CRC không thay cho kiểm thử và phân tích transaction: invariant trải qua nhiều aggregate hoặc request đồng thời còn đòi ranh giới lưu trữ/khóa phù hợp.
