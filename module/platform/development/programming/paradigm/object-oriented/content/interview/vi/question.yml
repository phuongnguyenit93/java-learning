- question: Bạn sẽ kiểm thử encapsulation thế nào ngoài các ca thao tác thành công?
  answer: |-
    Kiểm thử constructor từ chối state ban đầu sai; biên số 0/âm, quá số dư hoặc capacity; overflow; thứ tự state transition; và đặc biệt **không đổi state sau thao tác thất bại**.

    Kiểm tra đường rò rỉ: sửa list nguồn sau constructor, thử `clear()` snapshot, thay element mutable và kiểm tra bản gốc. Với `Order`, test không `ship()` trước `pay()`; với Account, test nạp/rút và các lỗi số học. Khi hỗ trợ đa luồng, thêm test race/visibility nhưng không dựa riêng vào test may rủi để chứng minh thread safety; cần lập luận cơ chế đồng bộ.
