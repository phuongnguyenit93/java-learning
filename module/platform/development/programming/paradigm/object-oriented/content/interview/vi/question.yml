- question: Base có public String label(), interface HasLabel có default label(); Derived extends Base implements HasLabel
    sẽ gọi method nào? Hai default độc lập thì sao?
  answer: |-
    Một **instance method từ class/superclass** phù hợp có ưu tiên trước default cùng chữ ký từ interface: new Derived().label() dùng Base.label().

    Nếu class chỉ implements hai interface độc lập đều có default label(), nó phải override để giải quyết xung đột:

    ~~~java
    interface A { default String tag() { return "A"; } }
    interface B { default String tag() { return "B"; } }
    class Both implements A, B {
        @Override public String tag() {
            return A.super.tag() + B.super.tag();
        }
    }
    // new Both().tag() trả "AB".
    ~~~

    Nếu interface con override default của interface cha, phương thức của interface chuyên biệt hơn được chọn theo quy tắc kế thừa. Đây là giải quyết xung đột behavior, không phải đa kế thừa state.
