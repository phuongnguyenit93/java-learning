- question: Một Order chuyển từ DRAFT sang CONFIRMED có đổi danh tính object không? Hai Order nạp từ cùng orderId có chắc
    là cùng instance?
  answer: |-
    **Không.** Thay đổi trạng thái của một Order không tạo instance mới; biến tham chiếu vẫn trỏ cùng object. Với hai biến tham chiếu, toán tử == kiểm tra cùng **instance trong JVM**, độc lập với trạng thái hiện tại.

    **Identity nghiệp vụ** như orderId có thể giống nhau khi hai object Java được nạp từ cùng một bản ghi ở các thời điểm hoặc context khác nhau, nhưng == có thể false. Chọn quy tắc equals theo ý nghĩa domain. Không dùng System.identityHashCode() như mã định danh nghiệp vụ, vì giá trị đó không bảo đảm duy nhất hoặc bền vững.
