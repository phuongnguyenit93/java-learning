- question: Trong Java, khác nhau giữa ==, equals(), điều kiện short-circuit và toán tử gán/tăng giảm khi viết quy tắc OOP?
  answer: |-
    Với primitive, **==** so sánh theo quy tắc giá trị của primitive; với reference, == so **cùng object**, còn equals() mô tả **bình đẳng ngữ nghĩa** theo implementation.

    ~~~java
    String a = new String("java");
    String b = new String("java");
    System.out.println(a == b);      // false
    System.out.println(a.equals(b)); // true
    ~~~

    **&&** và **||** short-circuit, giúp tránh đọc phần tử khi object null, ví dụ name != null && !name.isBlank(). Ngược lại boolean **&** và **|** đánh giá cả hai toán hạng, có thể khiến lời gọi phía sau vẫn chạy.

    Cần chú ý ++ trước/sau trả giá trị khác thời điểm, int/int thực hiện chia nguyên, phép toán int/long có thể overflow, và final field chỉ ngăn gán lại reference chứ không làm đối tượng tham chiếu immutable. Chọn biểu thức theo contract nghiệp vụ, không chỉ cú pháp ngắn.
