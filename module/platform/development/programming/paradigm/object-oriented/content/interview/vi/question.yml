- question: Vì sao private field cộng public getter/setter chưa chắc là thiết kế encapsulation tốt?
  answer: |-
    Một setter `setBalanceVnd(x)` cho phép caller bỏ qua tất cả quy tắc rút/nạp tiền, thậm chí gán số âm. Encapsulation phải bảo vệ **quy tắc chuyển trạng thái**, không chỉ giấu field.

    Đối với BankAccount, nên cung cấp `deposit(amount)`, `withdraw(amount)` với kiểm tra amount dương, nguồn đủ số dư và overflow. Getter phù hợp để đọc; setter chỉ thích hợp nếu phép gán trực tiếp là hành vi nghiệp vụ hợp lệ. Thiết kế method theo ngôn ngữ miền nghiệp vụ giúp giảm việc caller lặp lại validation.
