- question: List<?> có phải luôn read-only hoặc tương đương List<Object> không? Khi nào wildcard capture helper có ích?
  answer: |-
    List<?> nghĩa là danh sách có **một kiểu phần tử chưa biết**, không phải List<Object>. Có thể đọc phần tử thành Object, không thể add một giá trị non-null tùy ý vì compiler không biết đúng kiểu. Bản thân danh sách có thể **mutable**, và người giữ reference có kiểu cụ thể vẫn có thể sửa nó.

    Wildcard capture helper dùng khi cần làm việc với một kiểu chưa biết **nhưng phải nhất quán trong cùng lời gọi**, chẳng hạn hoán đổi hai phần tử của List<?> bằng một generic helper nhận List<T>. Helper gắn một tên T vào captured type cho compiler chứng minh phép gán an toàn.

    Không dùng cast raw để né capture nếu có thể diễn đạt quan hệ bằng generic method; cast unchecked có thể chuyển compile-time warning thành runtime lỗi.
