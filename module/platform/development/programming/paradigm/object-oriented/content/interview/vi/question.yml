- question: Bạn sẽ test Facade với nhiều bước side effect ra sao?
  answer: 'Test kết quả quan sát được và thứ tự **thực sự thuộc hợp đồng**: validate trước tính phí, không gửi notification
    khi thu tiền chưa thành công. Giả lập lỗi tại từng collaborator, xác minh trạng thái sau thất bại, yêu cầu rollback/compensation
    hay pending rõ ràng. Tránh test quá chi tiết tất cả method internal vì sẽ khiến refactor khó. Dùng dependency injection
    và contract/integration test cho boundary thật.'
