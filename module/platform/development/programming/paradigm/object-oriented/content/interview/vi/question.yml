- question: Rich Domain Model và Anemic Domain Model khác nhau ở việc bảo vệ invariant của Order như thế nào?
  answer: |-
    Mô hình **anemic** thường bộc lộ data qua setter, để service bên ngoài thực hiện luật trạng thái; nhiều caller dễ bỏ qua hoặc sao chép validation. **Rich Domain Model** đặt method nghiệp vụ gần state sở hữu: Order.addItem, confirm, cancel, total.

    Ví dụ cần bảo vệ: chỉ thêm sản phẩm khi DRAFT; quantity dương; không confirm đơn trống; sau CONFIRMED không sửa lines; tổng tiền luôn đúng. Thay setter tùy ý bằng domain commands và API đọc an toàn.

    Rich không có nghĩa entity tự gửi email, gọi DB hoặc tính mọi thứ ở hệ thống. Các bước I/O và use case cross-aggregate đặt ở service/adapters phù hợp; transaction/concurrency vẫn phải xử lý nơi lưu trữ.
