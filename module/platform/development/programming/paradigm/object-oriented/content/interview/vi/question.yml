- question: Overloading, overriding, field hiding và static method hiding khác nhau ra sao khi reference có kiểu cha nhưng
    object là lớp con?
  answer: |-
    **Overloading** được chọn chủ yếu bằng kiểu tĩnh/declared type của biểu thức tại compile time. **Overriding** chọn implementation instance method dựa vào runtime type. **Field access** và **static method hiding** thường được phân giải theo kiểu khai báo, không dynamic dispatch như method override.

    ~~~java
    class Parent {
        String label = "P";
        String call(Object x) { return "object"; }
        String name() { return "P"; }
    }
    class Child extends Parent {
        String label = "C";
        String call(String x) { return "string"; }
        @Override String name() { return "C"; }
    }
    Parent x = new Child();
    System.out.println(x.label);       // P
    System.out.println(x.call("hello")); // object
    System.out.println(x.name());      // C
    ~~~

    Ở x.call("hello"), overload String không thuộc API overload được nhìn thấy từ Parent. Phân biệt rõ các quy tắc khi debug kết quả tưởng như mâu thuẫn.
