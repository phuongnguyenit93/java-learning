- question: Khi nào regression test cũ cần thay đổi sau refactor, và làm sao phân biệt thay đổi nghiệp vụ với thay đổi cấu
    trúc?
  answer: |-
    **Refactor thuần** phải giữ nguyên hành vi được contract cho phép: cùng input/state phải có kết quả, lỗi và side effect như trước. Nếu test đúng theo contract đỏ, cần điều tra regression; không nên sửa expected chỉ để suite xanh.

    Nếu yêu cầu mới bổ sung discount hoặc thay ngưỡng miễn phí, đó là **thay đổi chức năng**. Cập nhật đặc tả và test có chủ đích, đồng thời bảo vệ các phần contract vẫn giữ. Các test quá phụ thuộc private helper có thể được thay bằng tests hành vi khi helper đổi cấu trúc.

    Làm từng bước nhỏ, chạy test trước/sau, rà soát caller/serialization và các ranh giới tích hợp. Một suite xanh không chứng minh không còn lỗi; nó chỉ là bằng chứng trên tập case được chọn.
