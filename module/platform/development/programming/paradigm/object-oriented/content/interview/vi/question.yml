- question: Khi nào một if tính phí tốt hơn Strategy/Factory và khi nào nên mở rộng?
  answer: |-
    Một chính sách phí duy nhất (dưới 500.000 VND: 30.000 VND; từ mức đó: miễn phí) chỉ cần method được đặt tên, validate và test mốc biên. Factory/Strategy nhiều lớp chưa tạo giá trị.

    Khi **biến thể thật** theo vùng/gói/hạng khách xuất hiện và cần test thuật toán riêng, FeePolicy strategy có thể giúp mở rộng ít sửa caller. Giữ một điểm chọn policy rõ, contract chung và regression tests.
