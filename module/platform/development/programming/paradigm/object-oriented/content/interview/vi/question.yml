- question: Khi nào chọn instance field, static field và static final constant?
  answer: |-
    Instance field lưu state riêng của từng object, như số đăng ký từng Workshop. Static field thuộc class trong ngữ cảnh class loader; phù hợp với constant hoặc dữ liệu thực sự chung trong một JVM. `static final` ngăn gán lại field, nhưng không làm object mutable mà nó giữ trở nên bất biến.

    Không dùng mutable static field làm nguồn dữ liệu chuẩn của tồn kho hay số dư trên nhiều server: mỗi JVM có state khác nhau, restart làm mất dữ liệu, không có transaction hay durability. Khi phải chia sẻ xuyên tiến trình cần lưu trữ và phối hợp phù hợp.
