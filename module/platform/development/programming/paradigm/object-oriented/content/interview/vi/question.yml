    methodSignature: ''
- question: 'Một DiscountPolicy mới trả giá trị âm hoặc ném exception cho amount=0: compiler có phát hiện lỗi LSP không?'
  answer: |-
    Thông thường **không**. Compiler chỉ kiểm tra những thuộc tính tĩnh của override như chữ ký, visibility, return type và giới hạn checked exceptions. Nó không thể chứng minh rằng giá trị âm trái contract hay amount=0 vốn là đầu vào hợp lệ.

    Nếu DiscountPolicy hứa kết quả từ 0 đến subtotal cho mọi subtotal không âm, implementation trả -1 là **làm yếu postcondition**; từ chối 0 là **thắt chặt precondition**. Khi caller tính tổng thanh toán dựa vào lời hứa chung, lỗi có thể lan ra nghiệp vụ.

    Dùng **contract tests chung** chạy trên toàn bộ policy với input 0, giá trị biên, giá trị điển hình, input không hợp lệ và invariant kết quả. Khi thay bằng implementation mới, chạy lại tests, không chỉ dựa vào @Override và compile.
