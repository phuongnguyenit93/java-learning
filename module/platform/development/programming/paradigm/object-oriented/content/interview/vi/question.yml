- question: Vì sao trả List mutable nội bộ nguy hiểm? List.copyOf có tạo deep immutable snapshot không?
  answer: |-
    Trả thẳng `ArrayList` nội bộ cho phép caller `clear()` hoặc thêm/xóa phần tử mà không qua validation. Dùng `List.copyOf(values)` để tạo bản sao không sửa được ở cấp collection, hoặc defensive copy với hợp đồng cụ thể.

    `List.copyOf` chỉ là **shallow copy**: object mutable nằm trong các phần tử vẫn có thể bị sửa. Nó cũng không chấp nhận null element. Snapshot bất biến hoàn toàn cần bảo vệ các phần tử, alias và mọi reference trỏ vào cấu trúc nội bộ.
