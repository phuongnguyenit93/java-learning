- question: Thẻ CRC gồm gì và sử dụng ra sao để thiết kế use case đăng ký workshop?
  answer: |-
    Mỗi **CRC card (Class–Responsibilities–Collaborators)** nêu **lớp nào**, trách nhiệm nó biết/làm và các lớp cần cộng tác. Với Workshop: giữ capacity/danh sách đăng ký; Student: danh tính và điều kiện tham gia; Enrollment: dữ liệu lần đăng ký; RegistrationService: điều phối repository, Workshop, notification.

    Diễn tập bằng cách "đóng vai" từng thẻ: ai nhận thông điệp đầu, cần hỏi ai, ai được cập nhật state, lỗi nào chặn trước khi có side effect? Nếu hai thẻ cùng sở hữu một rule hoặc không ai chịu trách nhiệm, mô hình cần sửa. CRC là công cụ làm rõ cộng tác, **không phải mỗi trách nhiệm bắt buộc ứng với một method**.
