- question: synchronized trên deposit/withdraw của một Account mang lại gì và không mang lại gì?
  answer: |-
    Nếu tất cả thao tác đọc–kiểm tra–ghi cùng khóa trên **một instance Account**, `synchronized` giúp thao tác trên instance đó không xen kẽ và cung cấp quy tắc memory visibility giữa các lần vào/ra khóa. Điều này hỗ trợ giữ invariant khi nhiều thread chia sẻ cùng object.

    Nó không khóa **các bản sao Account khác** trong JVM, không đồng bộ giữa các server và không cung cấp transaction DB. Với thao tác cần khóa **hai** account, phải thiết kế thứ tự khóa thống nhất để tránh deadlock, hoặc dùng giải pháp ở tầng giao dịch/persistence.
