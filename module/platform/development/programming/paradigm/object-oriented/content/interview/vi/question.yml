- question: final trên method, class và field khóa chính xác những điều gì? Có đồng nghĩa thread-safe hoặc immutable không?
  answer: |-
    `final` trên **instance method** ngăn subclass override method đó. `final class` ngăn subclass kế thừa class, nhưng chính class final vẫn có thể extends superclass/implements interface. `final` trên biến/field ngăn **gán lại** sau khi đã gán hợp lệ.

    Không cái nào tự làm object mutable trở thành immutable hoặc thread-safe: `final List<String> list` vẫn có thể `add()` nếu implementation mutable và API cho phép. Một `final` method vẫn có thể sửa state và gọi một overridable hook khác, nên cần thiết kế invariant và đồng thời riêng.
