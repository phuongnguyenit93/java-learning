- question: Điều gì quyết định trạng thái và hành vi nào nên đặt trong Employee superclass thay vì subclass cụ thể?
  answer: |-
    Superclass nên giữ những quy tắc **thật sự chung và ổn định**: ví dụ `id`, `fullName`, validation tên, và một luồng in phiếu lương dùng chung. `SalariedEmployee` giữ lương cố định, `HourlyEmployee` giữ giờ và đơn giá. Method `monthlyPay()` là điểm chuyên biệt hóa với nghĩa thống nhất.

