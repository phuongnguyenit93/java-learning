- question: Template Method kết hợp final và protected abstract giải quyết vấn đề gì, có rủi ro gì?
  answer: |-
    Superclass đặt **quy trình chung cố định** trong một method `final`, ví dụ validate → normalize → biến đổi → kiểm tra/ghi nhận kết quả. Một `protected abstract transform(...)` là điểm mở rộng cho subclass thực hiện phần thay đổi.

    Nhờ `final`, subclass không được bỏ qua validation của template. Nhưng hook vẫn phải có **hợp đồng rõ**, tránh gọi trong constructor hoặc làm lộ quá nhiều state `protected`. Nếu biến thể cần ghép linh hoạt logging, retry, cache hay nhiều chính sách độc lập, composition/decorator có thể tốt hơn cây subclass.
