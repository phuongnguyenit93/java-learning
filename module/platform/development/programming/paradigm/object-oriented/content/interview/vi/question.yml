- question: Dùng @Autowired hoặc constructor injection trong Spring có đồng nghĩa tuân DIP không? Nếu có hai PaymentGateway
    bean thì sao?
  answer: |-
    **Không.** @Autowired hoặc constructor injection chỉ quyết định **bean được cung cấp như thế nào**. Nếu application service khai báo constructor nhận concrete BankSdkAdapter thay vì PaymentGateway contract thuộc core, module nghiệp vụ vẫn phụ thuộc hạ tầng.

    Ví dụ đúng hướng: CheckoutService nhận PaymentGateway, các adapter implements PaymentGateway và Spring lắp bean. Nếu có **nhiều bean cùng kiểu**, container cần quy tắc chọn rõ như @Qualifier hoặc @Primary khi phù hợp; nếu không có cách phân giải, khởi tạo có thể thất bại vì ambiguity.

    Spring chỉ hỗ trợ lifecycle/wiring; unit tests vẫn cần fake cho business, và integration tests phải kiểm chứng adapter/bean configuration, transaction, lỗi ngoài hệ thống. Annotation không tự làm contract về idempotency, lỗi và tiền tệ đúng.
