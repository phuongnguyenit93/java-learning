- question: Prototype chain có thể gây chia sẻ state mutable ngoài ý muốn như thế nào?
  answer: |-
    Nếu property trên prototype trỏ đến array/object mutable, nhiều instance được tạo qua `Object.create(proto)` có thể dùng chung chính object ấy khi mutate. Ngược lại gán property riêng lên instance có thể shadow property ở prototype.

    Ví dụ hợp lệ:

    ```javascript
    const proto = { tags: [] };
    const a = Object.create(proto);
    const b = Object.create(proto);
    a.tags.push("oop");
    console.log(b.tags); // ["oop"]
    a.tags = ["java"];
    console.log(b.tags); // ["oop"]
    ```

    Hãy cấp mutable state cho từng instance nếu muốn độc lập. Đây không phải “JavaScript sao chép prototype”; cơ chế chính là liên kết và property lookup.
