- question: Decorator có thể đáp ứng OCP như thế nào, và tại sao bọc log quanh PaymentGateway không chứng minh thanh toán
    đã thành công?
  answer: |-
    Decorator **implements cùng interface với thành phần được bọc**, có thể thêm metrics, audit hoặc retry quanh lời gọi rồi delegation sang gateway. Client vẫn làm việc với PaymentGateway; không phải thêm logic đo đạc vào mọi implementation.

    Ví dụ lớp TimingGateway bọc gateway để đo thời gian. Tuy nhiên một log sau lời gọi không ném exception chỉ nói **method đã trả về bình thường** theo API đó. Nếu gateway trả PENDING hoặc accepted nhưng chưa settled, ghi SUCCESS là sai semantics.

    Retry decorator đặc biệt phải tôn trọng **idempotency, timeout và unknown outcome**; nếu yêu cầu thanh toán đã hoàn tất nhưng response mất, retry thiếu khóa chống trùng có thể thu tiền hai lần. OCP không cho phép phá hợp đồng nghiệp vụ.
