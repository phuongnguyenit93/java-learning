- question: Adapter giải quyết ranh giới nominal typing và hợp đồng nghiệp vụ như thế nào? Khi nào composition tốt hơn extends?
  answer: |-
    Adapter công bố **interface mà client cần**, giữ đối tượng nguồn như collaborator và **ủy quyền/chuyển đổi** lời gọi, dữ liệu, lỗi theo contract. Đây là cách phù hợp với thư viện legacy không implements interface của ứng dụng, hoặc hai API giống kỹ thuật nhưng khác ý nghĩa.

    Ví dụ MessageSenderAdapter implements MessageSender, giữ LegacyTransport rồi chuyển send(message) thành transport.deliver(payload), ánh xạ kết quả và exception theo hợp đồng MessageSender. Adapter không nên giả vờ thành công nếu tầng dưới báo lỗi.

    **Composition** không ép adapter thành subtype của LegacyTransport; có thể thay đối tượng được bọc độc lập, tránh kế thừa state/logic không cần thiết và giữ boundary ổn định. Dù adapter hợp lệ về kiểu, vẫn cần contract tests cho semantics.
