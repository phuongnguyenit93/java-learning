- question: Constructor phải thiết lập invariant như thế nào trước khi công bố một instance?
  answer: |-
    Một constructor tốt bảo đảm **nếu tạo thành công thì đối tượng ở trạng thái hợp lệ**. Với CourseEnrollment, có thể yêu cầu courseId không rỗng, capacity dương, số người đăng ký trong khoảng 0..capacity và danh sách không có phần tử sai/duplicate.

    Kiểm tra đầu vào và quan hệ giữa các field ngay ở đường khởi tạo, dùng ngoại lệ nếu điều kiện không đáp ứng. Với dữ liệu mutable, cần cân nhắc **defensive copy**. Field final chỉ ngăn gán lại tham chiếu, không ngăn chỉnh nội dung List mà field trỏ tới. Nếu tạo object dở dang rồi gọi setter để bổ sung dữ liệu sau, một caller khác có thể sử dụng object trước khi invariant đúng. Các method mutation sau này cũng phải giữ invariant.
