- question: Tại sao hai class có cùng phương thức send(String) không tự động tương thích với một interface MessageSender trong
    Java?
  answer: |-
    Quan hệ subtype giữa class/interface trong Java là **nominal typing**: class cần khai báo implements MessageSender (hoặc kế thừa hợp lệ) mới có quan hệ đó. Việc có method trùng tên/chữ ký do tình cờ **không** khiến một class là subtype của interface.

    ~~~java
    interface MessageSender { void send(String message); }
    final class LegacySender {
        public void send(String message) {}
    }
    // MessageSender sender = new LegacySender(); // Lỗi compile-time.
    ~~~

    Nếu không thể sửa LegacySender, viết **adapter** implements MessageSender và ủy quyền sang LegacySender. Như vậy contract được khai báo tường minh và còn có chỗ chuyển đổi tham số, lỗi, kết quả. Không dùng cast để “ép” quan hệ subtype không tồn tại.
