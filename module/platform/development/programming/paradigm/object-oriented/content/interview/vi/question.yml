- question: Tại sao @Override quan trọng và một override hợp lệ cần tôn trọng các quy tắc nào?
  answer: |-
    `@Override` giúp compiler phát hiện sai tên/tham số khiến method tưởng được override thực chất là overload hoặc method mới. Override instance method phải có chữ ký tương thích, return type **tương thích/covariant**, không **giảm mức truy cập**, và không mở rộng phạm vi **checked exceptions** so với method cha.

    Không override được method `final`; method `private` không được kế thừa như một phương thức có thể override; method `static` cùng chữ ký là hiding. Vượt qua kiểm tra biên dịch vẫn chưa đủ: subclass cần giữ precondition, postcondition, invariant và side effect mà superclass cam kết.
