- question: Vì sao Dog[] gán sang Animal[] được nhưng List<Dog> không gán sang List<Animal>? Lỗi nào có thể xuất hiện?
  answer: |-
    Java array **covariant** nên Animal[] animals = new Dog[1] hợp lệ. JVM giữ component type của array; phép animals[0] = new Cat() sẽ ném **ArrayStoreException** tại runtime (giả sử Cat không phải Dog).

    ~~~java
    class Animal {}
    class Dog extends Animal {}
    class Cat extends Animal {}
    Animal[] arr = new Dog[1];
    // arr[0] = new Cat(); // ArrayStoreException.
    ~~~

    Java generics **invariant**, nên List<Dog> không gán được cho List<Animal> ngay khi compile. Để chỉ đọc dạng Animal, dùng List<? extends Animal>; để ghi Dog vào một collection thích hợp, cân nhắc List<? super Dog>.

    Array reified và generic type erasure có cơ chế runtime khác nhau, vì vậy không thể suy từ tính covariant của array ra cho List.
