- question: JavaScript dùng cú pháp class thì có còn prototype-based không? Có phải Prototype design pattern không?
  answer: |-
    JavaScript `class` cung cấp cú pháp thuận tiện để định nghĩa constructor, method và inheritance, nhưng method instance thông thường vẫn tham gia lookup qua **prototype chain**. Không nên suy ra cơ chế giống hoàn toàn Java chỉ vì cùng từ khóa `class`.

    **Prototype design pattern** là mẫu thiết kế tạo đối tượng mới bằng clone/copy một đối tượng mẫu. **Prototype-based OOP** là mô hình delegate/property lookup thông qua prototype object, không yêu cầu clone toàn bộ.

    Ví dụ `Object.create(proto)` tạo object mới liên kết đến `proto`, không sao chép sâu mọi property của prototype. Phân biệt hai khái niệm này quan trọng khi thảo luận aliasing và ownership.
