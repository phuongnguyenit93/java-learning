- question: Type parameter và type argument khác nhau ra sao trong Box<T>, Pair<K,V> và generic method? Static method có dùng
    trực tiếp T của generic class không?
  answer: |-
    Trong class Box<T>, **T** là *type parameter* của khai báo; ở Box<String>, **String** là *type argument* tại điểm sử dụng. Pair<K,V> có hai tham số độc lập. Một generic method tự khai báo type parameter của riêng nó, ví dụ static <U> U identity(U value).

    Static member thuộc **class**, không thuộc từng specialization. Vì vậy static method không thể sử dụng trực tiếp **T khai báo ở cấp instance generic class**; nó phải có type parameter của chính method nếu cần:

    ~~~java
    final class Box<T> {
        private final T value;
        Box(T value) { this.value = value; }
        T get() { return value; }
        static <U> U identity(U value) { return value; }
    }
    ~~~

    Suy luận diamond/new Box<>("a") hỗ trợ giảm lặp type argument nhưng không cho phép bỏ qua các ràng buộc compile-time.
