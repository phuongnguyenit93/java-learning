- question: 'Một class giữ PaymentGateway được inject qua constructor: đó chắc chắn là association hay dependency?'
  answer: |-
    Đây là **phụ thuộc vào hợp đồng PaymentGateway** để thực hiện hành vi. Do giữ field qua nhiều lời gọi, ta cũng quan sát được một tham chiếu cấu trúc lâu dài; nhưng không nên tự suy ra gateway là **thành phần sở hữu về vòng đời** của object hoặc là mối liên hệ nghiệp vụ như Order–Customer.

    Trong sơ đồ UML, dependency có thể dùng nét đứt có mũi tên mở, còn association là nét liền tùy điều muốn biểu diễn. Khi vẽ, nhất quán về mức trừu tượng: dependency trong code, association trong mô hình object và policy ownership là các chiều cần giải thích tách biệt.
