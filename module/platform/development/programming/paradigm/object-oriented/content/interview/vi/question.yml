- question: Refactoring khác gì với sửa bug hoặc thay đổi tính năng? Những phần nào của hành vi phải giữ nguyên?
  answer: |-
    **Refactoring** thay cấu trúc nội bộ nhằm tăng khả năng đọc, kiểm thử và mở rộng, trong khi giữ **hợp đồng quan sát được**. Hợp đồng có thể gồm output, exception, mutation, thứ tự side effect, giao thức công khai và performance nếu đã cam kết.

    Sửa bug làm hành vi từ sai thành đúng; thêm tính năng làm thay yêu cầu. Nên tách commit refactor và business change để khi test đỏ biết nguyên nhân. Không dùng câu "chạy được" để kết luận hành vi đã bảo toàn.
