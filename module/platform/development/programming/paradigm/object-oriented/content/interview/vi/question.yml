- question: Hợp đồng phương thức nên mô tả những gì để tạo được bộ test có giá trị, không chỉ assert return value?
  answer: |-
    Một hợp đồng có thể kiểm thử cần rõ **precondition, postcondition, invariant và failure semantics**. Với ReserveService.tryReserve(qty), phải định nghĩa qty=0 có hợp lệ không, qty âm ném lỗi gì, hết hàng trả false hay result từ chối, và kho có thay đổi sau thất bại hay không.

    Bộ test nên có cả kết quả và **observable state** trước/sau, thứ tự hiệu ứng quan trọng và các trường hợp sát ngưỡng. Ví dụ một method trả false nhưng đã giảm kho thì đã vi phạm hợp đồng dù assertion trên boolean có thể xanh.

    Given–When–Then giúp diễn đạt tình huống; test độc lập, tránh phụ thuộc giờ hệ thống, network hoặc dữ liệu chung. Contract của đối tượng **không tự chứng minh tính nhất quán qua nhiều process**, nên cần kiểm thử tích hợp/concurrency riêng khi domain đòi hỏi.
  aiGenerated: true
