- question: Constructor hoặc static factory cần kiểm tra gì, và vì sao validation chỉ trong REST controller là chưa đủ?
  answer: |-
    Mọi đường **tạo hoặc sửa state** có thể phá invariant đều cần được bảo vệ: constructor, static factory, hành vi mutate và đôi khi quá trình tái dựng từ persistence. Với một `User`, điều kiện `username` không rỗng thuộc về object nếu đó là invariant, dù object được tạo từ API, test, batch hay message queue.

    Controller/DTO có thể kiểm tra định dạng request để trả lỗi dễ hiểu; domain vẫn tự bảo vệ quy tắc của mình. Ngược lại, username duy nhất trong toàn hệ thống cần repository/database constraint và chiến lược chống race; một constructor không thể tự bảo đảm điều kiện xuyên nhiều object hoặc tiến trình.
