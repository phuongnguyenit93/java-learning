- question: Fat interface và quá nhiều lớp abstraction khác nhau thế nào?
  answer: |-
    **Fat interface** ép client chỉ cần đọc phụ thuộc thêm save/delete/approve; một implementation chỉ đọc bị buộc khai báo method không hỗ trợ. **Over-abstraction** là chuỗi ReaderFactory → Provider → Facade → Adapter → Store chỉ forward lời gọi.

    Theo ISP, chia theo **nhóm capability của client** như DocumentReader/DocumentWriter, không phải mỗi method một interface. Xóa tầng không có trách nhiệm/biến thể thật; đừng lấy số lượng interface làm thước đo SOLID.
