- question: Java interface hiện đại có những loại method nào? int count = 0 hoặc List<String> CODES trong interface có phải
    state instance không?
  answer: |-
    Java interface có **abstract method** (public abstract ngầm định), **default** và **static method** từ Java 8, cùng **private helper method** từ Java 9 theo quy tắc. Field khai báo trực tiếp luôn là **public static final**, phải khởi tạo; interface không có constructor hay instance field.

    Do vậy int count = 0 là constant ở cấp kiểu, không phải bộ đếm riêng của từng instance; class triển khai giữ field nếu cần state per-instance. Hơn nữa List<String> CODES = new ArrayList<>() là **tham chiếu final tới một List có thể sửa**. Caller vẫn có thể add vào List, tạo state dùng chung ngoài ý muốn. Dùng cấu trúc immutable hoặc API kiểm soát thay đổi nếu cần.
