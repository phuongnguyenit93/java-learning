- question: 'Ticket.assignee và Agent.tickets là hai phía của cùng quan hệ: thao tác chuyển ticket từ Lan sang Minh cần làm
    gì?'
  answer: |-
    Nếu mô hình giữ cả hai hướng, invariant cần là: `ticket.assignee == a` **khi và chỉ khi** `a.tickets` chứa ticket. Để chuyển, kiểm tra ticket và người đích, quy tắc công việc, rồi thực hiện một thao tác có kiểm soát: gỡ ticket khỏi tập của Lan, cập nhật assignee, thêm vào tập của Minh.

    Getter trả trực tiếp `Set` mutable hoặc public setter riêng cho hai phía cho phép caller phá invariant. Nên tập trung cập nhật vào một method như `ticket.assignTo(agent)`, xử lý cùng-đích thành no-op nếu phù hợp, và test cả hai hướng sau thành công lẫn thất bại. Khi đồng thời, cần bảo vệ toàn thao tác thay vì chỉ ba câu lệnh đơn lẻ.
