- question: Vì sao thêm một phương thức protected overridable ở lớp nền có thể làm hỏng subclass dù public API không đổi?
  answer: |-
    Subclass có thể dựa vào **thứ tự và số lần** superclass gọi protected hook. Nếu lớp nền đổi cách gọi hook, subclass có side effect, cache hoặc giả định state cũ sẽ hành xử khác. Đây là một dạng **fragile base class**, dù chữ ký API public vẫn còn nguyên.

    Giảm rủi ro bằng cách tài liệu hóa rõ hook extension, giới hạn mutable state được mở, giữ invariant trong final template method và chạy contract tests cho mọi subtype chịu ảnh hưởng. Khi không thực sự cần kế thừa hành vi, composition với dependency có hợp đồng rõ thường làm phụ thuộc dễ theo dõi hơn.
