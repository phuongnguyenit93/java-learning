- question: new Customer(...) tạo object Java qua những bước nào và vì sao việc cấp phát object khác với mở file hoặc socket?
  answer: |-
    Biểu thức new yêu cầu tạo instance và thực hiện quá trình khởi tạo theo quy tắc Java: instance field nhận giá trị mặc định, các constructor/field initializer/instance initializer chạy theo trình tự phù hợp. Nếu toàn bộ khởi tạo kết thúc bình thường, caller mới nhận kết quả tham chiếu. JVM có thể tối ưu cách bố trí vật lý; đừng suy ra tham chiếu chính là địa chỉ heap cố định.

    **Tài nguyên ngoài heap** như file descriptor hoặc socket có vòng đời riêng. Một object thuần dữ liệu không cần close, nhưng lớp giữ file, socket hay connection phải đóng đúng hợp đồng API. GC quản lý khả năng thu hồi bộ nhớ Java object và không bảo đảm tự đóng tài nguyên đúng thời điểm.
