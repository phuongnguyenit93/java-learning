- question: 'Order quản lý các OrderLine theo composition: hãy nêu invariant và hành vi khi Order bị hủy/đóng.'
  answer: |-
    Giả sử mỗi OrderLine thuộc **đúng một Order** và không có ý nghĩa độc lập ngoài đơn. Order có thể tạo dòng, từ chối SKU trùng, quantity không dương hay đơn giá âm, và tính tổng bằng `Math.multiplyExact`/`Math.addExact` để tránh overflow.

    Khi domain yêu cầu đóng/hủy Order và xóa các dòng đang được sở hữu, API `closeOrder()` quản lý việc gỡ các dòng đó. Nhưng **quy tắc lưu lịch sử/audit có thể yêu cầu giữ snapshot**; composition không phải mệnh lệnh tuyệt đối phải xóa vật lý row trong database. Test cần xác minh dòng không được share làm part của hai Order và thay đổi vòng đời đúng hợp đồng.
