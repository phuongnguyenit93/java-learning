- question: Tell, Don't Ask áp dụng thế nào với Order; có phải luôn cấm query và getter không?
  answer: |-
    Thay vì lấy `status`, `total` rồi để caller tự phối hợp thay đổi, hãy **yêu cầu object thực hiện hành động**: `order.confirm()`, `order.pay()`, `order.ship()`. Bên trong method kiểm tra đúng state, điều kiện cần và cập nhật các field liên quan đồng bộ.

    Tell, Don't Ask là nguyên tắc **phân bổ hành vi**, không phải lệnh cấm tất cả getter. Truy vấn `status()`, `total()` để hiển thị hoặc báo cáo vẫn hợp lý; điều cần tránh là đưa toàn bộ quyết định nghiệp vụ và state mutation ra mã bên ngoài, vượt ranh giới ownership.
