- question: Nếu yêu cầu đổi thành “đơn đã đặt không được sửa”, bạn review và test thiết kế OOP thế nào?
  answer: |-
    Trước hết viết invariant: chỉ sửa `lines` khi `status == DRAFT`; `place()` phải từ chối đơn rỗng và chuyển sang PLACED đúng một lần. Logic phải được kiểm tra ở nơi **sở hữu state**, không chỉ chặn trên UI.

    Kiểm tra toàn bộ đường sửa: `setLine`, `changeQuantity`, `removeLine`, getter collection, repository update. Cần bảo vệ representation exposure và bảo đảm lỗi không làm thay một phần dữ liệu.

    Test gồm: thay dòng DRAFT thành công; PLACE đơn rỗng thất bại; đặt thành công; sửa sau PLACED bị từ chối với **snapshot trước/sau bằng nhau**; hủy và từ chối trạng thái không hợp lệ. Đánh giá bằng hành vi và độ dễ sửa lần tới, không phải số class được tạo.
