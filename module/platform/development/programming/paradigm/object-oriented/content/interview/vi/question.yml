- question: SavingsAccount kế thừa BankAccount nhưng luôn từ chối withdraw hợp lệ. Việc đó gây lỗi thiết kế nào và sửa ra
    sao?
  answer: |-
    Vấn đề là **Liskov Substitution Principle**: caller nhận BankAccount và được quyền kỳ vọng withdraw theo hợp đồng lớp cha; kiểu con lại phá điều kiện/hành vi được bảo đảm. Chỉ có tên 'SavingsAccount is a BankAccount' chưa đủ chứng minh quan hệ kế thừa đúng.

    Có thể thiết kế lại hợp đồng chung, tách năng lực rút tiền thành interface riêng, hoặc đưa WithdrawalPolicy/AccountRules vào object qua composition. Lựa chọn phụ thuộc vào yêu cầu nghiệp vụ: tài khoản tiết kiệm thật có được rút trước hạn dưới điều kiện/phí cụ thể hay không?

    Viết **contract tests** chạy trên các implementation được phép thay thế lớp cha. Nếu cùng đầu vào thỏa precondition của cha nhưng một kiểu con ném UnsupportedOperationException ngoài hợp đồng, thiết kế chưa đạt.
