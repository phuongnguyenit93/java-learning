- question: Dependency Injection, Dependency Inversion và Inversion of Control có đồng nghĩa hoàn toàn không?
  answer: |-
    **DI** là kỹ thuật cấp collaborator từ bên ngoài. **DIP** là nguyên lý module nghiệp vụ cấp cao và chi tiết cấp thấp cùng phụ thuộc abstraction phù hợp; abstraction không bị thiết kế theo chi tiết framework/provider. **IoC** là ý tưởng rộng hơn về chuyển quyền điều phối việc lắp ghép/điều khiển sang thành phần khác.

    Java thuần đã làm được DI bằng cách tạo Transport và truyền vào constructor Notifier; không cần Spring. Tuy nhiên DI nhận trực tiếp concrete class vẫn có thể tạo coupling vi phạm mục tiêu của DIP; và không phải lúc nào cũng cần thêm một interface mới nếu abstraction chưa có ý nghĩa.
