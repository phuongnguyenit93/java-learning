- question: BigDecimal.equals và compareTo có thể đưa ra kết quả khác nhau ra sao, và điều đó ảnh hưởng HashSet/TreeSet thế
    nào?
  answer: |-
    BigDecimal.equals() xét cả **giá trị và scale**: new BigDecimal("2.0").equals(new BigDecimal("2.00")) là false. compareTo() trả 0 vì chúng có cùng giá trị số học.

    ~~~java
    var a = new java.math.BigDecimal("2.0");
    var b = new java.math.BigDecimal("2.00");
    System.out.println(a.equals(b)); // false
    System.out.println(a.compareTo(b)); // 0
    ~~~

    **HashSet** dựa equals/hashCode nên có thể giữ cả hai; **TreeSet** dùng compareTo hoặc Comparator để nhận diện các phần tử bằng nhau theo thứ tự, nên có thể chỉ giữ một. Nếu quy tắc nghiệp vụ muốn coi 2.0 và 2.00 là cùng giá trị tiền, hãy **normalize scale hoặc dùng Money value object** có semantics được định nghĩa nhất quán.

    Không dùng compareTo == 0 để thay mọi equality mà chưa xét contract của collection và domain.
