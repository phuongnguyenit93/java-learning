    Đóng gói field bằng private, kiểm tra precondition trong hành vi, chỉ chuyển trạng thái sau khi kiểm tra hợp lệ. Với List<String>, có thể trả List.copyOf(items) như snapshot không cho sửa qua List. Nếu phần tử là object mutable, snapshot container vẫn chia sẻ phần tử; cần thiết kế thêm chính sách defensive copy.
