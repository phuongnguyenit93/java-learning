- question: Composition cho phép thay collaborator lúc chạy theo các cách nào? Việc thay reference có đồng nghĩa sửa object
    cũ không?
  answer: |-
    Có ba lựa chọn thường gặp: (1) chọn policy tại constructor và giữ cố định; (2) có setter/replacePolicy để đổi collaborator giữa các lần gọi; (3) truyền policy riêng cho từng tác vụ.

    Thay một reference từ PercentageDiscount sang FixedDiscount là **thay object cung cấp hành vi**, không đổi bytecode và không nhất thiết sửa trạng thái object cũ. Các policy phải đáp ứng cùng contract về input, output và lỗi.

    Quyết định trước **phạm vi áp dụng**: một request đang chạy có dùng policy cũ hay mới, và ai được phép đổi cấu hình. Nếu collaborator có state hoặc tài nguyên, phải quản lý lifecycle, concurrency và quyền sở hữu khi thay.
