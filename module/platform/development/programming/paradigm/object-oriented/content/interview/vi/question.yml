- question: Một subclass có thể tăng public từ protected khi override không? Có thể giảm mức truy cập không?
  answer: |-
    Subclass được phép **mở rộng mức truy cập**, chẳng hạn override `protected void run()` bằng `public void run()`, khi giữ đúng signature và các quy tắc còn lại. Nhưng override `public` method bằng `protected` hay package-private là lỗi biên dịch vì client từng dùng hợp đồng public phải còn dùng được.

    Constructor không được override; `private` method không tạo override; static member và field có cơ chế hiding khác method động. Khi thiết kế API thư viện, đừng mở quyền chỉ để né một lỗi biên dịch: cân nhắc method bảo vệ đúng trách nhiệm và bất biến.
