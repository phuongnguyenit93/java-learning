- question: HashMap tra không thấy key sau khi người dùng đổi field tham gia hashCode là do đâu, và nên khắc phục thế nào?
  answer: |-
    Khi insert một key, HashMap đặt nó vào bucket dựa trên hash tại thời điểm lưu. Nếu key **mutable** và sau đó field tham gia equals/hashCode bị đổi, tra cứu dùng hash mới có thể tìm bucket khác và không thấy key dù reference vẫn tồn tại.

    Không sửa object dùng làm key theo các field tham gia equality/hash trong lúc nó đang nằm trong map/set. Thường tốt hơn là dùng **immutable value object** như CustomerId, hoặc remove key cũ trước rồi insert key mới theo quy tắc rõ.

    Tương tự, entity JPA có ID sinh sau persist phải được cân nhắc rất kỹ nếu dùng hash-based collections. Đừng đổi hash theo dữ liệu mutable như displayName khi domain identity là ID ổn định.
