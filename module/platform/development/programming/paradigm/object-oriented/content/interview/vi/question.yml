- question: Làm sao refactor OrderService ↔ ShippingService mà không dùng @Lazy như giải pháp thiết kế?
  answer: |-
    Tìm trách nhiệm bị đặt sai chiều: `OrderService` điều phối đặt giao hàng, `ShippingService` chỉ thực hiện nghiệp vụ vận chuyển và không nên quay lại `OrderService` để cập nhật đơn.

    Có thể tạo `ShipOrderUseCase` nhận các dependency cần thiết, lấy order, gọi ShippingGateway, rồi cập nhật OrderRepository theo hợp đồng. Hoặc trích xuất một abstraction/dịch vụ thứ ba C mà cả A và B cùng phụ thuộc, **nếu C có trách nhiệm độc lập thực sự**. `@Lazy` hoặc setter injection có thể né lỗi khởi tạo nhưng **không tự loại bỏ cycle thiết kế** hoặc side effect khi chạy. Test call graph, trạng thái lỗi và transaction.
