- question: Strategy gồm các vai trò nào và được chọn thế nào?
  answer: Context thao tác qua **Strategy interface**, các ConcreteStrategy thực hiện các biến thể thuật toán như DiscountPolicy.
    Có thể inject cố định hoặc chọn theo từng request qua registry. Kiểm tra input, không để client lựa chọn class bất kỳ.
    Contract test mọi implementation theo tiền/hậu điều kiện, cùng các edge cases. Với policy có mutable state dùng chung,
    vẫn phải đánh giá concurrency.
