- question: Một Customer giữ Address mutable. Vì sao new Customer(original.name, original.address) là shallow copy? Làm gì
    để độc lập?
  answer: |-
    Bạn tạo **Customer mới** nhưng hai Customer vẫn chia sẻ đúng một Address. Sửa copy.address.city cũng ảnh hưởng original.address.city. Có thể tạo Address mới trong copy constructor:

    ~~~java
    Customer copy = new Customer(
        original.name,
        new Address(original.address.city)
    );
    ~~~

    Đoạn này tách riêng Address của mô hình đơn giản. Nếu có các object con, List và dữ liệu mutable khác, phải định nghĩa phạm vi **deep copy** rõ ràng. Cũng nên cân nhắc chi phí bộ nhớ/CPU; những object immutable an toàn có thể được chia sẻ mà không cần copy.
