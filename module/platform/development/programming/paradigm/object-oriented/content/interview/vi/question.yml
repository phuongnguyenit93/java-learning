- question: Java có hỗ trợ đa kế thừa class và nhiều interface không? Tại sao nên dùng composition cho nhiều capability có
    state?
  answer: |-
    Java cho mỗi class **một superclass trực tiếp** qua `extends` nhưng có thể `implements` nhiều interface; một interface có thể `extends` nhiều interface. Interface default method cho phép tái sử dụng một phần hành vi, không tạo nhiều superclass có state/constructor như đa kế thừa class.

    Nếu một thiết bị cần pin, GPS và âm thanh, nên chứa các thành phần `BatteryManager`, `GpsEngine`, `AudioPlayer` thay vì cố extends cả ba class (Java không hỗ trợ). Composition cho phép từng thành phần giữ state và thay đổi độc lập mà không tạo quan hệ is-a giả.
