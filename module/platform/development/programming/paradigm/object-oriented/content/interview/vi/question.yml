- question: Hãy định nghĩa invariant chính xác cho Employee ↔ Department và cách kiểm tra sau một lần chuyển phòng.
  answer: |-
    Với mỗi Employee e và Department d: `e.department == d` **khi và chỉ khi** `d.members` chứa e; và một e không xuất hiện ở tập của hai phòng cùng lúc nếu quy tắc chỉ cho một phòng. Nếu department null, e không nằm trong danh sách phòng nào. Capacity của từng phòng cũng phải được tôn trọng.

    Sau `transfer(e, fromA, toB)`, kiểm tra e không còn ở A, đã ở B, không có bản ghi trùng, cả hai collection nhất quán và các invariant capacity đúng. Với chuyển không thay đổi phòng hoặc chuyển về null, cần quy tắc minh bạch. Test happy path, đủ chỗ, phòng đầy và input không tồn tại.
