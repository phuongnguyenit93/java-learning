- question: Default method khác static và private method trong interface thế nào? Dùng default để mở rộng API có luôn an toàn?
  answer: |-
    **default** là public instance method có thân, có thể override và gọi abstract method của interface. **static** thuộc về interface, gọi bằng tên interface và không được override theo dynamic dispatch. **private** hỗ trợ tái sử dụng logic nội bộ giữa các method có thân; client không gọi được.

    Default method cho phép bổ sung hành vi chung mà nhiều implementation cũ không cần viết lại ngay. Tuy nhiên có thể gây xung đột default khi class implements thêm interface, thay đổi hành vi hoặc không phù hợp với semantics của một implementation. Trước khi thêm, xác định rõ contract và chạy test với những implementation quan trọng, thay vì coi default là sửa đổi luôn tương thích.
