- question: Association ở UML khác một liên kết (link) cụ thể giữa hai đối tượng lúc chạy như thế nào?
  answer: |-
    **Association** ở sơ đồ lớp mô tả rằng các instance của hai kiểu *có thể* liên hệ theo một hợp đồng nghiệp vụ. **Link** là một cặp đối tượng thực sự đang liên hệ tại thời điểm chạy, chẳng hạn ticket SUP-42 đang được Agent Lan phụ trách.

    Association không đồng nghĩa quyền sở hữu, cũng không tự nói liên kết bắt buộc hay hai chiều. Cần mô tả riêng **multiplicity**, **navigability** và điều kiện tạo/gỡ/chuyển. Một ticket chưa phân công vẫn có thể hợp lệ nếu multiplicity ở đầu Agent là `0..1`. Việc đổi assignee thay đổi link, không thay đổi định nghĩa class.
