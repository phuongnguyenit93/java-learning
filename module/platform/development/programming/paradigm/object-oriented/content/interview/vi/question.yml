- question: Vì sao quy tắc 'không vượt sức chứa lớp' chưa được bảo đảm chỉ bằng if (remainingSeats > 0)?
  answer: |-
    Một check rồi update tách rời có thể bị **race condition**: hai request đồng thời đều đọc còn một chỗ rồi cùng tạo đăng ký. Domain model đơn luồng có thể bảo vệ invariant khi chạy tuần tự, nhưng trong hệ thống nhiều server cần kiểm soát đồng thời tại storage hoặc transaction boundary.

    Cân nhắc row lock, optimistic locking/version hoặc conditional update cùng unique constraint cho enrollment, tùy DB và isolation. Test nên tạo cạnh tranh trên **chỗ cuối**, đọc lại trạng thái bền vững và xác nhận tối đa một kết quả thành công; synchronized trên một JVM không thay được bảo đảm nhiều tiến trình.
