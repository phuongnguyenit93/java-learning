- question: Một default addTags() gọi addTag() trong vòng lặp có đảm bảo all-or-nothing không?
  answer: |-
    Không. Nếu `addTags(List<String>)` chỉ lặp và gọi `addTag()` lần lượt, thẻ đầu và thứ hai có thể được thêm, còn thẻ thứ ba lỗi. Default method **không tự mang transaction hay atomicity** chỉ vì đặt trong interface.

    Muốn tất cả-or-không, cần validate toàn bộ trước và cập nhật có kiểm soát, hoặc thiết kế batch operation thực sự được implementation bảo đảm nhất quán, có cơ chế đồng bộ/transaction phù hợp. Hợp đồng lỗi phải nói rõ kết quả sau thất bại; caller không nên tự giả định rollback.
