- question: PECS áp dụng thế nào với copy(List<? super T> dest, List<? extends T> src), và có thể đọc/ghi gì ở mỗi phía?
  answer: |-
    **PECS = Producer Extends, Consumer Super.** Source cung cấp T nên chọn List<? extends T>: khi đọc, các phần tử an toàn để coi là T. Destination tiếp nhận T nên chọn List<? super T>: có thể add(T), nhưng khi đọc ra từ dest thường chỉ chắc kiểu Object.

    ~~~java
    static <T> void copy(
            java.util.List<? super T> dest,
            java.util.List<? extends T> src) {
        for (T item : src) {
            dest.add(item);
        }
    }
    ~~~

    Ví dụ copy từ List<Integer> sang List<Number> hợp lệ. Trong API thực, xem thêm trường hợp src và dest cùng collection, giới hạn capacity và yêu cầu đồng bộ. Wildcard diễn đạt quan hệ kiểu tại **vị trí dùng**, không tự tạo immutable collection hay bảo đảm thread safety.
