- question: Trong Spring Boot, @Transactional có đảm bảo rollback email HTTP/SMTP nếu ghi đơn thành công nhưng gửi thông báo
    thất bại không?
  answer: |-
    Không. Transaction database chỉ bao phủ các thao tác **tham gia cùng giao dịch DB** theo cấu hình; HTTP/SMTP ở hệ khác không tự tham gia ACID. Nếu thông báo được gửi trước khi DB rollback, không thể giả định việc rollback sẽ thu hồi được email.

    Có thể dùng **transactional outbox**: lưu Order và outbox event trong cùng transaction DB; worker riêng đọc event rồi gửi thông báo, có retry/idempotency và đối soát. Đây thường là **eventual consistency**: đơn đã được lưu trước khi thông báo đến.

    Vị trí transaction là trách nhiệm application boundary phù hợp, nhưng invariant domain vẫn phải được xác thực qua method nghiệp vụ; annotation không sửa thiết kế sai trách nhiệm.
