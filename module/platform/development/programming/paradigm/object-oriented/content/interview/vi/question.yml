- question: Open/Closed Principle nên được hiểu ra sao khi bổ sung một hãng giao hàng mà không sửa ShippingService?
  answer: |-
    **OCP** hướng tới một lõi **ổn định trước việc thêm biến thể đã dự liệu**, đồng thời mở điểm mở rộng hợp lệ. Định nghĩa ShippingPolicy.feeFor(Order) với contract rõ về input, đơn vị tiền, miền kết quả, exception và side effect. StandardPolicy, ExpressPolicy và SameDayPolicy triển khai công thức khác nhau.

    ShippingService nhận ShippingPolicy và gọi qua interface; thêm SameDayPolicy không bắt service thêm một nhánh instanceof/switch. Composition root hoặc registry đăng ký implementation, nơi cấu hình có thể thay đổi có chủ đích.

    OCP **không yêu cầu cấm sửa source đã viết**. Sửa lỗi, đổi yêu cầu nền tảng hoặc sửa abstraction sai vẫn cần làm. Nếu chỉ có hai lựa chọn cố định và rất ít khả năng mở rộng, một switch đơn giản có thể rõ hơn strategy hierarchy.
