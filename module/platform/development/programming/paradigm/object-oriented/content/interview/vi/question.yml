- question: Một Rich Entity có thể trở thành God Object không? Đặt ranh giới Domain Service như thế nào?
  answer: |-
    Có. Rich chỉ có nghĩa object sở hữu những **hành vi bảo vệ invariant của chính nó**, không phải mọi vấn đề liên quan đến entity đều nằm trong nó. Order.confirm và addItem có thể thuộc Order; còn gửi SMTP, truy vấn nhiều đơn hoặc phối hợp nhiều aggregate thuộc application/domain service và infrastructure tùy vai trò.

    Nếu một quy tắc nghiệp vụ cần nhiều entity nhưng không thuộc tự nhiên về một entity riêng, domain service có thể diễn đạt quy tắc ấy; application service quyết định loading, transaction, saving và external I/O.

    Đánh giá cohesion bằng **lý do thay đổi**: đổi SMTP không nên sửa Order; đổi điều kiện confirm có thể sửa Order. Rich model không miễn kiểm thử concurrency khi invariant trải nhiều giao dịch.
