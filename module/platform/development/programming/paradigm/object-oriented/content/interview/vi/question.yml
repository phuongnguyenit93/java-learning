- question: Vì sao thứ tự Decorator có thể làm đổi hành vi?
  answer: Với **Audit(Retry(base))**, audit ngoài có thể ghi một kết quả cho cả chuỗi retry; với **Retry(Audit(base))**, audit
    trong có thể được gọi mỗi attempt. Thứ tự cũng quan trọng với cache, timeout, transaction và exception. Decorator phải
    giữ contract Component và không báo thành công giả khi delegate lỗi. Test cả mỗi decorator riêng lẻ lẫn những chain có
    ý nghĩa, nhất là các nhánh thất bại.
