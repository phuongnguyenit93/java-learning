- question: 'Trong UML, Employee có 0..3 Project còn Project có 1..* Employee: ghi bội số hai đầu ra sao?'
  answer: |-
    Với `Employee -- Project`, viết `0..3` **gần đầu Project** vì mỗi Employee có thể tham gia không quá ba Project; viết `1..*` **gần đầu Employee** vì mỗi Project có ít nhất một Employee.

    Khi triển khai cần giới hạn số project cho từng employee, cấm/cho phép trùng cặp và từ chối xóa người cuối khỏi một project nếu mô hình vẫn buộc phải có thành viên. Có thể giữ một registry quan hệ thay vì hai tập mutable. Multiplicity không đủ để kết luận association có hướng nào hoặc một Project sở hữu vòng đời Employee.
