- question: Strategy khác State ở mục đích thay đổi hành vi nào?
  answer: '**Strategy** thay thuật toán theo lựa chọn cấu hình hoặc bối cảnh, không đòi transition nghiệp vụ. **State** thay
    hành vi theo trạng thái hiện tại của cùng object với các cạnh chuyển trạng thái hợp lệ. Order DRAFT cho sửa dòng còn PLACED
    từ chối; đó là State. Chọn cách tính giá A/B độc lập là Strategy. Cả hai thường dùng composition/polymorphism, nhưng không
    tự bảo đảm persistence hay atomicity.'
