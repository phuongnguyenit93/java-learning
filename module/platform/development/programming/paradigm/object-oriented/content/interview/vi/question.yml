- question: Phân biệt trách nhiệm 'knowing' và 'doing' trong thiết kế cộng tác đối tượng.
  answer: |-
    **Knowing** là những gì object phải biết hoặc giữ quan hệ: BookCopy biết barcode/trạng thái, Loan biết memberId/copyId/dueDate, Member biết giới hạn mượn. **Doing** là hành vi nó chịu trách nhiệm: BookCopy kiểm tra còn sẵn, Loan được đóng khi trả, Member ghi nhận mượn/trả theo quy tắc.

    Nguyên tắc **Information Expert** gợi ý đặt logic nơi có thông tin và sở hữu invariant; không đồng nghĩa một object phải gọi DB hoặc gửi email. Khi hành vi vượt nhiều aggregate hoặc tích hợp ngoài, service phối hợp các cộng tác viên qua hợp đồng nhỏ, không tự chọc trực tiếp mọi field.
