- question: Khi nào chọn enum + method, bảng transition, State Pattern hoặc workflow engine?
  answer: |-
    Vòng đời ít trạng thái và ít quy tắc thường đủ với **enum + method domain** bảo vệ cạnh/guard. Khi nhiều cạnh cần kiểm tra thống nhất, **transition table** giúp rà soát và test coverage. **State Pattern** phù hợp nếu hành vi thay đổi mạnh theo state và các class state làm API rõ hơn.

    Workflow engine hữu ích khi quy trình dài hạn, timer, human approval, retry hoặc lưu workflow cần được quản lý hệ thống; nó làm tăng độ phức tạp vận hành. Chọn theo số transition, khả năng thay đổi và yêu cầu persistence, không do thấy nhiều trạng thái mà mặc định thêm framework.
