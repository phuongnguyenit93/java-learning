- question: Khi nào nên dùng extends thay vì composition? Vì sao quan hệ 'is-a' chưa đủ nếu subclass không giữ hợp đồng của
    superclass?
  answer: |-
    Kế thừa phù hợp khi lớp con thực sự là một dạng chuyên biệt của lớp cha và **có thể thay thế** lớp cha trong mọi trường hợp mà hợp đồng cha cho phép. Chẳng hạn `HourlyEmployee extends Employee` hợp lý nếu mọi `Employee` đều có `monthlyPay()` với nghĩa nhất quán. Kế thừa không chỉ là sao chép code.

    Composition phù hợp khi đối tượng chỉ **sử dụng** một khả năng khác (`OrderService` dùng `PaymentGateway`) hoặc cần ghép nhiều chính sách độc lập. Nếu subclass thay đổi tiền điều kiện, hậu điều kiện hoặc side effect khiến client kiểu cha hỏng, quan hệ tên gọi 'is-a' vẫn chưa đáp ứng LSP.
