- question: Vì sao một request đọc DiscountPolicy hai lần có thể nhận hai kết quả không nhất quán dù field là volatile?
  answer: |-
    Nếu thread A đọc policy ở bước validate, thread B replace policy, rồi A đọc lại ở bước calculate, **cùng một request có thể sử dụng hai phiên bản**. volatile bảo đảm visibility của reference, không làm cả workflow thành một transaction.

    Có thể lấy Policy current = policy.get() **một lần khi bắt đầu** rồi dùng current cho toàn bộ xử lý cần tính nhất quán. Nếu có nhiều config đồng bộ, dùng immutable configuration snapshot và thay cả snapshot nguyên tử thay vì sửa lẻ từng field.

    Cũng cần xác định thời điểm hủy policy cũ khi còn request đang sử dụng nó; chỉ thay reference không chứng minh không còn in-flight operations.
