- question: Team xóa thành viên khỏi members có nghĩa Employee bị hủy không? Thiết kế API nào giữ đúng nghĩa aggregation?
  answer: |-
    Trong ví dụ aggregation, `Team.removeMember(employeeId)` chỉ xóa **liên kết thành viên**, không xóa Employee khỏi danh bạ hoặc làm biến mất object nhân viên. Employee độc lập vẫn được tham chiếu bởi hệ thống khác và có thể gia nhập Team khác theo quy tắc nghiệp vụ.

    Nên giữ Member/Employee ở một nơi sở hữu phù hợp (directory/repository) và Team chỉ quản lý danh sách membership hợp lệ. Nếu dùng hai chiều thì bảo vệ cập nhật cả hai đầu. Test sau remove phải xác minh không còn trong Team, nhưng `Employee` vẫn tồn tại độc lập. Một bản `List<Employee>` trong Team không tự tạo composition.
