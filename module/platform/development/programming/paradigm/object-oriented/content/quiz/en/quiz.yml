    answers:
    - id: A
      answer: 'Wrapping an object to add logging while retaining its contract'
      explanation: 'Incorrect: preserving the interface to add logging is more characteristic of Decorator than Adapter.'
    - id: B
      answer: 'Representing an object to control access, lazy loading, or remote invocation'
      explanation: 'Incorrect: controlling access, laziness, and remote calls through a representative are Proxy responsibilities.'
    - id: C
      answer: 'Translating a dependency''s different contract into the interface required by the client'
      explanation: 'Correct: Adapter converts a dependency interface into the contract the client expects.'
    - id: D
      answer: 'Providing a simple high-level API over multiple underlying subsystems'
      explanation: 'Incorrect: simplifying access to multiple subsystems through a high-level API is the purpose of Facade.'
    correctAnswerId: C
  - question: 'What problem does the Facade Pattern solve?'
    readmeRelated:
      anchorList:
      - composition-003
      - design-patterns-007
    answers:
    - id: A
      answer: 'It provides a simpler high-level API for a complex subsystem'
      explanation: 'Correct: Facade provides a simplified entry point to multiple components inside a subsystem.'
    - id: B
      answer: 'It translates an incompatible SDK contract into the interface used by the client'
      explanation: 'Incorrect: converting an SDK interface into the client''s interface is Adapter, not typically Facade.'
    - id: C
      answer: 'It encapsulates multiple algorithms so callers can swap them through one contract'
      explanation: 'Incorrect: replacing algorithms through a contract is Strategy, not a high-level subsystem API.'
    - id: D
      answer: 'It wraps an object with the same contract to control access as a proxy'
      explanation: 'Incorrect: controlling access through a representative object is Proxy, not Facade.'
    correctAnswerId: A
  - question: 'How do Decorator and Proxy differ in purpose?'
    readmeRelated:
      anchorList:
      - composition-003
      - design-patterns-006
    answers:
    - id: A
      answer: 'Decorator translates interfaces; Proxy is used only to add logging'
      explanation: 'Incorrect: Decorator usually preserves the contract, and Proxy is not limited to adding logging.'
    - id: B
      answer: 'Decorator represents remote access; Proxy always changes the client contract'
      explanation: 'Incorrect: remote proxies belong to Proxy, while Decorator does not primarily change the client interface.'
    - id: C
      answer: 'Decorator adds behavior; Proxy represents an object and controls access to it'
      explanation: 'Correct: Decorator adds behavior while wrapping an object; Proxy stands in for an object to control or mediate access.'
    - id: D
      answer: 'Decorator creates object families; Proxy changes the order of an algorithm in a superclass'
      explanation: 'Incorrect: Abstract Factory creates product families, and rearranging algorithm steps does not define Proxy.'
    correctAnswerId: C
  - question: 'What must Observer handle to avoid listener leaks?'
    readmeRelated:
      anchorList:
      - lifecycle-006
      - design-patterns-010
      - testing-010
    answers:
    - id: A
      answer: 'Manage subscriptions and unsubscribe or close them at the appropriate lifecycle point'
      explanation: 'Correct: subscriptions must be released or canceled with their lifecycles so unused listeners are not kept alive.'
    - id: B
      answer: 'Use weak references alone to manage all callbacks and their state'
      explanation: 'Incorrect: weak references may help but do not replace all unsubscribe or lifecycle management.'
    - id: C
      answer: 'Emit events asynchronously so unused listeners are removed automatically'
      explanation: 'Incorrect: asynchronous dispatch only changes how events are delivered; it does not unregister listeners.'
    - id: D
      answer: 'Store listeners in a static collection without unregistering them'
      explanation: 'Incorrect: static collections can retain listeners indefinitely and cause memory leaks without unregistration.'
    correctAnswerId: A
  - question: 'What mechanism does Template Method typically use?'
    readmeRelated:
      anchorList:
      - inheritance-003
      - polymorphism-004
      - design-patterns-011
    answers:
    - id: A
      answer: 'A superclass defines the algorithm skeleton, and subclasses override steps or hooks'
      explanation: 'Correct: Template Method defines a skeleton in the superclass and lets subclasses override supported hooks.'
    - id: B
      answer: 'Clients send requests as Commands and handlers choose processing steps'
      explanation: 'Incorrect: Command encapsulates requests rather than providing a superclass-controlled sequence of overridden steps.'
    - id: C
      answer: 'A factory selects a product type and constructs the entire method workflow'
      explanation: 'Incorrect: a factory selects how products are created; it does not define a shared processing algorithm template.'
    - id: D
      answer: 'A class coordinates independent algorithms using an injected Strategy'
      explanation: 'Incorrect: replacing whole algorithms through collaborators is composition-based Strategy, not an inheritance-based fixed skeleton.'
    correctAnswerId: A
  - question: 'Is a Singleton automatically thread-safe?'
    readmeRelated:
      anchorList:
      - design-patterns-004
      - design-pitfalls-008
      - testing-003
    answers:
    - id: A
      answer: 'Yes; static initialization locks all methods after creating the instance'
      explanation: 'Incorrect: static initialization safely creates the instance but does not automatically lock later method calls.'
    - id: B
      answer: 'Yes; having one instance means every thread instantly reads the same value'
      explanation: 'Incorrect: a single instance does not guarantee visibility, ordering, or coordination between threads.'
    - id: C
      answer: 'No; shared mutable state still requires synchronization or careful ownership design'
      explanation: 'Correct: a Singleton does not automatically make operations on shared mutable state atomic or thread-safe.'
    - id: D
      answer: 'Yes; a private constructor makes all operations on state atomic'
      explanation: 'Incorrect: a private constructor restricts creation, not synchronization of state-changing methods.'
    correctAnswerId: C
  - question: 'For what purpose is the Command Pattern useful?'
    readmeRelated:
      anchorList:
      - design-patterns-012
    answers:
    - id: A
      answer: 'Encapsulating requests as objects for queues, scheduling, or undo/redo'
      explanation: 'Correct: Command packages a request as an object for queues, scheduling, logging, or undo/redo under a contract.'
    - id: B
      answer: 'Automatically guaranteeing that all commands commit transactions synchronously'
      explanation: 'Incorrect: Command itself does not guarantee transaction commits or database synchronization.'
    - id: C
      answer: 'Creating objects with a factory and sharing them among callers as singletons'
      explanation: 'Incorrect: factories and singletons concern object creation and sharing, not the definition of request encapsulation.'
    - id: D
      answer: 'Encapsulating interchangeable algorithms through Strategy implementations'
      explanation: 'Incorrect: Strategy encapsulates interchangeable algorithms; Command models a request to be executed.'
    correctAnswerId: A
- groupID: 9
  groupName: 'Domain Modeling and Application Boundaries'
  questions:
  - question: 'When is a Domain Service appropriate?'
    readmeRelated:
      anchorList:
      - class-design-006
      - modeling-003
      - solid-002
    answers:
    - id: A
      answer: 'When a controller needs to convert HTTP requests into commands and response DTOs'
      explanation: 'Incorrect: converting HTTP requests and responses belongs to an interface layer, controller, or mapper.'
    - id: B
      answer: 'When a rule only validates the format of external request data'
      explanation: 'Incorrect: request-format checks are generally boundary validation, not a Domain Service responsibility.'
    - id: C
      answer: 'When a domain rule does not clearly belong to a single entity or value object'
      explanation: 'Correct: a Domain Service suits domain rules that do not naturally belong to one entity or value object.'
    - id: D
      answer: 'When an operation only coordinates repositories and transactions for a use case'
      explanation: 'Incorrect: coordinating repositories and use-case transactions is typically an Application Service responsibility.'
    correctAnswerId: C
  - question: 'Why should business rules not all reside in controllers?'
    readmeRelated:
      anchorList:
      - encapsulation-008
      - class-design-004
      - class-design-007
      - modeling-001
    answers:
    - id: A
      answer: 'The JVM always invokes controllers after repositories, leaving no chance to validate'
      explanation: 'Incorrect: the JVM does not require repositories to run before controllers; that is not how layer coordination works.'
    - id: B
      answer: 'Controllers cannot invoke domain methods in lower layers'
      explanation: 'Incorrect: controllers can call domain methods; the issue is that they should not own all the business rules.'
    - id: C
      answer: 'Controllers run on only one thread and therefore cannot execute business logic'
      explanation: 'Incorrect: controllers can serve many concurrent requests; this is not the main reason for separating business rules.'
    - id: D
      answer: 'Other consumers may bypass or duplicate rules when those rules exist only in controllers'
      explanation: 'Correct: batch jobs and message consumers can bypass controllers, causing controller-only rules to be skipped or duplicated.'
    correctAnswerId: D
  - question: 'How should responsibilities be divided between Application Services and domain objects?'
    readmeRelated:
      anchorList:
      - object-009
      - class-design-004
      - class-design-007
      - modeling-003
      - testing-010
    answers:
    - id: A
      answer: 'Application Services handle entity internals, while the domain directly manages transactions'
      explanation: 'Incorrect: transactions are usually coordinated at application boundaries; entities do not invoke controllers to manage transactions.'
    - id: B
      answer: 'Application Services maintain all invariants, while the domain only creates HTTP responses'
      explanation: 'Incorrect: the domain must protect its invariants and should not be responsible for building HTTP responses.'
    - id: C
      answer: 'Application Services provide DTOs, while the domain calls controllers to return JSON'
      explanation: 'Incorrect: the domain should not depend back on controllers or handle the HTTP layer''s JSON.'
    - id: D
      answer: 'Application Services orchestrate use cases, while domain objects maintain behavior and invariants'
      explanation: 'Correct: Application Services coordinate use cases; domain objects own business behavior and invariants.'
    correctAnswerId: D
  - question: 'Why separate persistence models from domain models?'
    readmeRelated:
      anchorList:
      - abstraction-008
      - class-design-004
      - modeling-009
      - solid-006
    answers:
    - id: A
      answer: 'To isolate the domain from DB/ORM constraints through mappers or persistence adapters'
      explanation: 'Correct: mappers and adapters prevent the domain model from being directly dictated by ORM requirements or database schemas.'
    - id: B
      answer: 'To eliminate the domain''s responsibility for maintaining object invariants'
      explanation: 'Incorrect: the domain must still protect invariants; separating models does not make it an empty data structure.'
    - id: C
      answer: 'To require each layer to maintain a separate database'
      explanation: 'Incorrect: separate models do not require separate databases; both can represent the same underlying data.'
    - id: D
      answer: 'To require every domain entity to inherit directly from a JPA entity'
      explanation: 'Incorrect: domain entities need not be JPA entities; the purpose is to reduce persistence coupling.'
    correctAnswerId: A
  - question: 'Is a DTO for simple CRUD necessarily a bad design?'
    readmeRelated:
      anchorList:
      - oop-basic-008
      - abstraction-007
      - class-design-007
      - design-patterns-013
    answers:
    - id: A
      answer: 'Yes; every CRUD operation requires an aggregate root with many invariants'
      explanation: 'Incorrect: simple CRUD does not inherently require an aggregate root with many invariants.'
    - id: B
      answer: 'No; DTOs should eventually replace all domain entities entirely'
      explanation: 'Incorrect: DTOs do not fully replace domain entities when complex business rules emerge.'
    - id: C
      answer: 'Yes; every DTO must contain all domain behavior before it is used'
      explanation: 'Incorrect: a DTO transports data and need not contain all domain behavior.'
    - id: D
      answer: 'No; simple data models can suit CRUD with few business rules'
      explanation: 'Correct: when CRUD involves few rules, DTOs or simple data models can be appropriate.'
    correctAnswerId: D
  - question: 'How should lost updates be prevented when two requests write the same record?'
    readmeRelated:
      anchorList:
      - design-pitfalls-008
      - testing-003
      - practice-010
    answers:
    - id: A
      answer: 'Use optimistic versioning or a checked conditional update within a transaction'
      explanation: 'Correct: version checks or conditional updates within transactions help detect conflicting writes from concurrent updates.'
    - id: B
      answer: 'Use synchronized in a controller on one node without locking other nodes'
      explanation: 'Incorrect: synchronized on one node does not protect requests executing on other nodes in a distributed system.'
    - id: C
      answer: 'Put status in a static field and sync it back to the database after each request'
      explanation: 'Incorrect: static fields do not make database record updates safe or consistent.'
    - id: D
      answer: 'Only use @Transactional with default isolation and no version checks'
      explanation: 'Incorrect: @Transactional with default isolation does not always prevent lost updates without checking write conditions.'
    correctAnswerId: A
- groupID: 10
  groupName: 'Testing and Test Doubles'
  questions:
  - question: 'What should be used to test multiple implementations of an interface against the same contract?'
    readmeRelated:
      anchorList:
      - abstraction-004
      - interface-008
      - testing-004
      - testing-005
    answers:
    - id: A
      answer: 'Check only type signatures instead of running behavioral tests'
      explanation: 'Incorrect: type signatures verify only API shape, not semantics or error behavior.'
    - id: B
      answer: 'Run the same contract tests against every implementation, including success and failure cases'
      explanation: 'Correct: shared contract tests check both success and failure behavior for every implementation to verify substitutability.'
    - id: C
      answer: 'Unit-test only the first implementation and assume all other classes comply'
      explanation: 'Incorrect: testing one implementation does not prove that the others uphold the same contract.'
    - id: D
      answer: 'Use a separate mock for each implementation and skip failure scenarios'
      explanation: 'Incorrect: class-specific mocks can obscure whether each real implementation satisfies the common contract.'
    correctAnswerId: B
  - question: 'How do stubs and mocks differ in their testing purposes?'
    readmeRelated:
      anchorList:
      - testing-006
    answers:
    - id: A
      answer: 'Stubs verify calls, while mocks mainly provide fixed data to continue execution'
      explanation: 'Incorrect: this reverses the typical roles of stubs and mocks.'
    - id: B
      answer: 'Stubs implement full business logic, while mocks always store data in memory'
      explanation: 'Incorrect: fakes often provide working implementations such as in-memory repositories; mocks do not inherently store data.'
    - id: C
      answer: 'Stubs replace real databases, while mocks only work with HTTP network requests'
      explanation: 'Incorrect: stubs and mocks are not restricted to databases or HTTP; they are techniques for replacing dependencies.'
    - id: D
      answer: 'Stubs return predetermined data, while mocks verify expected object interactions'
      explanation: 'Correct: stubs supply predetermined responses; mocks typically verify that expected interactions occurred.'
    correctAnswerId: D
  - question: 'What is a fake in testing?'
    readmeRelated:
      anchorList:
      - testing-006
      - testing-007
    answers:
    - id: A
      answer: 'An object that records call counts to assert a caller''s internal interactions'
      explanation: 'Incorrect: recording calls for interaction assertions is typically the role of mocks or spies.'
    - id: B
      answer: 'An object that only returns fixed values without simulating storage behavior'
      explanation: 'Incorrect: returning fixed data without functional storage behavior is closer to a stub than a fake.'
    - id: C
      answer: 'A simplified but working implementation, such as an in-memory repository'
      explanation: 'Correct: a fake has a simplified functional implementation, such as an in-memory repository.'
    - id: D
      answer: 'An object that wraps a real object, records calls, and forwards execution'
      explanation: 'Incorrect: wrapping a real object and recording invocations is characteristic of a spy, not a typical fake.'
    correctAnswerId: C
  - question: 'Why are tests of public behavior usually more resilient than tests of private details?'
    readmeRelated:
      anchorList:
      - testing-001
      - testing-008
      - refactoring-009
    answers:
    - id: A
      answer: 'They depend on internal field names to control details outside the contract'
      explanation: 'Incorrect: internal field names are not user-facing contracts, so changes can make detailed tests obsolete.'
    - id: B
      answer: 'They rely on mocking each collaborator instead of verifying public results'
      explanation: 'Incorrect: mocking collaborators does not replace assertions about the system''s public outcomes.'
    - id: C
      answer: 'They focus on observable contracts and are less likely to break when implementations change'
      explanation: 'Correct: testing public behavior locks in contracts while allowing internal refactoring without unnecessary failures.'
    - id: D
      answer: 'They depend on private method call order to ensure refactoring preserves structure'
      explanation: 'Incorrect: tests tied to private call order break when implementation changes even if public behavior remains unchanged.'
    correctAnswerId: C
  - question: 'What is a common consequence of overmocking?'
    readmeRelated:
      anchorList:
      - testing-008
      - refactoring-009
      - testing-010
    answers:
    - id: A
      answer: 'Tests validate public results across equivalent implementations'
      explanation: 'Incorrect: checking public contracts on multiple implementations is not a symptom of overmocking.'
    - id: B
      answer: 'Tests depend too heavily on internal call order and counts even when behavior is unchanged'
      explanation: 'Correct: overmocking makes tests depend on internal invocation counts and order rather than behavioral outcomes.'
    - id: C
      answer: 'Tests use a fake repository that implements a real contract across scenarios'
      explanation: 'Incorrect: a fake repository that honors its contract can make tests stable; that does not imply excessive mocking.'
    - id: D
      answer: 'Tests verify input/output behavior without depending on helper method names'
      explanation: 'Incorrect: checking inputs and outputs rather than internal methods usually reduces implementation coupling.'
    correctAnswerId: B
  - question: 'What should be done before refactoring an untested legacy class?'
    readmeRelated:
      anchorList:
      - testing-009
      - refactoring-009
      - practice-006
    answers:
    - id: A
      answer: 'Only run the compiler and ignore previously working edge cases'
      explanation: 'Incorrect: successful compilation does not prove that existing behavior and edge cases are still correct.'
    - id: B
      answer: 'Restructure the class first and infer its old results from the new code'
      explanation: 'Incorrect: changing code first and guessing at prior behavior can miss edge cases and regressions.'
    - id: C
      answer: 'Write characterization or regression tests to capture behavior before changes'
      explanation: 'Correct: characterization tests record current behavior before refactoring so unintended changes can be detected.'
    - id: D
      answer: 'Mock every private method and delete the old logic once the tests pass'
      explanation: 'Incorrect: mocking private methods and removing logic does not ensure that observable results remain equivalent.'
    correctAnswerId: C
- groupID: 11
  groupName: 'Code Smells, Refactoring, and API Compatibility'
  questions:
  - question: 'Which refactoring direction does Feature Envy suggest?'
    readmeRelated:
      anchorList:
      - class-design-009
      - modeling-003
      - refactoring-004
    answers:
    - id: A
      answer: 'Add getters to the queried object so the external method can continue processing'
      explanation: 'Incorrect: adding getters only lets the external method access deeper data and often perpetuates Feature Envy.'
    - id: B
      answer: 'Move related fields to a utility while keeping the processing logic in the caller'
      explanation: 'Incorrect: moving fields to a utility but keeping logic in the caller does not place behavior with the object that owns it.'
    - id: C
      answer: 'Make the method static so it no longer needs a reference to an object'
      explanation: 'Incorrect: making a method static does not fix its excessive dependence on another object''s data.'
    - id: D
      answer: 'Consider Move Method to the object that owns the main information and responsibility'
      explanation: 'Correct: Feature Envy suggests placing behavior near the data and actual responsibility, often using Move Method.'
    correctAnswerId: D
  - question: 'How can Data Clumps be addressed?'
    readmeRelated:
      anchorList:
      - class-design-006
      - modeling-002
      - refactoring-003
      - practice-005
    answers:
    - id: A
      answer: 'Group meaningful related data into a parameter object or value object'
      explanation: 'Correct: repeated parameter groups that represent one concept can be combined into a parameter object or value object.'
    - id: B
      answer: 'Rename similar parameters in each method to reduce repeated wording'
      explanation: 'Incorrect: renaming parameters does not eliminate their tendency to appear and change together.'
    - id: C
      answer: 'Repeat the same parameter list everywhere so interfaces remain independent'
      explanation: 'Incorrect: repeating parameter groups across interfaces preserves Data Clumps and raises change costs.'
    - id: D
      answer: 'Turn each parameter into a separate service and inject it into callers'
      explanation: 'Incorrect: converting every parameter into a service usually complicates dependencies without addressing related data groups.'
    correctAnswerId: A
  - question: 'Should every layer that only forwards calls be removed?'
    readmeRelated:
      anchorList:
      - solid-008
      - design-patterns-013
      - refactoring-008
    answers:
    - id: A
      answer: 'Keep every intermediate layer to preserve call direction, even without responsibility'
      explanation: 'Incorrect: retaining layers solely for structure creates empty indirection and makes requests harder to trace.'
    - id: B
      answer: 'Remove redundant layers but retain real boundaries for transactions, mapping, or authorization'
      explanation: 'Correct: eliminate layers that add nothing while retaining boundaries responsible for transactions, mapping, or authorization.'
    - id: C
      answer: 'Convert redundant layers into interfaces and keep the same call chain'
      explanation: 'Incorrect: introducing interfaces without changing the forwarding chain does not create meaningful responsibilities.'
    - id: D
      answer: 'Remove all forwarding layers, including those enforcing transactions and access rights'
      explanation: 'Incorrect: removing transaction or authorization boundaries can lose business guarantees and security controls.'
    correctAnswerId: B
  - question: 'How can a public API with many callers be changed safely?'
    readmeRelated:
      anchorList:
      - abstraction-003
      - testing-009
      - refactoring-009
    answers:
    - id: A
      answer: 'Keep compatibility adapters where needed, migrate callers incrementally, and verify contracts'
      explanation: 'Correct: compatibility adapters, deprecation, and staged migration prevent abruptly breaking client contracts.'
    - id: B
      answer: 'Change the public signature immediately and require every caller to fix build failures at once'
      explanation: 'Incorrect: immediate public signature changes can break consumers not yet updated or deployed independently.'
    - id: C
      answer: 'Keep both APIs forever without a sunset plan for obsolete versions'
      explanation: 'Incorrect: maintaining old code indefinitely without a sunset plan accumulates technical debt.'
    - id: D
      answer: 'Change the return type to Object to avoid compatibility tests between callers'
      explanation: 'Incorrect: changing the return type to Object loses type safety and does not replace contract or integration tests.'
    correctAnswerId: A
- groupID: 12
  groupName: 'Shared Mutable State, Object Contracts, and Review'
  questions:
  - question: 'What risks arise when mutable objects are shared across multiple threads?'
    readmeRelated:
      anchorList:
      - object-007
      - design-patterns-004
      - design-pitfalls-008
      - testing-003
    answers:
    - id: A
      answer: 'Sharing a reference makes every field write automatically atomic'
      explanation: 'Incorrect: sharing a reference does not make a read-modify-write sequence atomic.'
    - id: B
      answer: 'Each thread automatically gets an independent copy, avoiding races on the same object'
      explanation: 'Incorrect: threads do not automatically make independent copies of objects they reference.'
    - id: C
      answer: 'The JVM automatically applies volatile to all fields used by multiple threads'
      explanation: 'Incorrect: the JVM does not implicitly add volatile to fields simply because an object is used by multiple threads.'
    - id: D
      answer: 'Lost updates or stale reads can occur without synchronization and memory visibility guarantees'
      explanation: 'Correct: uncoordinated shared mutable state can lead to lost updates or stale reads across threads.'
    correctAnswerId: D
  - question: 'What does volatile mean in Java?'
    readmeRelated:
      anchorList:
      - design-patterns-004
      - design-pitfalls-008
      - testing-003
    answers:
    - id: A
      answer: 'It makes a List or Map thread-safe when its reference is declared volatile'
      explanation: 'Incorrect: a volatile reference does not automatically make operations within a List or Map thread-safe.'
    - id: B
      answer: 'It improves visibility and ordering but does not make read-modify-write atomic'
      explanation: 'Correct: volatile provides certain visibility and ordering guarantees, but count++ still consists of multiple operations.'
    - id: C
      answer: 'It replaces locks and transactions for all multi-field operation sequences'
      explanation: 'Incorrect: volatile on one field does not replace locks or transactions for invariants spanning multiple fields.'
    - id: D
      answer: 'It makes count++ atomic when the field is declared volatile'
      explanation: 'Incorrect: count++ remains a read-modify-write sequence and does not become atomic solely through volatile.'
    correctAnswerId: B
  - question: 'What can happen when an object in a HashSet changes a field used by equals/hashCode?'
    readmeRelated:
      anchorList:
      - object-004
      - language-mechanics-006
      - design-pitfalls-009
      - testing-001
    answers:
    - id: A
      answer: 'HashSet immediately rejects any field change after the object has been added'
      explanation: 'Incorrect: HashSet does not prevent changes to element fields; keeping a key stable is a design responsibility.'
    - id: B
      answer: 'HashSet deep-copies every element before storage to prevent later mutation'
      explanation: 'Incorrect: Set does not deep-copy an object on add; it retains a reference to the element.'
    - id: C
      answer: 'HashSet.contains may fail because the hash bucket no longer matches the new value'
      explanation: 'Correct: changing a field used by equals/hashCode may cause contains to search a new bucket and miss the previously stored element.'
    - id: D
      answer: 'HashSet automatically moves the object to a new bucket whenever a key field changes'
      explanation: 'Incorrect: HashSet does not automatically rehash elements when state affecting hashCode changes.'
    correctAnswerId: C
  - question: 'What are the risks of equals in an inheritance hierarchy?'
    readmeRelated:
      anchorList:
      - object-004
      - language-mechanics-006
      - testing-001
      - testing-005
    answers:
    - id: A
      answer: 'Hierarchy equals methods only compare object addresses, so asymmetry cannot occur'
      explanation: 'Incorrect: equals can be overridden for value comparisons; hierarchies do not always use reference identity only.'
    - id: B
      answer: 'Symmetry or transitivity can be violated when base and subtype equality definitions differ'
      explanation: 'Correct: inconsistently designed equals methods across base and subtype classes can break symmetry or transitivity.'
    - id: C
      answer: 'Every subtype inherits the same equals implementation, ensuring symmetry and transitivity'
      explanation: 'Incorrect: subtypes do not automatically preserve the equals contract when they override it or add fields inconsistently.'
    - id: D
      answer: 'Overriding equals only affects performance, not equivalence relationships'
      explanation: 'Incorrect: equals affects the semantics of equivalence and collections, not merely performance.'
    correctAnswerId: B
  - question: 'What should toString account for in a bidirectional object graph?'
    readmeRelated:
      anchorList:
      - object-003
      - relationships-006
      - language-mechanics-007
      - testing-001
    answers:
    - id: A
      answer: 'Logging only object IDs automatically detects every cycle during toString'
      explanation: 'Incorrect: logging IDs may avoid graph traversal but does not automatically detect every cycle in toString.'
    - id: B
      answer: 'Avoid recursion through cyclic links, leaking sensitive data, and expensive rendering'
      explanation: 'Correct: toString on a bidirectional graph must avoid recursive cycles, sensitive-data exposure, and high rendering costs.'
    - id: C
      answer: 'Call equals on every node before joining strings to prevent cycles automatically'
      explanation: 'Incorrect: calling equals does not automatically detect or prevent recursion when toString traverses a graph.'
    - id: D
      answer: 'Print the entire object graph to expose all state, including internal passwords'
      explanation: 'Incorrect: printing passwords or entire graphs can leak information and produce excessively large logs.'
    correctAnswerId: B
  - question: 'How should escape analysis in Java be understood?'
    readmeRelated:
      anchorList:
      - oop-basic-008
      - lifecycle-001
    answers:
    - id: A
      answer: 'The JIT always eliminates small allocations before GC can observe the objects'
      explanation: 'Incorrect: the JIT cannot and need not eliminate every small allocation; optimization depends on runtime conditions.'
