quiz:
- groupID: 1
  groupName: 'OOP Fundamentals, Classes, Objects, and Identity'
  questions:
  - question: 'How does OOP primarily help manage complexity?'
    readmeRelated:
      anchorList:
      - oop-basic-001
      - oop-basic-006
      - class-design-001
      - class-design-002
      - modeling-003
      - design-pitfalls-001
      - oop-basic-002
    answers:
    - id: A
      answer: 'Assign responsibilities to objects that combine state with related behavior'
      explanation: 'Correct: assigning responsibilities to objects with related data and behavior limits the scope of changes and reduces coupling.'
    - id: B
      answer: 'Concentrate processing in services and let objects hold only their own state'
      explanation: 'Incorrect: moving behavior into services and leaving objects as data holders can create an Anemic Domain Model, rather than realizing the main benefits of OOP.'
    - id: C
      answer: 'Separate processing functions from data and coordinate them through a shared type table'
      explanation: 'Incorrect: completely separating functions from data and using a type table for dispatch resembles procedural design and lacks encapsulation.'
    - id: D
      answer: 'Place data in shared structures and select behavior through conditional branches'
      explanation: 'Incorrect: shared data combined with conditional dispatch means changing one type can affect many locations.'
    correctAnswerId: A
  - question: 'Which statement correctly distinguishes classes from objects?'
    readmeRelated:
      anchorList:
      - oop-basic-002
      - oop-basic-003
      - class-002
      - object-001
      - modeling-006
    answers:
    - id: A
      answer: 'A class describes stored data; an object defines only processing methods'
      explanation: 'Incorrect: a class declares both data and behavior; methods are not a concept exclusive to objects.'
    - id: B
      answer: 'A class determines runtime identity; an object is merely a name for that type'
      explanation: 'Incorrect: runtime identity belongs to an object instance, not to the class definition for every instance.'
    - id: C
      answer: 'A class is a prototype object from which other objects inherit and are copied'
      explanation: 'Incorrect: Java does not normally construct objects by copying a class prototype object.'
    - id: D
      answer: 'A class defines a type; an object is an instance with concrete state'
      explanation: 'Correct: a class describes a type and its members; an object is a concrete instance of that type at runtime.'
    correctAnswerId: D
  - question: 'If two separately created objects have identical values in all fields, what is definitely true?'
    readmeRelated:
      anchorList:
      - object-001
      - object-004
      - modeling-006
      - practice-005
    answers:
    - id: A
      answer: 'Objects with equal fields are automatically equal under Object.equals'
      explanation: 'Incorrect: Object.equals uses identity by default; field-based equality requires a suitably defined equals contract.'
    - id: B
      answer: 'Objects with equal fields have the same identity when compared with =='
      explanation: 'Incorrect: for separately created objects, == checks whether references point to the same object, not whether fields match.'
    - id: C
      answer: 'The JVM automatically merges objects with equal fields, just like interned Strings'
      explanation: 'Incorrect: String interning does not cause the JVM to merge all objects with identical fields.'
    - id: D
      answer: 'The objects may be equal by value but have different runtime identities'
      explanation: 'Correct: equality of field contents does not mean two references point to the same object.'
    correctAnswerId: D
  - question: 'What is the key distinction between an Entity and a Value Object?'
    readmeRelated:
      anchorList:
      - object-004
      - class-design-006
      - modeling-002
      - practice-005
    answers:
    - id: A
      answer: 'An Entity is tracked by its business identity; a Value Object is primarily defined by its value'
      explanation: 'Correct: an entity retains its business identity through changes; a value object is typically compared by its value contents.'
    - id: B
      answer: 'An Entity only stores data; only a Value Object can define behavior'
      explanation: 'Incorrect: both entities and value objects can contain behavior that maintains their invariants.'
    - id: C
      answer: 'An Entity must be immutable after creation; a Value Object allows state changes'
      explanation: 'Incorrect: an entity may change state, while a value object is usually designed to be immutable to preserve value semantics.'
    - id: D
      answer: 'An Entity is compared primarily by value; a Value Object needs a persistent identity'
      explanation: 'Incorrect: this reverses the concepts: an entity is not identified only by all its fields, while a value object generally does not need an ID.'
    correctAnswerId: A
  - question: 'What indicates that a class has low cohesion?'
    readmeRelated:
      anchorList:
      - class-design-002
      - modeling-004
      - solid-002
      - design-pitfalls-001
    answers:
    - id: A
      answer: 'Its methods protect the same invariant through different processing branches'
      explanation: 'Incorrect: methods that protect the same invariant generally reflect related internal responsibilities, not scattered ones.'
    - id: B
      answer: 'Its methods support one workflow but depend on many collaborators'
      explanation: 'Incorrect: having many collaborators alone does not imply low cohesion if they all serve one coherent business process.'
    - id: C
      answer: 'Its methods use many data types but serve a single responsibility'
      explanation: 'Incorrect: the number of data types used does not determine cohesion; assess whether methods serve the same purpose.'
    - id: D
      answer: 'Its methods handle unrelated responsibilities and change for different reasons'
      explanation: 'Correct: a class lacks cohesion when it has multiple unrelated reasons to change, even if each method works correctly.'
    correctAnswerId: D
- groupID: 2
  groupName: 'Object Lifecycles, Initialization, and Immutability'
  questions:
  - question: 'How does a static field differ from an instance field in Java?'
    readmeRelated:
      anchorList:
      - class-003
      - design-pitfalls-008
    answers:
    - id: A
      answer: 'A static field exists per method call; an instance field belongs to the class loader'
      explanation: 'Incorrect: static fields belong to a class, not to individual method calls.'
    - id: B
      answer: 'A static field belongs to the class; an instance field belongs to each specific instance'
      explanation: 'Correct: static fields hold class-level state for a class loader, while each instance has its own instance fields.'
    - id: C
      answer: 'A static field is copied into every object; an instance field has only one shared copy'
      explanation: 'Incorrect: this reverses the relationship: static fields are not automatically copied per object, and instance fields are not shared class-level copies.'
    - id: D
      answer: 'A static field belongs to each thread; an instance field is shared across threads'
      explanation: 'Incorrect: a static field is not implicitly a ThreadLocal, and instances are not automatically shared by every thread.'
    correctAnswerId: B
  - question: 'What is an advantage of a static factory method over a constructor?'
    readmeRelated:
      anchorList:
      - lifecycle-005
      - design-patterns-002
    answers:
    - id: A
      answer: 'It always reuses the same instance instead of allocating a new object'
      explanation: 'Incorrect: a factory may allocate a new instance, return an existing one, or cache instances, depending on its design; reuse is not guaranteed.'
    - id: B
      answer: 'It lets subclasses change object creation without declaring a method'
      explanation: 'Incorrect: a factory does not automatically allow subclasses to customize creation without a suitable extension point or implementation.'
    - id: C
      answer: 'It can have a meaningful creation name and return an appropriate subtype'
      explanation: 'Correct: a named factory conveys the meaning of creation and can return a subtype compatible with its declared return type.'
    - id: D
      answer: 'It always bypasses constructors and requires no input validation'
      explanation: 'Incorrect: a static factory can still invoke constructors and must validate parameters when constraints require it.'
    correctAnswerId: C
  - question: 'How should an object be initialized when its invariants must be preserved?'
    readmeRelated:
      anchorList:
      - lifecycle-002
      - encapsulation-002
      - testing-002
    answers:
    - id: A
      answer: 'Create an invalid temporary object and validate it on first use'
      explanation: 'Incorrect: allowing an invalid object to exist until its first use risks exposing invalid state.'
    - id: B
      answer: 'Validate within the constructor or factory before returning the object'
      explanation: 'Correct: the constructor or factory must reject invalid states before the object reaches its callers.'
    - id: C
      answer: 'Let setters restore invariants before the object reaches persistence'
      explanation: 'Incorrect: later setter calls cannot guarantee invariants if the object has already been observed or persisted.'
    - id: D
      answer: 'Only check invariants in the controller before passing the object into the domain'
      explanation: 'Incorrect: controller-only checks miss objects created by batches, tests, or other services.'
    correctAnswerId: B
  - question: 'Why can calling an overridden method from a superclass constructor be dangerous?'
    readmeRelated:
      anchorList:
      - lifecycle-004
      - lifecycle-009
      - inheritance-006
      - testing-002
    answers:
    - id: A
      answer: 'An overridden method cannot access subclass state during object initialization'
      explanation: 'Incorrect: an override can access subclass fields while they still have default or uninitialized values; that is precisely the risk.'
    - id: B
      answer: 'The override may execute before subclass fields have been fully initialized'
      explanation: 'Correct: virtual dispatch can invoke a subclass override before subclass initialization finishes.'
    - id: C
      answer: 'The subclass constructor always finishes before the superclass constructor starts'
      explanation: 'Incorrect: in Java, the superclass constructor executes before the subclass constructor body, not the reverse.'
    - id: D
      answer: 'A superclass constructor can only call the superclass implementation'
      explanation: 'Incorrect: a superclass constructor can call an instance method overridden by the subclass; dispatch is not restricted to the superclass version.'
    correctAnswerId: B
  - question: 'Why is a private final List<String> insufficient to make an object deeply immutable?'
    readmeRelated:
      anchorList:
      - class-006
      - object-005
      - encapsulation-007
    answers:
    - id: A
      answer: 'Final fixes the reference but does not prevent changes to a mutable List or its elements'
      explanation: 'Correct: final prevents reassigning the reference; it does not make the contents of the referenced List immutable.'
    - id: B
      answer: 'Final freezes the List structure and every object referenced by it'
      explanation: 'Incorrect: final on a List variable does not freeze the elements or structure of a mutable List.'
    - id: C
      answer: 'Final prevents outside callers from changing a List even if they share its mutable reference'
      explanation: 'Incorrect: another holder of the same mutable reference can still modify the List contents.'
    - id: D
      answer: 'Final copies the List contents each time a getter returns the reference'
      explanation: 'Incorrect: a getter does not automatically deep-copy a collection because the field is final.'
    correctAnswerId: A
  - question: 'What is a limitation of List.copyOf(list)?'
    readmeRelated:
      anchorList:
      - object-005
      - object-006
      - encapsulation-007
    answers:
    - id: A
      answer: 'It turns mutable elements into immutable copies'
      explanation: 'Incorrect: mutable elements can still change state; copyOf does not make them immutable.'
    - id: B
      answer: 'It keeps the original list synchronized with all future updates'
      explanation: 'Incorrect: List.copyOf provides a structural snapshot; later changes to the original List do not propagate to the copy.'
    - id: C
      answer: 'It does not deep-copy mutable elements inside the list'
      explanation: 'Correct: List.copyOf creates a list that cannot be modified through its API, but it does not deep-clone each element.'
    - id: D
      answer: 'It always returns a modifiable ArrayList'
      explanation: 'Incorrect: copyOf returns a List that rejects modification operations, not a mutable ArrayList.'
    correctAnswerId: C
  - question: 'Which mechanism should be used to close files and database connections?'
    readmeRelated:
      anchorList:
      - lifecycle-008
      - composition-007
    answers:
    - id: A
      answer: 'Call close or use try-with-resources at the appropriate time according to ownership'
      explanation: 'Correct: close and try-with-resources release resources deterministically according to their lifecycles and ownership.'
    - id: B
      answer: 'Set the reference to null after use so the system closes the connection automatically'
      explanation: 'Incorrect: setting a reference to null does not call close or guarantee the release of external resources.'
    - id: C
      answer: 'Let the garbage collector release resources once the object has no remaining references'
      explanation: 'Incorrect: GC manages memory and does not guarantee timely closing of files or connections.'
    - id: D
      answer: 'Use a finalizer or cleaner as the primary close mechanism after each operation'
      explanation: 'Incorrect: finalizers and cleaners have no reliable execution time and should not be the primary closing mechanism.'
    correctAnswerId: A
- groupID: 3
  groupName: 'Encapsulation, Invariants, and State Control'
  questions:
  - question: 'What does encapsulation actually protect?'
    readmeRelated:
      anchorList:
      - encapsulation-001
      - encapsulation-002
      - encapsulation-008
      - testing-003
    answers:
    - id: A
      answer: 'It restricts a class to interface calls and prohibits public methods'
      explanation: 'Incorrect: classes may expose public methods; encapsulation does not prohibit access except through interfaces.'
    - id: B
      answer: 'It protects invariants and internal representations through controlled operations'
      explanation: 'Correct: encapsulation controls the API to preserve invariants and hide the internal representation of state.'
    - id: C
      answer: 'It hides every field and then provides getters and setters without validation'
      explanation: 'Incorrect: unchecked getters and setters merely expose fields under method names and do not protect invariants.'
    - id: D
      answer: 'It guarantees that each object remains unchanged throughout its lifecycle'
      explanation: 'Incorrect: encapsulation still allows valid state changes through controlled behavior.'
    correctAnswerId: B
  - question: 'Why can public setters for individual fields break cross-field invariants?'
    readmeRelated:
      anchorList:
      - encapsulation-002
      - encapsulation-004
      - design-pitfalls-002
      - testing-003
    answers:
    - id: A
      answer: 'Validating each field in its setter guarantees all cross-field invariants'
      explanation: 'Incorrect: validating fields individually is insufficient when invariants depend on relationships among fields.'
    - id: B
      answer: 'Independent setters can create invalid intermediate states between updates'
      explanation: 'Correct: separate setters may produce intermediate states that violate constraints spanning multiple fields.'
    - id: C
      answer: 'Keeping setters in the same class makes the JVM synchronize all related updates automatically'
      explanation: 'Incorrect: being in one class does not make the JVM automatically lock or synchronize consecutive setter calls.'
    - id: D
      answer: 'Independent setters automatically make all updates part of a transaction'
      explanation: 'Incorrect: multiple independent setter calls do not automatically form a transaction or atomic operation.'
    correctAnswerId: B
  - question: 'What is the distinction between an invariant and input validation?'
    readmeRelated:
      anchorList:
      - lifecycle-002
      - encapsulation-002
      - encapsulation-005
      - testing-003
    answers:
    - id: A
      answer: 'Validation maintains object state for its entire lifetime; invariants only check request data'
      explanation: 'Incorrect: validation does not automatically maintain invariants after each change; these serve different purposes.'
    - id: B
      answer: 'Validation and invariants apply only when a constructor first runs'
      explanation: 'Incorrect: invariants must be maintained during state-changing operations, not just in constructors.'
    - id: C
      answer: 'Validation checks inputs; an invariant must hold throughout the object''s lifecycle'
      explanation: 'Correct: validation determines whether an input is acceptable; an invariant is a condition that must remain true throughout the object''s lifecycle.'
    - id: D
      answer: 'Validation checks stored database data; invariants only check API parameter formats'
      explanation: 'Incorrect: validation is not limited to databases, and invariants are not merely API parameter formatting rules.'
    correctAnswerId: C
  - question: 'What is the risk of a getter directly returning an internal ArrayList?'
    readmeRelated:
      anchorList:
      - object-007
      - encapsulation-006
      - refactoring-005
      - encapsulation-007
    answers:
    - id: A
      answer: 'Callers can modify the internal List without going through the object''s validated operations'
      explanation: 'Correct: exposing the internal List lets callers change state without invoking methods that preserve the object''s invariants.'
    - id: B
      answer: 'Callers can only modify elements, and List invariants are still checked by setters'
      explanation: 'Incorrect: object setters are not invoked when a caller modifies the elements or structure of the returned List.'
    - id: C
      answer: 'Returning the List automatically converts the Collection to read-only at runtime'
      explanation: 'Incorrect: Java does not automatically convert a mutable ArrayList to read-only simply because its return type is Collection.'
    - id: D
      answer: 'Returning the List causes every caller operation to create a defensive copy'
      explanation: 'Incorrect: returning a reference directly does not automatically create a defensive copy on the caller''s side.'
    correctAnswerId: A
  - question: 'How should an Order protect its transition from DRAFT to PAID?'
    readmeRelated:
      anchorList:
      - encapsulation-008
      - encapsulation-009
      - modeling-008
      - testing-003
      - practice-002
    answers:
    - id: A
      answer: 'A client should call setStatus(PAID) after checking conditions outside the domain'
      explanation: 'Incorrect: checking conditions in a client before calling a setter still allows other callers to violate the Order contract.'
    - id: B
      answer: 'The controller should check the state and directly assign the Order status'
      explanation: 'Incorrect: direct status assignment in a controller moves state-transition rules out of the domain and may bypass invariants.'
    - id: C
      answer: 'The repository should write PAID directly without considering the Order state'
      explanation: 'Incorrect: writing PAID directly in the repository bypasses the entity''s state-transition rules.'
    - id: D
      answer: 'Order.pay() should validate conditions and then transition the state to PAID'
      explanation: 'Correct: the domain method pay() combines condition checks with the state transition inside Order itself.'
    correctAnswerId: D
  - question: 'What is a symptom of an Anemic Domain Model?'
    readmeRelated:
      anchorList:
      - encapsulation-008
      - class-design-007
      - design-pitfalls-003
      - refactoring-004
    answers:
    - id: A
      answer: 'Objects coordinate their own behavior and protect invariants through domain methods'
      explanation: 'Incorrect: objects with domain behavior that preserve invariants characterize a behavior-rich domain model.'
    - id: B
      answer: 'Objects mainly hold data while business rules reside in external services'
      explanation: 'Correct: an Anemic Domain Model moves business rules outside objects that primarily hold data and accessors.'
    - id: C
      answer: 'Objects maintain rules within aggregates and delegate only I/O to repositories'
      explanation: 'Incorrect: aggregates maintaining their own rules while delegating persistence to repositories are not necessarily anemic.'
    - id: D
      answer: 'Objects use Value Objects to represent immutable domain concepts'
      explanation: 'Incorrect: using Value Objects for immutable values is a domain-modeling technique and does not establish an anemic model.'
    correctAnswerId: B
  - question: 'What can happen if a HashMap key changes a field used by hashCode after put?'
    readmeRelated:
      anchorList:
      - object-004
      - language-mechanics-006
      - design-pitfalls-009
      - testing-001
    answers:
    - id: A
      answer: 'Map.get may fail to find the key because its hashCode changed after put'
      explanation: 'Correct: changing a field used in hashCode can make get search a different bucket from the one holding the key.'
    - id: B
      answer: 'HashMap automatically moves the key to a new bucket when its properties change'
      explanation: 'Incorrect: HashMap does not track mutations to automatically rehash keys already stored in the map.'
    - id: C
      answer: 'HashMap must deep-copy every key, so modifying the original object has no effect'
      explanation: 'Incorrect: HashMap holds key references and does not require deep-copying keys during put.'
    - id: D
      answer: 'HashMap immediately removes a key whenever a field affecting hashCode changes'
      explanation: 'Incorrect: Map does not automatically remove a key because an internal field changes.'
    correctAnswerId: A
  - question: 'Does an immutable object guarantee atomicity of an entire multithreaded workflow?'
    readmeRelated:
      anchorList:
      - object-005
      - object-007
      - design-pitfalls-008
      - testing-003
    answers:
    - id: A
      answer: 'Immutability automatically makes every reference to the object volatile'
      explanation: 'Incorrect: object immutability does not automatically add volatile semantics to reference variables.'
    - id: B
      answer: 'Immutability helps share state safely, but multi-step operations still require coordination'
      explanation: 'Correct: immutable state is easier to share, but workflows requiring multiple coordinated operations can still have races and interleavings.'
    - id: C
      answer: 'Immutability guarantees that reads and writes across multiple objects cannot interleave'
      explanation: 'Incorrect: multi-step workflows involving reads and writes can still interleave across threads.'
    - id: D
      answer: 'Immutability makes every operation involving multiple objects atomic automatically'
      explanation: 'Incorrect: immutability of individual objects does not make an entire sequence across objects atomic.'
    correctAnswerId: B
- groupID: 4
  groupName: 'Abstraction, Interfaces, and API Contracts'
  questions:
  - question: 'How does abstraction help clients?'
    readmeRelated:
      anchorList:
      - abstraction-003
      - interface-001
      - interface-003
      - solid-006
    answers:
    - id: A
      answer: 'Clients inherit implementations to access all internal fields directly'
      explanation: 'Incorrect: inheriting implementations to read internal fields directly increases coupling to implementation details.'
    - id: B
      answer: 'Clients use runtime type checks instead of relying on shared contractual behavior'
      explanation: 'Incorrect: scattered runtime type checks create dependencies on subtypes rather than using the contract.'
    - id: C
      answer: 'Clients receive the complete object graph and decide every processing step themselves'
      explanation: 'Incorrect: exposing the entire object graph makes clients aware of more details than necessary.'
    - id: D
      answer: 'Clients work through contracts and depend less on implementation details'
      explanation: 'Correct: abstraction lets clients depend on stable contracts rather than internal layouts and processing.'
    correctAnswerId: D
  - question: 'What is a method precondition?'
    readmeRelated:
      anchorList:
      - abstraction-004
      - language-mechanics-008
      - testing-001
    answers:
    - id: A
      answer: 'A condition the caller must satisfy before an operation is executed'
      explanation: 'Correct: a precondition specifies a requirement that must hold when an operation is called.'
    - id: B
      answer: 'A condition that must hold for the object throughout its entire lifetime'
      explanation: 'Incorrect: a condition maintained throughout an object''s lifetime is an invariant, not an operation''s precondition.'
    - id: C
      answer: 'A condition the method guarantees after running even if the caller did not satisfy it beforehand'
      explanation: 'Incorrect: a precondition is not a promise that a method creates a valid state after being called with invalid input.'
    - id: D
      answer: 'A condition the result must satisfy after the operation completes normally'
      explanation: 'Incorrect: a condition that holds after a method finishes is a postcondition, not a precondition.'
    correctAnswerId: A
  - question: 'When is an interface generally more appropriate than an abstract class?'
    readmeRelated:
      anchorList:
      - abstraction-005
      - interface-005
      - polymorphism-002
      - composition-004
    answers:
    - id: A
      answer: 'When a class must inherit only one fixed set of implementations'
      explanation: 'Incorrect: restricting a class to one inherited implementation is not the purpose of an interface that separates roles.'
    - id: B
      answer: 'When all subclasses need shared instance state and a constructor'
      explanation: 'Incorrect: an abstract class is usually more suitable than an interface for sharing instance state and construction logic.'
    - id: C
      answer: 'When classes from different inheritance branches implement the same role'
      explanation: 'Correct: an interface fits when classes from different hierarchies fulfill the same role or contract.'
    - id: D
      answer: 'When subclasses must share a skeleton algorithm with multiple hooks'
      explanation: 'Incorrect: a skeleton algorithm with inherited hooks is characteristic of Template Method and abstract classes.'
    correctAnswerId: C
  - question: 'What indicates a violation of the Interface Segregation Principle?'
    readmeRelated:
      anchorList:
      - interface-006
      - polymorphism-008
      - solid-005
      - design-pitfalls-006
    answers:
    - id: A
      answer: 'An interface has many implementations but clients use only the parts they need'
      explanation: 'Incorrect: multiple implementations and clients depending on appropriately small contracts do not themselves establish an ISP violation.'
    - id: B
      answer: 'An interface uses generics to define the same operation for different data types'
      explanation: 'Incorrect: generics express type-safe operations; they do not determine whether an interface has too many responsibilities.'
    - id: C
      answer: 'An interface separates small roles so clients depend only on relevant contracts'
      explanation: 'Incorrect: small role-specific interfaces are often exactly how ISP is satisfied.'
    - id: D
      answer: 'Clients must depend on unused methods and classes must support unnecessary operations'
      explanation: 'Correct: ISP is violated when clients depend on methods they do not use and implementations must pretend to support unnecessary operations.'
    correctAnswerId: D
  - question: 'What happens if a class implements two interfaces with conflicting default methods of the same signature?'
    readmeRelated:
      anchorList:
      - interface-007
      - inheritance-008
      - polymorphism-006
    answers:
    - id: A
      answer: 'Runtime selects a default method based on the variable''s reference type'
      explanation: 'Incorrect: the reference type at runtime does not resolve competing default methods.'
    - id: B
      answer: 'The class may inherit both default implementations without resolving the conflict'
      explanation: 'Incorrect: Java produces a compilation error unless the class explicitly resolves the conflicting default methods.'
    - id: C
      answer: 'The class must override the method to resolve the conflicting defaults'
      explanation: 'Correct: the class must override the method to disambiguate two default methods when neither takes precedence.'
    - id: D
      answer: 'The compiler picks the default from the first interface in the implements list'
      explanation: 'Incorrect: the order of interface names in implements does not determine which conflicting default method wins.'
    correctAnswerId: C
  - question: 'What is a symptom of a leaky abstraction?'
    readmeRelated:
      anchorList:
      - abstraction-008
      - interface-009
      - class-design-004
    answers:
    - id: A
      answer: 'Clients configure a persistence adapter at the application''s composition root'
      explanation: 'Incorrect: selecting adapters at the composition root keeps clients from needing to know persistence details directly.'
    - id: B
      answer: 'Clients receive domain view models without persistence-layer entities'
      explanation: 'Incorrect: view models that exclude persistence entities usually reduce the exposure of ORM details.'
    - id: C
      answer: 'Clients receive only domain exceptions translated according to the application contract'
      explanation: 'Incorrect: translating storage errors into domain exceptions appropriately hides persistence details.'
    - id: D
      answer: 'Clients must handle SQLException or lazy loading from the persistence layer'
      explanation: 'Correct: leaking SQLException or lazy-loading behavior through a business API makes clients depend on persistence implementation details.'
    correctAnswerId: D
- groupID: 5
  groupName: 'Inheritance, Subtyping, and Polymorphism'
  questions:
  - question: 'Does inheriting an implementation automatically prove a valid is-a relationship?'
    readmeRelated:
      anchorList:
      - subtyping-001
      - subtyping-002
      - solid-004
      - design-pitfalls-004
      - testing-005
    answers:
    - id: A
      answer: 'The extends relationship automatically preserves every base-class precondition'
      explanation: 'Incorrect: the compiler checks the types used with extends, not every precondition or behavior.'
    - id: B
      answer: 'Using extends proves all observable results are compatible'
      explanation: 'Incorrect: inheritance syntax cannot prove that every observable result is compatible between the base and subtype.'
    - id: C
      answer: 'A subclass is substitutable as long as it has enough public methods, regardless of behavior contracts'
      explanation: 'Incorrect: having the required public methods does not guarantee the base class''s semantic contracts, postconditions, or invariants.'
    - id: D
      answer: 'The subclass must also be behaviorally substitutable for its superclass'
      explanation: 'Correct: extends does not prove LSP; subclass behavior must still satisfy the expectations of clients using the base type.'
    correctAnswerId: D
  - question: 'What is the risk of strengthening a precondition in a subclass?'
    readmeRelated:
      anchorList:
      - abstraction-004
      - subtyping-007
      - solid-004
      - testing-005
    answers:
    - id: A
      answer: 'Clients automatically change their calling conditions based on the runtime object type'
      explanation: 'Incorrect: clients written against the base type need not know the actual subtype and do not automatically adjust preconditions.'
    - id: B
      answer: 'The subclass accepts more valid inputs, so clients are unaffected'
      explanation: 'Incorrect: stronger preconditions narrow the accepted input set rather than expand it.'
    - id: C
      answer: 'A call valid for the base class may be rejected by the subclass because of stricter conditions'
      explanation: 'Correct: strengthening preconditions can cause a subtype to reject calls valid under the base contract, violating substitutability.'
    - id: D
      answer: 'Weakening a precondition automatically weakens the postconditions accordingly'
      explanation: 'Incorrect: weakening preconditions does not automatically weaken postconditions; these are separate contract obligations.'
    correctAnswerId: C
  - question: 'What indicates that a subclass breaks its superclass contract?'
    readmeRelated:
      anchorList:
      - subtyping-007
      - solid-004
      - design-pitfalls-004
      - testing-005
    answers:
    - id: A
      answer: 'The subclass returns a valid subtype when overriding a superclass method'
      explanation: 'Incorrect: a valid covariant return does not remove behavior promised by the contract.'
    - id: B
      answer: 'The subclass rejects an operation promised by the base type by throwing UnsupportedOperationException'
      explanation: 'Correct: throwing UnsupportedOperationException for an operation the base type promises shows that the subclass is not substitutable.'
    - id: C
      answer: 'The subclass adds a method supporting a new operation outside the superclass contract'
      explanation: 'Incorrect: adding methods does not affect obligations to support operations already promised by the base class.'
    - id: D
      answer: 'The subclass constructor requires its own configuration before an object can be created'
      explanation: 'Incorrect: a specialized constructor can be valid if the resulting object still satisfies the base contract.'
    correctAnswerId: B
  - question: 'How is runtime polymorphism implemented in Java?'
    readmeRelated:
      anchorList:
      - inheritance-004
      - subtyping-004
      - polymorphism-003
      - polymorphism-004
    answers:
    - id: A
      answer: 'Calls to overridden instance methods are dispatched based on the actual object type'
      explanation: 'Correct: overridden instance methods use virtual dispatch according to the receiver''s actual class.'
    - id: B
      answer: 'Overloads are always chosen using the runtime types of arguments'
      explanation: 'Incorrect: overload resolution occurs at compile time using static types, not runtime argument types.'
    - id: C
      answer: 'Static methods dispatch based on the runtime object type, just like instance methods'
      explanation: 'Incorrect: static methods do not use virtual dispatch; hiding is resolved by reference type or static qualification.'
    - id: D
      answer: 'Constructors are dynamically chosen based on the reference holding the created object'
      explanation: 'Incorrect: constructor selection happens during object creation, not through polymorphic dispatch on a reference.'
    correctAnswerId: A
  - question: 'Given overloads foo(Object) and foo(String), which is called when an argument is declared Object but holds a String?'
    readmeRelated:
      anchorList:
      - subtyping-004
      - polymorphism-003
      - polymorphism-005
      - language-mechanics-004
    answers:
    - id: A
      answer: 'Both foo(Object) and foo(String) are invoked in order of specificity'
      explanation: 'Incorrect: one overloaded call selects a single applicable signature; it does not invoke both versions automatically.'
    - id: B
      answer: 'foo(String), because the JVM selects overloads based on the contained String object'
      explanation: 'Incorrect: a String runtime type does not change the overload selected by the compiler for a variable declared Object.'
    - id: C
      answer: 'foo(Object), because overload resolution uses the argument''s declared Object type'
      explanation: 'Correct: when a variable is declared Object, the compiler selects foo(Object) even if it holds a String at runtime.'
    - id: D
      answer: 'The call is ambiguous because the compiler cannot determine the argument''s declared type'
      explanation: 'Incorrect: the variable''s Object type is known at compile time, so foo(Object) is unambiguous.'
    correctAnswerId: C
  - question: 'How is a static method with the same signature in a subclass handled?'
    readmeRelated:
      anchorList:
      - class-003
      - inheritance-007
      - polymorphism-006
    answers:
    - id: A
      answer: 'The compiler makes the subclass static method abstract to resolve it'
      explanation: 'Incorrect: the compiler does not automatically turn a subclass static method into an abstract method.'
    - id: B
      answer: 'It is method hiding, selected by reference type rather than virtual dispatch'
      explanation: 'Correct: a static method with the same signature hides the other method; selection depends on the reference type or static call.'
    - id: C
      answer: 'It is instance overriding, dispatched by the actual runtime object type'
      explanation: 'Incorrect: static methods do not override virtually like instance methods, so the runtime object does not determine the call.'
    - id: D
      answer: 'The two static methods are merged automatically into one shared method'
      explanation: 'Incorrect: each class has its own static method; they are not automatically combined into one implementation.'
    correctAnswerId: B
  - question: 'Can a private superclass method be overridden through virtual dispatch?'
    readmeRelated:
      anchorList:
      - inheritance-007
      - polymorphism-006
      - polymorphism-007
    answers:
    - id: A
      answer: 'Yes; adding @Override to a subclass method makes the private method overridable'
      explanation: 'Incorrect: @Override cannot make a private superclass method eligible for overriding.'
    - id: B
      answer: 'Yes; the JVM dispatches private methods according to the subclass object type'
      explanation: 'Incorrect: private methods are invoked in their declaring context and are not virtually dispatched to subclass versions.'
    - id: C
      answer: 'Yes; any same-named subclass method always overrides, regardless of the original visibility'
      explanation: 'Incorrect: matching names are insufficient; a private superclass method does not participate in valid overriding.'
    - id: D
      answer: 'No; private superclass methods do not participate in virtual dispatch'
      explanation: 'Correct: private superclass methods are not inherited as overridable virtual methods.'
    correctAnswerId: D
  - question: 'What does a covariant return type mean when overriding?'
    readmeRelated:
      anchorList:
      - inheritance-004
      - subtyping-007
      - polymorphism-005
    answers:
    - id: A
      answer: 'An overriding method can return a compatible subtype of the declared reference return type'
      explanation: 'Correct: overriding can narrow the reference return type to a subtype under covariant return rules.'
    - id: B
      answer: 'The override can return any primitive type if the method name matches'
      explanation: 'Incorrect: changing the return type to an arbitrary primitive violates Java overriding rules.'
    - id: C
      answer: 'The override can return a broader supertype than the original method'
      explanation: 'Incorrect: a broader return type can violate the type promised to clients.'
    - id: D
      answer: 'The override must change the return type to Object to maintain polymorphism'
      explanation: 'Incorrect: there is no requirement to return Object; covariance permits a narrower type.'
    correctAnswerId: A
  - question: 'Why can inheriting merely to reuse a few methods be dangerous?'
    readmeRelated:
      anchorList:
      - inheritance-010
      - subtyping-001
      - composition-004
      - design-pitfalls-004
      - refactoring-007
    answers:
    - id: A
      answer: 'The subclass automatically isolates superclass changes, making contracts less affected'
      explanation: 'Incorrect: changes to the superclass can affect inherited subclass behavior; isolation is not automatic.'
    - id: B
      answer: 'The subclass becomes coupled to the superclass implementation and may violate is-a semantics'
      explanation: 'Correct: borrowing methods through inheritance couples the subclass to its superclass and may falsely imply an is-a relationship.'
    - id: C
      answer: 'Inheritance is always faster than composition when reusing only a few methods'
      explanation: 'Incorrect: inheritance does not inherently outperform composition; consider measurement and design.'
    - id: D
      answer: 'The subclass reduces coupling because all dependencies move to the superclass'
      explanation: 'Incorrect: moving dependencies into a superclass often increases coupling rather than reducing it.'
    correctAnswerId: B
  - question: 'When clients repeatedly branch with instanceof to select subtype-specific behavior, what is an appropriate direction?'
    readmeRelated:
      anchorList:
      - polymorphism-009
      - design-patterns-008
      - design-pitfalls-005
      - refactoring-006
    answers:
    - id: A
      answer: 'Move the behavior into subtypes or a Strategy so clients invoke a common contract'
      explanation: 'Correct: placing behavior in subtypes or strategies lets clients call a contract instead of classifying types themselves.'
    - id: B
      answer: 'Replace instanceof with string comparisons on class names'
      explanation: 'Incorrect: comparing class-name strings still depends on subtypes and breaks easily when names change.'
    - id: C
      answer: 'Copy instanceof branches into every client for local handling'
      explanation: 'Incorrect: duplicating instanceof across clients scatters subtype logic and makes extension difficult.'
    - id: D
      answer: 'Move every instanceof branch to one utility while clients remain dependent on types'
      explanation: 'Incorrect: a utility may reduce duplication but does not eliminate type coupling if clients still make subtype decisions.'
    correctAnswerId: A
  - question: 'When can instanceof be acceptable?'
    readmeRelated:
      anchorList:
      - subtyping-006
      - polymorphism-009
      - design-pitfalls-005
    answers:
    - id: A
      answer: 'In every business client to select all behavior based on object type'
      explanation: 'Incorrect: scattering instanceof through clients hard-codes behavior and reduces the benefits of polymorphism.'
    - id: B
      answer: 'At data boundaries or for a closed set of types, when checks are deliberate and centralized'
      explanation: 'Correct: type checks can be appropriate at data boundaries or for closed type sets when managed centrally.'
    - id: C
      answer: 'Only when the class is final, regardless of its usage context'
      explanation: 'Incorrect: final is neither necessary nor sufficient for instanceof to be appropriate.'
    - id: D
      answer: 'Wherever there is an interface, because instanceof is equivalent to virtual dispatch'
      explanation: 'Incorrect: instanceof performs a type check; it is not equivalent to invoking a virtual method through an interface.'
    correctAnswerId: B
- groupID: 6
  groupName: 'Composition, Delegation, and Object Relationships'
  questions:
  - question: 'How does composition make a design more flexible than inheritance?'
    readmeRelated:
      anchorList:
      - inheritance-010
      - composition-001
      - composition-004
      - composition-005
      - refactoring-007
    answers:
    - id: A
      answer: 'It lets a class modify superclass implementations whenever a new variation is needed'
      explanation: 'Incorrect: composition does not require modifying superclass implementations to introduce new variations.'
    - id: B
      answer: 'It forces every collaborator to inherit the same superclass to reuse shared state'
      explanation: 'Incorrect: collaborators need not share a superclass as long as they satisfy suitable interfaces or contracts.'
    - id: C
      answer: 'It converts all collaborator behavior into directly invoked static methods'
      explanation: 'Incorrect: turning behavior into static methods removes the ability to replace a collaborator with another instance.'
    - id: D
      answer: 'It replaces collaborators through contracts without binding to a parent-class implementation'
      explanation: 'Correct: composition selects and replaces collaborating objects through contracts without being tied to superclass implementations.'
    correctAnswerId: D
  - question: 'What does delegation mean?'
    readmeRelated:
      anchorList:
      - oop-basic-004
      - composition-003
      - modeling-003
    answers:
    - id: A
      answer: 'An object creates a subclass at runtime to replace most existing behavior'
      explanation: 'Incorrect: creating a runtime subclass to replace behavior is a different mechanism from forwarding work to a dependency.'
    - id: B
      answer: 'An object transfers all ownership of state to a static utility class'
      explanation: 'Incorrect: moving state to a static utility is not the same as delegating behavior to a collaborator with a contract.'
    - id: C
      answer: 'An object assigns an appropriate part of its work to a collaborator through a method call'
      explanation: 'Correct: delegation means an object hands off part of the processing to a suitable collaborating object.'
    - id: D
      answer: 'An object asks its parent class to execute every overridden method again'
      explanation: 'Incorrect: invoking parent methods is inheritance-based reuse, not delegation in its basic sense.'
    correctAnswerId: C
  - question: 'What does UML composition primarily express?'
    readmeRelated:
      anchorList:
      - composition-007
      - relationships-003
      - modeling-005
    answers:
    - id: A
      answer: 'Strong ownership and a logical lifecycle relationship between a whole and its parts'
      explanation: 'Correct: UML composition expresses strong ownership and the logical lifecycle of parts relative to their whole.'
    - id: B
      answer: 'Parts are allocated and garbage-collected at the same time as the whole'
      explanation: 'Incorrect: logical lifecycles do not require the JVM to allocate and reclaim both objects simultaneously.'
    - id: C
      answer: 'Loose references between independently existing parts and the whole'
      explanation: 'Incorrect: parts that exist completely independently with only loose references are generally closer to aggregation or association.'
    - id: D
      answer: 'A subtype relationship between the whole and its concrete component classes'
      explanation: 'Incorrect: composition is a whole?part relationship, not subtyping or class inheritance.'
    correctAnswerId: A
  - question: 'What common problem arises with bidirectional Parent-Child relationships?'
    readmeRelated:
      anchorList:
      - relationships-006
      - modeling-006
      - testing-010
    answers:
    - id: A
      answer: 'Both sides synchronize automatically because the objects reference each other'
      explanation: 'Incorrect: two-way references do not make Java automatically update fields at the opposite end.'
    - id: B
      answer: 'The two sides may become inconsistent if code updates only one direction'
      explanation: 'Correct: both ends of an association can become inconsistent if only the parent or child is updated.'
    - id: C
      answer: 'The JVM checks the integrity of every bidirectional relationship when fields are written'
      explanation: 'Incorrect: the JVM does not automatically enforce business-object association integrity when writing fields.'
    - id: D
      answer: 'Both sides must use a List to guarantee data synchronization'
      explanation: 'Incorrect: List is only a collection and does not automatically synchronize both sides of an association.'
    correctAnswerId: B
  - question: 'What problem do cyclic dependencies between modules commonly cause?'
    readmeRelated:
      anchorList:
      - relationships-007
      - design-pitfalls-007
      - solid-006
    answers:
    - id: A
      answer: 'Dependency cycles simplify configuration by giving modules a shared lifecycle'
      explanation: 'Incorrect: dependency cycles usually complicate lifecycles rather than inherently simplify configuration.'
    - id: B
      answer: 'They make dependency direction, initialization, and isolated module testing difficult'
      explanation: 'Correct: dependency cycles interfere with managing dependency direction, module initialization, and independent tests.'
    - id: C
      answer: 'Dependency cycles only cause compile errors and do not affect independent testing'
      explanation: 'Incorrect: even when code compiles, cycles can still affect integration and the ability to test modules independently.'
    - id: D
      answer: 'Dependency cycles require all modules to use the same transaction manager'
      explanation: 'Incorrect: a code dependency cycle does not require modules to share a transaction manager.'
    correctAnswerId: B
  - question: 'What design risk does the chain order.getCustomer().getAddress().getCountry() create?'
    readmeRelated:
      anchorList:
      - composition-003
      - class-design-009
      - design-pitfalls-007
    answers:
    - id: A
      answer: 'Multiple getter levels protect clients from structural changes'
      explanation: 'Incorrect: traversing many getter layers propagates changes in deep structures to clients instead of protecting them.'
    - id: B
      answer: 'Clients cannot call chained getters when an object uses encapsulation'
      explanation: 'Incorrect: encapsulation does not prohibit chained getter calls; the risk is excessive structural dependency.'
    - id: C
      answer: 'Each getter may copy an object, automatically increasing allocations'
      explanation: 'Incorrect: getter calls do not inherently create new objects for each dot in an expression.'
    - id: D
      answer: 'Clients know too much about the object graph and break when internal structures change'
      explanation: 'Correct: chains of getters across layers couple clients to the structure of an internal object graph.'
    correctAnswerId: D
- groupID: 7
  groupName: 'SOLID, Cohesion, Coupling, and Responsibility Design'
  questions:
  - question: 'How does Dependency Injection differ from DIP?'
    readmeRelated:
      anchorList:
      - composition-006
      - solid-007
      - solid-006
    answers:
    - id: A
      answer: 'DI is the principle of using interfaces only; DIP is a framework that automatically injects objects'
      explanation: 'Incorrect: DI is not a principle requiring interfaces only, and DIP is not an object-injection framework.'
    - id: B
      answer: 'DI automatically guarantees module boundaries; DIP only determines object lifecycles'
      explanation: 'Incorrect: injecting dependencies does not by itself enforce module boundaries, and DIP is not an object lifecycle principle.'
    - id: C
      answer: 'DI is a technique for supplying dependencies; DIP directs dependencies toward abstractions'
      explanation: 'Correct: DI is a technique for providing dependencies; DIP is the principle that policies should depend on abstractions rather than implementation details.'
    - id: D
      answer: 'DI is a Spring mechanism; DIP is a Spring bean-configuration annotation'
      explanation: 'Incorrect: DI is not exclusive to Spring, and DIP is not an annotation for configuring beans.'
    correctAnswerId: C
  - question: 'How should the Single Responsibility Principle be interpreted?'
    readmeRelated:
      anchorList:
      - class-design-001
      - class-design-002
      - solid-002
    answers:
    - id: A
      answer: 'A class should have one coherent reason to change related to its responsibility'
      explanation: 'Correct: SRP concerns one coherent reason to change based on responsibility, not a count of class members.'
    - id: B
      answer: 'A class must contain only one public method to retain a single responsibility'
      explanation: 'Incorrect: multiple methods can implement one responsibility; one method is not an SRP criterion.'
    - id: C
      answer: 'A class may contain only one state field to keep its responsibility independent'
      explanation: 'Incorrect: field count does not determine responsibilities or which actors may require changes to the class.'
    - id: D
      answer: 'A class must access exactly one table to avoid multiple sources of change'
      explanation: 'Incorrect: accessing several tables may serve one responsibility, and one table may support many responsibilities.'
    correctAnswerId: A
  - question: 'How does the Open/Closed Principle apply when genuine variations exist?'
    readmeRelated:
      anchorList:
      - polymorphism-009
      - solid-003
      - design-patterns-008
      - refactoring-006
    answers:
    - id: A
      answer: 'Expose public fields so clients can change behavior through external state'
      explanation: 'Incorrect: allowing clients to modify public fields exposes representations, rather than providing controlled extension points.'
    - id: B
      answer: 'Extend behavior through appropriate contracts while minimizing changes to stable core logic'
      explanation: 'Correct: OCP encourages extension through appropriate contracts instead of repeatedly changing stable core logic.'
    - id: C
      answer: 'Duplicate core logic in several classes and modify each copy for different variants'
      explanation: 'Incorrect: duplicating core logic creates versions that can diverge and increases maintenance costs.'
    - id: D
      answer: 'Add another conditional branch to the core for every new variation'
      explanation: 'Incorrect: adding a branch to the same core for every variation forces repeated edits and reduces closure against modification.'
    correctAnswerId: B
  - question: 'What does the Dependency Inversion Principle primarily require?'
    readmeRelated:
      anchorList:
      - interface-003
      - class-design-004
      - solid-006
    answers:
    - id: A
      answer: 'High-level policies call concrete adapters, while adapters know nothing about policies'
      explanation: 'Incorrect: making policies import concrete adapters reverses the dependency direction intended by DIP.'
    - id: B
      answer: 'High-level policies depend on abstractions, and detailed implementations fulfill those contracts'
      explanation: 'Correct: DIP makes high-level policies depend on abstractions while low-level adapters implement their contracts.'
    - id: C
      answer: 'High-level policies must use an IoC container to instantiate every dependency'
      explanation: 'Incorrect: an IoC container is a construction technique, not a replacement for dependency inversion.'
    - id: D
      answer: 'High-level policies rely on framework annotations instead of contracts'
      explanation: 'Incorrect: framework annotations are implementation details, not independent contracts for policies.'
    correctAnswerId: B
  - question: 'Is an interface with only one implementation necessarily redundant?'
    readmeRelated:
      anchorList:
      - abstraction-007
      - interface-003
      - polymorphism-002
      - solid-008
      - testing-007
    answers:
    - id: A
      answer: 'Not necessarily; consider the boundary, contract, and realistic substitution needs'
      explanation: 'Correct: a single-implementation interface can still be useful when it establishes a meaningful boundary and substitution contract.'
    - id: B
      answer: 'No; every class must have an interface to satisfy DIP'
      explanation: 'Incorrect: DIP does not require an interface for every class; abstractions belong at useful boundaries.'
    - id: C
      answer: 'Yes; an interface only matters when two classes already implement it'
      explanation: 'Incorrect: an interface does not require at least two implementations when first designed.'
    - id: D
      answer: 'Yes; one implementation proves its contract has no design value'
      explanation: 'Incorrect: implementation count alone does not prove that a contract lacks value.'
    correctAnswerId: A
  - question: 'What should be considered if applying SOLID creates many unhelpful layers?'
    readmeRelated:
      anchorList:
      - oop-basic-008
      - abstraction-007
      - solid-008
      - design-patterns-013
      - refactoring-008
    answers:
    - id: A
      answer: 'Keep splitting layers until each method has its own interface'
      explanation: 'Incorrect: one interface per method often complicates a design without adding substitutability.'
    - id: B
      answer: 'Add factories and adapters around every class for consistency'
      explanation: 'Incorrect: creating factories and adapters around every class can add ceremony and indirection without benefits.'
    - id: C
      answer: 'Choose whether to split layers by counting implemented design patterns'
      explanation: 'Incorrect: pattern counts do not directly indicate the need for abstraction or design quality.'
    - id: D
      answer: 'Apply KISS and YAGNI and examine real changes before adding abstractions'
      explanation: 'Correct: KISS and YAGNI encourage assessing actual change needs before introducing abstraction layers.'
    correctAnswerId: D
  - question: 'How do cohesion and coupling differ?'
    readmeRelated:
      anchorList:
      - class-design-002
      - class-design-003
      - modeling-004
      - solid-002
    answers:
    - id: A
      answer: 'Cohesion measures dependencies between modules; coupling measures responsibilities within a class'
      explanation: 'Incorrect: this reverses the definitions of cohesion and coupling.'
    - id: B
      answer: 'Cohesion increases as a class depends on more unrelated services'
      explanation: 'Incorrect: more service dependencies usually increase coupling and do not prove stronger internal cohesion.'
    - id: C
      answer: 'Coupling mainly measures duplicated logic inside a class'
      explanation: 'Incorrect: duplicated logic is a duplication problem; coupling concerns dependencies between software units.'
    - id: D
      answer: 'Cohesion measures how closely related internal responsibilities are; coupling measures dependencies between units'
      explanation: 'Correct: cohesion indicates how closely members within a unit belong together, while coupling indicates how strongly units depend on one another.'
    correctAnswerId: D
  - question: 'Pricing logic is duplicated in Order, Invoice, and Report. How should it be improved?'
    readmeRelated:
      anchorList:
      - class-design-001
      - class-design-007
      - modeling-003
      - design-patterns-008
      - testing-009
      - refactoring-004
    answers:
    - id: A
      answer: 'Extract only numeric constants and retain a separate calculation in each location'
      explanation: 'Incorrect: extracting constants does not eliminate duplicated fee calculations, which may diverge across classes.'
    - id: B
      answer: 'Move the calculation to a controller so all callers can invoke that API directly'
      explanation: 'Incorrect: a controller handles use cases and should not become the owner of shared fee rules.'
    - id: C
      answer: 'Consolidate the fee rule into a shared policy and test it at each use site'
      explanation: 'Correct: a shared pricing policy provides one source of truth and can be tested where it is used.'
    - id: D
      answer: 'Keep the formula in every location and synchronize copies through periodic manual reviews'
      explanation: 'Incorrect: multiple copies of the formula can still drift despite manual reviews.'
    correctAnswerId: C
  - question: 'What indicates a God Class?'
    readmeRelated:
      anchorList:
      - class-design-002
      - solid-002
      - design-pitfalls-001
      - refactoring-003
    answers:
    - id: A
      answer: 'A class has many methods, all supporting one business responsibility'
      explanation: 'Incorrect: many methods serving one responsibility do not by themselves make a God Class.'
    - id: B
      answer: 'A class manages multiple unrelated concerns and has many reasons to change'
      explanation: 'Correct: a God Class carries multiple concerns and changes in response to different actors or requirements.'
    - id: C
      answer: 'A class uses many interface-based collaborators for a single use case'
      explanation: 'Incorrect: many collaborators can be appropriate when they consistently support one use case.'
    - id: D
      answer: 'A class has many private fields but clearly maintains their shared invariants'
      explanation: 'Incorrect: many fields may be necessary to protect a coherent business invariant.'
    correctAnswerId: B
