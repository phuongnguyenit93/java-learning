    resolve: Trả list chứa immutable DTO/deep copies thay vì chỉ unmodifiable wrapper trên các phần tử có setter.
    knowledge: Unmodifiable view vs deep immutability và defensive copies.
    code: |-
      ### Case 10 — Unmodifiable List không đóng băng phần tử

      ~~~java
      import java.util.*;
      public class Case10 {
        static class Item {
          String sku;int count;
          Item(String sku,int count){this.sku=sku;this.count=count;}
        }
        static class Bad {
          final List<Item> items;
          Bad(List<Item> data){items=List.copyOf(data);}
        }
        record ItemView(String sku,int count){}
        static class Safe {
          final List<ItemView> items;
          Safe(List<Item> input){
            List<ItemView> snapshot=new ArrayList<>();
            for(Item x:input)snapshot.add(new ItemView(x.sku,x.count));
            items=List.copyOf(snapshot);
          }
        }
        static void check(boolean b){if(!b)throw new AssertionError();}
        public static void main(String[] args){
          Item item=new Item("A",2);
          List<Item> input=new ArrayList<>(List.of(item));
          Bad bad=new Bad(input);Safe safe=new Safe(input);
          item.count=9;input.clear();
          check(bad.items.get(0).count==9);
          check(safe.items.size()==1&&safe.items.get(0).count()==2);
          try{safe.items.clear();throw new AssertionError();}
          catch(UnsupportedOperationException expected){}
          System.out.println("PASS");
        }
      }
      ~~~

      Chạy javac Case10.java rồi java Case10. List.copyOf không sao chép Item; bản đúng tạo ItemView bất biến. Với value object chứa nested mutable component, tiếp tục tạo deep copy ở những cấp cần sở hữu.
