    resolve: Tạo PaymentGateway port theo miền và adapter bọc SDK; inject dependency tại composition root để đổi vendor độc
      lập.
    knowledge: DIP, ports-and-adapters và anti-corruption layer.
    code: |-
      ### Case 1 — Domain chỉ biết PaymentGateway port, không biết SDK vendor

      **Lỗi gốc:** Order gọi thẳng vendor SDK; đổi nhà cung cấp buộc sửa model. **Cách chứng minh:** domain nhận port định nghĩa theo nghiệp vụ, adapter của từng vendor triển khai cùng contract. Thử cả thanh toán thất bại và thành công với cùng domain service.

      ~~~java
      public class Case1 {
          interface PaymentGateway { boolean capture(String orderId, long cents); }
          static final class VendorAAdapter implements PaymentGateway {
              public boolean capture(String id, long cents) { return cents <= 1_000; }
          }
          static final class VendorBAdapter implements PaymentGateway {
              public boolean capture(String id, long cents) { return cents > 0; }
          }
          static final class Checkout {
              private final PaymentGateway payment;
              Checkout(PaymentGateway payment) { this.payment = payment; }
              boolean pay(String id, long cents) {
                  if (id == null || id.isBlank() || cents <= 0)
                      throw new IllegalArgumentException("invalid order");
                  return payment.capture(id, cents);
              }
          }
          static void check(boolean b) { if (!b) throw new AssertionError(); }
          public static void main(String[] args) {
              Checkout withA = new Checkout(new VendorAAdapter());
              Checkout withB = new Checkout(new VendorBAdapter());
              check(!withA.pay("O1", 1_500));
              check(withB.pay("O1", 1_500)); // Checkout không đổi khi thay adapter.
              try {
                  withB.pay("", 100);
                  throw new AssertionError("invalid order accepted");
              } catch (IllegalArgumentException expected) { }
              System.out.println("PASS: domain port independent of vendor");
          }
      }
      ~~~

      **Kiểm chứng:** lưu và biên dịch/chạy bằng Java 17 (\`javac Case1.java\`, \`java Case1\`). Hai adapter chỉ mô phỏng phản hồi; không phải kết quả từ cổng thanh toán thật. Trong production, adapter cần chuyển DTO/error vendor, xác thực kết quả capture và bảo đảm idempotency; domain không được tự tin một cờ do client cung cấp.
