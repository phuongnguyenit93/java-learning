    knowledge: Java initialization order, dynamic dispatch và constructor safety.
    code: |-
      ### Case 3 — Constructor cha gọi method có thể override

      Trong Java, lời gọi instance method có thể dispatch xuống subclass trước khi initializer/constructor của subclass hoàn thành. Bản sai ghi nhận null; bản đúng chỉ dùng dữ liệu được xác minh ở constructor cha và gọi hành vi subclass sau khi tạo xong.

      ~~~java
      public class Case3 {
          static class BadBase {
              final String observed;
              BadBase() { observed = token(); }
              String token() { return "base"; }
          }
          static final class BadChild extends BadBase {
              private String childToken = "ready";
              @Override String token() { return childToken; }
          }
          static class GoodBase {
              final String id;
              GoodBase(String id) {
                  if (id == null || id.isBlank())
                      throw new IllegalArgumentException("id");
                  this.id = id;
              }
              final String id() { return id; }
          }
          static final class GoodChild extends GoodBase {
              private final String childToken = "ready";
              GoodChild(String id) { super(id); }
              String tokenAfterConstruction() { return id() + ":" + childToken; }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              BadChild broken = new BadChild();
              check(broken.observed == null);
              check("ready".equals(broken.token())); // Sau constructor mới sẵn sàng.
              GoodChild safe = new GoodChild("A");
              check("A:ready".equals(safe.tokenAfterConstruction()));
              System.out.println("PASS: no virtual dispatch from base constructor");
          }
      }
      ~~~

      Chạy javac Case3.java rồi java Case3. Hai assertion đầu chứng minh thứ tự khởi tạo gây lỗi; assertion cuối cho thấy hành vi được gọi khi object đã hoàn thành. Không công bố tham chiếu this từ constructor để tránh lỗi thoát object khi chưa khởi tạo.
