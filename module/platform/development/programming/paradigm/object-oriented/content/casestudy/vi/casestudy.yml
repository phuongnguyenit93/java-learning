    resolve: Gộp các lớp trung gian chỉ chuyển tiếp, đặt hành vi gần dữ liệu sở hữu; kiểm tra luồng gọi và test trước/sau
      để giảm tầng không cần thiết.
    knowledge: KISS, cohesion, indirection và phát hiện speculative generality.
    code: |-
      ### Case 2 — Bỏ các lớp chuyển tiếp vô ích

      **Phản ví dụ:** `Controller -> Provider -> Factory -> Helper -> Converter` chỉ gọi tiếp cùng một thao tác, không có validation, policy hoặc boundary riêng. Trước khi gộp, dùng characterization test đảm bảo output cũ và mới thống nhất, gồm cả case lỗi.

      ~~~java
      public class Case2 {
          record Order(String id, long amount) {}
          static final class Helper {
              String render(Order o) {
                  if (o == null || o.id() == null || o.id().isBlank()
                      || o.amount() < 0)
                      throw new IllegalArgumentException("invalid order");
                  return o.id() + ":" + o.amount();
              }
          }
          static final class Factory {
              String render(Order o) { return new Helper().render(o); }
          }
          static final class Provider {
              String render(Order o) { return new Factory().render(o); }
          }
          static final class SimplifiedRenderer {
              String render(Order o) {
                  if (o == null || o.id() == null || o.id().isBlank()
                      || o.amount() < 0)
                      throw new IllegalArgumentException("invalid order");
                  return o.id() + ":" + o.amount();
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          static void rejects(java.util.function.Function<Order,String> fn) {
              try {
                  fn.apply(new Order("", -1));
                  throw new AssertionError("expected validation failure");
              } catch (IllegalArgumentException expected) { }
          }
          public static void main(String[] args) {
              Provider oldFlow = new Provider();
              SimplifiedRenderer newFlow = new SimplifiedRenderer();
              for (Order o : new Order[] {
                      new Order("A", 0), new Order("B", 1_250)
              }) {
                  check(oldFlow.render(o).equals(newFlow.render(o)));
              }
              rejects(oldFlow::render);
              rejects(newFlow::render);
              System.out.println("PASS: hành vi được giữ, bớt hai tầng chuyển tiếp");
          }
      }
      ~~~

      **Kiểm chứng:** biên dịch/chạy `Case2.java`; bản rút gọn chỉ còn renderer và không cần lớp trung gian không chứa trách nhiệm. Với code thực, còn cần kiểm tra tác dụng phụ và logging; không xóa các layer có ý nghĩa về transaction, quyền hoặc tích hợp chỉ vì chúng làm tăng độ sâu lời gọi.
  - situation: Code nghiệp vụ được viết thành các static utility thao tác trên object chỉ chứa dữ liệu, khiến trạng thái có
      thể bị sửa mà không qua quy tắc nào.
    readmeRelated:
