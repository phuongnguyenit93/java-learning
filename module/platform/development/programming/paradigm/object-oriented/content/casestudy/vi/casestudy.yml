    code: |-
      ### Case 8 — Exception safety khi rút tiền và tính phí

      ~~~java
      public class Case8 {
        interface Fees{long calculate(long amount);}
        static class BadAccount {
          long balance=100;
          void withdraw(long amount,Fees f){
            balance-=amount;
            balance-=f.calculate(amount);
          }
        }
        static class Account {
          private long balance=100;
          long balance(){return balance;}
          void withdraw(long amount,Fees f){
            if(amount<=0)throw new IllegalArgumentException();
            long fee=f.calculate(amount);
            long total=Math.addExact(amount,fee);
            if(fee<0||total>balance)throw new IllegalArgumentException();
            balance-=total;
          }
        }
        static void check(boolean b){if(!b)throw new AssertionError();}
        public static void main(String[] args){
          Fees broken=a->{throw new IllegalArgumentException("fee");};
          BadAccount bad=new BadAccount();
          try{bad.withdraw(40,broken);}catch(IllegalArgumentException expected){}
          check(bad.balance==60);
          Account good=new Account();
          try{good.withdraw(40,broken);}catch(IllegalArgumentException expected){}
          check(good.balance()==100);
          try{good.withdraw(90,a->20);}catch(IllegalArgumentException expected){}
          check(good.balance()==100);
          good.withdraw(40,a->5);check(good.balance()==55);
          System.out.println("PASS");
        }
      }
      ~~~

      Chạy javac Case8.java rồi java Case8. Tất cả bước có thể ném lỗi chạy trước mutation. Chỉ chứng minh invariant cho object single-thread và Fees không có side effect; với persistence hay nhiều tài khoản cần transaction và đồng bộ.
