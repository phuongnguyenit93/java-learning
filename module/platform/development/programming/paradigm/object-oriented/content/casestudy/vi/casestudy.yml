    resolve: Thay tổ hợp subclass bằng các policy độc lập cho promotion/customer/shipping, ghép qua composition với validation
      tổ hợp hợp lệ.
    knowledge: Composition over inheritance, Strategy và combinatorial explosion.
    code: |-
      Tổ hợp promotion/customer/shipping bằng ba policy độc lập. Validate tổ hợp không hợp lệ tại một điểm thay vì tạo subclass cho mọi permutation.

      ~~~java
      public class Case7 {
          enum Delivery { PHYSICAL, DIGITAL }
          interface Promotion { int apply(int price); }
          interface CustomerPolicy { int apply(int price); }
          interface Shipping { int fee(); }
          static int checkout(int cents, boolean digitalItem, Delivery delivery,
                              Promotion promotion, CustomerPolicy customer, Shipping shipping) {
              if (digitalItem && delivery == Delivery.PHYSICAL)
                  throw new IllegalArgumentException("Digital item cannot ship physically");
              int price = customer.apply(promotion.apply(cents));
              if (price < 0 || shipping.fee() < 0) throw new IllegalArgumentException();
              return price + shipping.fee();
          }
          public static void main(String[] args) {
              Promotion sale = cents -> cents - 100;
              CustomerPolicy vip = cents -> cents * 9 / 10;
              Shipping digital = () -> 0;
              if (checkout(1000, true, Delivery.DIGITAL, sale, vip, digital) != 810)
                  throw new AssertionError();
              try {
                  checkout(1000, true, Delivery.PHYSICAL, sale, vip, digital);
                  throw new AssertionError("Invalid combination was accepted");
              } catch (IllegalArgumentException expected) {}
          }
      }
      ~~~

      Kỳ vọng: ba policy kết hợp tạo giá 810; tổ hợp giao hàng vật lý cho hàng số bị từ chối.
  - situation: Một thuật toán có thể thay đổi lúc runtime lại được cố định bằng inheritance nên phải tạo lại toàn bộ object
      mỗi khi người dùng đổi lựa chọn.
    readmeRelated:
      anchorList:
      - composition-005
      - solid-003
      - design-patterns-008
      - refactoring-007
    resolve: Đưa thuật toán biến đổi vào collaborator Strategy có thể thay trong phạm vi owner; không dùng subclass chỉ để
      đổi runtime option.
    knowledge: Strategy, runtime delegation và state ownership.
    code: |-
      Strategy là collaborator mà owner có thể thay khi runtime, không phải subclass cố định trong object. Giữ nguyên owner khi người dùng thay thuật toán.

      ~~~java
      import java.util.Objects;
      public class Case8 {
          interface Pricing { int apply(int cents); }
          static class Checkout {
              private Pricing pricing;
              Checkout(Pricing pricing) { this.pricing = Objects.requireNonNull(pricing); }
              void choose(Pricing next) { pricing = Objects.requireNonNull(next); }
              int total(int cents) { return pricing.apply(cents); }
          }
          public static void main(String[] args) {
              Pricing regular = amount -> amount;
              Pricing sale = amount -> amount * 9 / 10;
              Checkout checkout = new Checkout(regular);
              Checkout sameOwner = checkout;
              if (checkout.total(1000) != 1000) throw new AssertionError();
              checkout.choose(sale);
              if (checkout != sameOwner || checkout.total(1000) != 900)
                  throw new AssertionError("Runtime strategy switch failed");
              checkout.choose(regular);
              if (checkout.total(1000) != 1000) throw new AssertionError();
          }
      }
      ~~~

      Kỳ vọng: cùng Checkout lần lượt dùng giá 1000, 900, 1000 sau khi thay Strategy, không cần thay object chủ.
