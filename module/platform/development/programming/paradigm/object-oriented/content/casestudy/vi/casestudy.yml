    code: |-
      ### Case 13 — Tách thay đổi trạng thái và gửi sự kiện

      Phản ví dụ: trạng thái đã đổi nhưng gửi thông báo lỗi. Bản mô phỏng ghi state và outbox trước, để publisher thử lại riêng. Đây **không phải DB transaction thực**.

      ~~~java
      import java.util.*;
      public class Case13 {
        record Event(String id){}
        static class Broken {
          String state="NEW";
          void pay(Runnable notify){
            state="PAID";notify.run();
          }
        }
        static class Store {
          String state="NEW";
          final List<Event> outbox=new ArrayList<>();
          void pay(boolean allowed){
            if(!allowed)throw new IllegalArgumentException();
            state="PAID";outbox.add(new Event("e1"));
          }
        }
        static class Publisher {
          final Set<String> delivered=new HashSet<>();
          void run(Store store,java.util.function.Consumer<Event> sender){
            for(Event e:store.outbox){
              if(delivered.contains(e.id()))continue;
              sender.accept(e);
              delivered.add(e.id());
            }
          }
        }
        static void check(boolean b){if(!b)throw new AssertionError();}
        public static void main(String[] args){
          Broken bad=new Broken();
          try{bad.pay(()->{throw new IllegalStateException();});}
          catch(IllegalStateException expected){}
          check(bad.state.equals("PAID"));
          Store s=new Store();
          try{s.pay(false);}catch(IllegalArgumentException expected){}
          check(s.state.equals("NEW")&&s.outbox.isEmpty());
          s.pay(true);
          Publisher pub=new Publisher();
          try{pub.run(s,e->{throw new IllegalStateException();});}
          catch(IllegalStateException expected){}
          List<String> delivered=new ArrayList<>();
          pub.run(s,e->delivered.add(e.id()));
          pub.run(s,e->delivered.add(e.id()));
          check(delivered.equals(List.of("e1")));
          System.out.println("PASS");
        }
      }
      ~~~

      Chạy javac Case13.java rồi java Case13. Bộ nhớ không bảo đảm atomic commit hoặc exactly-once giữa các tiến trình. Production cần SQL transaction ghi order+outbox và consumer idempotent theo eventId khi thông báo đến lặp lại.
