    resolve: Thay chuỗi tham số cùng kiểu bằng value objects có tên/Builder kiểm tra required fields; cung cấp factory có
      ý nghĩa.
    knowledge: Primitive obsession, type safety, Builder và object construction.
    code: |-
      ### Case 2 — Nhiều tham số String làm sai vị trí dữ liệu

      Constructor cũ nhận 12 String; các tham số cùng kiểu vẫn biên dịch nếu developer đưa phone vào vị trí customerId. Bản đúng dùng typed value objects, factory có tên rõ và Builder kiểm required fields.

      ~~~java
      public class Case2 {
          record LegacyUser(String id, String name, String phone,
                            String city, String district, String street,
                            String zip, String country, String email,
                            String alias, String language, String note) {}
          record CustomerId(String value) {
              CustomerId {
                  if (value == null || !value.startsWith("C-"))
                      throw new IllegalArgumentException("customer id");
              }
          }
          record Phone(String value) {
              Phone {
                  if (value == null || !value.startsWith("09"))
                      throw new IllegalArgumentException("phone");
              }
          }
          record Customer(CustomerId id, Phone phone) {}
          static final class Builder {
              private CustomerId id;
              private Phone phone;
              Builder id(CustomerId value) { id = value; return this; }
              Builder phone(Phone value) { phone = value; return this; }
              Customer build() {
                  if (id == null || phone == null)
                      throw new IllegalStateException("Required fields");
                  return new Customer(id, phone);
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              LegacyUser bad = new LegacyUser("091234", "Lan", "C-42",
                  "HN", "Q1", "Street", "1", "VN", "x@y", "L", "vi", "");
              check(bad.id().startsWith("09")); // Nhầm vị trí nhưng Java chấp nhận.
              try {
                  new Builder().phone(new Phone("091234")).build();
                  throw new AssertionError("missing id accepted");
              } catch (IllegalStateException expected) { }
              Customer ok = new Builder().id(new CustomerId("C-42"))
                                         .phone(new Phone("091234")).build();
              check(ok.id().value().equals("C-42"));
              // new Builder().id(new Phone("091234")); // Không biên dịch.
              System.out.println("PASS: typed fields and required Builder state");
          }
      }
      ~~~

      Chạy javac Case2.java rồi java Case2. Kiểu riêng khiến lỗi hoán đổi ID/Phone bị phát hiện tại compile time khi gọi Builder, còn thiếu trường bị phát hiện tại build(). Các chuỗi regex/format chỉ là giả định minh họa; kiểm tra thật phải dựa định dạng nghiệp vụ.
