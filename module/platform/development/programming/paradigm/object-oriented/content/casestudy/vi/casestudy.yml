    knowledge: ISP, least privilege và role-based interfaces.
    code: |-
      ### Case 3 — Read-only client không nên thấy API xóa hóa đơn

      **Lỗi gốc:** interface tổng hợp \`print\` và \`delete\` buộc client đọc phụ thuộc cả thao tác phá hủy. **Cách sửa:** tách hợp đồng theo năng lực; report service chỉ nhận \`InvoiceReader\`, admin service mới nhận \`InvoiceAdmin\`.

      ~~~java
      public class Case3 {
          interface InvoiceReader { String read(String id); }
          interface InvoiceAdmin { void delete(String id); }
          static final class Store implements InvoiceReader, InvoiceAdmin {
              private boolean exists = true;
              public String read(String id) {
                  if (!exists) throw new IllegalStateException("deleted");
                  return "Invoice:" + id;
              }
              public void delete(String id) { exists = false; }
          }
          static final class ReportingService {
              private final InvoiceReader reader;
              ReportingService(InvoiceReader reader) { this.reader = reader; }
              String report(String id) { return reader.read(id); }
          }
          static void check(boolean b) { if (!b) throw new AssertionError(); }
          public static void main(String[] args) {
              Store store = new Store();
              InvoiceReader readOnly = store;
              ReportingService reporting = new ReportingService(readOnly);
              check(reporting.report("I1").equals("Invoice:I1"));
              // readOnly.delete("I1"); // Không biên dịch: Reader không có delete.
              InvoiceAdmin admin = store;
              admin.delete("I1");
              try {
                  reporting.report("I1");
                  throw new AssertionError("deleted invoice was readable");
              } catch (IllegalStateException expected) { }
              System.out.println("PASS: read-only contract limits capabilities");
          }
      }
      ~~~

      **Kiểm chứng:** \`javac Case3.java\`, \`java Case3\`; bỏ comment lệnh \`readOnly.delete\` sẽ khiến compile fail do không tồn tại method. Đây chỉ là an toàn của **type-level capability**; quyền đọc/xóa trên HTTP hoặc database vẫn phải kiểm soát bằng authorization thực.
