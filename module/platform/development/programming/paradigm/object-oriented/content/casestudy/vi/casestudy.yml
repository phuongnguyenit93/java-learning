    code: |-
      ### Case 8 — Identity của employee không phải họ tên + ngày sinh

      Hai nhân viên có tên/ngày sinh giống nhau vẫn là hai **entity** khi `employeeId` khác. Với entity đã có ID ổn định, định nghĩa `equals` và `hashCode` theo ID, không dựa thuộc tính có thể trùng hay thay đổi.

      ~~~java
      import java.time.LocalDate;
      import java.util.*;

      public class Case8 {
          static final class Employee {
              final String employeeId;
              final String fullName;
              final LocalDate birthDate;
              Employee(String id, String name, LocalDate birth) {
                  if (id == null || id.isBlank())
                      throw new IllegalArgumentException("id");
                  employeeId = id;
                  fullName = Objects.requireNonNull(name);
                  birthDate = Objects.requireNonNull(birth);
              }
              @Override public boolean equals(Object other) {
                  return this == other || (other instanceof Employee e
                           && employeeId.equals(e.employeeId));
              }
              @Override public int hashCode() { return employeeId.hashCode(); }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              LocalDate d = LocalDate.of(1995, 1, 1);
              Employee a = new Employee("E-1", "An", d);
              Employee b = new Employee("E-2", "An", d);
              Employee sameIdentity = new Employee("E-1", "An", d);
              check(!a.equals(b)); // Khác ID dù giống tên/ngày sinh.
              check(a.equals(sameIdentity));
              check(a.hashCode() == sameIdentity.hashCode());
              Set<Employee> employees = new HashSet<>(List.of(a,b,sameIdentity));
              check(employees.size() == 2);
              check(employees.contains(new Employee("E-2", "An", d)));
              System.out.println("PASS: employeeId là identity");
          }
      }
      ~~~

      **Kiểm chứng:** `javac Case8.java` và `java Case8`. Nên thêm test tính đối xứng/bắc cầu trong dự án. Nếu ID chỉ được DB cấp sau persist, không làm biến đổi `hashCode` khi object đã nằm trong Set; chọn chiến lược equality phù hợp với lifecycle.
  - situation: Hệ thống tạo hàng nghìn object tạm ở mỗi request nhưng không đo được liệu độ trễ đến từ logic ứng dụng, cấp
      phát hay garbage collection.
    readmeRelated:
      anchorList:
      - oop-basic-008
      - lifecycle-001
      - lifecycle-007
      - refactoring-001
    resolve: Đo bằng profiler/JFR và benchmark workload đại diện trước tối ưu; xem allocation rate, GC pause và tracing luồng
      nghiệp vụ thay vì suy đoán.
    knowledge: Profiling, allocation, garbage collection và performance baselines.
    code: |-
      ### Case 9 — Chứng minh nguyên nhân latency bằng JFR, không suy đoán

      Câu hỏi là CPU nghiệp vụ, object allocation hay GC làm chậm request. Không thể suy ra nguyên nhân chỉ từ số object trong mã. Dùng workload có thể lặp lại và **Flight Recorder** để lấy bằng chứng, không gán số liệu giả.

      ~~~java
      public class Case9 {
          private static volatile Object keepAlive;
          static long compute(int rounds) {
              long value = 0;
              for (int i = 0; i < rounds; i++) {
                  value += (long)(i % 97) * (i % 31);
              }
              return value;
          }
          static long allocate(int rounds) {
              long count = 0;
              for (int i = 0; i < rounds; i++) {
                  byte[] bytes = new byte[1024];
                  bytes[0] = (byte)i;
                  keepAlive = bytes; // Tạo escape có quan sát được.
                  count += bytes.length;
              }
              return count;
          }
          public static void main(String[] args) {
              if (args.length != 1)
                  throw new IllegalArgumentException("use: cpu|allocation");
              long result = switch (args[0]) {
                  case "cpu" -> compute(2_000_000);
                  case "allocation" -> allocate(2_000_000);
                  default -> throw new IllegalArgumentException(args[0]);
              };
              if (result <= 0) throw new AssertionError("invalid workload");
              System.out.println("workload completed; result=" + result);
          }
      }
      ~~~

      **Quy trình có thể chạy lại** (JDK 17+):

      ~~~text
      javac Case9.java
      java -XX:StartFlightRecording=filename=cpu.jfr,settings=profile,dumponexit=true Case9 cpu
      java -XX:StartFlightRecording=filename=alloc.jfr,settings=profile,dumponexit=true Case9 allocation
      jfr summary cpu.jfr
      jfr summary alloc.jfr
      jfr print --events jdk.ExecutionSample,jdk.ObjectAllocationSample,jdk.GarbageCollection cpu.jfr
      jfr print --events jdk.ExecutionSample,jdk.ObjectAllocationSample,jdk.GarbageCollection alloc.jfr
      ~~~

      **Đánh giá:** đối chiếu mẫu CPU, class/method cấp phát, GC event và pause với trace/latency của workload thực tế; benchmark thêm nhiều lần có warm-up, so cùng JDK/heap/OS. Tình huống này là **cách thu thập chứng cứ**, chưa chạy JFR và không khẳng định CPU hay GC là nút thắt. Một chạy rất ngắn có thể có ít sample; cần tăng thời gian chạy và dùng workload đại diện. Không tự kết luận kết quả thử nghiệm sẽ giống production.
  - situation: Mô hình nghiệp vụ có quá nhiều class tên Manager, Helper và Processor nhưng không ai xác định được object nào
      sở hữu quy tắc tính giá.
