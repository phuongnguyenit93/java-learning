      anchorList: []
    resolve: Thu nhỏ critical section hoặc dùng khóa theo resource/atomic field; kiểm benchmark contention trên workload thực
      trước chọn giải pháp.
    knowledge: Lock granularity, contention và concurrent throughput.
    code: |-
      ### Case 9 — Khóa toàn service làm serialize các request không liên quan

      \`synchronized\` trên toàn method giữ monitor cả khi gọi collaborator xử lý công việc độc lập. Thu nhỏ critical section cho counter bằng AtomicInteger, chạy công việc ngoài lock. Đầu ra kiểm tra lock ownership; **không tự suy ra throughput đã tăng**.

      ~~~java
      import java.util.concurrent.atomic.AtomicInteger;
      public class Case9 {
          static final class BadService {
              private int count;
              synchronized void handle(Runnable work){
                  count++;
                  work.run(); // Lệnh ngoài vẫn giữ monitor của cả service.
              }
              synchronized int count(){return count;}
          }
          static final class BetterService {
              private final AtomicInteger count=new AtomicInteger();
              void handle(Runnable work){
                  count.incrementAndGet(); // Critical operation nhỏ.
                  work.run();              // Không giữ monitor trên work.
              }
              int count(){return count.get();}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BadService old=new BadService();
              old.handle(()->check(Thread.holdsLock(old)));
              BetterService better=new BetterService();
              better.handle(()->check(!Thread.holdsLock(better)));
              better.handle(()->check(!Thread.holdsLock(better)));
              check(old.count()==1 && better.count()==2);
              System.out.println("PASS: independent work not under service monitor");
          }
      }
      ~~~

      **Kiểm chứng:** test thể hiện \`BadService\` gọi callback khi giữ khóa, \`BetterService\` chỉ dùng atomic update. Để xác định contention thật cần benchmark đa thread cùng workload, số lượng request đồng thời, blocked time, JFR \`jdk.JavaMonitorEnter\`, và kiểm invariant dưới tải. Nếu work còn thao tác với state chia sẻ khác, tách lock không được phép làm mất transaction tổng thể.
