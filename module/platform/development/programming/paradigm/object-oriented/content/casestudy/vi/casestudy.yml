      ### Case 5 — private field vẫn lộ mutable object

      ~~~java
      public class Case5 {
        static class Address {String street="Main";}
        static class Bad {
          private final Address address=new Address();
          Address getAddress(){return address;}
        }
        record AddressView(String street){}
        static class Profile {
          private String street="Main";
          AddressView address(){return new AddressView(street);}
          void change(String value){
            if(value==null||value.isBlank())throw new IllegalArgumentException();
            street=value;
          }
        }
        static void check(boolean b){if(!b)throw new AssertionError();}
        public static void main(String[] args){
          Bad bad=new Bad();bad.getAddress().street="";
          check(bad.getAddress().street.isBlank());
          Profile good=new Profile();
          AddressView before=good.address();
          try{good.change("");throw new AssertionError();}
          catch(IllegalArgumentException expected){}
          check(good.address().street().equals("Main"));
          good.change("Second");
          check(good.address().street().equals("Second"));
          check(before.street().equals("Main"));
          System.out.println("PASS");
        }
      }
