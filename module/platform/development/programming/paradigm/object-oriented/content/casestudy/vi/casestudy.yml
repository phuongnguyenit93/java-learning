      ### Case 4 — Defensive copy cho mảng byte nội bộ

      Mảng byte luôn mutable, nên cả đầu vào và đầu ra phải có bản sao khi dữ liệu cần được giữ nguyên. Ví dụ dùng dữ liệu giả để không tiết lộ khóa thật.

      ~~~java
      import java.util.Arrays;
      public class Case4 {
        static class Bad {
          private final byte[] data;
          Bad(byte[] data){this.data=data;}
          byte[] data(){return data;}
        }
        static class Safe {
          private final byte[] data;
          Safe(byte[] value){
            if(value==null||value.length==0)throw new IllegalArgumentException();
            data=value.clone();
          }
          byte[] snapshot(){return data.clone();}
        }
        static void check(boolean b){if(!b)throw new AssertionError();}
        public static void main(String[] args){
          byte[] a={1,2,3};Bad bad=new Bad(a);
          bad.data()[0]=8;check(a[0]==8);
          byte[] source={1,2,3};Safe safe=new Safe(source);
          source[0]=7;safe.snapshot()[1]=9;
          check(Arrays.equals(safe.snapshot(),new byte[]{1,2,3}));
          System.out.println("PASS");
        }
      }
      ~~~

      Chạy javac Case4.java rồi java Case4. Test chứng minh reference alias trong Bad và bản sao vào/ra trong Safe. Với dữ liệu bí mật thật, ưu tiên không cấp getter không cần thiết, có kiểm soát truy cập và quản lý vòng đời; defensive copy không thay thế các biện pháp bảo mật khác.
