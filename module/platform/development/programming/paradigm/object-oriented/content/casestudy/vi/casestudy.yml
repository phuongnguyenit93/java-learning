    resolve: Test class tính tiền bằng unit test thuần và fake dependencies; chỉ dùng Spring context test để kiểm tra wiring/integration
      thực.
    knowledge: Test pyramid, test isolation và Spring context cost.
    code: |-
      Unit test thuần Java cho lớp tính tiền dùng fake dependency, không cần khởi chạy Spring context; kiểm wiring Spring riêng bằng integration test khi thật sự cần.

      ~~~java
      public class Case8 {
          interface DiscountPolicy { int discountCents(int subtotal); }
          static class PricingCalculator {
              private final DiscountPolicy policy;
              PricingCalculator(DiscountPolicy policy) { this.policy = policy; }
              int total(int subtotalCents) {
                  if (subtotalCents < 0) throw new IllegalArgumentException();
                  int discount = policy.discountCents(subtotalCents);
                  if (discount < 0 || discount > subtotalCents)
                      throw new IllegalStateException("Invalid discount");
                  return subtotalCents - discount;
              }
          }
          public static void main(String[] args) {
              DiscountPolicy fake = subtotal -> subtotal / 10;
              PricingCalculator calculator = new PricingCalculator(fake);
              if (calculator.total(1000) != 900) throw new AssertionError();
              if (calculator.total(0) != 0) throw new AssertionError();
              try {
                  calculator.total(-1);
                  throw new AssertionError("Must reject negatives");
              } catch (IllegalArgumentException expected) {}
              PricingCalculator badPolicy = new PricingCalculator(subtotal -> subtotal + 1);
              try {
                  badPolicy.total(100);
                  throw new AssertionError("Must reject invalid collaborator");
              } catch (IllegalStateException expected) {}
          }
      }
      ~~~

      Kỳ vọng: các assertion chạy bằng javac/java thông thường, không phụ thuộc Spring ApplicationContext hay môi trường chạy. Test Spring context nên dành cho cấu hình bean/wiring, HTTP và tích hợp thật.
- groupID: 13
  groupName: Concurrency, vòng đời bộ nhớ và hiệu năng
  cases:
  - situation: Hai thread cùng đọc rồi tăng một counter nằm trong object mutable khiến số lượng xử lý thực tế thấp hơn số
      request đã nhận.
    readmeRelated:
      anchorList:
      - class-003
      - object-007
      - design-pitfalls-008
      - testing-003
    resolve: Dùng AtomicInteger hoặc lock bao quanh toàn bộ read-modify-write; test với nhiều thread và khẳng định tổng cập
      nhật.
    knowledge: Race conditions, atomic operations và lost updates.
    code: |-
      ### Case 1 — Lost update khi hai thread cùng tăng counter

      Phép toán \`value++\` gồm đọc, cộng, ghi; không phải thao tác nguyên tử. Phản ví dụ bên dưới ép hai thread cùng đọc giá trị cũ rồi ghi, tạo lost update có thể tái lập. Bản đúng dùng \`AtomicInteger.incrementAndGet()\` và kiểm đếm sau khi các thread kết thúc.

      ~~~java
      import java.util.concurrent.*;
      import java.util.concurrent.atomic.AtomicInteger;
      public class Case1 {
          static class BadCounter { int value; }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) throws Exception {
              BadCounter bad = new BadCounter();
              CountDownLatch bothRead = new CountDownLatch(2);
              CountDownLatch release = new CountDownLatch(1);
              Runnable unsafe = () -> {
                  int old = bad.value;
                  bothRead.countDown();
                  try { release.await(); }
                  catch (InterruptedException e) {
                      Thread.currentThread().interrupt();
                      return;
                  }
                  bad.value = old + 1;
              };
              Thread a = new Thread(unsafe), b = new Thread(unsafe);
              a.start(); b.start();
              bothRead.await(); release.countDown(); a.join(); b.join();
              check(bad.value == 1); // Hai lần tăng nhưng chỉ ghi nhận một.

              AtomicInteger good = new AtomicInteger();
              Thread[] workers = new Thread[4];
              for (int i=0;i<workers.length;i++) {
                  workers[i] = new Thread(() -> {
                      for (int n=0;n<2_000;n++) good.incrementAndGet();
                  });
                  workers[i].start();
              }
              for (Thread t: workers) t.join();
              check(good.get() == 8_000);
              System.out.println("PASS: atomic counter preserves all increments");
          }
      }
      ~~~

      **Kiểm chứng:** biên dịch \`javac Case1.java\`, chạy \`java Case1\`; các assertion nêu kết quả kỳ vọng chứ chưa phải kết quả thực thi được xác nhận. Latch ép interleaving cho phản ví dụ; AtomicInteger thực hiện read-modify-write tuyến tính hóa. Nếu counter có nhiều field phụ thuộc nhau, một AtomicInteger riêng không tự bảo vệ toàn bộ invariant; cần lock/transaction bao trọn trạng thái.
  - situation: Một thread cập nhật flag completed nhưng thread khác không quan sát được giá trị mới kịp thời vì thiếu quan
      hệ đồng bộ bộ nhớ.
    readmeRelated:
      anchorList:
      - object-007
      - design-pitfalls-008
      - testing-003
    resolve: Dùng volatile/AtomicBoolean hoặc lock để thiết lập happens-before; không coi sleep là bảo đảm visibility.
    knowledge: Java Memory Model, visibility và happens-before.
    code: |-
      ### Case 2 — Visibility của completed cần quan hệ happens-before

      Một flag boolean thường được ghi bởi thread A và đọc bởi thread B mà không đồng bộ có thể không được quan sát đúng hạn. Dùng \`AtomicBoolean\` hoặc \`volatile\` cùng cơ chế đồng bộ rõ. Không dùng Thread.sleep làm bảo đảm visibility.

      ~~~java
      import java.util.concurrent.*;
      import java.util.concurrent.atomic.AtomicBoolean;
      public class Case2 {
          static final class Job {
              private final AtomicBoolean completed = new AtomicBoolean();
              void finish() { completed.set(true); }
              boolean isCompleted() { return completed.get(); }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) throws Exception {
              Job job = new Job();
              ExecutorService pool = Executors.newFixedThreadPool(2);
              CountDownLatch start = new CountDownLatch(1);
              try {
                  Future<Boolean> observer = pool.submit(() -> {
                      start.await();
                      while (!job.isCompleted()) Thread.onSpinWait();
                      return job.isCompleted();
                  });
                  Future<?> writer = pool.submit(() -> {
                      start.await();
                      job.finish();
                      return null;
                  });
                  start.countDown();
                  writer.get(5, TimeUnit.SECONDS);
                  check(observer.get(5, TimeUnit.SECONDS));
                  check(job.isCompleted());
                  System.out.println("PASS: completion safely published");
              } finally {
                  pool.shutdownNow();
              }
          }
      }
      ~~~

      **Kiểm chứng:** \`javac Case2.java\`, \`java Case2\`; Future có timeout để không khiến test treo vô hạn. AtomicBoolean \`set/get\` cung cấp volatile memory semantics. Ví dụ **không tái tạo lỗi visibility của plain boolean một cách chắc chắn**: Java Memory Model cho phép một số hành vi thiếu visibility, không bắt buộc mọi lần chạy đều lỗi. Production nên ưu tiên latch, condition hoặc Future thay vì busy spin nếu thực sự phải chờ hoàn thành.
  - situation: Một object chứa HashMap mutable được nhiều request đọc và ghi cùng lúc làm dữ liệu trả về không ổn định và
      có thể bị mất cập nhật.
    readmeRelated:
      anchorList:
      - object-005
      - object-007
      - design-pitfalls-008
      - testing-003
    resolve: Dùng ConcurrentHashMap hoặc immutable snapshots có contract thao tác phù hợp; bảo vệ compound operations khi
      nhiều request cạnh tranh.
    knowledge: Concurrent collections, thread safety và atomic compound actions.
    code: |-
      ### Case 3 — ConcurrentHashMap phải xử lý cả compound update

      HashMap không được thiết kế cho nhiều writer đồng thời. Ngay cả với map thread-safe, \`get\` rồi \`put\` ở hai lời gọi vẫn có thể mất cập nhật; dùng \`merge\`/compute nguyên tử trên cùng key.

      ~~~java
      import java.util.*;
      import java.util.concurrent.*;
      public class Case3 {
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args) throws Exception {
              Map<String,Integer> wrong = new HashMap<>();
              wrong.put("A",0);
              int first=wrong.get("A"),second=wrong.get("A");
              wrong.put("A",first+1);
              wrong.put("A",second+1);
              check(wrong.get("A")==1); // Mô phỏng lịch xen kẽ bị lost update.

              ConcurrentHashMap<String,Integer> counts=new ConcurrentHashMap<>();
              ExecutorService pool=Executors.newFixedThreadPool(4);
              CountDownLatch go=new CountDownLatch(1);
              try {
                  List<Future<?>> tasks=new ArrayList<>();
                  for(int t=0;t<4;t++){
                      tasks.add(pool.submit(() -> {
                          go.await();
                          for(int i=0;i<1_000;i++) counts.merge("A",1,Integer::sum);
                          return null;
                      }));
                  }
                  go.countDown();
                  for(Future<?> task:tasks)task.get(5,TimeUnit.SECONDS);
                  check(counts.get("A")==4_000);
                  System.out.println("PASS: atomic merge per key");
              } finally {pool.shutdownNow();}
          }
      }
      ~~~

      **Kiểm chứng:** phần sai là một interleaving tuần tự được điều khiển, không chạy HashMap dưới data race nguy hiểm; phần đúng dùng bốn worker và assert tổng. \`ConcurrentHashMap\` làm an toàn một thao tác \`merge\` theo key, không làm transaction nhiều key. Với nhiều field liên quan nhau, cần transaction/lock hoặc immutable snapshot có cơ chế publish phù hợp.
  - situation: Một listener callback được gọi khi object vẫn đang giữ lock, gây deadlock khi callback gọi ngược vào object
      khác.
    readmeRelated:
      anchorList:
      - design-patterns-010
      - testing-010
    resolve: Không gọi callback ngoài trong khi giữ lock; copy danh sách listener dưới lock rồi phát sau unlock, kiểm tra
      thứ tự lock.
    knowledge: Deadlock, lock ordering và external calls under locks.
    code: |-
      ### Case 4 — Không gọi callback ngoài khi đang giữ lock

      Callback bên ngoài có thể gọi ngược vào đối tượng khác và tạo vòng lock. Sai lầm là publish sự kiện ngay trong \`synchronized\`; cách an toàn hơn là chụp snapshot listener dưới lock rồi thực thi callback bên ngoài critical section.

      ~~~java
      import java.util.*;
      public class Case4 {
          interface Listener { void accept(String event); }
          static final class Bus {
              private final Object mutex=new Object();
              private final List<Listener> listeners=new ArrayList<>();
              void subscribe(Listener l){
                  synchronized(mutex){listeners.add(l);}
              }
              void unsubscribe(Listener l){
                  synchronized(mutex){listeners.remove(l);}
              }
              void publish(String value){
                  List<Listener> snapshot;
                  synchronized(mutex){snapshot=List.copyOf(listeners);}
                  for(Listener l:snapshot)l.accept(value);
              }
              boolean holdingBusLock(){return Thread.holdsLock(mutex);}
              int count(){synchronized(mutex){return listeners.size();}}
          }
          static final class BadBus {
              final List<Runnable> listeners=new ArrayList<>();
              synchronized void publish(){
                  for(Runnable r:listeners)r.run(); // Callback vẫn giữ monitor.
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BadBus bad=new BadBus();
              bad.listeners.add(()->check(Thread.holdsLock(bad)));
              bad.publish(); // Chứng minh callback chạy dưới lock, không tạo deadlock.

              Bus safe=new Bus();
              List<String> received=new ArrayList<>();
              Listener[] self=new Listener[1];
              self[0]=event->{
                  check(!safe.holdingBusLock());
                  received.add(event);
                  safe.unsubscribe(self[0]);
              };
              safe.subscribe(self[0]);
              safe.publish("first");
              safe.publish("second");
              check(received.equals(List.of("first")) && safe.count()==0);
              System.out.println("PASS: callbacks invoked outside lock");
          }
      }
      ~~~

      **Kiểm chứng:** test \`Thread.holdsLock\` và unsubscribe ngay trong callback, không cần cưỡng ép deadlock có nguy cơ treo tiến trình. Snapshot tách mutation danh sách khỏi dispatch, nhưng không đảm bảo listener đã unsubscribe sẽ không còn nằm trong một snapshot đã chụp trước đó; hợp đồng phát sự kiện cần nêu rõ điều này. Kiểm thêm lock ordering bằng thread dump khi tích hợp.
  - situation: Một class thread-safe ở từng method nhưng thao tác gồm đọc rồi sửa qua hai method vẫn bị race khi có request
      khác xen vào.
    readmeRelated:
      anchorList:
      - object-007
      - encapsulation-009
      - design-pitfalls-008
      - testing-003
    resolve: Gộp read-and-update vào một atomic method hoặc khóa transaction toàn thao tác, không chỉ synchronized từng getter/setter.
    knowledge: Compound race, atomicity boundaries và thread safety.
    code: |-
      ### Case 5 — Synchronized getter và setter không bảo vệ một transaction đọc-sửa-ghi

      Một class có các method \`synchronized get()\` và \`synchronized set()\` vẫn không bảo đảm client gọi \`set(get()+1)\` như một thao tác nguyên tử. Di chuyển increment vào phương thức synchronized chung.

      ~~~java
      public class Case5 {
          static final class BadCounter {
              private int value;
              synchronized int get(){return value;}
              synchronized void set(int v){value=v;}
          }
          static final class Counter {
              private int value;
              synchronized void increment(){value++;}
              synchronized int get(){return value;}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args) throws InterruptedException {
              BadCounter bad=new BadCounter();
              int readA=bad.get(),readB=bad.get();
              bad.set(readA+1);
              bad.set(readB+1);
              check(bad.get()==1); // Getter/setter riêng vẫn lost update.
              Counter good=new Counter();
              Thread[] workers=new Thread[4];
              for(int i=0;i<workers.length;i++){
                  workers[i]=new Thread(()->{
                      for(int n=0;n<1_000;n++)good.increment();
                  });
                  workers[i].start();
              }
              for(Thread t:workers)t.join();
              check(good.get()==4_000);
              System.out.println("PASS: lock covers entire compound operation");
          }
      }
      ~~~

      **Kiểm chứng:** interleaving cố định làm hỏng bản cũ, phiên bản mới kiểm toàn bộ increment trên cùng monitor. Khóa phải bảo vệ *toàn bộ invariant*; khi thao tác còn gồm I/O, nhiều object hay database, cần thiết kế ranh giới transaction/synchronization và xử lý rollback riêng.
  - situation: Một cache giữ reference của toàn bộ request object đã xử lý mà không có eviction, khiến heap tăng dần dù kết
      quả đã hết giá trị.
    readmeRelated:
      anchorList:
      - object-003
      - lifecycle-006
      - lifecycle-007
    resolve: Giới hạn cache bằng eviction/TTL/size, bỏ reference khi hết nhu cầu; dùng heap dump theo thời gian để chẩn đoán
      retention.
    knowledge: GC reachability, cache eviction và memory leak analysis.
    code: |-
      ### Case 6 — Cache cần giới hạn kích thước và bỏ tham chiếu không còn dùng

      Lưu tất cả request object trong một danh sách sống lâu giữ chúng reachable, khiến GC không thể thu hồi nếu chúng vẫn được tham chiếu. Cache bounded chỉ giữ key và kết quả thật sự cần sử dụng.

      ~~~java
      import java.util.*;
      public class Case6 {
          record Request(String id,byte[] payload){}
          static final class BadRetention {
              final List<Request> everything=new ArrayList<>();
              void remember(Request request){everything.add(request);}
          }
          static final class BoundedCache {
              final Map<String,String> entries;
              BoundedCache(int max){
                  if(max<1)throw new IllegalArgumentException("max");
                  entries=new LinkedHashMap<>(16,0.75f,true){
                      @Override protected boolean removeEldestEntry(
                          Map.Entry<String,String> eldest){
                          return size()>max;
                      }
                  };
              }
              void put(String id,String result){entries.put(id,result);}
              String get(String id){return entries.get(id);}
              int size(){return entries.size();}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BadRetention bad=new BadRetention();
              for(int i=0;i<3;i++)bad.remember(new Request("R"+i,new byte[1_024]));
              check(bad.everything.size()==3); // Vẫn giữ ba request.
              BoundedCache cache=new BoundedCache(2);
              cache.put("R1","ok1");cache.put("R2","ok2");
              check(cache.get("R1").equals("ok1")); // R1 mới được truy cập.
              cache.put("R3","ok3");
              check(cache.size()==2 && cache.get("R2")==null);
              check(cache.get("R1").equals("ok1"));
              System.out.println("PASS: least-recently-used eviction");
          }
      }
      ~~~

      **Kiểm chứng:** kiểm quy tắc LRU, giới hạn 2 entries và việc loại R2 khỏi cache. Điều này xác nhận **không còn reference từ cache tới R2**, không chứng minh heap sẽ giảm hay GC đã chạy. Dùng JFR/heap dump và retention path trong production để xác định object thực tế còn được giữ ở đâu; cân nhắc TTL, size theo byte và concurrency nếu cần.
  - situation: Đội tối ưu hóa bằng cách thay object thành nhiều mảng primitive trước khi đo, khiến mã khó hiểu hơn nhưng latency
      không có số liệu chứng minh cải thiện.
    readmeRelated:
      anchorList:
      - oop-basic-008
      - lifecycle-001
      - lifecycle-007
      - refactoring-001
    resolve: Thiết lập baseline với profiler/benchmark workload thật trước và sau; chỉ đánh đổi readability lấy tối ưu có
      lợi ích được đo.
    knowledge: Performance profiling, allocation và evidence-based optimization.
    code: |-
      ### Case 7 — Không đánh đổi readability lấy hiệu năng khi chưa có baseline

      Thay domain objects bằng mảng primitive có thể làm code khó bảo trì mà lợi ích chưa được xác nhận. Trước hết viết test tương đương hành vi, sau đó đo workload đại diện, warmup, allocation, GC, throughput/latency bằng JMH/JFR.

      ~~~java
      public class Case7 {
          record Line(long unitPrice,int quantity){}
          static long usingObjects(Line[] lines){
              long total=0;
              for(Line x:lines)
                  total=Math.addExact(total,
                      Math.multiplyExact(x.unitPrice(),x.quantity()));
              return total;
          }
          static long usingArrays(long[] prices,int[] quantities){
              if(prices.length!=quantities.length)
                  throw new IllegalArgumentException("length");
              long total=0;
              for(int i=0;i<prices.length;i++)
                  total=Math.addExact(total,
                      Math.multiplyExact(prices[i],quantities[i]));
              return total;
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Line[] lines={new Line(100,2),new Line(55,3),new Line(0,1)};
              long[] prices={100,55,0};
              int[] quantities={2,3,1};
              long expected=usingObjects(lines);
              check(expected==365);
              check(usingArrays(prices,quantities)==expected);
              try{
                  usingArrays(new long[]{1,2},new int[]{1});
                  throw new AssertionError("mismatch accepted");
              }catch(IllegalArgumentException ok){}
              System.out.println("PASS: both implementations are functionally equal");
          }
      }
      ~~~

      **Cách kiểm chứng performance:** lưu phiên bản trước/sau, đo workload tương đương với JMH (fork, warmup, measurement, blackhole), dùng JFR cho allocation/GC và profiler CPU, so p95/p99 theo tải thực tế; thử nhiều lần cùng JDK/heap/OS. Chưa chạy benchmark nên **không có kết luận mảng nhanh hơn object**. Assertion ở trên chỉ kiểm tra tính đúng và edge case.
  - situation: Một thay đổi cho object reuse nhằm giảm allocation vô tình giữ lại state của request trước, gây rò rỉ dữ liệu
      giữa các người dùng.
    readmeRelated:
      anchorList:
      - object-005
      - object-007
      - lifecycle-006
      - design-pitfalls-008
      - testing-003
    resolve: Không reuse mutable object qua các request không tin cậy; dùng immutable context/new instance hoặc reset đầy
      đủ và test isolation.
    knowledge: Object pooling risks, aliasing và data isolation.
    code: |-
      ### Case 8 — Reuse mutable object giữa request làm rò state của user trước

      Pool dùng chung \`MutableContext\` và chỉ reset username mà quên quyền ADMIN: request B vô tình nhận quyền của A. Immutable request context tạo riêng cho mỗi request và defensive copy các collection.

      ~~~java
      import java.util.*;
      public class Case8 {
          static final class MutableContext {
              String user;
              final Set<String> roles=new HashSet<>();
          }
          static final class BadPool {
              static final MutableContext SHARED=new MutableContext();
              static MutableContext forUser(String user){
                  SHARED.user=user;
                  return SHARED; // Quên clear roles.
              }
          }
          record RequestContext(String user,Set<String> roles){
              RequestContext{
                  if(user==null||user.isBlank())throw new IllegalArgumentException();
                  roles=Set.copyOf(roles);
              }
              boolean isAdmin(){return roles.contains("ADMIN");}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              MutableContext first=BadPool.forUser("Alice");
              first.roles.add("ADMIN");
              MutableContext second=BadPool.forUser("Bob");
              check(second==first);
              check(second.user.equals("Bob")&&second.roles.contains("ADMIN"));

              Set<String> inputRoles=new HashSet<>(Set.of("USER"));
              RequestContext bob=new RequestContext("Bob",inputRoles);
              inputRoles.add("ADMIN");
              RequestContext alice=new RequestContext("Alice",Set.of("ADMIN"));
              check(!bob.isAdmin() && alice.isAdmin());
              try{
                  bob.roles().add("ADMIN");
                  throw new AssertionError("mutable snapshot");
              }catch(UnsupportedOperationException expected){}
              System.out.println("PASS: per-request immutable authorization snapshot");
          }
      }
      ~~~

      **Kiểm chứng:** đường sai cho thấy state từ user trước tồn tại; đường đúng không bị ảnh hưởng khi tập roles đầu vào đổi và không cho sửa snapshot. Ví dụ chỉ mô phỏng dữ liệu phân quyền, **không phải hệ thống xác thực thật**; roles phải do security layer đáng tin tạo, không nhận trực tiếp từ client. Reuse object chỉ an toàn khi owner/lifecycle và reset mọi field được xác định rõ.
  - situation: Ứng dụng dùng synchronized trên toàn service để bảo vệ một field nhỏ, khiến các request độc lập bị chặn nối
      đuôi nhau dưới tải cao.
