  - situation: Một trò chơi có quá nhiều trạng thái được mã hóa bằng boolean trên object nhân vật, cho phép các kết hợp trạng
      thái vô nghĩa.
    readmeRelated:
      anchorList:
      - encapsulation-002
      - encapsulation-009
      - modeling-008
      - design-patterns-009
      - testing-003
    resolve: Biểu diễn các trạng thái hợp lệ bằng enum/state machine có transition guard; không để nhiều boolean độc lập tạo
      tổ hợp vô lý.
    knowledge: State pattern, invariants và state explosion.
    code: |-
      Dùng enum và transition guard thay cho nhiều boolean isRunning/isJumping/isDead có thể cùng true. Chỉ các chuyển trạng thái hợp lệ được phép.

      ~~~java
      public class Case11 {
          enum State { IDLE, RUNNING, JUMPING, DEAD }
          static class Player {
              private State state = State.IDLE;
              State state() { return state; }
              void change(State next) {
                  boolean allowed = switch (state) {
                      case IDLE -> next == State.RUNNING || next == State.DEAD;
                      case RUNNING -> next == State.IDLE || next == State.JUMPING || next == State.DEAD;
                      case JUMPING -> next == State.RUNNING || next == State.DEAD;
                      case DEAD -> false;
                  };
                  if (!allowed) throw new IllegalStateException(state + " -> " + next);
                  state = next;
              }
          }
          public static void main(String[] args) {
              Player p = new Player();
              p.change(State.RUNNING);
              p.change(State.JUMPING);
              if (p.state() != State.JUMPING) throw new AssertionError();
              try {
                  p.change(State.IDLE);
                  throw new AssertionError("Illegal transition accepted");
              } catch (IllegalStateException expected) {}
              if (p.state() != State.JUMPING) throw new AssertionError("State mutated on failure");
          }
      }
      ~~~

      Kỳ vọng: state machine chỉ có một trạng thái hiện hành; JUMPING -> IDLE bị chặn.
