      ### Case 3 — Cart chỉ cho sửa qua domain API

      ~~~java
      import java.util.*;
      public class Case3 {
        static class BadCart {
          List<String> items=new ArrayList<>(List.of("A"));
          List<String> items(){return items;}
        }
        record Item(String sku,int qty){}
        static class Cart {
          private final List<Item> items=new ArrayList<>();
          private boolean locked;
          void add(String sku,int qty,int stock){
            if(locked)throw new IllegalStateException();
            if(sku==null||sku.isBlank()||qty<=0||qty>stock)
              throw new IllegalArgumentException();
            items.add(new Item(sku,qty));
          }
          void checkout(){locked=true;}
          List<Item> items(){return List.copyOf(items);}
        }
        static void check(boolean b){if(!b)throw new AssertionError();}
        public static void main(String[] args){
          BadCart bad=new BadCart();bad.items().clear();
          check(bad.items().isEmpty());
          Cart c=new Cart();
          try{c.add("A",3,2);throw new AssertionError();}
          catch(IllegalArgumentException expected){}
          c.add("A",1,2);
          try{c.items().clear();throw new AssertionError();}
          catch(UnsupportedOperationException expected){}
          c.checkout();
          try{c.add("B",1,2);throw new AssertionError();}
          catch(IllegalStateException expected){}
          check(c.items().size()==1);
          System.out.println("PASS");
        }
      }
      ~~~

      Chạy javac Case3.java rồi java Case3. Getter cũ lộ list; getter mới trả snapshot bất biến của record Item. Tham số stock trong demo là dữ liệu giả lập tin cậy; hệ thống thật phải kiểm tồn kho tại boundary nghiệp vụ/transaction trước khi checkout.
