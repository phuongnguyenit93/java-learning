    code: |-
      Đưa khả năng export vào role interface được client thực sự cần, không downcast từ superclass để gọi phương thức riêng của subtype.

      ~~~java
      import java.util.List;
      public class Case4 {
          interface RecordView { String id(); }
          interface Exportable extends RecordView { String export(); }
          record PdfRecord(String id) implements Exportable {
              public String export() { return "PDF:" + id; }
          }
          record CsvRecord(String id) implements Exportable {
              public String export() { return "CSV:" + id; }
          }
          static String exportAll(List<? extends Exportable> records) {
              return String.join("|", records.stream().map(Exportable::export).toList());
          }
          public static void main(String[] args) {
              List<Exportable> records = List.of(new PdfRecord("a"), new CsvRecord("b"));
              if (!"PDF:a|CSV:b".equals(exportAll(records))) throw new AssertionError();
              // Sai: for (RecordView r : records) ((PdfRecord) r).export();
              // Cast trên sẽ thất bại với CsvRecord.
          }
      }
      ~~~

      Kỳ vọng: compiler yêu cầu Exportable ở ranh giới gọi; không cần hỏi subtype của mỗi bản ghi.
  - situation: Ứng dụng muốn thêm một kênh thông báo mới nhưng phải thay đổi luồng xử lý của các kênh đang hoạt động, gây
      lỗi hồi quy.
    readmeRelated:
      anchorList:
      - interface-003
      - polymorphism-002
      - solid-003
      - design-patterns-008
      - testing-009
    resolve: Tách NotificationSender khỏi điều phối, thêm implementation mới tại composition root; kiểm thử không thay kết
      quả các kênh cũ.
    knowledge: OCP, Strategy và regression isolation.
    code: |-
      Điều phối chỉ biết NotificationSender; bổ sung kênh PUSH bằng đăng ký implementation mới tại composition root, giữ nguyên hành vi EMAIL/SMS.

      ~~~java
      import java.util.*;
      public class Case5 {
          enum Channel { EMAIL, SMS, PUSH }
          interface NotificationSender { String send(String message); }
          record EmailSender() implements NotificationSender {
              public String send(String m) { return "email:" + m; }
          }
          record SmsSender() implements NotificationSender {
              public String send(String m) { return "sms:" + m; }
          }
          record PushSender() implements NotificationSender {
              public String send(String m) { return "push:" + m; }
          }
          static class Dispatcher {
              private final Map<Channel, NotificationSender> routes;
              Dispatcher(Map<Channel, NotificationSender> routes) { this.routes = Map.copyOf(routes); }
              String dispatch(Channel c, String message) {
                  NotificationSender s = routes.get(c);
                  if (s == null) throw new IllegalArgumentException("Unknown channel");
                  return s.send(message);
              }
          }
          public static void main(String[] args) {
              Map<Channel, NotificationSender> initial = Map.of(
                  Channel.EMAIL, new EmailSender(), Channel.SMS, new SmsSender());
              Dispatcher before = new Dispatcher(initial);
              Map<Channel, NotificationSender> expanded = new EnumMap<>(initial);
              expanded.put(Channel.PUSH, new PushSender());
              Dispatcher after = new Dispatcher(expanded);
              for (Channel c : initial.keySet())
                  if (!before.dispatch(c, "hi").equals(after.dispatch(c, "hi")))
                      throw new AssertionError("Existing channel regressed");
              if (!"push:hi".equals(after.dispatch(Channel.PUSH, "hi"))) throw new AssertionError();
          }
      }
      ~~~

      Kỳ vọng: thêm PUSH không đòi sửa Dispatcher; regression assertion khóa kết quả của cả hai kênh cũ.
  - situation: Một interface có nhiều implementation nhưng không có test chung, khiến implementation mới trả giá trị sai cho
      trường hợp biên.
    readmeRelated:
      anchorList:
      - abstraction-004
      - interface-008
      - subtyping-007
      - solid-004
      - testing-004
      - testing-005
    resolve: Tạo shared contract test suite cho mọi implementation, gồm null, empty, errors, rounding và side effects.
    knowledge: LSP, semantic contracts và parameterized testing.
    code: |-
      Một shared contract test phải được áp dụng cho mọi implementation. Bao phủ null, coupon rỗng, lỗi số âm, rounding và kết quả ổn định qua hai lần gọi.

      ~~~java
      import java.math.*;
      import java.util.List;
      public class Case6 {
          interface Quote { BigDecimal total(BigDecimal amount, String coupon); }
          static BigDecimal normalize(BigDecimal amount, String coupon) {
              if (amount == null || amount.signum() < 0)
                  throw new IllegalArgumentException("Invalid amount");
              BigDecimal rate = "SAVE10".equals(coupon) ? new BigDecimal("0.90") : BigDecimal.ONE;
              return amount.multiply(rate).setScale(2, RoundingMode.HALF_UP);
          }
          static class LocalQuote implements Quote {
              public BigDecimal total(BigDecimal a, String c) { return normalize(a, c); }
          }
          static class CachedRulesQuote implements Quote {
              public BigDecimal total(BigDecimal a, String c) { return normalize(a, c); }
          }
          static void contract(Quote quote) {
              BigDecimal input = new BigDecimal("0.05");
              BigDecimal first = quote.total(input, "SAVE10");
              if (!first.equals(new BigDecimal("0.05"))) throw new AssertionError("Rounding");
              if (!first.equals(quote.total(input, "SAVE10"))) throw new AssertionError("Side effect");
              if (!input.equals(new BigDecimal("0.05"))) throw new AssertionError("Input modified");
              if (!quote.total(BigDecimal.ZERO, "").equals(new BigDecimal("0.00")))
                  throw new AssertionError("Empty coupon");
              for (BigDecimal invalid : List.of(new BigDecimal("-1"))) {
                  try {
                      quote.total(invalid, null);
                      throw new AssertionError("Missing validation");
                  } catch (IllegalArgumentException expected) {}
              }
              try {
                  quote.total(null, "SAVE10");
                  throw new AssertionError("Missing null validation");
              } catch (IllegalArgumentException expected) {}
          }
          public static void main(String[] args) {
              contract(new LocalQuote());
              contract(new CachedRulesQuote());
          }
      }
      ~~~

      Kỳ vọng: mỗi implementation phải qua cùng test; thay một implementation mà làm tròn khác hoặc sinh side effect sẽ bị phát hiện.
