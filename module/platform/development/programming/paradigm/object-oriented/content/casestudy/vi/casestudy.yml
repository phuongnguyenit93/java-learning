    knowledge: Rich domain model, encapsulation, invariant và Tell Don't Ask.
    code: |-
      ### Case 3 — Đưa invariant về domain object

      **Sai:** field công khai cho phép mọi caller sửa số dư âm; static utility thực hiện withdraw nhưng không ngăn code khác bỏ qua utility. **Đúng:** giữ state private và chỉ thay đổi qua phương thức có guard.

      ~~~java
      public class Case3 {
          static final class BadAccount {
              public long balance = 100;
          }
          static final class Account {
              private long balance;
              Account(long opening) {
                  if (opening < 0) throw new IllegalArgumentException("opening");
                  balance = opening;
              }
              long balance() { return balance; }
              void withdraw(long amount) {
                  if (amount <= 0 || amount > balance)
                      throw new IllegalArgumentException("amount");
                  balance -= amount;
              }
              void deposit(long amount) {
                  if (amount <= 0) throw new IllegalArgumentException("amount");
                  balance = Math.addExact(balance, amount);
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          static void rejects(Runnable action) {
              try {
                  action.run();
              } catch (IllegalArgumentException expected) { return; }
              throw new AssertionError("should reject");
          }
          public static void main(String[] args) {
              BadAccount broken = new BadAccount();
              broken.balance = -50; // Caller bỏ qua mọi utility method.
              check(broken.balance < 0);

              Account safe = new Account(100);
              rejects(() -> safe.withdraw(150));
              check(safe.balance() == 100); // Lỗi không làm đổi state.
              safe.withdraw(60);
              check(safe.balance() == 40);
              safe.deposit(10);
              check(safe.balance() == 50);
              rejects(() -> new Account(-1));
              System.out.println("PASS: invariant số dư không âm");
          }
      }
      ~~~

      **Bằng chứng:** test cố ý làm hỏng `BadAccount`, còn `Account` từ chối cả khởi tạo và rút vượt số dư. Chạy `javac Case3.java`, `java Case3`. Ví dụ giả định single-thread; nếu cùng account được cập nhật đồng thời cần transaction/lock thích hợp và kiểm thử race. Hàm tiện ích thuần không có state vẫn có thể là static.
  - situation: Hai nhóm cùng dùng một class Customer cho bán hàng và chăm sóc khách hàng nhưng cần thay đổi các thuộc tính
      theo hai quy trình khác nhau.
    readmeRelated:
      anchorList:
      - class-design-001
      - modeling-001
      - solid-002
      - design-pitfalls-001
      - refactoring-003
    resolve: Tách vai trò Customer theo bounded context hoặc model/DTO riêng; chỉ chia sẻ định danh và dữ liệu đã có hợp đồng
      rõ.
    knowledge: Bounded contexts, SRP theo actor và tránh shared model coupling.
    code: |-
      ### Case 4 — Phân tách Customer theo ngữ cảnh của hai nhóm

      **Tình huống:** cả bán hàng và chăm sóc khách hàng sửa cùng một class `Customer`; yêu cầu thêm priority hỗ trợ dễ làm bẩn policy bán hàng. Giữ identity tham chiếu chung nhưng hai model sở hữu trách nhiệm riêng.

      ~~~java
      public class Case4 {
          record CustomerId(String value) {
              CustomerId {
                  if (value == null || value.isBlank())
                      throw new IllegalArgumentException("customerId");
              }
          }
          static final class SalesCustomer {
              private final CustomerId id;
              private int loyaltyPoints;
              SalesCustomer(CustomerId id) { this.id = id; }
              void earnPoints(int points) {
                  if (points <= 0) throw new IllegalArgumentException("points");
                  loyaltyPoints += points;
              }
              int points() { return loyaltyPoints; }
              CustomerId id() { return id; }
          }
          static final class SupportCustomer {
              private final CustomerId id;
              private boolean priorityCase;
              SupportCustomer(CustomerId id) { this.id = id; }
              void markPriority() { priorityCase = true; }
              boolean isPriority() { return priorityCase; }
              CustomerId id() { return id; }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              CustomerId id = new CustomerId("C-1");
              SalesCustomer sales = new SalesCustomer(id);
              SupportCustomer support = new SupportCustomer(id);
              sales.earnPoints(25);
              support.markPriority();
              check(sales.id().equals(support.id()));
              check(sales.points() == 25);
              check(support.isPriority());
              System.out.println("PASS: cùng identity, hai trách nhiệm độc lập");
          }
      }
      ~~~

      **Kiểm chứng:** chạy `Case4.java`; hai model không có tham chiếu lẫn nhau và không yêu cầu class chung chứa `priorityCase` hoặc `loyaltyPoints`. Kiểm tra thêm ở dự án thật bằng rule kiểm tra dependency/module: thay đổi support không được buộc biên dịch lại domain sales nếu không đổi ID contract. Đồng bộ giữa bounded contexts phải có giao thức rõ ràng, ví dụ event hoặc API versioned; đoạn code không chứng minh sự nhất quán phân tán.
  - situation: Một class thay đổi thường xuyên vì vừa định dạng báo cáo, vừa gọi database, vừa gửi email, làm mọi lần phát
      hành có phạm vi ảnh hưởng rộng.
    readmeRelated:
      anchorList:
      - class-design-001
      - class-design-002
      - class-design-004
      - solid-002
      - design-pitfalls-001
      - refactoring-003
    resolve: Tách logic báo cáo, truy cập dữ liệu và email khỏi class nghiệp vụ; xác định boundary và kiểm thử các phần độc
      lập.
    knowledge: SRP, cohesion, separation of concerns và dependency direction.
    code: |-
      ### Case 5 — Chia báo cáo, repository và gửi mail

      **Sai về ranh giới:** một `ReportGodClass` chứa cả SQL, định dạng CSV và SMTP. **Đúng:** report renderer là hàm thuần, repository chỉ lấy dữ liệu, mail adapter là phụ thuộc được tiêm vào; use case điều phối và có thể kiểm tra từng chức năng độc lập.

      ~~~java
      import java.util.*;

      public class Case5 {
          record Sale(String id, long cents) {}
          interface SalesRepository { List<Sale> findAll(); }
          interface EmailGateway { void send(String content); }
          static final class ReportFormatter {
              String format(List<Sale> sales) {
                  StringBuilder out = new StringBuilder("id,cents\n");
                  for (Sale s : sales) out.append(s.id()).append(',')
                                          .append(s.cents()).append('\n');
                  return out.toString();
              }
          }
          static final class SendReport {
              private final SalesRepository repository;
              private final EmailGateway email;
              private final ReportFormatter formatter;
              SendReport(SalesRepository r, EmailGateway e, ReportFormatter f) {
                  repository = r; email = e; formatter = f;
              }
              void execute() { email.send(formatter.format(repository.findAll())); }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              List<String> mailbox = new ArrayList<>();
              SalesRepository fakeRepo = () -> List.of(new Sale("S1", 900));
              ReportFormatter formatter = new ReportFormatter();
              new SendReport(fakeRepo, mailbox::add, formatter).execute();
              check(mailbox.equals(List.of("id,cents\nS1,900\n")));

              EmailGateway failing = ignored -> {
                  throw new IllegalStateException("SMTP unavailable");
              };
              try {
                  new SendReport(fakeRepo, failing, formatter).execute();
                  throw new AssertionError("Expected transport failure");
              } catch (IllegalStateException expected) {
                  check("SMTP unavailable".equals(expected.getMessage()));
              }
              check("id,cents\nS1,900\n".equals(formatter.format(fakeRepo.findAll())));
              System.out.println("PASS: formatter không phụ thuộc mail");
          }
      }
      ~~~

      **Bằng chứng:** test bao phủ mail thành công, mail lỗi và tính độc lập của formatter. Chạy `Case5.java`. Với CSV production phải escape dữ liệu có dấu phẩy/quote; ví dụ chỉ dùng ID đơn giản. Tách trách nhiệm **không** tự cung cấp retry hoặc bảo đảm gửi một lần; luồng lỗi phải được use case quyết định.
  - situation: Mỗi lần thêm một phương thức vận chuyển, developer phải sửa nhiều đoạn if-else ở bảng giá, kiểm tra đơn và
      tạo nhãn giao hàng.
