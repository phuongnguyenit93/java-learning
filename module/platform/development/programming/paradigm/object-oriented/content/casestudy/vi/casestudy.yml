    knowledge: Exception safety, AutoCloseable và resource ownership.
    code: |-
      ### Case 4 — Constructor mở socket rồi lỗi gây resource leak

      Dùng FakeSocket AutoCloseable làm tài nguyên có thể quan sát trạng thái đóng. Factory lỗi không close khi parse config thất bại. Factory đúng chuyển quyền sở hữu cho Client chỉ khi tạo thành công và close trên đường lỗi.

      ~~~java
      public class Case4 {
          static final class FakeSocket implements AutoCloseable {
              boolean closed;
              @Override public void close() { closed = true; }
          }
          static final class Client implements AutoCloseable {
              private final FakeSocket socket;
              Client(FakeSocket socket) { this.socket = socket; }
              @Override public void close() { socket.close(); }
          }
          static void parse(boolean valid) {
              if (!valid) throw new IllegalArgumentException("Bad config");
          }
          static Client broken(FakeSocket socket, boolean valid) {
              parse(valid); // Nếu lỗi: socket bị bỏ quên!
              return new Client(socket);
          }
          static Client safe(FakeSocket socket, boolean valid) {
              try {
                  parse(valid);
                  return new Client(socket); // Ownership chỉ chuyển khi thành công.
              } catch (RuntimeException ex) {
                  socket.close();
                  throw ex;
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          static void reject(Runnable r) {
              try { r.run(); } catch (IllegalArgumentException expected) { return; }
              throw new AssertionError("Expected bad config");
          }
          public static void main(String[] args) {
              FakeSocket leaked = new FakeSocket();
              reject(() -> broken(leaked, false));
              check(!leaked.closed); // Phản ví dụ: leak được mô phỏng.
              leaked.close(); // Dọn tài nguyên mô phỏng sau kiểm chứng.

              FakeSocket failed = new FakeSocket();
              reject(() -> safe(failed, false));
              check(failed.closed);
              FakeSocket success = new FakeSocket();
              try (Client client = safe(success, true)) {
                  check(!success.closed); // Client còn sở hữu socket.
              }
              check(success.closed); // Đóng khi hết vòng đời Client.
              System.out.println("PASS: failure and success both close owned resources");
          }
      }
      ~~~

      Chạy javac Case4.java rồi java Case4. Đây là giả lập tài nguyên, không mở socket mạng thật; với Socket production cần xử lý cả checked IOException và lỗi close, nên ưu tiên try-with-resources khi lifecycle cho phép.
  - situation: Một static initializer đọc biến môi trường không tồn tại làm toàn bộ class thất bại khi lần đầu được tải trong
      môi trường production.
    readmeRelated:
      anchorList:
      - class-003
      - lifecycle-004
    resolve: Đưa kiểm tra cấu hình vào bước bootstrap có thông báo lỗi rõ thay vì static initializer khó kiểm soát; xử lý
      thiếu config sớm.
    knowledge: Class initialization, fail-fast configuration và exception handling.
    code: |-
      ### Case 5 — Static initializer hỏng khi thiếu cấu hình

      Static initializer thất bại lần đầu có thể gây ExceptionInInitializerError và làm class không còn dễ dùng. Thay bằng bước bootstrap load config tường minh, trả lỗi có ngữ cảnh trước khi khởi tạo service.

      ~~~java
      import java.util.Map;

      public class Case5 {
          static final class UnsafeConfig {
              static final String URL;
              static {
                  String value = System.getProperty("demo.case5.url");
                  if (value == null || value.isBlank())
                      throw new IllegalStateException("missing URL");
                  URL = value;
              }
              static String url() { return URL; }
          }
          record AppConfig(String url) {
              AppConfig {
                  if (url == null || url.isBlank())
                      throw new IllegalArgumentException("app.url missing");
              }
              static AppConfig load(Map<String,String> environment) {
                  return new AppConfig(environment.get("APP_URL"));
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              System.clearProperty("demo.case5.url");
              try {
                  UnsafeConfig.url();
                  throw new AssertionError("static initializer unexpectedly succeeded");
              } catch (ExceptionInInitializerError expected) {
                  check(expected.getCause() instanceof IllegalStateException);
              }
              try {
                  AppConfig.load(Map.of());
                  throw new AssertionError("missing config accepted");
              } catch (IllegalArgumentException expected) {
                  check(expected.getMessage().contains("app.url"));
              }
              AppConfig ok = AppConfig.load(Map.of("APP_URL", "https://example.test"));
              check(ok.url().equals("https://example.test"));
              System.out.println("PASS: explicit bootstrap validation");
          }
      }
      ~~~

      Chạy javac Case5.java rồi java Case5. URL ví dụ không được gửi request. Test chủ động xóa một system property **trong JVM demo**, không đụng biến môi trường của máy; sản phẩm thật nên quản lý secret qua nguồn cấu hình an toàn và kiểm soát startup failure.
  - situation: Một object được đưa vào cache trước khi hoàn tất khởi tạo nên request khác quan sát thấy các field có giá trị
      mặc định.
    readmeRelated:
      anchorList:
      - class-007
      - object-007
      - lifecycle-009
      - encapsulation-002
      - testing-002
    resolve: Chỉ đưa object vào cache sau khi validate và khởi tạo hoàn chỉnh; dùng factory và cơ chế công bố an toàn giữa
      thread.
    knowledge: Safe publication, object invariant và concurrent visibility.
    code: |-
      ### Case 6 — Không đưa object vào cache trước khi hoàn thiện

      Phản ví dụ chia làm hai bước: insert object với endpoint null, sau đó mới gán endpoint; người đọc giữa hai bước thấy state dở dang. Bản đúng tạo immutable Config đã validate rồi mới publish vào ConcurrentHashMap.

      ~~~java
      import java.util.concurrent.ConcurrentHashMap;

      public class Case6 {
          static final class BrokenConfig {
              String endpoint; // Mutable và có thể null.
          }
          record Config(String endpoint) {
              Config {
                  if (endpoint == null || endpoint.isBlank())
                      throw new IllegalArgumentException("endpoint");
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              ConcurrentHashMap<String,BrokenConfig> broken = new ConcurrentHashMap<>();
              BrokenConfig incomplete = new BrokenConfig();
              broken.put("api", incomplete);
              check(broken.get("api").endpoint == null); // Đọc giữa hai bước.
              incomplete.endpoint = "https://service.test";

              ConcurrentHashMap<String,Config> safe = new ConcurrentHashMap<>();
              Config ready = new Config("https://service.test");
              safe.put("api", ready); // Publish sau constructor thành công.
              check(safe.get("api").endpoint().equals("https://service.test"));
              try {
                  new Config("");
                  throw new AssertionError("invalid config accepted");
              } catch (IllegalArgumentException expected) { }
              check(safe.size() == 1);
              System.out.println("PASS: cache contains only validated immutable values");
          }
      }
      ~~~

      Chạy javac Case6.java rồi java Case6. Phản ví dụ là thứ tự xen kẽ được sắp đặt, không khẳng định đã tạo race trong thread thật; ConcurrentHashMap cung cấp publication có đồng bộ khi put/get, nhưng **không** sửa việc publish trước khi hoàn thiện. Với hệ thống thật thêm concurrent tests và kiểm tra các field nested mutable.
  - situation: Hai constructor overload cùng nhận nhiều tham số nullable khiến lời gọi với null chọn sai chữ ký hoặc không
      biên dịch do mơ hồ.
    readmeRelated:
      anchorList:
      - class-005
      - lifecycle-003
      - polymorphism-005
      - language-mechanics-004
    resolve: Loại overload mơ hồ với null bằng tên factory rõ ràng hoặc type-specific value objects; tránh các chữ ký dễ gây
      nhập nhằng.
    knowledge: Overload resolution, null ambiguity và type-safe API design.
    code: |-
      ### Case 7 — Constructor overload và null mơ hồ

      Ví dụ chữ ký Legacy(String,String) và Legacy(String,Integer): lời gọi không cast với null là không rõ chọn constructor nào. Giữ câu gây lỗi ở dạng comment để chương trình vẫn biên dịch; bản đúng dùng named factories cho hai ý nghĩa khác nhau.

      ~~~java
      public class Case7 {
          static final class Legacy {
              final String mode;
              Legacy(String id, String label) { mode = "label"; }
              Legacy(String id, Integer rank) { mode = "rank"; }
          }
          record Customer(String id, String label, Integer rank) {}
          static final class Customers {
              static Customer withLabel(String id, String label) {
                  return new Customer(id, label, null);
              }
              static Customer withRank(String id, Integer rank) {
                  return new Customer(id, null, rank);
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              // new Legacy("C-1", null); // Compile error: ambiguous constructors.
              Legacy label = new Legacy("C-1", (String)null);
              Legacy rank = new Legacy("C-1", (Integer)null);
              check(label.mode.equals("label") && rank.mode.equals("rank"));
              Customer a = Customers.withLabel("C-1", null);
              Customer b = Customers.withRank("C-1", null);
              check(a.rank() == null && b.label() == null);
              System.out.println("PASS: named factories remove constructor ambiguity");
          }
      }
      ~~~

      Chạy javac Case7.java rồi java Case7. Đây là chứng minh luật compile-time qua chữ ký/comment và kết quả của hai lời gọi có cast. Để kiểm chứng compiler báo lỗi thực, bỏ comment ở dòng new Legacy và biên dịch lại; kỳ vọng lỗi ambiguous reference. Factories đặt tên rõ chưa thay thế validation null nếu nghiệp vụ yêu cầu không-null.
  - situation: Builder cho phép tạo yêu cầu chuyển khoản thiếu tài khoản đích và chỉ phát hiện lỗi sau khi gọi hệ thống ngân
      hàng.
    readmeRelated:
      anchorList:
      - lifecycle-002
      - lifecycle-005
      - encapsulation-002
      - encapsulation-005
      - design-patterns-003
      - testing-002
    resolve: Cho Builder từ chối thiếu destination/amount khi build, tạo object bất biến hợp lệ; kiểm tra cả trường hợp không
      đủ dữ liệu.
    knowledge: Builder validation, required fields và constructor invariant.
    code: |-
      ### Case 8 — Builder không được tạo TransferRequest thiếu trường

      Builder cũ trả request thiếu destination hoặc amount. Bản đúng validate đầy đủ trước build; record đầu ra cũng kiểm tra invariant để chặn tạo trực tiếp không hợp lệ.

      ~~~java
      public class Case8 {
          record BadRequest(String destination, long amount) {}
          record TransferRequest(String destination, long amount) {
              TransferRequest {
                  if (destination == null || destination.isBlank() || amount <= 0)
                      throw new IllegalArgumentException("Invalid transfer");
              }
          }
          static final class Builder {
              private String destination;
              private long amount;
              Builder destination(String value) { destination = value; return this; }
              Builder amount(long value) { amount = value; return this; }
              TransferRequest build() {
                  if (destination == null || destination.isBlank() || amount <= 0)
                      throw new IllegalStateException("Missing transfer fields");
                  return new TransferRequest(destination, amount);
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          static void reject(Runnable r) {
              try { r.run(); } catch (IllegalStateException expected) { return; }
              throw new AssertionError("Expected builder failure");
          }
          public static void main(String[] args) {
              BadRequest bad = new BadRequest(null, 0);
              check(bad.destination() == null && bad.amount() == 0);
              reject(() -> new Builder().amount(100).build());
              reject(() -> new Builder().destination("ACC-1").build());
              TransferRequest ok = new Builder().destination("ACC-1")
                          .amount(100).build();
              check(ok.destination().equals("ACC-1") && ok.amount() == 100);
              try {
                  new TransferRequest(null, -1);
                  throw new AssertionError("Invalid direct construction succeeded");
              } catch (IllegalArgumentException expected) { }
              System.out.println("PASS: missing data rejected before external call");
          }
      }
      ~~~

      Chạy javac Case8.java rồi java Case8. Đây chỉ kiểm tra tính hợp lệ dữ liệu, không gửi lệnh chuyển tiền. Khi tích hợp ngân hàng cần thêm idempotency key, currency, xác thực quyền và xử lý thất bại từ gateway.
  - situation: Một static factory trả object dùng chung có trạng thái mutable khiến hai người dùng vô tình ảnh hưởng lẫn nhau.
    readmeRelated:
      anchorList:
      - class-003
      - object-003
      - object-005
      - object-007
      - lifecycle-005
      - design-pitfalls-008
    resolve: Trả object immutable hoặc instance tách biệt theo owner; nếu chia sẻ cần đồng bộ trạng thái và hợp đồng lifetime
      rõ.
    knowledge: Aliasing, shared mutable state, scope và thread safety.
    code: |-
      ### Case 9 — Static factory dùng chung object mutable giữa người dùng

      Factory cũ trả shared mutable settings; thay đổi của user B làm dữ liệu quan sát bởi user A thay đổi. Đúng hơn là trả immutable snapshot riêng, hoặc quản lý scope và đồng bộ rõ khi thực sự phải chia sẻ.

      ~~~java
      public class Case9 {
          static final class MutableSettings {
              String theme = "light";
          }
          static final class BadFactory {
              private static final MutableSettings SINGLETON = new MutableSettings();
              static MutableSettings settings() { return SINGLETON; }
          }
          record Settings(String theme) {
              Settings {
                  if (theme == null || theme.isBlank())
                      throw new IllegalArgumentException("theme");
              }
          }
          static final class GoodFactory {
              static Settings forUser(String requestedTheme) {
                  return new Settings(requestedTheme);
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              MutableSettings userA = BadFactory.settings();
              MutableSettings userB = BadFactory.settings();
              userA.theme = "dark";
              userB.theme = "orange";
              check(userA == userB && userA.theme.equals("orange")); // Leak.

              Settings a = GoodFactory.forUser("dark");
              Settings b = GoodFactory.forUser("orange");
              check(a.theme().equals("dark"));
              check(b.theme().equals("orange"));
              check(a != b);
              System.out.println("PASS: immutable per-user settings independent");
          }
      }
      ~~~

      Chạy javac Case9.java rồi java Case9. Bài thử mô phỏng hai user tuần tự, không đưa ra kết luận về race; riêng điều kiện leak đã đủ chứng minh thiết kế shared state không có scope. Production cần gắn settings với principal đã xác thực, không dùng global currentUser.
  - situation: Một đối tượng có field final tham chiếu tới danh sách sản phẩm nhưng caller vẫn thay đổi các phần tử bên trong
      sau khi object đã được tạo.
    readmeRelated:
      anchorList:
      - class-006
      - object-005
      - object-006
      - encapsulation-007
      - testing-002
    resolve: Tạo defensive copies của cả list lẫn phần tử mutable; trả immutable snapshot/DTO thay vì để caller giữ alias.
    knowledge: Shallow vs deep immutability, final reference và defensive copying.
    code: |-
      ### Case 10 — final List không tạo bất biến sâu

      final chỉ giữ tham chiếu không bị gán lại. Ngay cả List.copyOf cũng không clone phần tử mutable. Snapshot an toàn chuyển từng Product mutable thành ProductView có các field bất biến.

      ~~~java
      import java.util.*;

      public class Case10 {
          static final class Product {
              final String sku;
              long price;
              Product(String sku, long price) { this.sku = sku; this.price = price; }
          }
          static final class BadCatalog {
              final List<Product> products;
              BadCatalog(List<Product> src) { products = List.copyOf(src); }
          }
          record ProductView(String sku, long price) {}
          static final class Catalog {
              private final List<ProductView> products;
              Catalog(List<Product> src) {
                  List<ProductView> copied = new ArrayList<>();
                  for (Product p : src) copied.add(new ProductView(p.sku, p.price));
                  products = List.copyOf(copied);
              }
              List<ProductView> products() { return products; }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              Product item = new Product("SKU-1", 100);
              List<Product> source = new ArrayList<>(List.of(item));
              BadCatalog bad = new BadCatalog(source);
              Catalog safe = new Catalog(source);
              item.price = 999;
              source.clear();
              check(bad.products.get(0).price == 999); // Alias bị lộ.
              check(safe.products().get(0).price() == 100);
              check(safe.products().size() == 1);
              try {
                  safe.products().clear();
                  throw new AssertionError("mutable snapshot");
              } catch (UnsupportedOperationException expected) { }
              System.out.println("PASS: copied list and immutable elements");
          }
      }
      ~~~

      Chạy javac Case10.java rồi java Case10. Chỉ với ProductView chứa String và long, bản copy mới độc lập; nếu phần tử chứa mutable child, phải copy sâu tương ứng. List.copyOf chỉ bảo vệ cấu trúc list.
  - situation: Vòng đời của một session object kéo dài qua nhiều request khiến quyền truy cập cũ vẫn tồn tại sau khi người
      dùng đăng xuất.
    readmeRelated:
      anchorList:
      - lifecycle-006
      - design-pitfalls-008
    resolve: Gắn session với lifecycle và thời hạn phù hợp; vô hiệu hóa khi logout, tránh cache/tái sử dụng principal có quyền
      đã hết hạn.
    knowledge: Object scope, session lifecycle, invalidation và access control.
    code: |-
      ### Case 11 — Session hết hiệu lực sau logout

      Lỗi là client giữ Principal cũ và tiếp tục tin nó hợp lệ sau logout. Dịch vụ đúng xác minh token qua SessionStore ở **mỗi thao tác bảo vệ**, kiểm tra revoked và expiration thay vì tin object session đã được cache.

      ~~~java
      import java.time.*;
      import java.util.*;

      public class Case11 {
          record CachedPrincipal(String userId) {}
          static final class Sessions {
              static final class State {
                  final String userId;
                  final Instant expiresAt;
                  boolean revoked;
                  State(String userId, Instant expiresAt) {
                      this.userId = userId; this.expiresAt = expiresAt;
                  }
              }
              private final Map<String,State> sessions = new HashMap<>();
              void create(String token, String user, Instant expiry) {
                  sessions.put(token, new State(user, expiry));
              }
              String authorize(String token, Instant now) {
                  State s = sessions.get(token);
                  if (s == null || s.revoked || !now.isBefore(s.expiresAt))
                      throw new SecurityException("Session expired or revoked");
                  return s.userId;
              }
              void logout(String token) {
                  State s = sessions.get(token);
                  if (s != null) s.revoked = true;
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          static void deny(Runnable action) {
              try { action.run(); } catch (SecurityException expected) { return; }
              throw new AssertionError("Expected access denied");
          }
          public static void main(String[] args) {
              Instant now = Instant.parse("2026-10-28T00:00:00Z");
              CachedPrincipal cached = new CachedPrincipal("alice");
              Sessions service = new Sessions();
              service.create("demo-token", "alice", now.plusSeconds(60));
              check(service.authorize("demo-token", now).equals("alice"));
              service.logout("demo-token");
              check(cached.userId().equals("alice")); // Stale principal còn tồn tại.
              deny(() -> service.authorize("demo-token", now));
              service.create("token-2", "alice", now.plusSeconds(60));
              deny(() -> service.authorize("token-2", now.plusSeconds(61)));
              System.out.println("PASS: revoked and expired sessions rejected");
          }
      }
      ~~~

      Chạy javac Case11.java rồi java Case11. Dùng token giả/Instant cố định; ví dụ single-thread không đại diện kho session phân tán. Production cần token ngẫu nhiên an toàn, session store nhất quán/thu hồi trên các node, đồng bộ và bảo vệ tránh replay. Không coi principal đã cache là chứng cứ được phép truy cập.
  - situation: Đối tượng dùng làm key trong cache có hashCode dựa trên field thay đổi theo thời gian, khiến cùng đối tượng
      không thể truy xuất lại.
    readmeRelated:
      anchorList:
      - object-004
      - object-005
      - language-mechanics-006
      - design-pitfalls-009
      - testing-001
    resolve: Không dùng field mutable tham gia hash của cache key; chọn immutable ID/value key, hoặc loại key cũ rồi thêm
      key mới có kiểm soát.
    knowledge: equals/hashCode, hashed collections và mutable key hazards.
    code: |-
      ### Case 12 — HashMap key đổi field tham gia hashCode

      Key mutable đổi id sau put sẽ thay hash, khiến lookup bằng chính object đó không tìm đúng bucket. Dùng immutable CacheKey; nếu business key đổi, remove khóa cũ rồi insert khóa mới có kiểm soát.

      ~~~java
      import java.util.*;

      public class Case12 {
          static final class MutableKey {
              String id;
              MutableKey(String id) { this.id = id; }
              @Override public int hashCode() { return id.hashCode(); }
              @Override public boolean equals(Object x) {
                  return x instanceof MutableKey k && id.equals(k.id);
              }
          }
          record CacheKey(String id) {
              CacheKey {
                  if (id == null || id.isBlank())
                      throw new IllegalArgumentException("id");
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              Map<MutableKey,String> broken = new HashMap<>();
              MutableKey key = new MutableKey("A");
              broken.put(key, "entry");
              key.id = "B";
              check(broken.get(key) == null); // Hash bucket khác.
              check(broken.size() == 1); // Entry không tự biến mất.

              Map<CacheKey,String> safe = new HashMap<>();
              CacheKey oldKey = new CacheKey("A");
              safe.put(oldKey, "entry");
              check("entry".equals(safe.get(new CacheKey("A"))));
              String value = safe.remove(oldKey);
              safe.put(new CacheKey("B"), value);
              check(!safe.containsKey(oldKey));
              check("entry".equals(safe.get(new CacheKey("B"))));
              System.out.println("PASS: immutable hash key and deliberate remap");
          }
      }
      ~~~

      Chạy javac Case12.java rồi java Case12. "A" và "B" cố ý khác hash bucket trong bảng nhỏ mặc định; lỗi phát sinh vì vi phạm yêu cầu hash key ổn định khi lưu trong hashed collection. Trong cache dùng đồng thời, cặp remove/put cần thao tác nhất quán/atomic phù hợp.
  - situation: Khi clone đơn hàng mẫu, danh sách item vẫn tham chiếu tới các object con của đơn gốc nên sửa đơn mới làm thay
      đổi đơn cũ.
    readmeRelated:
      anchorList:
      - object-003
      - object-006
      - encapsulation-007
      - composition-007
      - practice-005
    resolve: Copy sâu các line item cần sở hữu riêng hoặc dùng immutable item; ghi rõ contract copy và thử sửa bản sao mà
      không ảnh hưởng gốc.
    knowledge: Copy constructors, clone semantics và graph aliasing.
    code: |-
      ### Case 13 — Clone sao chép List nhưng không sao chép item

      Khi clone chỉ dùng new ArrayList<>(items), hai order có list riêng nhưng cùng reference item. Copy constructor đúng tạo Item mới cho từng item mutable, giữ bản sao độc lập.

      ~~~java
      import java.util.*;

      public class Case13 {
          static final class Item {
              final String sku;
              int quantity;
              Item(String sku, int quantity) {
                  this.sku = sku; this.quantity = quantity;
              }
              Item copy() { return new Item(sku, quantity); }
          }
          static final class Order {
              final List<Item> items;
              Order(List<Item> items) { this.items = items; }
              Order shallowCopy() { return new Order(new ArrayList<>(items)); }
              Order deepCopy() {
                  List<Item> copied = new ArrayList<>();
                  for (Item i : items) copied.add(i.copy());
                  return new Order(copied);
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              Order original = new Order(new ArrayList<>(List.of(new Item("A", 1))));
              Order shallow = original.shallowCopy();
              Order deep = original.deepCopy();
              check(original.items != shallow.items); // List khác.
              check(original.items.get(0) == shallow.items.get(0)); // Item chung.
              shallow.items.get(0).quantity = 5;
              check(original.items.get(0).quantity == 5); // Bị ảnh hưởng.
              check(deep.items.get(0).quantity == 1); // Bản copy sâu giữ nguyên.
              deep.items.get(0).quantity = 9;
              check(original.items.get(0).quantity == 5);
              System.out.println("PASS: graph-owned items independently copied");
          }
      }
      ~~~

      Chạy javac Case13.java rồi java Case13. Ví dụ dùng phương thức copy rõ nghĩa thay cho Object.clone để minh bạch độ sâu; với object graph có cycle, identity sharing hoặc resource handle cần chính sách copy riêng, không mặc định clone toàn bộ.
