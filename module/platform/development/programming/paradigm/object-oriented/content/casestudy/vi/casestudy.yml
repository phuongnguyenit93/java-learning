    knowledge: Entity reference, historical snapshot và aggregate ownership.
    code: |-
      ### Case 1 — Địa chỉ Customer hiện tại khác địa chỉ Order đã chốt

      Order giữ ID của khách hàng để tra cứu thông tin hiện hành, nhưng địa chỉ giao hàng phải là snapshot tại thời điểm tạo đơn. Trộn hai vai trò này làm sửa hồ sơ khách hàng thay đổi lịch sử giao hàng.

      ~~~java
      public class Case1 {
          record Address(String street) {}
          static final class Customer {
              final String id;
              private Address current;
              Customer(String id, Address address) { this.id=id; current=address; }
              Address currentAddress() { return current; }
              void changeAddress(Address next) { current=next; }
          }
          record Order(String id, String customerId, Address shippingAtPurchase) {}
          static void check(boolean ok) { if(!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              Customer customer = new Customer("C1", new Address("Số 10"));
              Order order = new Order("O1", customer.id, customer.currentAddress());
              customer.changeAddress(new Address("Số 20"));
              check(customer.currentAddress().street().equals("Số 20"));
              check(order.shippingAtPurchase().street().equals("Số 10"));
              check(order.customerId().equals("C1"));
              System.out.println("PASS: historical shipping snapshot");
          }
      }
      ~~~

      Kiểm chứng: biên dịch và chạy Case1.java (JDK 17+). Hai assertion chứng minh current address đổi còn snapshot của đơn vẫn cố định. Address là record chỉ chứa String bất biến; nếu Address chứa List/Date mutable phải chụp sâu. Trong ứng dụng thực, thời điểm chốt snapshot và chính sách sửa địa chỉ trước giao hàng cần được xác định rõ.
  - situation: Danh sách children của một TreeNode đổi parent nhưng reference parent cũ vẫn chứa node, gây kết quả duyệt cây
      không nhất quán.
    readmeRelated:
      anchorList:
      - relationships-004
      - relationships-005
      - relationships-006
      - modeling-005
      - testing-003
      - testing-010
    resolve: Cập nhật parent/children qua reparent operation duy nhất, xóa khỏi parent cũ và thêm parent mới, cấm cycle và
      kiểm thử đồ thị.
    knowledge: Bidirectional association, graph invariants và consistency.
    code: |-
      ### Case 2 — Reparent TreeNode phải cập nhật cả hai phía và chặn cycle

      Việc gán child.parent trực tiếp mà không xóa khỏi parent.children cũ khiến quan hệ hai chiều bất nhất. Tạo một hành vi reparent tập trung; kiểm cycle trước khi đụng vào graph.

      ~~~java
      import java.util.*;
      public class Case2 {
          static final class Node {
              final String id;
              Node parent;
              final List<Node> children = new ArrayList<>();
              Node(String id) { this.id=id; }
              void moveTo(Node newParent) {
                  if (newParent == this) throw new IllegalArgumentException("self");
                  for (Node x=newParent; x!=null; x=x.parent)
                      if (x==this) throw new IllegalArgumentException("cycle");
                  if (parent!=null) parent.children.remove(this);
                  parent=newParent;
                  if (newParent!=null) newParent.children.add(this);
              }
          }
          static void check(boolean ok) { if(!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              Node a=new Node("A"), b=new Node("B"), child=new Node("C");
              child.moveTo(a);
              check(a.children.contains(child) && child.parent==a);
              child.moveTo(b);
              check(!a.children.contains(child));
              check(b.children.contains(child) && child.parent==b);
              try { b.moveTo(child); throw new AssertionError("cycle accepted"); }
              catch (IllegalArgumentException expected) {}
              check(b.parent==null && child.parent==b);
              child.moveTo(null);
              check(child.parent==null && b.children.isEmpty());
              System.out.println("PASS: reparent consistent");
          }
      }
      ~~~

      Kiểm chứng: chạy Case2.java; kiểm thêm hai chiều sau mỗi lần move và xác nhận việc thử tạo cycle không làm thay đổi graph. Mã minh họa single-thread; nếu graph được sửa đồng thời cần khóa chung hoặc transaction bảo vệ thao tác tổng hợp.
  - situation: Một thao tác xóa phòng ban khỏi hệ thống vô tình xóa thông tin nhân viên do mô hình ownership giữa hai loại
      object bị hiểu sai.
    readmeRelated:
      anchorList:
      - composition-002
      - composition-007
      - relationships-003
      - modeling-005
    resolve: Xác định nhân viên có lifecycle độc lập phòng ban; ngăn cascade delete không phù hợp, chuyển quan hệ trước khi
      xóa.
    knowledge: Association vs composition, ownership và cascade semantics.
    code: |-
      ### Case 3 — Department và Employee không phải vòng đời sở hữu tuyệt đối

      Employee có danh tính riêng và tiếp tục tồn tại khi phòng ban bị giải thể. Cấm xóa phòng ban đang chứa nhân viên, cho phép chuyển họ sang phòng khác trước khi xóa; không cascade xóa Employee.

      ~~~java
      import java.util.*;
      public class Case3 {
          record Employee(String id, String name) {}
          static final class Directory {
              final Map<String,Employee> employees = new HashMap<>();
              final Map<String,Set<String>> departments = new HashMap<>();
              void addDepartment(String id) { departments.put(id,new HashSet<>()); }
              void hire(Employee e,String dept) {
                  if(!departments.containsKey(dept))throw new IllegalArgumentException();
                  employees.put(e.id(),e);
                  departments.get(dept).add(e.id());
              }
              void transfer(String employeeId,String from,String to) {
                  if(!employees.containsKey(employeeId)||!departments.containsKey(to)
                      ||!departments.get(from).contains(employeeId))
                      throw new IllegalArgumentException();
                  departments.get(from).remove(employeeId);
                  departments.get(to).add(employeeId);
              }
              void deleteDepartment(String id) {
                  Set<String> members=departments.get(id);
                  if(members==null)throw new IllegalArgumentException();
                  if(!members.isEmpty())throw new IllegalStateException("reassign first");
                  departments.remove(id);
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Directory d=new Directory();
              d.addDepartment("OLD");d.addDepartment("NEW");
              d.hire(new Employee("E1","Lan"),"OLD");
              try {d.deleteDepartment("OLD");throw new AssertionError();}
              catch(IllegalStateException expected){}
              d.transfer("E1","OLD","NEW");
              d.deleteDepartment("OLD");
              check(d.employees.containsKey("E1"));
              check(d.departments.get("NEW").contains("E1"));
              check(!d.departments.containsKey("OLD"));
              System.out.println("PASS: employee lifecycle independent");
          }
      }
      ~~~

      Kiểm chứng: xác nhận xóa khi còn nhân viên bị từ chối, còn xóa sau reassign chỉ bỏ department. Trong database cần kiểm soát FK, ON DELETE policy và transaction, không sao chép thao tác Map thành bảo đảm cascade của ORM.
  - situation: Một object giữ cả parent và child theo hai chiều nhưng quá trình serialize JSON đi vào vòng lặp vô hạn.
    readmeRelated:
      anchorList:
      - relationships-005
      - relationships-006
      - class-design-004
      - class-design-009
    resolve: Trả DTO hoặc cấu hình serialization một chiều/ID reference; không duyệt toàn bộ parent-child cycle khi xuất JSON.
    knowledge: Object graph cycles, serialization boundaries và DTO mapping.
    code: |-
      ### Case 4 — DTO một chiều tránh chu trình khi serialize object graph

      Nếu Parent giữ Children và Child lại giữ Parent, một serializer duyệt mọi getter có thể đi theo vòng vô hạn. Chuyển graph sang DTO chỉ chứa parentId và các childId, không đệ quy theo tham chiếu vòng.

      ~~~java
      import java.util.*;
      public class Case4 {
          static class Parent {
              final String id; final List<Child> children=new ArrayList<>();
              Parent(String id){this.id=id;}
          }
          static class Child {
              final String id; final Parent parent;
              Child(String id,Parent parent){this.id=id;this.parent=parent;}
          }
          record ParentDto(String id,List<String> childIds){}
          static ParentDto toDto(Parent parent){
              List<String> ids=new ArrayList<>();
              for(Child c:parent.children)ids.add(c.id);
              return new ParentDto(parent.id,List.copyOf(ids));
          }
          static String toJsonLike(ParentDto dto){
              return "{\"id\":\""+dto.id()+"\",\"childIds\":[\""
                  +String.join("\",\"",dto.childIds())+"\"]}";
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Parent p=new Parent("P");
              Child c=new Child("C",p);p.children.add(c);
              check(c.parent==p && p.children.contains(c)); // Cycle object graph.
              ParentDto dto=toDto(p);
              check(dto.childIds().equals(List.of("C")));
              check(toJsonLike(dto).equals("{\"id\":\"P\",\"childIds\":[\"C\"]}"));
              System.out.println("PASS: exported DTO is acyclic");
          }
      }
      ~~~

      Kiểm chứng: chạy Case4.java. Hàm toJsonLike chỉ dùng ID hằng minh họa, **không phải JSON serializer tổng quát** vì chưa escape mọi ký tự. Không chạy serializer đệ quy vô hạn; với Jackson hoặc framework thật cần test integration và cấu hình reference/ignore/DTO rõ ràng.
  - situation: Hai aggregate có reference vòng và constructor yêu cầu mỗi bên được tạo trước, khiến quá trình khởi tạo không
      thể hoàn tất.
    readmeRelated:
      anchorList:
      - relationships-007
      - modeling-005
    resolve: Phá constructor cycle bằng factory/orchestrator và ID/reference sau khi tạo entity hợp lệ; xem lại ranh giới
      aggregate.
    knowledge: Circular dependencies, aggregate boundaries và construction order.
    code: |-
      ### Case 5 — Phá vòng constructor dependency bằng ID reference và factory

      Aggregate A yêu cầu B đã được tạo, còn B yêu cầu A đã có; yêu cầu này không có thứ tự khởi tạo hợp lệ. Hai aggregate nên có identity và lifecycle độc lập; liên kết lưu bằng ID và được điều phối sau khi từng object hợp lệ.

      ~~~java
      public class Case5 {
          record CustomerId(String value) {
              CustomerId {
                  if(value==null||value.isBlank())throw new IllegalArgumentException();
              }
          }
          record OrderId(String value) {
              OrderId {
                  if(value==null||value.isBlank())throw new IllegalArgumentException();
              }
          }
          record Customer(CustomerId id){}
          record Order(OrderId id,CustomerId customerId){}
          static final class Factory {
              Order createOrder(OrderId oid,Customer customer){
                  if(customer==null)throw new IllegalArgumentException("customer");
                  return new Order(oid,customer.id()); // Không nhúng Customer vào Order.
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Customer customer=new Customer(new CustomerId("C1"));
              Order order=new Factory().createOrder(new OrderId("O1"),customer);
              check(order.customerId().equals(customer.id()));
              check(order.id().value().equals("O1"));
              try {
                  new Factory().createOrder(new OrderId("O2"),null);
                  throw new AssertionError("null customer accepted");
              } catch(IllegalArgumentException expected){}
              System.out.println("PASS: independent valid aggregates");
          }
      }
      ~~~

      Kiểm chứng: tạo Customer trước hoặc OrderId trước vẫn không đòi vòng constructor; mọi quan hệ domain qua CustomerId. Ví dụ chứng minh phá cycle ở mô hình, không chứng minh việc ghi hai database là atomic: cần transaction/saga theo boundary thực và xem lại việc Order có thực sự là aggregate độc lập.
  - situation: Nhiều đối tượng đọc trực tiếp dữ liệu sâu qua chuỗi getter khiến đổi cấu trúc nội bộ của Customer kéo theo
      sửa hàng loạt service.
    readmeRelated:
      anchorList:
      - encapsulation-004
      - encapsulation-008
      - class-design-009
      - design-pitfalls-007
      - refactoring-004
    resolve: Đưa thao tác vào method cấp object sở hữu thông tin hoặc facade theo nhu cầu; giảm chuỗi getter và sửa sâu từ
      ngoài.
    knowledge: Law of Demeter, Tell Don't Ask và encapsulation.
    code: |-
      ### Case 6 — Tell Don't Ask giảm chuỗi getter đi sâu

      Code ngoài Domain đọc customer.getWallet().getBalance() để tự quyết định mua hàng; thay đổi cấu trúc Wallet buộc sửa các caller. Đặt câu hỏi nghiệp vụ vào Customer, không lộ reference nội bộ.

      ~~~java
      public class Case6 {
          static final class Wallet {
              private final long cents;
              Wallet(long cents){this.cents=cents;}
              boolean canCover(long amount){return amount>=0 && cents>=amount;}
          }
          static final class Customer {
              private final Wallet wallet;
              Customer(Wallet wallet){this.wallet=wallet;}
              boolean canPurchase(long cents){return wallet.canCover(cents);}
          }
          static final class Checkout {
              String decision(Customer c,long cents){
                  return c.canPurchase(cents)?"APPROVED":"DECLINED";
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Customer c=new Customer(new Wallet(1_000));
              Checkout service=new Checkout();
              check(service.decision(c,800).equals("APPROVED"));
              check(service.decision(c,1_200).equals("DECLINED"));
              check(service.decision(c,-1).equals("DECLINED"));
              System.out.println("PASS: caller does not inspect Wallet internals");
          }
      }
      ~~~

      Kiểm chứng: Checkout chỉ gọi hành vi công khai; đổi biểu diễn Wallet từ cents sang Money sẽ không buộc sửa Checkout nếu contract Customer.canPurchase giữ nguyên. Đây là pre-check demo; hệ thống thanh toán thật phải trừ tiền atomically thay vì tin check-then-act đơn thuần.
  - situation: Một Cart public method trả live list nên bên khác thêm item mà không áp dụng giới hạn số lượng mặt hàng.
    readmeRelated:
      anchorList:
      - encapsulation-006
      - encapsulation-008
      - composition-007
      - class-design-007
      - testing-003
    resolve: Ẩn live list Cart, cho addItem kiểm giới hạn và trả immutable snapshot; mọi update phải đi qua aggregate root.
    knowledge: Aggregate boundary, representation exposure và invariant.
    code: |-
      ### Case 7 — Cart phải chặn add vượt giới hạn qua aggregate root

      Trả List live cho caller cho phép add trực tiếp mà không kiểm giới hạn số dòng; Cart phải giữ list private, chỉ cung cấp addItem có guard, trả immutable snapshot.

      ~~~java
      import java.util.*;
      public class Case7 {
          static class BadCart {
              final List<String> items=new ArrayList<>();
              List<String> items(){return items;}
          }
          static class Cart {
              private final int maxItems;
              private final List<String> items=new ArrayList<>();
              Cart(int maxItems){if(maxItems<1)throw new IllegalArgumentException();this.maxItems=maxItems;}
              void addItem(String sku){
                  if(sku==null||sku.isBlank()||items.size()>=maxItems)
                      throw new IllegalArgumentException("limit or sku");
                  items.add(sku);
              }
              List<String> snapshot(){return List.copyOf(items);}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BadCart bad=new BadCart();
              bad.items().addAll(List.of("A","B","C"));
              check(bad.items().size()==3); // Bỏ qua giới hạn.
              Cart cart=new Cart(2);
              cart.addItem("A");cart.addItem("B");
              try {cart.addItem("C");throw new AssertionError();}
              catch(IllegalArgumentException expected){}
              try {cart.snapshot().add("X");throw new AssertionError();}
              catch(UnsupportedOperationException expected){}
              check(cart.snapshot().equals(List.of("A","B")));
              System.out.println("PASS: capacity invariant enforced");
          }
      }
      ~~~

      Kiểm chứng: đường sai chấp nhận ba item; đường đúng từ chối item thứ ba và caller không sửa được snapshot. Ví dụ áp giới hạn số dòng, không phải số lượng mỗi SKU; nếu domain khác, định nghĩa riêng điều kiện và kiểm tra tồn kho một cách tin cậy ở backend.
  - situation: Một class đăng ký listener lên object sống lâu nhưng không hủy đăng ký, khiến object không còn dùng vẫn bị
      giữ trong bộ nhớ.
    readmeRelated:
      anchorList:
      - lifecycle-006
      - design-patterns-010
    resolve: Gắn unsubscribe/close với lifecycle listener hoặc dùng weak subscription khi phù hợp; kiểm thử object được giải
      phóng.
    knowledge: Observer lifecycle, memory retention và resource cleanup.
    code: |-
      ### Case 8 — Listener phải unsubscribe theo vòng đời owner

      Subscriber đăng ký vào bus sống lâu mà không hủy: bus vẫn giữ strong reference dù UI đã đóng. Subscription AutoCloseable quản lý việc hủy; chứng minh bằng số listener/callback, không bịa kết quả garbage collection.

      ~~~java
      import java.util.*;
      public class Case8 {
          interface Listener {void onEvent(String value);}
          static final class Bus {
              final List<Listener> listeners=new ArrayList<>();
              AutoCloseable subscribe(Listener listener){
                  listeners.add(listener);
                  return ()->listeners.remove(listener);
              }
              void publish(String value){
                  for(Listener l:List.copyOf(listeners))l.onEvent(value);
              }
              int listenerCount(){return listeners.size();}
          }
          static final class Tab implements AutoCloseable {
              final List<String> received=new ArrayList<>();
              private final AutoCloseable subscription;
              Tab(Bus bus){subscription=bus.subscribe(received::add);}
              @Override public void close() throws Exception {subscription.close();}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args) throws Exception {
              Bus bus=new Bus();
              Tab tab=new Tab(bus);
              bus.publish("first");
              check(tab.received.equals(List.of("first")));
              check(bus.listenerCount()==1);
              tab.close();
              bus.publish("second");
              check(bus.listenerCount()==0);
              check(tab.received.equals(List.of("first")));
              System.out.println("PASS: unsubscribe prevents retained subscription");
          }
      }
      ~~~

      Kiểm chứng: số listener giảm từ 1 xuống 0, callback không còn chạy sau close. Đây là bằng chứng đã xóa strong reference khỏi bus, **không chứng minh GC đã thu hồi object**; heap dump/weak reference có thể kiểm thêm trong bài kiểm thử chuyên biệt.
  - situation: Đội phát triển hiểu nhầm composition nghĩa là tự động quản lý vòng đời mọi dependency, dẫn đến đóng nhầm collaborator
      được chia sẻ.
    readmeRelated:
      anchorList:
      - lifecycle-008
      - composition-007
      - relationships-003
    resolve: Ghi rõ ai tạo/đóng dependency; không đóng shared collaborator khi một composite ngừng dùng, inject owner quản
      lý scope.
    knowledge: Composition ownership, lifecycle scopes và dependency management.
    code: |-
      ### Case 9 — Composition không đồng nghĩa với quyền close dependency chung

      Một Service giữ collaborator Logger dùng chung không có nghĩa Service sở hữu vòng đời Logger. Chỉ ResourceOwner được phép đóng; Service đóng chỉ vô hiệu hóa chính nó, không đóng shared collaborator.

      ~~~java
      public class Case9 {
          static final class SharedLogger implements AutoCloseable {
              private boolean closed;
              private int count;
              void log(String text){
                  if(closed)throw new IllegalStateException("closed");
                  count++;
              }
              int count(){return count;}
              boolean closed(){return closed;}
              @Override public void close(){closed=true;}
          }
          static final class Service implements AutoCloseable {
              private final SharedLogger logger; // Borrowed, not owned.
              private boolean closed;
              Service(SharedLogger logger){this.logger=logger;}
              void handle(){
                  if(closed)throw new IllegalStateException("service closed");
                  logger.log("handled");
              }
              @Override public void close(){closed=true;}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              SharedLogger logger=new SharedLogger();
              Service a=new Service(logger),b=new Service(logger);
              a.handle();a.close();
              check(!logger.closed());
              b.handle();check(logger.count()==2);
              b.close();logger.close();
              check(logger.closed());
              System.out.println("PASS: shared collaborator closed only by owner");
          }
      }
      ~~~

      Kiểm chứng: Service A close không làm Service B lỗi; owner chỉ close sau khi mọi consumer kết thúc. Hệ thống thật nên thể hiện ownership qua DI scope/lifecycle document và kiểm resource khi shutdown; shared collaborators có thể cần thread-safety riêng.
  - situation: Một module tự khởi tạo concrete repository trong constructor nên test unit phải kết nối database thật dù chỉ
      cần kiểm tra phép tính.
    readmeRelated:
      anchorList:
      - interface-009
      - composition-006
      - solid-006
      - solid-007
      - testing-007
    resolve: Inject Repository interface vào module; dùng fake/in-memory implementation trong unit tests và adapter cụ thể
      ở composition root.
    knowledge: Constructor injection, DIP và test isolation.
    code: |-
      ### Case 10 — Inject Repository để unit test phép tính không cần DB

      Module tự tạo JdbcRepository trong constructor làm một phép tính đơn giản bắt đầu bằng kết nối DB. Đưa dependency qua constructor theo interface; unit test dùng fake trả dữ liệu cố định và kiểm đường lỗi.

      ~~~java
      public class Case10 {
          interface PriceRepository {long priceFor(String sku);}
          static final class PricingService {
              private final PriceRepository prices;
              PricingService(PriceRepository prices){this.prices=prices;}
              long total(String sku,int count){
                  if(count<=0)throw new IllegalArgumentException("count");
                  long price=prices.priceFor(sku);
                  if(price<0)throw new IllegalStateException("negative price");
                  return Math.multiplyExact(price,count);
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              PriceRepository fake=sku->"A".equals(sku)?300:500;
              PricingService service=new PricingService(fake);
              check(service.total("A",2)==600);
              check(service.total("B",1)==500);
              try {service.total("A",0);throw new AssertionError();}
              catch(IllegalArgumentException expected){}
              PricingService invalid=new PricingService(sku->-1);
              try {invalid.total("A",1);throw new AssertionError();}
              catch(IllegalStateException expected){}
              System.out.println("PASS: pure unit test without a database");
          }
      }
      ~~~

      Kiểm chứng: dùng javac/java cho Case10.java, không cần DB, queue hay Spring context. Production có thể inject JdbcPriceRepository ở composition root; adapter đó cần integration test SQL riêng, unit test fake không tự chứng minh persistence hoạt động.
  - situation: Service nhận một đối tượng cấu hình mutable chia sẻ cho toàn ứng dụng và request A có thể thay đổi tham số
      xử lý của request B.
    readmeRelated:
      anchorList:
      - class-006
      - object-005
      - object-007
      - design-pitfalls-008
    resolve: Chuyển config chia sẻ thành immutable snapshot per-request hoặc theo scope; không cho request mutate singleton
      settings.
    knowledge: Immutable configuration, request scope và concurrent aliasing.
    code: |-
      ### Case 11 — Config dùng chung phải bất biến theo request

      Nếu mọi request giữ chung MutableConfig, một request có thể đổi timeout của request khác. Trả immutable snapshot (record) được tạo tại ranh giới request; tránh cho caller mutate singleton settings.

      ~~~java
      public class Case11 {
          static final class MutableConfig {int timeout=10;}
          record RequestConfig(int timeout){
              RequestConfig {
                  if(timeout<=0)throw new IllegalArgumentException("timeout");
              }
          }
          static final class Service {
              private final RequestConfig config;
              Service(RequestConfig config){this.config=config;}
              int timeout(){return config.timeout();}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              MutableConfig shared=new MutableConfig();
              MutableConfig requestA=shared,requestB=shared;
              requestB.timeout=99;
              check(requestA.timeout==99); // Lỗi alias.
              RequestConfig snapshotA=new RequestConfig(10);
              RequestConfig snapshotB=new RequestConfig(99);
              Service a=new Service(snapshotA),b=new Service(snapshotB);
              check(a.timeout()==10 && b.timeout()==99);
              try {new RequestConfig(-1);throw new AssertionError();}
              catch(IllegalArgumentException expected){}
              System.out.println("PASS: per-request immutable config");
          }
      }
      ~~~

      Kiểm chứng: test chứng minh shared mutable alias và hai snapshot độc lập. Nếu cấu hình phải cập nhật động, phát hành immutable version mới theo request thay vì sửa in-place. Đây là kiểm tra tuần tự, không tuyên bố đã stress test concurrent traffic.
  - situation: Một thay đổi thiết kế từ one-to-many sang many-to-many làm nhiều method giả định mỗi item chỉ thuộc một parent
      trả kết quả sai.
    readmeRelated:
      anchorList:
      - relationships-004
      - relationships-006
      - modeling-005
      - testing-010
    resolve: Mô hình quan hệ many-to-many bằng association entity/collection có identity rõ; sửa cardinality assumptions và
      kiểm thử add/remove hai chiều.
    knowledge: Multiplicity, association invariants và relation modeling.
    code: |-
      ### Case 12 — Many-to-many cần association riêng và hai chiều nhất quán

      Mô hình cũ Item chỉ có parentId sẽ sai khi một item thuộc nhiều nhóm. Dùng Membership với khóa kép groupId-itemId, cho add/remove idempotent và tra cứu cả hai chiều từ cùng nguồn chân lý.

      ~~~java
      import java.util.*;
      public class Case12 {
          record Membership(String groupId,String itemId){}
          static final class Memberships {
              private final Set<Membership> edges=new HashSet<>();
              void add(String group,String item){
                  if(group==null||group.isBlank()||item==null||item.isBlank())
                      throw new IllegalArgumentException("key");
                  edges.add(new Membership(group,item));
              }
              void remove(String group,String item){
                  edges.remove(new Membership(group,item));
              }
              Set<String> itemsOf(String group){
                  Set<String> r=new HashSet<>();
                  for(Membership m:edges)if(m.groupId().equals(group))r.add(m.itemId());
                  return Set.copyOf(r);
              }
              Set<String> groupsOf(String item){
                  Set<String> r=new HashSet<>();
                  for(Membership m:edges)if(m.itemId().equals(item))r.add(m.groupId());
                  return Set.copyOf(r);
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Memberships m=new Memberships();
              m.add("G1","I1");m.add("G2","I1");m.add("G1","I1");
              check(m.groupsOf("I1").equals(Set.of("G1","G2")));
              check(m.itemsOf("G1").equals(Set.of("I1")));
              m.remove("G1","I1");
              check(m.groupsOf("I1").equals(Set.of("G2")));
              check(m.itemsOf("G1").isEmpty());
              try {m.add("", "I1");throw new AssertionError();}
              catch(IllegalArgumentException expected){}
              System.out.println("PASS: many-to-many membership consistent");
          }
      }
      ~~~

      Kiểm chứng: thêm một item vào 2 group, add trùng không nhân bản, remove ở một nhóm không xóa nhóm kia. Bản thật cần FK, unique(group_id,item_id) và transaction/concurrency phù hợp; Set demo không đại diện database.
  - situation: Một entity bị tham chiếu bởi nhiều domain object nhưng mỗi nơi giữ bản sao dữ liệu nên việc cập nhật không
      đồng bộ theo thời gian.
    readmeRelated:
      anchorList:
      - object-004
      - object-007
      - composition-007
      - relationships-001
      - class-design-006
      - practice-011
    resolve: Giữ reference theo entity ID tới nguồn chân lý; dùng snapshot có chủ đích khi lịch sử cần cố định, không sao
      chép tùy tiện.
    knowledge: Entity identity, source of truth và consistency.
    code: |-
      ### Case 13 — Shared entity qua ID thay vì nhiều bản sao dễ stale

      Nếu nhiều order nhúng bản copy của tên Customer, cập nhật hồ sơ sẽ khiến các bản copy hiện hành khác nhau. Lưu CustomerId tham chiếu đến registry là nguồn chân lý; chỉ snapshot riêng nếu dữ liệu lịch sử cần đóng băng.

      ~~~java
      import java.util.*;
      public class Case13 {
          record Customer(String id,String name){}
          record Order(String id,String customerId){}
          static final class Customers {
              private final Map<String,Customer> records=new HashMap<>();
              void save(Customer c){records.put(c.id(),c);}
              Customer find(String id){
                  Customer c=records.get(id);
                  if(c==null)throw new NoSuchElementException(id);
                  return c;
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Customers registry=new Customers();
              registry.save(new Customer("C1","Lan"));
              Customer staleCopy=registry.find("C1");
              Order a=new Order("O1","C1"),b=new Order("O2","C1");
              registry.save(new Customer("C1","Lan Nguyễn"));
              check(staleCopy.name().equals("Lan")); // Bản copy không tự sync.
              check(registry.find(a.customerId()).name().equals("Lan Nguyễn"));
              check(registry.find(b.customerId()).name().equals("Lan Nguyễn"));
              System.out.println("PASS: shared identity resolves current source");
          }
      }
      ~~~

      Kiểm chứng: hai order tham chiếu cùng ID và cùng thấy phiên bản Customer mới qua registry, còn bản copy cũ stale. Trong hệ phân tán, registry/API hoặc cache vẫn có độ trễ đồng bộ; dùng invalidation/versioning khi cần. Địa chỉ giao hàng tại lúc chốt order là **snapshot lịch sử có chủ đích**, không phải trường hợp cần tự động đổi theo hồ sơ.
- groupID: 8
  groupName: SOLID, dependency và module boundaries
  cases:
  - situation: Hai module import class của nhau qua một chuỗi package, gây phụ thuộc vòng và ngăn build hoặc test từng module
      độc lập.
    readmeRelated:
      anchorList:
      - relationships-007
      - class-design-003
      - solid-006
      - design-pitfalls-007
    resolve: Lập đồ thị dependency để tìm chu trình, tách shared contract xuống module độc lập hoặc thay cuộc gọi ngược bằng
      port/event.
    knowledge: Module cycles, DIP và acyclic dependencies.
    code: |-
      Tách shared contract độc lập để policy và adapter cùng phụ thuộc hướng xuống, không import ngược qua package. Đồ thị dependency dưới đây chứng minh cycle đã biến mất sau khi đổi kiến trúc.

      ~~~java
      import java.util.*;
      public class Demo1 {
        static boolean cyclic(Map<String, Set<String>> edges) {
          Set<String> visiting = new HashSet<>(), visited = new HashSet<>();
          for (String module : edges.keySet())
            if (walk(module, edges, visiting, visited)) return true;
          return false;
        }
        static boolean walk(String node, Map<String, Set<String>> edges,
                            Set<String> visiting, Set<String> visited) {
          if (visiting.contains(node)) return true;
          if (visited.contains(node)) return false;
          visiting.add(node);
          for (String child : edges.getOrDefault(node, Set.of()))
            if (walk(child, edges, visiting, visited)) return true;
          visiting.remove(node);
          visited.add(node);
          return false;
        }
        public static void main(String[] args) {
          Map<String, Set<String>> before = Map.of(
            "orders", Set.of("sql"),
            "sql", Set.of("orders"));
          Map<String, Set<String>> after = Map.of(
            "orders", Set.of("contracts"),
            "sql", Set.of("contracts"),
            "contracts", Set.of());
          assert cyclic(before);
          assert !cyclic(after);
        }
      }
      ~~~

      Kiểm chứng: javac Demo1.java và java -ea Demo1. Trong repository thật, dựng graph từ Gradle/project dependencies hoặc jdeps, kiểm assertion tương đương và biên dịch từng module. Module contracts chứa interface/DTO ổn định; implementation SQL đặt dưới infrastructure và được wire ở composition root. Đoạn kiểm chứng không tự khẳng định build thực đã chạy.
  - situation: Một high-level rule phải đổi theo một thay đổi nhỏ trong SQL query vì nghiệp vụ phụ thuộc trực tiếp lớp persistence.
    readmeRelated:
      anchorList:
      - abstraction-008
      - interface-009
      - class-design-004
      - solid-006
      - testing-007
    resolve: Để high-level policy phụ thuộc Repository port; SQL adapter implement phía infrastructure, không cho query detail
      lan vào business rule.
    knowledge: Dependency Inversion, persistence ports và hexagonal architecture.
    code: |-
      Business policy chỉ thấy Repository port và model nghiệp vụ. SQL mapping nằm trong adapter; rule approve không biết tên bảng/câu query.

      ~~~java
      import java.util.*;
      import java.sql.*;
      public class Demo2 {
        record Order(String id, long cents) {}
        interface OrderRepository { Optional<Order> find(String id); }
        static final class ApprovalPolicy {
          private final OrderRepository orders;
          ApprovalPolicy(OrderRepository orders) { this.orders = orders; }
          boolean requiresReview(String id) {
            Order order = orders.find(id).orElseThrow();
            return order.cents() >= 100_000;
          }
        }
        // Adapter hạ tầng: không import vào ApprovalPolicy.
        record JdbcOrders(Connection connection) implements OrderRepository {
          public Optional<Order> find(String id) {
            try (PreparedStatement stmt = connection.prepareStatement(
                "SELECT order_id, cents FROM orders WHERE order_id = ?")) {
              stmt.setString(1, id);
              try (ResultSet rows = stmt.executeQuery()) {
                if (!rows.next()) return Optional.empty();
                return Optional.of(new Order(rows.getString(1), rows.getLong(2)));
              }
            } catch (SQLException e) {
              throw new IllegalStateException("order lookup failed", e);
            }
          }
        }
        public static void main(String[] args) {
          OrderRepository fake = id -> switch (id) {
            case "small" -> Optional.of(new Order(id, 9_000));
            case "large" -> Optional.of(new Order(id, 250_000));
            default -> Optional.empty();
          };
          ApprovalPolicy policy = new ApprovalPolicy(fake);
          assert !policy.requiresReview("small");
          assert policy.requiresReview("large");
        }
      }
      ~~~

      Kiểm chứng: javac Demo2.java và java -ea Demo2 (JDK 21). Unit test chạy bằng fake; thay database SQL không đổi ApprovalPolicy. Kiểm tra JDBC adapter riêng bằng integration test với schema thật, dữ liệu mẫu và lỗi truy vấn.
  - situation: Class quản lý đơn hàng vừa gửi email, vừa tính phí, vừa ghi sổ và vừa cập nhật kho, nên một lỗi hạ tầng làm
      hỏng thao tác kinh doanh khác.
    readmeRelated:
      anchorList:
      - class-design-001
      - class-design-004
      - solid-002
      - design-pitfalls-001
      - testing-010
      - refactoring-003
    resolve: Tách pricing, stock, accounting, notification; điều phối use case với transaction và cơ chế xử lý side effects
      thất bại.
    knowledge: SRP, transaction boundaries và fault isolation.
    code: |-
      Tách chính sách giá, cập nhật kho, ghi sổ và thông báo. Use case ghi dữ liệu + outbox trong một transaction, còn gửi email là xử lý side effect bên ngoài transaction.

      ~~~java
      import java.util.*;
      public class Demo3 {
        record Order(String id, long cents) {}
        record Event(String kind, String orderId) {}
        interface Pricing { long total(long baseCents); }
        interface Stock { void reserve(String orderId); }
        interface Ledger { void post(Order order); }
        interface Outbox { void enqueue(Event event); }
        interface UnitOfWork { void inTransaction(Runnable work); }
        interface Mailer { void send(Event event); }

        record Checkout(Pricing pricing, Stock stock, Ledger ledger,
                        Outbox outbox, UnitOfWork uow) {
          void place(String id, long base) {
            long total = pricing.total(base);
            uow.inTransaction(() -> {
              stock.reserve(id);
              ledger.post(new Order(id, total));
              outbox.enqueue(new Event("ORDER_PLACED", id));
            });
          }
        }
        public static void main(String[] args) {
          List<String> calls = new ArrayList<>();
          List<Event> pending = new ArrayList<>();
          Pricing price = base -> base + 100;
          Stock stock = id -> calls.add("stock:" + id);
          Ledger ledger = order -> calls.add("ledger:" + order.cents());
          Outbox outbox = pending::add;
          UnitOfWork fakeTx = Runnable::run; // chỉ kiểm luồng, không mô phỏng rollback
          Checkout checkout = new Checkout(price, stock, ledger, outbox, fakeTx);
          checkout.place("O1", 900);
          Mailer failingMail = event -> { throw new IllegalStateException("SMTP down"); };
          try {
            failingMail.send(pending.get(0));
            throw new AssertionError("expected mail failure");
          } catch (IllegalStateException expected) { }
          assert calls.equals(List.of("stock:O1", "ledger:1000"));
          assert pending.equals(List.of(new Event("ORDER_PLACED", "O1")));
        }
      }
      ~~~

      Kiểm chứng: javac Demo3.java và java -ea Demo3. Test chứng minh gửi mail lỗi không xóa sự kiện pending và không sửa lại luồng checkout. Trong production, Stock/Ledger/Outbox phải thực sự tham gia cùng DB transaction; test rollback, retry, idempotency và eventual delivery bằng integration tests. Runnable::run ở đây không phải transaction thật.
  - situation: Một class chỉ cần thao tác đọc phải inject cả interface quản trị xóa dữ liệu, tạo quyền truy cập vượt nhu cầu.
    readmeRelated:
      anchorList:
      - interface-006
      - solid-005
      - design-pitfalls-006
    resolve: Tách ReadOnlyRepository và AdminRepository; inject chỉ khả năng cần dùng, không cấp quyền ghi/xóa cho read-only
      client.
    knowledge: ISP, least privilege và capability security.
    code: |-
      Client báo cáo chỉ được cấp ReadOnlyRepository. Interface quản trị xóa dữ liệu tách riêng, nên code báo cáo không có method delete để gọi.

      ~~~java
      import java.util.*;
      public class Demo4 {
        record Item(String id, String value) {}
        interface ReadOnlyRepository { Optional<Item> find(String id); }
        interface AdminRepository { void delete(String id); }
        static final class Storage implements ReadOnlyRepository, AdminRepository {
          private final Map<String, Item> data = new HashMap<>();
          Storage() { data.put("A", new Item("A", "visible")); }
          public Optional<Item> find(String id) { return Optional.ofNullable(data.get(id)); }
          public void delete(String id) { data.remove(id); }
        }
        record Reporter(ReadOnlyRepository data) {
          String show(String id) { return data.find(id).orElseThrow().value(); }
          // data.delete(id); // compile error: ReadOnlyRepository không có delete
        }
        public static void main(String[] args) {
          Storage storage = new Storage();
          Reporter reporter = new Reporter(storage);
          assert reporter.show("A").equals("visible");
          assert storage.find("A").isPresent();
        }
      }
      ~~~

      Kiểm chứng: javac Demo4.java và java -ea Demo4; bỏ comment dòng data.delete phải bị compiler từ chối. Quyền tại compile-time chỉ giới hạn API của Reporter; server, DB credentials và endpoint thực vẫn phải áp dụng authorization/least privilege.
  - situation: Một phương thức service có 18 dependency trong constructor, cho thấy nhiều trách nhiệm không liên quan đã bị
      dồn vào cùng điểm điều phối.
    readmeRelated:
      anchorList:
      - class-design-001
      - class-design-002
      - solid-002
      - design-pitfalls-001
      - refactoring-003
    resolve: Nhóm 18 dependency theo trách nhiệm/use case, tách class điều phối quá lớn; tránh chữa bằng service locator che
      số phụ thuộc.
    knowledge: SRP, high coupling và constructor dependency smell.
    code: |-
      Constructor nhận 18 dependency là tín hiệu nhiều trách nhiệm bị trộn. Tách thành các use case nhận đúng port; không thay 18 tham số bằng ServiceLocator khổng lồ.

      ~~~java
      import java.util.*;
      public class Demo5 {
        interface Prices { long quote(String sku); }
        interface Inventory { boolean available(String sku); }
        interface Mail { void notifyUser(String user, String content); }

        record QuoteItem(Prices prices, Inventory inventory) {
          long quote(String sku) {
            if (!inventory.available(sku)) throw new IllegalStateException("out of stock");
            return prices.quote(sku);
          }
        }
        record NotifyOrder(Mail mail) {
          void completed(String user) { mail.notifyUser(user, "order completed"); }
        }
        public static void main(String[] args) {
          List<String> sent = new ArrayList<>();
          QuoteItem pricing = new QuoteItem(sku -> 8000, sku -> sku.equals("A"));
          NotifyOrder notifications = new NotifyOrder(
            (user, content) -> sent.add(user + ":" + content));
          assert pricing.quote("A") == 8000;
          try { pricing.quote("B"); throw new AssertionError("expected stock error"); }
          catch (IllegalStateException expected) { }
          notifications.completed("customer-1");
          assert sent.equals(List.of("customer-1:order completed"));
        }
      }
      ~~~

      Kiểm chứng: javac Demo5.java và java -ea Demo5. QuoteItem chỉ có hai dependency liên quan định giá, NotifyOrder chỉ có Mail; test mỗi use case có fake tương ứng. Khi refactor thật, phân loại toàn bộ 18 dependency theo các use case, kiểm regression cho mỗi luồng và kiểm tra còn dependency vòng hay trách nhiệm trùng.
  - situation: Một interface được sửa thêm method ghi để phục vụ một client làm tất cả implementation chỉ đọc cũ không còn
      biên dịch.
    readmeRelated:
      anchorList:
      - interface-006
      - interface-007
      - solid-005
      - design-pitfalls-006
    resolve: Thay interface tổng bằng read/write contracts tách biệt, giữ API cũ nếu cần migration; bảo vệ compatibility bằng
      compile tests.
    knowledge: ISP, interface evolution và backward compatibility.
    code: |-
      Không bổ sung method write vào interface đọc mà mọi adapter cũ đã implements. Tạo interface khả năng ghi riêng, để adapter chỉ đọc vẫn biên dịch mà client ghi có hợp đồng tường minh.

      ~~~java
      import java.util.*;
      public class Demo6 {
        // Giữ nguyên contract công khai đã tồn tại.
        interface ReadStore { Optional<String> get(String id); }
        interface WriteStore { void put(String id, String value); }

        static final class LegacyReadReplica implements ReadStore {
          public Optional<String> get(String id) {
            return id.equals("A") ? Optional.of("old") : Optional.empty();
          }
        }
        static final class ReadWriteStore implements ReadStore, WriteStore {
          private final Map<String, String> values = new HashMap<>();
          public Optional<String> get(String id) { return Optional.ofNullable(values.get(id)); }
          public void put(String id, String value) { values.put(id, value); }
        }
        record Viewer(ReadStore store) {
          Optional<String> view(String id) { return store.get(id); }
        }
        record Editor(WriteStore store) {
          void edit(String id, String value) { store.put(id, value); }
        }
        public static void main(String[] args) {
          assert new Viewer(new LegacyReadReplica()).view("A").orElseThrow().equals("old");
          ReadWriteStore db = new ReadWriteStore();
          new Editor(db).edit("B", "new");
          assert new Viewer(db).view("B").orElseThrow().equals("new");
        }
      }
      ~~~

      Kiểm chứng: javac Demo6.java và java -ea Demo6. LegacyReadReplica không buộc thêm put hoặc ném UnsupportedOperationException. Với API đã phát hành, còn cần compile-test client/adapter từ version cũ và kiểm binary compatibility trên artifact/version thực; chỉ test trong một file chưa đủ kết luận tương thích toàn bộ.
  - situation: Các lớp application và infrastructure gọi ngược lẫn nhau, gây một thay đổi nhỏ trong adapter dẫn đến hiệu ứng
      dây chuyền sang business rules.
    readmeRelated:
      anchorList:
      - abstraction-008
      - interface-009
      - class-design-004
      - solid-006
      - design-pitfalls-007
    resolve: Định hướng dependency từ application tới port, infrastructure implement port; loại import ngược và kiểm tra đồ
      thị module.
    knowledge: Dependency Rule, DIP và architecture boundaries.
    code: |-
      Application định nghĩa port và chỉ biết port; infrastructure implements mà không được callback ngược tùy tiện vào business implementation. Composition root nối hai phía.

      ~~~java
      import java.util.*;
      public class Demo7 {
        record Order(String id, long cents) {}
        // Application boundary
        interface OrderReader { Optional<Order> find(String id); }
        static final class Approval {
          private final OrderReader orders;
          Approval(OrderReader orders) { this.orders = orders; }
          boolean large(String id) {
            return orders.find(id).orElseThrow().cents() >= 100_000;
          }
        }
        // Infrastructure adapter; trong module thật đặt ở infrastructure.
        static final class SqlAdapter implements OrderReader {
          public Optional<Order> find(String id) {
            return id.equals("O1") ? Optional.of(new Order(id, 120_000)) : Optional.empty();
          }
        }
        // Composition root
        public static void main(String[] args) {
          OrderReader adapter = new SqlAdapter();
          Approval approval = new Approval(adapter);
          assert approval.large("O1");
          assert !new Approval(id -> Optional.of(new Order(id, 500))).large("O2");
          // Approval không new SqlAdapter() và không import class infra.
        }
      }
      ~~~

      Kiểm chứng: javac Demo7.java và java -ea Demo7 kiểm thay adapter bằng fake mà không thay policy. Khi tách module thực: application -> contracts/domain; infrastructure -> contracts/domain, composition-root -> application + infrastructure. Dùng dependency graph/import rules (jdeps/ArchUnit nếu có) để bắt import infra từ application và mọi cycle; cùng file demo chưa chứng minh package/module rule được enforcement.
  - situation: Kỹ sư áp dụng mọi nguyên tắc SOLID bằng cách tạo thêm factory, decorator, provider và service cho ứng dụng
      nhỏ, khiến lỗi thực tế bị che khuất.
    readmeRelated:
      anchorList:
      - oop-basic-008
      - abstraction-007
      - solid-008
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-008
    resolve: Bỏ abstraction không tạo biến thể/test seam có giá trị; tối ưu cho luồng nhỏ bằng thiết kế dễ đọc và thay đổi
      có kiểm chứng.
    knowledge: SOLID pragmatism, KISS, YAGNI.
    code: |-
      SOLID áp vào điểm thay đổi thật. Khi chỉ có một chính sách thuế cố định, một concrete class rõ ràng và regression tests giúp đọc luồng dễ hơn các lớp factory/provider/decorator không có nhu cầu.

      ~~~java
      public class Demo8 {
        static final class InvoiceCalculator {
          long total(long subtotalCents) {
            if (subtotalCents < 0) throw new IllegalArgumentException("subtotal");
            long tax = Math.multiplyExact(subtotalCents, 10) / 100;
            return Math.addExact(subtotalCents, tax);
          }
        }
        static final class InvoiceService {
          private final InvoiceCalculator calculator;
          InvoiceService(InvoiceCalculator calculator) { this.calculator = calculator; }
          long issue(long subtotal) { return calculator.total(subtotal); }
        }
        public static void main(String[] args) {
          var service = new InvoiceService(new InvoiceCalculator());
          assert service.issue(0) == 0;
          assert service.issue(10_000) == 11_000;
          try { service.issue(-1); throw new AssertionError("expected validation"); }
          catch (IllegalArgumentException expected) { }
        }
      }
      ~~~

      Kiểm chứng: javac Demo8.java và java -ea Demo8. Assertions giữ hành vi khi xóa wrapper thừa; review số lớp, số nơi cần sửa và thay đổi thực tế trước khi thêm abstraction. Chưa có phép đo nào chứng minh performance/maintainability định lượng; cần diff và thử thay đổi nghiệp vụ thực.
  - situation: Một component lấy dependency từ global service locator trong từng method nên test không biết cần chuẩn bị những
      dịch vụ nào trước khi chạy.
    readmeRelated:
      anchorList:
      - composition-006
      - solid-007
      - testing-007
    resolve: Đưa dependency bắt buộc vào constructor thay vì tra locator tại runtime; test nêu rõ fake cần cung cấp.
    knowledge: Dependency injection vs Service Locator và explicit dependencies.
    code: |-
      Service locator giấu dependency runtime trong từng method; constructor injection buộc caller và test cung cấp port bắt buộc ngay khi tạo đối tượng.

      ~~~java
      import java.util.*;
      public class Demo9 {
        interface Catalog { int unitPrice(String sku); }
        interface Orders { void save(String id, int cents); }
        static final class Checkout {
          private final Catalog catalog;
          private final Orders orders;
          Checkout(Catalog catalog, Orders orders) {
            this.catalog = Objects.requireNonNull(catalog, "catalog");
            this.orders = Objects.requireNonNull(orders, "orders");
          }
          void place(String id, String sku, int qty) {
            if (qty <= 0) throw new IllegalArgumentException("qty");
            orders.save(id, Math.multiplyExact(catalog.unitPrice(sku), qty));
          }
        }
        public static void main(String[] args) {
          Map<String,Integer> saved = new HashMap<>();
          Catalog fakeCatalog = sku -> 1500;
          Orders fakeOrders = saved::put;
          Checkout checkout = new Checkout(fakeCatalog, fakeOrders);
          checkout.place("O1", "SKU", 3);
          assert saved.get("O1") == 4500;
          try {
            new Checkout(null, fakeOrders);
            throw new AssertionError("missing dependency must fail early");
          } catch (NullPointerException expected) { }
        }
      }
      ~~~

      Kiểm chứng: javac Demo9.java và java -ea Demo9. Test thấy đủ Catalog và Orders từ constructor, không phụ thuộc thứ tự cấu hình global locator giữa các test. Composition root mới biết adapter production; tránh lấy dependency từ static global trong use case.
  - situation: Một Singleton mutable chứa người dùng hiện tại bị tái sử dụng trên nhiều request, làm dữ liệu phiên đăng nhập
      bị lẫn giữa các khách hàng.
    readmeRelated:
      anchorList:
      - class-003
      - object-007
      - design-patterns-004
      - design-pitfalls-008
    resolve: Không lưu current user trong singleton; đưa identity vào request/security context đã xác thực, tránh state mutable
      chia sẻ.
    knowledge: Singleton scope, thread isolation và authorization context.
    code: |-
      Identity thuộc request context bất biến và được truyền cho service stateless. Không đặt currentUser trong singleton mutable vì hai request đồng thời có thể ghi đè lẫn nhau.

      ~~~java
      import java.util.concurrent.*;
      public class Demo10 {
        record RequestContext(String authenticatedUserId) {
          RequestContext {
            if (authenticatedUserId == null || authenticatedUserId.isBlank())
              throw new IllegalArgumentException("no authenticated identity");
          }
        }
        static final class ProfileService {
          String profileFor(RequestContext request) {
            return "profile:" + request.authenticatedUserId();
          }
        }
        public static void main(String[] args) throws Exception {
          ProfileService singleton = new ProfileService();
          ExecutorService pool = Executors.newFixedThreadPool(2);
          try {
            CountDownLatch start = new CountDownLatch(1);
            Future<String> a = pool.submit(() -> {
              start.await();
              return singleton.profileFor(new RequestContext("alice"));
            });
            Future<String> b = pool.submit(() -> {
              start.await();
              return singleton.profileFor(new RequestContext("bob"));
            });
            start.countDown();
            assert a.get().equals("profile:alice");
            assert b.get().equals("profile:bob");
          } finally { pool.shutdownNow(); }
        }
      }
      ~~~

      Kiểm chứng: javac Demo10.java và java -ea Demo10. Cùng singleton phục vụ hai request mà không có field per-user. RequestContext phải được framework xác thực tạo từ security principal/token đã kiểm chữ ký, không nhận userId tự khai từ request body. Kiểm thử security filter và concurrent requests thật riêng để bắt rò dữ liệu.
  - situation: Trong quá trình cấu hình dependency injection, hai service constructor phụ thuộc ngược lẫn nhau làm ứng dụng
      không khởi động được.
    readmeRelated:
      anchorList:
      - composition-006
      - relationships-007
      - solid-007
      - design-pitfalls-007
    resolve: Tách trách nhiệm để loại constructor cycle; có thể di chuyển orchestration lên service thứ ba hoặc dùng port
      phụ thuộc một chiều.
    knowledge: DI cycle, DAG construction và service decomposition.
    code: |-
      Không chữa constructor cycle bằng lazy global lookup. Di chuyển orchestration lên service thứ ba, để Billing và Inventory có thể khởi tạo độc lập, Coordinator điều phối.

      ~~~java
      import java.util.*;
      public class Demo11 {
        interface RateTable { long unitPrice(String sku); }
        static final class Billing {
          private final RateTable rates;
          Billing(RateTable rates) { this.rates = Objects.requireNonNull(rates); }
          long charge(String sku, int qty) {
            return Math.multiplyExact(rates.unitPrice(sku), qty);
          }
        }
        static final class Inventory {
          private final Set<String> available;
          Inventory(Set<String> available) { this.available = Set.copyOf(available); }
          boolean canShip(String sku) { return available.contains(sku); }
        }
        record Coordinator(Billing billing, Inventory inventory) {
          long purchase(String sku, int qty) {
            if (qty <= 0 || !inventory.canShip(sku))
              throw new IllegalArgumentException("not available");
            return billing.charge(sku, qty);
          }
        }
        public static void main(String[] args) {
          Billing billing = new Billing(sku -> 2000);
          Inventory inventory = new Inventory(Set.of("A"));
          Coordinator coordinator = new Coordinator(billing, inventory);
          assert coordinator.purchase("A", 3) == 6000;
          try { coordinator.purchase("B", 3); throw new AssertionError(); }
          catch (IllegalArgumentException expected) { }
        }
      }
      ~~~

      Kiểm chứng: javac Demo11.java và java -ea Demo11. Graph khởi tạo là RateTable -> Billing, Inventory, rồi Coordinator, không có dependency ngược. Với DI container thực, kiểm build context và test bean graph theo module để phát hiện circular constructor injection còn sót.
  - situation: Nhiều class dùng chung một interface khổng lồ chỉ vì có vài method trùng tên, buộc implementation có nhiều
      hành vi không hợp lệ.
    readmeRelated:
      anchorList:
      - interface-006
      - solid-005
      - design-pitfalls-006
    resolve: Tách interface theo năng lực thực sự được hỗ trợ; không ép implementation ném lỗi cho những method vô nghĩa.
    knowledge: ISP, LSP và role segregation.
    code: |-
      Tách fat interface theo khả năng thực sự: local searchable adapter có thể đọc, nhưng không bị ép ghi hoặc reindex. Client yêu cầu đúng port cần dùng.

      ~~~java
      import java.util.*;
      public class Demo12 {
        interface Searchable { Optional<String> find(String key); }
        interface Writable { void save(String key, String value); }
        interface Reindexable { void rebuildIndex(); }

        static final class ReadOnlyMirror implements Searchable {
          public Optional<String> find(String key) {
            return key.equals("A") ? Optional.of("mirror") : Optional.empty();
          }
        }
        static final class PrimaryStore implements Searchable, Writable, Reindexable {
          private final Map<String,String> data = new HashMap<>();
          private int rebuilds;
          public Optional<String> find(String key) { return Optional.ofNullable(data.get(key)); }
          public void save(String key, String value) { data.put(key, value); }
          public void rebuildIndex() { rebuilds++; }
          int rebuildCount() { return rebuilds; }
        }
        record Reader(Searchable search) {
          Optional<String> lookup(String key) { return search.find(key); }
        }
        public static void main(String[] args) {
          assert new Reader(new ReadOnlyMirror()).lookup("A").orElseThrow().equals("mirror");
          PrimaryStore primary = new PrimaryStore();
          primary.save("B", "primary");
          primary.rebuildIndex();
          assert new Reader(primary).lookup("B").orElseThrow().equals("primary");
          assert primary.rebuildCount() == 1;
          // new ReadOnlyMirror().save("X", "bad"); // compile error: no Writable capability
        }
      }
      ~~~

      Kiểm chứng: javac Demo12.java và java -ea Demo12; bỏ comment save của ReadOnlyMirror phải lỗi compile. Không còn implementation throw UnsupportedOperationException cho những method ngoài vai trò. Chỉ cấp Reindexable cho component quản trị, không inject vào client đọc.
  - situation: Một API chỉ cần thêm loại chiết khấu mới nhưng developer phải thay đổi cấu trúc core framework và tất cả nơi
      gọi.
    readmeRelated:
      anchorList:
      - interface-008
      - polymorphism-009
      - solid-003
      - design-patterns-008
      - testing-009
    resolve: Chỉ mở rộng tại điểm biến thiên chính sách chiết khấu, không buộc sửa framework core; giữ contract ổn định và
      test tương thích.
    knowledge: OCP, extension points và abstraction boundaries.
    code: |-
      Đặt điểm mở rộng ở DiscountPolicy; lõi CheckoutCalculator chỉ gọi contract ổn định. Thêm loại khuyến mại mới bằng một implementation, không sửa core hay call sites.

      ~~~java
      public class Demo13 {
        interface DiscountPolicy { long discount(long cents); }
        static final class NoDiscount implements DiscountPolicy {
          public long discount(long cents) { return 0; }
        }
        record PercentOff(int percent) implements DiscountPolicy {
          PercentOff {
            if (percent < 0 || percent > 100)
              throw new IllegalArgumentException("percent");
          }
          public long discount(long cents) {
            return Math.multiplyExact(cents, percent) / 100;
          }
        }
        // Policy mới chỉ thêm vào extension point có sẵn.
        record FixedOff(long centsOff) implements DiscountPolicy {
          FixedOff {
            if (centsOff < 0) throw new IllegalArgumentException("discount");
          }
          public long discount(long cents) { return Math.min(cents, centsOff); }
        }
        record CheckoutCalculator(DiscountPolicy policy) {
          long total(long baseCents) {
            if (baseCents < 0) throw new IllegalArgumentException("amount");
            long discount = policy.discount(baseCents);
            if (discount < 0 || discount > baseCents)
              throw new IllegalStateException("invalid discount policy");
            return baseCents - discount;
          }
        }
        static void contract(DiscountPolicy policy) {
          long result = new CheckoutCalculator(policy).total(10_000);
          assert result >= 0 && result <= 10_000;
        }
        public static void main(String[] args) {
          contract(new NoDiscount());
          contract(new PercentOff(20));
          contract(new FixedOff(1_500));
          assert new CheckoutCalculator(new NoDiscount()).total(10_000) == 10_000;
          assert new CheckoutCalculator(new PercentOff(20)).total(10_000) == 8_000;
          assert new CheckoutCalculator(new FixedOff(1_500)).total(10_000) == 8_500;
        }
      }
      ~~~

      Kiểm chứng: javac Demo13.java và java -ea Demo13. CheckoutCalculator không cần đổi khi thêm FixedOff; contract test áp mọi policy. Khi chính sách phụ thuộc thứ tự/ràng buộc stack nhiều discount, phải mở rộng contract có chủ đích và test các tổ hợp trước khi phát hành.
- groupID: 9
  groupName: Design Patterns và tương tác giữa thành phần
  cases:
  - situation: Nhóm áp dụng Strategy cho ba công thức đang thay đổi nhưng logic chọn strategy lại bị nhân bản trong nhiều
      controller.
    readmeRelated:
      anchorList:
      - composition-005
      - composition-006
      - solid-003
      - design-patterns-008
      - testing-009
    resolve: Tập trung Strategy selection tại một factory/application boundary; các controller chỉ gọi dịch vụ định giá qua
      contract.
    knowledge: Strategy, composition root và DRY selection logic.
    code: |-
      Đưa lựa chọn Strategy vào một factory duy nhất ở application boundary. Controller chỉ gọi PricingService; cả API và batch job dùng cùng chiến lược qua service.

      ~~~java
      import java.util.Map;
      public class Case1 {
          enum Plan { STANDARD, VIP, STAFF }
          interface Pricing { int total(int cents); }
          static final class PricingFactory {
              private static final Map<Plan, Pricing> STRATEGIES = Map.of(
                  Plan.STANDARD, cents -> cents,
                  Plan.VIP, cents -> cents * 9 / 10,
                  Plan.STAFF, cents -> cents * 8 / 10);
              static Pricing select(Plan plan) {
                  Pricing result = STRATEGIES.get(plan);
                  if (result == null) throw new IllegalArgumentException("Unknown plan");
                  return result;
              }
          }
          static final class PricingService {
              int quote(Plan plan, int cents) {
                  if (cents < 0) throw new IllegalArgumentException();
                  return PricingFactory.select(plan).total(cents);
              }
          }
          static final class WebController {
              private final PricingService service;
              WebController(PricingService service) { this.service = service; }
              int quote(Plan plan) { return service.quote(plan, 1000); }
          }
          static final class BatchController {
              private final PricingService service;
              BatchController(PricingService service) { this.service = service; }
              int quote(Plan plan) { return service.quote(plan, 1000); }
          }
          public static void main(String[] args) {
              PricingService service = new PricingService();
              WebController web = new WebController(service);
              BatchController batch = new BatchController(service);
              for (Plan plan : Plan.values())
                  if (web.quote(plan) != batch.quote(plan))
                      throw new AssertionError("Duplicated selection diverged");
              if (web.quote(Plan.VIP) != 900 || batch.quote(Plan.STAFF) != 800)
                  throw new AssertionError();
          }
      }
      ~~~

      Kỳ vọng: cả hai controller cho kết quả đồng nhất, không chứa switch/instanceof chọn strategy. Kiểm tra bằng cách thêm plan mới chỉ tại factory và kiểm lại contract.
  - situation: Một factory dùng tham số environment lấy từ biến toàn cục khiến object trong test và production bị tạo với
      các dependency khác kỳ vọng.
    readmeRelated:
      anchorList:
      - lifecycle-005
      - composition-006
      - solid-007
      - design-patterns-002
      - testing-007
    resolve: Truyền environment/config tường minh vào factory; kiểm thử tương ứng từng profile, tránh đọc mutable global state.
    knowledge: Abstract Factory, configuration injection và reproducibility.
    code: |-
      Factory nhận cấu hình tường minh theo lời gọi, không đọc biến global mutable. Test có thể tạo dependency cho hai môi trường trong cùng một tiến trình.

      ~~~java
      public class Case2 {
          enum Environment { TEST, PRODUCTION }
          record Config(Environment environment, String endpoint) {
              Config {
                  if (environment == null || endpoint == null || endpoint.isBlank())
                      throw new IllegalArgumentException("Missing config");
              }
          }
          record Client(String endpoint) {}
          static final class ClientFactory {
              static Client create(Config config) {
                  return new Client(config.endpoint());
              }
          }
          static void contract(Config config, String expectedEndpoint) {
              Client client = ClientFactory.create(config);
              if (!client.endpoint().equals(expectedEndpoint)) throw new AssertionError();
          }
          public static void main(String[] args) {
              Config test = new Config(Environment.TEST, "http://test.internal");
              Config prod = new Config(Environment.PRODUCTION, "https://prod.internal");
              contract(test, "http://test.internal");
              contract(prod, "https://prod.internal");
              contract(test, "http://test.internal");
          }
      }
      ~~~

      Kỳ vọng: TEST vẫn trả test endpoint sau khi tạo PROD; không có phụ thuộc vào biến global. Cấu hình endpoint thực tế phải được kiểm định theo deployment policy riêng.
  - situation: Một Abstract Factory tạo database client của môi trường staging nhưng messaging client của production, khiến
      một thao tác phát dữ liệu sai môi trường.
    readmeRelated:
      anchorList:
      - lifecycle-005
      - design-patterns-002
      - testing-010
    resolve: Ràng buộc tất cả client trong cùng bộ factory theo environment duy nhất; validate profile và loại mixed dependencies
      trước khởi tạo.
    knowledge: Abstract Factory product families, environment isolation.
    code: |-
      Một Abstract Factory tạo trọn bộ database và messaging client thuộc cùng environment. Kiểm tra family invariant tại assembly thay vì ghép thủ công hai SDK lẻ.

      ~~~java
      public class Case3 {
          enum Env { STAGING, PRODUCTION }
          record DatabaseClient(Env env) {}
          record MessagingClient(Env env) {}
          interface ClientFamily {
              Env env();
              DatabaseClient database();
              MessagingClient messaging();
          }
          record StagingFactory() implements ClientFamily {
              public Env env() { return Env.STAGING; }
              public DatabaseClient database() { return new DatabaseClient(env()); }
              public MessagingClient messaging() { return new MessagingClient(env()); }
          }
          record ProductionFactory() implements ClientFamily {
              public Env env() { return Env.PRODUCTION; }
              public DatabaseClient database() { return new DatabaseClient(env()); }
              public MessagingClient messaging() { return new MessagingClient(env()); }
          }
          record Application(DatabaseClient db, MessagingClient message) {
              Application {
                  if (db.env() != message.env())
                      throw new IllegalArgumentException("Mixed environments");
              }
          }
          static Application build(ClientFamily family) {
              Application app = new Application(family.database(), family.messaging());
              if (app.db().env() != family.env()) throw new IllegalStateException();
              return app;
          }
          public static void main(String[] args) {
              if (build(new StagingFactory()).message().env() != Env.STAGING)
                  throw new AssertionError();
              if (build(new ProductionFactory()).db().env() != Env.PRODUCTION)
                  throw new AssertionError();
              try {
                  new Application(new DatabaseClient(Env.STAGING),
                                  new MessagingClient(Env.PRODUCTION));
                  throw new AssertionError("Mixed clients accepted");
              } catch (IllegalArgumentException expected) {}
          }
      }
      ~~~

      Kỳ vọng: staging/prod mỗi môi trường đồng nhất; bộ trộn database staging + messaging production bị từ chối trước khi ứng dụng hoạt động.
  - situation: Decorator ghi audit log không giữ nguyên exception của service bên trong khiến client nhận lỗi khác với contract
      ban đầu.
    readmeRelated:
      anchorList:
      - abstraction-004
      - interface-008
      - subtyping-007
      - solid-004
      - design-patterns-006
      - language-mechanics-008
    resolve: Decorator nên giữ nguyên success/error contract, log lỗi rồi rethrow thích hợp; không thay loại exception ngoài
      hợp đồng.
    knowledge: Decorator transparency, exception propagation và LSP.
    code: |-
      Audit decorator phải giữ nguyên kết quả và exception identity từ service gốc. Bắt lỗi chỉ để log rồi ném lại chính lỗi cũ.

      ~~~java
      import java.util.ArrayList;
      import java.util.List;
      public class Case4 {
          interface Service { String execute(); }
          static final class AuditDecorator implements Service {
              final Service delegate;
              final List<String> audit;
              AuditDecorator(Service delegate, List<String> audit) {
                  this.delegate = delegate;
                  this.audit = audit;
              }
              public String execute() {
                  try {
                      String result = delegate.execute();
                      audit.add("success");
                      return result;
                  } catch (RuntimeException original) {
                      audit.add("failed:" + original.getClass().getSimpleName());
                      throw original;
                  }
              }
          }
          public static void main(String[] args) {
              List<String> events = new ArrayList<>();
              Service success = new AuditDecorator(() -> "OK", events);
              if (!"OK".equals(success.execute())) throw new AssertionError();
              IllegalArgumentException original = new IllegalArgumentException("invalid");
              Service failure = new AuditDecorator(() -> { throw original; }, events);
              try {
                  failure.execute();
                  throw new AssertionError("Expected original exception");
              } catch (IllegalArgumentException caught) {
                  if (caught != original) throw new AssertionError("Exception changed");
              }
              if (!events.equals(List.of("success", "failed:IllegalArgumentException")))
                  throw new AssertionError("Audit mismatch");
          }
      }
      ~~~

      Kỳ vọng: service thành công trả nguyên kết quả; lỗi được audit nhưng client vẫn nhận cùng exception. Nếu logger có thể ném lỗi thì cần cơ chế log an toàn để không che mất lỗi gốc.
  - situation: Adapter tích hợp dịch vụ bên ngoài rò rỉ enum và DTO vendor vào domain nên nâng version SDK làm hàng loạt object
      không biên dịch.
    readmeRelated:
      anchorList:
      - abstraction-008
      - interface-009
      - class-design-004
      - solid-006
      - design-patterns-005
    resolve: Map DTO/enum/error vendor sang domain contracts trong Adapter; không expose SDK ở domain public API.
    knowledge: Adapter, anti-corruption layer và vendor isolation.
    code: |-
      Adapter cô lập DTO/enum/error vendor trong infrastructure. Domain contract chỉ chứa kiểu do ứng dụng sở hữu; nâng SDK chỉ sửa mapping ở adapter.

      ~~~java
      public class Case5 {
          enum DomainStatus { APPROVED, DECLINED }
          record PaymentResult(DomainStatus status, String reference) {}
          interface PaymentPort { PaymentResult pay(int cents); }
          static final class VendorSdk {
              enum Code { OK_V2, REJECTED_V2 }
              record VendorResponse(Code code, String vendorTxnId) {}
              VendorResponse charge(int cents) {
                  return cents > 0
                      ? new VendorResponse(Code.OK_V2, "v-1")
                      : new VendorResponse(Code.REJECTED_V2, "v-2");
              }
          }
          static final class VendorAdapter implements PaymentPort {
              private final VendorSdk sdk;
              VendorAdapter(VendorSdk sdk) { this.sdk = sdk; }
              public PaymentResult pay(int cents) {
                  VendorSdk.VendorResponse response = sdk.charge(cents);
                  DomainStatus status = switch (response.code()) {
                      case OK_V2 -> DomainStatus.APPROVED;
                      case REJECTED_V2 -> DomainStatus.DECLINED;
                  };
                  return new PaymentResult(status, response.vendorTxnId());
              }
          }
          static String checkout(PaymentPort port) {
              PaymentResult result = port.pay(100);
              return result.status().name() + ":" + result.reference();
          }
          public static void main(String[] args) {
              if (!"APPROVED:v-1".equals(checkout(new VendorAdapter(new VendorSdk()))))
                  throw new AssertionError();
          }
      }
      ~~~

      Kỳ vọng: checkout và PaymentPort không chứa VendorSdk type; test mapping ở adapter xác nhận định dạng domain. Vendor thay tên enum chỉ ảnh hưởng adapter và các test của nó.
  - situation: Facade gộp nhiều lời gọi backend nhưng một bước phụ thất bại khiến caller không biết thao tác chính đã thành
      công hay chưa.
    readmeRelated:
      anchorList:
      - abstraction-004
      - class-design-008
      - modeling-007
      - design-patterns-007
      - language-mechanics-008
      - testing-010
    resolve: Định nghĩa contract trả kết quả của Facade theo từng bước, trạng thái partial success và retry/idempotency thay
      vì che lỗi phụ.
    knowledge: Facade, failure semantics và idempotent orchestration.
    code: |-
      Facade trả trạng thái chính/phụ rõ ràng: thanh toán có thể thành công dù gửi receipt thất bại. Retry dùng cùng requestId để không thanh toán lại.

      ~~~java
      import java.util.*;
      public class Case6 {
          record Receipt(String requestId, int chargedCents) {}
          enum Status { COMPLETED, PAID_RECEIPT_PENDING }
          record Result(Status status, Receipt receipt) {}
          static final class PaymentGateway {
              final Map<String, Receipt> charges = new HashMap<>();
              Receipt charge(String id, int cents) {
                  if (cents <= 0) throw new IllegalArgumentException();
                  Receipt previous = charges.get(id);
                  if (previous != null) {
                      if (previous.chargedCents() != cents)
                          throw new IllegalArgumentException("Conflicting idempotency key");
                      return previous;
                  }
                  Receipt receipt = new Receipt(id, cents);
                  charges.put(id, receipt);
                  return receipt;
              }
          }
          static final class ReceiptSender {
              boolean failNext = true;
              final Set<String> delivered = new HashSet<>();
              void send(Receipt receipt) {
                  if (delivered.contains(receipt.requestId())) return;
                  if (failNext) {
                      failNext = false;
                      throw new IllegalStateException("Email unavailable");
                  }
                  delivered.add(receipt.requestId());
              }
          }
          static final class CheckoutFacade {
              final PaymentGateway payment;
              final ReceiptSender sender;
              CheckoutFacade(PaymentGateway p, ReceiptSender s) { payment = p; sender = s; }
              Result checkout(String requestId, int cents) {
                  Receipt receipt = payment.charge(requestId, cents);
                  try {
                      sender.send(receipt);
                      return new Result(Status.COMPLETED, receipt);
                  } catch (IllegalStateException deliveryError) {
                      return new Result(Status.PAID_RECEIPT_PENDING, receipt);
                  }
              }
          }
          public static void main(String[] args) {
              PaymentGateway p = new PaymentGateway();
              ReceiptSender s = new ReceiptSender();
              CheckoutFacade facade = new CheckoutFacade(p, s);
              Result first = facade.checkout("order-7", 1000);
              if (first.status() != Status.PAID_RECEIPT_PENDING) throw new AssertionError();
              Result retried = facade.checkout("order-7", 1000);
              if (retried.status() != Status.COMPLETED) throw new AssertionError();
              if (p.charges.size() != 1 || s.delivered.size() != 1)
                  throw new AssertionError("Double charge or duplicate receipt");
          }
      }
      ~~~

      Kỳ vọng: lần đầu trả PAID_RECEIPT_PENDING, retry hoàn tất receipt mà chỉ tạo một charge. Demo chạy in-memory; triển khai thực cần idempotency key lưu bền và outbox/queue thích hợp.
  - situation: Một hệ thống Observer gọi đồng bộ hàng chục subscriber, trong đó một subscriber ném exception khiến các subscriber
      còn lại không nhận sự kiện.
    readmeRelated:
      anchorList:
      - design-patterns-010
      - testing-010
    resolve: Cô lập callback bằng cơ chế dispatch xử lý lỗi riêng, chọn async/event queue khi phù hợp; mô tả thứ tự và retry
      rõ.
    knowledge: Observer, fault isolation và event delivery guarantees.
    code: |-
      Observer dispatch từng callback và bắt lỗi riêng; subscriber hỏng không ngăn các subscriber kế tiếp nhận event. Tập hợp lỗi trả ra cho tầng giám sát.

      ~~~java
      import java.util.*;
      public class Case7 {
          interface Subscriber { void onEvent(String event); }
          static final class Bus {
              final List<Subscriber> subscribers = new ArrayList<>();
              void register(Subscriber s) { subscribers.add(s); }
              List<RuntimeException> publish(String event) {
                  List<RuntimeException> failures = new ArrayList<>();
                  for (Subscriber s : List.copyOf(subscribers)) {
                      try {
                          s.onEvent(event);
                      } catch (RuntimeException e) {
                          failures.add(e);
                      }
                  }
                  return failures;
              }
          }
          public static void main(String[] args) {
              Bus bus = new Bus();
              List<String> received = new ArrayList<>();
              bus.register(e -> received.add("A:" + e));
              bus.register(e -> { throw new IllegalStateException("broken subscriber"); });
              bus.register(e -> received.add("C:" + e));
              List<RuntimeException> failures = bus.publish("event-1");
              if (!received.equals(List.of("A:event-1", "C:event-1")))
                  throw new AssertionError("Delivery interrupted");
              if (failures.size() != 1
                  || !(failures.get(0) instanceof IllegalStateException))
                  throw new AssertionError("Failed subscriber not reported");
          }
      }
      ~~~

      Kỳ vọng: A và C nhận event theo thứ tự đăng ký dù B lỗi; danh sách lỗi được giữ lại. Đây là dispatch đồng bộ best-effort, không mặc định có durable delivery hoặc retry.
  - situation: Một listener không được unsubscribe sau khi tab UI đóng, khiến mỗi lần mở lại tab đều xuất hiện thông báo trùng
      lặp.
    readmeRelated:
      anchorList:
      - lifecycle-006
      - design-patterns-010
      - testing-010
    resolve: Unsubscribe khi đóng tab, quản lý subscription handle và idempotent register; kiểm thử mở/đóng không nhân listener.
    knowledge: Observer listener lifecycle, cleanup và duplicate events.
    code: |-
      Mỗi tab nắm giữ Subscription handle để đóng khi lifecycle kết thúc. Registry dùng cùng listener instance làm khóa nên gọi subscribe hai lần không tạo hai callback.

      ~~~java
      import java.util.*;
      import java.util.function.Consumer;
      public class Case8 {
          static final class Bus {
              private final Map<Consumer<String>, Subscription> active = new IdentityHashMap<>();
              Subscription subscribe(Consumer<String> listener) {
                  return active.computeIfAbsent(listener, c -> new Subscription(this, c));
              }
              void publish(String message) {
                  for (Consumer<String> listener : List.copyOf(active.keySet()))
                      listener.accept(message);
              }
              int count() { return active.size(); }
          }
          static final class Subscription implements AutoCloseable {
              private final Bus bus;
              private final Consumer<String> listener;
              private boolean closed;
              Subscription(Bus bus, Consumer<String> listener) {
                  this.bus = bus; this.listener = listener;
              }
              public void close() {
                  if (!closed) {
                      closed = true;
                      bus.active.remove(listener, this);
                  }
              }
          }
          public static void main(String[] args) {
              Bus bus = new Bus();
              List<String> notifications = new ArrayList<>();
              Consumer<String> listener = notifications::add;
              for (int open = 0; open < 3; open++) {
                  try (Subscription tab = bus.subscribe(listener)) {
                      if (tab != bus.subscribe(listener)) throw new AssertionError();
                      if (bus.count() != 1) throw new AssertionError();
                      bus.publish("open-" + open);
                  }
                  if (bus.count() != 0) throw new AssertionError("Listener leaked");
              }
              if (!notifications.equals(List.of("open-0", "open-1", "open-2")))
                  throw new AssertionError("Duplicate notifications");
          }
      }
      ~~~

      Kỳ vọng: sau ba lượt mở/đóng tab chỉ có ba thông báo và không còn listener. Trong UI thật, close() cần gắn vào unmount/dispose.
  - situation: Template Method trong superclass có hook được override thay đổi thứ tự xử lý, khiến dữ liệu được ghi trước
      khi validation.
    readmeRelated:
      anchorList:
      - abstraction-004
      - inheritance-007
      - subtyping-001
      - design-patterns-011
      - testing-009
    resolve: Đóng băng bước validate bắt buộc trước write trong template; không để hook phá thứ tự hoặc chuyển sang composition.
    knowledge: Template Method, invariant sequencing và hook contracts.
    code: |-
      Cố định thứ tự validate -> transform -> write bằng final template method. Hook chỉ tùy biến dữ liệu, không có quyền gọi write trước validate.

      ~~~java
      import java.util.*;
      public class Case9 {
          static class Store {
              final List<String> saved = new ArrayList<>();
              void save(String data) { saved.add(data); }
          }
          static abstract class ImportTemplate {
              private final Store store;
              ImportTemplate(Store store) { this.store = store; }
              public final void execute(String raw) {
                  if (raw == null || raw.isBlank())
                      throw new IllegalArgumentException("Missing input");
                  String result = transform(raw);
                  if (result == null || result.isBlank())
                      throw new IllegalArgumentException("Invalid output");
                  store.save(result);
              }
              protected abstract String transform(String raw);
          }
          static class TrimImporter extends ImportTemplate {
              TrimImporter(Store store) { super(store); }
              @Override protected String transform(String raw) { return raw.trim(); }
          }
          public static void main(String[] args) {
              Store store = new Store();
              ImportTemplate importer = new TrimImporter(store);
              try {
                  importer.execute("  ");
                  throw new AssertionError("Invalid input accepted");
              } catch (IllegalArgumentException expected) {}
              if (!store.saved.isEmpty()) throw new AssertionError("Write before validation");
              importer.execute("  hello  ");
              if (!store.saved.equals(List.of("hello"))) throw new AssertionError();
          }
      }
      ~~~

      Kỳ vọng: input trắng không được ghi; input hợp lệ chỉ ghi giá trị đã transform. final execute giữ bất biến thứ tự các bước.
  - situation: Builder cho object cấu hình cho phép hai tùy chọn loại trừ nhau cùng xuất hiện, gây lỗi chỉ lúc đưa vào production.
    readmeRelated:
      anchorList:
      - lifecycle-005
      - encapsulation-002
      - encapsulation-005
      - design-patterns-003
      - testing-002
    resolve: Kiểm tra các option loại trừ nhau ở build(), đưa ra lỗi trước khi tạo config; nếu phù hợp dùng kiểu tổng để ngăn
      kết hợp sai.
    knowledge: Builder, cross-field invariants và validation.
    code: |-
      Builder kiểm tra cross-field invariant trong build(). HTTP plain và TLS là hai chế độ loại trừ nhau; cấu hình sai bị từ chối ngay tại điểm tạo.

      ~~~java
      public class Case10 {
          record ClientConfig(boolean useTls, boolean allowPlainHttp, String host) {}
          static class ConfigBuilder {
              private boolean tls;
              private boolean plainHttp;
              private String host;
              ConfigBuilder tls(boolean value) { tls = value; return this; }
              ConfigBuilder plainHttp(boolean value) { plainHttp = value; return this; }
              ConfigBuilder host(String value) { host = value; return this; }
              ClientConfig build() {
                  if (tls == plainHttp)
                      throw new IllegalStateException("Choose exactly one transport");
                  if (host == null || host.isBlank())
                      throw new IllegalStateException("Host is required");
                  return new ClientConfig(tls, plainHttp, host);
              }
          }
          public static void main(String[] args) {
              ClientConfig valid = new ConfigBuilder()
                  .tls(true).plainHttp(false).host("api.example").build();
              if (!valid.useTls() || valid.allowPlainHttp()) throw new AssertionError();
              try {
                  new ConfigBuilder().tls(true).plainHttp(true)
                      .host("api.example").build();
                  throw new AssertionError("Conflicting options accepted");
              } catch (IllegalStateException expected) {}
          }
      }
      ~~~

      Kỳ vọng: build() nhận đúng một transport và chặn hai lựa chọn cùng true. Để tránh tổ hợp sai ngay từ kiểu dữ liệu, có thể thay cặp boolean bằng enum TransportMode.
  - situation: State pattern bị sử dụng với state object có mutable dữ liệu chia sẻ, khiến transition của phiên làm việc này
      thay đổi phiên khác.
    readmeRelated:
      anchorList:
      - class-003
      - object-005
      - object-007
      - design-patterns-009
      - design-pitfalls-008
    resolve: Không chia sẻ mutable state object giữa phiên; tạo state riêng per aggregate hoặc state strategy bất biến; bảo
      vệ transitions.
    knowledge: State pattern, object lifetime và shared mutable state.
    code: |-
      State behavior bất biến có thể chia sẻ an toàn; dữ liệu thay đổi (attempts) được giữ trong từng session, transition được bảo vệ ở aggregate.

      ~~~java
      public class Case11 {
          enum Phase { NEW, ACTIVE, CLOSED }
          interface StatePolicy { Phase transition(Phase next); }
          static final class ActivePolicy implements StatePolicy {
              public Phase transition(Phase next) {
                  if (next != Phase.CLOSED) throw new IllegalStateException("Illegal transition");
                  return Phase.CLOSED;
              }
          }
          static final class Session {
              private Phase phase = Phase.NEW;
              private int attempts;
              private final StatePolicy activePolicy = new ActivePolicy();
              void activate() {
                  if (phase != Phase.NEW) throw new IllegalStateException();
                  phase = Phase.ACTIVE;
              }
              void attempt() {
                  if (phase != Phase.ACTIVE) throw new IllegalStateException();
                  attempts++;
              }
              void close() {
                  if (phase != Phase.ACTIVE) throw new IllegalStateException();
                  phase = activePolicy.transition(Phase.CLOSED);
              }
              int attempts() { return attempts; }
              Phase phase() { return phase; }
          }
          public static void main(String[] args) {
              Session first = new Session(), second = new Session();
              first.activate(); second.activate();
              first.attempt(); first.attempt();
              if (first.attempts() != 2 || second.attempts() != 0)
                  throw new AssertionError("State leaked between sessions");
              first.close();
              if (first.phase() != Phase.CLOSED || second.phase() != Phase.ACTIVE)
                  throw new AssertionError("Transition affected another session");
          }
      }
      ~~~

      Kỳ vọng: hoạt động và đóng session đầu không làm đổi phase/attempts của session thứ hai. Không đặt mutable attempts trong singleton state policy.
  - situation: Một pattern Decorator được lồng qua nhiều tầng khiến stack trace không còn cho biết lớp nào thay đổi dữ liệu
      request.
    readmeRelated:
      anchorList:
      - composition-003
      - design-patterns-006
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-008
    resolve: Giảm decorator layers, đặt tên/tracing rõ; xác định trách nhiệm từng wrapper và giữ stack trace/cause khi bắt
      lỗi.
    knowledge: Decorator chain, observability và exception chaining.
    code: |-
      Giới hạn decorator vào các trách nhiệm rõ tên, đánh dấu trace theo lớp và giữ nguyên cause gốc. Trace cho thấy wrapper nào can thiệp.

      ~~~java
      import java.util.*;
      public class Case12 {
          record Request(String body) {}
          interface Handler { String handle(Request request); }
          static final class TrimDecorator implements Handler {
              final Handler next;
              final List<String> trace;
              TrimDecorator(Handler next, List<String> trace) {
                  this.next = next; this.trace = trace;
              }
              public String handle(Request request) {
                  trace.add("TrimDecorator");
                  return next.handle(new Request(request.body().trim()));
              }
          }
          static final class AuditDecorator implements Handler {
              final Handler next;
              final List<String> trace;
              AuditDecorator(Handler next, List<String> trace) {
                  this.next = next; this.trace = trace;
              }
              public String handle(Request request) {
                  trace.add("AuditDecorator");
                  try {
                      return next.handle(request);
                  } catch (RuntimeException e) {
                      throw new IllegalStateException("AuditDecorator failed", e);
                  }
              }
          }
          public static void main(String[] args) {
              List<String> trace = new ArrayList<>();
              IllegalArgumentException original = new IllegalArgumentException("bad payload");
              Handler terminal = request -> { throw original; };
              Handler chain = new AuditDecorator(new TrimDecorator(terminal, trace), trace);
              try {
                  chain.handle(new Request(" bad "));
                  throw new AssertionError("Expected failure");
              } catch (IllegalStateException wrapper) {
                  if (wrapper.getCause() != original) throw new AssertionError("Lost cause");
              }
              if (!trace.equals(List.of("AuditDecorator", "TrimDecorator")))
                  throw new AssertionError("Unknown wrapper sequence");
          }
      }
      ~~~

      Kỳ vọng: trace chỉ rõ chuỗi AuditDecorator -> TrimDecorator; cause ban đầu còn nguyên. Khi debug, đọc trace và wrapper exception để xác định điểm xử lý.
  - situation: Đội phát triển thay switch đơn giản bằng nhiều pattern trước khi có yêu cầu biến thể, khiến người mới khó sửa
      một quy tắc nhỏ.
    readmeRelated:
      anchorList:
      - oop-basic-008
      - abstraction-007
      - solid-008
      - design-patterns-001
      - design-patterns-013
      - refactoring-008
    resolve: Chỉ dùng pattern khi có variation/failure mode thực, so sánh chi phí lớp mới với switch đơn giản; bỏ speculative
      abstraction.
    knowledge: KISS, YAGNI và pattern trade-offs.
    code: |-
      Khi chỉ có quy tắc đơn giản và tập loại ổn định, switch trên enum làm hành vi dễ thấy hơn chuỗi class/factory chưa có nhu cầu biến thể. Thêm abstraction khi có bằng chứng yêu cầu thay thế.

      ~~~java
      public class Case13 {
          enum Shipping { PICKUP, STANDARD, EXPRESS }
          static int fee(Shipping shipping, int cents) {
              if (shipping == null || cents < 0)
                  throw new IllegalArgumentException();
              return switch (shipping) {
                  case PICKUP -> 0;
                  case STANDARD -> cents >= 1000 ? 0 : 50;
                  case EXPRESS -> 150;
              };
          }
          public static void main(String[] args) {
              if (fee(Shipping.PICKUP, 500) != 0) throw new AssertionError();
              if (fee(Shipping.STANDARD, 800) != 50) throw new AssertionError();
              if (fee(Shipping.STANDARD, 1000) != 0) throw new AssertionError();
              if (fee(Shipping.EXPRESS, 1000) != 150) throw new AssertionError();
              try {
                  fee(null, 100);
                  throw new AssertionError("Missing input check");
              } catch (IllegalArgumentException expected) {}
          }
      }
      ~~~

      Kỳ vọng: bốn contract test bảo vệ quy tắc gốc trong một hàm. Chưa có dấu hiệu plugin hay runtime variation nên việc thêm class Strategy/Factory chỉ làm tăng điểm cần bảo trì; đánh giá lại khi yêu cầu đổi.
- groupID: 10
  groupName: Domain model, aggregate và transaction
  cases:
  - situation: Một entity Customer dùng họ tên để định danh nên hai khách hàng trùng tên bị coi là cùng một bản ghi trong
      collection.
    readmeRelated:
      anchorList:
      - object-004
      - class-design-006
      - language-mechanics-006
      - design-pitfalls-009
      - practice-005
    resolve: Định nghĩa Customer equality theo customerId, tên là thuộc tính có thể trùng; kiểm thử nhiều customer cùng tên.
    knowledge: Entity identity, equals/hashCode và mutable attributes.
    code: |-
      ### Case 1 — Customer entity định danh bằng ID, không bằng họ tên

      **Sai:** dùng name để so hai entity, khiến hai khách hàng trùng tên bị gộp khi đưa vào Set. **Đúng:** dùng customerId bất biến làm identity; tên chỉ là thuộc tính nghiệp vụ, có thể trùng hoặc đổi.

      ~~~java
      import java.util.*;
      public class Case1 {
          record BadCustomer(String name) {}
          static final class Customer {
              private final String customerId;
              private String name;
              Customer(String id,String name) {
                  if(id==null || id.isBlank()) throw new IllegalArgumentException("id");
                  customerId=id;this.name=Objects.requireNonNull(name);
              }
              void rename(String value){name=Objects.requireNonNull(value);}
              @Override public boolean equals(Object other){
                  return this==other || other instanceof Customer c
                         && customerId.equals(c.customerId);
              }
              @Override public int hashCode(){return customerId.hashCode();}
          }
          static void check(boolean value){if(!value)throw new AssertionError();}
          public static void main(String[] args){
              Set<BadCustomer> wrong=new HashSet<>();
              wrong.add(new BadCustomer("An"));wrong.add(new BadCustomer("An"));
              check(wrong.size()==1); // Hai bản ghi khác bị gộp bởi tên.
              Customer a=new Customer("C1","An"),b=new Customer("C2","An");
              Set<Customer> good=new HashSet<>(List.of(a,b));
              check(good.size()==2);
              a.rename("Bình");
              check(good.contains(new Customer("C1","Bình")));
              check(!a.equals(b));
              System.out.println("PASS: stable Customer identity");
          }
      }
      ~~~

      **Kiểm chứng dự kiến:** biên dịch và chạy với Java 17, các assertion phân biệt trùng tên và đổi tên mà không mất identity. Cách này giả định customerId đã được cấp ổn định khi tạo entity; entity transient chưa có ID cần chính sách riêng, không dùng hash của ID sẽ thay đổi.
  - situation: Một entity mới chưa có database ID được đưa vào HashSet, rồi sau khi lưu và nhận ID thì phép contains trả false.
    readmeRelated:
      anchorList:
      - object-004
      - object-005
      - language-mechanics-006
      - design-pitfalls-009
      - testing-001
    resolve: Không dùng ID được gán sau khi lưu làm hash của object đã nằm trong Set; chọn identity ổn định hoặc tách key
      bất biến.
    knowledge: Transient entity identity, equals/hashCode và hash bucket invariants.
    code: |-
      ### Case 2 — ID cấp sau khi persist làm hỏng HashSet

      **Sai:** hashCode dựa vào databaseId còn null lúc mới tạo, sau persist ID được gán và bucket thay đổi. **Đúng:** đưa vào hashed collection bằng key không thay đổi, hoặc chỉ dùng ID ổn định đã cấp từ đầu.

      ~~~java
      import java.util.*;
      public class Case2 {
          static final class BadEntity {
              Long databaseId;
              @Override public boolean equals(Object other){
                  return this==other || other instanceof BadEntity e
                      && databaseId!=null && databaseId.equals(e.databaseId);
              }
              @Override public int hashCode(){return Objects.hashCode(databaseId);}
          }
          record EntityKey(UUID value){
              EntityKey{Objects.requireNonNull(value);}
          }
          static final class Entity {
              final EntityKey key;
              Long databaseId;
              Entity(EntityKey key){this.key=key;}
              @Override public boolean equals(Object other){
                  return this==other || other instanceof Entity e && key.equals(e.key);
              }
              @Override public int hashCode(){return key.hashCode();}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BadEntity wrong=new BadEntity();
              Set<BadEntity> broken=new HashSet<>();
              broken.add(wrong);
              int before=wrong.hashCode();
              wrong.databaseId=1L;
              check(before!=wrong.hashCode());
              // HashSet lookup sau mutate có thể không còn tìm được entry;
              // không phụ thuộc bucket collision để biến đây thành test bất ổn.
              Entity stable=new Entity(new EntityKey(UUID.randomUUID()));
              Set<Entity> good=new HashSet<>();
              good.add(stable);
              int hash=stable.hashCode();
              stable.databaseId=1L;
              check(stable.hashCode()==hash && good.contains(stable));
              System.out.println("PASS: hash key independent of generated DB id");
          }
      }
      ~~~

      **Kiểm chứng dự kiến:** kiểm tra hash thay đổi ở BadEntity, ổn định ở Entity và Set.contains còn đúng ở bản sửa. Không khẳng định BadEntity chắc chắn lookup thất bại trong mọi cấu hình hash collision. Nếu cần identity do DB cấp, tránh đưa transient entity vào Set trước khi lưu hoặc dùng khóa riêng bất biến.
  - situation: Hai địa chỉ có nội dung như nhau nhưng được so bằng reference nên ứng dụng tính chúng là hai địa điểm giao
      hàng khác nhau.
    readmeRelated:
      anchorList:
      - object-004
      - class-design-006
      - language-mechanics-006
      - practice-005
    resolve: Biểu diễn Address như immutable value object có equals/hashCode theo các thành phần chuẩn hóa; không so reference.
    knowledge: Value equality, records/value objects và normalization policy.
    code: |-
      ### Case 3 — Address là value object bất biến, so theo giá trị

      Hai địa chỉ có cùng nội dung không phải cùng reference. Record có equals/hashCode theo thành phần; chuẩn hóa cần là chính sách miền rõ ràng trước khi so.

      ~~~java
      import java.util.*;
      public class Case3 {
          static final class BadAddress {
              final String street,city;
              BadAddress(String street,String city){
                  this.street=street;this.city=city;
              }
          }
          record Address(String street,String city){
              Address{
                  street=normalize(street);
                  city=normalize(city);
              }
              static String normalize(String text){
                  if(text==null||text.isBlank())throw new IllegalArgumentException();
                  return text.trim().replaceAll("\\s+"," ").toLowerCase(Locale.ROOT);
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BadAddress a=new BadAddress("Số 1","Hà Nội");
              BadAddress b=new BadAddress("Số 1","Hà Nội");
              check(a!=b && !a.equals(b));
              Address x=new Address(" Số   1 "," HÀ NỘI");
              Address y=new Address("số 1","hà nội");
              check(x.equals(y));
              check(x.hashCode()==y.hashCode());
              check(new HashSet<>(List.of(x,y)).size()==1);
              try{new Address(" ","HN");throw new AssertionError();}
              catch(IllegalArgumentException expected){}
              System.out.println("PASS: normalized value equality");
          }
      }
      ~~~

      **Kiểm chứng dự kiến:** so reference sai ở BadAddress và so value đúng ở Address, bao gồm Set. Normalize ở ví dụ chỉ trim/collapse spaces/lowercase; địa chỉ production có quy tắc viết tắt, số nhà, dấu tiếng Việt và mã địa lý, không được tự coi cách này là chuẩn hóa địa chỉ đầy đủ.
  - situation: Một Money value object giữ amount dưới dạng double nên cộng dồn nhiều giao dịch cho ra sai số khi so sánh tổng.
    readmeRelated:
      anchorList:
      - class-008
      - class-design-006
      - language-mechanics-005
      - practice-005
    resolve: Dùng BigDecimal hoặc integer minor units cho tiền, xác định precision/rounding theo loại tiền và kiểm thử cộng
      dồn.
    knowledge: Money value object, binary floating-point và rounding policies.
    code: |-
      ### Case 4 — Money không dùng double cho phép cộng chính xác

      Double không biểu diễn chính xác nhiều số thập phân như 0.1 và 0.2. Money dùng BigDecimal nhận từ String, scale/currency nhất quán và không cho cộng khác đơn vị.

      ~~~java
      import java.math.*;
      public class Case4 {
          record Money(String currency,BigDecimal amount){
              Money{
                  if(currency==null||currency.isBlank()||amount==null)
                      throw new IllegalArgumentException();
                  amount=amount.setScale(2,RoundingMode.HALF_UP);
              }
              Money plus(Money other){
                  if(!currency.equals(other.currency))
                      throw new IllegalArgumentException("currency mismatch");
                  return new Money(currency,amount.add(other.amount));
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              double wrong=0.1+0.2;
              check(wrong!=0.3); // Sai số IEEE-754.
              Money a=new Money("USD",new BigDecimal("0.10"));
              Money b=new Money("USD",new BigDecimal("0.20"));
              Money total=a.plus(b);
              check(total.amount().equals(new BigDecimal("0.30")));
              Money sum=total.plus(new Money("USD",new BigDecimal("0.70")));
              check(sum.amount().equals(new BigDecimal("1.00")));
              try{a.plus(new Money("EUR",new BigDecimal("0.20")));
                  throw new AssertionError("cross-currency accepted");
              }catch(IllegalArgumentException expected){}
              System.out.println("PASS: precise Money addition");
          }
      }
      ~~~

      **Kiểm chứng dự kiến:** assertion cho double sai khác và BigDecimal cộng đúng, mismatch currency bị từ chối. Scale 2/HALF_UP chỉ là **quy ước ví dụ USD**, không phải quy định cho mọi tiền tệ; production cần scale theo currency, chính sách rounding theo nghiệp vụ và xử lý overflow/negative theo use case.
  - situation: Một aggregate cho phép caller sửa trực tiếp child entity, khiến tổng số lượng đơn hàng không còn đúng với danh
      sách item.
    readmeRelated:
      anchorList:
      - encapsulation-001
      - encapsulation-002
      - encapsulation-008
      - composition-007
      - class-design-007
      - testing-003
      - practice-002
    resolve: Ẩn child collection, mọi cập nhật qua aggregate root cập nhật/tính lại total và kiểm tra invariant trước commit.
    knowledge: Aggregate root, encapsulation và derived state.
    code: |-
      ### Case 5 — Aggregate root giữ tổng đơn hàng nhất quán

      **Sai:** caller lấy trực tiếp mutable child rồi sửa quantity, trong khi storedTotal không cập nhật. **Đúng:** Order quản lý item, trả immutable snapshot và tính total từ trạng thái nội bộ được validate.

      ~~~java
      import java.util.*;
      public class Case5 {
          static class BadItem {int qty;BadItem(int qty){this.qty=qty;}}
          static class BadOrder {
              final BadItem item=new BadItem(1);
              int storedTotal=100;
              BadItem item(){return item;}
          }
          record ItemView(String sku,int qty,long unitPrice){}
          static class Order {
              private final List<ItemView> items=new ArrayList<>();
              void add(String sku,int qty,long price){
                  if(sku==null||sku.isBlank()||qty<=0||price<0)
                      throw new IllegalArgumentException();
                  items.add(new ItemView(sku,qty,price));
              }
              List<ItemView> items(){return List.copyOf(items);}
              long total(){
                  long sum=0;
                  for(ItemView i:items)
                      sum=Math.addExact(sum,Math.multiplyExact(i.qty(),i.unitPrice()));
                  return sum;
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BadOrder broken=new BadOrder();
              broken.item().qty=3;
              check(broken.storedTotal!=broken.item().qty*100);
              Order valid=new Order();
              valid.add("A",2,100);
              check(valid.total()==200);
              try{valid.add("B",-1,50);throw new AssertionError();}
              catch(IllegalArgumentException expected){}
              try{valid.items().clear();throw new AssertionError();}
              catch(UnsupportedOperationException expected){}
              check(valid.total()==200 && valid.items().size()==1);
              System.out.println("PASS: aggregate derived total");
          }
      }
      ~~~

      **Kiểm chứng dự kiến:** sai lệch ở model cũ và total nhất quán sau đường lỗi ở model mới. Khi ghi aggregate vào DB phải bảo vệ version/transaction để tránh lost update; immutable snapshot ở Java không thay thế khóa giao dịch.
  - situation: Domain service gửi notification trước khi transaction hoàn tất nên người dùng nhận thông báo thành công dù
      database rollback.
    readmeRelated:
      anchorList:
      - class-design-004
      - modeling-007
      - design-patterns-010
      - testing-010
    resolve: Commit transaction trước khi phát side effect; dùng outbox để gửi notification sau commit, xử lý retry có kiểm
      soát.
    knowledge: Transaction boundary, transactional outbox và eventual consistency.
    code: |-
      ### Case 6 — Chỉ phát notification sau khi commit, qua outbox

      **Sai:** gửi thông báo trước commit; nếu thao tác DB rollback thì user nhận thành công sai. **Đúng ở mức thiết kế:** ghi order + outbox trong **cùng DB transaction**, worker phát sự kiện sau commit. Code sau là mô phỏng trong bộ nhớ cho flow, không phải transaction SQL thật.

      ~~~java
      import java.util.*;
      public class Case6 {
          record Event(String id,String orderId){}
          static class DatabaseSimulation {
              final Map<String,String> orders=new HashMap<>();
              final List<Event> outbox=new ArrayList<>();
              void commit(String orderId,boolean valid){
                  if(!valid)throw new IllegalArgumentException("rollback simulated");
                  orders.put(orderId,"PAID");
                  outbox.add(new Event("evt-"+orderId,orderId));
              }
          }
          static class Dispatcher {
              final Set<String> sent=new HashSet<>();
              void sendPending(DatabaseSimulation db,List<String> deliveries){
                  for(Event e:db.outbox){
                      if(sent.add(e.id()))deliveries.add(e.orderId());
                  }
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              DatabaseSimulation db=new DatabaseSimulation();
              List<String> mail=new ArrayList<>();
              try{db.commit("O1",false);throw new AssertionError();}
              catch(IllegalArgumentException expected){}
              check(db.orders.isEmpty()&&db.outbox.isEmpty()&&mail.isEmpty());
              db.commit("O1",true);
              check(mail.isEmpty()); // Chưa phát trước commit.
              Dispatcher sender=new Dispatcher();
              sender.sendPending(db,mail);
              check(mail.equals(List.of("O1")));
              System.out.println("PASS: simulated commit precedes notification");
          }
      }
      ~~~

      **Cách kiểm chứng thật:** integration test với DB: transaction ghi order + outbox, inject lỗi trước commit rồi assert cả hai bảng rollback; commit thành công mới cho worker gửi. Mô phỏng trên không chứng minh atomicity vì Map.put và List.add không phải một transaction. Lúc crash giữa send và đánh dấu đã gửi, consumer phải idempotent; không hứa exactly-once network delivery.
  - situation: Ứng dụng phát cùng một domain event nhiều lần khi retry request, làm số lượng email và lần trừ tồn kho bị nhân
      đôi.
    readmeRelated:
      anchorList:
      - modeling-007
      - design-patterns-010
      - testing-010
    resolve: Gán eventId/idempotency key, deduplicate consumer và kiểm soát retry để không gửi mail hay trừ kho nhiều lần.
    knowledge: At-least-once delivery, idempotent consumers và outbox.
    code: |-
      ### Case 7 — Consumer idempotent theo eventId dưới at-least-once delivery

      Retry có thể phát lại cùng event làm gửi email/trừ kho nhiều lần. Bảo vệ side effect bằng eventId đã xử lý, cùng transaction với thay đổi state. Bản minh họa chỉ mô phỏng logic tuần tự trong bộ nhớ.

      ~~~java
      import java.util.*;
      public class Case7 {
          record Event(String eventId,int units){}
          static class BrokenConsumer {
              int stock=10,emails;
              void handle(Event e){stock-=e.units();emails++;}
          }
          static class InventoryConsumer {
              int stock=10,emails;
              final Set<String> processed=new HashSet<>();
              void handle(Event e){
                  if(e.eventId()==null||e.eventId().isBlank()||e.units()<=0)
                      throw new IllegalArgumentException();
                  if(!processed.add(e.eventId()))return;
                  stock-=e.units();
                  emails++;
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Event same=new Event("E1",2);
              BrokenConsumer wrong=new BrokenConsumer();
              wrong.handle(same);wrong.handle(same);
              check(wrong.stock==6&&wrong.emails==2);
              InventoryConsumer good=new InventoryConsumer();
              good.handle(same);good.handle(same);
              check(good.stock==8&&good.emails==1&&good.processed.size()==1);
              good.handle(new Event("E2",1));
              check(good.stock==7&&good.emails==2);
              System.out.println("PASS: duplicate event ignored");
          }
      }
      ~~~

      **Kiểm chứng dự kiến:** cùng event xử lý hai lần nhưng inventory/email chỉ thay đổi một lần ở consumer có dedup. Trong production, việc insert processedId + điều chỉnh tồn kho phải có unique constraint và commit nguyên tử; không dùng Set in-memory cho nhiều process, và external email cần cơ chế idempotency/outbox riêng.
  - situation: Một luồng nghiệp vụ sửa hai aggregate ở hai database nhưng lại giả định một transaction cục bộ đủ bảo đảm tính
      nhất quán.
    readmeRelated:
      anchorList:
      - design-patterns-007
      - testing-003
    resolve: Dùng saga/compensation hoặc mô hình nhất quán cuối cùng giữa hai database; không giả định một local transaction
      phủ cả hai.
    knowledge: Distributed transactions, saga và consistency models.
    code: |-
      ### Case 8 — Hai database cần Saga và compensation, không chỉ local transaction

      Đặt vé ở DB A rồi ghi thanh toán ở DB B có thể thất bại giữa đường. Local transaction ở A không rollback thay B. Saga điều phối từng bước và compensation sau lỗi; mô phỏng này chỉ kiểm luồng, không giả lập distributed transaction.

      ~~~java
      public class Case8 {
          static class BookingStore {
              boolean reserved;
              void reserve(){reserved=true;}
              void release(){reserved=false;}
          }
          static class BillingStore {
              boolean charged;
              void charge(boolean available){
                  if(!available)throw new IllegalStateException("payment unavailable");
                  charged=true;
              }
          }
          static class Saga {
              private final BookingStore booking;
              private final BillingStore billing;
              Saga(BookingStore a,BillingStore b){booking=a;billing=b;}
              boolean execute(boolean paymentAvailable){
                  booking.reserve();
                  try {
                      billing.charge(paymentAvailable);
                      return true;
                  } catch(RuntimeException error) {
                      booking.release(); // Compensation cho bước đã thành công.
                      return false;
                  }
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BookingStore a=new BookingStore();
              BillingStore b=new BillingStore();
              Saga saga=new Saga(a,b);
              check(!saga.execute(false));
              check(!a.reserved&&!b.charged);
              check(saga.execute(true));
              check(a.reserved&&b.charged);
              System.out.println("PASS: compensating flow illustrated");
          }
      }
      ~~~

      **Kiểm chứng dự kiến:** thất bại thanh toán giải phóng đặt chỗ; đường thành công giữ cả hai thay đổi. Production Saga phải có persisted state, timeout, retries/idempotency, xác nhận compensation và xử lý lỗi compensation (có thể không hoàn tác tuyệt đối). Ví dụ không chứng minh atomic commit hai DB hay nhất quán ngay lập tức.
  - situation: Tầng controller web kiểm tra hạn hủy vé còn API mobile và batch đi đường khác, tạo ra kết quả hoàn tiền trái
      quy tắc.
    readmeRelated:
      anchorList:
      - encapsulation-005
      - class-design-004
      - class-design-007
      - solid-002
      - testing-003
      - practice-010
    resolve: Đưa chính sách hạn hủy/hoàn tiền vào domain/application use case chung; tất cả web/mobile/batch dùng cùng guard.
    knowledge: Business invariants, shared use cases và channel consistency.
    code: |-
      ### Case 9 — Một chính sách hạn hủy vé cho web/mobile/batch

      **Sai:** web check hạn hủy riêng, mobile/batch gọi trực tiếp thao tác cancel. **Đúng:** use case chung nhận thời điểm cố định và policy, tất cả entrypoint phải qua cùng guard.

      ~~~java
      import java.time.*;
      public class Case9 {
          record Ticket(String id,Instant departure,boolean cancelled){
              Ticket cancel(){return new Ticket(id,departure,true);}
          }
          static class CancelTicket {
              private final Duration cutoff=Duration.ofHours(24);
              Ticket cancel(Ticket ticket,Instant now){
                  if(ticket.cancelled())throw new IllegalStateException("already cancelled");
                  if(now.isAfter(ticket.departure().minus(cutoff)))
                      throw new IllegalStateException("cutoff passed");
                  return ticket.cancel();
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          static void reject(Runnable r){
              try{r.run();throw new AssertionError("cancel accepted");}
              catch(IllegalStateException expected){}
          }
          public static void main(String[] args){
              Instant dep=Instant.parse("2026-11-30T12:00:00Z");
              Ticket ticket=new Ticket("T1",dep,false);
              CancelTicket useCase=new CancelTicket();
              java.util.function.Function<Instant,Ticket> web=t->useCase.cancel(ticket,t);
              java.util.function.Function<Instant,Ticket> mobile=t->useCase.cancel(ticket,t);
              java.util.function.Function<Instant,Ticket> batch=t->useCase.cancel(ticket,t);
              Instant valid=dep.minus(Duration.ofHours(25));
              Instant tooLate=dep.minus(Duration.ofHours(23));
              check(web.apply(valid).cancelled()&&mobile.apply(valid).cancelled()
                    &&batch.apply(valid).cancelled());
              reject(()->web.apply(tooLate));
              reject(()->mobile.apply(tooLate));
              reject(()->batch.apply(tooLate));
              System.out.println("PASS: all channels share cancellation guard");
          }
      }
      ~~~

      **Kiểm chứng dự kiến:** ba entrypoint mô phỏng đều cho phép ở -25h và từ chối ở -23h. Đây là chính sách **giả định** cho ví dụ; thực tế phải kiểm hạng vé, timezone, refund amount, kiểm quyền và transaction chống hủy hai lần. Không tin thời gian do client gửi; lấy Clock của server ở use case.
  - situation: Một workflow đơn hàng có nhiều public setter độc lập khiến user có thể chuyển thẳng từ NEW sang REFUNDED dù
      chưa thanh toán.
    readmeRelated:
      anchorList:
      - encapsulation-008
      - encapsulation-009
      - modeling-008
      - design-patterns-009
      - testing-003
      - practice-002
    resolve: Thay setter bằng transition methods có guard, từ chối NEW→REFUNDED và kiểm thử state graph.
    knowledge: State machines, domain commands và legal transitions.
    code: |-
      ### Case 10 — State machine cấm NEW → REFUNDED

      Public setter cho phép bypass quy trình thanh toán. Thay bằng hành vi domain có guard: NEW→PAID→REFUNDED; trạng thái đơn đã refunded không thể trả lại PAID bằng setter.

      ~~~java
      public class Case10 {
          enum Status{NEW,PAID,REFUNDED}
          static class BrokenOrder{Status status=Status.NEW;}
          static class Order {
              private Status status=Status.NEW;
              Status status(){return status;}
              void recordPayment(){
                  if(status!=Status.NEW)throw new IllegalStateException("cannot pay");
                  status=Status.PAID;
              }
              void refund(){
                  if(status!=Status.PAID)throw new IllegalStateException("not paid");
                  status=Status.REFUNDED;
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          static void rejects(Runnable action){
              try{action.run();throw new AssertionError("invalid transition allowed");}
              catch(IllegalStateException expected){}
          }
          public static void main(String[] args){
              BrokenOrder bad=new BrokenOrder();
              bad.status=Status.REFUNDED;
              check(bad.status==Status.REFUNDED);
              Order valid=new Order();
              rejects(valid::refund);
              check(valid.status()==Status.NEW);
              valid.recordPayment();valid.refund();
              check(valid.status()==Status.REFUNDED);
              rejects(valid::recordPayment);
              rejects(valid::refund);
              System.out.println("PASS: guarded order transitions");
          }
      }
      ~~~

      **Kiểm chứng dự kiến:** đường sai chuyển trực tiếp, bản đúng chặn NEW→REFUNDED và cho chuỗi hợp lệ. Hàm refund ở ví dụ **chỉ đổi trạng thái**, không thực hiện refund qua gateway; production cần chống double refund, idempotency và ghi nhận giao dịch trước/sau bên ngoài đúng quy trình.
  - situation: Một entity ORM với lazy relationship được trả thẳng ra HTTP; serializer truy cập quan hệ khi session đã đóng
      và request thất bại.
    readmeRelated:
      anchorList:
      - abstraction-008
      - class-design-004
      - class-design-009
      - solid-006
    resolve: Map ORM entity sang DTO trong transaction phù hợp hoặc fetch chủ đích; không serialize trực tiếp lazy proxy khi
      session đóng.
    knowledge: ORM lazy loading, persistence boundary và API DTO.
    code: |-
      ### Case 11 — ORM lazy relation không nên thoát persistence boundary

      Nếu serializer HTTP truy cập lazy association sau khi session đóng, có thể ném lỗi. Mô phỏng lazy loader ném khi Session đóng, rồi trình bày cách tạo DTO trong boundary khi loader còn hợp lệ; không giả vờ đang dùng Hibernate thật.

      ~~~java
      import java.util.*;
      public class Case11 {
          static class Session {boolean open=true;void close(){open=false;}}
          static class LazyItems {
              final Session session;
              LazyItems(Session s){session=s;}
              List<String> get(){
                  if(!session.open)throw new IllegalStateException("lazy session closed");
                  return List.of("A","B");
              }
          }
          record OrderDto(String id,List<String> items){}
          static class OrderEntity {
              final String id;final LazyItems items;
              OrderEntity(String id,LazyItems items){this.id=id;this.items=items;}
          }
          static OrderDto mapWithinBoundary(OrderEntity entity){
              return new OrderDto(entity.id,List.copyOf(entity.items.get()));
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Session oldSession=new Session();
              OrderEntity bad=new OrderEntity("O1",new LazyItems(oldSession));
              oldSession.close();
              try{bad.items.get();throw new AssertionError();}
              catch(IllegalStateException expected){}
              Session goodSession=new Session();
              OrderEntity entity=new OrderEntity("O1",new LazyItems(goodSession));
              OrderDto dto=mapWithinBoundary(entity);
              goodSession.close();
              check(dto.id().equals("O1")&&dto.items().equals(List.of("A","B")));
              System.out.println("PASS: API DTO detached from lazy state");
          }
      }
      ~~~

      **Kiểm chứng dự kiến:** access entity sau close thất bại, DTO đã materialize vẫn đọc được. Khi dùng JPA/Hibernate thật, cần integration test với transaction/fetch graph phù hợp, kiểm N+1 và không lạm dụng Open Session in View. DTO ở đây không chứa entity/lazy proxy.
  - situation: Một domain object phụ thuộc vào thời gian hiện tại qua System.currentTimeMillis trong mọi method, khiến kết
      quả test thay đổi theo thời điểm chạy.
    readmeRelated:
      anchorList:
      - composition-006
      - testing-007
      - practice-010
    resolve: Inject Clock vào domain service hoặc truyền time theo use case; test thời điểm cố định, biên thời gian và timezone.
    knowledge: Time dependency injection, determinism và temporal boundaries.
    code: |-
      ### Case 12 — Inject Clock để kiểm thử thời gian quyết định

      Nếu domain gọi System.currentTimeMillis() trực tiếp thì logic hết hạn phụ thuộc lúc chạy test. Inject Clock để tạo thời điểm fixed, kiểm biên đúng lúc hết hạn và kiểm timezone khi chuyển sang ngày địa phương.

      ~~~java
      import java.time.*;
      public class Case12 {
          static class ExpiryService {
              private final Clock clock;
              ExpiryService(Clock clock){this.clock=clock;}
              boolean expired(Instant deadline){
                  if(deadline==null)throw new IllegalArgumentException("deadline");
                  return !Instant.now(clock).isBefore(deadline);
              }
              LocalDate today(){return LocalDate.now(clock);}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Instant now=Instant.parse("2026-11-01T00:00:00Z");
              Clock fixed=Clock.fixed(now,ZoneOffset.UTC);
              ExpiryService service=new ExpiryService(fixed);
              check(!service.expired(now.plusSeconds(1)));
              check(service.expired(now)); // Đúng thời điểm hết hạn.
              check(service.expired(now.minusSeconds(1)));
              check(service.today().equals(LocalDate.of(2026,11,1)));
              Clock hcm=Clock.fixed(now,ZoneId.of("Asia/Ho_Chi_Minh"));
              check(new ExpiryService(hcm).today().equals(LocalDate.of(2026,11,1)));
              try{service.expired(null);throw new AssertionError();}
              catch(IllegalArgumentException expected){}
              System.out.println("PASS: fixed Clock yields deterministic boundary");
          }
      }
      ~~~

      **Kiểm chứng dự kiến:** đầu vào cố định, test không phụ thuộc đồng hồ máy. Với thời điểm gần nửa đêm, UTC và Asia/Ho_Chi_Minh có thể cho LocalDate khác; chọn ZoneId theo quy tắc miền và không so date-only như Instant nếu dữ liệu mang ý nghĩa ngày lịch.
- groupID: 11
  groupName: Object contract, equality và generics
  cases:
  - situation: Một lớp sử dụng equality theo business key nhưng business key được phép sửa, làm các Map và Set chứa object
      trả kết quả sai.
    readmeRelated:
      anchorList:
      - object-004
      - object-005
      - language-mechanics-006
      - design-pitfalls-009
      - testing-001
    resolve: Dùng business ID không đổi cho hash/equality hoặc snapshot immutable key; tránh mutation khi object đang trong
      Map/Set.
    knowledge: Equality consistency, mutable keys và hashed collections.
    code: |-
      Giữ identity dùng cho equals/hashCode là ID bất biến. Những thuộc tính nghiệp vụ được phép đổi, như tên hiển thị, không được tham gia khóa hash của object đang nằm trong HashMap/HashSet.

      ~~~java
      import java.util.*;
      public class Demo1 {
        static final class Customer {
          private final String id;
          private String displayName;
          Customer(String id, String name) {
            this.id = Objects.requireNonNull(id);
            displayName = name;
          }
          void rename(String name) { displayName = name; }
          @Override public boolean equals(Object other) {
            return other instanceof Customer c && id.equals(c.id);
          }
          @Override public int hashCode() { return id.hashCode(); }
        }
        public static void main(String[] args) {
          Customer original = new Customer("C-1", "Before");
          Map<Customer,String> map = new HashMap<>();
          Set<Customer> set = new HashSet<>();
          map.put(original, "active"); set.add(original);
          int hashBefore = original.hashCode();
          original.rename("After");
          assert original.hashCode() == hashBefore;
          assert map.get(original).equals("active");
          assert map.get(new Customer("C-1", "Different name")).equals("active");
          assert set.contains(new Customer("C-1", "Alias"));
          assert set.size() == 1;
        }
      }
      ~~~

      Kiểm chứng: javac Demo1.java rồi java -ea Demo1. Một cách sai là dùng displayName trong equals/hashCode rồi gọi rename sau map.put: bucket được chọn theo hash cũ khiến lookup không đáng tin. Với business key có thể đổi, chọn ID ổn định hoặc khóa value snapshot bất biến.
  - situation: Một class override equals nhưng bỏ quên hashCode khiến hai key bằng nhau nằm ở các bucket khác nhau của HashMap.
    readmeRelated:
      anchorList:
      - object-004
      - language-mechanics-006
      - testing-001
      - practice-005
    resolve: Override equals và hashCode đồng bộ dựa cùng các field ổn định; kiểm thử HashMap put/get và hợp đồng equality.
    knowledge: equals/hashCode contract và Java hashed collections.
    code: |-
      Hai object bằng nhau phải có cùng hashCode. Override cả equals và hashCode dựa trên một bộ field ổn định; kiểm tra phản xạ, đối xứng, bắc cầu và hành vi HashMap.

      ~~~java
      import java.util.*;
      public class Demo2 {
        static final class ProductKey {
          private final String category, sku;
          ProductKey(String category, String sku) {
            this.category = Objects.requireNonNull(category);
            this.sku = Objects.requireNonNull(sku);
          }
          @Override public boolean equals(Object obj) {
            if (this == obj) return true;
            if (!(obj instanceof ProductKey other)) return false;
            return category.equals(other.category) && sku.equals(other.sku);
          }
          @Override public int hashCode() { return Objects.hash(category, sku); }
        }
        public static void main(String[] args) {
          ProductKey a = new ProductKey("BOOK", "42");
          ProductKey b = new ProductKey("BOOK", "42");
          ProductKey c = new ProductKey("BOOK", "42");
          ProductKey different = new ProductKey("BOOK", "43");
          assert a.equals(a);
          assert a.equals(b) && b.equals(a);
          assert b.equals(c) && a.equals(c);
          assert a.hashCode() == b.hashCode();
          assert !a.equals(different) && !a.equals(null);
          Map<ProductKey,Integer> price = new HashMap<>();
          price.put(a, 250);
          assert price.get(b) == 250;
          assert price.size() == 1;
        }
      }
      ~~~

      Kiểm chứng: javac Demo2.java và java -ea Demo2. Xóa override hashCode rồi kiểm lại contract: Object.hashCode theo identity thường khác giữa hai key equal, nên HashMap.get với key tương đương có thể thất bại. Đây là bằng chứng về hợp đồng, không dựa vào giả định hash cụ thể.
  - situation: Một cách override equals dùng instanceof trên superclass và getClass trên subclass làm tính đối xứng của phép
      bằng bị phá.
    readmeRelated:
      anchorList:
      - object-004
      - language-mechanics-006
      - testing-005
      - practice-005
    resolve: Chọn thống nhất getClass hoặc instanceof theo chính sách kế thừa; ưu tiên composition/value semantics khi subclass
      phá đối xứng.
    knowledge: Equality symmetry/transitivity và inheritance pitfalls.
    code: |-
      Việc base dùng instanceof còn subclass dùng getClass có thể phá tính đối xứng. Với value identity, bỏ inheritance của kiểu so sánh và dùng value object final chung.

      ~~~java
      import java.util.*;
      public class Demo3 {
        static class BadBase {
          final String id;
          BadBase(String id) { this.id = id; }
          @Override public boolean equals(Object other) {
            return other instanceof BadBase b && Objects.equals(id, b.id);
          }
          @Override public int hashCode() { return Objects.hashCode(id); }
        }
        static final class BadSubtype extends BadBase {
          BadSubtype(String id) { super(id); }
          @Override public boolean equals(Object other) {
            return other != null && other.getClass() == BadSubtype.class
                && super.equals(other);
          }
        }
        record Identity(String id) {}
        record NormalCustomer(Identity identity, String name) {}
        record PremiumCustomer(Identity identity, int tier) {}
        public static void main(String[] args) {
          BadBase base = new BadBase("X");
          BadBase subtype = new BadSubtype("X");
          assert base.equals(subtype);    // đường sai
          assert !subtype.equals(base);   // symmetry bị phá

          Identity sharedId = new Identity("X");
          NormalCustomer normal = new NormalCustomer(sharedId, "A");
          PremiumCustomer premium = new PremiumCustomer(sharedId, 2);
          assert normal.identity().equals(premium.identity());
          assert premium.identity().equals(normal.identity());
          assert !normal.equals(premium); // không đánh đồng hai loại object
        }
      }
      ~~~

      Kiểm chứng: javac Demo3.java và java -ea Demo3. Không so sánh bất đối xứng object thuộc hai subclass khác nhau. Khi muốn base và subtype cùng equality, phải định nghĩa chính sách nhất quán cho toàn hierarchy và kiểm cả symmetry/transitivity của mọi cặp type.
  - situation: Comparator chỉ so sánh tên sản phẩm khiến TreeSet loại bỏ các sản phẩm khác mã nhưng trùng tên.
    readmeRelated:
      anchorList:
      - language-mechanics-006
      - practice-005
    resolve: Thêm tie-breaker mã sản phẩm cho Comparator; chỉ trả 0 khi thật sự cùng khóa sorted collection.
    knowledge: Comparator ordering, TreeSet equivalence và consistent-with-equals.
    code: |-
      TreeSet coi compare(a,b)==0 là tương đương và sẽ loại một phần tử. Với name không duy nhất, thêm sku làm tie-breaker để hai sản phẩm trùng tên vẫn tồn tại.

      ~~~java
      import java.util.*;
      public class Demo4 {
        record Product(String name, String sku) {}
        public static void main(String[] args) {
          Product a = new Product("Bút", "SKU-1");
          Product b = new Product("Bút", "SKU-2");
          SortedSet<Product> broken =
            new TreeSet<>(Comparator.comparing(Product::name));
          broken.add(a); broken.add(b);
          assert broken.size() == 1; // lỗi nghiệp vụ: mất SKU thứ hai

          Comparator<Product> safeOrder = Comparator
            .comparing(Product::name)
            .thenComparing(Product::sku);
          SortedSet<Product> fixed = new TreeSet<>(safeOrder);
          fixed.add(a); fixed.add(b);
          assert fixed.size() == 2;
          assert fixed.contains(a) && fixed.contains(b);
          assert safeOrder.compare(a,b) != 0;
          assert safeOrder.compare(a,a) == 0;
          assert fixed.first().sku().equals("SKU-1");
        }
      }
      ~~~

      Kiểm chứng: javac Demo4.java và java -ea Demo4. Đảm bảo tên+SKU thật sự xác định equality nghiệp vụ của Product; nếu SKU là identity duy nhất, comparator nên thêm identity cuối cùng và tài liệu hóa thứ tự. Test cả trùng tên, hai mã khác nhau, và cùng mã.
  - situation: Một record chứa List mutable được xem là immutable và được chia sẻ qua API, nhưng caller sửa phần tử làm snapshot
      lịch sử thay đổi.
    readmeRelated:
      anchorList:
      - class-006
      - object-005
      - object-006
      - encapsulation-007
      - class-design-006
      - practice-005
    resolve: Tạo defensive copies của list và phần tử mutable ngay trong record constructor; chỉ expose immutable projections.
    knowledge: Records, shallow immutability và defensive copying.
    code: |-
      Record không tự deep-copy List hay nested mutable object. Chuyển các phần tử thành record bất biến và chụp snapshot List.copyOf trong canonical constructor, để nguồn lẫn caller không sửa lịch sử.

      ~~~java
      import java.util.*;
      public class Demo5 {
        static final class MutableLine {
          String sku; int quantity;
          MutableLine(String sku, int quantity) { this.sku=sku; this.quantity=quantity; }
        }
        record LineView(String sku, int quantity) {}
        record OrderSnapshot(List<LineView> lines) {
          OrderSnapshot {
            lines = List.copyOf(Objects.requireNonNull(lines));
          }
          static OrderSnapshot fromMutable(List<MutableLine> source) {
            List<LineView> projected = source.stream()
              .map(x -> new LineView(x.sku, x.quantity)).toList();
            return new OrderSnapshot(projected);
          }
        }
        public static void main(String[] args) {
          MutableLine original = new MutableLine("A", 2);
          List<MutableLine> source = new ArrayList<>(List.of(original));
          OrderSnapshot historical = OrderSnapshot.fromMutable(source);
          original.quantity = 99;
          source.add(new MutableLine("B", 1));
          assert historical.lines().equals(List.of(new LineView("A", 2)));
          try {
            historical.lines().add(new LineView("BAD", 1));
            throw new AssertionError("mutable result");
          } catch (UnsupportedOperationException expected) {}
          List<LineView> sourceViews = new ArrayList<>(List.of(new LineView("X", 3)));
          OrderSnapshot direct = new OrderSnapshot(sourceViews);
          sourceViews.clear();
          assert direct.lines().equals(List.of(new LineView("X", 3)));
        }
      }
      ~~~

      Kiểm chứng: javac Demo5.java và java -ea Demo5. Test thay đổi nested object nguồn, thay đổi list nguồn và thử thay list trả về. Nếu LineView chứa field kiểu mutable khác trong tương lai, phải deep-copy tiếp field đó.
  - situation: Phương thức toString duyệt cả graph object hai chiều khiến ghi log một node làm tràn stack.
    readmeRelated:
      anchorList:
      - relationships-006
      - language-mechanics-007
    resolve: Chặn duyệt vòng trong toString bằng ID/summary, không tự nối parent và children đệ quy vô hạn.
    knowledge: Object graph cycles, safe logging và StackOverflowError.
    code: |-
      Một node có parent và children hai chiều, nên toString không được đệ quy gọi toString của toàn graph. Chỉ ghi ID, parentId và số lượng children để giữ log ngắn và không tạo vòng lặp.

      ~~~java
      import java.util.*;
      public class Demo6 {
        static final class Node {
          final String id;
          Node parent;
          final List<Node> children = new ArrayList<>();
          Node(String id) { this.id = id; }
          void attach(Node child) {
            children.add(child);
            child.parent = this;
          }
          @Override public String toString() {
            return "Node{id='" + id + "', parentId=" +
              (parent == null ? "null" : parent.id) +
              ", childCount=" + children.size() + "}";
          }
        }
        public static void main(String[] args) {
          Node root = new Node("root"), child = new Node("child");
          root.attach(child); // root.children -> child.parent -> root là object cycle
          String a = root.toString();
          String b = child.toString();
          assert a.contains("childCount=1");
          assert b.contains("parentId=root");
          assert a.length() < 100 && b.length() < 100;
          assert !a.contains("Node{id='child'");
        }
      }
      ~~~

      Kiểm chứng: javac Demo6.java và java -ea Demo6. Với toString kiểu parent.toString()+children.toString(), chu trình sẽ chạy lặp cho tới StackOverflowError; không cố chạy đường sai trên môi trường production. Logging thực tế nên đặt giới hạn độ dài/trường cho object có graph lớn.
  - situation: Một toString của User tự động in token truy cập và số thẻ thanh toán vào log theo mỗi lần debug.
    readmeRelated:
      anchorList:
      - language-mechanics-007
    resolve: Không đưa secret/payment fields vào toString; dùng redaction, allowlist và test bảo vệ thông tin nhạy cảm trong
      log.
    knowledge: Information disclosure, structured logging và sensitive data handling.
    code: |-
      Không đưa token/PAN vào toString hay structured log. Xây allowlist các trường an toàn và kiểm thử log string không chứa secrets, ngay cả khi lập trình viên gọi println(user).

      ~~~java
      import java.util.*;
      public class Demo7 {
        static final class User {
          private final String id, role, accessToken, cardNumber;
          User(String id, String role, String token, String pan) {
            this.id=id; this.role=role; accessToken=token; cardNumber=pan;
          }
          Map<String,String> safeLogFields() {
            return Map.of("userId", id, "role", role);
          }
          @Override public String toString() {
            return "User{userId=" + id + ", role=" + role + "}";
          }
        }
        public static void main(String[] args) {
          String token = "tok-SECRET-123";
          String pan = "4111111111111111";
          User user = new User("U-1", "VIEWER", token, pan);
          String text = user.toString();
          String structured = user.safeLogFields().toString();
          assert text.contains("U-1") && structured.contains("VIEWER");
          assert !text.contains(token) && !text.contains(pan);
          assert !structured.contains(token) && !structured.contains(pan);
          assert !text.contains("accessToken") && !text.contains("cardNumber");
        }
      }
      ~~~

      Kiểm chứng: javac Demo7.java và java -ea Demo7. Khi tích hợp logger thực, test format JSON/layout và masking tại filter/appender để tránh object serializer hoặc log exception tự mở thêm trường. Không log token thô ngay cả lúc bắt lỗi.
  - situation: Một copy constructor chỉ copy các reference nested object, khiến người dùng chỉnh sửa bản sao và vô tình đổi
      bản gốc.
    readmeRelated:
      anchorList:
      - object-003
      - object-006
      - encapsulation-007
      - practice-005
    resolve: Deep copy những nested objects cần độc lập hoặc dùng immutable structures; kiểm thử sửa bản sao không đổi bản
      gốc.
    knowledge: Copy constructor, graph ownership và shallow/deep copy.
    code: |-
      Copy constructor phải tạo object mới cho các nested mutable object cần sở hữu riêng. Copy list chỉ đổi container mà không clone Address vẫn gây aliasing.

      ~~~java
      import java.util.*;
      public class Demo8 {
        static final class Address {
          String city;
          Address(String city) { this.city = city; }
          Address(Address other) { this.city = other.city; }
        }
        static final class Profile {
          private final List<Address> addresses;
          Profile(List<Address> input) {
            addresses = input.stream().map(Address::new).toList(); // deep copy elements
          }
          Profile(Profile other) { this(other.addresses); }
          void relocateFirst(String city) { addresses.get(0).city = city; }
          String firstCity() { return addresses.get(0).city; }
        }
        public static void main(String[] args) {
          Address external = new Address("Hanoi");
          List<Address> initial = new ArrayList<>(List.of(external));
          Profile original = new Profile(initial);
          Profile copy = new Profile(original);
          copy.relocateFirst("Danang");
          assert original.firstCity().equals("Hanoi");
          assert copy.firstCity().equals("Danang");
          external.city = "Hue";
          initial.clear();
          assert original.firstCity().equals("Hanoi");
          assert copy.firstCity().equals("Danang");
        }
      }
      ~~~

      Kiểm chứng: javac Demo8.java và java -ea Demo8. Nếu constructor chỉ dùng List.copyOf(input) mà Address còn mutable, sửa reference Address của copy sẽ ảnh hưởng bản gốc. Với graph chia sẻ/cycle phức tạp, thiết kế identity map khi deep-copy để bảo toàn liên kết.
  - situation: Một Generic Repository dùng Object cho kiểu trả về nên cast lỗi chỉ được phát hiện ở runtime.
    readmeRelated:
      anchorList:
      - language-mechanics-001
      - design-pitfalls-005
    resolve: Định nghĩa Repository<T,ID> và trả T/Optional<T> có generic type; loại cast runtime không an toàn.
    knowledge: Java generics, type safety và parametric polymorphism.
    code: |-
      Định nghĩa Repository<T, ID> với Optional<T> trả về đúng loại; caller không cần ép kiểu từ Object, nên lỗi sai kiểu được phát hiện ngay khi biên dịch.

      ~~~java
      import java.util.*;
      public class Demo9 {
        interface Repository<T, ID> {
          Optional<T> find(ID id);
          void save(ID id, T entity);
        }
        static final class MemoryRepository<T, ID> implements Repository<T, ID> {
          private final Map<ID, T> rows = new HashMap<>();
          public Optional<T> find(ID id) { return Optional.ofNullable(rows.get(id)); }
          public void save(ID id, T entity) { rows.put(id, entity); }
        }
        record Customer(String id, String name) {}
        static String customerName(Repository<Customer, String> repository, String id) {
          return repository.find(id).orElseThrow().name();
        }
        public static void main(String[] args) {
          Repository<Customer, String> customers = new MemoryRepository<>();
          customers.save("C1", new Customer("C1", "Mai"));
          assert customerName(customers, "C1").equals("Mai");
          assert customers.find("missing").isEmpty();
          // customers.save("C2", "not a Customer"); // lỗi compile-time
          // Integer wrong = customers.find("C1").orElseThrow(); // lỗi compile-time
        }
      }
      ~~~

      Kiểm chứng: javac Demo9.java và java -ea Demo9; bỏ comment một dòng sai kiểu phải khiến compiler từ chối. Cần tránh raw Repository vì raw type làm mất type safety và có thể dẫn đến ClassCastException.
  - situation: Một API generic nhận List của subtype nhưng caller kỳ vọng truyền trực tiếp List<Subtype> vào List<Supertype>,
      gây lỗi biên dịch.
    readmeRelated:
      anchorList:
      - subtyping-002
      - language-mechanics-001
      - language-mechanics-003
    resolve: Không gán List<Subtype> cho List<Supertype> vì invariant; dùng List<? extends Supertype> cho đọc, copy để ghi
      phù hợp.
    knowledge: Generic invariance, bounded wildcards và PECS.
    code: |-
      Generic List<T> trong Java là invariant. Dùng ? extends Animal cho API chỉ đọc từ List<Dog>; muốn thêm Animal khác thì copy sang List<Animal> độc lập.

      ~~~java
      import java.util.*;
      public class Demo10 {
        interface Animal { String sound(); }
        record Dog() implements Animal { public String sound() { return "woof"; } }
        record Cat() implements Animal { public String sound() { return "meow"; } }
        static String sounds(List<? extends Animal> source) {
          StringBuilder result = new StringBuilder();
          for (Animal a : source) result.append(a.sound()).append(";");
          return result.toString();
        }
        public static void main(String[] args) {
          List<Dog> dogs = new ArrayList<>(List.of(new Dog()));
          assert sounds(dogs).equals("woof;");
          // List<Animal> wrong = dogs; // không biên dịch: List<Dog> != List<Animal>
          List<Animal> writable = new ArrayList<>(dogs);
          writable.add(new Cat());
          assert sounds(writable).equals("woof;meow;");
          assert dogs.size() == 1;
          assert dogs.get(0).sound().equals("woof");
        }
      }
      ~~~

      Kiểm chứng: javac Demo10.java và java -ea Demo10. Bỏ comment dòng wrong phải báo incompatible types. Nếu cho phép gán trực tiếp, việc thêm Cat qua alias List<Animal> có thể làm List<Dog> chứa sai loại; wildcard đọc và copy loại bỏ rủi ro đó.
  - situation: Một wildcard API cho phép ghi dữ liệu vào collection chỉ để đọc khiến hợp đồng kiểu trở nên mơ hồ và compiler
      từ chối lời gọi.
    readmeRelated:
      anchorList:
      - subtyping-002
      - language-mechanics-002
      - language-mechanics-003
    resolve: Tách producer/consumer interface; với nguồn đọc dùng ? extends T, nơi ghi dùng ? super T; tránh yêu cầu ghi vào
      extends wildcard.
    knowledge: PECS, wildcard variance và type-safe collections.
    code: |-
      Quy tắc PECS: collection nguồn chỉ xuất dữ liệu dùng ? extends T (producer); nơi nhận để ghi dùng ? super T (consumer). Không thêm phần tử tùy ý vào nguồn extends.

      ~~~java
      import java.util.*;
      public class Demo11 {
        interface Animal { String name(); }
        record Dog(String name) implements Animal {}
        record Cat(String name) implements Animal {}
        static void copyAnimals(List<? extends Animal> source,
                                List<? super Animal> destination) {
          for (Animal item : source) destination.add(item);
          // source.add(new Dog("bad")); // lỗi compile: không thể add vào extends
        }
        public static void main(String[] args) {
          List<Dog> dogs = List.of(new Dog("Rex"), new Dog("Luna"));
          List<Animal> animals = new ArrayList<>();
          List<Object> audit = new ArrayList<>();
          copyAnimals(dogs, animals);
          copyAnimals(dogs, audit);
          assert animals.size() == 2;
          assert animals.get(0).name().equals("Rex");
          assert audit.size() == 2;
          assert audit.get(1).equals(new Dog("Luna"));
          animals.add(new Cat("Mimi"));
          assert dogs.size() == 2;
        }
      }
      ~~~

      Kiểm chứng: javac Demo11.java và java -ea Demo11; bỏ comment source.add phải bị compiler từ chối. Với List<? super Animal>, chỉ đọc an toàn thành Object nên consumer API không được giả định kiểu cụ thể ở đầu ra.
- groupID: 12
  groupName: Kiểm thử và refactoring an toàn
  cases:
  - situation: Một unit test kiểm tra chi tiết private helper qua reflection nên sau khi refactor hành vi không đổi mà hàng
      loạt test vẫn thất bại.
    readmeRelated:
      anchorList:
      - encapsulation-001
      - testing-008
      - refactoring-009
      - practice-010
    resolve: Viết unit tests theo public behavior/invariant, không phản chiếu private helper; giữ test ổn định khi implementation
      thay đổi.
    knowledge: Black-box testing, encapsulation và refactorability.
    code: |-
      Test qua public API thay vì phản chiếu tên private helper. Hai cách tổ chức nội bộ phải trả cùng kết quả cho cùng dữ liệu.

      ~~~java
      public class Case1 {
          static class Before {
              public int payable(int baseCents, int discountCents) {
                  if (baseCents < 0 || discountCents < 0 || discountCents > baseCents)
                      throw new IllegalArgumentException();
                  return calculate(baseCents, discountCents);
              }
              private int calculate(int base, int discount) { return base - discount; }
          }
          static class After {
              public int payable(int baseCents, int discountCents) {
                  if (baseCents < 0 || discountCents < 0 || discountCents > baseCents)
                      throw new IllegalArgumentException();
                  return Math.subtractExact(baseCents, discountCents);
              }
              // Không còn private calculate().
          }
          static void contract(int expected, int base, int discount) {
              if (new Before().payable(base, discount) != expected)
                  throw new AssertionError("Old behavior changed");
              if (new After().payable(base, discount) != expected)
                  throw new AssertionError("Refactor changed public behavior");
          }
          public static void main(String[] args) {
              contract(800, 1000, 200);
              contract(0, 100, 100);
              for (boolean after : new boolean[] {false, true}) {
                  try {
                      if (after) new After().payable(100, 200);
                      else new Before().payable(100, 200);
                      throw new AssertionError("Expected validation error");
                  } catch (IllegalArgumentException expected) {}
              }
          }
      }
      ~~~

      Kỳ vọng: cả trước/sau refactor trả 800 và 0, cùng từ chối giảm giá quá mức; tên/chữ ký private helper có thể thay đổi mà test vẫn đạt.
  - situation: Một kiểm thử chỉ xác nhận mock được gọi đúng số lần nhưng không phát hiện object cuối cùng vi phạm invariant.
    readmeRelated:
      anchorList:
      - encapsulation-002
      - testing-001
      - testing-008
      - testing-010
    resolve: Thêm assertion về state và outcome của object; chỉ verify mock interactions khi tương tác là một phần contract
      observable.
    knowledge: Behavioral tests, invariants và over-mocking.
    code: |-
      Mock interaction count không chứng minh invariant. Fake repository ghi hành vi tương tác, nhưng test còn kiểm số dư và trạng thái cuối; sai lệch không bị che bởi số lần gọi.

      ~~~java
      public class Case2 {
          interface AccountRepository {
              void save(Account account);
          }
          static class Account {
              private int balance;
              Account(int balance) { this.balance = balance; }
              int balance() { return balance; }
              void debit(int cents) {
                  if (cents <= 0 || cents > balance)
                      throw new IllegalArgumentException("Invalid debit");
                  balance -= cents;
              }
          }
          static class SpyRepository implements AccountRepository {
              int saves;
              int persistedBalance = -1;
              public void save(Account a) {
                  saves++;
                  persistedBalance = a.balance();
              }
          }
          static class TransferService {
              private final AccountRepository repository;
              TransferService(AccountRepository repository) { this.repository = repository; }
              void withdraw(Account account, int cents) {
                  account.debit(cents);
                  repository.save(account);
              }
          }
          public static void main(String[] args) {
              SpyRepository spy = new SpyRepository();
              Account account = new Account(1000);
              TransferService service = new TransferService(spy);
              service.withdraw(account, 250);
              if (spy.saves != 1) throw new AssertionError("Interaction contract");
              if (account.balance() != 750 || spy.persistedBalance != 750)
                  throw new AssertionError("State invariant");
              try {
                  service.withdraw(account, 800);
                  throw new AssertionError("Invalid withdrawal accepted");
              } catch (IllegalArgumentException expected) {}
              if (spy.saves != 1 || account.balance() != 750)
                  throw new AssertionError("Failure must not persist or mutate");
          }
      }
      ~~~

      Kỳ vọng: sau rút 250, số dư object và persisted snapshot đều là 750; rút 800 bị từ chối mà trạng thái và số lần save không đổi.
  - situation: Hai implementation cùng interface vượt qua unit test riêng nhưng phản hồi khác nhau với null input và exception,
      gây lỗi khi thay thế.
    readmeRelated:
      anchorList:
      - abstraction-004
      - interface-008
      - subtyping-007
      - solid-004
      - testing-004
      - testing-005
    resolve: Tạo shared contract suite chạy trên mọi implementation, phủ null, exceptions, edge cases và side effects theo
      một spec.
    knowledge: Contract tests, LSP và semantic compatibility.
    code: |-
      Cùng một contract suite chạy trên mọi implementation, khóa null, exception type, biên 0, giá trị hợp lệ và tính lặp lại không gây side effect.

      ~~~java
      import java.util.List;
      public class Case3 {
          record Shipment(int weightGrams, boolean express) {}
          interface ShippingPrice { int price(Shipment shipment); }
          static class BranchCalculator implements ShippingPrice {
              public int price(Shipment shipment) {
                  if (shipment == null || shipment.weightGrams() < 0)
                      throw new IllegalArgumentException("Invalid shipment");
                  int base = shipment.weightGrams() == 0 ? 0 : 100;
                  return base + (shipment.express() ? 50 : 0);
              }
          }
          static class RuleCalculator implements ShippingPrice {
              public int price(Shipment shipment) {
                  if (shipment == null || shipment.weightGrams() < 0)
                      throw new IllegalArgumentException("Invalid shipment");
                  return (shipment.weightGrams() > 0 ? 100 : 0)
                      + (shipment.express() ? 50 : 0);
              }
          }
          static void expectInvalid(ShippingPrice price, Shipment input) {
              try {
                  price.price(input);
                  throw new AssertionError("Must throw IllegalArgumentException");
              } catch (IllegalArgumentException expected) {}
          }
          static void contract(ShippingPrice price) {
              for (Shipment s : List.of(
                  new Shipment(0, false), new Shipment(0, true),
                  new Shipment(1, false), new Shipment(1, true))) {
                  int expected = (s.weightGrams() > 0 ? 100 : 0)
                      + (s.express() ? 50 : 0);
                  if (price.price(s) != expected) throw new AssertionError("Boundary");
                  if (price.price(s) != price.price(s))
                      throw new AssertionError("Unexpected state/side effect");
              }
              expectInvalid(price, null);
              expectInvalid(price, new Shipment(-1, false));
          }
          public static void main(String[] args) {
              contract(new BranchCalculator());
              contract(new RuleCalculator());
          }
      }
      ~~~

      Kỳ vọng: hai implementation cùng trả 0/50/100/150 và cùng ném IllegalArgumentException cho null hoặc số âm. Shared suite phát hiện thay đổi behavior khi thay implementation.
  - situation: Một method dài trong OrderService trộn validation, tính phí, update trạng thái và persistence nhưng thiếu regression
      test nên developer sợ tách trách nhiệm.
    readmeRelated:
      anchorList:
      - class-design-001
      - class-design-004
      - solid-002
      - testing-009
      - refactoring-003
      - refactoring-009
    resolve: Bổ sung characterization/regression tests trước khi chia OrderService, tách validation/pricing/state/persistence
      theo từng thay đổi nhỏ.
    knowledge: Safe refactoring, characterization tests và SRP.
    code: |-
      Ghi characterization tests cho cả nhánh thành công và nhánh lỗi trước khi tách OrderService. Refactor theo từng responsibility nhưng giữ public outcome và thứ tự ghi.

      ~~~java
      import java.util.*;
      public class Case4 {
          record Order(int subtotalCents, int discountCents) {}
          record Outcome(int totalCents, String state) {}
          interface Store { void save(Outcome outcome); }
          static class MemoryStore implements Store {
              final List<Outcome> saved = new ArrayList<>();
              public void save(Outcome out) { saved.add(out); }
          }
          static class OldOrderService {
              private final Store store;
              OldOrderService(Store store) { this.store = store; }
              Outcome checkout(Order order) {
                  if (order.subtotalCents() < 0 || order.discountCents() < 0
                      || order.discountCents() > order.subtotalCents())
                      throw new IllegalArgumentException();
                  int total = order.subtotalCents() - order.discountCents();
                  Outcome result = new Outcome(total, "PAID");
                  store.save(result);
                  return result;
              }
          }
          static class Validator {
              void verify(Order order) {
                  if (order.subtotalCents() < 0 || order.discountCents() < 0
                      || order.discountCents() > order.subtotalCents())
                      throw new IllegalArgumentException();
              }
          }
          static class Pricing { int total(Order order) {
              return order.subtotalCents() - order.discountCents();
          }}
          static class RefactoredOrderService {
              private final Validator validator = new Validator();
              private final Pricing pricing = new Pricing();
              private final Store store;
              RefactoredOrderService(Store store) { this.store = store; }
              Outcome checkout(Order order) {
                  validator.verify(order);
                  Outcome result = new Outcome(pricing.total(order), "PAID");
                  store.save(result);
                  return result;
              }
          }
          public static void main(String[] args) {
              for (Order order : List.of(new Order(1000, 200), new Order(0, 0))) {
                  MemoryStore oldStore = new MemoryStore(), newStore = new MemoryStore();
                  Outcome before = new OldOrderService(oldStore).checkout(order);
                  Outcome after = new RefactoredOrderService(newStore).checkout(order);
                  if (!before.equals(after) || !oldStore.saved.equals(newStore.saved))
                      throw new AssertionError("Behavior changed");
              }
              MemoryStore store = new MemoryStore();
              try {
                  new RefactoredOrderService(store).checkout(new Order(100, 200));
                  throw new AssertionError("Bad order accepted");
              } catch (IllegalArgumentException expected) {}
              if (!store.saved.isEmpty()) throw new AssertionError("Wrote invalid order");
          }
      }
      ~~~

      Kỳ vọng: trước/sau refactor trả cùng Outcome và cùng dữ liệu persisted trong fake store; order giảm giá sai không phát sinh write. Tách nhỏ có regression gate cho từng bước.
  - situation: Một chức năng được refactor sang composition nhưng delegation vô tình bỏ qua kiểm tra quyền vốn nằm trong superclass
      cũ.
    readmeRelated:
      anchorList:
      - abstraction-004
      - subtyping-007
      - composition-008
      - solid-004
      - testing-009
      - refactoring-007
    resolve: Giữ permission guard khi chuyển sang delegation, đặt ở boundary duy nhất và viết regression test cho unauthorized/authorized.
    knowledge: Delegation, security invariants và behavior preservation.
    code: |-
      Chuyển inheritance sang composition phải giữ permission guard ở public boundary trước khi delegate. Test unauthorized và authorized, đồng thời kiểm không có write khi bị từ chối.

      ~~~java
      import java.util.*;
      public class Case5 {
          record User(boolean canEdit) {}
          interface Repository { void update(String value); }
          static class MemoryRepository implements Repository {
              final List<String> writes = new ArrayList<>();
              public void update(String value) { writes.add(value); }
          }
          static class LegacyBase {
              protected final Repository repository;
              LegacyBase(Repository repository) { this.repository = repository; }
              public final void update(User user, String value) {
                  if (!user.canEdit()) throw new SecurityException("Forbidden");
                  doUpdate(value);
              }
              protected void doUpdate(String value) { repository.update(value); }
          }
          static class OldEditor extends LegacyBase {
              OldEditor(Repository repository) { super(repository); }
          }
          interface Writer { void write(String value); }
          static class NewEditor {
              private final Writer delegate;
              NewEditor(Writer delegate) { this.delegate = delegate; }
              public void update(User user, String value) {
                  if (!user.canEdit()) throw new SecurityException("Forbidden");
                  delegate.write(value);
              }
          }
          public static void main(String[] args) {
              MemoryRepository legacy = new MemoryRepository(), modern = new MemoryRepository();
              OldEditor before = new OldEditor(legacy);
              NewEditor after = new NewEditor(modern::update);
              for (int i = 0; i < 2; i++) {
                  try {
                      if (i == 0) before.update(new User(false), "secret");
                      else after.update(new User(false), "secret");
                      throw new AssertionError("Unauthorized edit allowed");
                  } catch (SecurityException expected) {}
              }
              if (!legacy.writes.isEmpty() || !modern.writes.isEmpty())
                  throw new AssertionError("Denied call performed write");
              before.update(new User(true), "allowed");
              after.update(new User(true), "allowed");
              if (!legacy.writes.equals(modern.writes)
                  || !modern.writes.equals(List.of("allowed")))
                  throw new AssertionError("Permission contract changed");
          }
      }
      ~~~

      Kỳ vọng: unauthorized luôn bị từ chối mà không ghi; authorized ghi một giá trị như trước. Không expose Writer trực tiếp cho caller bỏ qua boundary phân quyền.
  - situation: Một đội chuyển từ procedural code sang nhiều domain object trong một lần thay đổi lớn nên khó xác định bước
      nào làm sai nghiệp vụ.
    readmeRelated:
      anchorList:
      - oop-basic-006
      - solid-008
      - testing-009
      - refactoring-009
      - practice-007
    resolve: Chuyển từng use case, giữ golden-master/characterization tests và điểm rollback nhỏ; tránh thay toàn bộ model
      trong một commit.
    knowledge: Incremental refactoring, regression safety và change isolation.
    code: |-
      Chuyển đổi tuần tự từng use case, dùng golden-master làm oracle. Giữ đường xử lý chưa chuyển ở implementation cũ, so sánh đầu ra mới với fixture cố định.

      ~~~java
      import java.util.*;
      public class Case6 {
          record Request(String operation, int cents, boolean vip) {}
          static class Legacy {
              String process(Request r) {
                  if (r.cents() < 0) return "ERR:NEGATIVE";
                  if ("BUY".equals(r.operation())) {
                      int due = r.vip() ? r.cents() * 9 / 10 : r.cents();
                      return "PAID:" + due;
                  }
                  if ("REFUND".equals(r.operation())) return "REFUNDED:" + r.cents();
                  return "ERR:UNKNOWN";
              }
          }
          interface Operation { String execute(Request r); }
          static class BuyOperation implements Operation {
              public String execute(Request r) {
                  int due = r.vip() ? r.cents() * 9 / 10 : r.cents();
                  return "PAID:" + due;
              }
          }
          static class Router {
              private final Legacy old = new Legacy();
              private final Operation newBuy = new BuyOperation();
              String process(Request r) {
                  if (r.cents() < 0) return "ERR:NEGATIVE";
                  if ("BUY".equals(r.operation())) return newBuy.execute(r);
                  return old.process(r); // Chưa migrate REFUND.
              }
          }
          public static void main(String[] args) {
              Legacy legacy = new Legacy();
              Router candidate = new Router();
              Map<Request, String> golden = new LinkedHashMap<>();
              golden.put(new Request("BUY", 1000, false), "PAID:1000");
              golden.put(new Request("BUY", 1000, true), "PAID:900");
              golden.put(new Request("BUY", 0, true), "PAID:0");
              golden.put(new Request("REFUND", 500, false), "REFUNDED:500");
              golden.put(new Request("BUY", -1, false), "ERR:NEGATIVE");
              golden.put(new Request("OTHER", 10, false), "ERR:UNKNOWN");
              for (var entry : golden.entrySet()) {
                  String expected = entry.getValue();
                  if (!expected.equals(legacy.process(entry.getKey())))
                      throw new AssertionError("Golden baseline drifted");
                  if (!expected.equals(candidate.process(entry.getKey())))
                      throw new AssertionError("Incremental refactor regressed: " + entry.getKey());
              }
          }
      }
      ~~~

      Kỳ vọng: BUY dùng domain object mới, REFUND vẫn dùng code cũ; cả sáu fixture cho kết quả cố định. Migrate use case tiếp theo trong thay đổi riêng sau khi test đạt.
  - situation: Một refactoring chuyển method sang class khác làm thay đổi thứ tự side effect, khiến callback chạy trước khi
      trạng thái dữ liệu hoàn tất.
    readmeRelated:
      anchorList:
      - class-005
      - object-009
      - modeling-007
      - testing-009
      - testing-010
      - refactoring-004
    resolve: Ghi rõ thứ tự side effect theo contract, validate/commit trước callback; test thứ tự và đường lỗi sau Move Method.
    knowledge: Refactoring semantics, observable side effects và sequencing.
    code: |-
      Thứ tự side effect là contract: validate -> persist/commit -> callback. Test fake store ghi thứ tự và mô phỏng đường lỗi; callback không thấy trạng thái chưa được lưu.

      ~~~java
      import java.util.*;
      public class Case7 {
          static class Order {
              boolean committed;
          }
          interface Store { void commit(Order order); }
          interface Listener { void onCommitted(Order order); }
          static class RefactoredService {
              private final Store store;
              private final Listener listener;
              private final List<String> events;
              RefactoredService(Store store, Listener listener, List<String> events) {
                  this.store = store; this.listener = listener; this.events = events;
              }
              void execute(Order order, String input) {
                  events.add("validate");
                  if (input == null || input.isBlank()) throw new IllegalArgumentException();
                  store.commit(order);
                  listener.onCommitted(order);
              }
          }
          public static void main(String[] args) {
              List<String> success = new ArrayList<>();
              Store goodStore = order -> {
                  success.add("commit");
                  order.committed = true;
              };
              Listener cb = order -> {
                  success.add("callback");
                  if (!order.committed) throw new AssertionError("Callback before commit");
              };
              new RefactoredService(goodStore, cb, success).execute(new Order(), "ok");
              if (!success.equals(List.of("validate", "commit", "callback")))
                  throw new AssertionError("Wrong event order");
              List<String> failure = new ArrayList<>();
              Store broken = order -> {
                  failure.add("commit");
                  throw new IllegalStateException("Store unavailable");
              };
              new RefactoredService(broken, order -> failure.add("callback"), failure);
              try {
                  new RefactoredService(broken, order -> failure.add("callback"), failure)
                      .execute(new Order(), "ok");
                  throw new AssertionError("Expected persistence error");
              } catch (IllegalStateException expected) {}
              if (!failure.equals(List.of("validate", "commit")))
                  throw new AssertionError("Callback fired on failure");
          }
      }
      ~~~

      Kỳ vọng: thành công theo thứ tự validate, commit, callback; commit lỗi thì không callback. Đây là fake in-memory để chứng minh trình tự; database thật cần transaction/outbox bảo đảm semantics khi crash.
  - situation: Một test khởi động toàn bộ Spring context để kiểm tra object tính tiền đơn giản, làm bộ unit test chạy quá
      lâu và phụ thuộc môi trường.
    readmeRelated:
