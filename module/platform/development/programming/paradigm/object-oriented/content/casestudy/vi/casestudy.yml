    knowledge: Interface semantic contracts, nullability và LSP.
    code: |-
      ### Case 2 — Hai repository phải tuân thủ cùng not-found contract

      **Lỗi gốc:** adapter A trả null, adapter B ném exception khi ID không tồn tại. **Quy tắc chung:** \`find(id)\` trả \`Optional.empty()\` cho ID hợp lệ nhưng chưa có bản ghi; null/blank là lỗi input tường minh.

      ~~~java
      import java.util.*;

      public class Case2 {
          record Order(String id) {}
          interface OrderLookup { Optional<Order> find(String id); }
          static final class MemoryLookup implements OrderLookup {
              private final Map<String, Order> data = Map.of("O1", new Order("O1"));
              public Optional<Order> find(String id) {
                  if (id == null || id.isBlank())
                      throw new IllegalArgumentException("id");
                  return Optional.ofNullable(data.get(id));
              }
          }
          static final class RemoteLookup implements OrderLookup {
              public Optional<Order> find(String id) {
                  if (id == null || id.isBlank())
                      throw new IllegalArgumentException("id");
                  // Fake remote result: chỉ O1 có dữ liệu.
                  return "O1".equals(id) ? Optional.of(new Order("O1"))
                                          : Optional.empty();
              }
          }
          static void contract(OrderLookup lookup) {
              if (!lookup.find("O1").orElseThrow().id().equals("O1"))
                  throw new AssertionError("found result");
              if (lookup.find("MISSING").isPresent())
                  throw new AssertionError("missing result");
              try {
                  lookup.find(null);
                  throw new AssertionError("null accepted");
              } catch (IllegalArgumentException expected) { }
          }
          public static void main(String[] args) {
              contract(new MemoryLookup());
              contract(new RemoteLookup());
              System.out.println("PASS: identical Optional semantics");
          }
      }
      ~~~

      **Kiểm chứng:** chạy \`Case2.java\`; cùng một contract test bao phủ found/missing/invalid cho cả hai implementation. Không gọi HTTP thật; adapter production còn phải phân biệt 404, timeout và lỗi 5xx, không biến mọi lỗi hạ tầng thành Optional.empty.
