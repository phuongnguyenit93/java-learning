    resolve: Bỏ factory/locator/interface dự phòng nếu chỉ có một luồng xuất CSV; dùng hàm có hợp đồng rõ và test độc lập.
    knowledge: YAGNI, KISS, trade-off của abstraction và simplicity.
    code: |-
      ### Case 12 — Xuất CSV đơn giản không cần factory và locator

      Với một tác vụ CSV duy nhất, một function thuần với hợp đồng rõ dễ kiểm hơn hệ thống nhiều interface. Vẫn cần xử lý dấu phẩy, dấu nháy và newline để tránh CSV sai cấu trúc.

      ~~~java
      import java.util.*;

      public class Case12 {
          record Row(String customer, long amount) {}
          static String quoteCsv(String field) {
              if (field == null) throw new IllegalArgumentException("customer");
              return "\"" + field.replace("\"", "\"\"") + "\"";
          }
          static String export(List<Row> rows) {
              StringBuilder out = new StringBuilder("customer,amount\r\n");
              for (Row row : rows) {
                  out.append(quoteCsv(row.customer())).append(',')
                     .append(row.amount()).append("\r\n");
              }
              return out.toString();
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              String actual = export(List.of(
                  new Row("An", 100),
                  new Row("B, \"VIP\"", 200),
                  new Row("Dòng 1\nDòng 2", 300)
              ));
              String expected = "customer,amount\r\n"
                  + "\"An\",100\r\n"
                  + "\"B, \"\"VIP\"\"\",200\r\n"
                  + "\"Dòng 1\nDòng 2\",300\r\n";
              check(actual.equals(expected));
              try {
                  export(java.util.Collections.singletonList(new Row(null, 1)));
                  throw new AssertionError("null accepted");
              } catch (IllegalArgumentException expectedError) { }
              System.out.println("PASS: CSV quoted, escaped, no factory required");
          }
      }
      ~~~

      **Bằng chứng:** `javac Case12.java`, `java Case12`; test bao phủ các trường hợp dễ gây lỗi CSV và input null. Nếu CSV được mở trong spreadsheet, cần chính sách riêng về *formula injection* và encoding theo client; ví dụ này chỉ kiểm chứng escape CSV cơ bản, không khẳng định an toàn cho mọi phần mềm nhập liệu.
