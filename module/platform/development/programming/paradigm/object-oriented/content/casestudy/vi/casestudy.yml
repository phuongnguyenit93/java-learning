    knowledge: Cache invalidation, derived state và object invariants.
    code: |-
      ### Case 10 — Cache dẫn xuất phải invalidation khi aggregate thay đổi

      Cache \`total\` được tạo từ các quantity. Nếu thay đổi quantity mà không xóa cache, caller đọc giá trị cũ. Bọc collection trong aggregate, invalidation tại mọi mutation và kiểm consistency sau mỗi update.

      ~~~java
      import java.util.*;
      public class Case10 {
          static final class BadOrder {
              final Map<String,Integer> qty=new HashMap<>();
              Integer cachedTotal;
              int total(){
                  if(cachedTotal==null)
                      cachedTotal=qty.values().stream().mapToInt(Integer::intValue).sum();
                  return cachedTotal;
              }
              void set(String sku,int count){qty.put(sku,count);} // Quên invalidation.
          }
          static final class Order {
              private final Map<String,Integer> qty=new HashMap<>();
              private Integer cachedTotal;
              synchronized void setQuantity(String sku,int count){
                  if(sku==null||sku.isBlank()||count<0)
                      throw new IllegalArgumentException();
                  qty.put(sku,count);
                  cachedTotal=null; // Invalidate cùng mutation.
              }
              synchronized int total(){
                  if(cachedTotal==null)
                      cachedTotal=qty.values().stream().mapToInt(Integer::intValue).sum();
                  return cachedTotal;
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BadOrder broken=new BadOrder();
              broken.set("A",1);
              check(broken.total()==1);
              broken.set("A",3);
              check(broken.total()==1); // Stale cache.
              Order good=new Order();
              good.setQuantity("A",1);
              check(good.total()==1);
              good.setQuantity("A",3);
              check(good.total()==3);
              good.setQuantity("B",2);
              check(good.total()==5);
              try{
                  good.setQuantity("B",-1);
                  throw new AssertionError("negative accepted");
              }catch(IllegalArgumentException expected){}
              check(good.total()==5);
              System.out.println("PASS: derived cache consistent after mutation");
          }
      }
      ~~~

      **Kiểm chứng:** thay A và B tạo kết quả mới, update không hợp lệ giữ state cũ. Ở đây \`synchronized\` bảo vệ cùng lúc collection và cache khi đọc/ghi; với nhiều dẫn xuất khác phải xác định dependency và invalidation tương ứng. Trong hệ thống phân tán, cache giữa nhiều node cần event/version/TTL và test consistency riêng.
