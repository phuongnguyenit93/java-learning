    code: |-
      ### Case 14 — JSON/DTO không được bypass domain invariant

      Một deserializer có thể dựng DTO thiếu/âm amount mà không đi qua constructor entity miền. Cấm dùng DTO như domain object; luôn map qua factory/constructor có validation. Đây là test **boundary DTO → domain**, không giả vờ đã chạy Jackson hay parser JSON nào.

      ~~~java
      public class Case14 {
          // Dạng dữ liệu mà JSON binding có thể cung cấp từ input bên ngoài.
          record PaymentDto(String reference, long amountMinor) {}
          static final class BrokenPayment {
              public String reference;
              public long amount;
              BrokenPayment() {} // Object rỗng, field có default value.
          }
          record Payment(String reference, long amountMinor) {
              Payment {
                  if (reference == null || reference.isBlank() || amountMinor <= 0)
                      throw new IllegalArgumentException("Invalid domain payment");
              }
              static Payment fromDto(PaymentDto dto) {
                  if (dto == null) throw new IllegalArgumentException("Missing body");
                  return new Payment(dto.reference(), dto.amountMinor());
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          static void reject(Runnable action) {
              try { action.run(); } catch (IllegalArgumentException expected) { return; }
              throw new AssertionError("Expected invalid input to be rejected");
          }
          public static void main(String[] args) {
              BrokenPayment bad = new BrokenPayment();
              bad.reference = "TX";
              bad.amount = -1; // Nhập liệu trực tiếp bypass validation.
              check(bad.amount < 0);
              PaymentDto fromUntrustedInput = new PaymentDto("TX", -1);
              reject(() -> Payment.fromDto(fromUntrustedInput));
              reject(() -> Payment.fromDto(new PaymentDto("", 20)));
              Payment ok = Payment.fromDto(new PaymentDto("TX", 20));
              check(ok.amountMinor() == 20 && ok.reference().equals("TX"));
              System.out.println("PASS: DTO-to-domain boundary enforces invariant");
          }
      }
      ~~~

      Chạy javac Case14.java rồi java Case14. Đường lỗi chứng minh dữ liệu DTO không tự hợp lệ; domain constructor từ chối cả amount âm và mã thiếu. Dự án thực cần thêm integration test với thư viện JSON đang dùng, bao gồm bypass constructor, null/default fields và cấu hình ObjectMapper/serializer.
