    resolve: Kiểm tra số tiền ở constructor/factory hoặc Money value object trước khi tạo Payment; trả lỗi ngay tại ranh giới
      miền.
    knowledge: Constructor invariant, fail-fast validation và value objects.
    code: |-
      ### Case 1 — Payment không được có số tiền âm

      Bản lỗi tạo Payment trước rồi chờ database phát hiện amount âm. Bản đúng kiểm tra ngay trong Money và Payment, trước mọi thao tác persistence.

      ~~~java
      public class Case1 {
          record BadPayment(long amount) {}
          record Money(long minorUnits) {
              Money {
                  if (minorUnits <= 0)
                      throw new IllegalArgumentException("Amount must be positive");
              }
          }
          record Payment(String reference, Money money) {
              Payment {
                  if (reference == null || reference.isBlank() || money == null)
                      throw new IllegalArgumentException("Invalid payment");
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          static void reject(Runnable r) {
              try { r.run(); } catch (IllegalArgumentException expected) { return; }
              throw new AssertionError("Expected rejection");
          }
          public static void main(String[] args) {
              BadPayment bad = new BadPayment(-500);
              check(bad.amount() < 0); // Phản ví dụ: dữ liệu sai vẫn được tạo.
              reject(() -> new Money(-500));
              reject(() -> new Money(0));
              reject(() -> new Payment("", new Money(100)));
              Payment valid = new Payment("TX-1", new Money(500));
              check(valid.money().minorUnits() == 500);
              System.out.println("PASS: invalid state rejected at construction");
          }
      }
      ~~~

      Chạy javac Case1.java rồi java Case1. Bằng chứng là các assertion trên đường âm/0/tham chiếu thiếu và đường hợp lệ. Dùng integer minor units để tránh sai số dấu phẩy động; tiền tệ nhiều đơn vị cần thêm currency và quy tắc rounding, không suy diễn từ ví dụ.
  - situation: Một constructor yêu cầu mười hai tham số cùng kiểu String và developer truyền nhầm số điện thoại vào vị trí
      mã khách hàng.
