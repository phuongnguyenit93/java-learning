      ### Case 2 — Tổng hóa đơn phải nhất quán

      ~~~java
      public class Case2 {
        static class Bad {
          int subtotal=100,discount,total=100;
          void setDiscount(int d){discount=d;}
          void setTotal(int t){if(t<0)throw new IllegalArgumentException();total=t;}
        }
        static class Invoice {
          private final int subtotal=100;
          private int discount;
          void changeDiscount(int d){
            if(d<0||d>subtotal)throw new IllegalArgumentException();
            discount=d;
          }
          int total(){return subtotal-discount;}
        }
        static void check(boolean b){if(!b)throw new AssertionError();}
        public static void main(String[] args){
          Bad bad=new Bad();bad.setDiscount(20);
          try{bad.setTotal(-1);}catch(IllegalArgumentException expected){}
          check(bad.total!=bad.subtotal-bad.discount);
          Invoice good=new Invoice();good.changeDiscount(20);
          check(good.total()==80);
          try{good.changeDiscount(120);throw new AssertionError();}
          catch(IllegalArgumentException expected){}
          check(good.total()==80);
          good.changeDiscount(100);check(good.total()==0);
          System.out.println("PASS");
        }
      }
