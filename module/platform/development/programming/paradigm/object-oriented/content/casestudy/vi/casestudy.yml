      ### Case 7 — Hạn mức chuyển tiền không nằm riêng ở web

      ~~~java
      public class Case7 {
        static class Bad {
          long sent;
          void web(long a){if(a>1000)throw new IllegalArgumentException();sent+=a;}
          void batch(long a){sent+=a;}
        }
        static class Transfer {
          private final long limit=1000;
          private long sent;
          void execute(long amount){
            if(amount<=0||amount>limit)throw new IllegalArgumentException();
            sent+=amount;
          }
          long sent(){return sent;}
        }
        static void check(boolean b){if(!b)throw new AssertionError();}
        static void rejected(Runnable r){
          try{r.run();throw new AssertionError();}
          catch(IllegalArgumentException expected){}
        }
        public static void main(String[] args){
          Bad bad=new Bad();bad.batch(2000);check(bad.sent==2000);
          Transfer service=new Transfer();
          Runnable web=()->service.execute(2000);
          Runnable batch=()->service.execute(2000);
          rejected(web);rejected(batch);
          check(service.sent()==0);
          service.execute(500);check(service.sent()==500);
          System.out.println("PASS");
        }
      }
      ~~~

      Chạy javac Case7.java rồi java Case7. Web và batch cùng đi qua use case có policy. Demo minh họa hạn mức cho **mỗi** giao dịch; với hạn mức tích lũy cần ledger và transaction/lock để tránh hai request cùng vượt.
