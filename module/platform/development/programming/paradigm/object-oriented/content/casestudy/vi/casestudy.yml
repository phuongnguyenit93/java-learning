    code: |-
      ### Case 12 — Cancel phải kiểm trạng thái đơn hàng

      ~~~java
      public class Case12 {
        enum Status{NEW,PAID,SHIPPED,CANCELLED}
        static class Bad{Status state=Status.SHIPPED;}
        static class Order {
          private Status state=Status.NEW;
          private boolean refund;
          Status status(){return state;}
          boolean refundNeeded(){return refund;}
          void pay(){
            if(state!=Status.NEW)throw new IllegalStateException();
            state=Status.PAID;
          }
          void ship(){
            if(state!=Status.PAID)throw new IllegalStateException();
            state=Status.SHIPPED;
          }
          void cancel(){
            if(state!=Status.NEW&&state!=Status.PAID)
              throw new IllegalStateException();
            refund=state==Status.PAID;
            state=Status.CANCELLED;
          }
        }
        static void check(boolean b){if(!b)throw new AssertionError();}
        public static void main(String[] args){
          Bad bad=new Bad();bad.state=Status.CANCELLED;
          check(bad.state==Status.CANCELLED);
          Order unpaid=new Order();unpaid.cancel();
          check(unpaid.status()==Status.CANCELLED&&!unpaid.refundNeeded());
          Order paid=new Order();paid.pay();paid.cancel();
          check(paid.refundNeeded());
          Order shipped=new Order();shipped.pay();shipped.ship();
          try{shipped.cancel();throw new AssertionError();}
          catch(IllegalStateException expected){}
          check(shipped.status()==Status.SHIPPED);
          System.out.println("PASS");
        }
      }
      ~~~

      Chạy javac Case12.java rồi java Case12. refundNeeded chỉ ghi nhận **ý định** hoàn tiền; tích hợp cổng hoàn tiền phải có transaction/outbox, retry và idempotency phù hợp, không tự hiểu đã hoàn tất refund.
