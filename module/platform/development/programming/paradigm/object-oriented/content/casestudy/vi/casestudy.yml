    code: |-
      ### Case 4 — Giải quyết default-method conflict sau nâng cấp interface

      Khi hai interface có cùng chữ ký default, class implements cả hai sẽ không thể chọn tự động; cần override tường minh và giữ hành vi có contract.

      ~~~java
      public class Case4 {
          interface AuditLabel {
              default String label() { return "Audit"; }
          }
          interface PaymentLabel {
              default String label() { return "Payment"; }
          }
          // class Invalid implements AuditLabel, PaymentLabel {}
          // Bỏ comment ở trên -> Java báo conflicting defaults.
          static final class Combined implements AuditLabel, PaymentLabel {
              @Override public String label() {
                  return PaymentLabel.super.label() + " / "
                       + AuditLabel.super.label();
              }
          }
          static final class AuditOnly implements AuditLabel {}
          static void check(boolean b) { if (!b) throw new AssertionError(); }
          public static void main(String[] args) {
              check(new AuditOnly().label().equals("Audit"));
              check(new Combined().label().equals("Payment / Audit"));
              System.out.println("PASS: explicit default resolution");
          }
      }
      ~~~

      **Kiểm chứng:** chạy \`javac Case4.java\` rồi \`java Case4\`. Muốn chứng minh lỗi compile, bỏ comment ở \`Invalid\` và chạy riêng javac; hiện ví dụ chỉ **giải thích kết quả biên dịch dự kiến**, không giả vờ đã chạy dòng lỗi. Khi thay đổi thư viện thực còn cần chạy compile/source compatibility và binary compatibility trên toàn client.
  - situation: Một interface dành cho repository chứa quá nhiều phương thức, khiến adapter chỉ hỗ trợ tra cứu phải ném UnsupportedOperationException
      cho thao tác ghi.
    readmeRelated:
      anchorList:
      - interface-006
      - subtyping-007
      - solid-005
      - design-pitfalls-006
    resolve: Tách read repository khỏi write repository; loại những thao tác không hỗ trợ thay vì trả UnsupportedOperationException.
    knowledge: ISP, capability interfaces và contract consistency.
    code: |-
      ### Case 5 — Repository chỉ đọc không được buộc implement write

      **Lỗi gốc:** một interface có cả \`find\` và \`save\`, khiến adapter chỉ đọc phải \`throw UnsupportedOperationException\`. **Cách sửa:** chia vai trò để compiler không đòi adapter chỉ đọc có method \`save\`.

      ~~~java
      import java.util.*;

      public class Case5 {
          record Product(String sku) {}
          interface ProductReader { Optional<Product> find(String sku); }
          interface ProductWriter { void save(Product product); }
          static final class CatalogMirror implements ProductReader {
              public Optional<Product> find(String sku) {
                  return "A".equals(sku) ? Optional.of(new Product("A"))
                                         : Optional.empty();
              }
          }
          static final class MemoryStore implements ProductReader, ProductWriter {
              private final Map<String, Product> data = new HashMap<>();
              public Optional<Product> find(String sku) {
                  return Optional.ofNullable(data.get(sku));
              }
              public void save(Product p) { data.put(p.sku(), p); }
          }
          static void check(boolean b) { if (!b) throw new AssertionError(); }
          public static void main(String[] args) {
              ProductReader mirror = new CatalogMirror();
              check(mirror.find("A").isPresent());
              check(mirror.find("B").isEmpty());
              // mirror.save(new Product("C")); // Không biên dịch.
              MemoryStore writable = new MemoryStore();
              writable.save(new Product("C"));
              check(writable.find("C").orElseThrow().sku().equals("C"));
              System.out.println("PASS: read and write capabilities separated");
          }
      }
      ~~~

      **Kiểm chứng:** test query mirror và ghi/read store mà không có unsupported method. Nếu cần role-based quyền ở runtime, truyền \`ProductReader\` cho luồng chỉ đọc và kiểm soát quyền DB riêng. Không có UnsupportedOperationException là kết quả thiết kế API, không có nghĩa adapter không thể lỗi hạ tầng.
  - situation: Class phụ thuộc trực tiếp nhiều implementation cụ thể khiến test tích hợp phải khởi động cả database, queue
      và email server.
    readmeRelated:
      anchorList:
      - interface-009
      - composition-006
      - class-design-004
      - solid-006
      - solid-007
      - testing-007
    resolve: Inject ports nhỏ cho storage/queue/email vào class; test với test doubles thay vì khởi động mọi hệ thống ngoài.
    knowledge: Dependency injection, dependency inversion và unit test isolation.
    code: |-
      ### Case 6 — Ports nhỏ giúp unit test không cần DB/queue/email thật

      Service nghiệp vụ phụ thuộc vào ba port: lưu order, phát sự kiện và gửi thông báo. Test fake theo dõi thứ tự, số lần gọi và đường lỗi mà không khởi động hạ tầng.

      ~~~java
      import java.util.*;

      public class Case6 {
          interface OrderStore { void save(String id); }
          interface EventBus { void publish(String id); }
          interface EmailGateway { void send(String id); }
          static final class SubmitOrder {
              private final OrderStore store;
              private final EventBus events;
              private final EmailGateway emails;
              SubmitOrder(OrderStore s, EventBus e, EmailGateway m) {
                  store=s; events=e; emails=m;
              }
              void submit(String id) {
                  if (id == null || id.isBlank())
                      throw new IllegalArgumentException("id");
                  store.save(id);
                  events.publish(id);
                  emails.send(id);
              }
          }
          static void check(boolean b) { if (!b) throw new AssertionError(); }
          public static void main(String[] args) {
              List<String> calls = new ArrayList<>();
              SubmitOrder ok = new SubmitOrder(
                  id -> calls.add("save:" + id),
                  id -> calls.add("event:" + id),
                  id -> calls.add("mail:" + id));
              ok.submit("O1");
              check(calls.equals(List.of("save:O1","event:O1","mail:O1")));
              SubmitOrder failing = new SubmitOrder(
                  id -> calls.add("save:" + id),
                  id -> { throw new IllegalStateException("queue down"); },
                  id -> calls.add("mail:" + id));
              try {
                  failing.submit("O2");
                  throw new AssertionError("missing event failure");
              } catch (IllegalStateException expected) { }
              check(!calls.contains("mail:O2"));
              System.out.println("PASS: dependencies replaced by fakes");
          }
      }
      ~~~

      **Kiểm chứng:** \`javac Case6.java\`, \`java Case6\`. Mã mô phỏng các boundary, test chứng minh injection và khả năng cô lập lỗi. Đây **không** phải bảo đảm transaction: trong production, việc lưu đã thành công mà queue lỗi đòi outbox/idempotency và test tích hợp riêng.
  - situation: Nhóm phát triển tạo interface cho mọi concrete class dù không có ranh giới module hay nhu cầu thay thế, gây
      khó tìm luồng thực thi.
    readmeRelated:
      anchorList:
      - oop-basic-008
      - abstraction-007
      - solid-008
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-008
    resolve: Chỉ tạo interface tại điểm biến thiên/boundary có nhu cầu; ưu tiên concrete class đơn giản cho phần ổn định,
      bỏ wrapper vô ích.
    knowledge: YAGNI, speculative abstraction và trade-off design.
    code: |-
      ### Case 7 — Không tạo interface khi chỉ có một chức năng ổn định

      **Lỗi gốc:** lớp \`FormatterImpl\` bị bọc nhiều interface/forwarder không có policy riêng. Bản trực tiếp giữ nguyên hành vi mà không cần lớp ủy nhiệm vô ích; test regression ở đường hợp lệ và sai.

      ~~~java
      public class Case7 {
          interface FormatPort { String format(String value); }
          static final class FormatterImpl implements FormatPort {
              public String format(String value) {
                  if (value == null || value.isBlank())
                      throw new IllegalArgumentException("value");
                  return "[" + value.trim() + "]";
              }
          }
          static final class LegacyForwarder {
              private final FormatPort port;
              LegacyForwarder(FormatPort port) { this.port=port; }
              String execute(String text) { return port.format(text); }
          }
          static final class Formatter {
              String format(String value) {
                  if (value == null || value.isBlank())
                      throw new IllegalArgumentException("value");
                  return "[" + value.trim() + "]";
              }
          }
          static void check(boolean b) { if (!b) throw new AssertionError(); }
          public static void main(String[] args) {
              LegacyForwarder old = new LegacyForwarder(new FormatterImpl());
              Formatter simple = new Formatter();
              for (String input : new String[]{"hello", "  world "})
                  check(old.execute(input).equals(simple.format(input)));
              try {
                  simple.format(" ");
                  throw new AssertionError("blank accepted");
              } catch (IllegalArgumentException expected) { }
              System.out.println("PASS: no speculative forwarding contract needed");
          }
      }
      ~~~

      **Kiểm chứng:** test so output 2 luồng và từ chối blank. Không khẳng định interface luôn xấu: khi boundary thực sự có biến thể, cần fake hoặc plugin API ổn định, interface là lựa chọn hợp lý. Với code thực, xóa từng forwarder sau khi đã kiểm tra authorization/transaction/logging và regression tests.
  - situation: Một abstraction đặt tên chung chung là execute nhận Map String,Object làm các implementation diễn giải key
      và lỗi theo cách khác nhau.
    readmeRelated:
      anchorList:
      - class-005
      - abstraction-003
      - abstraction-004
      - abstraction-008
      - interface-008
      - subtyping-003
      - solid-004
    resolve: Thay Map String,Object bằng request/command type rõ trường và validation; đặc tả đầu vào, lỗi và side effects
      của execute.
    knowledge: Type safety, explicit contracts và schema validation.
    code: |-
      ### Case 8 — Thay Map String,Object bằng command có kiểu rõ

      **Lỗi gốc:** client gửi key sai và kiểu giá trị sai; dùng \`Map<String,Object>\` khiến lỗi chỉ xuất hiện lúc runtime khi cast. **Cách sửa:** command record validate required field, type được compiler kiểm và không nhận key tùy ý.

      ~~~java
      import java.util.*;

      public class Case8 {
          static long brokenExecute(Map<String,Object> input) {
              return (Long) input.get("amount"); // Nhầm String / thiếu key.
          }
          record TransferCommand(String destination, long amount) {
              TransferCommand {
                  if (destination == null || destination.isBlank() || amount <= 0)
                      throw new IllegalArgumentException("invalid command");
              }
          }
          static long execute(TransferCommand command) {
              return command.amount();
          }
          static void check(boolean b) { if (!b) throw new AssertionError(); }
          public static void main(String[] args) {
              try {
                  brokenExecute(Map.of("amount", "100"));
                  throw new AssertionError("type mismatch accepted");
              } catch (ClassCastException expected) { }
              try {
                  brokenExecute(Map.of("amunt", 100L));
                  throw new AssertionError("missing key accepted");
              } catch (NullPointerException expected) { }
              check(execute(new TransferCommand("ACC1", 100L)) == 100L);
              try {
                  new TransferCommand("", 100L);
                  throw new AssertionError("invalid destination accepted");
              } catch (IllegalArgumentException expected) { }
              // execute(new TransferCommand("ACC1", "100")); // Không biên dịch.
              System.out.println("PASS: typed command has explicit schema");
          }
      }
      ~~~

      **Kiểm chứng:** test lỗi cast/thiếu key và command đúng. Đầu vào API JSON ngoài hệ thống vẫn phải validate/map sang \`TransferCommand\` ở adapter; typed Java API không tự đảm bảo request từ mạng hợp lệ. Các key/amount trong ví dụ là dữ liệu minh họa, không gọi dịch vụ chuyển khoản.
  - situation: Service công khai hợp đồng cho phép truyền null nhưng một implementation lại dereference ngay và ném NullPointerException.
    readmeRelated:
      anchorList:
      - object-008
      - abstraction-004
      - interface-008
      - subtyping-007
      - solid-004
      - language-mechanics-008
      - testing-004
    resolve: Thống nhất null policy trong contract; kiểm tra null có chủ đích hoặc sửa đặc tả thành non-null, test mọi implementation.
    knowledge: Nullability, preconditions và behavioral subtyping.
    code: |-
      ### Case 9 — Thống nhất null policy cho tất cả implementation

      Contract \`Calculator.evaluate(null)\` phải có ngữ nghĩa tường minh. Chọn **reject null bằng IllegalArgumentException**, thay vì một implementation trả 0 còn implementation khác ném NullPointerException.

      ~~~java
      public class Case9 {
          interface Calculator { int evaluate(Integer input); }
          static final class A implements Calculator {
              public int evaluate(Integer input) {
                  if (input == null) throw new IllegalArgumentException("input");
                  return input + 1;
              }
          }
          static final class B implements Calculator {
              public int evaluate(Integer input) {
                  if (input == null) throw new IllegalArgumentException("input");
                  return Math.addExact(input, 1);
              }
          }
          static void contract(Calculator c) {
              if (c.evaluate(0) != 1 || c.evaluate(2) != 3)
                  throw new AssertionError("result");
              try {
                  c.evaluate(null);
                  throw new AssertionError("null accepted");
              } catch (IllegalArgumentException expected) { }
          }
          public static void main(String[] args) {
              contract(new A());
              contract(new B());
              System.out.println("PASS: consistent null precondition");
          }
      }
      ~~~

      **Kiểm chứng:** cùng test áp trên A/B cho giá trị bình thường và null. Contract cần mô tả cả overflow, phạm vi input và các lỗi khác: ví dụ trên chưa đặc tả toàn bộ miền số nguyên. Nếu chọn \`Optional\` hoặc non-null signature thay vì nhận nullable, phải đổi hợp đồng và client nhất quán.
  - situation: Một API được thiết kế trả kết quả bất biến nhưng một implementation trả danh sách có thể sửa còn implementation
      khác trả snapshot.
    readmeRelated:
      anchorList:
      - class-006
      - encapsulation-006
      - encapsulation-007
      - interface-008
      - solid-004
      - testing-004
    resolve: 'Định nghĩa ownership đầu ra: luôn immutable snapshot hoặc bản sao phòng vệ; kiểm thử cả việc sửa list và mutable
      elements.'
    knowledge: Return-value contract, defensive copies và LSP.
    code: |-
      ### Case 10 — Contract trả về phải là immutable snapshot, kể cả phần tử

      **Lỗi gốc:** implementation A trả live list Item, B trả List.copyOf; hai client nhìn thấy cách mutate khác nhau. Hợp đồng chung trả \`List<ItemView>\` bất biến; cả hai implementation copy dữ liệu thành record bất biến.

      ~~~java
      import java.util.*;

      public class Case10 {
          static final class MutableItem {
              String sku; int count;
              MutableItem(String sku,int count){this.sku=sku;this.count=count;}
          }
          interface ItemReader { List<ItemView> getItems(); }
          record ItemView(String sku,int count) {}
          static final class A implements ItemReader {
              private final List<MutableItem> source;
              A(List<MutableItem> source){this.source=source;}
              public List<ItemView> getItems(){
                  List<ItemView> values=new ArrayList<>();
                  for(MutableItem x:source)
                      values.add(new ItemView(x.sku,x.count));
                  return List.copyOf(values);
              }
          }
          static final class B implements ItemReader {
              private final List<ItemView> values;
              B(List<MutableItem> source){
                  List<ItemView> copy=new ArrayList<>();
                  for(MutableItem x:source)
                      copy.add(new ItemView(x.sku,x.count));
                  values=List.copyOf(copy);
              }
              public List<ItemView> getItems(){return values;}
          }
          static void check(boolean b){if(!b)throw new AssertionError();}
          static void contract(ItemReader reader,MutableItem source){
              List<ItemView> before=reader.getItems();
              check(before.get(0).count()==2);
              try { before.clear(); throw new AssertionError("mutable list"); }
              catch(UnsupportedOperationException expected) {}
              source.count=9;
              check(before.get(0).count()==2); // Snapshot cũ độc lập.
          }
          public static void main(String[] args) {
              MutableItem a=new MutableItem("A",2);
              MutableItem b=new MutableItem("B",2);
              contract(new A(new ArrayList<>(List.of(a))),a);
              contract(new B(new ArrayList<>(List.of(b))),b);
              System.out.println("PASS: both implementations honor snapshot contract");
          }
      }
      ~~~

      **Kiểm chứng:** test mutation của list và của nguồn dữ liệu sau khi lấy snapshot; cả hai implementation giữ nguyên giá trị snapshot. A tạo snapshot mỗi lần, B chụp khi khởi tạo; hợp đồng phải ghi rõ **thời điểm snapshot** nếu client đòi đọc dữ liệu mới nhất. Với phần tử lồng nested mutable cần copy sâu tương ứng.
  - situation: Một class abstract có method template phụ thuộc thứ tự hook không được tài liệu hóa, khiến subclass mới hoạt
      động sai dù compile thành công.
    readmeRelated:
      anchorList:
      - abstraction-004
      - abstraction-005
      - inheritance-010
      - subtyping-001
      - design-patterns-011
      - testing-009
    resolve: Tài liệu hóa thứ tự hook và invariant trước/sau; đóng băng bước bắt buộc hoặc chuyển sang composition nếu subclass
      tùy biến quá rộng.
    knowledge: Template Method, subclass contracts và fragile base class.
    code: |-
      ### Case 11 — Template Method phải giữ thứ tự validate rồi mới ghi

      **Lỗi gốc:** subclass tùy ý override hook và chạy ghi trước validate; ràng buộc thứ tự không được nêu. Đóng băng thuật toán \`execute\` trong superclass và đặt validation bắt buộc trước hook \`persist\`.

      ~~~java
      import java.util.*;

      public class Case11 {
          static abstract class Workflow {
              final List<String> steps;
              Workflow(List<String> steps){this.steps=steps;}
              public final void execute(String input) {
                  if (input == null || input.isBlank())
                      throw new IllegalArgumentException("input");
                  steps.add("validate");
                  persist(input);
                  steps.add("done");
              }
              protected abstract void persist(String input);
          }
          static final class DbWorkflow extends Workflow {
              DbWorkflow(List<String> steps){super(steps);}
              protected void persist(String input){steps.add("db:"+input);}
          }
          static final class FileWorkflow extends Workflow {
              FileWorkflow(List<String> steps){super(steps);}
              protected void persist(String input){steps.add("file:"+input);}
          }
          static void check(boolean b){if(!b)throw new AssertionError();}
          public static void main(String[] args) {
              List<String> db=new ArrayList<>();
              new DbWorkflow(db).execute("ok");
              check(db.equals(List.of("validate","db:ok","done")));
              List<String> file=new ArrayList<>();
              Workflow flow=new FileWorkflow(file);
              try {
                  flow.execute("");
                  throw new AssertionError("blank accepted");
              } catch(IllegalArgumentException expected) {}
              check(file.isEmpty()); // Ghi chưa xảy ra khi validation lỗi.
              flow.execute("x");
              check(file.equals(List.of("validate","file:x","done")));
              System.out.println("PASS: invariant sequence cannot be overridden");
          }
      }
      ~~~

      **Kiểm chứng:** test hai subclass; đường input lỗi không gọi \`persist\`, đường hợp lệ luôn validate→persist→done. Đây là invariant về **thứ tự phương thức**, không bảo đảm transaction DB khi \`persist\` thất bại; cần error handling/rollback trong ứng dụng thật. Nếu subclass cần tùy biến quá nhiều bước, cân nhắc composition thay Template Method.
- groupID: 5
  groupName: Kế thừa, overriding và khả năng thay thế
  cases:
  - situation: Một subtype Vehicle buộc đối tượng Bicycle có phương thức startEngine dù xe đạp không có hành vi động cơ.
    readmeRelated:
      anchorList:
      - interface-006
      - subtyping-007
      - solid-005
      - design-pitfalls-006
      - practice-004
    resolve: Phân tách EnginePowered khỏi Vehicle, chỉ gắn năng lực startEngine cho phương tiện có động cơ; không ép Bicycle
      hỗ trợ giả.
    knowledge: LSP, ISP, role interface và capability modeling.
    code: |-
      Capability được khai báo riêng: Bicycle chỉ có thể di chuyển, Car vừa di chuyển vừa khởi động động cơ. Không ép đối tượng không có động cơ thực hiện startEngine() giả.

      ~~~java
      import java.util.*;
      public class Demo1 {
        interface Vehicle { String move(); }
        interface EnginePowered { String startEngine(); }

        static final class Bicycle implements Vehicle {
          public String move() { return "pedal"; }
        }
        static final class Car implements Vehicle, EnginePowered {
          public String move() { return "drive"; }
          public String startEngine() { return "engine started"; }
        }
        static String beginTrip(EnginePowered powered) {
          return powered.startEngine();
        }
        public static void main(String[] args) {
          Vehicle bicycle = new Bicycle();
          Vehicle car = new Car();
          assert bicycle.move().equals("pedal");
          assert car.move().equals("drive");
          assert beginTrip(new Car()).equals("engine started");
          // beginTrip(new Bicycle()); // compile error: Bicycle không có capability EnginePowered
        }
      }
      ~~~

      Kiểm chứng: lưu là Demo1.java, chạy javac Demo1.java rồi java -ea Demo1. Bỏ comment beginTrip(new Bicycle()) phải báo lỗi kiểu tại compile-time. Các client cần startEngine nhận EnginePowered, các client chỉ cần di chuyển nhận Vehicle; không còn UnsupportedOperationException giả từ Bicycle.
  - situation: Subclass tài khoản tiết kiệm cho phép số dư âm trong khi các client sử dụng hợp đồng Account luôn giả định
      số dư không âm.
    readmeRelated:
      anchorList:
      - encapsulation-002
      - encapsulation-009
      - abstraction-004
      - subtyping-007
      - solid-004
      - testing-005
    resolve: Sửa withdraw giữ invariant số dư theo Account contract; nếu quy tắc khác biệt bản chất, tạo type/hợp đồng phù
      hợp.
    knowledge: LSP, postconditions và invariants.
    code: |-
      Client của Account giả định balance >= 0 sau mọi thao tác. Giữ invariant ở hàm withdraw final trên base class, để SavingsAccount không phá điều kiện hậu nghiệm bằng override.

      ~~~java
      public class Demo2 {
        static abstract class Account {
          private long balance;
          Account(long opening) {
            if (opening < 0) throw new IllegalArgumentException("opening");
            balance = opening;
          }
          public final long balance() { return balance; }
          public final void withdraw(long amount) {
            if (amount <= 0 || amount > balance)
              throw new IllegalArgumentException("withdraw exceeds balance");
            balance -= amount;
          }
          public final void deposit(long amount) {
            if (amount <= 0) throw new IllegalArgumentException("deposit");
            balance = Math.addExact(balance, amount);
          }
        }
        static final class SavingsAccount extends Account {
          SavingsAccount(long opening) { super(opening); }
        }
        static void contract(Account account) {
          long before = account.balance();
          try {
            account.withdraw(before + 1);
            throw new AssertionError("must reject overdraft");
          } catch (IllegalArgumentException expected) { }
          assert account.balance() == before;
          if (before > 0) {
            account.withdraw(before);
            assert account.balance() == 0;
          }
        }
        public static void main(String[] args) {
          contract(new SavingsAccount(100));
          assert new SavingsAccount(0).balance() == 0;
        }
      }
      ~~~

      Kiểm chứng: javac Demo2.java; java -ea Demo2. Contract test xác nhận số dư không âm sau từ chối rút vượt số dư và rút hết. Nếu sản phẩm cần overdraft, nên định nghĩa hợp đồng tài khoản khác, không cho subtype âm thầm thay invariant của Account.
  - situation: Thay đổi thêm validation trong superclass phá luồng tạo object của nhiều subclass vốn truyền dữ liệu trung
      gian trong constructor.
    readmeRelated:
      anchorList:
      - lifecycle-004
      - lifecycle-009
      - inheritance-006
      - inheritance-010
      - testing-002
      - testing-009
    resolve: Không dùng subclass state chưa sẵn sàng khi superclass constructor chạy; đặt validation tại factory/phase thích
      hợp và thêm regression tests.
    knowledge: Initialization order, base-class coupling và subclass invariants.
    code: |-
      Superclass constructor không nên gọi method có thể override vì field của subclass chưa khởi tạo. Sử dụng constructor cho trạng thái cốt lõi, factory kiểm validation phụ thuộc trạng thái đầy đủ.

      ~~~java
      import java.util.*;
      public class Demo3 {
        static abstract class BaseDocument {
          private final String id;
          BaseDocument(String id) {
            this.id = Objects.requireNonNull(id);
            // KHÔNG gọi validate() / render() có thể override tại đây.
          }
          String id() { return id; }
        }
        static final class Invoice extends BaseDocument {
          private final List<String> rows;
          private Invoice(String id, List<String> rows) {
            super(id);
            this.rows = List.copyOf(rows);
          }
          static Invoice create(String id, List<String> rows) {
            Invoice result = new Invoice(id, rows);
            result.validate(); // sau constructor: rows đã được gán
            return result;
          }
          private void validate() {
            if (id().isBlank() || rows.isEmpty())
              throw new IllegalArgumentException("invoice incomplete");
          }
          int rowCount() { return rows.size(); }
        }
        public static void main(String[] args) {
          Invoice invoice = Invoice.create("I1", List.of("item"));
          assert invoice.rowCount() == 1;
          try {
            Invoice.create("I2", List.of());
            throw new AssertionError("expected validation failure");
          } catch (IllegalArgumentException expected) { }
        }
      }
      ~~~

      Kiểm chứng: javac Demo3.java; java -ea Demo3. Ví dụ nguy hiểm là BaseDocument() gọi overridable validate() trước khi Invoice.rows được gán, có thể NullPointerException. Factory chỉ trả object đã valid; thêm regression tests cho constructor của các subtype khi nâng cấp base class.
  - situation: Một lớp con override hàm định giá nhưng âm thầm bỏ qua một khoản phí mà mọi client của lớp cha đều coi là bắt
      buộc.
    readmeRelated:
      anchorList:
      - abstraction-004
      - interface-008
      - subtyping-007
      - solid-004
      - testing-005
    resolve: Giữ thành phần phí bắt buộc trong semantic contract, test tất cả subtype bằng shared contract tests với tình
      huống biên.
    knowledge: Behavioral subtyping, postconditions và contract testing.
    code: |-
      Phí bắt buộc là postcondition chung của Pricing. Đặt bước cộng phí trong final template method; subtype chỉ chọn subtotal, không thể quên khoản phí qua override.

      ~~~java
      public class Demo4 {
        static abstract class Pricing {
          private final long mandatoryFee;
          Pricing(long mandatoryFee) {
            if (mandatoryFee < 0) throw new IllegalArgumentException("fee");
            this.mandatoryFee = mandatoryFee;
          }
          protected abstract long subtotal();
          public final long total() {
            long subtotal = subtotal();
            if (subtotal < 0) throw new IllegalStateException("negative subtotal");
            return Math.addExact(subtotal, mandatoryFee);
          }
          public final long fee() { return mandatoryFee; }
        }
        static final class Standard extends Pricing {
          private final long amount;
          Standard(long amount, long fee) { super(fee); this.amount = amount; }
          protected long subtotal() { return amount; }
        }
        static final class Promotion extends Pricing {
          private final long amount;
          Promotion(long amount, long fee) { super(fee); this.amount = amount; }
          protected long subtotal() { return amount * 9 / 10; }
        }
        static void contract(Pricing quote, long expectedSubtotal) {
          assert quote.total() == Math.addExact(expectedSubtotal, quote.fee());
          assert quote.total() >= quote.fee();
        }
        public static void main(String[] args) {
          contract(new Standard(100, 8), 100);
          contract(new Promotion(100, 8), 90);
          assert new Promotion(100, 8).total() == 98;
        }
      }
      ~~~

      Kiểm chứng: javac Demo4.java; java -ea Demo4. Cùng contract áp cho hai subtype, kể cả discount. Hệ thống tiền tệ thực nên dùng đơn vị nhỏ nguyên hoặc BigDecimal với quy tắc làm tròn được đặc tả; test này không thay kiểm thử tính phí của nghiệp vụ thực.
  - situation: Một subclass ném loại checked exception khác với phương thức của lớp cha nên đoạn override không thể biên dịch.
    readmeRelated:
      anchorList:
      - inheritance-004
      - subtyping-002
      - language-mechanics-008
    resolve: Sửa override chỉ ném checked exception đúng loại hoặc subtype đã khai báo; nếu cần lỗi khác, chuyển đổi theo
      hợp đồng.
    knowledge: Checked exception override rules và Java type system.
    code: |-
      Override được phép khai báo ít checked exception hơn, hoặc subtype của loại checked exception ở superclass; không được thêm checked exception không liên quan.

      ~~~java
      import java.io.*;
      public class Demo5 {
        static abstract class Reader {
          abstract String read() throws IOException;
        }
        static final class DiskReader extends Reader {
          @Override String read() throws FileNotFoundException {
            return "found";
          }
        }
        static final class ServiceReader extends Reader {
          @Override String read() throws IOException {
            try {
              return callService();
            } catch (IllegalStateException providerFailure) {
              throw new IOException("cannot read source", providerFailure);
            }
          }
          private String callService() { return "ready"; }
        }
        public static void main(String[] args) throws IOException {
          Reader disk = new DiskReader(), service = new ServiceReader();
          assert disk.read().equals("found");
          assert service.read().equals("ready");
        }
      }
      ~~~

      Kiểm chứng: javac Demo5.java; java -ea Demo5. Nếu đổi chữ ký DiskReader.read() thành throws java.sql.SQLException, javac phải từ chối vì SQLException không phải subtype của IOException. Exception từ thư viện khác cần được ánh xạ phù hợp contract; không dùng throws Exception tùy tiện để che vấn đề.
  - situation: Một method overload nhận Object và String khiến lời gọi null chạy vào nhánh ngoài mong đợi hoặc gây lỗi khi
      chữ ký được mở rộng.
    readmeRelated:
      anchorList:
      - class-005
      - subtyping-004
      - polymorphism-005
      - language-mechanics-004
    resolve: Tránh overload có quan hệ type dễ mơ hồ với null; đổi tên API hoặc cast/chỉ định type tại call site theo ý định.
    knowledge: Compile-time overload resolution và null overload ambiguity.
    code: |-
      Java chọn overload theo kiểu tại compile-time, không xét kiểu runtime của đối số hay giá trị null. Khi thêm overload không liên quan, null có thể trở thành mơ hồ.

      ~~~java
      public class Demo6 {
        static String choose(Object o) { return "object"; }
        static String choose(String s) { return "string"; }
        static String fromString(String s) { return "string-api"; }
        static String fromInteger(Integer i) { return "integer-api"; }
        public static void main(String[] args) {
          assert choose(null).equals("string");  // String đặc hiệu hơn Object
          assert choose((Object) null).equals("object");
          assert choose((String) null).equals("string");
          assert fromString(null).equals("string-api");
          assert fromInteger(null).equals("integer-api");
        }
      }
      ~~~

      ~~~java
      // Ambiguous.java — ví dụ cố tình không biên dịch
      class Ambiguous {
        static void run(String s) {}
        static void run(Integer i) {}
        void test() { run(null); } // reference null phù hợp cả hai overload không liên quan
      }
      ~~~

      Kiểm chứng: javac Demo6.java; java -ea Demo6. Biên dịch riêng Ambiguous.java phải báo reference to run is ambiguous. Ưu tiên đặt tên API rõ nghĩa; khi cần overload hợp lệ, cast hoặc khai báo biến có kiểu tường minh tại call site.
  - situation: Developer mong static method của subclass được dispatch theo kiểu object thực tế nên kết quả xử lý khác với
      dự đoán.
    readmeRelated:
      anchorList:
      - class-003
      - subtyping-004
      - polymorphism-006
      - language-mechanics-004
    resolve: Tách kỳ vọng static method dispatch khỏi dynamic polymorphism; dùng instance virtual method khi thật sự cần hành
      vi subtype.
    knowledge: Static method hiding và runtime dynamic dispatch.
    code: |-
      Static method được resolve theo kiểu biến/kiểu class lúc biên dịch (hiding), còn instance override được dispatch theo object runtime.

      ~~~java
      public class Demo7 {
        static class Base {
          static String kind() { return "base-static"; }
          String render() { return "base-instance"; }
        }
        static final class Child extends Base {
          static String kind() { return "child-static"; }
          @Override String render() { return "child-instance"; }
        }
        public static void main(String[] args) {
          Base ref = new Child();
          assert Base.kind().equals("base-static");
          assert Child.kind().equals("child-static");
          assert ref.kind().equals("base-static"); // hợp lệ nhưng nên tránh gọi static qua instance
          assert ref.render().equals("child-instance");
        }
      }
      ~~~

      Kiểm chứng: javac Demo7.java; java -ea Demo7. So sánh ref.kind() và ref.render() trên cùng instance Child để nhận ra sự khác biệt. Nếu client cần thay đổi hành vi theo subtype, định nghĩa method instance và override; static utility nên gọi bằng tên class.
  - situation: Một subclass khai báo field cùng tên với superclass khiến một biến được truy cập theo kiểu cha và kiểu con
      trả hai giá trị khác nhau.
    readmeRelated:
      anchorList:
      - inheritance-002
      - subtyping-004
      - polymorphism-006
      - polymorphism-007
    resolve: Không tái khai báo field trùng tên trong subtype; dùng accessor có nghĩa, bảo đảm một nguồn trạng thái hoặc composition.
    knowledge: Field hiding, lexical resolution và encapsulation.
    code: |-
      Field hiding tạo hai vị trí lưu trữ khác nhau và được chọn theo kiểu reference. Minh họa bug rồi giữ một field private duy nhất, cung cấp accessor có nghĩa.

      ~~~java
      public class Demo8 {
        static class OldBase { String code = "BASE"; }
        static final class OldChild extends OldBase { String code = "CHILD"; }

        static class Base {
          private String code = "initial";
          public final String code() { return code; }
          protected final void rename(String newer) { code = newer; }
        }
        static final class Child extends Base {
          void assign(String value) { rename(value); }
        }
        public static void main(String[] args) {
          OldChild oldChild = new OldChild();
          OldBase oldRef = oldChild;
          assert oldRef.code.equals("BASE");
          assert oldChild.code.equals("CHILD"); // bug: hai field cùng tên

          Child child = new Child();
          Base ref = child;
          child.assign("ONE");
          assert ref.code().equals("ONE");
          assert child.code().equals("ONE");
        }
      }
      ~~~

      Kiểm chứng: javac Demo8.java; java -ea Demo8. Đường cũ trả hai giá trị khác nhau dù cùng object; thiết kế sửa có đúng một field và accessor nên caller theo kiểu Base/Child đều quan sát cùng trạng thái. Không tự ý expose mutable field public.
  - situation: Refactor chuyển một method từ protected sang private làm các subclass từng override nó không còn thay đổi được
      hành vi.
    readmeRelated:
      anchorList:
      - class-004
      - inheritance-005
      - subtyping-002
      - refactoring-009
    resolve: Giữ protected extension contract khi cần tương thích hoặc thay bằng strategy/hook chính thức và migration có
      test.
    knowledge: Access modifiers, override contracts và API compatibility.
    code: |-
      Protected hook là extension contract; đổi protected thành private sẽ khiến @Override của plugin/subclass fail compile hoặc behavior không còn được dispatch. Giữ hook hoặc migrate qua strategy được công bố.

      ~~~java
      public class Demo9 {
        static class Normalizer {
          public final String process(String raw) {
            return "[" + normalize(raw) + "]";
          }
          protected String normalize(String raw) { return raw; }
        }
        static final class TrimNormalizer extends Normalizer {
          @Override protected String normalize(String raw) { return raw.trim(); }
        }
        public static void main(String[] args) {
          Normalizer a = new Normalizer();
          Normalizer b = new TrimNormalizer();
          assert a.process(" x ").equals("[ x ]");
          assert b.process(" x ").equals("[x]");
        }
      }
      ~~~

      Kiểm chứng: javac Demo9.java; java -ea Demo9. Nếu đổi Normalizer.normalize thành private và giữ @Override ở TrimNormalizer, compiler báo không override được method base; nếu bỏ annotation, process của base cũng không gọi hàm mới. Trước khi chuyển API protected hook, chạy source/binary compatibility tests cho các subclass bên ngoài.
  - situation: Một class final được dùng làm điểm mở rộng trong thư viện nhưng plugin bên ngoài không thể kế thừa và phải
      sao chép logic.
    readmeRelated:
      anchorList:
      - interface-005
      - inheritance-007
      - composition-004
      - design-patterns-008
      - practice-004
    resolve: Thiết kế extension points bằng interface/strategy thay cho kế thừa class final; tránh copy implementation nội
      bộ.
    knowledge: Final classes, composition và plugin extensibility.
    code: |-
      Final class bảo vệ implementation nội bộ nhưng không chặn khả năng mở rộng: plugin triển khai một Strategy công khai và được inject từ composition root.

      ~~~java
      import java.util.*;
      public class Demo10 {
        interface TextStrategy { String transform(String input); }
        static final class Engine {
          private final TextStrategy strategy;
          Engine(TextStrategy strategy) { this.strategy = Objects.requireNonNull(strategy); }
          String process(String input) { return strategy.transform(input); }
        }
        static final class UpperPlugin implements TextStrategy {
          public String transform(String input) { return input.toUpperCase(Locale.ROOT); }
        }
        static final class PrefixPlugin implements TextStrategy {
          public String transform(String input) { return "PLUGIN:" + input; }
        }
        public static void main(String[] args) {
          assert new Engine(new UpperPlugin()).process("hello").equals("HELLO");
          assert new Engine(new PrefixPlugin()).process("hello").equals("PLUGIN:hello");
          // class Derived extends Engine {} // không biên dịch: Engine là final
        }
      }
      ~~~

      Kiểm chứng: javac Demo10.java; java -ea Demo10. Thêm plugin mới chỉ phải implements TextStrategy, không sao chép Engine. Nếu plugin tải động ở runtime, bổ sung test load/discovery, versioning và quản lý lifecycle phù hợp.
  - situation: Quy tắc tính diện tích của một Square mutable kế thừa Rectangle phá kỳ vọng client khi thay đổi chiều rộng
      nhưng chiều cao cũng đổi.
    readmeRelated:
      anchorList:
      - subtyping-008
      - solid-004
      - testing-005
      - practice-004
    resolve: Không cho Square subtype Rectangle mutable nếu phá setWidth/setHeight contract; chọn Shape chung hoặc mô hình
      bất biến.
    knowledge: LSP, Rectangle-Square problem và pre/postconditions.
    code: |-
      Rectangle mutable có setWidth/setHeight độc lập; Square subtype thay đổi cả hai khi set một chiều sẽ phá hậu điều kiện client Rectangle. Giải quyết bằng abstraction Shape chung và value types bất biến.

      ~~~java
      public class Demo11 {
        interface Shape { long area(); }
        record Rectangle(long width, long height) implements Shape {
          Rectangle {
            if (width < 0 || height < 0) throw new IllegalArgumentException("dimension");
          }
          public long area() { return Math.multiplyExact(width, height); }
        }
        record Square(long side) implements Shape {
          Square {
            if (side < 0) throw new IllegalArgumentException("dimension");
          }
          public long area() { return Math.multiplyExact(side, side); }
        }
        static long sumAreas(Shape... shapes) {
          long total = 0;
          for (Shape shape : shapes) total = Math.addExact(total, shape.area());
          return total;
        }
        public static void main(String[] args) {
          Rectangle rectangle = new Rectangle(2, 5);
          Square square = new Square(4);
          assert rectangle.area() == 10;
          assert square.area() == 16;
          assert sumAreas(rectangle, square) == 26;
          assert rectangle.width() == 2 && rectangle.height() == 5;
          assert square.side() == 4;
        }
      }
      ~~~

      Kiểm chứng: javac Demo11.java; java -ea Demo11. Không có setter để subtype thay đổi chiều kia ngầm. Khi cần chỉnh kích thước, tạo instance Rectangle/Square mới và biểu diễn hành vi thay đổi qua API có contract riêng.
  - situation: Một hệ thống mở rộng chuỗi class kế thừa sâu đến mức sửa hook trong lớp gốc làm lỗi hiển thị ở nhiều màn hình
      không liên quan.
    readmeRelated:
      anchorList:
      - inheritance-010
      - subtyping-001
      - composition-008
      - testing-009
      - refactoring-007
    resolve: Giảm hierarchy sâu bằng composition/delegation; viết contract tests cho hook và refactor theo từng lớp kiểm soát
      tác động.
    knowledge: Fragile base class, inheritance coupling và refactoring.
    code: |-
      Thay chuỗi kế thừa RendererBase -> ThemeBase -> ScreenBase bằng strategy và decorator. Mỗi màn hình lắp ghép renderer qua composition, không phụ thuộc hook của ancestor xa.

      ~~~java
      import java.util.*;
      public class Demo12 {
        interface Renderer { String render(String content); }
        static final class PlainRenderer implements Renderer {
          public String render(String content) { return content; }
        }
        record PrefixRenderer(Renderer delegate, String prefix) implements Renderer {
          public String render(String content) { return prefix + delegate.render(content); }
        }
        record UpperRenderer(Renderer delegate) implements Renderer {
          public String render(String content) {
            return delegate.render(content).toUpperCase(Locale.ROOT);
          }
        }
        record Screen(Renderer renderer) {
          String show(String message) { return renderer.render(message); }
        }
        static void contract(Renderer renderer) {
          assert renderer.render("") != null;
          assert renderer.render("text") != null;
        }
        public static void main(String[] args) {
          Renderer plain = new PlainRenderer();
          Renderer themed = new PrefixRenderer(plain, "Theme:");
          Renderer upper = new UpperRenderer(themed);
          contract(plain); contract(themed); contract(upper);
          assert new Screen(plain).show("hello").equals("hello");
          assert new Screen(themed).show("hello").equals("Theme:hello");
          assert new Screen(upper).show("hello").equals("THEME:HELLO");
        }
      }
      ~~~

      Kiểm chứng: javac Demo12.java; java -ea Demo12. Thay đổi Theme/Upper chỉ đổi collaborator của màn hình cần dùng; contract tests cho Renderer giúp phát hiện lệch behavior khi refactor. Cần regression/snapshot test các màn hình thật trước và sau refactor để xác định ảnh hưởng UI, không coi minh họa đã test production.
- groupID: 6
  groupName: Đa hình, dispatch và biến thể hành vi
  cases:
  - situation: Mã xử lý báo cáo lặp đi lặp lại instanceof cho từng loại nhân viên nên thêm vị trí mới phải sửa nhiều caller.
    readmeRelated:
      anchorList:
      - subtyping-006
      - polymorphism-009
      - solid-003
      - design-patterns-008
      - testing-009
      - refactoring-006
    resolve: Đưa report behavior cần biến thiên vào interface nhân viên hoặc strategy tương ứng; giảm lặp instanceof tại caller.
    knowledge: Subtype polymorphism, Tell Don't Ask và OCP.
    code: |-
      Loại nhân viên tự chịu trách nhiệm tạo báo cáo. Caller chỉ biết interface, thêm loại mới không cần thêm instanceof/switch.

      ~~~java
      import java.util.List;
      public class Case1 {
          interface EmployeeReport { String report(); }
          record Developer(String name) implements EmployeeReport {
              public String report() { return "DEV:" + name; }
          }
          record Designer(String name) implements EmployeeReport {
              public String report() { return "DESIGN:" + name; }
          }
          record Intern(String name) implements EmployeeReport {
              public String report() { return "INTERN:" + name; }
          }
          static String aggregate(List<EmployeeReport> people) {
              return String.join("|", people.stream().map(EmployeeReport::report).toList());
          }
          public static void main(String[] args) {
              var people = List.<EmployeeReport>of(new Developer("An"), new Designer("Binh"));
              if (!aggregate(people).equals("DEV:An|DESIGN:Binh")) throw new AssertionError();
              var expanded = List.<EmployeeReport>of(new Developer("An"), new Designer("Binh"), new Intern("Chi"));
              if (!aggregate(expanded).endsWith("INTERN:Chi")) throw new AssertionError();
          }
      }
      ~~~

      Kỳ vọng: có thể thêm Intern mà không sửa aggregate; phần cần biến thiên nằm tại subtype.
  - situation: Một tập lệnh switch theo type code ở controller, service và UI làm hai thành phần hiểu khác nhau về cùng một
      loại giao dịch.
    readmeRelated:
      anchorList:
      - polymorphism-009
      - solid-003
      - design-pitfalls-005
      - refactoring-006
    resolve: Tập trung mapping type code và hành vi vào một tầng hoặc polymorphic API; dùng contract tests tránh cách hiểu
      lệch giữa UI/service.
    knowledge: Dynamic dispatch, type codes và consistency.
    code: |-
      Tập trung mapping type code trong registry chung. Controller, service và UI nhận cùng TxView, thay vì tự switch theo mã ở từng tầng.

      ~~~java
      import java.util.Map;
      public class Case2 {
          enum Kind { CARD, CASH }
          record Transaction(Kind kind, int cents) {}
          record TxView(String label, int payableCents) {}
          interface TxPolicy { TxView apply(Transaction transaction); }
          static final Map<Kind, TxPolicy> POLICIES = Map.of(
              Kind.CARD, t -> new TxView("card", t.cents() + 50),
              Kind.CASH, t -> new TxView("cash", t.cents()));
          static TxView resolve(Transaction t) {
              TxPolicy p = POLICIES.get(t.kind());
              if (p == null) throw new IllegalArgumentException("Unsupported transaction");
              return p.apply(t);
          }
          static TxView controller(Transaction t) { return resolve(t); }
          static TxView service(Transaction t) { return resolve(t); }
          static TxView ui(Transaction t) { return resolve(t); }
          public static void main(String[] args) {
              Transaction card = new Transaction(Kind.CARD, 1000);
              if (!controller(card).equals(service(card))) throw new AssertionError();
              if (!service(card).equals(ui(card))) throw new AssertionError();
              if (ui(card).payableCents() != 1050) throw new AssertionError();
          }
      }
      ~~~

      Kỳ vọng: mọi layer có cùng label và số tiền phải trả khi dùng chung policy; regression test giúp phát hiện khác biệt.
  - situation: Hai biến thể tính thuế dùng cùng interface nhưng khác nhau trong việc làm tròn, khiến hợp đồng chung không
      bảo đảm kết quả tương đương.
    readmeRelated:
      anchorList:
      - abstraction-004
      - interface-008
      - subtyping-007
      - solid-004
      - testing-004
      - testing-005
    resolve: Xác định chính sách rounding là một phần contract của tính thuế, thống nhất precision và các case biên cho mọi
      implementation.
    knowledge: Semantic contracts, money rounding và contract tests.
    code: |-
      Quy định rõ BigDecimal, precision và HALF_UP trong contract rồi áp cho mọi biến thể tính thuế. Không làm tròn ở điểm khác nhau giữa các implementation.

      ~~~java
      import java.math.*;
      public class Case3 {
          interface Tax { BigDecimal tax(BigDecimal amount); }
          static BigDecimal rounded(BigDecimal amount, BigDecimal rate) {
              if (amount == null || amount.signum() < 0)
                  throw new IllegalArgumentException("Invalid amount");
              return amount.multiply(rate).setScale(2, RoundingMode.HALF_UP);
          }
          static class DirectTax implements Tax {
              public BigDecimal tax(BigDecimal amount) {
                  return rounded(amount, new BigDecimal("0.10"));
              }
          }
          static class ConfigurableTax implements Tax {
              private final BigDecimal rate;
              ConfigurableTax(BigDecimal rate) { this.rate = rate; }
              public BigDecimal tax(BigDecimal amount) { return rounded(amount, rate); }
          }
          static void contract(Tax implementation) {
              if (!implementation.tax(new BigDecimal("0.45")).equals(new BigDecimal("0.05")))
                  throw new AssertionError("Rounding boundary");
              if (!implementation.tax(new BigDecimal("0.44")).equals(new BigDecimal("0.04")))
                  throw new AssertionError("Rounding mismatch");
          }
          public static void main(String[] args) {
              contract(new DirectTax());
              contract(new ConfigurableTax(new BigDecimal("0.10")));
          }
      }
      ~~~

      Kỳ vọng: cùng chính sách 10% cho kết quả 0.05 và 0.04 tại các biên, bất kể implementation.
  - situation: Một object được giữ trong biến kiểu superclass nhưng caller liên tục cast sang subclass để gọi phương thức
