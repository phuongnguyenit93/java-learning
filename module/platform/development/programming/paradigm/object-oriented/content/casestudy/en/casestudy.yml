  - situation: 'An Order holds both a Customer reference and a copy of the shipping address, but the team cannot tell which data source is allowed to change.'
    readmeRelated:
      anchorList:
      - object-006
      - object-007
      - encapsulation-007
      - composition-007
      - class-design-006
      - practice-011
    resolve: 'Distinguish Customer''s current address from the address snapshot taken when ordering; clearly name fields and the snapshot moment.'
    knowledge: 'Entity references, historical snapshots, and aggregate ownership.'
    code: |-
      ### Case 1 ? A Customer's current address differs from a confirmed Order address

      Orders retain customer IDs to look up current details, but shipping addresses must be snapshots taken when an order is created. Mixing these roles lets customer-profile edits rewrite shipping history.

      ~~~java
      public class Case1 {
          record Address(String street) {}
          static final class Customer {
              final String id;
              private Address current;
              Customer(String id, Address address) { this.id=id; current=address; }
              Address currentAddress() { return current; }
              void changeAddress(Address next) { current=next; }
          }
          record Order(String id, String customerId, Address shippingAtPurchase) {}
          static void check(boolean ok) { if(!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              Customer customer = new Customer("C1", new Address("Số 10"));
              Order order = new Order("O1", customer.id, customer.currentAddress());
              customer.changeAddress(new Address("Số 20"));
              check(customer.currentAddress().street().equals("Số 20"));
              check(order.shippingAtPurchase().street().equals("Số 10"));
              check(order.customerId().equals("C1"));
              System.out.println("PASS: historical shipping snapshot");
          }
      }
      ~~~

      Verification: compile and run Case1.java (JDK 17+). Two assertions show that the current address changes but the order snapshot stays fixed. Address is a record containing only immutable Strings; mutable List/Date members would require deep copies. Real systems must define when snapshots become final and rules for editing an address before shipment.
  - situation: 'A TreeNode changes parent, but the old parent''s children list still contains it, producing inconsistent traversals.'
    readmeRelated:
      anchorList:
      - relationships-004
      - relationships-005
      - relationships-006
      - modeling-005
      - testing-003
      - testing-010
    resolve: 'Update parent and children using one reparent operation: remove from the old parent, add to the new, reject cycles, and test graph integrity.'
    knowledge: 'Bidirectional associations, graph invariants, and consistency.'
    code: |-
      ### Case 2 ? Reparenting TreeNode must update both sides and reject cycles

      Assigning child.parent directly without removing the old parent.children reference breaks bidirectional consistency. Centralize reparent behavior and check for cycles before modifying the graph.

      ~~~java
      import java.util.*;
      public class Case2 {
          static final class Node {
              final String id;
              Node parent;
              final List<Node> children = new ArrayList<>();
              Node(String id) { this.id=id; }
              void moveTo(Node newParent) {
                  if (newParent == this) throw new IllegalArgumentException("self");
                  for (Node x=newParent; x!=null; x=x.parent)
                      if (x==this) throw new IllegalArgumentException("cycle");
                  if (parent!=null) parent.children.remove(this);
                  parent=newParent;
                  if (newParent!=null) newParent.children.add(this);
              }
          }
          static void check(boolean ok) { if(!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              Node a=new Node("A"), b=new Node("B"), child=new Node("C");
              child.moveTo(a);
              check(a.children.contains(child) && child.parent==a);
              child.moveTo(b);
              check(!a.children.contains(child));
              check(b.children.contains(child) && child.parent==b);
              try { b.moveTo(child); throw new AssertionError("cycle accepted"); }
              catch (IllegalArgumentException expected) {}
              check(b.parent==null && child.parent==b);
              child.moveTo(null);
              check(child.parent==null && b.children.isEmpty());
              System.out.println("PASS: reparent consistent");
          }
      }
      ~~~

      Verification: run Case2.java; verify both directions after each move and ensure rejected cycles leave the graph unchanged. This is a single-threaded example; concurrent graph edits need shared locking or transactions for the whole operation.
  - situation: 'Deleting a department accidentally deletes employees because object ownership between the two types is misunderstood.'
    readmeRelated:
      anchorList:
      - composition-002
      - composition-007
      - relationships-003
      - modeling-005
    resolve: 'Treat employee lifecycles as independent of departments; prevent inappropriate cascade deletes and reassign employees before deletion.'
    knowledge: 'Association versus composition, ownership, and cascade semantics.'
    code: |-
      ### Case 3 ? Department does not completely own Employee lifecycles

      Employees retain separate identities and remain after departments close. Reject deletion of a department that still contains employees; reassign them before deletion rather than cascading Employee deletes.

      ~~~java
      import java.util.*;
      public class Case3 {
          record Employee(String id, String name) {}
          static final class Directory {
              final Map<String,Employee> employees = new HashMap<>();
              final Map<String,Set<String>> departments = new HashMap<>();
              void addDepartment(String id) { departments.put(id,new HashSet<>()); }
              void hire(Employee e,String dept) {
                  if(!departments.containsKey(dept))throw new IllegalArgumentException();
                  employees.put(e.id(),e);
                  departments.get(dept).add(e.id());
              }
              void transfer(String employeeId,String from,String to) {
                  if(!employees.containsKey(employeeId)||!departments.containsKey(to)
                      ||!departments.get(from).contains(employeeId))
                      throw new IllegalArgumentException();
                  departments.get(from).remove(employeeId);
                  departments.get(to).add(employeeId);
              }
              void deleteDepartment(String id) {
                  Set<String> members=departments.get(id);
                  if(members==null)throw new IllegalArgumentException();
                  if(!members.isEmpty())throw new IllegalStateException("reassign first");
                  departments.remove(id);
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Directory d=new Directory();
              d.addDepartment("OLD");d.addDepartment("NEW");
              d.hire(new Employee("E1","Lan"),"OLD");
              try {d.deleteDepartment("OLD");throw new AssertionError();}
              catch(IllegalStateException expected){}
              d.transfer("E1","OLD","NEW");
              d.deleteDepartment("OLD");
              check(d.employees.containsKey("E1"));
              check(d.departments.get("NEW").contains("E1"));
              check(!d.departments.containsKey("OLD"));
              System.out.println("PASS: employee lifecycle independent");
          }
      }
      ~~~

      Verification: deletion must fail with employees present, but succeed after reassignment without deleting employees. Databases require FK, ON DELETE, and transaction policies; Map operations do not demonstrate ORM cascade guarantees.
  - situation: 'An object holds parent and child references bidirectionally, so JSON serialization enters an infinite loop.'
    readmeRelated:
      anchorList:
      - relationships-005
      - relationships-006
      - class-design-004
      - class-design-009
    resolve: 'Return DTOs or serialize one direction/ID references; avoid traversing the entire parent-child cycle when producing JSON.'
    knowledge: 'Object-graph cycles, serialization boundaries, and DTO mapping.'
    code: |-
      ### Case 4 ? One-way DTOs avoid cycles during object-graph serialization

      If Parent holds Children and Child holds Parent, a serializer following every getter may recurse forever. Map the graph to DTOs with parentId and childId values rather than recursive circular references.

      ~~~java
      import java.util.*;
      public class Case4 {
          static class Parent {
              final String id; final List<Child> children=new ArrayList<>();
              Parent(String id){this.id=id;}
          }
          static class Child {
              final String id; final Parent parent;
              Child(String id,Parent parent){this.id=id;this.parent=parent;}
          }
          record ParentDto(String id,List<String> childIds){}
          static ParentDto toDto(Parent parent){
              List<String> ids=new ArrayList<>();
              for(Child c:parent.children)ids.add(c.id);
              return new ParentDto(parent.id,List.copyOf(ids));
          }
          static String toJsonLike(ParentDto dto){
              return "{\"id\":\""+dto.id()+"\",\"childIds\":[\""
                  +String.join("\",\"",dto.childIds())+"\"]}";
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Parent p=new Parent("P");
              Child c=new Child("C",p);p.children.add(c);
              check(c.parent==p && p.children.contains(c)); // Cycle object graph.
              ParentDto dto=toDto(p);
              check(dto.childIds().equals(List.of("C")));
              check(toJsonLike(dto).equals("{\"id\":\"P\",\"childIds\":[\"C\"]}"));
              System.out.println("PASS: exported DTO is acyclic");
          }
      }
      ~~~

      Verification: run Case4.java. toJsonLike uses fixed illustrative IDs and is **not a general-purpose JSON serializer**, because it does not escape all characters. Do not run an infinitely recursive serializer; real Jackson/framework integrations require tests and explicit reference/ignore/DTO configurations.
  - situation: 'Two aggregates refer to each other, and each constructor requires the other to exist first, making initialization impossible.'
    readmeRelated:
      anchorList:
      - relationships-007
      - modeling-005
    resolve: 'Break constructor cycles using a factory/orchestrator and post-creation ID references; reassess aggregate boundaries.'
    knowledge: 'Circular dependencies, aggregate boundaries, and construction order.'
    code: |-
      ### Case 5 ? Break constructor cycles with ID references and factories

      Aggregate A requires an existing B while B requires A, so there is no valid construction order. Aggregates should have independent identities and lifecycles; link them by ID after each object is valid.

      ~~~java
      public class Case5 {
          record CustomerId(String value) {
              CustomerId {
                  if(value==null||value.isBlank())throw new IllegalArgumentException();
              }
          }
          record OrderId(String value) {
              OrderId {
                  if(value==null||value.isBlank())throw new IllegalArgumentException();
              }
          }
          record Customer(CustomerId id){}
          record Order(OrderId id,CustomerId customerId){}
          static final class Factory {
              Order createOrder(OrderId oid,Customer customer){
                  if(customer==null)throw new IllegalArgumentException("customer");
                  return new Order(oid,customer.id()); // Không nhúng Customer vào Order.
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Customer customer=new Customer(new CustomerId("C1"));
              Order order=new Factory().createOrder(new OrderId("O1"),customer);
              check(order.customerId().equals(customer.id()));
              check(order.id().value().equals("O1"));
              try {
                  new Factory().createOrder(new OrderId("O2"),null);
                  throw new AssertionError("null customer accepted");
              } catch(IllegalArgumentException expected){}
              System.out.println("PASS: independent valid aggregates");
          }
      }
      ~~~

      Verification: creating Customer first or OrderId first no longer requires cyclic constructors; domain relationships use CustomerId. The example removes model-level cycles but does not prove atomic database writes: real boundaries need transactions/sagas and a review of whether Order is a separate aggregate.
  - situation: 'Services read deeply nested data through getter chains, so changes to Customer internals force widespread service changes.'
    readmeRelated:
      anchorList:
      - encapsulation-004
      - encapsulation-008
      - class-design-009
      - design-pitfalls-007
      - refactoring-004
    resolve: 'Move operations onto the object owning the relevant information or an appropriate facade; reduce deep getters and external mutations.'
    knowledge: 'Law of Demeter, Tell Don''t Ask, and encapsulation.'
    code: |-
      ### Case 6 ? Tell Don't Ask reduces deep getter chains

      External code reads customer.getWallet().getBalance() to decide whether a purchase is allowed; changing Wallet representation then affects callers. Ask Customer a domain question instead of exposing nested references.

      ~~~java
      public class Case6 {
          static final class Wallet {
              private final long cents;
              Wallet(long cents){this.cents=cents;}
              boolean canCover(long amount){return amount>=0 && cents>=amount;}
          }
          static final class Customer {
              private final Wallet wallet;
              Customer(Wallet wallet){this.wallet=wallet;}
              boolean canPurchase(long cents){return wallet.canCover(cents);}
          }
          static final class Checkout {
              String decision(Customer c,long cents){
                  return c.canPurchase(cents)?"APPROVED":"DECLINED";
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Customer c=new Customer(new Wallet(1_000));
              Checkout service=new Checkout();
              check(service.decision(c,800).equals("APPROVED"));
              check(service.decision(c,1_200).equals("DECLINED"));
              check(service.decision(c,-1).equals("DECLINED"));
              System.out.println("PASS: caller does not inspect Wallet internals");
          }
      }
      ~~~

      Verification: Checkout invokes only public behavior; changing Wallet from cents to Money need not change Checkout when Customer.canPurchase retains its contract. This is a pre-check demonstration; real payment flows must debit atomically rather than relying on check-then-act.
  - situation: 'A Cart public method returns a live list, letting callers add items without enforcing line-count limits.'
    readmeRelated:
      anchorList:
      - encapsulation-006
      - encapsulation-008
      - composition-007
      - class-design-007
      - testing-003
    resolve: 'Hide Cart''s live list; enforce limits in addItem and return immutable snapshots so updates pass through the aggregate root.'
    knowledge: 'Aggregate boundaries, representation exposure, and invariants.'
    code: |-
      ### Case 7 ? Cart enforces item limits through its aggregate root

      Returning a live List lets callers add entries without checking limits. Cart must keep its list private, expose guarded addItem, and return immutable snapshots.

      ~~~java
      import java.util.*;
      public class Case7 {
          static class BadCart {
              final List<String> items=new ArrayList<>();
              List<String> items(){return items;}
          }
          static class Cart {
              private final int maxItems;
              private final List<String> items=new ArrayList<>();
              Cart(int maxItems){if(maxItems<1)throw new IllegalArgumentException();this.maxItems=maxItems;}
              void addItem(String sku){
                  if(sku==null||sku.isBlank()||items.size()>=maxItems)
                      throw new IllegalArgumentException("limit or sku");
                  items.add(sku);
              }
              List<String> snapshot(){return List.copyOf(items);}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BadCart bad=new BadCart();
              bad.items().addAll(List.of("A","B","C"));
              check(bad.items().size()==3); // Bỏ qua giới hạn.
              Cart cart=new Cart(2);
              cart.addItem("A");cart.addItem("B");
              try {cart.addItem("C");throw new AssertionError();}
              catch(IllegalArgumentException expected){}
              try {cart.snapshot().add("X");throw new AssertionError();}
              catch(UnsupportedOperationException expected){}
              check(cart.snapshot().equals(List.of("A","B")));
              System.out.println("PASS: capacity invariant enforced");
          }
      }
      ~~~

      Verification: the flawed path accepts three items; the corrected one rejects the third and prevents callers from modifying snapshots. This limits line count, not quantity per SKU; different domains need different rules and trusted backend stock checks.
  - situation: 'A class registers a listener on a long-lived object without unregistering, so an unused object remains retained in memory.'
    readmeRelated:
      anchorList:
      - lifecycle-006
      - design-patterns-010
    resolve: 'Tie unsubscribe/close to the listener lifecycle or use weak subscriptions when appropriate; verify release behavior.'
    knowledge: 'Observer lifecycles, memory retention, and resource cleanup.'
    code: |-
      ### Case 8 ? Listeners must unsubscribe with their owner lifecycle

      A subscriber registers with a long-lived bus and never unsubscribes; the bus retains a strong reference after the UI closes. An AutoCloseable Subscription handles cleanup; verify listener/callback counts instead of fabricating garbage-collection results.

      ~~~java
      import java.util.*;
      public class Case8 {
          interface Listener {void onEvent(String value);}
          static final class Bus {
              final List<Listener> listeners=new ArrayList<>();
              AutoCloseable subscribe(Listener listener){
                  listeners.add(listener);
                  return ()->listeners.remove(listener);
              }
              void publish(String value){
                  for(Listener l:List.copyOf(listeners))l.onEvent(value);
              }
              int listenerCount(){return listeners.size();}
          }
          static final class Tab implements AutoCloseable {
              final List<String> received=new ArrayList<>();
              private final AutoCloseable subscription;
              Tab(Bus bus){subscription=bus.subscribe(received::add);}
              @Override public void close() throws Exception {subscription.close();}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args) throws Exception {
              Bus bus=new Bus();
              Tab tab=new Tab(bus);
              bus.publish("first");
              check(tab.received.equals(List.of("first")));
              check(bus.listenerCount()==1);
              tab.close();
              bus.publish("second");
              check(bus.listenerCount()==0);
              check(tab.received.equals(List.of("first")));
              System.out.println("PASS: unsubscribe prevents retained subscription");
          }
      }
      ~~~

      Verification: listener count drops from 1 to 0 and callbacks stop after close. This proves the strong bus reference was removed; it **does not prove the GC reclaimed the object**. Heap dumps or weak-reference checks can provide further evidence in specialized tests.
  - situation: 'Developers assume composition automatically owns every dependency lifecycle, accidentally closing a shared collaborator.'
    readmeRelated:
      anchorList:
      - lifecycle-008
      - composition-007
      - relationships-003
    resolve: 'Explicitly assign dependency creation and closing responsibility; do not close shared collaborators when one composite stops using them, and let owners manage scope.'
    knowledge: 'Composition ownership, lifecycle scopes, and dependency management.'
    code: |-
      ### Case 9 ? Composition does not imply permission to close shared dependencies

      A Service retaining a shared Logger does not own the Logger's lifecycle. Only ResourceOwner may close it; closing Service deactivates only that service without closing the shared collaborator.

      ~~~java
      public class Case9 {
          static final class SharedLogger implements AutoCloseable {
              private boolean closed;
              private int count;
              void log(String text){
                  if(closed)throw new IllegalStateException("closed");
                  count++;
              }
              int count(){return count;}
              boolean closed(){return closed;}
              @Override public void close(){closed=true;}
          }
          static final class Service implements AutoCloseable {
              private final SharedLogger logger; // Borrowed, not owned.
              private boolean closed;
              Service(SharedLogger logger){this.logger=logger;}
              void handle(){
                  if(closed)throw new IllegalStateException("service closed");
                  logger.log("handled");
              }
              @Override public void close(){closed=true;}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              SharedLogger logger=new SharedLogger();
              Service a=new Service(logger),b=new Service(logger);
              a.handle();a.close();
              check(!logger.closed());
              b.handle();check(logger.count()==2);
              b.close();logger.close();
              check(logger.closed());
              System.out.println("PASS: shared collaborator closed only by owner");
          }
      }
      ~~~

      Verification: closing Service A must not break Service B, and the owner closes only after all consumers finish. Real systems should document ownership in DI scopes/lifecycles and test shutdown cleanup; shared collaborators may need separate thread-safety guarantees.
  - situation: 'A module constructs a concrete repository in its constructor, forcing unit tests to connect to a database for a simple calculation.'
    readmeRelated:
      anchorList:
      - interface-009
      - composition-006
      - solid-006
      - solid-007
      - testing-007
    resolve: 'Inject a Repository interface and use fake/in-memory implementations for unit tests, with concrete adapters wired at the composition root.'
    knowledge: 'Constructor injection, DIP, and test isolation.'
    code: |-
      ### Case 10 ? Inject Repository to unit-test calculations without a DB

      Constructing JdbcRepository inside a module means even a simple calculation starts with a database connection. Inject the interface through the constructor; use a fake returning fixed data and test failures.

      ~~~java
      public class Case10 {
          interface PriceRepository {long priceFor(String sku);}
          static final class PricingService {
              private final PriceRepository prices;
              PricingService(PriceRepository prices){this.prices=prices;}
              long total(String sku,int count){
                  if(count<=0)throw new IllegalArgumentException("count");
                  long price=prices.priceFor(sku);
                  if(price<0)throw new IllegalStateException("negative price");
                  return Math.multiplyExact(price,count);
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              PriceRepository fake=sku->"A".equals(sku)?300:500;
              PricingService service=new PricingService(fake);
              check(service.total("A",2)==600);
              check(service.total("B",1)==500);
              try {service.total("A",0);throw new AssertionError();}
              catch(IllegalArgumentException expected){}
              PricingService invalid=new PricingService(sku->-1);
              try {invalid.total("A",1);throw new AssertionError();}
              catch(IllegalStateException expected){}
              System.out.println("PASS: pure unit test without a database");
          }
      }
      ~~~

      Verification: compile/run Case10.java without DB, queue, or Spring context. Production may wire JdbcPriceRepository at the composition root, but its SQL adapter still needs separate integration tests; unit fakes do not prove persistence works.
  - situation: 'A service receives shared mutable application configuration, allowing request A to change request B''s processing parameters.'
    readmeRelated:
      anchorList:
      - class-006
      - object-005
      - object-007
      - design-pitfalls-008
    resolve: 'Use per-request or appropriately scoped immutable configuration snapshots; do not let requests mutate singleton settings.'
    knowledge: 'Immutable configuration, request scope, and concurrent aliasing.'
    code: |-
      ### Case 11 ? Shared configuration should be immutable per request

      If all requests share MutableConfig, one request may change another request's timeout. Return an immutable record snapshot at each request boundary and prevent callers from mutating singleton settings.

      ~~~java
      public class Case11 {
          static final class MutableConfig {int timeout=10;}
          record RequestConfig(int timeout){
              RequestConfig {
                  if(timeout<=0)throw new IllegalArgumentException("timeout");
              }
          }
          static final class Service {
              private final RequestConfig config;
              Service(RequestConfig config){this.config=config;}
              int timeout(){return config.timeout();}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              MutableConfig shared=new MutableConfig();
              MutableConfig requestA=shared,requestB=shared;
              requestB.timeout=99;
              check(requestA.timeout==99); // Lỗi alias.
              RequestConfig snapshotA=new RequestConfig(10);
              RequestConfig snapshotB=new RequestConfig(99);
              Service a=new Service(snapshotA),b=new Service(snapshotB);
              check(a.timeout()==10 && b.timeout()==99);
              try {new RequestConfig(-1);throw new AssertionError();}
              catch(IllegalArgumentException expected){}
              System.out.println("PASS: per-request immutable config");
          }
      }
      ~~~

      Verification: tests demonstrate the mutable alias and two independent snapshots. For dynamic configuration, publish new immutable versions per request instead of modifying in place. This sequential test does not claim to stress-test concurrent traffic.
  - situation: 'Changing a one-to-many relationship to many-to-many breaks methods assuming every item has only one parent.'
    readmeRelated:
      anchorList:
      - relationships-004
      - relationships-006
      - modeling-005
      - testing-010
    resolve: 'Represent many-to-many links through association entities/collections with explicit identity; revise cardinality assumptions and test bidirectional add/remove.'
    knowledge: 'Multiplicity, association invariants, and relationship modeling.'
    code: |-
      ### Case 12 ? Many-to-many needs an association and consistent links

      The old model with a single Item parentId fails when items belong to multiple groups. Use Membership with a composite groupId-itemId key, idempotent add/remove, and bidirectional queries from one source of truth.

      ~~~java
      import java.util.*;
      public class Case12 {
          record Membership(String groupId,String itemId){}
          static final class Memberships {
              private final Set<Membership> edges=new HashSet<>();
              void add(String group,String item){
                  if(group==null||group.isBlank()||item==null||item.isBlank())
                      throw new IllegalArgumentException("key");
                  edges.add(new Membership(group,item));
              }
              void remove(String group,String item){
                  edges.remove(new Membership(group,item));
              }
              Set<String> itemsOf(String group){
                  Set<String> r=new HashSet<>();
                  for(Membership m:edges)if(m.groupId().equals(group))r.add(m.itemId());
                  return Set.copyOf(r);
              }
              Set<String> groupsOf(String item){
                  Set<String> r=new HashSet<>();
                  for(Membership m:edges)if(m.itemId().equals(item))r.add(m.groupId());
                  return Set.copyOf(r);
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Memberships m=new Memberships();
              m.add("G1","I1");m.add("G2","I1");m.add("G1","I1");
              check(m.groupsOf("I1").equals(Set.of("G1","G2")));
              check(m.itemsOf("G1").equals(Set.of("I1")));
              m.remove("G1","I1");
              check(m.groupsOf("I1").equals(Set.of("G2")));
              check(m.itemsOf("G1").isEmpty());
              try {m.add("", "I1");throw new AssertionError();}
              catch(IllegalArgumentException expected){}
              System.out.println("PASS: many-to-many membership consistent");
          }
      }
      ~~~

      Verification: add one item to 2 groups, avoid duplicate memberships, and remove from one without affecting the other. Real systems need FK, unique(group_id,item_id), and appropriate transactions/concurrency; a Set demo is not a database.
  - situation: 'Several domain objects reference one entity but store separate data copies, which become inconsistent over time.'
    readmeRelated:
      anchorList:
      - object-004
      - object-007
      - composition-007
      - relationships-001
      - class-design-006
      - practice-011
    resolve: 'Keep ID references to an authoritative entity; take explicit snapshots when history must be frozen rather than copying arbitrarily.'
    knowledge: 'Entity identity, sources of truth, and consistency.'
    code: |-
      ### Case 13 ? Share entities by ID instead of stale copies

      When orders embed copies of Customer names, profile updates leave current copies inconsistent. Store a CustomerId pointing to the authoritative registry; snapshot separately only when historical data must remain fixed.

      ~~~java
      import java.util.*;
      public class Case13 {
          record Customer(String id,String name){}
          record Order(String id,String customerId){}
          static final class Customers {
              private final Map<String,Customer> records=new HashMap<>();
              void save(Customer c){records.put(c.id(),c);}
              Customer find(String id){
                  Customer c=records.get(id);
                  if(c==null)throw new NoSuchElementException(id);
                  return c;
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Customers registry=new Customers();
              registry.save(new Customer("C1","Lan"));
              Customer staleCopy=registry.find("C1");
              Order a=new Order("O1","C1"),b=new Order("O2","C1");
              registry.save(new Customer("C1","Lan Nguyễn"));
              check(staleCopy.name().equals("Lan")); // Bản copy không tự sync.
              check(registry.find(a.customerId()).name().equals("Lan Nguyễn"));
              check(registry.find(b.customerId()).name().equals("Lan Nguyễn"));
              System.out.println("PASS: shared identity resolves current source");
          }
      }
      ~~~

      Verification: two orders referencing one ID both see the updated Customer through the registry, while old copies are stale. Distributed registries/APIs and caches can still lag; use invalidation/versioning when needed. An address frozen at order confirmation is an **intentional historical snapshot**, not a value that must automatically follow profile changes.
- groupID: 8
  groupName: 'SOLID, Dependencies, and Module Boundaries'
  cases:
  - situation: 'Two modules import one another through a chain of packages, creating cyclic dependencies that prevent independent builds or tests.'
    readmeRelated:
      anchorList:
      - relationships-007
      - class-design-003
      - solid-006
      - design-pitfalls-007
    resolve: 'Build a dependency graph to find cycles; move shared contracts to an independent module or replace backward calls with ports/events.'
    knowledge: 'Module cycles, DIP, and acyclic dependencies.'
    code: |-
      Separate shared contracts so policies and adapters depend downward without reverse package imports. The dependency graph below demonstrates the cycle disappearing after restructuring.

      ~~~java
      import java.util.*;
      public class Demo1 {
        static boolean cyclic(Map<String, Set<String>> edges) {
          Set<String> visiting = new HashSet<>(), visited = new HashSet<>();
          for (String module : edges.keySet())
            if (walk(module, edges, visiting, visited)) return true;
          return false;
        }
        static boolean walk(String node, Map<String, Set<String>> edges,
                            Set<String> visiting, Set<String> visited) {
          if (visiting.contains(node)) return true;
          if (visited.contains(node)) return false;
          visiting.add(node);
          for (String child : edges.getOrDefault(node, Set.of()))
            if (walk(child, edges, visiting, visited)) return true;
          visiting.remove(node);
          visited.add(node);
          return false;
        }
        public static void main(String[] args) {
          Map<String, Set<String>> before = Map.of(
            "orders", Set.of("sql"),
            "sql", Set.of("orders"));
          Map<String, Set<String>> after = Map.of(
            "orders", Set.of("contracts"),
            "sql", Set.of("contracts"),
            "contracts", Set.of());
          assert cyclic(before);
          assert !cyclic(after);
        }
      }
      ~~~

      Verification: javac Demo1.java and java -ea Demo1. In real repositories, build the graph from Gradle/project dependencies or jdeps, assert equivalent constraints, and compile each module separately. Contract modules hold stable interfaces/DTOs; SQL implementations belong in infrastructure and are wired at the composition root. This check does not claim an actual project build was run.
  - situation: 'A high-level business rule must change after a minor SQL query edit because the rule directly depends on persistence.'
    readmeRelated:
      anchorList:
      - abstraction-008
      - interface-009
      - class-design-004
      - solid-006
      - testing-007
    resolve: 'Make high-level policies depend on a Repository port, implemented by SQL adapters in infrastructure; prevent query details leaking into business rules.'
    knowledge: 'Dependency Inversion, persistence ports, and hexagonal architecture.'
    code: |-
      Business policy sees only a Repository port and domain models. SQL mapping belongs inside adapters; approve rules do not know table names or queries.

      ~~~java
      import java.util.*;
      import java.sql.*;
      public class Demo2 {
        record Order(String id, long cents) {}
        interface OrderRepository { Optional<Order> find(String id); }
        static final class ApprovalPolicy {
          private final OrderRepository orders;
          ApprovalPolicy(OrderRepository orders) { this.orders = orders; }
          boolean requiresReview(String id) {
            Order order = orders.find(id).orElseThrow();
            return order.cents() >= 100_000;
          }
        }
        // Adapter hạ tầng: không import vào ApprovalPolicy.
        record JdbcOrders(Connection connection) implements OrderRepository {
          public Optional<Order> find(String id) {
            try (PreparedStatement stmt = connection.prepareStatement(
                "SELECT order_id, cents FROM orders WHERE order_id = ?")) {
              stmt.setString(1, id);
              try (ResultSet rows = stmt.executeQuery()) {
                if (!rows.next()) return Optional.empty();
                return Optional.of(new Order(rows.getString(1), rows.getLong(2)));
              }
            } catch (SQLException e) {
              throw new IllegalStateException("order lookup failed", e);
            }
          }
        }
        public static void main(String[] args) {
          OrderRepository fake = id -> switch (id) {
            case "small" -> Optional.of(new Order(id, 9_000));
            case "large" -> Optional.of(new Order(id, 250_000));
            default -> Optional.empty();
          };
          ApprovalPolicy policy = new ApprovalPolicy(fake);
          assert !policy.requiresReview("small");
          assert policy.requiresReview("large");
        }
      }
      ~~~

      Verification: javac Demo2.java and java -ea Demo2 (JDK 21). Unit tests use fakes; changing SQL databases leaves ApprovalPolicy unchanged. Test JDBC adapters separately with real schemas, sample data, and query errors.
  - situation: 'An order-management class sends email, calculates fees, posts ledger entries, and updates inventory, so infrastructure failures corrupt unrelated business work.'
    readmeRelated:
      anchorList:
      - class-design-001
      - class-design-004
      - solid-002
      - design-pitfalls-001
      - testing-010
      - refactoring-003
    resolve: 'Separate pricing, stock, accounting, and notifications; orchestrate use cases with transactions and failure-handling mechanisms for side effects.'
    knowledge: 'SRP, transaction boundaries, and fault isolation.'
    code: |-
      Separate pricing policies, stock updates, ledger entries, and notifications. The use case writes data plus an outbox in one transaction; email is an external side effect handled after the transaction.

      ~~~java
      import java.util.*;
      public class Demo3 {
        record Order(String id, long cents) {}
        record Event(String kind, String orderId) {}
        interface Pricing { long total(long baseCents); }
        interface Stock { void reserve(String orderId); }
        interface Ledger { void post(Order order); }
        interface Outbox { void enqueue(Event event); }
        interface UnitOfWork { void inTransaction(Runnable work); }
        interface Mailer { void send(Event event); }

        record Checkout(Pricing pricing, Stock stock, Ledger ledger,
                        Outbox outbox, UnitOfWork uow) {
          void place(String id, long base) {
            long total = pricing.total(base);
            uow.inTransaction(() -> {
              stock.reserve(id);
              ledger.post(new Order(id, total));
              outbox.enqueue(new Event("ORDER_PLACED", id));
            });
          }
        }
        public static void main(String[] args) {
          List<String> calls = new ArrayList<>();
          List<Event> pending = new ArrayList<>();
          Pricing price = base -> base + 100;
          Stock stock = id -> calls.add("stock:" + id);
          Ledger ledger = order -> calls.add("ledger:" + order.cents());
          Outbox outbox = pending::add;
          UnitOfWork fakeTx = Runnable::run; // chỉ kiểm luồng, không mô phỏng rollback
          Checkout checkout = new Checkout(price, stock, ledger, outbox, fakeTx);
          checkout.place("O1", 900);
          Mailer failingMail = event -> { throw new IllegalStateException("SMTP down"); };
          try {
            failingMail.send(pending.get(0));
            throw new AssertionError("expected mail failure");
          } catch (IllegalStateException expected) { }
          assert calls.equals(List.of("stock:O1", "ledger:1000"));
          assert pending.equals(List.of(new Event("ORDER_PLACED", "O1")));
        }
      }
      ~~~

      Verification: javac Demo3.java and java -ea Demo3. Tests show email failures do not erase pending events or change checkout flow. In production, Stock/Ledger/Outbox must genuinely share a DB transaction; test rollback, retries, idempotency, and eventual delivery through integration tests. Runnable::run here is not a real transaction.
  - situation: 'A read-only class is injected with an administrative deletion interface, granting access beyond its needs.'
    readmeRelated:
      anchorList:
      - interface-006
      - solid-005
      - design-pitfalls-006
    resolve: 'Separate ReadOnlyRepository and AdminRepository; inject only needed capabilities, not write/delete operations into read-only clients.'
    knowledge: 'ISP, least privilege, and capability security.'
    code: |-
      Reporting clients receive only ReadOnlyRepository. Administrative deletion is a separate interface, so reporting code has no delete method available.

      ~~~java
      import java.util.*;
      public class Demo4 {
        record Item(String id, String value) {}
        interface ReadOnlyRepository { Optional<Item> find(String id); }
        interface AdminRepository { void delete(String id); }
        static final class Storage implements ReadOnlyRepository, AdminRepository {
          private final Map<String, Item> data = new HashMap<>();
          Storage() { data.put("A", new Item("A", "visible")); }
          public Optional<Item> find(String id) { return Optional.ofNullable(data.get(id)); }
          public void delete(String id) { data.remove(id); }
        }
        record Reporter(ReadOnlyRepository data) {
          String show(String id) { return data.find(id).orElseThrow().value(); }
          // data.delete(id); // compile error: ReadOnlyRepository không có delete
        }
        public static void main(String[] args) {
          Storage storage = new Storage();
          Reporter reporter = new Reporter(storage);
          assert reporter.show("A").equals("visible");
          assert storage.find("A").isPresent();
        }
      }
      ~~~

      Verification: javac Demo4.java and java -ea Demo4; uncommenting data.delete must be rejected by the compiler. Compile-time capabilities restrict Reporter APIs only; actual servers, DB credentials, and endpoints still require authorization and least-privilege controls.
  - situation: 'A service constructor takes 18 dependencies, indicating many unrelated responsibilities have been concentrated in one coordinator.'
    readmeRelated:
      anchorList:
      - class-design-001
      - class-design-002
      - solid-002
      - design-pitfalls-001
      - refactoring-003
    resolve: 'Group the 18 dependencies by responsibility/use case and split overgrown coordinators; do not hide dependencies behind a service locator.'
    knowledge: 'SRP, high coupling, and constructor-dependency smells.'
    code: |-
      Constructors with 18 dependencies suggest mixed responsibilities. Split into use cases with appropriate ports rather than replacing 18 parameters with a huge ServiceLocator.

      ~~~java
      import java.util.*;
      public class Demo5 {
        interface Prices { long quote(String sku); }
        interface Inventory { boolean available(String sku); }
        interface Mail { void notifyUser(String user, String content); }

        record QuoteItem(Prices prices, Inventory inventory) {
          long quote(String sku) {
            if (!inventory.available(sku)) throw new IllegalStateException("out of stock");
            return prices.quote(sku);
          }
        }
        record NotifyOrder(Mail mail) {
          void completed(String user) { mail.notifyUser(user, "order completed"); }
        }
        public static void main(String[] args) {
          List<String> sent = new ArrayList<>();
          QuoteItem pricing = new QuoteItem(sku -> 8000, sku -> sku.equals("A"));
          NotifyOrder notifications = new NotifyOrder(
            (user, content) -> sent.add(user + ":" + content));
          assert pricing.quote("A") == 8000;
          try { pricing.quote("B"); throw new AssertionError("expected stock error"); }
          catch (IllegalStateException expected) { }
          notifications.completed("customer-1");
          assert sent.equals(List.of("customer-1:order completed"));
        }
      }
      ~~~

      Verification: javac Demo5.java and java -ea Demo5. QuoteItem has just two pricing dependencies; NotifyOrder only needs Mail, and each use case has its own fake in tests. For real refactoring, classify all 18 dependencies by use case, regression-test each flow, and check for remaining cycles or duplicated responsibilities.
  - situation: 'Adding a write method for one client to an interface stops all existing read-only implementations from compiling.'
    readmeRelated:
      anchorList:
      - interface-006
      - interface-007
      - solid-005
      - design-pitfalls-006
    resolve: 'Split broad interfaces into read/write contracts and retain old APIs when migration is required; safeguard compatibility with compile tests.'
    knowledge: 'ISP, interface evolution, and backward compatibility.'
    code: |-
      Do not add write operations to a read interface already implemented by all adapters. Define a separate writing capability so readers still compile and writers depend on an explicit contract.

      ~~~java
      import java.util.*;
      public class Demo6 {
        // Giữ nguyên contract công khai đã tồn tại.
        interface ReadStore { Optional<String> get(String id); }
        interface WriteStore { void put(String id, String value); }

        static final class LegacyReadReplica implements ReadStore {
          public Optional<String> get(String id) {
            return id.equals("A") ? Optional.of("old") : Optional.empty();
          }
        }
        static final class ReadWriteStore implements ReadStore, WriteStore {
          private final Map<String, String> values = new HashMap<>();
          public Optional<String> get(String id) { return Optional.ofNullable(values.get(id)); }
          public void put(String id, String value) { values.put(id, value); }
        }
        record Viewer(ReadStore store) {
          Optional<String> view(String id) { return store.get(id); }
        }
        record Editor(WriteStore store) {
          void edit(String id, String value) { store.put(id, value); }
        }
        public static void main(String[] args) {
          assert new Viewer(new LegacyReadReplica()).view("A").orElseThrow().equals("old");
          ReadWriteStore db = new ReadWriteStore();
          new Editor(db).edit("B", "new");
          assert new Viewer(db).view("B").orElseThrow().equals("new");
        }
      }
      ~~~

      Verification: javac Demo6.java and java -ea Demo6. LegacyReadReplica need not add put or throw UnsupportedOperationException. Published APIs also require compilation tests against older client/adapter versions and binary compatibility checks on real artifacts; testing a single file does not establish full compatibility.
  - situation: 'Application and infrastructure classes call into one another, so small adapter changes cascade into business rules.'
    readmeRelated:
      anchorList:
      - abstraction-008
      - interface-009
      - class-design-004
      - solid-006
      - design-pitfalls-007
    resolve: 'Direct application dependencies toward ports, implemented by infrastructure; remove reverse imports and inspect module dependency graphs.'
    knowledge: 'The Dependency Rule, DIP, and architecture boundaries.'
    code: |-
      Applications define and depend only on ports; infrastructure implements those contracts without arbitrary callbacks into business implementations. A composition root connects both sides.

      ~~~java
      import java.util.*;
      public class Demo7 {
        record Order(String id, long cents) {}
        // Application boundary
        interface OrderReader { Optional<Order> find(String id); }
        static final class Approval {
          private final OrderReader orders;
          Approval(OrderReader orders) { this.orders = orders; }
          boolean large(String id) {
            return orders.find(id).orElseThrow().cents() >= 100_000;
          }
        }
        // Infrastructure adapter; trong module thật đặt ở infrastructure.
        static final class SqlAdapter implements OrderReader {
          public Optional<Order> find(String id) {
            return id.equals("O1") ? Optional.of(new Order(id, 120_000)) : Optional.empty();
          }
        }
        // Composition root
        public static void main(String[] args) {
          OrderReader adapter = new SqlAdapter();
          Approval approval = new Approval(adapter);
          assert approval.large("O1");
          assert !new Approval(id -> Optional.of(new Order(id, 500))).large("O2");
          // Approval không new SqlAdapter() và không import class infra.
        }
      }
      ~~~

      Verification: javac Demo7.java and java -ea Demo7 verifies that replacing an adapter with a fake leaves policies unchanged. In real modules: application -> contracts/domain; infrastructure -> contracts/domain; composition-root -> application + infrastructure. Use graph/import rules (jdeps/ArchUnit if available) to detect application-to-infrastructure imports and cycles; one-file demos do not enforce module boundaries.
  - situation: 'Engineers apply every SOLID principle by adding factories, decorators, providers, and services to a small application, obscuring actual problems.'
    readmeRelated:
      anchorList:
      - oop-basic-008
      - abstraction-007
      - solid-008
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-008
    resolve: 'Remove abstractions without valuable variation or test seams; favor readable, evidence-backed designs for simple flows.'
    knowledge: 'Pragmatic SOLID, KISS, and YAGNI.'
    code: |-
      Apply SOLID at real change points. For one fixed tax policy, a clear concrete class and regression tests are easier to follow than unnecessary factory/provider/decorator layers.

      ~~~java
      public class Demo8 {
        static final class InvoiceCalculator {
          long total(long subtotalCents) {
            if (subtotalCents < 0) throw new IllegalArgumentException("subtotal");
            long tax = Math.multiplyExact(subtotalCents, 10) / 100;
            return Math.addExact(subtotalCents, tax);
          }
        }
        static final class InvoiceService {
          private final InvoiceCalculator calculator;
          InvoiceService(InvoiceCalculator calculator) { this.calculator = calculator; }
          long issue(long subtotal) { return calculator.total(subtotal); }
        }
        public static void main(String[] args) {
          var service = new InvoiceService(new InvoiceCalculator());
          assert service.issue(0) == 0;
          assert service.issue(10_000) == 11_000;
          try { service.issue(-1); throw new AssertionError("expected validation"); }
          catch (IllegalArgumentException expected) { }
        }
      }
      ~~~

      Verification: javac Demo8.java and java -ea Demo8. Assertions preserve behavior after removing redundant wrappers; review class count, edit locations, and actual changes before introducing abstractions. There are no quantitative performance/maintainability measurements yet; use diffs and actual business-change exercises.
  - situation: 'A component resolves dependencies through a global service locator inside each method, so tests cannot tell what services to prepare.'
    readmeRelated:
      anchorList:
      - composition-006
      - solid-007
      - testing-007
    resolve: 'Declare required dependencies in constructors instead of runtime locator lookup; tests then explicitly supply suitable fakes.'
    knowledge: 'Dependency injection versus Service Locator, and explicit dependencies.'
    code: |-
      Service locators hide runtime dependencies in methods; constructor injection requires callers and tests to supply the necessary ports at object creation.

      ~~~java
      import java.util.*;
      public class Demo9 {
        interface Catalog { int unitPrice(String sku); }
        interface Orders { void save(String id, int cents); }
        static final class Checkout {
          private final Catalog catalog;
          private final Orders orders;
          Checkout(Catalog catalog, Orders orders) {
            this.catalog = Objects.requireNonNull(catalog, "catalog");
            this.orders = Objects.requireNonNull(orders, "orders");
          }
          void place(String id, String sku, int qty) {
            if (qty <= 0) throw new IllegalArgumentException("qty");
            orders.save(id, Math.multiplyExact(catalog.unitPrice(sku), qty));
          }
        }
        public static void main(String[] args) {
          Map<String,Integer> saved = new HashMap<>();
          Catalog fakeCatalog = sku -> 1500;
          Orders fakeOrders = saved::put;
          Checkout checkout = new Checkout(fakeCatalog, fakeOrders);
          checkout.place("O1", "SKU", 3);
          assert saved.get("O1") == 4500;
          try {
            new Checkout(null, fakeOrders);
            throw new AssertionError("missing dependency must fail early");
          } catch (NullPointerException expected) { }
        }
      }
      ~~~

      Verification: javac Demo9.java and java -ea Demo9. Tests see Catalog and Orders dependencies in constructors and no longer depend on global locator setup order. Only composition roots should know production adapters; avoid static-global service lookups within use cases.
  - situation: 'A mutable Singleton stores the current user across requests, mixing login data between customers.'
    readmeRelated:
      anchorList:
      - class-003
      - object-007
      - design-patterns-004
      - design-pitfalls-008
    resolve: 'Keep current-user identity out of singletons; use authenticated request/security contexts and avoid shared mutable per-user state.'
    knowledge: 'Singleton scope, thread isolation, and authorization contexts.'
    code: |-
      Identity belongs to immutable request contexts passed into stateless services. Never store currentUser in a mutable singleton, where concurrent requests can overwrite each other.

      ~~~java
      import java.util.concurrent.*;
      public class Demo10 {
        record RequestContext(String authenticatedUserId) {
          RequestContext {
            if (authenticatedUserId == null || authenticatedUserId.isBlank())
              throw new IllegalArgumentException("no authenticated identity");
          }
        }
        static final class ProfileService {
          String profileFor(RequestContext request) {
            return "profile:" + request.authenticatedUserId();
          }
        }
        public static void main(String[] args) throws Exception {
          ProfileService singleton = new ProfileService();
          ExecutorService pool = Executors.newFixedThreadPool(2);
          try {
            CountDownLatch start = new CountDownLatch(1);
            Future<String> a = pool.submit(() -> {
              start.await();
              return singleton.profileFor(new RequestContext("alice"));
            });
            Future<String> b = pool.submit(() -> {
              start.await();
              return singleton.profileFor(new RequestContext("bob"));
            });
            start.countDown();
            assert a.get().equals("profile:alice");
            assert b.get().equals("profile:bob");
          } finally { pool.shutdownNow(); }
        }
      }
      ~~~

      Verification: javac Demo10.java and java -ea Demo10. One singleton serves two requests without a per-user field. A framework must construct RequestContext from verified security principals/signed tokens, not userId claimed in request bodies. Separately test real security filters and concurrent requests for data leaks.
  - situation: 'Two services require one another through constructors during dependency-injection setup, preventing the app from starting.'
    readmeRelated:
      anchorList:
      - composition-006
      - relationships-007
      - solid-007
      - design-pitfalls-007
    resolve: 'Separate responsibilities to eliminate constructor cycles, moving orchestration to a third service or using unidirectional ports.'
    knowledge: 'DI cycles, DAG construction, and service decomposition.'
    code: |-
      Do not fix constructor cycles with lazy global lookups. Move orchestration into a third service so Billing and Inventory initialize independently and Coordinator coordinates them.

      ~~~java
      import java.util.*;
      public class Demo11 {
        interface RateTable { long unitPrice(String sku); }
        static final class Billing {
          private final RateTable rates;
          Billing(RateTable rates) { this.rates = Objects.requireNonNull(rates); }
          long charge(String sku, int qty) {
            return Math.multiplyExact(rates.unitPrice(sku), qty);
          }
        }
        static final class Inventory {
          private final Set<String> available;
          Inventory(Set<String> available) { this.available = Set.copyOf(available); }
          boolean canShip(String sku) { return available.contains(sku); }
        }
        record Coordinator(Billing billing, Inventory inventory) {
          long purchase(String sku, int qty) {
            if (qty <= 0 || !inventory.canShip(sku))
              throw new IllegalArgumentException("not available");
            return billing.charge(sku, qty);
          }
        }
        public static void main(String[] args) {
          Billing billing = new Billing(sku -> 2000);
          Inventory inventory = new Inventory(Set.of("A"));
          Coordinator coordinator = new Coordinator(billing, inventory);
          assert coordinator.purchase("A", 3) == 6000;
          try { coordinator.purchase("B", 3); throw new AssertionError(); }
          catch (IllegalArgumentException expected) { }
        }
      }
      ~~~

      Verification: javac Demo11.java and java -ea Demo11. Construction flows RateTable -> Billing, Inventory, then Coordinator, with no reverse dependency. In real DI containers, test context creation and bean graphs by module to detect remaining circular constructor injections.
  - situation: 'Many classes share one huge interface because a few methods have similar names, forcing implementations to expose invalid behaviors.'
    readmeRelated:
      anchorList:
      - interface-006
      - solid-005
      - design-pitfalls-006
    resolve: 'Split interfaces by supported capabilities rather than making implementations throw for meaningless methods.'
    knowledge: 'ISP, LSP, and role segregation.'
    code: |-
      Separate fat interfaces into real capabilities: a local searchable adapter may read but should not be forced to write or reindex. Clients request only necessary ports.

      ~~~java
      import java.util.*;
      public class Demo12 {
        interface Searchable { Optional<String> find(String key); }
        interface Writable { void save(String key, String value); }
        interface Reindexable { void rebuildIndex(); }

        static final class ReadOnlyMirror implements Searchable {
          public Optional<String> find(String key) {
            return key.equals("A") ? Optional.of("mirror") : Optional.empty();
          }
        }
        static final class PrimaryStore implements Searchable, Writable, Reindexable {
          private final Map<String,String> data = new HashMap<>();
          private int rebuilds;
          public Optional<String> find(String key) { return Optional.ofNullable(data.get(key)); }
          public void save(String key, String value) { data.put(key, value); }
          public void rebuildIndex() { rebuilds++; }
          int rebuildCount() { return rebuilds; }
        }
        record Reader(Searchable search) {
          Optional<String> lookup(String key) { return search.find(key); }
        }
        public static void main(String[] args) {
          assert new Reader(new ReadOnlyMirror()).lookup("A").orElseThrow().equals("mirror");
          PrimaryStore primary = new PrimaryStore();
          primary.save("B", "primary");
          primary.rebuildIndex();
          assert new Reader(primary).lookup("B").orElseThrow().equals("primary");
          assert primary.rebuildCount() == 1;
          // new ReadOnlyMirror().save("X", "bad"); // compile error: no Writable capability
        }
      }
      ~~~

      Verification: javac Demo12.java and java -ea Demo12; uncommenting save on ReadOnlyMirror must fail compilation. Implementations no longer throw UnsupportedOperationException for outside-role methods. Grant Reindexable only to administration components, not readers.
  - situation: 'Adding a discount type requires developers to change core framework structures and every caller.'
    readmeRelated:
      anchorList:
      - interface-008
      - polymorphism-009
      - solid-003
      - design-patterns-008
      - testing-009
    resolve: 'Extend only the discount policy variation point without modifying core framework behavior; preserve stable contracts and compatibility tests.'
    knowledge: 'OCP, extension points, and abstraction boundaries.'
    code: |-
      Place the extension point in DiscountPolicy; CheckoutCalculator calls only the stable contract. New promotions add implementations without modifying core logic or callers.

      ~~~java
      public class Demo13 {
        interface DiscountPolicy { long discount(long cents); }
        static final class NoDiscount implements DiscountPolicy {
          public long discount(long cents) { return 0; }
        }
        record PercentOff(int percent) implements DiscountPolicy {
          PercentOff {
            if (percent < 0 || percent > 100)
              throw new IllegalArgumentException("percent");
          }
          public long discount(long cents) {
            return Math.multiplyExact(cents, percent) / 100;
          }
        }
        // Policy mới chỉ thêm vào extension point có sẵn.
        record FixedOff(long centsOff) implements DiscountPolicy {
          FixedOff {
            if (centsOff < 0) throw new IllegalArgumentException("discount");
          }
          public long discount(long cents) { return Math.min(cents, centsOff); }
        }
        record CheckoutCalculator(DiscountPolicy policy) {
          long total(long baseCents) {
            if (baseCents < 0) throw new IllegalArgumentException("amount");
            long discount = policy.discount(baseCents);
            if (discount < 0 || discount > baseCents)
              throw new IllegalStateException("invalid discount policy");
            return baseCents - discount;
          }
        }
        static void contract(DiscountPolicy policy) {
          long result = new CheckoutCalculator(policy).total(10_000);
          assert result >= 0 && result <= 10_000;
        }
        public static void main(String[] args) {
          contract(new NoDiscount());
          contract(new PercentOff(20));
          contract(new FixedOff(1_500));
          assert new CheckoutCalculator(new NoDiscount()).total(10_000) == 10_000;
          assert new CheckoutCalculator(new PercentOff(20)).total(10_000) == 8_000;
          assert new CheckoutCalculator(new FixedOff(1_500)).total(10_000) == 8_500;
        }
      }
      ~~~

      Verification: javac Demo13.java and java -ea Demo13. Adding FixedOff does not change CheckoutCalculator, and contract tests cover each policy. If discounts need ordered stacking or cross-policy constraints, deliberately evolve the contract and test combinations before release.
- groupID: 9
  groupName: 'Design Patterns and Component Interactions'
  cases:
  - situation: 'A team applies Strategy to three changing formulas but duplicates strategy selection across many controllers.'
    readmeRelated:
      anchorList:
      - composition-005
      - composition-006
      - solid-003
      - design-patterns-008
      - testing-009
    resolve: 'Centralize Strategy selection at a factory/application boundary; controllers invoke pricing services through contracts.'
    knowledge: 'Strategy, composition roots, and DRY selection logic.'
    code: |-
      Move Strategy selection into one factory at the application boundary. Controllers call only PricingService; both APIs and batch jobs share the selected strategy through that service.

      ~~~java
      import java.util.Map;
      public class Case1 {
          enum Plan { STANDARD, VIP, STAFF }
          interface Pricing { int total(int cents); }
          static final class PricingFactory {
              private static final Map<Plan, Pricing> STRATEGIES = Map.of(
                  Plan.STANDARD, cents -> cents,
                  Plan.VIP, cents -> cents * 9 / 10,
                  Plan.STAFF, cents -> cents * 8 / 10);
              static Pricing select(Plan plan) {
                  Pricing result = STRATEGIES.get(plan);
                  if (result == null) throw new IllegalArgumentException("Unknown plan");
                  return result;
              }
          }
          static final class PricingService {
              int quote(Plan plan, int cents) {
                  if (cents < 0) throw new IllegalArgumentException();
                  return PricingFactory.select(plan).total(cents);
              }
          }
          static final class WebController {
              private final PricingService service;
              WebController(PricingService service) { this.service = service; }
              int quote(Plan plan) { return service.quote(plan, 1000); }
          }
          static final class BatchController {
              private final PricingService service;
              BatchController(PricingService service) { this.service = service; }
              int quote(Plan plan) { return service.quote(plan, 1000); }
          }
          public static void main(String[] args) {
              PricingService service = new PricingService();
              WebController web = new WebController(service);
              BatchController batch = new BatchController(service);
              for (Plan plan : Plan.values())
                  if (web.quote(plan) != batch.quote(plan))
                      throw new AssertionError("Duplicated selection diverged");
              if (web.quote(Plan.VIP) != 900 || batch.quote(Plan.STAFF) != 800)
                  throw new AssertionError();
          }
      }
      ~~~

      Expected: both controllers return consistent results without their own strategy-selection switch/instanceof. Add a new plan only to the factory and rerun contract tests.
  - situation: 'A factory reads environment configuration from global variables, so tests and production create objects with unexpected dependencies.'
    readmeRelated:
      anchorList:
      - lifecycle-005
      - composition-006
      - solid-007
      - design-patterns-002
      - testing-007
    resolve: 'Pass environment/config explicitly into factories; test every profile and avoid mutable global state.'
    knowledge: 'Abstract Factory, configuration injection, and reproducibility.'
    code: |-
      Pass configuration explicitly into the factory at each call instead of reading mutable globals. Tests can create dependencies for two environments in the same process.

      ~~~java
      public class Case2 {
          enum Environment { TEST, PRODUCTION }
          record Config(Environment environment, String endpoint) {
              Config {
                  if (environment == null || endpoint == null || endpoint.isBlank())
                      throw new IllegalArgumentException("Missing config");
              }
          }
          record Client(String endpoint) {}
          static final class ClientFactory {
              static Client create(Config config) {
                  return new Client(config.endpoint());
              }
          }
          static void contract(Config config, String expectedEndpoint) {
              Client client = ClientFactory.create(config);
              if (!client.endpoint().equals(expectedEndpoint)) throw new AssertionError();
          }
          public static void main(String[] args) {
              Config test = new Config(Environment.TEST, "http://test.internal");
              Config prod = new Config(Environment.PRODUCTION, "https://prod.internal");
              contract(test, "http://test.internal");
              contract(prod, "https://prod.internal");
              contract(test, "http://test.internal");
          }
      }
      ~~~

      Expected: TEST still returns its test endpoint after PROD is constructed; behavior does not depend on globals. Actual endpoints require separate deployment-policy validation.
  - situation: 'An Abstract Factory creates a staging database client but a production messaging client, sending data to the wrong environment.'
    readmeRelated:
      anchorList:
      - lifecycle-005
      - design-patterns-002
      - testing-010
    resolve: 'Constrain all clients in one factory family to the same environment; validate profiles and reject mixed dependencies before startup.'
    knowledge: 'Abstract Factory product families and environment isolation.'
    code: |-
      An Abstract Factory creates the entire database/messaging client family for one environment. Enforce family invariants during assembly rather than manually mixing unrelated SDK objects.

      ~~~java
      public class Case3 {
          enum Env { STAGING, PRODUCTION }
          record DatabaseClient(Env env) {}
          record MessagingClient(Env env) {}
          interface ClientFamily {
              Env env();
              DatabaseClient database();
              MessagingClient messaging();
          }
          record StagingFactory() implements ClientFamily {
              public Env env() { return Env.STAGING; }
              public DatabaseClient database() { return new DatabaseClient(env()); }
              public MessagingClient messaging() { return new MessagingClient(env()); }
          }
          record ProductionFactory() implements ClientFamily {
              public Env env() { return Env.PRODUCTION; }
              public DatabaseClient database() { return new DatabaseClient(env()); }
              public MessagingClient messaging() { return new MessagingClient(env()); }
          }
          record Application(DatabaseClient db, MessagingClient message) {
              Application {
                  if (db.env() != message.env())
                      throw new IllegalArgumentException("Mixed environments");
              }
          }
          static Application build(ClientFamily family) {
              Application app = new Application(family.database(), family.messaging());
              if (app.db().env() != family.env()) throw new IllegalStateException();
              return app;
          }
          public static void main(String[] args) {
              if (build(new StagingFactory()).message().env() != Env.STAGING)
                  throw new AssertionError();
              if (build(new ProductionFactory()).db().env() != Env.PRODUCTION)
                  throw new AssertionError();
              try {
                  new Application(new DatabaseClient(Env.STAGING),
                                  new MessagingClient(Env.PRODUCTION));
                  throw new AssertionError("Mixed clients accepted");
              } catch (IllegalArgumentException expected) {}
          }
      }
      ~~~

      Expected: staging and prod each have consistent families; mixing a staging database with production messaging is rejected before the application starts.
  - situation: 'An audit-logging Decorator changes the wrapped service''s exception, so callers observe an error inconsistent with the original contract.'
    readmeRelated:
      anchorList:
      - abstraction-004
      - interface-008
      - subtyping-007
      - solid-004
      - design-patterns-006
      - language-mechanics-008
    resolve: 'Preserve the Decorator''s success/error contract; log exceptions and rethrow appropriately without introducing a different public exception.'
    knowledge: 'Decorator transparency, exception propagation, and LSP.'
    code: |-
      An audit decorator must preserve the original service's results and exception identity. Catch only to log and then rethrow the very same error.

      ~~~java
      import java.util.ArrayList;
      import java.util.List;
      public class Case4 {
          interface Service { String execute(); }
          static final class AuditDecorator implements Service {
              final Service delegate;
              final List<String> audit;
              AuditDecorator(Service delegate, List<String> audit) {
                  this.delegate = delegate;
                  this.audit = audit;
              }
              public String execute() {
                  try {
                      String result = delegate.execute();
                      audit.add("success");
                      return result;
                  } catch (RuntimeException original) {
                      audit.add("failed:" + original.getClass().getSimpleName());
                      throw original;
                  }
              }
          }
          public static void main(String[] args) {
              List<String> events = new ArrayList<>();
              Service success = new AuditDecorator(() -> "OK", events);
              if (!"OK".equals(success.execute())) throw new AssertionError();
              IllegalArgumentException original = new IllegalArgumentException("invalid");
              Service failure = new AuditDecorator(() -> { throw original; }, events);
              try {
                  failure.execute();
                  throw new AssertionError("Expected original exception");
              } catch (IllegalArgumentException caught) {
                  if (caught != original) throw new AssertionError("Exception changed");
              }
              if (!events.equals(List.of("success", "failed:IllegalArgumentException")))
                  throw new AssertionError("Audit mismatch");
          }
      }
      ~~~

      Expected: success returns the original result; failures are audited but callers receive the same exception. If logging itself may throw, protect the original error from being masked.
  - situation: 'An external-service Adapter leaks vendor enums and DTOs into the domain, so SDK upgrades break many domain classes.'
    readmeRelated:
      anchorList:
      - abstraction-008
      - interface-009
      - class-design-004
      - solid-006
      - design-patterns-005
    resolve: 'Map vendor DTOs/enums/errors to domain-owned contracts inside adapters; never expose SDK types in public domain APIs.'
    knowledge: 'Adapter, anti-corruption layers, and vendor isolation.'
    code: |-
      Adapters isolate vendor DTOs/enums/errors in infrastructure. Domain contracts use application-owned types; SDK upgrades affect adapter mappings only.

      ~~~java
      public class Case5 {
          enum DomainStatus { APPROVED, DECLINED }
          record PaymentResult(DomainStatus status, String reference) {}
          interface PaymentPort { PaymentResult pay(int cents); }
          static final class VendorSdk {
              enum Code { OK_V2, REJECTED_V2 }
              record VendorResponse(Code code, String vendorTxnId) {}
              VendorResponse charge(int cents) {
                  return cents > 0
                      ? new VendorResponse(Code.OK_V2, "v-1")
                      : new VendorResponse(Code.REJECTED_V2, "v-2");
              }
          }
          static final class VendorAdapter implements PaymentPort {
              private final VendorSdk sdk;
              VendorAdapter(VendorSdk sdk) { this.sdk = sdk; }
              public PaymentResult pay(int cents) {
                  VendorSdk.VendorResponse response = sdk.charge(cents);
                  DomainStatus status = switch (response.code()) {
                      case OK_V2 -> DomainStatus.APPROVED;
                      case REJECTED_V2 -> DomainStatus.DECLINED;
                  };
                  return new PaymentResult(status, response.vendorTxnId());
              }
          }
          static String checkout(PaymentPort port) {
              PaymentResult result = port.pay(100);
              return result.status().name() + ":" + result.reference();
          }
          public static void main(String[] args) {
              if (!"APPROVED:v-1".equals(checkout(new VendorAdapter(new VendorSdk()))))
                  throw new AssertionError();
          }
      }
      ~~~

      Expected: checkout and PaymentPort contain no VendorSdk types, and adapter mapping tests verify domain formats. Renaming a vendor enum affects only the adapter and its tests.
  - situation: 'A Facade combines backend calls, but a secondary step fails and callers cannot tell whether the primary operation succeeded.'
    readmeRelated:
      anchorList:
      - abstraction-004
      - class-design-008
      - modeling-007
      - design-patterns-007
      - language-mechanics-008
      - testing-010
    resolve: 'Define per-step Facade result semantics for partial success and retry/idempotency instead of hiding secondary failures.'
    knowledge: 'Facade, failure semantics, and idempotent orchestration.'
    code: |-
      The Facade returns explicit primary/secondary status: payment may succeed while receipt delivery fails. Retry uses the same requestId to avoid charging again.

      ~~~java
      import java.util.*;
      public class Case6 {
          record Receipt(String requestId, int chargedCents) {}
          enum Status { COMPLETED, PAID_RECEIPT_PENDING }
          record Result(Status status, Receipt receipt) {}
          static final class PaymentGateway {
              final Map<String, Receipt> charges = new HashMap<>();
              Receipt charge(String id, int cents) {
                  if (cents <= 0) throw new IllegalArgumentException();
                  Receipt previous = charges.get(id);
                  if (previous != null) {
                      if (previous.chargedCents() != cents)
                          throw new IllegalArgumentException("Conflicting idempotency key");
                      return previous;
                  }
                  Receipt receipt = new Receipt(id, cents);
                  charges.put(id, receipt);
                  return receipt;
              }
          }
          static final class ReceiptSender {
              boolean failNext = true;
              final Set<String> delivered = new HashSet<>();
              void send(Receipt receipt) {
                  if (delivered.contains(receipt.requestId())) return;
                  if (failNext) {
                      failNext = false;
                      throw new IllegalStateException("Email unavailable");
                  }
                  delivered.add(receipt.requestId());
              }
          }
          static final class CheckoutFacade {
              final PaymentGateway payment;
              final ReceiptSender sender;
              CheckoutFacade(PaymentGateway p, ReceiptSender s) { payment = p; sender = s; }
              Result checkout(String requestId, int cents) {
                  Receipt receipt = payment.charge(requestId, cents);
                  try {
                      sender.send(receipt);
                      return new Result(Status.COMPLETED, receipt);
                  } catch (IllegalStateException deliveryError) {
                      return new Result(Status.PAID_RECEIPT_PENDING, receipt);
                  }
              }
          }
          public static void main(String[] args) {
              PaymentGateway p = new PaymentGateway();
              ReceiptSender s = new ReceiptSender();
              CheckoutFacade facade = new CheckoutFacade(p, s);
              Result first = facade.checkout("order-7", 1000);
              if (first.status() != Status.PAID_RECEIPT_PENDING) throw new AssertionError();
              Result retried = facade.checkout("order-7", 1000);
              if (retried.status() != Status.COMPLETED) throw new AssertionError();
              if (p.charges.size() != 1 || s.delivered.size() != 1)
                  throw new AssertionError("Double charge or duplicate receipt");
          }
      }
      ~~~

      Expected: the first call returns PAID_RECEIPT_PENDING, and a retry completes the receipt with only one charge. The demo runs in memory; production needs durable idempotency keys and appropriate outboxes/queues.
  - situation: 'An Observer synchronously calls dozens of subscribers; one throws, preventing remaining subscribers from receiving the event.'
    readmeRelated:
      anchorList:
      - design-patterns-010
      - testing-010
    resolve: 'Isolate each callback''s errors during dispatch and consider async/event queues when appropriate; document ordering and retries.'
    knowledge: 'Observer, fault isolation, and event-delivery guarantees.'
    code: |-
      Observer dispatches callbacks one by one, catching failures separately; a broken subscriber does not block the rest. Collected errors are returned for monitoring.

      ~~~java
      import java.util.*;
      public class Case7 {
          interface Subscriber { void onEvent(String event); }
          static final class Bus {
              final List<Subscriber> subscribers = new ArrayList<>();
              void register(Subscriber s) { subscribers.add(s); }
              List<RuntimeException> publish(String event) {
                  List<RuntimeException> failures = new ArrayList<>();
                  for (Subscriber s : List.copyOf(subscribers)) {
                      try {
                          s.onEvent(event);
                      } catch (RuntimeException e) {
                          failures.add(e);
                      }
                  }
                  return failures;
              }
          }
          public static void main(String[] args) {
              Bus bus = new Bus();
              List<String> received = new ArrayList<>();
              bus.register(e -> received.add("A:" + e));
              bus.register(e -> { throw new IllegalStateException("broken subscriber"); });
              bus.register(e -> received.add("C:" + e));
              List<RuntimeException> failures = bus.publish("event-1");
              if (!received.equals(List.of("A:event-1", "C:event-1")))
                  throw new AssertionError("Delivery interrupted");
              if (failures.size() != 1
                  || !(failures.get(0) instanceof IllegalStateException))
                  throw new AssertionError("Failed subscriber not reported");
          }
      }
      ~~~

      Expected: A and C receive the event in registration order despite B failing, with errors retained. This is best-effort synchronous dispatch, not durable delivery or automatic retries.
  - situation: 'A listener is never unsubscribed when a UI tab closes, causing duplicate notifications every time the tab reopens.'
    readmeRelated:
      anchorList:
      - lifecycle-006
      - design-patterns-010
      - testing-010
    resolve: 'Unsubscribe on tab close, manage subscription handles, and make registration idempotent; test repeated open/close cycles.'
    knowledge: 'Observer listener lifecycles, cleanup, and duplicate events.'
    code: |-
      Each tab owns a Subscription handle that closes at lifecycle end. The registry uses listener instances as keys, so subscribing the same instance twice does not duplicate callbacks.

      ~~~java
      import java.util.*;
      import java.util.function.Consumer;
      public class Case8 {
          static final class Bus {
              private final Map<Consumer<String>, Subscription> active = new IdentityHashMap<>();
              Subscription subscribe(Consumer<String> listener) {
                  return active.computeIfAbsent(listener, c -> new Subscription(this, c));
              }
              void publish(String message) {
                  for (Consumer<String> listener : List.copyOf(active.keySet()))
                      listener.accept(message);
              }
              int count() { return active.size(); }
          }
          static final class Subscription implements AutoCloseable {
              private final Bus bus;
              private final Consumer<String> listener;
              private boolean closed;
              Subscription(Bus bus, Consumer<String> listener) {
                  this.bus = bus; this.listener = listener;
              }
              public void close() {
                  if (!closed) {
                      closed = true;
                      bus.active.remove(listener, this);
                  }
              }
          }
          public static void main(String[] args) {
              Bus bus = new Bus();
              List<String> notifications = new ArrayList<>();
              Consumer<String> listener = notifications::add;
              for (int open = 0; open < 3; open++) {
                  try (Subscription tab = bus.subscribe(listener)) {
                      if (tab != bus.subscribe(listener)) throw new AssertionError();
                      if (bus.count() != 1) throw new AssertionError();
                      bus.publish("open-" + open);
                  }
                  if (bus.count() != 0) throw new AssertionError("Listener leaked");
              }
              if (!notifications.equals(List.of("open-0", "open-1", "open-2")))
                  throw new AssertionError("Duplicate notifications");
          }
      }
      ~~~

      Expected: after three tab open/close cycles, exactly three notifications occur and no listeners remain. Real UI close() calls must be tied to unmount/dispose.
  - situation: 'An overridable Template Method hook changes execution order so data is written before validation.'
    readmeRelated:
      anchorList:
      - abstraction-004
      - inheritance-007
      - subtyping-001
      - design-patterns-011
      - testing-009
    resolve: 'Freeze mandatory validation before writing in the template; disallow hooks that break ordering or use composition.'
    knowledge: 'Template Method, invariant sequencing, and hook contracts.'
    code: |-
      Fix validate -> transform -> write ordering in a final template method. Hooks may customize data but cannot call write before validation.

      ~~~java
      import java.util.*;
      public class Case9 {
          static class Store {
              final List<String> saved = new ArrayList<>();
              void save(String data) { saved.add(data); }
          }
          static abstract class ImportTemplate {
              private final Store store;
              ImportTemplate(Store store) { this.store = store; }
              public final void execute(String raw) {
                  if (raw == null || raw.isBlank())
                      throw new IllegalArgumentException("Missing input");
                  String result = transform(raw);
                  if (result == null || result.isBlank())
                      throw new IllegalArgumentException("Invalid output");
                  store.save(result);
              }
              protected abstract String transform(String raw);
          }
          static class TrimImporter extends ImportTemplate {
              TrimImporter(Store store) { super(store); }
              @Override protected String transform(String raw) { return raw.trim(); }
          }
          public static void main(String[] args) {
              Store store = new Store();
              ImportTemplate importer = new TrimImporter(store);
              try {
                  importer.execute("  ");
                  throw new AssertionError("Invalid input accepted");
              } catch (IllegalArgumentException expected) {}
              if (!store.saved.isEmpty()) throw new AssertionError("Write before validation");
              importer.execute("  hello  ");
              if (!store.saved.equals(List.of("hello"))) throw new AssertionError();
          }
      }
      ~~~

      Expected: blank input is never written; valid input writes only transformed values. final execute preserves step-order invariants.
  - situation: 'A configuration Builder allows two mutually exclusive options simultaneously, causing errors only in production.'
    readmeRelated:
      anchorList:
      - lifecycle-005
      - encapsulation-002
      - encapsulation-005
      - design-patterns-003
      - testing-002
    resolve: 'Validate mutually exclusive options in build() before constructing config; consider sum types that prevent invalid combinations.'
    knowledge: 'Builder, cross-field invariants, and validation.'
    code: |-
      Builder validates cross-field invariants in build(). Plain HTTP and TLS are mutually exclusive modes, so bad configuration fails at construction time.

      ~~~java
      public class Case10 {
          record ClientConfig(boolean useTls, boolean allowPlainHttp, String host) {}
          static class ConfigBuilder {
              private boolean tls;
              private boolean plainHttp;
              private String host;
              ConfigBuilder tls(boolean value) { tls = value; return this; }
              ConfigBuilder plainHttp(boolean value) { plainHttp = value; return this; }
              ConfigBuilder host(String value) { host = value; return this; }
              ClientConfig build() {
                  if (tls == plainHttp)
                      throw new IllegalStateException("Choose exactly one transport");
                  if (host == null || host.isBlank())
                      throw new IllegalStateException("Host is required");
                  return new ClientConfig(tls, plainHttp, host);
              }
          }
          public static void main(String[] args) {
              ClientConfig valid = new ConfigBuilder()
                  .tls(true).plainHttp(false).host("api.example").build();
              if (!valid.useTls() || valid.allowPlainHttp()) throw new AssertionError();
              try {
                  new ConfigBuilder().tls(true).plainHttp(true)
                      .host("api.example").build();
                  throw new AssertionError("Conflicting options accepted");
              } catch (IllegalStateException expected) {}
          }
      }
      ~~~

      Expected: build() accepts exactly one transport and rejects both booleans being true. To prevent invalid combinations by type, replace the boolean pair with a TransportMode enum.
  - situation: 'State objects in the State pattern share mutable data, so one session''s transitions affect another session.'
    readmeRelated:
      anchorList:
      - class-003
      - object-005
      - object-007
      - design-patterns-009
      - design-pitfalls-008
    resolve: 'Do not share mutable state objects between sessions; use per-aggregate state or immutable state strategies and guard transitions.'
    knowledge: 'The State pattern, object lifetimes, and shared mutable state.'
    code: |-
      Immutable state behavior can be safely shared; changing data such as attempts stays in each session, with transitions protected by the aggregate.

      ~~~java
      public class Case11 {
          enum Phase { NEW, ACTIVE, CLOSED }
          interface StatePolicy { Phase transition(Phase next); }
          static final class ActivePolicy implements StatePolicy {
              public Phase transition(Phase next) {
                  if (next != Phase.CLOSED) throw new IllegalStateException("Illegal transition");
                  return Phase.CLOSED;
              }
          }
          static final class Session {
              private Phase phase = Phase.NEW;
              private int attempts;
              private final StatePolicy activePolicy = new ActivePolicy();
              void activate() {
                  if (phase != Phase.NEW) throw new IllegalStateException();
                  phase = Phase.ACTIVE;
              }
              void attempt() {
                  if (phase != Phase.ACTIVE) throw new IllegalStateException();
                  attempts++;
              }
              void close() {
                  if (phase != Phase.ACTIVE) throw new IllegalStateException();
                  phase = activePolicy.transition(Phase.CLOSED);
              }
              int attempts() { return attempts; }
              Phase phase() { return phase; }
          }
          public static void main(String[] args) {
              Session first = new Session(), second = new Session();
              first.activate(); second.activate();
              first.attempt(); first.attempt();
              if (first.attempts() != 2 || second.attempts() != 0)
                  throw new AssertionError("State leaked between sessions");
              first.close();
              if (first.phase() != Phase.CLOSED || second.phase() != Phase.ACTIVE)
                  throw new AssertionError("Transition affected another session");
          }
      }
      ~~~

      Expected: using and closing the first session does not change the second session's phase/attempts. Never store mutable attempts in singleton state policies.
  - situation: 'Deeply nested Decorators hide which wrapper changed request data when developers inspect stack traces.'
    readmeRelated:
      anchorList:
      - composition-003
      - design-patterns-006
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-008
    resolve: 'Reduce decorator layers and name/trace them clearly; assign wrapper responsibilities and preserve causes in exception handling.'
    knowledge: 'Decorator chains, observability, and exception chaining.'
    code: |-
      Limit decorators to clearly named responsibilities, trace each layer, and preserve original causes. Traces show which wrapper intervened.

      ~~~java
      import java.util.*;
      public class Case12 {
          record Request(String body) {}
          interface Handler { String handle(Request request); }
          static final class TrimDecorator implements Handler {
              final Handler next;
              final List<String> trace;
              TrimDecorator(Handler next, List<String> trace) {
                  this.next = next; this.trace = trace;
              }
              public String handle(Request request) {
                  trace.add("TrimDecorator");
                  return next.handle(new Request(request.body().trim()));
              }
          }
          static final class AuditDecorator implements Handler {
              final Handler next;
              final List<String> trace;
              AuditDecorator(Handler next, List<String> trace) {
                  this.next = next; this.trace = trace;
              }
              public String handle(Request request) {
                  trace.add("AuditDecorator");
                  try {
                      return next.handle(request);
                  } catch (RuntimeException e) {
                      throw new IllegalStateException("AuditDecorator failed", e);
                  }
              }
          }
          public static void main(String[] args) {
              List<String> trace = new ArrayList<>();
              IllegalArgumentException original = new IllegalArgumentException("bad payload");
              Handler terminal = request -> { throw original; };
              Handler chain = new AuditDecorator(new TrimDecorator(terminal, trace), trace);
              try {
                  chain.handle(new Request(" bad "));
                  throw new AssertionError("Expected failure");
              } catch (IllegalStateException wrapper) {
                  if (wrapper.getCause() != original) throw new AssertionError("Lost cause");
              }
              if (!trace.equals(List.of("AuditDecorator", "TrimDecorator")))
                  throw new AssertionError("Unknown wrapper sequence");
          }
      }
      ~~~

      Expected: the trace clearly identifies AuditDecorator -> TrimDecorator and preserves the original cause. During debugging, inspect traces and wrapped exceptions to locate transformations.
  - situation: 'A team replaces a simple switch with several patterns before any variant is needed, making minor rule changes difficult for newcomers.'
    readmeRelated:
      anchorList:
      - oop-basic-008
      - abstraction-007
      - solid-008
      - design-patterns-001
      - design-patterns-013
      - refactoring-008
    resolve: 'Apply patterns only when real variations or failure modes justify them; compare new-class overhead with simple switches and remove speculative abstractions.'
    knowledge: 'KISS, YAGNI, and pattern trade-offs.'
    code: |-
      For simple rules and a stable set of types, an enum switch makes behavior clearer than chains of classes/factories without meaningful variation. Introduce abstractions when substitution needs are demonstrated.

      ~~~java
      public class Case13 {
          enum Shipping { PICKUP, STANDARD, EXPRESS }
          static int fee(Shipping shipping, int cents) {
              if (shipping == null || cents < 0)
                  throw new IllegalArgumentException();
              return switch (shipping) {
                  case PICKUP -> 0;
                  case STANDARD -> cents >= 1000 ? 0 : 50;
                  case EXPRESS -> 150;
              };
          }
          public static void main(String[] args) {
              if (fee(Shipping.PICKUP, 500) != 0) throw new AssertionError();
              if (fee(Shipping.STANDARD, 800) != 50) throw new AssertionError();
              if (fee(Shipping.STANDARD, 1000) != 0) throw new AssertionError();
              if (fee(Shipping.EXPRESS, 1000) != 150) throw new AssertionError();
              try {
                  fee(null, 100);
                  throw new AssertionError("Missing input check");
              } catch (IllegalArgumentException expected) {}
          }
      }
      ~~~

      Expected: four contract tests preserve the original rule in one function. With no plugin or runtime-variation need, Strategy/Factory classes only increase maintenance work; reconsider when requirements change.
- groupID: 10
  groupName: 'Domain Models, Aggregates, and Transactions'
  cases:
  - situation: 'A Customer entity uses names as identity, so two customers with the same name collapse into one collection record.'
    readmeRelated:
      anchorList:
      - object-004
      - class-design-006
      - language-mechanics-006
      - design-pitfalls-009
      - practice-005
    resolve: 'Define Customer equality by customerId, treating names as nonunique attributes; test multiple customers sharing names.'
    knowledge: 'Entity identity, equals/hashCode, and mutable attributes.'
    code: |-
      ### Case 1 ? Customer entity identity comes from IDs, not names

      **Incorrect:** comparing entities by name merges customers with the same name in a Set. **Correct:** use an immutable customerId as identity; names are business attributes that may repeat or change.

      ~~~java
      import java.util.*;
      public class Case1 {
          record BadCustomer(String name) {}
          static final class Customer {
              private final String customerId;
              private String name;
              Customer(String id,String name) {
                  if(id==null || id.isBlank()) throw new IllegalArgumentException("id");
                  customerId=id;this.name=Objects.requireNonNull(name);
              }
              void rename(String value){name=Objects.requireNonNull(value);}
              @Override public boolean equals(Object other){
                  return this==other || other instanceof Customer c
                         && customerId.equals(c.customerId);
              }
              @Override public int hashCode(){return customerId.hashCode();}
          }
          static void check(boolean value){if(!value)throw new AssertionError();}
          public static void main(String[] args){
              Set<BadCustomer> wrong=new HashSet<>();
              wrong.add(new BadCustomer("An"));wrong.add(new BadCustomer("An"));
              check(wrong.size()==1); // Hai bản ghi khác bị gộp bởi tên.
              Customer a=new Customer("C1","An"),b=new Customer("C2","An");
              Set<Customer> good=new HashSet<>(List.of(a,b));
              check(good.size()==2);
              a.rename("Bình");
              check(good.contains(new Customer("C1","Bình")));
              check(!a.equals(b));
              System.out.println("PASS: stable Customer identity");
          }
      }
      ~~~

      **Expected verification:** compile/run with Java 17; assertions distinguish same-name customers and preserve identity after name changes. This assumes stable customerId values at construction; transient entities without IDs need a separate strategy rather than hashes derived from IDs that later change.
  - situation: 'A new entity enters a HashSet before the database assigns an ID; after persistence, contains returns false.'
    readmeRelated:
      anchorList:
      - object-004
      - object-005
      - language-mechanics-006
      - design-pitfalls-009
      - testing-001
    resolve: 'Do not derive stored Set object hashes from IDs assigned later; use stable identity or a separate immutable key.'
    knowledge: 'Transient entity identity, equals/hashCode, and hash-bucket invariants.'
    code: |-
      ### Case 2 ? Post-persist ID assignment breaks HashSet lookups

      **Incorrect:** hashCode uses a databaseId that is null at creation and changes after persistence, moving the expected bucket. **Correct:** use keys that remain stable while in hashed collections or IDs assigned before insertion.

      ~~~java
      import java.util.*;
      public class Case2 {
          static final class BadEntity {
              Long databaseId;
              @Override public boolean equals(Object other){
                  return this==other || other instanceof BadEntity e
                      && databaseId!=null && databaseId.equals(e.databaseId);
              }
              @Override public int hashCode(){return Objects.hashCode(databaseId);}
          }
          record EntityKey(UUID value){
              EntityKey{Objects.requireNonNull(value);}
          }
          static final class Entity {
              final EntityKey key;
              Long databaseId;
              Entity(EntityKey key){this.key=key;}
              @Override public boolean equals(Object other){
                  return this==other || other instanceof Entity e && key.equals(e.key);
              }
              @Override public int hashCode(){return key.hashCode();}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BadEntity wrong=new BadEntity();
              Set<BadEntity> broken=new HashSet<>();
              broken.add(wrong);
              int before=wrong.hashCode();
              wrong.databaseId=1L;
              check(before!=wrong.hashCode());
              // HashSet lookup sau mutate có thể không còn tìm được entry;
              // không phụ thuộc bucket collision để biến đây thành test bất ổn.
              Entity stable=new Entity(new EntityKey(UUID.randomUUID()));
              Set<Entity> good=new HashSet<>();
              good.add(stable);
              int hash=stable.hashCode();
              stable.databaseId=1L;
              check(stable.hashCode()==hash && good.contains(stable));
              System.out.println("PASS: hash key independent of generated DB id");
          }
      }
      ~~~

      **Expected verification:** hash changes for BadEntity but stays stable for Entity, and Set.contains works for the corrected design. BadEntity lookup is not guaranteed to fail under every hash-collision arrangement. For DB-assigned identities, avoid adding transient entities to Sets before persistence or use immutable separate keys.
  - situation: 'Two addresses with the same content are compared by reference and treated as different delivery locations.'
    readmeRelated:
      anchorList:
      - object-004
      - class-design-006
      - language-mechanics-006
      - practice-005
    resolve: 'Use immutable Address value objects with component-based equals/hashCode and an explicit normalization policy; do not compare references.'
    knowledge: 'Value equality, records/value objects, and normalization policies.'
    code: |-
      ### Case 3 ? Address is an immutable value object compared by value

      Two addresses with matching contents need not have identical references. Records provide component-based equals/hashCode; normalization needs an explicit domain policy before comparing.

      ~~~java
      import java.util.*;
      public class Case3 {
          static final class BadAddress {
              final String street,city;
              BadAddress(String street,String city){
                  this.street=street;this.city=city;
              }
          }
          record Address(String street,String city){
              Address{
                  street=normalize(street);
                  city=normalize(city);
              }
              static String normalize(String text){
                  if(text==null||text.isBlank())throw new IllegalArgumentException();
                  return text.trim().replaceAll("\\s+"," ").toLowerCase(Locale.ROOT);
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BadAddress a=new BadAddress("Số 1","Hà Nội");
              BadAddress b=new BadAddress("Số 1","Hà Nội");
              check(a!=b && !a.equals(b));
              Address x=new Address(" Số   1 "," HÀ NỘI");
              Address y=new Address("số 1","hà nội");
              check(x.equals(y));
              check(x.hashCode()==y.hashCode());
              check(new HashSet<>(List.of(x,y)).size()==1);
              try{new Address(" ","HN");throw new AssertionError();}
              catch(IllegalArgumentException expected){}
              System.out.println("PASS: normalized value equality");
          }
      }
      ~~~

      **Expected verification:** reference comparison fails in BadAddress while value comparison works in Address, including Sets. Example normalization only trims, collapses spaces, and lowercases; production addresses have abbreviations, house numbers, Vietnamese accents, and geographic codes, so this is not complete address normalization.
  - situation: 'A Money value object stores amounts as double, causing cumulative transaction calculations to differ when totals are compared.'
    readmeRelated:
      anchorList:
      - class-008
      - class-design-006
      - language-mechanics-005
      - practice-005
    resolve: 'Use BigDecimal or integer minor units for money; define currency-specific precision/rounding and test repeated additions.'
    knowledge: 'Money value objects, binary floating-point, and rounding policies.'
    code: |-
      ### Case 4 ? Money should not use double for exact addition

      Double cannot represent many decimal numbers, including 0.1 and 0.2, exactly. Money uses BigDecimal created from String, consistent scale/currency, and rejects additions across currencies.

      ~~~java
      import java.math.*;
      public class Case4 {
          record Money(String currency,BigDecimal amount){
              Money{
                  if(currency==null||currency.isBlank()||amount==null)
                      throw new IllegalArgumentException();
                  amount=amount.setScale(2,RoundingMode.HALF_UP);
              }
              Money plus(Money other){
                  if(!currency.equals(other.currency))
                      throw new IllegalArgumentException("currency mismatch");
                  return new Money(currency,amount.add(other.amount));
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              double wrong=0.1+0.2;
              check(wrong!=0.3); // Sai số IEEE-754.
              Money a=new Money("USD",new BigDecimal("0.10"));
              Money b=new Money("USD",new BigDecimal("0.20"));
              Money total=a.plus(b);
              check(total.amount().equals(new BigDecimal("0.30")));
              Money sum=total.plus(new Money("USD",new BigDecimal("0.70")));
              check(sum.amount().equals(new BigDecimal("1.00")));
              try{a.plus(new Money("EUR",new BigDecimal("0.20")));
                  throw new AssertionError("cross-currency accepted");
              }catch(IllegalArgumentException expected){}
              System.out.println("PASS: precise Money addition");
          }
      }
      ~~~

      **Expected verification:** assertions demonstrate double discrepancies, correct BigDecimal addition, and rejection of mismatched currencies. Scale 2/HALF_UP is an **illustrative USD convention**, not a universal rule; production requires currency-based scales, business rounding policies, and use-case-specific overflow/negative handling.
  - situation: 'An aggregate lets callers directly modify child entities, causing stored order totals to disagree with its item list.'
    readmeRelated:
      anchorList:
      - encapsulation-001
      - encapsulation-002
      - encapsulation-008
      - composition-007
      - class-design-007
      - testing-003
      - practice-002
    resolve: 'Hide child collections and update/recalculate totals through aggregate-root operations, checking invariants before commit.'
    knowledge: 'Aggregate roots, encapsulation, and derived state.'
    code: |-
      ### Case 5 ? Aggregate roots keep order totals consistent

      **Incorrect:** clients mutate child quantities through live references while storedTotal remains stale. **Correct:** Order owns its items, returns immutable snapshots, and calculates totals from validated internal state.

      ~~~java
      import java.util.*;
      public class Case5 {
          static class BadItem {int qty;BadItem(int qty){this.qty=qty;}}
          static class BadOrder {
              final BadItem item=new BadItem(1);
              int storedTotal=100;
              BadItem item(){return item;}
          }
          record ItemView(String sku,int qty,long unitPrice){}
          static class Order {
              private final List<ItemView> items=new ArrayList<>();
              void add(String sku,int qty,long price){
                  if(sku==null||sku.isBlank()||qty<=0||price<0)
                      throw new IllegalArgumentException();
                  items.add(new ItemView(sku,qty,price));
              }
              List<ItemView> items(){return List.copyOf(items);}
              long total(){
                  long sum=0;
                  for(ItemView i:items)
                      sum=Math.addExact(sum,Math.multiplyExact(i.qty(),i.unitPrice()));
                  return sum;
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BadOrder broken=new BadOrder();
              broken.item().qty=3;
              check(broken.storedTotal!=broken.item().qty*100);
              Order valid=new Order();
              valid.add("A",2,100);
              check(valid.total()==200);
              try{valid.add("B",-1,50);throw new AssertionError();}
              catch(IllegalArgumentException expected){}
              try{valid.items().clear();throw new AssertionError();}
              catch(UnsupportedOperationException expected){}
              check(valid.total()==200 && valid.items().size()==1);
              System.out.println("PASS: aggregate derived total");
          }
      }
      ~~~

      **Expected verification:** the old model diverges; the corrected model keeps totals consistent after failures. Persisted aggregates also need version checks/transactions to prevent lost updates; immutable Java snapshots do not replace database transaction locks.
  - situation: 'A domain service sends notifications before a transaction commits, so users receive success messages even when the database rolls back.'
    readmeRelated:
      anchorList:
      - class-design-004
      - modeling-007
      - design-patterns-010
      - testing-010
    resolve: 'Commit data before external side effects; use an outbox for post-commit notifications and controlled retries.'
    knowledge: 'Transaction boundaries, transactional outboxes, and eventual consistency.'
    code: |-
      ### Case 6 ? Publish notifications through an outbox only after commit

      **Incorrect:** notify before commit, causing false success messages if the DB rolls back. **Correct by design:** write order + outbox in the **same DB transaction**, and publish via a worker after commit. The code below simulates the flow in memory; it is not a real SQL transaction.

      ~~~java
      import java.util.*;
      public class Case6 {
          record Event(String id,String orderId){}
          static class DatabaseSimulation {
              final Map<String,String> orders=new HashMap<>();
              final List<Event> outbox=new ArrayList<>();
              void commit(String orderId,boolean valid){
                  if(!valid)throw new IllegalArgumentException("rollback simulated");
                  orders.put(orderId,"PAID");
                  outbox.add(new Event("evt-"+orderId,orderId));
              }
          }
          static class Dispatcher {
              final Set<String> sent=new HashSet<>();
              void sendPending(DatabaseSimulation db,List<String> deliveries){
                  for(Event e:db.outbox){
                      if(sent.add(e.id()))deliveries.add(e.orderId());
                  }
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              DatabaseSimulation db=new DatabaseSimulation();
              List<String> mail=new ArrayList<>();
              try{db.commit("O1",false);throw new AssertionError();}
              catch(IllegalArgumentException expected){}
              check(db.orders.isEmpty()&&db.outbox.isEmpty()&&mail.isEmpty());
              db.commit("O1",true);
              check(mail.isEmpty()); // Chưa phát trước commit.
              Dispatcher sender=new Dispatcher();
              sender.sendPending(db,mail);
              check(mail.equals(List.of("O1")));
              System.out.println("PASS: simulated commit precedes notification");
          }
      }
      ~~~

      **Real verification:** integration-test a DB transaction writing order + outbox, inject a failure before commit, and assert rollback of both tables; publish only after successful commit. This in-memory simulation cannot prove atomicity because Map.put and List.add are not transactional. A crash between sending and marking sent requires an idempotent consumer; do not promise exactly-once network delivery.
  - situation: 'Request retries publish the same domain event repeatedly, multiplying emails and inventory decrements.'
    readmeRelated:
      anchorList:
      - modeling-007
      - design-patterns-010
      - testing-010
    resolve: 'Attach eventId/idempotency keys and deduplicate consumers; control retries to prevent duplicate mail or stock changes.'
    knowledge: 'At-least-once delivery, idempotent consumers, and outboxes.'
    code: |-
      ### Case 7 ? Idempotent consumers use eventId with at-least-once delivery

      Retries can republish one event and cause repeated emails or stock deductions. Protect side effects with processed eventId values recorded in the same transaction as state changes. The example simulates sequential in-memory logic only.

      ~~~java
      import java.util.*;
      public class Case7 {
          record Event(String eventId,int units){}
          static class BrokenConsumer {
              int stock=10,emails;
              void handle(Event e){stock-=e.units();emails++;}
          }
          static class InventoryConsumer {
              int stock=10,emails;
              final Set<String> processed=new HashSet<>();
              void handle(Event e){
                  if(e.eventId()==null||e.eventId().isBlank()||e.units()<=0)
                      throw new IllegalArgumentException();
                  if(!processed.add(e.eventId()))return;
                  stock-=e.units();
                  emails++;
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Event same=new Event("E1",2);
              BrokenConsumer wrong=new BrokenConsumer();
              wrong.handle(same);wrong.handle(same);
              check(wrong.stock==6&&wrong.emails==2);
              InventoryConsumer good=new InventoryConsumer();
              good.handle(same);good.handle(same);
              check(good.stock==8&&good.emails==1&&good.processed.size()==1);
              good.handle(new Event("E2",1));
              check(good.stock==7&&good.emails==2);
              System.out.println("PASS: duplicate event ignored");
          }
      }
      ~~~

      **Expected verification:** handling the event twice changes inventory/email once with deduplication. Production must atomically commit processedId uniqueness constraints and stock updates; in-memory Sets cannot coordinate multiple processes, and external email needs its own idempotency/outbox strategy.
  - situation: 'A workflow modifies two aggregates in separate databases but assumes one local transaction guarantees consistency.'
    readmeRelated:
      anchorList:
      - design-patterns-007
      - testing-003
    resolve: 'Use sagas/compensation or eventual consistency across databases; never assume one local transaction spans both.'
    knowledge: 'Distributed transactions, sagas, and consistency models.'
    code: |-
      ### Case 8 ? Two databases need Sagas and compensation, not just local transactions

      Booking in DB A followed by payment in DB B may fail midway. A local transaction on A cannot roll back B. Sagas coordinate steps and compensations after failures; this simulation checks workflow only, not real distributed transactions.

      ~~~java
      public class Case8 {
          static class BookingStore {
              boolean reserved;
              void reserve(){reserved=true;}
              void release(){reserved=false;}
          }
          static class BillingStore {
              boolean charged;
              void charge(boolean available){
                  if(!available)throw new IllegalStateException("payment unavailable");
                  charged=true;
              }
          }
          static class Saga {
              private final BookingStore booking;
              private final BillingStore billing;
              Saga(BookingStore a,BillingStore b){booking=a;billing=b;}
              boolean execute(boolean paymentAvailable){
                  booking.reserve();
                  try {
                      billing.charge(paymentAvailable);
                      return true;
                  } catch(RuntimeException error) {
                      booking.release(); // Compensation cho bước đã thành công.
                      return false;
                  }
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BookingStore a=new BookingStore();
              BillingStore b=new BillingStore();
              Saga saga=new Saga(a,b);
              check(!saga.execute(false));
              check(!a.reserved&&!b.charged);
              check(saga.execute(true));
              check(a.reserved&&b.charged);
              System.out.println("PASS: compensating flow illustrated");
          }
      }
      ~~~

      **Expected verification:** payment failure releases bookings; success preserves both changes. Production Sagas require persisted state, timeouts, retries/idempotency, compensation confirmation, and handling compensation failures, which might not be fully reversible. The example does not prove atomic cross-DB commits or immediate consistency.
  - situation: 'The web controller enforces ticket cancellation deadlines, but mobile APIs and batch jobs bypass them, producing incorrect refunds.'
    readmeRelated:
      anchorList:
      - encapsulation-005
      - class-design-004
      - class-design-007
      - solid-002
      - testing-003
      - practice-010
    resolve: 'Put cancellation/refund deadlines into a shared domain/application use case with common guards for web, mobile, and batch.'
    knowledge: 'Business invariants, shared use cases, and channel consistency.'
    code: |-
      ### Case 9 ? One ticket-cancellation policy for web/mobile/batch

      **Incorrect:** web checks deadlines alone while mobile/batch invoke cancellation directly. **Correct:** a shared use case accepts a fixed time and policy; every entry point uses the same guard.

      ~~~java
      import java.time.*;
      public class Case9 {
          record Ticket(String id,Instant departure,boolean cancelled){
              Ticket cancel(){return new Ticket(id,departure,true);}
          }
          static class CancelTicket {
              private final Duration cutoff=Duration.ofHours(24);
              Ticket cancel(Ticket ticket,Instant now){
                  if(ticket.cancelled())throw new IllegalStateException("already cancelled");
                  if(now.isAfter(ticket.departure().minus(cutoff)))
                      throw new IllegalStateException("cutoff passed");
                  return ticket.cancel();
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          static void reject(Runnable r){
              try{r.run();throw new AssertionError("cancel accepted");}
              catch(IllegalStateException expected){}
          }
          public static void main(String[] args){
              Instant dep=Instant.parse("2026-11-30T12:00:00Z");
              Ticket ticket=new Ticket("T1",dep,false);
              CancelTicket useCase=new CancelTicket();
              java.util.function.Function<Instant,Ticket> web=t->useCase.cancel(ticket,t);
              java.util.function.Function<Instant,Ticket> mobile=t->useCase.cancel(ticket,t);
              java.util.function.Function<Instant,Ticket> batch=t->useCase.cancel(ticket,t);
              Instant valid=dep.minus(Duration.ofHours(25));
              Instant tooLate=dep.minus(Duration.ofHours(23));
              check(web.apply(valid).cancelled()&&mobile.apply(valid).cancelled()
                    &&batch.apply(valid).cancelled());
              reject(()->web.apply(tooLate));
              reject(()->mobile.apply(tooLate));
              reject(()->batch.apply(tooLate));
              System.out.println("PASS: all channels share cancellation guard");
          }
      }
      ~~~

      **Expected verification:** all three simulated entry points allow cancellation at -25h and reject at -23h. This is an **illustrative policy**; real rules require ticket classes, time zones, refund amounts, authorization, and transactions preventing double cancellation. Do not trust client-supplied time; use a server Clock in the use case.
  - situation: 'An order workflow has multiple independent public setters, allowing users to jump from NEW to REFUNDED without paying.'
    readmeRelated:
      anchorList:
      - encapsulation-008
      - encapsulation-009
      - modeling-008
      - design-patterns-009
      - testing-003
      - practice-002
    resolve: 'Replace setters with guarded transition methods, reject NEW?REFUNDED, and test the state graph.'
    knowledge: 'State machines, domain commands, and legal transitions.'
    code: |-
      ### Case 10 ? A state machine forbids NEW ? REFUNDED

      Public setters bypass payment workflows. Use guarded domain behavior: NEW?PAID?REFUNDED; refunded orders cannot return to PAID via a setter.

      ~~~java
      public class Case10 {
          enum Status{NEW,PAID,REFUNDED}
          static class BrokenOrder{Status status=Status.NEW;}
          static class Order {
              private Status status=Status.NEW;
              Status status(){return status;}
              void recordPayment(){
                  if(status!=Status.NEW)throw new IllegalStateException("cannot pay");
                  status=Status.PAID;
              }
              void refund(){
                  if(status!=Status.PAID)throw new IllegalStateException("not paid");
                  status=Status.REFUNDED;
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          static void rejects(Runnable action){
              try{action.run();throw new AssertionError("invalid transition allowed");}
              catch(IllegalStateException expected){}
          }
          public static void main(String[] args){
              BrokenOrder bad=new BrokenOrder();
              bad.status=Status.REFUNDED;
              check(bad.status==Status.REFUNDED);
              Order valid=new Order();
              rejects(valid::refund);
              check(valid.status()==Status.NEW);
              valid.recordPayment();valid.refund();
              check(valid.status()==Status.REFUNDED);
              rejects(valid::recordPayment);
              rejects(valid::refund);
              System.out.println("PASS: guarded order transitions");
          }
      }
      ~~~

      **Expected verification:** the flawed path jumps directly, while the corrected one rejects NEW?REFUNDED and accepts the legal sequence. Example refund **changes state only**; it does not contact a refund gateway. Production must prevent double refunds, enforce idempotency, and record external transactions correctly.
  - situation: 'An ORM entity with lazy relationships is returned directly over HTTP; serialization touches the relationships after the session closes and the request fails.'
    readmeRelated:
      anchorList:
      - abstraction-008
      - class-design-004
      - class-design-009
      - solid-006
    resolve: 'Map ORM entities to DTOs within suitable transactions or fetch explicitly; never serialize closed-session lazy proxies directly.'
    knowledge: 'ORM lazy loading, persistence boundaries, and API DTOs.'
    code: |-
      ### Case 11 ? ORM lazy relationships should not escape persistence boundaries

      HTTP serialization of a lazy association after session closure may throw. A simulated lazy loader throws when Session is closed; the example then builds DTOs inside the boundary while loading is allowed, without claiming to use real Hibernate.

      ~~~java
      import java.util.*;
      public class Case11 {
          static class Session {boolean open=true;void close(){open=false;}}
          static class LazyItems {
              final Session session;
              LazyItems(Session s){session=s;}
              List<String> get(){
                  if(!session.open)throw new IllegalStateException("lazy session closed");
                  return List.of("A","B");
              }
          }
          record OrderDto(String id,List<String> items){}
          static class OrderEntity {
              final String id;final LazyItems items;
              OrderEntity(String id,LazyItems items){this.id=id;this.items=items;}
          }
          static OrderDto mapWithinBoundary(OrderEntity entity){
              return new OrderDto(entity.id,List.copyOf(entity.items.get()));
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Session oldSession=new Session();
              OrderEntity bad=new OrderEntity("O1",new LazyItems(oldSession));
              oldSession.close();
              try{bad.items.get();throw new AssertionError();}
              catch(IllegalStateException expected){}
              Session goodSession=new Session();
              OrderEntity entity=new OrderEntity("O1",new LazyItems(goodSession));
              OrderDto dto=mapWithinBoundary(entity);
              goodSession.close();
              check(dto.id().equals("O1")&&dto.items().equals(List.of("A","B")));
              System.out.println("PASS: API DTO detached from lazy state");
          }
      }
      ~~~

      **Expected verification:** entity access fails after close, while an already materialized DTO remains readable. Real JPA/Hibernate needs integration tests with appropriate transactions/fetch graphs, N+1 checks, and avoidance of excessive Open Session in View. The DTO here contains no entities or lazy proxies.
  - situation: 'A domain object calls System.currentTimeMillis in every method, causing tests to depend on execution time.'
    readmeRelated:
      anchorList:
      - composition-006
      - testing-007
      - practice-010
    resolve: 'Inject Clock into domain services or pass use-case time explicitly; test fixed instants, temporal boundaries, and time zones.'
    knowledge: 'Time dependency injection, determinism, and temporal boundaries.'
    code: |-
      ### Case 12 ? Inject Clock for deterministic time tests

      Calling System.currentTimeMillis() from the domain ties expiration rules to the test clock. Inject Clock to create fixed instants, test exact expiration boundaries, and verify time zones when converting to local dates.

      ~~~java
      import java.time.*;
      public class Case12 {
          static class ExpiryService {
              private final Clock clock;
              ExpiryService(Clock clock){this.clock=clock;}
              boolean expired(Instant deadline){
                  if(deadline==null)throw new IllegalArgumentException("deadline");
                  return !Instant.now(clock).isBefore(deadline);
              }
              LocalDate today(){return LocalDate.now(clock);}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Instant now=Instant.parse("2026-11-01T00:00:00Z");
              Clock fixed=Clock.fixed(now,ZoneOffset.UTC);
              ExpiryService service=new ExpiryService(fixed);
              check(!service.expired(now.plusSeconds(1)));
              check(service.expired(now)); // Đúng thời điểm hết hạn.
              check(service.expired(now.minusSeconds(1)));
              check(service.today().equals(LocalDate.of(2026,11,1)));
              Clock hcm=Clock.fixed(now,ZoneId.of("Asia/Ho_Chi_Minh"));
              check(new ExpiryService(hcm).today().equals(LocalDate.of(2026,11,1)));
              try{service.expired(null);throw new AssertionError();}
              catch(IllegalArgumentException expected){}
              System.out.println("PASS: fixed Clock yields deterministic boundary");
          }
      }
      ~~~

      **Expected verification:** fixed inputs make tests independent of the host clock. Near midnight, UTC and Asia/Ho_Chi_Minh may yield different LocalDate values; choose ZoneId according to domain rules rather than comparing date-only concepts as Instants.
- groupID: 11
  groupName: 'Object Contracts, Equality, and Generics'
  cases:
  - situation: 'A class uses a mutable business key for equality, causing incorrect Map and Set behavior after key changes.'
    readmeRelated:
      anchorList:
      - object-004
      - object-005
      - language-mechanics-006
      - design-pitfalls-009
      - testing-001
    resolve: 'Use stable business IDs or immutable key snapshots for hashing/equality; avoid mutation while objects are stored in Maps/Sets.'
    knowledge: 'Equality consistency, mutable keys, and hashed collections.'
    code: |-
      Use an immutable ID for identity in equals/hashCode. Mutable business attributes, such as display names, must not be part of the hash key of an object already in HashMap/HashSet.

      ~~~java
      import java.util.*;
      public class Demo1 {
        static final class Customer {
          private final String id;
          private String displayName;
          Customer(String id, String name) {
            this.id = Objects.requireNonNull(id);
            displayName = name;
          }
          void rename(String name) { displayName = name; }
          @Override public boolean equals(Object other) {
            return other instanceof Customer c && id.equals(c.id);
          }
          @Override public int hashCode() { return id.hashCode(); }
        }
        public static void main(String[] args) {
          Customer original = new Customer("C-1", "Before");
          Map<Customer,String> map = new HashMap<>();
          Set<Customer> set = new HashSet<>();
          map.put(original, "active"); set.add(original);
          int hashBefore = original.hashCode();
          original.rename("After");
          assert original.hashCode() == hashBefore;
          assert map.get(original).equals("active");
          assert map.get(new Customer("C-1", "Different name")).equals("active");
          assert set.contains(new Customer("C-1", "Alias"));
          assert set.size() == 1;
        }
      }
      ~~~

      Verification: javac Demo1.java then java -ea Demo1. An incorrect design uses displayName in equals/hashCode and calls rename after map.put; the bucket selected by the old hash makes lookup unreliable. For changing business keys, use stable IDs or immutable value snapshots.
  - situation: 'A class overrides equals but omits hashCode, so equal keys may occupy different HashMap buckets.'
    readmeRelated:
      anchorList:
      - object-004
      - language-mechanics-006
      - testing-001
      - practice-005
    resolve: 'Override equals and hashCode consistently using the same stable fields; test HashMap put/get and equality contracts.'
    knowledge: 'equals/hashCode contracts and Java hashed collections.'
    code: |-
      Equal objects must have equal hashCode values. Override both equals and hashCode based on the same stable fields; verify reflexivity, symmetry, transitivity, and HashMap behavior.

      ~~~java
      import java.util.*;
      public class Demo2 {
        static final class ProductKey {
          private final String category, sku;
          ProductKey(String category, String sku) {
            this.category = Objects.requireNonNull(category);
            this.sku = Objects.requireNonNull(sku);
          }
          @Override public boolean equals(Object obj) {
            if (this == obj) return true;
            if (!(obj instanceof ProductKey other)) return false;
            return category.equals(other.category) && sku.equals(other.sku);
          }
          @Override public int hashCode() { return Objects.hash(category, sku); }
        }
        public static void main(String[] args) {
          ProductKey a = new ProductKey("BOOK", "42");
          ProductKey b = new ProductKey("BOOK", "42");
          ProductKey c = new ProductKey("BOOK", "42");
          ProductKey different = new ProductKey("BOOK", "43");
          assert a.equals(a);
          assert a.equals(b) && b.equals(a);
          assert b.equals(c) && a.equals(c);
          assert a.hashCode() == b.hashCode();
          assert !a.equals(different) && !a.equals(null);
          Map<ProductKey,Integer> price = new HashMap<>();
          price.put(a, 250);
          assert price.get(b) == 250;
          assert price.size() == 1;
        }
      }
      ~~~

      Verification: javac Demo2.java and java -ea Demo2. Remove the hashCode override and rerun the contract: identity-based Object.hashCode usually differs for equal-valued keys, so HashMap.get may fail. This demonstrates the contract without assuming specific hash values.
  - situation: 'An equals override uses instanceof in the superclass and getClass in a subclass, breaking symmetry.'
    readmeRelated:
      anchorList:
      - object-004
      - language-mechanics-006
      - testing-005
      - practice-005
    resolve: 'Choose getClass or instanceof consistently under an explicit inheritance policy; prefer composition/value semantics when subclasses threaten symmetry.'
    knowledge: 'Equality symmetry/transitivity and inheritance pitfalls.'
    code: |-
      A base type using instanceof while a subclass uses getClass can violate symmetry. For value identity, avoid inheriting the equality-bearing type and use a shared final value object.

      ~~~java
      import java.util.*;
      public class Demo3 {
        static class BadBase {
          final String id;
          BadBase(String id) { this.id = id; }
          @Override public boolean equals(Object other) {
            return other instanceof BadBase b && Objects.equals(id, b.id);
          }
          @Override public int hashCode() { return Objects.hashCode(id); }
        }
        static final class BadSubtype extends BadBase {
          BadSubtype(String id) { super(id); }
          @Override public boolean equals(Object other) {
            return other != null && other.getClass() == BadSubtype.class
                && super.equals(other);
          }
        }
        record Identity(String id) {}
        record NormalCustomer(Identity identity, String name) {}
        record PremiumCustomer(Identity identity, int tier) {}
        public static void main(String[] args) {
          BadBase base = new BadBase("X");
          BadBase subtype = new BadSubtype("X");
          assert base.equals(subtype);    // đường sai
          assert !subtype.equals(base);   // symmetry bị phá

          Identity sharedId = new Identity("X");
          NormalCustomer normal = new NormalCustomer(sharedId, "A");
          PremiumCustomer premium = new PremiumCustomer(sharedId, 2);
          assert normal.identity().equals(premium.identity());
          assert premium.identity().equals(normal.identity());
          assert !normal.equals(premium); // không đánh đồng hai loại object
        }
      }
      ~~~

      Verification: javac Demo3.java and java -ea Demo3. Do not compare different subclass objects asymmetrically. If base and subtype equality is required, specify one consistent policy for the hierarchy and test symmetry/transitivity for all type pairs.
  - situation: 'A Comparator only checks product names, so TreeSet discards different products that share a name.'
    readmeRelated:
      anchorList:
      - language-mechanics-006
      - practice-005
    resolve: 'Add a product-code tie-breaker to the Comparator; return 0 only for keys that should be equivalent in a sorted collection.'
    knowledge: 'Comparator ordering, TreeSet equivalence, and consistency with equals.'
    code: |-
      TreeSet considers compare(a,b)==0 equivalent and discards one element. When names are not unique, break ties with sku so products sharing names remain distinct.

      ~~~java
      import java.util.*;
      public class Demo4 {
        record Product(String name, String sku) {}
        public static void main(String[] args) {
          Product a = new Product("Bút", "SKU-1");
          Product b = new Product("Bút", "SKU-2");
          SortedSet<Product> broken =
            new TreeSet<>(Comparator.comparing(Product::name));
          broken.add(a); broken.add(b);
          assert broken.size() == 1; // lỗi nghiệp vụ: mất SKU thứ hai

          Comparator<Product> safeOrder = Comparator
            .comparing(Product::name)
            .thenComparing(Product::sku);
          SortedSet<Product> fixed = new TreeSet<>(safeOrder);
          fixed.add(a); fixed.add(b);
          assert fixed.size() == 2;
          assert fixed.contains(a) && fixed.contains(b);
          assert safeOrder.compare(a,b) != 0;
          assert safeOrder.compare(a,a) == 0;
          assert fixed.first().sku().equals("SKU-1");
        }
      }
      ~~~

      Verification: javac Demo4.java and java -ea Demo4. Ensure name+SKU actually matches Product business equality; if SKU alone is identity, use that as the final comparator tie-breaker and document order. Test duplicate names, different codes, and identical codes.
  - situation: 'A record containing a mutable List is treated as immutable and shared through an API, but callers mutate its elements and change historical snapshots.'
    readmeRelated:
      anchorList:
      - class-006
      - object-005
      - object-006
      - encapsulation-007
      - class-design-006
      - practice-005
    resolve: 'Defensively copy both the list and mutable elements in the record constructor; expose only immutable projections.'
    knowledge: 'Records, shallow immutability, and defensive copying.'
    code: |-
      Records do not automatically deep-copy Lists or nested mutable objects. Convert elements into immutable records and snapshot with List.copyOf in the canonical constructor to prevent source or caller mutations from changing history.

      ~~~java
      import java.util.*;
      public class Demo5 {
        static final class MutableLine {
          String sku; int quantity;
          MutableLine(String sku, int quantity) { this.sku=sku; this.quantity=quantity; }
        }
        record LineView(String sku, int quantity) {}
        record OrderSnapshot(List<LineView> lines) {
          OrderSnapshot {
            lines = List.copyOf(Objects.requireNonNull(lines));
          }
          static OrderSnapshot fromMutable(List<MutableLine> source) {
            List<LineView> projected = source.stream()
              .map(x -> new LineView(x.sku, x.quantity)).toList();
            return new OrderSnapshot(projected);
          }
        }
        public static void main(String[] args) {
          MutableLine original = new MutableLine("A", 2);
          List<MutableLine> source = new ArrayList<>(List.of(original));
          OrderSnapshot historical = OrderSnapshot.fromMutable(source);
          original.quantity = 99;
          source.add(new MutableLine("B", 1));
          assert historical.lines().equals(List.of(new LineView("A", 2)));
          try {
            historical.lines().add(new LineView("BAD", 1));
            throw new AssertionError("mutable result");
          } catch (UnsupportedOperationException expected) {}
          List<LineView> sourceViews = new ArrayList<>(List.of(new LineView("X", 3)));
          OrderSnapshot direct = new OrderSnapshot(sourceViews);
          sourceViews.clear();
          assert direct.lines().equals(List.of(new LineView("X", 3)));
        }
      }
      ~~~

      Verification: javac Demo5.java and java -ea Demo5. Test changes to nested source objects, the source list, and the returned list. If LineView later contains other mutable fields, deep-copy them as well.
  - situation: 'A toString method traverses an entire bidirectional object graph, so logging one node causes stack overflow.'
    readmeRelated:
      anchorList:
      - relationships-006
      - language-mechanics-007
    resolve: 'Prevent cyclic toString traversal by outputting IDs/summaries rather than recursively concatenating parents and children.'
    knowledge: 'Object-graph cycles, safe logging, and StackOverflowError.'
    code: |-
      A node has both parent and child references; toString must not recursively print the entire graph. Log ID, parentId, and child count instead to keep output short and avoid cycles.

      ~~~java
      import java.util.*;
      public class Demo6 {
        static final class Node {
          final String id;
          Node parent;
          final List<Node> children = new ArrayList<>();
          Node(String id) { this.id = id; }
          void attach(Node child) {
            children.add(child);
            child.parent = this;
          }
          @Override public String toString() {
            return "Node{id='" + id + "', parentId=" +
              (parent == null ? "null" : parent.id) +
              ", childCount=" + children.size() + "}";
          }
        }
        public static void main(String[] args) {
          Node root = new Node("root"), child = new Node("child");
          root.attach(child); // root.children -> child.parent -> root là object cycle
          String a = root.toString();
          String b = child.toString();
          assert a.contains("childCount=1");
          assert b.contains("parentId=root");
          assert a.length() < 100 && b.length() < 100;
          assert !a.contains("Node{id='child'");
        }
      }
      ~~~

      Verification: javac Demo6.java and java -ea Demo6. A toString implementation using parent.toString()+children.toString() recursively loops until StackOverflowError; do not deliberately run this faulty path in production. Real logging should limit text length and fields for large graphs.
  - situation: 'A User toString prints access tokens and payment-card numbers into logs during debugging.'
    readmeRelated:
      anchorList:
      - language-mechanics-007
    resolve: 'Exclude secrets and payment fields from toString; use redaction, allowlists, and tests to protect sensitive log data.'
    knowledge: 'Information disclosure, structured logging, and sensitive-data handling.'
    code: |-
      Never include tokens or PANs in toString or structured logs. Allowlist safe fields and test that log strings contain no secrets, even when developers call println(user).

      ~~~java
      import java.util.*;
      public class Demo7 {
        static final class User {
          private final String id, role, accessToken, cardNumber;
          User(String id, String role, String token, String pan) {
            this.id=id; this.role=role; accessToken=token; cardNumber=pan;
          }
          Map<String,String> safeLogFields() {
            return Map.of("userId", id, "role", role);
          }
          @Override public String toString() {
            return "User{userId=" + id + ", role=" + role + "}";
          }
        }
        public static void main(String[] args) {
          String token = "tok-SECRET-123";
          String pan = "4111111111111111";
          User user = new User("U-1", "VIEWER", token, pan);
          String text = user.toString();
          String structured = user.safeLogFields().toString();
          assert text.contains("U-1") && structured.contains("VIEWER");
          assert !text.contains(token) && !text.contains(pan);
          assert !structured.contains(token) && !structured.contains(pan);
          assert !text.contains("accessToken") && !text.contains("cardNumber");
        }
      }
      ~~~

      Verification: javac Demo7.java and java -ea Demo7. For actual loggers, test JSON/layout output and masking in filters/appenders so serializers or exception logs do not expose additional fields. Never log raw tokens, even while handling failures.
  - situation: 'A copy constructor copies only references to nested objects, so editing the copy accidentally changes the original.'
    readmeRelated:
      anchorList:
      - object-003
      - object-006
      - encapsulation-007
      - practice-005
    resolve: 'Deep-copy nested objects that need independent ownership or use immutable structures; test that editing a copy leaves the original unchanged.'
    knowledge: 'Copy constructors, graph ownership, and shallow/deep copies.'
    code: |-
      Copy constructors must create new instances for independently owned mutable nested objects. Copying a list changes the container but still aliases Address if it is not cloned.

      ~~~java
      import java.util.*;
      public class Demo8 {
        static final class Address {
          String city;
          Address(String city) { this.city = city; }
          Address(Address other) { this.city = other.city; }
        }
        static final class Profile {
          private final List<Address> addresses;
          Profile(List<Address> input) {
            addresses = input.stream().map(Address::new).toList(); // deep copy elements
          }
          Profile(Profile other) { this(other.addresses); }
          void relocateFirst(String city) { addresses.get(0).city = city; }
          String firstCity() { return addresses.get(0).city; }
        }
        public static void main(String[] args) {
          Address external = new Address("Hanoi");
          List<Address> initial = new ArrayList<>(List.of(external));
          Profile original = new Profile(initial);
          Profile copy = new Profile(original);
          copy.relocateFirst("Danang");
          assert original.firstCity().equals("Hanoi");
          assert copy.firstCity().equals("Danang");
          external.city = "Hue";
          initial.clear();
          assert original.firstCity().equals("Hanoi");
          assert copy.firstCity().equals("Danang");
        }
      }
      ~~~

      Verification: javac Demo8.java and java -ea Demo8. If the constructor only applies List.copyOf(input) and Address remains mutable, changing Address through the copy also affects the original. For graphs with shared nodes or cycles, use identity maps during deep copying to preserve relationships.
  - situation: 'A generic Repository returns Object, so invalid casts are detected only at runtime.'
    readmeRelated:
      anchorList:
      - language-mechanics-001
      - design-pitfalls-005
    resolve: 'Define Repository<T,ID> returning T/Optional<T> through generics, eliminating unsafe runtime casts.'
    knowledge: 'Java generics, type safety, and parametric polymorphism.'
    code: |-
      Define Repository<T, ID> that returns properly typed Optional<T>; callers no longer cast from Object, so type mismatches are caught at compile time.

      ~~~java
      import java.util.*;
      public class Demo9 {
        interface Repository<T, ID> {
          Optional<T> find(ID id);
          void save(ID id, T entity);
        }
        static final class MemoryRepository<T, ID> implements Repository<T, ID> {
          private final Map<ID, T> rows = new HashMap<>();
          public Optional<T> find(ID id) { return Optional.ofNullable(rows.get(id)); }
          public void save(ID id, T entity) { rows.put(id, entity); }
        }
        record Customer(String id, String name) {}
        static String customerName(Repository<Customer, String> repository, String id) {
          return repository.find(id).orElseThrow().name();
        }
        public static void main(String[] args) {
          Repository<Customer, String> customers = new MemoryRepository<>();
          customers.save("C1", new Customer("C1", "Mai"));
          assert customerName(customers, "C1").equals("Mai");
          assert customers.find("missing").isEmpty();
          // customers.save("C2", "not a Customer"); // lỗi compile-time
          // Integer wrong = customers.find("C1").orElseThrow(); // lỗi compile-time
        }
      }
      ~~~

      Verification: javac Demo9.java and java -ea Demo9; uncommenting an incorrect type assignment must be rejected by the compiler. Avoid raw Repository types because they undermine type safety and may cause ClassCastException.
  - situation: 'A generic API accepts subtype Lists but a caller expects to assign List<Subtype> directly to List<Supertype>, causing a compilation error.'
    readmeRelated:
      anchorList:
      - subtyping-002
      - language-mechanics-001
      - language-mechanics-003
    resolve: 'List<Subtype> is not assignable to List<Supertype> because generics are invariant; use List<? extends Supertype> for reading and copies for appropriate writes.'
    knowledge: 'Generic invariance, bounded wildcards, and PECS.'
    code: |-
      Java's generic List<T> is invariant. Use ? extends Animal for read-only APIs consuming List<Dog>; to add other Animals, copy elements into an independent List<Animal>.

      ~~~java
      import java.util.*;
      public class Demo10 {
        interface Animal { String sound(); }
        record Dog() implements Animal { public String sound() { return "woof"; } }
        record Cat() implements Animal { public String sound() { return "meow"; } }
        static String sounds(List<? extends Animal> source) {
          StringBuilder result = new StringBuilder();
          for (Animal a : source) result.append(a.sound()).append(";");
          return result.toString();
        }
        public static void main(String[] args) {
          List<Dog> dogs = new ArrayList<>(List.of(new Dog()));
          assert sounds(dogs).equals("woof;");
          // List<Animal> wrong = dogs; // không biên dịch: List<Dog> != List<Animal>
          List<Animal> writable = new ArrayList<>(dogs);
          writable.add(new Cat());
          assert sounds(writable).equals("woof;meow;");
          assert dogs.size() == 1;
          assert dogs.get(0).sound().equals("woof");
        }
      }
      ~~~

      Verification: javac Demo10.java and java -ea Demo10. Uncommenting wrong must report incompatible types. Were the direct assignment allowed, adding a Cat through a List<Animal> alias could corrupt a List<Dog>; wildcard reads plus copying prevent that.
  - situation: 'A wildcard API attempts to write into a read-only source collection, making its type contract ambiguous and causing compiler rejection.'
    readmeRelated:
      anchorList:
      - subtyping-002
      - language-mechanics-002
      - language-mechanics-003
    resolve: 'Separate producer/consumer roles: use ? extends T for read sources and ? super T for write destinations; do not write into extends wildcards.'
    knowledge: 'PECS, wildcard variance, and type-safe collections.'
    code: |-
      PECS: a source collection that produces values uses ? extends T, while a destination consuming writes uses ? super T. Do not insert arbitrary elements into an extends source.

      ~~~java
      import java.util.*;
      public class Demo11 {
        interface Animal { String name(); }
        record Dog(String name) implements Animal {}
        record Cat(String name) implements Animal {}
        static void copyAnimals(List<? extends Animal> source,
                                List<? super Animal> destination) {
          for (Animal item : source) destination.add(item);
          // source.add(new Dog("bad")); // lỗi compile: không thể add vào extends
        }
        public static void main(String[] args) {
          List<Dog> dogs = List.of(new Dog("Rex"), new Dog("Luna"));
          List<Animal> animals = new ArrayList<>();
          List<Object> audit = new ArrayList<>();
          copyAnimals(dogs, animals);
          copyAnimals(dogs, audit);
          assert animals.size() == 2;
          assert animals.get(0).name().equals("Rex");
          assert audit.size() == 2;
          assert audit.get(1).equals(new Dog("Luna"));
          animals.add(new Cat("Mimi"));
          assert dogs.size() == 2;
        }
      }
      ~~~

      Verification: javac Demo11.java and java -ea Demo11; uncommenting source.add must cause a compiler error. With List<? super Animal>, safe reads have type Object, so consumer APIs must not assume a more specific result type.
- groupID: 12
  groupName: 'Testing and Safe Refactoring'
  cases:
  - situation: 'A unit test uses reflection to inspect private helpers, so refactoring breaks many tests even though behavior is unchanged.'
    readmeRelated:
      anchorList:
      - encapsulation-001
      - testing-008
      - refactoring-009
      - practice-010
    resolve: 'Test public behavior and invariants instead of reflecting on private helpers; keep tests stable as implementations evolve.'
    knowledge: 'Black-box testing, encapsulation, and refactorability.'
    code: |-
      Test through public APIs rather than private helper names accessed by reflection. Both internal designs should produce the same results from the same inputs.

      ~~~java
      public class Case1 {
          static class Before {
              public int payable(int baseCents, int discountCents) {
                  if (baseCents < 0 || discountCents < 0 || discountCents > baseCents)
                      throw new IllegalArgumentException();
                  return calculate(baseCents, discountCents);
              }
              private int calculate(int base, int discount) { return base - discount; }
          }
          static class After {
              public int payable(int baseCents, int discountCents) {
                  if (baseCents < 0 || discountCents < 0 || discountCents > baseCents)
                      throw new IllegalArgumentException();
                  return Math.subtractExact(baseCents, discountCents);
              }
              // Không còn private calculate().
          }
          static void contract(int expected, int base, int discount) {
              if (new Before().payable(base, discount) != expected)
                  throw new AssertionError("Old behavior changed");
              if (new After().payable(base, discount) != expected)
                  throw new AssertionError("Refactor changed public behavior");
          }
          public static void main(String[] args) {
              contract(800, 1000, 200);
              contract(0, 100, 100);
              for (boolean after : new boolean[] {false, true}) {
                  try {
                      if (after) new After().payable(100, 200);
                      else new Before().payable(100, 200);
                      throw new AssertionError("Expected validation error");
                  } catch (IllegalArgumentException expected) {}
              }
          }
      }
      ~~~

      Expected: before and after refactoring, both produce 800 and 0 and reject excessive discounts; private helper names/signatures may change while tests still pass.
  - situation: 'A test verifies only how many times a mock was called but misses an invariant violation in the final object.'
    readmeRelated:
      anchorList:
      - encapsulation-002
      - testing-001
      - testing-008
      - testing-010
    resolve: 'Assert final object state and outcomes; verify mock interactions only when they form part of an observable contract.'
    knowledge: 'Behavioral tests, invariants, and over-mocking.'
    code: |-
      Mock call counts do not establish invariants. A fake repository records interactions, but tests also examine balances and final state so incorrect behavior is not hidden by call counts.

      ~~~java
      public class Case2 {
          interface AccountRepository {
              void save(Account account);
          }
          static class Account {
              private int balance;
              Account(int balance) { this.balance = balance; }
              int balance() { return balance; }
              void debit(int cents) {
                  if (cents <= 0 || cents > balance)
                      throw new IllegalArgumentException("Invalid debit");
                  balance -= cents;
              }
          }
          static class SpyRepository implements AccountRepository {
              int saves;
              int persistedBalance = -1;
              public void save(Account a) {
                  saves++;
                  persistedBalance = a.balance();
              }
          }
          static class TransferService {
              private final AccountRepository repository;
              TransferService(AccountRepository repository) { this.repository = repository; }
              void withdraw(Account account, int cents) {
                  account.debit(cents);
                  repository.save(account);
              }
          }
          public static void main(String[] args) {
              SpyRepository spy = new SpyRepository();
              Account account = new Account(1000);
              TransferService service = new TransferService(spy);
              service.withdraw(account, 250);
              if (spy.saves != 1) throw new AssertionError("Interaction contract");
              if (account.balance() != 750 || spy.persistedBalance != 750)
                  throw new AssertionError("State invariant");
              try {
                  service.withdraw(account, 800);
                  throw new AssertionError("Invalid withdrawal accepted");
              } catch (IllegalArgumentException expected) {}
              if (spy.saves != 1 || account.balance() != 750)
                  throw new AssertionError("Failure must not persist or mutate");
          }
      }
      ~~~

      Expected: after withdrawing 250, both the object balance and persisted snapshot are 750; an 800 withdrawal is rejected with unchanged state and save count.
  - situation: 'Two implementations pass their own unit tests but handle null inputs and exceptions differently, breaking substitution.'
    readmeRelated:
      anchorList:
      - abstraction-004
      - interface-008
      - subtyping-007
      - solid-004
      - testing-004
      - testing-005
    resolve: 'Run a shared contract suite against all implementations covering null, exceptions, edge cases, and side effects under one specification.'
    knowledge: 'Contract tests, LSP, and semantic compatibility.'
    code: |-
      Use the same contract suite for every implementation, specifying null behavior, exception types, the boundary 0, valid values, and repeatability without side effects.

      ~~~java
      import java.util.List;
      public class Case3 {
          record Shipment(int weightGrams, boolean express) {}
          interface ShippingPrice { int price(Shipment shipment); }
          static class BranchCalculator implements ShippingPrice {
              public int price(Shipment shipment) {
                  if (shipment == null || shipment.weightGrams() < 0)
                      throw new IllegalArgumentException("Invalid shipment");
                  int base = shipment.weightGrams() == 0 ? 0 : 100;
                  return base + (shipment.express() ? 50 : 0);
              }
          }
          static class RuleCalculator implements ShippingPrice {
              public int price(Shipment shipment) {
                  if (shipment == null || shipment.weightGrams() < 0)
                      throw new IllegalArgumentException("Invalid shipment");
                  return (shipment.weightGrams() > 0 ? 100 : 0)
                      + (shipment.express() ? 50 : 0);
              }
          }
          static void expectInvalid(ShippingPrice price, Shipment input) {
              try {
                  price.price(input);
                  throw new AssertionError("Must throw IllegalArgumentException");
              } catch (IllegalArgumentException expected) {}
          }
          static void contract(ShippingPrice price) {
              for (Shipment s : List.of(
                  new Shipment(0, false), new Shipment(0, true),
                  new Shipment(1, false), new Shipment(1, true))) {
                  int expected = (s.weightGrams() > 0 ? 100 : 0)
                      + (s.express() ? 50 : 0);
                  if (price.price(s) != expected) throw new AssertionError("Boundary");
                  if (price.price(s) != price.price(s))
                      throw new AssertionError("Unexpected state/side effect");
              }
              expectInvalid(price, null);
              expectInvalid(price, new Shipment(-1, false));
          }
          public static void main(String[] args) {
              contract(new BranchCalculator());
              contract(new RuleCalculator());
          }
      }
      ~~~

      Expected: both implementations return 0/50/100/150 and throw IllegalArgumentException for null or negative inputs. A shared suite catches behavioral drift when implementations change.
  - situation: 'A long OrderService method mixes validation, pricing, state updates, and persistence without regression tests, making developers afraid to extract responsibilities.'
    readmeRelated:
      anchorList:
      - class-design-001
      - class-design-004
      - solid-002
      - testing-009
      - refactoring-003
      - refactoring-009
    resolve: 'Add characterization/regression tests before splitting OrderService, then separate validation, pricing, state, and persistence in small steps.'
    knowledge: 'Safe refactoring, characterization tests, and SRP.'
    code: |-
      Write characterization tests for both success and failure before extracting OrderService responsibilities. Refactor one responsibility at a time, preserving public outcomes and write ordering.

      ~~~java
      import java.util.*;
      public class Case4 {
          record Order(int subtotalCents, int discountCents) {}
          record Outcome(int totalCents, String state) {}
          interface Store { void save(Outcome outcome); }
          static class MemoryStore implements Store {
              final List<Outcome> saved = new ArrayList<>();
              public void save(Outcome out) { saved.add(out); }
          }
          static class OldOrderService {
              private final Store store;
              OldOrderService(Store store) { this.store = store; }
              Outcome checkout(Order order) {
                  if (order.subtotalCents() < 0 || order.discountCents() < 0
                      || order.discountCents() > order.subtotalCents())
                      throw new IllegalArgumentException();
                  int total = order.subtotalCents() - order.discountCents();
                  Outcome result = new Outcome(total, "PAID");
                  store.save(result);
                  return result;
              }
          }
          static class Validator {
              void verify(Order order) {
                  if (order.subtotalCents() < 0 || order.discountCents() < 0
                      || order.discountCents() > order.subtotalCents())
                      throw new IllegalArgumentException();
              }
          }
          static class Pricing { int total(Order order) {
              return order.subtotalCents() - order.discountCents();
          }}
          static class RefactoredOrderService {
              private final Validator validator = new Validator();
              private final Pricing pricing = new Pricing();
              private final Store store;
              RefactoredOrderService(Store store) { this.store = store; }
              Outcome checkout(Order order) {
                  validator.verify(order);
                  Outcome result = new Outcome(pricing.total(order), "PAID");
                  store.save(result);
                  return result;
              }
          }
          public static void main(String[] args) {
              for (Order order : List.of(new Order(1000, 200), new Order(0, 0))) {
                  MemoryStore oldStore = new MemoryStore(), newStore = new MemoryStore();
                  Outcome before = new OldOrderService(oldStore).checkout(order);
                  Outcome after = new RefactoredOrderService(newStore).checkout(order);
                  if (!before.equals(after) || !oldStore.saved.equals(newStore.saved))
                      throw new AssertionError("Behavior changed");
              }
              MemoryStore store = new MemoryStore();
              try {
                  new RefactoredOrderService(store).checkout(new Order(100, 200));
                  throw new AssertionError("Bad order accepted");
              } catch (IllegalArgumentException expected) {}
              if (!store.saved.isEmpty()) throw new AssertionError("Wrote invalid order");
          }
      }
      ~~~

      Expected: both designs return the same Outcome and persist identical data in the fake store; invalid discounts cause no writes. Every small extraction has a regression gate.
  - situation: 'A refactoring replaces inheritance with composition, but delegation accidentally skips the authorization check formerly in the superclass.'
    readmeRelated:
      anchorList:
      - abstraction-004
      - subtyping-007
      - composition-008
      - solid-004
      - testing-009
      - refactoring-007
    resolve: 'Preserve permission guards during delegation, enforce them at one public boundary, and regression-test unauthorized/authorized paths.'
    knowledge: 'Delegation, security invariants, and behavior preservation.'
    code: |-
      Moving from inheritance to composition must retain permission checks at the public boundary before delegation. Test authorized and unauthorized calls, including no writes after rejection.

      ~~~java
      import java.util.*;
      public class Case5 {
          record User(boolean canEdit) {}
          interface Repository { void update(String value); }
          static class MemoryRepository implements Repository {
              final List<String> writes = new ArrayList<>();
              public void update(String value) { writes.add(value); }
          }
          static class LegacyBase {
              protected final Repository repository;
              LegacyBase(Repository repository) { this.repository = repository; }
              public final void update(User user, String value) {
                  if (!user.canEdit()) throw new SecurityException("Forbidden");
                  doUpdate(value);
              }
              protected void doUpdate(String value) { repository.update(value); }
          }
          static class OldEditor extends LegacyBase {
              OldEditor(Repository repository) { super(repository); }
          }
          interface Writer { void write(String value); }
          static class NewEditor {
              private final Writer delegate;
              NewEditor(Writer delegate) { this.delegate = delegate; }
              public void update(User user, String value) {
                  if (!user.canEdit()) throw new SecurityException("Forbidden");
                  delegate.write(value);
              }
          }
          public static void main(String[] args) {
              MemoryRepository legacy = new MemoryRepository(), modern = new MemoryRepository();
              OldEditor before = new OldEditor(legacy);
              NewEditor after = new NewEditor(modern::update);
              for (int i = 0; i < 2; i++) {
                  try {
                      if (i == 0) before.update(new User(false), "secret");
                      else after.update(new User(false), "secret");
                      throw new AssertionError("Unauthorized edit allowed");
                  } catch (SecurityException expected) {}
              }
              if (!legacy.writes.isEmpty() || !modern.writes.isEmpty())
                  throw new AssertionError("Denied call performed write");
              before.update(new User(true), "allowed");
              after.update(new User(true), "allowed");
              if (!legacy.writes.equals(modern.writes)
                  || !modern.writes.equals(List.of("allowed")))
                  throw new AssertionError("Permission contract changed");
          }
      }
      ~~~

      Expected: unauthorized callers are rejected without writes; authorized callers write the same single value as before. Do not expose Writer directly and allow clients to bypass authorization.
  - situation: 'A team migrates procedural code to many domain objects in one huge change, making it hard to identify which step broke business rules.'
    readmeRelated:
      anchorList:
      - oop-basic-006
      - solid-008
      - testing-009
      - refactoring-009
      - practice-007
    resolve: 'Migrate one use case at a time, retaining golden-master/characterization tests and small rollback points instead of rewriting the entire model in one commit.'
    knowledge: 'Incremental refactoring, regression safety, and change isolation.'
    code: |-
      Migrate use cases sequentially with the golden master as an oracle. Keep unmigrated flows in the old implementation and compare new results with fixed fixtures.

      ~~~java
      import java.util.*;
      public class Case6 {
          record Request(String operation, int cents, boolean vip) {}
          static class Legacy {
              String process(Request r) {
                  if (r.cents() < 0) return "ERR:NEGATIVE";
                  if ("BUY".equals(r.operation())) {
                      int due = r.vip() ? r.cents() * 9 / 10 : r.cents();
                      return "PAID:" + due;
                  }
                  if ("REFUND".equals(r.operation())) return "REFUNDED:" + r.cents();
                  return "ERR:UNKNOWN";
              }
          }
          interface Operation { String execute(Request r); }
          static class BuyOperation implements Operation {
              public String execute(Request r) {
                  int due = r.vip() ? r.cents() * 9 / 10 : r.cents();
                  return "PAID:" + due;
              }
          }
          static class Router {
              private final Legacy old = new Legacy();
              private final Operation newBuy = new BuyOperation();
              String process(Request r) {
                  if (r.cents() < 0) return "ERR:NEGATIVE";
                  if ("BUY".equals(r.operation())) return newBuy.execute(r);
                  return old.process(r); // Chưa migrate REFUND.
              }
          }
          public static void main(String[] args) {
              Legacy legacy = new Legacy();
              Router candidate = new Router();
              Map<Request, String> golden = new LinkedHashMap<>();
              golden.put(new Request("BUY", 1000, false), "PAID:1000");
              golden.put(new Request("BUY", 1000, true), "PAID:900");
              golden.put(new Request("BUY", 0, true), "PAID:0");
              golden.put(new Request("REFUND", 500, false), "REFUNDED:500");
              golden.put(new Request("BUY", -1, false), "ERR:NEGATIVE");
              golden.put(new Request("OTHER", 10, false), "ERR:UNKNOWN");
              for (var entry : golden.entrySet()) {
                  String expected = entry.getValue();
                  if (!expected.equals(legacy.process(entry.getKey())))
                      throw new AssertionError("Golden baseline drifted");
                  if (!expected.equals(candidate.process(entry.getKey())))
                      throw new AssertionError("Incremental refactor regressed: " + entry.getKey());
              }
          }
      }
      ~~~

      Expected: BUY uses new domain objects while REFUND still uses old code; all six fixtures produce fixed results. Migrate the next use case separately after tests pass.
  - situation: 'Moving a method to another class changes side-effect order, so callbacks run before data state is complete.'
    readmeRelated:
      anchorList:
      - class-005
      - object-009
      - modeling-007
      - testing-009
      - testing-010
      - refactoring-004
    resolve: 'Specify side-effect ordering in contracts; validate/commit before callbacks and test both order and failure paths after Move Method.'
    knowledge: 'Refactoring semantics, observable side effects, and sequencing.'
    code: |-
      Side-effect order is a contract: validate -> persist/commit -> callback. A fake store records order and simulates failures; callbacks must never see unpersisted state.

      ~~~java
      import java.util.*;
      public class Case7 {
          static class Order {
              boolean committed;
          }
          interface Store { void commit(Order order); }
          interface Listener { void onCommitted(Order order); }
          static class RefactoredService {
              private final Store store;
              private final Listener listener;
              private final List<String> events;
              RefactoredService(Store store, Listener listener, List<String> events) {
                  this.store = store; this.listener = listener; this.events = events;
              }
              void execute(Order order, String input) {
                  events.add("validate");
                  if (input == null || input.isBlank()) throw new IllegalArgumentException();
                  store.commit(order);
                  listener.onCommitted(order);
              }
          }
          public static void main(String[] args) {
              List<String> success = new ArrayList<>();
              Store goodStore = order -> {
                  success.add("commit");
                  order.committed = true;
              };
              Listener cb = order -> {
                  success.add("callback");
                  if (!order.committed) throw new AssertionError("Callback before commit");
              };
              new RefactoredService(goodStore, cb, success).execute(new Order(), "ok");
              if (!success.equals(List.of("validate", "commit", "callback")))
                  throw new AssertionError("Wrong event order");
              List<String> failure = new ArrayList<>();
              Store broken = order -> {
                  failure.add("commit");
                  throw new IllegalStateException("Store unavailable");
              };
              new RefactoredService(broken, order -> failure.add("callback"), failure);
              try {
                  new RefactoredService(broken, order -> failure.add("callback"), failure)
                      .execute(new Order(), "ok");
                  throw new AssertionError("Expected persistence error");
              } catch (IllegalStateException expected) {}
              if (!failure.equals(List.of("validate", "commit")))
                  throw new AssertionError("Callback fired on failure");
          }
      }
      ~~~

      Expected: successful calls run validate, commit, then callback; failed commits never invoke callbacks. This in-memory fake demonstrates ordering only; real databases need transactions/outboxes to handle crashes.
  - situation: 'A test starts the entire Spring context for a simple pricing object, slowing unit tests and making them environment-dependent.'
    readmeRelated:
      anchorList:
      - interface-009
      - composition-006
      - solid-006
      - solid-007
      - testing-007
    resolve: 'Test pricing classes directly with plain unit tests and fake dependencies; reserve Spring context tests for actual wiring/integration.'
    knowledge: 'The test pyramid, test isolation, and Spring context costs.'
    code: |-
      Use plain Java unit tests with fake dependencies for pricing classes instead of booting Spring; verify real Spring wiring separately through integration tests only when needed.

      ~~~java
      public class Case8 {
          interface DiscountPolicy { int discountCents(int subtotal); }
          static class PricingCalculator {
              private final DiscountPolicy policy;
              PricingCalculator(DiscountPolicy policy) { this.policy = policy; }
              int total(int subtotalCents) {
                  if (subtotalCents < 0) throw new IllegalArgumentException();
                  int discount = policy.discountCents(subtotalCents);
                  if (discount < 0 || discount > subtotalCents)
                      throw new IllegalStateException("Invalid discount");
                  return subtotalCents - discount;
              }
          }
          public static void main(String[] args) {
              DiscountPolicy fake = subtotal -> subtotal / 10;
              PricingCalculator calculator = new PricingCalculator(fake);
              if (calculator.total(1000) != 900) throw new AssertionError();
              if (calculator.total(0) != 0) throw new AssertionError();
              try {
                  calculator.total(-1);
                  throw new AssertionError("Must reject negatives");
              } catch (IllegalArgumentException expected) {}
              PricingCalculator badPolicy = new PricingCalculator(subtotal -> subtotal + 1);
              try {
                  badPolicy.total(100);
                  throw new AssertionError("Must reject invalid collaborator");
              } catch (IllegalStateException expected) {}
          }
      }
      ~~~

      Expected: assertions run with ordinary javac/java without Spring ApplicationContext or environment dependencies. Spring context tests belong to bean configuration/wiring, HTTP, and real integrations.
- groupID: 13
  groupName: 'Concurrency, Memory Lifecycles, and Performance'
  cases:
  - situation: 'Two threads read and increment a counter in a mutable object, producing fewer processed operations than received requests.'
    readmeRelated:
      anchorList:
      - class-003
      - object-007
      - design-pitfalls-008
      - testing-003
    resolve: 'Use AtomicInteger or a lock covering the entire read-modify-write; test with multiple threads and assert total updates.'
    knowledge: 'Race conditions, atomic operations, and lost updates.'
    code: |-
      ### Case 1 ? Lost updates when two threads increment a counter

      The \`value++\` operation reads, increments, and writes; it is not atomic. The counterexample forces both threads to read the old value before writing, making lost updates reproducible. The corrected version uses \`AtomicInteger.incrementAndGet()\` and checks the final count after threads finish.

      ~~~java
      import java.util.concurrent.*;
      import java.util.concurrent.atomic.AtomicInteger;
      public class Case1 {
          static class BadCounter { int value; }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) throws Exception {
              BadCounter bad = new BadCounter();
              CountDownLatch bothRead = new CountDownLatch(2);
              CountDownLatch release = new CountDownLatch(1);
              Runnable unsafe = () -> {
                  int old = bad.value;
                  bothRead.countDown();
                  try { release.await(); }
                  catch (InterruptedException e) {
                      Thread.currentThread().interrupt();
                      return;
                  }
                  bad.value = old + 1;
              };
              Thread a = new Thread(unsafe), b = new Thread(unsafe);
              a.start(); b.start();
              bothRead.await(); release.countDown(); a.join(); b.join();
              check(bad.value == 1); // Hai lần tăng nhưng chỉ ghi nhận một.

              AtomicInteger good = new AtomicInteger();
              Thread[] workers = new Thread[4];
              for (int i=0;i<workers.length;i++) {
                  workers[i] = new Thread(() -> {
                      for (int n=0;n<2_000;n++) good.incrementAndGet();
                  });
                  workers[i].start();
              }
              for (Thread t: workers) t.join();
              check(good.get() == 8_000);
              System.out.println("PASS: atomic counter preserves all increments");
          }
      }
      ~~~

      **Verification:** compile \`javac Case1.java\` and run \`java Case1\`; assertions specify expected outcomes but are not claimed as independently executed here. A latch forces the counterexample interleaving; AtomicInteger provides linearizable read-modify-write. If a counter's invariants span multiple fields, one AtomicInteger does not protect the entire invariant; use encompassing locks/transactions.
  - situation: 'One thread updates a completed flag, but another thread may not observe the new value promptly because there is no memory-synchronization relationship.'
    readmeRelated:
      anchorList:
      - object-007
      - design-pitfalls-008
      - testing-003
    resolve: 'Use volatile/AtomicBoolean or locks to establish happens-before; do not treat sleeping as a visibility guarantee.'
    knowledge: 'The Java Memory Model, visibility, and happens-before.'
    code: |-
      ### Case 2 ? completed visibility requires a happens-before relationship

      Without synchronization, a plain boolean written by thread A and read by thread B may not become visible promptly. Use \`AtomicBoolean\` or \`volatile\` with explicit synchronization. Thread.sleep does not guarantee visibility.

      ~~~java
      import java.util.concurrent.*;
      import java.util.concurrent.atomic.AtomicBoolean;
      public class Case2 {
          static final class Job {
              private final AtomicBoolean completed = new AtomicBoolean();
              void finish() { completed.set(true); }
              boolean isCompleted() { return completed.get(); }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) throws Exception {
              Job job = new Job();
              ExecutorService pool = Executors.newFixedThreadPool(2);
              CountDownLatch start = new CountDownLatch(1);
              try {
                  Future<Boolean> observer = pool.submit(() -> {
                      start.await();
                      while (!job.isCompleted()) Thread.onSpinWait();
                      return job.isCompleted();
                  });
                  Future<?> writer = pool.submit(() -> {
                      start.await();
                      job.finish();
                      return null;
                  });
                  start.countDown();
                  writer.get(5, TimeUnit.SECONDS);
                  check(observer.get(5, TimeUnit.SECONDS));
                  check(job.isCompleted());
                  System.out.println("PASS: completion safely published");
              } finally {
                  pool.shutdownNow();
              }
          }
      }
      ~~~

      **Verification:** \`javac Case2.java\`, \`java Case2\`; a Future timeout prevents indefinite test hangs. AtomicBoolean \`set/get\` provides volatile memory semantics. This example **does not reliably reproduce a visibility failure with plain booleans**: the Java Memory Model permits missing visibility but does not force every run to fail. Production waiting should favor latches, conditions, or Futures over busy spinning.
  - situation: 'An object contains a mutable HashMap read and written concurrently by multiple requests, causing unstable results and lost updates.'
    readmeRelated:
      anchorList:
      - object-005
      - object-007
      - design-pitfalls-008
      - testing-003
    resolve: 'Use ConcurrentHashMap or immutable snapshots with appropriate operation contracts; protect compound updates under contention.'
    knowledge: 'Concurrent collections, thread safety, and atomic compound operations.'
    code: |-
      ### Case 3 ? ConcurrentHashMap still requires atomic compound updates

      HashMap is not designed for concurrent writers. Even a thread-safe map can lose updates when separate \`get\` and \`put\` calls form a read-modify-write; use atomic \`merge\`/compute on the same key.

      ~~~java
      import java.util.*;
      import java.util.concurrent.*;
      public class Case3 {
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args) throws Exception {
              Map<String,Integer> wrong = new HashMap<>();
              wrong.put("A",0);
              int first=wrong.get("A"),second=wrong.get("A");
              wrong.put("A",first+1);
              wrong.put("A",second+1);
              check(wrong.get("A")==1); // Mô phỏng lịch xen kẽ bị lost update.

              ConcurrentHashMap<String,Integer> counts=new ConcurrentHashMap<>();
              ExecutorService pool=Executors.newFixedThreadPool(4);
              CountDownLatch go=new CountDownLatch(1);
              try {
                  List<Future<?>> tasks=new ArrayList<>();
                  for(int t=0;t<4;t++){
                      tasks.add(pool.submit(() -> {
                          go.await();
                          for(int i=0;i<1_000;i++) counts.merge("A",1,Integer::sum);
                          return null;
                      }));
                  }
                  go.countDown();
                  for(Future<?> task:tasks)task.get(5,TimeUnit.SECONDS);
                  check(counts.get("A")==4_000);
                  System.out.println("PASS: atomic merge per key");
              } finally {pool.shutdownNow();}
          }
      }
      ~~~

      **Verification:** the incorrect path uses controlled sequential interleaving rather than an unsafe HashMap data race; the correct path uses four workers and checks the total. \`ConcurrentHashMap\` makes an individual per-key \`merge\` safe, not a multi-key transaction. Related fields still require transactions/locks or correctly published immutable snapshots.
  - situation: 'A listener callback runs while its owner holds a lock, causing deadlocks when callbacks reenter other objects.'
    readmeRelated:
      anchorList:
      - design-patterns-010
      - testing-010
    resolve: 'Never invoke external callbacks under locks; snapshot listeners while locked, dispatch after unlocking, and check lock ordering.'
    knowledge: 'Deadlocks, lock ordering, and external calls under locks.'
    code: |-
      ### Case 4 ? Do not call external callbacks while holding locks

      External callbacks may call back into other objects and form lock cycles. Publishing events inside \`synchronized\` is risky; instead, snapshot listeners under the lock and invoke callbacks outside the critical section.

      ~~~java
      import java.util.*;
      public class Case4 {
          interface Listener { void accept(String event); }
          static final class Bus {
              private final Object mutex=new Object();
              private final List<Listener> listeners=new ArrayList<>();
              void subscribe(Listener l){
                  synchronized(mutex){listeners.add(l);}
              }
              void unsubscribe(Listener l){
                  synchronized(mutex){listeners.remove(l);}
              }
              void publish(String value){
                  List<Listener> snapshot;
                  synchronized(mutex){snapshot=List.copyOf(listeners);}
                  for(Listener l:snapshot)l.accept(value);
              }
              boolean holdingBusLock(){return Thread.holdsLock(mutex);}
              int count(){synchronized(mutex){return listeners.size();}}
          }
          static final class BadBus {
              final List<Runnable> listeners=new ArrayList<>();
              synchronized void publish(){
                  for(Runnable r:listeners)r.run(); // Callback vẫn giữ monitor.
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BadBus bad=new BadBus();
              bad.listeners.add(()->check(Thread.holdsLock(bad)));
              bad.publish(); // Chứng minh callback chạy dưới lock, không tạo deadlock.

              Bus safe=new Bus();
              List<String> received=new ArrayList<>();
              Listener[] self=new Listener[1];
              self[0]=event->{
                  check(!safe.holdingBusLock());
                  received.add(event);
                  safe.unsubscribe(self[0]);
              };
              safe.subscribe(self[0]);
              safe.publish("first");
              safe.publish("second");
              check(received.equals(List.of("first")) && safe.count()==0);
              System.out.println("PASS: callbacks invoked outside lock");
          }
      }
      ~~~

      **Verification:** test \`Thread.holdsLock\` and unsubscribe within a callback rather than forcing a potentially hanging deadlock. Snapshots separate listener-list mutations from dispatch, but listeners already captured may still receive callbacks after unsubscribing; document this in the event contract. Inspect lock ordering through thread dumps during integration.
  - situation: 'A class makes each method thread-safe, but a read followed by an update across two methods still races with other requests.'
    readmeRelated:
      anchorList:
      - object-007
      - encapsulation-009
      - design-pitfalls-008
      - testing-003
    resolve: 'Combine read and update into one atomic method or lock/transaction around the full operation, not just individual synchronized getters/setters.'
    knowledge: 'Compound races, atomicity boundaries, and thread safety.'
    code: |-
      ### Case 5 ? Synchronized getters and setters do not protect read-modify-write transactions

      Even with \`synchronized get()\` and \`synchronized set()\`, the client's \`set(get()+1)\` is not atomic. Move increment into one synchronized method.

      ~~~java
      public class Case5 {
          static final class BadCounter {
              private int value;
              synchronized int get(){return value;}
              synchronized void set(int v){value=v;}
          }
          static final class Counter {
              private int value;
              synchronized void increment(){value++;}
              synchronized int get(){return value;}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args) throws InterruptedException {
              BadCounter bad=new BadCounter();
              int readA=bad.get(),readB=bad.get();
              bad.set(readA+1);
              bad.set(readB+1);
              check(bad.get()==1); // Getter/setter riêng vẫn lost update.
              Counter good=new Counter();
              Thread[] workers=new Thread[4];
              for(int i=0;i<workers.length;i++){
                  workers[i]=new Thread(()->{
                      for(int n=0;n<1_000;n++)good.increment();
                  });
                  workers[i].start();
              }
              for(Thread t:workers)t.join();
              check(good.get()==4_000);
              System.out.println("PASS: lock covers entire compound operation");
          }
      }
      ~~~

      **Verification:** a fixed interleaving breaks the old design, while the new version protects all increment steps under one monitor. Locks must cover *the entire invariant*; I/O, multiple objects, or database writes need explicit transaction/synchronization boundaries and rollback handling.
  - situation: 'A cache retains references to every processed request object without eviction, gradually growing the heap long after results lose value.'
    readmeRelated:
      anchorList:
      - object-003
      - lifecycle-006
      - lifecycle-007
    resolve: 'Bound caches by eviction/TTL/size, release obsolete references, and inspect temporal heap dumps to diagnose retention.'
    knowledge: 'GC reachability, cache eviction, and memory-leak analysis.'
    code: |-
      ### Case 6 ? Bound cache sizes and release unused references

      Keeping every request in a long-lived list leaves it reachable, preventing GC from reclaiming referenced objects. A bounded cache retains only keys and results actually needed.

      ~~~java
      import java.util.*;
      public class Case6 {
          record Request(String id,byte[] payload){}
          static final class BadRetention {
              final List<Request> everything=new ArrayList<>();
              void remember(Request request){everything.add(request);}
          }
          static final class BoundedCache {
              final Map<String,String> entries;
              BoundedCache(int max){
                  if(max<1)throw new IllegalArgumentException("max");
                  entries=new LinkedHashMap<>(16,0.75f,true){
                      @Override protected boolean removeEldestEntry(
                          Map.Entry<String,String> eldest){
                          return size()>max;
                      }
                  };
              }
              void put(String id,String result){entries.put(id,result);}
              String get(String id){return entries.get(id);}
              int size(){return entries.size();}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BadRetention bad=new BadRetention();
              for(int i=0;i<3;i++)bad.remember(new Request("R"+i,new byte[1_024]));
              check(bad.everything.size()==3); // Vẫn giữ ba request.
              BoundedCache cache=new BoundedCache(2);
              cache.put("R1","ok1");cache.put("R2","ok2");
              check(cache.get("R1").equals("ok1")); // R1 mới được truy cập.
              cache.put("R3","ok3");
              check(cache.size()==2 && cache.get("R2")==null);
              check(cache.get("R1").equals("ok1"));
              System.out.println("PASS: least-recently-used eviction");
          }
      }
      ~~~

      **Verification:** check LRU eviction, the 2-entry limit, and removal of R2. This establishes that **the cache no longer references R2**, not that heap usage fell or GC ran. Use JFR/heap dumps and retention paths in production to locate remaining references; consider TTL, byte-based limits, and concurrency.
