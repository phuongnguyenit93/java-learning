    code: |-
      ### Case 3 ? Moving invariants into domain objects

      **Incorrect:** a public field lets any caller create a negative balance; a static withdrawal utility cannot prevent other code from bypassing it. **Correct:** keep state private and change it only through guarded methods.

      ~~~java
      public class Case3 {
          static final class BadAccount {
              public long balance = 100;
          }
          static final class Account {
              private long balance;
              Account(long opening) {
                  if (opening < 0) throw new IllegalArgumentException("opening");
                  balance = opening;
              }
              long balance() { return balance; }
              void withdraw(long amount) {
                  if (amount <= 0 || amount > balance)
                      throw new IllegalArgumentException("amount");
                  balance -= amount;
              }
              void deposit(long amount) {
                  if (amount <= 0) throw new IllegalArgumentException("amount");
                  balance = Math.addExact(balance, amount);
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          static void rejects(Runnable action) {
              try {
                  action.run();
              } catch (IllegalArgumentException expected) { return; }
              throw new AssertionError("should reject");
          }
          public static void main(String[] args) {
              BadAccount broken = new BadAccount();
              broken.balance = -50; // Caller bỏ qua mọi utility method.
              check(broken.balance < 0);

              Account safe = new Account(100);
              rejects(() -> safe.withdraw(150));
              check(safe.balance() == 100); // Lỗi không làm đổi state.
              safe.withdraw(60);
              check(safe.balance() == 40);
              safe.deposit(10);
              check(safe.balance() == 50);
              rejects(() -> new Account(-1));
              System.out.println("PASS: invariant số dư không âm");
          }
      }
      ~~~

      **Evidence:** the test intentionally corrupts `BadAccount`, while `Account` rejects invalid initialization and withdrawals exceeding the balance. Run `javac Case3.java`, `java Case3`. This example assumes one thread; concurrent updates to the same account require appropriate transactions/locks and race tests. Stateless pure utilities can still be static.
