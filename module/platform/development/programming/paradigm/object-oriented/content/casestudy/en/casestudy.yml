    code: |-
      ### Case 4 ? Defensively copying internal byte arrays

      Byte arrays are always mutable, so copy both input and output when their values must remain stable. The example uses fake data, not actual secrets.

      ~~~java
      import java.util.Arrays;
      public class Case4 {
        static class Bad {
          private final byte[] data;
          Bad(byte[] data){this.data=data;}
          byte[] data(){return data;}
        }
        static class Safe {
          private final byte[] data;
          Safe(byte[] value){
            if(value==null||value.length==0)throw new IllegalArgumentException();
            data=value.clone();
          }
          byte[] snapshot(){return data.clone();}
        }
        static void check(boolean b){if(!b)throw new AssertionError();}
        public static void main(String[] args){
          byte[] a={1,2,3};Bad bad=new Bad(a);
          bad.data()[0]=8;check(a[0]==8);
          byte[] source={1,2,3};Safe safe=new Safe(source);
          source[0]=7;safe.snapshot()[1]=9;
          check(Arrays.equals(safe.snapshot(),new byte[]{1,2,3}));
          System.out.println("PASS");
        }
      }
      ~~~

      Run javac Case4.java then java Case4. Tests show reference aliasing in Bad and input/output copies in Safe. For real secrets, avoid unnecessary getters and enforce access controls and lifecycle management; defensive copies do not replace other security measures.
