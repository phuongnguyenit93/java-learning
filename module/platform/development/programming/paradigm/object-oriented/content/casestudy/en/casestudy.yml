      ### Case 4 ? Resolving default-method conflicts after interface upgrades

      When two interfaces supply the same default method signature, a class implementing both cannot select one automatically; it needs an explicit override that preserves the behavioral contract.

      ~~~java
      public class Case4 {
          interface AuditLabel {
              default String label() { return "Audit"; }
          }
          interface PaymentLabel {
              default String label() { return "Payment"; }
          }
          // class Invalid implements AuditLabel, PaymentLabel {}
          // Bỏ comment ở trên -> Java báo conflicting defaults.
          static final class Combined implements AuditLabel, PaymentLabel {
              @Override public String label() {
                  return PaymentLabel.super.label() + " / "
                       + AuditLabel.super.label();
              }
          }
          static final class AuditOnly implements AuditLabel {}
          static void check(boolean b) { if (!b) throw new AssertionError(); }
          public static void main(String[] args) {
              check(new AuditOnly().label().equals("Audit"));
              check(new Combined().label().equals("Payment / Audit"));
              System.out.println("PASS: explicit default resolution");
          }
      }
      ~~~

      **Verification:** run \`javac Case4.java\` and \`java Case4\`. To see the compiler error, uncomment \`Invalid\` and compile it separately; the example only **describes the expected compile result** and does not claim to execute the invalid line. Real library upgrades also require source and binary compatibility checks across clients.
