    code: |-
      ### Case 1 ? Separating responsibilities in hospital management

      **Counterexample:** `HospitalManager` manages appointments, calculates fees, and sends SMS; changing fee rules risks changing appointment behavior in the same class. Give each rule its own component and leave orchestration to the use case. The following *small regression test* demonstrates that changing fees leaves appointments intact, not that the whole system is free of bugs.

      ~~~java
      import java.util.*;

      public class Case1 {
          record Patient(String id) {}
          static final class AppointmentBook {
              private final Map<String, String> appointments = new HashMap<>();
              void book(Patient patient, String slot) {
                  if (patient.id().isBlank() || slot.isBlank())
                      throw new IllegalArgumentException("invalid booking");
                  appointments.put(patient.id(), slot);
              }
              String slotFor(String patientId) { return appointments.get(patientId); }
          }
          interface Billing {
              long charge(long baseFee);
          }
          interface Messenger {
              void notifyPatient(String patientId);
          }
          static final class HospitalUseCase {
              private final AppointmentBook appointments;
              private final Billing billing;
              private final Messenger messenger;
              HospitalUseCase(AppointmentBook a, Billing b, Messenger m) {
                  appointments = a; billing = b; messenger = m;
              }
              long book(Patient patient, String slot, long baseFee) {
                  appointments.book(patient, slot);
                  messenger.notifyPatient(patient.id());
                  return billing.charge(baseFee);
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              Patient p = new Patient("P-1");
              AppointmentBook book = new AppointmentBook();
              List<String> sent = new ArrayList<>();
              Messenger fake = sent::add;
              HospitalUseCase oldFee = new HospitalUseCase(book, fee -> fee, fake);
              check(oldFee.book(p, "9:00", 100_000) == 100_000);
              HospitalUseCase newFee = new HospitalUseCase(book, fee -> fee + 20_000, fake);
              check(newFee.book(p, "9:00", 100_000) == 120_000);
              check("9:00".equals(book.slotFor("P-1")));
              check(sent.equals(List.of("P-1", "P-1")));
              System.out.println("PASS: phí thay đổi, lịch hẹn vẫn đúng");
          }
      }
      ~~~

      **Verification:** `javac Case1.java && java Case1` (in a shell supporting `&&`). Assertions cover two fee versions and the appointment; real systems also require tests for booking permissions, duplicate slots, and rollback on notification failure. Do not assume booking and billing steps are transactionally atomic.
