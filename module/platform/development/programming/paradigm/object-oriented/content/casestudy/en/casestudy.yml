    code: |-
      ### Case 7 ? Do not trade readability for performance without a baseline

      Replacing domain objects with primitive arrays can hurt maintainability without proven benefits. First write behavioral-equivalence tests, then measure representative workload performance, warmup, allocations, GC, throughput, and latency using JMH/JFR.

      ~~~java
      public class Case7 {
          record Line(long unitPrice,int quantity){}
          static long usingObjects(Line[] lines){
              long total=0;
              for(Line x:lines)
                  total=Math.addExact(total,
                      Math.multiplyExact(x.unitPrice(),x.quantity()));
              return total;
          }
          static long usingArrays(long[] prices,int[] quantities){
              if(prices.length!=quantities.length)
                  throw new IllegalArgumentException("length");
              long total=0;
              for(int i=0;i<prices.length;i++)
                  total=Math.addExact(total,
                      Math.multiplyExact(prices[i],quantities[i]));
              return total;
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              Line[] lines={new Line(100,2),new Line(55,3),new Line(0,1)};
              long[] prices={100,55,0};
              int[] quantities={2,3,1};
              long expected=usingObjects(lines);
              check(expected==365);
              check(usingArrays(prices,quantities)==expected);
              try{
                  usingArrays(new long[]{1,2},new int[]{1});
                  throw new AssertionError("mismatch accepted");
              }catch(IllegalArgumentException ok){}
              System.out.println("PASS: both implementations are functionally equal");
          }
      }
      ~~~

      **Performance verification:** retain before/after versions and benchmark equivalent workloads with JMH (forks, warmup, measurement, blackholes), use JFR for allocations/GC and CPU profilers, and compare p95/p99 under real loads. Repeat under the same JDK/heap/OS. Because no benchmark was run, **there is no evidence that arrays are faster than objects**. Assertions above check correctness and edge cases only.
  - situation: 'Reusing objects to reduce allocation accidentally retains prior request state, leaking data between users.'
    readmeRelated:
      anchorList:
      - object-005
      - object-007
      - lifecycle-006
      - design-pitfalls-008
      - testing-003
    resolve: 'Avoid reusing mutable objects across untrusted requests; use immutable contexts/new instances or thorough resets with isolation tests.'
    knowledge: 'Object-pooling risks, aliasing, and data isolation.'
    code: |-
      ### Case 8 ? Reusing mutable objects between requests leaks prior user state

      A shared pool reuses \`MutableContext\`, resetting only the username and forgetting ADMIN privileges; request B inherits A's permissions. Create separate immutable request contexts and defensively copy collections.

      ~~~java
      import java.util.*;
      public class Case8 {
          static final class MutableContext {
              String user;
              final Set<String> roles=new HashSet<>();
          }
          static final class BadPool {
              static final MutableContext SHARED=new MutableContext();
              static MutableContext forUser(String user){
                  SHARED.user=user;
                  return SHARED; // Quên clear roles.
              }
          }
          record RequestContext(String user,Set<String> roles){
              RequestContext{
                  if(user==null||user.isBlank())throw new IllegalArgumentException();
                  roles=Set.copyOf(roles);
              }
              boolean isAdmin(){return roles.contains("ADMIN");}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              MutableContext first=BadPool.forUser("Alice");
              first.roles.add("ADMIN");
              MutableContext second=BadPool.forUser("Bob");
              check(second==first);
              check(second.user.equals("Bob")&&second.roles.contains("ADMIN"));

              Set<String> inputRoles=new HashSet<>(Set.of("USER"));
              RequestContext bob=new RequestContext("Bob",inputRoles);
              inputRoles.add("ADMIN");
              RequestContext alice=new RequestContext("Alice",Set.of("ADMIN"));
              check(!bob.isAdmin() && alice.isAdmin());
              try{
                  bob.roles().add("ADMIN");
                  throw new AssertionError("mutable snapshot");
              }catch(UnsupportedOperationException expected){}
              System.out.println("PASS: per-request immutable authorization snapshot");
          }
      }
      ~~~

      **Verification:** the faulty path retains previous user state; the safe path is unaffected by changes to input roles and rejects snapshot mutations. This only simulates authorization data and **is not a real authentication system**; trusted security layers must create roles rather than accept them directly from clients. Reuse is safe only with explicit ownership/lifecycles and complete field resets.
  - situation: 'The application synchronizes an entire service to protect one small field, serializing independent requests under heavy load.'
    readmeRelated:
      anchorList: []
    resolve: 'Reduce critical-section size or use resource-specific locks/atomic fields; benchmark real-workload contention before choosing a solution.'
    knowledge: 'Lock granularity, contention, and concurrent throughput.'
    code: |-
      ### Case 9 ? Locking an entire service serializes unrelated requests

      A method-wide \`synchronized\` holds the monitor even while collaborators perform independent work. Use AtomicInteger for the counter's small critical operation and perform other work outside the lock. The output checks lock ownership; it **does not prove throughput improved**.

      ~~~java
      import java.util.concurrent.atomic.AtomicInteger;
      public class Case9 {
          static final class BadService {
              private int count;
              synchronized void handle(Runnable work){
                  count++;
                  work.run(); // Lệnh ngoài vẫn giữ monitor của cả service.
              }
              synchronized int count(){return count;}
          }
          static final class BetterService {
              private final AtomicInteger count=new AtomicInteger();
              void handle(Runnable work){
                  count.incrementAndGet(); // Critical operation nhỏ.
                  work.run();              // Không giữ monitor trên work.
              }
              int count(){return count.get();}
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BadService old=new BadService();
              old.handle(()->check(Thread.holdsLock(old)));
              BetterService better=new BetterService();
              better.handle(()->check(!Thread.holdsLock(better)));
              better.handle(()->check(!Thread.holdsLock(better)));
              check(old.count()==1 && better.count()==2);
              System.out.println("PASS: independent work not under service monitor");
          }
      }
      ~~~

      **Verification:** tests show \`BadService\` invokes callbacks under its lock, while \`BetterService\` uses only atomic updates. To establish real contention, benchmark multithreaded workloads with concurrent request counts, blocked time, JFR \`jdk.JavaMonitorEnter\`, and invariant checks under load. If work also accesses other shared state, reducing lock scope must not break overall transaction guarantees.
  - situation: 'A domain object contains dozens of collections and derived caches without consistent invalidation, leaving data stale after updates.'
    readmeRelated:
      anchorList:
      - object-001
      - object-007
      - encapsulation-002
      - class-design-007
      - design-pitfalls-008
      - testing-003
    resolve: 'Identify dependencies for derived caches, invalidate them on mutation or recompute on demand, and test consistency after updates.'
    knowledge: 'Cache invalidation, derived state, and object invariants.'
    code: |-
      ### Case 10 ? Derived caches need invalidation when aggregates change

      Cache \`total\` is derived from quantities. If quantities change without invalidating the cache, callers read stale values. Encapsulate collections in the aggregate, invalidate on every mutation, and test consistency after each update.

      ~~~java
      import java.util.*;
      public class Case10 {
          static final class BadOrder {
              final Map<String,Integer> qty=new HashMap<>();
              Integer cachedTotal;
              int total(){
                  if(cachedTotal==null)
                      cachedTotal=qty.values().stream().mapToInt(Integer::intValue).sum();
                  return cachedTotal;
              }
              void set(String sku,int count){qty.put(sku,count);} // Quên invalidation.
          }
          static final class Order {
              private final Map<String,Integer> qty=new HashMap<>();
              private Integer cachedTotal;
              synchronized void setQuantity(String sku,int count){
                  if(sku==null||sku.isBlank()||count<0)
                      throw new IllegalArgumentException();
                  qty.put(sku,count);
                  cachedTotal=null; // Invalidate cùng mutation.
              }
              synchronized int total(){
                  if(cachedTotal==null)
                      cachedTotal=qty.values().stream().mapToInt(Integer::intValue).sum();
                  return cachedTotal;
              }
          }
          static void check(boolean ok){if(!ok)throw new AssertionError();}
          public static void main(String[] args){
              BadOrder broken=new BadOrder();
              broken.set("A",1);
              check(broken.total()==1);
              broken.set("A",3);
              check(broken.total()==1); // Stale cache.
              Order good=new Order();
              good.setQuantity("A",1);
              check(good.total()==1);
              good.setQuantity("A",3);
              check(good.total()==3);
              good.setQuantity("B",2);
              check(good.total()==5);
              try{
                  good.setQuantity("B",-1);
                  throw new AssertionError("negative accepted");
              }catch(IllegalArgumentException expected){}
              check(good.total()==5);
              System.out.println("PASS: derived cache consistent after mutation");
          }
      }
      ~~~

      **Verification:** updates to A and B produce new totals, while invalid updates preserve old state. Here \`synchronized\` protects collection and cache during reads/writes; additional derived values need explicit dependency and invalidation rules. Distributed caches across nodes require separate event/version/TTL policies and consistency tests.
