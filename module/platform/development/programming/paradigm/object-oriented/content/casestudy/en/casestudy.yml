      ### Case 11 ? Do not retain mutable Date references

      ~~~java
      import java.util.Date;
      import java.time.Instant;
      public class Case11 {
        static class Bad {
          private final Date date;
          Bad(Date date){this.date=date;}
          Date date(){return date;}
        }
        static class Safe {
          private final Date date;
          Safe(Date source){date=new Date(source.getTime());}
          Date date(){return new Date(date.getTime());}
        }
        record ImmutableExpiry(Instant deadline){}
        static void check(boolean b){if(!b)throw new AssertionError();}
        public static void main(String[] args){
          Date input=new Date(1000);
          Bad bad=new Bad(input);
          input.setTime(2000);
          check(bad.date().getTime()==2000);
          bad.date().setTime(3000);
          check(bad.date().getTime()==3000);
          Date copyInput=new Date(1000);
          Safe safe=new Safe(copyInput);
          copyInput.setTime(2000);
          safe.date().setTime(4000);
          check(safe.date().getTime()==1000);
          check(new ImmutableExpiry(Instant.ofEpochMilli(1000))
                .deadline().toEpochMilli()==1000);
          System.out.println("PASS");
        }
      }
      ~~~

      Run javac Case11.java then java Case11. Date is cloned at both boundaries; Instant is an immutable alternative for an instant in time. If the domain represents a local date only, use LocalDate/ZoneId instead of assuming UTC.
