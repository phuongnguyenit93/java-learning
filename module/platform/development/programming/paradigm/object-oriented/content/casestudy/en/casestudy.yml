    code: |-
      ### Case 5 ? Read-only repositories should not implement writes

      **Root problem:** one interface exposes \`find\` and \`save\`, forcing a read-only adapter to \`throw UnsupportedOperationException\`. **Fix:** separate capabilities so the compiler does not demand a \`save\` method from readers.

      ~~~java
      import java.util.*;

      public class Case5 {
          record Product(String sku) {}
          interface ProductReader { Optional<Product> find(String sku); }
          interface ProductWriter { void save(Product product); }
          static final class CatalogMirror implements ProductReader {
              public Optional<Product> find(String sku) {
                  return "A".equals(sku) ? Optional.of(new Product("A"))
                                         : Optional.empty();
              }
          }
          static final class MemoryStore implements ProductReader, ProductWriter {
              private final Map<String, Product> data = new HashMap<>();
              public Optional<Product> find(String sku) {
                  return Optional.ofNullable(data.get(sku));
              }
              public void save(Product p) { data.put(p.sku(), p); }
          }
          static void check(boolean b) { if (!b) throw new AssertionError(); }
          public static void main(String[] args) {
              ProductReader mirror = new CatalogMirror();
              check(mirror.find("A").isPresent());
              check(mirror.find("B").isEmpty());
              // mirror.save(new Product("C")); // Không biên dịch.
              MemoryStore writable = new MemoryStore();
              writable.save(new Product("C"));
              check(writable.find("C").orElseThrow().sku().equals("C"));
              System.out.println("PASS: read and write capabilities separated");
          }
      }
      ~~~

      **Verification:** test querying a mirror and writing/reading a store without unsupported methods. If runtime role permissions are needed, pass \`ProductReader\` into read-only flows and control DB permissions separately. Removing UnsupportedOperationException improves API design, not immunity to infrastructure errors.
