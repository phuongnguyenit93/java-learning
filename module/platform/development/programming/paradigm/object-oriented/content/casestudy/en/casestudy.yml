      ### Case 6 ? Adding shipping without duplicating if/else

      **Problem:** `if (type == EXPRESS)` is duplicated across pricing, validation, and labels. Provide all three behaviors through a `ShippingPolicy`; callers select a policy through a configured code.

      ~~~java
      import java.util.*;

      public class Case6 {
          interface ShippingPolicy {
              boolean accepts(long weightGrams);
              long fee(long weightGrams);
              String label();
          }
          record Standard() implements ShippingPolicy {
              public boolean accepts(long grams) { return grams > 0 && grams <= 20_000; }
              public long fee(long grams) { return 15_000; }
              public String label() { return "STD"; }
          }
          record Express() implements ShippingPolicy {
              public boolean accepts(long grams) { return grams > 0 && grams <= 5_000; }
              public long fee(long grams) { return 35_000; }
              public String label() { return "EXP"; }
          }
          static final class Shipping {
              private final Map<String,ShippingPolicy> policies;
              Shipping(Map<String,ShippingPolicy> policies) {
                  this.policies = Map.copyOf(policies);
              }
              String dispatch(String type, long grams) {
                  ShippingPolicy p = policies.get(type);
                  if (p == null || !p.accepts(grams))
                      throw new IllegalArgumentException("Unsupported shipment");
                  return p.label() + ":" + p.fee(grams);
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          static void rejects(Runnable r) {
              try { r.run(); } catch (IllegalArgumentException expected) { return; }
              throw new AssertionError("expected rejection");
          }
          public static void main(String[] args) {
              Shipping baseline = new Shipping(Map.of("standard", new Standard()));
              check("STD:15000".equals(baseline.dispatch("standard", 1_000)));
              rejects(() -> baseline.dispatch("unknown", 1_000));

              // Thêm Express bằng registration, không sửa Shipping.dispatch.
              Shipping extended = new Shipping(Map.of(
                  "standard", new Standard(), "express", new Express()));
              check("STD:15000".equals(extended.dispatch("standard", 1_000)));
              check("EXP:35000".equals(extended.dispatch("express", 1_000)));
              rejects(() -> extended.dispatch("express", 6_000));
              System.out.println("PASS: kênh mới không đổi policy cũ");
          }
      }
      ~~~

      **Evidence:** test existing types before/after extension, the new type, and out-of-range inputs. Run `Case6.java`. Rates are **illustrative assumptions**, not actual tariffs. Extension still requires contract tests and registration configuration; it does not imply a fully dynamic plug-in system.
