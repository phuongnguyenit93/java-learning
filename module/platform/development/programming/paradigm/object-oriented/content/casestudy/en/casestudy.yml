    code: |-
      ### Case 6 ? Small ports enable unit tests without real DB/queue/email

      A business service depends on three ports for order storage, event publishing, and notifications. Fakes track order, invocation counts, and failure paths without starting infrastructure.

      ~~~java
      import java.util.*;

      public class Case6 {
          interface OrderStore { void save(String id); }
          interface EventBus { void publish(String id); }
          interface EmailGateway { void send(String id); }
          static final class SubmitOrder {
              private final OrderStore store;
              private final EventBus events;
              private final EmailGateway emails;
              SubmitOrder(OrderStore s, EventBus e, EmailGateway m) {
                  store=s; events=e; emails=m;
              }
              void submit(String id) {
                  if (id == null || id.isBlank())
                      throw new IllegalArgumentException("id");
                  store.save(id);
                  events.publish(id);
                  emails.send(id);
              }
          }
          static void check(boolean b) { if (!b) throw new AssertionError(); }
          public static void main(String[] args) {
              List<String> calls = new ArrayList<>();
              SubmitOrder ok = new SubmitOrder(
                  id -> calls.add("save:" + id),
                  id -> calls.add("event:" + id),
                  id -> calls.add("mail:" + id));
              ok.submit("O1");
              check(calls.equals(List.of("save:O1","event:O1","mail:O1")));
              SubmitOrder failing = new SubmitOrder(
                  id -> calls.add("save:" + id),
                  id -> { throw new IllegalStateException("queue down"); },
                  id -> calls.add("mail:" + id));
              try {
                  failing.submit("O2");
                  throw new AssertionError("missing event failure");
              } catch (IllegalStateException expected) { }
              check(!calls.contains("mail:O2"));
              System.out.println("PASS: dependencies replaced by fakes");
          }
      }
      ~~~

      **Verification:** \`javac Case6.java\`, \`java Case6\`. The code simulates boundaries and verifies injection and failure isolation. This is **not** a transaction guarantee: in production, a successful save followed by queue failure requires an outbox/idempotency strategy and separate integration tests.
  - situation: 'Developers introduce an interface for every concrete class without module boundaries or substitution needs, making execution flow difficult to follow.'
    readmeRelated:
      anchorList:
      - oop-basic-008
      - abstraction-007
      - solid-008
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-008
    resolve: 'Introduce interfaces only at meaningful variability points or boundaries; use simple concrete classes for stable logic and remove pointless wrappers.'
    knowledge: 'YAGNI, speculative abstraction, and design trade-offs.'
    code: |-
      ### Case 7 ? Avoid interfaces for a single stable operation

      **Root problem:** \`FormatterImpl\` is wrapped in interfaces/forwarders with no independent policies. The direct implementation preserves behavior without unnecessary delegates, verified by regression tests for valid and invalid paths.

      ~~~java
      public class Case7 {
          interface FormatPort { String format(String value); }
          static final class FormatterImpl implements FormatPort {
              public String format(String value) {
                  if (value == null || value.isBlank())
                      throw new IllegalArgumentException("value");
                  return "[" + value.trim() + "]";
              }
          }
          static final class LegacyForwarder {
              private final FormatPort port;
              LegacyForwarder(FormatPort port) { this.port=port; }
              String execute(String text) { return port.format(text); }
          }
          static final class Formatter {
              String format(String value) {
                  if (value == null || value.isBlank())
                      throw new IllegalArgumentException("value");
                  return "[" + value.trim() + "]";
              }
          }
          static void check(boolean b) { if (!b) throw new AssertionError(); }
          public static void main(String[] args) {
              LegacyForwarder old = new LegacyForwarder(new FormatterImpl());
              Formatter simple = new Formatter();
              for (String input : new String[]{"hello", "  world "})
                  check(old.execute(input).equals(simple.format(input)));
              try {
                  simple.format(" ");
                  throw new AssertionError("blank accepted");
              } catch (IllegalArgumentException expected) { }
              System.out.println("PASS: no speculative forwarding contract needed");
          }
      }
      ~~~

      **Verification:** tests compare outputs from 2 flows and reject blanks. This does not mean interfaces are always bad: they suit boundaries needing variants, test fakes, or stable plug-in APIs. In real code, remove forwarders individually only after checking authorization, transactions, logging, and regression tests.
  - situation: 'A vaguely named execute abstraction accepts Map String,Object, so implementations interpret keys and failures differently.'
    readmeRelated:
      anchorList:
      - class-005
      - abstraction-003
      - abstraction-004
      - abstraction-008
      - interface-008
      - subtyping-003
      - solid-004
    resolve: 'Replace Map String,Object with typed request/command objects and validation; specify inputs, errors, and side effects for execute.'
    knowledge: 'Type safety, explicit contracts, and schema validation.'
    code: |-
      ### Case 8 ? Replace Map String,Object with a typed command

      **Root problem:** clients send incorrect keys and value types; \`Map<String,Object>\` fails only at runtime during casts. **Fix:** use a command record that validates required fields, lets the compiler check types, and disallows arbitrary keys.

      ~~~java
      import java.util.*;

      public class Case8 {
          static long brokenExecute(Map<String,Object> input) {
              return (Long) input.get("amount"); // Nhầm String / thiếu key.
          }
          record TransferCommand(String destination, long amount) {
              TransferCommand {
                  if (destination == null || destination.isBlank() || amount <= 0)
                      throw new IllegalArgumentException("invalid command");
              }
          }
          static long execute(TransferCommand command) {
              return command.amount();
          }
          static void check(boolean b) { if (!b) throw new AssertionError(); }
          public static void main(String[] args) {
              try {
                  brokenExecute(Map.of("amount", "100"));
                  throw new AssertionError("type mismatch accepted");
              } catch (ClassCastException expected) { }
              try {
                  brokenExecute(Map.of("amunt", 100L));
                  throw new AssertionError("missing key accepted");
              } catch (NullPointerException expected) { }
              check(execute(new TransferCommand("ACC1", 100L)) == 100L);
              try {
                  new TransferCommand("", 100L);
                  throw new AssertionError("invalid destination accepted");
              } catch (IllegalArgumentException expected) { }
              // execute(new TransferCommand("ACC1", "100")); // Không biên dịch.
              System.out.println("PASS: typed command has explicit schema");
          }
      }
      ~~~

      **Verification:** test invalid casts/missing keys and a valid command. External JSON must still be validated/mapped to \`TransferCommand\` in an API adapter; a typed Java API cannot guarantee that network requests are valid. Example keys/amounts are illustrative; no transfer service is called.
  - situation: 'A service contract allows null, but one implementation immediately dereferences it and throws NullPointerException.'
    readmeRelated:
      anchorList:
      - object-008
      - abstraction-004
      - interface-008
      - subtyping-007
      - solid-004
      - language-mechanics-008
      - testing-004
    resolve: 'Use a consistent null policy: deliberately reject null or redefine the contract as non-null, and test every implementation.'
    knowledge: 'Nullability, preconditions, and behavioral subtyping.'
    code: |-
      ### Case 9 ? Consistent null policies across implementations

      The contract for \`Calculator.evaluate(null)\` needs explicit semantics. Choose to **reject null with IllegalArgumentException** rather than letting one implementation return 0 and another throw NullPointerException.

      ~~~java
      public class Case9 {
          interface Calculator { int evaluate(Integer input); }
          static final class A implements Calculator {
              public int evaluate(Integer input) {
                  if (input == null) throw new IllegalArgumentException("input");
                  return input + 1;
              }
          }
          static final class B implements Calculator {
              public int evaluate(Integer input) {
                  if (input == null) throw new IllegalArgumentException("input");
                  return Math.addExact(input, 1);
              }
          }
          static void contract(Calculator c) {
              if (c.evaluate(0) != 1 || c.evaluate(2) != 3)
                  throw new AssertionError("result");
              try {
                  c.evaluate(null);
                  throw new AssertionError("null accepted");
              } catch (IllegalArgumentException expected) { }
          }
          public static void main(String[] args) {
              contract(new A());
              contract(new B());
              System.out.println("PASS: consistent null precondition");
          }
      }
      ~~~

      **Verification:** run the same tests on A/B with normal values and null. Contracts should also define overflow, input ranges, and other errors; this example does not specify the entire integer domain. Choosing \`Optional\` or a non-null signature instead of nullable inputs requires coordinated contract and client changes.
  - situation: 'An API promises immutable results, but one implementation returns a modifiable list while another returns a snapshot.'
    readmeRelated:
      anchorList:
      - class-006
      - encapsulation-006
      - encapsulation-007
      - interface-008
      - solid-004
      - testing-004
    resolve: 'Specify output ownership: always return immutable snapshots or defensive copies, testing list mutation and mutable elements.'
    knowledge: 'Return-value contracts, defensive copies, and LSP.'
    code: |-
      ### Case 10 ? Immutable snapshot contracts must include elements

      **Root problem:** implementation A returns a live Item list while B returns List.copyOf; clients observe different mutation behavior. The common contract returns immutable \`List<ItemView>\`; both implementations copy into immutable records.

      ~~~java
      import java.util.*;

      public class Case10 {
          static final class MutableItem {
              String sku; int count;
              MutableItem(String sku,int count){this.sku=sku;this.count=count;}
          }
          interface ItemReader { List<ItemView> getItems(); }
          record ItemView(String sku,int count) {}
          static final class A implements ItemReader {
              private final List<MutableItem> source;
              A(List<MutableItem> source){this.source=source;}
              public List<ItemView> getItems(){
                  List<ItemView> values=new ArrayList<>();
                  for(MutableItem x:source)
                      values.add(new ItemView(x.sku,x.count));
                  return List.copyOf(values);
              }
          }
          static final class B implements ItemReader {
              private final List<ItemView> values;
              B(List<MutableItem> source){
                  List<ItemView> copy=new ArrayList<>();
                  for(MutableItem x:source)
                      copy.add(new ItemView(x.sku,x.count));
                  values=List.copyOf(copy);
              }
              public List<ItemView> getItems(){return values;}
          }
          static void check(boolean b){if(!b)throw new AssertionError();}
          static void contract(ItemReader reader,MutableItem source){
              List<ItemView> before=reader.getItems();
              check(before.get(0).count()==2);
              try { before.clear(); throw new AssertionError("mutable list"); }
              catch(UnsupportedOperationException expected) {}
              source.count=9;
              check(before.get(0).count()==2); // Snapshot cũ độc lập.
          }
          public static void main(String[] args) {
              MutableItem a=new MutableItem("A",2);
              MutableItem b=new MutableItem("B",2);
              contract(new A(new ArrayList<>(List.of(a))),a);
              contract(new B(new ArrayList<>(List.of(b))),b);
              System.out.println("PASS: both implementations honor snapshot contract");
          }
      }
      ~~~

      **Verification:** test attempts to modify the list and source data after taking a snapshot; both implementations retain snapshot values. A snapshots on each call while B snapshots at construction; the contract must specify **when snapshots are captured** if callers expect current data. Copy nested mutable components as deeply as necessary.
  - situation: 'An abstract class has a template method depending on undocumented hook order, so a new subclass misbehaves despite compiling.'
    readmeRelated:
      anchorList:
      - abstraction-004
      - abstraction-005
      - inheritance-010
      - subtyping-001
      - design-patterns-011
      - testing-009
    resolve: 'Document hook order and pre/post-invariants; freeze mandatory steps or use composition if subclasses need too much customization.'
    knowledge: 'Template Method, subclass contracts, and the fragile base-class problem.'
    code: |-
      ### Case 11 ? Template Method must validate before writing

      **Root problem:** subclasses override hooks freely and persist before validation; required ordering is undocumented. Freeze \`execute\` in the superclass, placing mandatory validation before the \`persist\` hook.

      ~~~java
      import java.util.*;

      public class Case11 {
          static abstract class Workflow {
              final List<String> steps;
              Workflow(List<String> steps){this.steps=steps;}
              public final void execute(String input) {
                  if (input == null || input.isBlank())
                      throw new IllegalArgumentException("input");
                  steps.add("validate");
                  persist(input);
                  steps.add("done");
              }
              protected abstract void persist(String input);
          }
          static final class DbWorkflow extends Workflow {
              DbWorkflow(List<String> steps){super(steps);}
              protected void persist(String input){steps.add("db:"+input);}
          }
          static final class FileWorkflow extends Workflow {
              FileWorkflow(List<String> steps){super(steps);}
              protected void persist(String input){steps.add("file:"+input);}
          }
          static void check(boolean b){if(!b)throw new AssertionError();}
          public static void main(String[] args) {
              List<String> db=new ArrayList<>();
              new DbWorkflow(db).execute("ok");
              check(db.equals(List.of("validate","db:ok","done")));
              List<String> file=new ArrayList<>();
              Workflow flow=new FileWorkflow(file);
              try {
                  flow.execute("");
                  throw new AssertionError("blank accepted");
              } catch(IllegalArgumentException expected) {}
              check(file.isEmpty()); // Ghi chưa xảy ra khi validation lỗi.
              flow.execute("x");
              check(file.equals(List.of("validate","file:x","done")));
              System.out.println("PASS: invariant sequence cannot be overridden");
          }
      }
      ~~~

      **Verification:** test both subclasses; invalid inputs never call \`persist\`, and valid flows always execute validate?persist?done. This is a **method-order invariant**, not a DB transaction guarantee when \`persist\` fails; production needs error handling/rollback. If subclasses need to customize too many steps, prefer composition over Template Method.
- groupID: 5
  groupName: 'Inheritance, Overriding, and Substitutability'
  cases:
  - situation: 'A Vehicle subtype forces Bicycle to expose startEngine even though bicycles have no engines.'
    readmeRelated:
      anchorList:
      - interface-006
      - subtyping-007
      - solid-005
      - design-pitfalls-006
      - practice-004
    resolve: 'Separate EnginePowered from Vehicle; give startEngine only to motorized vehicles instead of forcing Bicycle to fake it.'
    knowledge: 'LSP, ISP, role interfaces, and capability modeling.'
    code: |-
      Declare capabilities separately: Bicycle can move; Car can move and start an engine. Do not make non-motorized objects implement fake startEngine().

      ~~~java
      import java.util.*;
      public class Demo1 {
        interface Vehicle { String move(); }
        interface EnginePowered { String startEngine(); }

        static final class Bicycle implements Vehicle {
          public String move() { return "pedal"; }
        }
        static final class Car implements Vehicle, EnginePowered {
          public String move() { return "drive"; }
          public String startEngine() { return "engine started"; }
        }
        static String beginTrip(EnginePowered powered) {
          return powered.startEngine();
        }
        public static void main(String[] args) {
          Vehicle bicycle = new Bicycle();
          Vehicle car = new Car();
          assert bicycle.move().equals("pedal");
          assert car.move().equals("drive");
          assert beginTrip(new Car()).equals("engine started");
          // beginTrip(new Bicycle()); // compile error: Bicycle không có capability EnginePowered
        }
      }
      ~~~

      Verification: save as Demo1.java; run javac Demo1.java then java -ea Demo1. Uncommenting beginTrip(new Bicycle()) must cause a compile-time type error. Engine-starting clients use EnginePowered; movement-only clients use Vehicle, without fake Bicycle UnsupportedOperationException.
  - situation: 'A SavingsAccount subclass allows negative balances although Account clients assume balances are never negative.'
    readmeRelated:
      anchorList:
      - encapsulation-002
      - encapsulation-009
      - abstraction-004
      - subtyping-007
      - solid-004
      - testing-005
    resolve: 'Preserve Account''s nonnegative-balance invariant in withdraw; use a different contract/type if the business rules genuinely differ.'
    knowledge: 'LSP, postconditions, and invariants.'
    code: |-
      Account clients assume balance >= 0 after every operation. Enforce the invariant in a final base-class withdraw method so SavingsAccount cannot break the postcondition through overriding.

      ~~~java
      public class Demo2 {
        static abstract class Account {
          private long balance;
          Account(long opening) {
            if (opening < 0) throw new IllegalArgumentException("opening");
            balance = opening;
          }
          public final long balance() { return balance; }
          public final void withdraw(long amount) {
            if (amount <= 0 || amount > balance)
              throw new IllegalArgumentException("withdraw exceeds balance");
            balance -= amount;
          }
          public final void deposit(long amount) {
            if (amount <= 0) throw new IllegalArgumentException("deposit");
            balance = Math.addExact(balance, amount);
          }
        }
        static final class SavingsAccount extends Account {
          SavingsAccount(long opening) { super(opening); }
        }
        static void contract(Account account) {
          long before = account.balance();
          try {
            account.withdraw(before + 1);
            throw new AssertionError("must reject overdraft");
          } catch (IllegalArgumentException expected) { }
          assert account.balance() == before;
          if (before > 0) {
            account.withdraw(before);
            assert account.balance() == 0;
          }
        }
        public static void main(String[] args) {
          contract(new SavingsAccount(100));
          assert new SavingsAccount(0).balance() == 0;
        }
      }
      ~~~

      Verification: javac Demo2.java; java -ea Demo2. Shared contract tests check nonnegative balances after a rejected overdraft and a full-balance withdrawal. Overdraft accounts need a distinct contract rather than silently weakening Account invariants.
  - situation: 'Adding superclass validation breaks subclass construction because constructors temporarily pass through intermediate states.'
    readmeRelated:
      anchorList:
      - lifecycle-004
      - lifecycle-009
      - inheritance-006
      - inheritance-010
      - testing-002
      - testing-009
    resolve: 'Do not depend on unfinished subclass state in superclass constructors; validate in a suitable factory/phase and add regression tests.'
    knowledge: 'Initialization order, base-class coupling, and subclass invariants.'
    code: |-
      Superclass constructors should not call overridable methods because subclass fields are not initialized yet. Initialize essential state in constructors and validate complete state in factories.

      ~~~java
      import java.util.*;
      public class Demo3 {
        static abstract class BaseDocument {
          private final String id;
          BaseDocument(String id) {
            this.id = Objects.requireNonNull(id);
            // KHÔNG gọi validate() / render() có thể override tại đây.
          }
          String id() { return id; }
        }
        static final class Invoice extends BaseDocument {
          private final List<String> rows;
          private Invoice(String id, List<String> rows) {
            super(id);
            this.rows = List.copyOf(rows);
          }
          static Invoice create(String id, List<String> rows) {
            Invoice result = new Invoice(id, rows);
            result.validate(); // sau constructor: rows đã được gán
            return result;
          }
          private void validate() {
            if (id().isBlank() || rows.isEmpty())
              throw new IllegalArgumentException("invoice incomplete");
          }
          int rowCount() { return rows.size(); }
        }
        public static void main(String[] args) {
          Invoice invoice = Invoice.create("I1", List.of("item"));
          assert invoice.rowCount() == 1;
          try {
            Invoice.create("I2", List.of());
            throw new AssertionError("expected validation failure");
          } catch (IllegalArgumentException expected) { }
        }
      }
      ~~~

      Verification: javac Demo3.java; java -ea Demo3. Dangerous BaseDocument() calls overridable validate() before Invoice.rows is assigned, risking NullPointerException. Factories return only valid objects; regression-test subtype constructors after base-class upgrades.
  - situation: 'A subclass overrides pricing but silently omits a fee that superclass clients consider mandatory.'
    readmeRelated:
      anchorList:
      - abstraction-004
      - interface-008
      - subtyping-007
      - solid-004
      - testing-005
    resolve: 'Keep the mandatory fee in semantic contracts; shared contract tests must cover every subtype and boundary case.'
    knowledge: 'Behavioral subtyping, postconditions, and contract testing.'
    code: |-
      Mandatory fees form a shared Pricing postcondition. Add the fee in a final template method; subclasses supply subtotals only and cannot omit the fee through an override.

      ~~~java
      public class Demo4 {
        static abstract class Pricing {
          private final long mandatoryFee;
          Pricing(long mandatoryFee) {
            if (mandatoryFee < 0) throw new IllegalArgumentException("fee");
            this.mandatoryFee = mandatoryFee;
          }
          protected abstract long subtotal();
          public final long total() {
            long subtotal = subtotal();
            if (subtotal < 0) throw new IllegalStateException("negative subtotal");
            return Math.addExact(subtotal, mandatoryFee);
          }
          public final long fee() { return mandatoryFee; }
        }
        static final class Standard extends Pricing {
          private final long amount;
          Standard(long amount, long fee) { super(fee); this.amount = amount; }
          protected long subtotal() { return amount; }
        }
        static final class Promotion extends Pricing {
          private final long amount;
          Promotion(long amount, long fee) { super(fee); this.amount = amount; }
          protected long subtotal() { return amount * 9 / 10; }
        }
        static void contract(Pricing quote, long expectedSubtotal) {
          assert quote.total() == Math.addExact(expectedSubtotal, quote.fee());
          assert quote.total() >= quote.fee();
        }
        public static void main(String[] args) {
          contract(new Standard(100, 8), 100);
          contract(new Promotion(100, 8), 90);
          assert new Promotion(100, 8).total() == 98;
        }
      }
      ~~~

      Verification: javac Demo4.java; java -ea Demo4. The same contract tests both subtypes, including discounts. Production money should use integer minor units or BigDecimal with specified rounding; this is not a replacement for real pricing-rule tests.
  - situation: 'A subclass declares an unrelated checked exception in an override, so the method fails to compile.'
    readmeRelated:
      anchorList:
      - inheritance-004
      - subtyping-002
      - language-mechanics-008
    resolve: 'Declare only compatible checked exceptions or their subtypes in an override; translate other errors under the established contract.'
    knowledge: 'Checked-exception override rules and the Java type system.'
    code: |-
      Overrides may declare fewer checked exceptions or subtypes of the superclass exception, not unrelated checked exceptions.

      ~~~java
      import java.io.*;
      public class Demo5 {
        static abstract class Reader {
          abstract String read() throws IOException;
        }
        static final class DiskReader extends Reader {
          @Override String read() throws FileNotFoundException {
            return "found";
          }
        }
        static final class ServiceReader extends Reader {
          @Override String read() throws IOException {
            try {
              return callService();
            } catch (IllegalStateException providerFailure) {
              throw new IOException("cannot read source", providerFailure);
            }
          }
          private String callService() { return "ready"; }
        }
        public static void main(String[] args) throws IOException {
          Reader disk = new DiskReader(), service = new ServiceReader();
          assert disk.read().equals("found");
          assert service.read().equals("ready");
        }
      }
      ~~~

      Verification: javac Demo5.java; java -ea Demo5. Changing DiskReader.read() to throws java.sql.SQLException must fail because SQLException is not a subtype of IOException. Translate external exceptions appropriately; do not hide contract problems behind throws Exception.
  - situation: 'Overloads accepting Object and String can route null unexpectedly or become ambiguous after a new signature is added.'
    readmeRelated:
      anchorList:
      - class-005
      - subtyping-004
      - polymorphism-005
      - language-mechanics-004
    resolve: 'Avoid null-ambiguous overloads; use explicit API names or cast/specify call-site types intentionally.'
    knowledge: 'Compile-time overload resolution and null-overload ambiguity.'
    code: |-
      Java resolves overloads from compile-time argument types, not runtime values or null. Adding unrelated overloads may make null ambiguous.

      ~~~java
      public class Demo6 {
        static String choose(Object o) { return "object"; }
        static String choose(String s) { return "string"; }
        static String fromString(String s) { return "string-api"; }
        static String fromInteger(Integer i) { return "integer-api"; }
        public static void main(String[] args) {
          assert choose(null).equals("string");  // String đặc hiệu hơn Object
          assert choose((Object) null).equals("object");
          assert choose((String) null).equals("string");
          assert fromString(null).equals("string-api");
          assert fromInteger(null).equals("integer-api");
        }
      }
      ~~~

      ~~~java
      // Ambiguous.java — ví dụ cố tình không biên dịch
      class Ambiguous {
        static void run(String s) {}
        static void run(Integer i) {}
        void test() { run(null); } // reference null phù hợp cả hai overload không liên quan
      }
      ~~~

      Verification: javac Demo6.java; java -ea Demo6. Compiling Ambiguous.java separately must report reference to run is ambiguous. Prefer clear API names; for legitimate overloads, use casts or explicitly typed variables at call sites.
  - situation: 'A developer expects subclass static methods to dispatch by runtime object type, but actual results differ.'
    readmeRelated:
      anchorList:
      - class-003
      - subtyping-004
      - polymorphism-006
      - language-mechanics-004
    resolve: 'Distinguish static method hiding from dynamic polymorphism; use virtual instance methods for subtype-specific behavior.'
    knowledge: 'Static-method hiding and runtime dynamic dispatch.'
    code: |-
      Static methods resolve by declared variable/class type at compile time (hiding); overridden instance methods dispatch by runtime object.

      ~~~java
      public class Demo7 {
        static class Base {
          static String kind() { return "base-static"; }
          String render() { return "base-instance"; }
        }
        static final class Child extends Base {
          static String kind() { return "child-static"; }
          @Override String render() { return "child-instance"; }
        }
        public static void main(String[] args) {
          Base ref = new Child();
          assert Base.kind().equals("base-static");
          assert Child.kind().equals("child-static");
          assert ref.kind().equals("base-static"); // hợp lệ nhưng nên tránh gọi static qua instance
          assert ref.render().equals("child-instance");
        }
      }
      ~~~

      Verification: javac Demo7.java; java -ea Demo7. Compare ref.kind() and ref.render() on the same Child instance. Subtype-dependent behavior belongs in overridable instance methods; static utilities should be qualified with class names.
  - situation: 'A subclass declares a field matching the superclass name, so accesses via base/subclass references return different values.'
    readmeRelated:
      anchorList:
      - inheritance-002
      - subtyping-004
      - polymorphism-006
      - polymorphism-007
    resolve: 'Avoid redeclaring the same field in a subtype; use meaningful accessors and one source of state or composition.'
    knowledge: 'Field hiding, lexical resolution, and encapsulation.'
    code: |-
      Field hiding introduces two storage locations chosen by reference type. Show the defect, then retain one private field with a meaningful accessor.

      ~~~java
      public class Demo8 {
        static class OldBase { String code = "BASE"; }
        static final class OldChild extends OldBase { String code = "CHILD"; }

        static class Base {
          private String code = "initial";
          public final String code() { return code; }
          protected final void rename(String newer) { code = newer; }
        }
        static final class Child extends Base {
          void assign(String value) { rename(value); }
        }
        public static void main(String[] args) {
          OldChild oldChild = new OldChild();
          OldBase oldRef = oldChild;
          assert oldRef.code.equals("BASE");
          assert oldChild.code.equals("CHILD"); // bug: hai field cùng tên

          Child child = new Child();
          Base ref = child;
          child.assign("ONE");
          assert ref.code().equals("ONE");
          assert child.code().equals("ONE");
        }
      }
      ~~~

      Verification: javac Demo8.java; java -ea Demo8. The old design produces two values for the same object; the corrected single field/accessor makes Base/Child clients see the same state. Avoid exposing mutable public fields.
  - situation: 'Changing a protected method to private prevents subclasses that previously overrode it from customizing behavior.'
    readmeRelated:
      anchorList:
      - class-004
      - inheritance-005
      - subtyping-002
      - refactoring-009
    resolve: 'Preserve protected extension contracts or introduce an official strategy/hook and tested migration.'
    knowledge: 'Access modifiers, overriding contracts, and API compatibility.'
    code: |-
      Protected hooks are extension contracts; making them private can break plugin/subclass @Override compilation or disable expected dispatch. Keep the hook or migrate to a publicized strategy.

      ~~~java
      public class Demo9 {
        static class Normalizer {
          public final String process(String raw) {
            return "[" + normalize(raw) + "]";
          }
          protected String normalize(String raw) { return raw; }
        }
        static final class TrimNormalizer extends Normalizer {
          @Override protected String normalize(String raw) { return raw.trim(); }
        }
        public static void main(String[] args) {
          Normalizer a = new Normalizer();
          Normalizer b = new TrimNormalizer();
          assert a.process(" x ").equals("[ x ]");
          assert b.process(" x ").equals("[x]");
        }
      }
      ~~~

      Verification: javac Demo9.java; java -ea Demo9. If Normalizer.normalize becomes private, @Override in TrimNormalizer fails; removing the annotation means the base process no longer calls the new method. Test external subclass source/binary compatibility before changing protected APIs.
  - situation: 'A final library class is treated as an extension point, forcing plugins to duplicate its internals because they cannot subclass it.'
    readmeRelated:
      anchorList:
      - interface-005
      - inheritance-007
      - composition-004
      - design-patterns-008
      - practice-004
    resolve: 'Offer interfaces/strategies as extension points rather than inheriting the final class; do not copy its implementation.'
    knowledge: 'Final classes, composition, and plugin extensibility.'
    code: |-
      Final classes can protect internals while allowing extension: plugins implement a public Strategy and are injected at the composition root.

      ~~~java
      import java.util.*;
      public class Demo10 {
        interface TextStrategy { String transform(String input); }
        static final class Engine {
          private final TextStrategy strategy;
          Engine(TextStrategy strategy) { this.strategy = Objects.requireNonNull(strategy); }
          String process(String input) { return strategy.transform(input); }
        }
        static final class UpperPlugin implements TextStrategy {
          public String transform(String input) { return input.toUpperCase(Locale.ROOT); }
        }
        static final class PrefixPlugin implements TextStrategy {
          public String transform(String input) { return "PLUGIN:" + input; }
        }
        public static void main(String[] args) {
          assert new Engine(new UpperPlugin()).process("hello").equals("HELLO");
          assert new Engine(new PrefixPlugin()).process("hello").equals("PLUGIN:hello");
          // class Derived extends Engine {} // không biên dịch: Engine là final
        }
      }
      ~~~

      Verification: javac Demo10.java; java -ea Demo10. Adding a plugin requires implementing TextStrategy, not copying Engine. Runtime-loaded plugins also need discovery/loading, versioning, and lifecycle tests.
  - situation: 'A mutable Square subclass of Rectangle breaks client expectations when setting width also changes height.'
    readmeRelated:
      anchorList:
      - subtyping-008
      - solid-004
      - testing-005
      - practice-004
    resolve: 'Do not subtype mutable Rectangle with Square when setWidth/setHeight contracts break; use common Shape or immutable value models.'
    knowledge: 'LSP, the Rectangle-Square problem, and pre/postconditions.'
    code: |-
      Mutable Rectangle permits independent setWidth/setHeight; Square changing both dimensions when one is set violates Rectangle postconditions. Use a common Shape abstraction with immutable values.

      ~~~java
      public class Demo11 {
        interface Shape { long area(); }
        record Rectangle(long width, long height) implements Shape {
          Rectangle {
            if (width < 0 || height < 0) throw new IllegalArgumentException("dimension");
          }
          public long area() { return Math.multiplyExact(width, height); }
        }
        record Square(long side) implements Shape {
          Square {
            if (side < 0) throw new IllegalArgumentException("dimension");
          }
          public long area() { return Math.multiplyExact(side, side); }
        }
        static long sumAreas(Shape... shapes) {
          long total = 0;
          for (Shape shape : shapes) total = Math.addExact(total, shape.area());
          return total;
        }
        public static void main(String[] args) {
          Rectangle rectangle = new Rectangle(2, 5);
          Square square = new Square(4);
          assert rectangle.area() == 10;
          assert square.area() == 16;
          assert sumAreas(rectangle, square) == 26;
          assert rectangle.width() == 2 && rectangle.height() == 5;
          assert square.side() == 4;
        }
      }
      ~~~

      Verification: javac Demo11.java; java -ea Demo11. No setter silently changes the other dimension. Resizing creates a new Rectangle/Square or uses an operation with its own explicit contract.
  - situation: 'Deep inheritance chains cause changes to a base-class hook to break rendering on unrelated screens.'
    readmeRelated:
      anchorList:
      - inheritance-010
      - subtyping-001
      - composition-008
      - testing-009
      - refactoring-007
    resolve: 'Replace deep hierarchies with composition/delegation, contract-test hooks, and refactor layer by layer with controlled impact.'
    knowledge: 'Fragile base classes, inheritance coupling, and refactoring.'
    code: |-
      Replace RendererBase -> ThemeBase -> ScreenBase with strategies and decorators. Compose screen renderers without coupling them to a distant ancestor's hooks.

      ~~~java
      import java.util.*;
      public class Demo12 {
        interface Renderer { String render(String content); }
        static final class PlainRenderer implements Renderer {
          public String render(String content) { return content; }
        }
        record PrefixRenderer(Renderer delegate, String prefix) implements Renderer {
          public String render(String content) { return prefix + delegate.render(content); }
        }
        record UpperRenderer(Renderer delegate) implements Renderer {
          public String render(String content) {
            return delegate.render(content).toUpperCase(Locale.ROOT);
          }
        }
        record Screen(Renderer renderer) {
          String show(String message) { return renderer.render(message); }
        }
        static void contract(Renderer renderer) {
          assert renderer.render("") != null;
          assert renderer.render("text") != null;
        }
        public static void main(String[] args) {
          Renderer plain = new PlainRenderer();
          Renderer themed = new PrefixRenderer(plain, "Theme:");
          Renderer upper = new UpperRenderer(themed);
          contract(plain); contract(themed); contract(upper);
          assert new Screen(plain).show("hello").equals("hello");
          assert new Screen(themed).show("hello").equals("Theme:hello");
          assert new Screen(upper).show("hello").equals("THEME:HELLO");
        }
      }
      ~~~

      Verification: javac Demo12.java; java -ea Demo12. Theme/Upper changes only affect selected collaborators; Renderer contract tests detect drift. Test real screens before and after using regression/snapshot tests; this example does not test production UI.
- groupID: 6
  groupName: 'Polymorphism, Dispatch, and Behavioral Variants'
  cases:
  - situation: 'Report code repeatedly uses instanceof for employee types, so adding a position requires changes in multiple callers.'
    readmeRelated:
      anchorList:
      - subtyping-006
      - polymorphism-009
      - solid-003
      - design-patterns-008
      - testing-009
      - refactoring-006
    resolve: 'Move variable reporting behavior into employee interfaces or matching strategies, reducing repeated instanceof branches in clients.'
    knowledge: 'Subtype polymorphism, Tell Don''t Ask, and OCP.'
    code: |-
      Each employee type owns its reporting behavior. Callers use an interface; new types require no instanceof/switch branches.

      ~~~java
      import java.util.List;
      public class Case1 {
          interface EmployeeReport { String report(); }
          record Developer(String name) implements EmployeeReport {
              public String report() { return "DEV:" + name; }
          }
          record Designer(String name) implements EmployeeReport {
              public String report() { return "DESIGN:" + name; }
          }
          record Intern(String name) implements EmployeeReport {
              public String report() { return "INTERN:" + name; }
          }
          static String aggregate(List<EmployeeReport> people) {
              return String.join("|", people.stream().map(EmployeeReport::report).toList());
          }
          public static void main(String[] args) {
              var people = List.<EmployeeReport>of(new Developer("An"), new Designer("Binh"));
              if (!aggregate(people).equals("DEV:An|DESIGN:Binh")) throw new AssertionError();
              var expanded = List.<EmployeeReport>of(new Developer("An"), new Designer("Binh"), new Intern("Chi"));
              if (!aggregate(expanded).endsWith("INTERN:Chi")) throw new AssertionError();
          }
      }
      ~~~

      Expected: an Intern can be added without changing the aggregate, with variation handled by the subtype.
  - situation: 'Switches on transaction type codes in controllers, services, and UI make different components interpret the same transaction differently.'
    readmeRelated:
      anchorList:
      - polymorphism-009
      - solid-003
      - design-pitfalls-005
      - refactoring-006
    resolve: 'Centralize type-code mapping and behavior in one layer or polymorphic API; use contract tests to align UI and service behavior.'
    knowledge: 'Dynamic dispatch, type codes, and consistency.'
    code: |-
      Centralize type-code mapping in a shared registry. Controllers, services, and the UI receive the same TxView instead of switching independently in each layer.

      ~~~java
      import java.util.Map;
      public class Case2 {
          enum Kind { CARD, CASH }
          record Transaction(Kind kind, int cents) {}
          record TxView(String label, int payableCents) {}
          interface TxPolicy { TxView apply(Transaction transaction); }
          static final Map<Kind, TxPolicy> POLICIES = Map.of(
              Kind.CARD, t -> new TxView("card", t.cents() + 50),
              Kind.CASH, t -> new TxView("cash", t.cents()));
          static TxView resolve(Transaction t) {
              TxPolicy p = POLICIES.get(t.kind());
              if (p == null) throw new IllegalArgumentException("Unsupported transaction");
              return p.apply(t);
          }
          static TxView controller(Transaction t) { return resolve(t); }
          static TxView service(Transaction t) { return resolve(t); }
          static TxView ui(Transaction t) { return resolve(t); }
          public static void main(String[] args) {
              Transaction card = new Transaction(Kind.CARD, 1000);
              if (!controller(card).equals(service(card))) throw new AssertionError();
              if (!service(card).equals(ui(card))) throw new AssertionError();
              if (ui(card).payableCents() != 1050) throw new AssertionError();
          }
      }
      ~~~

      Expected: all layers share labels and payable amounts under a common policy; regression tests detect disagreements.
  - situation: 'Two tax-calculation variants share an interface but round differently, so the common contract cannot guarantee equivalent results.'
    readmeRelated:
      anchorList:
      - abstraction-004
      - interface-008
      - subtyping-007
      - solid-004
      - testing-004
      - testing-005
    resolve: 'Define rounding as part of the tax contract, including common precision and boundary cases for every implementation.'
    knowledge: 'Semantic contracts, money rounding, and contract tests.'
    code: |-
      Specify BigDecimal, precision, and HALF_UP in the contract and apply them to every tax-calculation variant. Do not round at different stages in different implementations.

      ~~~java
      import java.math.*;
      public class Case3 {
          interface Tax { BigDecimal tax(BigDecimal amount); }
          static BigDecimal rounded(BigDecimal amount, BigDecimal rate) {
              if (amount == null || amount.signum() < 0)
                  throw new IllegalArgumentException("Invalid amount");
              return amount.multiply(rate).setScale(2, RoundingMode.HALF_UP);
          }
          static class DirectTax implements Tax {
              public BigDecimal tax(BigDecimal amount) {
                  return rounded(amount, new BigDecimal("0.10"));
              }
          }
          static class ConfigurableTax implements Tax {
              private final BigDecimal rate;
              ConfigurableTax(BigDecimal rate) { this.rate = rate; }
              public BigDecimal tax(BigDecimal amount) { return rounded(amount, rate); }
          }
          static void contract(Tax implementation) {
              if (!implementation.tax(new BigDecimal("0.45")).equals(new BigDecimal("0.05")))
                  throw new AssertionError("Rounding boundary");
              if (!implementation.tax(new BigDecimal("0.44")).equals(new BigDecimal("0.04")))
                  throw new AssertionError("Rounding mismatch");
          }
          public static void main(String[] args) {
              contract(new DirectTax());
              contract(new ConfigurableTax(new BigDecimal("0.10")));
          }
      }
      ~~~

      Expected: the same 10% policy yields 0.05 and 0.04 at the boundaries regardless of implementation.
  - situation: 'An object is stored in a superclass-typed variable, but clients repeatedly cast to subclasses to call methods outside the common contract.'
    readmeRelated:
      anchorList:
      - interface-001
      - subtyping-004
      - subtyping-006
      - solid-005
      - design-pitfalls-005
    resolve: 'Expose required capabilities through appropriate contracts or role interfaces; cast only at boundaries where subtype information is truly necessary.'
    knowledge: 'Polymorphism, ISP, and type-safe API design.'
    code: |-
      Put exporting capabilities in the role interface that clients actually need, instead of downcasting superclasses to access subtype-specific methods.

      ~~~java
      import java.util.List;
      public class Case4 {
          interface RecordView { String id(); }
          interface Exportable extends RecordView { String export(); }
          record PdfRecord(String id) implements Exportable {
              public String export() { return "PDF:" + id; }
          }
          record CsvRecord(String id) implements Exportable {
              public String export() { return "CSV:" + id; }
          }
          static String exportAll(List<? extends Exportable> records) {
              return String.join("|", records.stream().map(Exportable::export).toList());
          }
          public static void main(String[] args) {
              List<Exportable> records = List.of(new PdfRecord("a"), new CsvRecord("b"));
              if (!"PDF:a|CSV:b".equals(exportAll(records))) throw new AssertionError();
              // Sai: for (RecordView r : records) ((PdfRecord) r).export();
              // Cast trên sẽ thất bại với CsvRecord.
          }
      }
      ~~~

      Expected: the compiler requires Exportable at call boundaries; callers need not inspect every record's subtype.
  - situation: 'Adding a notification channel requires changing the processing flow of existing channels, causing regressions.'
    readmeRelated:
      anchorList:
      - interface-003
      - polymorphism-002
      - solid-003
      - design-patterns-008
      - testing-009
    resolve: 'Separate NotificationSender from orchestration and register a new implementation at the composition root; regression-test unchanged existing channels.'
    knowledge: 'OCP, Strategy, and regression isolation.'
    code: |-
      Orchestration only knows NotificationSender; add PUSH by registering a new implementation at the composition root while preserving EMAIL/SMS behavior.

      ~~~java
      import java.util.*;
      public class Case5 {
          enum Channel { EMAIL, SMS, PUSH }
          interface NotificationSender { String send(String message); }
          record EmailSender() implements NotificationSender {
              public String send(String m) { return "email:" + m; }
          }
          record SmsSender() implements NotificationSender {
              public String send(String m) { return "sms:" + m; }
          }
          record PushSender() implements NotificationSender {
              public String send(String m) { return "push:" + m; }
          }
          static class Dispatcher {
              private final Map<Channel, NotificationSender> routes;
              Dispatcher(Map<Channel, NotificationSender> routes) { this.routes = Map.copyOf(routes); }
              String dispatch(Channel c, String message) {
                  NotificationSender s = routes.get(c);
                  if (s == null) throw new IllegalArgumentException("Unknown channel");
                  return s.send(message);
              }
          }
          public static void main(String[] args) {
              Map<Channel, NotificationSender> initial = Map.of(
                  Channel.EMAIL, new EmailSender(), Channel.SMS, new SmsSender());
              Dispatcher before = new Dispatcher(initial);
              Map<Channel, NotificationSender> expanded = new EnumMap<>(initial);
              expanded.put(Channel.PUSH, new PushSender());
              Dispatcher after = new Dispatcher(expanded);
              for (Channel c : initial.keySet())
                  if (!before.dispatch(c, "hi").equals(after.dispatch(c, "hi")))
                      throw new AssertionError("Existing channel regressed");
              if (!"push:hi".equals(after.dispatch(Channel.PUSH, "hi"))) throw new AssertionError();
          }
      }
      ~~~

      Expected: PUSH needs no Dispatcher changes, and regression assertions preserve both existing channels' results.
  - situation: 'An interface has many implementations but no shared tests, so a new implementation returns incorrect values at boundaries.'
    readmeRelated:
      anchorList:
      - abstraction-004
      - interface-008
      - subtyping-007
      - solid-004
      - testing-004
      - testing-005
    resolve: 'Create a shared contract-test suite for all implementations, including null, empty, errors, rounding, and side effects.'
    knowledge: 'LSP, semantic contracts, and parameterized testing.'
    code: |-
      Run a common contract-test suite for every implementation. Cover null, empty coupons, negative-number failures, rounding, and repeatable results across two calls.

      ~~~java
      import java.math.*;
      import java.util.List;
      public class Case6 {
          interface Quote { BigDecimal total(BigDecimal amount, String coupon); }
          static BigDecimal normalize(BigDecimal amount, String coupon) {
              if (amount == null || amount.signum() < 0)
                  throw new IllegalArgumentException("Invalid amount");
              BigDecimal rate = "SAVE10".equals(coupon) ? new BigDecimal("0.90") : BigDecimal.ONE;
              return amount.multiply(rate).setScale(2, RoundingMode.HALF_UP);
          }
          static class LocalQuote implements Quote {
              public BigDecimal total(BigDecimal a, String c) { return normalize(a, c); }
          }
          static class CachedRulesQuote implements Quote {
              public BigDecimal total(BigDecimal a, String c) { return normalize(a, c); }
          }
          static void contract(Quote quote) {
              BigDecimal input = new BigDecimal("0.05");
              BigDecimal first = quote.total(input, "SAVE10");
              if (!first.equals(new BigDecimal("0.05"))) throw new AssertionError("Rounding");
              if (!first.equals(quote.total(input, "SAVE10"))) throw new AssertionError("Side effect");
              if (!input.equals(new BigDecimal("0.05"))) throw new AssertionError("Input modified");
              if (!quote.total(BigDecimal.ZERO, "").equals(new BigDecimal("0.00")))
                  throw new AssertionError("Empty coupon");
              for (BigDecimal invalid : List.of(new BigDecimal("-1"))) {
                  try {
                      quote.total(invalid, null);
                      throw new AssertionError("Missing validation");
                  } catch (IllegalArgumentException expected) {}
              }
              try {
                  quote.total(null, "SAVE10");
                  throw new AssertionError("Missing null validation");
              } catch (IllegalArgumentException expected) {}
          }
          public static void main(String[] args) {
              contract(new LocalQuote());
              contract(new CachedRulesQuote());
          }
      }
      ~~~

      Expected: every implementation passes the same tests; changes to rounding or unexpected side effects are detected.
  - situation: 'Dozens of subclasses represent combinations of promotions, customer types, and shipping methods, causing exponential class growth.'
    readmeRelated:
      anchorList:
      - inheritance-010
      - composition-004
      - composition-005
      - solid-003
      - design-patterns-008
      - refactoring-007
    resolve: 'Replace combined subclasses with independent promotion/customer/shipping policies composed with checks for valid combinations.'
    knowledge: 'Composition over inheritance, Strategy, and combinatorial explosion.'
    code: |-
      Compose promotion, customer, and shipping through three independent policies. Validate invalid combinations centrally rather than subclassing every permutation.

      ~~~java
      public class Case7 {
          enum Delivery { PHYSICAL, DIGITAL }
          interface Promotion { int apply(int price); }
          interface CustomerPolicy { int apply(int price); }
          interface Shipping { int fee(); }
          static int checkout(int cents, boolean digitalItem, Delivery delivery,
                              Promotion promotion, CustomerPolicy customer, Shipping shipping) {
              if (digitalItem && delivery == Delivery.PHYSICAL)
                  throw new IllegalArgumentException("Digital item cannot ship physically");
              int price = customer.apply(promotion.apply(cents));
              if (price < 0 || shipping.fee() < 0) throw new IllegalArgumentException();
              return price + shipping.fee();
          }
          public static void main(String[] args) {
              Promotion sale = cents -> cents - 100;
              CustomerPolicy vip = cents -> cents * 9 / 10;
              Shipping digital = () -> 0;
              if (checkout(1000, true, Delivery.DIGITAL, sale, vip, digital) != 810)
                  throw new AssertionError();
              try {
                  checkout(1000, true, Delivery.PHYSICAL, sale, vip, digital);
                  throw new AssertionError("Invalid combination was accepted");
              } catch (IllegalArgumentException expected) {}
          }
      }
      ~~~

      Expected: the three policies combine for a price of 810; physical delivery for digital goods is rejected.
  - situation: 'An algorithm that must change at runtime is fixed through inheritance, forcing the whole object to be recreated whenever users switch options.'
    readmeRelated:
      anchorList:
      - composition-005
      - solid-003
      - design-patterns-008
      - refactoring-007
    resolve: 'Move the variable algorithm into a replaceable Strategy collaborator owned at the proper scope, rather than subclassing each runtime choice.'
    knowledge: 'Strategy, runtime delegation, and state ownership.'
    code: |-
      A Strategy is a collaborator that its owner can replace at runtime, not a fixed subclass of the object. The owner remains the same as users switch algorithms.

      ~~~java
      import java.util.Objects;
      public class Case8 {
          interface Pricing { int apply(int cents); }
          static class Checkout {
              private Pricing pricing;
              Checkout(Pricing pricing) { this.pricing = Objects.requireNonNull(pricing); }
              void choose(Pricing next) { pricing = Objects.requireNonNull(next); }
              int total(int cents) { return pricing.apply(cents); }
          }
          public static void main(String[] args) {
              Pricing regular = amount -> amount;
              Pricing sale = amount -> amount * 9 / 10;
              Checkout checkout = new Checkout(regular);
              Checkout sameOwner = checkout;
              if (checkout.total(1000) != 1000) throw new AssertionError();
              checkout.choose(sale);
              if (checkout != sameOwner || checkout.total(1000) != 900)
                  throw new AssertionError("Runtime strategy switch failed");
              checkout.choose(regular);
              if (checkout.total(1000) != 1000) throw new AssertionError();
          }
      }
      ~~~

      Expected: one Checkout successively computes 1000, 900, and 1000 with different Strategies without replacing its owning object.
  - situation: 'Shape drawing logic checks class names as Strings, so renaming a class breaks functionality at runtime.'
