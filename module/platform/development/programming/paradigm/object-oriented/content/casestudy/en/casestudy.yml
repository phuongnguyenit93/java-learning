    code: |-
      ### Case 9 ? Find latency causes with JFR rather than guessing

      Is a request slowed by business CPU work, object allocation, or GC? Source-level object counts cannot establish the cause. Use repeatable workloads and **Flight Recorder** for real evidence; do not fabricate measurements.

      ~~~java
      public class Case9 {
          private static volatile Object keepAlive;
          static long compute(int rounds) {
              long value = 0;
              for (int i = 0; i < rounds; i++) {
                  value += (long)(i % 97) * (i % 31);
              }
              return value;
          }
          static long allocate(int rounds) {
              long count = 0;
              for (int i = 0; i < rounds; i++) {
                  byte[] bytes = new byte[1024];
                  bytes[0] = (byte)i;
                  keepAlive = bytes; // Tạo escape có quan sát được.
                  count += bytes.length;
              }
              return count;
          }
          public static void main(String[] args) {
              if (args.length != 1)
                  throw new IllegalArgumentException("use: cpu|allocation");
              long result = switch (args[0]) {
                  case "cpu" -> compute(2_000_000);
                  case "allocation" -> allocate(2_000_000);
                  default -> throw new IllegalArgumentException(args[0]);
              };
              if (result <= 0) throw new AssertionError("invalid workload");
              System.out.println("workload completed; result=" + result);
          }
      }
      ~~~

      **Reproducible procedure** (JDK 17+):

      ~~~text
      javac Case9.java
      java -XX:StartFlightRecording=filename=cpu.jfr,settings=profile,dumponexit=true Case9 cpu
      java -XX:StartFlightRecording=filename=alloc.jfr,settings=profile,dumponexit=true Case9 allocation
      jfr summary cpu.jfr
      jfr summary alloc.jfr
      jfr print --events jdk.ExecutionSample,jdk.ObjectAllocationSample,jdk.GarbageCollection cpu.jfr
      jfr print --events jdk.ExecutionSample,jdk.ObjectAllocationSample,jdk.GarbageCollection alloc.jfr
      ~~~

      **Assessment:** correlate CPU samples, allocating classes/methods, GC events, and pauses with actual workload traces/latency; repeat with warm-up under the same JDK/heap/OS. This is an **evidence-collection procedure**; JFR has not been run and no CPU or GC bottleneck is asserted. Short runs may yield too few samples; increase run duration and use representative loads. Do not assume results will match production.
