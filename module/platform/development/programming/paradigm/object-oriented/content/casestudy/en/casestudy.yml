    resolve: 'Resolve conflicting defaults with an explicit class override and, where appropriate, InterfaceName.super.method; test the chosen behavior.'
    knowledge: 'Interface default-method precedence and ambiguity.'
    code: |-
      Two defaults with the same signature require the implementing class to resolve the conflict. The combined class explicitly chooses A.super.label().

      ~~~java
      public class Case10 {
          interface Primary {
              default String label() { return "primary"; }
          }
          interface Secondary {
              default String label() { return "secondary"; }
          }
          static class Combined implements Primary, Secondary {
              @Override public String label() {
                  return Primary.super.label() + "+" + Secondary.super.label();
              }
          }
          public static void main(String[] args) {
              Combined c = new Combined();
              if (!"primary+secondary".equals(c.label())) throw new AssertionError();
          }
          // Nếu Combined không override label(), javac báo
          // inherits unrelated defaults for label() from types Primary and Secondary.
      }
      ~~~

      Expected: Combined has deterministic behavior and tests guard the precedence chosen by the developer.
  - situation: 'A game character uses many boolean flags to represent states, allowing meaningless state combinations.'
    readmeRelated:
      anchorList:
      - encapsulation-002
      - encapsulation-009
      - modeling-008
      - design-patterns-009
      - testing-003
    resolve: 'Model valid states with an enum/state machine and guarded transitions rather than independent booleans that permit impossible combinations.'
    knowledge: 'The State pattern, invariants, and state explosion.'
    code: |-
      Use an enum and transition guards instead of booleans isRunning/isJumping/isDead that can all be true simultaneously. Permit valid state transitions only.

      ~~~java
      public class Case11 {
          enum State { IDLE, RUNNING, JUMPING, DEAD }
          static class Player {
              private State state = State.IDLE;
              State state() { return state; }
              void change(State next) {
                  boolean allowed = switch (state) {
                      case IDLE -> next == State.RUNNING || next == State.DEAD;
                      case RUNNING -> next == State.IDLE || next == State.JUMPING || next == State.DEAD;
                      case JUMPING -> next == State.RUNNING || next == State.DEAD;
                      case DEAD -> false;
                  };
                  if (!allowed) throw new IllegalStateException(state + " -> " + next);
                  state = next;
              }
          }
          public static void main(String[] args) {
              Player p = new Player();
              p.change(State.RUNNING);
              p.change(State.JUMPING);
              if (p.state() != State.JUMPING) throw new AssertionError();
              try {
                  p.change(State.IDLE);
                  throw new AssertionError("Illegal transition accepted");
              } catch (IllegalStateException expected) {}
              if (p.state() != State.JUMPING) throw new AssertionError("State mutated on failure");
          }
      }
      ~~~

      Expected: the state machine has one current state and rejects JUMPING -> IDLE.
  - situation: 'Two checkout workflows are merged into an abstract superclass despite sharing no invariants, making subclasses override almost every behavior.'
    readmeRelated:
      anchorList:
      - inheritance-010
      - subtyping-001
      - composition-004
      - composition-008
      - solid-008
      - refactoring-007
      - refactoring-008
    resolve: 'Separate checkout flows using strategy/composition with a genuine shared contract, removing a superclass without stable behavior or invariants.'
    knowledge: 'Inheritance versus composition, fragile base classes, and variation points.'
    code: |-
      Both checkout flows share only a result contract; each maintains its own invariants. A context accepts CheckoutFlow through composition instead of inheriting numerous empty hooks.

      ~~~java
      public class Case12 {
          record Order(int cents, String reference) {}
          interface CheckoutFlow { String pay(Order order); }
          static class CardFlow implements CheckoutFlow {
              public String pay(Order o) {
                  if (o.cents() <= 0) throw new IllegalArgumentException("Invalid amount");
                  return "CARD:" + o.cents();
              }
          }
          static class BankFlow implements CheckoutFlow {
              public String pay(Order o) {
                  if (o.cents() <= 0 || o.reference() == null || o.reference().isBlank())
                      throw new IllegalArgumentException("Invalid bank transfer");
                  return "BANK:" + o.reference();
              }
          }
          record Checkout(CheckoutFlow flow) {
              String execute(Order order) { return flow.pay(order); }
          }
          public static void main(String[] args) {
              if (!"CARD:100".equals(new Checkout(new CardFlow()).execute(new Order(100, null))))
                  throw new AssertionError();
              if (!"BANK:R1".equals(new Checkout(new BankFlow()).execute(new Order(100, "R1"))))
                  throw new AssertionError();
              try {
                  new Checkout(new BankFlow()).execute(new Order(100, null));
                  throw new AssertionError("Missing bank reference was accepted");
              } catch (IllegalArgumentException expected) {}
          }
      }
      ~~~

      Expected: both checkouts expose the same pay API but validate their own invariants without artificial base subclasses.
  - situation: 'Application code extends a library base class solely to reuse a few utility methods, tightly coupling the application to the library lifecycle.'
    readmeRelated:
      anchorList:
      - inheritance-010
      - subtyping-001
      - composition-008
      - solid-008
      - design-pitfalls-004
      - refactoring-007
    resolve: 'Use a collaborator or permitted static utility methods instead of extending the library base; manage library lifecycles inside adapters.'
    knowledge: 'Prefer composition, dependency direction, and API stability.'
    code: |-
      Do not extend a library base class just for utility methods. An adapter owns the library session lifecycle while utilities are accessed through appropriate collaborators.

      ~~~java
      public class Case13 {
          static class LibrarySession implements AutoCloseable {
              private boolean active = true;
              boolean isActive() { return active; }
              String query(String data) {
                  if (!active) throw new IllegalStateException("Session closed");
                  return "lib:" + data;
              }
              @Override public void close() { active = false; }
          }
          static class LibraryUtility {
              String normalize(String input) { return input.trim(); }
          }
          static class LibraryAdapter {
              private final LibraryUtility utility;
              LibraryAdapter(LibraryUtility utility) { this.utility = utility; }
              String execute(LibrarySession session, String input) {
                  return session.query(utility.normalize(input));
              }
          }
          public static void main(String[] args) {
              LibrarySession session = new LibrarySession();
              try (session) {
                  LibraryAdapter adapter = new LibraryAdapter(new LibraryUtility());
                  if (!"lib:abc".equals(adapter.execute(session, " abc ")))
                      throw new AssertionError();
              }
              if (session.isActive()) throw new AssertionError("Session leaked");
          }
      }
      ~~~

      Expected: utilities work and sessions close at the boundary; library-lifecycle changes affect only adapters.
