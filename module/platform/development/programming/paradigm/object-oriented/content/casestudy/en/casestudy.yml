      ### Case 6 ? DateRange validates both dates together

      ~~~java
      import java.time.LocalDate;
      import java.util.Objects;
      public class Case6 {
        record BadRange(LocalDate start,LocalDate end){}
        record DateRange(LocalDate start,LocalDate end){
          DateRange {
            Objects.requireNonNull(start);
            Objects.requireNonNull(end);
            if(end.isBefore(start))throw new IllegalArgumentException();
          }
        }
        static void check(boolean b){if(!b)throw new AssertionError();}
        public static void main(String[] args){
          LocalDate first=LocalDate.of(2026,11,1);
          LocalDate earlier=LocalDate.of(2026,10,30);
          BadRange broken=new BadRange(first,earlier);
          check(broken.end().isBefore(broken.start()));
          try{new DateRange(first,earlier);throw new AssertionError();}
          catch(IllegalArgumentException expected){}
          DateRange ok=new DateRange(earlier,first);
          check(ok.end().isAfter(ok.start()));
          check(new DateRange(first,first).start().equals(first));
          System.out.println("PASS");
        }
      }
      ~~~

      Run javac Case6.java then java Case6. Both dates may be valid individually yet form an impossible range. The policy here is start <= end; if the end must be at least one day later, change the guard and add boundary tests. Every entry point should create a DateRange.
