    resolve: 'Define one not-found policy using Optional or an explicit exception, update both adapters, and run shared contract tests.'
    knowledge: 'Interface semantic contracts, nullability, and LSP.'
    code: |-
      ### Case 2 ? Both repositories must follow the same not-found contract

      **Root problem:** adapter A returns null while adapter B throws when an ID is absent. **Shared rule:** \`find(id)\` returns \`Optional.empty()\` for a valid but missing ID; null/blank input causes an explicit validation error.

      ~~~java
      import java.util.*;

      public class Case2 {
          record Order(String id) {}
          interface OrderLookup { Optional<Order> find(String id); }
          static final class MemoryLookup implements OrderLookup {
              private final Map<String, Order> data = Map.of("O1", new Order("O1"));
              public Optional<Order> find(String id) {
                  if (id == null || id.isBlank())
                      throw new IllegalArgumentException("id");
                  return Optional.ofNullable(data.get(id));
              }
          }
          static final class RemoteLookup implements OrderLookup {
              public Optional<Order> find(String id) {
                  if (id == null || id.isBlank())
                      throw new IllegalArgumentException("id");
                  // Fake remote result: chỉ O1 có dữ liệu.
                  return "O1".equals(id) ? Optional.of(new Order("O1"))
                                          : Optional.empty();
              }
          }
          static void contract(OrderLookup lookup) {
              if (!lookup.find("O1").orElseThrow().id().equals("O1"))
                  throw new AssertionError("found result");
              if (lookup.find("MISSING").isPresent())
                  throw new AssertionError("missing result");
              try {
                  lookup.find(null);
                  throw new AssertionError("null accepted");
              } catch (IllegalArgumentException expected) { }
          }
          public static void main(String[] args) {
              contract(new MemoryLookup());
              contract(new RemoteLookup());
              System.out.println("PASS: identical Optional semantics");
          }
      }
      ~~~

      **Verification:** run \`Case2.java\`; shared contract tests cover found/missing/invalid cases for both implementations. No real HTTP calls occur; production adapters must also distinguish 404, timeouts, and 5xx failures instead of converting every infrastructure error into Optional.empty.
