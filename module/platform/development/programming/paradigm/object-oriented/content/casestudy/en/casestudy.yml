    code: |-
      ### Case 2 ? Removing useless forwarding layers

      **Counterexample:** `Controller -> Provider -> Factory -> Helper -> Converter` forwards the same operation without its own validation, policy, or boundary. Before collapsing it, use characterization tests to show old and new outputs agree, including failures.

      ~~~java
      public class Case2 {
          record Order(String id, long amount) {}
          static final class Helper {
              String render(Order o) {
                  if (o == null || o.id() == null || o.id().isBlank()
                      || o.amount() < 0)
                      throw new IllegalArgumentException("invalid order");
                  return o.id() + ":" + o.amount();
              }
          }
          static final class Factory {
              String render(Order o) { return new Helper().render(o); }
          }
          static final class Provider {
              String render(Order o) { return new Factory().render(o); }
          }
          static final class SimplifiedRenderer {
              String render(Order o) {
                  if (o == null || o.id() == null || o.id().isBlank()
                      || o.amount() < 0)
                      throw new IllegalArgumentException("invalid order");
                  return o.id() + ":" + o.amount();
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          static void rejects(java.util.function.Function<Order,String> fn) {
              try {
                  fn.apply(new Order("", -1));
                  throw new AssertionError("expected validation failure");
              } catch (IllegalArgumentException expected) { }
          }
          public static void main(String[] args) {
              Provider oldFlow = new Provider();
              SimplifiedRenderer newFlow = new SimplifiedRenderer();
              for (Order o : new Order[] {
                      new Order("A", 0), new Order("B", 1_250)
              }) {
                  check(oldFlow.render(o).equals(newFlow.render(o)));
              }
              rejects(oldFlow::render);
              rejects(newFlow::render);
              System.out.println("PASS: hành vi được giữ, bớt hai tầng chuyển tiếp");
          }
      }
      ~~~

      **Verification:** compile/run `Case2.java`; the simplified version needs only a renderer, not intermediaries without responsibilities. Real code also needs side-effect and logging checks; do not remove transaction, authorization, or integration layers merely for adding call depth.
