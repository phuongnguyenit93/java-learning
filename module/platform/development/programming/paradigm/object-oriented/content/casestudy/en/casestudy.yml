  groupName: 'Initialization, Lifecycles, and Object Copies'
  cases:
  - situation: 'A Payment object is initialized with a negative amount, but the error is only detected when it is saved to a database, far from where the invalid data was created.'
    readmeRelated:
      anchorList:
      - lifecycle-002
      - encapsulation-002
      - encapsulation-005
      - class-design-006
      - testing-002
    resolve: 'Validate amounts in a constructor/factory or Money value object before creating Payment; fail immediately at the domain boundary.'
    knowledge: 'Constructor invariants, fail-fast validation, and value objects.'
    code: |-
      ### Case 1 ? Payments cannot have negative amounts

      The faulty version creates Payment and waits for the database to detect a negative amount. The corrected version validates Money and Payment before any persistence operation.

      ~~~java
      public class Case1 {
          record BadPayment(long amount) {}
          record Money(long minorUnits) {
              Money {
                  if (minorUnits <= 0)
                      throw new IllegalArgumentException("Amount must be positive");
              }
          }
          record Payment(String reference, Money money) {
              Payment {
                  if (reference == null || reference.isBlank() || money == null)
                      throw new IllegalArgumentException("Invalid payment");
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          static void reject(Runnable r) {
              try { r.run(); } catch (IllegalArgumentException expected) { return; }
              throw new AssertionError("Expected rejection");
          }
          public static void main(String[] args) {
              BadPayment bad = new BadPayment(-500);
              check(bad.amount() < 0); // Phản ví dụ: dữ liệu sai vẫn được tạo.
              reject(() -> new Money(-500));
              reject(() -> new Money(0));
              reject(() -> new Payment("", new Money(100)));
              Payment valid = new Payment("TX-1", new Money(500));
              check(valid.money().minorUnits() == 500);
              System.out.println("PASS: invalid state rejected at construction");
          }
      }
      ~~~

      Run javac Case1.java then java Case1. Assertions cover negative/0/missing-reference inputs and valid paths. Integer minor units avoid floating-point errors; support for multiple currencies requires currency identifiers and rounding policies beyond this example.
  - situation: 'A constructor takes twelve String parameters, and a developer accidentally passes a phone number where the customer ID belongs.'
    readmeRelated:
      anchorList:
      - lifecycle-003
      - lifecycle-005
      - class-design-006
      - design-patterns-003
      - testing-002
    resolve: 'Replace same-type parameter lists with named value objects or a Builder that validates required fields; expose meaningful factories.'
    knowledge: 'Primitive obsession, type safety, Builder, and object construction.'
    code: |-
      ### Case 2 ? Many String parameters invite position mistakes

      The old constructor takes 12 Strings; passing a phone as customerId still compiles because the parameter types match. The corrected version uses typed value objects, a clearly named factory, and Builder validation for required fields.

      ~~~java
      public class Case2 {
          record LegacyUser(String id, String name, String phone,
                            String city, String district, String street,
                            String zip, String country, String email,
                            String alias, String language, String note) {}
          record CustomerId(String value) {
              CustomerId {
                  if (value == null || !value.startsWith("C-"))
                      throw new IllegalArgumentException("customer id");
              }
          }
          record Phone(String value) {
              Phone {
                  if (value == null || !value.startsWith("09"))
                      throw new IllegalArgumentException("phone");
              }
          }
          record Customer(CustomerId id, Phone phone) {}
          static final class Builder {
              private CustomerId id;
              private Phone phone;
              Builder id(CustomerId value) { id = value; return this; }
              Builder phone(Phone value) { phone = value; return this; }
              Customer build() {
                  if (id == null || phone == null)
                      throw new IllegalStateException("Required fields");
                  return new Customer(id, phone);
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              LegacyUser bad = new LegacyUser("091234", "Lan", "C-42",
                  "HN", "Q1", "Street", "1", "VN", "x@y", "L", "vi", "");
              check(bad.id().startsWith("09")); // Nhầm vị trí nhưng Java chấp nhận.
              try {
                  new Builder().phone(new Phone("091234")).build();
                  throw new AssertionError("missing id accepted");
              } catch (IllegalStateException expected) { }
              Customer ok = new Builder().id(new CustomerId("C-42"))
                                         .phone(new Phone("091234")).build();
              check(ok.id().value().equals("C-42"));
              // new Builder().id(new Phone("091234")); // Không biên dịch.
              System.out.println("PASS: typed fields and required Builder state");
          }
      }
      ~~~

      Run javac Case2.java then java Case2. Distinct types make swapped ID/Phone arguments a compile-time error at the Builder call; missing fields are rejected by build(). Regex and format rules here are illustrative assumptions; real validation must follow domain-specific formats.
  - situation: 'A superclass constructor calls an overridable method, causing its subclass to read uninitialized fields and produce results that depend on construction order.'
    readmeRelated:
      anchorList:
      - lifecycle-004
      - lifecycle-009
      - inheritance-006
      - polymorphism-004
      - testing-002
    resolve: 'Avoid invoking overridable methods in superclass constructors; use private/final initialization and activate subclass behavior after construction.'
    knowledge: 'Java initialization order, dynamic dispatch, and constructor safety.'
    code: |-
      ### Case 3 ? Superclass constructor invokes an overridable method

      In Java, an instance-method call can dispatch to a subclass before its initializer/constructor has completed. The bad version observes null; the safe version uses validated superclass-constructor data and calls subclass behavior only after construction.

      ~~~java
      public class Case3 {
          static class BadBase {
              final String observed;
              BadBase() { observed = token(); }
              String token() { return "base"; }
          }
          static final class BadChild extends BadBase {
              private String childToken = "ready";
              @Override String token() { return childToken; }
          }
          static class GoodBase {
              final String id;
              GoodBase(String id) {
                  if (id == null || id.isBlank())
                      throw new IllegalArgumentException("id");
                  this.id = id;
              }
              final String id() { return id; }
          }
          static final class GoodChild extends GoodBase {
              private final String childToken = "ready";
              GoodChild(String id) { super(id); }
              String tokenAfterConstruction() { return id() + ":" + childToken; }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              BadChild broken = new BadChild();
              check(broken.observed == null);
              check("ready".equals(broken.token())); // Sau constructor mới sẵn sàng.
              GoodChild safe = new GoodChild("A");
              check("A:ready".equals(safe.tokenAfterConstruction()));
              System.out.println("PASS: no virtual dispatch from base constructor");
          }
      }
      ~~~

      Run javac Case3.java then java Case3. The first two assertions show how initialization order causes the bug; the final assertion shows behavior invoked after the object is complete. Do not publish this from a constructor, or the object may escape before it is initialized.
  - situation: 'During object construction, a constructor opens a socket and then throws while reading configuration, leaving the connection unclosed.'
    readmeRelated:
      anchorList:
      - lifecycle-001
      - lifecycle-008
      - composition-007
      - language-mechanics-008
      - testing-002
    resolve: 'Close resources already opened when initialization fails, using try-with-resources or a factory; clearly assign socket ownership.'
    knowledge: 'Exception safety, AutoCloseable, and resource ownership.'
    code: |-
      ### Case 4 ? Constructor opens a socket, then leaks it on failure

      Use a FakeSocket AutoCloseable to observe whether the resource closes. The faulty factory fails to close it when config parsing throws. The corrected factory transfers ownership to Client only after successful creation and closes it on failure.

      ~~~java
      public class Case4 {
          static final class FakeSocket implements AutoCloseable {
              boolean closed;
              @Override public void close() { closed = true; }
          }
          static final class Client implements AutoCloseable {
              private final FakeSocket socket;
              Client(FakeSocket socket) { this.socket = socket; }
              @Override public void close() { socket.close(); }
          }
          static void parse(boolean valid) {
              if (!valid) throw new IllegalArgumentException("Bad config");
          }
          static Client broken(FakeSocket socket, boolean valid) {
              parse(valid); // Nếu lỗi: socket bị bỏ quên!
              return new Client(socket);
          }
          static Client safe(FakeSocket socket, boolean valid) {
              try {
                  parse(valid);
                  return new Client(socket); // Ownership chỉ chuyển khi thành công.
              } catch (RuntimeException ex) {
                  socket.close();
                  throw ex;
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          static void reject(Runnable r) {
              try { r.run(); } catch (IllegalArgumentException expected) { return; }
              throw new AssertionError("Expected bad config");
          }
          public static void main(String[] args) {
              FakeSocket leaked = new FakeSocket();
              reject(() -> broken(leaked, false));
              check(!leaked.closed); // Phản ví dụ: leak được mô phỏng.
              leaked.close(); // Dọn tài nguyên mô phỏng sau kiểm chứng.

              FakeSocket failed = new FakeSocket();
              reject(() -> safe(failed, false));
              check(failed.closed);
              FakeSocket success = new FakeSocket();
              try (Client client = safe(success, true)) {
                  check(!success.closed); // Client còn sở hữu socket.
              }
              check(success.closed); // Đóng khi hết vòng đời Client.
              System.out.println("PASS: failure and success both close owned resources");
          }
      }
      ~~~

      Run javac Case4.java then java Case4. This is a simulated resource, not a real network socket; production Sockets must handle checked IOException and close failures, so prefer try-with-resources when the lifecycle permits.
  - situation: 'A static initializer reads a missing environment variable, causing the entire class to fail when first loaded in production.'
    readmeRelated:
      anchorList:
      - class-003
      - lifecycle-004
    resolve: 'Move configuration validation into an explicit bootstrap stage with clear errors rather than a hard-to-control static initializer; detect missing config early.'
    knowledge: 'Class initialization, fail-fast configuration, and exception handling.'
    code: |-
      ### Case 5 ? Static initializer fails due to missing configuration

      A failing static initializer may first throw ExceptionInInitializerError and leave the class unusable. Replace it with explicit bootstrap configuration loading that reports contextual errors before services start.

      ~~~java
      import java.util.Map;

      public class Case5 {
          static final class UnsafeConfig {
              static final String URL;
              static {
                  String value = System.getProperty("demo.case5.url");
                  if (value == null || value.isBlank())
                      throw new IllegalStateException("missing URL");
                  URL = value;
              }
              static String url() { return URL; }
          }
          record AppConfig(String url) {
              AppConfig {
                  if (url == null || url.isBlank())
                      throw new IllegalArgumentException("app.url missing");
              }
              static AppConfig load(Map<String,String> environment) {
                  return new AppConfig(environment.get("APP_URL"));
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              System.clearProperty("demo.case5.url");
              try {
                  UnsafeConfig.url();
                  throw new AssertionError("static initializer unexpectedly succeeded");
              } catch (ExceptionInInitializerError expected) {
                  check(expected.getCause() instanceof IllegalStateException);
              }
              try {
                  AppConfig.load(Map.of());
                  throw new AssertionError("missing config accepted");
              } catch (IllegalArgumentException expected) {
                  check(expected.getMessage().contains("app.url"));
              }
              AppConfig ok = AppConfig.load(Map.of("APP_URL", "https://example.test"));
              check(ok.url().equals("https://example.test"));
              System.out.println("PASS: explicit bootstrap validation");
          }
      }
      ~~~

      Run javac Case5.java then java Case5. The example URL is never requested. The test deliberately removes a system property **inside the demo JVM**, without changing host environment variables; real products should source secrets securely and control startup failures.
  - situation: 'An object is placed in a cache before initialization finishes, allowing another request to observe fields containing default values.'
    readmeRelated:
      anchorList:
      - class-007
      - object-007
      - lifecycle-009
      - encapsulation-002
      - testing-002
    resolve: 'Publish to the cache only after full validation and initialization; use factories and safe publication between threads.'
    knowledge: 'Safe publication, object invariants, and concurrent visibility.'
    code: |-
      ### Case 6 ? Never cache an object before it is complete

      The counterexample has two steps: insert an object with a null endpoint, then assign its endpoint; a reader between those steps sees incomplete state. The corrected approach validates an immutable Config before publishing it into ConcurrentHashMap.

      ~~~java
      import java.util.concurrent.ConcurrentHashMap;

      public class Case6 {
          static final class BrokenConfig {
              String endpoint; // Mutable và có thể null.
          }
          record Config(String endpoint) {
              Config {
                  if (endpoint == null || endpoint.isBlank())
                      throw new IllegalArgumentException("endpoint");
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              ConcurrentHashMap<String,BrokenConfig> broken = new ConcurrentHashMap<>();
              BrokenConfig incomplete = new BrokenConfig();
              broken.put("api", incomplete);
              check(broken.get("api").endpoint == null); // Đọc giữa hai bước.
              incomplete.endpoint = "https://service.test";

              ConcurrentHashMap<String,Config> safe = new ConcurrentHashMap<>();
              Config ready = new Config("https://service.test");
              safe.put("api", ready); // Publish sau constructor thành công.
              check(safe.get("api").endpoint().equals("https://service.test"));
              try {
                  new Config("");
                  throw new AssertionError("invalid config accepted");
              } catch (IllegalArgumentException expected) { }
              check(safe.size() == 1);
              System.out.println("PASS: cache contains only validated immutable values");
          }
      }
      ~~~

      Run javac Case6.java then java Case6. The counterexample uses a staged interleaving and does not claim to reproduce a real thread race. ConcurrentHashMap offers synchronized publication via put/get but **cannot** fix publishing an incomplete object. Real systems also need concurrent tests and checks for nested mutable fields.
  - situation: 'Two overloaded constructors accept multiple nullable parameters, so passing null selects the wrong signature or fails compilation due to ambiguity.'
    readmeRelated:
      anchorList:
      - class-005
      - lifecycle-003
      - polymorphism-005
      - language-mechanics-004
    resolve: 'Replace ambiguous null-friendly overloads with clearly named factories or type-specific value objects; avoid signatures that are easy to confuse.'
    knowledge: 'Overload resolution, null ambiguity, and type-safe API design.'
    code: |-
      ### Case 7 ? Ambiguous constructor overloads and null

      Consider Legacy(String,String) and Legacy(String,Integer): an uncast null argument makes constructor selection ambiguous. The failing call stays commented out so the example compiles; the corrected design uses named factories for the different meanings.

      ~~~java
      public class Case7 {
          static final class Legacy {
              final String mode;
              Legacy(String id, String label) { mode = "label"; }
              Legacy(String id, Integer rank) { mode = "rank"; }
          }
          record Customer(String id, String label, Integer rank) {}
          static final class Customers {
              static Customer withLabel(String id, String label) {
                  return new Customer(id, label, null);
              }
              static Customer withRank(String id, Integer rank) {
                  return new Customer(id, null, rank);
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              // new Legacy("C-1", null); // Compile error: ambiguous constructors.
              Legacy label = new Legacy("C-1", (String)null);
              Legacy rank = new Legacy("C-1", (Integer)null);
              check(label.mode.equals("label") && rank.mode.equals("rank"));
              Customer a = Customers.withLabel("C-1", null);
              Customer b = Customers.withRank("C-1", null);
              check(a.rank() == null && b.label() == null);
              System.out.println("PASS: named factories remove constructor ambiguity");
          }
      }
      ~~~

      Run javac Case7.java then java Case7. The example demonstrates compile-time rules through signatures/comments and two casted calls. To observe the actual compiler error, uncomment new Legacy and compile again; expect an ambiguous reference error. Clear factory names do not replace null validation where the domain requires non-null values.
  - situation: 'A Builder creates transfer requests without a destination account, and the error is only discovered after calling the bank.'
    readmeRelated:
      anchorList:
      - lifecycle-002
      - lifecycle-005
      - encapsulation-002
      - encapsulation-005
      - design-patterns-003
      - testing-002
    resolve: 'Require destination and amount at build time, yielding a valid immutable object; test missing fields.'
    knowledge: 'Builder validation, required fields, and constructor invariants.'
    code: |-
      ### Case 8 ? Builder must not create an incomplete TransferRequest

      The old Builder returns requests missing a destination or amount. The corrected one validates all required fields before build, and the output record also enforces invariants to prevent invalid direct construction.

      ~~~java
      public class Case8 {
          record BadRequest(String destination, long amount) {}
          record TransferRequest(String destination, long amount) {
              TransferRequest {
                  if (destination == null || destination.isBlank() || amount <= 0)
                      throw new IllegalArgumentException("Invalid transfer");
              }
          }
          static final class Builder {
              private String destination;
              private long amount;
              Builder destination(String value) { destination = value; return this; }
              Builder amount(long value) { amount = value; return this; }
              TransferRequest build() {
                  if (destination == null || destination.isBlank() || amount <= 0)
                      throw new IllegalStateException("Missing transfer fields");
                  return new TransferRequest(destination, amount);
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          static void reject(Runnable r) {
              try { r.run(); } catch (IllegalStateException expected) { return; }
              throw new AssertionError("Expected builder failure");
          }
          public static void main(String[] args) {
              BadRequest bad = new BadRequest(null, 0);
              check(bad.destination() == null && bad.amount() == 0);
              reject(() -> new Builder().amount(100).build());
              reject(() -> new Builder().destination("ACC-1").build());
              TransferRequest ok = new Builder().destination("ACC-1")
                          .amount(100).build();
              check(ok.destination().equals("ACC-1") && ok.amount() == 100);
              try {
                  new TransferRequest(null, -1);
                  throw new AssertionError("Invalid direct construction succeeded");
              } catch (IllegalArgumentException expected) { }
              System.out.println("PASS: missing data rejected before external call");
          }
      }
      ~~~

      Run javac Case8.java then java Case8. This checks input validity only; no money is transferred. Bank integration additionally needs idempotency keys, currency, authorization, and gateway-failure handling.
  - situation: 'A static factory returns a shared mutable object, causing two users to affect one another unintentionally.'
    readmeRelated:
      anchorList:
      - class-003
      - object-003
      - object-005
      - object-007
      - lifecycle-005
      - design-pitfalls-008
    resolve: 'Return immutable objects or separately owned instances; shared mutable state requires synchronization and a clear lifetime contract.'
    knowledge: 'Aliasing, shared mutable state, scope, and thread safety.'
    code: |-
      ### Case 9 ? Static factory shares mutable settings between users

      The old factory returns shared mutable settings, so user B's modifications change what user A observes. Prefer separate immutable snapshots, or explicitly manage scope and synchronization when sharing is truly necessary.

      ~~~java
      public class Case9 {
          static final class MutableSettings {
              String theme = "light";
          }
          static final class BadFactory {
              private static final MutableSettings SINGLETON = new MutableSettings();
              static MutableSettings settings() { return SINGLETON; }
          }
          record Settings(String theme) {
              Settings {
                  if (theme == null || theme.isBlank())
                      throw new IllegalArgumentException("theme");
              }
          }
          static final class GoodFactory {
              static Settings forUser(String requestedTheme) {
                  return new Settings(requestedTheme);
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              MutableSettings userA = BadFactory.settings();
              MutableSettings userB = BadFactory.settings();
              userA.theme = "dark";
              userB.theme = "orange";
              check(userA == userB && userA.theme.equals("orange")); // Leak.

              Settings a = GoodFactory.forUser("dark");
              Settings b = GoodFactory.forUser("orange");
              check(a.theme().equals("dark"));
              check(b.theme().equals("orange"));
              check(a != b);
              System.out.println("PASS: immutable per-user settings independent");
          }
      }
      ~~~

      Run javac Case9.java then java Case9. The test simulates two users sequentially, so it does not establish a race; the data leak alone demonstrates missing scope in shared-state design. Production settings must be tied to authenticated principals, not a global currentUser.
  - situation: 'An object has a final field pointing to a product list, but callers still change its elements after the object is created.'
    readmeRelated:
      anchorList:
      - class-006
      - object-005
      - object-006
      - encapsulation-007
      - testing-002
    resolve: 'Defensively copy both the list and its mutable elements; expose immutable snapshots/DTOs rather than retaining caller aliases.'
    knowledge: 'Shallow versus deep immutability, final references, and defensive copying.'
    code: |-
      ### Case 10 ? A final List is not deeply immutable

      final only prevents reference reassignment. Even List.copyOf does not clone mutable elements. A safe snapshot converts each mutable Product to a ProductView with immutable fields.

      ~~~java
      import java.util.*;

      public class Case10 {
          static final class Product {
              final String sku;
              long price;
              Product(String sku, long price) { this.sku = sku; this.price = price; }
          }
          static final class BadCatalog {
              final List<Product> products;
              BadCatalog(List<Product> src) { products = List.copyOf(src); }
          }
          record ProductView(String sku, long price) {}
          static final class Catalog {
              private final List<ProductView> products;
              Catalog(List<Product> src) {
                  List<ProductView> copied = new ArrayList<>();
                  for (Product p : src) copied.add(new ProductView(p.sku, p.price));
                  products = List.copyOf(copied);
              }
              List<ProductView> products() { return products; }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              Product item = new Product("SKU-1", 100);
              List<Product> source = new ArrayList<>(List.of(item));
              BadCatalog bad = new BadCatalog(source);
              Catalog safe = new Catalog(source);
              item.price = 999;
              source.clear();
              check(bad.products.get(0).price == 999); // Alias bị lộ.
              check(safe.products().get(0).price() == 100);
              check(safe.products().size() == 1);
              try {
                  safe.products().clear();
                  throw new AssertionError("mutable snapshot");
              } catch (UnsupportedOperationException expected) { }
              System.out.println("PASS: copied list and immutable elements");
          }
      }
      ~~~

      Run javac Case10.java then java Case10. With ProductView holding only String and long, the new copy is independent; mutable child objects would require corresponding deep copies. List.copyOf protects only the list structure.
  - situation: 'A session object survives multiple requests, so old access permissions remain available after a user logs out.'
    readmeRelated:
      anchorList:
      - lifecycle-006
      - design-pitfalls-008
    resolve: 'Tie sessions to appropriate lifecycles and expiration; revoke them on logout and avoid caching/reusing principals whose permissions expired.'
    knowledge: 'Object scope, session lifecycles, invalidation, and access control.'
    code: |-
      ### Case 11 ? Sessions become invalid after logout

      The bug occurs when clients retain an old Principal and still trust it after logout. The corrected service verifies tokens with SessionStore on **every protected operation**, checking revocation and expiration instead of trusting cached session objects.

      ~~~java
      import java.time.*;
      import java.util.*;

      public class Case11 {
          record CachedPrincipal(String userId) {}
          static final class Sessions {
              static final class State {
                  final String userId;
                  final Instant expiresAt;
                  boolean revoked;
                  State(String userId, Instant expiresAt) {
                      this.userId = userId; this.expiresAt = expiresAt;
                  }
              }
              private final Map<String,State> sessions = new HashMap<>();
              void create(String token, String user, Instant expiry) {
                  sessions.put(token, new State(user, expiry));
              }
              String authorize(String token, Instant now) {
                  State s = sessions.get(token);
                  if (s == null || s.revoked || !now.isBefore(s.expiresAt))
                      throw new SecurityException("Session expired or revoked");
                  return s.userId;
              }
              void logout(String token) {
                  State s = sessions.get(token);
                  if (s != null) s.revoked = true;
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          static void deny(Runnable action) {
              try { action.run(); } catch (SecurityException expected) { return; }
              throw new AssertionError("Expected access denied");
          }
          public static void main(String[] args) {
              Instant now = Instant.parse("2026-10-28T00:00:00Z");
              CachedPrincipal cached = new CachedPrincipal("alice");
              Sessions service = new Sessions();
              service.create("demo-token", "alice", now.plusSeconds(60));
              check(service.authorize("demo-token", now).equals("alice"));
              service.logout("demo-token");
              check(cached.userId().equals("alice")); // Stale principal còn tồn tại.
              deny(() -> service.authorize("demo-token", now));
              service.create("token-2", "alice", now.plusSeconds(60));
              deny(() -> service.authorize("token-2", now.plusSeconds(61)));
              System.out.println("PASS: revoked and expired sessions rejected");
          }
      }
      ~~~

      Run javac Case11.java then java Case11. Fake tokens and a fixed Instant are used; this single-threaded example is not a distributed session store. Production needs secure random tokens, consistent cross-node session revocation, synchronization, and replay protection. A cached principal is not proof of authorization.
  - situation: 'A cache key has a hashCode derived from a field that changes over time, so the same object cannot be retrieved later.'
    readmeRelated:
      anchorList:
      - object-004
      - object-005
      - language-mechanics-006
      - design-pitfalls-009
      - testing-001
    resolve: 'Do not include mutable fields in cached-key hashes; use immutable ID/value keys or deliberately remove the old key and insert a new one.'
    knowledge: 'equals/hashCode, hashed collections, and mutable-key hazards.'
    code: |-
      ### Case 12 ? HashMap key changes a field used in hashCode

      After put, changing a mutable key's id changes its hash, so even lookup with that object may search the wrong bucket. Use an immutable CacheKey; if the business key changes, deliberately remove the old key before inserting the new one.

      ~~~java
      import java.util.*;

      public class Case12 {
          static final class MutableKey {
              String id;
              MutableKey(String id) { this.id = id; }
              @Override public int hashCode() { return id.hashCode(); }
              @Override public boolean equals(Object x) {
                  return x instanceof MutableKey k && id.equals(k.id);
              }
          }
          record CacheKey(String id) {
              CacheKey {
                  if (id == null || id.isBlank())
                      throw new IllegalArgumentException("id");
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              Map<MutableKey,String> broken = new HashMap<>();
              MutableKey key = new MutableKey("A");
              broken.put(key, "entry");
              key.id = "B";
              check(broken.get(key) == null); // Hash bucket khác.
              check(broken.size() == 1); // Entry không tự biến mất.

              Map<CacheKey,String> safe = new HashMap<>();
              CacheKey oldKey = new CacheKey("A");
              safe.put(oldKey, "entry");
              check("entry".equals(safe.get(new CacheKey("A"))));
              String value = safe.remove(oldKey);
              safe.put(new CacheKey("B"), value);
              check(!safe.containsKey(oldKey));
              check("entry".equals(safe.get(new CacheKey("B"))));
              System.out.println("PASS: immutable hash key and deliberate remap");
          }
      }
      ~~~

      Run javac Case12.java then java Case12. "A" and "B" intentionally produce different hash buckets in the default small table; the bug violates the requirement that hashed-collection keys remain hash-stable while stored. Concurrent caches need suitable consistency/atomicity for the remove/put pair.
