      ### Case 14 ? One PricePolicy replaces scattered formulas

      ~~~java
      public class Case14 {
        record Line(long unitPrice,int qty,long discount){}
        record Quote(long subtotal,long total){}
        static class PricePolicy {
          Quote quote(Line l){
            if(l.unitPrice()<0||l.qty()<1||l.discount()<0)
              throw new IllegalArgumentException();
            long subtotal=Math.multiplyExact(l.unitPrice(),l.qty());
            if(l.discount()>subtotal)throw new IllegalArgumentException();
            return new Quote(subtotal,subtotal-l.discount());
          }
        }
        static class Checkout {
          final PricePolicy price;
          Checkout(PricePolicy p){price=p;}
          long charge(Line l){return price.quote(l).total();}
        }
        static class Report {
          final PricePolicy price;
          Report(PricePolicy p){price=p;}
          long total(Line l){return price.quote(l).total();}
        }
        static void check(boolean b){if(!b)throw new AssertionError();}
        public static void main(String[] args){
          Line line=new Line(1000,2,250);
          long oldReport=line.unitPrice()*line.qty();
          PricePolicy policy=new PricePolicy();
          long checkout=new Checkout(policy).charge(line);
          long report=new Report(policy).total(line);
          check(oldReport!=checkout);
          check(checkout==1750&&checkout==report);
          try{policy.quote(new Line(100,1,200));throw new AssertionError();}
          catch(IllegalArgumentException expected){}
          System.out.println("PASS");
        }
      }
      ~~~

      Run javac Case14.java then java Case14. Checkout and reporting share one rule, and tests expose incorrect old discount calculations. Real systems must version prices for historical invoices, handle currency/rounding, and authorize policy changes.
