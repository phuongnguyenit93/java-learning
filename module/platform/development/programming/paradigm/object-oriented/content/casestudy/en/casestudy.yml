    code: |-
      ### Case 5 ? Separating reporting, repositories, and email

      **Incorrect boundary:** a `ReportGodClass` contains SQL, CSV formatting, and SMTP. **Correct:** a report renderer is pure, the repository only retrieves data, and an email adapter is injected; the use case orchestrates them and each responsibility can be tested independently.

      ~~~java
      import java.util.*;

      public class Case5 {
          record Sale(String id, long cents) {}
          interface SalesRepository { List<Sale> findAll(); }
          interface EmailGateway { void send(String content); }
          static final class ReportFormatter {
              String format(List<Sale> sales) {
                  StringBuilder out = new StringBuilder("id,cents\n");
                  for (Sale s : sales) out.append(s.id()).append(',')
                                          .append(s.cents()).append('\n');
                  return out.toString();
              }
          }
          static final class SendReport {
              private final SalesRepository repository;
              private final EmailGateway email;
              private final ReportFormatter formatter;
              SendReport(SalesRepository r, EmailGateway e, ReportFormatter f) {
                  repository = r; email = e; formatter = f;
              }
              void execute() { email.send(formatter.format(repository.findAll())); }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              List<String> mailbox = new ArrayList<>();
              SalesRepository fakeRepo = () -> List.of(new Sale("S1", 900));
              ReportFormatter formatter = new ReportFormatter();
              new SendReport(fakeRepo, mailbox::add, formatter).execute();
              check(mailbox.equals(List.of("id,cents\nS1,900\n")));

              EmailGateway failing = ignored -> {
                  throw new IllegalStateException("SMTP unavailable");
              };
              try {
                  new SendReport(fakeRepo, failing, formatter).execute();
                  throw new AssertionError("Expected transport failure");
              } catch (IllegalStateException expected) {
                  check("SMTP unavailable".equals(expected.getMessage()));
              }
              check("id,cents\nS1,900\n".equals(formatter.format(fakeRepo.findAll())));
              System.out.println("PASS: formatter không phụ thuộc mail");
          }
      }
      ~~~

      **Evidence:** tests cover successful and failed email delivery and formatter independence. Run `Case5.java`. Production CSV must escape commas and quotes; the example only uses simple IDs. Responsibility separation does **not** automatically provide retries or exactly-once delivery; use cases must specify error handling.
