    resolve: 'Deep-copy separately owned line items or make them immutable; document copy contracts and test changes to the copy without affecting the original.'
    knowledge: 'Copy constructors, clone semantics, and graph aliasing.'
    code: |-
      ### Case 13 ? Cloning a List does not clone its items

      Using only new ArrayList<>(items) in a clone gives the orders separate lists but shared item references. A correct copy constructor creates a new Item for each mutable item, producing an independent copy.

      ~~~java
      import java.util.*;

      public class Case13 {
          static final class Item {
              final String sku;
              int quantity;
              Item(String sku, int quantity) {
                  this.sku = sku; this.quantity = quantity;
              }
              Item copy() { return new Item(sku, quantity); }
          }
          static final class Order {
              final List<Item> items;
              Order(List<Item> items) { this.items = items; }
              Order shallowCopy() { return new Order(new ArrayList<>(items)); }
              Order deepCopy() {
                  List<Item> copied = new ArrayList<>();
                  for (Item i : items) copied.add(i.copy());
                  return new Order(copied);
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              Order original = new Order(new ArrayList<>(List.of(new Item("A", 1))));
              Order shallow = original.shallowCopy();
              Order deep = original.deepCopy();
              check(original.items != shallow.items); // List khác.
              check(original.items.get(0) == shallow.items.get(0)); // Item chung.
              shallow.items.get(0).quantity = 5;
              check(original.items.get(0).quantity == 5); // Bị ảnh hưởng.
              check(deep.items.get(0).quantity == 1); // Bản copy sâu giữ nguyên.
              deep.items.get(0).quantity = 9;
              check(original.items.get(0).quantity == 5);
              System.out.println("PASS: graph-owned items independently copied");
          }
      }
      ~~~

      Run javac Case13.java then java Case13. This example uses an explicit copy method rather than Object.clone to make copy depth clear. Object graphs with cycles, shared identities, or resource handles need their own copy policies; do not assume the entire graph should be cloned.
