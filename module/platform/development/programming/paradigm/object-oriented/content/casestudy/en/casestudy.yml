      ### Case 7 ? Avoiding one object for domain, database, REST, and UI

      **Coupling problem:** a storage or display change also affects entities and JSON contracts. Each layer has its own boundary here; mapping lets representation evolve while preserving domain invariants.

      ~~~java
      public class Case7 {
          enum Status { NEW, PAID }
          static final class Payment {
              private final String id;
              private Status status = Status.NEW;
              Payment(String id) {
                  if (id == null || id.isBlank())
                      throw new IllegalArgumentException("id");
                  this.id = id;
              }
              void confirm() { status = Status.PAID; }
              String id() { return id; }
              Status status() { return status; }
          }
          record PaymentRow(String paymentId, String dbStatus) {}
          record PaymentResponse(String id, boolean completed) {}
          record PaymentView(String title) {}

          static PaymentRow toRow(Payment p) {
              return new PaymentRow(p.id(), p.status().name());
          }
          static PaymentResponse toResponse(Payment p) {
              return new PaymentResponse(p.id(), p.status() == Status.PAID);
          }
          static PaymentView toView(PaymentResponse dto) {
              return new PaymentView(dto.completed() ? "Đã thanh toán" : "Đang chờ");
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              Payment p = new Payment("P-3");
              check(!toResponse(p).completed());
              p.confirm();
              check(toRow(p).dbStatus().equals("PAID"));
              check(toResponse(p).completed());
              check(toView(toResponse(p)).title().equals("Đã thanh toán"));
              check(p.status() == Status.PAID);
              System.out.println("PASS: domain khác biểu diễn lưu trữ/API/UI");
          }
      }
      ~~~

      **Verification:** compile/run `Case7.java`; to demonstrate isolation, change only `toView` to alter display text and preserve assertions about `Payment.status`, `PaymentRow`, and `PaymentResponse`. This is a boundary example, not an ORM/HTTP serialization test; real projects also need mapping and schema tests.
  - situation: 'Employee records with identical names and birth dates are considered one object although they represent different employees.'
