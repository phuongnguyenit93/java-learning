    code: |-
      ### Case 9 ? Publishing immutable state through AtomicReference

      ~~~java
      import java.util.concurrent.atomic.AtomicReference;
      public class Case9 {
        static class Bad {
          volatile int subtotal=100,discount=0;
          void firstStep(){discount=20;}
          void secondStep(){subtotal=120;}
        }
        record State(int subtotal,int discount){
          State {
            if(subtotal<0||discount<0||discount>subtotal)
              throw new IllegalArgumentException();
          }
          int total(){return subtotal-discount;}
        }
        static class Invoice {
          final AtomicReference<State> state=
              new AtomicReference<>(new State(100,0));
          State snapshot(){return state.get();}
          void update(int subtotal,int discount){
            state.set(new State(subtotal,discount));
          }
        }
        static void check(boolean b){if(!b)throw new AssertionError();}
        public static void main(String[] args){
          Bad bad=new Bad();bad.firstStep();
          check(bad.subtotal==100&&bad.discount==20);
          Invoice good=new Invoice();
          State before=good.snapshot();
          good.update(120,20);
          State after=good.snapshot();
          check(before.total()==100&&after.total()==100);
          check(after.subtotal()==120&&after.discount()==20);
          try{good.update(10,20);throw new AssertionError();}
          catch(IllegalArgumentException expected){}
          check(good.snapshot()==after);
          System.out.println("PASS");
        }
      }
      ~~~

      Run javac Case9.java then java Case9. The test simulates update ordering, not real-thread stress. The state is a consistent snapshot; concurrent updates depending on current state require compareAndSet/updateAndGet, not arbitrary get followed by set.
