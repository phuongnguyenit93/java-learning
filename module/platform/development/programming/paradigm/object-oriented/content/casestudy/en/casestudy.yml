  - situation: 'A public order-status setter lets a mobile app move an order directly from CREATED to DELIVERED without payment.'
    readmeRelated:
      anchorList:
      - encapsulation-003
      - encapsulation-008
      - encapsulation-009
      - modeling-008
      - design-patterns-009
      - testing-003
      - practice-002
    resolve: 'Hide the status setter; expose only guarded transition methods that verify payment, and test forbidden state changes.'
    knowledge: 'Encapsulation, state machines, domain commands, and invariants.'
    code: |-
      ### Case 1 ? Guarding order state transitions

      ~~~java
      public class Case1 {
        enum Status { CREATED, PAID, DELIVERED }
        static class BadOrder { Status status=Status.CREATED; }
        static class Order {
          private Status status=Status.CREATED;
          Status state(){return status;}
          void pay(boolean confirmed){
            if(status!=Status.CREATED || !confirmed)throw new IllegalStateException();
            status=Status.PAID;
          }
          void deliver(){
            if(status!=Status.PAID)throw new IllegalStateException();
            status=Status.DELIVERED;
          }
        }
        static void check(boolean b){if(!b)throw new AssertionError();}
        static void fails(Runnable r){
          try{r.run();throw new AssertionError("expected failure");}
          catch(IllegalStateException expected){}
        }
        public static void main(String[] args){
          BadOrder bad=new BadOrder();bad.status=Status.DELIVERED;
          check(bad.status==Status.DELIVERED);
          Order good=new Order();
          fails(good::deliver);fails(()->good.pay(false));
          check(good.state()==Status.CREATED);
          good.pay(true);good.deliver();
          check(good.state()==Status.DELIVERED);
          fails(good::deliver);
          System.out.println("PASS");
        }
      }
      ~~~

      Compile/run Case1.java with Java 17. The bad path allows CREATED?DELIVERED; the correct one rejects delivery before payment and permits CREATED?PAID?DELIVERED. The confirmed flag is assumed to come from a trusted verification service, not arbitrary client input.
