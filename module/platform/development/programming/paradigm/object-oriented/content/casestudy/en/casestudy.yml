      Expose Shape.draw() and dispatch dynamically according to runtime type. Avoid comparing getClass().getSimpleName(), so class renames do not break behavior.

      ~~~java
      import java.util.List;
      public class Case9 {
          interface Shape { String draw(); }
          record Circle(int radius) implements Shape {
              public String draw() { return "circle:" + radius; }
          }
          record Square(int side) implements Shape {
              public String draw() { return "square:" + side; }
          }
          static String render(List<? extends Shape> shapes) {
              return String.join("|", shapes.stream().map(Shape::draw).toList());
          }
          public static void main(String[] args) {
              String output = render(List.of(new Circle(3), new Square(2)));
              if (!"circle:3|square:2".equals(output)) throw new AssertionError();
              // Tránh: if (shape.getClass().getSimpleName().equals("Circle")) ...
