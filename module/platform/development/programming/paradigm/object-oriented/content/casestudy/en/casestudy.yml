    code: |-
      ### Case 8 ? Employee identity is not name plus date of birth

      Employees with the same names and birth dates are distinct **entities** if their `employeeId` values differ. For stable-ID entities, implement `equals` and `hashCode` using IDs, not attributes that may match or change.

      ~~~java
      import java.time.LocalDate;
      import java.util.*;

      public class Case8 {
          static final class Employee {
              final String employeeId;
              final String fullName;
              final LocalDate birthDate;
              Employee(String id, String name, LocalDate birth) {
                  if (id == null || id.isBlank())
                      throw new IllegalArgumentException("id");
                  employeeId = id;
                  fullName = Objects.requireNonNull(name);
                  birthDate = Objects.requireNonNull(birth);
              }
              @Override public boolean equals(Object other) {
                  return this == other || (other instanceof Employee e
                           && employeeId.equals(e.employeeId));
              }
              @Override public int hashCode() { return employeeId.hashCode(); }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              LocalDate d = LocalDate.of(1995, 1, 1);
              Employee a = new Employee("E-1", "An", d);
              Employee b = new Employee("E-2", "An", d);
              Employee sameIdentity = new Employee("E-1", "An", d);
              check(!a.equals(b)); // Khác ID dù giống tên/ngày sinh.
              check(a.equals(sameIdentity));
              check(a.hashCode() == sameIdentity.hashCode());
              Set<Employee> employees = new HashSet<>(List.of(a,b,sameIdentity));
              check(employees.size() == 2);
              check(employees.contains(new Employee("E-2", "An", d)));
              System.out.println("PASS: employeeId là identity");
          }
      }
      ~~~

      **Verification:** `javac Case8.java` and `java Case8`. Real projects should test symmetry and transitivity. If the DB assigns an ID after persistence, do not change `hashCode` after the object is added to a Set; use an equality strategy consistent with its lifecycle.
