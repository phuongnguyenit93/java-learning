    code: |-
      ### Case 10 ? Moving pricing from Manager/Helper to a responsible policy

      A `PriceManager` or `Helper` that only forwards calls obscures pricing ownership. A business policy needs a clear name and must protect the invariant that a discount cannot exceed the subtotal. Test valid and invalid scenarios, not just class counts.

      ~~~java
      public class Case10 {
          record Quote(long subtotal, long discount, long total) {}
          static final class PricingPolicy {
              Quote quote(long unitPrice, int units, long discount) {
                  if (unitPrice < 0 || units < 1 || discount < 0)
                      throw new IllegalArgumentException("invalid price");
                  long subtotal = Math.multiplyExact(unitPrice, units);
                  if (discount > subtotal)
                      throw new IllegalArgumentException("discount > subtotal");
                  return new Quote(subtotal, discount, subtotal - discount);
              }
          }
          static final class LegacyHelper {
              Quote compute(long unit, int units, long discount) {
                  return new PricingPolicy().quote(unit, units, discount);
              }
          }
          static final class LegacyManager {
              Quote calculate(long unit, int units, long discount) {
                  return new LegacyHelper().compute(unit, units, discount);
              }
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              LegacyManager oldWay = new LegacyManager();
              PricingPolicy policy = new PricingPolicy();
              Quote expected = oldWay.calculate(1_000, 2, 500);
              check(expected.equals(policy.quote(1_000, 2, 500)));
              check(expected.total() == 1_500);
              try {
                  policy.quote(1_000, 2, 2_001);
                  throw new AssertionError("discount accepted");
              } catch (IllegalArgumentException expectedError) {
                  check(expectedError.getMessage().contains("discount"));
              }
              System.out.println("PASS: đúng business rule, không cần pass-through");
          }
      }
      ~~~

      **Evidence:** `javac Case10.java`, `java Case10`. Tests compare old/new results and invalid discounts, not performance. Classes with real orchestration, caching, or transaction responsibilities may still be needed.
  - situation: 'Developers debate whether Order is an entity or a data packet passed among services because its identity and lifecycle are unclear.'
    readmeRelated:
      anchorList:
      - object-001
      - object-004
      - class-design-006
      - modeling-002
      - practice-008
    resolve: 'Define Order lifecycle, business ID, and invariants; use an entity when identity survives changes and DTOs for data exchange.'
    knowledge: 'Entities versus DTOs, identity, object lifecycles, and aggregate boundaries.'
    code: |-
      ### Case 11 ? Order is an entity; DTO is an exchange snapshot

      An Order has identity and a stateful lifecycle: after payment, it is still the **same order**. DTOs capture state across boundaries; two different DTOs do not imply two different entities.

      ~~~java
      public class Case11 {
          enum Status { NEW, PAID }
          static final class Order {
              private final String orderId;
              private Status status = Status.NEW;
              Order(String id) {
                  if (id == null || id.isBlank())
                      throw new IllegalArgumentException("orderId");
                  orderId = id;
              }
              String id() { return orderId; }
              Status status() { return status; }
              void markPaid() {
                  if (status != Status.NEW)
                      throw new IllegalStateException("invalid transition");
                  status = Status.PAID;
              }
          }
          record OrderDto(String id, String status) {}
          static OrderDto toDto(Order order) {
              return new OrderDto(order.id(), order.status().name());
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              Order order = new Order("O-42");
              OrderDto before = toDto(order);
              order.markPaid();
              OrderDto after = toDto(order);
              check(before.id().equals(after.id()));
              check(before.status().equals("NEW"));
              check(after.status().equals("PAID"));
              check(order.id().equals("O-42")); // Identity không đổi.
              try {
                  order.markPaid();
                  throw new AssertionError("double payment accepted");
              } catch (IllegalStateException expected) { }
              check(order.status() == Status.PAID);
              System.out.println("PASS: entity giữ identity qua lifecycle");
          }
      }
      ~~~

      **Verification:** run `Case11.java` and inspect assertions. Real domain models require explicit rules for payment, permissions, and idempotency; this model example does not assume every order has the same state machine. Do not treat DTO data as the source of truth for entity updates.
  - situation: 'A simple CSV export must pass through a factory, service locator, and many interfaces although the application has no implementation variants.'
    readmeRelated:
      anchorList:
      - oop-basic-008
      - abstraction-007
      - solid-008
      - design-patterns-013
      - design-pitfalls-010
      - refactoring-008
    resolve: 'Remove speculative factories, locators, and interfaces for a single CSV export; use a function with a clear contract and independent tests.'
    knowledge: 'YAGNI, KISS, abstraction trade-offs, and simplicity.'
    code: |-
      ### Case 12 ? Simple CSV export needs no factory or locator

      For one CSV task, a pure function with a clear contract is easier to test than many interfaces. Escaping commas, quotes, and newlines is still essential for valid CSV.

      ~~~java
      import java.util.*;

      public class Case12 {
          record Row(String customer, long amount) {}
          static String quoteCsv(String field) {
              if (field == null) throw new IllegalArgumentException("customer");
              return "\"" + field.replace("\"", "\"\"") + "\"";
          }
          static String export(List<Row> rows) {
              StringBuilder out = new StringBuilder("customer,amount\r\n");
              for (Row row : rows) {
                  out.append(quoteCsv(row.customer())).append(',')
                     .append(row.amount()).append("\r\n");
              }
              return out.toString();
          }
          static void check(boolean ok) { if (!ok) throw new AssertionError(); }
          public static void main(String[] args) {
              String actual = export(List.of(
                  new Row("An", 100),
                  new Row("B, \"VIP\"", 200),
                  new Row("Dòng 1\nDòng 2", 300)
              ));
              String expected = "customer,amount\r\n"
                  + "\"An\",100\r\n"
                  + "\"B, \"\"VIP\"\"\",200\r\n"
                  + "\"Dòng 1\nDòng 2\",300\r\n";
              check(actual.equals(expected));
              try {
                  export(java.util.Collections.singletonList(new Row(null, 1)));
                  throw new AssertionError("null accepted");
              } catch (IllegalArgumentException expectedError) { }
              System.out.println("PASS: CSV quoted, escaped, no factory required");
          }
      }
      ~~~

      **Evidence:** `javac Case12.java`, `java Case12`; tests cover error-prone CSV cases and null input. CSV opened in spreadsheets needs separate *formula injection* and client-specific encoding policies; this example checks basic CSV escaping only and cannot guarantee safety in every importer.
