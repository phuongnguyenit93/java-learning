request:
  summary: Dữ liệu yêu cầu của API
  description: Tham số request nhận dữ liệu theo kiểu DTO được khai báo tại từng phương thức của Controller. Các trường bắt buộc và quy tắc kiểm tra tính hợp lệ
    phụ thuộc vào từng endpoint; tham khảo các API case để xây dựng đầu vào phù hợp.
  usage: true
input:
  summary: Dữ liệu đầu vào của API
  description: Tham số input nhận dữ liệu theo kiểu Java được khai báo tại endpoint. Tên trường và giá trị hợp lệ phụ thuộc vào API tương ứng; không có một payload
    chung cho toàn bộ module.
  usage: true
