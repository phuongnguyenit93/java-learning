#         explanation [kiểu: string; bắt buộc; mặc định: ""]
#           Giải thích hiển thị khi người học chọn đáp án này, bất kể đúng hay sai.
#     correctAnswerId [kiểu: enum; bắt buộc; giá trị hợp lệ: A, B, C, D; mặc định: ""]
