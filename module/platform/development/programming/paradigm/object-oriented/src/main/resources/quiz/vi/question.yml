      anchor: "oop-solution"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Cho Checkout tự kiểm tra số dư và gọi setBalance(70), vì bên gọi hiểu rõ số tiền cần rút hơn chính Account."
        explanation: "Caller chiếm quyền giữ invariant của A."
      - id: B
        answer: "Checkout gửi yêu cầu cho cả A lẫn B vì số dư ban đầu bằng nhau."
        explanation: "Giá trị giống nhau không làm danh tính trùng nhau."
      - id: C
        answer: "Checkout yêu cầu A.withdraw(30), A kiểm tra rồi giữ 70 và trả kết quả."
        explanation: "Bên gọi yêu cầu hành vi, đối tượng quản lý trạng thái của chính mình."
      - id: D
        answer: "Account chỉ in thông báo; Checkout quyết định tiền rút hợp lệ."
        explanation: "Quy tắc số dư nên do chủ sở hữu tài khoản quyết định."
    correctAnswerId: C
  - id: "oop-quiz-05"
    question: "Một sơ đồ nêu identity, invariant và hợp đồng mà chưa dùng từ khóa Java. Đó có phải kiến thức OOP?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ObjectOrientedProgramming.md"
      anchor: "oop-boundary"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Không; trước hết phải mô tả mô hình OOP bằng class, interface và private của Java."
        explanation: "Đóng gói là ranh giới hành vi, private chỉ là công cụ."
      - id: B
        answer: "Có; đây là mô hình trách nhiệm độc lập với cú pháp class/interface cụ thể."
        explanation: "Tư duy paradigm đi trước chi tiết Java về quyền truy cập và dispatch."
      - id: C
        answer: "Không; hợp đồng chỉ tồn tại khi biên dịch Java interface."
        explanation: "Hợp đồng còn gồm kỳ vọng kết quả và lỗi quan sát được."
      - id: D
        answer: "Có, nhưng lập sơ đồ đủ để tự bảo đảm atomic transfer."
        explanation: "Sơ đồ trách nhiệm không tạo transaction guarantee."
    correctAnswerId: B
  - id: "oop-quiz-06"
    question: "Người mới muốn giải thích việc rút tiền bị từ chối rồi học đa hình. Thứ tự nào có nền tảng tốt?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ObjectOrientedProgramming.md"
      anchor: "oop-learning-path"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Hiểu danh tính/trạng thái → invariant → trách nhiệm/hợp đồng → đa hình → đánh đổi."
        explanation: "Mỗi bước cung cấp ý nghĩa cần có để xét hợp đồng thay thế."
      - id: B
        answer: "Học inheritance và các biến thể pay trước, rồi dựa vào tên phương thức để suy ra ai có quyền giữ invariant của tài khoản."
        explanation: "Kế thừa không định nghĩa danh tính hay quyền sở hữu state."
      - id: C
        answer: "Học cấu trúc transaction trước rồi coi invariant tự được giữ."
        explanation: "Transaction không thay thế hợp đồng hành vi."
      - id: D
        answer: "Học đa hình trước, bỏ qua hợp đồng vì caller có chung tên phương thức."
        explanation: "Cùng tên không bảo đảm hành vi thay thế hợp lệ."
    correctAnswerId: A

