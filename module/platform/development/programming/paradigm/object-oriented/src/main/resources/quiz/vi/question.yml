questions:
  - id: "oop-quiz-01"
    question: "Hai tài khoản có cùng số dư 100. Vì sao vẫn có thể là hai đối tượng?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ObjectOrientedProgramming.md"
      anchor: "oop-what"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Số dư bằng nhau nghĩa là hai tài khoản phải có cùng danh tính."
        explanation: "Giá trị quan sát bằng nhau không chứng minh hai tài khoản là một thực thể."
      - id: B
        answer: "Vì danh tính và trách nhiệm của từng tài khoản khác nhau."
        explanation: "Số dư giống nhau không đồng nghĩa cùng thực thể; rút ở A không sửa B."
      - id: C
        answer: "Vì đối tượng chỉ tồn tại khi có lệnh thay đổi trạng thái."
        explanation: "Đối tượng bất biến cũng là đối tượng."
      - id: D
        answer: "Vì mỗi tài khoản bắt buộc có một class nguồn riêng."
        explanation: "Nhiều đối tượng tạo từ một class vẫn có thể giữ danh tính khác nhau."
    correctAnswerId: B
  - id: "oop-quiz-02"
    question: "Màn hình, batch và checkout đều tự kiểm tra số dư. Khi quy tắc thấu chi đổi, nên cải thiện gì?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ObjectOrientedProgramming.md"
      anchor: "oop-why"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Giao quyết định đủ tiền cho ranh giới chịu trách nhiệm của Account."
        explanation: "Một hợp đồng chung ngăn nhiều caller tự triển khai quy tắc dễ lệch nhau."
      - id: B
        answer: "Giữ ba bản kiểm tra ở từng caller nhưng lập checklist đồng bộ mỗi khi quy tắc thấu chi thay đổi trong tương lai."
        explanation: "Sao chép làm lần đổi sau vẫn dễ thiếu một nơi."
      - id: C
        answer: "Cho Checkout sửa thẳng balance nếu batch không làm được."
        explanation: "Quyền ghi phân tán làm khó bảo vệ invariant."
      - id: D
        answer: "Dời quy tắc sang giao diện mà vẫn cho caller tính số dư tùy ý."
        explanation: "Tên interface không loại bỏ quyền quyết định bị phân tán."
    correctAnswerId: A
  - id: "oop-quiz-03"
    question: "Một thủ tục withdraw(account,amount) duy nhất đã kiểm tra số dư chính xác. Đánh giá nào phù hợp?"
