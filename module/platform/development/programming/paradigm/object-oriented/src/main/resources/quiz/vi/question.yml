      anchor: "oop-before"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Chuyển thủ tục đã đúng sang class Account dù chưa có trách nhiệm riêng cần đóng gói."
        explanation: "Thủ tục cũng có tiền điều kiện và hậu điều kiện."
      - id: B
        answer: "Dữ liệu tách khỏi thủ tục không thể phân biệt hai tài khoản có cùng số dư."
        explanation: "Tham số account xác định đúng thực thể dù hành vi được tổ chức thành thủ tục hay phương thức của đối tượng."
      - id: C
        answer: "Có thủ tục withdraw riêng là đủ để chặn mọi nơi khác ghi AccountData."
        explanation: "Tách hàm không tự giới hạn quyền ghi của mọi caller."
      - id: D
        answer: "Thủ tục vẫn hợp lệ; dùng OOP khi cần thêm trách nhiệm và cộng tác."
        explanation: "Khác biệt là cách tổ chức trách nhiệm, không phải phép trừ có đúng hay không."
    correctAnswerId: D
  - id: "oop-quiz-04"
    question: "Checkout muốn rút 30 từ Account A có 100. Vết cộng tác nào giữ trách nhiệm đúng?"
