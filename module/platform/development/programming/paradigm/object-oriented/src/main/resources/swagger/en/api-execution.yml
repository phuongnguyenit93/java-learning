  executeCase5():
    execution: |
      <h3>1. Purpose of this method in the topic</h3>
      <p>An aggregate root is responsible for preserving invariants across its entire object cluster, not merely exposing a list of children for callers to modify freely. The order scenario shows that when child quantity is changed directly, <code>storedTotal</code> may no longer match the items; data within a single aggregate becomes inconsistent.</p>
      <p>Rather than exposing mutable children, the aggregate manages item addition, validates quantities, derives its total from owned state, and returns a read-only list. The lesson is that <strong>encapsulation protects invariants</strong>, rather than simply hiding fields.</p>
      <h3>3. How to observe the results</h3>
      <p>Call <code>GET /case-studies/group/10/case/5/execute</code> and look for <code>PASS: aggregate derived total</code> in the console after all checks pass. The controller returns <code>void</code>; the item list and total are not serialized into the response.</p>
      <p>The incorrect design allows <code>qty</code> to change without updating the stored total. The corrected version verifies that adding two units priced at <code>100</code> yields <code>200</code>, rejects negative quantities, and prevents callers from invoking <code>clear()</code> on the returned collection. After attempted violations, the total remains <code>200</code> and the aggregate still contains one item: external operations cannot break the invariant.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates that <strong>the aggregate root is the boundary controlling related state changes</strong>. When every operation goes through guarded behavior, the derived total and child list stay consistent before crossing the persistence boundary.</p>
