      <p>Như vậy, method này minh chứng <strong>lock granularity và contention</strong>: giới hạn khóa đúng phần trạng thái chung giúp thiết kế tránh đồng bộ quá rộng, song mọi thay đổi phải giữ invariant trước khi kết luận lợi ích hiệu năng bằng số liệu thực.</p>
