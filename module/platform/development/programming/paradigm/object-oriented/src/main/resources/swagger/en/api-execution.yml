  executeCase6():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Một domain operation vừa lưu đơn hàng vừa phát thông báo có hai loại tác động không nên bị đánh đồng: thay đổi dữ liệu giao dịch và side effect gửi đi bên ngoài. Gửi thông báo trước commit có thể khiến người dùng nhận tin thành công trong khi thao tác lưu bị từ chối. Tình huống minh họa việc đặt <strong>transaction boundary</strong> trước khâu phân phối thông báo bằng ý tưởng transactional outbox.</p>
      <p>Thông điệp học tập là ghi trạng thái nghiệp vụ và ý định phát sự kiện trong cùng ranh giới commit, rồi xử lý gửi sau đó. Code ở đây là mô phỏng bộ nhớ, không phải database transaction hoặc một hệ thống gửi mail thật.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/10/case/6/execute</code> và tìm <code>PASS: simulated commit precedes notification</code> trên stdout của JVM ứng dụng. Không cần cài database, message broker hay SMTP để chạy phần minh họa; endpoint không cung cấp transaction log hoặc JSON payload.</p>
      <p>Các kiểm tra xác nhận khi commit bị từ chối thì order, outbox và danh sách thông báo vẫn rỗng; khi commit được chấp nhận, danh sách thông báo vẫn chưa có phần tử. Chỉ sau khi dispatcher xử lý outbox mới xuất hiện mã đơn <code>O1</code> trong danh sách giả lập. Hãy phân biệt thứ tự xử lý được kiểm tra này với đảm bảo durable/retry của outbox triển khai thật.</p>
      <h3>4. Kết luận</h3>
      <p>Như vậy, method minh chứng <strong>tách commit nghiệp vụ khỏi thời điểm thực thi side effect</strong> là nguyên tắc quan trọng khi phối hợp aggregate với hệ thống bên ngoài. Bản mô phỏng giải thích luồng outbox, không chứng minh atomicity SQL hoặc khả năng giao hàng trong môi trường phân tán.</p>
