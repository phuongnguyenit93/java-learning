  executeCase3():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Tình huống Address giúp phân biệt <strong>value object</strong> với entity: hai địa chỉ có cùng giá trị nghiệp vụ nên được coi là tương đương dù được tạo thành hai instance riêng biệt. Nếu chỉ dùng reference equality, hệ thống có thể đếm trùng địa điểm giao hàng; nếu chuẩn hóa tùy tiện, hệ thống lại có thể gộp nhầm địa chỉ khác nhau.</p>
      <p>Vì vậy value object cần các thành phần giá trị có ý nghĩa, bất biến và một chính sách chuẩn hóa rõ ràng. Trong ví dụ, khoảng trắng và cách viết hoa được chuẩn hóa trước khi đối chiếu <code>equals</code> và <code>hashCode</code>.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Thực thi <code>GET /case-studies/group/10/case/3/execute</code>; xem stdout để tìm <code>PASS: normalized value equality</code> nếu toàn bộ phép kiểm tra thành công. Method không trả về danh sách địa chỉ hoặc JSON so sánh.</p>
      <p>Đối chiếu lần lượt: hai object Address kiểu sai có cùng nội dung nhưng không bằng nhau theo reference; hai value object có cách ghi <code>Số 1 / Hà Nội</code> khác khoảng trắng và chữ hoa vẫn bằng nhau, có hash bằng nhau và chỉ chiếm một phần tử trong Set. Đầu vào tên đường trắng cũng được kiểm tra là không hợp lệ, tránh tạo value object vô nghĩa.</p>
      <h3>4. Kết luận</h3>
      <p>Như vậy, method minh chứng <strong>value equality gắn với giá trị đã chuẩn hóa, không gắn với địa chỉ bộ nhớ</strong>. Bất biến, validation và quy tắc normalization nhất quán làm cho value object an toàn trong so sánh và collection.</p>
