      <p>Gọi endpoint rồi đọc phép kiểm tra <code>Thread.holdsLock</code> trong Case Study: bản cũ gọi callback khi vẫn giữ monitor của service, còn bản dùng <code>AtomicInteger</code> để cập nhật counter gọi callback ngoài lock. Đối chiếu count cuối và trạng thái sở hữu lock tại callback; đây là bằng chứng về <strong>phạm vi khóa</strong>, không phải số đo blocked time hay tốc độ phục vụ HTTP.</p>
