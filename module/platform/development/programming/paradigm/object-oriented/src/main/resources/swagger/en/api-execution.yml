      <p>Như vậy, method này đã minh chứng cho nguyên tắc <strong>composition có trách nhiệm và khả năng truy nguyên lỗi</strong> trong chủ đề <strong>OBJECT_ORIENTED_PROGRAMMING</strong>: Decorator cần giữ đường đi xử lý minh bạch và không làm mất nguyên nhân lỗi gốc, nếu không lợi ích mở rộng dễ biến thành gánh nặng bảo trì.</p>
