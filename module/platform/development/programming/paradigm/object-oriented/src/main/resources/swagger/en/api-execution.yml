      <p>The method explains why object-representation methods can leak data when they expose tokens or payment information. In <strong>OBJECT_ORIENTED_PROGRAMMING</strong>, designing <code>toString()</code> and allowlisted log fields is part of the public contract: disclose only safe identifiers and roles, keeping secrets out of observable strings.</p>
