  executeCase6():
    execution: |
      <h3>1. Purpose of this method in the topic</h3>
      <p>A domain operation that saves an order and sends a notification has two distinct effects: changing transactional data and causing an external delivery side effect. Sending the notification before commit could tell a user the operation succeeded even though the save is later rejected. The scenario illustrates placing the <strong>transaction boundary</strong> before notification delivery using the transactional outbox concept.</p>
      <p>The lesson is to record business state and the intent to publish an event within the same commit boundary, then perform delivery afterward. This code is an in-memory simulation, not a database transaction or a real mail-delivery system.</p>
      <h3>3. How to observe the results</h3>
      <p>Call <code>GET /case-studies/group/10/case/6/execute</code> and look for <code>PASS: simulated commit precedes notification</code> in the application's JVM stdout. The demonstration requires no database, message broker, or SMTP installation; the endpoint provides neither transaction logs nor a JSON payload.</p>
      <p>The checks confirm that when a commit is rejected, the order, outbox, and notification lists remain empty; when a commit succeeds, the notification list is still empty initially. Only after the dispatcher processes the outbox does order ID <code>O1</code> appear in the simulated notification list. Distinguish this verified processing order from the durability/retry guarantees required of a real outbox.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates that <strong>separating business commits from execution of side effects</strong> is essential when coordinating aggregates with external systems. The simulation explains the outbox flow but does not prove SQL atomicity or delivery reliability in distributed environments.</p>
    usage: true
  executeCase7():
    execution: |
      <h3>1. Purpose of this method in the topic</h3>
      <p>In an event flow with retries, the same event may arrive more than once. If a consumer deducts inventory or sends notifications on every delivery, business effects are duplicated even though the source generated only one logical event. The example emphasizes <strong>idempotency based on eventId</strong>: processing the same event identity again must not repeat an already completed side effect.</p>
      <p>This is a behavioral contract of the consumer and its record of processed events, rather than an assumption that message-delivery infrastructure guarantees exactly-once behavior. The demo runs sequentially in memory without a broker or real deduplication table.</p>
      <h3>3. How to observe the results</h3>
      <p>Execute <code>GET /case-studies/group/10/case/7/execute</code>; after the internal checks, stdout should contain <code>PASS: duplicate event ignored</code>. There is no real email or out-of-process inventory update to observe.</p>
      <p>The example delivers event <code>E1</code> twice: without deduplication, the consumer leaves stock at <code>6</code> and records two simulated emails; with a <code>processed</code> set, stock remains <code>8</code> and only one email is recorded. After processing a new event <code>E2</code>, stock becomes <code>7</code> and the email count reaches two. Verify that <strong>duplicate IDs are ignored while new IDs are processed</strong>, not just one counter in isolation.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates that <strong>an idempotent consumer protects business invariants when events are delivered repeatedly</strong>. A real implementation also needs to persist processed-event records consistently with state changes; this demo verifies only the behavioral rule.</p>
    usage: true
  executeCase8():
    execution: |
      <h3>1. Purpose of this method in the topic</h3>
      <p>A booking-and-payment operation may span two aggregates stored in different systems. A local transaction at one data source cannot automatically roll back an operation already completed in the other; the design therefore needs an explicit <strong>coordination and compensation process</strong> for failed steps.</p>
      <p>The scenario uses a Saga to show that the final business state depends on both forward actions and compensation. This is a consistency principle across boundaries, not a promise of a distributed ACID transaction.</p>
      <h3>3. How to observe the results</h3>
      <p>Call <code>GET /case-studies/group/10/case/8/execute</code> and look for <code>PASS: compensating flow illustrated</code> in stdout. The demo uses only in-memory <code>BookingStore</code> and <code>BillingStore</code> instances, not two real databases, so there are no external transaction traces or DB records to query.</p>
      <p>In the failed-payment branch, the Saga returns failure and both <code>reserved</code> and <code>charged</code> are checked as false after compensation. In the successful branch, both flags are checked as true. These assertions illustrate coordination among reservation, charging, and compensation; they do not prove resilience to network loss or crashes between steps.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates that <strong>multiple aggregates across persistence boundaries require a deliberate compensation workflow</strong>. A Saga manages business progress and failure outcomes without turning local transactions into a global transaction.</p>
    usage: true
  executeCase9():
    execution: |
      <h3>1. Purpose of this method in the topic</h3>
      <p>A ticket-cancellation rule is a shared <strong>business invariant</strong>, not the exclusive responsibility of a web controller. If the web channel checks the deadline but mobile or batch processing skips it, the same ticket can be handled inconsistently across channels. The scenario highlights the role of a shared application use case in centralizing domain policy.</p>
      <p>Placing the deadline guard in a shared operation gives every entry point the same acceptance/rejection conditions and allows an explicit reference time to be supplied instead of relying on each channel's system clock.</p>
      <h3>3. How to observe the results</h3>
      <p>Call <code>GET /case-studies/group/10/case/9/execute</code> and look for <code>PASS: all channels share cancellation guard</code> in the console once the method passes. The request triggers one demo, <strong>not three separate HTTP endpoints for web/mobile/batch</strong>, and does not return a cancelled-ticket JSON object.</p>
      <p>The demo simulates three channels with three functions calling the same use case for a ticket departing at <code>2026-11-30T12:00:00Z</code>. All three accept cancellation <code>25</code> hours before departure, and all three reject it <code>23</code> hours before departure under the <code>24</code>-hour deadline guard. Focus on consistency across channels rather than the web result alone.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates that <strong>domain rules belong at a boundary shared by all channels</strong>. A guarded common use case reduces the risk of web, mobile, and batch applying different business policies.</p>
    usage: true
  executeCase10():
    execution: |
      <h3>1. Purpose of this method in the topic</h3>
      <p>A public order-status setter allows an object to skip business steps that have not happened, such as moving from <code>NEW</code> to <code>REFUNDED</code> without payment. The example shows that <strong>encapsulating state transitions as domain behavior</strong> protects the state machine; arbitrary callers should not assign enum values directly.</p>
      <p>Guarded commands represent valid transitions: record payment first, then permit a refund. After a refund, the object must not return to a paid state or issue another refund in ways that invalidate the meaning of its state.</p>
      <h3>3. How to observe the results</h3>
      <p>Execute <code>GET /case-studies/group/10/case/10/execute</code> and inspect stdout; <code>PASS: guarded order transitions</code> is printed after all checks complete. The endpoint returns <code>void</code>, not a JSON state graph.</p>
      <p>The incorrect design first allows directly assigning <code>REFUNDED</code>. The guarded version rejects refunds while the order is <code>NEW</code> and preserves its <code>NEW</code> status; after <code>recordPayment()</code>, <code>refund()</code> moves it to <code>REFUNDED</code>. Subsequent payment or refund attempts are blocked. The demo intentionally catches these exceptions to verify rejection; they are not errors meant to be exposed over HTTP.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates that <strong>state transitions must be controlled behaviors, not arbitrary assignments</strong>. Guards inside the domain object make order-lifecycle rules consistent for all callers.</p>
    usage: true
  executeCase11():
    execution: |
      <h3>1. Purpose of this method in the topic</h3>
      <p>When an entity with a lazy relationship crosses directly from persistence to HTTP serialization, reading child data after the session closes may fail. The scenario illustrates why <strong>domain/persistence objects must not be conflated with API DTOs</strong>: externally returned data should be a snapshot materialized within a valid scope.</p>
      <p>Instead of exposing lazy loaders and session lifetimes, mapping to a DTO while data is accessible makes the response contract independent of ORM-context state. The example uses simulated Session and LazyItems objects; it does not start Hibernate or a real serializer.</p>
      <h3>3. How to observe the results</h3>
      <p>Call <code>GET /case-studies/group/10/case/11/execute</code> in the running application and look for <code>PASS: API DTO detached from lazy state</code> in stdout after the checks pass. Do not expect an HTTP serializer error or a JSON DTO from the demo's <code>void</code> endpoint.</p>
      <p>The example attempts to read an entity's lazy items after the simulated session closes and confirms the access is rejected. While the session is open, the mapper copies <code>A</code> and <code>B</code> into a DTO; after closing, that DTO still contains ID <code>O1</code> and both items for independent access. Verifying real ORM behavior also requires integration tests covering transactions, fetch strategies, and N+1 effects.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates that <strong>a DTO is a data boundary separating the API contract from the lifecycle of lazy persistence objects</strong>. Materializing data at the right time avoids hidden session dependencies after it leaves the domain/persistence boundary.</p>
    usage: true
  executeCase12():
    execution: |
      <h3>1. Purpose of this method in the topic</h3>
      <p>Deadline logic should not silently depend on the actual time reported by the running machine. If the domain reads the system clock directly, the same test may produce different results depending on execution time or timezone. The scenario shows that <strong>injecting a Clock dependency</strong> turns an environmental factor into a controllable input to a domain service.</p>
      <p>This lets learners test expiration boundaries, instants before and after deadlines, and conversion of <code>Instant</code> into calendar dates using <code>ZoneId</code>, without waiting for the real clock to reach the test time.</p>
      <h3>3. How to observe the results</h3>
      <p>Call <code>GET /case-studies/group/10/case/12/execute</code> and find <code>PASS: fixed Clock yields deterministic boundary</code> in stdout. This signal is printed by the Service after validation; the endpoint does not return system time or expiration status as JSON.</p>
      <p>The clock is fixed at <code>2026-11-01T00:00:00Z</code>: a deadline one second later has not expired, while a deadline at that instant or one second earlier has expired. The demo checks the date <code>2026-11-01</code> in UTC and <code>Asia/Ho_Chi_Minh</code> and rejects a <code>null</code> deadline. At the chosen instant, both timezones produce the same date; the demo <strong>does not</strong> show different dates near local midnight.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates that <strong>an injected time dependency makes deadline rules deterministic and testable</strong>. Distinguishing <code>Instant</code> from timezone-dependent <code>LocalDate</code> also helps prevent errors when system timestamps interact with business calendar-date rules.</p>
    usage: true
