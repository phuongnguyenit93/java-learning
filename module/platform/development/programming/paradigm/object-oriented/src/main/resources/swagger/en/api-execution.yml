  executeCase2():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Ví dụ entity mới chưa có ID cơ sở dữ liệu cho thấy một rủi ro tinh vi của <strong>hash-based collection</strong> trong thiết kế OOP. Nếu <code>hashCode</code> dựa vào ID chỉ được gán sau khi lưu, cùng một object có thể đổi mã băm sau lúc được thêm vào <code>HashSet</code>; việc tìm kiếm khi đó không còn tuân theo giả định về khóa bất biến.</p>
      <p>Giải pháp minh họa dùng identity key ổn định từ trước khi persist, tách vòng đời của entity khỏi thời điểm database cấp ID. Bài học không phải mọi entity đều phải dùng UUID, mà là không được làm biến đổi dữ liệu quyết định vị trí hash của phần tử đã đưa vào Set.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/10/case/2/execute</code> và kiểm tra stdout của JVM ứng dụng. Chuỗi <code>PASS: hash key independent of generated DB id</code> chỉ xuất hiện sau các phép kiểm tra nội bộ, không phải nội dung HTTP response.</p>
      <p>Phần sai xác minh mã băm của entity thay đổi khi <code>databaseId</code> từ chưa có thành <code>1</code>. Phần đúng tạo khóa riêng trước khi đưa entity vào Set, sau đó gán database ID nhưng hash vẫn giữ nguyên và <code>contains</code> vẫn nhận ra entity. Đặc biệt, ví dụ <strong>không</strong> dùng kết quả <code>contains</code> của đối tượng sai làm điều kiện bắt buộc, vì va chạm hash bucket có thể khiến cách thử đó không ổn định.</p>
      <h3>4. Kết luận</h3>
      <p>Như vậy, method minh chứng nguyên lý <strong>giữ identity/hash ổn định khi entity tham gia hashed collection</strong>. ID do persistence cấp có thể thuộc vòng đời lưu trữ, nhưng không nên làm thay đổi khóa tra cứu của object đã được đưa vào Set.</p>
