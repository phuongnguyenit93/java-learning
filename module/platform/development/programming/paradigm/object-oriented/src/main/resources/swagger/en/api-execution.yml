    execution: |
      <h3>1. Purpose of this method in the topic</h3>
      <p>This lesson concerns <strong>a safe <code>toString()</code> contract for cyclic object graphs</strong>. Bidirectional parent/child relationships can cause infinite recursion when full parent and child objects are concatenated into strings; exposing only IDs, parent IDs, and child counts provides sufficient diagnostic information without traversing the entire graph.</p>
      <h3>3. How to observe the results</h3>
      <p>Start with <code>-ea</code> and call <code>GET /case-studies/group/11/case/6/execute</code>. Use the debugger to inspect strings produced for <code>root</code> and <code>child</code> after establishing their parent/child link: the root string contains <code>childCount=1</code>, the child string contains <code>parentId=root</code>, and both are shorter than <code>100</code> characters. The code verifies that the root's <code>toString()</code> does not nest the entire child node. The strings are created and compared internally, not necessarily sent to a logger. There is no need to invoke a broken recursive <code>toString()</code> merely to provoke <code>StackOverflowError</code>.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates that <strong>bounded object representations instead of traversing every relationship</strong> make diagnostics of cyclic data safer and more readable; <code>toString()</code> should be a deliberate summary, not a serializer for the entire graph.</p>
