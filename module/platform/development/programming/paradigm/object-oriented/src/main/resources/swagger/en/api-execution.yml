  executeCase7():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Trong luồng sự kiện có retry, cùng một event có thể đến nhiều lần. Nếu consumer mỗi lần đều trừ tồn kho hoặc gửi thông báo, tác động nghiệp vụ bị nhân đôi dù nguồn chỉ phát sinh một sự kiện logic. Ví dụ đặt trọng tâm vào <strong>idempotency theo eventId</strong>: xử lý lại cùng danh tính sự kiện không được lặp side effect đã hoàn thành.</p>
      <p>Đây là hợp đồng hành vi của consumer và mô hình lưu trạng thái đã xử lý, khác với việc hy vọng hạ tầng message delivery tự bảo đảm chính xác một lần. Demo chạy tuần tự trong bộ nhớ, không dùng broker hay bảng deduplication thật.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Thực thi <code>GET /case-studies/group/10/case/7/execute</code>; sau các kiểm tra nội bộ, stdout dự kiến có <code>PASS: duplicate event ignored</code>. Không có email thật hoặc lệnh cập nhật kho ngoài tiến trình để quan sát.</p>
      <p>Ví dụ chuyển cùng event <code>E1</code> hai lần: consumer không có deduplication còn stock <code>6</code> và ghi nhận hai lần gửi email giả lập, trong khi consumer có tập <code>processed</code> giữ stock <code>8</code> và một email. Khi xử lý thêm event mới <code>E2</code>, stock còn <code>7</code> và tổng email thành hai. Điều cần đối chiếu là <strong>trùng ID bị bỏ qua, ID mới vẫn được xử lý</strong>, không chỉ một counter riêng lẻ.</p>
      <h3>4. Kết luận</h3>
      <p>Như vậy, method minh chứng <strong>consumer idempotent bảo vệ invariant nghiệp vụ khi cùng sự kiện được giao lặp</strong>. Bản thực tế còn cần lưu dấu event đã xử lý đồng bộ với thay đổi state; demo này chỉ kiểm chứng quy tắc hành vi.</p>
