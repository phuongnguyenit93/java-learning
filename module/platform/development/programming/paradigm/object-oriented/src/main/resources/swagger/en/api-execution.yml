      <p>Thus, the method illustrates <strong>behavioral subtyping and invariants</strong> in OBJECT_ORIENTED_PROGRAMMING: a subclass safely substitutes for its parent only when all valid calls continue honoring the rules that clients of the abstraction may rely upon.</p>
