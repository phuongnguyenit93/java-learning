      <p>Call <code>GET /case-studies/group/5/case/7/execute</code> with JVM assertions enabled (<code>-ea</code>), or run <code>Case7Test</code> with assertions. Set breakpoints on <code>Base7.kind()</code>, <code>Child7.kind()</code>, <code>ref.kind()</code>, and <code>ref.render()</code> in <code>Group5Service.executeCase7()</code>: the first three expected values are <code>base-static</code>, <code>child-static</code>, and <code>base-static</code>; the instance result is <code>child-instance</code>. The domain classes' two static methods delegate computation to <code>Base7Utils</code> and <code>Child7Utils</code> to preserve STEP 8's helper separation, but hiding occurs on the actual <code>Base7</code>/<code>Child7</code> methods. The API returns <code>void</code> with no JSON containing these values.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, <code>executeCase7()</code> demonstrates <strong>static method hiding within inheritance</strong> through identically named calls on different reference types and confirms <strong>dynamic dispatch</strong> for instance method <code>render()</code>. Hiding depends on compile-time type, whereas overriding depends on the object's runtime type; application code should ordinarily avoid calling static methods through instance variables.</p>
