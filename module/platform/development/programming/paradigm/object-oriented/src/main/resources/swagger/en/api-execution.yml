  executeCase1():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Trong chủ đề <strong>OBJECT_ORIENTED_PROGRAMMING</strong>, tình huống Customer làm rõ sự khác biệt giữa <strong>danh tính của entity</strong> và thuộc tính mô tả của nó. Hai khách hàng có thể cùng tên nhưng vẫn là hai thực thể; ngược lại, một khách hàng đổi tên vẫn phải giữ nguyên danh tính. Khi định nghĩa equality theo tên, collection có thể gộp nhầm hai entity khác nhau và che mất dữ liệu nghiệp vụ.</p>
      <p>Điểm cần học là lựa chọn identity ổn định, chẳng hạn <code>customerId</code>, làm cơ sở nhất quán cho <code>equals</code>/<code>hashCode</code>, thay vì dựa trên thuộc tính có thể trùng hoặc thay đổi.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/10/case/1/execute</code> trên ứng dụng đang chạy và xem stdout trong terminal hoặc console của IDE. Nếu các kiểm tra nội bộ đều vượt qua, method in <code>PASS: stable Customer identity</code>. Đây là tín hiệu từ Service, không phải một JSON response của endpoint <code>void</code>.</p>
      <p>Trong ví dụ, tập hợp so tên gộp hai khách hàng tên An thành một phần tử; tập hợp theo ID giữ hai khách hàng <code>C1</code> và <code>C2</code> riêng biệt. Sau khi đổi tên khách hàng <code>C1</code>, phép tìm kiếm theo cùng ID vẫn nhận ra entity đó, trong khi <code>C1</code> không trở thành <code>C2</code>. Quan sát này kiểm chứng identity không phụ thuộc tên hiển thị.</p>
      <h3>4. Kết luận</h3>
      <p>Như vậy, method minh chứng rằng <strong>entity equality phải phản ánh identity nghiệp vụ bền vững</strong>: thuộc tính mô tả được phép trùng và thay đổi mà không làm collection nhầm hoặc mất thực thể. Đây là nền tảng khi thiết kế domain model có vòng đời dài.</p>
