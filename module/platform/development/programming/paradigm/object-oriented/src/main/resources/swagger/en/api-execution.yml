      <p>Learners see why initialization order is crucial to inheritance design. A base-class constructor runs before subclass-specific data may be ready, so calling an overridable method or validation dependent on subclass state at that point can cause subtle bugs. Validating after the object is fully initialized separates state construction from correctness checks.</p>
