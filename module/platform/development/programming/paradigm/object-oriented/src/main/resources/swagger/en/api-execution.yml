  executeCase4():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Money là value object chứa cả số tiền lẫn đơn vị tiền tệ. Tình huống này minh họa rằng chọn kiểu dữ liệu cũng là quyết định thiết kế domain model: <code>double</code> biểu diễn số thập phân qua nhị phân nên có thể gây sai số khi cộng các khoản tiền, dù các giá trị nhìn qua tưởng đơn giản.</p>
      <p>Mô hình dùng <code>BigDecimal</code> tạo từ chuỗi để kiểm soát phép cộng chính xác, đồng thời từ chối cộng hai Money khác currency. Đây là cách gom <strong>invariant về độ chính xác và đơn vị</strong> vào value object thay vì để caller tự nhớ quy tắc.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/10/case/4/execute</code> và quan sát stdout; <code>PASS: precise Money addition</code> được in khi các điều kiện đã được xác nhận, không phải số dư trả về qua HTTP.</p>
      <p>Ví dụ trước hết kiểm tra <code>0.1 + 0.2</code> bằng <code>double</code> không bằng đúng <code>0.3</code>. Sau đó hai khoản USD <code>0.10</code> và <code>0.20</code> tạo tổng <code>0.30</code>, cộng thêm <code>0.70</code> cho <code>1.00</code>; thao tác cộng USD với EUR phải bị từ chối. Những tín hiệu này chỉ xác minh phép cộng và currency guard của bản demo, không tự chứng minh toàn bộ chính sách làm tròn của một hệ thống tài chính.</p>
      <h3>4. Kết luận</h3>
      <p>Như vậy, method minh chứng <strong>Money cần hành vi và ràng buộc miền riêng</strong>, không chỉ là một con số. Bao gói precision và currency vào value object giúp tránh phép tính sai ngầm trong nhiều use case.</p>
