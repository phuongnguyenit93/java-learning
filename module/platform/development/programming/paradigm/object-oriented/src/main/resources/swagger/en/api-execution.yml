  executeCase2():
    execution: |
      <h3>1. Purpose of this method in the topic</h3>
      <p>The lesson clarifies the relationship between <code>equals()</code> and <code>hashCode()</code> in <strong>OBJECT_ORIENTED_PROGRAMMING</strong>. Two objects representing the same product key must compare equal and produce the same hash; overriding only <code>equals()</code> can prevent a hash-based structure from finding a record through another value-equivalent key.</p>
      <h3>3. How to observe the results</h3>
      <p>Run the application with <code>-ea</code>, call <code>GET /case-studies/group/11/case/2/execute</code>, and use the debugger to inspect product keys with category <code>BOOK</code>, SKU <code>42</code>, and a different SKU <code>43</code>. Check reflexive, symmetric, and transitive equality; equal keys must have equal hashes, and a new equivalent key must retrieve price <code>250</code> from the <code>HashMap</code>. These checks are Java <code>assert</code> statements, not returned HTTP data or emitted logs. Do not assume a particular numeric hash value.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates that <strong>the equals/hashCode contract is part of an object's semantics</strong>: when equality uses several stable fields, hashing must use those same fields for hash-based collections to behave correctly.</p>
    usage: true
  executeCase3():
    execution: |
      <h3>1. Purpose of this method in the topic</h3>
      <p>In <strong>OBJECT_ORIENTED_PROGRAMMING</strong>, inheritance does not automatically ensure consistent equality semantics. If a base class uses <code>instanceof</code> but its subclass accepts only an exact runtime class, two objects sharing an ID may give different results for <code>a.equals(b)</code> and <code>b.equals(a)</code>, violating symmetry. The lesson extracts identity into a value object, allowing shared identity without treating different customer types as the same object.</p>
      <h3>3. How to observe the results</h3>
      <p>Enable <code>-ea</code> at startup, then call <code>GET /case-studies/group/11/case/3/execute</code>. In the debugger, compare both directions between a base object and subtype with ID <code>X</code>: base-to-subtype returns true, but subtype-to-base returns false. Then compare two different customer types that share <code>Identity("X")</code>: their identities match in both directions, but the distinct customer objects are not conflated. The faulty case is deliberately demonstrated by assertions; the API does not return these comparisons in its body.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates <strong>the risk of breaking symmetry by mixing equality policies within an inheritance hierarchy</strong>. Putting business identity in an immutable value object lets types reuse identity rules without an inheritance relationship that creates conflicting equality semantics.</p>
    usage: true
  executeCase4():
    execution: |
      <h3>1. Purpose of this method in the topic</h3>
      <p>The method illustrates the difference between <strong>sort order</strong> and <strong>object identity</strong> in ordered OOP collections. A <code>TreeSet</code> treats two elements as equivalent when the comparator returns <code>0</code>, so comparing only names can silently drop products with different SKUs but identical names.</p>
      <h3>3. How to observe the results</h3>
      <p>Start the JVM with <code>-ea</code>, call <code>GET /case-studies/group/11/case/4/execute</code>, and set a breakpoint after adding two products named <code>Bút</code>. The name-only comparator keeps <code>1</code> element; adding SKU as a tie-breaker lets the new set keep both <code>2</code> elements and recognize <code>SKU-1</code> and <code>SKU-2</code>. The Service uses assertions to verify these results and does not emit delete events or database writes; the endpoint does not return a product list.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates that <strong>a comparator determines uniqueness in a sorted collection</strong>. Returning <code>0</code> should correspond to a clearly defined identity key; a display name alone is rarely a substitute for a product code.</p>
    usage: true
  executeCase5():
    execution: |
      <h3>1. Purpose of this method in the topic</h3>
      <p>Learners see that declaring a <code>record</code> does not automatically make lists or mutable elements deeply immutable. In <strong>OBJECT_ORIENTED_PROGRAMMING</strong>, historical snapshots must isolate data ownership by defensively copying containers and converting nested objects into immutable value projections, so later modifications to source data cannot rewrite history.</p>
      <h3>3. How to observe the results</h3>
      <p>Call <code>GET /case-studies/group/11/case/5/execute</code> on a JVM with <code>-ea</code> enabled. In the debugger, observe an initial order snapshot with SKU <code>A</code> and quantity <code>2</code>; after changing the source element to <code>99</code> and adding line <code>B</code>, the snapshot still retains its original line. Attempting to add a line through the snapshot list should raise the expected, caught <code>UnsupportedOperationException</code>; clearing another snapshot's source list likewise must not change its stored list. Most checks use <code>assert</code>; no snapshot JSON or log is directly observable through HTTP.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates that <strong>defensive copying and immutable projections protect object ownership boundaries</strong>. Consider element mutability as well: a list that disallows additions and removals may still contain mutable references if copying was incomplete.</p>
