      <h3>1. Purpose of this method in the topic</h3>
      <p>In <strong>OBJECT_ORIENTED_PROGRAMMING</strong>, learners distinguish subtype relationships from an object's actual capabilities. Requiring every vehicle to expose an engine-starting method forces bicycles to promise behavior they cannot provide. Separating mobility from engine-powered capabilities lets clients depend on precisely the contracts they need, illustrating the Liskov Substitution Principle and Interface Segregation Principle.</p>
      <h3>3. How to observe the results</h3>
      <p>Call <code>GET /case-studies/group/5/case/1/execute</code> on the running application. To inspect intermediate values, attach the IDE debugger to the JVM and verify that both vehicle types can share the movement contract while only engine-powered objects can use the start operation. The Case Study also shows that passing a bicycle to an API expecting <code>EnginePowered</code> is a compile-time type error; invoking the endpoint does not compile the commented-out counterexample. If checks use <code>assert</code>, JVM assertions must be enabled for them to run.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method illustrates the OOP principle that <strong>type contracts must match behavioral capabilities</strong>: role-specific interfaces prevent invalid operations at the type-system level instead of making subtypes throw exceptions when asked to do something they cannot.</p>
