      <p>Một quy tắc hủy vé là <strong>business invariant</strong> chung, không phải trách nhiệm riêng của web controller. Nếu web tự kiểm tra thời hạn nhưng mobile hoặc batch bỏ qua, cùng một chiếc vé có thể được xử lý không nhất quán theo kênh gọi. Tình huống giúp người học thấy vai trò của shared application use case trong việc tập trung chính sách domain.</p>
      <p>Đưa guard thời hạn vào thao tác chung khiến mỗi entrypoint có cùng điều kiện chấp nhận hoặc từ chối, đồng thời cho phép truyền thời điểm xác định thay vì phụ thuộc đồng hồ máy tại từng kênh.</p>
