    execution: |
      <h3>1. Purpose of this method in the topic</h3>
      <p>Provides two workloads with different mechanisms so learners can distinguish CPU work from JVM object allocation. The <code>cpu</code> branch accumulates calculations in a loop; the <code>allocation</code> branch creates byte arrays and assigns them to a volatile field so allocations can be observed. Selecting workloads is a preliminary step toward evidence-based performance analysis.</p>
      <h3>2. Supporting programs outside the main flow (if any)</h3>
      <p>Use the terminal or IDE log window to inspect the application's actual stdout. Java Mission Control can open a JFR recording only after JFR has been enabled on the JVM with appropriate events/sampling; CPU sampling or allocation events may need to be enabled. This method does not initialize any JFR configuration.</p>
      <h3>3. How to observe the results</h3>
      <p>Call <code>GET /case-studies/group/1/case/9/execute?mode=cpu</code> or <code>?mode=allocation</code>, then look for <code>workload completed; result=</code> in stdout. Both branches run 2000000 iterations and print this line only when the calculated value is positive; the HTTP body does not contain the result because the controller returns <code>void</code>.</p>
      <p>With a suitable JFR recording, correlate CPU, allocation, and GC samples with the request interval. Repeat runs with warmup and measure latency/throughput separately before identifying bottlenecks. If <code>mode</code> is omitted or given an unknown value, the Service throws <code>IllegalArgumentException</code>; catch it in the debugger to verify the error path without assuming the error handler's status or body.</p>
      <h3>4. Conclusion</h3>
      <p>The completion line and positive value show that the selected workload path finished. Logs alone cannot establish whether GC occurred, the amount of CPU/GC time consumed, or the cause of latency; JFR also needs suitable configuration, recording duration, and analysis.</p>
