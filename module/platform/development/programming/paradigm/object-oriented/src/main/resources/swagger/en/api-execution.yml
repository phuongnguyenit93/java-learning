      <h3>1. Purpose of this method in the topic</h3>
      <p>Within the <strong>OBJECT_ORIENTED_PROGRAMMING</strong> topic, the Customer scenario clarifies the distinction between <strong>an entity's identity</strong> and its descriptive attributes. Two customers can share a name while remaining distinct entities; conversely, a customer who changes their name must retain the same identity. Defining equality by name can cause a collection to merge two different entities incorrectly and conceal business data.</p>
      <p>The key lesson is to choose a stable identity, such as <code>customerId</code>, as a consistent basis for <code>equals</code>/<code>hashCode</code>, rather than relying on an attribute that may be duplicated or changed.</p>
      <h3>3. How to observe the results</h3>
      <p>Call <code>GET /case-studies/group/10/case/1/execute</code> on the running application and inspect stdout in the terminal or IDE console. If all internal assertions pass, the method prints <code>PASS: stable Customer identity</code>. This is a Service-side signal, not a JSON response from the <code>void</code> endpoint.</p>
      <p>In the example, name-based equality merges two customers named An into one set element; ID-based equality keeps customers <code>C1</code> and <code>C2</code> distinct. After customer <code>C1</code> changes their name, a lookup by the same ID still finds that entity, while <code>C1</code> does not become <code>C2</code>. This confirms that identity is independent of the display name.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates that <strong>entity equality must reflect durable business identity</strong>: descriptive attributes may be duplicated or changed without causing a collection to confuse or lose entities. This is fundamental when designing long-lived domain models.</p>
    usage: true
  executeCase2():
    execution: |
      <h3>1. Purpose of this method in the topic</h3>
      <p>The example of a new entity without a database ID illustrates a subtle risk of <strong>hash-based collections</strong> in OOP design. If <code>hashCode</code> depends on an ID assigned only after persistence, the same object may change its hash code after insertion into a <code>HashSet</code>; lookups then violate the assumption of a stable hash key.</p>
      <p>The illustrated solution uses an identity key that is stable before persistence, decoupling the entity's lifecycle from when the database assigns its ID. The lesson is not that every entity must use a UUID, but that values determining the hash placement of an element already in a set must not change.</p>
      <h3>3. How to observe the results</h3>
      <p>Call <code>GET /case-studies/group/10/case/2/execute</code> and inspect the application's JVM stdout. The string <code>PASS: hash key independent of generated DB id</code> appears only after internal checks complete; it is not the HTTP response body.</p>
      <p>The incorrect implementation verifies that an entity's hash changes when <code>databaseId</code> goes from unset to <code>1</code>. The correct implementation creates a separate key before inserting the entity into the set, then assigns a database ID while preserving the hash so <code>contains</code> still finds the entity. Notably, the example <strong>does not</strong> require a particular <code>contains</code> result for the broken implementation, because hash-bucket collisions can make that test unreliable.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates the principle of <strong>keeping identity and hashes stable while an entity belongs to a hash-based collection</strong>. An ID assigned by persistence may belong to the storage lifecycle, but should not alter the lookup key of an object already inserted into a set.</p>
    usage: true
  executeCase3():
    execution: |
      <h3>1. Purpose of this method in the topic</h3>
      <p>The Address scenario distinguishes a <strong>value object</strong> from an entity: two addresses with the same business values should be considered equivalent even when created as separate instances. Reference equality alone may cause a system to count the same delivery location twice; arbitrary normalization may instead merge different addresses incorrectly.</p>
      <p>A value object therefore needs meaningful value components, immutability, and an explicit normalization policy. In this example, whitespace and capitalization are normalized before comparing <code>equals</code> and <code>hashCode</code>.</p>
      <h3>3. How to observe the results</h3>
      <p>Execute <code>GET /case-studies/group/10/case/3/execute</code>; look for <code>PASS: normalized value equality</code> in stdout if all assertions succeed. The method does not return an address list or comparison JSON.</p>
      <p>Compare the outcomes: two incorrectly modeled Address objects have identical contents but are not reference-equal; two value objects with differently spaced and capitalized versions of <code>Số 1 / Hà Nội</code> are equal, have matching hashes, and occupy a single set element. A blank street name is also rejected as invalid, preventing meaningless value objects.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates that <strong>value equality depends on normalized values, not memory addresses</strong>. Immutability, validation, and consistent normalization make value objects safe to compare and use in collections.</p>
    usage: true
  executeCase4():
    execution: |
      <h3>1. Purpose of this method in the topic</h3>
      <p>Money is a value object holding both an amount and a currency. This scenario shows that choosing a data type is also a domain-model design decision: <code>double</code> represents decimal values in binary, so adding monetary amounts can introduce precision errors even when the values look simple.</p>
      <p>The model uses <code>BigDecimal</code> constructed from strings for precise addition and rejects adding Money values with different currencies. This encapsulates <strong>precision and currency invariants</strong> in the value object rather than requiring every caller to remember them.</p>
      <h3>3. How to observe the results</h3>
      <p>Call <code>GET /case-studies/group/10/case/4/execute</code> and inspect stdout; <code>PASS: precise Money addition</code> is printed once the assertions pass, rather than a balance being returned over HTTP.</p>
      <p>The example first checks that <code>0.1 + 0.2</code> using <code>double</code> does not equal exactly <code>0.3</code>. Two USD amounts, <code>0.10</code> and <code>0.20</code>, then sum to <code>0.30</code>; adding <code>0.70</code> produces <code>1.00</code>, while adding USD and EUR must be rejected. These signals verify only the demo's addition and currency guard, not the complete rounding policy of a financial system.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates that <strong>Money needs its own domain behavior and constraints</strong>, not merely a numeric value. Encapsulating precision and currency in a value object helps prevent subtle calculation errors across use cases.</p>
