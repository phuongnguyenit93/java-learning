      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Một nghiệp vụ đặt chỗ và thanh toán có thể đi qua hai aggregate thuộc hai nguồn lưu trữ khác nhau. Transaction cục bộ của một nguồn không thể tự rollback thao tác đã hoàn tất tại nguồn còn lại; vì vậy cần thiết kế rõ <strong>quy trình phối hợp và bù trừ</strong> khi một bước thất bại.</p>
      <p>Tình huống dùng Saga để minh họa rằng trạng thái nghiệp vụ cuối cùng phụ thuộc vào cả hành động thuận và compensation. Đây là nguyên lý nhất quán giữa các boundary, không phải lời hứa về một distributed ACID transaction.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/10/case/8/execute</code> và xem stdout để tìm <code>PASS: compensating flow illustrated</code>. Phần demo chỉ dùng <code>BookingStore</code> và <code>BillingStore</code> trong bộ nhớ, không kết nối hai database thật, nên không có transaction trace hoặc bản ghi DB bên ngoài để truy vấn.</p>
      <p>Trong nhánh thanh toán không thành công, Saga trả kết quả thất bại và cả cờ <code>reserved</code> lẫn <code>charged</code> được kiểm tra ở trạng thái false sau bù trừ. Với nhánh thành công, cả hai cờ được kiểm tra ở trạng thái true. Hai kiểm tra này thể hiện cách phối hợp giữa reserve, charge và compensation, chưa chứng minh được resilience khi mất mạng hoặc crash giữa các bước.</p>
      <h3>4. Kết luận</h3>
      <p>Như vậy, method minh chứng rằng <strong>nhiều aggregate ở các persistence boundary cần một quy trình bù trừ có chủ đích</strong>. Saga quản lý tiến trình nghiệp vụ và kết quả sau lỗi, không biến các giao dịch địa phương thành một transaction toàn cục.</p>
