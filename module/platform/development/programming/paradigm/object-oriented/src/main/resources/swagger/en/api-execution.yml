  executeCase5():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Aggregate root có trách nhiệm bảo toàn các quy tắc nội bộ của toàn bộ cụm object, không chỉ cung cấp danh sách child để caller sửa tùy ý. Tình huống đơn hàng cho thấy khi child quantity bị thay đổi trực tiếp, <code>storedTotal</code> có thể không còn tương ứng với các item; dữ liệu của cùng một aggregate đã tự mâu thuẫn.</p>
      <p>Thay vì để lộ mutable child, aggregate quản lý thao tác thêm item, kiểm tra số lượng hợp lệ, tính tổng từ trạng thái đang sở hữu và cung cấp danh sách chỉ đọc. Bài học là <strong>encapsulation bảo vệ invariant</strong>, không đơn thuần ẩn field.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/10/case/5/execute</code> và xem dòng <code>PASS: aggregate derived total</code> trong console nếu các phép kiểm tra hoàn thành. Controller trả <code>void</code>; danh sách item và số tổng không được serialize thành response.</p>
      <p>Phần thiết kế sai cho phép sửa <code>qty</code> mà tổng lưu sẵn không đổi. Phần đúng kiểm tra thêm hai đơn vị giá <code>100</code> cho tổng <code>200</code>, từ chối số lượng âm, đồng thời chặn việc <code>clear()</code> collection trả ra. Sau các thử nghiệm vi phạm, tổng vẫn bằng <code>200</code> và aggregate còn một item: các thao tác bên ngoài không phá được invariant.</p>
      <h3>4. Kết luận</h3>
      <p>Như vậy, method minh chứng rằng <strong>aggregate root là ranh giới kiểm soát thay đổi trạng thái liên quan</strong>. Khi mọi thao tác đi qua hành vi có guard, tổng dẫn xuất và danh sách child vẫn nhất quán trước khi bước sang persistence boundary.</p>
