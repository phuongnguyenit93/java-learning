      <p>The example exposes the <strong>field hiding</strong> trap: identically named parent and child fields occupy separate storage, and Java selects a field by the access expression's static type. Unlike overridden instance methods, fields do not dispatch to the runtime object's version. Using one private state field and meaningful accessors reduces ambiguity about data ownership in inheritance.</p>
