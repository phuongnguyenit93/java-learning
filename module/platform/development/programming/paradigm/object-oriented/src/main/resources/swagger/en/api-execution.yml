      <h3>1. Purpose of this method in the topic</h3>
      <p>Within <strong>OBJECT_ORIENTED_PROGRAMMING</strong>, the method explains why <code>equals()</code> and <code>hashCode()</code> must rely on stable identity when an object is used as a <code>HashMap</code> key or <code>HashSet</code> element. A display name may change, but renaming must not prevent lookup by business ID.</p>
      <h3>3. How to observe the results</h3>
      <p>Start the Java application with JVM assertions enabled via <code>-ea</code>, then call <code>GET /case-studies/group/11/case/1/execute</code>. Set breakpoints around renaming and lookups: the hash must be identical before and after the name change; the map must still return <code>active</code> for both the original object and a new object with the same ID <code>C-1</code>, while the set must still contain exactly one customer. The method uses internal <code>assert</code> statements; it neither prints lookup results nor returns them in the HTTP body. Without <code>-ea</code>, these assertions are not executed.</p>
      <h3>4. Conclusion</h3>
      <p>Thus, the method demonstrates <strong>an equality contract consistent with hash-based collections</strong>: using an immutable ID for identity preserves element lookup even when other attributes change. This is a design principle for object keys, not a prohibition against all mutable object state.</p>
