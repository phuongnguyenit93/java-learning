      - id: B
        answer: "Return FAILURE with a reason rather than pretending payment succeeded."
        explanation: "An input eligible for processing does not guarantee successful payment."
      - id: C
        answer: "Return nothing because the provider was invoked."
        explanation: "The contract must define observable failure."
      - id: D
