      anchor: "oop-object-identity"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Two accounts with the same balance should be treated as one business entity even when their identifiers and histories differ."
        explanation: "Equal balances do not prove entity identity."
      - id: B
        answer: "The money values differ because they were created at different times."
        explanation: "Value equality can depend on contents, not allocation."
      - id: C
        answer: "Identity is defined solely by variable allocation syntax in every language."
        explanation: "Identity should reflect domain meaning."
      - id: D
        answer: "A/B are distinct identities despite equal balances; money values may be equal by content."
        explanation: "Entity identity differs from value equality; withdrawing from A must not affect B."
    correctAnswerId: D
  - id: "oop-quiz-08"
    question: "Account A has balance100. How do canWithdraw(30) and withdraw(30) differ?"
    aiGenerated: true
    reviewed: false
