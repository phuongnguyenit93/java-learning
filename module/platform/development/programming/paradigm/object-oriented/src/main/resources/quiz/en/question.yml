      anchor: "oop-behavior-owner"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Checkout should validate funds first, then tell Account to store the computed balance."
        explanation: "The caller should not replace the invariant's owner."
      - id: B
        answer: "An application service approves from a cached balance; Account only persists the result."
        explanation: "A cached service-side decision can be stale and bypass Account's responsibility for enforcing its current invariant."
      - id: C
        answer: "FeePolicy approves against the fee-adjusted balance while Account merely commits."
        explanation: "FeePolicy may compute charges, but Account remains the authority for withdrawal eligibility and state changes."
      - id: D
