    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Notification and balance protection are mixed within one responsibility boundary."
        explanation: "Independent reasons to change should not unnecessarily alter the same logic."
      - id: B
        answer: "Put email and balance validation into Account, adding local variables so messaging can evolve without a separate collaborator."
        explanation: "Variable count does not explain cross-responsibility coupling."
      - id: C
        answer: "Every object must own notifications and money to reduce class count."
        explanation: "Combining unrelated responsibilities amplifies changes."
      - id: D
        answer: "Notifier should decide whether funds can be debited before sending."
        explanation: "Account owns balance rules, not the Notifier."
    correctAnswerId: A
  - id: "oop-quiz-15"
    question: "Checkout needs to know whether Account A may withdraw 50. Who should own the final decision?"
    aiGenerated: true
