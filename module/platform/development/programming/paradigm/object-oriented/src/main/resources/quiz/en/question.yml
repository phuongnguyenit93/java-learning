# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: "oop-quiz-01"
    question: "Two accounts both show balance 100. Why can they still be distinct objects?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ObjectOrientedProgramming.md"
      anchor: "oop-what"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Matching balances mean the accounts must have the same identity."
        explanation: "Equal observable balances do not prove that the same account is being used."
      - id: B
        answer: "Because each account has a distinct identity and responsibility."
        explanation: "Equal balances do not make accounts the same entity; withdrawing from A must not change B."
      - id: C
        answer: "Because an object exists only while its state changes."
        explanation: "Immutable objects are still objects."
      - id: D
        answer: "Because their source classes must differ to allow two identities."
        explanation: "Objects instantiated from one class can still have distinct business identities."
    correctAnswerId: B
  - id: "oop-quiz-02"
    question: "A screen, batch job, and checkout duplicate overdraft checks. What should change when policy evolves?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ObjectOrientedProgramming.md"
      anchor: "oop-why"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Let the Account responsibility boundary own sufficient-funds decisions."
        explanation: "One shared contract prevents callers from drifting into inconsistent rules."
      - id: B
        answer: "Keep three separate checks in their callers and synchronize them with a checklist whenever overdraft policy changes."
        explanation: "Copied checks can diverge on the next change."
      - id: C
        answer: "Let Checkout modify balance directly when batch cannot."
        explanation: "Scattered write authority undermines invariants."
      - id: D
        answer: "Move the rule into an interface while callers still compute balances."
        explanation: "An interface name cannot fix dispersed decision authority."
    correctAnswerId: A
  - id: "oop-quiz-03"
    question: "One procedure withdraw(account,amount) already validates the balance correctly. Which assessment is fair?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ObjectOrientedProgramming.md"
      anchor: "oop-before"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Convert the correct procedure into an Account class despite no distinct lifecycle to protect."
        explanation: "Procedures can have preconditions and postconditions."
      - id: B
        answer: "Separate account data cannot reliably distinguish accounts with equal balances."
        explanation: "The account parameter identifies the entity independently of whether withdrawal is organized as a procedure or object behavior."
      - id: C
        answer: "A named withdraw procedure is sufficient to block all other AccountData writers."
        explanation: "A separate function does not automatically restrict writes."
      - id: D
        answer: "The procedure is valid; consider OOP as ownership and collaborations grow."
        explanation: "The design trade-off is responsibility ownership, not whether subtraction is correct."
    correctAnswerId: D
  - id: "oop-quiz-04"
    question: "Checkout requests 30 from Account A holding 100. Which interaction preserves responsibility?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ObjectOrientedProgramming.md"
      anchor: "oop-solution"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Have Checkout perform the funds check and call setBalance(70), because the caller knows the requested amount better than Account."
        explanation: "The caller bypasses the account invariant boundary."
      - id: B
        answer: "Checkout sends the withdrawal to A and B because they have equal balances."
        explanation: "Equal values do not merge identity."
      - id: C
        answer: "Checkout calls A.withdraw(30); A validates, stores 70, then reports the outcome."
        explanation: "The caller requests behavior; the account owns its state transition."
      - id: D
        answer: "Account only prints a message; Checkout decides whether withdrawal is valid."
        explanation: "The account owner should enforce its balance rules."
    correctAnswerId: C
  - id: "oop-quiz-05"
    question: "A model describes identity, invariants and contracts without Java keywords. Is it still OOP knowledge?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ObjectOrientedProgramming.md"
      anchor: "oop-boundary"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "No; an OOP model must begin with Java class, interface and private declarations."
        explanation: "Encapsulation is a behavioral boundary; private is one implementation tool."
      - id: B
        answer: "Yes; it models responsibilities independently of class/interface syntax."
        explanation: "Paradigm reasoning can precede Java-specific access and dispatch mechanics."
      - id: C
        answer: "No; contracts exist only as compiled Java interfaces."
        explanation: "Contracts include observable outcomes and failure semantics."
      - id: D
        answer: "Yes, and the model alone makes transfers atomic."
        explanation: "A responsibility diagram does not create transaction guarantees."
    correctAnswerId: B
  - id: "oop-quiz-06"
    question: "A beginner wants to explain rejected withdrawals and later polymorphism. Which learning order is sound?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ObjectOrientedProgramming.md"
      anchor: "oop-learning-path"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Identity/state → invariants → responsibility/contracts → polymorphism → trade-offs."
        explanation: "Each stage provides the basis for reasoning about behavioral substitutability."
      - id: B
        answer: "Learn inheritance and payment variants first, then infer responsibility for account invariants from method names."
        explanation: "Inheritance does not define identity or state ownership."
      - id: C
        answer: "Study transactions first and assume invariants are automatic."
        explanation: "Transactions do not replace behavioral contracts."
      - id: D
        answer: "Learn polymorphism first and skip contracts when method names match."
        explanation: "Equal method names do not guarantee substitutability."
    correctAnswerId: A

  - id: "oop-quiz-07"
    question: "A and B each hold 100, while two money values read 100 VND. Which distinction is correct?"
    aiGenerated: true
