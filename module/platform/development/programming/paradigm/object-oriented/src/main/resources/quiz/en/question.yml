      anchor: "oop-state-behavior"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Both canWithdraw and withdraw must update balance because both accept the same amount."
        explanation: "Equal parameters do not determine side effects."
      - id: B
        answer: "canWithdraw must be static because it does not mutate."
        explanation: "Read-only behavior can still belong to an instance."
      - id: C
        answer: "canWithdraw may only read; withdraw may write if authorized."
        explanation: "Object behavior does not imply every call mutates state."
      - id: D
        answer: "withdraw must update even when funds are insufficient."
        explanation: "Writes are subject to preconditions and rejection."
    correctAnswerId: C
  - id: "oop-quiz-09"
    question: "Checkout directly assigns balance=-50. Which redesign actually protects Account?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
