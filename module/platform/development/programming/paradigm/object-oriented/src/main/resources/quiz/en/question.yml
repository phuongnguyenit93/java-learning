      anchor: "oop-encapsulation-purpose"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Rename balance to _balance and require each caller to check funds manually before writing the field."
        explanation: "Renaming cannot prohibit invalid writes."
      - id: B
        answer: "Make Account own a withdrawal operation that validates funds at its boundary."
        explanation: "Encapsulation protects decision authority and invariants, not mere naming."
      - id: C
        answer: "Let Checkout call setBalance after doing checks in several places."
        explanation: "Scattered callers still own potentially inconsistent validation."
      - id: D
        answer: "Expose a getter but leave an unrestricted setter."
        explanation: "An unrestricted setter still breaks the invariant."
    correctAnswerId: B
  - id: "oop-quiz-10"
    question: "Balance=70 and withdraw(120) is requested. Which trace preserves balance≥0?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.EncapsulationAbstraction/EncapsulationAbstraction.md"
      anchor: "oop-object-invariants"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Reject and leave 70, without storing any negative intermediate balance."
        explanation: "Invariants constrain valid observable states, not all changes."
      - id: B
        answer: "Allow a temporary -50 and undo it later, since the invariant matters on the next request."
        explanation: "Arithmetic correctness cannot legitimize a forbidden negative state."
      - id: C
        answer: "Store -50 temporarily and promise to undo it after exposing the value."
        explanation: "An invalid state was exposed through the boundary."
      - id: D
        answer: "Reset to 100 because an earlier example started there."
        explanation: "A rejected operation must preserve the current 70."
    correctAnswerId: A
  - id: "oop-quiz-11"
    question: "An Account changes 100→70 validly; an immutable record contains amount=-5. What is correct?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.EncapsulationAbstraction/EncapsulationAbstraction.md"
      anchor: "oop-invariant-vs-immutability"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "An immutable record is valid because its forbidden amount cannot later change."
        explanation: "An invalid amount remains invalid even when it cannot later be modified."
      - id: B
        answer: "An invariant forbids Account moving from 100 to 70."
        explanation: "The predicate balance≥0 still holds after withdrawal."
      - id: C
        answer: "An invariant is preserved only when the object's balance never changes."
        explanation: "A balance may change from 100 to 70 while remaining nonnegative."
      - id: D
        answer: "A changing state can preserve an invariant; immutable data may start invalid."
        explanation: "Preserved predicates and immutable values are distinct; construction requires validation."
    correctAnswerId: D
