    description: '<p>Nhận 1–50 yêu cầu gồm <code>STANDARD</code>, <code>EXPRESS</code> hoặc <code>PICKUP</code>, giá trị đơn và trọng lượng. Mỗi dòng trả phí/ETA
      của thuật toán switch cũ và <code>DeliveryPolicy</code> mới, cờ <code>equivalent</code> riêng cùng <code>allEquivalent</code> toàn batch.</p>

      <p>Mô hình cũ dùng <code>LegacyDeliveryCalculator</code>, còn service mới chọn <code>StandardDeliveryPolicy</code>, <code>ExpressDeliveryPolicy</code>, <code>PickupDeliveryPolicy</code>
      theo enum rồi dispatch qua interface. STANDARD miễn phí từ giá trị đơn 500000; EXPRESS có phí theo kilogram; PICKUP bằng 0. Đây là đối chiếu hành vi sau Replace
      Conditional with Polymorphism, không phải giao hàng thật.</p>'
