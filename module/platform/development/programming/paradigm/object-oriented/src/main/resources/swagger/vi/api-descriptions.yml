CompositionExperimentController:
  notification(NotificationRequest):
    summary: Kết hợp Formatter, Transport và decorator để mô phỏng gửi thông báo
    description: '<p>Nhận thông tin đơn hàng, người nhận, số tiền, định dạng <code>FULL</code>/<code>COMPACT</code>, kênh <code>EMAIL</code>/<code>SMS</code> và tùy
      chọn audit. Service kết hợp <code>Formatter</code> với <code>RecordingTransport</code>, có thể bọc bằng <code>AuditedTransport</code>, rồi ủy quyền cho
      <code>Notifier</code>.</p>

      <p>Phản hồi gồm nội dung đã định dạng, trạng thái chấp nhận và trace theo thứ tự. Nếu transport từ chối, decorator audit không ghi thành công giả.
      API minh họa Strategy, Decorator và delegation qua các đối tượng cộng tác có thể thay thế, không gửi thông báo thật.</p>'
    enableVideoYoutube: false
    videoYoutubeId: ID của video youtube chèn vào description trong API
    videoYoutubeTitle: Tiêu đề của video
    readmeRelated:
      file: ''
      anchor: ''
