    usage: true
  policies(PolicyRequest):
    summary: Thay chính sách tính giá và truyền policy riêng cho một lần báo giá
    description: '<p>Khởi tạo <code>SwitchablePricing</code> với chính sách <code>NONE</code>, <code>FIXED</code> hoặc <code>PERCENT</code>, rồi xử lý tối đa 20 bước
      <code>SWITCH</code>, <code>QUOTE</code> hoặc <code>QUOTE_WITH_POLICY</code>. Timeline ghi chính sách đang hoạt động, chính sách thực sự được áp dụng, giá gốc
      và số tiền phải trả.</p>

      <p><code>SWITCH</code> thay đối tượng cộng tác trong <code>AtomicReference</code>; <code>QUOTE_WITH_POLICY</code> truyền chính sách tạm chỉ cho một lần
      báo giá mà không thay đổi chính sách đang hoạt động. Chính sách bất biến và trạng thái tính giá chỉ tồn tại trong request.</p>'
    enableVideoYoutube: false
    videoYoutubeId: ID của video youtube chèn vào description trong API
    videoYoutubeTitle: Tiêu đề của video
    readmeRelated:
