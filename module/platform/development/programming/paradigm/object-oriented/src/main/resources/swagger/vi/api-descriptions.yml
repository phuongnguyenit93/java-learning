    summary: Quan sát trách nhiệm đóng tài nguyên được sở hữu hoặc được mượn
    description: '<p>Tạo một <code>TrackedHandle</code> mô phỏng và ghép với <code>Exporter</code>. Khi dùng <code>OWNED</code>, exporter có trách nhiệm đóng cả
      handle lúc chính nó đóng; với <code>BORROWED</code>, exporter chỉ đóng bản thân còn bên gọi sẽ đóng handle sau đó.</p>

