    description: '<p>Nhận <code>channel</code> EMAIL hoặc SMS, người nhận, sự cố, số lần lỗi tạm thời và giới hạn lượt thử. <code>AlertDispatcher</code> không kế
      thừa lớp gửi tin mà nhận <code>MessageChannel</code>; <code>RetryingChannel</code> bọc <code>RecordingMessageChannel</code> để retry riêng lỗi <code>TemporaryDeliveryFailure</code>.</p>

      <p>Trả <code>delivered</code>, số lượt thử, danh sách sự kiện và thông điệp thực sự được ghi trong mô phỏng, với <code>outcome</code> là <code>DELIVERED</code>
