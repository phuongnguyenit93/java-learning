    summary: Đặt đơn hàng qua OrderService với repository được truyền vào
    description: '<p>Nhận ID đơn hàng và từ 1 đến 20 dòng hàng để tạo <code>OrderPlacement.Order</code> với danh sách dòng hàng bất biến. <code>OrderService</code>
      nhận <code>OrderRepository</code> qua constructor rồi gọi <code>save</code>, tách quy tắc nghiệp vụ khỏi chi tiết lưu trữ.</p>

      <p><code>InMemoryOrderRepository</code> có thể chủ động từ chối lưu để chứng minh một lần lưu thất bại không được báo thành công. Phản hồi gồm trạng thái
