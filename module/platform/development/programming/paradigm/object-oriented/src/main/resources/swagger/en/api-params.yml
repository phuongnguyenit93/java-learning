request:
  summary: API request data
  description: The request parameter receives data in the DTO type declared by each controller method. Required fields and validation rules depend on the endpoint;
    consult its API cases for concrete inputs.
  usage: true
input:
  summary: API input data
  description: The input parameter receives data in the Java type declared by the endpoint. Its fields and values depend on that API; there is no universal payload
    across this module.
  usage: true
