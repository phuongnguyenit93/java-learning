InterfaceExperimentsController:
  description: '<h2>Thí nghiệm hợp đồng và vai trò của interface Java</h2>

    <p><code>InterfaceExperimentsController</code> cung cấp ba API để học cách lập trình theo hợp đồng: so sánh phí giao hàng giữa hai triển khai <code>ShippingFeePolicy</code>,
    dùng một <code>DocumentWorkspace</code> qua ba interface nhỏ và thay thế cổng thanh toán/kho lưu trữ qua các interface độc lập.</p>

    <p>Controller chỉ điều phối JSON sang <code>InterfaceExperimentsService</code>. Tất cả đối tượng thanh toán, lưu trữ và tài liệu đều được khởi tạo riêng cho request;
    không có thanh toán thật hay dữ liệu bền vững. Lỗi đầu vào được <code>InterfaceExperimentsExceptionHandler</code> ánh xạ thành HTTP 400; exception trạng thái
    hoặc số học chưa được bắt trong service tương ứng HTTP 422.</p>'
  readmeRelated:
    file: ''
LanguageMechanicsExperimentsController:
  description: '<h2>Thí nghiệm cơ chế ngôn ngữ Java trong OOP</h2>

    <p><code>LanguageMechanicsExperimentsController</code> cung cấp ba API POST minh họa generic type, bounded wildcard, hợp đồng equals/hashCode của object, đóng
    gói trạng thái và biểu diễn chẩn đoán an toàn, cũng như đa hình qua interface.</p>

    <ul><li><code>generics</code>: ghép Integer/Double bằng PECS, tính tổng BigDecimal, tìm giá trị lớn nhất và tra cứu <code>TypedCache&lt;String,Integer&gt;</code>.</li><li><code>stock</code>:
    dùng record ProductKey làm khóa tồn kho, bảo vệ số lượng và lọc thông tin nhạy cảm trong <code>toString()</code>.</li><li><code>shipping</code>: lựa chọn StandardShipping
    hoặc ExpressShipping qua interface <code>ShippingPolicy</code> và trả từng báo giá.</li></ul>

    <p>Mỗi request xử lý trên đối tượng trong bộ nhớ, không gửi hàng thật. Các lỗi dữ liệu, null hoặc số học không hợp lệ trả HTTP 400 với <code>error=INVALID_INPUT</code>;
    từ chối nghiệp vụ dự kiến nằm trong DTO HTTP 200.</p>'
  readmeRelated:
    file: ''
