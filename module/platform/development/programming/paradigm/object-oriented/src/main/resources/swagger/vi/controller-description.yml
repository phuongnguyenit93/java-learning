ObjectExperimentsController:
  description: '<h2>Thực hành về đối tượng Java</h2>

    <p><code>ObjectExperimentsController</code> cung cấp năm API minh họa danh tính/tham chiếu, phép bằng nhau theo giá trị, sao chép nông/sâu, dữ liệu vắng mặt và
    sự phối hợp giữa các đối tượng trong checkout mô phỏng. Các phép thử đều có trạng thái riêng theo request, trả JSON qua các record trong <code>ObjectExperimentDto</code>.</p>

    <p>Controller ủy quyền cho <code>ObjectSemanticsService</code> và <code>ObjectCheckoutService</code>. <code>ObjectExperimentExceptionHandler</code> biến <code>IllegalArgumentException</code>
    thành HTTP 400 với trường <code>error</code>. Checkout không thu tiền thật, lưu kho hay gửi thông báo ra ngoài.</p>'
  readmeRelated:
    file: ''
BasicsExperimentController:
  description: '<h2>Mô phỏng nền tảng hướng đối tượng</h2>

    <p><code>BasicsExperimentController</code> cung cấp ba API POST độc lập để quan sát trạng thái đối tượng, đóng gói quy tắc nghiệp vụ và đa hình qua kết quả có
    thể kiểm chứng. Các API nhận DTO JSON, chuyển xử lý cho <code>BasicsExperimentService</code> và trả lại DTO kết quả thay vì lưu dữ liệu.</p>

    <ul><li>Mô phỏng nạp/rút tiền trên <code>BankAccount</code> mới, theo dõi từng thay đổi số dư.</li><li>Mô phỏng thêm dòng hàng, xác nhận/hủy trên <code>OrderAggregate</code>
    mới, quan sát quy tắc chuyển trạng thái.</li><li>Áp dụng hai hiện thực <code>ShippingPolicy</code> cho cùng dữ liệu để so sánh phí.</li></ul>

    <p>Đây là các thí nghiệm trong bộ nhớ, không phải tài khoản ngân hàng, đơn hàng hoặc dịch vụ giao vận thật. <code>BasicsExperimentExceptionHandler</code> chuyển
    lỗi đầu vào <code>IllegalArgumentException</code> chưa được xử lý thành HTTP 400 kèm <code>INVALID_INPUT</code>; lỗi hành động được bắt bên trong vòng lặp mô
    phỏng sẽ xuất hiện trong <code>timeline</code> của HTTP 200.</p>'
  readmeRelated:
    file: ''
PolymorphismExperimentsController:
  description: '<h2>Thực hành đa hình trong Java</h2>

    <p><code>PolymorphismExperimentsController</code> phơi bày hai thí nghiệm độc lập qua JSON. <code>dispatch</code> chứng minh overload được chọn theo kiểu tham
    số lúc biên dịch, override được chọn theo receiver lúc chạy, còn field và static method bị che khuất. <code>payments</code> thử ba implementation của <code>PaymentMethod</code>
    gồm CARD, WALLET và BANK.</p>

    <p>Controller chỉ chuyển request cho <code>PolymorphismExperimentsService</code>. Mọi số dư và trạng thái đều thuộc request mô phỏng, không thanh toán thật hay
    lưu dữ liệu bền vững. <code>PolymorphismExceptionHandler</code> ánh xạ đầu vào sai thành HTTP 400, và lỗi trạng thái/số học chưa được xử lý thành HTTP 422.</p>'
  readmeRelated:
    file: ''
PracticeExperimentController:
  description: '<h2>Thí nghiệm tổng hợp OOP: tài khoản, đơn hàng và thư viện</h2>

    <p><code>PracticeExperimentController</code> cung cấp ba API POST để thực hành thiết kế đối tượng và bảo vệ bất biến với tình huống gần nghiệp vụ thực tế. Controller
    mỏng nhận JSON rồi chuyển cho <code>PracticeExperimentService</code>; model sở hữu phép tính, điều kiện hợp lệ và việc chuyển trạng thái.</p>

    <ul><li><code>bank</code> thực hiện DEPOSIT/WITHDRAW/TRANSFER trên <code>BankLedger</code> có nhiều tài khoản, kèm snapshot trước/sau từng hành động.</li><li><code>orders</code>
    tập thao tác <code>PracticeOrder</code>: chỉnh dòng hàng trong DRAFT, PLACE, CANCEL, xem tổng tiền và sự từ chối khi trạng thái không phù hợp.</li><li><code>library</code>
    mô phỏng <code>PracticeLibrary</code> với bản sách vật lý, phiếu mượn, trả sách và thay chính sách LEGACY sang REVISED.</li></ul>

    <p>Đây là các đối tượng in-memory riêng cho từng request: không có tài khoản ngân hàng, thanh toán, kho thư viện hoặc database thật. Vi phạm nghiệp vụ dự kiến
    có thể được trả trong <code>steps[].accepted=false</code> cùng snapshot không thay đổi; đầu vào sai trước khi chạy trả HTTP 400, còn lỗi trạng thái/số học không
    bắt tại tầng service trả HTTP 422 theo advice của chương.</p>'
  readmeRelated:
    file: ''
RefactoringExperimentsController:
  description: '<h2>Thí nghiệm refactoring có kiểm thử bảo vệ</h2>

    <p><code>RefactoringExperimentsController</code> cung cấp ba API POST để kiểm chứng sự tương đương hành vi khi thay đổi thiết kế bên trong: tách phương thức/lớp
    và chuyển phép tính về đúng đối tượng, thay điều kiện theo loại bằng đa hình, và thay phụ thuộc kế thừa cứng bằng các collaborator được ghép qua interface.</p>

    <ul><li><code>checkout</code> so sánh chương trình tính tiền đơn khối với mô hình <code>ShoppingOrder</code>, <code>OrderLine</code>, <code>PricingPolicy</code>
    và <code>ReceiptFormatter</code>.</li><li><code>delivery</code> đối chiếu <code>LegacyDeliveryCalculator</code> dùng switch với <code>DeliveryPolicy</code> theo
    từng loại giao hàng.</li><li><code>alerts</code> lắp <code>AlertDispatcher</code>, <code>RecordingMessageChannel</code> và <code>RetryingChannel</code> để xem
    kết quả gửi và retry.</li></ul>

    <p>Thí nghiệm dùng giá tiền nguyên VND và collaborator trong bộ nhớ; không gửi cảnh báo thật hoặc giao vận thật. Service trả kết quả quan sát được, không tự chỉnh
    Java source. Đầu vào sai hoặc số học tràn được <code>RefactoringExceptionHandler</code> chuyển thành HTTP 400 với <code>error=INVALID_INPUT</code>, còn thất bại
    gửi tạm thời sau hết retry là HTTP 200 với <code>RETRY_EXHAUSTED</code>.</p>'
