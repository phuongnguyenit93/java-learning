RelationshipsExperimentsController:
  description: '<h2>Thực nghiệm quan hệ đối tượng trong Java</h2>

    <p><code>RelationshipsExperimentsController</code> minh họa ba dạng quan hệ: liên kết hai chiều giữa nhân viên và phòng ban; quan hệ nhiều–nhiều giữa học viên
    và khóa học; và tập hợp (aggregation) đối chiếu với hợp thành (composition) qua Team/Member và Order/OrderLine.</p>

    <p>Controller nhận DTO JSON rồi chuyển tới <code>DepartmentTransferService</code>, <code>EnrollmentScenarioService</code> và <code>OwnershipComparisonService</code>.
    Model quản lý hướng liên kết, bất biến hai chiều, vòng đời của liên kết cùng thành phần được sở hữu; mọi dữ liệu mô phỏng chỉ nằm trong một request và trong bộ
    nhớ.</p>

    <p><code>RelationshipsExceptionHandler</code> áp dụng riêng cho chương, ánh xạ IllegalArgumentException thành HTTP 400, IllegalStateException thành HTTP 409 và
    ArithmeticException thành HTTP 422. Phòng ban đầy hoặc ghi danh trùng được thể hiện là event bị từ chối trong response HTTP 200.</p>'
  readmeRelated:
    file: ''
SolidExperimentController:
  description: '<h2>Thực nghiệm các nguyên tắc SOLID trong Java</h2>

    <p><code>SolidExperimentController</code> cung cấp hai API thực nghiệm: tính báo giá qua các <code>DiscountPolicy</code> và chạy chuỗi checkout sử dụng các cổng
    <code>OrderWriter</code>/<code>ReceiptSender</code>. Qua đó có thể thấy trách nhiệm được phân tách, hành vi chính sách có thể mở rộng và phụ thuộc của nghiệp
    vụ hướng về hợp đồng.</p>

    <p>Ví dụ minh họa SRP qua <code>PurchaseOrder</code>, <code>DiscountPricing</code> và <code>CheckoutUseCase</code>; OCP và LSP qua các implementation chính sách
    giảm giá; ISP qua cổng đọc/ghi đơn tách biệt; DIP qua use case phụ thuộc interface và DI qua constructor. Spring cung cấp danh sách policy cho service; các adapter
    lưu đơn/gửi biên nhận trong chương là mô phỏng in-memory, không lưu database hoặc gửi email.</p>

    <p><code>SolidExperimentExceptionHandler</code> xử lý riêng Controller này: request sai trả HTTP 400, lỗi hợp đồng policy hoặc tràn số ở API quote trả HTTP 422.
    Trong checkout experiment, lỗi của mỗi attempt thường được ghi trong response HTTP 200 cùng số đơn và thông báo đã mô phỏng, thay vì dừng các attempt sau.</p>'
  readmeRelated:
    file: ''
SubtypingExperimentController:
  description: '<h2>Thực nghiệm kiểu con và tính thay thế trong Java</h2>

    <p><code>SubtypingExperimentController</code> cung cấp ba API để học quan hệ kiểu con: gọi hành vi thanh toán qua interface <code>PaymentMethod</code>, kiểm tra
    hợp đồng <code>DiscountPolicy</code>, và phản ví dụ <code>MutableSquare extends MutableRectangle</code>. Tất cả chạy trong bộ nhớ theo request, không thu tiền
    hoặc ghi dữ liệu thật.</p>

    <p>Bài học phân biệt kiểu khai báo với kiểu runtime, upcast không tạo object mới, dispatch phương thức override với chọn overload theo kiểu compile-time, nominal
    subtyping bằng <code>implements</code> và adapter, và Liskov Substitution Principle (LSP): có quan hệ kiểu con về cú pháp không đảm bảo thay thế đúng hành vi.</p>

    <p><code>SubtypingExperimentExceptionHandler</code> chuyển <code>IllegalArgumentException</code> thành HTTP 400 mã <code>INVALID_INPUT</code>, JSON không khớp
    kiểu thành HTTP 400 mã <code>INVALID_JSON</code>. Các trường hợp vi phạm hợp đồng mô phỏng được ghi trong response HTTP 200, không tự coi là lỗi server.</p>'
  readmeRelated:
    file: ''
TestingExperimentController:
  description: '<h2>Thực nghiệm kiểm thử hợp đồng và cộng tác OOP</h2>

    <p><code>TestingExperimentController</code> cung cấp ba thí nghiệm kiểm chứng hành vi công khai thay vì phụ thuộc private field: so sánh các implementation của
    <code>SeatInventory</code> với máy trạng thái tham chiếu, thay cộng tác viên trong checkout bằng fake/stub/recording object, và phát hiện hồi quy giá tiền giữa
    implementation gốc, bản refactor và bản cố ý có lỗi.</p>

    <p>Ba endpoint chỉ chuyển DTO sang <code>InventoryContractService</code>, <code>CollaborationExperimentService</code> và <code>RegressionExperimentService</code>.
    Các trạng thái và test double được tạo mới theo request; không có tồn kho thật, cổng thanh toán thật hay gửi email. Handler riêng chương ánh xạ <code>IllegalArgumentException</code>
    thành HTTP 400 với <code>code=INVALID_INPUT</code>, còn <code>ArithmeticException</code> thành HTTP 422 với <code>code=ARITHMETIC_OVERFLOW</code>.</p>'
