AbstractionExperimentsController:
  description: '<h2>Thực nghiệm trừu tượng hóa trong Java</h2>

    <p><code>AbstractionExperimentsController</code> minh họa cách người gọi làm việc qua hợp đồng rõ ràng, trong khi cấu trúc dữ liệu và thuật toán cụ thể nằm phía
    sau các service/model. Bốn API độc lập gồm báo giá vận chuyển, đặt và trả ghế, đánh giá nghỉ phép và tìm kiếm sách.</p>

    <p>Ví dụ vận chuyển dùng abstract class <code>ShippingPlan</code> giữ quy trình và cho phép các chính sách giá khác nhau; đặt ghế và nghỉ phép dùng <code>SeatInventory</code>,
    <code>LeavePolicy</code> làm hợp đồng; danh mục ẩn <code>HashMap</code> sau giao diện <code>Catalog</code>. Mỗi lần gọi xử lý dữ liệu mô phỏng trong bộ nhớ, không
    có lưu trữ bền vững.</p>

    <p><code>AbstractionExceptionHandler</code> giới hạn cho Controller này và quy đổi lỗi đầu vào thành HTTP 400, lỗi trạng thái thành HTTP 409 và tràn số thành
    HTTP 422. Một quyết định bị từ chối hợp lệ hoặc thao tác ghế bị từ chối trong kịch bản vẫn có thể trả HTTP 200 với mã kết quả trong body.</p>'
  readmeRelated:
    file: ''
ClassesExperimentController:
  description: '<h2>Thực nghiệm Java Class và Object</h2>

    <p><code>ClassesExperimentController</code> gồm ba API mô phỏng: tồn kho, đăng ký workshop và tài khoản ngân hàng. Mỗi API nhận JSON, chuyển cho <code>ClassesExperimentService</code>,
    tạo object riêng trong bộ nhớ và trả snapshot trước/sau để quan sát thay đổi.</p>

    <p>Chương minh họa field, method, constructor, instance, alias reference, encapsulation và hằng số <code>static final</code>. Mô phỏng tài khoản chỉ dùng một
    request/thread, không có database và không phải hệ thống ngân hàng thật.</p>

    <p>Lỗi đầu vào <code>IllegalArgumentException</code> ngoài vòng lặp action được <code>ClassesExperimentExceptionHandler</code> chuyển thành HTTP 400; lỗi trong
    từng action trở thành bước bị từ chối, trả HTTP 200.</p>'
  readmeRelated:
    file: ''
ClassDesignExperimentsController:
  description: '<h2>Thực nghiệm thiết kế lớp và phân định trách nhiệm</h2>

    <p><code>ClassDesignExperimentsController</code> cung cấp ba API thực hành thiết kế OOP: quản lý mượn/trả sách, checkout giỏ hàng và chuyển tiền giữa hai tài
    khoản. Controller chỉ thực hiện vai trò HTTP adapter; quy tắc nằm trong <code>Loan</code>, <code>LoanPolicy</code>, <code>ShoppingCart</code>, <code>BankAccount</code>,
    <code>Money</code> và các service phù hợp.</p>

    <p>Các thí nghiệm nhấn mạnh cohesion, tách command/query, entity và value object, giới hạn coupling với nơi lưu trữ và tương tác bên ngoài. Repository và receipt
    outbox ở đây đều là đối tượng in-memory riêng cho lời gọi, không phải database hoặc dịch vụ gửi email thật. Handler riêng chương chuyển lỗi đầu vào và số học
    thành HTTP 400, còn <code>IllegalStateException</code> thoát khỏi service thành HTTP 409.</p>'
  readmeRelated:
    file: ''
CompositionExperimentController:
  description: '<h2>Th? nghi?m Composition, Delegation v? quy?n s? h?u</h2>

    <p><code>CompositionExperimentController</code> cung c?p b?n API POST minh h?a ??i t??ng c?ng t?c theo quan h? has-a: l?p b? ??nh d?ng v? transport ?? t?o th?ng
    b?o; thay ch?nh s?ch ??nh gi? khi ch?y; ?y quy?n l?u ??n qua repository; v? ph?n ??nh ai ph?i ??ng t?i nguy?n.</p>

    <ul><li><code>notification</code> t?o <code>Notifier</code> t? <code>Formatter</code>, <code>Transport</code> v? t?y ch?n decorator audit.</li><li><code>policies</code>
