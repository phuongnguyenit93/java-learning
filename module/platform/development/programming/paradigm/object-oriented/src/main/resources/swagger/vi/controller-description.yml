DesignPatternExperimentController:
  description: '<h2>Thí nghiệm Design Patterns trong Java</h2>

    <p><code>DesignPatternExperimentController</code> mở ba điểm thực hành có thể chạy được: pipeline báo giá thể hiện <code>Strategy</code> và <code>Decorator</code>;
    bảng nhiệm vụ thể hiện <code>Command</code>, undo/redo và <code>Observer</code>; kết xuất báo cáo thể hiện <code>Factory Method</code> và <code>Template Method</code>.
    Mỗi ví dụ đặt pattern vào một vấn đề cụ thể, thể hiện ích lợi và đánh đổi thay vì dùng pattern chỉ vì tên gọi.</p>

    <p>Controller chỉ là HTTP adapter, chuyển JSON tới <code>DesignPatternExperimentService</code>; thuật toán và trạng thái nằm trong các model tương ứng. Thí nghiệm
    dùng trạng thái in-memory riêng từng request, không thanh toán, không thông báo ra bên ngoài và không lưu bền vững. Input không hợp lệ trả HTTP 400; lỗi trạng
    thái/số học thoát khỏi service trả HTTP 422 theo handler của riêng chương.</p>'
  readmeRelated:
    file: ''
DesignPitfallExperimentController:
  description: '<h2>Thực nghiệm lỗi thiết kế trong Java OOP</h2>

    <p><code>DesignPitfallExperimentController</code> cung cấp ba API minh họa: bảo vệ bất biến số ghế thay cho setter tùy ý, phân tích lỗi khóa <code>HashMap</code>
    có thể thay đổi và so sánh checkout nguyên khối với phiên bản đã tách trách nhiệm. Controller chỉ chuyển JSON vào <code>DesignPitfallExperimentService</code>,
    không lưu state.</p>

    <p>Các tình huống liên quan đến encapsulation, trạng thái dùng chung, <code>equals</code>/<code>hashCode</code>, God Class và refactor có kiểm chứng. Ghế chỉ
    mô phỏng trong một request/JVM; checkout chỉ tính giá trong bộ nhớ, không khóa tồn kho, thanh toán hay ghi đơn thật.</p>

    <p><code>DesignPitfallExceptionHandler</code> áp dụng riêng chương: <code>IllegalArgumentException</code> trả HTTP 400; <code>IllegalStateException</code> và
    <code>ArithmeticException</code> trả HTTP 422. Lỗi ở từng seat action được lưu thành bước từ chối trong response HTTP 200.</p>'
  readmeRelated:
    file: ''
EncapsulationExperimentController:
  description: '<h2>Thí nghiệm đóng gói đối tượng</h2>

    <p><code>EncapsulationExperimentController</code> cung cấp bốn API mô phỏng ranh giới và quy tắc của đối tượng qua giỏ hàng, sổ theo dõi tồn kho, bản chụp sự
    kiện và vòng đời đơn hàng. Mỗi request đi qua <code>EncapsulationExperimentService</code> để tạo mô hình mới trong bộ nhớ; controller chỉ nhận DTO và trả kết
    quả JSON.</p>

    <p>Người học quan sát cách <code>EncapsulatedCart</code> và <code>StockLedger</code> kiểm tra bất biến, <code>EventSnapshot</code> sao chép phòng vệ cả ở đầu
    vào/đầu ra, và <code>LifecycleOrder</code> chỉ cho phép chuyển trạng thái hợp lệ. Lỗi đầu vào là HTTP 400; ngoại lệ trạng thái hoặc số học thoát khỏi service
    là HTTP 422. Các thao tác bị từ chối trong chuỗi mô phỏng được ghi vào <code>steps</code> mà không làm thay đổi trạng thái.</p>'
  readmeRelated:
    file: ''
InheritanceExperimentsController:
