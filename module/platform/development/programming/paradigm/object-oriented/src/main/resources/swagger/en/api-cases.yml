        NORMAL nor REFERENCE, so the service throws <code>IllegalArgumentException(&quot;book kind must be NORMAL or REFERENCE and data valid&quot;)</code>. The handler
        returns HTTP 400 with the original message in error, without any LibraryResult or history steps.</p>
RefactoringExperimentsController:
  checkout(CheckoutRequest):
    methodName: checkout
    httpMethods:
    - POST
    mappingPaths:
    - /oop/refactoring/checkout/compare
    usage: true
    cases:
    - id: case_001
      title: VIP discount threshold remains equivalent
      description: Refactoring keeps the 10% discount at subtotal 500000 and the same receipt.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          vip: true
          lines:
          - sku: JAVA
            unitPriceVnd: 200000
            quantity: 2
          - sku: OOP
            unitPriceVnd: 100000
            quantity: 1
      status: 200
      response:
        before:
          subtotalVnd: 500000
          discountVnd: 50000
          shippingVnd: 30000
          payableVnd: 450000
          totalVnd: 480000
          receipt: subtotal=500000;discount=50000;shipping=30000;total=480000
        after:
          subtotalVnd: 500000
          discountVnd: 50000
          shippingVnd: 30000
          payableVnd: 450000
          totalVnd: 480000
          receipt: subtotal=500000;discount=50000;shipping=30000;total=480000
        equivalent: true
      detailDescription: <p><code>OrderLine</code> calculates 200000×2 + 100000×1 = 500000 VND. VIP is true and the subtotal reaches the 500000 threshold, so both
        <code>LegacyCheckout</code> and <code>PricingPolicy</code> deduct 50000, leaving payable 450000. That is below 700000, so shipping=30000 and total=480000.
        <code>ReceiptFormatter</code> creates matching before/after receipts. HTTP 200 reports equivalent=true.</p>
    - id: case_002
      title: Free shipping begins at payable 700000
      description: A non-VIP order reaches payable=700000 and shipping is zero.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          vip: false
          lines:
          - sku: BOOK
            unitPriceVnd: 700000
            quantity: 1
      status: 200
      response:
        before:
          subtotalVnd: 700000
          discountVnd: 0
          shippingVnd: 0
          payableVnd: 700000
          totalVnd: 700000
          receipt: subtotal=700000;discount=0;shipping=0;total=700000
        after:
          subtotalVnd: 700000
          discountVnd: 0
          shippingVnd: 0
          payableVnd: 700000
          totalVnd: 700000
          receipt: subtotal=700000;discount=0;shipping=0;total=700000
        equivalent: true
      detailDescription: <p>A single line of price 700000 and quantity=1 produces subtotal=700000. With vip=false there is no discount. <code>PricingPolicy.calculateShipping</code>
        uses payable &gt;= 700000, so shipping becomes zero at the exact threshold. <code>LegacyCheckout</code> preserves the same rule; both totals and receipts
        match, equivalent=true.</p>
    - id: case_003
      title: Negative unit price is rejected before comparison
      description: OrderLine rejects negative pricing and no partial checkout view is returned.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          vip: false
          lines:
          - sku: X
            unitPriceVnd: -2
            quantity: 1
      status: 400
      response:
        error: INVALID_INPUT
      detailDescription: <p><code>CheckoutRefactoringService.compare</code> constructs an <code>OrderLine</code> from input. Its record constructor rejects unitPriceVnd=-2
        with <code>IllegalArgumentException</code> before either pricing implementation runs. <code>RefactoringExceptionHandler</code> maps it to HTTP 400 <code>error=INVALID_INPUT</code>,
        with no before/after view.</p>
  delivery(DeliveryRequest):
    methodName: delivery
    httpMethods:
    - POST
    mappingPaths:
    - /oop/refactoring/delivery/compare
    usage: true
    cases:
    - id: case_001
      title: All delivery variants retain identical fees and ETAs
      description: STANDARD changes fee at 500000; EXPRESS and PICKUP match both implementations.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          deliveries:
          - type: STANDARD
            orderValueVnd: 499999
            weightKg: 2
          - type: STANDARD
            orderValueVnd: 500000
            weightKg: 2
          - type: EXPRESS
            orderValueVnd: 40000
            weightKg: 2
          - type: PICKUP
            orderValueVnd: 1
            weightKg: 1
      status: 200
      response:
        deliveries:
        - type: STANDARD
          before:
            feeVnd: 30000
            etaDays: 5
          after:
            feeVnd: 30000
            etaDays: 5
          equivalent: true
        - type: STANDARD
          before:
            feeVnd: 0
            etaDays: 5
          after:
            feeVnd: 0
            etaDays: 5
          equivalent: true
        - type: EXPRESS
          before:
            feeVnd: 65000
            etaDays: 1
          after:
            feeVnd: 65000
            etaDays: 1
          equivalent: true
        - type: PICKUP
          before:
            feeVnd: 0
            etaDays: 0
          after:
            feeVnd: 0
            etaDays: 0
          equivalent: true
        allEquivalent: true
      detailDescription: <p><code>LegacyDeliveryCalculator</code> uses switch while the refactored service delegates through <code>DeliveryPolicy</code>. STANDARD
        at orderValue 499999 and weight 2 charges 20000+5000×2=30000, ETA 5, but becomes free at 500000. EXPRESS at weight 2 costs 45000+10000×2=65000, ETA 1. PICKUP
        is zero cost and zero days. Every before/after pair matches, allEquivalent=true.</p>
    - id: case_002
      title: Maximum supported weight 1000 kg is quoted
      description: EXPRESS at the upper weight boundary uses checked long arithmetic.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          deliveries:
          - type: EXPRESS
            orderValueVnd: 0
            weightKg: 1000
      status: 200
      response:
        deliveries:
        - type: EXPRESS
          before:
            feeVnd: 10045000
            etaDays: 1
          after:
            feeVnd: 10045000
            etaDays: 1
          equivalent: true
        allEquivalent: true
      detailDescription: <p><code>DeliveryRefactoringService</code> accepts weightKg up to 1000. <code>ExpressDeliveryPolicy</code> computes 45000+10000×1000=10045000
        VND with ETA 1. <code>LegacyDeliveryCalculator</code> uses the same formula so before and after match, allEquivalent=true. An order value of zero is permitted
        for EXPRESS.</p>
    - id: case_003
      title: Unknown delivery type is rejected
      description: UNKNOWN is not a DeliveryType enum value and no policy is dispatched.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          deliveries:
          - type: UNKNOWN
            orderValueVnd: 1
            weightKg: 1
      status: 400
      response:
        error: INVALID_INPUT
      detailDescription: <p>Order value and weight pass validation, but <code>DeliveryType.valueOf(&quot;UNKNOWN&quot;)</code> throws <code>IllegalArgumentException</code>.
        <code>DeliveryRefactoringService</code> rethrows it as an unsupported type and the advice returns HTTP 400 <code>error=INVALID_INPUT</code>, without a partial
        <code>DeliveryResult</code>.</p>
  alerts(AlertRequest):
    methodName: alerts
    httpMethods:
    - POST
    mappingPaths:
    - /oop/refactoring/alerts/experiment
    usage: true
    cases:
    - id: case_001
      title: Two temporary failures followed by success
      description: RetryingChannel allows three attempts and records delivery only on attempt three.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          channel: EMAIL
          recipient: oncall
          incident: Network outage
          transientFailures: 2
          maxAttempts: 3
      status: 200
      response:
        delivered: true
        attempts: 3
        attemptEvents:
        - EMAIL:attempt=1:TEMPORARY_FAILURE
        - EMAIL:attempt=2:TEMPORARY_FAILURE
        - EMAIL:attempt=3:DELIVERED
        deliveredMessages:
        - EMAIL->oncall:[CRITICAL] Network outage
        outcome: DELIVERED
      detailDescription: <p><code>RecordingMessageChannel</code> is configured with transientFailures=2. Attempts one and two log <code>TEMPORARY_FAILURE</code> then
        throw <code>TemporaryDeliveryFailure</code>; <code>RetryingChannel</code> catches and retries. Attempt three logs <code>DELIVERED</code> and the mock message
        <code>EMAIL-&gt;oncall:[CRITICAL] Network outage</code>. HTTP 200 returns delivered=true, attempts=3 and outcome=DELIVERED.</p>
    - id: case_002
      title: Retry exhaustion does not pretend delivery succeeded
      description: All three allowed attempts fail temporarily; no message is recorded as delivered.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          channel: SMS
          recipient: oncall
          incident: Database down
          transientFailures: 5
          maxAttempts: 3
      status: 200
      response:
        delivered: false
        attempts: 3
        attemptEvents:
        - SMS:attempt=1:TEMPORARY_FAILURE
        - SMS:attempt=2:TEMPORARY_FAILURE
        - SMS:attempt=3:TEMPORARY_FAILURE
        deliveredMessages: []
        outcome: RETRY_EXHAUSTED
      detailDescription: <p>The recorder is configured for five temporary failures while <code>RetryingChannel</code> allows maxAttempts=3. Three <code>TEMPORARY_FAILURE</code>
        events are recorded and the decorator rethrows the last failure. <code>AlertRefactoringService</code> catches it, returning HTTP 200 delivered=false, attempts=3
        and outcome=RETRY_EXHAUSTED. <code>deliveredMessages</code> stays empty.</p>
    - id: case_003
      title: Immediate send needs no retry
      description: A new request owns a new recorder and succeeds on the first attempt.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          channel: SMS
          recipient: team
          incident: Recovered
          transientFailures: 0
          maxAttempts: 3
      status: 200
      response:
        delivered: true
        attempts: 1
        attemptEvents:
        - SMS:attempt=1:DELIVERED
        deliveredMessages:
        - SMS->team:[CRITICAL] Recovered
        outcome: DELIVERED
      detailDescription: <p>With transientFailures=0, <code>RecordingMessageChannel.send</code> increments attempts to one and records DELIVERED immediately. No <code>TemporaryDeliveryFailure</code>
        is raised so <code>RetryingChannel</code> performs no more calls. The service returns the in-memory SMS record and DELIVERED. Each request creates its own
        recorder instead of reusing another request counter.</p>
    - id: case_004
      title: Zero maxAttempts is invalid
      description: RetryingChannel enforces an attempt bound from 1 to 5.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          channel: EMAIL
          recipient: oncall
          incident: Outage
          transientFailures: 1
          maxAttempts: 0
      status: 400
      response:
        error: INVALID_INPUT
      detailDescription: <p><code>AlertRefactoringService</code> creates a valid recorder, then attempts to instantiate <code>RetryingChannel</code> with maxAttempts=0.
        The decorator constructor enforces the 1–5 range and throws <code>IllegalArgumentException</code> before the dispatcher sends anything. The advice returns
        HTTP 400 <code>error=INVALID_INPUT</code> with no attempt events.</p>
RelationshipsExperimentsController:
  transfer(TransferRequest):
    methodName: transfer
    httpMethods:
    - POST
    mappingPaths:
    - /oop/relationships/departments/transfer
    usage: true
    cases:
    - id: case_001
      title: Transfer, unassign, and retain an assignment
      description: Observe both association ends over four operations.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          departments:
          - code: A
            capacity: 2
          - code: B
            capacity: 1
          employees:
          - id: E1
            departmentCode: A
          - id: E2
            departmentCode: null
          actions:
          - employeeId: E1
            targetDepartmentCode: B
          - employeeId: E2
            targetDepartmentCode: A
          - employeeId: E1
            targetDepartmentCode: null
          - employeeId: E2
            targetDepartmentCode: A
      status: 200
      response:
        events:
        - step: 1
          employeeId: E1
          previousDepartment: A
          targetDepartment: B
          accepted: true
          reason: MOVED
        - step: 2
          employeeId: E2
          previousDepartment: null
          targetDepartment: A
          accepted: true
          reason: MOVED
        - step: 3
          employeeId: E1
          previousDepartment: B
          targetDepartment: null
          accepted: true
          reason: MOVED
        - step: 4
          employeeId: E2
          previousDepartment: A
          targetDepartment: A
          accepted: true
          reason: UNCHANGED
        departments:
        - code: A
          capacity: 2
          employees:
          - E2
        - code: B
          capacity: 1
          employees: []
        employees:
        - id: E1
          departmentCode: null
        - id: E2
          departmentCode: A
        invariantHolds: true
        simulatedOnly: true
      detailDescription: <p>Initially E1 belongs to A and E2 is unassigned. E1 moves to B, E2 joins A, E1 becomes unassigned, and E2 is assigned to A again. The first
        three events are MOVED, the last is UNCHANGED. The final state has E2 in A, B empty, and invariantHolds=true.</p>
    - id: case_002
      title: Full target preserves the former association
      description: B is full and cannot accept E1 from A.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          departments:
          - code: A
            capacity: 1
          - code: B
            capacity: 1
          employees:
          - id: E1
            departmentCode: A
          - id: E2
            departmentCode: B
          actions:
          - employeeId: E1
            targetDepartmentCode: B
      status: 200
      response:
        events:
        - step: 1
          employeeId: E1
          previousDepartment: A
          targetDepartment: B
          accepted: false
          reason: DEPARTMENT_FULL
        departments:
        - code: A
          capacity: 1
          employees:
          - E1
        - code: B
          capacity: 1
          employees:
          - E2
        employees:
        - id: E1
          departmentCode: A
        - id: E2
          departmentCode: B
        invariantHolds: true
        simulatedOnly: true
      detailDescription: <p>B already contains E2 and has capacity one. move checks destination capacity before detaching E1 from A, so DEPARTMENT_FULL has accepted=false.
        E1 stays in A, E2 stays in B, and the response is HTTP 200.</p>
    - id: case_003
      title: Reject an unknown employee
      description: E9 is absent from the employee set.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          departments:
          - code: A
            capacity: 1
          employees:
          - id: E1
            departmentCode: A
          actions:
          - employeeId: E9
            targetDepartmentCode: A
      status: 400
      response:
        code: INVALID_INPUT
        message: 'Unknown employee: E9'
      detailDescription: <p>DepartmentGraph.transfer checks every employeeId before running any step. E9 is not in the graph, so IllegalArgumentException produces
        HTTP 400 INVALID_INPUT.</p>
    - id: case_004
      title: Reject an unknown target department
      description: Target MISSING was not declared.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          departments:
          - code: A
            capacity: 1
          employees:
          - id: E1
            departmentCode: A
          actions:
          - employeeId: E1
            targetDepartmentCode: MISSING
      status: 400
      response:
        code: INVALID_INPUT
        message: 'Unknown target department: MISSING'
      detailDescription: <p>A non-null targetDepartmentCode must identify an existing department. MISSING is not present, yielding HTTP 400 before any transfer runs.</p>
    - id: case_005
      title: Reject an over-capacity initial assignment
      description: E1 and E2 are initially assigned to capacity-one A.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          departments:
          - code: A
            capacity: 1
          employees:
          - id: E1
            departmentCode: A
          - id: E2
            departmentCode: A
          actions:
          - employeeId: E1
            targetDepartmentCode: null
      status: 400
      response:
        code: INVALID_INPUT
        message: Initial department exceeds capacity
      detailDescription: <p>The DepartmentGraph constructor assigns E1 to A first. Assigning E2 to the same full department fails, throwing IllegalArgumentException
        Initial department exceeds capacity and returning HTTP 400.</p>
  enroll(EnrollmentRequest):
    methodName: enroll
    httpMethods:
    - POST
    mappingPaths:
    - /oop/relationships/enrollments/simulate
    usage: true
    cases:
    - id: case_001
      title: Many-to-many enrollment, duplication, cancellation
      description: Three new enrollments, a duplicate, and a cancellation.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          studentIds:
          - S1
          - S2
          courseIds:
          - C1
          - C2
          actions:
          - operation: ENROLL
            studentId: S1
            courseId: C1
          - operation: ENROLL
            studentId: S1
            courseId: C2
          - operation: ENROLL
            studentId: S2
            courseId: C1
          - operation: ENROLL
            studentId: S1
            courseId: C1
          - operation: CANCEL
            studentId: S1
            courseId: C2
      status: 200
      response:
        events:
        - step: 1
          operation: ENROLL
          studentId: S1
          courseId: C1
          accepted: true
          outcome: CREATED
          notificationSent: true
        - step: 2
          operation: ENROLL
          studentId: S1
          courseId: C2
          accepted: true
          outcome: CREATED
          notificationSent: true
        - step: 3
          operation: ENROLL
          studentId: S2
          courseId: C1
          accepted: true
          outcome: CREATED
          notificationSent: true
        - step: 4
          operation: ENROLL
          studentId: S1
          courseId: C1
          accepted: false
          outcome: DUPLICATE_ENROLLMENT
          notificationSent: false
        - step: 5
          operation: CANCEL
          studentId: S1
          courseId: C2
          accepted: true
          outcome: CANCELLED
          notificationSent: false
        activeEnrollments:
        - studentId: S1
          courseId: C1
          enrollmentSequence: 1
        - studentId: S2
          courseId: C1
          enrollmentSequence: 3
        notificationsSent: 3
        uniquePairs: true
        simulatedOnly: true
      detailDescription: <p>S1 enrolls in C1 (sequence 1) and C2 (sequence 2), while S2 enrolls in C1 (sequence 3). Repeating S1/C1 produces DUPLICATE_ENROLLMENT
        without a notification. Cancelling S1/C2 succeeds. S1/C1 and S2/C1 remain, notificationsSent=3, uniquePairs=true, HTTP 200.</p>
    - id: case_002
      title: Cancel and re-enroll with a new sequence
      description: Cancel before first enrollment, then enroll, cancel, and re-enroll.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          studentIds:
          - S
          courseIds:
          - C
          actions:
          - operation: CANCEL
            studentId: S
            courseId: C
          - operation: ENROLL
            studentId: S
            courseId: C
          - operation: CANCEL
            studentId: S
            courseId: C
          - operation: ENROLL
            studentId: S
            courseId: C
      status: 200
      response:
        events:
        - step: 1
          operation: CANCEL
          studentId: S
          courseId: C
          accepted: false
          outcome: NOT_ENROLLED
          notificationSent: false
        - step: 2
          operation: ENROLL
          studentId: S
          courseId: C
          accepted: true
          outcome: CREATED
          notificationSent: true
        - step: 3
          operation: CANCEL
          studentId: S
          courseId: C
          accepted: true
          outcome: CANCELLED
          notificationSent: false
        - step: 4
          operation: ENROLL
          studentId: S
          courseId: C
          accepted: true
          outcome: CREATED
          notificationSent: true
        activeEnrollments:
        - studentId: S
          courseId: C
          enrollmentSequence: 2
        notificationsSent: 2
        uniquePairs: true
        simulatedOnly: true
      detailDescription: <p>CANCEL of an absent S/C pair returns NOT_ENROLLED. ENROLL then creates sequence one with a notification; CANCEL removes it; another ENROLL
        creates sequence two and sends a second notification. The sequence belongs to a specific link lifecycle, not permanently to the student.</p>
    - id: case_003
      title: Reject an unknown course
      description: C9 is not in courseIds.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          studentIds:
          - S1
          courseIds:
          - C1
          actions:
          - operation: ENROLL
            studentId: S1
            courseId: C9
      status: 400
      response:
        code: INVALID_INPUT
        message: Enrollment references an unknown student or course
      detailDescription: <p>Registry.validateActions checks that courseId C9 belongs to the declared courses. As C9 is absent, the whole request fails before applying
        any actions, yielding HTTP 400 INVALID_INPUT.</p>
    - id: case_004
      title: Reject duplicated student IDs
      description: The same student ID S is supplied twice.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          studentIds:
          - S
          - S
          courseIds:
          - C
          actions:
          - operation: ENROLL
            studentId: S
            courseId: C
      status: 400
      response:
        code: INVALID_INPUT
        message: 'Duplicate entry in studentIds: S'
      detailDescription: '<p>EnrollmentRegistry.validateIds rejects duplicate studentIds before any links are created: Duplicate entry in studentIds: S, HTTP 400.</p>'
    - id: case_005
      title: Reject REGISTER operation
      description: REGISTER is not ENROLL/CANCEL.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          studentIds:
          - S
          courseIds:
          - C
          actions:
          - operation: REGISTER
            studentId: S
            courseId: C
      status: 400
      response:
        code: INVALID_INPUT
        message: operation must be ENROLL or CANCEL
      detailDescription: <p>EnrollmentRegistry.validateActions accepts only exact ENROLL and CANCEL. REGISTER raises IllegalArgumentException, and the handler returns
        HTTP 400 with the model error message.</p>
  ownership(OwnershipRequest):
    methodName: ownership
    httpMethods:
    - POST
    mappingPaths:
    - /oop/relationships/ownership/compare
    usage: true
    cases:
    - id: case_001
      title: Closing an Order clears its lines but not Members
      description: Remove An from Team and close an Order with two lines.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          teamId: TEAM-A
          memberIds:
          - An
          - Binh
          removeMemberId: An
          orderId: ORDER-1
          orderLines:
          - sku: BOOK
            quantity: 2
            unitPriceVnd: 20000
          - sku: PEN
            quantity: 1
            unitPriceVnd: 5000
          closeOrder: true
      status: 200
      response:
        teamId: TEAM-A
        teamMembersAfterRemoval:
        - Binh
        removedMemberStillExistsIndependently: true
        orderId: ORDER-1
        orderTotalBeforeCloseVnd: 45000
        ownedLinesBeforeClose: 2
        ownedLinesAfterAction: 0
        orderClosed: true
        simulatedOnly: true
      detailDescription: <p>An and Binh exist independently in the directory; Team merely aggregates links to them. Removing An leaves only Binh while removedMemberStillExistsIndependently=true.
        Order creates lines worth 40000 and 5000 VND, totaling 45000. Closing invokes close() and clears both lines, from ownedLinesBeforeClose=2 to ownedLinesAfterAction=0,
        with orderClosed=true.</p>
    - id: case_002
      title: Keeping the Order open preserves its lines
      description: Remove An but leave the Order open.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          teamId: TEAM-A
          memberIds:
          - An
          - Binh
          removeMemberId: An
          orderId: ORDER-1
          orderLines:
          - sku: BOOK
            quantity: 2
            unitPriceVnd: 20000
          - sku: PEN
            quantity: 1
            unitPriceVnd: 5000
          closeOrder: false
      status: 200
      response:
        teamId: TEAM-A
        teamMembersAfterRemoval:
        - Binh
        removedMemberStillExistsIndependently: true
        orderId: ORDER-1
        orderTotalBeforeCloseVnd: 45000
        ownedLinesBeforeClose: 2
        ownedLinesAfterAction: 2
        orderClosed: false
        simulatedOnly: true
      detailDescription: <p>With the same data but closeOrder=false, Team still removes An while the directory retains An. Order remains open and keeps both lines;
        ownedLinesAfterAction=2, orderClosed=false, and the pre-operation total stays 45000 VND.</p>
    - id: case_003
      title: Reject removal of a nonmember
      description: Y is not among the sole member ID X.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          teamId: T
          memberIds:
          - X
          removeMemberId: Y
          orderId: O
          orderLines:
          - sku: SKU
            quantity: 1
            unitPriceVnd: 1
          closeOrder: true
      status: 400
      response:
        code: INVALID_INPUT
        message: Member to remove is not part of the team
      detailDescription: <p>OwnershipScenario.compare requires removeMemberId to occur among memberIds. Y is absent when the directory contains only X, so IllegalArgumentException
        Member to remove is not part of the team maps to HTTP 400 INVALID_INPUT.</p>
    - id: case_004
      title: Reject duplicated OrderLine SKU
      description: Two lines belonging to one Order share an SKU.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          teamId: T
          memberIds:
          - X
          removeMemberId: X
          orderId: O
          orderLines:
          - sku: SKU
            quantity: 1
            unitPriceVnd: 1
          - sku: SKU
            quantity: 1
            unitPriceVnd: 2
          closeOrder: true
      status: 400
      response:
        code: INVALID_INPUT
        message: Invalid or duplicate order line
      detailDescription: <p>Order.add tracks unique SKU values. Adding SKU a second time makes skus.add(sku) return false, leading to IllegalArgumentException Invalid
        or duplicate order line and HTTP 400 rather than a partial OwnershipResponse.</p>
    - id: case_005
      title: Detect arithmetic overflow in OrderLine total
      description: Quantity 2 times Long.MAX_VALUE exceeds long capacity.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          teamId: A
          memberIds:
          - An
          removeMemberId: An
          orderId: O1
          orderLines:
          - sku: BOOK
            quantity: 2
            unitPriceVnd: 9223372036854775807
          closeOrder: true
      status: 422
      response:
        code: ARITHMETIC_OVERFLOW
        message: Calculation exceeded supported numeric limits
      detailDescription: <p>Order.add computes value with Math.multiplyExact(quantity,unitPriceVnd). Two times Long.MAX_VALUE overflows long; RelationshipsExceptionHandler
        returns HTTP 422 with ARITHMETIC_OVERFLOW and Calculation exceeded supported numeric limits.</p>
SolidExperimentController:
  quote(QuoteRequest):
    methodName: quote
    httpMethods:
    - POST
    mappingPaths:
    - /oop/solid/discount/quote
    usage: true
    cases:
    - id: case_001
      title: NONE leaves the subtotal unchanged
      description: The NONE policy does not discount a 105-cent subtotal.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policyCode: NONE
          subtotalCents: 105
      status: 200
      response:
        policyCode: NONE
        subtotalCents: 105
        discountCents: 0
        payableCents: 105
      detailDescription: <p><code>NoDiscountPolicy.discountCents</code> always returns zero. For a subtotal of 105 cents, <code>DiscountPricing.quote</code> verifies
        the allowed range and leaves payable at 105, showing multiple interchangeable policy implementations behind one contract.</p>
    - id: case_002
      title: TEN_PERCENT uses integer division
      description: 10% of 999 cents is computed using integer division.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policyCode: TEN_PERCENT
          subtotalCents: 999
      status: 200
      response:
        policyCode: TEN_PERCENT
        subtotalCents: 999
        discountCents: 99
        payableCents: 900
      detailDescription: <p><code>TenPercentPolicy</code> calculates <code>subtotalCents / 10</code> with integer division. Therefore 999 / 10 produces 99 cents off
        and a payable amount of 900, not a floating-point rounded discount.</p>
    - id: case_003
      title: LOYALTY below the 50000 threshold
      description: 49999 cents is not enough to qualify for the loyalty discount.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policyCode: LOYALTY
          subtotalCents: 49999
      status: 200
      response:
        policyCode: LOYALTY
        subtotalCents: 49999
        discountCents: 0
        payableCents: 49999
      detailDescription: <p><code>LoyaltyPolicy</code> returns zero when subtotal is less than 50000. A value of 49999 receives no discount and payable remains 49999,
        with no domain side effects.</p>
    - id: case_004
      title: LOYALTY at the 50000 threshold
      description: 50000 cents receives the 15% LOYALTY discount.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policyCode: LOYALTY
          subtotalCents: 50000
      status: 200
      response:
        policyCode: LOYALTY
        subtotalCents: 50000
        discountCents: 7500
        payableCents: 42500
      detailDescription: <p><code>LoyaltyPolicy</code> activates the 15% rate from a subtotal of 50000. It computes using quotient and remainder to avoid overflowing
        a full-long multiplication. The discount is 7500 and the payable amount is 42500, HTTP 200.</p>
    - id: case_005
      title: A broken policy violates its LSP contract
      description: BROKEN_NEGATIVE implements the interface but returns a negative discount.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policyCode: BROKEN_NEGATIVE
          subtotalCents: 100
      status: 422
      response:
        code: POLICY_CONTRACT
        message: policy BROKEN_NEGATIVE violated 0 <= discount <= subtotal
      detailDescription: <p><code>BrokenNegativeDiscountPolicy.discountCents</code> intentionally returns -1. <code>DiscountPricing.quote</code> enforces the <code>0
        &lt;= discount &lt;= subtotal</code> postcondition and raises <code>PolicyContractException</code> before creating a QuoteResult. The handler returns HTTP
        422 POLICY_CONTRACT.</p>
    - id: case_006
      title: Reject an unknown policy code
      description: MISSING is absent from the DiscountPolicy registry.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policyCode: MISSING
          subtotalCents: 100
      status: 400
      response:
        code: INVALID_INPUT
        message: 'unknown discount policy: MISSING'
      detailDescription: '<p><code>DiscountPricing</code> resolves a code from its registry of implementations. No MISSING key exists, so <code>IllegalArgumentException</code>
        with <code>unknown discount policy: MISSING</code> maps to HTTP 400.</p>'
    - id: case_007
      title: Reject a negative subtotal
      description: A checkout subtotal must not be negative.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policyCode: NONE
          subtotalCents: -1
      status: 400
      response:
        code: INVALID_INPUT
        message: subtotalCents must be nonnegative
      detailDescription: <p><code>DiscountPricing.quote</code> rejects a subtotal below zero before policy lookup. -1 raises <code>IllegalArgumentException</code>
        and yields HTTP 400 INVALID_INPUT instead of a negative quote.</p>
  experiment(ExperimentRequest):
    methodName: experiment
    httpMethods:
    - POST
    mappingPaths:
    - /oop/solid/checkout/experiment
    usage: true
    cases:
    - id: case_001
      title: One successful order, broken policy, and duplicate ID
      description: Three attempts show that only a valid order is stored and notified.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          attempts:
          - orderId: ORD-1
            policyCode: TEN_PERCENT
            lines:
            - sku: BOOK
              quantity: 2
              unitPriceCents: 100
          - orderId: ORD-2
            policyCode: BROKEN_NEGATIVE
            lines:
            - sku: BOOK
              quantity: 1
              unitPriceCents: 100
          - orderId: ORD-1
            policyCode: NONE
            lines:
            - sku: PEN
              quantity: 1
              unitPriceCents: 20
      status: 200
      response:
        attempts:
        - index: 1
          orderId: ORD-1
          accepted: true
          rule: null
          detail: order stored and simulated receipt recorded
          receipt:
            orderId: ORD-1
            policyCode: TEN_PERCENT
            subtotalCents: 200
            discountCents: 20
            payableCents: 180
          storedCount: 1
          noticeCount: 1
        - index: 2
          orderId: ORD-2
          accepted: false
          rule: POLICY_CONTRACT
          detail: policy BROKEN_NEGATIVE violated 0 <= discount <= subtotal
          receipt: null
          storedCount: 1
          noticeCount: 1
        - index: 3
          orderId: ORD-1
          accepted: false
          rule: ORDER_CONFLICT
          detail: 'duplicate orderId: ORD-1'
          receipt: null
          storedCount: 1
          noticeCount: 1
        storedOrders:
        - orderId: ORD-1
          policyCode: TEN_PERCENT
          subtotalCents: 200
          discountCents: 20
          payableCents: 180
        notices:
        - orderId: ORD-1
          payableCents: 180
        countsConsistent: true
        scope: REQUEST_LOCAL_SIMULATION; NO_DATABASE_OR_ACTUAL_EMAIL; NO_TRANSACTION_ACROSS_EXTERNAL_ADAPTERS
      detailDescription: '<p><code>ORD-1</code> contains two BOOK units at 100 cents each: subtotal 200, TEN_PERCENT discount 20, stored receipt payable 180. ORD-2
        selects BROKEN_NEGATIVE, causing POLICY_CONTRACT with no save or notice. A later attempt reuses ORD-1, and <code>MemoryOrderStore.save</code> rejects ORDER_CONFLICT
        before sender runs. Only one stored order and one notice remain, countsConsistent=true; HTTP 200.</p>'
    - id: case_002
      title: Multiple checkout attempts share one request-local scenario
      description: Five attempts mix NONE, LOYALTY, BROKEN_NEGATIVE, duplicate ID, and TEN_PERCENT.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          attempts:
          - orderId: ORD-1
            policyCode: NONE
            lines:
            - sku: BOOK
              quantity: 2
              unitPriceCents: 25000
          - orderId: ORD-2
            policyCode: LOYALTY
            lines:
            - sku: BOOK
              quantity: 2
              unitPriceCents: 25000
          - orderId: ORD-3
            policyCode: BROKEN_NEGATIVE
            lines:
            - sku: BOOK
              quantity: 2
              unitPriceCents: 25000
          - orderId: ORD-1
            policyCode: TEN_PERCENT
            lines:
            - sku: BOOK
              quantity: 2
              unitPriceCents: 25000
          - orderId: ORD-4
            policyCode: TEN_PERCENT
            lines:
            - sku: BOOK
              quantity: 2
              unitPriceCents: 25000
      status: 200
      response:
        attempts:
        - index: 1
          orderId: ORD-1
          accepted: true
          rule: null
          detail: order stored and simulated receipt recorded
          receipt:
            orderId: ORD-1
            policyCode: NONE
            subtotalCents: 50000
            discountCents: 0
            payableCents: 50000
          storedCount: 1
          noticeCount: 1
        - index: 2
          orderId: ORD-2
          accepted: true
          rule: null
          detail: order stored and simulated receipt recorded
          receipt:
            orderId: ORD-2
            policyCode: LOYALTY
            subtotalCents: 50000
            discountCents: 7500
            payableCents: 42500
          storedCount: 2
          noticeCount: 2
        - index: 3
          orderId: ORD-3
          accepted: false
          rule: POLICY_CONTRACT
          detail: policy BROKEN_NEGATIVE violated 0 <= discount <= subtotal
          receipt: null
          storedCount: 2
          noticeCount: 2
        - index: 4
          orderId: ORD-1
          accepted: false
          rule: ORDER_CONFLICT
          detail: 'duplicate orderId: ORD-1'
          receipt: null
          storedCount: 2
          noticeCount: 2
        - index: 5
          orderId: ORD-4
          accepted: true
          rule: null
          detail: order stored and simulated receipt recorded
          receipt:
            orderId: ORD-4
            policyCode: TEN_PERCENT
            subtotalCents: 50000
            discountCents: 5000
            payableCents: 45000
          storedCount: 3
          noticeCount: 3
        storedOrders:
        - orderId: ORD-1
          policyCode: NONE
          subtotalCents: 50000
          discountCents: 0
          payableCents: 50000
        - orderId: ORD-2
          policyCode: LOYALTY
          subtotalCents: 50000
          discountCents: 7500
          payableCents: 42500
        - orderId: ORD-4
          policyCode: TEN_PERCENT
          subtotalCents: 50000
          discountCents: 5000
          payableCents: 45000
        notices:
        - orderId: ORD-1
          payableCents: 50000
        - orderId: ORD-2
          payableCents: 42500
        - orderId: ORD-4
          payableCents: 45000
        countsConsistent: true
        scope: REQUEST_LOCAL_SIMULATION; NO_DATABASE_OR_ACTUAL_EMAIL; NO_TRANSACTION_ACROSS_EXTERNAL_ADAPTERS
      detailDescription: '<p>The first two orders are stored: ORD-1 with NONE has payable 50000; ORD-2 with LOYALTY discounts 7500 to 42500. ORD-3 fails the negative-policy
        contract (POLICY_CONTRACT), and a second ORD-1 conflicts (ORDER_CONFLICT). ORD-4 with TEN_PERCENT discounts 5000, payable 45000. Three receipts and notices
        preserve order; rejected attempts hold counts at two until the final accepted attempt raises counts to three.</p>'
    - id: case_003
      title: Invalid line fields and unknown policy become rejected steps
      description: A null quantity and unsupported policy both fail without storage.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          attempts:
          - orderId: ORD-2
            policyCode: NONE
            lines:
            - sku: A
              quantity: null
              unitPriceCents: 2
          - orderId: ORD-3
            policyCode: UNKNOWN
            lines:
            - sku: BOOK
              quantity: 2
              unitPriceCents: 10
      status: 200
      response:
        attempts:
        - index: 1
          orderId: ORD-2
          accepted: false
          rule: INVALID_INPUT
          detail: every line requires sku, quantity and unitPriceCents
          receipt: null
          storedCount: 0
          noticeCount: 0
        - index: 2
          orderId: ORD-3
          accepted: false
          rule: INVALID_INPUT
          detail: 'unknown discount policy: UNKNOWN'
          receipt: null
          storedCount: 0
          noticeCount: 0
        storedOrders: []
        notices: []
        countsConsistent: true
        scope: REQUEST_LOCAL_SIMULATION; NO_DATABASE_OR_ACTUAL_EMAIL; NO_TRANSACTION_ACROSS_EXTERNAL_ADAPTERS
      detailDescription: <p>The first attempt has a null quantity, so <code>toOrder</code> raises IllegalArgumentException every line requires sku, quantity and unitPriceCents.
        The second produces a valid PurchaseOrder subtotal of 20, but <code>DiscountPricing.quote</code> cannot resolve policy UNKNOWN. The service records two INVALID_INPUT
        rules, null receipts, and storedCount/noticeCount of zero. HTTP 200 is correct because exceptions are caught per attempt.</p>
    - id: case_004
      title: Overflow is captured inside an attempt
      description: Long.MAX_VALUE unit price multiplied by two exceeds long range.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          attempts:
          - orderId: ORD-1
            policyCode: NONE
            lines:
            - sku: BIG
              quantity: 2
              unitPriceCents: 9223372036854775807
      status: 200
      response:
        attempts:
        - index: 1
          orderId: ORD-1
          accepted: false
          rule: ARITHMETIC_OVERFLOW
          detail: order arithmetic exceeds long range
          receipt: null
          storedCount: 0
          noticeCount: 0
        storedOrders: []
        notices: []
        countsConsistent: true
        scope: REQUEST_LOCAL_SIMULATION; NO_DATABASE_OR_ACTUAL_EMAIL; NO_TRANSACTION_ACROSS_EXTERNAL_ADAPTERS
      detailDescription: <p>An OrderLine supplies quantity two and Long.MAX_VALUE unit price. <code>PurchaseOrder.subtotalCents</code> calls <code>Math.multiplyExact</code>,
        which throws ArithmeticException. The service records ARITHMETIC_OVERFLOW with detail order arithmetic exceeds long range, without saving an order or notice;
        HTTP 200.</p>
    - id: case_005
      title: Empty attempts list returns HTTP 400
      description: No checkout attempt was submitted, violating the 1–16 requirement.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          attempts: []
      status: 400
      response:
        code: INVALID_INPUT
        message: attempts must contain 1..16 checkout attempts
      detailDescription: <p><code>SolidExperimentService.experiment</code> validates the entire request first, requiring 1–16 attempts. An empty attempts array raises
        IllegalArgumentException before creating MemoryOrderStore. The scoped handler returns HTTP 400 INVALID_INPUT with the exact 1..16 message.</p>
SubtypingExperimentController:
  dispatch(DispatchRequest):
    methodName: dispatch
    httpMethods:
    - POST
    mappingPaths:
    - /oop/subtyping/dispatch
    usage: true
    cases:
    - id: case_001
      title: 'CARD: dynamic overriding versus static overload'
      description: One PaymentMethod reference contains a CardPayment, showing different override and overload decisions.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: CARD
          amountCents: 250
      status: 200
      response:
        declaredType: PaymentMethod
        runtimeType: CardPayment
        sameReferenceAfterUpcast: true
        description: CARD-****1234
        receipt: CARD:APPROVED:250
        overloadForBaseReference: OVERLOAD:PaymentMethod
        overloadForConcreteReference: OVERLOAD:CardPayment
        cardSpecificCapabilityAvailable: true
        cardLastFourDigits: '1234'
        legacyUsesAdapter: false
      detailDescription: <p>Declared type and base overload are <code>PaymentMethod</code>, but runtime type is <code>CardPayment</code>. charge(250) returns CARD:APPROVED:250
        and description() returns CARD-****1234. A successful instanceof check enables the CardPayment overload and reading 1234. The upcast preserves reference identity.</p>
    - id: case_002
      title: WALLET has no Card-specific capability
      description: WalletPayment cannot expose CardPayment.lastFourDigits.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: WALLET
          amountCents: 7
      status: 200
      response:
        declaredType: PaymentMethod
        runtimeType: WalletPayment
        sameReferenceAfterUpcast: true
        description: WALLET
        receipt: WALLET:APPROVED:7
        overloadForBaseReference: OVERLOAD:PaymentMethod
        overloadForConcreteReference: null
        cardSpecificCapabilityAvailable: false
        cardLastFourDigits: null
        legacyUsesAdapter: false
      detailDescription: <p><code>WalletPayment</code> still implements PaymentMethod and returns WALLET:APPROVED:7. The instanceof CardPayment test fails, so concrete
        overload and lastFourDigits are null; the service never downcasts WalletPayment to CardPayment.</p>
    - id: case_003
      title: LEGACY_ADAPTER supplies nominal subtyping
      description: LegacyGateway does not implement the interface; an adapter makes it compatible.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: LEGACY_ADAPTER
          amountCents: 200
      status: 200
      response:
        declaredType: PaymentMethod
        runtimeType: LegacyPaymentAdapter
        sameReferenceAfterUpcast: true
        description: ADAPTER(LEGACY)
        receipt: LEGACY:APPROVED:200
        overloadForBaseReference: OVERLOAD:PaymentMethod
        overloadForConcreteReference: null
        cardSpecificCapabilityAvailable: false
        cardLastFourDigits: null
        legacyUsesAdapter: true
      detailDescription: <p><code>LegacyPaymentAdapter</code> implements PaymentMethod and calls <code>LegacyGateway.submitCents(200)</code>. The receipt is LEGACY:APPROVED:200;
        legacyUsesAdapter=true demonstrates nominal compatibility through a wrapper, not merely similar method names.</p>
    - id: case_004
      title: Reject zero payment amount
      description: amountCents=0 violates the accepted 1–100000000 range.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: CARD
          amountCents: 0
      status: 400
      response:
        code: INVALID_INPUT
        message: amountCents must be between 1 and 100000000
      detailDescription: <p><code>dispatch</code> validates amountCents from 1 through 100000000 before creating a payment implementation. Zero throws IllegalArgumentException
        and the scoped handler returns HTTP 400 with code INVALID_INPUT.</p>
  contract(DiscountRequest):
    methodName: contract
    httpMethods:
    - POST
    mappingPaths:
    - /oop/subtyping/discount-contract
    usage: true
    cases:
    - id: case_001
      title: FIXED honors the zero-price boundary
      description: Fixed 60-cent discount caps the reduction at the original price.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: FIXED
          pricesCents:
          - 0
          - 50
          - 100
          discountCents: 60
          percent: null
          minimumCents: null
      status: 200
      response:
        declaredType: DiscountPolicy
        runtimeType: FixedDiscount
        allCasesPass: true
        cases:
        - inputCents: 0
          netCents: 0
          satisfiedContract: true
          failure: null
        - inputCents: 50
          netCents: 0
          satisfiedContract: true
          failure: null
        - inputCents: 100
          netCents: 40
          satisfiedContract: true
          failure: null
      detailDescription: <p>DiscountPolicy admits prices 0, 50, and 100. FixedDiscount(60) returns 0, 0, and 40 through Math.min(price,discount). Every result stays
        within the supertype's postcondition, so allCasesPass=true.</p>
    - id: case_002
      title: PERCENT uses integer reduction
      description: 25 percent of 7 cents demonstrates integer rounding of the discount.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: PERCENT
          pricesCents:
          - 0
          - 7
          - 100000000
          discountCents: null
          percent: 25
          minimumCents: null
      status: 200
      response:
        declaredType: DiscountPolicy
        runtimeType: PercentDiscount
        allCasesPass: true
        cases:
        - inputCents: 0
          netCents: 0
          satisfiedContract: true
          failure: null
        - inputCents: 7
          netCents: 6
          satisfiedContract: true
          failure: null
        - inputCents: 100000000
          netCents: 75000000
          satisfiedContract: true
          failure: null
      detailDescription: <p><code>PercentDiscount(25)</code> computes the reduction using integer <code>(price*percent)/100</code>. Price 7 loses one cent and becomes
        six; price 100000000 becomes 75000000; price zero is still accepted. No contract violation is recorded.</p>
    - id: case_003
      title: STRICT_MINIMUM breaks the LSP precondition
      description: The subtype implements DiscountPolicy but rejects valid supertype inputs below its own minimum.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: STRICT_MINIMUM
          pricesCents:
          - 0
          - 49
          - 50
          - 100
          discountCents: null
          percent: null
          minimumCents: 50
      status: 200
      response:
        declaredType: DiscountPolicy
        runtimeType: StrictMinimumDiscount
        allCasesPass: false
        cases:
        - inputCents: 0
          netCents: null
          satisfiedContract: false
          failure: 'Precondition violated: valid supertype input rejected: Subtype strengthened precondition: minimum 50'
        - inputCents: 49
          netCents: null
          satisfiedContract: false
          failure: 'Precondition violated: valid supertype input rejected: Subtype strengthened precondition: minimum 50'
        - inputCents: 50
          netCents: 50
          satisfiedContract: true
          failure: null
        - inputCents: 100
          netCents: 100
          satisfiedContract: true
          failure: null
      detailDescription: '<p>STRICT_MINIMUM(50) rejects 0 and 49 although the DiscountPolicy contract accepts them: netCents=null and failure starts with Precondition
        violated. Prices 50 and 100 return unchanged. HTTP 200 still contains allCasesPass=false to illustrate behavioral substitutability failure.</p>'
    - id: case_004
      title: Reject a percentage above 100
      description: Percent 101 is outside the 0–100 constructor range.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: PERCENT
          pricesCents:
          - 10
          discountCents: null
          percent: 101
          minimumCents: null
      status: 400
      response:
        code: INVALID_INPUT
        message: percent must be 0-100
      detailDescription: <p>PercentDiscount validates percent from 0 through 100 at construction. A value of 101 throws IllegalArgumentException with message percent
        must be 0-100 before the price loop, so HTTP 400 is returned.</p>
    - id: case_005
      title: Reject an empty price list
      description: An empty pricesCents list violates the service's 1–20 requirement.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: FIXED
          pricesCents: []
          discountCents: 5
          percent: null
          minimumCents: null
      status: 400
      response:
        code: INVALID_INPUT
        message: implementation and 1-20 pricesCents are required
      detailDescription: <p><code>discountContract</code> requires 1–20 prices. An empty list is rejected before policy construction; the handler returns INVALID_INPUT
        and the service's exact message.</p>
  geometry(GeometryRequest):
    methodName: geometry
    httpMethods:
    - POST
    mappingPaths:
    - /oop/subtyping/geometry-contract
    usage: true
    cases:
    - id: case_001
      title: RECTANGLE preserves independent setters
      description: MutableRectangle changes only the requested dimension.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: RECTANGLE
          initialWidth: 2
          initialHeight: 2
          newWidth: 5
          newHeight: 3
      status: 200
      response:
        declaredType: MutableRectangle
        runtimeType: MutableRectangle
        finalWidth: 5
        finalHeight: 3
        finalArea: 15
        widthSetterKeptHeight: true
        heightSetterKeptWidth: true
        rectangleContractRespected: true
        expectedRectangleArea: 15
        immutableRectangleArea: 15
        immutableSquareArea: 9
        immutableInterface: MeasurableShape
      detailDescription: <p>A RECTANGLE initially 2 by 2 changes width to 5 without changing height, then changes height to 3 without changing width. Final area is
        15, both setter checks pass, and the immutable shapes share only their area interface.</p>
    - id: case_002
      title: SQUARE breaks the Rectangle contract
      description: MutableSquare changes both sides when setting either dimension, breaking the parent contract.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: SQUARE_AS_RECTANGLE
          initialWidth: 2
          initialHeight: 2
          newWidth: 5
          newHeight: 3
      status: 200
      response:
        declaredType: MutableRectangle
        runtimeType: MutableSquare
        finalWidth: 3
        finalHeight: 3
        finalArea: 9
        widthSetterKeptHeight: false
        heightSetterKeptWidth: false
        rectangleContractRespected: false
        expectedRectangleArea: 15
        immutableRectangleArea: 15
        immutableSquareArea: 9
        immutableInterface: MeasurableShape
      detailDescription: <p>MutableSquare starts at 2 by 2; setWidth(5) also makes height 5, failing the first check. setHeight(3) also makes width 3, failing the
        second. Actual area is 9 while expected rectangle area is 5 by 3 = 15. This is legal Java inheritance but violates the inherited behavioral contract.</p>
    - id: case_003
      title: Reject unequal initial Square dimensions
      description: Square construction requires identical initial width and height.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: SQUARE_AS_RECTANGLE
          initialWidth: 2
          initialHeight: 3
          newWidth: 5
          newHeight: 3
      status: 400
      response:
        code: INVALID_INPUT
        message: Square initial width and height must be equal
      detailDescription: <p>The service verifies initialWidth equals initialHeight before constructing a MutableSquare. Values 2 and 3 differ, raising IllegalArgumentException
        Square initial width and height must be equal and returning HTTP 400.</p>
    - id: case_004
      title: Reject zero dimension
      description: GeometryModels.requireDimension accepts only 1–10000.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: RECTANGLE
          initialWidth: 0
          initialHeight: 3
          newWidth: 5
          newHeight: 4
      status: 400
      response:
        code: INVALID_INPUT
        message: Dimensions must be between 1 and 10000
      detailDescription: <p>GeometryModels.requireDimension rejects initial width zero because each dimension must lie within 1–10000; the handler returns HTTP 400
        with the method's message.</p>
    - id: case_005
      title: Large dimensions remain within long area bounds
      description: The 10000 by 10000 case calculates its area as long without overflow.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: RECTANGLE
          initialWidth: 1
          initialHeight: 1
          newWidth: 10000
          newHeight: 10000
      status: 200
      response:
        declaredType: MutableRectangle
        runtimeType: MutableRectangle
        finalWidth: 10000
        finalHeight: 10000
        finalArea: 100000000
        widthSetterKeptHeight: true
        heightSetterKeptWidth: true
        rectangleContractRespected: true
        expectedRectangleArea: 100000000
        immutableRectangleArea: 100000000
        immutableSquareArea: 100000000
        immutableInterface: MeasurableShape
      detailDescription: <p>A RECTANGLE initially 1 by 1 accepts both setters at 10000 while preserving the independent-setter contract. Its long-valued area becomes
        100000000, matching the immutable rectangle calculation without overflow.</p>
TestingExperimentController:
  contracts(ContractRequest):
    methodName: contracts
    httpMethods:
    - POST
    mappingPaths:
    - /oop/testing/inventory/contracts
    usage: true
    cases:
    - id: case_001
      title: A rejected reservation exposes state mutation
      description: The same black-box actions are executed against three implementations; MONITOR/ATOMIC pass while BROKEN violates invariants.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          capacity: 10
          actions:
          - type: RESERVE
            seats: 4
          - type: RESERVE
            seats: 7
          - type: CANCEL
            seats: 2
          - type: RESERVE
            seats: 8
      status: 200
      response:
        initial:
          capacity: 10
          reserved: 0
        runs:
        - implementation: MONITOR
          allPassed: true
          passedSteps: 4
          steps:
          - index: 1
            action: RESERVE
            seats: 4
            expectedAccepted: true
            actualAccepted: true
            expectedSnapshot:
              capacity: 10
              reserved: 4
            actualSnapshot:
              capacity: 10
              reserved: 4
            passed: true
            violations: []
          - index: 2
            action: RESERVE
            seats: 7
            expectedAccepted: false
            actualAccepted: false
            expectedSnapshot:
              capacity: 10
              reserved: 4
            actualSnapshot:
              capacity: 10
              reserved: 4
            passed: true
            violations: []
          - index: 3
            action: CANCEL
            seats: 2
            expectedAccepted: true
            actualAccepted: true
            expectedSnapshot:
              capacity: 10
              reserved: 2
            actualSnapshot:
              capacity: 10
              reserved: 2
            passed: true
            violations: []
          - index: 4
            action: RESERVE
            seats: 8
            expectedAccepted: true
            actualAccepted: true
            expectedSnapshot:
              capacity: 10
              reserved: 10
            actualSnapshot:
              capacity: 10
              reserved: 10
            passed: true
            violations: []
        - implementation: ATOMIC
          allPassed: true
          passedSteps: 4
          steps:
          - index: 1
            action: RESERVE
            seats: 4
            expectedAccepted: true
            actualAccepted: true
            expectedSnapshot:
              capacity: 10
              reserved: 4
            actualSnapshot:
              capacity: 10
              reserved: 4
