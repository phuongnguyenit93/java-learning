        scope: REQUEST_LOCAL_IN_MEMORY_NO_EXTERNAL_SIDE_EFFECTS
      detailDescription: <p>COMPLETE UNKNOWN raises <code>unknown task id</code> before any history change. Valid ADD T-1 causes two deliveries. A duplicate ADD raises
        <code>duplicate task id</code> without changing state or notifying listeners. UNDO removes the task and emits two more events; another UNDO fails with <code>undo
        stack is empty</code>. Final state has no tasks, undo=0, redo=1 and four deliveries.</p>
    - id: case_003
