            observerDeliveries:
            - AUDIT:EXECUTE_ADD:T-1
            - NOTIFY:EXECUTE_ADD:T-1
            - AUDIT:EXECUTE_COMPLETE:T-1
            - NOTIFY:EXECUTE_COMPLETE:T-1
            - AUDIT:UNDO_COMPLETE:T-1
            - NOTIFY:UNDO_COMPLETE:T-1
          after:
            tasks:
            - id: T-1
              title: Review PR
              done: true
            undoDepth: 2
            redoDepth: 0
            observerDeliveries:
