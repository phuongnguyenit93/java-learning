            - id: T-1
              title: One
              done: false
            - id: T-2
              title: Two
              done: false
            undoDepth: 2
            redoDepth: 0
            observerDeliveries:
            - AUDIT:EXECUTE_ADD:T-1
            - NOTIFY:EXECUTE_ADD:T-1
            - AUDIT:EXECUTE_ADD:T-2
            - NOTIFY:EXECUTE_ADD:T-2
        - index: 3
          action: UNDO
          accepted: true
          detail: completed
          before:
            tasks:
            - id: T-1
              title: One
              done: false
            - id: T-2
              title: Two
              done: false
            undoDepth: 2
            redoDepth: 0
            observerDeliveries:
            - AUDIT:EXECUTE_ADD:T-1
            - NOTIFY:EXECUTE_ADD:T-1
            - AUDIT:EXECUTE_ADD:T-2
            - NOTIFY:EXECUTE_ADD:T-2
          after:
            tasks:
            - id: T-1
              title: One
              done: false
            undoDepth: 1
            redoDepth: 1
            observerDeliveries:
            - AUDIT:EXECUTE_ADD:T-1
            - NOTIFY:EXECUTE_ADD:T-1
            - AUDIT:EXECUTE_ADD:T-2
            - NOTIFY:EXECUTE_ADD:T-2
            - AUDIT:UNDO_ADD:T-2
            - NOTIFY:UNDO_ADD:T-2
        - index: 4
          action: ADD
          accepted: true
          detail: completed
          before:
            tasks:
            - id: T-1
              title: One
              done: false
            undoDepth: 1
            redoDepth: 1
            observerDeliveries:
            - AUDIT:EXECUTE_ADD:T-1
            - NOTIFY:EXECUTE_ADD:T-1
            - AUDIT:EXECUTE_ADD:T-2
            - NOTIFY:EXECUTE_ADD:T-2
            - AUDIT:UNDO_ADD:T-2
            - NOTIFY:UNDO_ADD:T-2
          after:
            tasks:
            - id: T-1
              title: One
              done: false
            - id: T-3
              title: Three
              done: false
            undoDepth: 2
            redoDepth: 0
            observerDeliveries:
            - AUDIT:EXECUTE_ADD:T-1
            - NOTIFY:EXECUTE_ADD:T-1
            - AUDIT:EXECUTE_ADD:T-2
            - NOTIFY:EXECUTE_ADD:T-2
            - AUDIT:UNDO_ADD:T-2
            - NOTIFY:UNDO_ADD:T-2
            - AUDIT:EXECUTE_ADD:T-3
            - NOTIFY:EXECUTE_ADD:T-3
        - index: 5
          action: REDO
          accepted: false
          detail: redo stack is empty
          before:
            tasks:
            - id: T-1
              title: One
              done: false
            - id: T-3
              title: Three
              done: false
            undoDepth: 2
            redoDepth: 0
            observerDeliveries:
            - AUDIT:EXECUTE_ADD:T-1
            - NOTIFY:EXECUTE_ADD:T-1
            - AUDIT:EXECUTE_ADD:T-2
            - NOTIFY:EXECUTE_ADD:T-2
            - AUDIT:UNDO_ADD:T-2
            - NOTIFY:UNDO_ADD:T-2
            - AUDIT:EXECUTE_ADD:T-3
            - NOTIFY:EXECUTE_ADD:T-3
          after:
            tasks:
            - id: T-1
              title: One
              done: false
            - id: T-3
              title: Three
              done: false
            undoDepth: 2
            redoDepth: 0
            observerDeliveries:
            - AUDIT:EXECUTE_ADD:T-1
            - NOTIFY:EXECUTE_ADD:T-1
            - AUDIT:EXECUTE_ADD:T-2
            - NOTIFY:EXECUTE_ADD:T-2
            - AUDIT:UNDO_ADD:T-2
            - NOTIFY:UNDO_ADD:T-2
            - AUDIT:EXECUTE_ADD:T-3
            - NOTIFY:EXECUTE_ADD:T-3
        current:
          tasks:
          - id: T-1
            title: One
            done: false
          - id: T-3
            title: Three
            done: false
          undoDepth: 2
          redoDepth: 0
          observerDeliveries:
          - AUDIT:EXECUTE_ADD:T-1
          - NOTIFY:EXECUTE_ADD:T-1
          - AUDIT:EXECUTE_ADD:T-2
          - NOTIFY:EXECUTE_ADD:T-2
          - AUDIT:UNDO_ADD:T-2
          - NOTIFY:UNDO_ADD:T-2
          - AUDIT:EXECUTE_ADD:T-3
          - NOTIFY:EXECUTE_ADD:T-3
        scope: REQUEST_LOCAL_IN_MEMORY_NO_EXTERNAL_SIDE_EFFECTS
      detailDescription: <p>After adding T-1 and T-2, UNDO removes T-2 and sets redoDepth=1. A new successful ADD T-3 goes through <code>TaskCommandManager.execute()</code>,
        which calls <code>redo.clear()</code> and restores redoDepth=0. REDO now fails with <code>redo stack is empty</code>; T-1/T-3 remain unchanged and no new
        event is published.</p>
    - id: case_004
      title: Unsubscribe an Observer twice
      description: First removal succeeds; the second is rejected while AUDIT still records a later ADD.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          actions:
          - type: UNSUBSCRIBE_NOTIFY
            id: null
            title: null
          - type: UNSUBSCRIBE_NOTIFY
            id: null
            title: null
          - type: ADD
            id: T-1
            title: Only audit
      status: 200
      response:
        initial:
          tasks: []
          undoDepth: 0
          redoDepth: 0
          observerDeliveries: []
        steps:
        - index: 1
          action: UNSUBSCRIBE_NOTIFY
          accepted: true
          detail: completed
          before:
            tasks: []
            undoDepth: 0
            redoDepth: 0
            observerDeliveries: []
          after:
            tasks: []
            undoDepth: 0
            redoDepth: 0
            observerDeliveries: []
        - index: 2
          action: UNSUBSCRIBE_NOTIFY
          accepted: false
          detail: observer not registered
          before:
            tasks: []
            undoDepth: 0
            redoDepth: 0
            observerDeliveries: []
          after:
            tasks: []
            undoDepth: 0
            redoDepth: 0
            observerDeliveries: []
        - index: 3
          action: ADD
          accepted: true
          detail: completed
          before:
            tasks: []
            undoDepth: 0
            redoDepth: 0
            observerDeliveries: []
          after:
            tasks:
            - id: T-1
              title: Only audit
              done: false
            undoDepth: 1
            redoDepth: 0
            observerDeliveries:
            - AUDIT:EXECUTE_ADD:T-1
        current:
          tasks:
          - id: T-1
            title: Only audit
            done: false
          undoDepth: 1
          redoDepth: 0
          observerDeliveries:
          - AUDIT:EXECUTE_ADD:T-1
        scope: REQUEST_LOCAL_IN_MEMORY_NO_EXTERNAL_SIDE_EFFECTS
      detailDescription: <p>The first UNSUBSCRIBE_NOTIFY removes NOTIFY without emitting an event or changing history. The second call raises <code>observer not registered</code>,
        captured as a rejected step. A subsequent ADD T-1 succeeds and delivers only <code>AUDIT:EXECUTE_ADD:T-1</code>, leaving exactly one delivery.</p>
    - id: case_005
      title: Reject an action type outside the contract
      description: Prevalidation rejects BOGUS before creating the Command manager and board.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          actions:
          - type: BOGUS
            id: null
            title: null
      status: 400
      response:
        error: task type must be ADD/COMPLETE/UNDO/REDO/UNSUBSCRIBE_NOTIFY
      detailDescription: <p><code>DesignPatternExperimentService.tasks()</code> checks every action type against five supported values before initializing a TaskBoard.
        BOGUS throws <code>IllegalArgumentException</code>, mapped to HTTP 400 instead of an individual rejected step.</p>
  report(ReportRequest):
    methodName: report
    httpMethods:
    - POST
    mappingPaths:
    - /oop/design-patterns/reports/generate
    usage: true
    cases:
    - id: case_001
      title: CSV uses Factory Method with a fixed HEADER–ROW–SUMMARY trace
      description: Two rows render in input order for a 120-VND total, without changing the shared algorithm.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          format: CSV
          sales:
          - id: S-01
            amountVnd: 100
          - id: S-02
            amountVnd: 20
      status: 200
      response:
        format: CSV
        content: 'saleId,amountVnd

          S-01,100

          S-02,20

          TOTAL,120'
        totalVnd: 120
        rowCount: 2
        executionTrace:
        - HEADER
        - ROW:S-01
        - ROW:S-02
        - SUMMARY
      detailDescription: <p><code>CsvCreator.createTemplate()</code> constructs CsvTemplate, but final <code>ReportTemplate.render()</code> still validates, emits
        the header, S-01 and S-02 rows, and the summary. Content contains <code>saleId,amountVnd</code>, <code>S-01,100</code>, <code>S-02,20</code>, <code>TOTAL,120</code>
        separated by newlines, and the Template Method defines the trace.</p>
    - id: case_002
      title: TEXT and CSV share the same Template Method
      description: TextCreator customizes header, rows and summary while keeping total and execution sequence fixed.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          format: TEXT
          sales:
          - id: SALE-1
            amountVnd: 120
          - id: SALE-2
            amountVnd: 30
      status: 200
      response:
        format: TEXT
        content: 'SALES REPORT

          SALE-1 -> 120 VND

          SALE-2 -> 30 VND

          TOTAL (2): 150 VND'
        totalVnd: 150
        rowCount: 2
        executionTrace:
        - HEADER
        - ROW:SALE-1
        - ROW:SALE-2
        - SUMMARY
      detailDescription: '<p><code>TextCreator</code> selects TextTemplate: header <code>SALES REPORT</code>, rows <code>SALE-1 -&gt; 120 VND</code> and <code>SALE-2
        -&gt; 30 VND</code>, then <code>TOTAL (2): 150 VND</code>. The trace remains HEADER, ROW:SALE-1, ROW:SALE-2, SUMMARY, as it would for CSV on the same data.</p>'
    - id: case_003
      title: Reject unknown report format
      description: Factory selection only supports the two defined creators.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          format: UNKNOWN
          sales:
          - id: S-01
            amountVnd: 1
      status: 400
      response:
        error: format must be TEXT or CSV
      detailDescription: <p>After validating Sale objects, the service switches on the requested format. UNKNOWN matches neither TEXT nor CSV, so <code>IllegalArgumentException</code>
        maps to HTTP 400 before producing content.</p>
    - id: case_004
      title: Reject a sale with a negative amount
      description: The Sale value object enforces input bounds before the Template Method runs.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          format: CSV
          sales:
          - id: SALE-1
            amountVnd: -1
      status: 400
      response:
        error: amountVnd must be 0..1000000000000
      detailDescription: <p><code>new ReportPatterns.Sale(&quot;SALE-1&quot;,-1)</code> violates the 0–1000000000000 VND range and throws <code>IllegalArgumentException</code>.
        The service has not selected CsvCreator or rendered output; HTTP 400 carries the model message.</p>
    - id: case_005
      title: Reject an empty sales list
      description: A report requires one to twenty input rows.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          format: CSV
          sales: []
      status: 400
      response:
        error: format and 1..20 sales are required
      detailDescription: <p><code>DesignPatternExperimentService.report()</code> checks <code>sales.isEmpty()</code> on entry and throws <code>IllegalArgumentException</code>.
        No Sale, creator or report content is constructed; the handler returns HTTP 400.</p>
DesignPitfallExperimentController:
  seats(SeatsRequest):
    methodName: seats
    httpMethods:
    - POST
    mappingPaths:
    - /oop/design-pitfalls/seats/experiment
    usage: true
    cases:
    - id: case_001
      title: Mixed reservations, cancellations, and rejections
      description: Five steps demonstrate guarded reserve/cancel and a preserved invariant.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 5
          actions:
          - type: RESERVE
            seats: 4
          - type: RESERVE
            seats: 2
          - type: CANCEL
            seats: 1
          - type: CANCEL
            seats: 5
          - type: RESERVE
            seats: 2
      status: 200
      response:
        initial:
          capacity: 5
          reserved: 0
          available: 5
        steps:
        - index: 1
          type: RESERVE
          seats: 4
          accepted: true
          detail: completed
          before:
            capacity: 5
            reserved: 0
            available: 5
          after:
            capacity: 5
            reserved: 4
            available: 1
        - index: 2
          type: RESERVE
          seats: 2
          accepted: false
          detail: not enough available seats
          before:
            capacity: 5
            reserved: 4
            available: 1
          after:
            capacity: 5
            reserved: 4
            available: 1
        - index: 3
          type: CANCEL
          seats: 1
          accepted: true
          detail: completed
          before:
            capacity: 5
            reserved: 4
            available: 1
          after:
            capacity: 5
            reserved: 3
            available: 2
        - index: 4
          type: CANCEL
          seats: 5
          accepted: false
          detail: cannot cancel more than reserved
          before:
            capacity: 5
            reserved: 3
            available: 2
          after:
            capacity: 5
            reserved: 3
            available: 2
        - index: 5
          type: RESERVE
          seats: 2
          accepted: true
          detail: completed
          before:
            capacity: 5
            reserved: 3
            available: 2
          after:
            capacity: 5
            reserved: 5
            available: 0
        current:
          capacity: 5
          reserved: 5
          available: 0
        invariantPreserved: true
        scope: REQUEST_LOCAL_SINGLE_JVM_IN_MEMORY_NO_DURABLE_RESERVATIONS
      detailDescription: '<p>Start with capacity 5: RESERVE 4 sets reserved to 4; RESERVE 2 exceeds the remaining seat and is rejected without mutation. CANCEL 1
        lowers reserved to 3; CANCEL 5 exceeds reserved and is rejected; the final RESERVE 2 succeeds and reaches reserved=5. HTTP 200 carries all steps with invariantPreserved=true.</p>'
    - id: case_002
      title: Over-reservation does not corrupt state
      description: An unsuccessful reservation keeps identical before/after snapshots.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 3
          actions:
          - type: RESERVE
            seats: 2
          - type: RESERVE
            seats: 2
          - type: CANCEL
            seats: 1
      status: 200
      response:
        initial:
          capacity: 3
          reserved: 0
          available: 3
        steps:
        - index: 1
          type: RESERVE
          seats: 2
          accepted: true
          detail: completed
          before:
            capacity: 3
            reserved: 0
            available: 3
          after:
            capacity: 3
            reserved: 2
            available: 1
        - index: 2
          type: RESERVE
          seats: 2
          accepted: false
          detail: not enough available seats
          before:
            capacity: 3
            reserved: 2
            available: 1
          after:
            capacity: 3
            reserved: 2
            available: 1
        - index: 3
          type: CANCEL
          seats: 1
          accepted: true
          detail: completed
          before:
            capacity: 3
            reserved: 2
            available: 1
          after:
            capacity: 3
            reserved: 1
            available: 2
        current:
          capacity: 3
          reserved: 1
          available: 2
        invariantPreserved: true
        scope: REQUEST_LOCAL_SINGLE_JVM_IN_MEMORY_NO_DURABLE_RESERVATIONS
      detailDescription: <p>For capacity 3, reserving two succeeds. The second two-seat reservation raises IllegalStateException not enough available seats, since
        only one remains; before/after snapshots both show reserved=2. CANCEL 1 then leaves reserved=1 and available=2.</p>
    - id: case_003
      title: Zero seats rejects one step but later work continues
      description: CANCEL 0 fails inside the action loop, not during request validation.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 2
          actions:
          - type: CANCEL
            seats: 0
          - type: RESERVE
            seats: 1
      status: 200
      response:
        initial:
          capacity: 2
          reserved: 0
          available: 2
        steps:
        - index: 1
          type: CANCEL
          seats: 0
          accepted: false
          detail: seats must be positive
          before:
            capacity: 2
            reserved: 0
            available: 2
          after:
            capacity: 2
            reserved: 0
            available: 2
        - index: 2
          type: RESERVE
          seats: 1
          accepted: true
          detail: completed
          before:
            capacity: 2
            reserved: 0
            available: 2
          after:
            capacity: 2
            reserved: 1
            available: 1
        current:
          capacity: 2
          reserved: 1
          available: 1
        invariantPreserved: true
        scope: REQUEST_LOCAL_SINGLE_JVM_IN_MEMORY_NO_DURABLE_RESERVATIONS
      detailDescription: <p>CANCEL 0 passes action prevalidation because type and seats are non-null, but SeatInventory.requirePositive rejects it inside the action
        loop. The service records accepted=false with seats must be positive and unchanged reserved=0. The next RESERVE 1 succeeds, and the API returns HTTP 200.</p>
    - id: case_004
      title: Reject zero capacity with HTTP 400
      description: SeatInventory requires capacity in the range 1–10000.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 0
          actions:
          - type: RESERVE
            seats: 1
      status: 400
      response:
        error: capacity must be between 1 and 10000
      detailDescription: <p>The service accepts a structurally valid actions array, but SeatInventory constructor rejects capacity zero. IllegalArgumentException
        occurs outside the per-action catch and DesignPitfallExceptionHandler returns HTTP 400 with error.</p>
    - id: case_005
      title: Reject unsupported BUY operation
      description: Only exact RESERVE/CANCEL operation types are supported.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 4
          actions:
          - type: BUY
            seats: 1
      status: 400
      response:
        error: seat action must have type RESERVE/CANCEL and seats
      detailDescription: <p>DesignPitfallExperimentService.seats validates all action types before constructing SeatInventory. BUY is not RESERVE or CANCEL, so it
        raises IllegalArgumentException and returns HTTP 400 without partial steps.</p>
    - id: case_006
      title: Reject an empty action list
      description: The service requires 1–20 actions per request.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 4
          actions: []
      status: 400
      response:
        error: capacity and 1..20 seat actions are required
      detailDescription: <p>An empty actions array is rejected before constructing SeatInventory, with capacity and 1..20 seat actions are required. The scoped handler
        maps it to HTTP 400.</p>
  mutableKey(MutableKeyRequest):
    methodName: mutableKey
    httpMethods:
    - POST
    mappingPaths:
    - /oop/design-pitfalls/mutable-key/experiment
    usage: true
    cases:
    - id: case_001
      title: Renaming ALICE to BOB makes a mutable key unreachable
      description: Contrast unsafe HashMap lookup and stable identity using the tested example.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          originalName: ALICE
          changedName: BOB
      status: 200
      response:
        originalName: ALICE
        changedName: BOB
        originalHash: 62365280
        newHash: 65941
        unsafeFoundBeforeRename: true
        unsafeFoundAfterRename: false
        lookupByOldNameAfterRename: false
        unsafeMapEntries: 1
        stableFoundBeforeRename: true
        stableFoundAfterRename: true
        stableProfileNameAfterRename: BOB
        stableMapEntries: 1
      detailDescription: <p>UnsafeKey is inserted into HashMap with displayName=ALICE. After renaming to BOB, the same key has a different hashCode, so both containsKey
        using the mutated reference and lookup by the old ALICE name return false, despite unsafeMapEntries=1. The immutable StableId CUSTOMER-1 still resolves, and
        the Profile now reports BOB.</p>
    - id: case_002
      title: Single-letter names also fail after rehashing
      description: Use A and B to expose simple, checkable hash values.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          originalName: A
          changedName: B
      status: 200
      response:
        originalName: A
        changedName: B
        originalHash: 65
        newHash: 66
        unsafeFoundBeforeRename: true
        unsafeFoundAfterRename: false
        lookupByOldNameAfterRename: false
        unsafeMapEntries: 1
        stableFoundBeforeRename: true
        stableFoundAfterRename: true
        stableProfileNameAfterRename: B
        stableMapEntries: 1
      detailDescription: <p>Java String.hashCode produces 65 for A and 66 for B. Since the HashMap entry was stored using the previous bucket, renaming UnsafeKey
        from A to B causes the same lost-lookup behavior. The stable-ID map still has one entry, and its Profile reports B.</p>
    - id: case_003
      title: Reject equal old and new names
      description: Equal names cannot demonstrate a changed hash.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          originalName: ALICE
          changedName: ALICE
      status: 400
      response:
        error: names must be distinct with different hashCodes to illustrate lost lookup
      detailDescription: <p>observe requires different names and different hash codes. Renaming ALICE to itself violates that guard and throws IllegalArgumentException
        before creating either map. The handler returns HTTP 400 with the documented message.</p>
    - id: case_004
      title: Reject lowercase names
      description: Only uppercase ASCII/digit/hyphen names meet validation.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          originalName: alice
          changedName: BOB
      status: 400
      response:
        error: name must be 1..24 uppercase ASCII letters, digits or hyphens
      detailDescription: <p>validateName requires pattern [A-Z][A-Z0-9-]{0,23}; lowercase alice fails it, raising IllegalArgumentException name must be 1..24 uppercase
        ASCII letters, digits or hyphens and returning HTTP 400.</p>
  checkout(CheckoutRequest):
    methodName: checkout
    httpMethods:
    - POST
    mappingPaths:
    - /oop/design-pitfalls/checkout/refactor
    usage: true
    cases:
    - id: case_001
      title: Member discount with STANDARD shipping
      description: Compare legacy/refactored results for quantity three, price 10000, and membership.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: SKU-1
          unitPriceVnd: 10000
          quantity: 3
          availableUnits: 5
          member: true
          deliveryMode: STANDARD
      status: 200
      response:
        legacy:
          subtotalVnd: 30000
          discountVnd: 1500
          deliveryVnd: 20000
          payableVnd: 48500
        refactored:
          subtotalVnd: 30000
          discountVnd: 1500
          deliveryVnd: 20000
          payableVnd: 48500
        sameResult: true
        collaborationTrace:
        - StockGuard.requireAvailable
        - PriceRules.subtotal
        - PriceRules.discount
        - DeliveryRules.fee
        - CheckoutWorkflow.quote
        scope: PURE_IN_MEMORY_QUOTE_NO_STOCK_RESERVATION_PAYMENT_OR_PERSISTENCE
      detailDescription: <p>Both branches compute subtotal 10000×3=30000, member discount 5% as 1500, and STANDARD delivery 20000, yielding payable=48500. <code>CheckoutComparison.evaluate</code>
        compares the Quotes, sets sameResult=true, and records five calls through StockGuard, PriceRules, DeliveryRules, and CheckoutWorkflow.</p>
    - id: case_002
      title: EXPRESS shipping changes fee, not equivalence
      description: EXPRESS costs 15000 VND more than STANDARD for the same order.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: SKU-1
          unitPriceVnd: 10000
          quantity: 3
          availableUnits: 5
          member: true
          deliveryMode: EXPRESS
      status: 200
      response:
        legacy:
          subtotalVnd: 30000
          discountVnd: 1500
          deliveryVnd: 35000
          payableVnd: 63500
        refactored:
          subtotalVnd: 30000
          discountVnd: 1500
          deliveryVnd: 35000
          payableVnd: 63500
        sameResult: true
        collaborationTrace:
        - StockGuard.requireAvailable
        - PriceRules.subtotal
        - PriceRules.discount
        - DeliveryRules.fee
        - CheckoutWorkflow.quote
        scope: PURE_IN_MEMORY_QUOTE_NO_STOCK_RESERVATION_PAYMENT_OR_PERSISTENCE
      detailDescription: <p>With the same order and discount, EXPRESS delivery costs 35000 and payable becomes 30000−1500+35000=63500. <code>LegacyCheckout</code>
        and <code>CheckoutWorkflow</code> return the same value; the trace demonstrates responsibility separation without changing behavior.</p>
    - id: case_003
      title: Nonmember receives no discount
      description: Pay full price with member=false and EXPRESS shipping.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: BOOK-1
          unitPriceVnd: 100
          quantity: 2
          availableUnits: 2
          member: false
          deliveryMode: EXPRESS
      status: 200
      response:
        legacy:
          subtotalVnd: 200
          discountVnd: 0
          deliveryVnd: 35000
          payableVnd: 35200
        refactored:
          subtotalVnd: 200
          discountVnd: 0
          deliveryVnd: 35000
          payableVnd: 35200
        sameResult: true
        collaborationTrace:
        - StockGuard.requireAvailable
        - PriceRules.subtotal
        - PriceRules.discount
        - DeliveryRules.fee
        - CheckoutWorkflow.quote
        scope: PURE_IN_MEMORY_QUOTE_NO_STOCK_RESERVATION_PAYMENT_OR_PERSISTENCE
      detailDescription: <p>With member=false, discount is zero. Two BOOK-1 items at 100 VND give subtotal=200, EXPRESS delivery=35000, and payable=35200. Legacy
        and refactored Quotes match without stock reservation, payment, or persistence.</p>
    - id: case_004
      title: Rounding the 5% member discount on a small value
      description: A one-VND subtotal rounds the 5% discount down to zero.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: BOOK-1
          unitPriceVnd: 1
          quantity: 1
          availableUnits: 1
          member: true
          deliveryMode: STANDARD
      status: 200
      response:
        legacy:
          subtotalVnd: 1
          discountVnd: 0
          deliveryVnd: 20000
          payableVnd: 20001
        refactored:
          subtotalVnd: 1
          discountVnd: 0
          deliveryVnd: 20000
          payableVnd: 20001
        sameResult: true
        collaborationTrace:
        - StockGuard.requireAvailable
        - PriceRules.subtotal
        - PriceRules.discount
        - DeliveryRules.fee
        - CheckoutWorkflow.quote
        scope: PURE_IN_MEMORY_QUOTE_NO_STOCK_RESERVATION_PAYMENT_OR_PERSISTENCE
      detailDescription: <p>For subtotal=1 and member=true, integer division in <code>(subtotal*5+50)/100</code> rounds the 5% discount to zero. STANDARD adds 20000,
        giving payable=20001. Both implementations apply the same arithmetic.</p>
    - id: case_005
      title: Reject quantity exceeding stock
      description: Only one item is available but two are requested.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: SKU-1
          unitPriceVnd: 100
          quantity: 2
          availableUnits: 1
          member: false
          deliveryMode: STANDARD
      status: 422
      response:
        error: insufficient stock
      detailDescription: <p><code>LegacyCheckout.quote</code> checks quantity against availableUnits before pricing and raises IllegalStateException insufficient
        stock. This error occurs outside any per-action catch, so the controller-scoped handler returns HTTP 422 with only an error property. The refactored path
        is not executed.</p>
    - id: case_006
      title: Reject unsupported UNKNOWN shipping mode
      description: deliveryMode must be exactly STANDARD or EXPRESS.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: SKU-1
          unitPriceVnd: 100
          quantity: 1
          availableUnits: 1
          member: false
          deliveryMode: UNKNOWN
      status: 400
      response:
        error: deliveryMode must be STANDARD or EXPRESS
      detailDescription: <p><code>CheckoutComparison.Input</code> validates deliveryMode in its constructor, before either algorithm is called. UNKNOWN is unsupported,
        so IllegalArgumentException yields HTTP 400 with no Quote fields.</p>
    - id: case_007
      title: Reject missing quantity
      description: A null quantity is rejected by the service before Input construction.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: SKU-1
          unitPriceVnd: 100
          quantity: null
          availableUnits: 1
          member: false
          deliveryMode: STANDARD
      status: 400
      response:
        error: sku, unitPriceVnd, quantity, availableUnits, member, deliveryMode are required
      detailDescription: <p><code>DesignPitfallExperimentService.checkout</code> rejects quantity=null before building the Input record. HTTP 400 carries the service
        message; no collaborationTrace or quote is produced.</p>
    - id: case_008
      title: Reject lowercase SKU
      description: The Input record requires uppercase letters, digits, or hyphens in SKU.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: bad-sku
          unitPriceVnd: 100
          quantity: 1
          availableUnits: 1
          member: false
          deliveryMode: STANDARD
      status: 400
      response:
        error: sku must be 2..24 uppercase letters/digits/hyphens
      detailDescription: <p><code>CheckoutComparison.Input</code> validates SKU with pattern [A-Z0-9-]{2,24}. Lowercase bad-sku fails and yields IllegalArgumentException
        and HTTP 400 before LegacyCheckout is invoked.</p>
EncapsulationExperimentController:
  cart(CartRequest):
    methodName: cart
    httpMethods:
    - POST
    mappingPaths:
    - /oop/encapsulation/cart/experiment
    usage: true
    cases:
    - id: case_001
      title: Successful and rejected cart changes in one request
      description: Observe valid insert and quantity update, followed by a negative quantity and unknown SKU; snapshots for rejected steps stay unchanged.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialLines:
          - sku: BOOK
            unitPriceVnd: 100
            quantity: 2
          actions:
          - type: put
            sku: PEN
            unitPriceVnd: 50
            quantity: 1
          - type: changeQuantity
            sku: BOOK
            quantity: 3
          - type: changeQuantity
            sku: BOOK
            quantity: -1
          - type: remove
            sku: UNKNOWN
      status: 200
      response:
        initial: &id010
          lines:
          - sku: BOOK
            unitPriceVnd: 100
            quantity: 2
            lineTotalVnd: 200
          totalVnd: 200
        steps:
        - index: 1
          type: put
          accepted: true
          detail: completed
          before: *id010
          after: &id011
            lines:
            - sku: BOOK
              unitPriceVnd: 100
              quantity: 2
              lineTotalVnd: 200
            - sku: PEN
              unitPriceVnd: 50
              quantity: 1
              lineTotalVnd: 50
            totalVnd: 250
        - index: 2
          type: changeQuantity
          accepted: true
          detail: completed
          before: *id011
          after: &id012
            lines:
            - sku: BOOK
              unitPriceVnd: 100
              quantity: 3
              lineTotalVnd: 300
            - sku: PEN
              unitPriceVnd: 50
              quantity: 1
              lineTotalVnd: 50
            totalVnd: 350
        - index: 3
          type: changeQuantity
          accepted: false
          detail: nextQuantity must be 0..1000000
          before: *id012
          after: *id012
        - index: 4
          type: remove
          accepted: false
          detail: unknown sku
          before: *id012
          after: *id012
        current: *id012
        scope: REQUEST_LOCAL_IN_MEMORY_NO_PERSISTENCE
      detailDescription: <p><code>put(PEN)</code> raises the total from 200 to 250; <code>changeQuantity(BOOK,3)</code> reaches 350. A negative quantity fails with
        <code>nextQuantity must be 0..1000000</code>, while <code>remove(UNKNOWN)</code> fails with <code>unknown sku</code>. Both exceptions are caught per action,
        so their <code>accepted=false</code> steps have identical before/after snapshots. The overall HTTP status is 200 and the final total is 350 VND.</p>
    - id: case_002
      title: Zero quantity removes a cart line
      description: Setting the next quantity to zero is the domain method's supported removal behavior.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialLines:
          - sku: BOOK
            unitPriceVnd: 100
            quantity: 2
          actions:
          - type: changeQuantity
            sku: BOOK
            quantity: 0
      status: 200
      response:
        initial: *id010
        steps:
        - index: 1
          type: changeQuantity
          accepted: true
          detail: completed
          before: *id010
          after: &id013
            lines: []
            totalVnd: 0
        current: *id013
        scope: REQUEST_LOCAL_IN_MEMORY_NO_PERSISTENCE
      detailDescription: <p><code>EncapsulatedCart.changeQuantity()</code> explicitly accepts a next quantity of zero and removes <code>BOOK</code> from the candidate
        map. After the total check, <code>commit()</code> updates internal state. The final cart has no lines and total zero, while the initial snapshot still shows
        BOOK × 2 and total 200.</p>
    - id: case_003
      title: Reject duplicated initial SKU
      description: Constructor validation protects the cart boundary before any action can run.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialLines:
          - sku: BOOK
            unitPriceVnd: 100
            quantity: 2
          - sku: BOOK
            unitPriceVnd: 50
            quantity: 1
          actions:
          - type: remove
            sku: BOOK
      status: 400
      response:
        error: initialLines cannot contain null or duplicate sku
      detailDescription: <p><code>EncapsulatedCart</code> stages initial lines in a temporary <code>LinkedHashMap</code> using <code>putIfAbsent()</code>. The second
        BOOK key is duplicate, so the constructor throws <code>IllegalArgumentException</code> before the action loop. The handler returns HTTP 400 with the original
        error string.</p>
    - id: case_004
      title: Require at least one action
      description: The service validates the work-limit contract before constructing the cart.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialLines: []
          actions: []
      status: 400
      response:
        error: actions must contain 1..20 steps
      detailDescription: <p><code>checkActions()</code> rejects an empty action list as <code>simulateCart()</code> begins. No cart snapshot or step is constructed;
        HTTP 400 returns the Java exception message in <code>ErrorResponse.error</code>.</p>
  stock(StockRequest):
    methodName: stock
    httpMethods:
    - POST
    mappingPaths:
    - /oop/encapsulation/stock/experiment
    usage: true
    cases:
    - id: case_001
      title: Reserve, reject over-reservation, ship and release
      description: Four operations illustrate related stock invariants even when a step fails.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOX
          initialOnHand: 10
          initialReserved: 0
          actions:
          - type: reserve
            units: 8
          - type: reserve
            units: 3
          - type: ship
            units: 4
          - type: release
            units: 2
      status: 200
      response:
        initial: &id014
          sku: BOX
          onHand: 10
          reserved: 0
          available: 10
        steps:
        - index: 1
          type: reserve
          accepted: true
          detail: completed
          before: *id014
          after: &id015
            sku: BOX
            onHand: 10
            reserved: 8
            available: 2
        - index: 2
          type: reserve
          accepted: false
          detail: insufficient available units
          before: *id015
          after: *id015
        - index: 3
          type: ship
          accepted: true
          detail: completed
          before: *id015
          after: &id016
            sku: BOX
            onHand: 6
            reserved: 4
            available: 2
        - index: 4
          type: release
          accepted: true
          detail: completed
          before: *id016
          after: &id017
            sku: BOX
            onHand: 6
            reserved: 2
            available: 4
        current: *id017
      detailDescription: <p>Ten units are initially available. Reserving eight succeeds and leaves two available; reserving another three fails with <code>insufficient
        available units</code> and changes nothing. <code>ship(4)</code> lowers both onHand and reserved to 6/4, and <code>release(2)</code> leaves 6/2 with four
        available. Each <code>StockStep</code> captures before/after; the API returns HTTP 200.</p>
    - id: case_002
      title: Reject invalid initial inventory invariant
      description: Reserved units exceeding on-hand units cannot form a valid StockLedger.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOX
          initialOnHand: 1
          initialReserved: 3
          actions:
          - type: ship
            units: 1
      status: 400
      response:
        error: require 0 <= reserved <= onHand <= 1000000
      detailDescription: <p>The <code>StockLedger(&quot;BOX&quot;,1,3)</code> constructor checks <code>initialReserved &gt; initialOnHand</code> and throws <code>IllegalArgumentException</code>
        before recording any step. The handler returns HTTP 400 rather than a normal rejected action.</p>
    - id: case_003
      title: Stock ceiling blocks another restock
      description: Adding one unit at the maximum does not alter on-hand inventory.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOX
          initialOnHand: 1000000
          initialReserved: 0
          actions:
          - type: restock
            units: 1
      status: 200
      response:
        initial: &id018
          sku: BOX
          onHand: 1000000
          reserved: 0
          available: 1000000
        steps:
        - index: 1
          type: restock
          accepted: false
          detail: stock limit exceeded
          before: *id018
          after: *id018
        current: *id018
      detailDescription: <p><code>StockLedger.restock(1)</code> checks <code>amount &gt; MAX_UNITS - onHand</code> and throws <code>IllegalStateException</code> before
        updating stock. The service captures an <code>accepted=false</code> step with unchanged 1000000 on-hand units. This is an HTTP 200 simulation result.</p>
    - id: case_004
      title: Reject an action with zero units
      description: The domain method enforces positive units even if the action payload has all required fields.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOX
          initialOnHand: 10
          initialReserved: 0
          actions:
          - type: reserve
            units: 0
      status: 200
      response:
        initial: &id019
          sku: BOX
          onHand: 10
          reserved: 0
          available: 10
        steps:
        - index: 1
          type: reserve
          accepted: false
          detail: amount must be positive
          before: *id019
          after: *id019
        current: *id019
      detailDescription: <p>The supported action passes up-front structural validation, then <code>StockLedger.positive(0)</code> throws <code>IllegalArgumentException</code>.
        The per-step catch records <code>accepted=false</code> and unchanged inventory in an HTTP 200 response.</p>
  snapshot(EventRequest):
    methodName: snapshot
    httpMethods:
    - POST
    mappingPaths:
    - /oop/encapsulation/event-snapshot/experiment
    usage: true
    cases:
    - id: case_001
      title: External and getter mutations cannot change snapshot
      description: Demonstrates defensive copying of Date and immutable string projections of mutable attendees.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          startEpochMillis: 1000
          attendeeNames:
          - An
          - Binh
          mutatedExternalEpochMillis: 2000
          renamedFirst: Changed
          addedAttendee: New
      status: 200
      response:
        originalDraft: &id020
          startEpochMillis: 1000
          attendeeNames:
          - An
          - Binh
        mutatedDraft:
          startEpochMillis: 2000
          attendeeNames:
          - Changed
          - Binh
          - New
        protectedSnapshot: *id020
        afterGetterMutation: *id020
        returnedListIsUnmodifiable: true
      detailDescription: <p><code>EventSnapshot</code> captures timestamp 1000 and An/Binh. The service then changes the external date to 2000, renames An to Changed
        and adds New; only <code>mutatedDraft</code> reflects these edits. The date getter returns a copy, and the <code>List.copyOf</code> name list rejects append,
        so <code>protectedSnapshot</code> and <code>afterGetterMutation</code> still match the original.</p>
    - id: case_002
      title: Reject an event without attendees
      description: The 1–19 initial attendee constraint is checked before any snapshot is created.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          startEpochMillis: 1000
          attendeeNames: []
          mutatedExternalEpochMillis: 2000
          renamedFirst: Changed
          addedAttendee: New
      status: 400
      response:
        error: dates and 1..19 initial attendeeNames are required
      detailDescription: <p><code>simulateEvent()</code> checks <code>attendeeNames.isEmpty()</code> and throws <code>IllegalArgumentException</code> before constructing
        drafts. The exception handler returns HTTP 400 with the service's exact error string.</p>
    - id: case_003
      title: Reject an empty replacement name
      description: AttendeeDraft validates the proposed name before any snapshot is captured.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          startEpochMillis: 1000
          attendeeNames:
          - An
          mutatedExternalEpochMillis: 2000
          renamedFirst: ''
          addedAttendee: New
      status: 400
      response:
        error: attendee name must contain 1..80 characters
      detailDescription: <p><code>new EventSnapshot.AttendeeDraft(renamedFirst)</code> prevalidates the new name. An empty string makes <code>rename()</code> throw
        <code>IllegalArgumentException</code>, before creating an <code>EventSnapshot</code>. The handler returns HTTP 400.</p>
  order(OrderRequest):
    methodName: order
    httpMethods:
    - POST
    mappingPaths:
    - /oop/encapsulation/order/experiment
    usage: true
    cases:
    - id: case_001
      title: Allow only legal order transitions
      description: Try shipping before payment, marking paid, cancelling after payment, and shipping successfully.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: O-1
          items: &id021
          - sku: BOOK
            quantity: 1
          actions:
          - type: ship
          - type: markPaid
          - type: cancel
          - type: ship
      status: 200
      response:
        initial: &id022
          orderId: O-1
          status: CREATED
          items: *id021
        steps:
        - index: 1
          type: ship
          accepted: false
          detail: ship not allowed when CREATED
          before: *id022
          after: *id022
        - index: 2
          type: markPaid
          accepted: true
          detail: completed
          before: *id022
          after: &id023
            orderId: O-1
            status: PAID
            items: *id021
        - index: 3
          type: cancel
          accepted: false
          detail: cancel not allowed when PAID
          before: *id023
          after: *id023
        - index: 4
          type: ship
          accepted: true
          detail: completed
          before: *id023
          after: &id024
            orderId: O-1
            status: SHIPPED
            items: *id021
        current: *id024
        scope: SIMULATED_ORDER_NO_REAL_PAYMENT_OR_SHIPPING
      detailDescription: <p><code>LifecycleOrder</code> begins <code>CREATED</code>; <code>ship()</code> is rejected and leaves it CREATED. <code>markPaid()</code>
        moves to <code>PAID</code>, where <code>cancel()</code> is rejected without mutation. The final <code>ship()</code> transitions to <code>SHIPPED</code>. Invalid
        steps are recorded with <code>accepted=false</code>; no real payment or shipment happens.</p>
    - id: case_002
      title: Cancelling before payment is terminal
      description: CREATED can be cancelled, but the cancelled order cannot subsequently be marked paid.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: O-2
          items: *id021
          actions:
          - type: cancel
          - type: markPaid
      status: 200
      response:
        initial: &id025
          orderId: O-2
          status: CREATED
          items: *id021
        steps:
        - index: 1
          type: cancel
          accepted: true
          detail: completed
          before: *id025
          after: &id026
            orderId: O-2
            status: CANCELLED
            items: *id021
        - index: 2
          type: markPaid
          accepted: false
          detail: markPaid not allowed when CANCELLED
          before: *id026
          after: *id026
        current: *id026
        scope: SIMULATED_ORDER_NO_REAL_PAYMENT_OR_SHIPPING
      detailDescription: <p><code>cancel()</code> accepts <code>CREATED</code> and moves to <code>CANCELLED</code>. A later <code>markPaid()</code> fails <code>requireStatus(CREATED)</code>
        with <code>markPaid not allowed when CANCELLED</code>. The second step is rejected and the final status remains CANCELLED.</p>
    - id: case_003
      title: Reject an empty order ID
      description: The constructor validates the identifier before entering the lifecycle.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: ''
          items: *id021
          actions:
          - type: cancel
      status: 400
      response:
        error: orderId must be 1..40 characters
      detailDescription: <p><code>LifecycleOrder</code> validates <code>orderId.strip().matches(...)</code> and rejects the empty string. Construction fails before
        processing any action; the exception handler returns HTTP 400 with the exact error.</p>
    - id: case_004
      title: Reject unsupported reopen action
      description: The API exposes only three supported business intents.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: O-1
          items: *id021
          actions:
          - type: reopen
      status: 400
      response:
        error: order actions must be markPaid/ship/cancel
      detailDescription: <p><code>simulateOrder()</code> validates every action type before constructing a <code>LifecycleOrder</code>. It permits only <code>markPaid</code>,
        <code>ship</code> and <code>cancel</code>. A <code>reopen</code> action throws <code>IllegalArgumentException</code>, mapped to HTTP 400 before any state
        transition.</p>
InheritanceExperimentsController:
  calculatePay(PayrollRequest):
    methodName: calculatePay
    httpMethods:
    - POST
    mappingPaths:
    - /oop/inheritance/payroll/calculate
    usage: true
    cases:
    - id: case_001
      title: Salaried employee uses superclass reference
      description: Identity is trimmed and monthly pay follows the fixed-salary override.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: salaried
          employeeId: ' E-01 '
          employeeName: ' Ada '
          monthlySalaryVnd: 20000000
          hourlyRateVnd: 0
          workedHours: 0
      status: 200
      response:
        employeeId: E-01
        employeeName: Ada
        kind: SALARIED
        runtimeClass: Salaried
        declaredType: Employee
        calculation: FIXED_MONTHLY
        monthlyPayVnd: 20000000
        simulatedOnly: true
      detailDescription: <p><code>PayrollInheritanceService</code> normalizes salaried to SALARIED, verifies both hourly fields are zero and constructs <code>Employee.Salaried</code>.
        Its superclass constructor trims E-01 and Ada. Despite the declared <code>Employee</code> reference, dynamic dispatch calls the subclass pay method returning
        20000000 and FIXED_MONTHLY. HTTP 200 marks simulatedOnly=true.</p>
    - id: case_002
      title: Hourly override multiplies rate by hours
      description: A superclass reference dispatches to Hourly's calculation.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: HOURLY
          employeeId: H-01
          employeeName: Grace
          monthlySalaryVnd: 0
          hourlyRateVnd: 130000
          workedHours: 160
      status: 200
      response:
        employeeId: H-01
        employeeName: Grace
        kind: HOURLY
        runtimeClass: Hourly
        declaredType: Employee
        calculation: HOURLY_RATE_TIMES_HOURS
        monthlyPayVnd: 20800000
        simulatedOnly: true
      detailDescription: <p>The HOURLY branch requires monthlySalaryVnd=0 and constructs <code>Employee.Hourly</code> with rate 130000 for 160 hours. Its <code>monthlyPayVnd()</code>
        calls <code>Math.multiplyExact</code>, yielding 20800000. The declared type is <code>Employee</code> while the runtime class and calculation belong to <code>Hourly</code>.</p>
    - id: case_003
      title: Reject hourly fields for salaried payroll
      description: The SALARIED kind cannot carry a nonzero hourlyRateVnd.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: SALARIED
          employeeId: E-01
          employeeName: Ada
          monthlySalaryVnd: 5000
          hourlyRateVnd: 5
          workedHours: 0
      status: 400
      response:
        code: INVALID_INPUT
        message: Salaried employees must not supply hourly fields
      detailDescription: <p>The SALARIED branch sees hourlyRateVnd=5 even though hourly inputs must be zero. <code>PayrollInheritanceService.calculate</code> throws
        <code>IllegalArgumentException</code> before constructing the employee. <code>InheritanceExceptionHandler</code> returns HTTP 400 with the exact input-validation
        message.</p>
    - id: case_004
      title: Arithmetic overflow yields HTTP 422
      description: Math.multiplyExact detects Long.MAX_VALUE multiplied by two.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: HOURLY
          employeeId: H1
          employeeName: Ada
          monthlySalaryVnd: 0
          hourlyRateVnd: 9223372036854775807
          workedHours: 2
      status: 422
      response:
        code: ARITHMETIC_OVERFLOW
        message: Calculation exceeded supported numeric limits
      detailDescription: <p>The hourly rate is <code>Long.MAX_VALUE</code> and workedHours=2 passes nonnegative/range checks. <code>Employee.Hourly.monthlyPayVnd()</code>
        invokes <code>Math.multiplyExact</code>, which throws <code>ArithmeticException</code>. The chapter advice converts it to HTTP 422 <code>ARITHMETIC_OVERFLOW</code>,
        avoiding a wrapped salary.</p>
  compareDelivery(DeliveryRequest):
    methodName: compareDelivery
    httpMethods:
    - POST
    mappingPaths:
    - /oop/inheritance/delivery/compare
    usage: true
    cases:
    - id: case_001
      title: Ordinary delivery inherits base behavior
      description: CityDelivery inherits distanceFee; both approaches calculate the same fee.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          distanceKm: 3
          priority: false
          holiday: false
      status: 200
      response:
        hierarchyType: CityDelivery
        inheritanceFeeVnd: 13000
        inheritanceTrace: &id027
        - 'base distance: +3000'
        - 'fixed base: +10000'
        compositionFeeVnd: 13000
        compositionTrace: *id027
        equal: true
        simulatedOnly: true
      detailDescription: <p>The service selects <code>DeliveryPlan.CityDelivery</code>, which inherits <code>distanceFee</code> without overriding it. <code>quote(3)</code>
        calculates 3?1000=3000 plus base 10000, totalling 13000. Composition applies the same components and trace, producing equal=true.</p>
    - id: case_002
      title: Deep super chain adds two surcharges
      description: HolidayPriorityDelivery layers overrides through PriorityCityDelivery and DeliveryPlan.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          distanceKm: 3
          priority: true
          holiday: true
      status: 200
      response:
        hierarchyType: HolidayPriorityDelivery
        inheritanceFeeVnd: 25000
        inheritanceTrace: &id028
        - 'base distance: +3000'
        - 'priority surcharge: +5000'
        - 'holiday surcharge: +7000'
        - 'fixed base: +10000'
        compositionFeeVnd: 25000
        compositionTrace: *id028
        equal: true
        simulatedOnly: true
      detailDescription: <p><code>HolidayPriorityDelivery.distanceFee</code> calls <code>super.distanceFee</code>, triggering Priority's parent call for distance
        3000 and priority surcharge 5000, then adding holiday surcharge 7000. Final <code>DeliveryPlan.quote</code> adds base 10000 for 25000. Independent composition
        yields the same fee and trace, so equal=true.</p>
    - id: case_003
      title: Priority override extends super behavior
      description: The subclass preserves the parent distance fee and adds a fixed surcharge.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          distanceKm: 3
          priority: true
          holiday: false
      status: 200
      response:
        hierarchyType: PriorityCityDelivery
        inheritanceFeeVnd: 18000
        inheritanceTrace: &id029
        - 'base distance: +3000'
        - 'priority surcharge: +5000'
        - 'fixed base: +10000'
        compositionFeeVnd: 18000
        compositionTrace: *id029
        equal: true
        simulatedOnly: true
      detailDescription: <p><code>PriorityCityDelivery.distanceFee</code> calls the superclass to compute 3000 at 3 km and then adds 5000. Final <code>quote</code>
        adds base 10000 for 18000. Composition checks the same priority flag and yields matching fee and trace.</p>
    - id: case_004
      title: Holiday requires the priority option
      description: The hierarchy only allows holiday when priority is enabled.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          distanceKm: 5
          priority: false
          holiday: true
      status: 400
      response:
        code: INVALID_INPUT
        message: Holiday option requires priority in this hierarchy
      detailDescription: <p><code>DeliveryComparisonService.compare</code> accepts distanceKm=5 but finds <code>holiday &amp;&amp; !priority</code> true. It throws
        <code>IllegalArgumentException</code> before selecting the hierarchy or computing composition. HTTP 400 returns <code>INVALID_INPUT</code> with the exact
        constraint message.</p>
  constructorTrace(ConstructorRequest):
    methodName: constructorTrace
    httpMethods:
    - POST
    mappingPaths:
    - /oop/inheritance/constructors/trace
    usage: true
    cases:
    - id: case_001
      title: Parent constructor observes an uninitialized child field
      description: The unsafe virtual call sees null, whereas the safe path inspects after construction.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          initialLabel: READY
      status: 200
      response:
        unsafeSequence:
        - parent constructor begins
        - 'parent sees overridden value: null'
        - 'child constructor completed: READY'
        safeSequence:
        - 'parent constructor: no overridable calls'
        - 'child constructor completed: READY'
        - 'post-construction value: READY'
        unsafeValueObservedByParent: 'null'
        finalValue: READY
        simulatedOnly: true
      detailDescription: <p><code>UnsafeChild</code> first runs <code>UnsafeParent</code>, whose <code>value()</code> dynamically dispatches to the child before its
        field initializer. String concatenation records <code>null</code> in the trace; the child later assigns READY. <code>SafeChild</code> avoids virtual calls
        in its parent constructor and inspects READY only after initialization.</p>
    - id: case_002
      title: Reject an all-whitespace label
      description: ConstructorProbe validates nonblank content before constructing either trace.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          initialLabel: '  '
      status: 400
      response:
        code: INVALID_INPUT
        message: initialLabel must contain 1..80 nonblank characters
      detailDescription: <p><code>ConstructorTraceService.trace</code> forwards two spaces to <code>ConstructorProbe.run</code>. <code>label.isBlank()</code> is true
        and throws <code>IllegalArgumentException</code> before either child is created; the advice maps the failure to HTTP 400 <code>INVALID_INPUT</code>.</p>
  resolveCapabilities(CapabilitiesRequest):
    methodName: resolveCapabilities
    httpMethods:
    - POST
    mappingPaths:
    - /oop/inheritance/capabilities/resolve
    usage: true
    cases:
    - id: case_001
      title: Resolve default conflicts and class priority
      description: MixedCapability explicitly calls both interface defaults and Taggable normalizes CSV.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          itemId: ' DOC-1 '
          tagsCsv: ' Java, OOP,Java17 '
      status: 200
      response:
        explicitConflictResolution: PRINT+SEARCH:DOC-1
        classWinsResolution: CLASS_WINS
        normalizedTags:
        - java
        - oop
        - java17
        simulatedOnly: true
      detailDescription: <p><code>CapabilityResolution</code> trims itemId to DOC-1. <code>MixedCapability.label()</code> combines <code>Printable.super.label()</code>
        and <code>Searchable.super.label()</code> into PRINT+SEARCH:DOC-1. The inherited concrete <code>ConcreteBase.label()</code> wins over Printable, yielding
        CLASS_WINS; Taggable splits, trims and lowercases java, oop, java17.</p>
    - id: case_002
      title: Reject an empty CSV element
      description: Taggable preserves empty split segments and validates each tag.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          itemId: DOC
          tagsCsv: a,,b
      status: 400
      response:
        code: INVALID_INPUT
        message: Tags must not be empty
      detailDescription: <p><code>Taggable.parseTags</code> uses <code>csv.split(&quot;,&quot;,-1)</code>, keeping the empty element in a,,b. Trimming it produces
        an empty string, which throws <code>IllegalArgumentException(&quot;Tags must not be empty&quot;)</code>. HTTP 400 returns no partial normalizedTags.</p>
    - id: case_003
      title: Reject an empty item identifier
      description: Item ID validation runs before capability construction and tag parsing.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          itemId: ''
          tagsCsv: one
      status: 400
      response:
        code: INVALID_INPUT
        message: itemId must contain 1..80 characters
      detailDescription: <p><code>CapabilityResolution.resolve</code> evaluates <code>itemId.isBlank()</code> and rejects the empty string with <code>IllegalArgumentException(&quot;itemId
        must contain 1..80 characters&quot;)</code>. No MixedCapability is created; HTTP 400 returns <code>INVALID_INPUT</code>.</p>
InterfaceExperimentsController:
  shipping(ShippingRequest):
    methodName: shipping
    httpMethods:
    - POST
    mappingPaths:
    - /oop/interfaces/shipping/quote
    usage: true
    cases:
    - id: case_001
      title: Compare economy and express shipping
      description: One input is priced through two implementations of the same interface; choose ECONOMY and inspect both fees.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          distanceKm: 4
          orderValueVnd: 100000
          selectedPolicy: ECONOMY
      status: 200
      response:
        selected: &id030
          policy: ECONOMY
          feeVnd: 20000
        allPolicies:
        - *id030
        - policy: EXPRESS
          feeVnd: 40000
        freeEconomyShipping: false
      detailDescription: <p><code>EconomyShippingPolicy</code> uses 10000 + 2500 × 4 = 20000 VND; <code>ExpressShippingPolicy</code> uses 20000 + 5000 × 4 = 40000
        VND. The 100000-VND order does not meet Economy's 500000-VND free-shipping threshold, so <code>freeEconomyShipping=false</code>. The service selects the ECONOMY
        entry from <code>allPolicies</code>.</p>
    - id: case_002
      title: Economy is free while Express is selected
      description: Implementations share a method signature but apply different conditional free-shipping rules.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          distanceKm: 4
          orderValueVnd: 500000
          selectedPolicy: EXPRESS
      status: 200
      response:
        selected: &id031
          policy: EXPRESS
          feeVnd: 40000
        allPolicies:
        - policy: ECONOMY
          feeVnd: 0
        - *id031
        freeEconomyShipping: true
      detailDescription: <p>An order of 500000 VND satisfies <code>EconomyShippingPolicy.isFree()</code>, setting the economy fee to zero. EXPRESS still costs 40000
        VND because its policy has no free-shipping override. The selected entry is EXPRESS while <code>freeEconomyShipping</code> reports Economy's zero fee.</p>
    - id: case_003
      title: Reject an unsupported policy code
      description: No provided implementation has the code UNKNOWN.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          distanceKm: 4
          orderValueVnd: 100000
          selectedPolicy: UNKNOWN
      status: 400
      response:
        error: selectedPolicy must be ECONOMY or EXPRESS
      detailDescription: <p>The service calculates both quotes, then its <code>filter()</code> cannot find <code>UNKNOWN</code>. <code>orElseThrow()</code> raises
        <code>IllegalArgumentException</code>; the scoped handler returns HTTP 400 with the exact error string.</p>
    - id: case_004
      title: Reject a negative distance at the contract boundary
      description: Shared input validation gives both policies the same admissible distance range.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          distanceKm: -1
          orderValueVnd: 100
          selectedPolicy: EXPRESS
      status: 400
      response:
        error: distanceKm must be 0..10000, orderValueVnd must be 0..1000000000000
      detailDescription: <p><code>ShippingFeePolicy.requireValid()</code> rejects <code>distanceKm=-1</code> before any pricing. Its <code>IllegalArgumentException</code>
        maps to HTTP 400, so the response has an <code>error</code> rather than any policy price.</p>
  documents(DocumentRequest):
    methodName: documents
    httpMethods:
    - POST
    mappingPaths:
    - /oop/interfaces/documents/experiment
    usage: true
    cases:
    - id: case_001
      title: Read, write and publish through three roles on one object
      description: Mixed successful and rejected actions share state across the same DocumentWorkspace.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialDocuments:
          - id: DOC-1
            title: Draft
            content: Initial
          actions:
          - type: publish
            id: MISSING
          - type: save
            id: DOC-1
            title: Edited
            content: Revision
          - type: read
            id: DOC-1
          - type: publish
            id: DOC-1
          - type: save
            id: DOC-1
            title: Late
            content: Cannot edit
          - type: read
            id: ABSENT
      status: 200
      response:
        initial: &id032
        - id: DOC-1
          title: Draft
          content: Initial
          status: DRAFT
        steps:
        - index: 1
          type: publish
          id: MISSING
          accepted: false
          detail: document does not exist
          before: *id032
          after: *id032
          readResult: null
        - index: 2
          type: save
          id: DOC-1
          accepted: true
          detail: completed
          before: *id032
          after: &id033
          - &id034
            id: DOC-1
            title: Edited
            content: Revision
            status: DRAFT
          readResult: null
        - index: 3
          type: read
          id: DOC-1
          accepted: true
          detail: found
          before: *id033
          after: *id033
          readResult: *id034
        - index: 4
          type: publish
          id: DOC-1
          accepted: true
          detail: completed
          before: *id033
          after: &id035
          - id: DOC-1
            title: Edited
            content: Revision
            status: PUBLISHED
          readResult: null
        - index: 5
          type: save
          id: DOC-1
          accepted: false
          detail: published document cannot be edited
          before: *id035
          after: *id035
          readResult: null
        - index: 6
          type: read
          id: ABSENT
          accepted: true
          detail: not found
          before: *id035
          after: *id035
          readResult: null
        current: *id035
        sharedInstance: true
        defaultConflictResolution: read+publish
        scope: REQUEST_LOCAL_IN_MEMORY_SINGLE_THREAD_NO_EXTERNAL_SIDE_EFFECTS
      detailDescription: <p><code>reader</code>, <code>writer</code> and <code>publisher</code> all refer to one <code>DocumentWorkspace</code>, making <code>sharedInstance=true</code>.
        Publishing MISSING fails; saving DOC-1 succeeds and reading returns Revision. Saving after publication is rejected without state change. Reading ABSENT is
        a successful lookup with <code>readResult=null</code>. The class resolves both interface defaults as <code>read+publish</code>.</p>
    - id: case_002
      title: Create, publish and read one document
      description: Sequential actions illustrate reader, writer and publisher contracts on one shared instance.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialDocuments: []
          actions:
          - type: save
            id: DOC-1
            title: Hello
            content: Message
          - type: publish
            id: DOC-1
          - type: read
            id: DOC-1
      status: 200
      response:
        initial: &id036 []
        steps:
        - index: 1
          type: save
          id: DOC-1
          accepted: true
          detail: completed
          before: *id036
          after: &id037
          - id: DOC-1
            title: Hello
            content: Message
            status: DRAFT
          readResult: null
        - index: 2
          type: publish
          id: DOC-1
          accepted: true
          detail: completed
          before: *id037
          after: &id038
          - &id039
            id: DOC-1
            title: Hello
            content: Message
            status: PUBLISHED
          readResult: null
        - index: 3
          type: read
          id: DOC-1
          accepted: true
          detail: found
          before: *id038
          after: *id038
          readResult: *id039
        current: *id038
        sharedInstance: true
        defaultConflictResolution: read+publish
        scope: REQUEST_LOCAL_IN_MEMORY_SINGLE_THREAD_NO_EXTERNAL_SIDE_EFFECTS
      detailDescription: <p><code>save()</code> creates DOC-1 in DRAFT state; <code>publish()</code> replaces it with a PUBLISHED record. <code>find()</code> through
        the reader role then returns the same published document state. All three steps are accepted and <code>current</code> contains the published entry.</p>
    - id: case_003
      title: Reject duplicate initial document IDs
      description: The service enforces uniqueness before constructing the workspace.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialDocuments:
          - id: DOC-1
            title: A
            content: x
          - id: DOC-1
            title: B
            content: y
          actions:
          - type: read
            id: DOC-1
      status: 400
      response:
        error: initial document ids must be unique
      detailDescription: <p><code>documents()</code> validates each <code>DocumentEntry</code> and adds its ID to a temporary <code>HashSet</code>. The second DOC-1
        makes <code>distinct.add()</code> return false, raising <code>IllegalArgumentException</code> before any action is run. HTTP 400 returns the message.</p>
    - id: case_004
      title: Reject delete outside the document contract
      description: The API exposes only save, read and publish operations.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialDocuments: []
          actions:
          - type: delete
            id: DOC-1
      status: 400
      response:
        error: document action must have type save/read/publish and id
      detailDescription: <p>Up-front <code>DocumentAction</code> validation accepts only <code>save</code>, <code>read</code> and <code>publish</code>. A <code>delete</code>
        type throws <code>IllegalArgumentException</code> before creating the workspace, producing HTTP 400 instead of a failed step.</p>
  checkout(CheckoutRequest):
    methodName: checkout
    httpMethods:
    - POST
    mappingPaths:
    - /oop/interfaces/checkout/experiment
    usage: true
    cases:
    - id: case_001
      title: Fake processing, replay and a conflicting request ID
      description: Stored receipts permit same-details replay in one request while rejecting changed payment details.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          gateway: APPROVE
          repository: HASH_MAP
          actions: &id045
          - requestId: REQ-2
            orderId: ORD-2
            amountVnd: 300
          - requestId: REQ-1
            orderId: ORD-1
            amountVnd: 100
          - requestId: REQ-2
            orderId: ORD-2
            amountVnd: 300
          - requestId: REQ-2
            orderId: ORD-2
            amountVnd: 301
      status: 200
      response:
        gateway: APPROVE
        repository: HASH_MAP
        initial: &id040
          storedPayments: []
          gatewayCalls: 0
        steps:
        - index: 1
          requestId: REQ-2
          accepted: true
          replayed: false
          detail: gateway processed
          receipt: &id041
            requestId: REQ-2
            orderId: ORD-2
            amountVnd: 300
            status: APPROVED
          before: *id040
          after: &id042
            storedPayments:
            - *id041
            gatewayCalls: 1
        - index: 2
          requestId: REQ-1
          accepted: true
          replayed: false
          detail: gateway processed
          receipt: &id043
            requestId: REQ-1
            orderId: ORD-1
            amountVnd: 100
            status: APPROVED
          before: *id042
          after: &id044
            storedPayments:
            - *id043
            - *id041
            gatewayCalls: 2
        - index: 3
          requestId: REQ-2
          accepted: true
          replayed: true
          detail: replayed without charging
          receipt: *id041
          before: *id044
          after: *id044
        - index: 4
          requestId: REQ-2
          accepted: false
          replayed: false
          detail: requestId already used for different payment details
          receipt: null
          before: *id044
          after: *id044
        current: *id044
        scope: FAKE_PAYMENT_ONLY_REQUEST_LOCAL_NO_REAL_CHARGE_NO_DURABILITY_OR_CONCURRENT_IDEMPOTENCY
      detailDescription: '<p>REQ-2 and REQ-1 each invoke the fake gateway once, storing APPROVED receipts. <code>HashPaymentRepository.listSorted()</code> orders
        stored entries by request ID: REQ-1 then REQ-2. Repeating REQ-2/300 satisfies <code>PaymentReceipt.matches()</code> and replays without charging; REQ-2/301
        conflicts and is rejected, with null receipt and <code>gatewayCalls</code> still 2. State is request-local.</p>'
    - id: case_002
      title: Swap TreeMap storage without changing the contract
      description: The same payment actions produce the same receipts and order under the alternative repository.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          gateway: APPROVE
          repository: TREE_MAP
          actions: *id045
      status: 200
      response:
        gateway: APPROVE
        repository: TREE_MAP
        initial: *id040
        steps:
        - index: 1
          requestId: REQ-2
          accepted: true
          replayed: false
          detail: gateway processed
          receipt: *id041
          before: *id040
          after: *id042
        - index: 2
          requestId: REQ-1
          accepted: true
          replayed: false
          detail: gateway processed
          receipt: *id043
          before: *id042
          after: *id044
        - index: 3
          requestId: REQ-2
          accepted: true
          replayed: true
          detail: replayed without charging
          receipt: *id041
          before: *id044
          after: *id044
        - index: 4
          requestId: REQ-2
          accepted: false
          replayed: false
          detail: requestId already used for different payment details
          receipt: null
          before: *id044
          after: *id044
        current: *id044
        scope: FAKE_PAYMENT_ONLY_REQUEST_LOCAL_NO_REAL_CHARGE_NO_DURABILITY_OR_CONCURRENT_IDEMPOTENCY
      detailDescription: <p><code>TreePaymentRepository</code> uses a <code>TreeMap</code> internally, but implements identical <code>find</code>, <code>save</code>
        and <code>listSorted</code> operations. The four processed/replayed/rejected steps and REQ-1-before-REQ-2 ordering match the HASH_MAP case. <code>CheckoutService</code>
        requires no modification.</p>
    - id: case_003
      title: Declined receipts are stored and replayed
      description: DECLINED is a valid fake gateway response rather than an HTTP error.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          gateway: DECLINE
          repository: HASH_MAP
          actions:
          - requestId: REQ-10
            orderId: ORD-10
            amountVnd: 450
          - requestId: REQ-10
            orderId: ORD-10
            amountVnd: 450
      status: 200
      response:
        gateway: DECLINE
        repository: HASH_MAP
        initial: *id040
        steps:
        - index: 1
          requestId: REQ-10
          accepted: true
          replayed: false
          detail: gateway processed
          receipt: &id046
            requestId: REQ-10
            orderId: ORD-10
            amountVnd: 450
            status: DECLINED
          before: *id040
          after: &id047
            storedPayments:
            - *id046
            gatewayCalls: 1
        - index: 2
          requestId: REQ-10
          accepted: true
          replayed: true
          detail: replayed without charging
          receipt: *id046
          before: *id047
          after: *id047
        current: *id047
        scope: FAKE_PAYMENT_ONLY_REQUEST_LOCAL_NO_REAL_CHARGE_NO_DURABILITY_OR_CONCURRENT_IDEMPOTENCY
      detailDescription: <p><code>DeclinePaymentGateway.charge()</code> returns a receipt with status <code>DECLINED</code>. Because its IDs and amount match the
        command, <code>CheckoutService</code> stores it and marks the first step accepted. The second step replays the same receipt, with <code>gatewayCalls=1</code>
        and HTTP 200. No real payment is attempted.</p>
    - id: case_004
      title: Reject zero amount before charging
      description: PaymentCommand validates values consistently for every gateway.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          gateway: APPROVE
          repository: HASH_MAP
          actions:
          - requestId: REQ-1
            orderId: ORD-1
            amountVnd: 0
      status: 400
      response:
        error: amountVnd must be 1..1000000000000
      detailDescription: <p><code>PaymentCommand</code> construction rejects <code>amountVnd=0</code> before creating <code>CheckoutService</code> and entering the
        action loop. The handler returns HTTP 400 with the constructor's error message and no payment steps.</p>
    - id: case_005
      title: Reject an unsupported gateway implementation
      description: The service validates the implementation selector before processing actions.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          gateway: UNKNOWN
          repository: HASH_MAP
          actions:
          - requestId: REQ-1
            orderId: ORD-1
            amountVnd: 100
      status: 400
      response:
        error: gateway must be APPROVE or DECLINE
      detailDescription: <p>The gateway selector <code>switch</code> only recognizes <code>APPROVE</code> and <code>DECLINE</code>. UNKNOWN takes the default branch,
        throws <code>IllegalArgumentException</code> and yields HTTP 400 without repository updates or fake charges.</p>
LanguageMechanicsExperimentsController:
  generics(GenericBatchRequest):
    methodName: generics
    httpMethods:
    - POST
    mappingPaths:
    - /oop/language-mechanics/generics/experiment
    usage: true
    cases:
    - id: case_001
      title: Copy numbers with PECS and query a typed cache
      description: Mix Integer and Double; calculate sum and maximum and query the cache.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          integers:
          - 2
          - 7
          decimals:
          - 0.5
          - 1.25
          entries:
          - key: A
            quantity: 4
          lookups:
          - A
          - NOT_FOUND
      status: 200
      response:
        copiedValues:
        - '2'
        - '7'
        - '0.5'
        - '1.25'
        sum: '10.75'
        largestInteger: 7
        found:
          A: 4
        missing:
        - NOT_FOUND
      detailDescription: <p><code>NumericTransfers.copy</code> adds [2,7] followed by [0.5,1.25] into a <code>Number</code> list. <code>sum</code> uses <code>BigDecimal</code>
        to produce 10.75; <code>greatest</code> selects 7 via <code>Comparable</code>. Cache A=4 becomes found, while NOT_FOUND goes into missing. copiedValues preserves
        numeric strings in input order.</p>
    - id: case_002
      title: Four empty lists are valid
      description: Empty is distinct from null or missing required input lists.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          integers: []
          decimals: []
          entries: []
          lookups: []
      status: 200
      response:
        copiedValues: []
        sum: '0'
        largestInteger: null
        found: {}
        missing: []
      detailDescription: <p>All four lists are present and within limits. <code>NumericTransfers.sum</code> starts with <code>BigDecimal.ZERO</code>, yielding string
        0. The service does not call <code>greatest</code> on an empty integers list, so largestInteger is null. Cache lookup results and copiedValues are empty;
        HTTP 200.</p>
    - id: case_003
      title: Reject duplicate cache key X
      description: Duplicate keys violate the cache contract, so no partial result is returned.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          integers:
          - 1
          decimals: []
          entries:
          - key: X
            quantity: 1
          - key: X
            quantity: 2
          lookups:
          - X
      status: 400
      response:
        error: INVALID_INPUT
      detailDescription: <p><code>TypedCache.add</code> inserts X=1, then sees X=2. <code>putIfAbsent</code> detects the duplicate and throws <code>IllegalArgumentException</code>.
        The controller advice maps the failure to HTTP 400 with <code>error=INVALID_INPUT</code>; previously computed sums are not returned partially.</p>
  stock(StockRequest):
    methodName: stock
    httpMethods:
    - POST
    mappingPaths:
    - /oop/language-mechanics/stock/experiment
    usage: true
    cases:
    - id: case_001
      title: Shortage does not change stock or leak secrets
      description: A declined RESERVE leaves 2 units; a later valid RESERVE leaves 1.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          actions:
          - type: REGISTER
            tenantId: T
            sku: BOOK
            quantity: 2
            contactEmail: sensitive@example.org
            providerToken: secret-123
          - type: RESERVE
            tenantId: T
            sku: BOOK
            quantity: 3
          - type: READ
            tenantId: T
            sku: BOOK
          - type: RESERVE
            tenantId: T
            sku: BOOK
            quantity: 1
      status: 200
      response:
        steps:
        - index: 1
          action: REGISTER
          accepted: true
          code: REGISTERED
          available: 2
          diagnostic: StockItem{tenantId=T, sku=BOOK, available=2}
        - index: 2
          action: RESERVE
          accepted: false
          code: INSUFFICIENT_STOCK
          available: 2
          diagnostic: StockItem{tenantId=T, sku=BOOK, available=2}
        - index: 3
          action: READ
          accepted: true
          code: FOUND
          available: 2
          diagnostic: StockItem{tenantId=T, sku=BOOK, available=2}
        - index: 4
          action: RESERVE
          accepted: true
          code: RESERVED
          available: 1
          diagnostic: StockItem{tenantId=T, sku=BOOK, available=1}
        uniqueProducts: 1
      detailDescription: <p><code>REGISTER</code> creates StockItem (T,BOOK) with 2 units. RESERVE 3 returns <code>ReserveDeclined</code> with INSUFFICIENT_STOCK
        without mutation, so READ still sees 2. RESERVE 1 succeeds and leaves 1. <code>StockItem.toString()</code> only shows tenantId, sku and available, never contactEmail
        or providerToken.</p>
    - id: case_002
      title: Record keys separate tenants sharing an SKU
      description: BOOK exists separately for tenants A and B, but not for C.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          actions:
          - type: REGISTER
            tenantId: A
            sku: BOOK
            quantity: 1
          - type: REGISTER
            tenantId: B
            sku: BOOK
            quantity: 4
          - type: READ
            tenantId: A
            sku: BOOK
          - type: READ
            tenantId: B
            sku: BOOK
          - type: READ
            tenantId: C
            sku: BOOK
      status: 200
      response:
        steps:
        - index: 1
          action: REGISTER
          accepted: true
          code: REGISTERED
          available: 1
          diagnostic: StockItem{tenantId=A, sku=BOOK, available=1}
        - index: 2
          action: REGISTER
          accepted: true
          code: REGISTERED
          available: 4
          diagnostic: StockItem{tenantId=B, sku=BOOK, available=4}
        - index: 3
          action: READ
          accepted: true
          code: FOUND
          available: 1
          diagnostic: StockItem{tenantId=A, sku=BOOK, available=1}
        - index: 4
          action: READ
          accepted: true
          code: FOUND
          available: 4
          diagnostic: StockItem{tenantId=B, sku=BOOK, available=4}
        - index: 5
          action: READ
          accepted: false
          code: PRODUCT_NOT_FOUND
          available: null
          diagnostic: null
        uniqueProducts: 2
      detailDescription: <p>Immutable <code>ProductKey</code> has value-based equals/hashCode over tenantId and sku. StockRegistry stores (A,BOOK) and (B,BOOK) with
        1 and 4 units. Newly created equivalent keys can retrieve each. (C,BOOK) is absent, yielding PRODUCT_NOT_FOUND with null available and diagnostic; uniqueProducts=2.</p>
    - id: case_003
      title: Negative registration quantity is invalid
      description: Negative quantity is rejected before constructing StockItem.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          actions:
          - type: REGISTER
            tenantId: T
            sku: B
            quantity: -1
      status: 400
      response:
        error: INVALID_INPUT
      detailDescription: <p>REGISTER calls <code>StockExperimentService.requireQuantity</code>, which requires quantity at least zero. -1 throws <code>IllegalArgumentException</code>,
        mapped by <code>LanguageMechanicsExceptionHandler</code> to HTTP 400 with error INVALID_INPUT. No steps are returned for this malformed request.</p>
  shipping(ShippingRequest):
    methodName: shipping
    httpMethods:
    - POST
    mappingPaths:
    - /oop/language-mechanics/shipping/experiment
    usage: true
    cases:
    - id: case_001
      title: Quote standard/express and an unknown service
      description: Two registered policies return fees; the unknown service is rejected per line.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          quotes:
          - serviceCode: standard
            weightGrams: 1
          - serviceCode: express
            weightGrams: 1001
          - serviceCode: unknown
            weightGrams: 1000
      status: 200
      response:
        quotes:
        - serviceCode: standard
          weightGrams: 1
          accepted: true
          feeVnd: 20000
          code: QUOTED
        - serviceCode: express
          weightGrams: 1001
          accepted: true
          feeVnd: 51000
          code: QUOTED
        - serviceCode: unknown
          weightGrams: 1000
          accepted: false
          feeVnd: null
          code: SERVICE_NOT_SUPPORTED
        totalAcceptedFeesVnd: 71000
      detailDescription: <p><code>StandardShipping</code> returns 20000 for 1 gram. <code>ExpressShipping</code> rounds 1001 grams up to 2 kg, giving 35000+8000?2=51000.
        The unknown service has no policy entry, so that line has accepted=false, null feeVnd and SERVICE_NOT_SUPPORTED. Only accepted lines contribute to the 71000
        total.</p>
    - id: case_002
      title: The 1000g to 1001g boundary
      description: Ceiling kilograms raise express fee from 43000 to 51000.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          quotes:
          - serviceCode: express
            weightGrams: 1000
          - serviceCode: express
            weightGrams: 1001
      status: 200
      response:
        quotes:
        - serviceCode: express
          weightGrams: 1000
          accepted: true
          feeVnd: 43000
          code: QUOTED
        - serviceCode: express
          weightGrams: 1001
          accepted: true
          feeVnd: 51000
          code: QUOTED
        totalAcceptedFeesVnd: 94000
      detailDescription: <p><code>ExpressShipping.quoteVnd</code> uses billedKilograms=(weightGrams+999L)/1000. At 1000g it bills one kilogram for 43000; at 1001g
        it bills two kilograms for 51000. Both lines are QUOTED and totalAcceptedFeesVnd=94000, illustrating the rounding boundary.</p>
    - id: case_003
      title: Zero weight is rejected before dispatch
      description: Valid weights are restricted to 1 through 100000 grams.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          quotes:
          - serviceCode: express
            weightGrams: 0
      status: 400
      response:
        error: INVALID_INPUT
      detailDescription: <p><code>ShippingScenarioService.quote</code> validates every quote before selecting policies. weightGrams=0 violates the 1?100000 range,
        throwing <code>IllegalArgumentException</code> and yielding HTTP 400 error INVALID_INPUT. No ExpressShipping call or partial quote list occurs.</p>
LifecycleExperimentController:
  create(CreationRequest):
    methodName: create
    httpMethods:
    - POST
    mappingPaths:
    - /oop/lifecycle/creation
    usage: true
    cases:
    - id: case_001
      title: Builder creates a valid course
      description: The builder enrolls two students in a course with one remaining seat.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          courseCode: OOP
          capacity: 3
          students:
          - S1
          - S2
          style: BUILDER
      status: 200
      response:
        style: BUILDER
        courseCode: OOP
        capacity: 3
        students:
        - S1
        - S2
        availableSeats: 1
      detailDescription: <p>The <code>BUILDER</code> branch calls <code>CourseEnrollment.builder</code>, adds S1/S2, then <code>build()</code>. The constructor checks
        capacity=3 and unique IDs, storing a defensive copy. <code>availableSeats()</code> computes 3 - 2 = 1, yielding HTTP 200.</p>
    - id: case_002
      title: Omitted students list
      description: The two-argument constructor creates a course with no enrollment.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          courseCode: JAVA
          capacity: 2
          style: CONSTRUCTOR
      status: 200
      response:
        style: CONSTRUCTOR
        courseCode: JAVA
        capacity: 2
        students: []
        availableSeats: 2
      detailDescription: <p>With <code>students</code> omitted, the service substitutes <code>List.of()</code> and invokes <code>new CourseEnrollment(&quot;JAVA&quot;,2)</code>.
        The two-argument constructor delegates to the main constructor with an empty list. Both seats remain available in HTTP 200.</p>
    - id: case_003
      title: Static factory rejects duplicates
      description: Static factory construction still enforces unique student IDs.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          courseCode: JAVA
          capacity: 3
          students:
          - A
          - A
          style: STATIC_FACTORY
      status: 400
      response:
        code: INVALID_INPUT
        message: 'Duplicate student ID: A'
      detailDescription: '<p><code>CourseEnrollment.of</code> delegates to the constructor. Its <code>HashSet</code> accepts the first A, then rejects the second
        with <code>IllegalArgumentException(&quot;Duplicate student ID: A&quot;)</code>. The controller advice returns HTTP 400 <code>INVALID_INPUT</code>.</p>'
    - id: case_004
      title: Invalid zero capacity
      description: A capacity of zero violates the allowed 1?100 range.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          courseCode: OOP
          capacity: 0
          style: CONSTRUCTOR
      status: 400
      response:
        code: INVALID_INPUT
        message: capacity must be between 1 and 100
      detailDescription: <p>The service delegates the syntactically valid request to the constructor. <code>CourseEnrollment</code> checks <code>capacity &lt; 1</code>
        and throws <code>IllegalArgumentException</code> before assigning state. The controller advice responds with HTTP 400 and the exact constraint.</p>
  references(ReferenceRequest):
    methodName: references
    httpMethods:
    - POST
    mappingPaths:
    - /oop/lifecycle/references
    usage: true
    cases:
    - id: case_001
      title: Cycle becomes unreachable after root release
      description: The A?B cycle does not substitute for a path from a supplied logical root.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          nodes:
          - id: A
            links:
            - B
          - id: B
            links:
            - A
          - id: C
            links: []
          initialRoots:
          - A
          steps:
          - action: RELEASE
            nodeId: A
          - action: RETAIN
            nodeId: C
      status: 200
      response:
        nodeCount: 3
        snapshots:
        - step: 0
          roots:
          - A
          reachableFromRoots:
          - A
          - B
          notReachableFromRoots:
          - C
        - step: 1
          roots: []
          reachableFromRoots: []
          notReachableFromRoots:
          - A
          - B
          - C
        - step: 2
          roots:
          - C
          reachableFromRoots:
          - C
          notReachableFromRoots:
          - A
          - B
        interpretation: These are paths from the supplied logical roots, not observed JVM GC roots. No garbage collection, collection timing or native resource cleanup
          is inferred.
      detailDescription: <p>Root A initially reaches A and B while C is separate. <code>RELEASE A</code> removes the only root, making all three IDs notReachable;
        <code>RETAIN C</code> makes only C reachable again. <code>ReferenceGraph.snapshot</code> uses a visited set to handle cycles. No JVM garbage collection is
        observed.</p>
    - id: case_002
      title: Link targets an unknown node
      description: Graph construction rejects links to undeclared IDs.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          nodes:
          - id: A
            links:
            - MISSING
          initialRoots: []
          steps: []
      status: 400
      response:
        code: INVALID_INPUT
        message: 'Unknown node ID: MISSING'
      detailDescription: <p>After creating A, <code>ReferenceGraph</code> resolves links via <code>requireNode(&quot;MISSING&quot;)</code>. The ID is absent, so construction
        throws <code>IllegalArgumentException</code> before snapshots can be returned, yielding HTTP 400 <code>INVALID_INPUT</code>.</p>
    - id: case_003
      title: Cannot release an unretained root
      description: RELEASE requires the ID to belong to the current root set.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          nodes:
          - id: A
            links: []
          initialRoots: []
          steps:
          - action: RELEASE
            nodeId: A
      status: 400
      response:
        code: INVALID_INPUT
        message: 'Root was not retained: A'
      detailDescription: '<p>The graph contains A but starts with no roots. On RELEASE A, <code>roots.remove</code> returns false and <code>ReferenceGraph.apply</code>
        throws <code>IllegalArgumentException(&quot;Root was not retained: A&quot;)</code>. HTTP 400 does not return partial snapshots.</p>'
  resources(ResourceRequest):
    methodName: resources
    httpMethods:
    - POST
    mappingPaths:
    - /oop/lifecycle/resources
    usage: true
    cases:
    - id: case_001
      title: Reverse-order resource closure
      description: The body and both resource closures succeed.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          bodyFails: false
          outerCloseFails: false
          innerCloseFails: false
      status: 200
      response:
        trace:
        - open:outer
        - open:inner
        - body:start
        - body:success
        - close:inner
        - close:outer
        primaryFailure: null
        suppressedFailures: []
        closed:
          outer: true
          inner: true
        completedWithoutFailure: true
      detailDescription: <p>The service opens outer before inner and completes the body. <code>try-with-resources</code> invokes <code>inner.close()</code> before
        <code>outer.close()</code>. Both closed flags are true, primaryFailure is null and suppressedFailures is empty; HTTP 200 reports successful completion.</p>
    - id: case_002
      title: Body error is primary, closes suppressed
      description: The body and both close operations fail.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          bodyFails: true
          outerCloseFails: true
          innerCloseFails: true
      status: 200
      response:
        trace:
        - open:outer
        - open:inner
        - body:start
        - close:inner
        - close:outer
        primaryFailure: body failed
        suppressedFailures:
        - 'close failed: inner'
        - 'close failed: outer'
        closed:
          outer: true
          inner: true
        completedWithoutFailure: false
      detailDescription: <p>The body throws <code>IllegalStateException(&quot;body failed&quot;)</code> before body:success. Both closures still run in inner/outer
        order, mark resources closed, then throw; Java stores closing errors in <code>getSuppressed()</code> while preserving the body error as primary. HTTP 200
        returns the simulated result.</p>
    - id: case_003
      title: Inner closing failure becomes primary
      description: When the body succeeds, the first close error becomes primary.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          bodyFails: false
          outerCloseFails: true
          innerCloseFails: true
      status: 200
      response:
        trace:
        - open:outer
        - open:inner
        - body:start
        - body:success
        - close:inner
        - close:outer
        primaryFailure: 'close failed: inner'
        suppressedFailures:
        - 'close failed: outer'
        closed:
          outer: true
          inner: true
        completedWithoutFailure: false
      detailDescription: <p>The body records <code>body:success</code>. <code>inner.close()</code> fails first and becomes primaryFailure; <code>outer.close()</code>
        still runs and its error is suppressed. Both resources report closed, completedWithoutFailure=false and HTTP 200.</p>
  publication(PublicationRequest):
    methodName: publication
    httpMethods:
    - POST
    mappingPaths:
    - /oop/lifecycle/publication
    usage: true
    cases:
    - id: case_001
      title: Early callback observes null
      description: UnsafeListener publishes this before assignment; SafeListener registers after initialization.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          label: READY
      status: 200
      response:
        unsafeObservedOnRegister: null
        unsafeObservedAfterConstruction: READY
        safeObservedOnRegister: READY
        safeObservedAfterConstruction: READY
        unsafeSubscriptions: 1
        safeSubscriptions: 1
      detailDescription: <p><code>UnsafeListener</code> calls <code>register(this)</code> inside its constructor before assigning label. The synchronous callback
        records null; the later callback sees READY. <code>SafeListener</code> finishes construction before registering, so both observations equal READY. Each separate
        registry has one subscription.</p>
    - id: case_002
      title: Empty label rejected
      description: An empty identifier cannot start the listener comparison.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          label: ''
      status: 400
      response:
        code: INVALID_INPUT
        message: label must be 1-40 letters, digits, '_' or '-'
      detailDescription: <p><code>PublicationScenario.compare</code> checks the pattern <code>[A-Za-z0-9_-]{1,40}</code>. The empty string fails, so <code>IllegalArgumentException</code>
        is thrown before registries are created; the advice returns HTTP 400 <code>INVALID_INPUT</code> with the original message.</p>
