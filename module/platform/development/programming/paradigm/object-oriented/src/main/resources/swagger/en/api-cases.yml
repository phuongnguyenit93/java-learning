            - AUDIT:EXECUTE_ADD:T-1
            - NOTIFY:EXECUTE_ADD:T-1
            - AUDIT:EXECUTE_COMPLETE:T-1
            - NOTIFY:EXECUTE_COMPLETE:T-1
        - index: 3
          action: UNDO
          accepted: true
          detail: completed
          before:
            tasks:
            - id: T-1
              title: Review PR
              done: true
            undoDepth: 2
            redoDepth: 0
            observerDeliveries:
            - AUDIT:EXECUTE_ADD:T-1
            - NOTIFY:EXECUTE_ADD:T-1
            - AUDIT:EXECUTE_COMPLETE:T-1
            - NOTIFY:EXECUTE_COMPLETE:T-1
          after:
            tasks:
            - id: T-1
              title: Review PR
              done: false
            undoDepth: 1
            redoDepth: 1
            observerDeliveries:
            - AUDIT:EXECUTE_ADD:T-1
            - NOTIFY:EXECUTE_ADD:T-1
            - AUDIT:EXECUTE_COMPLETE:T-1
            - NOTIFY:EXECUTE_COMPLETE:T-1
            - AUDIT:UNDO_COMPLETE:T-1
            - NOTIFY:UNDO_COMPLETE:T-1
        - index: 4
          action: UNSUBSCRIBE_NOTIFY
          accepted: true
          detail: completed
          before:
            tasks:
            - id: T-1
              title: Review PR
              done: false
            undoDepth: 1
            redoDepth: 1
            observerDeliveries:
            - AUDIT:EXECUTE_ADD:T-1
            - NOTIFY:EXECUTE_ADD:T-1
            - AUDIT:EXECUTE_COMPLETE:T-1
            - NOTIFY:EXECUTE_COMPLETE:T-1
            - AUDIT:UNDO_COMPLETE:T-1
            - NOTIFY:UNDO_COMPLETE:T-1
          after:
            tasks:
            - id: T-1
              title: Review PR
              done: false
            undoDepth: 1
            redoDepth: 1
            observerDeliveries:
            - AUDIT:EXECUTE_ADD:T-1
            - NOTIFY:EXECUTE_ADD:T-1
            - AUDIT:EXECUTE_COMPLETE:T-1
            - NOTIFY:EXECUTE_COMPLETE:T-1
            - AUDIT:UNDO_COMPLETE:T-1
            - NOTIFY:UNDO_COMPLETE:T-1
        - index: 5
          action: REDO
          accepted: true
          detail: completed
          before:
            tasks:
            - id: T-1
              title: Review PR
