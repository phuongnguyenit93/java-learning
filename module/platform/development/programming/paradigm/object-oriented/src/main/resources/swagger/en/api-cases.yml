              activeLoans: 1
            - id: MEM-2
              active: true
              activeLoans: 0
            copies:
            - id: COPY-1
              titleCode: TITLE-1
              titleName: Java
              borrowed: true
            loans:
            - id: LOAN-1
              memberId: MEM-1
              copyId: COPY-1
              borrowedOn: '2026-10-20'
              dueOn: '2026-11-03'
              returnedOn: null
              status: ACTIVE
          after:
            members:
            - id: MEM-1
              active: true
              activeLoans: 0
            - id: MEM-2
              active: true
              activeLoans: 0
            copies:
            - id: COPY-1
              titleCode: TITLE-1
              titleName: Java
              borrowed: false
            loans:
            - id: LOAN-1
              memberId: MEM-1
              copyId: COPY-1
              borrowedOn: '2026-10-20'
              dueOn: '2026-11-03'
              returnedOn: '2026-10-25'
              status: RETURNED
        current:
          members:
          - id: MEM-1
            active: true
            activeLoans: 0
          - id: MEM-2
            active: true
            activeLoans: 0
          copies:
          - id: COPY-1
            titleCode: TITLE-1
            titleName: Java
            borrowed: false
          loans:
          - id: LOAN-1
            memberId: MEM-1
            copyId: COPY-1
            borrowedOn: '2026-10-20'
            dueOn: '2026-11-03'
            returnedOn: '2026-10-25'
            status: RETURNED
        invariantsSatisfied: true
        scope: REQUEST_LOCAL_ONLY_SIMULATED_LIBRARY_NO_DATABASE_OR_CROSS_REQUEST_CONCURRENCY
      detailDescription: '<p><code>LibraryModel.borrow</code> processes MEM-1/COPY-1 on 2026-10-20, checks eligibility, capacity and availability, then creates LOAN-1
        with dueOn 2026-11-03. The first snapshot has an ACTIVE loan and COPY-1.borrowed=true.</p>

        <p>The second attempt by MEM-2 on the same copy triggers <code>ModelRuleViolation(BR-03)</code> in <code>BookCopy.ensureAvailable</code>; the service records
        accepted=false with unchanged before/after and does not create LOAN-2. Returning LOAN-1 on 2026-10-25 preserves its history as RETURNED, releases COPY-1 and
        resets MEM-1 activeLoans to zero. HTTP 200 reports invariantsSatisfied=true with the actual method-call sequence.</p>'
    - id: case_002
      title: An inactive member cannot borrow
      description: BR-01 belongs to Member and rejection leaves the graph unchanged.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          titles:
          - code: TITLE-1
            name: Java
          members:
          - id: MEM-1
            active: false
          copies:
          - id: COPY-1
            titleCode: TITLE-1
          actions:
          - type: BORROW
            memberId: MEM-1
            copyId: COPY-1
            onDate: '2026-10-20'
      status: 200
      response:
        initial: &id048
          members:
          - id: MEM-1
            active: false
            activeLoans: 0
          copies:
          - id: COPY-1
            titleCode: TITLE-1
            titleName: Java
            borrowed: false
          loans: []
        steps:
        - index: 1
          type: BORROW
          accepted: false
          rule: BR-01
          detail: member is inactive
          affectedLoanId: null
          calls:
          - LibraryModel.borrow
          - Member.ensureEligible
          before:
            members:
            - id: MEM-1
              active: false
              activeLoans: 0
            copies:
            - id: COPY-1
              titleCode: TITLE-1
              titleName: Java
              borrowed: false
            loans: []
          after:
            members:
            - id: MEM-1
              active: false
              activeLoans: 0
            copies:
            - id: COPY-1
              titleCode: TITLE-1
              titleName: Java
              borrowed: false
            loans: []
        current: *id048
        invariantsSatisfied: true
        scope: REQUEST_LOCAL_ONLY_SIMULATED_LIBRARY_NO_DATABASE_OR_CROSS_REQUEST_CONCURRENCY
      detailDescription: <p><code>LibraryModel.borrow</code> resolves MEM-1 and COPY-1, then calls <code>Member.ensureEligible</code>. Since active=false, Member
        throws <code>ModelRuleViolation</code> with BR-01 and <code>member is inactive</code> before creating a Loan or occupying the copy. Step 1 has accepted=false,
        affectedLoanId=null, only two recorded calls, and identical before/after. HTTP 200 represents an expected domain rejection.</p>
    - id: case_003
      title: Reject an unknown member identifier
      description: The aggregate checks its identity map before accessing other collaborators.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          titles:
          - code: TITLE-1
            name: Java
          members:
          - id: MEM-1
            active: true
          copies:
          - id: COPY-1
            titleCode: TITLE-1
          actions:
          - type: BORROW
            memberId: MEM-77
            copyId: COPY-1
            onDate: '2026-10-20'
      status: 200
      response:
        initial: &id049
          members:
          - id: MEM-1
            active: true
            activeLoans: 0
          copies:
          - id: COPY-1
            titleCode: TITLE-1
            titleName: Java
            borrowed: false
          loans: []
        steps:
        - index: 1
          type: BORROW
          accepted: false
          rule: UNKNOWN_MEMBER
          detail: unknown member
          affectedLoanId: null
          calls:
          - LibraryModel.borrow
          before:
            members:
            - id: MEM-1
              active: true
              activeLoans: 0
            copies:
            - id: COPY-1
              titleCode: TITLE-1
              titleName: Java
              borrowed: false
            loans: []
          after:
            members:
            - id: MEM-1
              active: true
              activeLoans: 0
            copies:
            - id: COPY-1
              titleCode: TITLE-1
              titleName: Java
              borrowed: false
            loans: []
        current: *id049
        invariantsSatisfied: true
        scope: REQUEST_LOCAL_ONLY_SIMULATED_LIBRARY_NO_DATABASE_OR_CROSS_REQUEST_CONCURRENCY
      detailDescription: <p><code>LibraryModel.borrow</code> records the top-level call, then looks up <code>members.get(&quot;MEM-77&quot;)</code>. Because that
        identity is absent, it throws <code>ModelRuleViolation(UNKNOWN_MEMBER)</code> before the copy lookup or any Member call. The service returns accepted=false,
        detail=<code>unknown member</code>, unchanged before/after, invariantsSatisfied=true and HTTP 200.</p>
    - id: case_004
      title: Reject an empty graph before constructing domain objects
      description: The request violates the initial domain-graph structure constraints.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          titles: []
          members: []
          copies: []
          actions: []
      status: 400
      response:
        error: require 1..20 titles, 1..20 members, 1..30 copies
      detailDescription: <p><code>ModelingExperimentService.library</code> requires at least one Title, Member and BookCopy, within the 20/20/30 upper limits. All
        three lists are empty, so the initial validation throws <code>IllegalArgumentException</code> with <code>require 1..20 titles, 1..20 members, 1..30 copies</code>.
        <code>ModelingExceptionHandler</code> returns HTTP 400 with only the <code>error</code> DTO, not a partial object graph.</p>
  orders(OrderRequest):
    methodName: orders
    httpMethods:
    - POST
    mappingPaths:
    - /oop/modeling/orders/experiment
    usage: true
    cases:
    - id: case_001
      title: From DRAFT to DELIVERED with a payment guard rejection
      description: A mismatched payment is recorded without changing state; later valid events finish the simulated delivery.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORD-1
          totalVnd: 100
          actions:
          - event: SUBMIT
          - event: CONFIRM_PAYMENT
            receivedVnd: 75
          - event: CONFIRM_PAYMENT
            receivedVnd: 100
          - event: START_PACKING
          - event: SHIP
            trackingCode: TRACK-1
          - event: CONFIRM_DELIVERY
      status: 200
      response:
        initial:
          id: ORD-1
          state: DRAFT
          totalVnd: 100
          trackingCode: null
        steps:
        - index: 1
          event: SUBMIT
          accepted: true
          rule: null
          detail: transition applied
          before:
            id: ORD-1
            state: DRAFT
            totalVnd: 100
            trackingCode: null
          after:
            id: ORD-1
            state: WAITING_PAYMENT
            totalVnd: 100
            trackingCode: null
        - index: 2
          event: CONFIRM_PAYMENT
          accepted: false
          rule: PAYMENT_GUARD
          detail: confirmed payment must equal order total
          before:
            id: ORD-1
            state: WAITING_PAYMENT
            totalVnd: 100
            trackingCode: null
          after:
            id: ORD-1
            state: WAITING_PAYMENT
            totalVnd: 100
            trackingCode: null
        - index: 3
          event: CONFIRM_PAYMENT
          accepted: true
          rule: null
          detail: transition applied
          before:
            id: ORD-1
            state: WAITING_PAYMENT
            totalVnd: 100
            trackingCode: null
          after:
            id: ORD-1
            state: PAID
            totalVnd: 100
            trackingCode: null
        - index: 4
          event: START_PACKING
          accepted: true
          rule: null
          detail: transition applied
          before:
            id: ORD-1
            state: PAID
            totalVnd: 100
            trackingCode: null
          after:
            id: ORD-1
            state: PACKING
            totalVnd: 100
            trackingCode: null
        - index: 5
          event: SHIP
          accepted: true
          rule: null
          detail: transition applied
          before:
            id: ORD-1
            state: PACKING
            totalVnd: 100
            trackingCode: null
          after:
            id: ORD-1
            state: SHIPPED
            totalVnd: 100
            trackingCode: TRACK-1
        - index: 6
          event: CONFIRM_DELIVERY
          accepted: true
          rule: null
          detail: transition applied
          before:
            id: ORD-1
            state: SHIPPED
            totalVnd: 100
            trackingCode: TRACK-1
          after:
            id: ORD-1
            state: DELIVERED
            totalVnd: 100
            trackingCode: TRACK-1
        current:
          id: ORD-1
          state: DELIVERED
          totalVnd: 100
          trackingCode: TRACK-1
        scope: REQUEST_LOCAL_ONLY_SIMULATED_ORDER_NO_PAYMENT_OR_EXTERNAL_SHIPPING
      detailDescription: '<p>SUBMIT moves DRAFT to WAITING_PAYMENT. <code>CONFIRM_PAYMENT</code> with receivedVnd=75 fails the required totalVnd=100 and raises <code>ModelRuleViolation(PAYMENT_GUARD)</code>,
        leaving <code>before.state</code> and <code>after.state</code> both WAITING_PAYMENT.</p>

        <p>Confirming 100 succeeds: PAID ? START_PACKING moves to PACKING ? SHIP with TRACK-1 moves to SHIPPED ? CONFIRM_DELIVERY moves to DELIVERED. The tracking
        code is stored only after valid SHIP. HTTP 200 includes all six steps with a simulated-only scope.</p>'
    - id: case_002
      title: Reject early shipment and do not reopen a cancelled order
      description: DRAFT has no SHIP edge; CANCELLED is terminal and rejects later SUBMIT.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORD-2
          totalVnd: 50
          actions:
          - event: SHIP
            trackingCode: TRACK-1
          - event: CANCEL
          - event: SUBMIT
      status: 200
      response:
        initial:
          id: ORD-2
          state: DRAFT
          totalVnd: 50
          trackingCode: null
        steps:
        - index: 1
          event: SHIP
          accepted: false
          rule: INVALID_TRANSITION
          detail: DRAFT cannot handle SHIP
          before:
            id: ORD-2
            state: DRAFT
            totalVnd: 50
            trackingCode: null
          after:
            id: ORD-2
            state: DRAFT
            totalVnd: 50
            trackingCode: null
        - index: 2
          event: CANCEL
          accepted: true
          rule: null
          detail: transition applied
          before:
            id: ORD-2
            state: DRAFT
            totalVnd: 50
            trackingCode: null
          after:
            id: ORD-2
            state: CANCELLED
            totalVnd: 50
            trackingCode: null
        - index: 3
          event: SUBMIT
          accepted: false
          rule: INVALID_TRANSITION
          detail: CANCELLED cannot handle SUBMIT
          before:
            id: ORD-2
            state: CANCELLED
            totalVnd: 50
            trackingCode: null
          after:
            id: ORD-2
            state: CANCELLED
            totalVnd: 50
            trackingCode: null
        current:
          id: ORD-2
          state: CANCELLED
          totalVnd: 50
          trackingCode: null
        scope: REQUEST_LOCAL_ONLY_SIMULATED_ORDER_NO_PAYMENT_OR_EXTERNAL_SHIPPING
      detailDescription: '<p>SHIP is not allowed from <code>DRAFT</code>, so <code>ModeledOrder.apply</code> records <code>INVALID_TRANSITION</code> without changing
        state or trackingCode. CANCEL is allowed from DRAFT and moves the order to CANCELLED.</p>

        <p>Once in terminal CANCELLED, SUBMIT fails with <code>CANCELLED cannot handle SUBMIT</code>. Both rejected steps have identical before/after snapshots; HTTP
        200 preserves transition evidence rather than failing the entire request.</p>'
    - id: case_003
      title: Bad tracking does not mutate PACKING
      description: A lowercase tracking code is rejected; a later valid SHIP stores the tracking number.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORD-3
          totalVnd: 100
          actions:
          - event: SUBMIT
          - event: CONFIRM_PAYMENT
            receivedVnd: 100
          - event: START_PACKING
          - event: SHIP
            trackingCode: bad
          - event: SHIP
            trackingCode: TRACK-2
      status: 200
      response:
        initial:
          id: ORD-3
          state: DRAFT
          totalVnd: 100
          trackingCode: null
        steps:
        - index: 1
          event: SUBMIT
          accepted: true
          rule: null
          detail: transition applied
          before:
            id: ORD-3
            state: DRAFT
            totalVnd: 100
            trackingCode: null
          after:
            id: ORD-3
            state: WAITING_PAYMENT
            totalVnd: 100
            trackingCode: null
        - index: 2
          event: CONFIRM_PAYMENT
          accepted: true
          rule: null
          detail: transition applied
          before:
            id: ORD-3
            state: WAITING_PAYMENT
            totalVnd: 100
            trackingCode: null
          after:
            id: ORD-3
            state: PAID
            totalVnd: 100
            trackingCode: null
        - index: 3
          event: START_PACKING
          accepted: true
          rule: null
          detail: transition applied
          before:
            id: ORD-3
            state: PAID
            totalVnd: 100
            trackingCode: null
          after:
            id: ORD-3
            state: PACKING
            totalVnd: 100
            trackingCode: null
        - index: 4
          event: SHIP
          accepted: false
          rule: TRACKING_GUARD
          detail: trackingCode must be 3..32 uppercase letters/digits/hyphens
          before:
            id: ORD-3
            state: PACKING
            totalVnd: 100
            trackingCode: null
          after:
            id: ORD-3
            state: PACKING
            totalVnd: 100
            trackingCode: null
        - index: 5
          event: SHIP
          accepted: true
          rule: null
          detail: transition applied
          before:
            id: ORD-3
            state: PACKING
            totalVnd: 100
            trackingCode: null
          after:
            id: ORD-3
            state: SHIPPED
            totalVnd: 100
            trackingCode: TRACK-2
        current:
          id: ORD-3
          state: SHIPPED
          totalVnd: 100
          trackingCode: TRACK-2
        scope: REQUEST_LOCAL_ONLY_SIMULATED_ORDER_NO_PAYMENT_OR_EXTERNAL_SHIPPING
      detailDescription: '<p>After SUBMIT, full payment confirmation and START_PACKING, the order is in PACKING. SHIP with trackingCode <code>bad</code> fails uppercase
        pattern <code>[A-Z0-9-]{3,32}</code>, so <code>ModeledOrder</code> raises <code>TRACKING_GUARD</code> before writing any field, leaving before/after in PACKING.</p>

        <p>The subsequent SHIP with TRACK-2 passes, moves to SHIPPED and stores trackingCode. HTTP 200 exposes both the rejected and accepted steps without partial
        mutation.</p>'
    - id: case_004
      title: Reject an event outside the state machine
      description: UNKNOWN fails enum parsing before running actions, so no partial OrderResult is produced.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORD-1
          totalVnd: 100
          actions:
          - event: UNKNOWN
      status: 400
      response:
        error: unsupported order event
      detailDescription: <p><code>ModelingExperimentService.order</code> prevalidates all actions using <code>ModeledOrder.Event.valueOf(&quot;UNKNOWN&quot;)</code>.
        The enum lacks this constant, so the service throws <code>IllegalArgumentException(&quot;unsupported order event&quot;)</code>. The chapter handler responds
        with HTTP 400 and <code>{"error":"unsupported order event"}</code> rather than a rejected step in HTTP 200.</p>
ObjectExperimentsController:
  references(ObjectExperimentDto.ReferenceRequest):
    methodName: references
    httpMethods:
    - POST
    mappingPaths:
    - /oop/objects/references
    usage: true
    cases:
    - id: case_001
      title: Aliases observe one increment
      description: Passing the reference value lets a method mutate the shared instance without redirecting the caller's variable.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          name: Counter
          initialValue: 10
          increment: 4
      status: 200
      response:
        aliasIsSameInstance: true
        separatelyCreatedIsDifferentInstance: true
        separatelyCreatedInitiallyHadSameState: true
        callerReferenceSurvivesParameterReassignment: true
        before: 10
        afterThroughOriginal: 14
        afterThroughAlias: 14
        independentInstanceValue: 10
        name: Counter
      detailDescription: <p><code>alias = original</code> references one <code>MutableCounter</code>. Adding 4 via <code>addThroughParameter()</code> changes the
        value observed through either alias from 10 to 14. <code>replaceParameterLocally()</code> reassigns only its parameter variable, so <code>callerReferenceSurvivesParameterReassignment</code>
        remains true; the separately allocated instance retains 10.</p>
    - id: case_002
      title: Reject a zero increment
      description: The parameter constraint rejects invalid input before any counter is created or mutated.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          name: Counter
          initialValue: 10
          increment: 0
      status: 400
      response:
        error: increment must be between 1 and 1000
      detailDescription: <p><code>boundedInt(&quot;increment&quot;, 0, 1, 1000)</code> throws <code>IllegalArgumentException</code> before a <code>MutableCounter</code>
        is constructed. <code>ObjectExperimentExceptionHandler</code> returns HTTP 400 with the exception message in <code>error</code>.</p>
  equality(ObjectExperimentDto.EqualityRequest):
    methodName: equality
    httpMethods:
    - POST
    mappingPaths:
    - /oop/objects/equality
    usage: true
    cases:
    - id: same_value
      title: Distinct objects with equal values
      description: Two separately created records compare equal and hash alike; a HashSet retains one entry.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          firstCode: SKU-01
          secondCode: SKU-01
      status: 200
      response:
        sameInstance: false
        valueEquals: true
        hashCodesEqual: true
        hashSetSize: 1
        defaultObjectEquals: false
        aliasIsSameInstance: true
      detailDescription: <p>Two separately constructed <code>ProductCode(&quot;SKU-01&quot;)</code> records are distinct instances. Their field-based <code>equals()</code>
        and <code>hashCode()</code> match, so <code>HashSet</code> retains one element. Two <code>LegacyIdentityCode</code> objects still compare by identity, while
        the alias refers to the first record.</p>
    - id: different_value
      title: Distinct product codes
      description: Different record values are not equal and occupy two HashSet entries.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          firstCode: A
          secondCode: B
      status: 200
      response:
        sameInstance: false
        valueEquals: false
        hashCodesEqual: false
        hashSetSize: 2
        defaultObjectEquals: false
        aliasIsSameInstance: true
      detailDescription: <p>Records holding <code>A</code> and <code>B</code> differ in value; these specific strings also have different hash codes, so <code>HashSet</code>
        retains both. They remain separately allocated objects. The alias still refers to the first record, whereas two LegacyIdentityCode instances do not share
        identity.</p>
    - id: invalid_code
      title: Reject an empty product code
      description: A blank firstCode is rejected with HTTP 400.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          firstCode: ''
          secondCode: A
      status: 400
      response:
        error: firstCode must contain 1 to 80 nonblank characters
      detailDescription: <p><code>ObjectSemanticsService.requiredText(&quot;firstCode&quot;, &quot;&quot;)</code> rejects the empty string before any records are
        created. <code>ObjectExperimentExceptionHandler.invalidInput()</code> maps the exception to HTTP 400 with the unchanged message in <code>ApiError.error</code>.</p>
  copies(ObjectExperimentDto.CopyRequest):
    methodName: copies
    httpMethods:
    - POST
    mappingPaths:
    - /oop/objects/copies
    usage: true
    cases:
    - id: case_001
      title: A shallow copy shares mutable elements
      description: Mutating a list element shows that List.copyOf freezes list membership but does not deep-copy mutable elements.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          originalLabel: old
          updatedLabel: updated
          addedLabel: additional
      status: 200
      response:
        outerListsAreDifferent: true
        shallowCopySharesElement: true
        deepCopyHasIndependentElement: true
        originalAfterMutation:
        - updated
        - additional
        shallowAfterMutation:
        - updated
        deepAfterMutation:
        - old
        unmodifiableSnapshotAfterMutation:
        - updated
        immutableValueSnapshot: old
      detailDescription: <p>The original, shallow copy and <code>List.copyOf(original)</code> hold a reference to the same first <code>MutableItem</code>. Changing
        its label from <code>old</code> to <code>updated</code> is visible in all three. <code>original.add()</code> adds <code>additional</code> only to the original
        container. The deep copy has a different item and keeps <code>old</code>; <code>ItemValue</code> preserves the earlier string.</p>
    - id: case_002
      title: Reject a missing updated label
      description: Mandatory text fields are validated before constructing any copies.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          originalLabel: old
          updatedLabel: null
          addedLabel: extra
      status: 400
      response:
        error: updatedLabel must contain 1 to 80 nonblank characters
      detailDescription: <p><code>requiredText(&quot;updatedLabel&quot;, null)</code> fails during validation, before copy construction. The exception handler maps
        the resulting <code>IllegalArgumentException</code> to HTTP 400 and preserves its message.</p>
  absence(ObjectExperimentDto.AbsenceRequest):
    methodName: absence
    httpMethods:
    - POST
    mappingPaths:
    - /oop/objects/absence
    usage: true
    cases:
    - id: case_001
      title: Customer exists without an address
      description: An existing customer still has a name when its optional address is empty.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          lookupId: C01
          optionalAddress: null
      status: 200
      response:
        lookupId: C01
        found: true
        optionalAddressPresent: false
        customerName: Lan
        addresses: []
        emptyCollectionMeansNoItems: true
      detailDescription: <p>The sample contains <code>C01</code>, so <code>found</code> is true and <code>customerName</code> is <code>Lan</code>. A null address
        makes <code>Customer.shippingAddress()</code> return <code>Optional.empty()</code>, producing an empty address list and false address-presence flag. Missing
        address does not mean missing customer.</p>
    - id: case_002
      title: Trim an optional address
      description: Leading and trailing whitespace is removed from a present address.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          lookupId: C01
          optionalAddress: ' Ha Noi '
      status: 200
      response:
        lookupId: C01
        found: true
        optionalAddressPresent: true
        customerName: Lan
        addresses:
        - Ha Noi
        emptyCollectionMeansNoItems: false
      detailDescription: <p><code>optionalAddress.trim()</code> changes <code> Ha Noi </code> into <code>Ha Noi</code>. Customer <code>C01</code> exists and the normalized
        address is nonblank, so <code>shippingAddress()</code> is present and <code>addresses</code> contains exactly one value.</p>
    - id: case_003
      title: Customer not found
      description: A submitted address cannot create a customer whose ID does not match the sample repository.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          lookupId: C99
          optionalAddress: Ha Noi
      status: 200
      response:
        lookupId: C99
        found: false
        optionalAddressPresent: false
        customerName: null
        addresses: []
        emptyCollectionMeansNoItems: true
      detailDescription: <p>Only <code>C01</code> exists, so looking up <code>C99</code> returns null and <code>Optional.empty()</code>. <code>flatMap(Customer::shippingAddress)</code>
        has no customer to inspect, yielding null name, absent address and an empty list despite the supplied <code>optionalAddress</code>.</p>
    - id: case_004
      title: Reject an empty lookup ID
      description: The lookup key must contain a nonblank value.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          lookupId: ''
          optionalAddress: null
      status: 400
      response:
        error: lookupId must contain 1 to 80 nonblank characters
      detailDescription: <p><code>requiredText()</code> rejects an empty string before constructing the sample repository. The exception handler maps this <code>IllegalArgumentException</code>
        to HTTP 400 with the shown lookupId message.</p>
  checkout(ObjectExperimentDto.CheckoutRequest):
    methodName: checkout
    httpMethods:
    - POST
    mappingPaths:
    - /oop/objects/checkout
    usage: true
    cases:
    - id: case_001
      title: Simulated payment succeeds
      description: Stock decreases from five to three, producing a simulated order, transaction and notification event.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOOK
          startingStock: 5
          quantity: 2
          unitPrice: 100
          paymentApproved: true
      status: 200
      response:
        outcome: COMPLETED
        simulatedOnly: true
        orderId: DEMO-ORDER
        transactionId: DEMO-TXN
        total: 200
        stockBefore: 5
        stockAfter: 3
        notificationSent: true
        events:
        - step: 1
          actor: Client
          operation: checkout(cart)
          observation: Request enters OrderService
          stockAfter: 5
        - step: 2
          actor: Cart
          operation: total()
          observation: '200'
          stockAfter: 5
        - step: 3
          actor: Inventory
          operation: reserve()
          observation: Reserved 2 item(s)
          stockAfter: 3
        - step: 4
          actor: PaymentGateway
          operation: pay()
          observation: 'Approved: DEMO-TXN'
          stockAfter: 3
        - step: 5
          actor: OrderService
          operation: new Order()
          observation: Created local simulated order
          stockAfter: 3
        - step: 6
          actor: Notifier
          operation: send(order)
          observation: Simulated notification (not transmitted)
          stockAfter: 3
      detailDescription: <p><code>Cart.total()</code> multiplies price 100 by quantity 2 to obtain 200. <code>Inventory.reserve(2)</code> reduces stock from 5 to
        3, and <code>PaymentGateway.pay()</code> returns <code>DEMO-TXN</code>. The service constructs <code>DEMO-ORDER</code> and calls <code>Notifier.send()</code>
        to set a local flag. Six trace events record the ordered interactions; no actual payment or notification occurs.</p>
    - id: case_002
      title: Insufficient stock prevents payment
      description: Inventory cannot reserve two units when only one is available, so PaymentGateway is never called.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOOK
          startingStock: 1
          quantity: 2
          unitPrice: 100
          paymentApproved: true
      status: 200
      response:
        outcome: STOCK_REJECTED
        simulatedOnly: true
        orderId: null
        transactionId: null
        total: 200
        stockBefore: 1
        stockAfter: 1
        notificationSent: false
        events:
        - step: 1
          actor: Client
          operation: checkout(cart)
          observation: Request enters OrderService
          stockAfter: 1
        - step: 2
          actor: Cart
          operation: total()
          observation: '200'
          stockAfter: 1
        - step: 3
          actor: Inventory
          operation: reserve()
          observation: 'Rejected: not enough stock'
          stockAfter: 1
      detailDescription: <p>Cart total is still calculated as 200 first. <code>Inventory.reserve(2)</code> returns false against stock 1 and leaves inventory unchanged;
        <code>STOCK_REJECTED</code> has just Client, Cart and Inventory trace events. No order, transaction or notification exists. This business outcome returns
        HTTP 200.</p>
    - id: case_003
      title: Payment is declined and stock restored
      description: The reservation is compensated after a definite simulated payment rejection.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOOK
          startingStock: 5
          quantity: 2
          unitPrice: 100
          paymentApproved: false
      status: 200
      response:
        outcome: PAYMENT_DECLINED
        simulatedOnly: true
        orderId: null
        transactionId: null
        total: 200
        stockBefore: 5
        stockAfter: 5
        notificationSent: false
        events:
        - step: 1
          actor: Client
          operation: checkout(cart)
          observation: Request enters OrderService
          stockAfter: 5
        - step: 2
          actor: Cart
          operation: total()
          observation: '200'
          stockAfter: 5
        - step: 3
          actor: Inventory
          operation: reserve()
          observation: Reserved 2 item(s)
          stockAfter: 3
        - step: 4
          actor: PaymentGateway
          operation: pay()
          observation: Rejected by simulated gateway
          stockAfter: 3
        - step: 5
          actor: Inventory
          operation: release()
          observation: Restored reservation after definite rejection
          stockAfter: 5
      detailDescription: <p>Reservation first reduces stock from 5 to 3. <code>PaymentGateway.pay()</code> throws <code>PaymentDeclinedException</code>, which <code>simulate()</code>
        catches; <code>Inventory.release(2)</code> restores stock to 5. The five-event trace has no order creation or notification. <code>PAYMENT_DECLINED</code>
        is an HTTP 200 business outcome.</p>
    - id: case_004
      title: Reject too-small, overprecise unit price
      description: Price 0.001 violates the minimum and the two-decimal-place bound.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOOK
          startingStock: 5
          quantity: 2
          unitPrice: 0.001
          paymentApproved: true
      status: 400
      response:
        error: unitPrice must be between 0.01 and 1000000 with at most 2 decimal places
      detailDescription: <p>Before creating a Cart or reserving stock, validation detects <code>unitPrice.compareTo(0.01) &lt; 0</code>; the price also carries more
        than two fractional digits. <code>IllegalArgumentException</code> is mapped to HTTP 400 with the exact <code>error</code> message.</p>
    - id: case_005
      title: Reject a zero quantity
      description: Checkout quantity must be positive before any workflow objects are created.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOOK
          startingStock: 5
          quantity: 0
          unitPrice: 100
          paymentApproved: true
      status: 400
      response:
        error: quantity must be between 1 and 100
      detailDescription: <p><code>boundedInt(&quot;quantity&quot;, 0, 1, 100)</code> fails before building the checkout objects. No inventory reservation or payment
        occurs; the scoped exception handler returns HTTP 400 with the original service message.</p>
BasicsExperimentController:
  simulateAccount(AccountSimulationRequest):
    methodName: simulateAccount
    httpMethods:
    - POST
    mappingPaths:
    - /oop/basics/accounts/simulate
    usage: true
    cases:
    - id: case_001
      title: Successful deposit and withdrawal
      description: A request-local account receives a deposit and a valid withdrawal; the timeline exposes state before and after each action.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          accountId: DEMO-001
          openingBalanceCents: 10000
          actions:
          - action: DEPOSIT
            amountCents: 2500
          - action: WITHDRAW
            amountCents: 4000
      status: 200
      response:
        accountId: DEMO-001
        openingBalanceCents: 10000
        finalBalanceCents: 8500
        timeline:
        - step: 1
          action: DEPOSIT
          amountCents: 2500
          balanceBeforeCents: 10000
          balanceAfterCents: 12500
          accepted: true
          reason: null
        - step: 2
          action: WITHDRAW
          amountCents: 4000
          balanceBeforeCents: 12500
          balanceAfterCents: 8500
          accepted: true
          reason: null
      detailDescription: "<p>Successful request-local account experiment. The Controller accepts POST /oop/basics/accounts/simulate and delegates to BasicsExperimentService.simulateAccount;\
        \ amounts are integer cents, not persisted account balances.</p>\n<ol>\n<li>requireSteps accepts two actions within the 1–20 limit. BankAccount(&#39;DEMO-001&#39;,10000)\
        \ validates the identifier and nonnegative opening balance.</li>\n<li>DEPOSIT 2500 calls BankAccount.deposit: requirePositive passes and Math.addExact calculates\
        \ 10000+2500=12500. Timeline step 1 records before=10000, after=12500, accepted=true.</li>\n<li>WITHDRAW 4000 invokes BankAccount.withdraw. Since 4000&lt;=12500,\
        \ the account becomes 8500. Step 2 records before=12500, after=8500, accepted=true and reason=null.</li>\n<li>No exception escapes the service; AccountSimulationResponse\
        \ reports finalBalanceCents=8500 and the two timeline entries, with HTTP 200.</li>\n</ol>\n<pre><code>controller.simulateAccount(request)\n  -&gt; service.simulateAccount(request)\n\
        \  -&gt; new BankAccount(&quot;DEMO-001&quot;,10000)\n  -&gt; deposit(2500): 10000 -&gt; 12500\n  -&gt; withdraw(4000): 12500 -&gt; 8500</code></pre>"
    - id: case_002
      title: Insufficient funds without aborting the simulation
      description: A withdrawal exceeding the balance is rejected in the business timeline (HTTP 200); a later deposit still succeeds.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          accountId: WALLET-2
          openingBalanceCents: 500
          actions:
          - action: WITHDRAW
            amountCents: 800
          - action: DEPOSIT
            amountCents: 100
      status: 200
      response:
        accountId: WALLET-2
        openingBalanceCents: 500
        finalBalanceCents: 600
        timeline:
        - step: 1
          action: WITHDRAW
          amountCents: 800
          balanceBeforeCents: 500
          balanceAfterCents: 500
          accepted: false
          reason: Insufficient balance
        - step: 2
          action: DEPOSIT
          amountCents: 100
          balanceBeforeCents: 500
          balanceAfterCents: 600
          accepted: true
          reason: null
      detailDescription: '<p>The first withdrawal is rejected at the domain level, but the request is valid and later actions still execute.</p>

        <ol>

        <li>BasicsExperimentService constructs BankAccount(&#39;WALLET-2&#39;,500) and iterates the two actions. WITHDRAW 800 reaches BankAccount.withdraw(800).</li>

        <li>Because 800 exceeds 500, withdraw returns false without throwing. The service records accepted=false, reason=&#39;Insufficient balance&#39;, and unchanged
        before/after balances of 500.</li>

        <li>The following DEPOSIT 100 succeeds and raises the balance from 500 to 600; timeline step 2 has accepted=true and reason=null.</li>

        <li>The failed action is not a failed HTTP request. The service returns AccountSimulationResponse(finalBalanceCents=600), so HTTP status is 200 rather than
        400.</li>

        </ol>

        <pre><code>withdraw(800) when balance=500 -&gt; false, unchanged

        deposit(100) -&gt; balance=600

        HTTP 200; timeline[0].accepted=false; timeline[1].accepted=true</code></pre>'
    - id: case_003
      title: Zero deposit rejected without state mutation
      description: An invalid deposit violates the BankAccount invariant and is recorded in the timeline without interrupting later actions.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          accountId: BALANCE
          openingBalanceCents: 500
          actions:
          - action: DEPOSIT
            amountCents: 0
          - action: DEPOSIT
            amountCents: 100
      status: 200
      response:
        accountId: BALANCE
        openingBalanceCents: 500
        finalBalanceCents: 600
        timeline:
        - step: 1
          action: DEPOSIT
          amountCents: 0
          balanceBeforeCents: 500
          balanceAfterCents: 500
          accepted: false
          reason: amountCents must be positive
        - step: 2
          action: DEPOSIT
          amountCents: 100
          balanceBeforeCents: 500
          balanceAfterCents: 600
          accepted: true
          reason: null
      detailDescription: '<p>A zero-amount deposit violates the BankAccount invariant, but the service catches the exception for that one action and continues.</p>

        <ol>

        <li>Create account BALANCE with openingBalanceCents=500; the two-element actions list passes requireSteps.</li>

        <li>DEPOSIT 0 calls BankAccount.deposit(0), where requirePositive throws IllegalArgumentException(&#39;amountCents must be positive&#39;) before mutating
        the balance.</li>

        <li>The catch inside BasicsExperimentService&#39;s action loop records accepted=false, the exact error reason, and before=after=500 for step 1.</li>

        <li>The next DEPOSIT 100 succeeds, leaving 600. Since the per-action exception was handled, the overall response is HTTP 200 rather than 400.</li>

        </ol>

        <pre><code>deposit(0) -&gt; IllegalArgumentException

        per-action catch -&gt; accepted=false, balance=500

        deposit(100) -&gt; balance=600; HTTP 200</code></pre>'
    - id: case_004
      title: Invalid account identifier — HTTP 400
      description: An invalid request identifier fails before simulation and the scoped exception handler returns INVALID_INPUT.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          accountId: bad id
          openingBalanceCents: 100
          actions:
          - action: DEPOSIT
            amountCents: 50
      status: 400
      response:
        code: INVALID_INPUT
        message: accountId must contain 1-40 letters, digits, '_' or '-'
      detailDescription: "<p>The account identifier &#39;bad id&#39; contains a space and cannot satisfy BankAccount&#39;s constructor invariant, so this is a request-level\
        \ HTTP 400 error.</p>\n<ol>\n<li>BasicsExperimentController forwards the request to the service; the one-element actions list passes requireSteps.</li>\n\
        <li>new BankAccount(&#39;bad id&#39;,100) checks [A-Za-z0-9_-]{1,40} and throws IllegalArgumentException before the actions loop.</li>\n<li>This constructor\
        \ failure is outside the per-action try/catch. BasicsExperimentExceptionHandler, scoped to BasicsExperimentController, catches it.</li>\n<li>The handler returns\
        \ HTTP 400 with code=&#39;INVALID_INPUT&#39; and the exact identifier rule message. There is no AccountSimulationResponse or timeline because construction\
        \ failed.</li>\n</ol>\n<pre><code>new BankAccount(&quot;bad id&quot;,100)\n  -&gt; invalid accountId regex -&gt; IllegalArgumentException\n  -&gt; BasicsExperimentExceptionHandler.invalidInput\n\
        \  -&gt; HTTP 400 {code:&quot;INVALID_INPUT&quot;,message:&quot;accountId must contain 1-40 letters, digits, &#39;_&#39; or &#39;-&#39;&quot;}</code></pre>"
  simulateOrder(OrderSimulationRequest):
    methodName: simulateOrder
    httpMethods:
    - POST
    mappingPaths:
    - /oop/basics/orders/simulate
    usage: true
    cases:
    - id: case_001
      title: Add two lines and confirm the order
      description: The aggregate transitions from DRAFT to CONFIRMED; totals and line counts are derived from real state.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORD-100
          steps:
          - action: ADD_LINE
            sku: BOOK
            quantity: 2
            unitPriceCents: 1250
          - action: ADD_LINE
            sku: PEN
            quantity: 3
            unitPriceCents: 200
          - action: CONFIRM
      status: 200
      response:
        orderId: ORD-100
        finalStatus: CONFIRMED
        totalCents: 3100
        timeline:
        - step: 1
          action: ADD_LINE
          statusBefore: DRAFT
          statusAfter: DRAFT
          totalBeforeCents: 0
          totalAfterCents: 2500
          lineCountAfter: 1
          accepted: true
          reason: null
        - step: 2
          action: ADD_LINE
          statusBefore: DRAFT
          statusAfter: DRAFT
          totalBeforeCents: 2500
          totalAfterCents: 3100
          lineCountAfter: 2
          accepted: true
          reason: null
        - step: 3
          action: CONFIRM
          statusBefore: DRAFT
          statusAfter: CONFIRMED
          totalBeforeCents: 3100
          totalAfterCents: 3100
          lineCountAfter: 2
          accepted: true
          reason: null
      detailDescription: '<p>A valid order goes from DRAFT to CONFIRMED after two line items are added to an OrderAggregate.</p>

        <ol>

        <li>The Controller delegates to simulateOrder with orderId=&#39;ORD-100&#39; and three steps; requireSteps allows 1–20 operations. new OrderAggregate starts
        in DRAFT with totalCents=0 and an empty list.</li>

        <li>ADD_LINE BOOK validates the SKU, quantity=2 and unitPriceCents=1250. Math.multiplyExact yields 2500 and total becomes 2500; lineCountAfter=1.</li>

        <li>ADD_LINE PEN contributes 3×200=600 and Math.addExact produces total=3100 with two lines. Both additions keep status DRAFT and accepted=true.</li>

        <li>CONFIRM calls order.confirm(), verifies DRAFT with nonempty lines, and changes status to CONFIRMED without changing total=3100. HTTP 200 returns three
        before/after timeline entries.</li>

        </ol>

        <pre><code>new OrderAggregate(&quot;ORD-100&quot;) // DRAFT, total=0

        addLine(&quot;BOOK&quot;,2,1250) -&gt; total=2500

        addLine(&quot;PEN&quot;,3,200) -&gt; total=3100

        confirm() -&gt; CONFIRMED; HTTP 200</code></pre>'
    - id: case_002
      title: An empty order cannot be confirmed
      description: The business rule rejects CONFIRM and keeps the order DRAFT; HTTP 200 carries the failure reason in the timeline.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORD-EMPTY
          steps:
          - action: CONFIRM
      status: 200
      response:
        orderId: ORD-EMPTY
        finalStatus: DRAFT
        totalCents: 0
        timeline:
        - step: 1
          action: CONFIRM
          statusBefore: DRAFT
          statusAfter: DRAFT
          totalBeforeCents: 0
          totalAfterCents: 0
          lineCountAfter: 0
          accepted: false
          reason: Cannot confirm an empty order
      detailDescription: '<p>CONFIRM is invalid on an empty OrderAggregate, but the service records a rejected simulation step instead of failing the HTTP request.</p>

        <ol>

        <li>OrderAggregate(&#39;ORD-EMPTY&#39;) starts as DRAFT with zero lines and totalCents=0; the single CONFIRM step satisfies requireSteps.</li>

        <li>OrderAggregate.confirm() passes requireDraft but detects lines.isEmpty() and throws IllegalStateException(&#39;Cannot confirm an empty order&#39;).</li>

        <li>BasicsExperimentService catches that exception inside the step loop, sets accepted=false and the exact reason, and preserves DRAFT, total=0 and lineCountAfter=0.</li>

        <li>The service still returns OrderSimulationResponse, so the HTTP status is 200, not 400. The failure is reported in the timeline only.</li>

        </ol>

        <pre><code>new OrderAggregate(&quot;ORD-EMPTY&quot;) // DRAFT, lines=[]

        confirm() -&gt; IllegalStateException(&quot;Cannot confirm an empty order&quot;)

        per-step catch -&gt; accepted=false; status=DRAFT; HTTP 200</code></pre>'
    - id: case_003
      title: Confirmed orders cannot be edited
      description: Adding a line after CONFIRM fails without mutating the existing total or line count.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORD-LOCK
          steps:
          - action: ADD_LINE
            sku: BOOK
            quantity: 1
            unitPriceCents: 1500
          - action: CONFIRM
          - action: ADD_LINE
            sku: PEN
            quantity: 1
            unitPriceCents: 100
      status: 200
      response:
        orderId: ORD-LOCK
        finalStatus: CONFIRMED
        totalCents: 1500
        timeline:
        - step: 1
          action: ADD_LINE
          statusBefore: DRAFT
          statusAfter: DRAFT
          totalBeforeCents: 0
          totalAfterCents: 1500
          lineCountAfter: 1
          accepted: true
          reason: null
        - step: 2
          action: CONFIRM
          statusBefore: DRAFT
          statusAfter: CONFIRMED
          totalBeforeCents: 1500
          totalAfterCents: 1500
          lineCountAfter: 1
          accepted: true
          reason: null
        - step: 3
          action: ADD_LINE
          statusBefore: CONFIRMED
          statusAfter: CONFIRMED
          totalBeforeCents: 1500
          totalAfterCents: 1500
          lineCountAfter: 1
          accepted: false
          reason: 'Order must be DRAFT; actual status: CONFIRMED'
      detailDescription: '<p>The third step attempts to change a CONFIRMED order. OrderAggregate blocks that mutation and preserves the already confirmed total and
        lines.</p>

        <ol>

        <li>Step 1 ADD_LINE BOOK adds 1×1500=1500 in DRAFT.</li>

        <li>Step 2 CONFIRM succeeds because the aggregate contains one line; status becomes CONFIRMED, total remains 1500 and lineCount remains 1.</li>

        <li>Step 3 ADD_LINE PEN calls OrderAggregate.addLine, but requireDraft sees CONFIRMED and throws IllegalStateException(&#39;Order must be DRAFT; actual status:
        CONFIRMED&#39;) before appending a line.</li>

        <li>The service catches the error per step; step 3 has accepted=false, statusBefore=statusAfter=CONFIRMED, totalBefore=totalAfter=1500, lineCountAfter=1.
        The whole request returns HTTP 200.</li>

        </ol>

        <pre><code>addLine(&quot;BOOK&quot;,1,1500) -&gt; DRAFT,total=1500

        confirm() -&gt; CONFIRMED

        addLine(&quot;PEN&quot;,1,100) -&gt; requireDraft() fails

        HTTP 200; finalStatus=CONFIRMED,totalCents=1500</code></pre>'
    - id: case_004
      title: Invalid order identifier — HTTP 400
      description: The request is rejected before the aggregate is created, using the common error response.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORDER BAD
          steps:
          - action: CANCEL
      status: 400
      response:
        code: INVALID_INPUT
        message: orderId must contain 1-40 letters, digits, '_' or '-'
      detailDescription: "<p>orderId=&#39;ORDER BAD&#39; includes a space and is rejected by the OrderAggregate constructor before the CANCEL action can run.</p>\n\
        <ol>\n<li>The Controller forwards the request to BasicsExperimentService.simulateOrder; the one-item steps list passes requireSteps.</li>\n<li>new OrderAggregate(&#39;ORDER\
        \ BAD&#39;) checks [A-Za-z0-9_-]{1,40} and immediately throws IllegalArgumentException.</li>\n<li>The constructor failure occurs outside the per-step catch\
        \ and is handled by the controller-scoped BasicsExperimentExceptionHandler as HTTP 400.</li>\n<li>The error response contains code=&#39;INVALID_INPUT&#39;\
        \ and the exact identifier restriction message; no OrderSimulationResponse, timeline or CANCEL operation is produced.</li>\n</ol>\n<pre><code>new OrderAggregate(&quot;ORDER\
        \ BAD&quot;)\n  -&gt; IllegalArgumentException(&quot;orderId must contain 1-40 letters, digits, &#39;_&#39; or &#39;-&#39;&quot;)\n  -&gt; BasicsExperimentExceptionHandler\
        \ -&gt; HTTP 400</code></pre>"
  compareShipping(ShippingQuoteRequest):
    methodName: compareShipping
    httpMethods:
    - POST
    mappingPaths:
    - /oop/basics/shipping/quotes
    usage: true
    cases:
    - id: case_001
      title: Compare pickup and courier at 12 km
      description: Two ShippingPolicy implementations receive the same input but compute distinct fees and payable totals.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          subtotalCents: 10000
          distanceKm: 12
      status: 200
      response:
        subtotalCents: 10000
        distanceKm: 12
        quotes:
        - policy: PICKUP
          feeCents: 0
          payableCents: 10000
        - policy: COURIER
          feeCents: 6300
          payableCents: 16300
      detailDescription: '<p>Two interchangeable ShippingPolicy implementations calculate illustrative charges at 12 km; no real carrier is contacted.</p>

        <ol>

        <li>BasicsExperimentService.compareShipping receives subtotalCents=10000 and distanceKm=12. The subtotal is nonnegative and the distance lies within 0–100.</li>

        <li>It iterates the fixed List.of(Pickup,Courier). Pickup.feeCents(12)=0, yielding payableCents=10000.</li>

        <li>Courier.feeCents(12) uses exact arithmetic: 1500+400×12=6300 cents, and subtotal+fee=16300 cents.</li>

        <li>HTTP 200 contains two quotes in policy order PICKUP/COURIER, feeCents 0/6300 and payableCents 10000/16300. These are teaching rules, not actual shipping
        prices.</li>

        </ol>

        <pre><code>Pickup.feeCents(12) = 0

        Courier.feeCents(12) = 1500 + 400 * 12 = 6300

        payable = subtotalCents + feeCents

        PICKUP:10000; COURIER:16300; HTTP 200</code></pre>'
    - id: case_002
      title: Zero distance still has a courier base fee
      description: PICKUP is free, while COURIER applies its 1,500-cent base fee even at distanceKm=0.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          subtotalCents: 1000
          distanceKm: 0
      status: 200
      response:
        subtotalCents: 1000
        distanceKm: 0
        quotes:
        - policy: PICKUP
          feeCents: 0
          payableCents: 1000
        - policy: COURIER
          feeCents: 1500
          payableCents: 2500
      detailDescription: '<p>The distance boundary value 0 km is valid, yet Courier still charges its fixed base fee of 1500 cents.</p>

        <ol>

        <li>The service verifies subtotalCents=1000 &gt;= 0 and distanceKm=0 within 0–100.</li>

        <li>Pickup.feeCents(0)=0, so payableCents=1000.</li>

        <li>Courier.feeCents(0)=1500+400×0=1500, not zero because of the fixed component; payableCents=1000+1500=2500.</li>

        <li>HTTP 200 returns quotes in PICKUP then COURIER order. The case isolates the difference between base fee and distance-based fee.</li>

        </ol>

        <pre><code>distanceKm=0

        PICKUP fee=0 -&gt; payable=1000

        COURIER fee=1500+(400*0)=1500 -&gt; payable=2500

        HTTP 200</code></pre>'
    - id: case_003
      title: Distance exceeds the accepted range — HTTP 400
      description: A distance of 101 km exceeds the simulation limit of 0–100 km and fails request validation.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          subtotalCents: 10000
          distanceKm: 101
      status: 400
      response:
        code: INVALID_INPUT
        message: distanceKm must be between 0 and 100
      detailDescription: "<p>distanceKm=101 exceeds the service&#39;s maximum distance of 100 km, so validation fails before quotes are generated.</p>\n<ol>\n<li>The\
        \ Controller forwards the JSON request to BasicsExperimentService.compareShipping.</li>\n<li>The service accepts nonnegative subtotalCents=10000, then evaluates\
        \ (distanceKm &lt; 0 || distanceKm &gt; 100). With 101, it throws IllegalArgumentException(&#39;distanceKm must be between 0 and 100&#39;).</li>\n<li>The\
        \ exception is raised before iterating ShippingPolicy; no partial quotes or fee calculations are returned.</li>\n<li>BasicsExperimentExceptionHandler maps\
        \ the failure to HTTP 400 with code=&#39;INVALID_INPUT&#39; and the exact distance restriction message.</li>\n</ol>\n<pre><code>if (distanceKm &lt; 0 || distanceKm\
        \ &gt; 100)\n    throw IllegalArgumentException(&quot;distanceKm must be between 0 and 100&quot;)\nHTTP 400; no shipping quote calculation</code></pre>"
    - id: case_004
      title: Negative subtotal — HTTP 400
      description: A negative subtotal is rejected before evaluating any shipping policy.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          subtotalCents: -1
          distanceKm: 5
      status: 400
      response:
        code: INVALID_INPUT
        message: subtotalCents cannot be negative
      detailDescription: "<p>subtotalCents=-1 violates the first validation in compareShipping and causes HTTP 400 even though distanceKm=5 is valid.</p>\n<ol>\n\
        <li>BasicsExperimentController receives {-1,5} and calls BasicsExperimentService.compareShipping.</li>\n<li>The service checks subtotalCents &lt; 0 before\
        \ validating distanceKm and throws IllegalArgumentException(&#39;subtotalCents cannot be negative&#39;).</li>\n<li>Neither Pickup nor Courier is invoked;\
        \ no ShippingQuote is produced. Valid distance does not override the nonnegative subtotal requirement.</li>\n<li>The controller-scoped exception handler responds\
        \ HTTP 400, code=&#39;INVALID_INPUT&#39;, and the exact subtotal error message instead of a ShippingQuoteResponse.</li>\n</ol>\n<pre><code>if (subtotalCents\
        \ &lt; 0)\n    throw IllegalArgumentException(&quot;subtotalCents cannot be negative&quot;)\nHTTP 400; no Pickup/Courier calculation</code></pre>"
PolymorphismExperimentsController:
  dispatch(DispatchRequest):
    methodName: dispatch
    httpMethods:
    - POST
    mappingPaths:
    - /oop/polymorphism/dispatch/experiment
    usage: true
    cases:
    - id: case_001
      title: PremiumHandler with two distinct overloads
      description: An Event-typed reference selects handle(Event), while a specialized PriorityEvent reference selects handle(PriorityEvent).
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          receiverType: PREMIUM
          eventType: PRIORITY
          weight: 4
          priority: 3
          bonus: 7
      status: 200
      response:
        receiverType: PREMIUM
        eventType: PRIORITY
        viaDeclaredEvent: 47
        viaSpecificEvent: 410
        overriddenInstanceMethod: PREMIUM-INSTANCE
        fieldViaBaseReference: BASE-FIELD
        fieldViaConcreteReference: PREMIUM-FIELD
        staticViaBaseClass: BASE-STATIC
        staticViaConcreteClass: PREMIUM-STATIC
        sameReceiverObject: true
      detailDescription: <p>Although the runtime event is PriorityEvent, <code>Event event</code> selects the Premium override of <code>handle(Event)</code>, yielding
        4 × 10 + 7 = 47. After <code>instanceof PriorityEvent</code>, the specialized overload computes 4 × 100 + 3 + 7 = 410. <code>identify()</code> returns PREMIUM-INSTANCE;
        field/static members accessed through Handler remain BASE, whereas Premium access returns PREMIUM. Both calls use the same receiver.</p>
    - id: case_002
      title: Base Handler still selects overloads statically
      description: Without a subclass override, different declared argument types still choose different signatures.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          receiverType: BASE
          eventType: PRIORITY
          weight: 4
          priority: 3
          bonus: 0
      status: 200
      response:
        receiverType: BASE
        eventType: PRIORITY
        viaDeclaredEvent: 40
        viaSpecificEvent: 403
        overriddenInstanceMethod: BASE-INSTANCE
        fieldViaBaseReference: BASE-FIELD
        fieldViaConcreteReference: BASE-FIELD
        staticViaBaseClass: BASE-STATIC
        staticViaConcreteClass: BASE-STATIC
        sameReceiverObject: true
      detailDescription: <p><code>handler.handle(event)</code> selects <code>handle(Event)</code> because the argument is declared as Event, producing 4 × 10 = 40.
        With a pattern-matched <code>PriorityEvent</code> argument, <code>handle(PriorityEvent)</code> returns 4 × 100 + 3 = 403. Receiver, visible field, static
        category and identify all belong to BASE.</p>
    - id: case_003
      title: A plain Event uses the same selected overload
      description: Without PriorityEvent, both observed paths dispatch Premium's handle(Event) override.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          receiverType: PREMIUM
          eventType: EVENT
          weight: 5
          priority: null
          bonus: 9
      status: 200
      response:
        receiverType: PREMIUM
        eventType: EVENT
        viaDeclaredEvent: 59
        viaSpecificEvent: 59
        overriddenInstanceMethod: PREMIUM-INSTANCE
        fieldViaBaseReference: BASE-FIELD
        fieldViaConcreteReference: PREMIUM-FIELD
        staticViaBaseClass: BASE-STATIC
        staticViaConcreteClass: PREMIUM-STATIC
        sameReceiverObject: true
      detailDescription: <p>The runtime event is a regular Event, so <code>instanceof PriorityEvent</code> is false. Both expressions invoke Premium's <code>handle(Event)</code>
        override and return 5 × 10 + 9 = 59. A null <code>priority</code> is valid for EVENT, while hidden field/static members still show their distinct values.</p>
    - id: case_004
      title: A base Event invokes the original instance method
      description: Without priority specialization or a bonus, Handler supplies all observed values.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          receiverType: BASE
          eventType: EVENT
          weight: 5
          priority: null
          bonus: 0
      status: 200
      response:
        receiverType: BASE
        eventType: EVENT
        viaDeclaredEvent: 50
        viaSpecificEvent: 50
        overriddenInstanceMethod: BASE-INSTANCE
        fieldViaBaseReference: BASE-FIELD
        fieldViaConcreteReference: BASE-FIELD
        staticViaBaseClass: BASE-STATIC
        staticViaConcreteClass: BASE-STATIC
        sameReceiverObject: true
      detailDescription: <p>With receiver BASE and event EVENT, both calls invoke <code>Handler.handle(Event)</code> for 5 × 10 = 50. <code>Handler.identify()</code>
        is BASE-INSTANCE, and both observed field/static values are BASE, providing a baseline for comparison with Premium.</p>
    - id: case_005
      title: Missing priority for a PriorityEvent
      description: Priority events require an explicit priority before creating the receiver or event.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          receiverType: PREMIUM
          eventType: PRIORITY
          weight: 4
          priority: null
          bonus: 7
      status: 400
      response:
        error: priority is required for PRIORITY
      detailDescription: <p><code>DispatchMechanics.observe()</code> detects <code>eventType=PRIORITY</code> with null priority and throws <code>IllegalArgumentException</code>
        carrying the exact message. The handler returns HTTP 400 before any <code>handle()</code> call.</p>
    - id: case_006
      title: Zero event weight is invalid
      description: The Event constructor protects the range of values supplied to polymorphic handlers.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          receiverType: PREMIUM
          eventType: EVENT
          weight: 0
          priority: null
          bonus: 0
      status: 400
      response:
        error: weight must be 1..10000
      detailDescription: <p>After receiver and event-type validation, <code>new Event(0)</code> fails the constructor's 1–10000 weight requirement and throws <code>IllegalArgumentException</code>.
        The handler returns HTTP 400 instead of a <code>DispatchResult</code>.</p>
  payments(PaymentsRequest):
    methodName: payments
    httpMethods:
    - POST
    mappingPaths:
    - /oop/polymorphism/payments/experiment
    usage: true
    cases:
    - id: case_001
      title: Five actions through CARD, WALLET and BANK
      description: One interface-based checkout produces all three statuses, and only successful wallet debits alter its balance.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialWalletBalanceVnd: 100
          cardLimitVnd: 100
          actions:
          - method: CARD
            orderId: ORD-1
            amountVnd: 100
          - method: WALLET
            orderId: ORD-2
            amountVnd: 60
          - method: WALLET
            orderId: ORD-3
            amountVnd: 50
          - method: BANK
            orderId: ORD-4
            amountVnd: 25
          - method: WALLET
            orderId: ORD-5
            amountVnd: 20
      status: 200
      response:
        initialWalletBalanceVnd: 100
        finalWalletBalanceVnd: 20
        steps:
        - index: 1
          method: CARD
          orderId: ORD-1
          amountVnd: 100
          status: PAID
          detail: simulated card authorization
          walletBalanceBeforeVnd: 100
          walletBalanceAfterVnd: 100
        - index: 2
          method: WALLET
          orderId: ORD-2
          amountVnd: 60
          status: PAID
          detail: simulated wallet debit
          walletBalanceBeforeVnd: 100
          walletBalanceAfterVnd: 40
        - index: 3
          method: WALLET
          orderId: ORD-3
          amountVnd: 50
          status: DECLINED
          detail: insufficient simulated wallet balance
          walletBalanceBeforeVnd: 40
          walletBalanceAfterVnd: 40
        - index: 4
          method: BANK
          orderId: ORD-4
          amountVnd: 25
          status: PENDING
          detail: simulated transfer awaiting confirmation for ORD-4
          walletBalanceBeforeVnd: 40
          walletBalanceAfterVnd: 40
        - index: 5
          method: WALLET
          orderId: ORD-5
          amountVnd: 20
          status: PAID
          detail: simulated wallet debit
          walletBalanceBeforeVnd: 40
          walletBalanceAfterVnd: 20
        paidCount: 3
        declinedCount: 1
        pendingCount: 1
        scope: REQUEST_LOCAL_SIMULATION_NO_REAL_PAYMENT_NO_DURABLE_STATE
      detailDescription: <p>CARD 100 meets the per-payment limit and returns PAID without touching the wallet. WALLET 60 reduces the wallet from 100 to 40; WALLET
        50 is declined and leaves 40. BANK 25 is PENDING without confirming a transfer or changing the balance. The final WALLET 20 succeeds and leaves 20. Counts
        are 3 PAID, 1 DECLINED and 1 PENDING, all simulated.</p>
    - id: case_002
      title: Card exceeds limit, wallet pays, bank remains pending
      description: The same interface dispatches distinct outcomes for three concrete strategies.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialWalletBalanceVnd: 100
          cardLimitVnd: 50
          actions:
          - method: CARD
            orderId: ORD-1
            amountVnd: 60
          - method: WALLET
            orderId: ORD-2
            amountVnd: 40
          - method: BANK
            orderId: ORD-3
            amountVnd: 10
      status: 200
      response:
        initialWalletBalanceVnd: 100
        finalWalletBalanceVnd: 60
        steps:
        - index: 1
          method: CARD
          orderId: ORD-1
          amountVnd: 60
          status: DECLINED
          detail: simulated card limit exceeded
          walletBalanceBeforeVnd: 100
          walletBalanceAfterVnd: 100
        - index: 2
          method: WALLET
          orderId: ORD-2
          amountVnd: 40
          status: PAID
          detail: simulated wallet debit
          walletBalanceBeforeVnd: 100
          walletBalanceAfterVnd: 60
        - index: 3
          method: BANK
          orderId: ORD-3
          amountVnd: 10
          status: PENDING
          detail: simulated transfer awaiting confirmation for ORD-3
          walletBalanceBeforeVnd: 60
          walletBalanceAfterVnd: 60
        paidCount: 1
        declinedCount: 1
        pendingCount: 1
        scope: REQUEST_LOCAL_SIMULATION_NO_REAL_PAYMENT_NO_DURABLE_STATE
      detailDescription: <p><code>CardPaymentMethod</code> sees 60 &gt; 50 and returns DECLINED without touching the wallet. <code>WalletPaymentMethod</code> debits
        40 to leave 60 and returns PAID. <code>BankTransferPaymentMethod</code> returns PENDING for ORD-3 without further wallet changes. The HTTP 200 response has
        one of each outcome.</p>
    - id: case_003
      title: Insufficient wallet funds preserve the balance
      description: An insufficient-funds decline is a normal payment outcome rather than a request error.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialWalletBalanceVnd: 10
          cardLimitVnd: 1
          actions:
          - method: WALLET
            orderId: ORD-1
            amountVnd: 20
      status: 200
      response:
        initialWalletBalanceVnd: 10
        finalWalletBalanceVnd: 10
        steps:
        - index: 1
          method: WALLET
          orderId: ORD-1
          amountVnd: 20
          status: DECLINED
          detail: insufficient simulated wallet balance
          walletBalanceBeforeVnd: 10
          walletBalanceAfterVnd: 10
        paidCount: 0
        declinedCount: 1
        pendingCount: 0
        scope: REQUEST_LOCAL_SIMULATION_NO_REAL_PAYMENT_NO_DURABLE_STATE
      detailDescription: <p><code>WalletPaymentMethod.pay()</code> compares amount 20 with balance 10 before debiting. Because it exceeds the balance, the outcome
        is <code>DECLINED</code> with <code>insufficient simulated wallet balance</code>; both snapshots remain 10 and HTTP stays 200.</p>
    - id: case_004
      title: BANK provides a pending transfer instruction
      description: A simulated transfer instruction is not proof that payment was completed.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialWalletBalanceVnd: 0
          cardLimitVnd: 1
          actions:
          - method: BANK
            orderId: ORD-4
            amountVnd: 10
      status: 200
      response:
        initialWalletBalanceVnd: 0
        finalWalletBalanceVnd: 0
        steps:
        - index: 1
          method: BANK
          orderId: ORD-4
          amountVnd: 10
          status: PENDING
          detail: simulated transfer awaiting confirmation for ORD-4
          walletBalanceBeforeVnd: 0
          walletBalanceAfterVnd: 0
        paidCount: 0
        declinedCount: 0
        pendingCount: 1
        scope: REQUEST_LOCAL_SIMULATION_NO_REAL_PAYMENT_NO_DURABLE_STATE
      detailDescription: <p><code>BankTransferPaymentMethod.pay()</code> immediately returns <code>PENDING</code> with a detail containing ORD-4, without reading
        or debiting the wallet. There are zero PAID and one PENDING outcomes, the final wallet balance stays zero and no real bank is contacted.</p>
    - id: case_005
      title: Reject unsupported UNKNOWN payment before execution
      description: Implementation selection is limited to names provided in the request-local map.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialWalletBalanceVnd: 100
          cardLimitVnd: 50
          actions:
          - method: UNKNOWN
            orderId: ORD-1
            amountVnd: 10
      status: 400
      response:
        error: method must be CARD, WALLET or BANK
      detailDescription: <p>While preparing commands, <code>methods.get(&quot;UNKNOWN&quot;)</code> returns null. The service throws <code>IllegalArgumentException</code>
        before any payment loop is run, and the handler returns HTTP 400 with the original error.</p>
    - id: case_006
      title: Reject a zero payment amount
      description: PaymentCommand validates the amount before any simulated charge occurs.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialWalletBalanceVnd: 100
          cardLimitVnd: 50
          actions:
          - method: CARD
            orderId: ORD-1
            amountVnd: 0
      status: 400
      response:
        error: amountVnd must be 1..1000000000000
      detailDescription: <p><code>new PaymentCommand(&quot;ORD-1&quot;, 0)</code> fails the 1–1000000000000 amount requirement. The service prevalidates all actions,
        so no <code>PaymentStep</code> is produced; the handler returns HTTP 400 with the constructor's error.</p>
    - id: case_007
      title: Reject an empty action list
      description: The 1–20-action rule bounds the experiment's work.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialWalletBalanceVnd: 100
          cardLimitVnd: 50
          actions: []
      status: 400
      response:
        error: initialWalletBalanceVnd, cardLimitVnd and 1..20 actions are required
      detailDescription: <p><code>PolymorphismExperimentsService.payments()</code> checks <code>actions.isEmpty()</code> at entry and throws <code>IllegalArgumentException</code>
        before constructing payment implementations. The HTTP 400 response contains only the error.</p>
PracticeExperimentController:
  bank(BankRequest):
    methodName: bank
    httpMethods:
    - POST
    mappingPaths:
    - /oop/practice/bank/experiment
    usage: true
    cases:
    - id: case_001
      title: Successful transfer followed by a rejected withdrawal
      description: A transfer changes both balances; insufficient funds preserve snapshots and later steps continue.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          accounts:
          - id: TK-1
            owner: An
            openingBalanceVnd: 100
          - id: TK-2
            owner: Binh
            openingBalanceVnd: 20
          actions:
          - type: TRANSFER
            accountId: TK-1
            toAccountId: TK-2
            amountVnd: 60
          - type: WITHDRAW
            accountId: TK-1
            amountVnd: 100
          - type: DEPOSIT
            accountId: TK-2
            amountVnd: 30
      status: 200
      response:
        initial:
        - id: TK-1
          owner: An
          balanceVnd: 100
        - id: TK-2
          owner: Binh
          balanceVnd: 20
        steps:
        - index: 1
          type: TRANSFER
          accepted: true
          detail: completed
          before:
          - id: TK-1
            owner: An
            balanceVnd: 100
          - id: TK-2
            owner: Binh
            balanceVnd: 20
          after:
          - id: TK-1
            owner: An
            balanceVnd: 40
          - id: TK-2
            owner: Binh
            balanceVnd: 80
        - index: 2
          type: WITHDRAW
          accepted: false
          detail: insufficient funds
          before:
          - id: TK-1
            owner: An
            balanceVnd: 40
          - id: TK-2
            owner: Binh
            balanceVnd: 80
          after:
          - id: TK-1
            owner: An
            balanceVnd: 40
          - id: TK-2
            owner: Binh
            balanceVnd: 80
        - index: 3
          type: DEPOSIT
          accepted: true
          detail: completed
          before:
          - id: TK-1
            owner: An
            balanceVnd: 40
          - id: TK-2
            owner: Binh
            balanceVnd: 80
          after:
          - id: TK-1
            owner: An
            balanceVnd: 40
          - id: TK-2
            owner: Binh
            balanceVnd: 110
        current:
        - id: TK-1
          owner: An
          balanceVnd: 40
        - id: TK-2
          owner: Binh
          balanceVnd: 110
        scope: REQUEST_LOCAL_IN_MEMORY_NO_REAL_BANK_ACCOUNTS_OR_DURABLE_TRANSACTIONS
      detailDescription: <p><code>BankLedger.transfer</code> confirms TK-1 has 100 and transfers 60 to TK-2 with 20, producing balances 40/80. A withdrawal of 100
        from TK-1 throws <code>IllegalStateException(&quot;insufficient funds&quot;)</code>, caught as accepted=false with unchanged before/after=40/80. A later deposit
        of 30 to TK-2 raises it to 110. HTTP 200 contains all three steps in a request-local ledger, not a real bank.</p>
    - id: case_002
      title: Destination overflow leaves both account balances intact
      description: Math.addExact detects overflow before either account balance is changed.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          accounts:
          - id: A-1
            owner: An
            openingBalanceVnd: 100
          - id: B-2
            owner: Binh
            openingBalanceVnd: 9223372036854775807
          actions:
          - type: TRANSFER
            accountId: A-1
            toAccountId: B-2
            amountVnd: 1
      status: 200
      response:
        initial: &id050
        - id: A-1
          owner: An
          balanceVnd: 100
        - id: B-2
          owner: Binh
          balanceVnd: 9223372036854775807
        steps:
        - index: 1
          type: TRANSFER
          accepted: false
          detail: long overflow
          before:
          - id: A-1
            owner: An
            balanceVnd: 100
          - id: B-2
            owner: Binh
            balanceVnd: 9223372036854775807
          after:
          - id: A-1
            owner: An
            balanceVnd: 100
          - id: B-2
            owner: Binh
            balanceVnd: 9223372036854775807
        current: *id050
        scope: REQUEST_LOCAL_IN_MEMORY_NO_REAL_BANK_ACCOUNTS_OR_DURABLE_TRANSACTIONS
      detailDescription: <p><code>BankLedger.transfer</code> resolves both accounts and finds sufficient source funds, but B-2 already holds <code>Long.MAX_VALUE</code>.
        Adding one with <code>Math.addExact</code> throws <code>ArithmeticException(&quot;long overflow&quot;)</code> before either mutation. The service records
        accepted=false with unchanged before/after and HTTP 200, never a partial transfer.</p>
    - id: case_003
      title: Cannot transfer to the same account
      description: A self-transfer is refused as a per-step business error.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          accounts:
          - id: A-1
            owner: An
            openingBalanceVnd: 50
          actions:
          - type: TRANSFER
            accountId: A-1
            toAccountId: A-1
            amountVnd: 5
      status: 200
      response:
        initial:
        - id: A-1
          owner: An
          balanceVnd: 50
        steps:
        - index: 1
          type: TRANSFER
          accepted: false
          detail: cannot transfer to same account
          before:
          - id: A-1
            owner: An
            balanceVnd: 50
          after:
          - id: A-1
            owner: An
            balanceVnd: 50
        current:
        - id: A-1
          owner: An
          balanceVnd: 50
        scope: REQUEST_LOCAL_IN_MEMORY_NO_REAL_BANK_ACCOUNTS_OR_DURABLE_TRANSACTIONS
      detailDescription: <p><code>BankLedger.transfer</code> validates that amount is positive and compares fromId with toId. Both IDs are A-1, causing <code>IllegalArgumentException(&quot;cannot
        transfer to same account&quot;)</code> before any balance updates. The service catches it in the step, returns HTTP 200 accepted=false, and preserves the
        balance of 50.</p>
    - id: case_004
      title: Reject an empty initial account list
      description: The ledger requires at least one account before executing actions.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          accounts: []
          actions:
          - type: DEPOSIT
            accountId: A-1
            amountVnd: 1
      status: 400
      response:
        error: accounts must contain 1..10 entries
      detailDescription: <p>The action itself is valid, but <code>new BankLedger(seeds)</code> receives an empty account list. Its constructor throws <code>IllegalArgumentException(&quot;accounts
        must contain 1..10 entries&quot;)</code> before any snapshots or mutations. <code>PracticeExceptionHandler</code> returns HTTP 400 with the original message
        in <code>error</code>.</p>
  orders(OrderRequest):
    methodName: orders
    httpMethods:
    - POST
    mappingPaths:
    - /oop/practice/orders/experiment
    usage: true
    cases:
    - id: case_001
      title: Placed orders reject later quantity changes
      description: SKU is normalized, PLACE locks the order, and a later edit is rejected.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORD-1
          actions:
          - type: SET_LINE
            sku: ' book '
            unitPriceCents: 90000
            quantity: 2
          - type: PLACE
          - type: CHANGE_QUANTITY
            sku: BOOK
            quantity: 3
      status: 200
      response:
