Group1Controller:
  executeCase9(String):
    methodName: executeCase9
    httpMethods:
    - GET
    mappingPaths:
    - /case-studies/group/1/case/9/execute
    usage: true
    cases:
    - id: case_001
      title: Execute the CPU computation loop
      description: Pass mode=cpu to exercise the arithmetic computation branch and observe the completion signal on stdout.
      detailDescription: <p>The cpu branch calls Case9Utils.compute with 2000000 iterations. The Service prints the result only after the computation
        returns a positive value. Completing the run does not itself measure CPU time, GC, or request latency.</p>
      input:
        pathParams: {}
        queryParams:
          mode: cpu
        headers: {}
        body: null
      status: null
      response: null
      observations:
      - type: LOG
        source: stdout of the JVM running the Spring Boot application
        program: Terminal or IDE console window
        expect:
          keyword: workload completed; result=
          results: <p>After sending the request, look for a line containing <code>workload completed; result=</code> followed by a positive number. The line is printed after <code>compute(2000000)</code>
            completes and the positive-value check passes.</p>
          conclusion: <p>The CPU branch returned a valid result for this invocation. This log line does not measure processing time, CPU usage, or JVM memory allocation.</p>
      - type: JFR
        source: JVM JFR recording, only when recording and CPU sampling are enabled
        program: Java Mission Control
        expect:
          keyword: jdk.ExecutionSample
          results: <p>If the recording contains suitable CPU samples, filter <code>jdk.ExecutionSample</code> events to the request execution interval and inspect stacks
            involving <code>Case9Utils.compute</code>. Such events may not appear for every short invocation.</p>
          conclusion: <p>Samples can help identify where CPU time is spent; multiple samples and controlled measurements are needed before identifying a bottleneck.
            Without a recording, there is no JFR evidence.</p>
    - id: case_002
      title: Execute the array allocation workload
      description: Pass mode=allocation to observe the byte-array creation branch and distinguish evidence of allocation from processing time.
      detailDescription: <p>The allocation branch runs Case9Utils.allocate, creating a 1024-byte array 2000000 times; each iteration assigns the array
        to the volatile field keepAlive. The returned result is the sum of array lengths accumulated in the loop, not the number of live bytes or
        the amount of memory retained by the JVM.</p>
      input:
        pathParams: {}
        queryParams:
          mode: allocation
        headers: {}
        body: null
      status: null
      response: null
      observations:
      - type: LOG
        source: stdout of the JVM running the Spring Boot application
        program: Terminal or IDE console window
        expect:
          keyword: workload completed; result=
          results: <p>Look for a line containing <code>workload completed; result=</code> followed by a positive number after <code>allocate(2000000)</code> completes. The
            result comes from summing <code>bytes.length</code>, not from a heap measurement.</p>
          conclusion: <p>This invocation executed the allocations and checked the result in code. This log alone cannot establish GC pause times, measured allocation rate,
            retained memory, or latency.</p>
      - type: JFR
        source: JVM JFR recording, only when recording and appropriate allocation events are enabled
        program: Java Mission Control
        expect:
          keyword: jdk.ObjectAllocationSample
          results: <p>If the JVM/recording enables <code>jdk.ObjectAllocationSample</code> events, look for samples associated with <code>Case9Utils.allocate</code> during
            execution; also cross-check GC events if the recording collects them. Sample counts depend on configuration and execution duration.</p>
          conclusion: <p>Samples may provide evidence of allocations related to this workload. They do not by themselves prove that GC is the cause of slowness or
            precisely show the total number of bytes allocated.</p>
    - id: case_003
      title: Missing mode parameter
      description: Omit the mode query parameter to verify the argument-count check in the Service.
      detailDescription: '<p>The Controller converts mode=null to an empty String array; the Service detects an argument count other than one and throws
        IllegalArgumentException with the message <code>use: cpu|allocation</code> before running the workload. The HTTP error format depends on
        exception handling outside this method.</p>'
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body: null
      status: null
      response: null
      observations:
      - type: DEBUGGER
        source: IllegalArgumentException thrown at Group1Service.executeCase9
        program: Java IDE debugger with an exception breakpoint for IllegalArgumentException
        expect:
          keyword: 'use: cpu|allocation'
          results: '<p>When the request runs with a debugger attached to the JVM and break on thrown IllegalArgumentException enabled, execution stops at the <code>args.length
            != 1</code> check; the exception has the message <code>use: cpu|allocation</code>. The method never reaches the line that prints <code>workload completed</code>.</p>'
          conclusion: <p>A missing mode is rejected before a workload branch is selected. The HTTP status code or error JSON cannot be inferred because the Controller does not
            define an error response, and an exception handler may be configured separately.</p>
    - id: case_004
      title: Unsupported mode value
      description: Pass mode=unknown to enter the default branch of the switch expression.
      detailDescription: <p>The Service receives exactly one argument, but its value is neither cpu nor allocation; the default branch throws
        IllegalArgumentException with the input itself as the message. This method produces no completion output on stdout.</p>
      input:
        pathParams: {}
        queryParams:
          mode: unknown
        headers: {}
        body: null
      status: null
      response: null
      observations:
      - type: DEBUGGER
        source: IllegalArgumentException thrown from the default branch in Group1Service.executeCase9
        program: Java IDE debugger with an exception breakpoint for IllegalArgumentException
        expect:
          keyword: unknown
          results: <p>With a debugger attached and an exception breakpoint enabled, observe the <code>default</code> branch throwing IllegalArgumentException with the message
            <code>unknown</code> before the Service logs completion.</p>
          conclusion: <p>Any mode value other than the two supported choices is rejected. The specific HTTP status and body depend on the application's error handling,
            so they cannot be inferred from the Java exception alone.</p>
