AbstractionExperimentsController:
  shippingQuote(ShippingQuoteRequest):
    methodName: shippingQuote
    httpMethods:
    - POST
    mappingPaths:
    - /oop/abstraction/shipping/quote
    usage: true
    cases:
    - id: case_001
      title: ECONOMY charges for distance
      description: 5 km and 1500 g round to 2 kg, with a 15000 VND ECONOMY quote.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          plan: ECONOMY
          distanceKm: 5
          weightGrams: 1500
      status: 200
      response:
        plan: ECONOMY
        distanceKm: 5
        weightGrams: 1500
        billedKilograms: 2
        baseFeeVnd: 10000
        extraFeeVnd: 5000
        totalFeeVnd: 15000
        simulatedOnly: true
      detailDescription: <p>ECONOMY has baseFeeVnd=10000 and extraFeeVnd=1000×5=5000. The 1500 g weight rounds up to 2 kg but does not increase its economy fee. Total
        is 15000 VND with HTTP 200.</p>
    - id: case_002
      title: EXPRESS also charges for weight
      description: EXPRESS adds distance and billed-weight fees to the base charge.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          plan: ' EXPRESS '
          distanceKm: 5
          weightGrams: 1500
      status: 200
      response:
        plan: EXPRESS
        distanceKm: 5
        weightGrams: 1500
        billedKilograms: 2
        baseFeeVnd: 20000
        extraFeeVnd: 16000
        totalFeeVnd: 36000
        simulatedOnly: true
      detailDescription: <p>EXPRESS starts with 20000, adds 2000×5=10000 for distance and 3000×2=6000 for billed weight, producing 36000. A different <code>extraFee</code>
        algorithm fulfills the same <code>quote</code> contract.</p>
    - id: case_003
      title: Reject zero distance
      description: distanceKm=0 fails the positive distance precondition.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          plan: ECONOMY
          distanceKm: 0
          weightGrams: 1000
      status: 400
      response:
        code: INVALID_INPUT
        message: distanceKm and weightGrams must be positive
      detailDescription: <p><code>ShippingPlan.quote</code> is final and checks positive distance before pricing. Zero distance raises IllegalArgumentException and
        maps to HTTP 400 INVALID_INPUT.</p>
    - id: case_004
      title: Reject an unsupported plan
      description: OVERNIGHT is not one of ECONOMY and EXPRESS.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          plan: OVERNIGHT
          distanceKm: 5
          weightGrams: 1000
      status: 400
      response:
        code: INVALID_INPUT
        message: 'Unknown shipping plan: OVERNIGHT'
      detailDescription: '<p><code>ShippingPlan.named</code> recognizes only ECONOMY/EXPRESS after normalization. OVERNIGHT raises Unknown shipping plan: OVERNIGHT,
        returned as HTTP 400.</p>'
  seatScenario(SeatScenarioRequest):
    methodName: seatScenario
    httpMethods:
    - POST
    mappingPaths:
    - /oop/abstraction/seats/simulate
    usage: true
    cases:
    - id: case_001
      title: Reserve and release without mutating on rejection
      description: Accepted steps and two business rejections are returned together as HTTP 200 with per-step snapshots.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 10
          actions:
          - operation: RESERVE
            seats: 3
          - operation: RELEASE
            seats: 1
          - operation: RESERVE
            seats: 9
          - operation: RELEASE
            seats: 4
      status: 200
      response:
        capacity: 10
        available: 8
        reserved: 2
        steps:
        - step: 1
          operation: RESERVE
          seats: 3
          availableBefore: 10
          availableAfter: 7
          accepted: true
          rejectionCode: null
        - step: 2
          operation: RELEASE
          seats: 1
          availableBefore: 7
          availableAfter: 8
          accepted: true
          rejectionCode: null
        - step: 3
          operation: RESERVE
          seats: 9
          availableBefore: 8
          availableAfter: 8
          accepted: false
          rejectionCode: INSUFFICIENT_SEATS
        - step: 4
          operation: RELEASE
          seats: 4
          availableBefore: 8
          availableAfter: 8
          accepted: false
          rejectionCode: RELEASE_EXCEEDS_RESERVED
        simulatedOnly: true
      detailDescription: '<p>Start available=10: RESERVE 3 leaves 7, RELEASE 1 yields 8. RESERVE 9 exceeds available seats and is rejected with INSUFFICIENT_SEATS.
        RELEASE 4 exceeds the two reserved seats and is rejected with RELEASE_EXCEEDS_RESERVED. Both rejected steps retain available=8; HTTP 200.</p>'
    - id: case_002
      title: Normalize operation before execution
      description: Whitespace and case are normalized to RESERVE.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 3
          actions:
          - operation: ' reserve '
            seats: 2
      status: 200
      response:
        capacity: 3
        available: 1
        reserved: 2
        steps:
        - step: 1
          operation: RESERVE
          seats: 2
          availableBefore: 3
          availableAfter: 1
          accepted: true
          rejectionCode: null
        simulatedOnly: true
      detailDescription: <p>The service trims and uppercases operation before executing. <code> reserve </code> becomes RESERVE, so reserving two from capacity three
        leaves available one.</p>
    - id: case_003
      title: Reject invalid capacity
      description: capacity=0 violates the 1..1000000 range.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 0
          actions:
          - operation: RESERVE
            seats: 1
      status: 400
      response:
        code: INVALID_INPUT
        message: capacity must be from 1 to 1000000
      detailDescription: <p>SeatContractService rejects capacity zero before construction and the controller handler responds HTTP 400 INVALID_INPUT.</p>
    - id: case_004
      title: Reject unknown operation
      description: BUY is not RESERVE or RELEASE.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 10
          actions:
          - operation: BUY
            seats: 1
      status: 400
      response:
        code: INVALID_INPUT
        message: Operation must be RESERVE or RELEASE
      detailDescription: <p>BUY fails whole-request validation because the operation must be RESERVE or RELEASE. The response is HTTP 400, with no partial step results.</p>
    - id: case_005
      title: Validate all steps before changing state
      description: A later step with seats=0 invalidates the whole request before the first step can execute.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 10
          actions:
          - operation: RESERVE
            seats: 1
          - operation: RELEASE
            seats: 0
      status: 400
      response:
        code: INVALID_INPUT
        message: Every action requires an operation and positive seats
      detailDescription: <p>Although the first RESERVE 1 step is individually valid, a later RELEASE 0 step violates positive seats. The service validates all actions
        first, returning HTTP 400 without executing a partial scenario.</p>
  leaveEvaluation(LeaveEvaluationRequest):
    methodName: leaveEvaluation
    httpMethods:
    - POST
    mappingPaths:
    - /oop/abstraction/leave/evaluate
    usage: true
    cases:
    - id: case_001
      title: STANDARD approves within balance
      description: Three requested days from five remaining are approved under STANDARD.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policy: STANDARD
          employeeId: NV-01
          requestedDays: 3
          remainingDays: 5
      status: 200
      response:
        policy: STANDARD
        employeeId: NV-01
        decisionCode: APPROVED
        approved: true
        reason: Balance is sufficient
        simulatedOnly: true
      detailDescription: <p>StandardLeavePolicy compares 3 requested days to 5 remaining, returns APPROVED, approved=true, reason=Balance is sufficient, and never
        debits balance.</p>
    - id: case_002
      title: TRIAL rejects more than two days
      description: The same valid input is rejected under TRIAL's two-day cap.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policy: TRIAL
          employeeId: NV-01
          requestedDays: 3
          remainingDays: 5
      status: 200
      response:
        policy: TRIAL
        employeeId: NV-01
        decisionCode: EXCEEDS_TRIAL_LIMIT
        approved: false
        reason: Trial policy permits at most two days per request
        simulatedOnly: true
      detailDescription: <p>TrialLeavePolicy has sufficient balance but the request for three days exceeds its two-day limit; it returns EXCEEDS_TRIAL_LIMIT, approved=false,
        with HTTP 200 because this is a valid business decision.</p>
    - id: case_003
      title: Insufficient balance is rejected first
      description: Six requested days from five remaining fail the common balance condition before TRIAL's limit.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policy: TRIAL
          employeeId: NV-01
          requestedDays: 6
          remainingDays: 5
      status: 200
      response:
        policy: TRIAL
        employeeId: NV-01
        decisionCode: INSUFFICIENT_BALANCE
        approved: false
        reason: Requested days exceed remaining balance
        simulatedOnly: true
      detailDescription: '<p>TrialLeavePolicy checks remaining balance first: requesting six from five returns INSUFFICIENT_BALANCE. The common interface never allows
        a policy to approve more than the balance.</p>'
    - id: case_004
      title: TRIAL approves exactly two days
      description: Policy and employeeId are normalized.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policy: trial
          employeeId: ' NV-X '
          requestedDays: 2
          remainingDays: 2
      status: 200
      response:
        policy: TRIAL
        employeeId: NV-X
        decisionCode: APPROVED
        approved: true
        reason: Trial rules are satisfied
        simulatedOnly: true
      detailDescription: <p>The service normalizes trial to TRIAL, and LeaveRequest trims employeeId to NV-X. Exactly two days are approved with Trial rules are satisfied.</p>
    - id: case_005
      title: Reject zero requested days
      description: requestedDays=0 violates the LeaveRequest record constructor.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policy: STANDARD
          employeeId: NV-01
          requestedDays: 0
          remainingDays: 5
      status: 400
      response:
        code: INVALID_INPUT
        message: Invalid leave request
      detailDescription: <p>LeaveRequest constructor requires positive requestedDays. Zero raises IllegalArgumentException and maps to HTTP 400 with message Invalid
        leave request.</p>
    - id: case_006
      title: Reject unknown policy
      description: Policy OTHER is not implemented.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policy: OTHER
          employeeId: NV-01
          requestedDays: 1
          remainingDays: 5
      status: 400
      response:
        code: INVALID_INPUT
        message: 'Unknown leave policy: OTHER'
      detailDescription: '<p>OTHER has no switch case in LeaveEvaluationService, so it raises IllegalArgumentException with Unknown leave policy: OTHER and returns
        HTTP 400.</p>'
  catalogSearch(CatalogSearchRequest):
    methodName: catalogSearch
    httpMethods:
    - POST
    mappingPaths:
    - /oop/abstraction/catalog/search
    usage: true
    cases:
    - id: case_001
      title: Search titles and look up ISBN
      description: Keyword JAVA returns two matches, with a separate S-02 lookup outside the search matches.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          books:
          - isbn: S-02
            title: Spring Data
          - isbn: J-03
            title: Advanced Java
          - isbn: J-01
            title: Java OOP
          keyword: ' JAVA '
          limit: 2
          lookupIsbn: S-02
      status: 200
      response:
        matches:
        - isbn: J-01
          title: Java OOP
        - isbn: J-03
          title: Advanced Java
        lookup:
          isbn: S-02
          title: Spring Data
        found: true
        totalMatches: 2
        simulatedOnly: true
      detailDescription: <p>Keyword JAVA is trimmed and lowercased, finding Java OOP and Advanced Java, sorted by ISBN J-01 then J-03. Independent S-02 lookup finds
        Spring Data; totalMatches=2, found=true. Internal Map details never appear in JSON.</p>
    - id: case_002
      title: Limit output while preserving total matches
      description: limit=1 still reports two totalMatches, while MISSING returns null.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          books:
          - isbn: S-02
            title: Spring Data
          - isbn: J-03
            title: Advanced Java
          - isbn: J-01
            title: Java OOP
          keyword: java
          limit: 1
          lookupIsbn: MISSING
      status: 200
      response:
        matches:
        - isbn: J-01
          title: Java OOP
        lookup: null
        found: false
        totalMatches: 2
        simulatedOnly: true
      detailDescription: <p>With limit=1, only J-01 is returned but totalMatches remains two. ISBN MISSING yields lookup=null and found=false while the API returns
        HTTP 200.</p>
    - id: case_003
      title: Reject duplicate ISBNs
      description: Two BookInput records share ISBN X.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          books:
          - isbn: X
            title: One
          - isbn: X
            title: Two
          keyword: java
          limit: 2
          lookupIsbn: null
      status: 400
      response:
        code: INVALID_INPUT
        message: 'Duplicate ISBN: X'
      detailDescription: '<p>InMemoryCatalog uses <code>putIfAbsent</code> keyed by ISBN. The second record with X raises Duplicate ISBN: X and the handler responds
        HTTP 400 without exposing the Map.</p>'
    - id: case_004
      title: Reject blank lookup ISBN
      description: Blank after trimming lookupIsbn fails validation.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          books:
          - isbn: S-02
            title: Spring Data
          - isbn: J-03
            title: Advanced Java
          - isbn: J-01
            title: Java OOP
          keyword: java
          limit: 2
          lookupIsbn: ' '
      status: 400
      response:
        code: INVALID_INPUT
        message: lookupIsbn must not be blank
      detailDescription: <p>lookupIsbn is trimmed before Catalog.findByIsbn; whitespace-only input becomes blank, triggering IllegalArgumentException lookupIsbn must
        not be blank, mapped to HTTP 400.</p>
    - id: case_005
      title: Reject zero limit
      description: limit=0 violates the 1..50 constraint.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          books:
          - isbn: S-02
            title: Spring Data
          - isbn: J-03
            title: Advanced Java
          - isbn: J-01
            title: Java OOP
          keyword: java
          limit: 0
          lookupIsbn: null
      status: 400
      response:
        code: INVALID_INPUT
        message: keyword and limit (1..50) are required
      detailDescription: <p>BookCatalogService accepts limit only between one and 50. Zero fails before catalog construction and maps to HTTP 400 INVALID_INPUT.</p>
ClassesExperimentController:
  inventory(InventoryRequest):
    methodName: inventory
    httpMethods:
    - POST
    mappingPaths:
    - /oop/classes/inventory/experiment
    usage: true
    cases:
    - id: case_001
      title: Restock, sell, rename, and reject invalid actions
      description: Five actions include an oversized sale and zero-unit restock, both rejected without aborting later actions.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: KB-01
          name: Keyboard
          unitPriceVnd: 129000
          initialQuantity: 10
          actions:
          - type: restock
            units: 5
            name: null
          - type: sell
            units: 3
            name: null
          - type: sell
            units: 20
            name: null
          - type: rename
            units: null
            name: Mechanical Keyboard
          - type: restock
            units: 0
            name: null
      status: 200
      response:
        initial:
          sku: KB-01
          name: Keyboard
          unitPriceVnd: 129000
          quantity: 10
          totalValueVnd: 1290000
        steps:
        - index: 1
          type: restock
          accepted: true
          detail: completed
          before:
            sku: KB-01
            name: Keyboard
            unitPriceVnd: 129000
            quantity: 10
            totalValueVnd: 1290000
          after:
            sku: KB-01
            name: Keyboard
            unitPriceVnd: 129000
            quantity: 15
            totalValueVnd: 1935000
        - index: 2
          type: sell
          accepted: true
          detail: completed
          before:
            sku: KB-01
            name: Keyboard
            unitPriceVnd: 129000
            quantity: 15
            totalValueVnd: 1935000
          after:
            sku: KB-01
            name: Keyboard
            unitPriceVnd: 129000
            quantity: 12
            totalValueVnd: 1548000
        - index: 3
          type: sell
          accepted: false
          detail: insufficient inventory
          before:
            sku: KB-01
            name: Keyboard
            unitPriceVnd: 129000
            quantity: 12
            totalValueVnd: 1548000
          after:
            sku: KB-01
            name: Keyboard
            unitPriceVnd: 129000
            quantity: 12
            totalValueVnd: 1548000
        - index: 4
          type: rename
          accepted: true
          detail: completed
          before:
            sku: KB-01
            name: Keyboard
            unitPriceVnd: 129000
            quantity: 12
            totalValueVnd: 1548000
          after:
            sku: KB-01
            name: Mechanical Keyboard
            unitPriceVnd: 129000
            quantity: 12
            totalValueVnd: 1548000
        - index: 5
          type: restock
          accepted: false
          detail: restock units must be positive
          before:
            sku: KB-01
            name: Mechanical Keyboard
            unitPriceVnd: 129000
            quantity: 12
            totalValueVnd: 1548000
          after:
            sku: KB-01
            name: Mechanical Keyboard
            unitPriceVnd: 129000
            quantity: 12
            totalValueVnd: 1548000
        current:
          sku: KB-01
          name: Mechanical Keyboard
          unitPriceVnd: 129000
          quantity: 12
          totalValueVnd: 1548000
        maxQuantity: 1000000
      detailDescription: '<p>Initially 10 items cost 129000 VND each. Restocking five produces 15, selling three leaves 12, with total value 1548000. Selling 20 fails
        for insufficient inventory; step 3 has identical before/after snapshots.</p>

        <p>Renaming to Mechanical Keyboard succeeds, while restocking zero fails. Both action errors are caught, so HTTP 200 still contains all five steps.</p>'
    - id: case_002
      title: Reject an empty actions list
      description: An empty list violates the 1–20 actions requirement.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: KB-01
          name: Keyboard
          unitPriceVnd: 129000
          initialQuantity: 10
          actions: []
      status: 400
      response:
        error: actions must contain 1-20 steps
      detailDescription: <p><code>checkActions</code> requires 1–20 steps. An empty list throws <code>IllegalArgumentException</code> and the handler maps it to HTTP
        400 with <code>error=actions must contain 1-20 steps</code>.</p>
    - id: case_003
      title: Reject an unsupported inventory action
      description: Type discard is not restock, sell, or rename.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: KB-01
          name: Keyboard
          unitPriceVnd: 129000
          initialQuantity: 10
          actions:
          - type: discard
            units: 1
            name: null
      status: 400
      response:
        error: inventory type must be restock, sell or rename
      detailDescription: <p>The service validates the action type before constructing <code>InventoryItem</code>; <code>discard</code> is unsupported, so the handler
        returns HTTP 400 without steps.</p>
  workshops(WorkshopRequest):
    methodName: workshops
    httpMethods:
    - POST
    mappingPaths:
    - /oop/classes/workshops/experiment
    usage: true
    cases:
    - id: case_001
      title: Alias shares a workshop instance
      description: Three attempts for capacity-two Java, then two via the alias of capacity-one OOP.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          firstTitle: Java
          firstCapacity: 2
          secondTitle: OOP
          secondCapacity: 1
          firstAttempts: 3
          aliasAttempts: 2
      status: 200
      response:
        first:
          title: Java
          capacity: 2
          registered: 2
          remainingSeats: 0
        second:
          title: OOP
          capacity: 1
          registered: 1
          remainingSeats: 0
        independentCopy:
          title: OOP
          capacity: 1
          registered: 0
          remainingSeats: 1
        aliasIsSecond: true
        copyIsSecond: false
        acceptedFirst: 2
        rejectedFirst: 1
        acceptedViaAlias: 1
        rejectedViaAlias: 1
        sharedStaticMaxCapacity: 50
      detailDescription: '<p><code>first</code> accepts 2 of 3 registrations. <code>alias</code> refers to <code>second</code>, accepting 1 of 2 attempts. <code>independentCopy</code>
        is a new instance and remains at <code>registered=0</code>.</p>

        <p><code>aliasIsSecond=true</code>, <code>copyIsSecond=false</code>, and <code>MAX_CAPACITY=50</code> is a class constant rather than a shared registration
        counter.</p>'
    - id: case_002
      title: Reject excessive registration attempts
      description: firstAttempts=51 exceeds the 0–50 limit.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          firstTitle: Java
          firstCapacity: 2
          secondTitle: OOP
          secondCapacity: 1
          firstAttempts: 51
          aliasAttempts: 0
      status: 400
      response:
        error: firstAttempts must be between 0 and 50
      detailDescription: <p><code>checkedAttempts</code> rejects firstAttempts=51 before constructing workshops, so HTTP 400 includes the 0–50 bound message.</p>
    - id: case_003
      title: Reject zero workshop capacity
      description: Workshop constructor rejects capacity=0.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          firstTitle: Java
          firstCapacity: 0
          secondTitle: OOP
          secondCapacity: 1
          firstAttempts: 1
          aliasAttempts: 0
      status: 400
      response:
        error: capacity must be between 1 and 50
      detailDescription: <p><code>new Workshop</code> rejects capacity=0 as the required range is 1–50, and the exception handler returns HTTP 400.</p>
  bank(BankRequest):
    methodName: bank
    httpMethods:
    - POST
    mappingPaths:
    - /oop/classes/bank/experiment
    usage: true
    cases:
    - id: case_001
      title: Transfer, reject overdraft, then deposit
      description: Source starts at 100 and destination 10; transfer 50, withdraw 80, deposit 5.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          source:
            accountNumber: ACC100
            holderName: A
            openingBalanceVnd: 100
          destination:
            accountNumber: ACC200
            holderName: B
            openingBalanceVnd: 10
          actions:
          - type: transfer
            amountVnd: 50
          - type: withdraw
            amountVnd: 80
          - type: deposit
            amountVnd: 5
      status: 200
      response:
        initialSource:
          accountNumber: ACC100
          holderName: A
          balanceVnd: 100
        initialDestination:
          accountNumber: ACC200
          holderName: B
          balanceVnd: 10
        steps:
        - index: 1
          type: transfer
          accepted: true
          detail: completed
          sourceBefore:
            accountNumber: ACC100
            holderName: A
            balanceVnd: 100
          destinationBefore:
            accountNumber: ACC200
            holderName: B
            balanceVnd: 10
          sourceAfter:
            accountNumber: ACC100
            holderName: A
            balanceVnd: 50
          destinationAfter:
            accountNumber: ACC200
            holderName: B
            balanceVnd: 60
        - index: 2
          type: withdraw
          accepted: false
          detail: insufficient funds
          sourceBefore:
            accountNumber: ACC100
            holderName: A
            balanceVnd: 50
          destinationBefore:
            accountNumber: ACC200
            holderName: B
            balanceVnd: 60
          sourceAfter:
            accountNumber: ACC100
            holderName: A
            balanceVnd: 50
          destinationAfter:
            accountNumber: ACC200
            holderName: B
            balanceVnd: 60
        - index: 3
          type: deposit
          accepted: true
          detail: completed
          sourceBefore:
            accountNumber: ACC100
            holderName: A
            balanceVnd: 50
          destinationBefore:
            accountNumber: ACC200
            holderName: B
            balanceVnd: 60
          sourceAfter:
            accountNumber: ACC100
            holderName: A
            balanceVnd: 55
          destinationAfter:
            accountNumber: ACC200
            holderName: B
            balanceVnd: 60
        finalSource:
          accountNumber: ACC100
          holderName: A
          balanceVnd: 55
        finalDestination:
          accountNumber: ACC200
          holderName: B
          balanceVnd: 60
        scope: IN_MEMORY_SINGLE_REQUEST_SINGLE_THREAD_NOT_REAL_BANKING
      detailDescription: '<p>A transfer of 50 leaves source at 50 and destination at 60. Withdrawing 80 fails and step 2 preserves both balances. A subsequent deposit
        of five leaves source at 55.</p>

        <p>The withdrawal error is caught inside the loop, so the API returns HTTP 200. Its scope states that there are no real bank transactions.</p>'
    - id: case_002
      title: Reject zero deposit inside a step
      description: deposit(0) is an action-level failure represented in steps.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          source:
            accountNumber: ACC100
            holderName: A
            openingBalanceVnd: 100
          destination:
            accountNumber: ACC200
            holderName: B
            openingBalanceVnd: 10
          actions:
          - type: deposit
            amountVnd: 0
      status: 200
      response:
        initialSource:
          accountNumber: ACC100
          holderName: A
          balanceVnd: 100
        initialDestination:
          accountNumber: ACC200
          holderName: B
          balanceVnd: 10
        steps:
        - index: 1
          type: deposit
          accepted: false
          detail: amountVnd must be positive
          sourceBefore:
            accountNumber: ACC100
            holderName: A
            balanceVnd: 100
          destinationBefore:
            accountNumber: ACC200
            holderName: B
            balanceVnd: 10
          sourceAfter:
            accountNumber: ACC100
            holderName: A
            balanceVnd: 100
          destinationAfter:
            accountNumber: ACC200
            holderName: B
            balanceVnd: 10
        finalSource:
          accountNumber: ACC100
          holderName: A
          balanceVnd: 100
        finalDestination:
          accountNumber: ACC200
          holderName: B
          balanceVnd: 10
        scope: IN_MEMORY_SINGLE_REQUEST_SINGLE_THREAD_NOT_REAL_BANKING
      detailDescription: <p><code>deposit(0)</code> triggers <code>IllegalArgumentException</code> from <code>requirePositive</code>. The service records accepted=false
        with unchanged balances 100 and 10, returning HTTP 200.</p>
    - id: case_003
      title: Reject duplicate account numbers
      description: Both accounts use accountNumber ACC100.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          source:
            accountNumber: ACC100
            holderName: A
            openingBalanceVnd: 100
          destination:
            accountNumber: ACC100
            holderName: B
            openingBalanceVnd: 10
          actions:
          - type: transfer
            amountVnd: 5
      status: 400
      response:
        error: source and destination must use distinct accountNumbers
      detailDescription: <p>Two distinct objects nonetheless contain accountNumber ACC100. The service compares identifiers before processing any actions and throws
        <code>IllegalArgumentException</code>, mapped to HTTP 400.</p>
    - id: case_004
      title: Reject an unsupported bank action
      description: Type refund is not deposit/withdraw/transfer.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          source:
            accountNumber: ACC100
            holderName: A
            openingBalanceVnd: 100
          destination:
            accountNumber: ACC200
            holderName: B
            openingBalanceVnd: 10
          actions:
          - type: refund
            amountVnd: 5
      status: 400
      response:
        error: each bank action needs type (deposit/withdraw/transfer) and amountVnd
      detailDescription: <p>The service validates action types before constructing accounts. <code>refund</code> is unsupported and produces HTTP 400 with <code>ErrorResult.error</code>.</p>
ClassDesignExperimentsController:
  library(LibraryRequest):
    methodName: library
    httpMethods:
    - POST
    mappingPaths:
    - /oop/class-design/library/experiment
    usage: true
    cases:
    - id: case_001
      title: Borrow, query, reject duplicate loan, return overdue
      description: Four actions contrast side-effect-free queries, domain commands and late-fee calculation.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          maxActiveLoans: 1
          loanDays: 14
          copies:
          - copyId: C-1
            title: Effective Java
          actions:
          - type: BORROW
            borrowerId: M-1
            copyId: C-1
            onDate: '2026-10-20'
          - type: QUERY
            borrowerId: null
            copyId: null
            onDate: null
          - type: BORROW
            borrowerId: M-2
            copyId: C-1
            onDate: '2026-10-21'
          - type: RETURN
            borrowerId: null
            copyId: C-1
            onDate: '2026-11-05'
      status: 200
      response:
        steps:
        - index: 1
          action: BORROW
          accepted: true
          outcome: BORROWED
          loans:
          - &id001
            borrowerId: M-1
            copyId: C-1
            title: Effective Java
            borrowedOn: '2026-10-20'
            dueOn: '2026-11-03'
            returnedOn: null
            lateFeeCents: 0
        - index: 2
          action: QUERY
          accepted: true
          outcome: QUERY_ONLY
          loans:
          - *id001
        - index: 3
          action: BORROW
          accepted: false
          outcome: COPY_ALREADY_BORROWED
          loans:
          - *id001
        - index: 4
          action: RETURN
          accepted: true
          outcome: RETURNED
          loans:
          - &id002
            borrowerId: M-1
            copyId: C-1
            title: Effective Java
            borrowedOn: '2026-10-20'
            dueOn: '2026-11-03'
            returnedOn: '2026-11-05'
            lateFeeCents: 200
        finalLoans:
        - *id002
      detailDescription: '<p><code>LoanPolicy.dueOn()</code> adds 14 days to 2026-10-20, giving 2026-11-03. QUERY leaves the loan snapshot unchanged. M-2 cannot borrow
        already-active C-1: <code>InMemoryLoanRegistry.save()</code> throws <code>COPY_ALREADY_BORROWED</code>, which the service captures as a rejected step within
        HTTP 200. Returning on 2026-11-05 is two days late; <code>Loan.returnOn()</code> charges 2 × 100 = 200 cents and records returnedOn.</p>'
    - id: case_002
      title: Per-borrower borrowing limit stays enforced
      description: The existence of an unused copy B does not override M-1's one-active-loan limit.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          maxActiveLoans: 1
          loanDays: 14
          copies:
          - copyId: A
            title: Java
          - copyId: B
            title: OOP
          actions:
          - type: BORROW
            borrowerId: M-1
            copyId: A
            onDate: '2026-10-20'
          - type: BORROW
            borrowerId: M-1
            copyId: B
            onDate: '2026-10-21'
          - type: QUERY
            borrowerId: null
            copyId: null
            onDate: null
      status: 200
      response:
        steps:
        - index: 1
          action: BORROW
          accepted: true
          outcome: BORROWED
          loans:
          - &id003
            borrowerId: M-1
            copyId: A
            title: Java
            borrowedOn: '2026-10-20'
            dueOn: '2026-11-03'
            returnedOn: null
            lateFeeCents: 0
        - index: 2
          action: BORROW
          accepted: false
          outcome: BORROWER_LIMIT_REACHED
          loans:
          - *id003
        - index: 3
          action: QUERY
          accepted: true
          outcome: QUERY_ONLY
          loans:
          - *id003
        finalLoans:
        - *id003
      detailDescription: <p><code>InMemoryLoanRegistry.activeCount(&quot;M-1&quot;)</code> becomes 1 after borrowing A. With <code>maxActiveLoans=1</code>, <code>LoanPolicy.ensureEligible()</code>
        throws <code>BORROWER_LIMIT_REACHED</code> before B is borrowed. The service records the rejected second step; QUERY still sees only A, demonstrating a non-mutating
        query.</p>
    - id: case_003
      title: Reject duplicated copy IDs during initialization
      description: Repository registration enforces copy identity before any loan action.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          maxActiveLoans: 1
          loanDays: 14
          copies:
          - copyId: A
            title: Java
          - copyId: A
            title: Other
          actions:
          - type: QUERY
            borrowerId: null
            copyId: null
            onDate: null
      status: 400
      response:
        error: 'Duplicate copyId: A'
      detailDescription: '<p><code>InMemoryLoanRegistry.register()</code> uses <code>putIfAbsent()</code> for each BookCopy. The second copy ID A triggers <code>IllegalArgumentException(&quot;Duplicate
        copyId: A&quot;)</code> before the action loop; the handler returns HTTP 400 rather than a LibraryResult.</p>'
    - id: case_004
      title: DELETE_ALL is not a supported operation
      description: The API recognizes only BORROW, RETURN and QUERY actions.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          maxActiveLoans: 1
          loanDays: 14
          copies:
          - copyId: A
            title: Java
          actions:
          - type: DELETE_ALL
            borrowerId: null
            copyId: null
            onDate: null
      status: 400
      response:
        error: 'Unsupported action: DELETE_ALL'
      detailDescription: <p>After validating a nonblank action type, the service switches on exactly <code>BORROW</code>, <code>RETURN</code> and <code>QUERY</code>.
        <code>DELETE_ALL</code> throws <code>IllegalArgumentException</code>, which is not caught by the per-step <code>IllegalStateException</code> handler, producing
        HTTP 400.</p>
    - id: case_005
      title: Unknown copy ID cannot be borrowed
      description: The registry validates that referenced copies are registered before the loan policy is checked.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          maxActiveLoans: 1
          loanDays: 14
          copies:
          - copyId: A
            title: Java
          actions:
          - type: BORROW
            borrowerId: M
            copyId: UNKNOWN
            onDate: '2026-10-20'
      status: 400
      response:
        error: 'Unknown copyId: UNKNOWN'
      detailDescription: <p><code>LibraryScenarioService.run()</code> calls <code>repository.requireCopy(&quot;UNKNOWN&quot;)</code> before applying the borrower
        limit. The absent copy makes the registry throw <code>IllegalArgumentException</code>, mapped to HTTP 400 rather than a rejected step.</p>
  checkout(CheckoutRequest):
    methodName: checkout
    httpMethods:
    - POST
    mappingPaths:
    - /oop/class-design/checkout/experiment
    usage: true
    cases:
    - id: case_001
      title: Checkout two products and queue a receipt event
      description: Compute a 28000-cent subtotal and a 10% discount, then record the outbound receipt intent.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: ORD-1
          receiptAddress: reader@example.org
          discountPercent: 10
          lines: &id004
          - sku: JAVA
            quantity: 2
            unitPriceCents: 12500
          - sku: PEN
            quantity: 1
            unitPriceCents: 3000
      status: 200
      response:
        orderId: ORD-1
        subtotalCents: 28000
        discountCents: 2800
        totalCents: 25200
        persistedLines: *id004
        receiptOutbox:
        - orderId: ORD-1
          destination: reader@example.org
          amountCents: 25200
      detailDescription: <p><code>ShoppingCart</code> computes 2 × 12500 + 1 × 3000 = 28000 cents. A 10% discount is 2800, leaving 25200. <code>CheckedOutOrder</code>
        holds an immutable snapshot of two lines, the in-memory repository stores it for this request, and the outbox queues one <code>ReceiptEvent</code> for reader@example.org
        amounting to 25200. Enqueueing does not send an email.</p>
    - id: case_002
      title: Integer-cent discount truncates fractions
      description: A 3003-cent subtotal demonstrates division and remainder rather than floating-point rounding.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: O-7
          receiptAddress: a@example.org
          discountPercent: 25
          lines: &id005
          - sku: JAVA
            quantity: 3
            unitPriceCents: 1001
      status: 200
      response:
        orderId: O-7
        subtotalCents: 3003
        discountCents: 750
        totalCents: 2253
        persistedLines: *id005
        receiptOutbox:
        - orderId: O-7
          destination: a@example.org
          amountCents: 2253
      detailDescription: <p>The subtotal is 3 × 1001 = 3003 cents. The service computes <code>(3003 / 100) × 25 + (3003 % 100) × 25 / 100</code>, or 30 × 25 + 3 ×
        25 / 100 = 750 cents with integer division. The persisted order and receipt event contain total 2253; no fractional cent is rounded up.</p>
    - id: case_003
      title: Reject discounts greater than 100%
      description: The service validates discountPercent before constructing the cart.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: O
          receiptAddress: a@b
          discountPercent: 101
          lines:
          - sku: A
            quantity: 1
            unitPriceCents: 100
      status: 400
      response:
        error: Invalid checkout input
      detailDescription: <p><code>CheckoutScenarioService.checkout()</code> restricts <code>discountPercent</code> to 0..100 alongside required fields. Value 101
        throws <code>IllegalArgumentException(&quot;Invalid checkout input&quot;)</code> before creating the ShoppingCart or repository, so the handler returns HTTP
        400.</p>
    - id: case_004
      title: Reject a cart line with zero quantity
      description: The CartLine value object validates its invariant at construction.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: O
          receiptAddress: a@b
          discountPercent: 0
          lines:
          - sku: A
            quantity: 0
            unitPriceCents: 100
      status: 400
      response:
        error: Invalid cart line
      detailDescription: <p>Top-level checkout fields pass validation, but <code>new CartLine(&quot;A&quot;,0,100)</code> violates the 1–10000 quantity range and
        throws <code>IllegalArgumentException(&quot;Invalid cart line&quot;)</code>. The service stops before totals or the receipt outbox, returning HTTP 400.</p>
    - id: case_005
      title: Reject overflowing line subtotal
      description: Exact integer arithmetic guards monetary values before storing the order.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: O
          receiptAddress: a@b
          discountPercent: 0
          lines:
          - sku: A
            quantity: 2
            unitPriceCents: 9223372036854775807
      status: 400
      response:
        error: long overflow
      detailDescription: <p><code>CartLine</code> invokes <code>Math.multiplyExact(2, Long.MAX_VALUE)</code> during construction. It overflows and throws <code>ArithmeticException(&quot;long
        overflow&quot;)</code>, mapped to HTTP 400; no order or outbox event has been created.</p>
  transfer(TransferRequest):
    methodName: transfer
    httpMethods:
    - POST
    mappingPaths:
    - /oop/class-design/transfers/experiment
    usage: true
    cases:
    - id: case_001
      title: Transfer 2500 cents while preserving total balance
      description: BankAccount owns the command and Money enforces same-currency arithmetic.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          fromAccountId: A
          toAccountId: B
          currency: USD
          fromBalanceCents: 10000
          toBalanceCents: 5000
          amountCents: 2500
      status: 200
      response:
        fromAccountId: A
        toAccountId: B
        currency: USD
        fromBeforeCents: 10000
        toBeforeCents: 5000
        fromAfterCents: 7500
        toAfterCents: 7500
      detailDescription: <p><code>TransferScenarioService</code> creates A=10000 and B=5000 cents in USD Money. <code>BankAccount.transferTo()</code> calculates the
        new values 7500 and 7500 before assigning both accounts. <code>TransferResult</code> shows before/after, with total still 15000 cents; initial <code>balance()</code>
        reads are non-mutating queries.</p>
    - id: case_002
      title: Insufficient funds produce HTTP 409
      description: The domain rejects overdrafts before either account can be modified.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          fromAccountId: A
          toAccountId: B
          currency: USD
          fromBalanceCents: 100
          toBalanceCents: 200
          amountCents: 101
      status: 409
      response:
        error: INSUFFICIENT_FUNDS
      detailDescription: <p><code>Money.minus()</code> computes the prospective debit before any field is assigned. Amount 101 exceeds balance 100 and raises <code>IllegalStateException(&quot;INSUFFICIENT_FUNDS&quot;)</code>.
        The chapter-specific handler maps it to HTTP 409, not HTTP 400.</p>
    - id: case_003
      title: Cannot transfer between accounts with the same identity
      description: The entity checks account identity before any balance arithmetic.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          fromAccountId: A
          toAccountId: A
          currency: USD
          fromBalanceCents: 100
          toBalanceCents: 200
          amountCents: 10
      status: 400
      response:
        error: Cannot transfer to same account
      detailDescription: <p>The service creates two separate <code>BankAccount</code> instances that share ID A. <code>BankAccount.transferTo()</code> checks <code>id.equals(recipient.id)</code>
        as well as reference identity, throwing <code>IllegalArgumentException</code> with <code>Cannot transfer to same account</code>. The handler returns HTTP
        400.</p>
    - id: case_004
      title: Recipient balance overflow is rejected
      description: Both prospective balances are calculated before committing either one.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          fromAccountId: A
          toAccountId: B
          currency: USD
          fromBalanceCents: 100
          toBalanceCents: 9223372036854775807
          amountCents: 1
      status: 400
      response:
        error: long overflow
      detailDescription: <p>The sender's prospective debit of 99 exists only as a local value. <code>recipient.balance.plus(amount)</code> calls <code>Math.addExact(Long.MAX_VALUE,1)</code>,
        throwing <code>ArithmeticException(&quot;long overflow&quot;)</code> before either assignment. The handler returns HTTP 400, without a partial transfer.</p>
    - id: case_005
      title: Zero transfer amount is not a valid command
      description: Money can represent a zero balance, but the transfer intention must be positive.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          fromAccountId: A
          toAccountId: B
          currency: USD
          fromBalanceCents: 100
          toBalanceCents: 200
          amountCents: 0
      status: 400
      response:
        error: Transfer amount must be positive
      detailDescription: <p><code>Money</code> permits zero as a stored value, but <code>BankAccount.transferTo()</code> rejects <code>amount.cents()==0</code> via
        <code>IllegalArgumentException</code>. The handler returns HTTP 400 rather than a successful unchanged-balance TransferResult.</p>
CompositionExperimentController:
  notification(NotificationRequest):
    methodName: notification
    httpMethods:
    - POST
    mappingPaths:
    - /oop/composition/notifications
    usage: true
    cases:
    - id: case_001
      title: FULL notification is audited after mock delivery
      description: The formatter creates content and successful transport enables the audit decorator.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORD1
          recipient: student@example.test
          totalCents: 1500
          format: FULL
          channel: EMAIL
          audited: true
          failTransport: false
      status: 200
      response:
        channel: EMAIL
        content: Order ORD1 paid 1500 cents
        accepted: true
        failure: null
        trace:
        - format:Order ORD1 paid 1500 cents
        - transport:EMAIL:student@example.test:Order ORD1 paid 1500 cents
        - audit:accepted
      detailDescription: <p><code>FullFormatter</code> creates <code>Order ORD1 paid 1500 cents</code>; <code>Notifier</code> records <code>format:</code>, then <code>RecordingTransport</code>
        records <code>transport:EMAIL:...</code>. Since failTransport=false, <code>AuditedTransport</code> records <code>audit:accepted</code> only after the delegate
        succeeds. HTTP 200 includes accepted=true and three trace events, without sending a real email.</p>
    - id: case_002
      title: Transport rejection does not claim successful audit
      description: The simulated send failure is returned as accepted=false within HTTP 200.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORD1
          recipient: user@example.test
          totalCents: 100
          format: COMPACT
          channel: EMAIL
          audited: true
          failTransport: true
      status: 200
      response:
        channel: EMAIL
        content: ORD1:PAID:100
        accepted: false
        failure: Simulated transport rejection
        trace:
        - format:ORD1:PAID:100
        - transport:EMAIL:user@example.test:ORD1:PAID:100
      detailDescription: <p><code>CompactFormatter</code> produces <code>ORD1:PAID:100</code>. <code>RecordingTransport.send</code> records the transport event before
        throwing <code>IllegalStateException(&quot;Simulated transport rejection&quot;)</code>. <code>Notifier</code> catches the failure and returns accepted=false
        with the message. The audit decorator never appends <code>audit:accepted</code>; trace has two events.</p>
    - id: case_003
      title: Empty recipient is rejected before collaborator setup
      description: requireId validates recipient before building formatter or transport.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORD
          recipient: ''
          totalCents: 10
          format: FULL
          channel: SMS
          audited: false
          failTransport: false
      status: 400
      response:
        code: INVALID_INPUT
        message: recipient must be 1-60 ASCII letters/digits or _ @ . -
      detailDescription: <p><code>CompositionExperimentService.notification</code> calls <code>requireId(request.recipient(), &quot;recipient&quot;)</code>. The empty
        string fails the 1?60 ASCII identifier pattern and throws <code>IllegalArgumentException</code> before creating any collaborator or trace. The controller
        advice returns HTTP 400 <code>INVALID_INPUT</code> with the original message.</p>
  policies(PolicyRequest):
    methodName: policies
    httpMethods:
    - POST
    mappingPaths:
    - /oop/composition/policies
    usage: true
    cases:
    - id: case_001
      title: Switch active policy with a per-call override
      description: QUOTE_WITH_POLICY temporarily uses FIXED without changing active PERCENT.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          initialPolicy: NONE
          steps:
          - action: SWITCH
            policy: PERCENT
            percent: 10
          - action: QUOTE
            subtotalCents: 100
          - action: QUOTE_WITH_POLICY
            policy: FIXED
            discountCents: 30
            subtotalCents: 100
          - action: QUOTE
            subtotalCents: 100
      status: 200
      response:
        initialPolicy: NONE
        finalPolicy: PERCENT
        timeline:
        - step: 1
          action: SWITCH
          activePolicy: PERCENT
          usedPolicy: null
          subtotalCents: null
          payableCents: null
        - step: 2
          action: QUOTE
          activePolicy: PERCENT
          usedPolicy: PERCENT
          subtotalCents: 100
          payableCents: 90
        - step: 3
          action: QUOTE_WITH_POLICY
          activePolicy: PERCENT
          usedPolicy: FIXED
          subtotalCents: 100
          payableCents: 70
        - step: 4
          action: QUOTE
          activePolicy: PERCENT
          usedPolicy: PERCENT
          subtotalCents: 100
          payableCents: 90
      detailDescription: <p><code>SWITCH</code> makes PERCENT 10% active. <code>QUOTE</code> of subtotal 100 yields 90. <code>QUOTE_WITH_POLICY</code> passes <code>FixedDiscount(30)</code>
        into <code>quoteWith</code>, yielding 70 while <code>AtomicReference</code> still contains PERCENT. The final QUOTE yields 90; SWITCH has null usedPolicy,
        subtotalCents and payableCents.</p>
    - id: case_002
      title: Fixed discount is capped by the subtotal
      description: FixedDiscount uses min(discount,subtotal), preventing a negative payable amount.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          initialPolicy: FIXED
          initialDiscountCents: 40
          steps:
          - action: QUOTE
            subtotalCents: 30
      status: 200
      response:
        initialPolicy: FIXED
        finalPolicy: FIXED
        timeline:
        - step: 1
          action: QUOTE
          activePolicy: FIXED
          usedPolicy: FIXED
          subtotalCents: 30
          payableCents: 0
      detailDescription: <p><code>FixedDiscount(40)</code> receives subtotal 30. Its <code>payable</code> computes <code>30 - Math.min(40,30) = 0</code>, satisfying
        the zero-to-subtotal contract. Without SWITCH, both initialPolicy and finalPolicy stay FIXED. HTTP 200 has one quote step.</p>
    - id: case_003
      title: Invalid percent is rejected during prevalidation
      description: The service validates every step before mutating the active policy.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          initialPolicy: NONE
          steps:
          - action: SWITCH
            policy: PERCENT
            percent: 150
      status: 400
      response:
        code: INVALID_INPUT
        message: percent must be 0-100
      detailDescription: <p>The service creates initial NONE, then checks SWITCH using <code>SwitchablePricing.create</code> before the execution loop. The <code>PercentDiscount</code>
        constructor rejects 150 with <code>IllegalArgumentException(&quot;percent must be 0-100&quot;)</code>. HTTP 400 returns <code>INVALID_INPUT</code> and no
        timeline.</p>
  placeOrder(PlaceOrderRequest):
    methodName: placeOrder
    httpMethods:
    - POST
    mappingPaths:
    - /oop/composition/orders
    usage: true
    cases:
    - id: case_001
      title: Order is stored once in the in-memory repository
      description: OrderService delegates a single save and captures immutable line data.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORDER7
          lines:
          - sku: BOOK
            quantity: 2
            unitPriceCents: 300
          - sku: PEN
            quantity: 1
            unitPriceCents: 10
          failStorage: false
      status: 200
      response:
        accepted: true
        failure: null
        saveAttempts: 1
        storedOrders:
        - orderId: ORDER7
          totalCents: 610
          lines:
          - sku: BOOK
            quantity: 2
            unitPriceCents: 300
          - sku: PEN
            quantity: 1
            unitPriceCents: 10
        storageDurability: IN_MEMORY_ONLY; no durable persistence or transaction implied
      detailDescription: <p>Two valid <code>OrderPlacement.Line</code> subtotals are 2?300=600 and 1?10=10. <code>Order.create</code> totals 610 and copies lines
        using <code>List.copyOf</code>. <code>OrderService</code> delegates <code>save</code> to <code>InMemoryOrderRepository</code>, incrementing attempts to one
        and storing one order. HTTP 200 returns accepted=true, but data lives only within this request.</p>
    - id: case_002
      title: Repository rejection does not persist an order
      description: There is one save attempt but storedOrders stays empty.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORD2
          lines:
          - sku: A
            quantity: 2
            unitPriceCents: 5
          failStorage: true
      status: 200
      response:
        accepted: false
        failure: Simulated repository failure before save
        saveAttempts: 1
        storedOrders: []
        storageDurability: IN_MEMORY_ONLY; no durable persistence or transaction implied
      detailDescription: <p>The order is valid with subtotal 10. <code>InMemoryOrderRepository.save</code> increments <code>saveAttempts</code> to 1 before failStorage=true
        triggers <code>IllegalStateException(&quot;Simulated repository failure before save&quot;)</code>. The service catches it and returns HTTP 200 accepted=false,
        with no stored orders or false success claim.</p>
    - id: case_003
      title: Zero quantity is rejected before storage
      description: OrderPlacement.Line validates quantity before a repository is created.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: X
          lines:
          - sku: A
            quantity: 0
            unitPriceCents: 5
          failStorage: false
      status: 400
      response:
        code: INVALID_INPUT
        message: quantity must be 1-1000
      detailDescription: <p>The service loops through lines and constructs <code>OrderPlacement.Line(&quot;A&quot;,0,5)</code>. The record constructor rejects quantity
        below one with <code>IllegalArgumentException(&quot;quantity must be 1-1000&quot;)</code>. No repository or save attempt exists; the handler returns HTTP
        400 <code>INVALID_INPUT</code>.</p>
  resources(ResourceRequest):
    methodName: resources
    httpMethods:
    - POST
    mappingPaths:
    - /oop/composition/resources
    usage: true
    cases:
    - id: case_001
      title: Owned handle closes even when writing fails
      description: The exporter owns its handle and try-with-resources closes both.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          ownership: OWNED
          content: hello
          failWrite: true
      status: 200
      response:
        ownership: OWNED
        exporterClosed: true
        resourceClosedAfterExporter: true
        resourceClosedAfterCaller: true
        failure: Simulated write failure
        trace:
        - handle:open
        - exporter:created
        - handle:write:hello
        - exporter:close
        - handle:close
      detailDescription: <p><code>TrackedHandle.write</code> logs <code>handle:write:hello</code> then throws <code>IllegalStateException(&quot;Simulated write failure&quot;)</code>.
        At scope exit, <code>Exporter.close</code> logs exporter closure and invokes <code>handle.close</code> because ownsHandle=true. The service returns the simulated
        write failure in HTTP 200 and both afterExporter/afterCaller flags are true.</p>
    - id: case_002
      title: Borrowed handle remains open until the caller closes it
      description: Closing the exporter does not close a borrowed handle.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          ownership: BORROWED
          content: OK
          failWrite: false
      status: 200
      response:
        ownership: BORROWED
        exporterClosed: true
        resourceClosedAfterExporter: false
        resourceClosedAfterCaller: true
        failure: null
        trace:
        - handle:open
        - exporter:created
        - handle:write:OK
        - exporter:close
        - handle:close
      detailDescription: <p><code>Exporter</code> is constructed with ownsHandle=false, so <code>close()</code> only logs <code>exporter:close</code>. At the after-exporter
        checkpoint, handle.closed() is false. The service acts as caller and invokes <code>handle.close()</code>, making resourceClosedAfterCaller true with no failure.</p>
    - id: case_003
      title: Empty content is rejected before handle allocation
      description: The service requires nonblank content of at most 100 characters.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          ownership: OWNED
          content: ''
          failWrite: false
      status: 400
      response:
        code: INVALID_INPUT
        message: content must be nonblank and at most 100 characters
      detailDescription: <p><code>CompositionExperimentService.resource</code> checks <code>content.isBlank()</code>, detects the empty string and throws <code>IllegalArgumentException</code>
        before allocating <code>TrackedHandle</code>. The handler returns HTTP 400 <code>INVALID_INPUT</code>, with no trace or closing operation.</p>
DesignPatternExperimentController:
  pricing(PricingRequest):
    methodName: pricing
    httpMethods:
    - POST
    mappingPaths:
    - /oop/design-patterns/pricing/experiment
    usage: true
    cases:
    - id: case_001
      title: Apply a 5% discount before delivery
      description: Compare 115000 VND when discounting first with 114000 VND when the fee is included first.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          subtotalVnd: 100000
          deliveryFeeVnd: 20000
          strategy: MEMBER_5
          order: DISCOUNT_THEN_FEE
      status: 200
      response:
        strategy: MEMBER_5
        subtotalVnd: 100000
        deliveryFeeVnd: 20000
        selected: &id006
          order: DISCOUNT_THEN_FEE
          payableVnd: 115000
          discountVnd: 5000
          executionTrace:
          - BASE:100000
          - DISCOUNT_MEMBER_5:5000
          - DELIVERY:20000
        allOrders:
        - *id006
        - order: FEE_THEN_DISCOUNT
          payableVnd: 114000
          discountVnd: 6000
          executionTrace:
          - BASE:100000
          - DELIVERY:20000
          - DISCOUNT_MEMBER_5:6000
        scope: REQUEST_LOCAL_IN_MEMORY_NO_EXTERNAL_SIDE_EFFECTS
      detailDescription: <p><code>DiscountDecorator</code> takes 5% off 100000, leaving 95000; <code>DeliveryDecorator</code> adds 20000 for selected payable 115000
        and discount 5000. Reversing wrappers discounts the full 120000 by 6000, yielding 114000. Each <code>executionTrace</code> records the actual order; both
        appear in <code>allOrders</code>.</p>
    - id: case_002
      title: Discount after adding the delivery fee
      description: The same subtotal, fee and Strategy yield a different selected result under reverse Decorator composition.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          subtotalVnd: 100000
          deliveryFeeVnd: 20000
          strategy: MEMBER_5
          order: FEE_THEN_DISCOUNT
      status: 200
      response:
        strategy: MEMBER_5
        subtotalVnd: 100000
        deliveryFeeVnd: 20000
        selected: &id007
          order: FEE_THEN_DISCOUNT
          payableVnd: 114000
          discountVnd: 6000
          executionTrace:
          - BASE:100000
          - DELIVERY:20000
          - DISCOUNT_MEMBER_5:6000
        allOrders:
        - order: DISCOUNT_THEN_FEE
          payableVnd: 115000
          discountVnd: 5000
          executionTrace:
          - BASE:100000
          - DISCOUNT_MEMBER_5:5000
          - DELIVERY:20000
        - *id007
        scope: REQUEST_LOCAL_IN_MEMORY_NO_EXTERNAL_SIDE_EFFECTS
      detailDescription: <p><code>DeliveryDecorator</code> first adds 20000 to 100000 for 120000. MEMBER_5 then removes 6000, giving 114000. <code>selected</code>
        is the second <code>allOrders</code> element; the first remains discount-first at 115000 with a 5000 discount.</p>
    - id: case_003
      title: A 30000 voucher behaves differently under each wrapper order
      description: The voucher is capped by the amount being discounted, so fee-first produces zero payable.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          subtotalVnd: 20000
          deliveryFeeVnd: 10000
          strategy: VOUCHER_30000
          order: FEE_THEN_DISCOUNT
      status: 200
      response:
        strategy: VOUCHER_30000
        subtotalVnd: 20000
        deliveryFeeVnd: 10000
        selected: &id008
          order: FEE_THEN_DISCOUNT
          payableVnd: 0
          discountVnd: 30000
          executionTrace:
          - BASE:20000
          - DELIVERY:10000
          - DISCOUNT_VOUCHER_30000:30000
        allOrders:
        - order: DISCOUNT_THEN_FEE
          payableVnd: 10000
          discountVnd: 20000
          executionTrace:
          - BASE:20000
          - DISCOUNT_VOUCHER_30000:20000
          - DELIVERY:10000
        - *id008
        scope: REQUEST_LOCAL_IN_MEMORY_NO_EXTERNAL_SIDE_EFFECTS
      detailDescription: <p><code>VoucherDiscount</code> uses <code>min(30000, amount)</code>. Discounting subtotal 20000 first removes 20000 then adds fee 10000,
        for payable 10000. Including the fee first gives 30000 and the voucher removes all 30000, yielding zero. <code>allOrders</code> exposes both and selects FEE_THEN_DISCOUNT.</p>
    - id: case_004
      title: HALF_UP rounding for a 5% membership discount
      description: One VND is discounted from twenty, illustrating deterministic integer arithmetic.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          subtotalVnd: 20
          deliveryFeeVnd: 0
          strategy: MEMBER_5
          order: DISCOUNT_THEN_FEE
      status: 200
      response:
        strategy: MEMBER_5
        subtotalVnd: 20
        deliveryFeeVnd: 0
        selected: &id009
          order: DISCOUNT_THEN_FEE
          payableVnd: 19
          discountVnd: 1
          executionTrace:
          - BASE:20
          - DISCOUNT_MEMBER_5:1
          - DELIVERY:0
        allOrders:
        - *id009
        - order: FEE_THEN_DISCOUNT
          payableVnd: 19
          discountVnd: 1
          executionTrace:
          - BASE:20
          - DELIVERY:0
          - DISCOUNT_MEMBER_5:1
        scope: REQUEST_LOCAL_IN_MEMORY_NO_EXTERNAL_SIDE_EFFECTS
      detailDescription: <p><code>MemberDiscount.discount()</code> evaluates <code>(20 × 5 + 50) / 100 = 1</code> using integer VND arithmetic. With a zero delivery
        fee both orders return 19 payable and 1 discount, although their trace order differs. This verifies whole-VND HALF_UP rounding.</p>
    - id: case_005
      title: Reject a negative subtotal
      description: PricingPipeline validates price bounds before constructing a Strategy or decorator chain.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          subtotalVnd: -1
          deliveryFeeVnd: 0
          strategy: NONE
          order: DISCOUNT_THEN_FEE
      status: 400
      response:
        error: subtotalVnd must be 0..1000000000000
      detailDescription: <p><code>PricingPipeline.calculate()</code> checks that subtotal is nonnegative before selecting a Strategy or creating decorators. Value
        -1 throws <code>IllegalArgumentException</code>, mapped to HTTP 400 with the original message.</p>
    - id: case_006
      title: Reject an unsupported UNKNOWN Strategy
      description: The pipeline supports only its three declared discount implementations.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          subtotalVnd: 100
          deliveryFeeVnd: 0
          strategy: UNKNOWN
          order: DISCOUNT_THEN_FEE
      status: 400
      response:
        error: strategy must be NONE/MEMBER_5/VOUCHER_30000
      detailDescription: <p><code>PricingPipeline</code> switches among <code>NoDiscount</code>, <code>MemberDiscount</code> and <code>VoucherDiscount</code>. UNKNOWN
        falls into the default exception branch and yields HTTP 400 without a PricingResult.</p>
  tasks(TasksRequest):
    methodName: tasks
    httpMethods:
    - POST
    mappingPaths:
    - /oop/design-patterns/tasks/experiment
    usage: true
    cases:
    - id: case_001
      title: ADD, COMPLETE, UNDO and REDO after unsubscribe
      description: Undo and redo a command; AUDIT continues to receive events after NOTIFY unsubscribes.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          actions:
          - type: ADD
            id: T-1
            title: Review PR
          - type: COMPLETE
            id: T-1
            title: null
          - type: UNDO
            id: null
            title: null
          - type: UNSUBSCRIBE_NOTIFY
            id: null
            title: null
          - type: REDO
            id: null
            title: null
      status: 200
      response:
        initial:
          tasks: []
          undoDepth: 0
          redoDepth: 0
          observerDeliveries: []
        steps:
        - index: 1
