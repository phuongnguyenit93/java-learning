  collaboration(CollaborationRequest):
    methodName: collaboration
    httpMethods:
    - POST
    mappingPaths:
    - /oop/testing/checkout/collaboration
    usage: true
    cases:
    - id: case_001
      title: Five checkout branches with fake, stub and recording sender
      description: Observe out-of-stock, payment compensation, receipt failure and normal success.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          scenarios:
          - orderId: ORD-1
            sku: SKU-1
            quantity: 2
            unitPriceVnd: 50000
            stock: 1
            paymentMode: APPROVE
            receiptMode: SEND
          - orderId: ORD-2
            sku: SKU-1
            quantity: 2
            unitPriceVnd: 50000
            stock: 5
            paymentMode: DECLINE
            receiptMode: SEND
          - orderId: ORD-3
            sku: SKU-1
            quantity: 2
            unitPriceVnd: 50000
            stock: 5
            paymentMode: ERROR
            receiptMode: SEND
          - orderId: ORD-4
            sku: SKU-1
            quantity: 2
            unitPriceVnd: 50000
            stock: 5
            paymentMode: APPROVE
            receiptMode: ERROR
          - orderId: ORD-5
            sku: SKU-1
            quantity: 2
            unitPriceVnd: 50000
            stock: 5
            paymentMode: APPROVE
            receiptMode: SEND
      status: 200
      response:
        runs:
        - orderId: ORD-1
          status: OUT_OF_STOCK
          payableVnd: 100000
          initialStock: 1
          remainingStock: 1
          paymentAttempts: 0
          sentReceipts: 0
          events:
          - inventory.reserve:REJECTED
          invariantHolds: true
        - orderId: ORD-2
          status: PAYMENT_DECLINED_ROLLED_BACK
          payableVnd: 100000
          initialStock: 5
          remainingStock: 5
          paymentAttempts: 1
          sentReceipts: 0
          events:
          - inventory.reserve:ACCEPTED
          - payment.charge:DECLINE
          - inventory.release
          invariantHolds: true
        - orderId: ORD-3
          status: PAYMENT_ERROR_ROLLED_BACK
          payableVnd: 100000
          initialStock: 5
          remainingStock: 5
          paymentAttempts: 1
          sentReceipts: 0
          events:
          - inventory.reserve:ACCEPTED
          - payment.charge:ERROR
          - inventory.release
          invariantHolds: true
        - orderId: ORD-4
          status: PAID_RECEIPT_FAILED
          payableVnd: 100000
          initialStock: 5
          remainingStock: 3
          paymentAttempts: 1
          sentReceipts: 0
          events:
          - inventory.reserve:ACCEPTED
          - payment.charge:APPROVE
          - receipt.send:ERROR
          invariantHolds: true
        - orderId: ORD-5
          status: SUCCESS
          payableVnd: 100000
          initialStock: 5
          remainingStock: 3
          paymentAttempts: 1
          sentReceipts: 1
          events:
          - inventory.reserve:ACCEPTED
          - payment.charge:APPROVE
          - receipt.send:SEND
          invariantHolds: true
        scope: REQUEST_LOCAL_ONLY; fake inventory, stub gateway, recording receipt sender; no network, real payments, email or cross-request state
      detailDescription: <p>Each scenario has isolated stock. ORD-1 is out of stock and only logs <code>inventory.reserve:REJECTED</code>. ORD-2 DECLINE and ORD-3
        ERROR both call <code>inventory.release</code> to restore stock to five. ORD-4 receives payment APPROVE but <code>receipt.send:ERROR</code> produces <code>PAID_RECEIPT_FAILED</code>,
        leaving stock three and sending no email. ORD-5 succeeds, leaving three units and sentReceipts=1. All five satisfy <code>invariantHolds=true</code> with no
        external I/O.</p>
    - id: case_002
      title: Successful checkout consuming the last available units
      description: FakeInventory may reach zero remaining stock without violating any invariant.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          scenarios:
          - orderId: ORD-6
            sku: SKU-1
            quantity: 2
            unitPriceVnd: 7500
            stock: 2
            paymentMode: APPROVE
            receiptMode: SEND
      status: 200
      response:
        runs:
        - orderId: ORD-6
          status: SUCCESS
          payableVnd: 15000
          initialStock: 2
          remainingStock: 0
          paymentAttempts: 1
          sentReceipts: 1
          events:
          - inventory.reserve:ACCEPTED
          - payment.charge:APPROVE
          - receipt.send:SEND
          invariantHolds: true
        scope: REQUEST_LOCAL_ONLY; fake inventory, stub gateway, recording receipt sender; no network, real payments, email or cross-request state
      detailDescription: <p><code>FakeInventory.reserve()</code> accepts quantity=2 for stock=2, leaving zero. APPROVE <code>StubPayment</code> logs one charge, and
        SEND <code>RecordingSender</code> logs one receipt. <code>CheckoutWorkflow</code> returns SUCCESS, payableVnd=15000, with reserve, charge and send events
        in that order.</p>
    - id: case_003
      title: Reject an empty scenarios list
      description: The collaboration experiment bounds its work to 1–12 cases.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          scenarios: []
      status: 400
      response:
        code: INVALID_INPUT
        detail: scenarios must contain 1..12 cases
      detailDescription: <p><code>CollaborationExperimentService.run()</code> rejects an empty list before creating orders or doubles, throwing <code>IllegalArgumentException</code>.
        The handler maps it to HTTP 400 with <code>INVALID_INPUT</code> and the source's detail.</p>
    - id: case_004
      title: Reject PENDING as an unsupported StubPayment mode
      description: Only APPROVE, DECLINE and ERROR can configure the test payment stub.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          scenarios:
          - orderId: ORD-7
            sku: SKU-1
            quantity: 2
            unitPriceVnd: 50000
            stock: 5
            paymentMode: PENDING
            receiptMode: SEND
      status: 400
      response:
        code: INVALID_INPUT
        detail: scenario requires stock 0..10000, valid quantity/price, paymentMode and receiptMode
      detailDescription: <p>The service validates every scenario before execution and allows only APPROVE/DECLINE/ERROR. PENDING is rejected before the <code>CheckoutWorkflow</code>
        runs, so HTTP 400 reports <code>INVALID_INPUT</code> rather than a PENDING payment outcome.</p>
    - id: case_005
      title: Overflow is rejected before any fake or stub is called
      description: Exact amount multiplication protects the workflow boundary.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          scenarios:
          - orderId: ORD-8
            sku: SKU-1
            quantity: 2
            unitPriceVnd: 9223372036854775807
            stock: 5
            paymentMode: APPROVE
            receiptMode: SEND
      status: 422
      response:
        code: ARITHMETIC_OVERFLOW
        detail: the requested amounts overflow long
      detailDescription: <p>During upfront validation, <code>CheckoutWorkflow.Order.totalVnd()</code> evaluates <code>Math.multiplyExact(2, Long.MAX_VALUE)</code>
        and throws <code>ArithmeticException</code>. The handler returns HTTP 422 with fixed <code>ARITHMETIC_OVERFLOW</code> details, before any inventory, payment
        or receipt interaction.</p>
  regression(RegressionRequest):
    methodName: regression
    httpMethods:
    - POST
    mappingPaths:
    - /oop/testing/pricing/regression
    usage: true
    cases:
    - id: case_001
      title: Regression catches the exact 100000-VND shipping threshold bug
      description: Grouped refactoring reduces catalog lookups without changing the invoice, but the defective variant diverges.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          pricesVnd:
            BOOK: 25000
            PEN: 50000
          lines:
          - sku: BOOK
            quantity: 1
          - sku: BOOK
            quantity: 1
          - sku: PEN
            quantity: 1
          member: true
      status: 200
      response:
        baseline: &id052
          subtotalVnd: 100000
          discountVnd: 5000
          shippingVnd: 0
          totalVnd: 95000
        variants:
        - implementation: PER_LINE_BASELINE
          invoice: *id052
          catalogLookups: 3
          matchesBaseline: true
        - implementation: GROUPED_REFACTOR
          invoice: *id052
          catalogLookups: 2
          matchesBaseline: true
        - implementation: BROKEN_SHIPPING_BOUNDARY
          invoice:
            subtotalVnd: 100000
            discountVnd: 5000
            shippingVnd: 15000
            totalVnd: 110000
          catalogLookups: 2
          matchesBaseline: false
        refactorPreservedBehavior: true
        seededDefectDetected: true
      detailDescription: <p>Two BOOK lines and one PEN line total 100000. The 5% membership discount is 5000; correct shipping is free, making total 95000. <code>PerLineQuote</code>
        performs three lookups and <code>GroupedQuote</code> two, both returning equal invoices. <code>BrokenShippingQuote</code> uses <code>subtotal &gt; 100000</code>
        and incorrectly adds shipping 15000, yielding 110000 and <code>seededDefectDetected=true</code>.</p>
    - id: case_002
      title: No observable regression below the free-shipping threshold
      description: A case below 100000 VND cannot reveal an incorrect strict threshold comparison.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          pricesVnd:
            BOOK: 10
          lines:
          - sku: BOOK
            quantity: 1
          member: false
      status: 200
      response:
        baseline: &id053
          subtotalVnd: 10
          discountVnd: 0
          shippingVnd: 15000
          totalVnd: 15010
        variants:
        - implementation: PER_LINE_BASELINE
          invoice: *id053
          catalogLookups: 1
          matchesBaseline: true
        - implementation: GROUPED_REFACTOR
          invoice: *id053
          catalogLookups: 1
          matchesBaseline: true
        - implementation: BROKEN_SHIPPING_BOUNDARY
          invoice:
            subtotalVnd: 10
            discountVnd: 0
            shippingVnd: 15000
            totalVnd: 15010
          catalogLookups: 1
          matchesBaseline: true
        refactorPreservedBehavior: true
        seededDefectDetected: false
      detailDescription: <p>Subtotal is 10, member discount is absent and shipping costs 15000 in all three variants. Every invoice totals 15010 with one catalog
        lookup; <code>refactorPreservedBehavior=true</code> and <code>seededDefectDetected=false</code>. This illustrates why one passing test does not cover boundary
        defects.</p>
    - id: case_003
      title: Refactor preserves behavior above the free-shipping threshold
      description: All variants waive shipping above 100000; a non-boundary case should not be a false positive.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          pricesVnd:
            BOOK: 60000
            PEN: 30000
          lines:
          - sku: BOOK
            quantity: 2
          - sku: PEN
            quantity: 1
          member: true
      status: 200
      response:
        baseline: &id054
          subtotalVnd: 150000
          discountVnd: 7500
          shippingVnd: 0
          totalVnd: 142500
        variants:
        - implementation: PER_LINE_BASELINE
          invoice: *id054
          catalogLookups: 2
          matchesBaseline: true
        - implementation: GROUPED_REFACTOR
          invoice: *id054
          catalogLookups: 2
          matchesBaseline: true
        - implementation: BROKEN_SHIPPING_BOUNDARY
          invoice:
            subtotalVnd: 150000
            discountVnd: 7500
            shippingVnd: 0
            totalVnd: 142500
          catalogLookups: 2
          matchesBaseline: true
        refactorPreservedBehavior: true
        seededDefectDetected: false
      detailDescription: <p>Subtotal 2 × 60000 + 30000 = 150000; a 7500 member discount leaves total 142500 with zero shipping. Both <code>&gt;</code> and <code>&gt;=</code>
        pass at 150000, so BROKEN matches the baseline and <code>seededDefectDetected=false</code>. Both normal engines use two lookups because SKUs do not repeat.</p>
    - id: case_004
      title: Reject a line whose SKU is missing from the catalog
      description: The service validates lookup references rather than silently returning an invalid quote.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          pricesVnd:
            BOOK: 100
          lines:
          - sku: UNKNOWN
            quantity: 1
          member: true
      status: 400
      response:
        code: INVALID_INPUT
        detail: 'unknown SKU: UNKNOWN'
      detailDescription: '<p><code>RegressionExperimentService.run()</code> constructs a syntactically valid UNKNOWN line but finds it missing from <code>pricesVnd</code>,
        throwing <code>IllegalArgumentException</code> before calculating the baseline. HTTP 400 uses <code>INVALID_INPUT</code> and detail <code>unknown SKU: UNKNOWN</code>.</p>'
    - id: case_005
      title: Price-times-quantity overflow maps to HTTP 422
      description: Exact monetary arithmetic is part of the public regression contract.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          pricesVnd:
            BOOK: 9223372036854775807
          lines:
          - sku: BOOK
            quantity: 2
          member: false
      status: 422
      response:
        code: ARITHMETIC_OVERFLOW
        detail: the requested amounts overflow long
      detailDescription: <p>Baseline <code>PerLineQuote.quote()</code> evaluates <code>Math.multiplyExact(2, Long.MAX_VALUE)</code> before any variant comparison.
        The overflow throws ArithmeticException; the handler returns HTTP 422 with fixed <code>ARITHMETIC_OVERFLOW</code> detail rather than an incomplete RegressionResult.</p>
