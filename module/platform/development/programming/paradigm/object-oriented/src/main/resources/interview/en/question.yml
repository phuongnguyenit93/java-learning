  - question: "Why is withdraw(amount) a stronger behavioral contract than callers reading balance and assigning balance−amount, and what effects must remain visible?"
    answer: "A read-then-set sequence splits validation and mutation across layers and can apply stale calculations when two callers race. withdraw expresses intent and gives Account authority over eligibility, state change and success/failure. Internal persistence choices may evolve without breaking the contract, but material effects such as audit entries, fees or emitted events must not be hidden from consumers. I test observable postconditions and ensure failed requests do not leave partially updated account state."
