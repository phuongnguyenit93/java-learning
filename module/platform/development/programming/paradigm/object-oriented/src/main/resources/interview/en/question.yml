  - question: "Map the collaboration for transferring 30 from Account A=100 to B=20. How do you show success and partial failure without falsely promising a transaction?"
    answer: "The coordinator asks A to debit 30, leaving A=70, then B to credit 30. If both succeed, the final state is A=70 and B=50. If B credit fails after A debit, the system may remain A=70 and B=20; OOP does not magically restore A=100. Clear ownership of debit, credit and orchestration is useful but does not provide multi-step atomicity. The application needs an explicit transaction, compensation or recovery boundary where appropriate, and failure-injection tests at the midpoint rather than invented HTTP or database behavior."
