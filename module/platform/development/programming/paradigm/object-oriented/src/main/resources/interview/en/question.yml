  - question: "An Account starts at 100, withdraws 30, then attempts 120. Define its invariant and explain tests proving no invalid observable state escapes."
    answer: "A non-overdraft account promises balance>=0 whenever it exposes a valid state. Withdrawing 30 from 100 may commit 70; attempting 120 afterward must reject and preserve 70 rather than exposing -50. I would test invalid construction, nonpositive amounts, exception paths and repeated calls. A separate canWithdraw observation does not make a later withdrawal safe under concurrent mutations; if multiple threads update the account, the implementation still needs explicit synchronization or transaction controls beyond the basic OOP mental model."
