questions:
  - question: "A codebase contains many classes but every UI screen implements withdrawal rules. How would you explain why class count does not make it a sound OOP design?"
    answer: "I start with an Account as an identifiable entity responsible for honoring a withdrawal contract, rather than counting classes. When the UI and batch process independently subtract balances, they can disagree about insufficient funds. I define withdraw(amount), its preconditions and observable outcomes, and who may change state. An immutable object can also participate in OOP; class and private are implementation tools, not proof of good ownership. I would demonstrate the same business-rule change through multiple callers and independent account identities."
