  - question: "A UI proposes exposing setBalance(value) so checkout can subtract payments itself. Give a concrete invariant breach and redesign the boundary."
    answer: "With setBalance(-50), any caller can bypass a non-overdraft rule while Account has no opportunity to validate the operation's meaning. Instead checkout requests withdraw(amount), and Account checks positive amount, available funds and consistent state transitions before returning a meaningful result. Making the field private helps only if no unrestricted setter escapes. I would test that an overdraft attempt leaves state unchanged and reports a clear failure, while Checkout never assigns internal balance directly."
