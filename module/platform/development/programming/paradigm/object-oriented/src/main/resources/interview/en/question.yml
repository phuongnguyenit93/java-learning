    answer: "I identify accounts by their domain identity rather than matching balance or runtime class. A and B can both hold 100 yet have different owners, permissions and histories; an audit must attribute A.withdraw(30) to A, not B. Two separate Money(100,VND) values may legitimately be equal by content. Treating balance equality as account identity could deliver the wrong notification. I would test distinct accounts with equal initial balances and verify their independent state and audit histories after a withdrawal."
