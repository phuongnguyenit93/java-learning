  - question: "How would you sequence an Account teaching case from first principles through polymorphism without starting with inheritance?"
    answer: "I first contrast accounts A and B with equal balances to establish identity versus value, then withdraw 30 from A's 100 and reject an excessive withdrawal to explain preserved invariants rather than immutable fields. Next I assign Account, Checkout and Notifier their decisions and specify observable contracts. Only then do I compare Wallet/Card behavior through pay, subtype conditions and composition alternatives. A partial-failure transfer closes the lesson by separating local OOP design from transaction atomicity, rather than introducing inheritance syntax before behavioral reasoning."
