  - question: "In an OOP interview, someone claims interfaces, DDD aggregates, AOP logging and distributed transactions are all guaranteed by OOP. How do you draw the ownership boundaries?"
    answer: "OOP teaches object identity, responsibility, behavioral contracts, encapsulation, composition and substitutability. Java Core owns concrete interface/private syntax and dispatch; DDD aggregates add domain modeling boundaries; AOP covers cross-cutting interception; transactions, locks and compensation live in persistence and distributed-system design. I use Account A=100 and B=20 transferring 30 to show A=70/B=50 on success versus possible A=70/B=20 on failed credit, never automatic rollback. I refer learners to the relevant specialized module before asserting runtime guarantees."
