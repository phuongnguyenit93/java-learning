  - question: "Wallet and Card share logging code. When is making Wallet inherit Card a modeling error, and what reuse alternative fits better?"
    answer: "Sharing logging or fee formulas does not make a Wallet a kind of Card. Inheritance makes a subtype promise and couples implementations; a Card implementation change could break an unrelated Wallet. I would extract logging or correlation into a collaborator or decorator, and encapsulate fee calculations in a FeePolicy object when appropriate. Inheritance is justified only for a real is-a relationship with stable behavioral contracts and substitutable instances, not merely to avoid duplicating a few lines."
