  - question: "What should a PaymentMethod.pay(30) contract expose so Checkout can switch from Card to Wallet, and what must it not promise?"
    answer: "Checkout needs permitted input conditions, observable success/failure outcomes and material effects; it need not know the provider's internal fee calculations. A positive amount of 30 is eligible for processing, not a guarantee that the provider approves. A documented Wallet decline can satisfy the same contract perfectly well. I define failure, retry and idempotency concerns for external effects and run shared contract tests against implementations. An abstraction should be neither a vague doEverything nor an exposed collection of fields."
