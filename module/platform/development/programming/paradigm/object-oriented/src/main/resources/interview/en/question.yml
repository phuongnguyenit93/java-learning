  - question: "An Account has canWithdraw and withdraw. Why should callers distinguish observational queries from state-changing commands, even though OOP also permits immutable objects?"
    answer: "canWithdraw(30) can inspect balance 100 and return eligibility without changing it; withdraw(30) performs an authorized transition to 70 or rejects according to contract. A method call does not automatically imply mutation, and OOP does not require mutable objects: Money or FeePolicy may be immutable and still expose meaningful behavior. I test before/after state and any documented audit effects for each operation rather than infer side effects from method names."
