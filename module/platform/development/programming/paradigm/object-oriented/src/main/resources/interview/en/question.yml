  - question: "You already have a clear procedural withdraw(accountData,amount). When would you keep it, and what evidence would justify introducing collaborating objects?"
    answer: "A procedural function is not inherently inferior. For a small data structure with a clear operation and minimal lifecycle, it may be simpler to read and test. When accounts acquire distinct identities, histories, fee policies and independent callers, behavior ownership can reduce scattered rules. I map who validates balances, who sends notifications and which changes force unrelated edits. I would introduce objects only if responsibility boundaries and observable contracts reduce that coupling, rather than chasing a target number of classes."
