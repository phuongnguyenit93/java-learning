  - question: "How would you assign Account, Checkout and Notifier responsibilities when a purchase is rejected for insufficient funds?"
    answer: "Account decides whether a withdrawal can preserve balance>=0 and returns a meaningful failure; Checkout coordinates the purchase and interprets the outcome; Notifier delivers messages but does not decide account balances. One responsibility can involve several related methods, so cohesion is not measured by one method per class. Changing overdraft policy should not force a notification template to implement money rules. I would test error propagation and ensure a rejected withdrawal cannot be represented as a successful purchase."
