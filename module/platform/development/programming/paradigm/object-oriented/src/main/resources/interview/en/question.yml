    answer: "The contract is simply an input list of values producing a total, with no entity-owned state, permission boundary or meaningful behavioral variant. A pure function is easy to call with examples and verify; a procedural loop can be equally clear. Adding Account, strategy hierarchies and event coordinators to a simple sum creates unnecessary state and coupling. If the domain later adds replaceable discount policies or true account identity, I can revisit the boundaries rather than turning paradigm choice into dogma."
