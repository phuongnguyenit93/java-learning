  - question: "You are teaching OOP to someone who has not learned Java. Should you begin with interface/private/override syntax or with payment behavior contracts, and why?"
    answer: "I begin with observable promises: pay(amount) accepts eligible positive requests and can report provider success or documented failure, while Account owns valid withdrawals. Then I ask how a language can implement those boundaries and how callers verify them. Java interface, private and method dispatch mechanics belong in Java Core rather than defining the OOP paradigm. This avoids teaching that private fields automatically imply good encapsulation or that inheritance guarantees substitutability, and it avoids inventing an HTTP contract for this conceptual library module."
