  - question: "A colleague says an immutable Transaction(-20) record guarantees business correctness. Explain the distinction and where validation belongs."
    answer: "Immutability prevents a value from being modified after construction; it says nothing about whether -20 is a valid transaction amount. If the domain requires amount>0, a constructor or factory must validate it, including deserialized inputs. Conversely, a mutable Account can preserve balance>=0 while changing from 100 to 70 through approved behavior. I test construction boundaries and every state transition, without treating record or final syntax as evidence that domain rules are satisfied."
