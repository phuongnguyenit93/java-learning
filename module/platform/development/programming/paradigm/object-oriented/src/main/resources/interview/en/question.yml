  - question: "When the no-overdraft policy changes, should Account or Checkout decide whether withdrawal is valid? Explain the ownership and change-impact reasoning."
    answer: "Account owns its balance and the obligation to preserve balance>=0; Checkout orchestrates a purchase but must not compute and assign an arbitrary replacement balance. Duplicating withdrawal logic in UI, service and batch jobs spreads one change across several locations and invites inconsistency. I ask which component has the information and authority to uphold the rule, then expose an explicit success/failure result to callers. This local responsibility boundary does not automatically provide atomic transactions spanning other systems."
