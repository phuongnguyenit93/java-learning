  - question: "Account A and B both hold 100. Walk through a withdrawal from A and distinguish identity, state, behavior and collaboration."
    answer: "A and B are distinct entities even with matching balance values: they may have different owners, permissions and histories. Checkout requests A.withdraw(30); Account A validates and changes its own balance 100→70, while B remains at 100. Balance is state, withdrawal is domain behavior upholding an invariant, and Checkout coordinates rather than rewriting fields. Two money values of 100 may compare equal in another context, but equal account balances do not establish entity identity. I would test observations on both accounts after the operation."
