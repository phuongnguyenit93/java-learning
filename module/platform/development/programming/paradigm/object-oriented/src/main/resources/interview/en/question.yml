  - question: "Card and Wallet both implement PaymentMethod.pay, but Wallet may decline a transaction. State a shared contract that makes substitution meaningful."
    answer: "The shared contract may accept amount>0, report approved or declined, and expose provider failures consistently. A Wallet decline is permitted if the interface never promised that every positive request succeeds. That differs from a subtype secretly requiring amount>=50, which strengthens the caller's precondition. I run contract tests for amount 30 and documented failure paths, ensuring Checkout does not interpret a mere return as approval. Actual provider-side effects need separate boundaries and idempotency policies; the pay signature cannot guarantee them."
