    usage: true
    cases:
    - id: case_001
      title: CSV dùng Factory Method, giữ cố định trace HEADER–ROW–SUMMARY
      description: Hai dòng được kết xuất theo thứ tự với tổng 120 VND, không thay đổi thuật toán render.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          format: CSV
          sales:
          - id: S-01
            amountVnd: 100
          - id: S-02
            amountVnd: 20
      status: 200
      response:
        format: CSV
        content: 'saleId,amountVnd

          S-01,100

          S-02,20

          TOTAL,120'
        totalVnd: 120
        rowCount: 2
        executionTrace:
        - HEADER
        - ROW:S-01
        - ROW:S-02
        - SUMMARY
      detailDescription: <p><code>CsvCreator.createTemplate()</code> tạo CsvTemplate, nhưng phương thức final <code>ReportTemplate.render()</code> vẫn kiểm tra danh
        sách, thêm header, lần lượt các row S-01 và S-02 rồi summary. Nội dung gồm bốn dòng <code>saleId,amountVnd</code>, <code>S-01,100</code>, <code>S-02,20</code>,
        <code>TOTAL,120</code>, với dấu xuống dòng và trace xác định bởi Template Method.</p>
    - id: case_002
      title: TEXT và CSV dùng cùng Template Method
