          available: 2
          diagnostic: StockItem{tenantId=T, sku=BOOK, available=2}
        - index: 4
          action: RESERVE
          accepted: true
          code: RESERVED
          available: 1
          diagnostic: StockItem{tenantId=T, sku=BOOK, available=1}
        uniqueProducts: 1
      detailDescription: <p><code>StockItem</code> khởi tạo tồn 2. RESERVE 3 tạo <code>ReserveDeclined</code> với mã INSUFFICIENT_STOCK, còn tồn 2; READ xác nhận
        giá trị đó. RESERVE 1 tiếp theo được nhận, còn tồn 1. Chuỗi diagnostic chỉ chứa tenant, sku, available, không lộ email hoặc providerToken đã gửi.</p>
    - id: case_002
