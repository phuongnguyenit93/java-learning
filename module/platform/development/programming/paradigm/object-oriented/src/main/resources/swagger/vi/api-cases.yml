          accepted: true
          feeVnd: 51000
          code: QUOTED
        - serviceCode: unknown
          weightGrams: 1000
          accepted: false
          feeVnd: null
          code: SERVICE_NOT_SUPPORTED
        totalAcceptedFeesVnd: 71000
      detailDescription: '<p>Standard có phí 20000; Express 1001 gram làm tròn thành 2 kilogram, có phí 35000+16000=51000. Service unknown không nằm trong map, nhận
        accepted=false và feeVnd=null với SERVICE_NOT_SUPPORTED. Tổng phí chỉ cộng hai dòng được nhận: 71000.</p>'
    - id: case_002
      title: Ranh giới cước phí 1000 và 1001 gram
