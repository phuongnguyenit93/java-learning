  constructorTrace(ConstructorRequest):
    methodName: constructorTrace
    httpMethods:
    - POST
    mappingPaths:
    - /oop/inheritance/constructors/trace
    usage: true
    cases:
    - id: case_001
      title: Constructor cha dispatch ??n field ch?a kh?i t?o
      description: UnsafeParent g?i value b? override n?n th?y null; SafeParent kh?ng g?i virtual method.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          initialLabel: READY
      status: 200
      response:
        unsafeSequence:
        - parent constructor begins
        - 'parent sees overridden value: null'
        - 'child constructor completed: READY'
        safeSequence:
        - 'parent constructor: no overridable calls'
        - 'child constructor completed: READY'
        - 'post-construction value: READY'
        unsafeValueObservedByParent: 'null'
        finalValue: READY
        simulatedOnly: true
      detailDescription: <p><code>UnsafeChild</code> b?t ??u b?ng constructor <code>UnsafeParent</code>, n?i <code>value()</code> dispatch t?i l?p con tr??c field
        initializer. Java chuy?n gi? tr? null th?nh ch? <code>null</code> trong log. Sau ?? con g?n READY. V?i <code>SafeChild</code>, cha kh?ng g?i override v? ch?
        ki?m tra sau khi con g?n xong n?n trace an to?n quan s?t READY.</p>
    - id: case_002
      title: T? ch?i nh?n ch? g?m kho?ng tr?ng
