            seats: 4
            expectedAccepted: true
            actualAccepted: true
            expectedSnapshot:
              capacity: 10
              reserved: 4
            actualSnapshot:
              capacity: 10
              reserved: 4
            passed: true
            violations: []
          - index: 2
            action: RESERVE
            seats: 7
            expectedAccepted: false
            actualAccepted: false
            expectedSnapshot:
              capacity: 10
              reserved: 4
            actualSnapshot:
              capacity: 10
              reserved: 4
            passed: true
            violations: []
          - index: 3
