      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          subtotalVnd: -1
          deliveryFeeVnd: 0
          strategy: NONE
          order: DISCOUNT_THEN_FEE
      status: 400
      response:
        error: subtotalVnd must be 0..1000000000000
      detailDescription: <p><code>PricingPipeline.calculate()</code> kiểm tra subtotal không âm trước khi tạo DiscountStrategy hoặc decorator. Giá trị -1 ném <code>IllegalArgumentException</code>,
        được handler đưa về HTTP 400 với thông báo nguyên văn.</p>
    - id: case_006
      title: Không nhận Strategy UNKNOWN
      description: Các implementation phải thuộc bộ chính sách đã được khai báo trong pipeline.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          subtotalVnd: 100
          deliveryFeeVnd: 0
          strategy: UNKNOWN
          order: DISCOUNT_THEN_FEE
      status: 400
      response:
        error: strategy must be NONE/MEMBER_5/VOUCHER_30000
      detailDescription: <p><code>switch(strategyCode)</code> trong <code>PricingPipeline</code> chỉ khởi tạo <code>NoDiscount</code>, <code>MemberDiscount</code>
        hoặc <code>VoucherDiscount</code>. Với UNKNOWN, nhánh default ném <code>IllegalArgumentException</code> và handler trả HTTP 400, không có PricingResult.</p>
