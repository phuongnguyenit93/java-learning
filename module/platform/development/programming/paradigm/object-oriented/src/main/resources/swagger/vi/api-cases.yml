      detailDescription: <p><code>DeliveryComparisonService.compare</code> ch?p nh?n distanceKm=5 nh?ng ki?m tra <code>holiday &amp;&amp; !priority</code> l? true.
        Service n?m <code>IllegalArgumentException</code> tr??c khi ch?n l?p k? th?a ho?c t?nh composition. HTTP 400 tr? <code>INVALID_INPUT</code> v?i l? do holiday
