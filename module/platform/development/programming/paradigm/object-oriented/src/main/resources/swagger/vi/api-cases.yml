        th?m fixed base=10000 th?nh 18000. Service c?ng c?ng t??ng t? theo t?y ch?n priority b?ng composition n?n c? hai trace v? t?ng ti?n b?ng nhau.</p>
    - id: case_004
      title: Ch?n t?y ch?n holiday thi?u priority
