        countsConsistent: true
        scope: REQUEST_LOCAL_SIMULATION; NO_DATABASE_OR_ACTUAL_EMAIL; NO_TRANSACTION_ACROSS_EXTERNAL_ADAPTERS
      detailDescription: '<p>Hai đơn đầu được lưu: ORD-1 dùng NONE có payable 50000; ORD-2 dùng LOYALTY giảm 7500 còn 42500. ORD-3 dùng policy âm bị từ chối (POLICY_CONTRACT)
        và lần tiếp theo dùng ORD-1 trùng bị ORDER_CONFLICT. ORD-4 dùng TEN_PERCENT giảm 5000 còn 45000. Ba receipt và ba notice có đúng thứ tự; các bước từ chối
        giữ count=2, còn bước cuối đưa count lên 3.</p>'
    - id: case_003
      title: Input dòng đơn lỗi và mã policy không tồn tại
      description: Dòng có quantity null và chính sách UNKNOWN đều thất bại mà không ghi đơn.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          attempts:
          - orderId: ORD-2
            policyCode: NONE
            lines:
            - sku: A
              quantity: null
              unitPriceCents: 2
          - orderId: ORD-3
            policyCode: UNKNOWN
            lines:
            - sku: BOOK
              quantity: 2
              unitPriceCents: 10
      status: 200
      response:
        attempts:
        - index: 1
          orderId: ORD-2
