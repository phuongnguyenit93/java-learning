      detailDescription: <p><code>Taggable.parseTags</code> g?i <code>csv.split(&quot;,&quot;,-1)</code> n?n chu?i a,,b t?o ph?n t? r?ng ? gi?a. Sau trim, ph?n t?
        n?y k?ch ho?t <code>IllegalArgumentException(&quot;Tags must not be empty&quot;)</code>. Advice tr? HTTP 400; kh?ng tr? m?t ph?n normalizedTags.</p>
    - id: case_003
      title: Kh?ng nh?n itemId r?ng
