      detailDescription: <p><code>CapabilityResolution.resolve</code> ki?m tra itemId b?ng <code>isBlank()</code>, nh?n chu?i r?ng n?n n?m <code>IllegalArgumentException(&quot;itemId
        must contain 1..80 characters&quot;)</code>. Service d?ng tr??c b??c t?o MixedCapability; HTTP 400 tr? <code>INVALID_INPUT</code>.</p>
InterfaceExperimentsController:
  shipping(ShippingRequest):
    methodName: shipping
    httpMethods:
    - POST
    mappingPaths:
    - /oop/interfaces/shipping/quote
    usage: true
    cases:
    - id: case_001
      title: So sánh giá giao tiết kiệm và giao nhanh
      description: Cùng đầu vào tạo hai báo giá qua một interface, chọn ECONOMY và xem phí còn lại.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          distanceKm: 4
          orderValueVnd: 100000
          selectedPolicy: ECONOMY
      status: 200
      response:
        selected: &id030
          policy: ECONOMY
          feeVnd: 20000
        allPolicies:
        - *id030
        - policy: EXPRESS
          feeVnd: 40000
        freeEconomyShipping: false
      detailDescription: <p><code>EconomyShippingPolicy</code> kế thừa công thức 10000 + 2500 × 4 = 20000 VND; <code>ExpressShippingPolicy</code> cho 20000 + 5000
        × 4 = 40000 VND. Đơn 100000 VND chưa đạt ngưỡng miễn phí ECONOMY 500000, nên <code>freeEconomyShipping=false</code>. Service chọn đúng phần tử ECONOMY trong
        <code>allPolicies</code>.</p>
    - id: case_002
      title: ECONOMY miễn phí nhưng vẫn chọn EXPRESS
      description: Các implementation giữ chung chữ ký nhưng chính sách miễn phí có điều kiện khác nhau.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          distanceKm: 4
          orderValueVnd: 500000
          selectedPolicy: EXPRESS
      status: 200
      response:
        selected: &id031
          policy: EXPRESS
          feeVnd: 40000
        allPolicies:
        - policy: ECONOMY
          feeVnd: 0
        - *id031
        freeEconomyShipping: true
      detailDescription: <p>Đơn 500000 VND khiến <code>EconomyShippingPolicy.isFree()</code> trả true, nên ECONOMY có phí 0. EXPRESS vẫn là 40000 VND vì không override
        điều kiện miễn phí. <code>selected</code> trỏ tới EXPRESS, trong khi <code>freeEconomyShipping</code> phản ánh phí của ECONOMY bằng 0.</p>
    - id: case_003
      title: Từ chối mã chính sách không hỗ trợ
      description: Không có implementation trong danh sách trùng tên UNKNOWN.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          distanceKm: 4
          orderValueVnd: 100000
          selectedPolicy: UNKNOWN
      status: 400
      response:
        error: selectedPolicy must be ECONOMY or EXPRESS
      detailDescription: <p>Sau khi tính hai báo giá, phép <code>filter(p -&gt; p.policy().equals(selectedPolicy))</code> không tìm thấy <code>UNKNOWN</code>. <code>orElseThrow()</code>
        ném <code>IllegalArgumentException</code>, và handler trả HTTP 400 với nội dung <code>error</code> chính xác.</p>
    - id: case_004
      title: Khoảng cách âm bị loại ngay tại hợp đồng
      description: Ràng buộc đầu vào chung giúp cả hai chính sách có cùng điều kiện tối thiểu.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          distanceKm: -1
          orderValueVnd: 100
          selectedPolicy: EXPRESS
      status: 400
      response:
        error: distanceKm must be 0..10000, orderValueVnd must be 0..1000000000000
      detailDescription: <p><code>ShippingFeePolicy.requireValid()</code> từ chối <code>distanceKm=-1</code> trước khi khởi tạo/tính báo giá. <code>IllegalArgumentException</code>
        trở thành HTTP 400, nên response chỉ có <code>error</code> và không chứa báo giá của policy nào.</p>
  documents(DocumentRequest):
    methodName: documents
    httpMethods:
    - POST
    mappingPaths:
    - /oop/interfaces/documents/experiment
    usage: true
    cases:
    - id: case_001
      title: Đọc ghi xuất bản qua ba interface trên một object
      description: Chuỗi hành động có nhánh thành công và bị từ chối, trong khi DocumentWorkspace duy trì chung dữ liệu.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialDocuments:
          - id: DOC-1
            title: Draft
            content: Initial
          actions:
          - type: publish
            id: MISSING
          - type: save
            id: DOC-1
            title: Edited
            content: Revision
          - type: read
            id: DOC-1
          - type: publish
            id: DOC-1
          - type: save
            id: DOC-1
            title: Late
            content: Cannot edit
          - type: read
            id: ABSENT
      status: 200
      response:
        initial: &id032
        - id: DOC-1
          title: Draft
          content: Initial
          status: DRAFT
        steps:
        - index: 1
          type: publish
          id: MISSING
          accepted: false
          detail: document does not exist
          before: *id032
          after: *id032
          readResult: null
        - index: 2
          type: save
          id: DOC-1
          accepted: true
          detail: completed
          before: *id032
          after: &id033
          - &id034
            id: DOC-1
            title: Edited
            content: Revision
            status: DRAFT
          readResult: null
        - index: 3
          type: read
          id: DOC-1
          accepted: true
          detail: found
          before: *id033
          after: *id033
          readResult: *id034
        - index: 4
          type: publish
          id: DOC-1
          accepted: true
          detail: completed
          before: *id033
          after: &id035
          - id: DOC-1
            title: Edited
            content: Revision
            status: PUBLISHED
          readResult: null
        - index: 5
          type: save
          id: DOC-1
          accepted: false
          detail: published document cannot be edited
          before: *id035
          after: *id035
          readResult: null
        - index: 6
          type: read
          id: ABSENT
          accepted: true
          detail: not found
          before: *id035
          after: *id035
          readResult: null
        current: *id035
        sharedInstance: true
        defaultConflictResolution: read+publish
        scope: REQUEST_LOCAL_IN_MEMORY_SINGLE_THREAD_NO_EXTERNAL_SIDE_EFFECTS
      detailDescription: <p>Ba biến <code>reader</code>, <code>writer</code>, <code>publisher</code> cùng trỏ <code>DocumentWorkspace</code> nên <code>sharedInstance=true</code>.
        Xuất bản ID MISSING thất bại; lưu DOC-1 mới thành công và lần đọc thấy Revision. Sau khi xuất bản, lưu lại bị cấm nên before/after bằng nhau; đọc ABSENT trả
        <code>readResult=null</code> nhưng vẫn <code>accepted=true</code>. Override giải quyết hai default <code>roleName()</code> thành <code>read+publish</code>.</p>
    - id: case_002
      title: Tạo mới rồi công bố và đọc tài liệu
      description: Thứ tự thao tác thể hiện hợp đồng của reader, writer, publisher cùng một instance.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialDocuments: []
          actions:
          - type: save
            id: DOC-1
            title: Hello
            content: Message
          - type: publish
            id: DOC-1
          - type: read
            id: DOC-1
      status: 200
      response:
        initial: &id036 []
        steps:
        - index: 1
          type: save
          id: DOC-1
          accepted: true
          detail: completed
          before: *id036
          after: &id037
          - id: DOC-1
            title: Hello
            content: Message
            status: DRAFT
          readResult: null
        - index: 2
          type: publish
          id: DOC-1
          accepted: true
          detail: completed
          before: *id037
          after: &id038
          - &id039
            id: DOC-1
            title: Hello
            content: Message
            status: PUBLISHED
          readResult: null
        - index: 3
          type: read
          id: DOC-1
          accepted: true
          detail: found
          before: *id038
          after: *id038
          readResult: *id039
        current: *id038
        sharedInstance: true
        defaultConflictResolution: read+publish
        scope: REQUEST_LOCAL_IN_MEMORY_SINGLE_THREAD_NO_EXTERNAL_SIDE_EFFECTS
      detailDescription: <p><code>save()</code> tạo DOC-1 ở trạng thái DRAFT; <code>publish()</code> thay giá trị bằng record PUBLISHED, còn <code>find()</code> qua
        interface đọc trả bản ghi đó. Cả ba step được chấp nhận, không có bản sao workspace giữa các vai trò, và danh sách <code>current</code> chứa tài liệu đã xuất
        bản.</p>
    - id: case_003
      title: Chặn tài liệu ban đầu trùng ID
      description: Trước khi tạo workspace, service phải giữ tính duy nhất trong tập dữ liệu đầu vào.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialDocuments:
          - id: DOC-1
            title: A
            content: x
          - id: DOC-1
            title: B
            content: y
          actions:
          - type: read
            id: DOC-1
      status: 400
      response:
        error: initial document ids must be unique
      detailDescription: <p><code>InterfaceExperimentsService.documents()</code> xác thực từng <code>DocumentEntry</code> rồi đưa ID vào <code>HashSet</code> tạm.
        ID DOC-1 thứ hai làm <code>distinct.add()</code> trả false nên ném <code>IllegalArgumentException</code> trước khi chạy bất kỳ action nào; HTTP 400.</p>
    - id: case_004
      title: Từ chối thao tác delete ngoài hợp đồng
      description: API chỉ có ba vai trò đọc/ghi/xuất bản và không hỗ trợ xóa.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialDocuments: []
          actions:
          - type: delete
            id: DOC-1
      status: 400
      response:
        error: document action must have type save/read/publish and id
      detailDescription: <p>Vòng kiểm tra <code>DocumentAction</code> chỉ chấp nhận <code>save</code>, <code>read</code> và <code>publish</code>. <code>delete</code>
        gây <code>IllegalArgumentException</code> trước khi tạo <code>DocumentWorkspace</code>, nên trả HTTP 400 thay vì một step lỗi.</p>
  checkout(CheckoutRequest):
    methodName: checkout
    httpMethods:
    - POST
    mappingPaths:
    - /oop/interfaces/checkout/experiment
    usage: true
    cases:
    - id: case_001
      title: Thanh toán giả lập, phát lại và xung đột requestId
      description: Bản ghi đã lưu cho phép phát lại an toàn trong một request, còn cùng ID khác số tiền bị từ chối.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          gateway: APPROVE
          repository: HASH_MAP
          actions: &id045
          - requestId: REQ-2
            orderId: ORD-2
            amountVnd: 300
          - requestId: REQ-1
            orderId: ORD-1
            amountVnd: 100
          - requestId: REQ-2
            orderId: ORD-2
            amountVnd: 300
          - requestId: REQ-2
            orderId: ORD-2
            amountVnd: 301
      status: 200
      response:
        gateway: APPROVE
        repository: HASH_MAP
        initial: &id040
          storedPayments: []
          gatewayCalls: 0
        steps:
        - index: 1
          requestId: REQ-2
          accepted: true
          replayed: false
          detail: gateway processed
          receipt: &id041
            requestId: REQ-2
            orderId: ORD-2
            amountVnd: 300
            status: APPROVED
          before: *id040
          after: &id042
            storedPayments:
            - *id041
            gatewayCalls: 1
        - index: 2
          requestId: REQ-1
          accepted: true
          replayed: false
          detail: gateway processed
          receipt: &id043
            requestId: REQ-1
            orderId: ORD-1
            amountVnd: 100
            status: APPROVED
          before: *id042
          after: &id044
            storedPayments:
            - *id043
            - *id041
            gatewayCalls: 2
        - index: 3
          requestId: REQ-2
          accepted: true
          replayed: true
          detail: replayed without charging
          receipt: *id041
          before: *id044
          after: *id044
        - index: 4
          requestId: REQ-2
          accepted: false
          replayed: false
          detail: requestId already used for different payment details
          receipt: null
          before: *id044
          after: *id044
        current: *id044
        scope: FAKE_PAYMENT_ONLY_REQUEST_LOCAL_NO_REAL_CHARGE_NO_DURABILITY_OR_CONCURRENT_IDEMPOTENCY
      detailDescription: <p>REQ-2 và REQ-1 được charge mô phỏng một lần mỗi ID rồi lưu receipt APPROVED. <code>HashPaymentRepository.listSorted()</code> sắp theo
        requestId, nên current có REQ-1 trước REQ-2. Lần REQ-2/300 lặp lại khớp <code>PaymentReceipt.matches()</code>, được replay không gọi gateway. REQ-2/301 tái
        dùng ID sai chi tiết bị từ chối, không tạo receipt, không tăng <code>gatewayCalls</code> (giữ 2). Dữ liệu chỉ sống trong request.</p>
    - id: case_002
      title: Thay HashMap bằng TreeMap giữ nguyên hợp đồng
      description: Cùng các action phải tạo dữ liệu và thứ tự receipt giống hệt khi đổi repository.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          gateway: APPROVE
          repository: TREE_MAP
          actions: *id045
      status: 200
      response:
        gateway: APPROVE
        repository: TREE_MAP
        initial: *id040
        steps:
        - index: 1
          requestId: REQ-2
          accepted: true
          replayed: false
          detail: gateway processed
          receipt: *id041
          before: *id040
          after: *id042
        - index: 2
          requestId: REQ-1
          accepted: true
          replayed: false
          detail: gateway processed
          receipt: *id043
          before: *id042
          after: *id044
        - index: 3
          requestId: REQ-2
          accepted: true
          replayed: true
          detail: replayed without charging
          receipt: *id041
          before: *id044
          after: *id044
        - index: 4
          requestId: REQ-2
          accepted: false
          replayed: false
          detail: requestId already used for different payment details
          receipt: null
          before: *id044
          after: *id044
        current: *id044
        scope: FAKE_PAYMENT_ONLY_REQUEST_LOCAL_NO_REAL_CHARGE_NO_DURABILITY_OR_CONCURRENT_IDEMPOTENCY
      detailDescription: <p><code>TreePaymentRepository</code> thay cấu trúc trong bằng <code>TreeMap</code>, nhưng giao diện <code>PaymentRepository</code> vẫn yêu
        cầu <code>find</code>, <code>save</code> và <code>listSorted</code>. Vì thế bốn bước thành công/phát lại/từ chối và danh sách REQ-1 rồi REQ-2 có giá trị như
        case HASH_MAP. <code>CheckoutService</code> không cần sửa code.</p>
    - id: case_003
      title: Receipt từ chối vẫn được lưu và phát lại
      description: DECLINED là kết quả hợp lệ của gateway giả lập, không phải lỗi HTTP.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          gateway: DECLINE
          repository: HASH_MAP
          actions:
          - requestId: REQ-10
            orderId: ORD-10
            amountVnd: 450
          - requestId: REQ-10
            orderId: ORD-10
            amountVnd: 450
      status: 200
      response:
        gateway: DECLINE
        repository: HASH_MAP
        initial: *id040
        steps:
        - index: 1
          requestId: REQ-10
          accepted: true
          replayed: false
          detail: gateway processed
          receipt: &id046
            requestId: REQ-10
            orderId: ORD-10
            amountVnd: 450
            status: DECLINED
          before: *id040
          after: &id047
            storedPayments:
            - *id046
            gatewayCalls: 1
        - index: 2
          requestId: REQ-10
          accepted: true
          replayed: true
          detail: replayed without charging
          receipt: *id046
          before: *id047
          after: *id047
        current: *id047
        scope: FAKE_PAYMENT_ONLY_REQUEST_LOCAL_NO_REAL_CHARGE_NO_DURABILITY_OR_CONCURRENT_IDEMPOTENCY
      detailDescription: <p><code>DeclinePaymentGateway.charge()</code> trả receipt có trạng thái <code>DECLINED</code>. <code>CheckoutService</code> vẫn lưu receipt
        vì hợp đồng ID, order và amount đều khớp, nên step đầu accepted=true dù thanh toán bị từ chối. Step thứ hai replay receipt đó, <code>gatewayCalls=1</code>
        và HTTP 200; không có tiền thật chuyển đi.</p>
    - id: case_004
      title: Từ chối số tiền bằng 0 trước khi charge
      description: PaymentCommand kiểm tra ranh giới dữ liệu cho mọi gateway.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          gateway: APPROVE
          repository: HASH_MAP
          actions:
          - requestId: REQ-1
            orderId: ORD-1
            amountVnd: 0
      status: 400
      response:
        error: amountVnd must be 1..1000000000000
      detailDescription: <p><code>new PaymentCommand()</code> từ chối <code>amountVnd=0</code> trước khi tạo <code>CheckoutService</code> và vào vòng lặp. Handler
        trả HTTP 400 với thông báo của constructor; không có <code>steps</code> hay trạng thái payment.</p>
    - id: case_005
      title: Từ chối gateway ngoài danh sách hợp lệ
      description: Lựa chọn implementation phải được kiểm tra trước khi chạy.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          gateway: UNKNOWN
          repository: HASH_MAP
          actions:
          - requestId: REQ-1
            orderId: ORD-1
            amountVnd: 100
      status: 400
      response:
        error: gateway must be APPROVE or DECLINE
      detailDescription: <p>Biểu thức <code>switch(request.gateway())</code> chỉ cho hai mã <code>APPROVE</code> và <code>DECLINE</code>. Mã UNKNOWN đi vào nhánh
        default và ném <code>IllegalArgumentException</code>; response HTTP 400, không tạo kho hoặc charge.</p>
LanguageMechanicsExperimentsController:
  generics(GenericBatchRequest):
    methodName: generics
    httpMethods:
    - POST
    mappingPaths:
    - /oop/language-mechanics/generics/experiment
    usage: true
    cases:
    - id: case_001
      title: PECS sao chép Integer và Double
      description: Tính tổng, chọn phần tử lớn nhất và tra cache typed.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          integers:
          - 2
          - 7
          decimals:
          - 0.5
          - 1.25
          entries:
          - key: A
            quantity: 4
          lookups:
          - A
          - NOT_FOUND
      status: 200
      response:
        copiedValues:
        - '2'
        - '7'
        - '0.5'
        - '1.25'
        sum: '10.75'
        largestInteger: 7
        found:
          A: 4
        missing:
        - NOT_FOUND
      detailDescription: <p><code>NumericTransfers.copy</code> ghép [2,7] và [0.5,1.25] vào danh sách Number. <code>BigDecimal</code> cho tổng 10.75, <code>greatest</code>
        chọn 7. Cache lưu A=4 nên found có A, còn NOT_FOUND thuộc missing. copiedValues giữ thứ tự của các số dưới dạng chuỗi.</p>
    - id: case_002
      title: List rỗng được chấp nhận
      description: Đầy đủ bốn trường list nhưng không có giá trị.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          integers: []
          decimals: []
          entries: []
          lookups: []
      status: 200
      response:
        copiedValues: []
        sum: '0'
        largestInteger: null
        found: {}
        missing: []
      detailDescription: <p>Service nhận bốn danh sách rỗng hợp lệ. <code>BigDecimal.ZERO</code> tạo chuỗi tổng 0, largestInteger=null vì không gọi <code>greatest</code>
        trên tập rỗng; copiedValues, found và missing đều rỗng. API trả HTTP 200.</p>
    - id: case_003
      title: Phát hiện khóa cache trùng
      description: Thêm hai entry có cùng key X bị từ chối.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          integers:
          - 1
          decimals: []
          entries:
          - key: X
            quantity: 1
          - key: X
            quantity: 2
          lookups:
          - X
      status: 400
      response:
        error: INVALID_INPUT
      detailDescription: <p><code>TypedCache.add</code> thêm X=1 rồi kiểm tra X=2 bằng <code>putIfAbsent</code>. Trùng khóa làm ném <code>IllegalArgumentException</code>;
        handler trả HTTP 400 chỉ với <code>error=INVALID_INPUT</code>, không trả lại dữ liệu tính dở.</p>
  stock(StockRequest):
    methodName: stock
    httpMethods:
