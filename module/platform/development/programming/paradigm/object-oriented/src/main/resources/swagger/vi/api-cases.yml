        trước khi tạo StockItem. Handler trả HTTP 400 với <code>error=INVALID_INPUT</code>, không có danh sách bước từng phần.</p>
  shipping(ShippingRequest):
    methodName: shipping
    httpMethods:
    - POST
    mappingPaths:
    - /oop/language-mechanics/shipping/experiment
    usage: true
    cases:
    - id: case_001
      title: Báo giá standard, express và unknown
