        body:
          initialLabel: '  '
      status: 400
      response:
        code: INVALID_INPUT
        message: initialLabel must contain 1..80 nonblank characters
      detailDescription: <p><code>ConstructorTraceService.trace</code> chuy?n chu?i hai d?u c?ch cho <code>ConstructorProbe.run</code>. <code>label.isBlank()</code>
        ??ng n?n n?m <code>IllegalArgumentException</code> tr??c khi kh?i t?o UnsafeChild ho?c SafeChild; advice tr? HTTP 400 <code>INVALID_INPUT</code>.</p>
  resolveCapabilities(CapabilitiesRequest):
    methodName: resolveCapabilities
    httpMethods:
    - POST
    mappingPaths:
    - /oop/inheritance/capabilities/resolve
