RefactoringExperimentsController:
  checkout(CheckoutRequest):
    methodName: checkout
    httpMethods:
    - POST
    mappingPaths:
    - /oop/refactoring/checkout/compare
    usage: true
    cases:
    - id: case_001
      title: Ngưỡng giảm giá VIP vẫn tương đương
      description: Refactor giữ đúng giảm giá 10% khi subtotal đạt 500000 VND và receipt không đổi.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          vip: true
          lines:
          - sku: JAVA
            unitPriceVnd: 200000
            quantity: 2
          - sku: OOP
            unitPriceVnd: 100000
            quantity: 1
      status: 200
      response:
        before:
          subtotalVnd: 500000
          discountVnd: 50000
          shippingVnd: 30000
          payableVnd: 450000
          totalVnd: 480000
          receipt: subtotal=500000;discount=50000;shipping=30000;total=480000
        after:
          subtotalVnd: 500000
          discountVnd: 50000
          shippingVnd: 30000
          payableVnd: 450000
          totalVnd: 480000
          receipt: subtotal=500000;discount=50000;shipping=30000;total=480000
        equivalent: true
      detailDescription: <p><code>OrderLine</code> tính 200000×2 + 100000×1 = 500000 VND. Vì vip=true và subtotal đạt ngưỡng 500000, cả <code>LegacyCheckout</code>
        và <code>PricingPolicy</code> giảm 50000, payable còn 450000. Payable dưới 700000 nên shipping=30000, total=480000. <code>ReceiptFormatter</code> tạo chuỗi
        subtotal/discount/shipping/total giống nhau cho cả before và after. HTTP 200 và equivalent=true.</p>
    - id: case_002
      title: Miễn phí giao hàng đúng tại mốc 700000
      description: Đơn không VIP đạt payable=700000 nên phí giao hàng bằng 0.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          vip: false
          lines:
          - sku: BOOK
            unitPriceVnd: 700000
            quantity: 1
      status: 200
      response:
        before:
          subtotalVnd: 700000
          discountVnd: 0
          shippingVnd: 0
          payableVnd: 700000
          totalVnd: 700000
          receipt: subtotal=700000;discount=0;shipping=0;total=700000
        after:
          subtotalVnd: 700000
          discountVnd: 0
          shippingVnd: 0
          payableVnd: 700000
          totalVnd: 700000
          receipt: subtotal=700000;discount=0;shipping=0;total=700000
        equivalent: true
      detailDescription: <p>Đơn chỉ có một dòng giá 700000, quantity=1 và vip=false nên discount bằng 0. <code>PricingPolicy.calculateShipping</code> dùng điều kiện
        payable &gt;= 700000, trả shipping=0 ngay tại biên. <code>LegacyCheckout</code> cũng giữ quy tắc này; cả hai total=700000 và receipt trùng nhau, equivalent=true.</p>
    - id: case_003
      title: Giá âm bị chặn trước khi so sánh
      description: OrderLine từ chối đơn giá âm, API không trả bản tính tiền một phần.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          vip: false
          lines:
          - sku: X
            unitPriceVnd: -2
            quantity: 1
      status: 400
      response:
        error: INVALID_INPUT
      detailDescription: <p><code>CheckoutRefactoringService.compare</code> tạo <code>OrderLine</code> từ input. Constructor record phát hiện unitPriceVnd=-2 nên
        ném <code>IllegalArgumentException</code> trước khi gọi hai phiên bản định giá. <code>RefactoringExceptionHandler</code> trả HTTP 400 với <code>error=INVALID_INPUT</code>,
        không có before hoặc after.</p>
  delivery(DeliveryRequest):
    methodName: delivery
    httpMethods:
    - POST
    mappingPaths:
    - /oop/refactoring/delivery/compare
    usage: true
    cases:
    - id: case_001
      title: Ba loại giao vận giữ nguyên phí và ETA
      description: STANDARD đổi phí ở ngưỡng 500000; EXPRESS và PICKUP khớp ở cả hai phiên bản.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          deliveries:
          - type: STANDARD
            orderValueVnd: 499999
            weightKg: 2
          - type: STANDARD
            orderValueVnd: 500000
            weightKg: 2
          - type: EXPRESS
            orderValueVnd: 40000
            weightKg: 2
          - type: PICKUP
            orderValueVnd: 1
            weightKg: 1
      status: 200
      response:
        deliveries:
        - type: STANDARD
          before:
            feeVnd: 30000
            etaDays: 5
          after:
            feeVnd: 30000
            etaDays: 5
          equivalent: true
        - type: STANDARD
          before:
            feeVnd: 0
            etaDays: 5
          after:
            feeVnd: 0
            etaDays: 5
          equivalent: true
        - type: EXPRESS
          before:
            feeVnd: 65000
            etaDays: 1
          after:
            feeVnd: 65000
            etaDays: 1
          equivalent: true
        - type: PICKUP
          before:
            feeVnd: 0
            etaDays: 0
          after:
            feeVnd: 0
            etaDays: 0
          equivalent: true
        allEquivalent: true
      detailDescription: <p><code>LegacyDeliveryCalculator</code> dùng switch; <code>DeliveryRefactoringService</code> gọi các <code>DeliveryPolicy</code> tương ứng.
        STANDARD với orderValue 499999, weight 2 tính 20000+5000×2=30000, ETA 5; tại 500000 phí về 0. EXPRESS trọng lượng 2 có phí 45000+10000×2=65000, ETA 1; PICKUP
        phí/ETA đều 0. Mọi before/after bằng nhau và allEquivalent=true.</p>
    - id: case_002
      title: Trọng lượng tối đa 1000 kg được báo giá
      description: Phí EXPRESS tại biên 1000 kg vẫn tính bằng số học long.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          deliveries:
          - type: EXPRESS
            orderValueVnd: 0
            weightKg: 1000
      status: 200
      response:
        deliveries:
        - type: EXPRESS
          before:
            feeVnd: 10045000
            etaDays: 1
          after:
            feeVnd: 10045000
            etaDays: 1
          equivalent: true
        allEquivalent: true
      detailDescription: <p><code>DeliveryRefactoringService</code> cho phép weightKg tới 1000. <code>ExpressDeliveryPolicy</code> tính 45000+10000×1000=10045000
        VND, ETA 1. <code>LegacyDeliveryCalculator</code> cũng dùng công thức đó, nên before và after khớp và allEquivalent=true. Giá trị đơn bằng 0 vẫn hợp lệ cho
        EXPRESS.</p>
    - id: case_003
      title: Loại giao vận không thuộc enum bị từ chối
      description: UNKNOWN không có trong DeliveryType nên không được dispatch.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          deliveries:
          - type: UNKNOWN
            orderValueVnd: 1
            weightKg: 1
      status: 400
      response:
        error: INVALID_INPUT
      detailDescription: <p>Input có orderValue và weight hợp lệ nhưng <code>DeliveryType.valueOf(&quot;UNKNOWN&quot;)</code> ném <code>IllegalArgumentException</code>.
        <code>DeliveryRefactoringService</code> chuyển thành lỗi unsupported type và handler trả HTTP 400 <code>error=INVALID_INPUT</code>; không sinh <code>DeliveryResult</code>
        từng phần.</p>
  alerts(AlertRequest):
    methodName: alerts
    httpMethods:
    - POST
    mappingPaths:
    - /oop/refactoring/alerts/experiment
    usage: true
    cases:
    - id: case_001
      title: Hai lượt lỗi tạm thời rồi gửi thành công
      description: RetryingChannel thử tối đa 3 lần và chỉ ghi delivery khi lần thứ ba thành công.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          channel: EMAIL
          recipient: oncall
          incident: Network outage
          transientFailures: 2
          maxAttempts: 3
      status: 200
      response:
        delivered: true
        attempts: 3
        attemptEvents:
        - EMAIL:attempt=1:TEMPORARY_FAILURE
        - EMAIL:attempt=2:TEMPORARY_FAILURE
        - EMAIL:attempt=3:DELIVERED
        deliveredMessages:
        - EMAIL->oncall:[CRITICAL] Network outage
        outcome: DELIVERED
      detailDescription: <p><code>RecordingMessageChannel</code> được cấu hình transientFailures=2. Hai lần đầu ghi sự kiện <code>TEMPORARY_FAILURE</code> rồi ném
        <code>TemporaryDeliveryFailure</code>; <code>RetryingChannel</code> bắt lỗi này và thử lại. Lần ba recorder ghi <code>DELIVERED</code> và thông điệp <code>EMAIL-&gt;oncall:[CRITICAL]
        Network outage</code>. HTTP 200 delivered=true, attempts=3, outcome=DELIVERED.</p>
    - id: case_002
      title: Hết retry không được báo đã gửi thành công
      description: Ba lượt thử đều lỗi tạm thời và không có deliveredMessages.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          channel: SMS
          recipient: oncall
          incident: Database down
          transientFailures: 5
          maxAttempts: 3
      status: 200
      response:
        delivered: false
        attempts: 3
        attemptEvents:
        - SMS:attempt=1:TEMPORARY_FAILURE
        - SMS:attempt=2:TEMPORARY_FAILURE
        - SMS:attempt=3:TEMPORARY_FAILURE
        deliveredMessages: []
        outcome: RETRY_EXHAUSTED
      detailDescription: <p>Recorder được cấu hình lỗi tạm thời trong 5 lượt, nhưng <code>RetryingChannel</code> giới hạn maxAttempts=3. Sau ba lượt <code>TEMPORARY_FAILURE</code>,
        decorator ném lại exception; <code>AlertRefactoringService</code> bắt và trả HTTP 200 delivered=false, attempts=3, outcome=RETRY_EXHAUSTED. <code>deliveredMessages</code>
        vẫn rỗng, tránh thành công giả.</p>
    - id: case_003
      title: Không cần retry khi channel gửi thành công ngay
      description: Một request mới có recorder mới và thành công ở lượt đầu.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          channel: SMS
          recipient: team
          incident: Recovered
          transientFailures: 0
          maxAttempts: 3
      status: 200
      response:
        delivered: true
        attempts: 1
        attemptEvents:
        - SMS:attempt=1:DELIVERED
        deliveredMessages:
        - SMS->team:[CRITICAL] Recovered
        outcome: DELIVERED
      detailDescription: <p>Với transientFailures=0, <code>RecordingMessageChannel.send</code> tăng attempts lên 1 rồi ghi DELIVERED ngay. Không có <code>TemporaryDeliveryFailure</code>
        nên <code>RetryingChannel</code> không gọi thêm lần nào; service trả SMS đã ghi trong bộ nhớ và outcome=DELIVERED. Mỗi request tạo recorder mới, không lấy
        lại counter request cũ.</p>
    - id: case_004
      title: maxAttempts bằng 0 bị từ chối
      description: RetryingChannel chỉ cho phép từ 1 đến 5 lần thử.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          channel: EMAIL
          recipient: oncall
          incident: Outage
          transientFailures: 1
          maxAttempts: 0
      status: 400
      response:
        error: INVALID_INPUT
      detailDescription: <p><code>AlertRefactoringService</code> tạo recorder hợp lệ rồi khởi tạo <code>RetryingChannel</code> với maxAttempts=0. Constructor decorator
        kiểm tra phạm vi 1–5, ném <code>IllegalArgumentException</code> trước khi <code>AlertDispatcher</code> được dùng. Advice trả HTTP 400 <code>error=INVALID_INPUT</code>;
        không có attemptEvents thành công hoặc thất bại.</p>
RelationshipsExperimentsController:
  transfer(TransferRequest):
    methodName: transfer
    httpMethods:
    - POST
    mappingPaths:
    - /oop/relationships/departments/transfer
    usage: true
    cases:
    - id: case_001
      title: Chuyển phòng, gỡ phân công và thao tác không đổi
      description: Theo dõi hai đầu liên kết qua bốn thao tác.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          departments:
          - code: A
            capacity: 2
          - code: B
            capacity: 1
          employees:
          - id: E1
            departmentCode: A
          - id: E2
            departmentCode: null
          actions:
          - employeeId: E1
            targetDepartmentCode: B
          - employeeId: E2
            targetDepartmentCode: A
          - employeeId: E1
            targetDepartmentCode: null
          - employeeId: E2
            targetDepartmentCode: A
      status: 200
      response:
        events:
        - step: 1
          employeeId: E1
          previousDepartment: A
          targetDepartment: B
          accepted: true
          reason: MOVED
        - step: 2
          employeeId: E2
          previousDepartment: null
          targetDepartment: A
          accepted: true
          reason: MOVED
        - step: 3
          employeeId: E1
          previousDepartment: B
          targetDepartment: null
          accepted: true
          reason: MOVED
        - step: 4
          employeeId: E2
          previousDepartment: A
          targetDepartment: A
          accepted: true
          reason: UNCHANGED
        departments:
        - code: A
          capacity: 2
          employees:
          - E2
        - code: B
          capacity: 1
          employees: []
        employees:
        - id: E1
          departmentCode: null
        - id: E2
          departmentCode: A
        invariantHolds: true
        simulatedOnly: true
      detailDescription: <p>Ban đầu E1 ở A, E2 chưa có phòng. E1 chuyển sang B, E2 vào A, E1 ra khỏi B, E2 lại được yêu cầu chuyển vào A. Ba bước đầu trả MOVED, bước
        cuối UNCHANGED. Cuối cùng A chứa E2 và B trống; invariantHolds=true.</p>
    - id: case_002
      title: Phòng đích đầy vẫn giữ liên kết cũ
      description: B đã đầy nên E1 không thể rời A để vào B.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          departments:
          - code: A
            capacity: 1
          - code: B
            capacity: 1
          employees:
          - id: E1
            departmentCode: A
          - id: E2
            departmentCode: B
          actions:
          - employeeId: E1
            targetDepartmentCode: B
      status: 200
      response:
        events:
        - step: 1
          employeeId: E1
          previousDepartment: A
          targetDepartment: B
          accepted: false
          reason: DEPARTMENT_FULL
        departments:
        - code: A
          capacity: 1
          employees:
          - E1
        - code: B
          capacity: 1
          employees:
          - E2
        employees:
        - id: E1
          departmentCode: A
        - id: E2
          departmentCode: B
        invariantHolds: true
        simulatedOnly: true
      detailDescription: <p>B đã có E2, đạt capacity=1. Hàm move kiểm tra chỗ trống của target trước khi gỡ E1 khỏi A, nên sự kiện DEPARTMENT_FULL có accepted=false.
        E1 vẫn ở A, E2 vẫn ở B, HTTP 200.</p>
    - id: case_003
      title: Từ chối nhân viên không tồn tại
      description: E9 không có trong tập nhân viên.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          departments:
          - code: A
            capacity: 1
          employees:
          - id: E1
            departmentCode: A
          actions:
          - employeeId: E9
            targetDepartmentCode: A
      status: 400
      response:
        code: INVALID_INPUT
        message: 'Unknown employee: E9'
      detailDescription: <p>DepartmentGraph.transfer kiểm tra toàn bộ employeeId trước vòng thực thi; E9 không có trong graph nên phát sinh IllegalArgumentException,
        response HTTP 400 với code INVALID_INPUT.</p>
    - id: case_004
      title: Từ chối phòng ban đích không tồn tại
      description: Target MISSING chưa được khai báo.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          departments:
          - code: A
            capacity: 1
          employees:
          - id: E1
            departmentCode: A
          actions:
          - employeeId: E1
            targetDepartmentCode: MISSING
      status: 400
      response:
        code: INVALID_INPUT
        message: 'Unknown target department: MISSING'
      detailDescription: <p>Với targetDepartmentCode khác null, graph yêu cầu mã phòng phải có trong departments. MISSING là mã không hợp lệ nên HTTP 400 trước bất
        kỳ lần chuyển nào.</p>
    - id: case_005
      title: Từ chối phân công ban đầu vượt sức chứa
      description: E1 và E2 cùng được gán ban đầu vào A sức chứa 1.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          departments:
          - code: A
            capacity: 1
          employees:
          - id: E1
            departmentCode: A
          - id: E2
            departmentCode: A
          actions:
          - employeeId: E1
            targetDepartmentCode: null
      status: 400
      response:
        code: INVALID_INPUT
        message: Initial department exceeds capacity
      detailDescription: <p>Constructor của DepartmentGraph gắn E1 vào A trước; E2 cũng yêu cầu A nhưng sức chứa đã đầy, do đó ném IllegalArgumentException Initial
        department exceeds capacity và trả HTTP 400.</p>
  enroll(EnrollmentRequest):
    methodName: enroll
    httpMethods:
    - POST
    mappingPaths:
    - /oop/relationships/enrollments/simulate
    usage: true
    cases:
    - id: case_001
      title: Đăng ký nhiều–nhiều, trùng và hủy liên kết
      description: Ba ghi danh được tạo, một ghi danh trùng và một lần hủy.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          studentIds:
          - S1
          - S2
          courseIds:
          - C1
          - C2
          actions:
          - operation: ENROLL
            studentId: S1
            courseId: C1
          - operation: ENROLL
            studentId: S1
            courseId: C2
          - operation: ENROLL
            studentId: S2
            courseId: C1
          - operation: ENROLL
            studentId: S1
            courseId: C1
          - operation: CANCEL
            studentId: S1
            courseId: C2
      status: 200
      response:
        events:
        - step: 1
          operation: ENROLL
          studentId: S1
          courseId: C1
          accepted: true
          outcome: CREATED
          notificationSent: true
        - step: 2
          operation: ENROLL
          studentId: S1
          courseId: C2
          accepted: true
          outcome: CREATED
          notificationSent: true
        - step: 3
          operation: ENROLL
          studentId: S2
          courseId: C1
          accepted: true
          outcome: CREATED
          notificationSent: true
        - step: 4
          operation: ENROLL
          studentId: S1
          courseId: C1
          accepted: false
          outcome: DUPLICATE_ENROLLMENT
          notificationSent: false
        - step: 5
          operation: CANCEL
          studentId: S1
          courseId: C2
          accepted: true
          outcome: CANCELLED
          notificationSent: false
        activeEnrollments:
        - studentId: S1
          courseId: C1
          enrollmentSequence: 1
        - studentId: S2
          courseId: C1
          enrollmentSequence: 3
        notificationsSent: 3
        uniquePairs: true
        simulatedOnly: true
      detailDescription: <p>S1 ghi danh C1 (sequence 1), C2 (sequence 2); S2 ghi danh C1 (sequence 3). Lặp ENROLL S1/C1 bị DUPLICATE_ENROLLMENT và không tăng thông
        báo. Hủy S1/C2 thành công; còn S1/C1, S2/C1, notificationsSent=3, uniquePairs=true, HTTP 200.</p>
    - id: case_002
      title: Hủy rồi đăng ký lại nhận sequence mới
      description: CANCEL khi chưa có liên kết, sau đó ENROLL–CANCEL–ENROLL.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          studentIds:
          - S
          courseIds:
          - C
          actions:
          - operation: CANCEL
            studentId: S
            courseId: C
          - operation: ENROLL
            studentId: S
            courseId: C
          - operation: CANCEL
            studentId: S
            courseId: C
          - operation: ENROLL
            studentId: S
            courseId: C
      status: 200
      response:
        events:
        - step: 1
          operation: CANCEL
          studentId: S
          courseId: C
          accepted: false
          outcome: NOT_ENROLLED
          notificationSent: false
        - step: 2
          operation: ENROLL
          studentId: S
          courseId: C
          accepted: true
          outcome: CREATED
          notificationSent: true
        - step: 3
          operation: CANCEL
          studentId: S
          courseId: C
          accepted: true
          outcome: CANCELLED
          notificationSent: false
        - step: 4
          operation: ENROLL
          studentId: S
          courseId: C
          accepted: true
          outcome: CREATED
          notificationSent: true
        activeEnrollments:
        - studentId: S
          courseId: C
          enrollmentSequence: 2
        notificationsSent: 2
        uniquePairs: true
        simulatedOnly: true
      detailDescription: <p>CANCEL lúc chưa có cặp S/C trả NOT_ENROLLED. ENROLL tiếp theo tạo liên kết số 1 và gửi notification; CANCEL xóa, ENROLL mới tạo liên kết
        số 2 và gửi notification thứ hai. Sequence gắn với liên kết, không phải cố định theo học viên.</p>
    - id: case_003
      title: Từ chối khóa học không tồn tại
      description: C9 không có trong tập courseIds.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          studentIds:
          - S1
          courseIds:
          - C1
          actions:
          - operation: ENROLL
            studentId: S1
            courseId: C9
      status: 400
      response:
        code: INVALID_INPUT
        message: Enrollment references an unknown student or course
      detailDescription: <p>Registry.validateActions kiểm tra courseId C9 phải thuộc tập khóa học đã khai báo. Do không có C9, service từ chối toàn bộ request trước
        vòng thực thi, HTTP 400 INVALID_INPUT.</p>
    - id: case_004
      title: Từ chối studentId trùng
      description: Hai student ID đều bằng S.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          studentIds:
          - S
          - S
          courseIds:
          - C
          actions:
          - operation: ENROLL
            studentId: S
            courseId: C
      status: 400
      response:
        code: INVALID_INPUT
        message: 'Duplicate entry in studentIds: S'
      detailDescription: '<p>EnrollmentRegistry.validateIds từ chối studentIds trùng nhau trước khi tạo liên kết: Duplicate entry in studentIds: S, HTTP 400.</p>'
    - id: case_005
      title: Từ chối operation REGISTER
      description: REGISTER không thuộc ENROLL/CANCEL.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          studentIds:
          - S
          courseIds:
          - C
          actions:
          - operation: REGISTER
            studentId: S
            courseId: C
      status: 400
      response:
        code: INVALID_INPUT
        message: operation must be ENROLL or CANCEL
      detailDescription: <p>EnrollmentRegistry.validateActions chỉ chấp nhận đúng ENROLL hoặc CANCEL. REGISTER sinh IllegalArgumentException và handler trả HTTP 400
        với message của model.</p>
  ownership(OwnershipRequest):
    methodName: ownership
    httpMethods:
    - POST
    mappingPaths:
    - /oop/relationships/ownership/compare
    usage: true
    cases:
    - id: case_001
      title: Đóng Order xóa line nhưng không xóa Member
      description: Gỡ An khỏi Team và đóng Order gồm hai dòng.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          teamId: TEAM-A
          memberIds:
          - An
          - Binh
          removeMemberId: An
          orderId: ORDER-1
          orderLines:
          - sku: BOOK
            quantity: 2
            unitPriceVnd: 20000
          - sku: PEN
            quantity: 1
            unitPriceVnd: 5000
          closeOrder: true
      status: 200
      response:
        teamId: TEAM-A
        teamMembersAfterRemoval:
        - Binh
        removedMemberStillExistsIndependently: true
        orderId: ORDER-1
        orderTotalBeforeCloseVnd: 45000
        ownedLinesBeforeClose: 2
        ownedLinesAfterAction: 0
        orderClosed: true
        simulatedOnly: true
      detailDescription: '<p>Directory có An và Binh, nhưng Team chỉ giữ liên kết tới họ; khi bỏ An, danh sách thành viên còn Binh mà removedMemberStillExistsIndependently=true.
        Order tạo hai dòng trị giá 40000 và 5000 VND, tổng 45000. Đóng đơn gọi close(), xóa cả hai OrderLine: ownedLinesBeforeClose=2, ownedLinesAfterAction=0, orderClosed=true.</p>'
    - id: case_002
      title: Order mở tiếp tục giữ các line
      description: Gỡ An nhưng vẫn giữ Order ở trạng thái mở.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          teamId: TEAM-A
          memberIds:
          - An
          - Binh
          removeMemberId: An
          orderId: ORDER-1
          orderLines:
          - sku: BOOK
            quantity: 2
            unitPriceVnd: 20000
          - sku: PEN
            quantity: 1
            unitPriceVnd: 5000
          closeOrder: false
      status: 200
      response:
        teamId: TEAM-A
        teamMembersAfterRemoval:
        - Binh
        removedMemberStillExistsIndependently: true
        orderId: ORDER-1
        orderTotalBeforeCloseVnd: 45000
        ownedLinesBeforeClose: 2
        ownedLinesAfterAction: 2
        orderClosed: false
        simulatedOnly: true
      detailDescription: '<p>Cùng dữ liệu nhưng closeOrder=false: Team vẫn bỏ An trong khi directory còn An. Order không bị đóng, nên ownedLinesAfterAction vẫn 2,
        orderClosed=false và tổng trước thao tác là 45000 VND.</p>'
    - id: case_003
      title: Từ chối xóa Member không có trong Team
      description: Y không có trong danh sách memberIds chỉ gồm X.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          teamId: T
          memberIds:
          - X
          removeMemberId: Y
          orderId: O
          orderLines:
          - sku: SKU
            quantity: 1
            unitPriceVnd: 1
          closeOrder: true
      status: 400
      response:
        code: INVALID_INPUT
        message: Member to remove is not part of the team
      detailDescription: <p>OwnershipScenario.compare yêu cầu removeMemberId đã xuất hiện trong memberIds. Với Y khi chỉ có X, model ném IllegalArgumentException
        Member to remove is not part of the team và handler trả HTTP 400 INVALID_INPUT.</p>
    - id: case_004
      title: Từ chối hai OrderLine trùng SKU
      description: Hai dòng thuộc một Order có cùng SKU.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          teamId: T
          memberIds:
          - X
          removeMemberId: X
          orderId: O
          orderLines:
          - sku: SKU
            quantity: 1
            unitPriceVnd: 1
          - sku: SKU
            quantity: 1
            unitPriceVnd: 2
          closeOrder: true
      status: 400
      response:
        code: INVALID_INPUT
        message: Invalid or duplicate order line
      detailDescription: <p>Order.add quản lý tập SKU không trùng. Lần thêm SKU thứ hai khiến skus.add(sku) trả false và sinh IllegalArgumentException Invalid or
        duplicate order line; HTTP 400 trước khi có một kết quả OwnershipResponse.</p>
    - id: case_005
      title: Phát hiện tràn số khi tính giá trị OrderLine
      description: Số lượng 2 nhân đơn giá Long.MAX_VALUE làm tràn long.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          teamId: A
          memberIds:
          - An
          removeMemberId: An
          orderId: O1
          orderLines:
          - sku: BOOK
            quantity: 2
            unitPriceVnd: 9223372036854775807
          closeOrder: true
      status: 422
      response:
        code: ARITHMETIC_OVERFLOW
        message: Calculation exceeded supported numeric limits
      detailDescription: <p>Order.add tính giá trị bằng Math.multiplyExact(quantity,unitPriceVnd). 2 nhân Long.MAX_VALUE vượt giới hạn kiểu long, nên RelationshipsExceptionHandler
        trả HTTP 422 với code ARITHMETIC_OVERFLOW và thông điệp Calculation exceeded supported numeric limits.</p>
SolidExperimentController:
  quote(QuoteRequest):
    methodName: quote
    httpMethods:
    - POST
    mappingPaths:
    - /oop/solid/discount/quote
    usage: true
    cases:
    - id: case_001
      title: NONE không giảm giá
      description: Chính sách NONE giữ nguyên số tiền đầu vào 105 cent.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policyCode: NONE
          subtotalCents: 105
      status: 200
      response:
        policyCode: NONE
        subtotalCents: 105
        discountCents: 0
        payableCents: 105
      detailDescription: <p><code>NoDiscountPolicy.discountCents</code> luôn trả 0. Với subtotal 105, <code>DiscountPricing.quote</code> kiểm tra 0 nằm trong khoảng
        cho phép rồi giữ payable=105. Case nhấn mạnh mở rộng các policy qua cùng một hợp đồng.</p>
    - id: case_002
      title: TEN_PERCENT làm tròn bằng phép chia nguyên
      description: Giảm 10% của 999 cent bằng phép chia số nguyên.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policyCode: TEN_PERCENT
          subtotalCents: 999
      status: 200
      response:
        policyCode: TEN_PERCENT
        subtotalCents: 999
        discountCents: 99
        payableCents: 900
      detailDescription: <p><code>TenPercentPolicy</code> dùng <code>subtotalCents / 10</code> trên long. Vì vậy 999 / 10 = 99 cent, payable=900. Đây là làm tròn
        phần tiền giảm xuống chứ không phải làm tròn số thực.</p>
    - id: case_003
      title: LOYALTY dưới ngưỡng 50000
      description: 49999 cent chưa đủ điều kiện nhận giảm giá khách hàng trung thành.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policyCode: LOYALTY
          subtotalCents: 49999
      status: 200
      response:
        policyCode: LOYALTY
        subtotalCents: 49999
        discountCents: 0
        payableCents: 49999
      detailDescription: <p><code>LoyaltyPolicy</code> kiểm tra subtotal nhỏ hơn 50000 và trả 0. Số tiền 49999 vì thế không được giảm, payable vẫn bằng 49999. Không
        có side effect nào trong phép tính báo giá.</p>
    - id: case_004
      title: LOYALTY đạt ngưỡng 50000
      description: 50000 cent được giảm 15% theo chính sách LOYALTY.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policyCode: LOYALTY
          subtotalCents: 50000
      status: 200
      response:
        policyCode: LOYALTY
        subtotalCents: 50000
        discountCents: 7500
        payableCents: 42500
      detailDescription: <p><code>LoyaltyPolicy</code> qua ngưỡng từ 50000 cent, tính giảm 15% bằng phép chia và phần dư để tránh phép nhân gây tràn long. 50000 ×
        15% = 7500; payable=42500, HTTP 200.</p>
    - id: case_005
      title: Policy lỗi bị từ chối do vi phạm LSP
      description: BROKEN_NEGATIVE thực thi interface nhưng trả discount âm.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policyCode: BROKEN_NEGATIVE
          subtotalCents: 100
      status: 422
      response:
        code: POLICY_CONTRACT
        message: policy BROKEN_NEGATIVE violated 0 <= discount <= subtotal
      detailDescription: <p><code>BrokenNegativeDiscountPolicy.discountCents</code> cố ý trả -1. <code>DiscountPricing.quote</code> kiểm tra hậu điều kiện <code>0
        &lt;= discount &lt;= subtotal</code>, ném <code>PolicyContractException</code> trước khi tạo QuoteResult; advice trả HTTP 422 với code POLICY_CONTRACT.</p>
    - id: case_006
      title: Policy không có trong registry
      description: Mã MISSING không tồn tại trong danh sách các DiscountPolicy.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policyCode: MISSING
          subtotalCents: 100
      status: 400
      response:
        code: INVALID_INPUT
        message: 'unknown discount policy: MISSING'
      detailDescription: '<p><code>DiscountPricing</code> tra cứu policy theo map đã được tạo từ các implementation. MISSING không có key, nên <code>IllegalArgumentException</code>
        với message <code>unknown discount policy: MISSING</code> được đổi thành HTTP 400.</p>'
    - id: case_007
      title: Từ chối subtotal âm
      description: subtotalCents là số tiền đơn hàng, không được âm.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policyCode: NONE
          subtotalCents: -1
      status: 400
      response:
        code: INVALID_INPUT
        message: subtotalCents must be nonnegative
      detailDescription: <p><code>DiscountPricing.quote</code> kiểm tra subtotal không âm trước khi lấy policy; -1 ném <code>IllegalArgumentException</code> và trả
        HTTP 400 INVALID_INPUT, thay vì tạo báo giá âm.</p>
  experiment(ExperimentRequest):
    methodName: experiment
    httpMethods:
    - POST
    mappingPaths:
    - /oop/solid/checkout/experiment
    usage: true
    cases:
    - id: case_001
      title: Một đơn thành công, policy lỗi và orderId trùng
      description: Chuỗi ba lần chạy cho thấy chỉ đơn hợp lệ được lưu và có thông báo.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          attempts:
          - orderId: ORD-1
            policyCode: TEN_PERCENT
            lines:
            - sku: BOOK
              quantity: 2
              unitPriceCents: 100
          - orderId: ORD-2
            policyCode: BROKEN_NEGATIVE
            lines:
            - sku: BOOK
              quantity: 1
              unitPriceCents: 100
          - orderId: ORD-1
            policyCode: NONE
            lines:
            - sku: PEN
              quantity: 1
              unitPriceCents: 20
      status: 200
      response:
        attempts:
        - index: 1
          orderId: ORD-1
          accepted: true
          rule: null
          detail: order stored and simulated receipt recorded
          receipt:
            orderId: ORD-1
            policyCode: TEN_PERCENT
            subtotalCents: 200
            discountCents: 20
            payableCents: 180
          storedCount: 1
          noticeCount: 1
        - index: 2
          orderId: ORD-2
          accepted: false
          rule: POLICY_CONTRACT
          detail: policy BROKEN_NEGATIVE violated 0 <= discount <= subtotal
          receipt: null
          storedCount: 1
          noticeCount: 1
        - index: 3
          orderId: ORD-1
          accepted: false
          rule: ORDER_CONFLICT
          detail: 'duplicate orderId: ORD-1'
          receipt: null
          storedCount: 1
          noticeCount: 1
        storedOrders:
        - orderId: ORD-1
          policyCode: TEN_PERCENT
          subtotalCents: 200
          discountCents: 20
          payableCents: 180
        notices:
        - orderId: ORD-1
          payableCents: 180
        countsConsistent: true
        scope: REQUEST_LOCAL_SIMULATION; NO_DATABASE_OR_ACTUAL_EMAIL; NO_TRANSACTION_ACROSS_EXTERNAL_ADAPTERS
      detailDescription: <p><code>ORD-1</code> có hai BOOK giá 100 cent, subtotal 200, TEN_PERCENT giảm 20 và ghi receipt payable 180. ORD-2 dùng BROKEN_NEGATIVE
        vi phạm hợp đồng nên rule POLICY_CONTRACT, không lưu/gửi notice. ORD-1 tiếp theo lại trùng ID đã có; <code>MemoryOrderStore.save</code> từ chối ORDER_CONFLICT
        trước khi sender chạy. Kết thúc chỉ một storedOrder và một notice, countsConsistent=true, HTTP 200.</p>
    - id: case_002
