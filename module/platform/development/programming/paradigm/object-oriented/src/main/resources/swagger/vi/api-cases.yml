AbstractionExperimentsController:
  shippingQuote(ShippingQuoteRequest):
    methodName: shippingQuote
    httpMethods:
    - POST
    mappingPaths:
    - /oop/abstraction/shipping/quote
    usage: true
    cases:
    - id: case_001
      title: ECONOMY tính phí quãng đường
      description: Quãng đường 5 km và 1500 g làm tròn thành 2 kg, phí ECONOMY 15000 VND.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          plan: ECONOMY
          distanceKm: 5
          weightGrams: 1500
      status: 200
      response:
        plan: ECONOMY
        distanceKm: 5
        weightGrams: 1500
        billedKilograms: 2
        baseFeeVnd: 10000
        extraFeeVnd: 5000
        totalFeeVnd: 15000
        simulatedOnly: true
      detailDescription: <p><code>ECONOMY</code> có <code>baseFeeVnd=10000</code>; <code>extraFeeVnd=1000×5=5000</code>. Trọng lượng 1500 g làm tròn lên 2 kg, không
        làm tăng phí của Economy. Tổng 15000 VND, HTTP 200.</p>
    - id: case_002
      title: EXPRESS tính cả quãng đường và khối lượng
      description: EXPRESS cùng quãng đường/cân nặng có phí gốc và hai khoản phụ phí.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          plan: ' EXPRESS '
          distanceKm: 5
          weightGrams: 1500
      status: 200
      response:
        plan: EXPRESS
        distanceKm: 5
        weightGrams: 1500
        billedKilograms: 2
        baseFeeVnd: 20000
        extraFeeVnd: 16000
        totalFeeVnd: 36000
        simulatedOnly: true
      detailDescription: <p>Plan EXPRESS có phí gốc 20000, thêm quãng đường 2000×5=10000 và trọng lượng 3000×2=6000; tổng 36000. Đây là thay đổi thuật toán trong
        <code>extraFee</code> nhưng hợp đồng <code>quote</code> không đổi.</p>
    - id: case_003
      title: Từ chối khoảng cách bằng 0
      description: distanceKm=0 không đạt điều kiện dương của template method.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          plan: ECONOMY
          distanceKm: 0
          weightGrams: 1000
      status: 400
      response:
        code: INVALID_INPUT
        message: distanceKm and weightGrams must be positive
      detailDescription: <p><code>ShippingPlan.quote</code> là final và kiểm tra <code>distanceKm &gt; 0</code> trước khi tính. distanceKm=0 tạo <code>IllegalArgumentException</code>;
        handler trả HTTP 400 mã INVALID_INPUT.</p>
    - id: case_004
      title: Từ chối loại vận chuyển không có
      description: OVERNIGHT không nằm trong ECONOMY/EXPRESS.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          plan: OVERNIGHT
          distanceKm: 5
          weightGrams: 1000
      status: 400
      response:
        code: INVALID_INPUT
        message: 'Unknown shipping plan: OVERNIGHT'
      detailDescription: '<p><code>ShippingPlan.named</code> chuẩn hóa chuỗi nhưng chỉ chấp nhận ECONOMY/EXPRESS. OVERNIGHT đi vào nhánh default và tạo thông báo
        <code>Unknown shipping plan: OVERNIGHT</code>, trả HTTP 400.</p>'
  seatScenario(SeatScenarioRequest):
    methodName: seatScenario
    httpMethods:
    - POST
    mappingPaths:
    - /oop/abstraction/seats/simulate
    usage: true
    cases:
    - id: case_001
      title: Đặt và trả ghế, bảo toàn trạng thái khi từ chối
      description: Chuỗi hợp lệ và hai hành động bị từ chối nhưng vẫn trả HTTP 200 cùng snapshot từng bước.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 10
          actions:
          - operation: RESERVE
            seats: 3
          - operation: RELEASE
            seats: 1
          - operation: RESERVE
            seats: 9
          - operation: RELEASE
            seats: 4
      status: 200
      response:
        capacity: 10
        available: 8
        reserved: 2
        steps:
        - step: 1
          operation: RESERVE
          seats: 3
          availableBefore: 10
          availableAfter: 7
          accepted: true
          rejectionCode: null
        - step: 2
          operation: RELEASE
          seats: 1
          availableBefore: 7
          availableAfter: 8
          accepted: true
          rejectionCode: null
        - step: 3
          operation: RESERVE
          seats: 9
          availableBefore: 8
          availableAfter: 8
          accepted: false
          rejectionCode: INSUFFICIENT_SEATS
        - step: 4
          operation: RELEASE
          seats: 4
          availableBefore: 8
          availableAfter: 8
          accepted: false
          rejectionCode: RELEASE_EXCEEDS_RESERVED
        simulatedOnly: true
      detailDescription: '<p>Bắt đầu available=10: RESERVE 3 còn 7, RELEASE 1 thành 8. RESERVE 9 vượt 8 nên bước 3 bị từ chối <code>INSUFFICIENT_SEATS</code>. RELEASE
        4 khi chỉ 2 ghế đã đặt bị từ chối <code>RELEASE_EXCEEDS_RESERVED</code>. Hai bước lỗi giữ available=8, response HTTP 200.</p>'
    - id: case_002
      title: Chuẩn hóa operation trước thực thi
      description: Operation có khoảng trắng/chữ thường được chuyển thành RESERVE.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 3
          actions:
          - operation: ' reserve '
            seats: 2
      status: 200
      response:
        capacity: 3
        available: 1
        reserved: 2
        steps:
        - step: 1
          operation: RESERVE
          seats: 2
          availableBefore: 3
          availableAfter: 1
          accepted: true
          rejectionCode: null
        simulatedOnly: true
      detailDescription: <p>Service trim và uppercase operation trước khi sử dụng. Chuỗi <code> reserve </code> trở thành RESERVE, đặt 2 ghế trong capacity 3 còn
        available=1.</p>
    - id: case_003
      title: Sức chứa không hợp lệ
      description: capacity=0 vi phạm ranh giới 1..1000000.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 0
          actions:
          - operation: RESERVE
            seats: 1
      status: 400
      response:
        code: INVALID_INPUT
        message: capacity must be from 1 to 1000000
      detailDescription: <p><code>SeatContractService</code> kiểm tra capacity trước khi tạo inventory; giá trị 0 gây IllegalArgumentException và HTTP 400 INVALID_INPUT.</p>
    - id: case_004
      title: Operation không hợp lệ
      description: BUY không thuộc RESERVE hoặc RELEASE.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 10
          actions:
          - operation: BUY
            seats: 1
      status: 400
      response:
        code: INVALID_INPUT
        message: Operation must be RESERVE or RELEASE
      detailDescription: <p>BUY bị từ chối trong pha xác minh toàn bộ action; handler trả HTTP 400 trước khi khởi tạo SeatInventory.</p>
    - id: case_005
      title: Bước phía sau sai khiến cả request bị từ chối
      description: Action thứ hai có seats=0 khiến service kiểm tra toàn bộ request trước khi chạy bước đầu.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 10
          actions:
          - operation: RESERVE
            seats: 1
          - operation: RELEASE
            seats: 0
      status: 400
      response:
        code: INVALID_INPUT
        message: Every action requires an operation and positive seats
      detailDescription: <p>Dù action đầu RESERVE 1 hợp lệ, action sau RELEASE 0 vi phạm tiền điều kiện số ghế dương. Service kiểm tra cả danh sách trước vòng lặp
        nên HTTP 400, không trả một kịch bản đã chạy một phần.</p>
  leaveEvaluation(LeaveEvaluationRequest):
    methodName: leaveEvaluation
    httpMethods:
    - POST
    mappingPaths:
    - /oop/abstraction/leave/evaluate
    usage: true
    cases:
    - id: case_001
      title: STANDARD phê duyệt đủ số ngày
      description: Nghỉ 3 ngày khi còn 5 ngày với STANDARD được phê duyệt.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policy: STANDARD
          employeeId: NV-01
          requestedDays: 3
          remainingDays: 5
      status: 200
      response:
        policy: STANDARD
        employeeId: NV-01
        decisionCode: APPROVED
        approved: true
        reason: Balance is sufficient
        simulatedOnly: true
      detailDescription: <p><code>StandardLeavePolicy</code> thấy requestedDays=3 không vượt remainingDays=5, nên trả APPROVED, approved=true, reason=Balance is sufficient
        và không trừ ngày phép.</p>
    - id: case_002
      title: TRIAL từ chối vượt giới hạn hai ngày
      description: Cùng dữ liệu với TRIAL bị từ chối do giới hạn 2 ngày.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policy: TRIAL
          employeeId: NV-01
          requestedDays: 3
          remainingDays: 5
      status: 200
      response:
        policy: TRIAL
        employeeId: NV-01
        decisionCode: EXCEEDS_TRIAL_LIMIT
        approved: false
        reason: Trial policy permits at most two days per request
        simulatedOnly: true
      detailDescription: <p>TrialLeavePolicy thấy số ngày còn lại đủ nhưng requestedDays=3 vượt mức tối đa 2; trả EXCEEDS_TRIAL_LIMIT và approved=false trong HTTP
        200. Đây là quyết định chính sách, không phải exception.</p>
    - id: case_003
      title: Cả hai chính sách đều chặn vượt số dư
      description: Xin 6 ngày khi chỉ còn 5 ngày bị từ chối vì số dư trước khi xét giới hạn TRIAL.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policy: TRIAL
          employeeId: NV-01
          requestedDays: 6
          remainingDays: 5
      status: 200
      response:
        policy: TRIAL
        employeeId: NV-01
        decisionCode: INSUFFICIENT_BALANCE
        approved: false
        reason: Requested days exceed remaining balance
        simulatedOnly: true
      detailDescription: '<p>TrialLeavePolicy kiểm tra điều kiện số dư trước giới hạn 2 ngày: xin 6 khi còn 5 nhận INSUFFICIENT_BALANCE. Quy tắc chung của interface
        không cho phê duyệt vượt ngày còn lại.</p>'
    - id: case_004
      title: TRIAL chấp nhận đúng hai ngày
      description: Chuỗi policy và employeeId được chuẩn hóa trước khi trả.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policy: trial
          employeeId: ' NV-X '
          requestedDays: 2
          remainingDays: 2
      status: 200
      response:
        policy: TRIAL
        employeeId: NV-X
        decisionCode: APPROVED
        approved: true
        reason: Trial rules are satisfied
        simulatedOnly: true
      detailDescription: <p>Service đổi trial thành TRIAL, <code>LeaveRequest</code> trim employeeId thành NV-X; yêu cầu đúng 2 ngày được phê duyệt với reason=Trial
        rules are satisfied.</p>
    - id: case_005
      title: Ngày xin nghỉ bằng 0
      description: requestedDays=0 không hợp lệ ngay trong LeaveRequest.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policy: STANDARD
          employeeId: NV-01
          requestedDays: 0
          remainingDays: 5
      status: 400
      response:
        code: INVALID_INPUT
        message: Invalid leave request
      detailDescription: <p>Constructor <code>LeaveRequest</code> cấm requestedDays không dương. Giá trị 0 ném IllegalArgumentException, được chuyển thành HTTP 400
        với message Invalid leave request.</p>
    - id: case_006
      title: Mã chính sách không có
      description: Policy OTHER không có triển khai.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          policy: OTHER
          employeeId: NV-01
          requestedDays: 1
          remainingDays: 5
      status: 400
      response:
        code: INVALID_INPUT
        message: 'Unknown leave policy: OTHER'
      detailDescription: '<p>LeaveEvaluationService switch không có OTHER, nên ném IllegalArgumentException cùng chuỗi Unknown leave policy: OTHER; handler trả HTTP
        400.</p>'
  catalogSearch(CatalogSearchRequest):
    methodName: catalogSearch
    httpMethods:
    - POST
    mappingPaths:
    - /oop/abstraction/catalog/search
    usage: true
    cases:
    - id: case_001
      title: Tìm sách và tra ISBN không lộ Map
      description: Keyword JAVA tìm 2 sách và tra S-02 dù sách này không nằm trong kết quả keyword.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          books:
          - isbn: S-02
            title: Spring Data
          - isbn: J-03
            title: Advanced Java
          - isbn: J-01
            title: Java OOP
          keyword: ' JAVA '
          limit: 2
          lookupIsbn: S-02
      status: 200
      response:
        matches:
        - isbn: J-01
          title: Java OOP
        - isbn: J-03
          title: Advanced Java
        lookup:
          isbn: S-02
          title: Spring Data
        found: true
        totalMatches: 2
        simulatedOnly: true
      detailDescription: <p>Keyword JAVA được trim và chuyển lower-case, tìm Java OOP và Advanced Java; sắp xếp ISBN J-01, J-03. Tra cứu S-02 riêng trả Spring Data;
        <code>totalMatches=2</code>, found=true. Map nội bộ không xuất hiện trong JSON.</p>
    - id: case_002
      title: Giới hạn kết quả và không tìm thấy ISBN
      description: limit=1 giữ tổng số match là 2, ISBN MISSING trả null.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          books:
          - isbn: S-02
            title: Spring Data
          - isbn: J-03
            title: Advanced Java
          - isbn: J-01
            title: Java OOP
          keyword: java
          limit: 1
          lookupIsbn: MISSING
      status: 200
      response:
        matches:
        - isbn: J-01
          title: Java OOP
        lookup: null
        found: false
        totalMatches: 2
        simulatedOnly: true
      detailDescription: <p>Với limit=1, chỉ J-01 được trả nhưng totalMatches vẫn bằng 2. ISBN MISSING không có, nên lookup=null và found=false, response HTTP 200.</p>
    - id: case_003
      title: Từ chối ISBN trùng nhau
      description: Hai BookInput có ISBN X vi phạm tính duy nhất.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          books:
          - isbn: X
            title: One
          - isbn: X
            title: Two
          keyword: java
          limit: 2
          lookupIsbn: null
      status: 400
      response:
        code: INVALID_INPUT
        message: 'Duplicate ISBN: X'
      detailDescription: '<p>InMemoryCatalog dùng <code>putIfAbsent</code> theo ISBN; bản ghi thứ hai cùng X gây IllegalArgumentException Duplicate ISBN: X. Handler
        trả HTTP 400 và không cung cấp state của Map.</p>'
    - id: case_004
      title: Từ chối ISBN tra cứu chỉ có khoảng trắng
      description: lookupIsbn rỗng sau trim bị từ chối.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          books:
          - isbn: S-02
            title: Spring Data
          - isbn: J-03
            title: Advanced Java
          - isbn: J-01
            title: Java OOP
          keyword: java
          limit: 2
          lookupIsbn: ' '
      status: 400
      response:
        code: INVALID_INPUT
        message: lookupIsbn must not be blank
      detailDescription: <p>Tra cứu ISBN được trim rồi gọi Catalog.findByIsbn. Chuỗi chỉ có dấu cách thành rỗng, dẫn tới IllegalArgumentException lookupIsbn must
        not be blank và HTTP 400.</p>
    - id: case_005
      title: Giới hạn trả về bằng 0
      description: limit=0 không thuộc 1..50.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          books:
          - isbn: S-02
            title: Spring Data
          - isbn: J-03
            title: Advanced Java
          - isbn: J-01
            title: Java OOP
          keyword: java
          limit: 0
          lookupIsbn: null
      status: 400
      response:
        code: INVALID_INPUT
        message: keyword and limit (1..50) are required
      detailDescription: <p>BookCatalogService giới hạn limit từ 1 đến 50; limit=0 bị từ chối trước khi dựng danh mục, handler trả HTTP 400 INVALID_INPUT.</p>
ClassesExperimentController:
  inventory(InventoryRequest):
    methodName: inventory
    httpMethods:
    - POST
    mappingPaths:
    - /oop/classes/inventory/experiment
    usage: true
    cases:
    - id: case_001
      title: Nhập, bán, đổi tên và từ chối thao tác lỗi
      description: Có 5 bước, trong đó bán quá tồn và nhập 0 bị từ chối nhưng các bước khác tiếp tục.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: KB-01
          name: Keyboard
          unitPriceVnd: 129000
          initialQuantity: 10
          actions:
          - type: restock
            units: 5
            name: null
          - type: sell
            units: 3
            name: null
          - type: sell
            units: 20
            name: null
          - type: rename
            units: null
            name: Mechanical Keyboard
          - type: restock
            units: 0
            name: null
      status: 200
      response:
        initial:
          sku: KB-01
          name: Keyboard
          unitPriceVnd: 129000
          quantity: 10
          totalValueVnd: 1290000
        steps:
        - index: 1
          type: restock
          accepted: true
          detail: completed
          before:
            sku: KB-01
            name: Keyboard
            unitPriceVnd: 129000
            quantity: 10
            totalValueVnd: 1290000
          after:
            sku: KB-01
            name: Keyboard
            unitPriceVnd: 129000
            quantity: 15
            totalValueVnd: 1935000
        - index: 2
          type: sell
          accepted: true
          detail: completed
          before:
            sku: KB-01
            name: Keyboard
            unitPriceVnd: 129000
            quantity: 15
            totalValueVnd: 1935000
          after:
            sku: KB-01
            name: Keyboard
            unitPriceVnd: 129000
            quantity: 12
            totalValueVnd: 1548000
        - index: 3
          type: sell
          accepted: false
          detail: insufficient inventory
          before:
            sku: KB-01
            name: Keyboard
            unitPriceVnd: 129000
            quantity: 12
            totalValueVnd: 1548000
          after:
            sku: KB-01
            name: Keyboard
            unitPriceVnd: 129000
            quantity: 12
            totalValueVnd: 1548000
        - index: 4
          type: rename
          accepted: true
          detail: completed
          before:
            sku: KB-01
            name: Keyboard
            unitPriceVnd: 129000
            quantity: 12
            totalValueVnd: 1548000
          after:
            sku: KB-01
            name: Mechanical Keyboard
            unitPriceVnd: 129000
            quantity: 12
            totalValueVnd: 1548000
        - index: 5
          type: restock
          accepted: false
          detail: restock units must be positive
          before:
            sku: KB-01
            name: Mechanical Keyboard
            unitPriceVnd: 129000
            quantity: 12
            totalValueVnd: 1548000
          after:
            sku: KB-01
            name: Mechanical Keyboard
            unitPriceVnd: 129000
            quantity: 12
            totalValueVnd: 1548000
        current:
          sku: KB-01
          name: Mechanical Keyboard
          unitPriceVnd: 129000
          quantity: 12
          totalValueVnd: 1548000
        maxQuantity: 1000000
      detailDescription: '<p>Tồn kho ban đầu 10 đơn vị giá 129000 VND; nhập 5 thành 15, bán 3 còn 12, tổng giá trị 1548000. Bán 20 bị từ chối vì thiếu hàng: snapshot
        before/after của bước 3 giống nhau.</p>

        <p>Đổi tên thành Mechanical Keyboard thành công, nhập 0 bị từ chối. Lỗi từng action được bắt trong service nên HTTP 200 vẫn bao gồm 5 bước.</p>'
    - id: case_002
      title: Danh sách action trống
      description: Danh sách rỗng không đáp ứng quy tắc 1–20 bước.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: KB-01
          name: Keyboard
          unitPriceVnd: 129000
          initialQuantity: 10
          actions: []
      status: 400
      response:
        error: actions must contain 1-20 steps
      detailDescription: <p><code>checkActions</code> yêu cầu 1–20 action, do đó danh sách trống ném <code>IllegalArgumentException</code>. Handler trả HTTP 400 với
        <code>error=actions must contain 1-20 steps</code>.</p>
    - id: case_003
      title: Loại action tồn kho không hỗ trợ
      description: Type discard không thuộc restock, sell, rename.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: KB-01
          name: Keyboard
          unitPriceVnd: 129000
          initialQuantity: 10
          actions:
          - type: discard
            units: 1
            name: null
      status: 400
      response:
        error: inventory type must be restock, sell or rename
      detailDescription: <p>Service kiểm tra type trước khi tạo <code>InventoryItem</code>; <code>discard</code> không hợp lệ nên HTTP 400 và không sinh mảng <code>steps</code>.</p>
  workshops(WorkshopRequest):
    methodName: workshops
    httpMethods:
    - POST
    mappingPaths:
    - /oop/classes/workshops/experiment
    usage: true
    cases:
    - id: case_001
      title: Alias dùng chung một workshop
      description: Workshop Java sức chứa 2 thử 3 lần; alias workshop OOP sức chứa 1 thử 2 lần.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          firstTitle: Java
          firstCapacity: 2
          secondTitle: OOP
          secondCapacity: 1
          firstAttempts: 3
          aliasAttempts: 2
      status: 200
      response:
        first:
          title: Java
          capacity: 2
          registered: 2
          remainingSeats: 0
        second:
          title: OOP
          capacity: 1
          registered: 1
          remainingSeats: 0
        independentCopy:
          title: OOP
          capacity: 1
          registered: 0
          remainingSeats: 1
        aliasIsSecond: true
        copyIsSecond: false
        acceptedFirst: 2
        rejectedFirst: 1
        acceptedViaAlias: 1
        rejectedViaAlias: 1
        sharedStaticMaxCapacity: 50
      detailDescription: '<p><code>first</code> chấp nhận 2/3 lần. <code>alias</code> cùng tham chiếu với <code>second</code> nên chấp nhận 1/2; <code>independentCopy</code>
        tạo bằng <code>new</code> nên vẫn có <code>registered=0</code>.</p>

        <p><code>aliasIsSecond=true</code>, <code>copyIsSecond=false</code>; <code>MAX_CAPACITY=50</code> là hằng số cấp lớp, không phải trạng thái đăng ký chung.</p>'
    - id: case_002
      title: Số lần đăng ký vượt 50
      description: firstAttempts=51 vượt giới hạn 0–50.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          firstTitle: Java
          firstCapacity: 2
          secondTitle: OOP
          secondCapacity: 1
          firstAttempts: 51
          aliasAttempts: 0
      status: 400
      response:
        error: firstAttempts must be between 0 and 50
      detailDescription: <p><code>checkedAttempts</code> từ chối firstAttempts=51 trước khi tạo workshop, nên handler trả HTTP 400 với thông báo giới hạn 0–50.</p>
    - id: case_003
      title: Sức chứa workshop bằng 0
      description: Capacity=0 bị constructor từ chối.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          firstTitle: Java
          firstCapacity: 0
          secondTitle: OOP
          secondCapacity: 1
          firstAttempts: 1
          aliasAttempts: 0
      status: 400
      response:
        error: capacity must be between 1 and 50
      detailDescription: <p><code>new Workshop</code> nhận capacity=0, trái giới hạn 1–50. Constructor ném <code>IllegalArgumentException</code>, handler trả HTTP
        400.</p>
  bank(BankRequest):
    methodName: bank
    httpMethods:
    - POST
    mappingPaths:
    - /oop/classes/bank/experiment
    usage: true
    cases:
    - id: case_001
      title: Chuyển tiền, rút vượt số dư, rồi nạp
      description: Tài khoản nguồn 100, đích 10; lần lượt transfer 50, withdraw 80, deposit 5.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          source:
            accountNumber: ACC100
            holderName: A
            openingBalanceVnd: 100
          destination:
            accountNumber: ACC200
            holderName: B
            openingBalanceVnd: 10
          actions:
          - type: transfer
            amountVnd: 50
          - type: withdraw
            amountVnd: 80
          - type: deposit
            amountVnd: 5
      status: 200
      response:
        initialSource:
          accountNumber: ACC100
          holderName: A
          balanceVnd: 100
        initialDestination:
          accountNumber: ACC200
          holderName: B
          balanceVnd: 10
        steps:
        - index: 1
          type: transfer
          accepted: true
          detail: completed
          sourceBefore:
            accountNumber: ACC100
            holderName: A
            balanceVnd: 100
          destinationBefore:
            accountNumber: ACC200
            holderName: B
            balanceVnd: 10
          sourceAfter:
            accountNumber: ACC100
            holderName: A
            balanceVnd: 50
          destinationAfter:
            accountNumber: ACC200
            holderName: B
            balanceVnd: 60
        - index: 2
          type: withdraw
          accepted: false
          detail: insufficient funds
          sourceBefore:
            accountNumber: ACC100
            holderName: A
            balanceVnd: 50
          destinationBefore:
            accountNumber: ACC200
            holderName: B
            balanceVnd: 60
          sourceAfter:
            accountNumber: ACC100
            holderName: A
            balanceVnd: 50
          destinationAfter:
            accountNumber: ACC200
            holderName: B
            balanceVnd: 60
        - index: 3
          type: deposit
          accepted: true
          detail: completed
          sourceBefore:
            accountNumber: ACC100
            holderName: A
            balanceVnd: 50
          destinationBefore:
            accountNumber: ACC200
            holderName: B
            balanceVnd: 60
          sourceAfter:
            accountNumber: ACC100
            holderName: A
            balanceVnd: 55
          destinationAfter:
            accountNumber: ACC200
            holderName: B
            balanceVnd: 60
        finalSource:
          accountNumber: ACC100
          holderName: A
          balanceVnd: 55
        finalDestination:
          accountNumber: ACC200
          holderName: B
          balanceVnd: 60
        scope: IN_MEMORY_SINGLE_REQUEST_SINGLE_THREAD_NOT_REAL_BANKING
      detailDescription: '<p>Chuyển 50 khiến nguồn còn 50 và đích có 60. Rút 80 vượt số dư, bước 2 bị từ chối và không đổi hai tài khoản. Nạp 5 ở bước 3 khiến nguồn
        cuối còn 55.</p>

        <p>Lỗi rút xảy ra trong vòng lặp, được bắt thành accepted=false nên HTTP 200. Scope chỉ rõ đây không phải nghiệp vụ ngân hàng có transaction.</p>'
    - id: case_002
      title: Nạp 0 bị từ chối trong một bước
      description: deposit(0) là lỗi của action, được lưu vào steps.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          source:
            accountNumber: ACC100
            holderName: A
            openingBalanceVnd: 100
          destination:
            accountNumber: ACC200
            holderName: B
            openingBalanceVnd: 10
          actions:
          - type: deposit
            amountVnd: 0
      status: 200
      response:
        initialSource:
          accountNumber: ACC100
          holderName: A
          balanceVnd: 100
        initialDestination:
          accountNumber: ACC200
          holderName: B
          balanceVnd: 10
        steps:
        - index: 1
          type: deposit
          accepted: false
          detail: amountVnd must be positive
          sourceBefore:
            accountNumber: ACC100
            holderName: A
            balanceVnd: 100
          destinationBefore:
            accountNumber: ACC200
            holderName: B
            balanceVnd: 10
          sourceAfter:
            accountNumber: ACC100
            holderName: A
            balanceVnd: 100
          destinationAfter:
            accountNumber: ACC200
            holderName: B
            balanceVnd: 10
        finalSource:
          accountNumber: ACC100
          holderName: A
          balanceVnd: 100
        finalDestination:
          accountNumber: ACC200
          holderName: B
          balanceVnd: 10
        scope: IN_MEMORY_SINGLE_REQUEST_SINGLE_THREAD_NOT_REAL_BANKING
      detailDescription: <p><code>deposit(0)</code> gây <code>IllegalArgumentException</code> từ <code>requirePositive</code>. Exception được bắt thành accepted=false;
        nguồn vẫn 100, đích vẫn 10; HTTP 200.</p>
    - id: case_003
      title: Hai tài khoản trùng số tài khoản
      description: Hai tài khoản có cùng accountNumber ACC100.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          source:
            accountNumber: ACC100
            holderName: A
            openingBalanceVnd: 100
          destination:
            accountNumber: ACC100
            holderName: B
            openingBalanceVnd: 10
          actions:
          - type: transfer
            amountVnd: 5
      status: 400
      response:
        error: source and destination must use distinct accountNumbers
      detailDescription: <p>Hai object riêng vẫn có cùng accountNumber ACC100. Service kiểm tra định danh bằng nhau trước vòng lặp rồi ném <code>IllegalArgumentException</code>;
        handler trả HTTP 400.</p>
    - id: case_004
      title: Action ngân hàng không hỗ trợ
      description: Type refund không thuộc deposit/withdraw/transfer.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          source:
            accountNumber: ACC100
            holderName: A
            openingBalanceVnd: 100
          destination:
            accountNumber: ACC200
            holderName: B
            openingBalanceVnd: 10
          actions:
          - type: refund
            amountVnd: 5
      status: 400
      response:
        error: each bank action needs type (deposit/withdraw/transfer) and amountVnd
      detailDescription: <p>Service kiểm tra type/amount trước khi tạo account. <code>refund</code> không hợp lệ nên trả HTTP 400 với <code>ErrorResult.error</code>.</p>
ClassDesignExperimentsController:
  library(LibraryRequest):
    methodName: library
    httpMethods:
    - POST
    mappingPaths:
    - /oop/class-design/library/experiment
    usage: true
    cases:
    - id: case_001
      title: Mượn, truy vấn, từ chối mượn trùng và trả trễ
      description: Theo dõi bốn hành động để phân biệt query không có side effect với command và phí trả trễ.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          maxActiveLoans: 1
          loanDays: 14
          copies:
          - copyId: C-1
            title: Effective Java
          actions:
          - type: BORROW
            borrowerId: M-1
            copyId: C-1
            onDate: '2026-10-20'
          - type: QUERY
            borrowerId: null
            copyId: null
            onDate: null
          - type: BORROW
            borrowerId: M-2
            copyId: C-1
            onDate: '2026-10-21'
          - type: RETURN
            borrowerId: null
            copyId: C-1
            onDate: '2026-11-05'
      status: 200
      response:
        steps:
        - index: 1
          action: BORROW
          accepted: true
          outcome: BORROWED
          loans:
          - &id001
            borrowerId: M-1
            copyId: C-1
            title: Effective Java
            borrowedOn: '2026-10-20'
            dueOn: '2026-11-03'
            returnedOn: null
            lateFeeCents: 0
        - index: 2
          action: QUERY
          accepted: true
          outcome: QUERY_ONLY
          loans:
          - *id001
        - index: 3
          action: BORROW
          accepted: false
          outcome: COPY_ALREADY_BORROWED
          loans:
          - *id001
        - index: 4
          action: RETURN
          accepted: true
          outcome: RETURNED
          loans:
          - &id002
            borrowerId: M-1
            copyId: C-1
            title: Effective Java
            borrowedOn: '2026-10-20'
            dueOn: '2026-11-03'
            returnedOn: '2026-11-05'
            lateFeeCents: 200
        finalLoans:
        - *id002
      detailDescription: <p><code>LoanPolicy.dueOn()</code> cộng 14 ngày từ 2026-10-20, được 2026-11-03. QUERY giữ nguyên snapshot sau BORROW. M-2 mượn cùng C-1 bị
        <code>InMemoryLoanRegistry.save()</code> từ chối với <code>COPY_ALREADY_BORROWED</code> nhưng service bắt <code>IllegalStateException</code> và tiếp tục trả
        HTTP 200. RETURN ngày 2026-11-05 muộn 2 ngày, <code>Loan.returnOn()</code> tính phí 2 × 100 = 200 cents và lưu returnedOn.</p>
    - id: case_002
      title: Giới hạn mượn theo borrower được giữ nguyên
      description: Độc lập với việc sách B còn trống, chính sách chỉ cho M-1 tối đa một loan active.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          maxActiveLoans: 1
          loanDays: 14
          copies:
          - copyId: A
            title: Java
          - copyId: B
            title: OOP
          actions:
          - type: BORROW
            borrowerId: M-1
            copyId: A
            onDate: '2026-10-20'
          - type: BORROW
            borrowerId: M-1
            copyId: B
            onDate: '2026-10-21'
          - type: QUERY
            borrowerId: null
            copyId: null
            onDate: null
      status: 200
      response:
        steps:
        - index: 1
          action: BORROW
          accepted: true
          outcome: BORROWED
          loans:
          - &id003
            borrowerId: M-1
            copyId: A
            title: Java
            borrowedOn: '2026-10-20'
            dueOn: '2026-11-03'
            returnedOn: null
            lateFeeCents: 0
        - index: 2
          action: BORROW
          accepted: false
          outcome: BORROWER_LIMIT_REACHED
          loans:
          - *id003
        - index: 3
          action: QUERY
          accepted: true
          outcome: QUERY_ONLY
          loans:
          - *id003
        finalLoans:
        - *id003
      detailDescription: <p><code>InMemoryLoanRegistry.activeCount(&quot;M-1&quot;)</code> đã là 1 sau khi mượn A. Với <code>maxActiveLoans=1</code>, <code>LoanPolicy.ensureEligible()</code>
        ném <code>BORROWER_LIMIT_REACHED</code> trước khi tạo khoản mượn B. Service ghi step thứ hai <code>accepted=false</code>; QUERY sau đó vẫn chỉ thấy A, minh
        họa query không thay đổi dữ liệu.</p>
    - id: case_003
      title: Không cho phép trùng mã bản sách lúc khởi tạo
      description: Repository phát hiện copyId trùng trước mọi bước mượn/trả.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          maxActiveLoans: 1
          loanDays: 14
          copies:
          - copyId: A
            title: Java
          - copyId: A
            title: Other
          actions:
          - type: QUERY
            borrowerId: null
            copyId: null
            onDate: null
      status: 400
      response:
        error: 'Duplicate copyId: A'
      detailDescription: '<p><code>InMemoryLoanRegistry.register()</code> gọi <code>putIfAbsent()</code> cho từng BookCopy. Khi copyId A xuất hiện lần thứ hai, hàm
        ném <code>IllegalArgumentException(&quot;Duplicate copyId: A&quot;)</code> ngoài vòng xử lý các action; handler trả HTTP 400, không có LibraryResult.</p>'
    - id: case_004
      title: Không hỗ trợ DELETE_ALL
      description: Các command bên ngoài BORROW/RETURN và truy vấn QUERY bị chặn trực tiếp.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          maxActiveLoans: 1
          loanDays: 14
          copies:
          - copyId: A
            title: Java
          actions:
          - type: DELETE_ALL
            borrowerId: null
            copyId: null
            onDate: null
      status: 400
      response:
        error: 'Unsupported action: DELETE_ALL'
      detailDescription: <p>Service yêu cầu action.type không rỗng rồi switch đúng ba giá trị <code>BORROW</code>, <code>RETURN</code>, <code>QUERY</code>. <code>DELETE_ALL</code>
        ném <code>IllegalArgumentException</code>, không nằm trong nhóm <code>IllegalStateException</code> được bắt cho từng step, nên HTTP 400.</p>
    - id: case_005
      title: Không thể mượn bản sách chưa đăng ký
      description: Repository sở hữu danh mục sách và kiểm tra tham chiếu ngay đầu lệnh BORROW.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          maxActiveLoans: 1
          loanDays: 14
          copies:
          - copyId: A
            title: Java
          actions:
          - type: BORROW
            borrowerId: M
            copyId: UNKNOWN
            onDate: '2026-10-20'
      status: 400
      response:
        error: 'Unknown copyId: UNKNOWN'
      detailDescription: <p><code>LibraryScenarioService.run()</code> gọi <code>repository.requireCopy(&quot;UNKNOWN&quot;)</code> trước khi kiểm tra hạn mức borrower.
        Bản sách không tồn tại khiến repository ném <code>IllegalArgumentException</code> và controller trả HTTP 400, không phải một rejected step.</p>
  checkout(CheckoutRequest):
    methodName: checkout
    httpMethods:
    - POST
    mappingPaths:
    - /oop/class-design/checkout/experiment
    usage: true
    cases:
    - id: case_001
      title: Checkout hai mặt hàng và ghi sự kiện outbox
      description: Tính tổng 28000 cents, giảm 10% và ghi ý định gửi biên nhận tới địa chỉ đã cung cấp.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: ORD-1
          receiptAddress: reader@example.org
          discountPercent: 10
          lines: &id004
          - sku: JAVA
            quantity: 2
            unitPriceCents: 12500
          - sku: PEN
            quantity: 1
            unitPriceCents: 3000
      status: 200
      response:
        orderId: ORD-1
        subtotalCents: 28000
        discountCents: 2800
        totalCents: 25200
        persistedLines: *id004
        receiptOutbox:
        - orderId: ORD-1
          destination: reader@example.org
          amountCents: 25200
      detailDescription: <p><code>ShoppingCart</code> tính 2 × 12500 + 1 × 3000 = 28000 cents. Giảm 10% là 2800, tổng còn 25200. <code>CheckedOutOrder</code> giữ
        snapshot hai <code>CartLine</code>, <code>InMemoryOrderRepository</code> lưu trong request, <code>InMemoryReceiptOutbox</code> xếp một <code>ReceiptEvent</code>
        amount 25200 tới reader@example.org. Sự kiện được xếp hàng chứ chưa phải email đã gửi.</p>
    - id: case_002
      title: Giảm 25% theo số nguyên cents, làm tròn xuống
      description: Tình huống 3003 cents kiểm tra đúng phép chia và phần dư, không dùng floating point.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: O-7
          receiptAddress: a@example.org
          discountPercent: 25
          lines: &id005
          - sku: JAVA
            quantity: 3
            unitPriceCents: 1001
      status: 200
      response:
        orderId: O-7
        subtotalCents: 3003
        discountCents: 750
        totalCents: 2253
        persistedLines: *id005
        receiptOutbox:
        - orderId: O-7
          destination: a@example.org
          amountCents: 2253
      detailDescription: <p>Subtotal là 3 × 1001 = 3003 cents. Service tính <code>(3003 / 100) × 25 + (3003 % 100) × 25 / 100</code>, tức 30 × 25 + 3 × 25 / 100 =
        750 cents khi chia nguyên. Total 2253 được lưu trong CheckedOutOrder và ReceiptEvent; không làm tròn thành 751.</p>
    - id: case_003
      title: Giảm giá vượt 100% bị từ chối
      description: Quy tắc discountPercent được kiểm tra trước khi tạo giỏ.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: O
          receiptAddress: a@b
          discountPercent: 101
          lines:
          - sku: A
            quantity: 1
            unitPriceCents: 100
      status: 400
      response:
        error: Invalid checkout input
      detailDescription: <p><code>CheckoutScenarioService.checkout()</code> xác thực <code>discountPercent</code> trong 0..100 cùng các field bắt buộc. Giá trị 101
        ném <code>IllegalArgumentException(&quot;Invalid checkout input&quot;)</code> trước khi tạo ShoppingCart hoặc repository; handler trả HTTP 400.</p>
    - id: case_004
      title: Không cho phép dòng hàng có quantity bằng 0
      description: Value object CartLine kiểm tra bất biến ngay khi hình thành.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: O
          receiptAddress: a@b
          discountPercent: 0
          lines:
          - sku: A
            quantity: 0
            unitPriceCents: 100
      status: 400
      response:
        error: Invalid cart line
      detailDescription: <p>Đầu vào tổng thể hợp lệ, nhưng <code>new CartLine(&quot;A&quot;,0,100)</code> vi phạm quantity phải từ 1 đến 10000 và ném <code>IllegalArgumentException(&quot;Invalid
        cart line&quot;)</code>. Checkout dừng trước bước tính tiền và xếp ReceiptEvent, trả HTTP 400.</p>
    - id: case_005
      title: Nhân tiền vượt giới hạn long
      description: Phép toán exact bảo vệ dữ liệu tiền trước khi lưu đơn.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: O
          receiptAddress: a@b
          discountPercent: 0
          lines:
          - sku: A
            quantity: 2
            unitPriceCents: 9223372036854775807
      status: 400
      response:
        error: long overflow
      detailDescription: <p><code>CartLine</code> dùng <code>Math.multiplyExact(2, Long.MAX_VALUE)</code> ngay trong constructor. Phép nhân tràn và ném <code>ArithmeticException(&quot;long
        overflow&quot;)</code>, handler ánh xạ sang HTTP 400; chưa có order hoặc outbox được tạo.</p>
  transfer(TransferRequest):
    methodName: transfer
    httpMethods:
    - POST
    mappingPaths:
    - /oop/class-design/transfers/experiment
    usage: true
    cases:
    - id: case_001
      title: Chuyển 2500 cents và giữ tổng số dư
      description: BankAccount thực thi command, còn Money bảo đảm hai phép toán cùng currency.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          fromAccountId: A
          toAccountId: B
          currency: USD
          fromBalanceCents: 10000
          toBalanceCents: 5000
          amountCents: 2500
      status: 200
      response:
        fromAccountId: A
        toAccountId: B
        currency: USD
        fromBeforeCents: 10000
        toBeforeCents: 5000
        fromAfterCents: 7500
        toAfterCents: 7500
      detailDescription: <p><code>TransferScenarioService</code> tạo A=10000 và B=5000 cents bằng Money USD. <code>BankAccount.transferTo()</code> tính số dư mới
        7500 và 7500 trước khi gán, sau đó mới thay đổi cả hai tài khoản. <code>TransferResult</code> cho before và after, tổng vẫn 15000 cents; <code>balance()</code>
        trước chuyển là query không làm đổi trạng thái.</p>
    - id: case_002
      title: Không cho phép rút nhiều hơn số dư nguồn
      description: Không có cập nhật một nửa khi domain từ chối do không đủ tiền.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          fromAccountId: A
          toAccountId: B
          currency: USD
          fromBalanceCents: 100
          toBalanceCents: 200
          amountCents: 101
      status: 409
      response:
        error: INSUFFICIENT_FUNDS
      detailDescription: <p><code>Money.minus()</code> được gọi để tính debited trước khi cập nhật bất kỳ field nào. Vì amount 101 lớn hơn balance 100, nó ném <code>IllegalStateException(&quot;INSUFFICIENT_FUNDS&quot;)</code>.
        <code>ClassDesignExceptionHandler</code> trả HTTP 409, không phải HTTP 400.</p>
    - id: case_003
      title: Không chuyển tiền giữa hai entity cùng danh tính
      description: Kiểm tra danh tính tài khoản có trước mọi phép cộng trừ số dư.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          fromAccountId: A
          toAccountId: A
          currency: USD
          fromBalanceCents: 100
          toBalanceCents: 200
          amountCents: 10
      status: 400
      response:
        error: Cannot transfer to same account
      detailDescription: <p>Service tạo hai <code>BankAccount</code> khác instance nhưng đều có ID A. <code>BankAccount.transferTo()</code> kiểm tra <code>id.equals(recipient.id)</code>,
        không chỉ so sánh tham chiếu, nên ném <code>IllegalArgumentException</code> với thông báo <code>Cannot transfer to same account</code>. Handler trả HTTP 400.</p>
    - id: case_004
      title: Cộng vào tài khoản nhận bị tràn long
      description: Hai giá trị kết quả được tính trước khi commit nên phép cộng lỗi ngăn cập nhật.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          fromAccountId: A
          toAccountId: B
          currency: USD
          fromBalanceCents: 100
          toBalanceCents: 9223372036854775807
          amountCents: 1
      status: 400
      response:
        error: long overflow
      detailDescription: <p>Debit của A sẽ là 99 nhưng vẫn chỉ là biến cục bộ. <code>recipient.balance.plus(amount)</code> gọi <code>Math.addExact(Long.MAX_VALUE,1)</code>
        và ném <code>ArithmeticException(&quot;long overflow&quot;)</code> trước hai phép gán. Handler trả HTTP 400 và không có kết quả chuyển tiền từng phần.</p>
    - id: case_005
      title: Không chuyển tiền với amount bằng 0
      description: Ý định chuyển tiền phải đại diện một số dương, không thay thế query.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          fromAccountId: A
          toAccountId: B
          currency: USD
          fromBalanceCents: 100
          toBalanceCents: 200
          amountCents: 0
      status: 400
      response:
        error: Transfer amount must be positive
      detailDescription: <p>Money cho phép giá trị 0 khi biểu diễn số dư, nhưng command <code>BankAccount.transferTo()</code> từ chối <code>amount.cents()==0</code>
        bằng <code>IllegalArgumentException</code>. Vì command không hợp lệ, handler trả HTTP 400 thay vì một TransferResult không đổi số dư.</p>
CompositionExperimentController:
