        truy?n <code>FixedDiscount(30)</code> cho <code>quoteWith</code> n?n tr? 70 nh?ng <code>AtomicReference</code> v?n gi? PERCENT. L??t QUOTE cu?i quay l?i 90;
        timeline step SWITCH kh?ng c? usedPolicy, subtotalCents hay payableCents.</p>
    - id: case_002
