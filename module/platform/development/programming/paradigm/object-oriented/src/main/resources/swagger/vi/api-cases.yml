            actualAccepted: true
            expectedSnapshot:
              capacity: 10
              reserved: 2
            actualSnapshot:
              capacity: 10
              reserved: 2
            passed: true
            violations: []
          - index: 4
            action: RESERVE
            seats: 8
            expectedAccepted: true
            actualAccepted: true
            expectedSnapshot:
              capacity: 10
              reserved: 10
            actualSnapshot:
              capacity: 10
              reserved: 10
            passed: true
            violations: []
        - implementation: BROKEN_MUTATE_ON_REJECT
          allPassed: false
          passedSteps: 1
          steps:
          - index: 1
            action: RESERVE
            seats: 4
            expectedAccepted: true
            actualAccepted: true
            expectedSnapshot:
              capacity: 10
              reserved: 4
            actualSnapshot:
              capacity: 10
              reserved: 4
            passed: true
