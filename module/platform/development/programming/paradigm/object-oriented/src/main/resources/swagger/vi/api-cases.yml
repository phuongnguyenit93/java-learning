        defectDetected: true
      detailDescription: <p>Với capacity=3, lời gọi RESERVE 3 thành công và đủ chỗ. RESERVE 1 phải false và không đổi reserved=3; MONITOR/ATOMIC giữ bất biến. BROKEN
        lại nâng reserved thành 4, báo <code>STATE_MISMATCH</code>/<code>INVARIANT_BROKEN</code>. CANCEL 3 tiếp theo hạ reference xuống 0 nhưng BROKEN còn 1, làm
        lộ vấn đề qua API <code>snapshot()</code>.</p>
    - id: case_004
      title: Capacity bằng 0 không hợp lệ
      description: Tiền điều kiện của contract không cho tạo inventory với sức chứa bằng 0.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          capacity: 0
          actions:
          - type: RESERVE
            seats: 1
      status: 400
      response:
        code: INVALID_INPUT
        detail: capacity must be 1..100000
      detailDescription: <p><code>InventoryContractService.run()</code> kiểm tra capacity trước khi tạo các implementation. Với 0, service ném <code>IllegalArgumentException</code>,
        handler của chương trả HTTP 400 có <code>code=INVALID_INPUT</code> và <code>detail=capacity must be 1..100000</code>; không có runs.</p>
    - id: case_005
      title: Action MOVE không thuộc hợp đồng
      description: Hệ thống từ chối thao tác không được định nghĩa trước khi chạy suite.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          capacity: 10
          actions:
          - type: MOVE
            seats: 1
      status: 400
      response:
        code: INVALID_INPUT
        detail: each action needs RESERVE/CANCEL and seats 1..100000
      detailDescription: <p><code>InventoryContractService</code> chỉ cho phép <code>RESERVE</code>/<code>CANCEL</code> và số ghế từ 1 đến 100000. <code>MOVE</code>
        làm validation ném <code>IllegalArgumentException</code> ngay đầu request; response HTTP 400 chứa <code>INVALID_INPUT</code> thay vì một ContractRun thất
        bại.</p>
  collaboration(CollaborationRequest):
    methodName: collaboration
    httpMethods:
    - POST
    mappingPaths:
    - /oop/testing/checkout/collaboration
    usage: true
    cases:
    - id: case_001
      title: Năm nhánh checkout với fake, stub và recording sender
      description: Quan sát out-of-stock, rollback payment, lỗi gửi receipt và luồng thành công.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          scenarios:
          - orderId: ORD-1
            sku: SKU-1
            quantity: 2
            unitPriceVnd: 50000
            stock: 1
            paymentMode: APPROVE
            receiptMode: SEND
          - orderId: ORD-2
            sku: SKU-1
            quantity: 2
            unitPriceVnd: 50000
            stock: 5
            paymentMode: DECLINE
            receiptMode: SEND
          - orderId: ORD-3
            sku: SKU-1
            quantity: 2
            unitPriceVnd: 50000
            stock: 5
            paymentMode: ERROR
            receiptMode: SEND
          - orderId: ORD-4
            sku: SKU-1
            quantity: 2
            unitPriceVnd: 50000
            stock: 5
            paymentMode: APPROVE
            receiptMode: ERROR
          - orderId: ORD-5
            sku: SKU-1
            quantity: 2
            unitPriceVnd: 50000
            stock: 5
            paymentMode: APPROVE
            receiptMode: SEND
      status: 200
      response:
        runs:
        - orderId: ORD-1
          status: OUT_OF_STOCK
          payableVnd: 100000
          initialStock: 1
          remainingStock: 1
          paymentAttempts: 0
          sentReceipts: 0
          events:
          - inventory.reserve:REJECTED
          invariantHolds: true
        - orderId: ORD-2
          status: PAYMENT_DECLINED_ROLLED_BACK
          payableVnd: 100000
          initialStock: 5
          remainingStock: 5
          paymentAttempts: 1
          sentReceipts: 0
          events:
          - inventory.reserve:ACCEPTED
          - payment.charge:DECLINE
          - inventory.release
          invariantHolds: true
        - orderId: ORD-3
          status: PAYMENT_ERROR_ROLLED_BACK
          payableVnd: 100000
          initialStock: 5
          remainingStock: 5
          paymentAttempts: 1
          sentReceipts: 0
          events:
          - inventory.reserve:ACCEPTED
          - payment.charge:ERROR
          - inventory.release
          invariantHolds: true
        - orderId: ORD-4
          status: PAID_RECEIPT_FAILED
          payableVnd: 100000
          initialStock: 5
          remainingStock: 3
          paymentAttempts: 1
          sentReceipts: 0
          events:
          - inventory.reserve:ACCEPTED
          - payment.charge:APPROVE
          - receipt.send:ERROR
          invariantHolds: true
        - orderId: ORD-5
          status: SUCCESS
          payableVnd: 100000
          initialStock: 5
          remainingStock: 3
          paymentAttempts: 1
          sentReceipts: 1
          events:
          - inventory.reserve:ACCEPTED
          - payment.charge:APPROVE
          - receipt.send:SEND
          invariantHolds: true
        scope: REQUEST_LOCAL_ONLY; fake inventory, stub gateway, recording receipt sender; no network, real payments, email or cross-request state
      detailDescription: <p>Stock ban đầu của mỗi scenario là độc lập. ORD-1 hết hàng nên chỉ ghi <code>inventory.reserve:REJECTED</code>. ORD-2 charge DECLINE và
        ORD-3 charge ERROR đều ghi <code>inventory.release</code> để trả stock về 5. ORD-4 charge APPROVE thành công nhưng <code>receipt.send:ERROR</code> làm status
        <code>PAID_RECEIPT_FAILED</code>, còn stock 3, không có email gửi. ORD-5 gửi thành công còn stock 3 và sentReceipts=1. Cả năm có <code>invariantHolds=true</code>
        và không thực hiện I/O thật.</p>
    - id: case_002
      title: Checkout hết đúng tồn kho khi thanh toán và gửi biên nhận thành công
      description: FakeInventory có thể trả về 0 khi vừa đủ hàng, mà vẫn thỏa invariant.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          scenarios:
          - orderId: ORD-6
            sku: SKU-1
            quantity: 2
            unitPriceVnd: 7500
            stock: 2
            paymentMode: APPROVE
            receiptMode: SEND
      status: 200
      response:
        runs:
        - orderId: ORD-6
          status: SUCCESS
          payableVnd: 15000
          initialStock: 2
          remainingStock: 0
          paymentAttempts: 1
          sentReceipts: 1
          events:
          - inventory.reserve:ACCEPTED
          - payment.charge:APPROVE
          - receipt.send:SEND
          invariantHolds: true
        scope: REQUEST_LOCAL_ONLY; fake inventory, stub gateway, recording receipt sender; no network, real payments, email or cross-request state
      detailDescription: <p><code>FakeInventory.reserve()</code> nhận quantity=2 khi stock=2 nên remainingStock=0. <code>StubPayment</code> với mode APPROVE ghi đúng
        một lần charge, <code>RecordingSender</code> mode SEND ghi một receipt. <code>CheckoutWorkflow</code> trả SUCCESS, payableVnd=15000, các events lần lượt reserve,
        charge, send.</p>
    - id: case_003
      title: Danh sách scenarios rỗng bị từ chối
      description: Thí nghiệm yêu cầu 1–12 kịch bản để giữ phép kiểm thử có giới hạn.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          scenarios: []
      status: 400
      response:
        code: INVALID_INPUT
        detail: scenarios must contain 1..12 cases
      detailDescription: <p><code>CollaborationExperimentService.run()</code> phát hiện danh sách rỗng trước khi tạo Order hoặc test doubles, rồi ném <code>IllegalArgumentException</code>.
        Handler trả HTTP 400 với code <code>INVALID_INPUT</code> và detail tương ứng.</p>
    - id: case_004
      title: StubPayment không nhận mode PENDING
      description: Các paymentMode hợp lệ chỉ là APPROVE, DECLINE và ERROR.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          scenarios:
          - orderId: ORD-7
            sku: SKU-1
            quantity: 2
            unitPriceVnd: 50000
            stock: 5
            paymentMode: PENDING
            receiptMode: SEND
      status: 400
      response:
        code: INVALID_INPUT
        detail: scenario requires stock 0..10000, valid quantity/price, paymentMode and receiptMode
      detailDescription: <p>Service tiền kiểm tra mọi scenario và chỉ cho <code>paymentMode</code> thuộc ba giá trị APPROVE/DECLINE/ERROR. PENDING bị từ chối trước
        khi gọi <code>CheckoutWorkflow</code>, nên response HTTP 400 là <code>INVALID_INPUT</code>, không phải kết quả thanh toán PENDING.</p>
    - id: case_005
      title: Tràn long được chặn trước khi gọi fake/stub
      description: Phép nhân tiền bảo vệ tiền điều kiện về số học của workflow.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          scenarios:
          - orderId: ORD-8
            sku: SKU-1
            quantity: 2
            unitPriceVnd: 9223372036854775807
            stock: 5
            paymentMode: APPROVE
            receiptMode: SEND
      status: 422
      response:
        code: ARITHMETIC_OVERFLOW
        detail: the requested amounts overflow long
      detailDescription: <p>Trong vòng tiền kiểm tra, <code>CheckoutWorkflow.Order.totalVnd()</code> gọi <code>Math.multiplyExact(2, Long.MAX_VALUE)</code> và ném
        <code>ArithmeticException</code>. Handler trả HTTP 422 với code <code>ARITHMETIC_OVERFLOW</code> và detail cố định; chưa có inventory.reserve, payment.charge
        hoặc receipt.send.</p>
  regression(RegressionRequest):
    methodName: regression
    httpMethods:
    - POST
    mappingPaths:
    - /oop/testing/pricing/regression
    usage: true
    cases:
    - id: case_001
      title: Hồi quy bắt lỗi ngưỡng miễn ship đúng 100000 VND
      description: Refactor có ít catalogLookups hơn nhưng hóa đơn giống baseline; bản sai khác đúng threshold.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          pricesVnd:
            BOOK: 25000
            PEN: 50000
          lines:
          - sku: BOOK
            quantity: 1
          - sku: BOOK
            quantity: 1
          - sku: PEN
            quantity: 1
          member: true
      status: 200
      response:
        baseline: &id052
          subtotalVnd: 100000
          discountVnd: 5000
          shippingVnd: 0
          totalVnd: 95000
        variants:
        - implementation: PER_LINE_BASELINE
          invoice: *id052
          catalogLookups: 3
          matchesBaseline: true
        - implementation: GROUPED_REFACTOR
          invoice: *id052
          catalogLookups: 2
          matchesBaseline: true
        - implementation: BROKEN_SHIPPING_BOUNDARY
          invoice:
            subtotalVnd: 100000
            discountVnd: 5000
            shippingVnd: 15000
            totalVnd: 110000
          catalogLookups: 2
          matchesBaseline: false
        refactorPreservedBehavior: true
        seededDefectDetected: true
      detailDescription: <p>BOOK hai dòng, PEN một dòng tạo subtotal 100000; member giảm 5% là 5000 và chính sách chuẩn miễn 15000 phí ship, total 95000. <code>PerLineQuote</code>
        lookup ba lần, <code>GroupedQuote</code> hai lần nhưng cả hai trả invoice giống nhau. <code>BrokenShippingQuote</code> dùng điều kiện <code>subtotal &gt;
        100000</code> nên vẫn tính ship 15000, total 110000 và <code>seededDefectDetected=true</code>.</p>
    - id: case_002
      title: Không có hồi quy quan sát được ở giá dưới threshold
      description: Bài test dưới 100000 VND không thể phát hiện lỗi so sánh đúng ngưỡng.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          pricesVnd:
            BOOK: 10
          lines:
          - sku: BOOK
            quantity: 1
          member: false
      status: 200
      response:
        baseline: &id053
          subtotalVnd: 10
          discountVnd: 0
          shippingVnd: 15000
          totalVnd: 15010
        variants:
        - implementation: PER_LINE_BASELINE
          invoice: *id053
          catalogLookups: 1
          matchesBaseline: true
        - implementation: GROUPED_REFACTOR
          invoice: *id053
          catalogLookups: 1
          matchesBaseline: true
        - implementation: BROKEN_SHIPPING_BOUNDARY
          invoice:
            subtotalVnd: 10
            discountVnd: 0
            shippingVnd: 15000
            totalVnd: 15010
          catalogLookups: 1
          matchesBaseline: true
        refactorPreservedBehavior: true
        seededDefectDetected: false
      detailDescription: <p>Subtotal 10, không giảm giá member và phí ship 15000 cho cả baseline, grouped và BROKEN. Cả ba trả total 15010, lookup một lần, <code>refactorPreservedBehavior=true</code>
        và <code>seededDefectDetected=false</code>. Điều này cho thấy một case thành công không phủ được lỗi boundary.</p>
    - id: case_003
      title: Refactor giữ kết quả phía trên ngưỡng miễn phí
      description: Cả ba variant miễn ship khi subtotal lớn hơn 100000; không tạo false positive.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          pricesVnd:
            BOOK: 60000
            PEN: 30000
          lines:
          - sku: BOOK
            quantity: 2
          - sku: PEN
            quantity: 1
          member: true
      status: 200
      response:
        baseline: &id054
          subtotalVnd: 150000
          discountVnd: 7500
          shippingVnd: 0
          totalVnd: 142500
        variants:
        - implementation: PER_LINE_BASELINE
          invoice: *id054
          catalogLookups: 2
          matchesBaseline: true
        - implementation: GROUPED_REFACTOR
          invoice: *id054
          catalogLookups: 2
          matchesBaseline: true
        - implementation: BROKEN_SHIPPING_BOUNDARY
          invoice:
            subtotalVnd: 150000
            discountVnd: 7500
            shippingVnd: 0
            totalVnd: 142500
          catalogLookups: 2
          matchesBaseline: true
        refactorPreservedBehavior: true
        seededDefectDetected: false
      detailDescription: <p>Subtotal 2 × 60000 + 30000 = 150000, member giảm 7500 nên total 142500 với shipping 0. Điều kiện <code>&gt;</code> và <code>&gt;=</code>
        đều đúng khi 150000 vượt ngưỡng, vì thế BROKEN trùng baseline và <code>seededDefectDetected=false</code>. Grouped và per-line đều lookup hai SKU/lần vì không
        có dòng trùng SKU.</p>
    - id: case_004
      title: Dòng hàng không có SKU trong catalog
      description: Service từ chối reference không tồn tại thay vì báo giá sai âm thầm.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          pricesVnd:
            BOOK: 100
          lines:
          - sku: UNKNOWN
            quantity: 1
          member: true
      status: 400
      response:
        code: INVALID_INPUT
        detail: 'unknown SKU: UNKNOWN'
      detailDescription: '<p><code>RegressionExperimentService.run()</code> tạo <code>QuoteRegression.Line</code> hợp lệ cho UNKNOWN nhưng phát hiện <code>pricesVnd.containsKey(&quot;UNKNOWN&quot;)</code>
        false; ném <code>IllegalArgumentException</code> trước khi tạo baseline. Handler trả HTTP 400 với code INVALID_INPUT, detail <code>unknown SKU: UNKNOWN</code>.</p>'
    - id: case_005
      title: Tràn khi nhân giá và quantity tạo HTTP 422
      description: Hành vi exact arithmetic là một phần hợp đồng công khai của bài kiểm thử hồi quy.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          pricesVnd:
            BOOK: 9223372036854775807
          lines:
          - sku: BOOK
            quantity: 2
          member: false
      status: 422
      response:
        code: ARITHMETIC_OVERFLOW
        detail: the requested amounts overflow long
      detailDescription: <p><code>PerLineQuote.quote()</code> trong baseline gọi <code>Math.multiplyExact(2, Long.MAX_VALUE)</code> trước khi so sánh các variant.
        Phép nhân tràn ném ArithmeticException; handler trả HTTP 422 với <code>ARITHMETIC_OVERFLOW</code> và thông báo cố định, không trả RegressionResult chưa hoàn
        chỉnh.</p>
