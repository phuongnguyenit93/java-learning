          receipt: null
          storedCount: 0
          noticeCount: 0
        - index: 2
          orderId: ORD-3
          accepted: false
          rule: INVALID_INPUT
          detail: 'unknown discount policy: UNKNOWN'
          receipt: null
          storedCount: 0
          noticeCount: 0
        storedOrders: []
        notices: []
        countsConsistent: true
        scope: REQUEST_LOCAL_SIMULATION; NO_DATABASE_OR_ACTUAL_EMAIL; NO_TRANSACTION_ACROSS_EXTERNAL_ADAPTERS
      detailDescription: <p>Attempt thứ nhất có quantity null nên <code>toOrder</code> ném IllegalArgumentException với message every line requires sku, quantity
        and unitPriceCents. Attempt thứ hai tạo được PurchaseOrder subtotal 20 nhưng <code>DiscountPricing.quote</code> không tìm thấy policy UNKNOWN. Service ghi
        hai rule INVALID_INPUT, receipt null, storedCount và noticeCount đều 0. HTTP 200 vì lỗi được xử lý trong vòng attempt.</p>
    - id: case_004
      title: Tràn số của một dòng được ghi vào attempt
      description: Đơn giá Long.MAX_VALUE nhân số lượng 2 vượt long.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          attempts:
          - orderId: ORD-1
            policyCode: NONE
            lines:
            - sku: BIG
              quantity: 2
              unitPriceCents: 9223372036854775807
      status: 200
      response:
        attempts:
        - index: 1
          orderId: ORD-1
          accepted: false
          rule: ARITHMETIC_OVERFLOW
          detail: order arithmetic exceeds long range
          receipt: null
          storedCount: 0
          noticeCount: 0
        storedOrders: []
        notices: []
        countsConsistent: true
        scope: REQUEST_LOCAL_SIMULATION; NO_DATABASE_OR_ACTUAL_EMAIL; NO_TRANSACTION_ACROSS_EXTERNAL_ADAPTERS
      detailDescription: <p>Một OrderLine có quantity 2 và unitPriceCents bằng Long.MAX_VALUE. <code>PurchaseOrder.subtotalCents</code> gọi <code>Math.multiplyExact</code>
        nên ArithmeticException được service đổi thành attempt rule ARITHMETIC_OVERFLOW, detail order arithmetic exceeds long range. Store và notice vẫn rỗng; HTTP
        200.</p>
    - id: case_005
      title: Danh sách attempts rỗng trả HTTP 400
      description: Không cung cấp lần checkout nào, vi phạm giới hạn 1–16.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          attempts: []
      status: 400
      response:
        code: INVALID_INPUT
        message: attempts must contain 1..16 checkout attempts
      detailDescription: <p><code>SolidExperimentService.experiment</code> kiểm tra danh sách attempts ở cấp request, yêu cầu 1–16 phần tử. <code>attempts=[]</code>
        không hợp lệ nên ném IllegalArgumentException trước khi tạo MemoryOrderStore; handler trả HTTP 400 INVALID_INPUT cùng thông báo 1..16.</p>
SubtypingExperimentController:
  dispatch(DispatchRequest):
    methodName: dispatch
    httpMethods:
    - POST
    mappingPaths:
    - /oop/subtyping/dispatch
    usage: true
    cases:
    - id: case_001
      title: 'CARD: override động và overload tĩnh'
      description: Cùng tham chiếu PaymentMethod nhưng class thực CardPayment; overload và override có kết quả khác nhau.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: CARD
          amountCents: 250
      status: 200
      response:
        declaredType: PaymentMethod
        runtimeType: CardPayment
        sameReferenceAfterUpcast: true
        description: CARD-****1234
        receipt: CARD:APPROVED:250
        overloadForBaseReference: OVERLOAD:PaymentMethod
        overloadForConcreteReference: OVERLOAD:CardPayment
        cardSpecificCapabilityAvailable: true
        cardLastFourDigits: '1234'
        legacyUsesAdapter: false
      detailDescription: <p>Kiểu khai báo và overload cơ sở là <code>PaymentMethod</code>, kiểu runtime là <code>CardPayment</code>. <code>charge(250)</code> trả
        <code>CARD:APPROVED:250</code>, <code>description()</code> trả <code>CARD-****1234</code>; kiểm tra instanceof cho phép overload CardPayment và đọc 1234.
        Upcast vẫn cùng object.</p>
    - id: case_002
      title: WALLET không có khả năng riêng của Card
      description: WalletPayment không thể dùng khả năng <code>lastFourDigits</code> của CardPayment.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: WALLET
          amountCents: 7
      status: 200
      response:
        declaredType: PaymentMethod
        runtimeType: WalletPayment
        sameReferenceAfterUpcast: true
        description: WALLET
        receipt: WALLET:APPROVED:7
        overloadForBaseReference: OVERLOAD:PaymentMethod
        overloadForConcreteReference: null
        cardSpecificCapabilityAvailable: false
        cardLastFourDigits: null
        legacyUsesAdapter: false
      detailDescription: <p><code>WalletPayment</code> vẫn implements <code>PaymentMethod</code> nên trả <code>WALLET:APPROVED:7</code>. Nhánh <code>instanceof CardPayment</code>
        là false, nên hai giá trị overload cụ thể và lastFourDigits là null; không ép kiểu xuống CardPayment.</p>
    - id: case_003
      title: LEGACY_ADAPTER là kiểu con thông qua adapter
      description: LegacyGateway không implements interface, cần LegacyPaymentAdapter để phù hợp kiểu PaymentMethod.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: LEGACY_ADAPTER
          amountCents: 200
      status: 200
      response:
        declaredType: PaymentMethod
        runtimeType: LegacyPaymentAdapter
        sameReferenceAfterUpcast: true
        description: ADAPTER(LEGACY)
        receipt: LEGACY:APPROVED:200
        overloadForBaseReference: OVERLOAD:PaymentMethod
        overloadForConcreteReference: null
        cardSpecificCapabilityAvailable: false
        cardLastFourDigits: null
        legacyUsesAdapter: true
      detailDescription: <p><code>LegacyPaymentAdapter</code> implements PaymentMethod và gọi <code>LegacyGateway.submitCents(200)</code>. Kết quả là <code>LEGACY:APPROVED:200</code>;
        cờ legacyUsesAdapter true chứng minh tương thích danh nghĩa nhờ wrapper, không phải do tên method trùng.</p>
    - id: case_004
      title: Từ chối số tiền bằng 0
      description: amountCents=0 nằm ngoài tiền điều kiện 1–100000000.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: CARD
          amountCents: 0
      status: 400
      response:
        code: INVALID_INPUT
        message: amountCents must be between 1 and 100000000
      detailDescription: <p><code>SubtypingExperimentService.dispatch</code> kiểm tra amount 1–100000000 trước khi tạo PaymentMethod; 0 ném IllegalArgumentException
        và handler trả HTTP 400 với code INVALID_INPUT.</p>
  contract(DiscountRequest):
    methodName: contract
    httpMethods:
    - POST
    mappingPaths:
    - /oop/subtyping/discount-contract
    usage: true
    cases:
    - id: case_001
      title: FIXED tuân thủ cả giá biên bằng 0
      description: Mức giảm cố định 60 cent được giới hạn để giá ròng không âm.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: FIXED
          pricesCents:
          - 0
          - 50
          - 100
          discountCents: 60
          percent: null
          minimumCents: null
      status: 200
      response:
        declaredType: DiscountPolicy
        runtimeType: FixedDiscount
        allCasesPass: true
        cases:
        - inputCents: 0
          netCents: 0
          satisfiedContract: true
          failure: null
        - inputCents: 50
          netCents: 0
          satisfiedContract: true
          failure: null
        - inputCents: 100
          netCents: 40
          satisfiedContract: true
          failure: null
      detailDescription: <p>Hợp đồng cho phép giá 0, 50 và 100; FixedDiscount(60) trả lần lượt 0, 0, 40 nhờ <code>Math.min(price,discount)</code>. Mỗi kết quả nằm
        trong khoảng từ 0 đến giá gốc nên allCasesPass=true.</p>
    - id: case_002
      title: PERCENT giảm giá với phép chia nguyên
      description: Phần trăm 25% của 7 cent cắt xuống phần tiền giảm bằng số nguyên.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: PERCENT
          pricesCents:
          - 0
          - 7
          - 100000000
          discountCents: null
          percent: 25
          minimumCents: null
      status: 200
      response:
        declaredType: DiscountPolicy
        runtimeType: PercentDiscount
        allCasesPass: true
        cases:
        - inputCents: 0
          netCents: 0
          satisfiedContract: true
          failure: null
        - inputCents: 7
          netCents: 6
          satisfiedContract: true
          failure: null
        - inputCents: 100000000
          netCents: 75000000
          satisfiedContract: true
          failure: null
      detailDescription: <p><code>PercentDiscount(25)</code> tính phần giảm bằng <code>(price * percent)/100</code> trên số nguyên. Giá 7 có phần giảm 1, còn 6; 100000000
        còn 75000000; giá 0 vẫn được chấp nhận. Không có vi phạm hợp đồng.</p>
    - id: case_003
      title: STRICT_MINIMUM phá vỡ tiền điều kiện LSP
      description: Subtype vẫn implements DiscountPolicy nhưng tăng tiền điều kiện, làm hai giá hợp lệ bị từ chối.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: STRICT_MINIMUM
          pricesCents:
          - 0
          - 49
          - 50
          - 100
          discountCents: null
          percent: null
          minimumCents: 50
      status: 200
      response:
        declaredType: DiscountPolicy
        runtimeType: StrictMinimumDiscount
        allCasesPass: false
        cases:
        - inputCents: 0
          netCents: null
          satisfiedContract: false
          failure: 'Precondition violated: valid supertype input rejected: Subtype strengthened precondition: minimum 50'
        - inputCents: 49
          netCents: null
          satisfiedContract: false
          failure: 'Precondition violated: valid supertype input rejected: Subtype strengthened precondition: minimum 50'
        - inputCents: 50
          netCents: 50
          satisfiedContract: true
          failure: null
        - inputCents: 100
          netCents: 100
          satisfiedContract: true
          failure: null
      detailDescription: <p>STRICT_MINIMUM(50) từ chối giá 0 và 49 dù chúng là input hợp lệ của DiscountPolicy, sinh netCents=null và failure bắt đầu bằng Precondition
        violated. Giá 50 và 100 được trả nguyên vẹn. HTTP 200 vẫn chứa allCasesPass=false để minh họa lỗi thay thế hành vi.</p>
    - id: case_004
      title: PERCENT vượt mức 100%
      description: Percent 101 không thuộc 0–100, bị constructor kiểm tra từ chối.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: PERCENT
          pricesCents:
          - 10
          discountCents: null
          percent: 101
          minimumCents: null
      status: 400
      response:
        code: INVALID_INPUT
        message: percent must be 0-100
      detailDescription: <p>Constructor PercentDiscount kiểm tra percent nằm trong 0–100. Giá trị 101 ném IllegalArgumentException với message <code>percent must
        be 0-100</code> trước vòng đánh giá, nên HTTP 400.</p>
    - id: case_005
      title: Danh sách giá trống
      description: Dãy pricesCents rỗng bị service từ chối trước vòng thử nghiệm.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          implementation: FIXED
          pricesCents: []
          discountCents: 5
          percent: null
          minimumCents: null
      status: 400
      response:
        code: INVALID_INPUT
        message: implementation and 1-20 pricesCents are required
      detailDescription: <p><code>discountContract</code> yêu cầu 1–20 giá; mảng rỗng bị từ chối ngay trước khi khởi tạo policy. Handler trả code INVALID_INPUT với
        thông báo chính xác của service.</p>
  geometry(GeometryRequest):
    methodName: geometry
    httpMethods:
    - POST
    mappingPaths:
    - /oop/subtyping/geometry-contract
    usage: true
    cases:
    - id: case_001
      title: RECTANGLE giữ hai setter độc lập
      description: MutableRectangle chỉ thay chiều được chỉ định; cả hai hậu điều kiện đều đúng.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: RECTANGLE
          initialWidth: 2
          initialHeight: 2
          newWidth: 5
          newHeight: 3
      status: 200
      response:
        declaredType: MutableRectangle
        runtimeType: MutableRectangle
        finalWidth: 5
        finalHeight: 3
        finalArea: 15
        widthSetterKeptHeight: true
        heightSetterKeptWidth: true
        rectangleContractRespected: true
        expectedRectangleArea: 15
        immutableRectangleArea: 15
        immutableSquareArea: 9
        immutableInterface: MeasurableShape
      detailDescription: <p>Với RECTANGLE khởi tạo 2×2, setWidth(5) để height giữ 2, rồi setHeight(3) để width giữ 5. Kết quả width=5, height=3, area=15 và rectangleContractRespected=true.
        Hai immutable shape chỉ chia sẻ hợp đồng area.</p>
    - id: case_002
      title: SQUARE vi phạm hợp đồng Rectangle
      description: MutableSquare thay cả hai chiều khi setWidth/setHeight, vi phạm hợp đồng cha.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: SQUARE_AS_RECTANGLE
          initialWidth: 2
          initialHeight: 2
          newWidth: 5
          newHeight: 3
      status: 200
      response:
        declaredType: MutableRectangle
        runtimeType: MutableSquare
        finalWidth: 3
        finalHeight: 3
        finalArea: 9
        widthSetterKeptHeight: false
        heightSetterKeptWidth: false
        rectangleContractRespected: false
        expectedRectangleArea: 15
        immutableRectangleArea: 15
        immutableSquareArea: 9
        immutableInterface: MeasurableShape
      detailDescription: <p>MutableSquare bắt đầu 2×2; setWidth(5) cũng đổi height thành 5, nên cờ thứ nhất false. setHeight(3) lại đổi width thành 3, cờ thứ hai
        false. Diện tích thực 9, trong khi hình chữ nhật kỳ vọng 5×3=15; subtype hợp lệ theo Java syntax nhưng không thay thế đúng hợp đồng.</p>
    - id: case_003
      title: SQUARE có hai cạnh ban đầu khác nhau
      description: Square phải khởi tạo width bằng height, sai sẽ bị từ chối.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: SQUARE_AS_RECTANGLE
          initialWidth: 2
          initialHeight: 3
          newWidth: 5
          newHeight: 3
      status: 400
      response:
        code: INVALID_INPUT
        message: Square initial width and height must be equal
      detailDescription: <p>Trước khi tạo MutableSquare, service kiểm tra initialWidth bằng initialHeight. Hai giá trị 2 và 3 khác nhau gây IllegalArgumentException
        <code>Square initial width and height must be equal</code>; HTTP 400.</p>
    - id: case_004
      title: Kích thước bằng 0 bị từ chối
      description: GeometryModels.requireDimension chỉ nhận 1–10000.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: RECTANGLE
          initialWidth: 0
          initialHeight: 3
          newWidth: 5
          newHeight: 4
      status: 400
      response:
        code: INVALID_INPUT
        message: Dimensions must be between 1 and 10000
      detailDescription: <p><code>GeometryModels.requireDimension</code> từ chối chiều rộng khởi tạo bằng 0 vì mỗi kích thước phải trong 1–10000, handler trả HTTP
        400 với message của method.</p>
    - id: case_005
      title: Giới hạn diện tích lớn không bị tràn
      description: Kích thước 10000×10000 trả diện tích 100000000 dưới kiểu long.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: RECTANGLE
          initialWidth: 1
          initialHeight: 1
          newWidth: 10000
          newHeight: 10000
      status: 200
      response:
        declaredType: MutableRectangle
        runtimeType: MutableRectangle
        finalWidth: 10000
        finalHeight: 10000
        finalArea: 100000000
        widthSetterKeptHeight: true
        heightSetterKeptWidth: true
        rectangleContractRespected: true
        expectedRectangleArea: 100000000
        immutableRectangleArea: 100000000
        immutableSquareArea: 100000000
        immutableInterface: MeasurableShape
      detailDescription: <p>RECTANGLE ban đầu 1×1, thay cả hai chiều thành 10000 vẫn đúng hợp đồng setter độc lập. <code>area()</code> nhân dưới kiểu long nên trả
        100000000, đối chiếu cùng immutable rectangle; không phát sinh overflow.</p>
TestingExperimentController:
  contracts(ContractRequest):
    methodName: contracts
    httpMethods:
    - POST
    mappingPaths:
    - /oop/testing/inventory/contracts
    usage: true
    cases:
    - id: case_001
      title: Hợp đồng phát hiện state mutation khi reserve bị từ chối
      description: Cùng một chuỗi hành động cho ba implementation; MONITOR/ATOMIC đạt chuẩn, BROKEN phá invariant.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          capacity: 10
          actions:
          - type: RESERVE
            seats: 4
          - type: RESERVE
            seats: 7
          - type: CANCEL
            seats: 2
          - type: RESERVE
            seats: 8
      status: 200
      response:
        initial:
          capacity: 10
          reserved: 0
        runs:
        - implementation: MONITOR
          allPassed: true
          passedSteps: 4
          steps:
          - index: 1
            action: RESERVE
            seats: 4
            expectedAccepted: true
            actualAccepted: true
            expectedSnapshot:
              capacity: 10
              reserved: 4
            actualSnapshot:
              capacity: 10
              reserved: 4
            passed: true
            violations: []
          - index: 2
            action: RESERVE
            seats: 7
            expectedAccepted: false
            actualAccepted: false
            expectedSnapshot:
              capacity: 10
              reserved: 4
            actualSnapshot:
              capacity: 10
              reserved: 4
            passed: true
            violations: []
          - index: 3
            action: CANCEL
            seats: 2
            expectedAccepted: true
            actualAccepted: true
            expectedSnapshot:
              capacity: 10
              reserved: 2
            actualSnapshot:
              capacity: 10
              reserved: 2
