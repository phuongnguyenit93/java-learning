    usage: true
    cases:
    - id: case_001
      title: Thiếu hàng không đổi tồn kho
      description: REGISTER 2, RESERVE 3 bị từ chối rồi RESERVE 1 thành công.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          actions:
          - type: REGISTER
            tenantId: T
            sku: BOOK
            quantity: 2
            contactEmail: sensitive@example.org
            providerToken: secret-123
          - type: RESERVE
            tenantId: T
            sku: BOOK
            quantity: 3
          - type: READ
            tenantId: T
            sku: BOOK
          - type: RESERVE
            tenantId: T
            sku: BOOK
            quantity: 1
      status: 200
      response:
        steps:
        - index: 1
          action: REGISTER
          accepted: true
          code: REGISTERED
          available: 2
          diagnostic: StockItem{tenantId=T, sku=BOOK, available=2}
        - index: 2
          action: RESERVE
          accepted: false
          code: INSUFFICIENT_STOCK
          available: 2
          diagnostic: StockItem{tenantId=T, sku=BOOK, available=2}
        - index: 3
          action: READ
          accepted: true
