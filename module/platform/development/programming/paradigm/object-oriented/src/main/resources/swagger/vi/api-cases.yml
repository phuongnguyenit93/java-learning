          Content-Type: application/json
        body:
          orderId: ORD-3
          totalVnd: 100
          actions:
          - event: SUBMIT
          - event: CONFIRM_PAYMENT
            receivedVnd: 100
          - event: START_PACKING
          - event: SHIP
            trackingCode: bad
          - event: SHIP
            trackingCode: TRACK-2
      status: 200
      response:
        initial:
          id: ORD-3
          state: DRAFT
          totalVnd: 100
          trackingCode: null
        steps:
        - index: 1
          event: SUBMIT
          accepted: true
          rule: null
          detail: transition applied
          before:
            id: ORD-3
            state: DRAFT
            totalVnd: 100
            trackingCode: null
          after:
            id: ORD-3
            state: WAITING_PAYMENT
            totalVnd: 100
            trackingCode: null
        - index: 2
          event: CONFIRM_PAYMENT
          accepted: true
          rule: null
          detail: transition applied
          before:
            id: ORD-3
            state: WAITING_PAYMENT
            totalVnd: 100
            trackingCode: null
          after:
            id: ORD-3
            state: PAID
            totalVnd: 100
            trackingCode: null
        - index: 3
          event: START_PACKING
          accepted: true
          rule: null
          detail: transition applied
          before:
            id: ORD-3
            state: PAID
            totalVnd: 100
            trackingCode: null
          after:
            id: ORD-3
            state: PACKING
            totalVnd: 100
            trackingCode: null
        - index: 4
          event: SHIP
          accepted: false
          rule: TRACKING_GUARD
          detail: trackingCode must be 3..32 uppercase letters/digits/hyphens
          before:
            id: ORD-3
            state: PACKING
            totalVnd: 100
            trackingCode: null
          after:
            id: ORD-3
            state: PACKING
            totalVnd: 100
            trackingCode: null
        - index: 5
          event: SHIP
          accepted: true
          rule: null
          detail: transition applied
          before:
            id: ORD-3
            state: PACKING
            totalVnd: 100
            trackingCode: null
          after:
            id: ORD-3
            state: SHIPPED
            totalVnd: 100
            trackingCode: TRACK-2
        current:
          id: ORD-3
          state: SHIPPED
          totalVnd: 100
          trackingCode: TRACK-2
        scope: REQUEST_LOCAL_ONLY_SIMULATED_ORDER_NO_PAYMENT_OR_EXTERNAL_SHIPPING
      detailDescription: '<p>Sau SUBMIT, x?c nh?n ?? 100 v? START_PACKING, state l? PACKING. SHIP v?i trackingCode <code>bad</code> kh?ng kh?p regex ch? hoa <code>[A-Z0-9-]{3,32}</code>,
        n?n <code>ModeledOrder</code> ph?t <code>TRACKING_GUARD</code> tr??c khi g?n field, tr? before=after=PACKING.</p>

        <p>L?n SHIP ti?p theo d?ng TRACK-2 ??ng quy t?c, chuy?n sang SHIPPED v? l?u trackingCode. HTTP 200 c? b??c b? t? ch?i v? b??c h?p l? m? kh?ng g?y ??t bi?n
        t?ng ph?n.</p>'
    - id: case_004
      title: T? ch?i event kh?ng thu?c state machine
      description: Event UNKNOWN b? lo?i khi parse enum tr??c v?ng ch?y, kh?ng t?o OrderResult t?ng ph?n.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORD-1
          totalVnd: 100
          actions:
          - event: UNKNOWN
      status: 400
      response:
        error: unsupported order event
      detailDescription: <p><code>ModelingExperimentService.order</code> duy?t tr??c to?n b? danh s?ch action v? g?i <code>ModeledOrder.Event.valueOf(&quot;UNKNOWN&quot;)</code>.
        Enum kh?ng c? gi? tr? ?? n?n service chuy?n l?i th?nh <code>IllegalArgumentException(&quot;unsupported order event&quot;)</code>. Handler tr? HTTP 400 v?i
        <code>{"error":"unsupported order event"}</code> thay v? m?t b??c rejected trong HTTP 200.</p>
ObjectExperimentsController:
  references(ObjectExperimentDto.ReferenceRequest):
    methodName: references
    httpMethods:
    - POST
    mappingPaths:
    - /oop/objects/references
    usage: true
    cases:
    - id: case_001
      title: Alias cùng thấy một lần tăng
      description: Truyền tham chiếu qua tham số làm đổi giá trị của đối tượng chung nhưng không thay đổi biến tham chiếu của nơi gọi.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          name: Counter
          initialValue: 10
          increment: 4
      status: 200
      response:
        aliasIsSameInstance: true
        separatelyCreatedIsDifferentInstance: true
        separatelyCreatedInitiallyHadSameState: true
        callerReferenceSurvivesParameterReassignment: true
        before: 10
        afterThroughOriginal: 14
        afterThroughAlias: 14
        independentInstanceValue: 10
        name: Counter
      detailDescription: <p><code>alias = original</code> trỏ tới đúng một <code>MutableCounter</code>, nên phép cộng 4 qua <code>addThroughParameter()</code> thay
        đổi cả hai cách quan sát từ 10 thành 14. <code>replaceParameterLocally()</code> chỉ đổi biến tham số của chính phương thức, nên <code>callerReferenceSurvivesParameterReassignment</code>
        vẫn true. Instance tạo riêng giữ 10 dù ban đầu có cùng tên và giá trị.</p>
    - id: case_002
      title: Từ chối lượng tăng bằng không
      description: Giới hạn tham số chặn đầu vào trước khi tạo và thay đổi đối tượng.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          name: Counter
          initialValue: 10
          increment: 0
      status: 400
      response:
        error: increment must be between 1 and 1000
      detailDescription: <p><code>boundedInt(&quot;increment&quot;, 0, 1, 1000)</code> ném <code>IllegalArgumentException</code> trước khi tạo <code>MutableCounter</code>.
        <code>ObjectExperimentExceptionHandler</code> trả HTTP 400 cùng chuỗi <code>error</code> nguyên gốc.</p>
  equality(ObjectExperimentDto.EqualityRequest):
    methodName: equality
    httpMethods:
    - POST
    mappingPaths:
    - /oop/objects/equality
    usage: true
    cases:
    - id: same_value
      title: Hai đối tượng khác nhau nhưng cùng giá trị
      description: Hai record được tạo riêng biệt nhưng equals và hashCode bằng nhau; HashSet giữ một phần tử.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          firstCode: SKU-01
          secondCode: SKU-01
      status: 200
      response:
        sameInstance: false
        valueEquals: true
        hashCodesEqual: true
        hashSetSize: 1
        defaultObjectEquals: false
        aliasIsSameInstance: true
      detailDescription: <p>Hai <code>ProductCode(&quot;SKU-01&quot;)</code> được tạo bằng hai lệnh khởi tạo riêng nên <code>sameInstance</code> false. Record so
        sánh trường <code>value</code> nên <code>equals()</code> và <code>hashCode()</code> bằng nhau, khiến <code>HashSet</code> chỉ có một phần tử. Hai <code>LegacyIdentityCode</code>
        vẫn so sánh theo danh tính; biến alias trỏ đúng record đầu.</p>
    - id: different_value
      title: Hai mã sản phẩm khác nhau
      description: Hai record có giá trị khác nhau nên equals trả về false và HashSet có hai phần tử.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          firstCode: A
          secondCode: B
      status: 200
      response:
        sameInstance: false
        valueEquals: false
        hashCodesEqual: false
        hashSetSize: 2
        defaultObjectEquals: false
        aliasIsSameInstance: true
      detailDescription: <p>Hai record có mã <code>A</code> và <code>B</code> nên không bằng nhau theo giá trị; mã băm cho chính hai chuỗi này khác nhau và <code>HashSet</code>
        giữ hai phần tử. Cả hai vẫn là hai instance riêng. <code>aliasIsSameInstance</code> true do alias gán từ record đầu, còn hai LegacyIdentityCode luôn khác
        instance.</p>
    - id: invalid_code
      title: Mã sản phẩm không hợp lệ
      description: firstCode rỗng bị từ chối với HTTP 400.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          firstCode: ''
          secondCode: A
      status: 400
      response:
        error: firstCode must contain 1 to 80 nonblank characters
      detailDescription: <p><code>ObjectSemanticsService.requiredText(&quot;firstCode&quot;, &quot;&quot;)</code> từ chối mã trống trước khi tạo các record. <code>ObjectExperimentExceptionHandler.invalidInput()</code>
        trả HTTP 400 với <code>ApiError.error</code> đúng bằng chuỗi exception.</p>
  copies(ObjectExperimentDto.CopyRequest):
    methodName: copies
    httpMethods:
    - POST
    mappingPaths:
    - /oop/objects/copies
    usage: true
    cases:
    - id: case_001
      title: Bản sao nông cùng thấy sửa đổi bên trong
      description: Đổi nhãn phần tử cho thấy List.copyOf chỉ cố định cấu trúc danh sách, còn phần tử mutable vẫn được chia sẻ.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          originalLabel: old
          updatedLabel: updated
          addedLabel: additional
      status: 200
      response:
        outerListsAreDifferent: true
        shallowCopySharesElement: true
        deepCopyHasIndependentElement: true
        originalAfterMutation:
        - updated
        - additional
        shallowAfterMutation:
        - updated
        deepAfterMutation:
        - old
        unmodifiableSnapshotAfterMutation:
        - updated
        immutableValueSnapshot: old
      detailDescription: <p>Danh sách gốc, shallow copy và <code>List.copyOf(original)</code> đều tham chiếu đến <code>MutableItem</code> đầu tiên. Đổi <code>label</code>
        từ <code>old</code> sang <code>updated</code> vì thế hiện ra trong ba danh sách. <code>original.add()</code> chỉ thêm phần tử <code>additional</code> vào
        danh sách gốc; deep copy giữ nhãn <code>old</code> do đã tạo <code>MutableItem</code> khác, và <code>ItemValue</code> đã chụp chuỗi cũ.</p>
    - id: case_002
      title: Từ chối nhãn cập nhật bị thiếu
      description: Các tham số văn bản bắt buộc được kiểm tra trước thao tác copy.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          originalLabel: old
          updatedLabel: null
          addedLabel: extra
      status: 400
      response:
        error: updatedLabel must contain 1 to 80 nonblank characters
      detailDescription: <p><code>requiredText(&quot;updatedLabel&quot;, null)</code> thất bại ngay ở bước xác thực nên không khởi tạo các bản sao. Handler gói <code>IllegalArgumentException</code>
        thành HTTP 400 và giữ nguyên thông điệp lỗi.</p>
  absence(ObjectExperimentDto.AbsenceRequest):
    methodName: absence
    httpMethods:
    - POST
    mappingPaths:
    - /oop/objects/absence
    usage: true
    cases:
    - id: case_001
      title: Có khách hàng nhưng chưa có địa chỉ
      description: Khách hàng tồn tại và tên vẫn được trả về khi Optional địa chỉ trống.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          lookupId: C01
          optionalAddress: null
      status: 200
      response:
        lookupId: C01
        found: true
        optionalAddressPresent: false
        customerName: Lan
        addresses: []
        emptyCollectionMeansNoItems: true
      detailDescription: <p>Kho mẫu có <code>C01</code> nên <code>found</code> là true và <code>customerName</code> bằng <code>Lan</code>. <code>optionalAddress =
        null</code> làm <code>Customer.shippingAddress()</code> trả <code>Optional.empty()</code>; danh sách địa chỉ rỗng và cờ <code>optionalAddressPresent</code>
        false. Không được kết luận khách hàng không tồn tại từ một địa chỉ trống.</p>
    - id: case_002
      title: Chuẩn hóa địa chỉ tùy chọn
      description: trim loại khoảng trắng ở hai đầu trước khi trả địa chỉ có thật.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          lookupId: C01
          optionalAddress: ' Ha Noi '
      status: 200
      response:
        lookupId: C01
        found: true
        optionalAddressPresent: true
        customerName: Lan
        addresses:
        - Ha Noi
        emptyCollectionMeansNoItems: false
      detailDescription: <p><code>optionalAddress.trim()</code> biến chuỗi <code> Ha Noi </code> thành <code>Ha Noi</code>. Vì ID <code>C01</code> tồn tại và địa
        chỉ sau trim không rỗng, <code>shippingAddress()</code> có giá trị, nên <code>addresses</code> có đúng một phần tử và <code>emptyCollectionMeansNoItems</code>
        false.</p>
    - id: case_003
      title: Không tìm thấy khách hàng
      description: Địa chỉ được gửi lên không tạo khách hàng nếu ID tra cứu không có trong dữ liệu mẫu.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          lookupId: C99
          optionalAddress: Ha Noi
      status: 200
      response:
        lookupId: C99
        found: false
        optionalAddressPresent: false
        customerName: null
        addresses: []
        emptyCollectionMeansNoItems: true
      detailDescription: '<p>Kho chỉ chứa <code>C01</code>, nên tra <code>C99</code> cho kết quả null và <code>Optional.empty()</code>. <code>flatMap(Customer::shippingAddress)</code>
        không được gọi với Customer nào: tên null, địa chỉ không hiện diện và danh sách rỗng, dù request có gửi <code>optionalAddress</code>.</p>'
    - id: case_004
      title: ID tra cứu rỗng không hợp lệ
      description: Đầu vào bắt buộc phải có ký tự hữu nghĩa.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          lookupId: ''
          optionalAddress: null
      status: 400
      response:
        error: lookupId must contain 1 to 80 nonblank characters
      detailDescription: <p><code>requiredText()</code> từ chối chuỗi rỗng trước khi tạo kho dữ liệu mẫu. <code>IllegalArgumentException</code> được handler đổi thành
        HTTP 400 với thông điệp <code>lookupId must contain 1 to 80 nonblank characters</code>.</p>
  checkout(ObjectExperimentDto.CheckoutRequest):
    methodName: checkout
    httpMethods:
    - POST
    mappingPaths:
    - /oop/objects/checkout
    usage: true
    cases:
    - id: case_001
      title: Thanh toán mô phỏng thành công
      description: Tồn kho giảm từ 5 xuống 3 và có order, transaction cùng sự kiện thông báo mô phỏng.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOOK
          startingStock: 5
          quantity: 2
          unitPrice: 100
          paymentApproved: true
      status: 200
      response:
        outcome: COMPLETED
        simulatedOnly: true
        orderId: DEMO-ORDER
        transactionId: DEMO-TXN
        total: 200
        stockBefore: 5
        stockAfter: 3
        notificationSent: true
        events:
        - step: 1
          actor: Client
          operation: checkout(cart)
          observation: Request enters OrderService
          stockAfter: 5
        - step: 2
          actor: Cart
          operation: total()
          observation: '200'
          stockAfter: 5
        - step: 3
          actor: Inventory
          operation: reserve()
          observation: Reserved 2 item(s)
          stockAfter: 3
        - step: 4
          actor: PaymentGateway
          operation: pay()
          observation: 'Approved: DEMO-TXN'
          stockAfter: 3
        - step: 5
          actor: OrderService
          operation: new Order()
          observation: Created local simulated order
          stockAfter: 3
        - step: 6
          actor: Notifier
          operation: send(order)
          observation: Simulated notification (not transmitted)
          stockAfter: 3
      detailDescription: <p><code>Cart.total()</code> nhân đơn giá 100 với số lượng 2 thành 200. <code>Inventory.reserve(2)</code> giảm tồn 5 xuống 3; <code>PaymentGateway.pay()</code>
        cho <code>DEMO-TXN</code>. Service tạo order <code>DEMO-ORDER</code>, gọi <code>Notifier.send()</code> chỉ để đánh dấu, rồi trả sáu sự kiện theo thứ tự Client,
        Cart, Inventory, PaymentGateway, OrderService và Notifier. Không có thanh toán hay thông báo thật.</p>
    - id: case_002
      title: Thiếu hàng trước thanh toán
      description: Inventory từ chối giữ 2 sản phẩm khi chỉ còn 1 nên bỏ qua PaymentGateway.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOOK
          startingStock: 1
          quantity: 2
          unitPrice: 100
          paymentApproved: true
      status: 200
      response:
        outcome: STOCK_REJECTED
        simulatedOnly: true
        orderId: null
        transactionId: null
        total: 200
        stockBefore: 1
        stockAfter: 1
        notificationSent: false
        events:
        - step: 1
          actor: Client
          operation: checkout(cart)
          observation: Request enters OrderService
          stockAfter: 1
        - step: 2
          actor: Cart
          operation: total()
          observation: '200'
          stockAfter: 1
        - step: 3
          actor: Inventory
          operation: reserve()
          observation: 'Rejected: not enough stock'
          stockAfter: 1
      detailDescription: <p>Tổng tiền vẫn được tính là 200 trước khi kiểm kho. <code>Inventory.reserve(2)</code> trả false vì tồn 1, không trừ kho; nhánh <code>STOCK_REJECTED</code>
        chỉ có ba sự kiện Client, Cart, Inventory. <code>orderId</code>/<code>transactionId</code> null và không có thông báo. Đây là kết quả nghiệp vụ HTTP 200.</p>
    - id: case_003
      title: Thanh toán từ chối và hoàn tồn
      description: Kho đã giữ hai sản phẩm nhưng được trả lại khi cổng thanh toán mô phỏng từ chối.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOOK
          startingStock: 5
          quantity: 2
          unitPrice: 100
          paymentApproved: false
      status: 200
      response:
        outcome: PAYMENT_DECLINED
        simulatedOnly: true
        orderId: null
        transactionId: null
        total: 200
        stockBefore: 5
        stockAfter: 5
        notificationSent: false
        events:
        - step: 1
          actor: Client
          operation: checkout(cart)
          observation: Request enters OrderService
          stockAfter: 5
        - step: 2
          actor: Cart
          operation: total()
          observation: '200'
          stockAfter: 5
        - step: 3
          actor: Inventory
          operation: reserve()
          observation: Reserved 2 item(s)
          stockAfter: 3
        - step: 4
          actor: PaymentGateway
          operation: pay()
          observation: Rejected by simulated gateway
          stockAfter: 3
        - step: 5
          actor: Inventory
          operation: release()
          observation: Restored reservation after definite rejection
          stockAfter: 5
      detailDescription: <p>Giữ hàng thành công làm tồn tạm giảm từ 5 xuống 3. <code>PaymentGateway.pay()</code> ném <code>PaymentDeclinedException</code>, được <code>simulate()</code>
        bắt; <code>Inventory.release(2)</code> khôi phục tồn 5. Trace có năm bước, không tạo order và không thông báo; trạng thái là <code>PAYMENT_DECLINED</code>
        HTTP 200.</p>
    - id: case_004
      title: Từ chối đơn giá quá nhỏ và quá nhiều số lẻ
      description: Đơn giá 0.001 vi phạm cả ngưỡng tối thiểu lẫn độ chính xác cho phép.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOOK
          startingStock: 5
          quantity: 2
          unitPrice: 0.001
          paymentApproved: true
      status: 400
      response:
        error: unitPrice must be between 0.01 and 1000000 with at most 2 decimal places
      detailDescription: <p>Trước khi tạo Cart hay giữ hàng, <code>unitPrice.compareTo(0.01)</code> xác định giá 0.001 nhỏ hơn tối thiểu; đồng thời <code>scale()</code>
        của số này vượt hai chữ số thập phân. Service ném <code>IllegalArgumentException</code>, handler trả HTTP 400 và nội dung <code>error</code> nguyên gốc.</p>
    - id: case_005
      title: Từ chối đặt số lượng bằng không
      description: Quy tắc quantity ngăn tạo giỏ hàng với số lượng không dương.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOOK
          startingStock: 5
          quantity: 0
          unitPrice: 100
          paymentApproved: true
      status: 400
      response:
        error: quantity must be between 1 and 100
      detailDescription: <p><code>boundedInt(&quot;quantity&quot;, 0, 1, 100)</code> thất bại trước khi tạo các đối tượng checkout. Do đó không có hoạt động giữ kho
        hay payment; handler trả HTTP 400 với thông điệp của service.</p>
BasicsExperimentController:
  simulateAccount(AccountSimulationRequest):
    methodName: simulateAccount
    httpMethods:
    - POST
    mappingPaths:
    - /oop/basics/accounts/simulate
    usage: true
    cases:
    - id: case_001
      title: Nạp rồi rút tiền thành công
      description: Một tài khoản độc lập nhận tiền nạp và khoản rút hợp lệ; timeline cho thấy trạng thái trước và sau từng thao tác.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          accountId: DEMO-001
          openingBalanceCents: 10000
          actions:
          - action: DEPOSIT
            amountCents: 2500
          - action: WITHDRAW
            amountCents: 4000
      status: 200
      response:
        accountId: DEMO-001
        openingBalanceCents: 10000
        finalBalanceCents: 8500
        timeline:
        - step: 1
          action: DEPOSIT
          amountCents: 2500
          balanceBeforeCents: 10000
          balanceAfterCents: 12500
          accepted: true
          reason: null
        - step: 2
          action: WITHDRAW
          amountCents: 4000
          balanceBeforeCents: 12500
          balanceAfterCents: 8500
          accepted: true
          reason: null
      detailDescription: "<p>Case thành công: Controller nhận POST /oop/basics/accounts/simulate rồi chuyển DTO sang BasicsExperimentService.simulateAccount. Không\
        \ có trạng thái tài khoản lưu giữa các request; mọi số tiền đều tính bằng cents.</p>\n<ol>\n<li>requireSteps xác nhận actions có 2 phần tử (giới hạn 1–20);\
        \ BankAccount(&#39;DEMO-001&#39;, 10000) kiểm tra accountId hợp lệ và số dư khởi tạo không âm.</li>\n<li>Bước 1 DEPOSIT 2500 gọi BankAccount.deposit, requirePositive\
        \ vượt qua; Math.addExact cho 10000 + 2500 = 12500. Timeline ghi before=10000, after=12500, accepted=true.</li>\n<li>Bước 2 WITHDRAW 4000 gọi BankAccount.withdraw,\
        \ 4000 không vượt 12500 nên còn 8500. Timeline ghi before=12500, after=8500, accepted=true, reason=null.</li>\n<li>Service trả finalBalanceCents=8500 và hai\
        \ mục timeline; không exception thoát ra HTTP boundary nên status 200.</li>\n</ol>\n<pre><code>controller.simulateAccount(request)\n  -&gt; service.simulateAccount(request)\n\
        \  -&gt; new BankAccount(&quot;DEMO-001&quot;, 10000)\n  -&gt; deposit(2500): 10000 -&gt; 12500\n  -&gt; withdraw(4000): 12500 -&gt; 8500</code></pre>"
    - id: case_002
      title: Không đủ số dư nhưng không hủy cả chuỗi
      description: Rút nhiều hơn số dư bị từ chối ở mức nghiệp vụ, HTTP vẫn 200; lệnh nạp tiếp theo vẫn thành công.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          accountId: WALLET-2
          openingBalanceCents: 500
          actions:
          - action: WITHDRAW
            amountCents: 800
          - action: DEPOSIT
            amountCents: 100
      status: 200
      response:
        accountId: WALLET-2
        openingBalanceCents: 500
        finalBalanceCents: 600
        timeline:
        - step: 1
          action: WITHDRAW
          amountCents: 800
          balanceBeforeCents: 500
          balanceAfterCents: 500
          accepted: false
          reason: Insufficient balance
        - step: 2
          action: DEPOSIT
          amountCents: 100
          balanceBeforeCents: 500
          balanceAfterCents: 600
          accepted: true
          reason: null
      detailDescription: '<p>Case rút quá số dư: yêu cầu hợp lệ về mặt HTTP và DTO, nhưng thao tác WITHDRAW đầu tiên bị từ chối ở mức nghiệp vụ; chuỗi không bị dừng.</p>

        <ol>

        <li>BasicsExperimentService tạo BankAccount(&#39;WALLET-2&#39;,500) và duyệt 2 actions. Lệnh WITHDRAW 800 gọi BankAccount.withdraw(800).</li>

        <li>Vì 800 &gt; 500, withdraw trả false mà không ném exception. Service ghi accepted=false, reason=&#39;Insufficient balance&#39;, balanceBeforeCents=balanceAfterCents=500.</li>

        <li>Bước DEPOSIT 100 tiếp theo vẫn chạy, nâng số dư 500 thành 600; timeline bước hai accepted=true, reason=null.</li>

        <li>Đây không phải lỗi toàn request: service trả AccountSimulationResponse(finalBalanceCents=600); Controller trả HTTP 200 thay vì HTTP 400.</li>

        </ol>

        <pre><code>withdraw(800) on balance=500 -&gt; false (unchanged)

        DEPOSIT 100 -&gt; balance=600

        HTTP 200; timeline[0].accepted=false; timeline[1].accepted=true</code></pre>'
    - id: case_003
      title: Nạp 0 bị từ chối nhưng số dư giữ nguyên
      description: Vi phạm invariant của đối tượng BankAccount được ghi trong timeline, các bước sau vẫn xử lý.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          accountId: BALANCE
          openingBalanceCents: 500
          actions:
          - action: DEPOSIT
            amountCents: 0
          - action: DEPOSIT
            amountCents: 100
      status: 200
      response:
        accountId: BALANCE
        openingBalanceCents: 500
        finalBalanceCents: 600
        timeline:
        - step: 1
          action: DEPOSIT
          amountCents: 0
          balanceBeforeCents: 500
          balanceAfterCents: 500
          accepted: false
          reason: amountCents must be positive
        - step: 2
          action: DEPOSIT
          amountCents: 100
          balanceBeforeCents: 500
          balanceAfterCents: 600
          accepted: true
          reason: null
      detailDescription: '<p>Case nạp 0: BankAccount chặn biến đổi không hợp lệ, nhưng service bắt lỗi cho riêng từng action để thử các hành động còn lại.</p>

        <ol>

        <li>Tạo tài khoản BALANCE với openingBalanceCents=500; actions có 2 phần tử nên vượt kiểm tra requireSteps.</li>

        <li>Lệnh DEPOSIT 0 đi vào BankAccount.deposit(0); requirePositive ném IllegalArgumentException(&#39;amountCents must be positive&#39;) trước khi cập nhật
        balance.</li>

        <li>Khối catch trong vòng lặp của BasicsExperimentService ghi bước một accepted=false, reason chính xác thông báo lỗi, balanceBeforeCents=balanceAfterCents=500.</li>

        <li>Bước DEPOSIT 100 sau đó thành công, số dư cuối 600. Exception đã được bắt bên trong service nên HTTP 200; đây là lỗi action, không phải lỗi request.</li>

        </ol>

        <pre><code>deposit(0) -&gt; IllegalArgumentException

        catch per action -&gt; accepted=false, balance=500

        deposit(100) -&gt; balance=600; HTTP 200</code></pre>'
    - id: case_004
      title: Mã tài khoản sai định dạng — HTTP 400
      description: Lỗi ở đầu request không được đưa vào timeline; handler trả về mã INVALID_INPUT.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          accountId: bad id
          openingBalanceCents: 100
          actions:
          - action: DEPOSIT
            amountCents: 50
      status: 400
      response:
        code: INVALID_INPUT
        message: accountId must contain 1-40 letters, digits, '_' or '-'
      detailDescription: "<p>Case HTTP 400: mã &#39;bad id&#39; chứa dấu cách, không khớp invariant định danh tài khoản của BankAccount.</p>\n<ol>\n<li>BasicsExperimentController\
        \ tiếp nhận request và gọi service.simulateAccount; requireSteps xác nhận mảng actions có một phần tử.</li>\n<li>Khi new BankAccount(&#39;bad id&#39;,100),\
        \ constructor kiểm tra regex [A-Za-z0-9_-]{1,40} và ném IllegalArgumentException ngay lập tức, trước vòng lặp xử lý actions.</li>\n<li>Lỗi khởi tạo không\
        \ nằm trong try/catch theo từng action nên thoát khỏi service. BasicsExperimentExceptionHandler, chỉ áp dụng cho BasicsExperimentController, bắt IllegalArgumentException.</li>\n\
        <li>Handler trả HTTP 400 với JSON code=&#39;INVALID_INPUT&#39; và message đúng văn bản invariant. Không có AccountSimulationResponse hay timeline vì tài khoản\
        \ chưa được tạo.</li>\n</ol>\n<pre><code>new BankAccount(&quot;bad id&quot;,100)\n  -&gt; invalid accountId regex -&gt; IllegalArgumentException\n  -&gt;\
        \ BasicsExperimentExceptionHandler.invalidInput\n  -&gt; HTTP 400 {code:&quot;INVALID_INPUT&quot;, message:&quot;accountId must contain 1-40 letters, digits,\
        \ &#39;_&#39; or &#39;-&#39;&quot;}</code></pre>"
  simulateOrder(OrderSimulationRequest):
    methodName: simulateOrder
    httpMethods:
    - POST
    mappingPaths:
    - /oop/basics/orders/simulate
    usage: true
    cases:
    - id: case_001
      title: Thêm hai mặt hàng và xác nhận đơn
      description: Aggregate chuyển DRAFT → CONFIRMED, cộng tổng từ các dòng và phản ánh số dòng sau mỗi bước.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORD-100
          steps:
          - action: ADD_LINE
            sku: BOOK
            quantity: 2
            unitPriceCents: 1250
          - action: ADD_LINE
            sku: PEN
            quantity: 3
            unitPriceCents: 200
          - action: CONFIRM
      status: 200
      response:
        orderId: ORD-100
        finalStatus: CONFIRMED
        totalCents: 3100
        timeline:
        - step: 1
          action: ADD_LINE
          statusBefore: DRAFT
          statusAfter: DRAFT
          totalBeforeCents: 0
          totalAfterCents: 2500
          lineCountAfter: 1
          accepted: true
          reason: null
        - step: 2
          action: ADD_LINE
          statusBefore: DRAFT
          statusAfter: DRAFT
          totalBeforeCents: 2500
          totalAfterCents: 3100
          lineCountAfter: 2
          accepted: true
          reason: null
        - step: 3
          action: CONFIRM
          statusBefore: DRAFT
          statusAfter: CONFIRMED
          totalBeforeCents: 3100
          totalAfterCents: 3100
          lineCountAfter: 2
          accepted: true
          reason: null
      detailDescription: '<p>Case thêm hàng và xác nhận: OrderAggregate giữ invariant và trạng thái DRAFT cho đến khi xác nhận thành công.</p>

        <ol>

        <li>Controller gọi simulateOrder với orderId=&#39;ORD-100&#39; và 3 steps; requireSteps cho phép số lượng 1–20. new OrderAggregate tạo status=DRAFT, totalCents=0,
        lines rỗng.</li>

        <li>ADD_LINE BOOK: OrderAggregate.Line kiểm tra sku, quantity=2 và unitPriceCents=1250, Math.multiplyExact(2,1250)=2500; total thành 2500, lineCountAfter=1.</li>

        <li>ADD_LINE PEN: 3×200=600, Math.addExact(2500,600)=3100, số dòng thành 2; cả hai bước vẫn DRAFT và accepted=true.</li>

        <li>CONFIRM gọi order.confirm(), kiểm tra đang DRAFT và lines không rỗng rồi chuyển CONFIRMED, total vẫn 3100. Timeline 3 bước có giá trị before/after tương
        ứng; HTTP 200.</li>

        </ol>

        <pre><code>new OrderAggregate(&quot;ORD-100&quot;) // DRAFT, total=0

        addLine(&quot;BOOK&quot;,2,1250) -&gt; total=2500

        addLine(&quot;PEN&quot;,3,200) -&gt; total=3100

        confirm() -&gt; CONFIRMED; HTTP 200</code></pre>'
    - id: case_002
      title: Không thể xác nhận đơn rỗng
      description: Nghiệp vụ từ chối CONFIRM; đơn vẫn ở DRAFT và HTTP trả 200 cùng timeline giải thích.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORD-EMPTY
          steps:
          - action: CONFIRM
      status: 200
      response:
        orderId: ORD-EMPTY
        finalStatus: DRAFT
        totalCents: 0
        timeline:
        - step: 1
          action: CONFIRM
          statusBefore: DRAFT
          statusAfter: DRAFT
          totalBeforeCents: 0
          totalAfterCents: 0
          lineCountAfter: 0
          accepted: false
          reason: Cannot confirm an empty order
      detailDescription: '<p>Case xác nhận đơn rỗng: hành động CONFIRM thất bại nhưng request HTTP vẫn được xử lý và trả timeline mô tả lỗi nghiệp vụ.</p>

        <ol>

        <li>OrderAggregate(&#39;ORD-EMPTY&#39;) khởi tạo DRAFT, 0 dòng, totalCents=0; requireSteps chấp nhận một action CONFIRM.</li>

        <li>OrderAggregate.confirm() gọi requireDraft() thành công rồi phát hiện lines.isEmpty() và ném IllegalStateException(&#39;Cannot confirm an empty order&#39;).</li>

        <li>BasicsExperimentService bắt IllegalStateException trong vòng lặp, ghi accepted=false và reason đó; không đổi status DRAFT, totalCents=0, lineCountAfter=0.</li>

        <li>Service trả OrderSimulationResponse chứ không ném lỗi lên Controller nên HTTP 200 (không phải 400); đây là thất bại một bước trong mô phỏng.</li>

        </ol>

        <pre><code>new OrderAggregate(&quot;ORD-EMPTY&quot;) // DRAFT, lines=[]

        confirm() -&gt; IllegalStateException(&quot;Cannot confirm an empty order&quot;)

        catch per step -&gt; accepted=false; status=DRAFT; HTTP 200</code></pre>'
    - id: case_003
      title: Không được sửa đơn sau khi xác nhận
      description: Việc thêm dòng vào đơn CONFIRMED bị từ chối, không làm đổi tổng và số dòng trước đó.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORD-LOCK
          steps:
          - action: ADD_LINE
            sku: BOOK
            quantity: 1
            unitPriceCents: 1500
          - action: CONFIRM
          - action: ADD_LINE
            sku: PEN
            quantity: 1
            unitPriceCents: 100
      status: 200
      response:
        orderId: ORD-LOCK
        finalStatus: CONFIRMED
        totalCents: 1500
        timeline:
        - step: 1
          action: ADD_LINE
          statusBefore: DRAFT
          statusAfter: DRAFT
          totalBeforeCents: 0
          totalAfterCents: 1500
          lineCountAfter: 1
          accepted: true
          reason: null
        - step: 2
          action: CONFIRM
          statusBefore: DRAFT
          statusAfter: CONFIRMED
          totalBeforeCents: 1500
          totalAfterCents: 1500
          lineCountAfter: 1
          accepted: true
          reason: null
        - step: 3
          action: ADD_LINE
          statusBefore: CONFIRMED
          statusAfter: CONFIRMED
          totalBeforeCents: 1500
          totalAfterCents: 1500
          lineCountAfter: 1
          accepted: false
          reason: 'Order must be DRAFT; actual status: CONFIRMED'
      detailDescription: '<p>Case bất biến sau khi xác nhận: ADD_LINE cuối cùng cố sửa aggregate đã ở trạng thái CONFIRMED và bị từ chối, các giá trị cũ vẫn giữ nguyên.</p>

        <ol>

        <li>Bước 1 ADD_LINE BOOK 1×1500 tạo một dòng, total=1500, trạng thái DRAFT.</li>

        <li>Bước 2 CONFIRM hợp lệ vì đơn có dòng; status chuyển CONFIRMED, total=1500, lineCount=1.</li>

        <li>Bước 3 ADD_LINE PEN đi vào OrderAggregate.addLine(), nhưng requireDraft() thấy CONFIRMED và ném IllegalStateException(&#39;Order must be DRAFT; actual
        status: CONFIRMED&#39;) trước khi tạo/thêm dòng.</li>

        <li>Service ghi bước 3 accepted=false, statusBefore=statusAfter=CONFIRMED, totalBefore=totalAfter=1500, lineCountAfter=1; vẫn HTTP 200 vì exception được bắt
        theo bước.</li>

        </ol>

        <pre><code>addLine(&quot;BOOK&quot;,1,1500) -&gt; DRAFT,total=1500

        confirm() -&gt; CONFIRMED

        addLine(&quot;PEN&quot;,1,100) -&gt; requireDraft() fails

        HTTP 200; finalStatus=CONFIRMED,totalCents=1500</code></pre>'
    - id: case_004
      title: Mã đơn hàng sai định dạng — HTTP 400
      description: Request bị từ chối trước khi Aggregate khởi tạo, phản hồi theo cấu trúc lỗi chung.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          orderId: ORDER BAD
          steps:
          - action: CANCEL
      status: 400
      response:
        code: INVALID_INPUT
        message: orderId must contain 1-40 letters, digits, '_' or '-'
      detailDescription: "<p>Case HTTP 400: orderId=&#39;ORDER BAD&#39; chứa dấu cách nên aggregate không thể khởi tạo, dù action CANCEL là enum hợp lệ.</p>\n<ol>\n\
        <li>Controller nhận POST /oop/basics/orders/simulate và gọi BasicsExperimentService.simulateOrder; requireSteps xác nhận một phần tử.</li>\n<li>new OrderAggregate(&#39;ORDER\
        \ BAD&#39;) kiểm tra orderId bằng regex [A-Za-z0-9_-]{1,40}; dấu cách khiến constructor ném IllegalArgumentException trước vòng lặp steps.</li>\n<li>Exception\
        \ này nằm ngoài catch theo từng action, được BasicsExperimentExceptionHandler của Controller bắt và ánh xạ HTTP 400.</li>\n<li>Response chỉ gồm code=&#39;INVALID_INPUT&#39;\
        \ và message về định dạng orderId; không có OrderSimulationResponse/timeline hay thao tác CANCEL.</li>\n</ol>\n<pre><code>new OrderAggregate(&quot;ORDER BAD&quot;)\n\
        \  -&gt; IllegalArgumentException(&quot;orderId must contain 1-40 letters, digits, &#39;_&#39; or &#39;-&#39;&quot;)\n  -&gt; BasicsExperimentExceptionHandler\
        \ -&gt; HTTP 400</code></pre>"
  compareShipping(ShippingQuoteRequest):
    methodName: compareShipping
    httpMethods:
    - POST
    mappingPaths:
    - /oop/basics/shipping/quotes
    usage: true
    cases:
    - id: case_001
      title: So sánh lấy hàng và giao tận nơi ở 12 km
      description: Hai implementation của ShippingPolicy nhận cùng một đầu vào nhưng cho phí và tổng thanh toán khác nhau.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          subtotalCents: 10000
          distanceKm: 12
      status: 200
      response:
        subtotalCents: 10000
        distanceKm: 12
        quotes:
        - policy: PICKUP
          feeCents: 0
          payableCents: 10000
        - policy: COURIER
          feeCents: 6300
          payableCents: 16300
      detailDescription: '<p>Case so sánh ở 12 km: Service dùng cùng một hợp đồng ShippingPolicy để tính hai phương án độc lập, không gọi hãng vận chuyển thực.</p>

        <ol>

        <li>Controller nhận subtotalCents=10000, distanceKm=12 và gọi BasicsExperimentService.compareShipping; subtotal không âm, distance thuộc [0,100].</li>

        <li>Duyệt List.of(new ShippingPolicy.Pickup(), new ShippingPolicy.Courier()) theo thứ tự cố định. Pickup.feeCents(12)=0; Math.addExact(10000,0)=10000.</li>

        <li>Courier.feeCents(12)=1500 + 400×12 = 6300 bằng Math.multiplyExact/Math.addExact; tổng thanh toán 10000+6300=16300.</li>

        <li>Response HTTP 200 có hai quotes với policy PICKUP/COURIER, phí 0/6300 và payableCents 10000/16300; đây là quy tắc minh họa chứ không phải giá ship thực
        tế.</li>

        </ol>

        <pre><code>Pickup.feeCents(12) = 0

        Courier.feeCents(12) = 1500 + 400 * 12 = 6300

        payable = subtotalCents + feeCents

        PICKUP:10000; COURIER:16300; HTTP 200</code></pre>'
    - id: case_002
      title: Khoảng cách 0 km vẫn có phí giao hàng cố định
      description: PICKUP miễn phí; COURIER áp dụng phí cơ bản 1.500 cent ngay cả khi distanceKm bằng 0.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          subtotalCents: 1000
          distanceKm: 0
      status: 200
      response:
        subtotalCents: 1000
        distanceKm: 0
        quotes:
        - policy: PICKUP
          feeCents: 0
          payableCents: 1000
        - policy: COURIER
          feeCents: 1500
          payableCents: 2500
      detailDescription: '<p>Case ranh giới distanceKm=0: khoảng cách bằng 0 là hợp lệ nhưng Courier vẫn thu phí cơ bản 1500 cents.</p>

        <ol>

        <li>Service xác nhận subtotalCents=1000 không âm và distanceKm=0 nằm trong dải [0,100].</li>

        <li>Pickup.feeCents(0)=0 nên payableCents=1000, đúng bằng tiền hàng.</li>

        <li>Courier.feeCents(0)=1500+400×0=1500, không bằng 0 vì có phí cố định; payableCents=1000+1500=2500.</li>

        <li>Hai kết quả được trả theo thứ tự PICKUP rồi COURIER, status HTTP 200; giúp phân biệt phí cố định với phí tỷ lệ khoảng cách.</li>

        </ol>

        <pre><code>distanceKm=0

        PICKUP fee=0 -&gt; payable=1000

        COURIER fee=1500+(400*0)=1500 -&gt; payable=2500

        HTTP 200</code></pre>'
    - id: case_003
      title: Khoảng cách vượt giới hạn — HTTP 400
      description: Khoảng cách 101 km vượt giới hạn mô phỏng 0–100 km; service trả lỗi đầu vào.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          subtotalCents: 10000
          distanceKm: 101
      status: 400
      response:
        code: INVALID_INPUT
        message: distanceKm must be between 0 and 100
      detailDescription: "<p>Case HTTP 400 vì khoảng cách vượt biên: distanceKm=101 lớn hơn giá trị tối đa 100 được Service cho phép.</p>\n<ol>\n<li>Controller chuyển\
        \ JSON đến BasicsExperimentService.compareShipping.</li>\n<li>Service kiểm tra subtotalCents=10000 không âm, sau đó kiểm tra if (distanceKm &lt; 0 || distanceKm\
        \ &gt; 100); với 101, điều kiện đúng.</li>\n<li>IllegalArgumentException(&#39;distanceKm must be between 0 and 100&#39;) được ném trước khi duyệt ShippingPolicy\
        \ hoặc tính fee; không có danh sách quotes từng phần.</li>\n<li>BasicsExperimentExceptionHandler chuyển lỗi thành HTTP 400, body {code:&#39;INVALID_INPUT&#39;,\
        \ message:&#39;distanceKm must be between 0 and 100&#39;}.</li>\n</ol>\n<pre><code>if (distanceKm &lt; 0 || distanceKm &gt; 100)\n    throw IllegalArgumentException(&quot;distanceKm\
        \ must be between 0 and 100&quot;)\nHTTP 400; no shipping quote calculation</code></pre>"
    - id: case_004
      title: Tổng tiền hàng âm — HTTP 400
      description: Giá trị subtotalCents âm bị từ chối trước khi gọi các chiến lược vận chuyển.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          subtotalCents: -1
          distanceKm: 5
      status: 400
      response:
        code: INVALID_INPUT
        message: subtotalCents cannot be negative
      detailDescription: "<p>Case HTTP 400 vì tổng tiền hàng âm: subtotalCents=-1 vi phạm kiểm tra đầu tiên trong compareShipping.</p>\n<ol>\n<li>Controller nhận\
        \ body {-1,5} và gọi BasicsExperimentService.compareShipping.</li>\n<li>Service kiểm tra subtotalCents &lt; 0 trước cả kiểm tra distanceKm, ném IllegalArgumentException(&#39;subtotalCents\
        \ cannot be negative&#39;).</li>\n<li>Chưa policy nào được gọi và không phát sinh ShippingQuote; distanceKm=5 hợp lệ nhưng không thể bỏ qua điều kiện tiền\
        \ hàng không âm.</li>\n<li>Exception handler của BasicsExperimentController trả HTTP 400 cùng code=&#39;INVALID_INPUT&#39; và message chính xác, không có\
        \ ShippingQuoteResponse.</li>\n</ol>\n<pre><code>if (subtotalCents &lt; 0)\n    throw IllegalArgumentException(&quot;subtotalCents cannot be negative&quot;)\n\
        HTTP 400; no Pickup/Courier calculation</code></pre>"
PolymorphismExperimentsController:
  dispatch(DispatchRequest):
    methodName: dispatch
    httpMethods:
    - POST
    mappingPaths:
    - /oop/polymorphism/dispatch/experiment
    usage: true
    cases:
    - id: case_001
      title: PremiumHandler và sự khác nhau giữa hai overload
      description: PriorityEvent đi qua Event-typed variable khiến chữ ký handle(Event) được chọn trước; lời gọi specialized chọn handle(PriorityEvent).
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          receiverType: PREMIUM
          eventType: PRIORITY
          weight: 4
          priority: 3
          bonus: 7
      status: 200
      response:
        receiverType: PREMIUM
        eventType: PRIORITY
        viaDeclaredEvent: 47
        viaSpecificEvent: 410
        overriddenInstanceMethod: PREMIUM-INSTANCE
        fieldViaBaseReference: BASE-FIELD
        fieldViaConcreteReference: PREMIUM-FIELD
        staticViaBaseClass: BASE-STATIC
        staticViaConcreteClass: PREMIUM-STATIC
        sameReceiverObject: true
      detailDescription: <p>Biến <code>Event event</code> có giá trị PriorityEvent nhưng kiểu khai báo Event, nên <code>handler.handle(event)</code> gọi override
        Premium của <code>handle(Event)</code>, tính 4 × 10 + 7 = 47. Sau <code>instanceof PriorityEvent</code>, overload cụ thể tính 4 × 100 + 3 + 7 = 410. <code>identify()</code>
        trả PREMIUM-INSTANCE; field/static qua kiểu Handler là BASE, qua lớp Premium là PREMIUM. Hai lần gọi vẫn cùng một receiver.</p>
    - id: case_002
      title: Base Handler vẫn chọn overload theo kiểu tĩnh
      description: Receiver BASE không override, nhưng hai chữ ký xử lý PriorityEvent vẫn cho giá trị khác nhau.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          receiverType: BASE
          eventType: PRIORITY
          weight: 4
          priority: 3
          bonus: 0
      status: 200
      response:
        receiverType: BASE
        eventType: PRIORITY
        viaDeclaredEvent: 40
        viaSpecificEvent: 403
        overriddenInstanceMethod: BASE-INSTANCE
        fieldViaBaseReference: BASE-FIELD
        fieldViaConcreteReference: BASE-FIELD
        staticViaBaseClass: BASE-STATIC
        staticViaConcreteClass: BASE-STATIC
        sameReceiverObject: true
      detailDescription: <p><code>handler.handle(event)</code> chọn <code>handle(Event)</code> do event khai báo kiểu Event, trả 4 × 10 = 40. Khi biến được pattern-match
        thành <code>PriorityEvent</code>, overload chọn <code>handle(PriorityEvent)</code> và trả 4 × 100 + 3 = 403. Receiver, field, static và identify đều thuộc
        BASE.</p>
    - id: case_003
      title: Event thường chỉ dùng chữ ký Event
      description: Không có PriorityEvent nên cả hai đường gọi đều dispatch override handle(Event) của Premium.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          receiverType: PREMIUM
          eventType: EVENT
          weight: 5
          priority: null
          bonus: 9
      status: 200
      response:
        receiverType: PREMIUM
        eventType: EVENT
        viaDeclaredEvent: 59
        viaSpecificEvent: 59
        overriddenInstanceMethod: PREMIUM-INSTANCE
        fieldViaBaseReference: BASE-FIELD
        fieldViaConcreteReference: PREMIUM-FIELD
        staticViaBaseClass: BASE-STATIC
        staticViaConcreteClass: PREMIUM-STATIC
        sameReceiverObject: true
      detailDescription: <p>Đối tượng runtime là Event thường, nhánh <code>instanceof PriorityEvent</code> false. Hai biểu thức đều gọi <code>handle(Event)</code>
        của Premium, nên trả 5 × 10 + 9 = 59. <code>priority</code> được phép null khi eventType EVENT; các trường field và static vẫn cho thấy hiding.</p>
    - id: case_004
      title: Base Event dùng instance method gốc
      description: Không có ưu tiên hoặc bonus, tất cả các giá trị được phân giải theo lớp Handler.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          receiverType: BASE
          eventType: EVENT
          weight: 5
          priority: null
          bonus: 0
      status: 200
      response:
        receiverType: BASE
        eventType: EVENT
        viaDeclaredEvent: 50
        viaSpecificEvent: 50
        overriddenInstanceMethod: BASE-INSTANCE
        fieldViaBaseReference: BASE-FIELD
        fieldViaConcreteReference: BASE-FIELD
        staticViaBaseClass: BASE-STATIC
        staticViaConcreteClass: BASE-STATIC
        sameReceiverObject: true
      detailDescription: <p>Với receiver BASE và event EVENT, cả hai đường gọi dùng <code>Handler.handle(Event)</code>, tính 5 × 10 = 50. <code>Handler.identify()</code>
        là BASE-INSTANCE; cả field và category quan sát qua hai kiểu đều là BASE, nên đây là mốc đối chiếu với Premium.</p>
    - id: case_005
      title: Thiếu priority của PriorityEvent
      description: Yêu cầu sự kiện ưu tiên luôn cung cấp priority trước khi dựng receiver/event.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          receiverType: PREMIUM
          eventType: PRIORITY
          weight: 4
          priority: null
          bonus: 7
      status: 400
      response:
        error: priority is required for PRIORITY
      detailDescription: <p><code>DispatchMechanics.observe()</code> kiểm tra <code>eventType=PRIORITY</code> và <code>priority==null</code>, rồi ném <code>IllegalArgumentException</code>
        với nội dung nguyên văn. Handler trả HTTP 400 trước khi thực hiện bất kỳ lời gọi <code>handle()</code> nào.</p>
    - id: case_006
      title: Weight bằng 0 không hợp lệ
      description: Constructor Event bảo vệ miền giá trị của dữ liệu đa hình.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          receiverType: PREMIUM
          eventType: EVENT
          weight: 0
          priority: null
          bonus: 0
      status: 400
      response:
        error: weight must be 1..10000
      detailDescription: <p>Qua các kiểm tra receiver/event, <code>new Event(0)</code> gọi constructor xác thực <code>weight</code> từ 1 đến 10000 và ném <code>IllegalArgumentException</code>.
        Handler chuyển thành HTTP 400, không có <code>DispatchResult</code>.</p>
  payments(PaymentsRequest):
    methodName: payments
    httpMethods:
    - POST
    mappingPaths:
    - /oop/polymorphism/payments/experiment
    usage: true
    cases:
    - id: case_001
      title: Năm bước phối hợp CARD, WALLET và BANK
      description: Một lời gọi checkout qua interface tạo ba trạng thái và chứng minh số dư ví chỉ đổi ở lần debit thành công.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialWalletBalanceVnd: 100
          cardLimitVnd: 100
          actions:
          - method: CARD
            orderId: ORD-1
            amountVnd: 100
          - method: WALLET
            orderId: ORD-2
            amountVnd: 60
          - method: WALLET
            orderId: ORD-3
            amountVnd: 50
          - method: BANK
            orderId: ORD-4
            amountVnd: 25
          - method: WALLET
            orderId: ORD-5
            amountVnd: 20
      status: 200
      response:
        initialWalletBalanceVnd: 100
        finalWalletBalanceVnd: 20
        steps:
        - index: 1
          method: CARD
          orderId: ORD-1
          amountVnd: 100
          status: PAID
          detail: simulated card authorization
          walletBalanceBeforeVnd: 100
          walletBalanceAfterVnd: 100
        - index: 2
          method: WALLET
          orderId: ORD-2
          amountVnd: 60
          status: PAID
          detail: simulated wallet debit
          walletBalanceBeforeVnd: 100
          walletBalanceAfterVnd: 40
        - index: 3
          method: WALLET
          orderId: ORD-3
          amountVnd: 50
          status: DECLINED
          detail: insufficient simulated wallet balance
          walletBalanceBeforeVnd: 40
          walletBalanceAfterVnd: 40
        - index: 4
          method: BANK
          orderId: ORD-4
          amountVnd: 25
          status: PENDING
          detail: simulated transfer awaiting confirmation for ORD-4
          walletBalanceBeforeVnd: 40
          walletBalanceAfterVnd: 40
        - index: 5
          method: WALLET
          orderId: ORD-5
          amountVnd: 20
          status: PAID
          detail: simulated wallet debit
          walletBalanceBeforeVnd: 40
          walletBalanceAfterVnd: 20
        paidCount: 3
        declinedCount: 1
        pendingCount: 1
        scope: REQUEST_LOCAL_SIMULATION_NO_REAL_PAYMENT_NO_DURABLE_STATE
      detailDescription: <p>CARD 100 trong hạn mức 100 trả PAID nhưng không dùng số dư ví. WALLET 60 giảm ví từ 100 xuống 40; WALLET 50 vượt số dư nên DECLINED và
        giữ 40. BANK 25 trả PENDING, không xác nhận tiền đến và không đổi ví. WALLET 20 cuối cùng thành PAID, ví còn 20. Vì vậy <code>paidCount=3</code>, <code>declinedCount=1</code>,
        <code>pendingCount=1</code>; tất cả là kết quả mô phỏng.</p>
    - id: case_002
      title: Thẻ vượt hạn mức, ví thành công, bank chờ xử lý
      description: Kiểm tra cùng interface và ba implementation nhưng mỗi loại trả kết quả riêng.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialWalletBalanceVnd: 100
          cardLimitVnd: 50
          actions:
          - method: CARD
            orderId: ORD-1
            amountVnd: 60
          - method: WALLET
            orderId: ORD-2
            amountVnd: 40
          - method: BANK
            orderId: ORD-3
            amountVnd: 10
      status: 200
      response:
        initialWalletBalanceVnd: 100
        finalWalletBalanceVnd: 60
        steps:
        - index: 1
          method: CARD
          orderId: ORD-1
          amountVnd: 60
          status: DECLINED
          detail: simulated card limit exceeded
          walletBalanceBeforeVnd: 100
          walletBalanceAfterVnd: 100
        - index: 2
          method: WALLET
          orderId: ORD-2
          amountVnd: 40
          status: PAID
          detail: simulated wallet debit
          walletBalanceBeforeVnd: 100
          walletBalanceAfterVnd: 60
        - index: 3
          method: BANK
          orderId: ORD-3
          amountVnd: 10
          status: PENDING
          detail: simulated transfer awaiting confirmation for ORD-3
          walletBalanceBeforeVnd: 60
          walletBalanceAfterVnd: 60
        paidCount: 1
        declinedCount: 1
        pendingCount: 1
        scope: REQUEST_LOCAL_SIMULATION_NO_REAL_PAYMENT_NO_DURABLE_STATE
      detailDescription: <p><code>CardPaymentMethod</code> thấy 60 &gt; 50 và trả DECLINED, ví vẫn 100. <code>WalletPaymentMethod</code> trừ 40 còn 60 và trả PAID.
        <code>BankTransferPaymentMethod</code> trả PENDING với mô tả chứa ORD-3; ví giữ 60. Mỗi loại đóng góp một trạng thái vào bộ đếm của response HTTP 200.</p>
    - id: case_003
      title: Ví thiếu tiền phải giữ nguyên số dư
      description: Thao tác không đủ tiền trả DECLINED là kết quả nghiệp vụ hợp lệ.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialWalletBalanceVnd: 10
          cardLimitVnd: 1
          actions:
          - method: WALLET
            orderId: ORD-1
            amountVnd: 20
      status: 200
      response:
        initialWalletBalanceVnd: 10
        finalWalletBalanceVnd: 10
        steps:
        - index: 1
          method: WALLET
          orderId: ORD-1
          amountVnd: 20
          status: DECLINED
          detail: insufficient simulated wallet balance
          walletBalanceBeforeVnd: 10
          walletBalanceAfterVnd: 10
        paidCount: 0
        declinedCount: 1
        pendingCount: 0
        scope: REQUEST_LOCAL_SIMULATION_NO_REAL_PAYMENT_NO_DURABLE_STATE
      detailDescription: <p><code>WalletPaymentMethod.pay()</code> so sánh 20 với balance 10 trước khi trừ. Do 20 lớn hơn 10, trả <code>DECLINED</code> và detail
        <code>insufficient simulated wallet balance</code>; số dư before/after cùng là 10, HTTP 200 chứ không ném lỗi.</p>
    - id: case_004
      title: BANK chỉ đưa ra hướng dẫn chờ xác nhận
      description: Không được đồng nhất thông báo chuyển khoản giả lập với giao dịch đã thanh toán.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialWalletBalanceVnd: 0
          cardLimitVnd: 1
          actions:
          - method: BANK
            orderId: ORD-4
            amountVnd: 10
      status: 200
      response:
        initialWalletBalanceVnd: 0
        finalWalletBalanceVnd: 0
        steps:
        - index: 1
          method: BANK
          orderId: ORD-4
          amountVnd: 10
          status: PENDING
          detail: simulated transfer awaiting confirmation for ORD-4
          walletBalanceBeforeVnd: 0
          walletBalanceAfterVnd: 0
        paidCount: 0
        declinedCount: 0
        pendingCount: 1
        scope: REQUEST_LOCAL_SIMULATION_NO_REAL_PAYMENT_NO_DURABLE_STATE
      detailDescription: <p><code>BankTransferPaymentMethod.pay()</code> trả <code>PENDING</code> và detail chứa ORD-4 ngay lập tức; không đọc hoặc trừ số dư của
        <code>WalletPaymentMethod</code>. <code>paidCount=0</code>, <code>pendingCount=1</code>, số dư cuối 0; endpoint không truy cập ngân hàng ngoài đời.</p>
    - id: case_005
      title: Loại thanh toán UNKNOWN bị từ chối trước khi chạy
      description: Chọn implementation chỉ được phép bằng các tên đã tạo trong map.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialWalletBalanceVnd: 100
          cardLimitVnd: 50
          actions:
          - method: UNKNOWN
            orderId: ORD-1
            amountVnd: 10
      status: 400
      response:
        error: method must be CARD, WALLET or BANK
      detailDescription: <p>Trong vòng chuẩn bị command, <code>methods.get(&quot;UNKNOWN&quot;)</code> trả null; service ném <code>IllegalArgumentException</code>
        trước khi bắt đầu vòng xử lý thanh toán. Handler trả HTTP 400 với <code>error</code> nguyên bản.</p>
    - id: case_006
      title: Đơn giá thanh toán bằng không không hợp lệ
      description: PaymentCommand kiểm tra amount trước mọi giao dịch giả lập.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialWalletBalanceVnd: 100
          cardLimitVnd: 50
          actions:
          - method: CARD
            orderId: ORD-1
            amountVnd: 0
      status: 400
      response:
        error: amountVnd must be 1..1000000000000
      detailDescription: <p><code>new PaymentCommand(&quot;ORD-1&quot;, 0)</code> thất bại vì amount phải từ 1 đến 1000000000000. Service đang tiền kiểm tra toàn
        bộ action nên không tạo <code>PaymentStep</code>; handler trả HTTP 400 với lỗi constructor.</p>
    - id: case_007
      title: Danh sách action rỗng bị từ chối
      description: Giới hạn 1–20 thao tác bảo vệ tính hữu hạn của thí nghiệm.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialWalletBalanceVnd: 100
          cardLimitVnd: 50
          actions: []
      status: 400
      response:
        error: initialWalletBalanceVnd, cardLimitVnd and 1..20 actions are required
      detailDescription: <p><code>PolymorphismExperimentsService.payments()</code> kiểm tra <code>actions.isEmpty()</code> ở đầu phương thức và ném <code>IllegalArgumentException</code>.
        Không tạo đối tượng phương thức thanh toán; response chỉ có lỗi HTTP 400.</p>
PracticeExperimentController:
  bank(BankRequest):
    methodName: bank
    httpMethods:
    - POST
    mappingPaths:
    - /oop/practice/bank/experiment
    usage: true
    cases:
    - id: case_001
      title: Chuyển tiền thành công, từ chối rút quá số dư
      description: Transfer thay hai tài khoản; lần rút không đủ tiền để nguyên snapshot và bước tiếp theo vẫn chạy.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          accounts:
          - id: TK-1
            owner: An
            openingBalanceVnd: 100
          - id: TK-2
            owner: Binh
            openingBalanceVnd: 20
          actions:
          - type: TRANSFER
            accountId: TK-1
            toAccountId: TK-2
            amountVnd: 60
          - type: WITHDRAW
            accountId: TK-1
            amountVnd: 100
          - type: DEPOSIT
            accountId: TK-2
            amountVnd: 30
      status: 200
      response:
        initial:
        - id: TK-1
          owner: An
          balanceVnd: 100
        - id: TK-2
          owner: Binh
          balanceVnd: 20
        steps:
        - index: 1
          type: TRANSFER
          accepted: true
          detail: completed
          before:
          - id: TK-1
            owner: An
            balanceVnd: 100
          - id: TK-2
            owner: Binh
            balanceVnd: 20
          after:
          - id: TK-1
            owner: An
            balanceVnd: 40
          - id: TK-2
            owner: Binh
            balanceVnd: 80
        - index: 2
          type: WITHDRAW
          accepted: false
          detail: insufficient funds
          before:
          - id: TK-1
            owner: An
            balanceVnd: 40
          - id: TK-2
            owner: Binh
            balanceVnd: 80
          after:
          - id: TK-1
            owner: An
            balanceVnd: 40
          - id: TK-2
            owner: Binh
            balanceVnd: 80
        - index: 3
          type: DEPOSIT
          accepted: true
          detail: completed
          before:
          - id: TK-1
            owner: An
            balanceVnd: 40
          - id: TK-2
            owner: Binh
            balanceVnd: 80
          after:
          - id: TK-1
            owner: An
            balanceVnd: 40
          - id: TK-2
            owner: Binh
            balanceVnd: 110
        current:
        - id: TK-1
          owner: An
          balanceVnd: 40
        - id: TK-2
          owner: Binh
          balanceVnd: 110
        scope: REQUEST_LOCAL_IN_MEMORY_NO_REAL_BANK_ACCOUNTS_OR_DURABLE_TRANSACTIONS
      detailDescription: <p><code>BankLedger.transfer</code> kiểm tra TK-1 có 100, chuyển 60 sang TK-2 vốn có 20 nên snapshot đổi thành 40/80. <code>withdraw</code>
        100 từ TK-1 bị <code>IllegalStateException(&quot;insufficient funds&quot;)</code>; service bắt lỗi thành accepted=false, before=after=40/80. Cuối cùng deposit
        30 vào TK-2 thành 110. HTTP 200 trả ba step và dữ liệu trong request, không thực hiện ngân hàng thật.</p>
    - id: case_002
      title: Tràn số tài khoản đích không trừ tiền nguồn
      description: Math.addExact phát hiện overflow trước khi ghi cả hai số dư.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          accounts:
          - id: A-1
            owner: An
            openingBalanceVnd: 100
          - id: B-2
            owner: Binh
            openingBalanceVnd: 9223372036854775807
          actions:
          - type: TRANSFER
            accountId: A-1
            toAccountId: B-2
            amountVnd: 1
      status: 200
      response:
        initial: &id050
        - id: A-1
          owner: An
          balanceVnd: 100
        - id: B-2
          owner: Binh
          balanceVnd: 9223372036854775807
        steps:
        - index: 1
          type: TRANSFER
          accepted: false
          detail: long overflow
          before:
          - id: A-1
            owner: An
            balanceVnd: 100
          - id: B-2
            owner: Binh
            balanceVnd: 9223372036854775807
          after:
          - id: A-1
            owner: An
            balanceVnd: 100
          - id: B-2
            owner: Binh
            balanceVnd: 9223372036854775807
        current: *id050
        scope: REQUEST_LOCAL_IN_MEMORY_NO_REAL_BANK_ACCOUNTS_OR_DURABLE_TRANSACTIONS
      detailDescription: <p><code>BankLedger.transfer</code> tìm đủ tài khoản và tiền nguồn nhưng B-2 đã ở <code>Long.MAX_VALUE</code>. <code>Math.addExact</code>
        với 1 ném <code>ArithmeticException(&quot;long overflow&quot;)</code> trước dòng trừ số dư A-1 và cộng B-2. Service ghi accepted=false, detail chính xác và
        snapshot ban đầu giống cuối; HTTP 200, không có chuyển tiền một phần.</p>
    - id: case_003
      title: Không chuyển tiền vào chính tài khoản nguồn
      description: Transfer cùng ID là lỗi nghiệp vụ bị catch trong từng bước.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          accounts:
          - id: A-1
            owner: An
            openingBalanceVnd: 50
          actions:
          - type: TRANSFER
            accountId: A-1
            toAccountId: A-1
            amountVnd: 5
      status: 200
      response:
        initial:
        - id: A-1
          owner: An
          balanceVnd: 50
        steps:
        - index: 1
          type: TRANSFER
          accepted: false
          detail: cannot transfer to same account
          before:
          - id: A-1
            owner: An
            balanceVnd: 50
          after:
          - id: A-1
            owner: An
            balanceVnd: 50
        current:
