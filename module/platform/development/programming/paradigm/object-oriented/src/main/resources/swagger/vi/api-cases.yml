        scope: REQUEST_LOCAL_IN_MEMORY_NO_EXTERNAL_SIDE_EFFECTS
      detailDescription: <p><code>MemberDiscount.discount()</code> tính <code>(20 × 5 + 50) / 100 = 1</code> bằng phép chia nguyên VND. Do delivery fee bằng 0, hai
        order đều trả payable 19 và discount 1 nhưng trace vẫn khác thứ tự. Response xác nhận chính sách HALF_UP tới đơn vị VND.</p>
    - id: case_005
