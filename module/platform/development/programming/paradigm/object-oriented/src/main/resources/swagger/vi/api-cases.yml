      detailDescription: <p><code>VoucherDiscount</code> dùng <code>min(30000, amount)</code>. Nếu giảm trên subtotal 20000 trước, discount là 20000 rồi thêm phí
        10000, payable 10000. Nếu phí vào trước tạo 30000, voucher trừ đúng 30000 nên payable 0. <code>allOrders</code> báo cả hai nhánh và <code>selected</code>
        là FEE_THEN_DISCOUNT.</p>
    - id: case_004
