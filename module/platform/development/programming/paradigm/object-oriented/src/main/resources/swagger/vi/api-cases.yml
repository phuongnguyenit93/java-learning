      detailDescription: <p><code>DeliveryDecorator</code> cộng 20000 vào 100000 trước, tạo 120000. <code>DiscountDecorator</code> áp MEMBER_5 5% trên 120000, trừ
        6000 và còn 114000. <code>selected</code> bằng phần tử thứ hai của <code>allOrders</code>; option thứ nhất vẫn là giảm 5000 trước phí rồi trả 115000.</p>
    - id: case_003
      title: Voucher 30000 thay đổi hiệu lực theo thứ tự Decorator
      description: Voucher chỉ giảm tối đa giá trị hiện có, nên cộng phí trước tạo payable 0.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
