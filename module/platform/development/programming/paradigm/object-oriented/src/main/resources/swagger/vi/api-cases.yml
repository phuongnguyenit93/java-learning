        message: content must be nonblank and at most 100 characters
      detailDescription: <p><code>CompositionExperimentService.resource</code> th?y <code>content.isBlank()</code> v?i chu?i r?ng n?n n?m <code>IllegalArgumentException</code>
        tr??c khi t?o <code>TrackedHandle</code>. Handler tr? HTTP 400 <code>INVALID_INPUT</code>; kh?ng c? trace hay thao t?c close v? handle ch?a t?n t?i.</p>
DesignPatternExperimentController:
  pricing(PricingRequest):
    methodName: pricing
    httpMethods:
    - POST
    mappingPaths:
    - /oop/design-patterns/pricing/experiment
    usage: true
    cases:
    - id: case_001
      title: Giảm 5% trước khi cộng phí giao
      description: So sánh 115000 VND khi giảm trước với 114000 VND khi cộng phí trước.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          subtotalVnd: 100000
          deliveryFeeVnd: 20000
          strategy: MEMBER_5
          order: DISCOUNT_THEN_FEE
      status: 200
      response:
        strategy: MEMBER_5
        subtotalVnd: 100000
        deliveryFeeVnd: 20000
        selected: &id006
          order: DISCOUNT_THEN_FEE
          payableVnd: 115000
          discountVnd: 5000
          executionTrace:
          - BASE:100000
          - DISCOUNT_MEMBER_5:5000
          - DELIVERY:20000
        allOrders:
        - *id006
        - order: FEE_THEN_DISCOUNT
          payableVnd: 114000
          discountVnd: 6000
          executionTrace:
          - BASE:100000
          - DELIVERY:20000
          - DISCOUNT_MEMBER_5:6000
        scope: REQUEST_LOCAL_IN_MEMORY_NO_EXTERNAL_SIDE_EFFECTS
      detailDescription: <p><code>DiscountDecorator</code> giảm 5% của subtotal 100000 còn 95000; <code>DeliveryDecorator</code> thêm 20000 nên selected 115000, discount
        5000. Pipeline ngược lại tính 5% trên 120000 nên giảm 6000 và còn 114000. <code>executionTrace</code> của hai option cho thấy thứ tự bọc thực thi khác nhau;
        cả hai đều xuất hiện trong <code>allOrders</code>.</p>
    - id: case_002
