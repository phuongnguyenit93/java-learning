        trace:
        - handle:open
        - exporter:created
        - handle:write:OK
        - exporter:close
        - handle:close
      detailDescription: <p><code>Exporter</code> nh?n ownsHandle=false n?n <code>close()</code> ch? ghi <code>exporter:close</code>. Do ?? l?c ki?m tra <code>resourceClosedAfterExporter</code>,
        handle v?n m? (false). Service ??i di?n caller th?c hi?n <code>handle.close()</code> v? <code>resourceClosedAfterCaller</code> th?nh true, kh?ng c? failure.</p>
    - id: case_003
      title: N?i dung r?ng b? t? ch?i tr??c khi m? handle
