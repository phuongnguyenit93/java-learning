            lines:
            - sku: BOOK
              quantity: 2
              unitPriceCents: 25000
          - orderId: ORD-2
            policyCode: LOYALTY
            lines:
            - sku: BOOK
              quantity: 2
              unitPriceCents: 25000
          - orderId: ORD-3
            policyCode: BROKEN_NEGATIVE
            lines:
            - sku: BOOK
              quantity: 2
              unitPriceCents: 25000
          - orderId: ORD-1
            policyCode: TEN_PERCENT
            lines:
            - sku: BOOK
              quantity: 2
              unitPriceCents: 25000
          - orderId: ORD-4
            policyCode: TEN_PERCENT
            lines:
            - sku: BOOK
              quantity: 2
              unitPriceCents: 25000
      status: 200
      response:
        attempts:
        - index: 1
          orderId: ORD-1
          accepted: true
          rule: null
          detail: order stored and simulated receipt recorded
          receipt:
            orderId: ORD-1
            policyCode: NONE
            subtotalCents: 50000
            discountCents: 0
            payableCents: 50000
          storedCount: 1
          noticeCount: 1
        - index: 2
          orderId: ORD-2
          accepted: true
          rule: null
          detail: order stored and simulated receipt recorded
          receipt:
            orderId: ORD-2
            policyCode: LOYALTY
            subtotalCents: 50000
            discountCents: 7500
            payableCents: 42500
          storedCount: 2
          noticeCount: 2
        - index: 3
          orderId: ORD-3
          accepted: false
          rule: POLICY_CONTRACT
          detail: policy BROKEN_NEGATIVE violated 0 <= discount <= subtotal
          receipt: null
          storedCount: 2
          noticeCount: 2
        - index: 4
          orderId: ORD-1
          accepted: false
          rule: ORDER_CONFLICT
          detail: 'duplicate orderId: ORD-1'
          receipt: null
          storedCount: 2
          noticeCount: 2
        - index: 5
          orderId: ORD-4
          accepted: true
          rule: null
          detail: order stored and simulated receipt recorded
          receipt:
            orderId: ORD-4
            policyCode: TEN_PERCENT
            subtotalCents: 50000
            discountCents: 5000
            payableCents: 45000
          storedCount: 3
          noticeCount: 3
        storedOrders:
        - orderId: ORD-1
          policyCode: NONE
          subtotalCents: 50000
          discountCents: 0
          payableCents: 50000
        - orderId: ORD-2
          policyCode: LOYALTY
          subtotalCents: 50000
          discountCents: 7500
          payableCents: 42500
        - orderId: ORD-4
          policyCode: TEN_PERCENT
          subtotalCents: 50000
          discountCents: 5000
          payableCents: 45000
        notices:
        - orderId: ORD-1
