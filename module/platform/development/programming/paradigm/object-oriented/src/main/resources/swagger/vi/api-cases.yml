      detailDescription: <p>Record <code>ProductKey</code> dùng cả tenantId và sku để so sánh bằng, hash. REGISTER A/BOOK và B/BOOK tạo hai sản phẩm. READ từng khóa
        mới vẫn tìm được tồn 1 và 4; READ C/BOOK trả PRODUCT_NOT_FOUND, available/diagnostic=null, tổng uniqueProducts=2.</p>
    - id: case_003
