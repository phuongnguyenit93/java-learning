      detailDescription: <p>Gi? tr? hourlyRateVnd b?ng <code>Long.MAX_VALUE</code> v? workedHours=2 ??u qua ki?m tra kh?ng ?m v? gi?i h?n gi?. Khi <code>Employee.Hourly.monthlyPayVnd()</code>
        g?i <code>Math.multiplyExact</code>, ph?p nh?n n?m <code>ArithmeticException</code>. Advice chuy?n bi?t ?nh x? ngo?i l? n?y th?nh HTTP 422 <code>ARITHMETIC_OVERFLOW</code>,
        kh?ng tr? s? l??ng sai do wraparound.</p>
  compareDelivery(DeliveryRequest):
