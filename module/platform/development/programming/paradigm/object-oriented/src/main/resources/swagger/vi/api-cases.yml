            sku: BOOK
            quantity: 1
          - type: REGISTER
            tenantId: B
            sku: BOOK
            quantity: 4
          - type: READ
            tenantId: A
            sku: BOOK
          - type: READ
            tenantId: B
            sku: BOOK
          - type: READ
            tenantId: C
            sku: BOOK
      status: 200
      response:
        steps:
        - index: 1
          action: REGISTER
          accepted: true
          code: REGISTERED
          available: 1
          diagnostic: StockItem{tenantId=A, sku=BOOK, available=1}
        - index: 2
          action: REGISTER
          accepted: true
          code: REGISTERED
          available: 4
          diagnostic: StockItem{tenantId=B, sku=BOOK, available=4}
        - index: 3
          action: READ
          accepted: true
          code: FOUND
          available: 1
          diagnostic: StockItem{tenantId=A, sku=BOOK, available=1}
        - index: 4
          action: READ
          accepted: true
          code: FOUND
          available: 4
          diagnostic: StockItem{tenantId=B, sku=BOOK, available=4}
        - index: 5
          action: READ
