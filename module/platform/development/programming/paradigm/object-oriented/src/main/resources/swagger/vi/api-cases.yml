      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          quotes:
          - serviceCode: express
            weightGrams: 1000
          - serviceCode: express
            weightGrams: 1001
      status: 200
      response:
        quotes:
        - serviceCode: express
          weightGrams: 1000
          accepted: true
          feeVnd: 43000
          code: QUOTED
        - serviceCode: express
          weightGrams: 1001
          accepted: true
          feeVnd: 51000
          code: QUOTED
        totalAcceptedFeesVnd: 94000
      detailDescription: <p><code>ExpressShipping</code> tính kilogram cước theo <code>(weightGrams+999L)/1000L</code>. 1000 gram tính 1 kilogram có phí 43000; 1001
        gram tính 2 kilogram có phí 51000. Hai quote accepted=true, tổng 94000.</p>
    - id: case_003
      title: Từ chối trọng lượng bằng 0
      description: Validate đầu vào trước khi dispatch ShippingPolicy.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          quotes:
          - serviceCode: express
            weightGrams: 0
      status: 400
      response:
        error: INVALID_INPUT
      detailDescription: <p><code>ShippingScenarioService</code> duyệt toàn bộ request trước khi xử lý. Trọng lượng 0 nằm ngoài phạm vi 1–100000 nên ném <code>IllegalArgumentException</code>.
        Handler trả HTTP 400 với <code>error=INVALID_INPUT</code>; không trả kết quả báo giá từng phần.</p>
