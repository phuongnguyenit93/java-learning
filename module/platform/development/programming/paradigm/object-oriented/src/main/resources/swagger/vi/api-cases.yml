          sales:
          - id: SALE-1
            amountVnd: 120
          - id: SALE-2
            amountVnd: 30
      status: 200
      response:
        format: TEXT
        content: 'SALES REPORT

          SALE-1 -> 120 VND

          SALE-2 -> 30 VND

          TOTAL (2): 150 VND'
        totalVnd: 150
        rowCount: 2
        executionTrace:
        - HEADER
        - ROW:SALE-1
        - ROW:SALE-2
        - SUMMARY
      detailDescription: '<p><code>TextCreator</code> tạo TextTemplate nên header là <code>SALES REPORT</code>, row thành <code>SALE-1 -&gt; 120 VND</code> và <code>SALE-2
        -&gt; 30 VND</code>, cuối cùng <code>TOTAL (2): 150 VND</code>. Trace luôn gồm HEADER, ROW:SALE-1, ROW:SALE-2, SUMMARY giống CSV trên cùng dữ liệu; Factory
        Method chỉ quyết định subclass.</p>'
    - id: case_003
      title: Không chấp nhận report format UNKNOWN
      description: Factory selection chỉ có hai creator được đăng ký.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          format: UNKNOWN
          sales:
          - id: S-01
            amountVnd: 1
      status: 400
      response:
        error: format must be TEXT or CSV
      detailDescription: <p>Sau khi validate Sale, service chọn creator qua <code>switch(request.format())</code>. UNKNOWN không khớp TEXT/CSV nên ném <code>IllegalArgumentException</code>;
        handler trả HTTP 400 trước khi có nội dung báo cáo.</p>
    - id: case_004
      title: Không nhận dòng sale có số tiền âm
      description: Value object Sale áp đặt ranh giới dữ liệu trước khi Template Method chạy.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          format: CSV
          sales:
          - id: SALE-1
            amountVnd: -1
      status: 400
      response:
        error: amountVnd must be 0..1000000000000
      detailDescription: <p><code>new ReportPatterns.Sale(&quot;SALE-1&quot;,-1)</code> vi phạm miền 0–1000000000000 VND nên ném <code>IllegalArgumentException</code>.
        Service chưa tạo CsvCreator/render, handler trả HTTP 400 với thông điệp model.</p>
    - id: case_005
      title: Không thể tạo báo cáo từ danh sách sale rỗng
      description: Yêu cầu phải có từ một đến hai mươi bản ghi.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          format: CSV
          sales: []
      status: 400
      response:
        error: format and 1..20 sales are required
      detailDescription: <p><code>DesignPatternExperimentService.report()</code> kiểm tra <code>sales.isEmpty()</code> ngay đầu phương thức và ném <code>IllegalArgumentException</code>.
        Trước khi tạo Sale/creator hay output, handler trả HTTP 400.</p>
DesignPitfallExperimentController:
  seats(SeatsRequest):
    methodName: seats
    httpMethods:
    - POST
    mappingPaths:
    - /oop/design-pitfalls/seats/experiment
    usage: true
    cases:
    - id: case_001
      title: Đặt và hủy ghế xen kẽ bước bị từ chối
      description: 5 bước chứng minh reserve/cancel có kiểm tra và trạng thái luôn hợp lệ.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 5
          actions:
          - type: RESERVE
            seats: 4
          - type: RESERVE
            seats: 2
          - type: CANCEL
            seats: 1
          - type: CANCEL
            seats: 5
          - type: RESERVE
            seats: 2
      status: 200
      response:
        initial:
          capacity: 5
          reserved: 0
          available: 5
        steps:
        - index: 1
          type: RESERVE
          seats: 4
          accepted: true
          detail: completed
          before:
            capacity: 5
            reserved: 0
            available: 5
          after:
            capacity: 5
            reserved: 4
            available: 1
        - index: 2
          type: RESERVE
          seats: 2
          accepted: false
          detail: not enough available seats
          before:
            capacity: 5
            reserved: 4
            available: 1
          after:
            capacity: 5
            reserved: 4
            available: 1
        - index: 3
          type: CANCEL
          seats: 1
          accepted: true
          detail: completed
          before:
            capacity: 5
            reserved: 4
            available: 1
          after:
            capacity: 5
            reserved: 3
            available: 2
        - index: 4
          type: CANCEL
          seats: 5
          accepted: false
          detail: cannot cancel more than reserved
          before:
            capacity: 5
            reserved: 3
            available: 2
          after:
            capacity: 5
            reserved: 3
            available: 2
        - index: 5
          type: RESERVE
          seats: 2
          accepted: true
          detail: completed
          before:
            capacity: 5
            reserved: 3
            available: 2
          after:
            capacity: 5
            reserved: 5
            available: 0
        current:
          capacity: 5
          reserved: 5
          available: 0
        invariantPreserved: true
        scope: REQUEST_LOCAL_SINGLE_JVM_IN_MEMORY_NO_DURABLE_RESERVATIONS
      detailDescription: '<p>Bắt đầu 5 ghế trống: RESERVE 4 thành 4 ghế đặt; RESERVE thêm 2 vượt 1 ghế còn nên bị từ chối mà reserved vẫn 4; CANCEL 1 còn 3. CANCEL
        5 vượt số đặt nên lại bị từ chối, RESERVE 2 sau đó thành công và reserved=5. Tất cả bước được trả HTTP 200, invariantPreserved=true.</p>'
    - id: case_002
      title: Đặt quá số ghế còn lại nhưng không phá state
      description: Một lượt đặt thất bại không thay đổi số ghế trước/sau.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 3
          actions:
          - type: RESERVE
            seats: 2
          - type: RESERVE
            seats: 2
          - type: CANCEL
            seats: 1
      status: 200
      response:
        initial:
          capacity: 3
          reserved: 0
          available: 3
        steps:
        - index: 1
          type: RESERVE
          seats: 2
          accepted: true
          detail: completed
          before:
            capacity: 3
            reserved: 0
            available: 3
          after:
            capacity: 3
            reserved: 2
            available: 1
        - index: 2
          type: RESERVE
          seats: 2
          accepted: false
          detail: not enough available seats
          before:
            capacity: 3
            reserved: 2
            available: 1
          after:
            capacity: 3
            reserved: 2
            available: 1
        - index: 3
          type: CANCEL
          seats: 1
          accepted: true
          detail: completed
          before:
            capacity: 3
            reserved: 2
            available: 1
          after:
            capacity: 3
            reserved: 1
            available: 2
        current:
          capacity: 3
          reserved: 1
          available: 2
        invariantPreserved: true
        scope: REQUEST_LOCAL_SINGLE_JVM_IN_MEMORY_NO_DURABLE_RESERVATIONS
      detailDescription: <p>Với capacity=3, đặt 2 thành công, đặt thêm 2 bị IllegalStateException not enough available seats do chỉ còn 1, nên snapshot trước/sau
        bước thứ hai đều reserved=2. CANCEL 1 sau đó còn reserved=1, available=2.</p>
    - id: case_003
      title: Số ghế 0 bị từ chối trong bước, bước sau vẫn chạy
      description: CANCEL 0 là lỗi của action, không phải cấu trúc request.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 2
          actions:
          - type: CANCEL
            seats: 0
          - type: RESERVE
            seats: 1
      status: 200
      response:
        initial:
          capacity: 2
          reserved: 0
          available: 2
        steps:
        - index: 1
          type: CANCEL
          seats: 0
          accepted: false
          detail: seats must be positive
          before:
            capacity: 2
            reserved: 0
            available: 2
          after:
            capacity: 2
            reserved: 0
            available: 2
        - index: 2
          type: RESERVE
          seats: 1
          accepted: true
          detail: completed
          before:
            capacity: 2
            reserved: 0
            available: 2
          after:
            capacity: 2
            reserved: 1
            available: 1
        current:
          capacity: 2
          reserved: 1
          available: 1
        invariantPreserved: true
        scope: REQUEST_LOCAL_SINGLE_JVM_IN_MEMORY_NO_DURABLE_RESERVATIONS
      detailDescription: <p>CANCEL 0 qua bước preflight vì type và seats không null; nhưng SeatInventory.requirePositive từ chối trong vòng thực thi. Service ghi
        accepted=false với detail seats must be positive, giữ reserved=0; bước RESERVE 1 tiếp theo chạy bình thường và trả HTTP 200.</p>
    - id: case_004
      title: Sức chứa 0 trả HTTP 400
      description: SeatInventory không thể có capacity ngoài 1–10000.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 0
          actions:
          - type: RESERVE
            seats: 1
      status: 400
      response:
        error: capacity must be between 1 and 10000
      detailDescription: <p>Service chấp nhận danh sách actions hợp lệ nhưng constructor SeatInventory chặn capacity=0. IllegalArgumentException nằm ngoài vòng catch
        của từng action nên DesignPitfallExceptionHandler trả HTTP 400 với trường error.</p>
    - id: case_005
      title: Loại thao tác BUY không hợp lệ
      description: Chỉ hỗ trợ đúng RESERVE/CANCEL.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 4
          actions:
          - type: BUY
            seats: 1
      status: 400
      response:
        error: seat action must have type RESERVE/CANCEL and seats
      detailDescription: <p>DesignPitfallExperimentService.seats kiểm tra toàn bộ action types trước khi tạo inventory. BUY không thuộc RESERVE/CANCEL, ném IllegalArgumentException
        và HTTP 400, không trả steps một phần.</p>
    - id: case_006
      title: Danh sách actions rỗng trả HTTP 400
      description: Service yêu cầu 1–20 thao tác trong request.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          capacity: 4
          actions: []
      status: 400
      response:
        error: capacity and 1..20 seat actions are required
      detailDescription: <p>Khi actions=[], service từ chối ngay trước constructor SeatInventory với thông báo capacity and 1..20 seat actions are required; handler
        trả HTTP 400.</p>
  mutableKey(MutableKeyRequest):
    methodName: mutableKey
    httpMethods:
    - POST
    mappingPaths:
    - /oop/design-pitfalls/mutable-key/experiment
    usage: true
    cases:
    - id: case_001
      title: Đổi ALICE thành BOB làm mất tra cứu key không ổn định
      description: So sánh HashMap unsafe với StableId trên ví dụ trong unit test.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          originalName: ALICE
          changedName: BOB
      status: 200
      response:
        originalName: ALICE
        changedName: BOB
        originalHash: 62365280
        newHash: 65941
        unsafeFoundBeforeRename: true
        unsafeFoundAfterRename: false
        lookupByOldNameAfterRename: false
        unsafeMapEntries: 1
        stableFoundBeforeRename: true
        stableFoundAfterRename: true
        stableProfileNameAfterRename: BOB
        stableMapEntries: 1
      detailDescription: <p>UnsafeKey được put vào HashMap khi displayName=ALICE. Sau rename thành BOB, hashCode của cùng key thay đổi nên containsKey với key hiện
        tại và tra cứu theo tên ALICE cũ đều false dù unsafeMapEntries=1. StableId CUSTOMER-1 bất biến vẫn được tìm thấy và Profile.displayName đã đổi thành BOB.</p>
    - id: case_002
      title: Tên một ký tự cũng gây lỗi khi hash thay đổi
      description: Dùng A và B để quan sát giá trị hash dễ đối chiếu.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          originalName: A
          changedName: B
      status: 200
      response:
        originalName: A
        changedName: B
        originalHash: 65
        newHash: 66
        unsafeFoundBeforeRename: true
        unsafeFoundAfterRename: false
        lookupByOldNameAfterRename: false
        unsafeMapEntries: 1
        stableFoundBeforeRename: true
        stableFoundAfterRename: true
        stableProfileNameAfterRename: B
        stableMapEntries: 1
      detailDescription: <p>Hai chuỗi A và B có Java String.hashCode lần lượt là 65 và 66. Vì vị trí bucket gốc không đổi khi UnsafeKey.rename từ A thành B, lookup
        sai xảy ra tương tự. Map stable-key vẫn có một entry, tra cứu theo StableId mới thành công và Profile trả tên B.</p>
    - id: case_003
      title: Hai tên giống nhau không tạo được phản ví dụ
      description: Hai tên giống nhau không bảo đảm hash khác nhau.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          originalName: ALICE
          changedName: ALICE
      status: 400
      response:
        error: names must be distinct with different hashCodes to illustrate lost lookup
      detailDescription: <p>observe yêu cầu tên mới và tên cũ khác nhau, đồng thời mã hash khác nhau. ALICE đổi thành ALICE không đáp ứng yêu cầu nên ném IllegalArgumentException
        trước khi tạo hai map; handler trả HTTP 400 với message ràng buộc.</p>
    - id: case_004
      title: Tên thường bị từ chối
      description: Tên chỉ hợp lệ khi gồm ký tự ASCII in hoa/số/gạch nối.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          originalName: alice
          changedName: BOB
      status: 400
      response:
        error: name must be 1..24 uppercase ASCII letters, digits or hyphens
      detailDescription: <p>validateName dùng pattern [A-Z][A-Z0-9-]{0,23}; alice viết thường không khớp nên bị IllegalArgumentException name must be 1..24 uppercase
        ASCII letters, digits or hyphens, HTTP 400.</p>
  checkout(CheckoutRequest):
    methodName: checkout
    httpMethods:
    - POST
    mappingPaths:
    - /oop/design-pitfalls/checkout/refactor
    usage: true
    cases:
    - id: case_001
      title: Giảm giá thành viên và giao STANDARD
      description: Đối chiếu legacy/refactored với quantity=3, đơn giá 10000, member=true.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: SKU-1
          unitPriceVnd: 10000
          quantity: 3
          availableUnits: 5
          member: true
          deliveryMode: STANDARD
      status: 200
      response:
        legacy:
          subtotalVnd: 30000
          discountVnd: 1500
          deliveryVnd: 20000
          payableVnd: 48500
        refactored:
          subtotalVnd: 30000
          discountVnd: 1500
          deliveryVnd: 20000
          payableVnd: 48500
        sameResult: true
        collaborationTrace:
        - StockGuard.requireAvailable
        - PriceRules.subtotal
        - PriceRules.discount
        - DeliveryRules.fee
        - CheckoutWorkflow.quote
        scope: PURE_IN_MEMORY_QUOTE_NO_STOCK_RESERVATION_PAYMENT_OR_PERSISTENCE
      detailDescription: <p>Hai luồng tính subtotal 10000×3=30000, discount thành viên 5% là 1500, giao STANDARD 20000; payable=48500. <code>CheckoutComparison.evaluate</code>
        so sánh Quote bằng equals, sameResult=true và trace có 5 bước theo thứ tự StockGuard, PriceRules, DeliveryRules, CheckoutWorkflow.</p>
    - id: case_002
      title: Chỉ thay giao EXPRESS, báo giá vẫn tương đương
      description: EXPRESS đắt hơn STANDARD 15000 VND trên cùng dữ liệu.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: SKU-1
          unitPriceVnd: 10000
          quantity: 3
          availableUnits: 5
          member: true
          deliveryMode: EXPRESS
      status: 200
      response:
        legacy:
          subtotalVnd: 30000
          discountVnd: 1500
          deliveryVnd: 35000
          payableVnd: 63500
        refactored:
          subtotalVnd: 30000
          discountVnd: 1500
          deliveryVnd: 35000
          payableVnd: 63500
        sameResult: true
        collaborationTrace:
        - StockGuard.requireAvailable
        - PriceRules.subtotal
        - PriceRules.discount
        - DeliveryRules.fee
        - CheckoutWorkflow.quote
        scope: PURE_IN_MEMORY_QUOTE_NO_STOCK_RESERVATION_PAYMENT_OR_PERSISTENCE
      detailDescription: <p>Cùng đơn hàng và ưu đãi nhưng EXPRESS có phí 35000, nên payable=30000−1500+35000=63500. <code>LegacyCheckout</code> và <code>CheckoutWorkflow</code>
        cùng trả kết quả đó; trace thể hiện refactor tách trách nhiệm mà không đổi phép tính.</p>
    - id: case_003
      title: Không phải thành viên, không giảm giá
      description: Trả giá nguyên vẹn khi member=false và dùng EXPRESS.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: BOOK-1
          unitPriceVnd: 100
          quantity: 2
          availableUnits: 2
          member: false
          deliveryMode: EXPRESS
      status: 200
      response:
        legacy:
          subtotalVnd: 200
          discountVnd: 0
          deliveryVnd: 35000
          payableVnd: 35200
        refactored:
          subtotalVnd: 200
          discountVnd: 0
          deliveryVnd: 35000
          payableVnd: 35200
        sameResult: true
        collaborationTrace:
        - StockGuard.requireAvailable
        - PriceRules.subtotal
        - PriceRules.discount
        - DeliveryRules.fee
        - CheckoutWorkflow.quote
        scope: PURE_IN_MEMORY_QUOTE_NO_STOCK_RESERVATION_PAYMENT_OR_PERSISTENCE
      detailDescription: <p>Không là member, discount bằng 0. Hai BOOK-1 giá 100 có subtotal=200, giao EXPRESS 35000, payable=35200. Cả legacy/refactored trả cùng
        Quote, không có thao tác thanh toán, lưu đơn hay reserve thực.</p>
    - id: case_004
      title: Giảm 5% có làm tròn ở giá trị rất nhỏ
      description: Giá 1 VND giảm 5% làm tròn thành 0 VND.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: BOOK-1
          unitPriceVnd: 1
          quantity: 1
          availableUnits: 1
          member: true
          deliveryMode: STANDARD
      status: 200
      response:
        legacy:
          subtotalVnd: 1
          discountVnd: 0
          deliveryVnd: 20000
          payableVnd: 20001
        refactored:
          subtotalVnd: 1
          discountVnd: 0
          deliveryVnd: 20000
          payableVnd: 20001
        sameResult: true
        collaborationTrace:
        - StockGuard.requireAvailable
        - PriceRules.subtotal
        - PriceRules.discount
        - DeliveryRules.fee
        - CheckoutWorkflow.quote
        scope: PURE_IN_MEMORY_QUOTE_NO_STOCK_RESERVATION_PAYMENT_OR_PERSISTENCE
      detailDescription: <p>Với subtotal=1 và member=true, công thức <code>(subtotal*5+50)/100</code> chia nguyên làm tròn 5% của 1 thành 0. Cộng phí STANDARD 20000
        nên payable=20001. Hai nhánh triển khai áp dụng cùng quy tắc.</p>
    - id: case_005
      title: Từ chối số lượng vượt tồn kho
      description: Có 1 đơn vị hàng nhưng cố mua 2.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: SKU-1
          unitPriceVnd: 100
          quantity: 2
          availableUnits: 1
          member: false
          deliveryMode: STANDARD
      status: 422
      response:
        error: insufficient stock
      detailDescription: <p><code>LegacyCheckout.quote</code> kiểm tra quantity lớn hơn availableUnits trước khi tính giá và ném IllegalStateException insufficient
        stock. Vì đây là lỗi cấp checkout ngoài vòng catch, scoped handler trả HTTP 422 với body chỉ có trường error; nhánh refactor chưa được chạy.</p>
    - id: case_006
      title: Không chấp nhận giao hàng UNKNOWN
      description: DeliveryMode phải chính xác STANDARD hoặc EXPRESS.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: SKU-1
          unitPriceVnd: 100
          quantity: 1
          availableUnits: 1
          member: false
          deliveryMode: UNKNOWN
      status: 400
      response:
        error: deliveryMode must be STANDARD or EXPRESS
      detailDescription: <p><code>CheckoutComparison.Input</code> kiểm tra deliveryMode trong constructor trước khi vào thuật toán. UNKNOWN không thuộc STANDARD/EXPRESS,
        vì vậy IllegalArgumentException được trả HTTP 400, không có legacy/refactored Quote.</p>
    - id: case_007
      title: Thiếu quantity trả HTTP 400
      description: Giá trị null ở quantity bị service từ chối trước khi dựng Input.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: SKU-1
          unitPriceVnd: 100
          quantity: null
          availableUnits: 1
          member: false
          deliveryMode: STANDARD
      status: 400
      response:
        error: sku, unitPriceVnd, quantity, availableUnits, member, deliveryMode are required
      detailDescription: <p><code>DesignPitfallExperimentService.checkout</code> từ chối trường quantity=null trước khi dựng record Input. HTTP 400 trả message từ
        service, không có collaborationTrace hay phép tính.</p>
    - id: case_008
      title: SKU viết thường không hợp lệ
      description: Record Input yêu cầu SKU gồm ký tự viết hoa, số hoặc gạch nối.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          sku: bad-sku
          unitPriceVnd: 100
          quantity: 1
          availableUnits: 1
          member: false
          deliveryMode: STANDARD
      status: 400
      response:
        error: sku must be 2..24 uppercase letters/digits/hyphens
      detailDescription: <p><code>CheckoutComparison.Input</code> dùng biểu thức chính quy [A-Z0-9-]{2,24}. bad-sku có chữ thường nên bị IllegalArgumentException
        và HTTP 400 trước khi LegacyCheckout chạy.</p>
EncapsulationExperimentController:
  cart(CartRequest):
    methodName: cart
    httpMethods:
    - POST
    mappingPaths:
    - /oop/encapsulation/cart/experiment
    usage: true
    cases:
    - id: case_001
      title: Thành công và từ chối trong cùng chuỗi thao tác
      description: Thêm và đổi số lượng hợp lệ trước khi thử số âm và SKU chưa tồn tại; ảnh chụp trạng thái sau hai bước lỗi phải giữ nguyên.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialLines:
          - sku: BOOK
            unitPriceVnd: 100
            quantity: 2
          actions:
          - type: put
            sku: PEN
            unitPriceVnd: 50
            quantity: 1
          - type: changeQuantity
            sku: BOOK
            quantity: 3
          - type: changeQuantity
            sku: BOOK
            quantity: -1
          - type: remove
            sku: UNKNOWN
      status: 200
      response:
        initial: &id010
          lines:
          - sku: BOOK
            unitPriceVnd: 100
            quantity: 2
            lineTotalVnd: 200
          totalVnd: 200
        steps:
        - index: 1
          type: put
          accepted: true
          detail: completed
          before: *id010
          after: &id011
            lines:
            - sku: BOOK
              unitPriceVnd: 100
              quantity: 2
              lineTotalVnd: 200
            - sku: PEN
              unitPriceVnd: 50
              quantity: 1
              lineTotalVnd: 50
            totalVnd: 250
        - index: 2
          type: changeQuantity
          accepted: true
          detail: completed
          before: *id011
          after: &id012
            lines:
            - sku: BOOK
              unitPriceVnd: 100
              quantity: 3
              lineTotalVnd: 300
            - sku: PEN
              unitPriceVnd: 50
              quantity: 1
              lineTotalVnd: 50
            totalVnd: 350
        - index: 3
          type: changeQuantity
          accepted: false
          detail: nextQuantity must be 0..1000000
          before: *id012
          after: *id012
        - index: 4
          type: remove
          accepted: false
          detail: unknown sku
          before: *id012
          after: *id012
        current: *id012
        scope: REQUEST_LOCAL_IN_MEMORY_NO_PERSISTENCE
      detailDescription: <p><code>put(PEN)</code> nâng tổng từ 200 lên 250; <code>changeQuantity(BOOK,3)</code> nâng tổng lên 350. <code>changeQuantity(BOOK,-1)</code>
        gây lỗi <code>nextQuantity must be 0..1000000</code> trước khi commit, còn <code>remove(UNKNOWN)</code> gây lỗi <code>unknown sku</code>. Cả hai lỗi được
        service bắt và ghi <code>accepted=false</code> trong <code>steps</code> với before bằng after, nên HTTP tổng thể vẫn 200 và giỏ kết thúc ở 350 VND.</p>
    - id: case_002
      title: Đặt số lượng bằng 0 để xóa dòng
      description: Phương thức changeQuantity biểu diễn ý định xóa SKU khi số lượng mới bằng 0.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialLines:
          - sku: BOOK
            unitPriceVnd: 100
            quantity: 2
          actions:
          - type: changeQuantity
            sku: BOOK
            quantity: 0
      status: 200
      response:
        initial: *id010
        steps:
        - index: 1
          type: changeQuantity
          accepted: true
          detail: completed
          before: *id010
          after: &id013
            lines: []
            totalVnd: 0
        current: *id013
        scope: REQUEST_LOCAL_IN_MEMORY_NO_PERSISTENCE
      detailDescription: <p><code>EncapsulatedCart.changeQuantity()</code> cho phép số lượng mới bằng 0 và gọi <code>next.remove(&quot;BOOK&quot;)</code>. Sau kiểm
        tra tổng, <code>commit()</code> cập nhật map nội bộ. Snapshot cuối có danh sách rỗng và tổng 0, trong khi snapshot ban đầu vẫn là BOOK × 2 và tổng 200.</p>
    - id: case_003
      title: Không cho phép hai dòng trùng SKU
      description: Kiểm tra constructor bảo vệ ranh giới trước khi thực thi hành động.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialLines:
          - sku: BOOK
            unitPriceVnd: 100
            quantity: 2
          - sku: BOOK
            unitPriceVnd: 50
            quantity: 1
          actions:
          - type: remove
            sku: BOOK
      status: 400
      response:
        error: initialLines cannot contain null or duplicate sku
      detailDescription: <p><code>EncapsulatedCart</code> thêm các dòng đầu vào vào <code>LinkedHashMap</code> tạm bằng <code>putIfAbsent()</code>. Dòng BOOK thứ
        hai trùng khóa nên constructor ném <code>IllegalArgumentException</code> trước khi tạo kết quả thao tác; handler trả HTTP 400 với thông điệp lỗi nguyên văn.</p>
    - id: case_004
      title: Yêu cầu ít nhất một thao tác
      description: Giới hạn số bước được kiểm tra trước khi tạo giỏ hàng.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          initialLines: []
          actions: []
      status: 400
      response:
        error: actions must contain 1..20 steps
      detailDescription: <p><code>checkActions()</code> từ chối danh sách <code>actions</code> rỗng ngay khi <code>simulateCart()</code> bắt đầu. Không có snapshot
        giỏ hoặc step, chỉ HTTP 400 và <code>ErrorResponse.error</code> như nguồn Java.</p>
  stock(StockRequest):
    methodName: stock
    httpMethods:
    - POST
    mappingPaths:
    - /oop/encapsulation/stock/experiment
    usage: true
    cases:
    - id: case_001
      title: Giữ hàng, từ chối giữ quá mức rồi giao và hoàn
      description: Chuỗi bốn thao tác minh họa bất biến onHand/reserved/available kể cả sau bước bị từ chối.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOX
          initialOnHand: 10
          initialReserved: 0
          actions:
          - type: reserve
            units: 8
          - type: reserve
            units: 3
          - type: ship
            units: 4
          - type: release
            units: 2
      status: 200
      response:
        initial: &id014
          sku: BOX
          onHand: 10
          reserved: 0
          available: 10
        steps:
        - index: 1
          type: reserve
          accepted: true
          detail: completed
          before: *id014
          after: &id015
            sku: BOX
            onHand: 10
            reserved: 8
            available: 2
        - index: 2
          type: reserve
          accepted: false
          detail: insufficient available units
          before: *id015
          after: *id015
        - index: 3
          type: ship
          accepted: true
          detail: completed
          before: *id015
          after: &id016
            sku: BOX
            onHand: 6
            reserved: 4
            available: 2
        - index: 4
          type: release
          accepted: true
          detail: completed
          before: *id016
          after: &id017
            sku: BOX
            onHand: 6
            reserved: 2
            available: 4
        current: *id017
      detailDescription: <p>Ban đầu có 10 đơn vị khả dụng. Giữ 8 thành công khiến available còn 2; cố giữ 3 bị <code>insufficient available units</code>, trạng thái
        không đổi. <code>ship(4)</code> giảm cả onHand và reserved thành 6/4, rồi <code>release(2)</code> giảm reserved còn 2 và available lên 4. Mỗi <code>StockStep</code>
        lưu before/after, và toàn API trả HTTP 200.</p>
    - id: case_002
      title: Từ chối kho khởi tạo sai bất biến
      description: reserved lớn hơn onHand không phải một trạng thái StockLedger hợp lệ.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOX
          initialOnHand: 1
          initialReserved: 3
          actions:
          - type: ship
            units: 1
      status: 400
      response:
        error: require 0 <= reserved <= onHand <= 1000000
      detailDescription: <p>Constructor <code>StockLedger(&quot;BOX&quot;,1,3)</code> phát hiện <code>initialReserved &gt; initialOnHand</code>, ném <code>IllegalArgumentException</code>
        trước khi tạo <code>StockStep</code>. Handler trả HTTP 400; không chuyển trường hợp khởi tạo sai thành bước từ chối thông thường.</p>
    - id: case_003
      title: Giới hạn tồn kho tối đa
      description: Thử bổ sung một đơn vị ở đúng giới hạn cho phép mà không làm đổi onHand.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOX
          initialOnHand: 1000000
          initialReserved: 0
          actions:
          - type: restock
            units: 1
      status: 200
      response:
        initial: &id018
          sku: BOX
          onHand: 1000000
          reserved: 0
          available: 1000000
        steps:
        - index: 1
          type: restock
          accepted: false
          detail: stock limit exceeded
          before: *id018
          after: *id018
        current: *id018
      detailDescription: <p><code>StockLedger.restock(1)</code> kiểm tra <code>amount &gt; MAX_UNITS - onHand</code> và ném <code>IllegalStateException</code> trước
        khi tăng onHand. Service ghi bước có <code>accepted=false</code>, <code>detail=stock limit exceeded</code>, before/after cùng tồn kho 1000000. HTTP vẫn 200.</p>
    - id: case_004
      title: Không chấp nhận hành động với units bằng 0
      description: Giới hạn units dương thuộc phương thức nghiệp vụ dù payload đủ trường.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          sku: BOX
          initialOnHand: 10
          initialReserved: 0
          actions:
          - type: reserve
            units: 0
      status: 200
      response:
        initial: &id019
          sku: BOX
          onHand: 10
          reserved: 0
          available: 10
        steps:
        - index: 1
          type: reserve
          accepted: false
          detail: amount must be positive
          before: *id019
          after: *id019
        current: *id019
      detailDescription: <p>Action có type và units hợp lệ về cấu trúc nên vòng lặp chạy; <code>StockLedger.positive(0)</code> mới ném <code>IllegalArgumentException</code>.
        Service bắt lỗi trong bước, trả <code>accepted=false</code> với trạng thái tồn kho không đổi và HTTP 200.</p>
  snapshot(EventRequest):
    methodName: snapshot
    httpMethods:
    - POST
    mappingPaths:
    - /oop/encapsulation/event-snapshot/experiment
    usage: true
    cases:
    - id: case_001
      title: Sửa draft và getter nhưng snapshot giữ nguyên
      description: Chứng minh Date được sao chép phòng vệ và khách mời mutable được chiếu thành chuỗi bất biến.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          startEpochMillis: 1000
          attendeeNames:
          - An
          - Binh
          mutatedExternalEpochMillis: 2000
          renamedFirst: Changed
          addedAttendee: New
      status: 200
      response:
        originalDraft: &id020
          startEpochMillis: 1000
          attendeeNames:
          - An
          - Binh
        mutatedDraft:
          startEpochMillis: 2000
          attendeeNames:
          - Changed
          - Binh
          - New
        protectedSnapshot: *id020
        afterGetterMutation: *id020
        returnedListIsUnmodifiable: true
      detailDescription: <p><code>EventSnapshot</code> chụp timestamp 1000 và hai tên An/Binh. Service tiếp tục sửa Date nguồn thành 2000, đổi An thành Changed và
        thêm New, nên <code>mutatedDraft</code> phản ánh thay đổi. Getter ngày trả Date bản sao; getter danh sách từ <code>List.copyOf</code> từ chối thêm, khiến
        <code>protectedSnapshot</code> và <code>afterGetterMutation</code> vẫn bằng <code>originalDraft</code>.</p>
    - id: case_002
      title: Từ chối sự kiện không có khách mời
      description: Quy tắc 1–19 tên được kiểm tra trước tạo bất kỳ snapshot nào.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          startEpochMillis: 1000
          attendeeNames: []
          mutatedExternalEpochMillis: 2000
          renamedFirst: Changed
          addedAttendee: New
      status: 400
      response:
        error: dates and 1..19 initial attendeeNames are required
      detailDescription: <p><code>simulateEvent()</code> kiểm tra <code>attendeeNames.isEmpty()</code> và ném <code>IllegalArgumentException</code> trước khi tạo
        <code>AttendeeDraft</code>. Handler trả HTTP 400 với thông báo chính xác từ service.</p>
    - id: case_003
      title: Không chấp nhận tên đổi thành rỗng
      description: Tên khách mời mới phải qua kiểm tra của AttendeeDraft trước khi chụp dữ liệu.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          startEpochMillis: 1000
          attendeeNames:
          - An
          mutatedExternalEpochMillis: 2000
          renamedFirst: ''
          addedAttendee: New
      status: 400
      response:
        error: attendee name must contain 1..80 characters
      detailDescription: <p><code>new EventSnapshot.AttendeeDraft(renamedFirst)</code> được chạy như bước tiền kiểm tra. Với chuỗi rỗng, <code>rename()</code> ném
        <code>IllegalArgumentException</code>; <code>EventSnapshot</code> chưa được tạo và handler trả HTTP 400.</p>
  order(OrderRequest):
    methodName: order
    httpMethods:
    - POST
    mappingPaths:
    - /oop/encapsulation/order/experiment
    usage: true
    cases:
    - id: case_001
      title: Chỉ chuyển trạng thái hợp lệ
      description: Thử giao trước khi thanh toán, thanh toán, hủy sau khi thanh toán rồi giao hợp lệ.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: O-1
          items: &id021
          - sku: BOOK
            quantity: 1
          actions:
          - type: ship
          - type: markPaid
          - type: cancel
          - type: ship
      status: 200
      response:
        initial: &id022
          orderId: O-1
          status: CREATED
          items: *id021
        steps:
        - index: 1
          type: ship
          accepted: false
          detail: ship not allowed when CREATED
          before: *id022
          after: *id022
        - index: 2
          type: markPaid
          accepted: true
          detail: completed
          before: *id022
          after: &id023
            orderId: O-1
            status: PAID
            items: *id021
        - index: 3
          type: cancel
          accepted: false
          detail: cancel not allowed when PAID
          before: *id023
          after: *id023
        - index: 4
          type: ship
          accepted: true
          detail: completed
          before: *id023
          after: &id024
            orderId: O-1
            status: SHIPPED
            items: *id021
        current: *id024
        scope: SIMULATED_ORDER_NO_REAL_PAYMENT_OR_SHIPPING
      detailDescription: '<p><code>LifecycleOrder</code> bắt đầu ở <code>CREATED</code>: <code>ship()</code> bị từ chối và vẫn CREATED. <code>markPaid()</code> chuyển
        thành <code>PAID</code>, nên <code>cancel()</code> tiếp tục bị từ chối với trạng thái PAID giữ nguyên. Sau cùng <code>ship()</code> chuyển thành <code>SHIPPED</code>.
        Các bước sai chỉ ghi <code>accepted=false</code>; không có thanh toán hay giao hàng thật.</p>'
    - id: case_002
      title: Hủy đơn trước khi thanh toán là trạng thái cuối
      description: CREATED được phép hủy nhưng CANCELLED không cho đánh dấu thanh toán.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: O-2
          items: *id021
          actions:
          - type: cancel
          - type: markPaid
      status: 200
      response:
        initial: &id025
          orderId: O-2
          status: CREATED
          items: *id021
        steps:
        - index: 1
          type: cancel
          accepted: true
          detail: completed
          before: *id025
          after: &id026
            orderId: O-2
            status: CANCELLED
            items: *id021
        - index: 2
          type: markPaid
          accepted: false
          detail: markPaid not allowed when CANCELLED
          before: *id026
          after: *id026
        current: *id026
        scope: SIMULATED_ORDER_NO_REAL_PAYMENT_OR_SHIPPING
      detailDescription: <p><code>cancel()</code> kiểm tra <code>CREATED</code> rồi chuyển thành <code>CANCELLED</code>. <code>markPaid()</code> sau đó gọi <code>requireStatus(CREATED)</code>
        và ném lỗi <code>markPaid not allowed when CANCELLED</code>. Service ghi bước thứ hai không thành công, trạng thái cuối vẫn CANCELLED.</p>
    - id: case_003
      title: Không tạo đơn khi orderId rỗng
      description: Constructor áp dụng điều kiện định danh trước khi chuyển trạng thái.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: ''
          items: *id021
          actions:
          - type: cancel
      status: 400
      response:
        error: orderId must be 1..40 characters
      detailDescription: <p><code>LifecycleOrder</code> kiểm tra <code>orderId.strip().matches(...)</code> và từ chối chuỗi rỗng. Việc tạo order thất bại trước khi
        service bắt đầu chuỗi hành động; handler trả HTTP 400 và thông điệp gốc.</p>
    - id: case_004
      title: Không hỗ trợ hành động reopen
      description: API chỉ chấp nhận ba ý định nghiệp vụ đã công bố.
      input:
        pathParams: {}
        queryParams: {}
        headers: {}
        body:
          orderId: O-1
          items: *id021
          actions:
          - type: reopen
      status: 400
      response:
        error: order actions must be markPaid/ship/cancel
      detailDescription: <p><code>simulateOrder()</code> duyệt toàn bộ action trước khi khởi tạo <code>LifecycleOrder</code> và chỉ cho phép <code>markPaid</code>,
        <code>ship</code>, <code>cancel</code>. Type <code>reopen</code> ném <code>IllegalArgumentException</code> và handler trả HTTP 400, không có trạng thái trung
        gian.</p>
InheritanceExperimentsController:
  calculatePay(PayrollRequest):
    methodName: calculatePay
    httpMethods:
    - POST
    mappingPaths:
    - /oop/inheritance/payroll/calculate
    usage: true
    cases:
    - id: case_001
      title: Nh?n vi?n l??ng c? ??nh qua l?p cha
      description: M? v? t?n ???c trim, ph?p t?nh tr? m?c l??ng th?ng c? ??nh.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: salaried
          employeeId: ' E-01 '
          employeeName: ' Ada '
          monthlySalaryVnd: 20000000
          hourlyRateVnd: 0
          workedHours: 0
      status: 200
      response:
        employeeId: E-01
        employeeName: Ada
        kind: SALARIED
        runtimeClass: Salaried
        declaredType: Employee
        calculation: FIXED_MONTHLY
        monthlyPayVnd: 20000000
        simulatedOnly: true
      detailDescription: <p><code>PayrollInheritanceService</code> chu?n h?a kind t? salaried th?nh SALARIED, x?c nh?n hourlyRateVnd/workedHours b?ng 0 r?i t?o <code>Employee.Salaried</code>.
        Constructor cha trim ID v? t?n th?nh E-01/Ada. M?c d? tham chi?u khai b?o <code>Employee</code>, dispatch g?i <code>Salaried.monthlyPayVnd()</code> tr? 20000000
        v? <code>calculation()</code> tr? FIXED_MONTHLY. HTTP 200, simulatedOnly=true.</p>
    - id: case_002
      title: Nh?n vi?n t?nh l??ng theo gi?
      description: Runtime class Hourly ghi ?? c?ng th?c l??ng tr?n tham chi?u Employee.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: HOURLY
          employeeId: H-01
          employeeName: Grace
          monthlySalaryVnd: 0
          hourlyRateVnd: 130000
          workedHours: 160
      status: 200
      response:
        employeeId: H-01
        employeeName: Grace
        kind: HOURLY
        runtimeClass: Hourly
        declaredType: Employee
        calculation: HOURLY_RATE_TIMES_HOURS
        monthlyPayVnd: 20800000
        simulatedOnly: true
      detailDescription: <p>Nh?nh HOURLY y?u c?u monthlySalaryVnd=0 v? t?o <code>Employee.Hourly</code> v?i 130000 VND/gi?, 160 gi?. <code>monthlyPayVnd()</code>
        d?ng <code>Math.multiplyExact</code>, k?t qu? 20800000. M?c d? bi?n l? <code>Employee</code>, runtime dispatch t?i <code>Hourly</code>; response ph?n bi?t
        r? declaredType v? runtimeClass.</p>
    - id: case_003
      title: T? ch?i tr??ng l??ng theo gi? c?a SALARIED
      description: Salaried kh?ng cho ph?p g?i d? li?u hourlyRateVnd kh?c 0.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: SALARIED
          employeeId: E-01
          employeeName: Ada
          monthlySalaryVnd: 5000
          hourlyRateVnd: 5
          workedHours: 0
      status: 400
      response:
        code: INVALID_INPUT
        message: Salaried employees must not supply hourly fields
      detailDescription: <p>Service nh?n kind SALARIED nh?ng th?y hourlyRateVnd=5, kh?ng th?a ?i?u ki?n hai tr??ng hourly ??u ph?i b?ng 0. <code>PayrollInheritanceService.calculate</code>
        n?m <code>IllegalArgumentException</code> tr??c khi t?o <code>Employee.Salaried</code>. <code>InheritanceExceptionHandler</code> tr? HTTP 400 v?i th?ng ?i?p
        ??u v?o nguy?n g?c.</p>
    - id: case_004
      title: Tr?n s? long khi t?nh l??ng gi?
      description: Math.multiplyExact ph?t hi?n 9223372036854775807 nh?n 2 v??t long.
      input:
        pathParams: {}
        queryParams: {}
        headers:
          Content-Type: application/json
        body:
          kind: HOURLY
          employeeId: H1
          employeeName: Ada
          monthlySalaryVnd: 0
          hourlyRateVnd: 9223372036854775807
          workedHours: 2
      status: 422
      response:
        code: ARITHMETIC_OVERFLOW
