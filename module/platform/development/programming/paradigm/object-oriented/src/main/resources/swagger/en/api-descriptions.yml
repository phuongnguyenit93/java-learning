CompositionExperimentController:
  notification(NotificationRequest):
    summary: Compose a formatter, transport and optional audit decorator
    description: '<p>Accepts an order, recipient, amount, <code>FULL</code>/<code>COMPACT</code> format, <code>EMAIL</code>/<code>SMS</code> channel and audit option.
      The service combines <code>Formatter</code>, <code>RecordingTransport</code> and optionally <code>AuditedTransport</code>, then delegates to <code>Notifier</code>.</p>

      <p>The response includes formatted content, acceptance and an ordered trace. If transport rejects the message, the audit decorator does not falsely claim acceptance.
      This demonstrates interchangeable collaborators, Strategy, Decorator and delegation without sending any real notification.</p>'
