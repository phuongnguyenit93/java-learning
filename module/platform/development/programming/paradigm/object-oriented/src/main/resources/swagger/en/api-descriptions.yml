    summary: Replace pricing policies and inject a policy for one quote
    description: '<p>Builds <code>SwitchablePricing</code> with an initial <code>NONE</code>, <code>FIXED</code> or <code>PERCENT</code> policy, then runs up to 20
      <code>SWITCH</code>, <code>QUOTE</code> and <code>QUOTE_WITH_POLICY</code> steps. A timeline records active policy, policy used, subtotal and payable amount.</p>

      <p><code>SWITCH</code> replaces the collaborator held by <code>AtomicReference</code>; <code>QUOTE_WITH_POLICY</code> passes a temporary collaborator for only
      one quote without changing the active one. Immutable policies and pricing state are local to the request.</p>'
