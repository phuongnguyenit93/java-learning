  resources(ResourceRequest):
    summary: Observe explicit closing for owned versus borrowed resources
    description: '<p>Creates a simulated <code>TrackedHandle</code> and composes it with an <code>Exporter</code>. Under <code>OWNED</code> ownership, closing the
      exporter also closes the handle; under <code>BORROWED</code> ownership, the exporter closes itself and the caller closes the handle afterward.</p>

      <p>The response traces construction, write and close operations, records closure state at two points and reports simulated write failure. The experiment illustrates
