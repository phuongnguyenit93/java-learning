  - question: "Một đồng nghiệp cho rằng dùng immutable record Transaction(-20) sẽ bảo đảm business correctness. Bạn chỉ rõ hai khái niệm khác nhau và cách bảo vệ chúng ra sao?"
    answer: "Immutability chỉ nói một giá trị sau khi tạo không bị sửa; nó không nói số tiền -20 là hợp lệ. Nếu domain yêu cầu amount>0, factory hoặc constructor phải xác thực ngay từ đầu, kể cả dữ liệu đến từ deserialization. Ngược lại Account mutable vẫn giữ invariant balance>=0 khi balance thay100→70 đúng contract. Tôi kiểm cả thời điểm tạo và mọi chuyển trạng thái, và không suy từ cú pháp record hay final rằng domain đã chính xác."
    aiGenerated: true
