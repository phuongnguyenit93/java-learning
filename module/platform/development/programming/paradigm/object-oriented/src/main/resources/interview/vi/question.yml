questions:
  - question: "Trong một codebase có rất nhiều class nhưng quy tắc rút tiền vẫn nằm ở các màn hình, bạn giải thích vì sao đó chưa chắc là thiết kế OOP tốt như thế nào?"
    answer: "Tôi bắt đầu từ thực thể Account có danh tính và trách nhiệm bảo đảm hành vi rút tiền, thay vì đếm số lượng class. Nếu UI và batch đều tự trừ balance thì hai nơi có thể xử lý trường hợp thiếu tiền khác nhau. Tôi xác định contract withdraw(amount), điều kiện trước/sau và ai được thay đổi trạng thái. Một object bất biến vẫn có thể thuộc mô hình OOP; dùng class và private chỉ là công cụ, không tự đặt đúng trách nhiệm. Tôi yêu cầu trace thay đổi nghiệp vụ ở một chỗ và kiểm thử với hai tài khoản riêng."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ObjectOrientedProgramming.md"
      anchor: "oop-what"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Khi quy tắc không cho âm tiền thay đổi, bạn chọn đặt quyết định tại Account hay tại Checkout? Hãy lý giải theo trách nhiệm và tác động sửa đổi."
    answer: "Account quản lý số dư và quyết định liệu withdraw có hợp lệ với invariant balance>=0; Checkout điều phối yêu cầu mua hàng chứ không được tự tính balance mới rồi gán. Nếu quy tắc nằm ở UI, service và tác vụ nền, một thay đổi sẽ phải sửa ba nơi với nguy cơ sai khác. Tôi tìm owner bằng câu hỏi thành phần nào có đủ dữ liệu và quyền bảo đảm quy tắc, sau đó cho caller nhận kết quả thành công/thất bại rõ ràng. Điều này không bảo đảm giao dịch liên hệ nhiều hệ thống tự động nguyên tử."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ObjectOrientedProgramming.md"
      anchor: "oop-why"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Một phép xử lý danh sách đơn giản đã dùng thủ tục withdraw(accountData,amount). Khi nào bạn giữ cách thủ tục, và bằng chứng nào khiến bạn chuyển sang đối tượng cộng tác?"
    answer: "Tôi không xem lối thủ tục là sai: với một cấu trúc dữ liệu và hàm xử lý rõ ràng, ít vòng đời, cách này có thể dễ đọc, dễ test. Khi nhiều Account có danh tính, lịch sử, chính sách phí và các caller độc lập cùng thay đổi quy tắc, một owner hành vi trở nên có ích. Tôi lập bản đồ ai kiểm tra số dư, ai gửi notification và thay đổi nào kéo theo sửa ở những nơi không liên quan. Chỉ chuyển sang thiết kế object nếu ranh giới trách nhiệm và hợp đồng làm giảm sự phân tán thật sự, không vì tiêu chí số class."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ObjectOrientedProgramming.md"
      anchor: "oop-before"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Hai Account A và B đều có số dư 100. Hãy dựng một lần rút ở A và chỉ ra danh tính, trạng thái, hành vi và quan hệ cộng tác khác nhau ra sao."
    answer: "A và B là hai thực thể riêng dù balance cùng bằng 100; mỗi tài khoản có lịch sử và quyền truy cập độc lập. Checkout gửi A.withdraw(30), Account A kiểm tra và cập nhật 100→70, còn B giữ 100. Số dư là trạng thái, withdraw là hành vi chịu trách nhiệm bảo vệ điều kiện và phản hồi kết quả, Checkout chỉ phối hợp. Nếu dùng một record giá trị số tiền 100 thì so sánh nội dung là đủ ở ngữ cảnh khác, nhưng không thể suy hai Account cùng danh tính. Tôi kiểm test đọc cả A và B sau giao dịch."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ObjectOrientedProgramming.md"
      anchor: "oop-solution"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Bạn được yêu cầu dạy OOP cho người chưa biết Java: nên giải thích hợp đồng thanh toán trước hay bắt đầu bằng cú pháp interface/private/override? Vì sao?"
    answer: "Tôi bắt đầu bằng lời hứa hành vi: pay(amount) nhận số dương đủ điều kiện xử lý và báo thành công hoặc thất bại theo nhà cung cấp; Account bảo vệ rút tiền. Sau đó mới hỏi ngôn ngữ nào hiện thực boundary và cách kiểm tra kết quả quan sát được. Từ khóa interface, private hay cơ chế method dispatch cụ thể thuộc Java Core, không phải định nghĩa của OOP. Cách dạy này tránh nhầm viết private field là đóng gói đúng hoặc dùng inheritance là đã có substitutability; đồng thời không bịa contract HTTP trong module LIBRARY."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ObjectOrientedProgramming.md"
      anchor: "oop-boundary"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Bạn tổ chức lộ trình học một ví dụ Account từ zero đến thiết kế đa hình như thế nào để người học không nhảy thẳng vào inheritance?"
    answer: "Tôi dùng Account A/B cùng balance100 để phân biệt identity với value, sau đó cho A rút30 thành70 và thử rút120 bị từ chối, rút ra invariant thay vì bất biến dữ liệu. Tiếp theo xác định Account, Checkout, Notifier sở hữu quyết định nào và contract caller thấy gì. Khi đó mới xét thay đổi provider Wallet/Card qua hợp đồng pay chung, điều kiện kiểu con và lựa chọn composition. Cuối cùng cho chuyển tiền nhiều bước gặp lỗi credit để làm rõ ranh giới OOP với tính nguyên tử của transaction; không bỏ qua những câu hỏi WHY trước cú pháp."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/ObjectOrientedProgramming.md"
      anchor: "oop-learning-path"
