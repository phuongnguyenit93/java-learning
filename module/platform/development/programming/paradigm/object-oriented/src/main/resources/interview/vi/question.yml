  - question: "UI đề xuất công khai setBalance(value) để thanh toán tự trừ tiền. Bạn phản biện bằng một lỗ hổng cụ thể và đề xuất API bảo vệ như thế nào?"
    answer: "Với setBalance(-50), bất kỳ caller nào đều có thể phá quy tắc không thấu chi mà Account không biết điều kiện gì phải kiểm. Thay vào đó UI yêu cầu withdraw(amount), Account xác nhận số dương, đủ số dư và cập nhật thống nhất, rồi trả kết quả có ý nghĩa. Việc đổi trường sang private hỗ trợ enforcement nhưng không đủ nếu setter vẫn cho ghi tùy ý. Tôi test rút quá mức không đổi balance và audit rõ nguyên nhân; Checkout không sở hữu thao tác gán nội bộ."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.EncapsulationAbstraction/EncapsulationAbstraction.md"
      anchor: "oop-encapsulation-purpose"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Đang có balance100, người dùng rút30 rồi thử rút120. Bạn định nghĩa invariant và thiết kế kiểm thử nào để chứng minh mọi trạng thái được công bố đều hợp lệ?"
    answer: "Điều kiện của tài khoản không thấu chi là balance>=0 ở trạng thái hợp lệ. Rút30 từ100 có thể commit balance70, vẫn đúng invariant; tiếp tục rút120 phải thất bại, balance vẫn70 thay vì -50. Tôi thử cả khởi tạo âm, amount không hợp lệ, trạng thái sau khi exception và đường caller lặp lại; một kiểm tra canWithdraw tách rời không tự bảo đảm withdraw an toàn dưới cạnh tranh. Nếu nhiều luồng cùng cập nhật, cần thêm cơ chế đồng bộ bên ngoài mental model OOP cơ bản."
