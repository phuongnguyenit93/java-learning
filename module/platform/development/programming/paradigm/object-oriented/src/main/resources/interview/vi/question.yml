  - question: "Tại sao API withdraw(amount) là contract tốt hơn việc để caller đọc balance rồi tự setBalance(balance-amount), và không nên ẩn những tác động nào?"
    answer: "Chuỗi caller đọc100, tự tính70 rồi ghi khiến validation và cập nhật bị chia ở hai nơi, đồng thời có nguy cơ dữ liệu cũ nếu caller khác cũng rút. withdraw diễn đạt ý định, gom quyết định hợp lệ và kết quả success/failure tại owner Account; chi tiết lưu trữ có thể đổi sau hợp đồng. Nhưng nếu hành vi ghi lịch sử, thu phí hoặc phát sự kiện quan trọng thì contract phải diễn tả để caller không tưởng là một phép tính thuần. Tôi test observable postconditions và thất bại không làm trạng thái bị sửa một phần."
