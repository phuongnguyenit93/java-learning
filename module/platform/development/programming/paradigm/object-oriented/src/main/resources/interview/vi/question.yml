  - question: "Hai tài khoản có balance100 và cùng loại Account: bạn quyết định khi nào so sánh danh tính, khi nào so sánh giá trị bằng ví dụ audit thế nào?"
    answer: "Tôi kiểm cùng một chủ sở hữu và account id chứ không suy từ balance. Account A và B đều 100 nhưng lịch sử giao dịch, quyền xem và trách nhiệm khác nhau; audit ghi A.withdraw(30) không được quy cho B. Ngược lại hai Money(100,VND) độc lập có thể tương đương về nội dung nếu đơn vị và ngữ cảnh đúng. Nếu dùng equals theo balance để định danh tài khoản, hệ thống dễ gửi thông báo nhầm người. Tôi viết test cho A≠B về identity, cùng balance lúc đầu và quan sát sau thao tác khác nhau."
