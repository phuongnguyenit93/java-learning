  - question: "Hợp đồng pay(30) của PaymentMethod nên công bố những gì để Checkout thay được Card bằng Wallet, và điều gì không được hứa trước?"
    answer: "Checkout cần biết amount hợp lệ, cách nhận success/failure và tác động quan sát được; nó không cần chi tiết các bước provider kiểm tra phí. Số30>0 chỉ có nghĩa request đủ điều kiện thử xử lý, không cam kết provider sẽ duyệt; Wallet bị decline theo contract vẫn hoàn toàn hợp lệ. Tôi mô tả failure mode, retry/idempotency khi bên ngoài có tác động và kiểm thay implementation bằng test contract chung. Trừu tượng không nên mơ hồ doEverything cũng không lộ mọi field nội bộ."
