  - question: "PaymentMethod.pay có hai provider Card và Wallet, Wallet đôi khi decline. Bạn phát biểu tiền điều kiện, kết quả và ngoại lệ sao cho hai implementation cùng thay thế được?"
    answer: "Hợp đồng chung có thể nhận amount>0, trả approved hoặc declined và công bố lỗi provider một cách nhất quán. Decline của Wallet là một kết quả được phép nếu contract không hứa thành công cho mọi amount; đây khác việc kiểu con bí mật chỉ chấp nhận amount>=50. Tôi viết test contract cho amount30 và các đường thất bại, kiểm Checkout không giả approved chỉ vì method trả về. Các hiệu ứng thật như trừ tiền ngoài hệ thống cần chỉ rõ ranh giới và idempotency riêng, không do chữ ký pay tự bảo đảm."
