  - question: "Bạn gặp một đối tượng Account có canWithdraw và withdraw. Tại sao phân biệt truy vấn không sửa trạng thái với lệnh sửa là quan trọng, kể cả OOP có đối tượng bất biến?"
    answer: "canWithdraw(30) có thể chỉ trả kết quả dựa vào balance100 mà không ghi lại số dư; withdraw(30) thực hiện thay đổi hợp lệ thành70 hoặc từ chối theo contract. Không nên nghĩ hễ có method là state thay đổi, cũng không nên tin mọi đối tượng OOP phải mutable. FeePolicy hoặc Money bất biến có thể trả giá trị tính toán hữu ích. Tôi kiểm trạng thái trước/sau cả hai lời gọi và tác động audit nếu có, thay vì nhìn tên method rồi khẳng định side effect."
    aiGenerated: true
