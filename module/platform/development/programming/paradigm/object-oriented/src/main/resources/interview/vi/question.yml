  - question: "Với Account, Checkout và Notifier, bạn phân công trách nhiệm ra sao khi một đơn thanh toán bị từ chối vì thiếu tiền?"
    answer: "Account chịu trách nhiệm quyết định rút tiền có giữ balance>=0 hay không và trả lý do thất bại; Checkout điều phối đơn và diễn giải kết quả cho luồng mua; Notifier chuyển thông báo theo yêu cầu chứ không quyết định số dư. Tôi phân biệt một trách nhiệm với một method: Account có thể có nhiều hành vi cùng phục vụ bảo toàn số dư. Khi chính sách thấu chi thay đổi, chỉ owner của quy tắc cần thay đổi, trong khi template email của Notifier không bị kéo vào việc tính tiền. Tôi kiểm lỗi đi đúng đường mà không ghi trạng thái giả thành công."
