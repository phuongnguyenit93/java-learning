    answer: "Service biết chi tiết balance, kiểm toán tự viết quy tắc và ghi lại số dư là dấu hiệu quyết định đã rơi ra khỏi Account. Tôi chuyển nghiệp vụ rút vào Account.withdraw(amount), cho Checkout gửi yêu cầu và phản hồi, còn FeePolicy có thể tính phí theo một hợp đồng riêng nếu nó thực sự sở hữu policy. Tôi xác định đâu là quy tắc phải cùng thay đổi theo thời gian rồi phân trách nhiệm theo đó, tránh chuyển toàn bộ provider, thông báo và audit vào Account. Cuối cùng kiểm fail rút quá mức vẫn giữ số dư và không tạo success giả."
