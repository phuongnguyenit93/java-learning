Group1Controller:
  executeCase1():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Minh họa việc thay chính sách tính phí mà vẫn giữ đúng thao tác đặt lịch và phát thông báo nhờ các trách nhiệm được tách thành AppointmentBook, Billing, Messenger và HospitalUseCase. Phép kiểm tra sử dụng cùng sổ hẹn với hai cách tính phí để phát hiện sự phụ thuộc ngoài ý muốn.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/1/case/1/execute</code>, rồi xem stdout của tiến trình Spring Boot. Khi toàn bộ assertion nội bộ đều đúng, chương trình in <code>PASS: phí thay đổi, lịch hẹn vẫn đúng</code>. Các assertion kiểm phí lần lượt 100000 và 120000, slot <code>9:00</code> của bệnh nhân <code>P-1</code> và danh sách thông báo giả lập chứa hai lần <code>P-1</code>.</p>
      <p>Controller trả <code>void</code>; HTTP response không chứa các giá trị phí hoặc lịch hẹn. Muốn kiểm tra riêng các giá trị, đặt breakpoint trong <code>Group1Service.executeCase1</code> và quan sát biến <code>book</code>, <code>sent</code>. Không có SMS hay lịch hẹn ngoài bộ nhớ được ghi ở ví dụ này.</p>
      <h3>4. Kết luận</h3>
      <p>Thông báo PASS chứng minh bộ assertion cụ thể đã hoàn tất mà không ném lỗi, gồm thay đổi phí nhưng giữ hành vi đặt lịch trong ví dụ. Nó không chứng minh giao dịch đặt lịch, thanh toán và gửi thông báo là nguyên tử hoặc an toàn trong mọi tình huống thực tế.</p>
    usage: true
  executeCase2():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Thử đối chiếu luồng render đi qua Provider, Factory và Helper với SimplifiedRenderer trực tiếp, nhằm minh họa cách bỏ lớp chuyển tiếp thừa nhưng vẫn giữ hợp đồng đầu ra và kiểm tra lỗi.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/1/case/2/execute</code> và xem stdout của ứng dụng. Nếu các phép so sánh đầu ra cho đơn hàng <code>A:0</code>, <code>B:1250</code> và hai phép thử từ chối dữ liệu sai đều qua, chương trình in <code>PASS: hành vi được giữ, bớt hai tầng chuyển tiếp</code>. Có thể đặt breakpoint vào <code>Provider.render</code>, <code>Factory.render</code> và <code>SimplifiedRenderer.render</code> để so sánh call stack.</p>
      <p>Phương thức trả <code>void</code>; nội dung render chỉ được kiểm bằng assertion trong Service, không được gửi trong body HTTP.</p>
      <h3>4. Kết luận</h3>
      <p>Đầu ra của hai cách cài đặt tương đương trên các mẫu được thử và cùng từ chối input sai. Không thể từ vài phép thử này kết luận mọi lớp trung gian trong hệ thống đều vô ích hoặc hai cách luôn tương đương trên mọi trường hợp.</p>
    usage: true
  executeCase3():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Đối chiếu object có field số dư công khai với Account giữ state private và bắt thay đổi qua method có guard. Trọng tâm là bảo toàn invariant số dư không âm khi rút tiền, nạp tiền và khởi tạo.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/1/case/3/execute</code>, theo dõi stdout để tìm <code>PASS: invariant số dư không âm</code>. Trong Service, ví dụ cố ý đặt <code>BadAccount.balance = -50</code>, rồi thử rút 150 từ Account có số dư 100 và kiểm số dư vẫn 100; sau rút 60 và nạp 10, số dư cần bằng 50. Khởi tạo Account với số dư -1 cũng phải bị từ chối.</p>
      <p>Các exception mong đợi được helper bắt tại chỗ; không dựa vào HTTP status để chứng minh chúng. Debugger có thể theo dõi <code>Account.balance()</code> ở từng assertion. Không có kho tài khoản hoặc database được cập nhật.</p>
      <h3>4. Kết luận</h3>
      <p>Encapsulation khiến caller phải đi qua quy tắc kiểm tra của object và giữ invariant trong luồng tuần tự được minh họa. Chưa có bằng chứng về tính an toàn đồng thời, transaction hay hành vi với mọi giá trị số học.</p>
    usage: true
  executeCase4():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Minh họa việc hai bounded context bán hàng và hỗ trợ cùng tham chiếu CustomerId nhưng sở hữu các trạng thái khác nhau: điểm tích lũy và cờ ưu tiên. Mục tiêu là kiểm chứng đồng nhất identity mà không trộn trách nhiệm.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/1/case/4/execute</code> và tìm stdout <code>PASS: cùng identity, hai trách nhiệm độc lập</code>. Service tạo chung <code>CustomerId("C-1")</code> cho SalesCustomer và SupportCustomer, cộng 25 điểm và bật ưu tiên; các assertion đối chiếu identity, 25 điểm và cờ ưu tiên. Có thể đặt breakpoint ở cuối <code>executeCase4</code> để xem hai object giữ state riêng.</p>
      <p>Không có dữ liệu khách hàng thực hay đồng bộ giữa hai hệ thống; response HTTP của method <code>void</code> cũng không xuất các thuộc tính này.</p>
      <h3>4. Kết luận</h3>
      <p>Ví dụ xác nhận hai model có thể chia sẻ khóa định danh mà không phải chia sẻ toàn bộ state. Chưa chứng minh được cơ chế nhất quán dữ liệu, hợp đồng tích hợp giữa các dịch vụ hoặc phân quyền theo context.</p>
    usage: true
  executeCase5():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Kiểm chứng boundary giữa lấy dữ liệu bán hàng, định dạng CSV và gửi báo cáo. Cùng ReportFormatter được dùng với gateway ghi vào danh sách trong bộ nhớ và gateway cố ý ném exception, qua đó thử tính độc lập của logic định dạng.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/1/case/5/execute</code>; khi các assertion qua, stdout xuất <code>PASS: formatter không phụ thuộc mail</code>. Service kiểm mailbox giả lập chứa đúng <code>id,cents</code> và dòng <code>S1,900</code>, đồng thời xác nhận nhánh gateway giả lập ném <code>SMTP unavailable</code> đã được bắt rồi vẫn định dạng được báo cáo.</p>
      <p>Có thể xem biến <code>mailbox</code> và giá trị của <code>formatter.format(...)</code> trong debugger. Tên lỗi SMTP chỉ là thông điệp của lambda giả lập; không có kết nối SMTP, email hay database thực nào được mở.</p>
      <h3>4. Kết luận</h3>
      <p>Việc formatter hoạt động với hai hành vi gateway cho thấy logic định dạng độc lập với vận chuyển trong các phép thử. Không suy ra đã gửi email thành công, đã xử lý retry hay đã bảo đảm giao hàng cho một hệ thống bên ngoài.</p>
    usage: true
  executeCase6():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Minh họa Open/Closed Principle bằng cách đăng ký thêm Express vào bảng ShippingPolicy mà giữ nguyên phương thức Shipping.dispatch. Các phép thử so sánh Standard trước/sau mở rộng và kiểm đường lỗi.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/1/case/6/execute</code> và tìm <code>PASS: kênh mới không đổi policy cũ</code> trên stdout. Service xác minh <code>standard</code> vẫn trả <code>STD:15000</code>, <code>express</code> trả <code>EXP:35000</code> tại mức khối lượng thử và từ chối loại <code>unknown</code> hoặc Express ở mức 6000 gram.</p>
      <p>Đặt breakpoint trong <code>Shipping.dispatch</code> nếu cần thấy việc tra policy theo <code>type</code>. Đây là các phép tính trong bộ nhớ; không có thao tác gửi hàng hoặc bảng giá bên ngoài.</p>
      <h3>4. Kết luận</h3>
      <p>Thêm một policy bằng cấu hình đăng ký có thể giữ nguyên mã dispatch và hành vi Standard trong những trường hợp đã kiểm. Không chứng minh mọi policy tương lai luôn tương thích hay các giới hạn khối lượng thực tế của hãng vận chuyển.</p>
    usage: true
  executeCase7():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Phân biệt Payment domain object với dạng row lưu trữ, DTO cho API và view cho giao diện. Cùng một thay đổi trạng thái trong domain được ánh xạ sang các biểu diễn riêng biệt, giúp giới hạn phụ thuộc giữa các boundary.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/1/case/7/execute</code> và kiểm tra stdout <code>PASS: domain khác biểu diễn lưu trữ/API/UI</code>. Các assertion trong Service yêu cầu response trước xác nhận có <code>completed=false</code>; sau <code>Payment.confirm()</code>, row có <code>dbStatus=PAID</code>, response có <code>completed=true</code>, view có tiêu đề <code>Đã thanh toán</code> và domain đạt <code>Status7.PAID</code>.</p>
      <p>Dùng debugger quan sát từng đối tượng do <code>Case7Utils</code> tạo ra. Các row, response và view chỉ là object Java tạo tại chỗ; ví dụ không thực sự ghi database, trả DTO qua HTTP hay render UI.</p>
      <h3>4. Kết luận</h3>
      <p>Ví dụ cho thấy ánh xạ giữa domain và biểu diễn bên ngoài mà không buộc domain dùng trực tiếp định dạng lưu trữ/UI. Chưa có kiểm chứng về schema database, serialization JSON hoặc khả năng tương thích API đã triển khai.</p>
    usage: true
  executeCase8():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Kiểm tra entity equality dựa trên employeeId ổn định thay vì họ tên hoặc ngày sinh, đồng thời xác nhận hợp đồng equals/hashCode khi dùng Employee trong HashSet.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/1/case/8/execute</code>, tìm stdout <code>PASS: employeeId là identity</code>. Service tạo hai nhân viên khác ID nhưng cùng tên/ngày sinh, cùng một ID thứ ba, rồi kiểm khác ID không bằng nhau, cùng ID bằng nhau và có cùng hashCode. HashSet phải còn đúng 2 phần tử và tìm được đối tượng mới mang ID <code>E-2</code>.</p>
      <p>Để xem chi tiết, đặt breakpoint tại đoạn kiểm HashSet. Phương thức không trả danh sách nhân viên qua HTTP và không đọc hay ghi hồ sơ nhân sự thực.</p>
      <h3>4. Kết luận</h3>
      <p>Dựa vào khóa định danh tạo equality nhất quán với bộ sưu tập hash trong ví dụ. Kết quả chưa đảm bảo employeeId là duy nhất trong database hoặc an toàn nếu định danh bị thay đổi ngoài hợp đồng object.</p>
    usage: true
  executeCase9(String):
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Đưa ra hai workload có cơ chế khác nhau để người học phân biệt CPU work với cấp phát object trên JVM. Nhánh <code>cpu</code> cộng dồn phép tính trong vòng lặp; nhánh <code>allocation</code> tạo mảng byte và gán vào field volatile để allocation có thể được quan sát. Việc chọn workload là bước chuẩn bị cho phân tích hiệu năng có bằng chứng.</p>
      <h3>2. Các chương trình ngoài luồng (nếu có)</h3>
      <p>Terminal hoặc cửa sổ log của IDE giúp xem stdout thực sự của ứng dụng. Java Mission Control chỉ dùng để mở recording JFR khi JVM đã được bật JFR và recording có event/sampling phù hợp; có thể cần bật CPU sampling hoặc allocation events. Không có cấu hình JFR nào được khởi tạo bởi method này.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
