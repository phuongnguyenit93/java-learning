  resources(ResourceRequest):
    execution: <h3>??ng t?i nguy?n</h3><ol><li>Service m? <code>TrackedResource</code> outer r?i inner trong <code>try-with-resources</code>, ghi <code>open:outer</code>,
      <code>open:inner</code>, <code>body:start</code>. T?y <code>bodyFails</code>, body n?m l?i ho?c ghi <code>body:success</code>.</li><li>Khi r?i scope, Java g?i
      <code>close()</code> inner r?i outer, m?i l?n ??t closed=true v? ghi trace tr??c khi c? th? n?m <code>close failed</code>. N?u body ?? l?i, c?c l?i close ???c
      suppressed; n?u body th?nh c?ng, l?i close ??u ti?n l? primary.</li><li>Service b?t <code>IllegalStateException</code> v? tr? HTTP 200 v?i <code>ResourceResult</code>
      g?m trace, primaryFailure, suppressedFailures, closed v? completedWithoutFailure. Null request g?y HTTP 400.</li></ol>
