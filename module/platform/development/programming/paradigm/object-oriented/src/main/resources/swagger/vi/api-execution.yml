  publication(PublicationRequest):
    execution: <h3>C?ng b? ??i t??ng</h3><ol><li>Controller g?i service v? <code>PublicationScenario.compare</code>, n?i ki?m tra label theo <code>[A-Za-z0-9_-]{1,40}</code>;
      input sai tr? HTTP 400.</li><li><code>UnsafeListener</code> g?i <code>registry.register(this)</code> tr??c ph?p g?n field; registry k?ch ho?t <code>onEvent()</code>
      ngay, v? v?y l?n ??u ??c null. Callback th? hai sau constructor th?y label.</li><li><code>SafeListener.createAndRegister</code> ho?n t?t g?n label tr??c khi
      ??ng k?, c? hai callback ??u th?y label. HTTP 200 tr? <code>PublicationResult</code> v? m?i registry c? m?t subscription.</li></ol>
