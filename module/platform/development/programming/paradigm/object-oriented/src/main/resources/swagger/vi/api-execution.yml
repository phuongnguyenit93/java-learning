      r?i <code>build</code>.</li><li>Constructor trung t?m ki?m tra m?, capacity, s? l??ng h?c vi?n v? ID duy nh?t; gi? <code>List.copyOf</code> v? t?nh <code>availableSeats()</code>.
      Th?nh c?ng tr? <code>CreationResult</code> HTTP 200; vi ph?m b?t bi?n tr? HTTP 400 <code>INVALID_INPUT</code>, JSON sai ki?u tr? <code>INVALID_JSON</code>.</li></ol>
    usage: true
  references(ReferenceRequest):
    execution: <h3>Duy?t ?? th? logic</h3><ol><li>Service y?u c?u steps kh?ng null, t?i ?a 30; t?o <code>ReferenceGraph</code> t? 1?15 node v? t?i ?a 15 root. Graph
      ki?m tra ID, c?nh li?n k?t v? root, r?i ghi snapshot ban ??u.</li><li>V?i m?i <code>RootStep</code>, <code>RETAIN</code> th?m root ch?a gi? ho?c <code>RELEASE</code>
      b? root ?? gi?. <code>snapshot</code> duy?t b?ng stack v? visited set n?n x? l? ???c chu tr?nh.</li><li>HTTP 200 tr? <code>ReferenceResult</code> ch?a snapshot
      theo th? t? node ??u v?o v? l?i nh?c ??y kh?ng ph?i ?o GC. Node ho?c thao t?c root sai th?nh <code>IllegalArgumentException</code> v? HTTP 400 <code>INVALID_INPUT</code>.</li></ol>
