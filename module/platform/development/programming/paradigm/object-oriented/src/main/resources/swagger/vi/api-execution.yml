    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Đối chiếu đường đi qua <code>LegacyForwarder</code> + <code>FormatPort</code> với cách gọi trực tiếp một <code>Formatter</code> concrete. Hai đường cùng trim chuỗi và đặt trong dấu ngoặc vuông, làm rõ khi nào một tầng forwarding/interface chỉ tăng phức tạp mà chưa tạo ra nhu cầu thay thế thực tế.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/4/case/7/execute</code> và quan sát stdout: <code>PASS: no speculative forwarding contract needed</code>. Service so sánh hai cách format cho <code>hello</code> và chuỗi có khoảng trắng <code>  world </code>; sau đó xác minh <code>Formatter</code> từ chối chuỗi chỉ gồm khoảng trắng bằng <code>IllegalArgumentException</code>. Kết quả format nằm trong assertion, không được in hoặc trả qua HTTP.</p>
      <h3>4. Kết luận</h3>
      <p>Ở hai đầu vào kiểm thử, class concrete vẫn đáp ứng quy tắc giống chuỗi wrapper cũ, cho thấy có thể đơn giản hóa ở vị trí không có boundary thực sự. Đây không phải bằng chứng mọi interface đều thừa hay mọi client cũ đều tương thích sau refactor; cần xét nhu cầu extension và hợp đồng của các caller khác.</p>
    usage: true
  executeCase8():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Đối chiếu một API nhận <code>Map&lt;String,Object&gt;</code> mơ hồ với record <code>TransferCommand</code> có schema và tiền điều kiện rõ ràng. Ví dụ cho thấy lỗi kiểu giá trị hoặc sai tên key xuất hiện muộn khi cast Map, trong khi record kiểm tra destination và amount ngay lúc khởi tạo.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/4/case/8/execute</code> rồi tìm <code>PASS: typed command has explicit schema</code> ở stdout. Method cố ý truyền amount dạng chuỗi để bắt <code>ClassCastException</code>, truyền key <code>amunt</code> để bắt <code>NullPointerException</code>, sau đó xác nhận <code>TransferCommand("ACC1", 100L)</code> cho amount 100. Destination rỗng phải bị constructor từ chối bằng <code>IllegalArgumentException</code>. Mọi input đều tạo sẵn trong Java; endpoint không nhận request body.</p>
      <h3>4. Kết luận</h3>
      <p>Kiểm tra chứng minh một kiểu command rõ ràng giúp phát hiện lỗi dữ liệu sớm và giảm cast thiếu an toàn. <code>Case8Utils.execute</code> chỉ trả lại amount của record trong bộ nhớ; nó không chuyển tiền, ghi sổ hoặc gọi hệ thống thanh toán.</p>
    usage: true
  executeCase9():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Áp dụng một contract test chung cho hai implementation của <code>Calculator</code> nhằm đồng nhất chính sách null. Cả <code>A9</code> và <code>B9</code> chấp nhận số nguyên hợp lệ, đồng thời phải ném <code>IllegalArgumentException</code> khi input là null, tránh để mỗi subtype xử lý lỗi đầu vào theo một cách.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/4/case/9/execute</code>, tìm dòng <code>PASS: consistent null precondition</code> trong stdout ứng dụng. Trước đó, <code>Case9Utils.contract</code> kiểm tra <code>evaluate(0) == 1</code>, <code>evaluate(2) == 3</code> và nhánh null được bắt đúng ngoại lệ cho cả hai adapter. Controller không nhận input nên không thể thử giá trị tùy ý qua query parameter của endpoint này.</p>
      <h3>4. Kết luận</h3>
      <p>Hai subtype giữ cùng quy tắc với tập đầu vào được kiểm tra, giúp client có kỳ vọng thống nhất về nullability. <code>B9</code> sử dụng <code>Math.addExact</code> còn <code>A9</code> cộng thông thường: trường hợp tràn số nguyên chưa được kiểm tra và có thể tạo khác biệt ở những đầu vào khác.</p>
    usage: true
  executeCase10():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Đo tính nhất quán của hợp đồng trả snapshot từ <code>ItemReader</code> khi nguồn chứa <code>MutableItem</code>. <code>A10</code> tạo <code>ItemView</code> bất biến trong mỗi lần đọc, còn <code>B10</code> chụp dữ liệu khi khởi tạo; cả hai trả về danh sách không cho sửa trực tiếp.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Gọi <code>GET /case-studies/group/4/case/10/execute</code> và tìm <code>PASS: both implementations honor snapshot contract</code> tại stdout. Với mỗi implementation, contract lấy danh sách có count ban đầu bằng 2, cố gọi <code>clear()</code> và xác nhận <code>UnsupportedOperationException</code>, rồi đổi <code>source.count</code> thành 9 nhưng snapshot cũ vẫn có count 2. Controller không xuất danh sách ở response, vì vậy cần đọc code để hiểu chính xác các assertion.</p>
      <h3>4. Kết luận</h3>
      <p>Hai cách sao chép đều bảo vệ snapshot đã trả khỏi sửa list và thay đổi trên phần tử nguồn trong bài thử. Chúng khác thời điểm chụp dữ liệu; ví dụ chưa chứng minh kết quả của lần đọc mới sau mutation hoặc bảo đảm deep copy cho mô hình lồng nhau.</p>
    usage: true
  executeCase11():
    execution: |
      <h3>1. Mục đích của method này với chủ đề</h3>
      <p>Kiểm tra Template Method trong <code>Workflow</code>: phương thức <code>execute</code> được khai báo <code>final</code>, buộc validate đầu vào trước khi gọi hook <code>persist</code>, sau đó mới đánh dấu hoàn tất. Hai subclass thay đổi bước ghi theo vai trò DB/file nhưng không thay trình tự bắt buộc.</p>
      <h3>3. Hướng dẫn quan sát kết quả</h3>
      <p>Thực thi <code>GET /case-studies/group/4/case/11/execute</code> rồi tìm <code>PASS: invariant sequence cannot be overridden</code> trong stdout. Các assertion nội bộ xác minh nhánh DB có danh sách <code>validate, db:ok, done</code>; input rỗng cho nhánh file ném <code>IllegalArgumentException</code> và không thêm bước nào; input <code>x</code> tạo <code>validate, file:x, done</code>. Danh sách các bước chỉ tồn tại trong bộ nhớ, không được in riêng.</p>
      <h3>4. Kết luận</h3>
      <p>Điểm bất biến validate → persist → done được giữ trong hai subclass thử nghiệm; mã dùng <code>final</code> để chặn override toàn bộ thuật toán. <code>DbWorkflow</code> và <code>FileWorkflow</code> chỉ thêm chuỗi vào danh sách, không ghi database hoặc tệp vật lý; chưa có chứng cứ về rollback nếu hook persist gặp lỗi.</p>
    usage: true
