# <roadmap-schema>
# Module Roadmap Structure
# schema-version: 1
#
# YAML CONTRACT
# roadmap: High-level learning milestones for the current language roadmap.
#
# - id [string, required]: Stable and unique milestone identity within the current language roadmap.
# - title [string, required]: Milestone title displayed to the learner.
# - purpose [string, required]: What the learner should understand or achieve from this milestone.
# - dependsOn [list, optional]: Prerequisite milestone ids when item order alone is not enough to express the dependency.
# - objectives [list, optional]: Milestone-level learning objectives; do not use this to list every small fact/API/syntax item.
# - relatedKnowledge [list, optional]: Knowledge category ids in the current module that support this milestone. Portal displays this list on the side opposite the milestone and clicking an item navigates to the matching Knowledge category.
# - relatedModules [list, optional]: Related modules displayed as Portal Level 2 cards. Each item requires routeId and may provide localized label/note; this relation is navigation only and does not create child milestones or change learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - What is this topic/module?
#   - Why does it exist?
#   - What problem exists without it?
# FOUNDATION
#   - What prerequisite or mental model must the learner have first?
# CORE MODEL
#   - What major abstractions or building blocks make up this topic?
# MECHANICS
#   - How does it work at the language/runtime/API level appropriate for this module?
# USAGE
#   - How is it used in real code?
# DECISION / TRADE-OFF
#   - When should this mechanism be chosen over another?
#   - When should it not be used?
# FAILURE / PITFALL
#   - What mistakes, compile-time failures, or runtime failures matter?
# INTEGRATION
#   - How does this topic connect to neighboring concepts/modules?
# SYNTHESIS
#   - What end-to-end mental model should the learner retain?
#
# Each language owns its own roadmap. Do not infer or synchronize its structure from another language roadmap.
# Item order in roadmap is the default learning order. Use dependsOn only when a dependency needs to be expressed beyond the linear order.
# The skeleton must not force every module to have the same number of nodes. It is a thinking framework, not a rigid template.
# </roadmap-schema>

roadmap:
  - id: oop-purpose-and-identity
    relatedKnowledge:
      - ObjectOrientedProgramming
      - EncapsulationAbstraction
    title: "Object-Oriented Programming (OOP): Purpose and Object Model"
    purpose: "Recognize the problem of scattered data and rules, and see OOP as a way for identifiable objects to receive requests and work together."
    objectives:
      - "Explain OOP plainly; starting with a procedural order-processing example, show how scattered rules make change harder and how distinct objects could take on the work."
      - "Recognize a concrete object through identity, state, behavior, and role; distinguish 'the same object' from 'the same value', and note that object state need not change."
      - "Distinguish a participating runtime object from a class, which describes how objects are made in class-based languages; neither a class, source file, nor real-world entity is a complete definition of OOP."
  - id: state-behavior-and-invariants
    relatedKnowledge:
      - EncapsulationAbstraction
    title: "Encapsulation, Information Hiding, and Abstraction"
    purpose: "Understand why clients should request meaningful behavior rather than directly modify internal data, and distinguish the object boundary, hidden decisions, and exposed capabilities."
    objectives:
      - "Distinguish encapsulation (bundling and controlled interaction), information hiding (concealing changeable representation and decisions), and abstraction (exposing essential capabilities); none is merely the Java private keyword."
      - "Use an account scenario to explain an invariant as a consistency rule preserved after operations, distinct from immutability, in which data does not change."
      - "Predict the failure caused by direct external balance changes; propose a withdrawal operation that validates input, maintains a valid state, and hides its internal representation."
  - id: responsibilities-and-contracts
    relatedKnowledge:
      - Responsibility
    title: "Assigning Object Responsibilities and Behavioral Contracts"
    purpose: "Decide where a business rule belongs and what each object must guarantee when another object requests its behavior."
    objectives:
      - "Distinguish responsibility (what an object is accountable for) from responsibility assignment (deciding which object should own a behavior); spot a misplaced rule in a payment example."
      - "Describe a behavioral contract through accepted inputs, promised outcomes or errors, and consistency rules; do not confuse it with a method signature or implementation detail."
      - "Apply cohesion (behaviors serving a coherent purpose) as a brief criterion for sensible assignment without turning this milestone into a full SOLID or general design-principles course."
  - id: collaboration-and-composition
    relatedKnowledge:
      - Responsibility
      - RelationshipsPolymorphism
    title: "Object Collaboration: Associations, Dependencies, and Composition"
    purpose: "Understand how objects fulfill a request by invoking one another through contracts and choose suitable relationships instead of putting every task in one object."
    objectives:
      - "Trace requests, results, and failure branches among a cart, pricing policy, payment component, and notifier; each collaborator performs only the responsibility it owns."
      - "Distinguish association (objects are related or know one another), dependency (using another object's capability), and assembling collaborators into larger behavior; a simple uses-a or has-a relationship is not automatically UML composition with strong ownership/lifetime semantics."
      - "Replace one collaborator behind an unchanged contract and explain why depending less on internals reduces change impact; use coupling briefly as an applied criterion, leaving the full principle to its design module."
  - id: polymorphism-and-substitution
    relatedKnowledge:
      - RelationshipsPolymorphism
    title: "Polymorphism and Substitutability: Subtyping vs. Inheritance"
    purpose: "Understand how one request through a shared contract can produce different concrete behaviors without the caller checking object types."
    objectives:
      - "Use two payment methods to show polymorphism: the caller issues one contract-based request while each object handles it in its own way."
      - "Distinguish subtyping as a behavioral promise of valid replacement from inheritance as a mechanism for organization and reuse; an inheritance relationship does not by itself prove substitutability."
      - "Test a variant using valid input, rejection, and failure cases; explain why violating promised conditions or results breaks substitutability, while an agreed failure result does not."
  - id: tradeoffs-and-failure-modes
    relatedKnowledge:
      - Tradeoffs
      - RelationshipsPolymorphism
    title: "When OOP Helps and When Object Models Become Too Complex"
    purpose: "Evaluate OOP's ability to contain change alongside the costs of excessive object layers, hard-to-follow relations, and shared mutable state."
    objectives:
      - "Recognize an object that only holds externally manipulated data, an object with too many responsibilities, needless forwarding layers, fragile inheritance, and uncontrolled shared state."
      - "Use cohesion, coupling, and composition versus inheritance as concise scenario-based criteria; comprehensive SOLID, Law of Demeter, and design patterns belong in separate design topics."
      - "Justify when a simple procedure or data transformation is enough and when objects with meaningful behaviors, rules, and collaboration earn their complexity."
  - id: oop-synthesis-and-boundaries
    relatedKnowledge:
      - Tradeoffs
      - Responsibility
      - ObjectOrientedProgramming
    title: "Putting It Together: From a Requirement to Collaborating Objects"
    purpose: "Apply the full OOP mental model to a small scenario and justify each decision before moving to Java mechanisms or specialized software design."
    objectives:
      - "Start with a simple checkout requirement, sketch objects and contracts, then trace success and failure; explain how encapsulation, responsibility assignment, collaboration, and polymorphism address the original problem together."
      - "Introduce a changed requirement (such as another payment method) and identify what changes and what stays stable; accept a simpler design when OOP adds no value."
      - "Locate further study correctly: Java Core for class/interface/override syntax and mechanics, design-principle for general design rules, domain modeling for DDD, and AOP for cross-cutting concerns."
