# <roadmap-schema>
# Module Roadmap Structure
# schema-version: 1
#
# YAML CONTRACT
# roadmap: High-level learning milestones for the current language roadmap.
#
# - id [string, required]: Stable and unique milestone identity within the current language roadmap.
# - title [string, required]: Milestone title displayed to the learner.
# - purpose [string, required]: What the learner should understand or achieve from this milestone.
# - dependsOn [list, optional]: Prerequisite milestone ids when item order alone is not enough to express the dependency.
# - objectives [list, optional]: Milestone-level learning objectives; do not use this to list every small fact/API/syntax item.
# - relatedKnowledge [list, optional]: Knowledge category ids in the current module that support this milestone. Portal displays this list on the side opposite the milestone and clicking an item navigates to the matching Knowledge category.
# - relatedModules [list, optional]: Related modules displayed as Portal Level 2 cards. Each item requires routeId and may provide localized label/note; this relation is navigation only and does not create child milestones or change learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - What is this topic/module?
#   - Why does it exist?
#   - What problem exists without it?
# FOUNDATION
#   - What prerequisite or mental model must the learner have first?
# CORE MODEL
#   - What major abstractions or building blocks make up this topic?
# MECHANICS
#   - How does it work at the language/runtime/API level appropriate for this module?
# USAGE
#   - How is it used in real code?
# DECISION / TRADE-OFF
#   - When should this mechanism be chosen over another?
#   - When should it not be used?
# FAILURE / PITFALL
#   - What mistakes, compile-time failures, or runtime failures matter?
# INTEGRATION
#   - How does this topic connect to neighboring concepts/modules?
# SYNTHESIS
#   - What end-to-end mental model should the learner retain?
#
# Each language owns its own roadmap. Do not infer or synchronize its structure from another language roadmap.
# Item order in roadmap is the default learning order. Use dependsOn only when a dependency needs to be expressed beyond the linear order.
# The skeleton must not force every module to have the same number of nodes. It is a thinking framework, not a rigid template.
# </roadmap-schema>

roadmap:
  - id: oop-purpose-and-identity
    relatedKnowledge:
      - ObjectOrientedProgramming
      - EncapsulationAbstraction
    title: "Object-Oriented Programming: Motivation and Core Model"
    purpose: "Understand why organizing programs around objects with identity, state, behavior, and responsibility can help manage change."
    objectives:
      - "Recognize an object through identity and behavior with associated state where relevant, not merely a file or a class; object state need not be mutable."
      - "Conceptually contrast bundling state and behavior within objects with procedural organization over separate data."
  - id: state-behavior-and-invariants
    relatedKnowledge:
      - EncapsulationAbstraction
    title: "State, Behavior, and Encapsulation Boundaries"
    purpose: "Understand how objects expose behavior, can manage state transitions where relevant, and protect conditions that must remain true."
    objectives:
      - "Explain the relationship among internal state, exposed behavior, and object invariants (conditions that must hold), distinct from immutable values."
      - "Recognize how unrestricted external mutation can break consistency, at the principle level rather than through Java access modifiers."
  - id: responsibilities-and-contracts
    relatedKnowledge:
      - Responsibility
    title: "Object Responsibilities and Behavioral Contracts"
    purpose: "Learn how to assign behavior to responsible objects and treat exposed behavior as a contract between collaborators."
    objectives:
      - "Distinguish an object's responsibility, behavioral contract, and hidden implementation details."
      - "Recognize scattered responsibilities and overly broad objects, then propose clearer boundaries."
  - id: collaboration-and-composition
    relatedKnowledge:
      - Responsibility
    title: "Object Collaboration and Composition"
    purpose: "Understand how object-oriented systems coordinate responsibilities through interactions and build larger behavior through composition."
    objectives:
      - "Describe collaboration and composition at the object-model level without depending on class syntax."
      - "Trace a use case across collaborators to reason about responsibility cohesion and coupling."
  - id: polymorphism-and-substitution
    relatedKnowledge:
      - RelationshipsPolymorphism
    title: "Polymorphism, Type Relationships, and Substitutability"
    purpose: "Understand how different objects honor one behavioral contract and why substitutability matters beyond code reuse."
    objectives:
      - "Explain polymorphism through a common behavioral contract and valid alternative implementations."
      - "Distinguish subtyping, inheritance, and composition; inheritance can support reuse but does not itself guarantee substitutability."
  - id: tradeoffs-and-failure-modes
    relatedKnowledge:
      - Tradeoffs
      - RelationshipsPolymorphism
    title: "Design Trade-offs and Object-Model Failure Modes"
    purpose: "Weigh encapsulation, abstraction, and behavioral extensibility against poor cohesion, tight coupling, and hard-to-manage state."
    objectives:
      - "Identify needless object layers, fragile inheritance, and unintended shared mutable state."
      - "Choose simpler procedures or data transformations when a problem does not require several collaborating objects with distinct behavioral responsibilities."
  - id: oop-synthesis-and-boundaries
    relatedKnowledge:
      - Tradeoffs
      - Responsibility
    title: "Object-Oriented Design Synthesis and Boundaries"
    purpose: "Build an end-to-end model from requirements to objects, responsibilities, contracts, collaborations, and behavior variation while respecting scope."
    objectives:
      - "Sketch a language-neutral example and justify the object responsible for each behavior."
      - "Separate the OOP paradigm from Java class/interface mechanics, DDD domain modeling, and AOP cross-cutting concerns, each owned by its dedicated module."
