      anchor: "declarative-predicates"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "amount>0 OR account=A because either condition suffices."
        explanation: "OR admits both B:10 and A:-5, violating conjunction."
      - id: B
        answer: "Check amount>0 only because the index enforces account access."
        explanation: "Indexes do not infer omitted authorization predicates."
      - id: C
        answer: "account=A AND amount>0, requiring both conditions."
        explanation: "Checking positivity alone leaks B:10; checking ownership alone includes A:-5."
      - id: D
        answer: "Use account=A and assume all A transactions are positive."
        explanation: "A:-5 disproves the positivity assumption."
    correctAnswerId: C
