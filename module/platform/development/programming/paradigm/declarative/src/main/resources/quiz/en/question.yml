        answer: "Values/predicates → WHAT/HOW → facts/rules/goals → duplicates/order."
        explanation: "Conceptual models and counterexamples precede engine-specific syntax."
      - id: B
        answer: "Benchmark EXPLAIN before understanding filtering predicates."
        explanation: "Plan measurements cannot substitute for selection semantics."
      - id: C
        answer: "Memorize Prolog clause order before understanding facts or goals."
        explanation: "Search mechanics should follow the inference model."
      - id: D
