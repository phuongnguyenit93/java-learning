# <quiz-schema>
# Quiz Question Structure
# schema-version: 3
#
# questions [type: list; required; default: []; unique by: id]
#   Quiz questions for the current module language.
#   each item:
#     id [type: string; required; default: ""]
#       Stable and unique identity of the question.
#     question [type: string; required; default: ""]
#       Question text displayed to the learner.
#     aiGenerated [type: boolean; required; default: true]
#       Marks whether the question was generated by AI. Defaults to true for new content.
#     reviewed [type: boolean; required; default: false]
#       Marks whether the question has been human-reviewed and corrected. Defaults to false.
#     readmeRelated [type: object; required; default: {file: "", anchor: ""}]
#       Optional link to a Knowledge section in README. Both file and anchor may remain blank.
#       file [type: string; required; default: ""]
#         README path relative to readme/{language}/menu, for example 1.Basic/Basic.md.
#       anchor [type: string; required; default: ""]
#         Exact Knowledge section id in the specified README file.
#     apiRelated [type: object; required; default: {controller: "", methodSignature: ""}]
#       Optional link to an active API in Swagger metadata. Both controller and methodSignature may remain blank.
#       controller [type: string; required; default: ""]
#         Exact controller name, for example BasicThreadController.
#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
#     answers [type: list; required; item count: 4; default: []; unique by: id]
#       Exactly four answers. A/B/C/D are stable internal identities, not display positions after frontend shuffling.
#       each item:
#         id [type: enum; required; allowed values: A, B, C, D; default: ""]
#           Stable answer identity.
#         answer [type: string; required; default: ""]
#           Answer text displayed to the learner.
#         explanation [type: string; required; default: ""]
#           Explanation shown when this answer is selected, whether it is correct or incorrect.
#     correctAnswerId [type: enum; required; allowed values: A, B, C, D; default: ""]
#       Internal id of the correct answer. The frontend checks this identity after shuffling.
# </quiz-schema>

questions:
  - id: "declarative-quiz-01"
    question: "Two approaches select positive values from [10,-2,25]. Which one expresses declarative responsibility?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/DeclarativeProgramming.md"
      anchor: "declarative-what"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Specify the exact loop index and append sequence for positive entries."
        explanation: "That explicitly prescribes iteration, even if it yields [10,25]."
      - id: B
        answer: "State amount>0 and leave traversal strategy to the evaluator."
        explanation: "The specification defines accepted values without prescribing the loop."
      - id: C
        answer: "Read 10 into an accumulator, skip -2, then write 25."
        explanation: "This describes execution steps rather than the wanted result property."
      - id: D
        answer: "Print cached [10,25] without evaluating the predicate."
        explanation: "A cached example output does not define behavior for new inputs."
    correctAnswerId: B
  - id: "declarative-quiz-02"
    question: "Three reports independently enforce account A and amount>0. What trade-off should review focus on?"
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/DeclarativeProgramming.md"
      anchor: "declarative-why"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Share a reusable filter contract while checking every access condition."
        explanation: "Less duplicated filtering does not automatically enforce access rights."
      - id: B
        answer: "Replace both checks with amount>0 to reduce code."
        explanation: "It drops the account=A restriction necessary for access scope."
      - id: C
        answer: "Keep three copies because query predicates synchronize themselves."
        explanation: "Copies can diverge when policies change."
      - id: D
        answer: "Let the evaluator guess the authorized account."
        explanation: "An evaluator cannot infer an omitted authorization requirement."
    correctAnswerId: A
  - id: "declarative-quiz-03"
    question: "A for/if/append loop and amount>0 both produce [10,25]. What actually differs?"
