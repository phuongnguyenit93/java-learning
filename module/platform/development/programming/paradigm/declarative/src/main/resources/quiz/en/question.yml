      - id: B
        answer: "They share emphasis on intent but differ in facts, bags and value transformations."
        explanation: "A shared style does not erase each model's specific semantics."
      - id: C
        answer: "Because facts are always events and pipelines always backpressure."
        explanation: "Logical facts are not temporal signals or reactive demand."
      - id: D
        answer: "All three models automatically deduplicate and sort results."
        explanation: "Multiplicity and ordering contracts differ across the models."
