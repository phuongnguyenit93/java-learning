        explanation: "That reverses SQL ALL and DISTINCT semantics."
      - id: B
        answer: "Both return two rows because original IDs differ."
        explanation: "DISTINCT compares the projected amount, not omitted IDs."
      - id: C
        answer: "Both return one row because fifty appears twice."
        explanation: "SQL does not automatically produce a mathematical set."
      - id: D
        answer: "ALL returns [50,50]; DISTINCT returns one projected 50."
        explanation: "SQL bag semantics preserve duplicates unless deduplication is requested."
    correctAnswerId: D
