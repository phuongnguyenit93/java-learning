      anchor: "declarative-before"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "The result appears without evaluating the input rows."
        explanation: "An evaluator still checks predicates or uses an equivalent strategy."
      - id: B
        answer: "A loop is ordered so the membership must differ for identical predicates."
        explanation: "Qualifying membership can match even if ordering contracts differ."
      - id: C
        answer: "Declarative means syntax without variables regardless of semantics."
        explanation: "Classification depends on the described intent, not syntax alone."
      - id: D
        answer: "The declarative form omits traversal mechanics from the authored contract."
        explanation: "Work still occurs, but HOW is delegated beyond the stated WHAT."
    correctAnswerId: D
  - id: "declarative-quiz-04"
