        explanation: "The two parent edges satisfy the rule with a shared witness."
      - id: C
        answer: "grandparent(Chi,An) because the same chain is reversible."
        explanation: "Argument order sets direction and cannot be inverted."
      - id: D
        answer: "grandparent(Binh,An) because An was mentioned first."
        explanation: "Presentation order does not justify that relationship."
