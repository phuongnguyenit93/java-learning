      anchor: "declarative-result-spec"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "Use the original collection order as an implicit tie-breaker."
        explanation: "Traversal does not specify which tied rows are selected."
      - id: B
        answer: "Let the optimizer return any three rows, including smaller values."
        explanation: "An evaluator must preserve the largest-value requirement."
      - id: C
        answer: "Trust the first three rows from an unordered database scan."
        explanation: "Accidental scan order is not ranking semantics."
      - id: D
        answer: "Specify amount ranking, limit three and a tie-breaker."
        explanation: "Without a tie-breaker, multiple result selections may satisfy the statement."
