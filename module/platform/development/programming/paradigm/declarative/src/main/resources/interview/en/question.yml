  - question: "How would you teach declarative query and logic reasoning to someone who knows values, conditions and loops but not SQL optimizers or Prolog?"
    answer: "First trace a small [10,-2,25] loop and its predicate equivalent to establish WHAT versus HOW. Then introduce complete result constraints, including account scope and tie handling; only after that show a scan versus index evaluator. Next derive grandparent(An,Chi) from parent facts and contrast facts with timestamped events. Finish with SQL bags [50,50], DISTINCT [50], ORDER BY and effect boundaries. This progression exposes assumptions before specialist syntax so learners can recognize a wrong contract even when a query executes."
    aiGenerated: true
    reviewed: false
