  - question: "A product owner asks for the three largest receipts. Which hidden choices must be resolved before discussing indexes?"
    answer: "Specify which account or period is in scope, the numeric value used for ranking, whether three means rows or distinct amounts, and how ties at the third position are resolved. ORDER BY amount DESC with a stable secondary key is a possible contract when exactly three identified rows are wanted. A query returning any tied row may still satisfy an under-specified request; an index cannot determine the owner's missing tie policy. Test tied values and restricted accounts before optimizing."
