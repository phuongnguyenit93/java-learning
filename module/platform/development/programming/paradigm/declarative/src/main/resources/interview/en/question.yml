  - question: "A YAML file lists open→write→close, while another declares only owners may see account balances. Which one is declarative and why?"
    answer: "The first file specifies an ordered sequence of side-effecting commands even though it uses YAML; that is predominantly procedural HOW. The second expresses an access property the evaluator or policy engine must enforce; it is declarative WHAT, provided the responsible actor and scope are actually specified. Neither filename nor punctuation determines the paradigm. Review the semantic contract, especially who executes the policy, whether failures deny access, and what happens if a rule omits account ownership."
