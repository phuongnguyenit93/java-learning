  - question: "A declarative query becomes slow at a million rows. What evidence should drive optimization without changing meaning?"
    answer: "Measure representative workload sizes, predicate selectivity, indexes, actual execution plans, memory and I/O rather than assuming a concise declaration has zero execution cost. Consider alternative plans while preserving account restrictions, duplicates, NULL handling and explicitly requested order. Replacing SELECT ALL with DISTINCT may alter the returned data as well as add work, so it is not a generic performance fix. If effects such as notifications appear in the flow, their ordering cannot be changed like independent pure arithmetic."
    aiGenerated: true
    reviewed: false
