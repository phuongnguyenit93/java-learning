  - question: "Two SQL plans return the same duplicated transactions but in reversed order, without ORDER BY. Are they semantically different?"
    answer: "For a default SELECT ALL query, equivalent results preserve qualifying row values and their multiplicity. Without an explicit ORDER BY, their presentation sequence is not guaranteed, so a permutation need not be a violation. DISTINCT changes multiplicity but is not a sorting contract. If an exported report or pagination depends on stable order, add ORDER BY with a deterministic tie-breaker, then compare plans again. Treat observation from one index as accidental unless ordering was declared."
