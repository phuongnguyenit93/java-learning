  - question: "A query changes from a table scan to an index plan. Explain the specification/evaluator/result model and the invariant to verify."
    answer: "The specification identifies which rows count, the evaluator implements a physical strategy, and the result must satisfy the declared semantics. A new index path may change cost and incidental discovery order, but cannot silently drop account=A, change positivity or collapse projected duplicates under default SELECT ALL. Validate membership and multiplicity on the same input; verify order separately only when the specification includes ORDER BY. The plan is an implementation decision, not permission to rewrite the intended answer."
