  - question: "An interviewer equates SQL, Prolog, functional pipelines and Reactive Streams because all look like queries. How do you explain their boundaries?"
    answer: "Start with the shared idea of expressing intent, then separate each model's semantics: SQL projects bag rows and only guarantees order under ORDER BY, logic programming derives relations from facts and rules, and functional programming composes transformations with purity as a separate property. Reactive Streams specifies subscription signals, demand and cancellation over time, not a universal query language. Real SQL optimization, Prolog unification, functional effect design and reactive schedulers belong in distinct specialist modules. Hardware-oriented data layout is another, unrelated performance concern."
