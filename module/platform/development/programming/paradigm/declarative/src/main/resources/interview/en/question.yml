  - question: "Given parent(An,Binh) and parent(Binh,Chi), explain why a grandparent relation can be derived but parent(An,Chi) cannot."
    answer: "A rule grandparent(x,z) holds when some y satisfies parent(x,y) and parent(y,z). Here Binh is the witness, so grandparent(An,Chi) follows. We do not infer parent(An,Chi): the parent relation has not been defined as transitive, and changing its meaning would corrupt the knowledge base. The declarative rule states which evidence justifies the conclusion; a solver still must choose a search/inference strategy to find it. This is relational logic rather than an account of timed user events."
    aiGenerated: true
    reviewed: false
