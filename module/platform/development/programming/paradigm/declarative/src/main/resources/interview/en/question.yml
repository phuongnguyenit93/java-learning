    answer: "Run both strategies against A:50, A:50, B:10 and A:-5, then compare the result bag rather than incidental row position. Both must include the two positive A transactions and exclude B and the negative A row. Neither plan may deduplicate under SELECT ALL just because an index returns matching keys. Performance evidence such as selectivity, I/O and plan cost is separate from result correctness. If order matters, declare ORDER BY and test that constraint as well; a fast plan with changed semantics is invalid."
