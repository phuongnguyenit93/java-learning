  - question: "A declarative-looking workflow contains writeBalance and notifyCustomer. Why can't an evaluator freely reorder or retry those steps?"
    answer: "Both operations have observable effects. If notification occurs before the balance is stored, the customer may see a success message that is inconsistent with the recorded state. Retrying a notification can also duplicate external messages unless idempotency or delivery guarantees are designed. A declarative syntax does not create transaction atomicity, rollback or exactly-once delivery. Define sequencing, failure handling, compensation and what the user is allowed to observe, rather than treating effects as interchangeable pure computations."
