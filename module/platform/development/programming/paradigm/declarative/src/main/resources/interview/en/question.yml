  - question: "Given A:50, A:50, B:10 and A:-5, trace account=A AND amount>0 and explain whether the duplicate 50s survive."
    answer: "Both A:50 rows satisfy account=A and positivity and therefore survive WHERE under default SELECT ALL. B:10 fails the account check despite being positive; A:-5 fails the amount check despite matching the account. The two 50s are still separate projected rows until DISTINCT is explicitly requested. This example protects against two independent errors: weakening AND to OR may leak unauthorized data, and assuming selection deduplicates can undercount transactions. A correct index plan must retain the same bag result."
    aiGenerated: true
    reviewed: false
