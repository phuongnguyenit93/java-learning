    answer: "Capture the actual plan, row counts, predicate selectivity, indexes, statistics and resource measurements under representative load. Compare scan and index alternatives without omitting account authorization or changing SELECT ALL multiplicity. DISTINCT may add a deduplication cost while changing the requested result, so it cannot be applied as a blind optimization. Declarative style removes the author's need to prescribe each step, not the runtime's CPU, memory and I/O. Record correctness and performance evidence separately."
