  - question: "A DSL calls itself a rule language but explicitly lists step1, step2, step3. How would you classify it and avoid a syntax-based mistake?"
    answer: "Read what the DSL asks its evaluator to do. If the author fixes a sequence of operations and effects, it describes procedural steps even if keywords are called rules or the text is formatted as YAML. A truly declarative policy would primarily state acceptable outcomes or constraints and delegate planning. An isolated Boolean expression inside a larger imperative workflow does not make the whole program declarative. Review observable effects and whether reordering is allowed by the actual semantics, not by the DSL name."
