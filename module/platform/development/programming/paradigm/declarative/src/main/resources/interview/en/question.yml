  - question: "Two different transactions have amount=50. Why can SELECT amount return [50,50] while DISTINCT returns [50], and what must a reviewer not infer?"
    answer: "SQL's default SELECT ALL uses bag semantics for projected rows, so two distinct transactions can produce two indistinguishable amount=50 result rows. SELECT DISTINCT deduplicates the projected values and returns one 50. Transaction IDs that were not selected do not prevent that collapse. Neither form promises increasing order unless ORDER BY is specified, and selecting data does not imply an UPDATE or payment. Tests should preserve row multiplicity, selected columns and exact result intent rather than treating SQL results as a mathematical set by default."
    aiGenerated: true
    reviewed: false
    readmeRelated:
