  - question: "For A:50, B:10, A:-5, why is account=A AND amount>0 different from OR, and who owns authorization?"
    answer: "The conjunction retains only A:50 because each output must satisfy both the account and positivity tests. An OR expression leaks B:10 and also includes A:-5, proving that numerically plausible conditions can violate the stated scope. The service author must include the caller's authorized account or enforce it at a deliberate security boundary; neither an SQL optimizer nor an index supplies an omitted access check. A test should use both disallowed accounts and negative amounts."
