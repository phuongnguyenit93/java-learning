questions:
  - question: "A reviewer sees a filter for positive transactions. How would you determine whether its design is declarative, and what does it not guarantee?"
    answer: "Examine which decisions the author makes: a declarative specification defines qualifying transactions, such as amount greater than zero, while an evaluator chooses traversal and other execution mechanics. The implementation still performs work and must respect all declared restrictions. A compact WHERE-like expression does not guarantee stable row order, bounded costs, correct access rights, or automatically nonblocking execution; those properties need explicit contracts and evidence."
