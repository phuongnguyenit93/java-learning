  - question: "The rule grandparent(x,z) requires parent(x,y) and parent(y,z). What can you conclude when the second premise is missing?"
    answer: "From the available facts, that rule has not established grandparent(x,z), because no witness y satisfies both premises. This is not automatically a proof that the relationship is universally false: closed-world and open-world logic systems interpret lack of proof differently. Inventing parent(y,z), reversing its direction, or treating a timeout as a logical negation would alter the inference. For debugging, print the bound variables and the unsatisfied premise, then verify the knowledge base and the system's negation semantics."
