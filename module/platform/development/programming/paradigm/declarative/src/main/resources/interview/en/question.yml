    answer: "The goal asks for substitutions of Who that satisfy the declared grandparent relation, not merely whether a line of code executes. Unifying the rule with the goal makes z=Chi; the facts parent(Binh,Chi) and parent(An,Binh) supply y=Binh and x=An, yielding Who=An. A variable is constrained by the fact/rule graph, not an unrestricted wildcard; a larger knowledge base may admit several answers. Their discovery order may depend on the solver unless an additional order criterion is specified."
