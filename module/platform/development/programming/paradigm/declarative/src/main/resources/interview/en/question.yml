  - question: "Compare a for/if/append loop with a predicate over [10,-2,25]. How can both be correct yet assign different responsibility?"
    answer: "The imperative version creates an output collection, visits each element in an authored order, checks positivity, and appends 10 and 25. A declarative form states the desired positive members and lets a chosen evaluator execute the selection; both can return [10,25]. That delegation is the difference, not whether the runtime iterates internally. If the order [10,25] itself matters, ordering must also be part of the declared contract."
