  - question: "Three services repeat account=A and amount>0 filters. Why can one reusable specification help, and what risk remains?"
    answer: "A shared, reviewable predicate makes the business acceptance criteria explicit and reduces the chance that three loop implementations drift when rules change. The contract must still include both positivity and account authorization; extracting only amount greater than zero creates a shorter yet less secure solution. Tests should include A:50, B:10 and A:-5, plus differing caller identities, because an evaluator cannot infer access policy from a missing predicate."
