  - question: "A request asks for the latest three transactions but says neither createdAt nor postedAt. What failure can a correct evaluator still produce?"
    answer: "An evaluator can implement a time comparison perfectly yet choose the wrong clock for the user's intent. Posting time, creation time and last edit can order the same records differently; tied timestamps also need a secondary rule if reproducibility matters. The defect is an incomplete specification, not necessarily a broken query plan. Ask for the relevant time field, timezone, tie-breaker, visibility scope and result count, and test boundary records before debating execution speed."
