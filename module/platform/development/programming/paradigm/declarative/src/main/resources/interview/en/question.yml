    answer: "Conciseness helps only when the specification exposes the complete acceptance criteria. This predicate describes membership for account A, but does not prove that the current actor is allowed to read A. That authorization belongs in a deliberate boundary or in the query's declared constraints, not in assumptions about optimizer benevolence. When reviewing a declarative specification, ask what must be true for every returned row, who may observe it and which cases the description excludes; test a different account holder."
