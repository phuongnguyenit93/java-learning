  - question: "How do you distinguish parent(An,Binh) from a user click at 10:20, and why does that matter for an inference rule?"
    answer: "The parent expression is a logical fact asserting a relationship in the chosen knowledge model. A user click is a timestamped event indicating that something occurred at a particular moment. A grandparent rule requires related parent facts; a click does not become a parent premise by virtue of having two fields or arriving as a signal. Storing events as facts can be a separate modeling decision, but the application must define the derived relation rather than conflating raw temporal messages with proven logical assertions."
