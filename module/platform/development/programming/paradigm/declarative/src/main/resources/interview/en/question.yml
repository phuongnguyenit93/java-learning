  - question: "An optimizer replaces an account scan with an index lookup. Explain what it may optimize and what it cannot infer."
    answer: "The evaluator is allowed to choose a scan, index, join order or other strategy that preserves all stated query semantics. It can reduce work using available statistics, but cannot decide that account=A was optional, silently reinterpret amount>0 or deduplicate projected values when SELECT ALL was requested. The business owner defines the answer contract and access restrictions; the evaluator fulfills them with real CPU, memory and I/O. Compare both plans against the same counterexample dataset and inspect row multiplicity."
