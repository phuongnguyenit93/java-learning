  - question: "Explain why DISTINCT [50] and ORDER BY ASC changing [25,10] to [10,25] solve separate problems."
    answer: "DISTINCT concerns how many repeated projected rows remain: default ALL could yield [50,50] whereas DISTINCT has one 50. ORDER BY controls output sequence, so ascending order of values 25 and 10 is [10,25]; it does not remove duplicate 50s. A DISTINCT query without ORDER BY may still be returned in any permitted order. For stable pagination when sort values tie, declare a secondary unique key. Observing an ordered index scan once is not a durable ordering contract."
