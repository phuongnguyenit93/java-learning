  - question: "Both a loop and a declarative expression sum positive values in [10,-2,25] to 35. When might you prefer each?"
    answer: "A loop explicitly walks the three values, tests positivity and updates an accumulator to obtain 10+25=35. A declarative expression states the filtering and aggregation requirements, allowing an evaluator to choose its mechanics. Prefer the expression when the result contract is clear and the engine can manage routine traversal; prefer explicit steps when operations, state transitions or effects require precise control or easier debugging. Neither choice eliminates the need to test negative values, duplicates, overflow or ordering assumptions."
