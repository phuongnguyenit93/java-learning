  - question: "Query với một trăm hàng chạy nhanh nhưng một triệu hàng lại chậm. Bạn gỡ lỗi mà không phá đặc tả thế nào?"
    answer: "Thu execution plan thật, số hàng, độ chọn lọc predicate, index, thống kê và mức dùng tài nguyên trên tải đại diện. So scan và index mà không bỏ quyền tài khoản hoặc đổi số bản sao của SELECT ALL. DISTINCT có thể thêm chi phí loại trùng đồng thời đổi kết quả, nên không thể thêm mù quáng để tăng tốc. Khai báo giúp tác giả không phải chỉ từng bước, chứ runtime vẫn dùng CPU, RAM và I/O. Hãy ghi riêng bằng chứng tính đúng và hiệu năng."
