  - question: "Vì sao DISTINCT [50] và ORDER BY ASC biến [25,10] thành [10,25] giải hai vấn đề khác nhau?"
    answer: "DISTINCT kiểm số bản sao của hàng được chiếu: ALL có thể ra [50,50] còn DISTINCT chỉ một 50. ORDER BY kiểm thứ tự hiển thị nên tăng dần của 25 và 10 là [10,25]; nó không xóa các hàng 50 trùng. DISTINCT mà thiếu ORDER BY vẫn không cam kết một thứ tự cụ thể. Phân trang ổn định khi giá trị sắp xếp trùng cần khóa phụ duy nhất. Thấy index scan trả đúng thứ tự một lần không biến nó thành hợp đồng lâu dài."
