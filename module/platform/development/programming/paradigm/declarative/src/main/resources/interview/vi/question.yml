questions:
  - question: "Khi xem bộ lọc giao dịch dương, làm sao xác định thiết kế có tính khai báo và những điều gì không được phép suy ra?"
    answer: "Hãy xem người viết quyết định điều gì: đặc tả khai báo nêu giao dịch hợp lệ, chẳng hạn amount lớn hơn không, còn evaluator chọn cách duyệt và cơ chế thực hiện. Máy vẫn phải làm việc và tuân mọi giới hạn đã nêu. Một điều kiện giống WHERE ngắn không tự bảo đảm thứ tự hàng, chi phí thấp, quyền truy cập đúng hay thực thi nonblocking; các thuộc tính đó cần hợp đồng và bằng chứng riêng."
