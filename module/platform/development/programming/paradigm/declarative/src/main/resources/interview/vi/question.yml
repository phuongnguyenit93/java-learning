  - question: "Quy tắc grandparent(x,z) đòi parent(x,y) và parent(y,z). Thiếu tiền đề thứ hai thì có thể kết luận điều gì?"
    answer: "Với dữ kiện hiện có, quy tắc chưa chứng minh được grandparent(x,z), vì chưa có y thỏa cả hai tiền đề. Điều đó không tự động chứng minh quan hệ hoàn toàn sai: logic thế giới đóng và mở có cách hiểu việc thiếu chứng cứ khác nhau. Tự bịa parent(y,z), đảo chiều quan hệ hoặc coi timeout là phủ định đều làm lệch suy luận. Khi gỡ lỗi, nên xem biến y đã gán gì và tiền đề nào thiếu, rồi kiểm knowledge base cùng ngữ nghĩa phủ định cụ thể."
