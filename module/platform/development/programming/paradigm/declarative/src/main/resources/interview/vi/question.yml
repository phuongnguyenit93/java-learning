  - question: "Query ngắn có account=A AND amount>0 nhưng không kiểm quyền của người gọi. Bài học thực về tính rõ của khai báo là gì?"
    answer: "Lời viết gọn chỉ hữu ích khi đặc tả đã có đủ điều kiện chấp nhận. Predicate này chọn hàng của tài khoản A nhưng chưa chứng minh actor hiện tại được phép đọc A. Phân quyền phải nằm ở ranh giới rõ hoặc trong ràng buộc đã nêu, không thể trông chờ optimizer tự tốt bụng. Khi review đặc tả, hỏi điều gì phải đúng cho mọi hàng trả về, ai được xem và những ca nào bị loại; kiểm thêm một chủ tài khoản khác."
