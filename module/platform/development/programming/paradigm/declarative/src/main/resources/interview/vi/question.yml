  - question: "Báo cáo bất ngờ có hai hàng amount=50, thứ tự lúc đổi lúc không, và giao dịch B. Hãy chẩn đoán riêng ba hiện tượng."
    answer: "Hai số 50 có thể đúng theo bag semantics của SELECT ALL; chỉ dùng DISTINCT nếu nghiệp vụ thực sự muốn amount được chiếu duy nhất. Thứ tự hiển thị thay đổi do thiếu ORDER BY; cần khóa sắp xếp và khóa đồng hạng nếu muốn ổn định. Giao dịch B cho thấy predicate tài khoản hoặc phạm vi phân quyền bị thiếu hay sai; DISTINCT và sort không chữa được rò rỉ đó. Test bằng hai A:50, B:10, A:-5 và timestamp trùng trước khi tối ưu plan."
