  - question: "Hai solver chạy cùng luật grandparent theo forward hoặc backward chaining. Khác biệt nào hợp lệ, khác biệt nào không?"
    answer: "Chúng có thể khác thứ tự duyệt, quan hệ trung gian, bộ nhớ, lúc tìm ra đáp án và khả năng dừng khi có đệ quy. Chúng không được tự xem parent là quan hệ bắc cầu, tự tạo fact thiếu hoặc trả kết luận trái luật. Trong tìm kiếm không kết thúc, chưa thấy đáp án không phải luôn là chứng minh goal sai. Hãy kiểm ngữ nghĩa trên ca hữu hạn rồi đo riêng chiến lược tìm kiếm và đệ quy, vì tính đúng và chi phí vận hành cần bằng chứng khác nhau."
