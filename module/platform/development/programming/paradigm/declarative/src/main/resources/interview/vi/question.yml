  - question: "Giải thích goal grandparent(Who,Chi) trên chuỗi An→Binh→Chi và ý nghĩa của biến Who."
    answer: "Goal yêu cầu tìm giá trị thay cho Who sao cho quan hệ grandparent đúng, không đơn thuần hỏi một dòng lệnh có chạy không. Gắn quy tắc với goal cho z=Chi; hai fact parent(Binh,Chi) và parent(An,Binh) cung cấp y=Binh, x=An, nên Who=An. Biến bị ràng buộc bởi mạng fact/rule chứ không phải wildcard vô điều kiện; knowledge base lớn hơn có thể có nhiều đáp án. Thứ tự tìm thấy phụ thuộc solver nếu chưa có ràng buộc sắp xếp."
