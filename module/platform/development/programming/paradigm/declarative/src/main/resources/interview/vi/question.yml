  - question: "Hai giao dịch khác ID cùng amount=50. Vì sao SELECT amount trả [50,50] còn DISTINCT trả [50], và không được suy điều gì?"
    answer: "SQL SELECT ALL mặc định có ngữ nghĩa bag với hàng được chiếu, nên hai giao dịch khác nhau vẫn tạo hai hàng amount=50 giống hệt. SELECT DISTINCT loại trùng trên giá trị đã chọn nên còn một 50. ID giao dịch không nằm trong projection không ngăn việc gộp đó. Cả hai không hứa sắp xếp tăng dần nếu thiếu ORDER BY, và việc chọn dữ liệu không đồng nghĩa UPDATE hay thanh toán. Test cần giữ đúng số bản sao, cột được chọn và ý định kết quả."
