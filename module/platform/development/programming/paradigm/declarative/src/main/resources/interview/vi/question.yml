  - question: "DSL tự gọi là ngôn ngữ rule nhưng chỉ định step1, step2, step3. Phân loại ra sao để không đoán theo cú pháp?"
    answer: "Hãy đọc DSL yêu cầu evaluator làm gì. Nếu người viết cố định chuỗi thao tác và tác động thì đó là hướng thủ tục, kể cả tên keyword là rule hay trình bày bằng YAML. Policy khai báo chủ yếu phải nêu kết quả hoặc ràng buộc mong muốn và giao quyền chọn plan. Một biểu thức Boolean đơn lẻ trong workflow mệnh lệnh không làm toàn bộ chương trình thành khai báo. Cần review tác động quan sát được và khả năng đổi thứ tự theo ngữ nghĩa thực, không theo tên DSL."
