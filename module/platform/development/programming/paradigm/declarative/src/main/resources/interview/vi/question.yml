  - question: "Truy vấn khai báo chậm khi lên một triệu hàng. Cần bằng chứng gì để tối ưu mà không đổi ý nghĩa?"
    answer: "Đo workload thực, độ chọn lọc predicate, index, execution plan, bộ nhớ và I/O thay vì tin mô tả ngắn thì không tốn chi phí. So các chiến lược nhưng vẫn giữ quyền tài khoản, bản sao, NULL và ORDER BY đã yêu cầu. Thay SELECT ALL bằng DISTINCT có thể đổi dữ liệu trả về lại còn thêm xử lý, nên không phải cách tăng tốc chung. Nếu luồng có tác động như gửi thông báo, cũng không thể tùy ý đổi thứ tự như cộng số thuần."
    aiGenerated: true
