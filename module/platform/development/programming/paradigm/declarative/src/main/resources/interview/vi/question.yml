  - question: "Một YAML liệt kê open→write→close, YAML khác nói chỉ chủ sở hữu mới xem được số dư. Cái nào thiên khai báo và vì sao?"
    answer: "File đầu quy định thứ tự lệnh có tác động bên ngoài dù viết bằng YAML, nên chủ yếu là HOW thủ tục. File sau nêu thuộc tính quyền truy cập mà evaluator hoặc policy engine phải bảo đảm, tức WHAT khai báo, miễn là actor và phạm vi đã được nêu đúng. Đuôi file hay ký hiệu không quyết định paradigm. Khi review phải xem hợp đồng ngữ nghĩa, ai thực thi policy, lỗi có chặn truy cập không và điều gì xảy ra nếu quên điều kiện chủ tài khoản."
