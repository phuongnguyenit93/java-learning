  - question: "Scan và index plan cùng chạy account=A AND amount>0 khi có hai hàng A:50. Bằng chứng nào cho thấy cả hai đều đúng?"
    answer: "Chạy cả hai trên A:50, A:50, B:10 và A:-5 rồi so bag kết quả thay vì vị trí hàng tình cờ. Cả hai phải giữ hai giao dịch A dương, bỏ B và hàng A âm. Không plan nào được loại trùng trong SELECT ALL chỉ vì index trả cùng khóa. Bằng chứng hiệu năng như selectivity, I/O và chi phí plan tách khỏi kiểm tính đúng. Nếu cần thứ tự thì nêu ORDER BY và test thêm điều kiện đó; plan nhanh mà đổi ngữ nghĩa vẫn sai."
