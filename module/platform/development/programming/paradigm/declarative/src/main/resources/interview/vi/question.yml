  - question: "Vòng lặp và biểu thức khai báo cùng cộng các số dương trong [10,-2,25] thành 35. Khi nào nên chọn mỗi cách?"
    answer: "Vòng lặp duyệt ba số, kiểm dương rồi cập nhật accumulator để được 10+25=35. Biểu thức khai báo chỉ nêu yêu cầu lọc và tổng hợp, giao evaluator cách thực hiện. Chọn biểu thức khi hợp đồng kết quả rõ và engine xử lý được thao tác duyệt thông thường; chọn bước tường minh khi cần điều khiển chặt trạng thái, tác động hay gỡ lỗi. Cả hai vẫn cần test số âm, bản sao, tràn số hoặc giả định về thứ tự."
