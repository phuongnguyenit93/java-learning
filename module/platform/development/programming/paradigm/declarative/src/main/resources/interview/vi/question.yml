  - question: "Với A:50, B:10, A:-5, vì sao account=A AND amount>0 khác OR, và ai chịu trách nhiệm phân quyền?"
    answer: "Phép AND chỉ giữ A:50 vì từng đầu ra phải thỏa cả tài khoản lẫn số tiền dương. OR làm lọt B:10 và A:-5, cho thấy một biểu thức có vẻ hợp lý về số vẫn có thể sai phạm vi. Người xây dịch vụ phải nêu tài khoản được phép của actor hoặc kiểm tại ranh giới bảo mật rõ ràng; optimizer hay index không tự thêm quyền thiếu. Test nên chứa cả tài khoản không được xem và giá trị âm."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.IntentVsProcedure/IntentVsProcedure.md"
      anchor: "declarative-predicates"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Yêu cầu ba giao dịch gần đây nhưng không nói createdAt hay postedAt. Bộ đánh giá đúng vẫn có thể cho kết quả sai ý nào?"
    answer: "Evaluator có thể so thời gian chính xác nhưng chọn nhầm đồng hồ nghiệp vụ. Thời điểm tạo, hạch toán và cập nhật gần nhất có thể xếp cùng các hàng theo nhiều thứ tự; thời điểm bằng nhau còn cần khóa phụ nếu muốn tái lập ổn định. Đây là lỗi thiếu đặc tả, không nhất thiết do query plan. Cần hỏi trường thời gian, múi giờ, khóa đồng hạng, phạm vi quyền xem và số hàng, rồi test các ca biên trước khi bàn tối ưu."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.IntentVsProcedure/IntentVsProcedure.md"
      anchor: "declarative-spec-completeness"
    apiRelated:
      controller: ""
