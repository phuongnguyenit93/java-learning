  - question: "Workflow trông khai báo nhưng có writeBalance và notifyCustomer. Vì sao evaluator không được tùy ý đảo hoặc retry hai bước?"
    answer: "Cả hai đều có tác động bên ngoài. Nếu thông báo gửi trước khi số dư lưu thành công, người dùng có thể thấy kết quả sai với trạng thái ghi nhận. Retry thông báo còn có thể gửi trùng nếu chưa thiết kế idempotency hay hợp đồng phát tin. Cú pháp khai báo không tự tạo giao dịch nguyên tử, rollback hay exactly-once delivery. Phải nêu thứ tự, nhánh thất bại, phục hồi và điều gì người dùng được phép quan sát, thay vì coi tác động như phép tính thuần hoán đổi được."
