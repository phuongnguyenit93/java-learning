  - question: "Từ parent(An,Binh) và parent(Binh,Chi), vì sao suy được quan hệ ông bà mà không suy ra parent(An,Chi)?"
    answer: "Quy tắc grandparent(x,z) đúng khi có y thỏa parent(x,y) và parent(y,z). Ở đây Binh làm nhân chứng nên suy ra grandparent(An,Chi). Không được tự suy parent(An,Chi) vì quan hệ cha mẹ chưa được định nghĩa bắc cầu; sửa ý nghĩa đó làm sai knowledge base. Quy tắc khai báo nêu chứng cứ để suy kết luận, còn solver vẫn phải chọn chiến lược tìm kiếm. Đây là quan hệ logic chứ không phải dòng sự kiện theo thời gian."
    aiGenerated: true
    reviewed: false
