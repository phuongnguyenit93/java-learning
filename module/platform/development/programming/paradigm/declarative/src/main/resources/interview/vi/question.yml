  - question: "Optimizer thay account scan bằng index lookup. Nó được tối ưu điều gì và không được tự suy diễn điều gì?"
    answer: "Evaluator có thể chọn scan, index, thứ tự join hay chiến lược khác nếu vẫn giữ mọi ngữ nghĩa truy vấn. Nó có thể giảm lượng công việc nhờ thống kê nhưng không được coi account=A là tùy chọn, tự đổi amount>0 hoặc gộp bản sao khi SELECT ALL. Chủ nghiệp vụ xác định hợp đồng kết quả và quyền truy cập; evaluator thực hiện bằng CPU, bộ nhớ và I/O thật. Hãy so hai plan trên cùng bộ dữ liệu phản ví dụ và đếm cả số hàng trùng."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.IntentVsProcedure/IntentVsProcedure.md"
