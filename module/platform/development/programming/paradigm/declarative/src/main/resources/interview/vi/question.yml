  - question: "Ba dịch vụ đều lặp bộ lọc account=A và amount>0. Vì sao nên gom thành đặc tả dùng lại, và rủi ro nào vẫn còn?"
    answer: "Predicate chung giúp thấy rõ điều kiện nghiệp vụ và giảm nguy cơ ba vòng lặp lệch nhau khi chính sách đổi. Hợp đồng vẫn phải giữ cả số tiền dương lẫn quyền truy cập tài khoản; chỉ gom amount lớn hơn không có thể làm mã ngắn hơn nhưng kém an toàn. Nên kiểm với A:50, B:10, A:-5 và nhiều danh tính người gọi, vì evaluator không thể tự đoán điều kiện phân quyền đã bị bỏ."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/DeclarativeProgramming.md"
      anchor: "declarative-why"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "So sánh for/if/append với điều kiện lọc trên [10,-2,25]. Vì sao cả hai cùng đúng nhưng chia trách nhiệm khác nhau?"
    answer: "Lời giải mệnh lệnh tạo danh sách, duyệt từng phần tử theo thứ tự viết sẵn, kiểm số dương rồi thêm 10 và 25. Lời giải khai báo nêu các giá trị dương mong muốn và để evaluator chọn cách lọc; cả hai có thể trả [10,25]. Khác biệt là quyền quyết định cách thực hiện, không phải engine có dùng vòng lặp hay không. Nếu chính thứ tự [10,25] là yêu cầu, đặc tả còn phải nói rõ thứ tự."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/DeclarativeProgramming.md"
      anchor: "declarative-before"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Truy vấn đổi từ table scan sang index plan. Hãy giải thích mô hình specification/evaluator/result và bất biến cần kiểm."
    answer: "Specification nêu hàng nào hợp lệ, evaluator chọn chiến lược truy cập vật lý, còn kết quả phải thỏa ngữ nghĩa công bố. Dùng index có thể đổi chi phí và thứ tự tìm thấy tình cờ nhưng không được tự bỏ account=A, thay điều kiện số dương hay gộp hai bản sao khi SELECT ALL. Cần kiểm membership và multiplicity trên cùng dữ liệu; chỉ kiểm thứ tự khi đã nêu ORDER BY. Đổi plan không có nghĩa được sửa đáp án nghiệp vụ."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/DeclarativeProgramming.md"
      anchor: "declarative-solution"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Vì sao SQL query, suy luận logic và biến đổi hàm đều có thể khai báo nhưng không có cùng ngữ nghĩa?"
    answer: "Cả ba có thể mô tả quan hệ hay biến đổi mong muốn thay vì liệt kê từng lệnh, nhưng hợp đồng khác nhau. SQL SELECT ALL trả bag các hàng được chiếu và có thể có bản sao; quy tắc logic suy ra quan hệ từ fact và tiền đề; pipeline hàm ghép phép biến đổi giá trị và có thể thuần. Reactive Streams còn có quy tắc demand theo thời gian tại giao diện tương thích, không tự có trong mọi biểu thức khai báo. Phải xác định mô hình và evaluator trước khi suy luận thứ tự, hiệu ứng hay đồng thời."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/DeclarativeProgramming.md"
      anchor: "declarative-relations"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Bạn sẽ dạy tư duy truy vấn và logic khai báo cho người biết giá trị, điều kiện, vòng lặp nhưng chưa học optimizer hay Prolog ra sao?"
    answer: "Bắt đầu lần theo vòng lặp [10,-2,25] và điều kiện tương đương để hiểu WHAT khác HOW. Tiếp đó nêu đặc tả đầy đủ, kể cả quyền tài khoản và xử lý đồng hạng, rồi mới minh họa scan so với index. Sau đó suy grandparent(An,Chi) từ parent fact và phân biệt fact với sự kiện có thời điểm. Cuối cùng học SQL bag [50,50], DISTINCT [50], ORDER BY và ranh giới tác động. Trình tự này giúp nhận ra hợp đồng sai trước khi đi sâu cú pháp chuyên ngành."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/DeclarativeProgramming.md"
      anchor: "declarative-learning-path"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Chủ sản phẩm yêu cầu ba giao dịch lớn nhất. Cần làm rõ điều gì trước khi bàn đến index?"
    answer: "Phải nêu tài khoản hoặc khoảng thời gian, giá trị dùng để xếp hạng, ba là số hàng hay số amount duy nhất và cách chọn khi đồng hạng tại vị trí thứ ba. ORDER BY amount DESC kèm khóa phụ ổn định là một hợp đồng phù hợp nếu cần đúng ba hàng có danh tính. Truy vấn chọn ngẫu nhiên một hàng đồng hạng vẫn có thể đúng theo yêu cầu mơ hồ; index không quyết định chính sách thiếu của nghiệp vụ. Hãy test giá trị bằng nhau và phạm vi phân quyền trước khi tối ưu."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.IntentVsProcedure/IntentVsProcedure.md"
      anchor: "declarative-result-spec"
    apiRelated:
      controller: ""
