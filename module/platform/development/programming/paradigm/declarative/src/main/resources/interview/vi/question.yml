  - question: "Phân biệt parent(An,Binh) với cú click lúc 10:20 như thế nào, và khác biệt đó ảnh hưởng quy tắc suy luận ra sao?"
    answer: "Biểu thức parent là fact khẳng định quan hệ trong mô hình tri thức đã chọn. Cú click là event có thời điểm, cho biết điều gì vừa xảy ra. Quy tắc ông bà cần các fact parent liên kết, không phải bất kỳ event nào có hai trường dữ liệu. Ứng dụng có thể quyết định biến event thành fact theo một quy tắc riêng, nhưng phải định nghĩa cách suy quan hệ, không thể đồng nhất thông điệp thời gian với mệnh đề logic đã được chấp nhận."
    aiGenerated: true
    reviewed: false
