  - question: "Slide suy grandparent(An,Chi) bằng ký hiệu giống Prolog nhưng chưa chạy interpreter. Có thể khẳng định chính xác điều gì?"
    answer: "Sơ đồ minh họa mô hình fact/rule/goal và nhân chứng logic nối hai fact parent. Nó chưa xác nhận chương trình Prolog cụ thể parse được, chọn clause theo thứ tự nào, đáp án đầu tiên là gì hay có dừng khi đệ quy. Các hành vi đó phụ thuộc cú pháp, unification và chiến lược tìm kiếm thực, cần test trong interpreter. Nên coi slide là mô hình dạy học và chuyển cơ chế thực thi Prolog sang module chuyên trách thay vì xem hình vẽ là bằng chứng chạy."
