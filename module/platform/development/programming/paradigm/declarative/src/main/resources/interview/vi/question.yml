  - question: "Cho A:50, A:50, B:10, A:-5. Hãy lần điều kiện account=A AND amount>0 và giải thích hai hàng 50 có còn không."
    answer: "Cả hai A:50 đều thỏa tài khoản A và số tiền dương nên vẫn qua WHERE với SELECT ALL mặc định. B:10 sai tài khoản dù dương; A:-5 sai số tiền dù đúng tài khoản. Hai số 50 vẫn là hai hàng được chiếu cho tới khi nêu DISTINCT. Ví dụ chống hai lỗi khác nhau: đổi AND thành OR làm rò dữ liệu ngoài quyền, còn tưởng WHERE tự loại trùng làm đếm thiếu giao dịch. Index plan hợp lệ cũng phải giữ kết quả bag này."
