  - question: "Hai SQL plan trả cùng các giao dịch và bản sao nhưng đảo thứ tự khi không ORDER BY. Ngữ nghĩa có khác không?"
    answer: "Với SELECT ALL mặc định, kết quả tương đương phải giữ các giá trị đạt điều kiện và số bản sao của chúng. Khi không có ORDER BY, thứ tự trình bày không được bảo đảm nên đảo thứ tự chưa chắc là vi phạm. DISTINCT đổi số bản sao chứ không cam kết sắp xếp. Nếu báo cáo hay phân trang cần thứ tự ổn định, phải thêm ORDER BY kèm khóa phụ đủ phân biệt rồi so plan lại. Đừng lấy thứ tự từ một index làm hợp đồng ngầm."
    aiGenerated: true
    reviewed: false
    readmeRelated:
