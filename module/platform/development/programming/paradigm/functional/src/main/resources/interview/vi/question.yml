  - question: "Order A có hai snapshot pending và paid. Vì sao giá trị bất biến không tự biết bản nào hiện hành, và đâu là bài toán danh tính?"
    answer: "Mỗi snapshot mô tả một giá trị tại thời điểm nào đó; không snapshot nào tự sửa hoặc tự quyết định quyền ghi. Ứng dụng giữ danh tính A và một vị trí tham chiếu hay record phiên bản hiện hành do bộ điều phối quản lý. `transition(pending, approved)` có thể tạo paid mà không chứng minh provider đã charge thật. Vì vậy giá trị, trạng thái có thẩm quyền và bằng chứng I/O là ba trách nhiệm cần phân biệt."
