  - question: "Khi tách converter và adapter tỷ giá, hãy mô tả test matrix để không nhầm test toán với test hệ thống."
    answer: "Lõi thuần nhận số tiền và tỷ giá cố định: test zero, tỷ giá hợp lệ, làm tròn, đầu vào không hợp lệ và tính lặp lại. Adapter: test timeout, provider trả JSON sai, tỷ giá đã quá hạn, retry policy và ánh xạ lỗi. End-to-end: xác nhận adapter truyền snapshot đúng sang lõi, không tự sửa tài khoản hoặc lặp charge. Ranh giới test phải trùng với ranh giới side effect chứ không chỉ khác package."
