  - question: "Một developer nói `final order` chứng minh mọi dữ liệu bên trong bất biến. Bạn phản biện bằng ví dụ nào và đề xuất cách kiểm tra?"
    answer: "`final` có thể chỉ cấm gán lại biến, trong khi `order.items` vẫn là list mutable và nhiều tham chiếu cùng sửa được nó. Tôi tạo old chứa [A,B], cho bên khác thêm C rồi kiểm tra old có bị đổi hay không. Muốn giữ snapshot, cần copy phòng vệ hoặc cấu trúc sâu không đổi, đồng thời tránh lộ reference có thể ghi. Chi phí copy cũng phải đo nếu danh sách lớn; bất biến sâu là hợp đồng giá trị, không phải tên modifier."
    aiGenerated: true
