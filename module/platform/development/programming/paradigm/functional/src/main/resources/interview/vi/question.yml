  - question: "Hãy review thiết kế trả 94.5 từ A=100 bằng giảm 10% rồi thuế 5%. Bạn cần thấy bằng chứng nào trước khi kết luận dễ bảo trì?"
    answer: "Tôi muốn tên bước rõ và ảnh chụp 100→90→94,5, với thuế tính trên 90 chứ không âm thầm dùng giá gốc. `discount` và `taxAfterDiscount` có hợp đồng đầu vào/đầu ra riêng và test từng phép tính. Khi thay quy tắc thuế, chỉ một bước cần đổi; khi kết quả sai, có thể chỉ ra giá trị bắt đầu lệch. Nhưng pipeline không nên che ranh giới gọi gateway hoặc lưu trạng thái."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/FunctionalProgramming.md"
      anchor: "functional-solution"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Nhóm đề xuất áp dụng functional style cho toàn bộ checkout. Bạn chọn phần nào và từ chối khẳng định nào?"
    answer: "Tôi chọn phép tính giá, kiểm tra dữ liệu và biến đổi snapshot từ rule cố định làm lõi thuần. Gateway thanh toán, gửi email và cập nhật phiên bản order ở kho dữ liệu phải nằm ngoài lõi với kết quả, lỗi và retry được điều phối. Tôi từ chối khẳng định dùng immutable data là tự có transaction hoặc mọi kết nối mạng trở nên thuần. Kiến trúc tốt cho phép phần thuần đơn giản nhưng vẫn chủ động xử lý effect thất bại."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/FunctionalProgramming.md"
      anchor: "functional-when"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Nếu ứng viên chỉ nhớ tên `pure`, `immutable`, `higher-order`, bạn đặt chuỗi bài tập nào để kiểm tra họ hiểu thật?"
    answer: "Tôi bắt đầu bằng tìm phụ thuộc ẩn trong hàm tính giá, yêu cầu tách tỷ lệ giảm ra tham số. Tiếp theo tạo `next` mà giữ `old`, cho người học kiểm tra list lồng nhau. Rồi ghép `filter→map→reduce` với đầu ra [40,50]→[36,45]→81. Cuối cùng đặt timeout gateway và hai request tranh cập nhật phiên bản; ứng viên phải chỉ ra việc nào không thể giải quyết bằng hàm thuần. Chuỗi này kiểm tra lý do lẫn giới hạn."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "1.Introduction/FunctionalProgramming.md"
      anchor: "functional-learning-journey"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Một `price(100)` luôn trả 90 nhưng cũng ghi log. Tại sao bằng kết quả chưa đủ kết luận thuần, và thay đổi nào hợp lý?"
    answer: "Tính thuần đòi kết quả do input xác định và không có hiệu ứng quan sát được ngoài kết quả. Việc ghi log là I/O dù con số vẫn luôn 90. Tôi tách `price(100,10%) -> 90` khỏi một adapter gọi hàm rồi ghi nhận telemetry. Unit test của lõi chỉ kiểm tra giá; kiểm thử adapter xét log hoặc lỗi ghi log. Không nên khẳng định đổi sang logger async khiến phép tính có log trở nên thuần."
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: "2.PureFunctions/PureFunctions.md"
      anchor: "purity-concept"
    apiRelated:
      controller: ""
      methodSignature: ""
  - question: "Bộ đổi tiền gọi API tỷ giá bên trong và test lúc pass lúc fail. Bạn chuyển phụ thuộc ra ngoài bằng cách nào, và điểm nào vẫn cần integration test?"
    answer: "Tôi bóc hàm `convert(amount, rateSnapshot)` chỉ tính số với quy tắc làm tròn cố định. Adapter lấy tỷ giá, kiểm tra timestamp/đơn vị/định dạng và quyết định cache hay từ chối khi timeout. Test thuần chạy lại nhiều lần với cùng snapshot phải cho cùng kết quả. Nhưng lỗi DNS, mạng chậm và phản hồi tỷ giá sai vẫn phải test tại adapter; chuyển input không làm hệ thống khỏi phụ thuộc provider."
    aiGenerated: true
