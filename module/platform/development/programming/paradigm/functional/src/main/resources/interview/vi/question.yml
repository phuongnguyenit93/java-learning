  - question: "Làm sao chứng minh có thể thay `twice(4)+twice(4)` bằng `8+8`, và trường hợp nào làm phép thay thế không an toàn?"
    answer: "Với `twice(x)=2*x` thuần, mỗi `twice(4)` bằng 8 và không làm thay đổi gì có thể quan sát được, nên thay biểu thức con bằng giá trị giữ nguyên nghĩa chương trình. Nếu hàm tăng counter, ghi log hoặc đọc tỷ giá thay đổi, việc thay lời gọi bằng số 8 sẽ xóa hiệu ứng hay bỏ qua phụ thuộc. Referential transparency nói về khả năng thay thế theo ngữ nghĩa, không phải JVM nhất thiết tối ưu hàm."
    aiGenerated: true
