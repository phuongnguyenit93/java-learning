      methodSignature: ""
  - question: "Một hàm nhận order qua tham số nhưng âm thầm thêm phần tử C vào order.items. Vì sao chữ ký có input tường minh vẫn chưa đảm bảo tính thuần?"
    answer: "Tham số order có thể trỏ cùng list mutable của caller; sửa nested list thay đổi dữ liệu quan sát ngoài giá trị trả về. Tôi yêu cầu tạo danh sách mới hoặc dùng cấu trúc bất biến, và so sánh old=[A,B] với next=[A,B,C] sau lời gọi. Đồng thời kiểm tra global variables và I/O khác trong thân hàm. Truyền object qua tham số là điều kiện làm phụ thuộc rõ hơn, không phải cam kết nó sẽ không bị sửa."
    aiGenerated: true
