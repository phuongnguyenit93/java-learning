  - question: "Cây bất biến lớn được cập nhật một lá. Giải thích structural sharing và điều kiện để việc tái dùng nhánh an toàn."
    answer: "Một persistent tree tạo các node trên đường từ gốc tới lá bị đổi, còn các nhánh khác có thể chia sẻ giữa old và next vì chúng thực sự không cho sửa. Nếu một nhánh chia sẻ chứa mutable child, thay đổi từ một bên có thể làm hỏng cả hai phiên bản. Tôi sẽ so cấp phát và GC với copy toàn bộ cây trên workload đại diện, không hứa mọi immutable collection đều tự áp dụng sharing. An toàn ngữ nghĩa phải đến trước tối ưu."
    aiGenerated: true
    reviewed: false
    readmeRelated:
