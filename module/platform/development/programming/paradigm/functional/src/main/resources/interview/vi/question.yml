      methodSignature: ""
  - question: "Khi nào bạn giữ một vòng lặp cộng dồn cục bộ thay vì chuyển ngay sang nhiều map/filter/reduce, và cần chứng minh điều gì?"
    answer: "Vòng lặp với accumulator thuộc phạm vi hàm, duyệt rõ danh sách và không sửa dữ liệu dùng chung có thể là giải pháp đơn giản, tiết kiệm cấp phát. Tôi sẽ kiểm tra đầu vào [20,40,50], thứ tự và điều kiện lọc, sau đó so kết quả với phép biến đổi khai báo tương đương. Nếu vòng lặp gọi I/O, thay đổi order của caller hoặc phụ thuộc biến global, việc chỉ viết lại bằng map không tự sửa được vấn đề."
