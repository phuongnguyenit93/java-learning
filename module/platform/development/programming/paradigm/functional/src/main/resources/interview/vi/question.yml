questions:
  - question: "Thiết kế một bộ tính giá cho đơn A. Bạn sẽ giải thích tư duy lập trình hàm cho đồng nghiệp vốn quen sửa biến tổng qua từng bước như thế nào?"
    answer: "Tôi bắt đầu từ hợp đồng `price(snapshot, rule) -> amount`: đầu vào nào quyết định giá, đầu ra là gì, và thao tác nào không được thực hiện. Chẳng hạn A giá 100, giảm 10% trả 90 mà không sửa đơn gốc. Vòng lặp cục bộ vẫn có thể đúng; điểm khác là ưu tiên biểu diễn phép biến đổi rõ dữ kiện và kiểm tra độc lập. Lưu đơn hoặc thu tiền là trách nhiệm khác, không gọi chúng là thuần chỉ vì code dùng hàm."
    aiGenerated: true
