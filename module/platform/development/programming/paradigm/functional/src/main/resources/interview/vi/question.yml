      methodSignature: ""
  - question: "Hai request đọc order v3, tạo hai v4 hợp lệ nhưng khác nhau. Vì sao immutable state không ngăn lost update, và bạn chọn ranh giới sửa ở đâu?"
    answer: "Cả hai phép tính trên snapshot v3 đều có thể thuần và đúng cục bộ, nhưng kho dữ liệu chỉ được chọn một bản v4 có thẩm quyền. Nếu ghi đè không kiểm tra, cập nhật sau có thể mất thay đổi trước. Tôi áp version check/CAS hoặc khóa tại bước lưu, nhận biết conflict và quyết định retry có đọc lại state mới hay trả lỗi. Không giải quyết bằng cách thêm `map` hoặc chuyển snapshot v3 thành mutable."
