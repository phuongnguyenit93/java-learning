      methodSignature: ""
  - question: "Hai lần tính giá với tham số hiển thị như nhau cho 90 và 80. Bạn sẽ điều tra nguyên nhân và thiết kế lại để test có thể tái hiện ra sao?"
    answer: "Trước hết kiểm tra biến khuyến mãi dùng chung, đồng hồ, cấu hình và dữ liệu mutable mà hàm âm thầm đọc; cùng tham số hiển thị chưa chắc cùng toàn bộ input thực. Chụp quy tắc giá, thời điểm áp dụng và đơn hàng ở ranh giới, rồi truyền vào phép tính thuần. Test phải chứng minh snapshot 100 với giảm 10% luôn ra 90, còn tỷ lệ khác phải xuất hiện tường minh trong input, không do lịch chạy."
