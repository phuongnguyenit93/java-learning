  - question: "Một junior tin rằng phải thuộc Java Stream trước khi hiểu pipeline giảm giá. Bạn sẽ xây mô hình nền tảng nào không phụ thuộc cú pháp?"
    answer: "Tôi cho bạn ấy xem một danh sách giá trị, một điều kiện `>=30`, hàm giảm giá và phép cộng từ 0. Trên [20,40,50], điều kiện giữ [40,50], phép biến đổi cho [36,45] rồi cộng thành 81. Chỉ cần hiểu hàm, tham số, danh sách, điều kiện và kết quả trung gian. Stream/lambda Java là cơ chế biểu diễn sau, không phải tiền đề của ý tưởng giá trị chạy qua các bước."
    aiGenerated: true
