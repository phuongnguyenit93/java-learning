  - question: "Bạn thiết kế phép thêm món C vào order nhưng phải còn đọc được bản [A,B] khi audit. Phác thảo API và test chứng minh gì?"
    answer: "Tôi dùng `addItem(old, C) -> next` thay vì hàm void chỉnh `old.items`. Trong test, giữ reference old, gọi hàm, sau đó xác nhận old.items=[A,B] và next.items=[A,B,C]; sửa các thành phần nested ở next cũng không được làm old đổi nếu hợp đồng yêu cầu bất biến sâu. Với một bản audit, không lưu reference tới list mutable của người gọi; snapshot phải đứng vững sau khi request kết thúc."
    aiGenerated: true
