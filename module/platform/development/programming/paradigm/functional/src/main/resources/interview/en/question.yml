  - question: "Design adding item C to an order while preserving the [A,B] version for audit. What API and tests would you specify?"
    answer: "I would expose addItem(old,C)→next rather than a void method that mutates old.items. Tests retain old, derive next, then assert old.items=[A,B] and next.items=[A,B,C]. If deep immutability is promised, changing reachable data from next must not affect old. An audit copy must not accidentally retain a writable caller-owned list; the snapshot's meaning has to survive the original request."
