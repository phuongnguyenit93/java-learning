  - question: "Two requests read order v3 and derive different valid v4 values. Why doesn't immutable state prevent lost updates, and where should the fix live?"
    answer: "Both derivations from v3 can be pure and locally correct, yet storage must choose one authoritative successor. Blind last-write-wins can discard another accepted change. I would use compare-and-set, optimistic version checks or a lock at persistence, then decide whether to reload and retry or surface a conflict. More map calls or a mutable snapshot do not coordinate competing writes."
