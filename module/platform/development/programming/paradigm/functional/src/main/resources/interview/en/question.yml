    answer: "I would inspect global discount policy, clock, configuration and shared mutable values for hidden inputs. Identical visible arguments do not imply identical effective inputs. Fetch and snapshot the relevant rule at the boundary, then pass order data and discount explicitly to a deterministic function. A test should reproduce 100→90 for a fixed 10% rule; if the rule changes, that change must be visible as input rather than leak from scheduling."
