    answer: "I want explicit stages and the trace 100→90→94.5, with the tax computed from 90 rather than silently from the original amount. Each stage should have a small input/output contract and focused tests. A changed tax rule then affects its own stage, while an incorrect result can be localized to the first divergent intermediate value. This says nothing yet about payment success or persistence; those effects need separate verification."
