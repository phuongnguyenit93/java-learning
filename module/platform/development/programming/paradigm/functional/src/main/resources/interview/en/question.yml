  - question: "When would you keep a local accumulation loop rather than immediately replace it with map/filter/reduce, and what must you prove?"
    answer: "A locally scoped accumulator can be clearer and cheaper than a chain of collections when the loop has a narrow, testable responsibility. I would prove it traverses [20,40,50] correctly, applies the same filter and produces the same total as a declarative reference. If the loop reads globals, mutates caller-owned inputs or calls I/O, replacing its syntax with map does not by itself eliminate those issues."
