  - question: "A price(100) routine always returns 90 but also writes a log. Why is equal output insufficient for purity, and what redesign would you use?"
    answer: "Purity requires both an output determined by inputs and the absence of externally observable effects. Logging is still I/O when the result remains ninety. I would separate price(100,10%)→90 from an adapter that invokes the calculation and records telemetry. Core tests verify the numeric rule; adapter tests inspect logging and failures. Making the logger asynchronous or changing its format does not make the logging call pure."
