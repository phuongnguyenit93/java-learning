  - question: "A function accepts order as an explicit parameter but silently appends item C to order.items. Why doesn't a visible input signature guarantee purity?"
    answer: "The order argument can alias a mutable list held by the caller, so appending C changes externally visible data outside the return value. I would derive a separate list or use immutable structures, then verify old=[A,B] while next=[A,B,C]. I would also inspect the body for globals and I/O. An explicit parameter makes a dependency visible; it does not guarantee that the referred object will be left unchanged."
