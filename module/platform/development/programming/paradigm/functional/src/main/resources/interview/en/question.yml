  - question: "A junior assumes Java Streams must be mastered before understanding a pricing pipeline. What language-independent foundation would you teach?"
    answer: "I would use values, functions with parameters, a list and a predicate before showing library syntax. On [20,40,50], filtering for >=30 yields [40,50], discounting gives [36,45], and folding from zero returns 81. These are conceptual operations independent of Java Streams or any callback notation. The language feature can then implement the model; memorizing it first does not prove the learner understands the data flow."
