  - question: "The provider declines after your system already stored paid. Explain the ordering mistake and outline a principled recovery approach."
    answer: "The system asserted a successful payment before receiving provider-approved evidence. Model pending, paid and declined states explicitly, correlate results with an operation ID, and handle duplicate callbacks under an idempotency policy. Charging and saving state may not be one atomic transaction, so reconciliation or compensation can be needed. A pure transition can derive state from a verified event; it cannot manufacture the event or guarantee a safe external retry."
