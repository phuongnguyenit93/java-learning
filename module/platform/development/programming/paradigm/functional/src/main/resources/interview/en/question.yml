  - question: "A team proposes functional style for the entire checkout. Which pieces would you select, and which claim would you reject?"
    answer: "I would use pure computations for prices, validation and derived order snapshots from fixed rules. Provider calls, email, and persistent version updates remain at an explicit effectful boundary with error and retry contracts. I would reject the idea that immutable input creates transactions or makes network calls pure. The design can be functional at its core while being very deliberate about failures in the outside world."
