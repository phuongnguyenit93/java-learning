  - question: "Order A has pending and paid immutable snapshots. Why can't the values choose the current version, and where does identity matter?"
    answer: "Each snapshot represents a value at a point in time. Neither can mutate itself or decide which version is authoritative. The application maintains identity A and a current-version reference or record through a coordinator. A pure transition from pending to paid given an approved event does not prove the provider actually charged the customer. Separate value derivation, current-state authority and I/O evidence."
