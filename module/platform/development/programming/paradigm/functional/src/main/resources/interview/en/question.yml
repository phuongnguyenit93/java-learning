  - question: "A colleague says Java Streams, Reactor and data-oriented design are all FP because they have map. Draw accurate boundaries and explain why they matter."
    answer: "The presence of map does not classify an entire programming model. FP centers purity, referential transparency and value composition; Java Streams are an API with language-specific execution semantics; Reactor/Reactive Streams introduce Publisher/Subscriber, demand and temporal flow control; Sharvit's DOP emphasizes generic data, separated operations and independent schemas. Confusing them leads to false claims that using a Stream makes code pure or that reactive processing is automatically parallel."
