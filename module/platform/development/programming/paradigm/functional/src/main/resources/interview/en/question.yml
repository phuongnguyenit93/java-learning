  - question: "A large immutable tree updates one leaf. Explain structural sharing and the condition under which reusing branches is safe."
    answer: "A persistent tree can rebuild only the path from root to changed leaf while reusing other branches, provided those shared branches are genuinely immutable. If a shared branch contains a writable nested object, one update can corrupt both snapshots. I would benchmark allocation and GC against full copying under representative workloads, without claiming every immutable collection automatically shares structure. Semantic safety comes before optimization."
