  - question: "A total calculator returns the correct amount but changes stock from 8 to 7. Explain why this is an effect even without network calls."
    answer: "An effect is externally observable behavior or dependence beyond the returned amount. Mutating shared stock from eight to seven is observable even if it occurs only in memory. Logging or reading a changing clock also breaks independent reproducibility. A calculator test should assert inventory remains eight when the contract promises only a total; reservation belongs to an explicit operation with its own success and failure semantics. Purity is not determined by whether code uses a network."
