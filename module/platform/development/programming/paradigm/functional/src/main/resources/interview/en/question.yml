  - question: "How would you justify replacing twice(4)+twice(4) with 8+8, and when would the substitution be unsafe?"
    answer: "For pure twice(x)=2*x, each invocation with four denotes eight and has no extra visible behavior; replacing the subexpression preserves program meaning. If the function increments a counter, logs, or reads an evolving exchange rate, substitution can remove effects or hidden dependencies. Referential transparency is a semantic property. It is not a promise that the JVM actually optimizes away those calls."
