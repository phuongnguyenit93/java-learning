questions:
  - question: "You are designing order A's price calculator. How would you explain the functional mental model to a colleague used to mutating a running total?"
    answer: "I would start from `price(snapshot, rule) -> amount`: identify every input, the returned value and the operations it must not perform. For order A, 100 discounted by 10% yields 90 without changing the source snapshot. An imperative local loop may also be correct. The functional emphasis is explicit value transformations that can be reasoned about independently; storing an order or charging a card remains a separate effectful responsibility."
