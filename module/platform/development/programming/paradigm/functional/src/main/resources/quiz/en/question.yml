        answer: 'Because the JVM always eliminates both invocations regardless of their side effects'
        explanation: 'Optimization is not the definition of referential transparency.'
      - id: B
        answer: 'Because any method named twice cannot throw an error'
        explanation: 'Names cannot establish independence from effects and hidden state.'
      - id: C
        answer: 'Because both expressions must allocate identical memory'
        explanation: 'Allocation may vary without changing the observable computation.'
      - id: D
        answer: 'Because substitution preserves the program''s observable meaning'
        explanation: 'A pure twice(4) equals eight without side effects, so substitution is safe.'
