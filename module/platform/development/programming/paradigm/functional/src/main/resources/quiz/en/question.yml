    apiRelated:
      controller: ''
      methodSignature: ''
    answers:
      - id: A
        answer: 'When every input value and all its nested objects are required to be deeply immutable'
        explanation: 'Deep immutability is not a universal requirement for a correct local loop.'
      - id: B
        answer: 'When hiding each calculation makes the method shorter'
        explanation: 'Concealing calculations often makes review and debugging harder, not easier.'
      - id: C
        answer: 'When the local accumulator is clear and shared input is unchanged'
        explanation: 'An isolated local accumulator can be simple and predictable.'
      - id: D
        answer: 'When a loop is guaranteed to prevent all side effects'
        explanation: 'Loops can still perform I/O or mutate shared values depending on their body.'
    correctAnswerId: C
