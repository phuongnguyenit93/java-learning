        answer: 'Pure because its arithmetic always returns the same result even while recording a log entry'
        explanation: 'A stable result is necessary but not sufficient to establish purity.'
      - id: B
        answer: 'Impure because the call has an externally visible effect'
        explanation: 'Writing a log is observable beyond the returned value.'
      - id: C
        answer: 'Pure as long as the log is formatted as JSON'
        explanation: 'Changing log format does not remove the logging effect.'
      - id: D
        answer: 'Impure only if its returned amount changes'
        explanation: 'Changing outputs is one purity failure; side effects are another.'
    correctAnswerId: B
  - id: functional-q09
    question: 'A conversion routine fetches a live exchange rate, making tests unreliable. What redesign helps?'
