    apiRelated:
      controller: ''
      methodSignature: ''
    answers:
      - id: A
        answer: 'Because combining stages removes the need for validating each input'
        explanation: 'Even pure stages need correct input contracts and independently testable behavior.'
      - id: B
        answer: 'Because immutable stage inputs guarantee each stage is free of effects'
        explanation: 'A function may log or call a service even when its input value cannot change.'
      - id: C
        answer: 'Because a pipeline itself guarantees safe ordering of outside effects'
        explanation: 'Composition does not coordinate payment, storage, or retries by itself.'
      - id: D
        answer: 'Because stable inputs help explain the result of each separate stage'
        explanation: 'Known dependencies and unchanged snapshots make intermediate results reproducible.'
