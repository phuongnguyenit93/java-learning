      anchor: 'functional-why'
    apiRelated:
      controller: ''
      methodSignature: ''
    answers:
      - id: A
        answer: 'Whether a shared discount policy changed between calls'
        explanation: 'A global discount rate omitted from parameters can explain different results.'
      - id: B
        answer: 'Whether the compiler reordered basic multiplication'
        explanation: 'Compiler scheduling does not by itself explain two results under the same specified rule.'
      - id: C
        answer: 'Whether the orders have identical object identities'
        explanation: 'Object identity alone says nothing about an externally stored discount rate.'
      - id: D
        answer: 'Whether the program startup was at a later time'
        explanation: 'Startup time matters only if the calculation secretly uses it as an input.'
    correctAnswerId: A
