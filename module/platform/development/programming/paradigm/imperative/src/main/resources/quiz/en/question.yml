      anchor: "imperative-what"
    apiRelated:
      controller: ""
      methodSignature: ""
    answers:
      - id: A
        answer: "It allocates an immutable result instead of updating a field."
        explanation: "An immutable value can be used in any paradigm and is not the defining feature here."
      - id: B
        answer: "It is an explicitly ordered action in the program flow."
        explanation: "Printing is an action even if stored state is unchanged; imperative is about specified execution."
      - id: C
        answer: "It describes only a desired result without specifying an action."
        explanation: "The explicit print command says what action to execute, unlike a purely result-level description."
      - id: D
        answer: "It must first modify memory for the report to be produced."
        explanation: "Reading and printing can leave stored variables unchanged."
