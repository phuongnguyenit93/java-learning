        answer: "Deduct first, then report whether the deduction was valid."
        explanation: "Checking after writing can expose an invalid intermediate state."
      - id: B
        answer: "Print the planned balance, then deduct without a check."
        explanation: "Printing a preview is not a guard on the subsequent write."
      - id: C
        answer: "Deduct and restore later whenever the result is negative."
        explanation: "A compensating write still permits the forbidden state to occur."
      - id: D
