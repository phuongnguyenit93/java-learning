  - question: >-
      A procedure returns the right balance but also logs, updates a cache and charges fees. What should a reviewer look for?
    answer: >-
      I classify output, shared-state writes and external I/O separately and document the conditions and permitted frequency of each effect. A function name and return value do not reveal hidden actions. I test retry and failure paths to ensure a fee or message is not repeated unexpectedly. If an effect is unrelated to observing the balance, I separate the responsibility or make the contract explicit so callers understand the risks and side effects.
