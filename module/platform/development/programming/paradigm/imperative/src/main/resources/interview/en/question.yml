  - question: >-
      Compare imperative and declarative ways to sum positive values from [10,-2,25] without pretending declarative systems do no computation.
    answer: >-
      The imperative approach initializes an accumulator, visits each element, checks whether it is positive and adds 10 and 25, producing 35. The declarative description requests the sum of all elements greater than zero, also producing 35, without requiring the author to specify the loop index or assignments. Its evaluator still needs to inspect and combine actual values. The distinction concerns how much execution strategy is exposed, not whether machines perform work.
    aiGenerated: true
    reviewed: false
    readmeRelated:
