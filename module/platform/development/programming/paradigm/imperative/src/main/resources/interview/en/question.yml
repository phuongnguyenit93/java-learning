  - question: >-
      A transfer invokes validate, debit A, credit B and record. Credit B fails after debit A succeeds. What follows, and what recovery options are appropriate?
    answer: >-
      Procedure boundaries make it easier to see that A was debited while the destination credit did not succeed; splitting the work into functions does not roll back the debit. I record each account state and the unsatisfied transfer postcondition, and I do not report success. A real application needs an appropriate database transaction when the updates share a transactional resource, or a deliberate recovery/compensation and idempotency policy across distributed systems. Imperative decomposition by itself guarantees none of these.
    aiGenerated: true
    reviewed: false
