      methodSignature: ''
  - question: >-
      How would you order prerequisites for a new engineer learning to trace a procedure with several rejection branches?
    answer: >-
      I start with values and currently stored state, especially the difference between reading and writing. Then I teach conditions evaluated at the moment execution reaches them, and loops whose tracking state must progress. Only then do I introduce procedure contracts covering inputs, results and side effects. Without the state model, a learner may mistake a Boolean check for an update; without execution traces, they may trust a procedure name as proof of its behavior.
    aiGenerated: true
    reviewed: false
    readmeRelated:
