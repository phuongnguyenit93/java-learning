  - question: >-
      What minimal test matrix would catch a withdrawal procedure that sometimes mutates the balance in its rejection branch?
    answer: >-
      Starting at 100, I first withdraw 30 successfully and require balance 70 with one permitted update. Then I request 90 and require a rejection based on the current 70, preserving that same balance even though an error is emitted. I add negative and zero input and an exact-balance boundary to test the full precondition. Every case checks before/after state and branch execution, not just printed messages or standalone arithmetic.
