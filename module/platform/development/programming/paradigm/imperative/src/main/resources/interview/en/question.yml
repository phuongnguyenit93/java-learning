  - question: >-
      Trace a withdrawal of 30 followed by a rejected withdrawal of 90 from an initial balance of 100. Which observation proves the rejection branch is sound?
    answer: >-
      The trace includes requested amount, current-condition result, balance before, balance after and any output. Withdrawal 30 is authorized at 100, so the stored value becomes 70. The next condition must compare 90 to the current 70, not the original 100; it rejects the request, preserves 70 and emits a reason. The states 100 to 70 to 70 demonstrate that a rejection output is not another balance update.
    aiGenerated: true
    reviewed: false
