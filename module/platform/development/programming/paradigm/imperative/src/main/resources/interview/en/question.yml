  - question: >-
      When should CHECK, DEBIT and REPORT be extracted into withdraw(amount), and when would over-decomposition make the flow harder to understand?
    answer: >-
      I extract a procedure when it has one coherent responsibility: process an authorized withdrawal and return a testable result. Its contract names accepted inputs, permitted writes, success and failure outcomes and observable effects. Splitting every comparison or assignment into tiny meaningless procedures makes the action sequence harder to trace. Naming the group withdraw does not make it pure, concurrent-safe or transactional; we still need to inspect and test its implementation.
    aiGenerated: true
    reviewed: false
    readmeRelated:
