  - question: >-
      Specify a withdrawal procedure contract that callers can use without reading all its internal statements.
    answer: >-
      The contract states the accepted monetary unit and amount greater than zero, with success permitted only if the current balance is sufficient. On success the new balance equals the old balance minus amount, remains nonnegative and is updated exactly as allowed. On invalid input or insufficient funds the procedure returns an explanatory failure and leaves the account unchanged. Logging, fees or external messages must be documented if they occur; the return type alone cannot describe those effects.
    aiGenerated: true
    reviewed: false
    readmeRelated:
