  - question: >-
      The displayBalance procedure silently charges a fee whenever someone checks their balance. How would you repair the contract and design?
    answer: >-
      An observation-oriented operation should not unexpectedly mutate account state. I reproduce the problem with two consecutive reads and a write trace, then separate display from fee charging or make the effects explicit if a fee is genuinely required. Renaming the function or caching the displayed value only hides the symptom. I restrict account write authority and add a no-write postcondition to the read-only path to prevent recurrence.
