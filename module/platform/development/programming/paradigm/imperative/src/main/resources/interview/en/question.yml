  - question: >-
      Walk through [+20,-30,-200] from balance 100 with overdrafts rejected. Why does the rejection path belong in the trace?
    answer: >-
      The loop examines all three requests. The deposit changes 100 to 120; the valid withdrawal changes 120 to 90; the requested withdrawal of 200 exceeds the current 90, so it is rejected without another write. Three checks happened but only two accepted updates changed state. If the trace recorded only successful transactions, a reviewer might not know the last request had been processed and rejected. Branch results and outputs make the history reconstructable.
    aiGenerated: true
    reviewed: false
