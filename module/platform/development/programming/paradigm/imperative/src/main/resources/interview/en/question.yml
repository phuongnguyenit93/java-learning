  - question: >-
      Why does computing a local newBalance of 70 not prove that account.balance was updated from 100?
    answer: >-
      A local variable can hold a candidate value specific to one invocation while the shared account field still stores 100. Completing the operation requires an authorized state write after validation. I distinguish preparing a value, verifying that it meets the contract and committing the state change. Tests should inspect both the computed result and the stored account afterward because a procedure can return a plausible 70 while forgetting to assign it.
