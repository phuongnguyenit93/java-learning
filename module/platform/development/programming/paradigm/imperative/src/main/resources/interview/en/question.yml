  - question: >-
      A loop executes three iterations yet computes the wrong total. Which trace columns reveal an off-by-one defect?
    answer: >-
      Iteration count alone cannot establish that three distinct elements were read. I record iteration number, index before the body, current element, accumulator before and after, and index after progress. For [10,20,5], the expected total after two iterations is 30 with exactly 5 unprocessed. Incrementing too early can skip 10; incrementing too late may duplicate 20. A trace pinpoints which access went wrong rather than relying on the final aggregate.
    aiGenerated: true
    reviewed: false
    readmeRelated:
