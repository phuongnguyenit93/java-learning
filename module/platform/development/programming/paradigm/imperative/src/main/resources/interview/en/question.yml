  - question: >-
      After withdrawing 30 and then requesting 90 from 100, a bug produces -20. Which trace pinpoints the invariant violation?
    answer: >-
      The first row is valid: before 100, amount 30, permitted write, after 70. The second row says before 70, requested 90, condition insufficient funds, yet the subtraction executed and stored -20. That row exposes a missing guard, misplaced statement or missing early return in the rejection branch. I fix the control path and retest accepted and rejected cases. The negative final number proves something is wrong; the trace identifies the specific forbidden write.
