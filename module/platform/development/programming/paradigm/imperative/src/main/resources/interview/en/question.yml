  - question: >-
      An order contains three units priced at 20 with a discount of 5. Why can 55 and 45 both be arithmetically valid but represent different contracts?
    answer: >-
      A discount of five once per order gives (20 × 3) − 5 = 55. A discount of five on each item gives (20 − 5) × 3 = 45. The arithmetic is correct under different commercial rules. Moving the subtraction across multiplication silently changes the meaning, so I first clarify whether the discount applies to the total or to each unit, then encode and test that particular sequence.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.StateAndCommands/StateAndCommands.md'
