  - question: >-
      An expression balance - fee yields 95 when balance is 100 and fee is 5. How do you determine whether it changed anything?
    answer: >-
      Arithmetic evaluation reads the values and produces 95; without assignment the stored balance remains 100. I look for an explicit write or for called functions that might have hidden effects instead of inferring mutation merely from the variable's appearance. Printing the result causes an output effect but does not itself update balance. A before-and-after snapshot around each authorized write is the reliable way to establish the state change.
