      methodSignature: ''
  - question: >-
      A while loop tests remaining > 0 with remaining initially 3 but never modifies it. How do you reason about termination and invariants?
    answer: >-
      Unless there is an explicit exit or contractually specified external change, the condition remains true and the loop can run indefinitely. The initial value 3 is not an implicit iteration limit. I identify a progress measure that decreases or otherwise moves toward making the continuation condition false. But decrementing blindly can violate the nonnegative remaining invariant, so the proof needs both eventual progress and preservation of allowed states.
    aiGenerated: true
    reviewed: false
    readmeRelated:
