  - question: >-
      Explain why balance = balance - 30 is assignment rather than a mathematical identity. Where does its correct execution order matter?
    answer: >-
      The right-hand side reads the prior balance, say 100, and computes 70. The assignment then stores 70 in the named location on the left. That is a state transition, not an assertion that a number equals itself minus 30. One execution does not automatically repeat the deduction. A business withdrawal must guard this statement with positive-amount and sufficient-funds checks, because the assignment mechanism itself does not enforce the invariant.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.StateAndCommands/StateAndCommands.md'
      anchor: 'imperative-assignment'
