  - question: >-
      An Account method loops over requests, calls a pure pricing function and updates the balance. Explain how multiple paradigms appear without contradiction.
    answer: >-
      Account ownership of state and invariants is the object-oriented dimension; the ordered loop, branch and write operations are imperative; an input-to-output pricing calculation with no external effects supplies a reusable functional component. The entire method is not pure merely because one intermediate calculation is pure. I inspect the contract between calculation and state updates, including failure paths. These are complementary responsibilities in one design rather than mutually exclusive categories.
