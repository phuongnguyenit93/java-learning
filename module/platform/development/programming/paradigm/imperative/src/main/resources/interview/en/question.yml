  - question: >-
      A withdrawal guard checks only balance >= amount. Find a counterexample and propose a better guard with boundary tests.
    answer: >-
      With balance 70 and amount -10, the condition is true; subtracting a negative amount would increase the account rather than perform a legitimate withdrawal. The ordinary contract requires amount greater than zero and current balance at least amount before any write. I test negative input, zero, exact available funds and an excessive amount, verifying that every rejected case leaves the balance unchanged. A plausible-looking guard may still omit a critical precondition.
