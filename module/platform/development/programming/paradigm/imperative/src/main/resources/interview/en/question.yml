      controller: ''
      methodSignature: ''
  - question: >-
      A UI displays a calculated balance of 70, yet the account still stores 100. How would you diagnose the discrepancy?
    answer: >-
      I separate evaluating 100 minus 30 from assigning its result. An expression can produce 70 without writing back to balance. Next I trace whether the assignment was ever reached, whether a branch skipped it and whether another write later overwrote it. I record command, previous stored value, candidate result and subsequent stored value at every step. That identifies a missing write or incorrect control path rather than guessing from the displayed number.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Introduction/ImperativeProgramming.md'
      anchor: 'imperative-solution'
    apiRelated:
      controller: ''
      methodSignature: ''
  - question: >-
      A system uses an Account object, an enough-funds rule and an if statement followed by an account update. Why can OOP, declarative and imperative views coexist here?
    answer: >-
      Each perspective answers a different design question. Account may own the balance and responsibility for its invariant; the rule describes what must hold before withdrawal; the conditional and assignment define how the actions execute in sequence. An object method can contain imperative steps, and an independent pure calculation may be called from it. I classify ownership, intended properties and execution strategy separately rather than forcing one label on the entire application.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Introduction/ImperativeProgramming.md'
      anchor: 'imperative-boundary'
