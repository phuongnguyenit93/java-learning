  - question: >-
      Why is computing a correct true/false condition insufficient if the deduction statement sits outside the if block?
    answer: >-
      A Boolean value merely describes a check; control flow must use it to select or skip subsequent commands. If the subtraction executes after the conditional regardless of its result, an insufficient-funds check cannot protect the balance. I put the authorized write entirely inside the successful path and return a reason from the failure path. Tests trace both paths to prove that only the accepted one updates stored state.
    aiGenerated: true
    reviewed: false
