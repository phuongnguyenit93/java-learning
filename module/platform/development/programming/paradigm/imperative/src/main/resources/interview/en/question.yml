  - question: >-
      When does showing every statement and index support correctness, and when can it obscure the real requirement?
    answer: >-
      Explicit action order helps when effects must happen in sequence, such as validate before debit or safely shut down hardware. If the task merely asks for the sum of positive values, specifying a lengthy traversal and index handling can distract from the acceptance rule. I select the style based on whether reviewers chiefly need to verify action ordering or result semantics. A declarative evaluator still runs real instructions, so it does not imply free or nonexistent computation.
    aiGenerated: true
    reviewed: false
