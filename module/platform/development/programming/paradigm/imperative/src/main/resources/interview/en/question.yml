  - question: >-
      A rejected withdrawal prints a warning while balance stays at 70. How would you distinguish state, output and history when reviewing logs?
    answer: >-
      State is the set of values currently stored, including balance 70. The warning is an observable output, while the history of warnings and actions is a separate record of past events. A new message does not imply a new stored balance. I use separate columns for before-state, after-state and emitted output. This matters because treating every log entry as a mutation would falsely suggest that the rejected withdrawal deducted funds.
    aiGenerated: true
    reviewed: false
