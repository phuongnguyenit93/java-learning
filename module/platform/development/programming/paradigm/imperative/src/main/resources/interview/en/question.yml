  - question: >-
      A service fee was charged twice after a retry, although each individual fee calculation was correct. How would you find the cause?
    answer: >-
      I inspect the history of state writes rather than starting with fee arithmetic. Two invocations may both apply a correctly calculated fee without recognizing that one request has already been processed. I trace request identity where available, balance reads, branch selection and the exact write operations. Making the fee a constant would not fix duplicate updates; preventing repeated effects and coordinating durable state require an appropriate idempotency or transaction boundary.
