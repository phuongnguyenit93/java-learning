  - question: >-
      How would you demonstrate that a loop sums the receipts 10, 20 and 5 exactly once each, rather than only checking its final answer?
    answer: >-
      I initialize the accumulator to zero and trace it across the three items: 0, 10, 30 and 35. I also record index and actual item read to catch a duplicated item and skipped item that might coincidentally produce the same total. Correct repetition requires the intended range, one update per processed element and progression to the next element. The last sum is useful evidence but not a complete execution trace.
    aiGenerated: true
    reviewed: false
