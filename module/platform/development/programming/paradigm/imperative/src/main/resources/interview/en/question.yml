  - question: >-
      Two calls to withdraw(30) have identical explicit arguments but encounter balances 100 and 70. Why might the results differ?
    answer: >-
      The procedure also reads the account balance, which is effective input not visible in the amount parameter. A first call at 100 can leave 70 and a later call at 70 can leave 40, or a different concurrent or business condition might cause rejection. I document the shared-state dependency, limit unnecessary writers and test across state histories instead of assuming amount fully determines the result. Equal explicit arguments are not sufficient for referential transparency when hidden state exists.
