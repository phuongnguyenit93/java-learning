#       methodSignature [type: string; required; default: ""]
#         Exact method signature in api-descriptions.yml, for example startVsRun().
# </interview-schema>

questions:
  - question: >-
      A colleague claims a program is imperative only if every statement changes a variable. How would you challenge that claim?
    answer: >-
      Imperative programming is defined by an explicitly controlled sequence of actions, not by the number of assignments. Reading balance, evaluating an expression or printing a warning can be an ordered command even if stored values are unchanged. I would distinguish the current command, any computed value, external output and an actual write to state. A before-and-after trace shows which operations changed state and which only observed it, preventing us from conflating visible output with account mutation.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Introduction/ImperativeProgramming.md'
      anchor: 'imperative-what'
    apiRelated:
      controller: ''
      methodSignature: ''
  - question: >-
      You must protect a nonnegative-balance invariant during withdrawals. Why is subtracting first and compensating later unsafe?
    answer: >-
      The procedure should check that amount is positive and that the current balance covers it before performing the write. Subtracting and then compensating allows an invalid negative state to exist between operations; a logger, callback or other observer might see it. A rejected request should generate a reason without changing the stored balance. The value of explicit imperative ordering is that we can put the guard before the irreversible or externally visible effect instead of treating compensation as equivalent correctness.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Introduction/ImperativeProgramming.md'
      anchor: 'imperative-why'
    apiRelated:
      controller: ''
      methodSignature: ''
  - question: >-
      A calculation and a real withdrawal both turn 100 into 70. What additional evidence proves the withdrawal met its business contract?
    answer: >-
      The final number only verifies arithmetic. I want a trace showing that the requested 30 was positive, sufficient current funds were checked, the accepted branch ran, exactly one authorized write changed 100 to 70, and the outcome was reported afterward. I would also test insufficient funds to establish that failure performs no deduction. A matching number from a pure expression is not evidence that the account preconditions and action ordering were enforced.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Introduction/ImperativeProgramming.md'
      anchor: 'imperative-before'
