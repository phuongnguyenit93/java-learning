  - question: >-
      Bạn nhìn thấy biểu thức balance - fee cho 95 khi balance là 100 và fee là 5. Làm sao biết nó có gây tác động phụ không?
    answer: >-
      Một biểu thức tính toán số học chỉ đọc các giá trị và cho ra số 95; nếu không có phép gán, balance vẫn là 100. Tôi tìm câu lệnh ghi rõ ràng, hoặc hàm được gọi bên trong có tác động phụ, thay vì suy đoán từ việc biến xuất hiện trong biểu thức. Việc in 95 cũng tạo tác động đầu ra riêng nhưng chưa sửa balance. Cách kiểm chứng là so snapshot lưu trước và sau từng lệnh có quyền ghi.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.StateAndCommands/StateAndCommands.md'
