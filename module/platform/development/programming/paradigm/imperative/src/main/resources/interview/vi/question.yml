    apiRelated:
      controller: ''
      methodSignature: ''
  - question: >-
      Bạn thiết kế thủ tục rút tiền từ tài khoản có invariant không âm. Vì sao không nên trừ trước, thấy âm rồi sửa bù sau?
    answer: >-
      Tôi xác định điều kiện đầu vào amount lớn hơn 0 và đủ balance hiện tại, kiểm chúng trước lần ghi, sau đó mới trừ và báo kết quả. Nếu trừ trước rồi bù, trạng thái âm bị cấm đã tồn tại giữa hai bước; log, callback hay thủ tục khác có thể quan sát nó. Vết chạy cần chứng minh nhánh từ chối không chạm vào ô lưu, kể cả khi vẫn tạo thông báo. Lối mệnh lệnh hữu ích chính ở khả năng diễn tả ranh giới kiểm tra trước tác động này.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Introduction/ImperativeProgramming.md'
      anchor: 'imperative-why'
    apiRelated:
      controller: ''
      methodSignature: ''
  - question: >-
      Nếu code và công thức đều đưa số dư từ 100 xuống 70, bạn cần thêm chứng cứ gì để chứng minh một lần rút 30 là đúng nghiệp vụ?
    answer: >-
      Số cuối chỉ chứng minh phép trừ cho kết quả số học. Tôi muốn thấy số tiền rút dương, số dư được đọc lúc xét điều kiện, nhánh được chọn, đúng một lần ghi 100 thành 70 và thông báo chỉ xuất sau quyết định. Thêm ca thiếu tiền để xác nhận cùng đường đi không vô tình trừ. Điều này phân biệt chương trình đúng với một biểu thức trùng đáp số nhưng bỏ kiểm tra tiền điều kiện.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Introduction/ImperativeProgramming.md'
      anchor: 'imperative-before'
    apiRelated:
      controller: ''
      methodSignature: ''
  - question: >-
      Hãy hướng dẫn một người debug khi balance vẫn là 100 dù màn hình đã hiện kết quả thử tính 70. Bạn sẽ tìm điều gì?
    answer: >-
      Trước hết tôi tách biểu thức 100 trừ 30 khỏi lệnh gán: biểu thức có thể tạo giá trị 70 nhưng không tự ghi vào balance. Tôi theo luồng thực thi để tìm nơi biến kết quả được gán vào ô lưu, kiểm điều kiện có cho phép nhánh ấy chạy không và xác minh không có gán sau đó ghi đè. Bảng lệnh, trạng thái trước, giá trị tính và trạng thái sau sẽ chỉ rõ lỗi là thiếu ghi hay sai thứ tự.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Introduction/ImperativeProgramming.md'
      anchor: 'imperative-solution'
    apiRelated:
      controller: ''
      methodSignature: ''
  - question: >-
      Một hệ thống có đối tượng Account, quy tắc chỉ rút khi đủ tiền và một method gồm if rồi ghi. Tại sao không phải chọn duy nhất OOP, declarative hoặc imperative?
    answer: >-
      Ba cách nhìn trả lời ba câu hỏi khác nhau. Account có thể sở hữu trạng thái và trách nhiệm bảo vệ nó; điều kiện chỉ rút khoản dương khi đủ tiền diễn đạt điều phải đúng; các lệnh if, return và gán mô tả các bước để thực hiện quy tắc. Một method của đối tượng hoàn toàn có thể chứa luồng mệnh lệnh, còn việc tách phép tính thuần không loại bỏ các bước cập nhật khác. Tôi phân loại từng vai trò, không dán một nhãn cho mọi chi tiết.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Introduction/ImperativeProgramming.md'
      anchor: 'imperative-boundary'
    apiRelated:
      controller: ''
      methodSignature: ''
  - question: >-
      Khi đào tạo người mới để đọc một thủ tục rút tiền có nhiều nhánh, bạn sắp xếp kiến thức nền theo thứ tự nào, và vì sao?
    answer: >-
      Tôi bắt đầu từ giá trị, biến đang lưu và phân biệt đọc so với ghi. Tiếp theo là điều kiện chọn nhánh tại thời điểm thực thi và vòng lặp có cập nhật biến tiến triển. Sau đó mới đặt thủ tục cùng hợp đồng đầu vào, đầu ra và tác động phụ. Nếu học điều kiện trước khi hiểu trạng thái, học viên có thể tưởng lần kiểm tra đã sửa tài khoản; nếu học thủ tục trước khi hiểu vết, họ có thể tin tên hàm thay cho bằng chứng.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Introduction/ImperativeProgramming.md'
