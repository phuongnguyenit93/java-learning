  - question: >-
      Hãy diễn giải từng cột của trace khi rút 30 rồi rút 90 từ balance ban đầu 100. Chi tiết nào chứng minh nhánh từ chối đúng?
    answer: >-
      Tôi ghi số tiền yêu cầu, điều kiện ở thời điểm kiểm tra, balance trước, balance sau và output. Lần đầu balance 100 đủ để rút 30 nên ghi 70. Lần sau phải so 90 với balance hiện tại 70, không so với số mở đầu 100; điều kiện thất bại, balance 70 được giữ nguyên, chỉ phát lý do từ chối. Dãy 100 thành 70 thành 70 quan trọng hơn một ảnh chụp kết quả cuối.
