  - question: >-
      Vì sao điều kiện đúng/sai chưa đủ bảo đảm an toàn nếu lệnh cập nhật vẫn nằm ngoài if?
    answer: >-
      Điều khiển luồng có trách nhiệm quyết định lệnh nào được thực thi. Một Boolean sai chỉ là dữ liệu tính được; nếu phép trừ vẫn chạy sau if dù điều kiện thất bại, số dư âm vẫn xuất hiện. Tôi muốn nhánh hợp lệ bao kín lần cập nhật và nhánh lỗi chỉ trả lý do, rồi kiểm bằng trace cả hai đường. Đây là khác biệt giữa tính ra một điều kiện và dùng nó để bảo vệ một tác động thực.
