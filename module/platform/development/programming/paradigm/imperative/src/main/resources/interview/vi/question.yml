# <interview-schema>
# Cấu trúc câu hỏi Interview
# schema-version: 2
#
# questions [kiểu: list; bắt buộc; mặc định: []]
#   Danh sách câu hỏi Interview của module trong language hiện tại.
#   mỗi phần tử:
#     question [kiểu: string; bắt buộc; mặc định: ""]
#       Nội dung câu hỏi phỏng vấn hiển thị cho người học.
#     answer [kiểu: string; bắt buộc; mặc định: ""]
#       Câu trả lời tham khảo, chỉ hiển thị khi người học chủ động mở.
#     aiGenerated [kiểu: boolean; bắt buộc; mặc định: true]
#       Đánh dấu nội dung được sinh bởi AI. Mặc định true cho nội dung mới.
#     reviewed [kiểu: boolean; bắt buộc; mặc định: false]
#       Đánh dấu nội dung đã được con người kiểm tra và chỉnh sửa. Mặc định false.
#     readmeRelated [kiểu: object; bắt buộc; mặc định: {file: "", anchor: ""}]
#       Liên kết tùy chọn tới một section Knowledge trong README. Có thể để trống cả file và anchor.
#       file [kiểu: string; bắt buộc; mặc định: ""]
#         Đường dẫn README tương đối bên dưới readme/{language}/menu, ví dụ 1.Basic/Basic.md.
#       anchor [kiểu: string; bắt buộc; mặc định: ""]
#         ID section Knowledge chính xác trong README đã chỉ định.
#     apiRelated [kiểu: object; bắt buộc; mặc định: {controller: "", methodSignature: ""}]
#       Liên kết tùy chọn tới một API đang hoạt động trong Swagger metadata. Có thể để trống cả controller và methodSignature.
#       controller [kiểu: string; bắt buộc; mặc định: ""]
#         Tên controller chính xác, ví dụ BasicThreadController.
#       methodSignature [kiểu: string; bắt buộc; mặc định: ""]
#         Method signature chính xác trong api-descriptions.yml, ví dụ startVsRun().
# </interview-schema>

questions:
  - question: >-
      Trong buổi phỏng vấn, có người khẳng định một chương trình chỉ được gọi là mệnh lệnh nếu từng câu lệnh đều sửa biến. Bạn phản biện bằng mô hình nào?
    answer: >-
      Điểm định nghĩa là chương trình chỉ rõ chuỗi thao tác cần thực hiện và cách điều khiển sang thao tác kế tiếp, không phải số lần gán. Một bước đọc balance, tính biểu thức hoặc in cảnh báo vẫn là một hành động được thực thi theo thứ tự; chúng có thể giữ nguyên trạng thái lưu. Tôi sẽ phân tách lệnh, giá trị vừa tính, đầu ra và lần ghi thực sự, rồi dùng bảng trước/sau để chỉ chỗ nào trạng thái đổi. Cách đó tránh nhầm tác động quan sát được với cập nhật tài khoản.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '1.Introduction/ImperativeProgramming.md'
