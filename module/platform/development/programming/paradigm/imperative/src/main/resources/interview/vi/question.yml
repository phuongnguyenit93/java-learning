  - question: >-
      Trong balance = balance - 30, tại sao đọc vế phải trước khi ghi vế trái lại quan trọng khi giải thích phép gán?
    answer: >-
      Dấu bằng ở đây là phép gán, không phát biểu đẳng thức toán học. Với balance ban đầu 100, vế phải đọc 100 và trừ 30 để được 70, rồi ô lưu balance nhận 70. Một lần thực thi không tự trừ thêm lần nữa. Nếu muốn rút tiền đúng, điều kiện amount dương và đủ số dư phải được kiểm tra trước phép gán đó, vì bản thân phép gán không bảo vệ invariant.
