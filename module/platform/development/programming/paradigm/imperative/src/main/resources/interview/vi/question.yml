  - question: >-
      Bạn review hệ thống bán 3 món giá 20 và giảm 5. Vì sao tính 55 và 45 đều có phép toán đúng nhưng chỉ một đúng nghiệp vụ?
    answer: >-
      Giảm một lần cho cả đơn là 20 nhân 3 trừ 5, cho 55. Giảm 5 trên từng món là 20 trừ 5 rồi nhân 3, cho 45. Cả hai là số học đúng dưới hai hợp đồng khác nhau; không thể tối ưu hay đổi thứ tự một bước trừ qua phép nhân mà bỏ qua ý nghĩa giảm giá. Tôi yêu cầu mô tả giảm giá áp dụng cho đơn hay cho đơn vị hàng trước khi chốt lệnh và ca kiểm thử.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.StateAndCommands/StateAndCommands.md'
