  - question: >-
      Một chương trình in cảnh báo từ chối nhưng balance vẫn là 70. Bạn sẽ giải thích khác nhau giữa state và output với người đang đọc log ra sao?
    answer: >-
      State là các giá trị hiện đang được lưu như balance 70, khác với lịch sử các sự kiện đã in. Một lệnh có thể tạo output từ chối mà không ghi vào tài khoản; vì thế có log mới không đồng nghĩa có state mới. Trong vết tôi ghi tách cột trạng thái trước/sau và cột thông báo. Khi debug, việc ghép output vào state sẽ làm ta suy ra nhầm một bước kiểm tra thành lần trừ tiền.
    aiGenerated: true
    reviewed: false
    readmeRelated:
      file: '2.StateAndCommands/StateAndCommands.md'
      anchor: 'imperative-state-model'
    apiRelated:
      controller: ''
