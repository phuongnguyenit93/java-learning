  - question: >-
      Một đoạn mã dùng điều kiện balance >= amount để rút tiền. Hãy tìm counterexample và thiết kế guard đúng hơn.
    answer: >-
      Nếu balance là 70 còn amount là -10, điều kiện đủ tiền vẫn đúng; phép trừ số âm lại cộng thêm 10 vào số dư. Vì vậy hợp đồng rút thông thường cần amount lớn hơn 0 và balance hiện tại lớn hơn hoặc bằng amount. Tôi kiểm tra cả số âm, bằng 0, bằng số dư và lớn hơn số dư, sau đó yêu cầu nhánh từ chối không ghi. Một điều kiện nhìn có vẻ hợp lý vẫn có thể thiếu tiền điều kiện quan trọng.
