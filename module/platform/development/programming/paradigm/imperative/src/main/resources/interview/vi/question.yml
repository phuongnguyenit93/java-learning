      Một thao tác có tên và mục tiêu quan sát trạng thái không nên bất ngờ làm số dư thay đổi. Tôi chứng minh lỗi bằng hai lần đọc liên tiếp và trace ghi, sau đó tách thao tác đọc khỏi thu phí hoặc công bố hợp đồng effects rõ nếu thu phí là yêu cầu thật. Việc chỉ đổi tên hoặc cache giá trị hiển thị không loại bỏ tác động sai. Nên giới hạn nơi được phép ghi balance và kiểm hậu điều kiện no-write cho thao tác read-only.
