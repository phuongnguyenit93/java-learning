# <roadmap-schema>
# Cấu trúc Roadmap Module
# schema-version: 1
#
# YAML CONTRACT
# roadmap: Danh sách milestone cấp cao của roadmap cho language hiện tại.
#
# - id [string, required]: ID ổn định và duy nhất của milestone trong roadmap language hiện tại.
# - title [string, required]: Tên milestone hiển thị cho learner.
# - purpose [string, required]: Milestone này tồn tại để learner hiểu hoặc đạt được điều gì.
# - dependsOn [list, optional]: Danh sách id milestone prerequisite khi dependency không thể hiện đủ chỉ bằng thứ tự item.
# - objectives [list, optional]: Các learning objective cấp milestone; không dùng để liệt kê mọi fact/API/syntax nhỏ.
# - relatedKnowledge [list, optional]: Danh sách Knowledge category id trong chính module hiện tại hỗ trợ milestone. Portal hiển thị danh sách này ở phía đối diện milestone và click item sẽ điều hướng sang Knowledge category tương ứng.
# - relatedModules [list, optional]: Các module liên quan hiển thị ở Level 2 của Portal. Mỗi item dùng routeId bắt buộc và có thể có label/note localized; relation này chỉ để điều hướng, không tạo child milestone hoặc thay đổi learning order.
#
# ROADMAP THINKING FRAMEWORK
# PURPOSE
#   - Topic/module này là gì?
#   - Vì sao nó tồn tại?
#   - Không có nó thì learner gặp vấn đề gì?
# FOUNDATION
#   - Learner cần prerequisite hoặc mental model nào trước?
# CORE MODEL
#   - Những abstraction hoặc building block lớn nào tạo nên chủ đề này?
# MECHANICS
#   - Nó hoạt động như thế nào ở mức language/runtime/API phù hợp với module?
# USAGE
#   - Nó được dùng như thế nào trong code thực tế?
# DECISION / TRADE-OFF
#   - Khi nào nên chọn cơ chế này thay vì cơ chế khác?
#   - Khi nào không nên dùng?
# FAILURE / PITFALL
#   - Những sai lầm, compile-time failure hoặc runtime failure nào đáng biết?
# INTEGRATION
#   - Chủ đề này kết nối với những concept/module lân cận nào?
# SYNTHESIS
#   - Sau cùng learner phải giữ mental model end-to-end nào?
#
# Mỗi language tự chịu trách nhiệm cho roadmap của chính nó. Không suy luận hoặc đồng bộ cấu trúc từ roadmap của language khác.
# Thứ tự item trong roadmap chính là thứ tự học mặc định. Chỉ dùng dependsOn khi cần biểu diễn dependency rõ hơn thứ tự tuyến tính.
# Skeleton không nên ép mọi module có đúng bấy nhiêu node. Nó là framework suy nghĩ chứ không phải template cứng.
# </roadmap-schema>

roadmap:
  - id: imperative-mental-model
    relatedKnowledge:
      - ImperativeProgramming
    title: "Lập trình mệnh lệnh: khái niệm, mục đích và phạm vi"
    purpose: "Hiểu lập trình mệnh lệnh là cách chỉ rõ chuỗi thao tác có thứ tự, vì sao mô hình này hữu ích khi cần điều khiển quá trình thực thi; không phải thao tác nào cũng làm thay đổi trạng thái."
    objectives:
      - "Diễn giải lệnh, giá trị tính được, tác động có thể quan sát và sự thay đổi trạng thái bằng ví dụ trung tính; không phải bước mệnh lệnh nào cũng sửa dữ liệu."
      - "Phân biệt việc mô tả các bước thực hiện với việc chỉ mô tả kết quả mong muốn."
  - id: state-and-sequencing
    relatedKnowledge:
      - StateAndCommands
    title: "Trạng thái chương trình và thứ tự thao tác"
    purpose: "Nắm mô hình trạng thái trước/sau mỗi lệnh để hiểu tại sao vị trí và thứ tự cập nhật quyết định kết quả."
    objectives:
      - "Theo dõi phép gán, trạng thái có thể thay đổi và ảnh hưởng của các lệnh thực hiện liên tiếp."
      - "Phân biệt giá trị được tính ra với tác động làm thay đổi trạng thái để dự đoán kết quả chương trình."
  - id: branching-and-repetition
    relatedKnowledge:
      - ControlFlow
    title: "Điều khiển luồng qua lựa chọn và lặp"
    purpose: "Giải thích cách điều kiện và việc lặp tạo ra các đường thực thi khác nhau trên cùng một mô hình trạng thái."
    objectives:
      - "Mô tả sự lựa chọn nhánh và lặp ở cấp ý tưởng, bao gồm điều kiện tiếp tục hoặc kết thúc."
      - "Lần theo trạng thái và số lần thực hiện để phát hiện nhánh sai, lặp vô hạn hoặc cập nhật không đúng thứ tự."
  - id: procedural-organization
    relatedKnowledge:
      - ProceduralProgramming
    title: "Tổ chức thao tác thành thủ tục"
    purpose: "Hiểu vì sao nhóm các bước vào thủ tục giúp tái sử dụng và kiểm soát độ phức tạp mà vẫn giữ bản chất mệnh lệnh."
    objectives:
      - "Giải thích đầu vào, đầu ra, trạng thái cục bộ và tác động phụ của một thủ tục khi được gọi."
      - "Nhận biết khi nào việc tách thủ tục giúp rõ trách nhiệm và khi nào phụ thuộc vào trạng thái bên ngoài gây khó theo dõi."
  - id: effects-and-correctness
    relatedKnowledge:
      - StateAndCommands
      - Tradeoffs
    title: "Suy luận tính đúng đắn qua trạng thái và tác động phụ"
    purpose: "Biết kiểm tra lời giải mệnh lệnh bằng cách xác định trạng thái ban đầu, các bước chuyển và điều kiện sau khi hoàn tất."
    objectives:
      - "Theo dõi một luồng thao tác có thay đổi trạng thái để xác định kết quả và điểm phát sinh lỗi."
      - "Nhận ra rủi ro phụ thuộc thứ tự, thay đổi dữ liệu ngoài dự kiến và trạng thái chia sẻ; không đi sâu vào mô hình bộ nhớ hoặc concurrency của Java."
  - id: tradeoffs-and-handoff
    relatedKnowledge:
      - Tradeoffs
      - ProceduralProgramming
    title: "Lựa chọn cách lập trình mệnh lệnh và kết nối các paradigm"
    purpose: "Tổng hợp khi nào điều khiển từng bước giúp chương trình dễ hiểu và khi nào việc mô tả ý định hoặc tổ chức trách nhiệm có lợi hơn."
    objectives:
      - "So sánh một bài toán ở mức khái niệm giữa lời giải mệnh lệnh và cách mô tả kết quả theo hướng khai báo."
      - "Giải thích lập trình thủ tục là một cách tổ chức thuộc mệnh lệnh, còn OOP hay functional có thể kết hợp các đoạn mệnh lệnh; để các module kia dạy sâu phần thuộc sở hữu của họ."
