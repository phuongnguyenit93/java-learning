plugins {
    id 'com.github.node-gradle.node' version '7.1.0'
}

import com.github.gradle.node.npm.task.NpmTask

def portalClean = tasks.named('clean')

rootProject.tasks.named('generatePortalModuleData') {
    mustRunAfter portalClean
}

rootProject.tasks.named('generatePortalKnowledge') {
    mustRunAfter portalClean
}

node {
    download = true
    version = '22.14.0'
    npmVersion = '10.9.2'
    nodeProjectDir = file("${projectDir}/frontend")
}

tasks.register('buildFrontend', NpmTask) {
    dependsOn tasks.named('npmInstall')
    dependsOn ':generatePortalData'
    args = ['run', 'build']

    inputs.file(file('frontend/package.json'))
    inputs.file(file('frontend/tsconfig.json'))
    inputs.file(file('frontend/tsconfig.app.json'))
    inputs.file(file('frontend/vite.config.ts'))
    inputs.dir(file('frontend/src'))
    inputs.dir(layout.buildDirectory.dir('generated/portal-data'))
    outputs.dir(file('frontend/dist'))
}

tasks.named('processResources') {
    dependsOn tasks.named('buildFrontend')

    from(file('frontend/dist')) {
        into 'static'
    }
}

portalClean.configure {
    delete file('frontend/dist')
}
